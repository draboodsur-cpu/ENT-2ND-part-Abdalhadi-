ch of the following concepts regarding outer hair cells is false?","o":["the primary transducer of sound","tuned to a specific frequency","the source of a sound","contain myosin and contract","under central nervous system control"],"k":"A","x":"The outer hair cells are not primarily transducers of sound. They do respond to exposure to sound in a frequencyspecific manner by contracting, thereby pulling the tectorial membrane and the basilar membrane closer together, thus amplifying the displacement of the cilia of the inner hair cells. The inner hair cells depolarize as a result of the cilial displacement and trigger a nerve impulse. The outer hair cells contain myosin. The contractions of the outer hair cells produce otoacoustic emissions. The outer hair cells have an efferent nerve supply that represents the effector arm of a feedback loop from the central nervous system.","d":"Otology","src":"Ballenger · Occupational Hearing Loss · Q2"},{"s":"For which of the following are temporal bone CT scans without contrast used for preoperative assessment in chronic ear surgery?","o":["Sinonasal disease","Epidural abscess","Brain hernia","Inner ear fistula"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 12 · Q2"},{"s":"Disorders of the oesophagus: which of the following statements best describes pathology affecting the oesophagus?","o":["Achalasia is a primary oesophageal dysmotility disorder characterized by impaired relaxation of the upper oesophageal sphincter","The Z line marks the transition between stratified squamous epithelium of the oesophagus and non-secretory pseudostratified mucosa of the stomach","Achalasia is associated with an increase in ganglion cells of the myenteric plexus","Oesophageal dysmotility may present in patients with Raynaud’s phenomenon and sclerodactyly","Gaviscon Advance contains sodium alginate and sodium bicarbonate"],"k":"D","x":"Achalasia is a primary oesophageal dysmotility disorder characterized by impaired relaxation of the lower oesophageal sphincter. Most commonly there is a decrease in ganglion cells of the myenteric (Auerbach’s) plexus. CREST syndrome is characterized by calcinosis, Raynaud’s phenomenon, oesophageal dysmotility, sclerodactyly, and telangiectasia.","d":"Laryngology","src":"SBA book · General Otolaryngology · Q56"},{"s":"Regarding cerebrospinal fluid (CSF) leak, which of the following statements is true?","o":["Beta-2 transferrin is associated with a perilymph leak","Spontaneous CSF leaks occur mainly in middle-aged men","CSF is bright on T1 with contrast-weighted MRI scans","The most common site for an iatrogenic injury to the skull base leading to a CSF leak is within the sphenoid","CSF leaks are always associated with meningitis"],"k":"A","x":"Beta-2 transferrin is found in CSF and is also found in perilymph. It is not found in blood, mucus, or tears. Spontaneous CSF leaks are twice as likely to develop in women than in men and usually occur in those about 40 years of age. CSF is bright on T2-weighted MRI scans. The most common site for iatrogenic injury is the lateral lamella of the cribriform plate. Management may be conservative or surgical. Generally speaking, if a CSF leak is documented during the endoscopic nasal procedure, it should be formally dealt with at that time. Surgical approaches are endoscopic, extracranial (transfacial incision), and an intracranial or craniofacial approach. The problem with such an approach is retraction of the frontal lobes leading to chronic headaches, potentially seizures, and anosmia.","d":"Rhinology","src":"SBA book · Rhinology · Q61"},{"s":"What theoretical plane from the medial canthus of the eye to the angle of the mandible divides the facial skeleton into two parts?","o":["Ohngren’s line","Frankford’s line","Kennedy’s line","Osguthorpe’s line","arcuate line"],"k":"A","x":"Ohngren’s line divides the facial skeleton into two parts as it passes from the medial canthus of the eye to the angle of the mandible. It divides the maxillary sinus into good and poor prognosis zones, with tumors posterior to the line or plane having a poorer prognosis.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q6"},{"s":"Which of the following muscles do not have an attachment to the mastoid process?","o":["Digastric","Splenius capitis","Longissimus capitis","Temporalis","Anterior auricular"],"k":"D","x":"The muscles attached to the mastoid process are the digastric (posterior belly), sternocleidomastoid, splenius capitis, longissimus capitis, and the anterior, superior, and posterior auricular muscles.\nThe temporalis is not attached to the mastoid process.","d":"Otology","src":"SBA book · General Otolaryngology · Q9"},{"s":"Features of benign intracranial hypertension include (1) pulsatile tinnitus (2) visual dimming and blindness (3) papilledema (4) absence of intracranial ventricular enlargement","o":["2 and 3","1 and 4","1, 2, and 3","4 only","all of the above"],"k":"E","x":"Benign intracranial hypertension is characterized by papilledema, a normal neurologic examination, elevated intracranial pressure, and no intracranial mass or ventricular enlargement on radiographic studies. Associated symptoms include decreasing vision and pulsatile tinnitus. Therefore, all of the features are correct.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q8"},{"s":"All of the following likely require a laryngeal stent except","o":["telescoped cricoid cartilage fracture.","comminuted thyroid cartilage fracture.","disruption of the anterior commissure.","mucosal lacerations that require grafting.","all of the above."],"k":"E","x":"All of the above injuries require stenting because they are unstable fractures or full immobilization is needed for optimum soft tissue healing.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q5"},{"s":"Unipolar cautery should not be used in eyelid surgery if","o":["The patient has an auditory brain stem implant","The patient has a cochlear implant","The patient has a prior spring","All of the above","Only a and b"],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 61 · Q2"},{"s":"Which of the following is not a risk factor for the development of benign paroxysmal positional vertigo (BPPV)?","o":["gender","middle age","history of trauma","history of vestibular neuronitis","ear surgery"],"k":"A","x":"Nearly 20% of patients seen at vertigo clinics will be given the diagnosis of BPPV. There is no gender bias. The average age of presentation is in the fifth decade. Ten to 15% of patients will have an antecedent history of vestibular neuronitis, and another 20% will have a history of head trauma. Some patients have had BPPV following ear surgery.","d":"Otology","src":"Ballenger · Ménière’s Disease, Vestibular Neuronitis, Benign Paroxysmal Positional Vertigo, and Cerebellopontine Angle Tumors · Q5"},{"s":"What are the four anatomical structures that form the boundaries of the “quadrangular space”?","o":["Cavernous internal carotid artery (ICA), optic nerve, first branch of trigeminal nerve, and vidian canal","Vertical/paraclival ICA, petrous/horizontal ICA, cranial nerve (CN) VI, and maxillary branch of trigeminal nerve","Vertical/paraclival ICA, petrous/horizontal ICA, CN IV, and cavernous sinus","Cavernous ICA, optic nerve, vidian canal, and gasserian ganglion","Vertical/paraclival ICA, petrous/horizontal ICA, CN VI, and gasserian ganglion"],"k":"B","x":"These four structures are the key anatomic structures that limit the endonasal approach to Meckel’s cave.","d":"Rhinology","src":"Brackmann · Chapter 55 · Q3"},{"s":"In frontal sinus obliteration, delayed formation of a mucocele results from failure to","o":["place an adequately sized fat graft.","remove all of the frontal sinus mucosa.","plug the frontal sinus ostium with bone.","bevel the edges of the bony osteoplastic flap.","prescribe long-term postoperative antibiotics."],"k":"B","x":"To perform an obliteration successfully, it is absolutely critical to remove all of the mucosa from within the sinus. The gross mucosa is relatively easily stripped from the sinus and its recesses. However, rests of mucosa exist within the small foramina of Breschet in the bone of the anterior and posterior tables. Therefore, all of the bony surfaces of the frontal sinus must be meticulously burred down under microscopic visualization before placing the fat graft.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q7"},{"s":"A 22-year-old man complains of nasal obstruction following a sporting injury. Examination reveals a markedly deviated nasal septum for which he undergoes a septoplasty. On the first postoperative day, he is experiencing moderately severe facial pain. The best course of action is to","o":["advise him to take analgesics.","advise him to take a broad-spectrum antibiotic.","advise him to take a course of oral prednisolone.","ask him to take his own temperature and, if it is normal, reassure him.","assess him personally."],"k":"E","x":"The facial pain may not be of great clinical significance, but it is most important that he be examined to exclude a septal hematoma and/or the possibility that he is developing an infection or toxic shock.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q10"},{"s":"What is the most common serious complication of superior canal dehiscence (SCD) plugging surgery in the initial 24 hours after surgery?","o":["Aphasia","Hematoma","Seizure","Meningitis"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 42 · Q1"},{"s":"What clinical situation is the most appropriate for use of the hypoglossal-facial anastomosis?","o":["Extirpation of malignant parotid neoplasm with sacrifice of the pes anserinus and upper and lower divisions of the intraparotid facial nerve","Extirpation of cerebellopontine angle tumor with loss of the facial nerve at the brainstem with no visible proximal stump","Bell’s Palsy with no visible facial function but with active motor unit potentials on voluntary EMG","Extirpation of cerebellopontine angle tumor with laceration of the facial nerve at the porus acousticus, with present proximal and distal nerve ends"],"k":"B","x":"The most appropriate use of hypoglossal-facial nerve anastomosis is when there is no potential for recovery of nerve function from the facial nerve itself, either through tensionless anastomosis or grafting. In the case of the parotid neoplasm, direct facial nerve anastomosis or muscular facial reanimation may be attempted, but hypoglossal-facial nerve anastomosis is impossible due to loss of the main trunk and upper and lower divisions of the facial nerve.","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 62 · Q3"},{"s":"Approximately how many olfactory receptor cells are estimated to be present in the adult human?","o":["6,000","60,000","600,000","6,000,000","60,000,000"],"k":"D","x":"Although it has been estimated that the adult human olfactory neuroepithelium contains ~ 6,000,000 receptor cells, an empiric determination of the size of this region in a sample of males and females across a wide age range has never been made. It is important to note that viruses and other pathogens produce damage to the olfactory region over time that presumably is cumulative. Hence, the olfactory region of adults is very heterogeneous, being interspersed with metaplastic islands of respiratory-like epithelium.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q9"},{"s":"Which of the following is least associated with Down syndrome?","o":["Low-set ears","Subglottic stenosis","Subglottic haemangioma","Otitis media with effusion","Relative IgA deficiency"],"k":"C","x":"Down syndrome is associated with an increased risk of all of the listed options except subglottic haemangioma. The relative IgA deficiency predisposes these children to upper respiratory tract infections.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q24"},{"s":"A 72-year-old smoker presents to the ENT clinic with a 3-month history of dysphagia and weight loss. Flexible nasendoscopy shows pooling of saliva in the pyriform fossae, with restricted mobility of the right hemi- larynx. Malignancy is suspected. You proceed to general anaesthetic endoscopy. At surgery, you find that he has a 3 cm tumour affecting the right pyriform fossa and extending into the post-cricoid region. According to the TNM (8th edition), staging, what T stage is this malignancy?","o":["T1","T2","T2B","T3","T4"],"k":"B","x":"This is a T2 tumour because there is involvement of more than one subsite, but the tumour measures less than 4 cm and there is no fixation of the hemilarynx. The subsites of the hypopharynx are the post-cricoid, the posterior pharyngeal wall, and the pyriform fossa.\nT staging of hypopharyngeal cancer:\n¢ 71: tumour limited to one subsite of hypopharynx and 2 cm or less in greatest dimension.\n¢ 72: tumour invades more than one subsite of hypopharynx or an adjacent site, or measures more than 2 cm but not more than 4 cm in greatest dimension, without fixation of hemilarynx.\n¢ 73: tumour more than 4 cm in greatest dimension or with fixation of hemilarynx.\n¢ 4a: tumour invades thyroid/cricoid cartilage, hyoid bone, thyroid gland, oesophagus, or central compartment structure (including strap muscles and subcutaneous fat).\n¢ 4b: tumour invades prevertebral fascia, encases carotid artery, or invades mediastinal structures.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q42"},{"s":"A deformity in which the middle portion of the ear is overcorrected in relation to the upper and lower poles is the","o":["telephone ear deformity.","reverse telephone ear deformity.","lop ear deformity.","cup ear deformity.","flail ear deformity."],"k":"A","x":"Overcorrection of the middle portion of the ear leads to a “telephone ear” deformity owing to the relative prominence of the superior and inferior poles. One commonly described cause of the telephone ear deformity is over-reduction of the hypertrophic concha. Alternatively, overcorrection of the upper and lower poles may result in the “reverse telephone ear” deformity. The term “lop ear” is used to describe a deformity of the helix characterized by a thin, flat ear that is acutely folded downward at the superior pole. In the “cup ear” deformity, weak cartilage with resulting limpness of the auricle results in cupping or deepening of the conchal bowl. The cup ear is often smaller than normal and folded on itself. Poor development of the superior portion of the ear results in a short, thickened helix and a deformed antihelix.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q9"},{"s":"Regarding advanced supraglottic carcinoma,","o":["surgery and radiation therapy have similar cure rates.","multimodality therapy is required for T3 and T4 lesions.","laser excision may cause less dysphagia and aspiration than open techniques for T3 lesions.","hyperfractionated and standard radiation therapy probably lead to similar cure rates.","treatment of the neck is not necessary in most cases."],"k":"C","x":"Laser excision of T3 supraglottic tumors is possible, and reports have demonstrated less dysphagia and aspiration with this procedure than with open techniques. The vocal results also appear to be improved. Treatment of the neck is also necessary for these T3 and T4 lesions. Because the supraglottic lymphatic drainage is bilateral, levels II, III, and IV of both sides of the neck must be addressed. For N+ necks, level V should be treated as well. Hyperfractionated radiation therapy appears to produce higher local cure rates than standard daily radiation.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Larynx and Laryngopharynx · Q8"},{"s":"You are referred a child with congenital hearing loss and a goitre.","o":["diagnosis of Pendred syndrome is made. Which of the following statements is least likely to be true? A. Pendred syndrome is a common form of syndromal deafness","A computed tomography (CT) scan of the auditory system may show a Mondini malformation","ACT scan of the auditory system may show a large vestibular aqueduct","Pendred syndrome is diagnosed when there is a decrease in radioactive iodide discharge from the thyroid following the administration of potassium perchlorate","The chance of a further child being born with the condition to the same parents is 50%"],"k":"E","x":"Pendred syndrome is the most common syndromal form of deafness and is associated with developmental abnormalities of the cochlea, sensorineural hearing loss, and goitre.\nPendred syndrome is associated with temporal bone abnormalities ranging from a large vestibular aqueduct to the Mondini malformation. It is inherited in an autosomal recessive pattern of inheritance so that the chance of a subsequent child with the condition is one in four.\nThe condition is caused by a defect in the organification of iodine. The perchlorate test is used in the diagnosis of Pendred syndrome. The test is performed by administering radiolabelled iodine and measuring the radioactivity emitted from the thyroid. Potassium perchlorate is then administered. This is a competitive inhibitor of iodide transport into the thyroid. The emittance of radioactivity is again measured over the thyroid and compared to the initial result.\nIn unaffected individuals, the amount of radiolabelled iodine in the thyroid remains stable due to the rapid oxidation of iodide to iodine and its subsequent incorporation into thyroglobulin.\nIn affected individuals, the transport of iodine is delayed, resulting in iodide passing into the blood. This manifests as a decrease in radiolabelled iodine in the thyroid.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q11"},{"s":"A vein tissue graft is not useful in which of the following intraoperative situations?","o":["Sealing of the oval window after footplate removal","Centering of the stapes prosthesis over the central area of footplate removal","Preventing perilymph leak","Recreating a mobile oval window membrane","Repair of a necrosed distal long process"],"k":"E","x":"Vein tissue graft will not repair a necrosed incus. All other statements are correct.","d":"Otology","src":"Brackmann · Chapter 25 · Q3"},{"s":"A 55-year-old Native American veteran with a stage IV squamous cell carcinoma of the hypopharynx is receiving multiple courses of chemotherapy with cisplatin. During the course of treatment, he presents with a gram-negative kidney infection, and his serum creatinine level is 4.0.You consider gentamicin therapy but are concerned about possible drug interactions between gentamicin and cisplatin. Which of the following statements is not correct?","o":["Gentamicin may increase the risk of ototoxicity when given in combination with cisplatin.","The kidney infection may reduce the rate of elimination of gentamicin, increasing the risk of ototoxicity.","Gentamicin may reduce the antitumor efficacy of cisplatin.","Cisplatin will probably not reduce the antibacterial effect of gentamicin.","The antitumor effect of cisplatin is not likely to be altered by gentamicin."],"k":"C","x":"Gentamicin will not be expected to reduce the antitumor efficacy of cisplatin. The other responses are all true. The interaction between gentamicin and cisplatin is likely to increase the risk of ototoxicity. The rate of renal elimination of gentamicin is reduced when renal function is impaired. Cisplatin is not known to reduce the antibacterial efficacy of gentamicin.","d":"Otology","src":"Ballenger · Ototoxicity · Q10"},{"s":"The following diagram is a schematic representation of the vocal fold. In which layer is a patient most likely to develop Reinke’s oedema?","o":["Squamous epithelium","Superficial lamina propria","Intermediate lamina propria","Deep lamina propria","Vocalis"],"k":"B","x":"The original description of the vocal fold was by Hirano, who described five layers: the outer layer of squamous epithelium; the superficial lamina propria, which is also known as ‘Reinke’s space’; then the intermediate lamina propria, the deep lamina propria, and the vocalis muscle.\nHirano M. Structure and vibratory behaviour of the vocal folds. In Sawashimu T, Cooper F (eds) Dynamic Aspects of Speech Production, pp. 13-27. Tokyo: University of Tokyo; 1977.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q32","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAK3A+UBAREA/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAwQHAQL/xABbEAABAwMBBAMLBgkICAUDBAMAAQIDBAUGEQcSITETQVEUFRciVWFxgZGU0RYyQpOhsSMzUlaSwdLh8CQ2U2JydJWyNTdDc3WCs/ElNERFVAgmwic4Y6Jkg6T/2gAIAQEAAD8A7iAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADFVVNPR076irniggYmr5ZXo1rU86rwQ+opY5o2ywvbJG9NWvYuqKnain2AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeaprpqmvYegAA5dtKzPJbFllFbrDDFNC6k7okicxFdJo5UVEXmnBELphuT0WV2dldRuRsieLPCvzon9aKToBSNs6qmzu6aLzRv+ZCz48iNsFtRqaJ3LF/lQkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADnF2/k+26yvdwbNb5UTTrXinE6OAADluWKjtsllY3i5tuc5ydibzuJqUifJLaxRtpF6Ohv7HpNH9FJGpqip69E9anXQCk7ZmOds6uqtTXda1V8ybyFlxx7ZMftrmLqi0sf8AlQkQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADmWYyLFtexV6Lu6xOj17dXLwOmgAHiqjUVVXRE4qpyOwz/ACl2oXq+Rqr6OgibRQPXk5ddXaehdfaZMnRKnanhlOiIqtWoeu9y+Zr+o6yAVfadT91YFeodNdafX2ORf1GxgFR3Vhdom113qZvH0cP1FgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOUbQ5Vh2l4pMq6MbVsYq9iLxU6uADBW1dPQUslVWTMhgibvPe9dERDleS57V5ax1jwWmne2fxJ7lIxWMjb17vb/ABwLNi1hpscs0FupvG3E3pJNOMj15uUreRr3NtXw2oXRUf3QzTlp4mn6zrIBoX6mSsslfTKmvS072p6d1dCp7FqnpcFp6dXauo5pKd3mVq6/rL2AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAce2tPVmRWeqRdOgro117OCIdhABzXbdPJNabXZYXKjrlWtjVE7E4lkoaKmt9NHTUcLIoo2o1rWppwQ2CgbSndx3zE7ouiMhuLYnKvUj+f2Ip1xqo5qORdUVNUPQF48zmmzRe8+ZZTjkioidMlXAna1fnKnrVDpYAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOT0SpW7YsiqJtP5HTwxx730UVia6etNTTghk2j5ssHjfJ6zP1kX6M8vZ59NP41OxRsbGxrI2o1jU0aickQ+gCm7Ssrfj9tio7anS3i4O6GkibxVO13oTUy7PsPjxq3umql6e7Vfj1VQ7iquXqRexC2gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHCtoMd5odo9zhtFNK+a900LI5Gt+Y1Goxy/Yp1nDMdp8Xx6ltdOiasbvSv8Ay3rzX+OwnADHUTx01PJPM5GxxtVzlXqRDmWz2mky3KrjmtwRXQRvWltrF5NYnNyenX7VOogAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+dxu/v7qb2mmunHQ+gAUPbDcKiDGo7ZRI9am6TJTtVqcm/SUteO2qGyWOitlO1Gsp4kZw61619a6qSIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB8SQxSq1ZY2PVi6tVzUXdXtQ+wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//2Q=="]},{"s":"Exostoses of the external auditory canal would be expected most frequently in the following:","o":["Patient with chronic otitis externa","College swimmer from a warm climate","23-year-old thrice-weekly surfer from Florida","43-year-old thrice-weekly surfer from Oregon"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 2 · Q1"},{"s":"Which of the following statements concerning the embryogenesis of the ear is false?","o":["Six mesodermal hillocks surround the entrance of the first branchial cleft.","The first branchial arch cartilage (Meckel’s) forms the tragus and superior helical crus.","The developing auricular appendage migrates from its initial position in the lower face toward the temporal area.","The first arch forms the head of the malleus and body of the incus.","The second arch gives rise to the manubrium, long process of the incus, stapes superstructure, and footplate."],"k":"E","x":"Six mesodermal thickenings or hillocks surround the entrance of the first branchial cleft. The first branchial arch cartilage (Meckel’s) forms the tragus and superior helical crus; the remainder of the pinna derives from the second arch cartilage (Reichert’s). The developing auricular appendage migrates from its initial position in the lower face toward the temporal area. The ossicles predominantly originate from the mesenchymal visceral bars of the first and second arches. The first arch forms the head of the malleus and body of the incus, with the second arch giving rise to the manubrium, long process of the incus, stapes superstructure, and lateral portion of the footplate. The medial lamina of the footplate is derived from the otic capsule.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q2"},{"s":"Which of the following lingual papillae does not contain taste buds?","o":["circumvallate","foliate","fungiform","filiform","all of the above contain taste buds"],"k":"D","x":"On average, humans have ~ 9 large circumvallate (also termed vallate; L. vallum = rampart surrounded by a moat) papillae across the junction of the anterior two-thirds and the posterior third of the tongue. Each papilla contains, on average, ~ 250 taste buds, although large individual differences are present. The foliate (L. folium = leaf) papillae, which consist of ridges between adjacent folds along the posterior part of the margin of the tongue, number less than a dozen on each side. Although estimates vary, the average number of taste buds per foliate papilla is probably around 100 in adults. Fungiform (L. fungi = mushroom) papillae, located over the surface of the anterior part of the tongue, vary considerably in size and shape, some being short and cuboidal and others tall with mushroom-like heads. The typical adult tongue contains several hundred fungiform papillae, although not all harbor taste buds. Of individual fungiform papillae that do contain taste buds, the number of buds ranges from 1 to 18 on those located on the tongue tip and 1 to 9 on those located midlingually. The filiform (L. filum = thread) papillae are the most numerous papillae on the tongue but do not harbor taste buds.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q1"},{"s":"Which of the following statements regarding muscular tension dysphonia is false?","o":["Vocal nodules may be present.","Suprahyoid and paralaryngeal muscles often demonstrate palpably increased phonatory muscle tension.","Response to botulinum toxin injection reliably differentiates this disorder from adductor spasmodic dysphonia.","Voice therapy is frequently beneficial.","Abnormal vocal fold positioning is consistent regardless of the type of speech."],"k":"C","x":"Both patients with spasmodic dysphonia and muscular tension dysphonia may derive benefit from botulinum toxin injections; response to this treatment is not a reliable means of differentiating these two conditions. Increased muscle tension, inflammatory changes of the laryngeal mucosa (nodules, erthema, edema), and abnormally increased laryngeal tension across various types of speech tasks are characteristic of muscular tension dysphonia. Laryngeal massage and voice therapy aimed at reducing laryngeal muscle tension are frequently effective treatment.","d":"Laryngology","src":"Ballenger · Neurogenic and Functional Disorders of the Larynx · Q10"},{"s":"Inferior extent of access via endonasal approach can be determined preoperatively by drawing a line (Kassam line) between which two structures extended into the depth on sagittal CT?","o":["Nasal tip and odontoid process","Tip of bony nasal bridge and hard palate","Tip of bony nasal bridge and odontoid process","Middle turbinate and hard palate","Middle turbinate and C1"],"k":"B","x":"These two bony structures create a fulcrum that limits the inferior extent of exposure.By drawing a line between them on preoperative sagittal imaging, one can get a rough idea of the extent of lowest access.","d":"Rhinology","src":"Brackmann · Chapter 55 · Q2"},{"s":"If a malignancy is suspected in a child with an enlarged cervical lymph node, which of the following is preferred to establish a diagnosis?","o":["endoscopy with biopsy of likely primary sites","excisional biopsy","incisional biopsy","needle biopsy","punch biopsy"],"k":"B","x":"If a cervical malignancy is suspected, an excisional biopsy is preferred. With localized lesions, an excisional biopsy may be curative and provides for a sufficient amount of tissue for additional studies such as permanent and frozen sections, electron microscopy, special stains, and tumor markers. Although needle biopsies are safe and accurate in adults, they often do not provide enough tissue to diagnosis pediatric malignancies, which are rare and frequently consist of embryonic tissue. Many pathologists do not have sufficient experience with these tumors and require large amounts of tissue to make the diagnosis.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q6"},{"s":"The most feared complication that is unique to the lateral technique tympanoplasty is","o":["facial nerve paralysis.","prolapse of the condyle of the mandible into the ear canal.","cholesteatoma caused by inadequate removal of squamous cell elements.","anterior blunting of the ear canal.","lateralization of the graft with maximal conductive hearing loss."],"k":"B","x":"Although facial nerve paralysis is a feared complication in any ear operation, it is not likely to occur with either tympanoplasty technique and would not be more likely with a lateral technique procedure. The last three choices are indeed complications that are unique to the lateral technique operation but cause relatively few symptoms and may be corrected with subsequent treatment. Prolapse of the condyle of the mandible is a very difficult problem to correct successfully and must be avoided by careful attention to proper surgical technique.","d":"Otology","src":"Ballenger · Chronic Otitis Media · Q7"},{"s":"Concerning obstructive sleep apnoea (OSA), which one of the following statements is true?","o":["During sleep, muscle tension is maximal during rapid eye movement (REM) sleep","The multiple sleep latency test cannot be used to diagnose OSA","Pulse oximetry can accurately diagnose OSA","The respiratory distress index (RDI) is the number of apnoeas/hypopnoeas occurring every hour","Continuous positive airway pressure is unacceptable first-line treatment in a young person"],"k":"D","x":"During sleep, physiological muscle relaxation is maximal in REM sleep.\nThe multiple sleep latency test measures the time to fall asleep in a darkened room on several separate occasions across the day following an instruction to fall asleep. An average time of less than 7 minutes is considered to be evidence of pathological sleepiness.\nPulse oximetry is commonly used in the diagnostic testing for OSA. However, a normal oximetry tracing does not exclude OSA, particularly in younger patients who do not desaturate during their apnoea episodes.\nContinuous positive airway pressure has been established as the treatment of OSA.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q22"},{"s":"The preferred nerve to use in a grafting procedure is","o":["Sural cutaneous","Medial branchial cutaneous","Greater auricular","None of the above","A AND B"],"k":"C","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 63 · Q5"},{"s":"A central molecule in allergic disease is IgE, which interacts with","o":["monocytes.","B lymphocytes.","eosinophils.","mast cells.","all of the above."],"k":"E","x":"Immunoglobulin E plays a critical role in the immune response. This begins when macrophages and other antigenpresenting cells process the allergen before presenting it to T helper cells, which then interact with B lymphocytes, leading to their differentiation into IgE-producing plasma cells, a process involving interleukin-4, interleukin-13, and accessory molecules such as CD40. These newly formed IgE molecules bind to high-affinity receptors principally located on mast cells and basophils and to low-affinity receptors located on eosinophils, monocytes, and platelets. The high-affinity IgE receptors on mast cells mediate the immediate allergic response. Although the mast cell is perhaps a central player with IgE, the presence of receptors on a number of immune cells is in agreement with a view of the allergic response as a complex, coordinated effort of a number of players (cells, chemokines, adhesion molecules, reflexes, etc).","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q3"},{"s":"The preferred method of treatment for stage III and IV tumors of the buccal mucosa is","o":["combination therapy using surgery with postoperative radiation therapy.","combination therapy using concomitant chemotherapy and radiation therapy.","surgery alone.","radiation therapy alone.","combination therapy using surgery and chemotherapy."],"k":"A","x":"As is the case with most tumors of the oral cavity and oropharynx, surgical resection is recommended for stage I and II tumors, with combination therapy using surgery and postoperative radiotherapy for stage III and IV tumors.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q7"},{"s":"A patient’s chest radiograph demonstrates a solid, round mass within a spherical cavity. To which serum precipitin is the microorganism likely to be positive?","o":["Mycobacterium tuberculosis","Staphylococcus aureus","Aspergillus species","Mycobacterium avium-intracellulare","Moraxella catarrhalis"],"k":"C","x":"Mycetomas are most commonly caused by Aspergillus species.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q7"}]};const Q=P.q;const L='ABCDEF';

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Final MCQ mock</div><h1>${esc(P.title)}</h1>
  <p class="sub">100 single-best-answer questions, one correct option each. Blueprint follows the West Bank Part II distribution. Book wording and book keys throughout.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
