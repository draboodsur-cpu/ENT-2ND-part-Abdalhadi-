<title>ENT Mock Exam — Paper 1</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

const P={"title":"ENT Mock Exam — Paper 1","q":[{"s":"Symptoms of laryngeal webs include","o":["vocal dysfunction.","airway obstruction.","biphasic stridor.","reflux.","all of the above."],"k":"E","x":"Vocal dysfunction is the most common symptom in patients with laryngeal webs. Airway obstruction is the second most common finding, and the stridor occurs in both inspiratory and expiratory phases of respiration. Reflux is also observed in infants with laryngeal webs.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q4"},{"s":"A 22-year-old female presents with galactorrhea, homonymous hemianopsia, and hypopituitarism. This constellation of symptoms and signs is most likely to be seen with","o":["Thornwaldt’s cyst.","nasopharyngeal teratoma.","chordoma.","Rathke’s cyst.","teratoid cyst."],"k":"D","x":"Rathke’s cyst most commonly presents with headache followed by galactorrhea, visual field loss, and hypopituitarism. Chordoma is a distinct possibility. However, only 50% of chordomas occur in the spheno-occipital area. They may present with an expanding nasopharyngeal mass, frontal headaches, cranial nerve palsies, and pituitary abnormalities. This wider range of presenting signs and symptoms, however, is more commonly seen in younger children than in adults. Nasopharyngeal teratoma, Thornwaldt’s cyst, and teratoid cyst are not associated with these symptoms and signs.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q7"},{"s":"Features of a tension headache include (1) more common in women (2) bilateral (3) dull pain (4) associated with depression","o":["1, 2, and 3","1 and 3","2 and 4","4 only","all of the above"],"k":"E","x":"Tension headache features include greater prevalence in women, bilaterality, tightening or dull pain, exacerbation by stress, and association with depression. Therefore, all of the features are correct.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q4"},{"s":"A 60-year-old gentleman with a 2-month history of a hoarse voice is placed on your operating list for a microlaryngoscopy. He has a heavy smoking history. At surgery, the findings are as shown. Please choose the next best course of action:","o":["Don’t biopsy; wake the patient and arrange a CT scan","Proceed to biopsy","Microdebridement of the lesions","CO2 laser ablation of the lesions","Proceed with biopsy; arrange a CT neck and chest and a discussion at the head and neck multidisciplinary team"],"k":"B","x":"A biopsy is mandatory to exclude malignant disease; however, the lesions are confirmed to be respiratory papillomatosis as expected. The patient should be counselled to stop smoking.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q60","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAIyA+gBAREA/8QAGwABAAMBAQEBAAAAAAAAAAAAAAEDBAIFBgf/xABEEAACAQIFAgMFBgYABQMDBQEAAQIDEQQSITFBBVETImE1cXSBsgYVMlWU0RQjQpGhsRYzUmLBJXLxBzTwJENTVOGE/9oACAEBAAA/APyXrTf3z1DV/wD3NX6mY7vuxd92Mz7sZn3YzPuxmfdi77sXfdi77sXfdi77sXfdi77sXfdi77sXfdi77sXfdi77sZn3Yu+7F33Ycnbdi77sXfdi77sXfdi7tuw5Puxmfdi77sNvuxd92G33YbfcZn3YTfdkpvuQm+7GZ33ZN3fcZn3ZDk+7JzPuyMz7sXdt3/cXfdi+m7Iu3yxd92SnJ7NlkKNSeuppp4Ko92/kaqeBemrZqp9Om7bl0enu6TbNH8NClo3qJ0Iy2VkQ6EINXdzqcYSSjFFUYU4uSk3fcoahKq0m7IjLDM9WFCKWjdzqME7Lf1LY4eLavLbuTPBqWi395nqYW1uCqpg7oy1ME7btIzTwVVapt/MonRqx7lTck9Wxmfdk3fdjM7bsZn3GZ92LvuLvuxmfqMz7k3fcXfcjM7bsXfdjM+7CbvuG33GZ92TmfdkXfdi77sZn3F33Yu+4u+7F33YzPuxmfdi77sXl3Yu+7/uLvuxmfcXfdi7fLF33YzPuxd92Lvuxmfdi77sZn3Yu+7GZ92Mz7sZn3Yu+7F33Yu+7F33Yu+7N3QW/v3pur/8Au6X1o5617a6h8VV+pmIAAABgAAAAABgAWuAAABwSAERyBYkgXG4ASbdkWww9SXGhqo4BvWRto9P/AO02QwOTdI10sPTivM7alkYwX4Y7eh2q2XaPuIqSk03oirJKbzOXuRLT2d3YjKrpZW5HMpKP40lYz1JKc1NbMoUJOUkkkt2IwlOTa1LGsqOl5LXS9CyCdtdDpyytWepxKUklrfU7TXMb/wDgmapveNtDjwacn5bWKKuEWXgx1On5v6dTLV6bNfhRknh6kNHEqaaHOw+Q9ASQT7wQSQydiN0AgABsBwAAAAAAAASQAAADd0H27034ul9aI62v/Wcf8TV+pmIAAAAAAAADkkgcCwHu h9w9G/KMB+mh+xP3D0b8owH6aH7D7h6N+U4D9ND9h9w9G/KcB+mh+w+4ejX9k4D9ND9gug9Gt7JwH6aH7B9B6N+U4D9ND9h9w9G/KcB+mh+w+4ejflOA/TQ/YfcPRvynAfpofsPuHo35TgP00P2H3D0a3snAfpofsPuHo35TgP00P2H3D0b8pwH6aH7BdB6N+U4D9ND9h9w9G/KcB+mh+w+4ejflOA/TQ/YfcPRr+ycB+mh+w+4ejflOA/TQ/YfcPRreycB+mh+w+4ejflOA/TQ/YLoPRreycB+mh+w+4ejflOA/TQ/YLoPRvynAfpofsT9w9G/KcB+mh+xD6D0b8pwH6aH7D7h6N+U4D9ND9h9w9G/KcB+mh+w+4eja/wDpOA/TQ/YfcPRr+ycB+mh+w+4ejX9k4D9ND9h9w9Gv7JwH6aH7D7h6N+U4D9ND9g+g9G/KcB+mh+wXQejflOA/TQ/Yn7h6N+U4D9ND9iPuHo1vZOA/TQ/Yn7h6N+U4D9ND9iPuHo35TgP00P2C6D0b8pwH6aH7D7h6N+U4D9ND9h9w9G/KcB+mh+w+4ejflOA/TQ/YLoPRvynAfpofsPuHo35TgP00P2J+4ejflOA/TQ/Yj7h6Nb2TgP00P2H3D0a3snAfpofsPuHo35TgP00P2H3D0b8pwH6aH7F+B6H0iGOw0odKwMZRqwaaw0E07r0P/9k="]},{"s":"Regarding nasopharyngeal carcinoma, which of the following statements is true?","o":["The most common site is the midline nasopharynx","It is generally associated with the Epstein-Barr virus","If extension to the parapharyngeal space without paranasal sinus involvement is present, this constitutes a T3 tumour","Surgery is the mainstay of treatment for this disease","Grommets are commonly used for associated middle ear effusion"],"k":"B","x":"The most common site for nasopharyngeal carcinoma is the fossa of Rosenmuller\nwhich is a recess just medial to the medial crura of the Eustachian tube. The aetiology of the condition is thought to be Epstein-Barr virus related, consumption of salted fish containing demethylnitrosamine. Parapharyngeal extension is classified within the T2 category; paranasal sinus involvement would be T3 disease. Non-surgical treatment is the mainstay for nasopharyngeal carcinoma with surgery rarely used for recurrent disease at the primary site or in the neck. Stage\n1 and stage 2 disease will receive radiotherapy with stage 3 and stage 4 receiving concurrent chemoradiotherapy. Grommets are rarely used for the middle ear effusion. A hearing aid is advocated in this patient group. Grommet insertion leads to approximately one-third of patients suffering a non-healing perforation and about half of patients will develop troublesome otorrhoea.","d":"Rhinology","src":"SBA book · Rhinology · Q46"},{"s":"What is the pathophysiologic correlate of Ménière’s disease?","o":["Scarring and fibrosis of the periductal and saccular tissues within the vestibular aqueduct and opercular regions","Contraction of the mastoid cavity with narrowing of Trautman’s triangle by anteromedial displacement of the sigmoid sinus","Dilation of the membranous endolymphatic spaces including the scala media, saccule, and endolymphatic system","Shortening and narrowing of the vestibular aqueduct","Episodic vertigo lasting more than 30 minutes associated with nausea and vomiting, fluctuating or deteriorating hearing often in the low frequencies initially, and tinnitus and/or aural pressure."],"k":"C","x":"Endolymphatic hydrops, as documented by temporal bone histopathologic analysis of Ménière’s patients,shows dilatation of the membranous endolymphatic spaces, particularly the scala media and saccule. Answers a, b, and d are common findings within temporal bones of Ménière’s patients that may contribute to the symptomatology and development of the pathophysiologic state of hydrops. Answer e is the 1995 Committee on Hearing and Equilibrium symptom diagnosis for possible Ménière’s disease.","d":"Otology","src":"Brackmann · Chapter 34 · Q1"},{"s":"Which of the following does not describe Carhart’s notch?","o":["ranges in magnitude up to 15 dB","is centered at 2 kHz","is an apparent sensorineural hearing loss","usually disappears after stapes surgery","occurs without a conductive hearing loss"],"k":"E","x":"A moderate degree of stapes fixation must be present for Carhart’s notch to be apparent.","d":"Otology","src":"Ballenger · Otosclerosis · Q6"},{"s":"The most commonly encountered congenital anomaly of the head and neck is","o":["second branchial cleft cyst.","cystic hygroma.","thyroglossal duct cyst.","Thornwaldt’s cyst.","choanal atresia."],"k":"C","x":"Thyroglossal duct cysts are the most common anomalies of the head and neck, followed by branchial cleft defects, lymphangioma (cystic hygroma), and subcutaneous vascular anomalies. Thornwaldt’s cyst presenting clinically is uncommon, whereas choanal atresia, although the most frequently encountered congenital nasal anomaly, occurs in only 1 in 7,000 to 8,000 births.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q1"},{"s":"You are referred a 6-year-old boy with a history of a choking episode while playing 2 days ago. His chest X-ray is shown. You plan to take him to the operating theatre. What would be the most appropriate method of induction of anaesthesia in this case?","o":["Rapid sequence induction and orotracheal intubation","Propofol intravenous induction and orotracheal intubation","Propofol intravenous induction and laryngeal mask airway placement","Gas induction and nasopharyngeal tube insertion","Gas induction and orotracheal intubation"],"k":"D","x":"This child requires rigid bronchoscopy to retrieve the pin in the right main bronchus. This is best achieved by performing a gas induction and placing a nasopharyngeal tube, allowing the child to breathe spontaneously while the procedure is performed.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q29","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAMvA+gBAREA/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAMBAgQFBgcI/8QAUBAAAQMDAwIDAwcJBAULBQEBAQACEQMhMQQSQQVRImFxBhOBMjVVkZOhsQcUFhdzdLLR4RUjQsEkMzRSlCUmNkNFU1RiY4LwRHKDkvGEwv/aAAgBAQAAPwD5z132l67T651FjOr65rW6qqGtFd0Abz5rD+lHX/pnX/bu/mj9KOv/AEzr/t3fzR+lHX/pnX/bu/mj9KOv/TOv+3d/NH6Udf8AprX/AG7v5o/Sjr/0zr/t3fzR+lHX/prX/bu/mj9KOv8A01r/ALd380fpR1/6a1/27v5o/Sjr/wBM6/8A4h380fpR1/6Z1/27v5o/Sjr/ANM6/wC3d/NH6Udf+mdf9u7+aP0o6/8ATOv+3d/NH6Udf+mdf9u7+aP0o6/9Na/7d380fpR1/wCmdf8Abu/mj9KOv/TOv+3d/NH6Udf+mdf9u7+aP0o6/wDTOv8At +h6f2v9FP63dR9DU/tf6KP1uaj6Hpz+2/oj9bup+h6f2v8ARB/K5qfoen9r/RH63dR9D0/tf6IP5XdR9D0/tv6I/W5qPoen9t/RH629T9D0/tv6I/W5qPoen9r/AER+tzU/RFP7X+ij9bmp+h6f2v8ARH63NR9EM+2/oj9beo+iKf239Efrb1P0PT+1/og/la1PPR6f2v8ARH629T9Ds+2/oj9bep+iKf239EH8rep+iGfbf0R+trUfQ9P7b+iP1tag/wDZFP7b+iP1s6jH9j0/tv6KD+VnUfRFP7b+ij9bOp+iKf2v9EfrY1H0RT+1/oj9bGp+iKf2v9FB/KvqD/2TT+1/ogflX1H0RT+1/oj9a+o+iKf2v9EH8q+o+iKf2v8ARR+tbUfRNP7X+iP1ragf9k0/tf6I/WtX+iKf2v8ART+tfUfRFP7X+iD+VfUfRNP7X+ij9a+o+iaf2v8ARB/KtqPomn9r/RR+tXUfRNP7X+ig/lT1B/7JZ9r/AEUfrT1MR/ZVP7X+ij9aWo+iqf2v9FH60NR9FM+1/oo/WfqLf8lM+1UH8ptcmf7LZ9qgflO1AM/2Wz7X+iD+U7UTfpbPtf6IH5T9T9Fsj9r/AEUu/KdqCPmpn2v9Er9ZOoOemM+0UD8o+o3AjprLf+oqVPyh13u3f2cz7RJf7eV3GT09noai5ep9pa2ocXHStbP/AJlztR1GpWEGkBPmsDmuJmFGx3ZHu3dkbHdkbHdkbHdkbHdkBjuy1dMY7+0tLb/rmfiF/9k="]},{"s":"You wish to use a urinary catheter as a postnasal pack in a patient with epistaxis. The only available size is a French size 24. What is the diameter of the tube?","o":["4mm","6mm","8mm","10 mm","12 mm"],"k":"C","x":"The French catheter scale is used to measure the outside circumference. The diameter (mm) can be calculated by dividing the French size by pi. Therefore a French size 24 equals a diameter of 8 mm.","d":"Rhinology","src":"SBA book · Rhinology · Q11"},{"s":"Which of the following elements of blood clotting are inhibited by the administration of warfarin?","o":["Factors II, VIl, IX, and X","Factors lla, Xa, Xa, and Xla","Platelet aggregation","Von Willebrand factor","Factors II, VIll, and X"],"k":"A","x":"Vitamin K, in its reduced form, is a cofactor for the enzymatic reaction in which the glutamic acid residues on the amino terminal end of coagulation factors II, VII, IX, and X are converted into gamma-carboxyglutamic acid residues.\nWarfarin acts as a competitive inhibitor of the reaction in which oxidized vitamin K is turned into reduced vitamin K.\nHence, warfarin inhibits the vitamin-K dependent factors, namely II, VII, IX, and X. Factors Ila, Xa, Xa, and Xla are inhibited by the heparin—antithrombin complex.\nVon Willebrand factor is a plasma glycoprotein that acts as a bridge between platelets and damaged subendothelium at the site of vascular injury.","d":"General","src":"SBA book · General Otolaryngology · Q33"},{"s":"Which of the following does not apply to Pendred’s syndrome?","o":["usually normal thyroid function","temporal bone anomalies include Mondini’s dysplasia and dilated vestibular aqueduct","a goiter typically present at birth","mutations in PDS","a positive perchlorate challenge test"],"k":"C","x":"Although goiter may be apparent at birth in Pendred’s syndrome, it typically presents in midchildhood. Despite a defect in the thyroid gland, affected individuals usually remain euthyroid. The administration of a perchlorate in the form of a challenge releases unbound iodide from thyroid follicular cells. The disease is caused by mutations in PDS.","d":"Otology","src":"Ballenger · Hereditary Hearing Impairment · Q5"},{"s":"Which of the following is not a pure sensory branch of the mandibular nerve?","o":["Meningeal nerve","Buccal nerve","Auriculotemporal nerve","Lingual nerve","Inferior alveolar nerve"],"k":"E","x":"The inferior alveolar nerve is not a pure sensory nerve. It provides a motor branch to the mylohyoid muscle before entering the mandibular canal.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q51"},{"s":"Which of the following is an effect of chemokines?","o":["stimulation of inflammation","destruction of nasal mucosa","cell recruitment and transmigration","survival of cells in the nasal mucosa","all of the above"],"k":"E","x":"Chemokines have a variety of effects in the pathophysiology of allergic rhinitis. Such effects include increasing the production of cells in the bone marrow, aiding in the survival of cells in the nasal mucosa, synergizing with other cellular activators, and acting as chemoattractants. Some of these inflammatory cells elaborate substances that can cause local damage and mucosal modifications. The chemokines are chemoattractant cytokines that play an important role in the function and expression of leukocyte and endothelial adhesion molecules. However, studies show that although chemokines have a profound effect on the recruitment of cells to the tissue, they can exert a wide range of responses. In vitro, in vivo, and challenge studies all support the importance of chemokines in the pathophysiology of allergic rhinitis.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q4"},{"s":"While descending on a SCUBA dive, a 30-year-old man experiences a sudden onset of hearing loss and vertigo. Which of the following best describes the mechanism of injury to his inner ear?","o":["Rupture of the round window on ‘Valsalva’ equalization of pressure","Increased middle-ear pressure on descent","Ossicular discontinuity","Tympanic membrane rupture","Rupture of stapedius tendon"],"k":"A","x":"On descent, divers should regularly equalize by performing the Valsalva manoeuvre. However, if this is done too forcibly, the sudden change in middle ear pressure can lead to rupture of either the oval or round window.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q27"},{"s":"The following are common symptoms of chronic rhinosinusitis except","o":["nasal discharge.","nasal congestion.","fever.","hyposmia.","fatigue."],"k":"C","x":"The most common symptoms in chronic rhinosinusitis are nasal congestion and discharge. Hyposmia and fatigue are also symptoms that are frequently encountered in this patient population. As opposed to acute infectious sinusitis, fever is seldom associated with chronic rhinosinusitis. Additionally, sinus pain is much more characteristic of acute rhinosinusitis than the chronic form of the disease.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q9"},{"s":"With regard to juvenile angiofibroma, which of the following statements is false?","o":["The mechanism of bleeding is due to an abnormality of striated muscle within the blood vessel walls","It is associated with familial adenomatous polyposis","It is associated with the Holman—Miller sign on MRI","The tumour arises around the sphenopalatine foramen","Drilling of the basisphenoid at primary surgery helps to reduce recurrence rates"],"k":"C","x":"This benign and very vascular tumour arises from tissues within the sphenopalatine foramen. It is virtually exclusive to adolescent males; any female presenting with such a tumour would need to undergo chromosomal evaluation. Due to the male preponderance there is much speculation regarding the role of sex hormone receptors in the aetiology of this tumour. Patients with familial adenomatous polyposis have a 25 times higher chance of having one of these tumours compared to the background risk. These tumours are well defined, lobulated, and covered with the mucosa of the nasopharynx. The blood vessels of the tumour lack the smooth muscle and elastic fibres preventing vasospasm.\nAs the tumour grows it will extend into the nasopharynx, paranasal sinuses, and pterygopalatine and infratemporal fossae. These tumours are locally aggressive. Presentation is usually with recurrent epistaxis and nasal obstruction. Later presentations include cheek swelling, trismus, loss of hearing, anosmia, and eye signs. Following clinical examination, radiological assessment is usually in the form of CT and MRI. Classically on a CT scan, the Holman—Miller sign is seen, referring to bowing of the ipsilateral posterior maxillary wall. Biopsy should generally not be performed—from the patient’s demographic information, history, and image studies the diagnosis should be evident.\nThere are several classification systems including Radkowski, Krouse, and Fisch classifications, which aim to help with treatment options: endoscopic versus open surgery. Treatment is surgical with preoperative embolization. Surgical approaches include endoscopic versus open (transpalatal, lateral rhinotomy, mid-facial degloving, craniofacial resections). The basisphenoid is generally considered the area of recurrence and assessment of this area at primary surgery along with drilling of this bone to ensure residual tumour does not reside within the cancellous bone of the sphenoid or\nthe pterygoid canal greatly improves primary cure rates. Radiation is generally usually reserved for those who are deemed inoperable (generally due to intracranial involvement). Radiotherapy does not offer a cure, mainly reducing tumour bulk, usually giving tumour shrinkage over an extended period of time (2-3 years) with a stabilization of the residual tumour.","d":"Rhinology","src":"SBA book · Rhinology · Q53"},{"s":"Cochlear implantation is not feasible in children with deafness associated with","o":["Mondini’s deformity.","meningitis.","ototoxicity.","autosomal recessive inheritance.","Michel’s deformity."],"k":"E","x":"Stimulable auditory neural elements are nearly always present regardless of the cause of deafness. Two exceptions are the Michel deformity, in which there is a congenital agenesis of the cochlea, and the small internal auditory canal syndrome, in which the cochlear nerve may be congenitally absent.","d":"Otology","src":"Ballenger · Cochlear Implants · Q7"},{"s":"Which of the following statements best describes the physiology of olfaction?","o":["The primary neuron cell body for the first cranial nerve is located in the olfactory bulb","Noxious stimuli from the posterior nasal cavity are detected by the glossopharyngeal nerve","The vomeronasal organ detects tactile sensation from passing odorants","Each olfactory receptor expresses only one G protein receptor","Olfactory receptor neurons do not regenerate"],"k":"D","x":"Each olfactory receptor cell expresses only one type of olfactory receptor. However, a given olfactory receptor can bind to a variety of odour molecules with varying affinities.\nThe primary neuron cell body for the first cranial nerve is located in the nasal mucosa. The cell is bipolar, with a dendrite extending to the nasal mucosa. The cell projects unmyelinated axons from the olfactory receptor cells towards the ipsilateral olfactory bulb to make contact with the second- order neurons.\nThe trigeminal nerve innervates the posterior nasal cavity to detect noxious stimuli.\nThe vomeronasal organ is a specialized structure located in the base of the anterior nasal septum. It is believed to have a role in detecting pheromones.\nOlfactory receptor neurons are replaced approximately every 40 days.","d":"Rhinology","src":"SBA book · General Otolaryngology · Q4"},{"s":"Which is the most common fracture within the temporal bone?","o":["transverse fracture","longitudinal fracture","fracture of the stapes","fracture through the cochlea","fracture of the anterior wall of the external auditory canal"],"k":"B","x":"Longitudinal or extracapsular fractures account for 80% of temporal bone fractures, and temporal bone fractures are more common than the other three choices.","d":"Otology","src":"Ballenger · Trauma to the Middle Ear, Inner Ear, and Temporal Bone · Q9"},{"s":"Regarding chronic rhinosinusitis (CRS), which of the following statements is true?","o":["The Lund—Mackay scoring system for CRS has a total score of 24","Staphylococcus aureus is associated with CRS without nasal polyps","Clarithromycin is the first-line antibiotic of choice in CRS with nasal polyposis","Treatment is guided by a pain scale","The effect of aspirin in Samter’s triad is a true allergic response"],"k":"A","x":"The Lund—Mackay scoring system for CRS is based on paranasal CT scans scoring 0 for a clear sinus, 1 for partial opacification, and 2 for completely opacified. Each of the paired maxillary, anterior and posterior ethmoidal, frontal, and sphenoid sinuses is scored, giving a score of 20.\nThen there is a score for the paired osteomeatal complexes of 0 (unobstructed) or 2 (obstructed), bringing the maximum total score to 24. Staphylococcus aureus has been detected in nasal mucus in approximately 70% of patients with CRS with nasal polyps giving rise to the super-antigen theory. Doxycycline is the EPOS 2012 first-line antibiotic for CRS with nasal polyps. Management of CRS\nis based on a visual analogue scale (VAS) score and nasoendoscopy findings. Diagnosis is based\non two or more symptoms persisting for greater than 12 weeks; these symptoms include nasal blockage/obstruction/congestion, nasal discharge (either anterior or posterior nasal drip), facial pain/pressure, and a decrease or loss of smell. Pain in itself would be more typical of an acute sinusitis or another pathology. Serum IgE levels are increased in patients with CRS with nasal polyps. This supports the super-antigen theory. A true allergic response is IgE mediated; Samter’s triad, better referred to as aspirin-exacerbated respiratory disease, is a hypersensitivity reaction where the aspirin blocks the cyclooxygenase (COX)-1 enzyme resulting in increased leukotriene levels with the resultant bronchoconstriction.","d":"Rhinology","src":"SBA book · Rhinology · Q71"},{"s":"Adenoidectomy may be indicated for all of the following except","o":["nasal obstruction.","chronic adenoiditis.","chronic sinusitis.","chronic otitis media with effusion.","vasomotor rhinitis."],"k":"E","x":"There is strong evidence that adenoidectomy will assist in relieving all of the conditions listed except vasomotor rhinitis. At this point, no definitive cause for this entity has been identified. The nasal obstruction associated with vasomotor rhinitis does not improve with removal of adenoid tissue.","d":"Otology","src":"Ballenger · Otitis Media and Middle Ear Effusions · Q8"},{"s":"You are asked to see a 2-year-old child with suspected sinusitis. Which of the following sinuses is unlikely to be involved?","o":["Sphenoid","Ethmoid","Maxillary","All of the above: a child of this age would not develop sinusitis","They all have an equal chance of being involved"],"k":"A","x":"The development of the sinuses proceeds as follows:\n* Maxillary sinuses are present at birth.\n¢ Ethmoid sinuses are present at birth.\n* Sphenoid sinus pneumatization starts in the third year of life.\n* Frontal sinuses are not present at birth and are not aerated before 6 years of age.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q30"},{"s":"The paired lower lateral (alar) cartilages","o":["are attached to the nasal bones.","are divided into the medial crus, lateral crus, and intermediate crus.","are seldom asymmetric.","are attached by a ligament to the caudal septum.","move independently of one another during facial animation."],"k":"B","x":"Normal alar cartilages are composed of three distinct anatomic segments: the lateral, medial, and intermediate crura.","d":"H&N / Plastics / Trauma","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q4"},{"s":"You perform an ultrasound scan in a child with persistent cervical lymphadenopathy. Which of the following are high-risk/suspicious features of malignancy in children with lymphadenopathy (more than one apply)?","o":["Supraclavicular lymph nodes","Lymph nodes larger than 3 cm","Increased hilar blood flow","Ovoid lymph nodes","Skin discoloration"],"k":"A","x":"B, C. Malignant lymph nodes are large, round, with an absent hilum. They are hypoechoic with irregular and invasive borders. Structural changes such as intranodal necrosis and calcification may be present and in general an increase in hilar blood flow.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q38"},{"s":"The most consistent landmark that a surgeon can easily use in identifying the facial nerve near the skull base is","o":["the digastric muscle.","the tragal pointer cartilage.","the point halfway between the mastoid tip and the angle of the mandible.","the tympanomastoid suture.","the stylomastoid foramen."],"k":"D","x":"The most consistent landmark typically used in surgical identification of the facial nerve at the skull base is the tympanomastoid suture. The stylomastoid foramen from which the facial nerve exits the skull base is located at the deep extent of this suture line.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Salivary Glands · Q2"},{"s":"During a carbon dioxide laser excision of recurrent respiratory papillomata, an airway fire occurs. The first step in management is to","o":["remove the endotracheal tube.","irrigate with saline.","stop the oxygen.","provide 100% oxygen.","give dexamethasone."],"k":"A","x":"The first step in management of an airway fire in laser surgery is to remove the existing tube and replace it with a smallerdiameter tube. This step should be followed by laryngoscopy and bronchoscopy to evaluate the extent of damage and to remove charred debris and foreign material. Saline lavage, systemic corticosteroids and antibiotics, and careful monitoring of pulmonary function are indicated.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q8"},{"s":"In the recovery room following a modified radical mastoidectomy, the patient is found to have a facial nerve palsy. The surgeon was confident that she had not injured the nerve during the operation. What would be the most appropriate next action?","o":["Immediately re-explore the ear","Give steroids in recovery","Wait for the local anaesthetic to wear off","Ask a colleague to re-explore the ear immediately","Arrange a computed tomography (CT) scan"],"k":"C","x":"If the surgeon is confident that the nerve was not injured in the operation, it is reasonable to allow any local anaesthetic to wear off. If the palsy persists, the packing could be removed from the ear.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q16"},{"s":"Which of the following muscles is the most important in opening of the Eustachian tube?","o":["Levator veli palatini","Tensor veli palatini","Salpingopharyngeus","Buccinator","Lateral pterygoid"],"k":"B","x":"The Eustachian tube is normally closed. It is opened by contraction of the tensor veli palatini muscle.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q2"},{"s":"Isolated laryngeal candidiasis is usually secondary to","o":["prolonged antimicrobial use.","systemic corticosteroid use.","inhaled corticosteroid use.","insulin-dependent diabetes.","infection with human immunodeficiency virus."],"k":"C","x":"Severe immunosuppression (owing to chemotherapy or acquired immune deficiency syndrome is associated with the development of invasive laryngeal candidiasis, and, as expected in such patients, the infection is often more serious and sometimes can be life threatening owing to bleeding or airway obstruction. Isolated laryngeal candidiasis (without the involvement of any other contiguous anatomic structures) usually occurs in patients who use corticosteroid inhalers.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q5"},{"s":"Which of the following is not considered to participate in the pathogenesis of the patulous Eustachian tube?","o":["Cigarette smoking","Weight loss","Changes in estrogen levels","Scarring from previous nasopharyngeal procedures"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 7 · Q3"},{"s":"A high fever, conjunctivitis, polymorphous erythematous rash, erythema and edema of the extremities, cervical lymphadenopathy, and necrotic pharyngitis in a child under 5 years suggest which of the following conditions?","o":["erythema multiforme major","erythema multiforme minor","Reiter’s syndrome","Kawasaki’s disease","systemic lupus erythematosus"],"k":"D","x":"Kawasaki’s disease occurs primarily in children under 5 years. It is characterized by high fever, bilateral conjunctivitis, polymorphous erythematous rash, erythema and edema of the extremities, cervical lymphadenopathy including strawberry tongue, dry fissured lips, pharyngeal infection, and necrotic pharyngitis. It is the most common cause of acquired cardiac disease in children under 5 years. Fifteen to 20% of untreated children will develop a cardiac complication, with coronary artery aneurysm being the most serious. Treatment is with intravenous gamma globulin and aspirin.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q1"},{"s":"What is the most frequent site of involvement when leprosy affects the upper respiratory tract?","o":["larynx","hypopharynx","nose","middle ear","salivary glands"],"k":"C","x":"The nose is by far the most frequently involved site. Mycobacterium leprae prefers an ambient temperature of less than 37˚C.","d":"General","src":"Ballenger · Etiology of Infectious Diseases of the Upper Respiratory Tract · Q5"},{"s":"Body and parasymphyseal mandibular fractures in the dentulous patient are usually considered to be compound because","o":["the oral cavity is the most highly contaminated cavity in the body.","the fracture usually connects to the periodontal membrane.","the fracture almost always tears the gingival mucous membrane.","most fractures are double or multiple in nature.","all of the above."],"k":"B","x":"The periodontal pocket between the gingiva and the tooth root is in continuity with the oral cavity.","d":"H&N / Plastics / Trauma","src":"Ballenger · Facial Fractures · Q5"},{"s":"You are working in London and are asked to consent a child born on 24 January 2017 for a tonsillectomy following persistent episodes of tonsillitis. His biological father accompanies him. The father informs you that he has a different surname from his son and has never been married to the child’s mother although he is named on the birth certificate as the father. The father wants the operation to proceed. What is the most appropriate course of action?","o":["Inform the father that only the mother can consent for treatment and therefore postpone surgery","Cancel surgery and see if the child has any further episodes of tonsillitis in the next 6 months","Allow the father to sign the consent form and proceed with surgery","Alter the order of the list so that the hospital lawyer can be contacted","Get a colleague to witness the consent"],"k":"C","x":"The father has the legal responsibility for the child and can consent to the procedure.\nConsent need only be given by one person with parental responsibility but it is good practice to involve both parents.\nThe law in relation to parental responsibility has been revised. Originally those people with parental responsibility were described in the Children Act 1989. They included both the child’s parents\nif they were married at the time of conception or birth or the child’s mother if they were not married. Fathers not married to the mother could have acquired parental responsibility through a court order, subsequent agreement, or marriage.\nHowever, more recently the law has been changed to recognize unmarried fathers and so in relation to children born after 1 December 2003 (England and Wales), 15 April 2002 (Northern Ireland), or 4 May 2006 (Scotland), both of a child’s legal parents have parental responsibility if they are registered on the child’s birth certificate. This applies irrespective of whether the parents are married or not.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q5"},{"s":"During the past 25 years, the incidence of laryngeal cancer","o":["has continued to increase.","has continued to decrease.","has increased for males and decreased for females.","has increased faster for females than for males.","is proportional to the change in smoking practices in the United States."],"k":"D","x":"The female-to-male ratio has increased progressively, even in the presence of a constant proportion of cases in the general population.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q4"},{"s":"Meniere’s disease is an illness in which the etiology is thought to include autoimmunity based on all of the following except","o":["it is often bilateral.","it may coexist with other autoimmune disorders such as rheumatoid arthritis.","the endolymphatic sac is the immune organ of the inner ear.","the presence of a positive otoblot in 32 to 58% of patients with this illness.","animal models of Meniere’s disease have been created through autoimmune mechanisms."],"k":"E","x":"Each of the above choices has merit; however, E is not accurate. There have been no animal models created through autoimmune mechanisms that accurately mimic Meniere’s disease seen in humans with recurring attacks of vertigo and fluctuating hearing loss.","d":"Otology","src":"Ballenger · Autoimmune Inner Ear Disease · Q6"},{"s":"The entire length of the intracranial/intratemporal nerve can be accessed through which approach?","o":["Transcanal","Transmastoid/extended facial recess","Translabyrinthine","Suboccipital","Transcondylar"],"k":"C","x":"The translabyrinthine approach provides exposure of the facial nerve from the brain stem to the stylomastoid foramen.","d":"Otology","src":"Brackmann · Chapter 30 · Q3"},{"s":"The supraglottis contains all of the following except the","o":["epiglottis.","aryepiglottic folds.","false vocal folds.","laryngeal ventricle.","true vocal folds."],"k":"E","x":"The true vocal folds comprise the glottis, which is immediately inferior to the supraglottis.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q1"},{"s":"What proportion of individuals between 65 and 80 years of age have marked loss of olfactory function?","o":["10%","25%","50%","75%","95%"],"k":"C","x":"According to a study in which the University of Pennsylvania Smell Identification Test was administered to 1,955 persons spanning the entire age range, more than 75% of individuals over the age of 80 years evidenced major olfactory impairment, with nearly 50% being anosmic. More than half of persons between 65 and 80 years of age evidenced major olfactory impairment, with nearly a quarter being anosmic. Such losses are significant and place many older persons at risk from fire, leaking natural gas, and spoiled food, as well as from malnutrition from a lack of interest in food secondary to lack of flavor.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q4"},{"s":"Which of the following statements is true regarding environmental modifications for avoiding allergen?","o":["Central air conditioning is not useful to reduce outdoor allergens.","On rainy days, outdoor pollen levels increase.","Washing pets once a month is effective.","Humidifiers require careful cleaning to prevent them from becoming a source of allergen.","Central air conditioning is sufficient to reduce dust mite allergen."],"k":"D","x":"Complete avoidance of the allergen(s) to which the patient is sensitive eliminates symptoms of the disease. Thus, measures aimed at reducing allergen load from the patient’s environment are effective in reducing symptoms. Simple measures can be very effective. Filters used in air conditioning remove outdoor allergens from the air prior to circulation inside a house. Rain profoundly reduces the levels of outdoor pollens. In the case of cats, regular washing of the animal may help decrease allergen load. The use of high-efficiency particulate air (HEPA) filters and of electrostatic filters effectively removes particulates larger than 1 µm in diameter. Particles, however, must be airborne for removal, such as pollens, whereas heavy particles that settle from the air rapidly, such as dust mite feces, are not eliminated by these measures. Although air conditioners can be useful, the critical factor for dust mite allergen control is maintaining a relative humidity of less than 50%. A recent study suggested that air conditioning alone is not always enough to maintain humidity below this critical value. Hence, dehumidifiers can be a useful adjunct measure even in homes with air conditioning. Humidifiers must be cleaned regularly to avoid becoming a source of mold allergens, which thrive in moist environments.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q8"},{"s":"The use of blood, injected through the tympanic membrane into the middle ear, appears to provide a seal of the fistula causing the perilymphatic leak in some cases because","o":["it provides a noninfectious inflammatory response, causing a fibrous tissue seal of the fistula.","the blood clot itself adheres to the fistula, allowing for self-generated seals, as in successful medical management.","the blood incites a change in the proteoglycan composition of the fistula core, altering hydrophilic properties.","the blood clot changes the hydrodynamic differences between the middle ear and inner ear, forcing perilymph into the inner ear rather than allowing it to escape to the middle ear.","there is an indirect effect on the proteoglycans."],"k":"A","x":"All evidence thus far indicates that an initial serum seal (clot) followed by a fibrous tissue ingrowth is the mechanism in the sealing of the fistulous opening. The clot in itself would not be long lasting enough without an inflammatory reaction to allow for the development of a fibrous tissue seal. There is only evidence (histologic) of a seal being provided by new fibrous tissue. However, the possibility of a proteoglycan composition change has not been investigated as a concomitant phenomenon. The hydrodynamics would be in the opposite direction owing to the osmolality of the clot (from inner ear to middle ear).","d":"Otology","src":"Ballenger · Perilymphatic Fistulae · Q7"},{"s":"In a patient presenting with a well-circumscribed T2 squamous cell carcinoma of the left true vocal cord and false cord, a multidisciplinary team recommendation considering all patient factors was to offer surgery. According to the European Laryngological Association Classification for cordectomy, which would be the most appropriate resection to perform for transoral surgical resection of the tumour?","o":["III","IV","Vd","Va","Vc"],"k":"A","x":"Vd is an extended cordectomy involving the ventricle, Va includes the anterior commissure and anterior contralateral cord, Vb includes the arytenoid, and Vc includes resection of the subglottis.\nRemacle M, Eckel HE, Antonelli A, et al. Endoscopic cordectomy. A proposal for a classification by the Working Committee, European Laryngological Society. European Archives of Otorhinolaryngology 2000;257:227-231.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q70"},{"s":"Pott’s puffy tumor is a complication of sinus disease related to","o":["tuberculous sinusitis.","odontogenic infection.","cavernous sinus thrombosis.","frontal sinusitis.","concha bullosa."],"k":"D","x":"Pott’s puffy tumor is a well-circumscribed swelling of the forehead caused by anterior extension of frontal sinusitis. The edema of the skin and soft tissue overlies a collection of pus under the periosteum of the anterior table of the frontal sinus.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q4"},{"s":"A 20-year-old man complains of left-sided nasal obstruction that began spontaneously 2 years ago. There have been no other nasal symptoms, and otolaryngologic examination, including rigid endoscopy, is entirely normal, as was a computed tomography (CT) scan of the sinuses. Medical therapy in the form of intranasal corticosteroids has proved ineffective, and the patient insists that nasal surgery be performed. Which investigation would best clarify the situation?","o":["nasal inspiratory peak flow","anterior active rhinomanometry","olfactory thresholds","magnetic resonance imaging","saccharin test of mucociliary clearance"],"k":"B","x":"Active anterior rhinomanometry will provide information about the airway and will assist in counseling the patient, particularly when surgical intervention is inappropriate. Nasal inspiratory peak flow measures both sides of the nose together and has a broad range of normality. Magnetic resonance imaging is unlikely to be helpful if the CT scan and endoscopy are normal. The nasal and sinus mucosa has a good blood supply and generally gives a high signal; mild inflammatory changes may persist for weeks and months after an upper respiratory tract infection, and this may lead to a confusing overdiagnosis of disease. Tests of mucociliary function will not clarify the cause of the obstruction and are unlikely to be abnormal in the absence of other symptoms.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q3"},{"s":"Which of the following mechanisms describes the most common biomechanics of laryngeal trauma?","o":["laryngeal fracture, resulting in hemoptysis and asphyxiation","striking the laryngeal skeleton against the vertebral column, resulting in a crush injury","laryngeal edema release by sudden acceleration and deceleration of soft tissue, inciting the inflammatory cascade","penetrating injury, resulting in neck crepitance, pneumothorax, and pneumomediastinum","hematoma formation with loss of the airway"],"k":"B","x":"Although the other phenomena related to laryngeal trauma are often present, the mechanism of injury is most commonly the crush effect of compression of the laryngeal framework against a rigid body posteriorly, namely the vertebral column.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q1"},{"s":"A 14-year-old girl is febrile and toxic and has a 2 cm diffuse, tender mass at the angle of the mandible. The ear on that side has been draining for 3 weeks; granulation tissue is seen coming through a perforation of the tympanic membrane, but examination is difficult. Before you obtain a computed tomography (CT) scan, your clinical impression is","o":["masked mastoiditis.","Bezold’s abscess.","coalescent mastoiditis.","cervical adenopathy.","cholesteatoma."],"k":"B","x":"A tender mass in the upper neck in the presence of suppurative otitis is a Bezold’s abscess until proven otherwise. It can occur without any perforation or otorrhea, so it is necessary to obtain a CT scan to verify the presence of mastoiditis.","d":"Otology","src":"Ballenger · Cranial and Intracranial Complications of Acute and Chronic Otitis Media · Q10"},{"s":"Which of the following statements concerning the immediate management of innominate artery rupture is false?","o":["The tracheostomy tube should be replaced with a cuffless tracheostomy tube.","The innominate artery should be compressed digitally against the manubrium.","The patient should be taken to the operating room.","The tracheostomy tube should be replaced with a longer endotracheal tube.","A cardiothoracic surgeon should be summoned."],"k":"A","x":"When massive hemorrhage caused by innominate artery rupture occurs, the tracheostomy tube should be removed and immediately replaced with a longer endotracheal tube to secure the airway below the area of bleeding. Digital pressure should be applied to compress the innominate artery against the manubrium, and the patient should be immediately taken to the operating room for thoracotomy and control of the bleeding vessel.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q6"},{"s":"Hemorrhage into the cochlea with resulting sudden sensorineural hearing loss has been shown to occur in","o":["hypertension.","leukemia.","diabetes.","iron deficiency anemia.","polycythemia vera."],"k":"B","x":"Common vascular disease risk factors such as hypertension and diabetes have not been shown to be associated with increased risk for sudden sensorineural hearing loss, nor have anemia or polycythemia. Inner ear hemorrhage does occur spontaneously and has been associated with leukemia, sickle cell disease, and thalassemia.","d":"Otology","src":"Ballenger · Idiopathic Sudden Sensorineural Hearing Loss · Q4"},{"s":"Regarding fungal sinus disease, which of the following statements is true?","o":["The Aspergillus species are most commonly associated with a fungal ball","Allergic fungal sinusitis is not characterized by eosinophilic mucus within the sinuses","Mucor species have narrow hyphae with branches at a 45-degree angle","Aspergillus species have large, irregularly shaped, non-septate fungal hyphae that branch at right angles","The typical fungal species involved in acute fulminant fungal sinusitis is Aspergillus"],"k":"A","x":"Acute fulminant fungal sinusitis usually occurs in immunocompromised individuals. Rhizopus and Mucor species are common causes of this life-threatening condition. Histologically, fungal hyphae can be seen to invade surrounding tissues causing a vasculitis with thrombosis, haemorrhage, and tissue infarction. Aspergillus species have hyphae which branch at 45-degree angles. Aspergillus species are most commonly associated with a fungal ball (mycetoma). Traditionally, the Bent and Kuhn classification was used to diagnose allergic fungal rhinosinusitis which is associated with eosinophilic-rich mucus.","d":"Rhinology","src":"SBA book · Rhinology · Q70"},{"s":"Which of the following statements concerning botulinum toxin is false?","o":["It is produced by Clostridium botulinum, a Gram-positive anaerobe","Botulinum toxin acts at presynaptic cholinergic neuromuscular end plates by inhibiting the release of acetylcholine","Strains of Clostridium botulinum produce different antigenic toxins","Recovery after administration occurs as the botulinum toxin is degraded by the anticholinesterase enzyme","Following repeated administration, antibodies may develop that bind to the botulinum toxin inactivating it"],"k":"D","x":"Recovery occurs through proximal axonal sprouting and muscle reinnervation by formation of new neuromuscular junctions. Botulinum toxin is produced by Clostridium botulinum, a Gram- positive anaerobic bacterium. Botulinum toxin is broken into seven neurotoxins. The toxin acts\nby binding to presynaptic sites on the cholinergic nerve terminals. This decreases the release of acetylcholine, causing a neuromuscular blockade. The botulinum neurotoxin can be immunogenic and antibodies may develop that can inactivate it.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q19"},{"s":"The most common manifestation of a laryngeal cleft is","o":["aspiration and cyanosis.","asphyxia.","increased mucus production.","airway distress.","recurrent pneumonia."],"k":"A","x":"All of the choices occur in patients with laryngeal clefts. Following aspiration and cyanosis in frequency, there is asphyxia followed by increased mucus production, recurrent pneumonia, and airway distress.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q7"},{"s":"Decreased amplitudes of the auditory brainstem responses commonly observed in older persons are primarily an indicator of","o":["neural degeneration at the level of the cochlear nucleus.","conductive hearing loss.","neural degeneration of the cochlear nucleus and inferior colliculus.","a reduction in synchronized neural activity in the auditory nerve associated with a loss of spiral ganglion cells.","inner ear conductive hearing loss."],"k":"D","x":"The most prominent changes in the physiologic properties of the aging ear are losses of auditory nerve function as indicated by increased thresholds of the compound action potential (CAP) of the auditory nerve. The resulting shallow input-output functions of the CAP are also reflected in shallow input-output functions of auditory brainstem responses. Thus, what appears to be an abnormal function of the auditory brainstem reflects only the abnormal output of the auditory nerve. The reduced amplitudes of action potentials observed in aging ears are probably reflective of asynchronous or poorly synchronized neural activity in the auditory nerve. The pathologic basis of asynchronized activity in the auditory nerve is unknown but probably involves the nature of the synapse between individual auditory nerve fibers and the attachment to the inner hair cell, primary degeneration of spiral ganglion cells, and reductions in the endolymphatic potential.","d":"Otology","src":"Ballenger · Presbyacusis · Q4"},{"s":"Which of the following patient symptom descriptors would suggest that vestibular and balance rehabilitation should be considered as a treatment option?","o":["Patient reports spontaneous spells of vertigo lasting 1 to 2 hours, with no symptoms between the events.","Patient reports a rocking sensation when standing or sitting still with all symptoms absent when in motion.","Patient reports symptoms that are provoked by head or visual motion stimuli producing brief spells of vertigo with no symptoms when the head is still.","Patient reports imbalance only when arising from lying or sitting, lasting seconds, with no other symptoms noted.","Patient reports spontaneous spells of imbalance and vertigo lasting 2 to 3 minutes multiple times per day independent of head position or movement."],"k":"C","x":"Although patients with other symptoms may be appropriate for different aspects of vestibular and balance rehabilitation therapy activities, globally, the ones that are the most appropriate are those with head or visual motion-provoked symptoms and those with functional deficits related to balance and ambulation.","d":"Otology","src":"Ballenger · Evaluation of the Vestibular (Balance) System · Q8"},{"s":"A 22-year-old male presents with left pulsatile tinnitus. A CT scan is arranged. What is the likely diagnosis?","o":["Cholesteatoma","Glomus tympanicum","Glomus jugulare","Persistent stapedial artery","Carotid body tumour"],"k":"D","x":"The stapedial artery is the artery of the second branchial arch. When it persists, it is a branch of the internal carotid artery, passing through the arch of the stapes to become the middle meningeal artery. The latter is normally a branch of the external carotid. The absent foramen spinosum is characteristic.\nF.Ovale } Absent F. Spinosum","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q19","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUF 4H94/JVS7O3jRPe0PtPyWzS0G761aP1OPyWR+gXO3NSif8R+S0qvZ26LgW1aQ/xH5Ka3Z66LcvoT/ePyWAdnbuP5yh8R+Sf4u3hH85b/ABH5JN7O3mQatAj+8fksg7O3jWyKtH4j8lJ7O3b897Qn+8fkp/Fy8IINWh8R+Sqn2cu4IdUoH/Efkkezd0D4atEf4j8kndnLwH+dofEfkj8XLo/+ZQ+I/JB7OXg4q0PiPyT/ABevOO8ofEfkkOz14B/OUPiPyUns9ec95Q+I/JM9n7t35dD4j8kvxdu+e8ofEfkqboF7Oalv9p+Sbuzl5+lofEfkoPZy8n+dofEfkn+L14D/ADtD4j8kz2au43CrQ+I/JL8Xbx3NWhj/AKj8kHs9eH/zKHxH5IHZy7n+cofEfkkezl5+kofEfkl+Ll5+lofEfkq/F69H/m0PiPyS/F27n+cofEfkmezV5EirQ+I/JIdnr1v/AJtD4j8l969D1q+z7F0qNQtLu/qHwnHK/9k="]},{"s":"The following is a list of symptoms and associated diagnoses for dysphagia. Please identify the pair that does not match:","o":["Reduction of the oral phase of swallowing and Parkinson’s disease","A sudden onset of dysphagia in a patient with prior symptoms is suggestive of an oesophageal stricture","Recurrent chest infections with a history of rheumatoid arthritis","Odynophagia and a background of iron deficiency anaemia","Gradual-onset dysphagia worse at the end of day is suggestive of myasthenia gravis"],"k":"A","x":"In general, a prolonged oral phase of swallowing is noted in Parkinson’s disease with\na symptom known as ‘tongue pumping’ (an ineffective extrusion and retraction of the tongue) being pathognomonic for the disease. A delayed pharyngeal phase is also recognized. Although xerostomia is a recognized side effect of levodopa, often patients exhibit drooling due to abnormal neck positioning and reduced spontaneous swallowing.\nA sudden onset of dysphagia may indicate a food bolus. A barium swallow should be performed with recurrent symptoms to exclude a stricture.\nCricoarytenoid joint arthritis can cause fixation and resultant aspiration.\nIn patients presenting with odynophagia, particularly in association with iron deficiency anaemia, a hypopharyngeal malignancy should be excluded with direct visualization.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q79"},{"s":"Contraindications to canal wall reconstruction tympanomastoidectomy include","o":["Mastoid cholesteatosis","Sinus tympani involvement","Facial paralysis","Tegmen defect with meningoencephalic herniation"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 14 · Q5"},{"s":"The main proximate cause of death in AIDS patients is","o":["Kaposi’s sarcoma.","trauma.","squamous cell carcinoma.","opportunistic infection.","suicide."],"k":"D","x":"Opportunistic infections have remained the proximate cause of death for nearly all AIDS patients. The other causes are much less frequent.","d":"General","src":"Ballenger · Acquired Immune Deficiency Syndrome · Q9"},{"s":"A patient underwent gamma knife surgery of a 2.3-cm CPA vestibular schwannoma 6 months ago. MRI performed today shows the tumor to be 2.7 cm in maximal diameter. The patient is asymptomatic. The next best course of action is","o":["Assure patient this is normal and rescan in 6 months","Recommend microsurgical resection for radiation failure","Counsel patient this may be malignant","Plan a second round of gamma knife surgery","Start high-dose steroids with a taper"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 65 · Q4"},{"s":"The best method of assessing lower lid position on the paralyzed side of the face is","o":["Ask the patient how much the lid position has changed.","Assess the position with straight ahead gaze.","Assess the position with up gaze.","Assess the position with down gaze.","The gaze of the patient should be directed such that the limbus of the contralateral lid is placed just tangential to the inferior limbus."],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 61 · Q4"},{"s":"The treatment of choice for verrucous carcinoma is","o":["surgical resection followed by chemotherapy.","surgical resection followed by radiation therapy.","chemotherapy followed by radiation therapy.","radiation therapy followed by chemotherapy.","surgical resection."],"k":"E","x":"Verrucous carcinoma rarely metastasizes; surgical resection is the treatment of choice.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q8"},{"s":"Which of the following statements concerning the etiology and incidence of aural atresia is false?","o":["Atresia and microtia are associated with several known syndromes.","Aural atresia occurs in approximately 1 in 100,000 live births.","Although the inner and middle ears develop separately, inner ear abnormalities coexist in 12 to 50% of cases.","Atresia is bilateral in 30% of cases, occurring more commonly in males and in the right ear.","It is not surprising that an embryonic insult severe enough to cause aural atresia would also affect other organ systems."],"k":"B","x":"Atresia and microtia are associated with several known syndromes felt to be associated with inherited defects or acquired embryopathies owing to intrauterine infection (rubella, syphilis), ischemic injury (hemifacial microsomia), or toxin exposure (thalidomide, isotretinoin). The genetic basis of external and middle ear anomalies generally remains poorly characterized. Aural atresia occurs in approximately 1 in 20,000 live births. Although the inner and middle ears develop separately, inner ear abnormalities coexist in 12 to 50% of cases. Atresia is bilateral in 30% of cases, occurring more commonly in males and in the right ear. It is not surprising that an embryonic insult severe enough to cause aural atresia would also affect other organ systems.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q3"},{"s":"Complications associated with craniofacial resection include","o":["anosmia.","dacryocystitis.","meningitis.","pneumocephalus.","all of the above."],"k":"E","x":"The complication of anosmia is expected and would be viewed as a side effect. Dacryocystitis occurs among patients who have resection of the ethmoid or maxillary sinus. It can be minimized by performing a dacryocystorhinostomy. Meningitis and pneumocephalus are also known complications of cranial base surgery. The risk of pneumocephalus can be minimized with tracheostomy. The risk of cerebrospinal fluid leak and meningitis is minimized with the use of galeopericranial flaps for skull base reconstruction.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q10"},{"s":"According to the Lund—Mackay grading system for sinus opacification, what would be the score for this CT scan of the paranasal sinuses?","o":["Zero","Two","Six","Eight","Ten"],"k":"C","x":"The Lund—Mackay score is calculated by scoring each sinus complex (maxillary, anterior ethmoids, posterior ethmoids, frontal and sphenoid sinuses) 0-2, where 0 = absence, 1 = partial, and 2 = complete opacification. The osteomeatal complex is scored (0 = clear or 2 = obstructed). A maximum score of 24 is possible.\nThis series of scans is scored as: right anterior ethmoids = 1; right maxillary sinus = 1; right osteomeatal complex = 2; and left osteomeatal complex = 2 each. Total = 6.","d":"Rhinology","src":"SBA book · Rhinology · Q17","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAJWAu4BAREA/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QARxAAAgECBQIDAgoJAwMFAAIDAQIAAxEEBRIhMQZBEyJRMmEHFBZTcZGSsbLRIzU2QlRzdIGhFTNSJENEJTRiwfAmcmTh8f/aAAgBAQAAPwDyzqOtVHUGZgVHt8bq/vH/AJma/wAer86/2jDx6vzr/ah49X51/tReNV+df7Rh49X51/tGPx6vzr/ah49X51/tQ8er86/2ojXq/Ov9owFar86/2jA16vzr/aMPHqj/ALr/AGjDx6vzr/aMPGrfOv8AaMPGrfOv9ow8at86/wBow8at86/2jDxq3zr/AGjH49X51/tQ8er86/2oePV+df7UXjVfnX+0Y/Hq/Ov9ow8er86/2oePV+df7UPHq/Ov9qHj1fnX+1Ea1X51/tGHjVfnX+0Y/Hq/Ov8AaiNer86/2jAVqvzr/aMDXq/Ov9ow8ar86/2jH49X51/tQ8er86/2ovGq/Ov9ow8eqP8Auv8AaMPGq8+I/wBox+NV+dqfaMDWq3/3X+0ZsMow9XF1hrqOV/8A7GdNSybChR4he/8A/czYU2+L4bwqTsANh5o/GfQBrYlffDx6m7Evudt5PCVnes+t2FhtvMHMMEcQKjB3vyPMZx2YUsRhapBepa//ACMxDWq9qr/aMPHq2/3X+0YeNW+df7Ri8ar86/2jDxqw/wC6/wBox+PV+df7UPHq/Ov9qI16vzr/AGjDxqvzr/aMfj1fnX+1Dx6vzr/ah49X51/tReNV+df7Rh41b51/tGHjVvnX+0YeNW+df7Rh41b51
