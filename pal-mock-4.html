<script>
const P={"title":"ENT Mock Exam — Paper 4","q":[{"s":"Regarding mucocoeles and the frontal sinus, which of the following statements is false?","o":["A mucocoele will demonstrate hyperintensity on T2 MRI","A posterior ethmoid mucocoele may cause orbital apex syndrome","Orbital apex syndrome only involves either or all cranial nerves, III, IV, V1, or VI","Pott’s puffy tumour may occur after trauma","The frontal sinuses are not present at birth"],"k":"C","x":"Most commonly mucocoeles are hyperintense on T2-weighted MRI scans due to the rich water content. It should be appreciated that colonization with fungus can lead to a very low signal on both T1- and T2-weighted sequences, mimicking a normal aerated sinus. Superior orbital fissure syndrome, whether due to trauma or infection, involves the following structures: cranial nerves\nIII, IV, V1, and VI along with the ophthalmic vein, and sympathetic fibres. The symptoms include ophthalmoplegia, ptosis, ipsilateral forehead paraesthesia, and a fixed dilated pupil. This contrasts with orbital apex syndrome which features the same symptoms, but the involvement of the optic nerve also gives visual change or even blindness. The frontal sinuses usually develop around the age of 2 years and grow further around 6 or 7 years of age and are not completely formed until the early teenage years. Trauma to the frontal sinus drainage system may lead to obstruction and thus infection.","d":"Rhinology","src":"SBA book · Rhinology · Q72"},{"s":"The indications for staging tympanoplasty include which of the following?","o":["Mucosal disease","Stapes fixation","Concern of residual cholesteatoma","All of the above"],"k":"D","x":"All are well-recognized indications.","d":"Otology","src":"Brackmann · Chapter 18 · Q1"},{"s":"Which of the following statements apply to the postoperative period following cartilage tympanoplasty?","o":["Eardrum intubation, if necessary, will likely require a trip to the operating room.","A tympanogram may be unreliable.","A second-look surgery may be required in cases of cholesteatoma removal.","Persistent effusion is the most significant complication.","All of the above"],"k":"E","x":"While the tympanic membrane remains relatively insensate after cartilage reconstruction, it is often necessary to take the patient to the operating room for eardrum intubation as tube placement can be difficult. Impedance tympanometry is unreliable after cartilage tympanoplasty and will generally yield a low-volume, type B tympanogram, despite normal hearing, due to the noncompliant nature of the cartilage. One serious disadvantage of using cartilage for reconstruction in cholesteatoma surgery is that it creates an opaque tympanic membrane posteriorly, which could potentially hide residual disease. If disruption of the cholesteatoma sac occurs, consider the advisability of performing a second-look surgery.The most significant pitfall seen in the postoperative period is persistent effusion with conductive hearing loss, requiring intubation of the reconstructed eardrum.This is seen in about 7% to 10% of cases and can be problematic in cases in which the entire tympanic membrane is reconstructed with the cartilage/perichondrium island flap.","d":"Otology","src":"Brackmann · Chapter 10 · Q5"},{"s":"Which of the following patients is not a candidate for immunotherapy?","o":["an asthmatic who occasionally uses an albuterol inhaler","a woman 8 weeks pregnant","a man on a calcium channel blocker for hypertension","a college student who has had poor symptom control","an allergic rhinitic patient with year-round symptoms"],"k":"B","x":"Indications for immunotherapy have evolved over years of clinical experience. The primary indication is symptoms not adequately controlled by avoidance measures and pharmacotherapy. Patients with perennial symptoms may prefer immunotherapy to daily medication. Proper resuscitative equipment should be present because anaphylactic reactions can occur any time during treatment, even in patients receiving maintenance dosages. Factors that seem to contribute to increased complications, including fatalities, seem to be labile, corticosteroid-dependent asthma that has required prior hospitalizations, high sensitivity to allergen (as demonstrated by serum-specific Immunoglobin E tests or skin test), and a history of prior systemic reactions. Therefore, immunotherapy in symptomatic asthmatic patients should be administered with extreme caution because these patients have the greatest morbidity. Patients who are taking beta blockers should not receive immunotherapy because, if anaphylaxis occurs, they cannot be resuscitated. Immunotherapy should not be started in pregnant women because of the risk of anaphylaxis and the resultant effect of hypotension on the fetus.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q10"},{"s":"What are the intracranial structures that can be exposed by the transcochlear approach?","o":["Arcuate eminence, middle meningeal artery, greater and lesser superficial petrosal nerves, V3, V2, and VI entering into the superior orbital fissure","The jugular foramen and foramen magnum","Cerebellum and middle cranial fossa","Entire lateral aspect of the pons and upper medulla, cranial nerves V through XI, as well as the midbasilar artery"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 52 · Q4"},{"s":"Which of the following bones do not form part of the osteology of the lateral nasal wall?","o":["Maxilla","Palatine","Ethmoid","Perpendicular plate of the sphenoid","Inferior turbinate"],"k":"D","x":"The lateral nasal wall is formed by the bones of the maxilla, palatine, ethmoid, lacrimal, and inferior turbinate.","d":"Rhinology","src":"SBA book · Rhinology · Q5"},{"s":"Achild presents with a normal auricle, complete external ear canal atresia, and normal middle ear and ossicles. What is the likely timing of the insult that would have caused these changes?","o":["0-15 weeks’ gestation","15-25 weeks’ gestation","25-40 weeks’ gestation","Postnatal","It is not possible to predict the timing"],"k":"C","x":"Auricular formation occurs in the first trimester. By week 12 the auricle is formed by fusion of the hillocks of His and is adult-shaped by week 20. Formation of the middle ear begins at week\n10 and the ossicles are adult-sized by 16 weeks. The external ear canal develops from the ectoderm of first pharyngeal groove. This forms a solid core which does not hollow out until week 28.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q7"},{"s":"Concerning reconstructive flaps, which of the following statements can be considered incorrect?","o":["A full-thickness skin graft contains the epidermis and the whole of the dermis","A full-thickness skin graft will usually give a better cosmetic result than a split skin graft","Most local skin flaps on the face are random pattern flaps deriving their blood supply from the dermal—subdermal plexus","With a local advancement flap, Burrows triangles may allow the flap to sit better","A ratio of 1:2 pedicle width to flap length should be strictly adhered to on the face"],"k":"E","x":"In general, a ratio of 1:2—-3 pedicle width to flap length is advised. However, on the face this can often be increased to 1:4—5 due to the excellent blood supply.\nA full-thickness skin graft (FTSG) contains the epidermis and the whole of the dermis in contrast to a split-thickness skin graft that contains the epidermis and less than the whole of the dermis. FTSGs do give better cosmetic results.","d":"Rhinology","src":"SBA book · Rhinology · Q40"},{"s":"Appropriate surgical management of Bell’s palsy involves all of the following except","o":["Complete paralysis of less than 14 days’ duration","A transmastoid approach","Greater than 90% duration on electroneurography performed at least 72 hours after the onset of complete paralysis","Lack of voluntary motor unit potentials on facial electromyogram","Bony decompression of the labyrinthine, geniculate, and proximal tympanic segments"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 28 · Q4"},{"s":"Concerning noise-induced hearing loss, which of the following statements is most appropriate?","o":["The inner hair cells are more susceptible to damage than the outer hair cells","Intermittent noise exposure is more harmful than continuous noise exposure at a similar frequency and intensity","Noise-induced hearing loss occurs because a temporary threshold shift does not occur","Hair cell regeneration takes up to 10 years","A 10 dB increase in sound level involves a tenfold increase of the sound intensity"],"k":"E","x":"The decibel scale is calculated based on the 10 log,, (Ix/lo) formula, where Ix is the sound intensity being measured and lo is a reference intensity. Each 10 dB increase represents a tenfold increase in the intensity of sound (log,,10 = 1).\nThe outer hair cells are more susceptible than the inner hair cells. Continuous noise is more damaging than intermittent noise of the same frequency and intensity. Theories concerning noise-induced hearing loss include metabolic exhaustion of the hair cells following the temporary threshold shift that occurs in noise exposure. The hair cells do not regenerate.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q11"},{"s":"Regarding disorders of smell, which of the following statements is false?","o":["In suspected malingering, ammonia is used to test the facial nerve function","They are generally classified into conductive and sensorineural causes","They are common in patients who have had a total laryngectomy","They may be an early sign of Alzheimer’s disease","Anosmia is present in Kallmann syndrome"],"k":"A","x":"In suspected malingering, a noxious stimulus such as ammonia tests the trigeminal nerve. Conductive causes of anosmia include inflammation—rhinosinusitis, polyps, and nasal masses including gliomas and encephalocoeles. Sensorineural causes include vitamin and mineral deficiencies such as zinc and vitamin A; head trauma, which causes shearing of the olfactory nerves; and viral infections. An important sensorineural cause of anosmia is neurological degenerative diseases\nsuch as Alzheimer’s disease. Kallmann syndrome is caused by failure of the pituitary to release gonadotropin-releasing hormone, preventing the patient entering or completing puberty. Kallmann syndrome differs from other hypogonadotropic hypogonadism disorders due to the associated disorder of smell.","d":"Rhinology","src":"SBA book · Rhinology · Q62"},{"s":"Which of the following statements is false concerning cervical vestibular evoked myogenic potentials (cVEMPs)?","o":["They test the otolithic organ","The needle is inserted into the ipsilateral sternocleidomastoid","Superior semicircular canal dehiscence produces a reduced cVEMP response","The test assesses otolithic organ function in the saccule and utricle","The test must be performed with the head at a 45-degree angle and the test subject’s head raised off the bed"],"k":"C","x":"VEMPs assess otolithic organ function thought to occur due to residual evolutionary hearing potential. The test is performed with sound stimulation and recording either ipsilateral sternocleidomastoid activation (cVEMP) or nystagmus (ocular VEMP). Superior semicircular canal dehiscence produces suprathreshold bone conduction along with increased VEMP activity.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q45"},{"s":"A 53 year old male with a T1N1 (TNM 8) p16 positive scc of the left tonsil is presented and discussed in the head and neck MDT. Following discussion with the patient in clinic, a plan of transoral oropharyngeal resection and ipsilateral neck dissection is planned as the initial mode of treatment. Which best describes your surgical plan?","o":["TORS left oropharyngeal resection, followed by left selective neck dissection including evels 2 to 4.","TORS left oropharyngeal resection, followed by left modified radical neck dissection.","Left selective neck dissection including levels 2 to 4 and ligation of lingual and facial external carotid vessels, followed by left TORS oropharyngeal resection.","Left modified radical neck dissection including ligation of lingual and facial external carotid vessels, followed by left TORS oropharyngeal resection.","Left selective neck dissection including levels 2 to 4 and ligation of the facial and maxillary external carotid vessels, followed by left TORS oropharyngeal resection."],"k":"C","x":"There is evidence to suggest a reduction in the severity of post operative haemorrhage in transoral oropharyngeal resection following ligation of external carotid artery branches. The branches most commonly ligated are lingual and facial, and less frequently ascending pharyngeal.\nKu bik et al. Effect of transcervical arterial ligation on the severity of postoperative haemorrhage after transoral robotic surgery. Head Neck. 2017 Aug; 39(8): 1510-1515.\nGleys teen et al. The impact of prophylactic external carotid artery ligation on postoperative\nbleeding after transoral robotic surgery (TORS) for oropharyngeal squamous cell carcinoma. Oral Oncology, Volume 72, September 2017, Pages 190-191","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q64"},{"s":"The most effective pharmacotherapeutic agents for nasal polyposis are","o":["antihistamines.","topical corticosteroids.","topical decongestants.","nonsteroidal anti-inflammatory drugs.","β-agonist inhalers."],"k":"B","x":"Of the choices given, the only agents that have any beneficial effect in the management of nasal polyposis are topical corticosteroids. Nasal polyps may be related to allergy in some patients, but antihistamines alone do not typically cause polyps to regress. Decongestants and β-agonist inhalers have no specific role in the treatment of nasal polyposis, and among nonsteroidal anti-inflammatory drugs, aspirin can actually cause polyp formation in sensitive individuals.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q10"},{"s":"Which of the following statements is true regarding recurrence and metastases from laryngeal carcinoma?","o":["The incidence of distant metastasis by site is highest for lung, followed by bone and liver.","The risk of metastasis by site is highest for subglottic tumors followed by supraglottic and glottic.","Bone metastases, although less common than lung, allow longer average survival.","Parastomal recurrence is usually unresectable.","The dysphagia associated with incurable laryngeal cancer may be palliated by swallowing therapy."],"k":"D","x":"The most common site of distant metastasis is the lung, followed by the liver and bone. Metastasis to bone typically portends a survival time of less than 4 months; metastasis to lung has an average survival of 12 months. Parastomal tumor recurrence carries a poor prognosis, although recurrences above the equator of the stoma may be resectable. Lesions with the highest risk of distant metastasis are those in the supraglottis that extend to the hypopharynx and piriform sinus. Glottic primaries are the least likely to metastasize. Dysphagia associated with advanced, recurrent laryngeal cancer is probably best palliated with a gastric feeding tube.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Larynx and Laryngopharynx · Q10"},{"s":"Regarding the ageing face, which of the following statements is true?","o":["Thinning of the papillary dermis caused by decreased collagen synthesis occurs with ageing in adult life","Ageing is associated with increased subcutaneous fat","Loss of the dermal layer has no effect on skin elasticity and moisture","Prejowel depressions are also known as nasolabial lines","Ultraviolet (UV) exposure does not affect elastin degradation within the dermis"],"k":"A","x":"The ageing face is due to changes within all layers: skin, fat, muscle, and bone. Ageing is associated with thinner, drier, and less elastic skin. Loss of elastin gives less elastic skin and loss of hyaluronic acid gives the skin less moisture. Loss of subcutaneous fat occurs in the ageing face. Prejowel depressions are also known as marionette lines. Nasolabial folds are known as smile\nor laughter lines and run from each side of the nose to the corners of the mouth. UV exposure (photoageing) degrades elastin (solar elastosis) within the dermis giving the ageing skin less elasticity.","d":"Rhinology","src":"SBA book · Rhinology · Q65"},{"s":"A dislocated subcondylar fracture of the mandible in a child should usually be treated by","o":["open reduction and replacement of the condyle into the glenoid fossa.","fixation of the reduced fragment with a miniplate.","intermaxillary fixation for 6 weeks.","intermaxillary fixation for 2 weeks.","no fixation and a soft diet."],"k":"D","x":"Children will remodel and even reform a new condyle over a period of 1 to 2 years. Intermaxillary fixation to relieve pain is followed by a period of oral physiotherapy to mobilize the jaws. Open reduction and internal fixation often result in avascular necrosis of the condyle and severe temporomandibular joint dysfunction.","d":"H&N / Plastics / Trauma","src":"Ballenger · Facial Fractures · Q4"},{"s":"All of the following are most commonly associated with longitudinal temporal bone fractures except","o":["Frontal/occipital impact","Conductive hearing loss","Ossicular damage","Bloody otorrhea","Fracture through the foramen ovale"],"k":"A","x":"Frontal/occipital impact is most commonly associated with transverse temporal bone fractures.","d":"Otology","src":"Brackmann · Chapter 29 · Q2"},{"s":"Which of the following statements is correct regarding promontory drilling?","o":["It cannot be done with patient under local anesthesia.","It will cause sensorineural hearing loss.","It will yield poorer hearing results in stapedectomy.","It should be done in a superior to inferior direction.","It should be done in a medial to lateral direction."],"k":"E","x":"Promontory drilling begins at the footplate promontory junction and sweeps laterally. All other statements are false.","d":"Otology","src":"Brackmann · Chapter 25 · Q2"},{"s":"An 11-month-old child presents with an enlarging mass over the dorsum of the nose that has a negative Furstenberg’s sign. Which of the following is the most likely diagnosis?","o":["Encephalocoele","Meningocoele","Nasolabial cyst","Dermoid cyst","Thornwald’t cyst"],"k":"D","x":"A dermoid cyst is derived from ectoderm and mesoderm and presents as a slow- growing painless mass anywhere from the glabella of the nose to the tip. About 20% may show an intracranial communication, hence a preoperative MRI scan is mandatory.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q45"},{"s":"Which of the following statements are true about reparative granuloma?","o":["A reparative granuloma is a controversial entity whose modern existence is in doubt.","It may be due to retained ethylene oxide in gelfoam wire prostheses.","The attributed symptomatology may be explained by serous labyrinthitis.","The presentation can be explained by expected postoperative findings.","All of the above"],"k":"E","x":"","d":"Otology","src":"Brackmann · Chapter 22 · Q5"},{"s":"Which of the following symptoms are not likely to be improved after SCD plugging?","o":["Disorientation when rapidly rotating the head to look at something on the floor","Disorientation and oscillopsia in response to loud noise","Disturbing sound of one’s own voice","Pulsatile tinnitus"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 42 · Q4"},{"s":"Which of the following clinical findings is most consistent with the diagnosis of Bell’s palsy?","o":["Progression to complete paralysis over 1–7 days","A palpable parotid mass","Recent hearing loss associated with the facial paralysis","Other cranial neuropathies associated with the onset of the facial paralysis","Continued complete facial paralysis 3–6 months after the initial onset"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 28 · Q2"},{"s":"Proper workup and management of a patient with vocal fold hematoma and mild supraglottic edema on flexible laryngoscopy include all of the following except","o":["elevation of the head of the bed.","open exploration.","voice rest.","humidified air.","Computed tomography (CT) scan of the larynx."],"k":"B","x":"The described injuries are minor and can be managed with conservative measures, including elevation of the head of the bed, voice rest, and humidification. A CT scan would be helpful in assessing the full extent of the injuries. Open reduction is not indicated at this time because there are no mucosal lacerations, displaced fractures, or exposed or dislocated cartilages.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q6"},{"s":"The most common site of encephalocele formation is:","o":["Middle fossa","Posterior fossa","Ear canal","Middle ear","Oval window"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 20 · Q5"},{"s":"A patient with HIV is placed on the waiting list for a parotidectomy. You are keen to warn the operating department staff of his infection risk. When the operating list is printed, which of the following is generally acceptable to use to highlight his status?","o":["HIV positive","High-risk","AIDS","Special","None of the above—t is not ethical to highlight his status on a circulated list"],"k":"B","x":"The theatre staff should be alerted to his high-risk status, but it is not acceptable to state the exact reason.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q28"},{"s":"What is the best result (House-Brackmann grade) in terms of facial nerve function after exploration and primary anastamosis?","o":["I","II","III","IV","V"],"k":"C","x":"The best surgical result that can be attained after primary anastamosis is House-Brackmann III.","d":"Otology","src":"Brackmann · Chapter 29 · Q5"},{"s":"The following are adverse features of a thyroid nodule on ultrasound except:","o":["A solid hypoechoic area compared to the thyroid","Microcalcification","The nodule is described as taller greater than wide","Peripheral vascularity","Lobulated outline"],"k":"D","x":"All of the other options as well as intranodular vascularity, globular calcification, and associated lymphadenopathy are suspicious features. Peripheral vascularity is a benign feature. Ultrasound features are classified by a U grading from U1 (normal) to U5 (malignant).","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q65"},{"s":"What is the best approach for surgical decompression of the facial nerve in a patient who has complete hearing loss on the paralyzed side?","o":["Transmastoid","Translabyrinthine","Middle cranial fossa","Suboccipital","None of the above"],"k":"B","x":"In a patient without residual hearing, the preferred approach is translabyrinthine because it provides adequate exposure of the perigeniculate area without many of the risks of serious complications associated with the middle cranial fossa approach.","d":"Otology","src":"Brackmann · Chapter 29 · Q4"},{"s":"Regarding nasal tip support mechanisms, which of the following statements is false?","o":["The medial and lateral crura are major tip support mechanisms","The cartilaginous nasal septum is a minor tip support mechanism","Attachment of the upper lateral cartilages to the lower lateral cartilages is a minor tip mechanism","Attachment of the upper lateral cartilages to the lower lateral cartilages is referred to as the scroll area","Medial crural footplate attachment to the caudal quadrilateral cartilage is a major tip support mechanism"],"k":"C","x":"Major tip support mechanisms include the lower lateral cartilages, attachments of the medial crura of the lower lateral cartilages to the caudal septum, and the attachment of the lower lateral cartilages with the upper lateral cartilages (the region termed the ‘scroll area’).\nMinor tip support mechanisms include the soft tissues of the septum, the nasal spine, the soft tissue attachments of the skin and muscle to the alar cartilages, and the nasal dorsum including the dorsal septum and the upper lateral cartilages.","d":"Rhinology","src":"SBA book · Rhinology · Q60"},{"s":"A 79-year-old man presents to the clinic with left-sided nasal discharge and obstruction. A mass is found arising from the ethmoid sinuses and histology shows an adenocarcinoma. Which of the following is the most significant risk factor for developing this disease?","o":["Smoking","Alcohol","AandB","Wood dust","Asbestos"],"k":"D","x":"Hardwood dust is a recognized risk factor for the development of adenocarcinoma of the ethmoid sinuses. The link was first made in High Wycombe, UK, where there was a large number of workers in the furniture industry.","d":"Rhinology","src":"SBA book · Rhinology · Q20"},{"s":"A baby is due to undergo newborn hearing screening programme (NHSP)/congenital hearing loss investigations after spending 72 hours in a neonatal intensive care unit (NICU) when born. Which of the following investigations should be arranged as first line in this child?","o":["Distraction testing","Automated otoacoustic emission (OAE)","Automated OAE and full audiological assessment at 6 months","Automated OAE and auditory brainstem response (ABR)","ABR and a MRI scan"],"k":"D","x":"The NHSP consists of two pathways: the well baby pathway and the special care baby\nunit (SCBU/NICU) baby pathway. Babies who have spent 48 hours in SCBU or NICU should be referred through the second pathway where the first-line screening investigations consist of both an automated OAE and an automated ABR.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q40"},{"s":"Regional metastases to cervical lymph nodes decrease 5-year survival rates by","o":["10%.","20%.","50%.","80%.","90%."],"k":"C","x":"The 5-year survival rate of patients with metastases to cervical lymph nodes is approximately 50% that of patients without regional lymph node metastases.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q4"},{"s":"Regarding the first branchial arch, which of the following statements is false?","o":["Skeletal components include Meckel’s cartilage, the malleus, and the incus","The first branchial arch cleft contributes to all three layers of the tympanic membrane","Work classified first branchial arch fistulas into type 1 and type 2","Type 1 is composed of ectoderm","Type 2 is intimately related to the parotid gland and facial nerve"],"k":"B","x":"The first branchial arch cartilage is otherwise known as Meckel’s cartilage which forms\nthe incus, malleus, sphenomandibular ligament, and the lingula of the mandible. The tympanic membrane is formed of three layers. The superficial ectodermal layer and the middle mesodermal layer are formed from the first branchial cleft. The first branchial pouch contributes to the mucosal layer (endoderm) of the tympanic membrane, the middle ear, and Eustachian tube. Abnormalities of the first branchial cleft are commonly classified by the Work classification system, but other classification systems have been described by Arnot and Olsen","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q33"},{"s":"A woman of 30 years develops significant collapse of the nasal bridge after a septoplasty. She had felt generally unwell and had developed some crusting and spotting of blood from the nose. Endoscopic examination reveals a generally friable mucosa throughout the nose that bleeds easily and is associated with generalized crusting. The next step is to","o":["offer her reconstructive surgery.","perform a computed tomography (CT) scan.","take a biopsy of the nasal mucosa.","obtain blood tests.","perform a bone scan."],"k":"D","x":"Although collapse of the nasal bridge can occur if excessive cartilage is removed, in the patient who feels generally unwell and who has developed some crusting and spotting of blood from the nose, it is important to exclude granulomatous conditions such as Wegener’s granulomatosis or sarcoidosis. This may be done with specific and nonspecific tests such as the erythrocyte sedimentation rate, C-reactive protein, antineutrophil cytoplasmic antigen (c-ANCA), and angiotensinconverting enzyme. Biopsy in Wegener’s granulomatosis is not pathognomonic, although a biopsy may show you a noncaseating epithelioid granuloma in sarcoidosis. Neither a CT scan nor a bone scan will confirm the diagnosis of these conditions.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q2"},{"s":"The distinction between a tympanomastoid glomus tympanicum versus a tympanomastoid glomus jugulare is","o":["Visible mass in a tympanicum","Erosion of jugular bulb","Erosion of carotid canal","Middle ear and mastoid involvement","Secretion of vasoactive chemicals"],"k":"B","x":"Jugulare tumors arise from the jugular bulb.","d":"Otology","src":"Brackmann · Chapter 46 · Q1"},{"s":"All except one of the following signs are oral manifestations of leukemia:","o":["gingival hypertrophy","atrophic smooth erythematous tongue","necrotic ulcers of the mucous membranes","pallor of the mucous membranes","petechiae of the mucous membranes"],"k":"B","x":"In addition to being anemic and thrombocytopenic, patients with leukemia are often neutropenic, and secondary infections of the oral cavity and oropharynx commonly occur, resulting in necrosis and ulceration of the mucous membranes. Leukemic infiltration of the gums is common, causing gingival hypertrophy, edema, inflammation, and bleeding.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q2"},{"s":"In the Myer—Cotton grading of subglottic stenosis, a 60% stenosis would be:","o":["Grade I","Grade II","Grade III","Grade IV","None of the above"],"k":"B","x":"The Myer—Cotton grading system describes the percentage of tracheal stenosis:\n* Grade |: 0-50% * Grade II: 51-70% * Grade III: 71-99% * Grade IV: complete obstruction. Stridor at rest occurs in stenoses of approximately grade III and above.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q20"},{"s":"Stuttering behaviors during speech production by children often cause parents to become anxious. The parents of a young child with incipient stuttering should","o":["subject the child to direct speech therapy for the disorder as soon as possible.","focus their attention on the child and tell the child to “speak correctly.”","be attentive, thoughtful, but nonevaluative listeners.","take the child to a psychologist.","imitate the child’s stuttering so that the child can hear how bad (or silly) it sounds."],"k":"C","x":"Anything that brings attention to the problem of incipient stuttering usually makes it worse. If the parents can simply accept what is a fairly typical behavior in young children, the child usually will pass through this stage and continue to develop communication skills in a normal manner. Only after the stuttering behavior has been present for 6 months to a year, or if the stuttering behaviors reflect more struggle on the part of the child, should the child be brought to the attention of a speech-language pathologist who specializes in treatment of stuttering in children.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q9"},{"s":"Which of the following best describes Koerner’s septum?","o":["The petrosquamous suture","The squamotympanic suture","The petrotympanic suture","The medial limit of the mastoid antrum","The bony covering of the sigmoid sinus"],"k":"A","x":"Koerner’s septum is the petrosquamous suture and is the lateral-most limit of the mastoid antrum. In dissection of the temporal bone, therefore, it is opened medial to the mastoid air cells before entering the antrum.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q2"},{"s":"A 4-year-old child presents with a rapidly enlarging right parotid mass and facial palsy. Ultrasonography confirms an intraparotid mass. What is the most common malignant process in this situation?","o":["Squamous cell carcinoma","Lymphoma","Mucoepidermoid carcinoma","Rhabdomyosarcoma","Adenoid cystic cell carcinoma"],"k":"C","x":"Mucoepidermoid carcinoma is the commonest malignant salivary gland tumour in children. Most are low grade and have a good prognosis.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q16"},{"s":"Unilateral rhinorrhea not related to postoperative cerebrospinal fluid leak following skull base surgery occurs from","o":["Loss of sympathetic fibers along the internal carotid artery","Loss of parasympathetic fibers along the internal carotid artery","Pterygopalatine nerve ablation","Sinusitis","Hematoma liquefaction"],"k":"A","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 54 · Q5"},{"s":"In the classification of autoimmune inner ear disease proposed by Harris, all of the following are correct except","o":["otoblot for a 68 kD (HSP 70) antigen is usually found to be positive and a predictor of an autoimmune basis in each classification.","rapidly progressive bilateral sensorineural hearing loss can be seen in a setting of other inflammatory illnesses such as Lyme disease.","Cogan’s syndrome has a unique antigen target (55 kD).","the inner ear may be the only target of an autoimmune condition.","some patients with delayed contralateral endolymphatic hydrops have an autoimmune basis."],"k":"A","x":"Otoblot for a 68 kD antigen is not uniformly helpful in all autoimmune conditions that affect the inner ear; for example, in Cogan’s syndrome, for which the target antigen is found to be a 55 kD antigen, or in type 4, for which there is an associated inflammatory condition, they have been found to be otoblot negative.","d":"Otology","src":"Ballenger · Autoimmune Inner Ear Disease · Q7"},{"s":"A 3-year-old child presents with a discharging sinus below the pinna. On closer inspection, you notice a sinus opening in the external auditory canal. What would be the next appropriate step?","o":["Proceed to excision, excising an ellipse of skin and removing the whole tract","Arrange a fistulogram to assess the course of the fistula","Arrange an ultrasound scan","Refer the child to the paediatricians because they may have multiple anomalies","Arrange a magnetic resonance imaging (MRI) scan"],"k":"E","x":"This is a first branchial cleft fistula (collaural fistula). These congenital fistulas can take a course close to the facial nerve. From the possible answers given, MRI is the most appropriate answer, although some surgeons would proceed to surgery directly, with identification of the facial nerve via a modified Blair (‘lazy S’) incision.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q1"},{"s":"Which of the following statements is incorrect with regard to radiotherapy?","o":["The maximum dose to the spinal cord is 45 Gy","Ulcerated tumours are most susceptible to radiation treatment","Cells are most radioresistant in the S phase of the cell cycle","A higher dose of radiation is required to kill hypoxic cells","Tumours that are chemosensitive are likely to be radiosensitive"],"k":"B","x":"Exophytic tumours are most susceptible to radiation therapy. Tumours are most susceptible in the G2 and M phases of the cell cycle.\nHypoxic cells are less radiosensitive as free radical formation requires oxygen. The dose of radiation necessary to kill hypoxic cells is 2.5—3.0 times greater than well-oxygenated cells. A nice summary of this is by Yip and Alonzi (2013). Similar trials are ongoing in head and neck cancer.\nYip K, Alonzi R. Carbogen gas and radiotherapy outcomes in prostate cancer. Therapeutic Advances in Urology 2013;5:25-34,.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q54"},{"s":"Which of the following techniques should be used during surgery for cochlear implantation?","o":["Skin and periosteal incisions should overlap by at least 1 cm","The internal device should be placed as close as possible to the postauricular crease","The cochleostomy should not be packed with soft tissue, as this increases the risk of developing meningitis","The cochleostomy should be placed between the round window and oval window to ensure insertion occurs in the scala vestibuli"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 31 · Q5"},{"s":"Which nerves pass through the superior orbital fissure?","o":["II, III, IV, and VI","III, IV, V2, and VI","III, IV, V1, and VI","II, IV, V2, and VI","III, IV, V1, and V2"],"k":"C","x":"The following structures pass through the superior orbital fissure: the lacrimal nerve (V1), frontal nerve (V1), trochlear nerve (IV), superior ophthalmic vein, nasociliary nerve (V1), inferior ophthalmic vein, abducens nerve (VI), oculomotor nerve superior division (III), and oculomotor nerve inferior division (III).","d":"Rhinology","src":"SBA book · General Otolaryngology · Q8"},{"s":"Radiographic imaging of sinus neoplasia with computed tomography (CT) provides information regarding all of the following except","o":["the size of neural foramina.","sinus and orbital bone destruction.","the integrity of the skull base.","the site of the tumor.","differentiation of soft tissue and retained mucus."],"k":"E","x":"With CT, one has difficulty distinguishing between retained secretions and tumor or tumor and swollen mucosa. Magnetic resonance imaging complements CT by providing valuable information in the differentiation of normal mucosa from neoplasm and neoplasm from retained mucus.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q4"},{"s":"Prophylactic medications for migraines include all of the following except","o":["amitriptyline.","metoprolol.","verapamil.","carbamazepine.","naproxen."],"k":"D","x":"Prophylactic migraine medications include antidepressants, ergotamine, beta blockers, nonsteroidal anti-inflammatory drugs, calcium channel blockers, and some anticonvulsants, including divalproex, valproic acid, gabapentin, or topiramate but not carbamazepine. Carbamazepine is instead used to treat cranial neuralgias.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q3"},{"s":"The most common morbidity associated with surgery of the infratemporal fossa is","o":["Trigeminal nerve dysfunction","Facial nerve dysfunction","Dysphagia","Dysphonia","Ataxia"],"k":"A","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 54 · Q3"},{"s":"Which of the following statements does not support the hygiene theory of the development of atopic diseases?","o":["Childhood infections seem to hold a protective effect on the development of allergy.","The youngest sibling has the greatest risk of development of allergic sensitization.","Among Japanese schoolchildren, positive tuberculin responses predicted a lower incidence of asthma and lower serum immunoglobulin (Ig)E at age 12 years.","Prior infection with hepatitis A was associated with a halving in the prevalence of elevated specific IgE levels.","The prevalence of atopy in the former East Germany increased sharply after reunification with the former West Germany."],"k":"B","x":"A growing body of literature supports the hypothesis that childhood infections hold a protective effect for the development of allergy. A number of factors associated with Western living including family size, increased immunization, and improved medical care are viewed as responsible for a decreasing number of childhood infections. In support of the hygiene theory are studies demonstrating an inverse relationship between frequency of allergic disorders and childhood infection. Signals to the developing immune system may skew responses toward allergic patterns later in life. Studies in Japan demonstrated an inverse relationship between delayed hypersensitivity to tuberculin at age 12 years and total and specific IgE levels. Studies of the Italian military found an association with serologic evidence of prior hepatitis A virus infection and decreased specific IgE levels. These support the concept that early infection can be protective in later development of atopy. Lastly, the prevalence of allergic rhinitis in East Germany increased in the 1990s, suggesting the possibility that factors associated with a Western affluent lifestyle may play a role in the development of allergic disease. Family structure and size have been shown to affect development of allergic disease with an inverse association with family size and birth order.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q1"},{"s":"A 30-year-old female presents to the head and neck multidisciplinary team with a rapid increase of a left parotid swelling. She is 18 weeks pregnant. The core biopsy confirms an acinic cell carcinoma. Which of the following management options should the multidisciplinary team recommend?","o":["Recommend a parotidectomy once the patient is postpartum","Recommend a parotidectomy, and postoperative radiotherapy on an urgent basis","Recommend a parotidectomy within the third trimester","Recommend a parotidectomy on an urgent basis","Recommend intensity-modulated radiation therapy (IMRT)"],"k":"D","x":"The patient is currently in her second trimester, the safest time to operate within a pregnancy. The greatest risk of operating during the first trimester is miscarriage. Operating during the third trimester carries an increased risk of preterm labour and anaesthetic risks. Surgery is the best course of action. It is not safe to offer radiotherapy during pregnancy. Despite the likely low grade of the tumour, treatment should not wait until the end of the pregnancy.\nShort J. Pregnancy Testing Guidance. Risks Associated with Anaesthesia and Surgery in Early Pregnancy. Royal College of Paediatrics and Child Health. Available at: https://www.rcpch.ac.uk/sites/default/files/ Review_of_risk_of_anaesthesia.pdf.\nWalton NKD, Melachuri VK. Anaesthesia for non-obstetric surgery during pregnancy. Continuing Education in Anaesthesia, Critical Care & Pain 2006;6:83-85.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q58"},{"s":"The most common arterial supply of glomus jugulare tumors is the","o":["Internal carotid artery","External carotid artery","Ascending pharyngeal artery","Occipital artery","Infratemporal fossa artery"],"k":"C","x":"The ascending pharyngeal branch of the external carotid artery is the most common arterial supply of glomus tumors.","d":"Otology","src":"Brackmann · Chapter 46 · Q4"},{"s":"The diagnosis of laryngomalacia can best be made","o":["with radiographs of the neck.","with fluoroscopy.","with flexible laryngoscopy.","with rigid laryngoscopy and tracheoscopy.","by symptoms and signs alone."],"k":"C","x":"The advantage of the flexible laryngoscope in an awake patient is that the dynamics of the supraglottis can readily be appreciated. It can also be used to diagnose other synchronous glottic lesions, such as vocal cord paralysis and glottic cysts.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q2"},{"s":"What is the minimum diameter of the opening into the vestibule required for the piston-cup prosthesis?","o":["Larger than 0.8 mm","Larger than 2.0 mm","Half of the footplate","The entire footplate"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 23 · Q3"},{"s":"In which of the following situations would Moh’s micrographic surgery be least appropriate?","o":["A large squamous cell carcinoma on the cheek","A recurrent squamous cell carcinoma on the forehead","Age greater than 80 years","Cosmetically sensitive area","A basal cell carcinoma arising in the posterior triangle of the neck"],"k":"E","x":"Moh’s micrographic surgery refers to complete micrographic excision of the tumour using intraoperative histopathology to assess for positive margins. This technique is particularly useful for:\n* recurrent tumours\n* tumours measuring greater than 2 cm\n* those with an aggressive histology\n* those in cosmetically sensitive areas, since wide excision is often difficult.","d":"Rhinology","src":"SBA book · Rhinology · Q42"},{"s":"Ohngren’s line is used as a prognostic indicator in management of carcinoma of the maxillary sinus. This line is described as an imaginary plane perpendicular to the intersection between:","o":["The lateral canthus and the angle of the jaw","The lateral canthus and the menton","The medial canthus and the angle of the jaw","The tragus and the nasal tip","The tragus and the menton"],"k":"C","x":"Ohngren’s line is between the medial canthus and the angle of the jaw. Tumours above this line are associated with a worse prognosis than those below the line.","d":"Rhinology","src":"SBA book · Rhinology · Q7"},{"s":"A 4-year-old child has sustained a clean facial laceration which requires closure. Which of the following is the most acceptable form of closure?","o":["5/0 silk","2/0 undyed Vicryl","4/0 Monocryl","Skin clips","4/0 dyed Vicryl subcuticular"],"k":"C","x":"Undyed Vicryl might be acceptable, but 2/0 is far too large a suture material in a child’s skin. Of the options, Monocryl, an absorbable monofilament material, would give the most acceptable result.","d":"Rhinology","src":"SBA book · Rhinology · Q22"},{"s":"The most common laryngeal inflammatory disorder in children is","o":["laryngopharyngeal reflux.","herpes simplex laryngitis.","vocal misuse and abuse.","viral laryngotracheitis.","acute supraglottitis."],"k":"D","x":"Viral laryngotracheitis is the most common laryngeal inflammatory disorder of childhood. It is responsible for 15% of respiratory disease seen in pediatric practice. Usually, this condition is self-limited, occurs in children under the age of 3 years, and has a seasonal peak, with most cases occurring during the winter.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q2"},{"s":"According to the 8th edition of the American Joint Committee on Cancer (AJCC) cancer staging manual, what stage would be attributed to a patient presenting with a 2.1 cm human papillomavirus-positive squamous cell carcinoma of the left tonsil and a 5 cm left level Ila lymph node metastasis, with no other metastatic disease identified?","o":["T2, N2a, stage I","T2, N2a, stage IVb","T1, N1, stage I","T1, N2a, stage IVa","T2, N1, stage I"],"k":"E","x":"Due to the better prognosis afforded to HPV-positive squamous cell carcinoma of the oropharynx, this has been reflected in the new 8th edition of the AJCC TNM staging of the head and neck manual. HPV-positive oropharyngeal squamous cell carcinoma is classified differently to HPV-negative disease. This distinction is described as those tumours with an overexpression of p16 (275%) and at least moderate staining intensity.\nIn the new classification, the nodal staging is N2 for bilateral or contralateral disease if all lymph nodes are 6 cm or smaller and N3 if the lymph node is over 6 cm.\nThis same patient would be classified as T2, N2a, stage [Va in the 7th edition of the TNM.\nLydiatt WM, Patel SG, O'Sullivan B, et al. Head and neck cancers—major changes in the American\nJoint Committee on Cancer eighth edition cancer staging manual. CA: A Cancer Journal for Clinicians 2017;67:122-137.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q74"},{"s":"Benign paroxysmal positional vertigo (BPPV) can result from, or has been correlated to, all of the following except","o":["Ménière’s disease","Autoimmune inner ear disease","Migraine","Stapedectomy","Labyrinthitis"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 38 · Q2"},{"s":"Which of the following statements can be considered false with regard to the prion protein and diseases caused by it?","o":["The prion protein is expressed normally in the human brain","Prion diseases can be inherited, occur sporadically, or be infectious","An example of a human prion disease is Gerstmann—Straussler—Scheinker disease","There is currently no effective treatment for prion diseases","In the UK, several thousand deaths have been caused by new variant Creutzfeldt—Jakob disease (nvCJD) in the last decade"],"k":"E","x":"Deaths in the UK attributable to nvCJD total less than 200 at present.\nThe human prion gene encodes a protein of amino acids and is found in most tissues of the body but is expressed at highest levels in the CNS.\nPrion diseases are unique in that they can be inherited, they can occur sporadically, or they can be infectious. They can affect both animals and humans. Examples include Creutzfeldt—Jakob disease (CJD) and Gerstmann-Straussler—Scheinker (GSS) in humans, bovine spongiform encephalopathy (BSE) in cattle, and scrapie in sheep.\nAll prion diseases are fatal, with no effective form of treatment currently.","d":"General","src":"SBA book · General Otolaryngology · Q27"},{"s":"Your registrar is performing a total laryngectomy without a neck dissection. As part of the dissection, he has confidently identified the hypoglossal nerve. He then identifies a further nerve, running in the same direction as the hypoglossal nerve but medial to the common carotid artery. What would you advise him to do next?","o":["Preserve the nerve and continue the dissection","Dissect the nerve proximally","Dissect the nerve distally","Divide the nerve and continue the dissection","Consider a primary anastomosis after the resection is complete"],"k":"D","x":"This is likely to represent the superior laryngeal nerve. The superior laryngeal nerve passes along the pharynx medial to the common carotid artery in a similar direction to the hypoglossal nerve. The hypoglossal nerve is lateral to the common carotid artery.\nThe superior laryngeal nerve separates from the main trunk of the vagus just outside the jugular foramen; it then passes anteromedially on the thyrohyoid membrane where it is joined by the superior thyroid artery and vein. At approximately this level, the external laryngeal nerve leaves the main trunk and the internal laryngeal nerve enters the thyrohyoid membrane.\nThis nerve is resected as part of performing a laryngectomy.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q3"},{"s":"Which single chemotherapeutic agent has been most successful in a combined regimen for nasopharyngeal carcinoma?","o":["5-fluorouracil","cisplatin","methotrexate","doxorubicin","bleomycin"],"k":"B","x":"Cisplatin is clearly superior. Some of these other agents have been tried. 5-Fluorouracil, by itself, is not very successful. The combination of cisplatin and 5-fluorouracil has merit.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Nasopharynx · Q7"},{"s":"The potential benefits of performing a cranioplasty after a translabyrinthine craniotomy include","o":["Decreasing the rate of cerebrospinal fluid leak","Prevention of a noticeable postauricular defect","Protects the bony ear canal","a and b","a and c"],"k":"D","x":"Performing a cranioplasty helps bolster the fat graft into the dural defect and potentially drops the cerebrospinal fluid leak rate.The nature of the cranioplasty is prevention of a noticeable defect in the skull; it does nothing to protect the bony ear canal.","d":"Otology","src":"Brackmann · Chapter 49 · Q5"},{"s":"Which of the following is least likely to improve the symptoms from an anterior nasal septal perforation?","o":["Nasal hygiene","Free tissue transfer cartilage graft repair (cartilage, perichondrium only)","Silastic button placement","Local flap repair","Free tissue transfer composite graft repair (epithelium, cartilage, epithelium)"],"k":"B","x":"Asymptomatic nasal septal perforations may simply require nasal hygiene. A large perforation (>2 cm) that causes subjective nasal obstruction, or one which whistles or bleeds, can often be managed with placement of a silastic button. Smaller symptomatic perforations may be amenable to surgical closure with a composite graft of cartilage, perichondrium, and skin, harvested from the pinna.","d":"Rhinology","src":"SBA book · Rhinology · Q21"},{"s":"With regard to dynamic facial reanimation techniques, which of the following is true?","o":["A gold weight is placed in the suborbicularis plane","A sural nerve graft is the most common nerve graft used in cable grafting","Following cable grafting, most surgeons aim for a House—Brackmann grade II postoperatively","In a nerve to masseter transfer, the nerve is identified 3 cm anterior to the tragus, 1 cm inferior to the zygomatic arch on the surface of the master muscle","Temporalis lengthening myoplasty involves detaching the insertion of the temporalis muscle from the coronoid process of the mandible and freeing the temporalis muscle from its posterior aspect to allow reinsertion to the perioral muscles"],"k":"E","x":"A gold weight is a static measure to improve eye closure following facial nerve paralysis. The weight is placed between the orbicularis and the tarsal plate.\nAlthough a sural nerve is superior in length, the great auricular is more commonly used for cable grafting due to its close location, and being well matched for size.\nA House—Brackmann grade III is the best achievable result following cable grafting.\nThe nerve to the masseter is located within the muscle body of the masseter. The other parameters are correct.","d":"H&N / Plastics / Trauma","src":"SBA book · Head & Neck Surgery · Q69"},{"s":"The best treatment of postoperative trismus is","o":["Temporomandibular joint (TMJ) resection","TMJ prosthesis","Stretching therapy","Laser scar ablation","Steroid injection into the pterygoid muscles"],"k":"C","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 54 · Q4"},{"s":"Which of the following does not form part of the bony orbital cavity?","o":["Lacrimal bone","Zygomatic bone","Palatine bone","Greater wing of the sphenoid","Nasal bone"],"k":"E","x":"Seven bones are considered to make up the bony orbital cavity: the frontal, zygomatic, maxillary, lacrimal, palatine, ethmoid, and sphenoid (greater and lesser wings).","d":"Rhinology","src":"SBA book · Rhinology · Q12"},{"s":"Which of the following statements concerning the diagnosis of microtia or aural atresia is false?","o":["In grade I, the auricle is developed and, though misshapen, has a readily recognizable, characteristic anatomy.","In grade II, the helix is rudimentary, and the lobule is developed.","In grade III, an amorphous skin tag is present. In all grades, wide variation of morphology exists.","In cases of stenosis, entrapped squamous epithelium may lead to a retention cholesteatoma with bone destruction.","All ears with complete atresia have cholesteatomas."],"k":"E","x":"In grade I, the auricle is developed and, though misshapen, has a readily recognizable, characteristic anatomy. In grade II, the helix is rudimentary, and the lobule is developed. In grade III, an amorphous skin tag is present. In all stages, wide variations of morphology exist. The pinna may be fully formed with a transverse and low-set orientation. There may be accessory appendages of the pinna (pretragal tags with or without cartilage) and preauricular sinus tracts. The external canal may be stenotic or atretic to varying degrees. In cases of stenosis, entrapped squamous epithelium may lead to a retention cholesteatoma with bone destruction. Ears with congenital meatal stenosis have a higher incidence of cholesteatomas than completely atretic ears.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q4"},{"s":"Two weeks after a mandibular tooth extraction, a 33-year-old woman develops a mildly tender induration of the neck and mandibular area. The lesion slowly progresses to a board-like consistency with a draining fistula. A pathognomonic finding in this condition is","o":["“sulfur granules.”","Mikulicz’s cells.","“foamy histiocytes.”","Charcot-Leyden crystals.","fungus ball."],"k":"A","x":"“Sulfur granules” are white-yellow granules of bacterial filaments seen in the exudates or infected tissues of patients with actinomycosis.","d":"General","src":"Ballenger · Etiology of Infectious Diseases of the Upper Respiratory Tract · Q6"},{"s":"Concerning lasers in ENT, which if any of the following statements is false?","o":["The ‘E’ in the LASER acronym stands for ‘emission’","The carbon dioxide (CO,) laser emits light in the far infrared spectrum and has a wave length of 10,600 nm","The light generated by a laser is characterized by being monochromatic, collimated, and coherent","The effects of the argon laser are due to heat generated locally","The potassium titanyl phosphate (KTP) laser can be used in middle ear surgery and directed into small recesses by bending the laser light with a prism"],"k":"E","x":"LASER is an acronym standing for Light Amplification by the Stimulated Emission of Radiation. The light generated is characterized by being all the same colour (monochromatic), parallel (collimated), and in phase (coherent). The effects of all lasers are due to locally generated heat. The KTP laser does have a role in middle ear surgery but is delivered via total internal reflection along an optical fibre and not bent by a prism. The wavelength of the CO2 laser is 10,600 nm.","d":"General","src":"SBA book · General Otolaryngology · Q10"},{"s":"A 40-year-old woman presents with a seizure, from which she fully recovered. She had never had seizures before. Her complete neurological examination was normal. The only abnormality found on full examination was an infected cholesteatoma in her right ear, which had drained intermittently for several years. You are concerned about what?","o":["Brain abscess","Subdural abscess","Meningitis","Otitic hydrocephalus"],"k":"A","x":"She had a large right temporal lobe brain abscess.","d":"Otology","src":"Brackmann · Chapter 15 · Q3"},{"s":"Saccular cysts are best diagnosed with","o":["lateral neck radiography.","fluoroscopy.","barium swallow.","computed tomography of the neck.","direct laryngoscopy."],"k":"E","x":"Saccular cysts are divided into lateral wall saccular cysts and anterior saccular cysts. Lateral saccular cysts are most frequently located in the aryepiglottic fold, epiglottis, or lateral wall of the larynx, whereas anterior saccular cysts extend medially and posteriorly between the true and false vocal cords and directly into the laryngeal lumen. Although lateral neck radiography, fluoroscopy, barium swallows, and computed tomography of the neck may be helpful, a definite diagnosis cannot be made with them because other lesions, such as hemangiomas, may produce identical findings.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q5"},{"s":"Regarding botulinum toxin, which of the following statements is true?","o":["Botulinum toxin may be used for focal hyperhidrosis, strabismus, and chronic migraine","It is associated with infection by Corynebacterium botulinum","It blocks uptake of acetylcholine in the postsynaptic membrane of nerve endings","It causes permanent muscle paralysis","It causes a similar paralysis to the infection with Clostridium tetani"],"k":"A","x":"Botulinum toxin has many uses in the medical fraternity including within the head and neck. The mechanism of action is blockading the release of acetylcholine from the presynaptic membrane in the nerve endings. The action is temporary with muscle paralysis typically lasting 3 months. Botulinum paralysis is flaccid, the paralysis associated with tetanus infection is spastic; both infections are from Clostridium species.","d":"Rhinology","src":"SBA book · Rhinology · Q66"},{"s":"Which of the following represent the lowest risk of developing a basal cell carcinoma?","o":["Basal cell nevus syndrome (Gorlin syndrome)","Sun exposure","Xeroderma pigmentosa","Immunosuppression","Fitzpatrick skin type V"],"k":"E","x":"All of the other answers are associated with an increased risk of developing BCC. Fitzpatrick classified skin types such that type I is fair skin and type VI is black skin. The latter represents a lower risk of developing skin cancer.","d":"Rhinology","src":"SBA book · Rhinology · Q29"},{"s":"A 73-year-old woman on warfarin has presented following a mechanical fall. The non-contrast CT head has excluded an intracerebral bleed, but identified an incidental lesion in the parapharyngeal space. You confirm the presence of a smooth mass on nasendoscopy, with no other symptoms or signs. What is the next best course of action?","o":["Reassure and discharge","List for excision","Ultrasound-guided fine needle aspiration","MRI with contrast","List for panendoscopy and biopsy"],"k":"D","x":"Further investigation is required; a biopsy would be contraindicated without further investigation as this could represent a vascular lesion. Furthermore, it is important to ascertain the position of the internal carotid artery which can be displaced medially before a biopsy is undertaken.","d":"H&N / Plastics / Trauma","src":"SBA book · Head & Neck Surgery · Q48"},{"s":"A Z-plasty is used on a patient. The advantages include all of the following except:","o":["Excision of the scar","Shortening of the scar","Lengthening of the scar","Reorientation of the scar","Release tension on the scar"],"k":"B","x":"A Zplasty is used for excising a scar, reorientating, and lengthening a scar. The angle subtended by the arms dictates the lengthening that can be expected.","d":"Rhinology","src":"SBA book · Rhinology · Q30"},{"s":"Hearing loss after cochleosacculotomy is","o":["Almost zero","Progressive for weeks","Immediate","Reversible with mannitol","Only in the high frequencies"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 39 · Q3"},{"s":"With regard to hereditary haemorrhagic telangiectasia (HHT), which of the following statements is true?","o":["It features characteristic abnormalities in the clotting studies","It is an autosomal recessive condition","It is due to an abnormality located on chromosome 10","It can be treated with a split skin graft replacing the nasal mucosa","It is diagnosed based on the Radkowski classification"],"k":"D","x":"Hereditary haemorrhagic telangiectasia (HHT), also known as Osler—Weber—Rendu disease is an autosomal dominant condition. The diagnosis of HHT is made clinically on the basis of the Curacao criteria. The four clinical diagnostic criteria are:\n* epistaxis\n* telangiectasias\n* visceral lesions\n* family history (a first-degree relative with HHT). This condition affects blood vessels in the skin, mucous membranes, and viscera, causing the classical features of telangiectasia, arteriovenous malformations, and aneurysms, generally occurring in the chest, gut, and brain. The underlying genetic abnormalities are located on chromosomes 9 and 12. Histopathological studies reveal large, irregular, thinly walled blood vessels, but the pathogenesis has not been fully established. Defects in the endothelial cell junctions, endothelial cell degeneration, and weakness of the perivascular connective tissue are thought to cause dilation of capillaries and postcapillary venules, which manifest as telangiectasias. The nasal vessels are particularly prone to bleeding as there is no protective covering layer of squamous epithelium as there is with cutaneous telangiectasia. The clotting studies of these patients are normal.\nManagement involves gentle packing with adrenaline-soaked packs such as Kaltostat (rather\nthan aggressive nasal packing which will only lead to further trauma and bleeding) and the use\nof antifibrinolytics (tranexamic acid). These patients have usually undergone multiple blood transfusions, and are generally already treated with ferrous supplementation. Topical oestrogens have been used in management along with coagulative laser (potassium titanyl phosphate (KTP)), septodermoplasty, and Young’s procedure.","d":"Rhinology","src":"SBA book · Rhinology · Q57"},{"s":"When staging a tonsil tumour, which of the following factors will not be used in the TNM (8th edition) classification?","o":["Size of the tumour","Number of lymph nodes","P16 status","Extracapsular spread","Smoking history"],"k":"E","x":"In the TNM (8th edition), p16 status is now important. Extracapsular spread is reported for p16-negative tumours only. While smoking has been shown to be important in stratifying prognosis, it is not included in the TNM (8th edition) classification.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q87"},{"s":"Laryngopharyngeal reflux differs from gastroesophageal reflux disease in all of the following ways except","o":["patients with laryngopharyngeal reflux frequently experience daytime reflux.","patients with laryngopharyngeal reflux typically experience upright reflux.","patients with laryngopharyngeal reflux frequently suffer from heartburn.","patients with laryngopharyngeal reflux often suffer from globus and chronic cough.","patients with laryngopharyngeal reflux often suffer from hoarseness."],"k":"C","x":"Laryngopharyngeal reflux differs from gastroesophageal reflux disease in that patients with laryngopharyngeal reflux usually experience daytime, upright reflux. Typical symptoms include globus, hoarseness, and chronic cough. Only one-third of patients with laryngopharyngeal reflux admit to having heartburn.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q1"},{"s":"A patient develops a chylous fistula following a left neck dissection. Which of the following treatments is least likely to result in the fistula closing?","o":["Endovascular embolization of the thoracic duct","Enteral diet with containing predominantly medium-chain fatty acids","Surgical re-exploration","Enteral diet containing predominantly long-chain fatty acids","Total parenteral nutrition"],"k":"D","x":"The majority of ingested fats are triglycerides with long-chain fatty acids. Long-chain fatty acids are esterified in mucosal cells of the bowel wall and transported into the lymphatic system as chylomicrons.\nMiddle-chain fatty acids, however, are absorbed directly into the portal system without the formation of chylomicrons, bypassing the lymphatics. Therefore, dietary modifications avoiding long-chain fatty acids are important in the treatment of chylous fistula.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q7"},{"s":"You see a 46-year-old man with a 3-month history of a mass in the right anterior triangle of his neck. He has smoked 20 cigarettes a day for the last 25 years and drinks in excess of 30 units of alcohol per week. Full ENT examination is otherwise normal. Fine needle aspiration cytology produces 30 mL of milky brown fluid. At 1 week, the cyst has reaccumulated and the cytology reports that the fluid contains cholesterol crystals. What is the most appropriate management?","o":["Repeat the fine needle aspiration cytology","Reassure the patient and discharge","Commence broad-spectrum antibiotics and review in 6 weeks","Refer the patient to the oncologists for chemoradiotherapy","Arrange for surgical removal of the cyst along with rigid endoscopy of the upper aerodigestive tract"],"k":"E","x":"This is likely to be a branchial cyst. Surgical excision is recommended as the cyst has reaccumulated. Cystic degeneration of a metastatic lymph node remains a possibility; therefore, endoscopy of the upper aerodigestive tract should be performed as soon as possible.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q8"},{"s":"Concerning the nondelivery approaches to the nasal tip, it is incorrect to say that","o":["the caudal aspects of the lateral crura remain undisturbed.","symmetric cartilage resection may be difficult to achieve.","it is necessary to employ a complete transfixion incision to gain access to the nose.","the final outcome of the nasal tip healing is highly predictable.","normal tissue of the nasal tip is less disturbed in this approach than in delivery and open approaches."],"k":"C","x":"It is not necessary to perform a complete transfixion incision to gain effective access to the nose through a typical nondelivery approach.","d":"H&N / Plastics / Trauma","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q5"},{"s":"Which of these personal characteristics does not describe a good candidate for esthetic rhinoplasty?","o":["obsessive-compulsive traits","realistic expectations","obvious deformities","oily skin","anxiety about surgery"],"k":"A","x":"Obvious or overt obsessive-complex traits often indicate a tendency to expect perfection, leading to complaints about inconsequential imperfections regarding the outcome of surgery.","d":"H&N / Plastics / Trauma","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q3"},{"s":"Patients who have Reinke’s edema, have undergone hormonal virilization therapy, have voices with a lot of “vocal fry,” or have tremulousness in the voice will most likely have","o":["low pitch disorder.","vocal loudness problems.","hoarseness.","aphonia.","high pitch disorder."],"k":"A","x":"Patients with Reinke’s edema and those who have undergone virilization treatments experience an increase in the size (thickness) of the vocal folds. The increased thickness results in a lower than normal pitch level during phonation. Patients who use vocal fry are usually producing vocal sounds with a fundamental frequency below 75 Hz. Tremulousness is often associated with a lack of vibratory control of the thickened vocal folds and, hence, low pitch phonations.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q3"},{"s":"For the treatment of juvenile otosclerosis, the prosthesis length should be sized","o":["The same as adult","One half mm shorter than adult","One half mm longer than adult","None of the above"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 23 · Q5"},{"s":"Functional articulation errors usually do not include","o":["omissions.","dysfluencies.","distortions.","substitutions.","additions."],"k":"B","x":"Dysfluencies are usually associated with stuttering, rather than with functional articulation problems. All of the other foils are types of articulation disorders.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q6"},{"s":"Which of the following therapeutic agents can be most successfully used in the acute management of hereditary angioedema?","o":["epinephrine","corticosteroid","antihistamine","C1-INH concentrate","attenuated androgen"],"k":"D","x":"C1-INH concentrate is the most reliable in the acute management of airway obstruction owing to hereditary angioedema. Nevertheless, mechanical relief of airway obstruction may be required in the acute situation. Epinephrine, corticosteroids, and antihistamines are less reliable in this problem.Attenuated androgens such as danazol and stanozolol are useful in the long-term management of hereditary angioedema, as are antifibrinolytic medications, such as ε-aminocaproic acid and tranexamic acid, and C1-INH concentrate.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q10"},{"s":"Non-tuberculous mycobacteria (NTB): which of the following statements is false?","o":["Commonly Mycobacterium avium—intracellulare complex in 80% of cases","Usually presents with a warm painless mass and discoloration of the overlying skin","Atypical mycobacteria are acid-fast bacilli which are naturally found in soil and water environments","NTB lymphadenitis commonly presents in children under 5","Common sites for lymphadenitis in order of incidence is submandibular region, preauricular region, and parotid gland"],"k":"B","x":"NTB often presents in young children aged under 5 with a cold painless firm mass. The mass may enlarge, become fluctuant, and discolour the skin to form the classical ‘violaceous hue’.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q39"},{"s":"While performing functional endoscopic sinus (FES) surgery, you are operating to remove the anterior ethmoidal air cells when you see clear fluid flowing from the region of the lateral lamella of the cribriform plate. What is the next most appropriate action?","o":["Stop surgery, wake the patient up, and see if the clear fluid continues","Inject intrathecal fluorescein to confirm the presence of a cerebrospinal fluid (CSF) leak","Perform a local repair of the probable CSF leak","Continue the surgery, then pack the nose with a nasal tampon for 48 hours","Request the neurosurgeons to perform a craniotomy and dural repair"],"k":"C","x":"In this situation where a CSF leak is highly likely and this is noted at the time of surgery, closure at the primary surgery should be performed. Fluorescein, while used to help with the identification of a CSF leak, is not licensed for this. The consent process should take account of this.","d":"Rhinology","src":"SBA book · Rhinology · Q8"},{"s":"Middle ear exploration for PLF is recommended in which of the below cases:","o":["Mild hearing loss and/or disequilibrium following recent trauma","Sudden onset of hearing loss with no disequilibrium","Fluctuating hearing loss, episodic vertigo","Disequilibrium, worsening with coughing or straining, conductive hearing loss"],"k":"A","x":"Conservative, nonsurgical treatment is advocated in patients seen in the first 7 days after development of symptoms. However, if the patient’s hearing fails to recover in 10 days of bed rest, surgical intervention should be carried out in the next 4 days. Sudden sensorineural hearing loss without history of prior antecedent traumatic event should be treated medically. Fluctuating hearing loss and episodic vertigo is likely Ménière’s disease. Conductive hearing loss with disequilibrium worsened byValsalva-type maneuvers is likely superior semicircular canal dehiscence.","d":"Otology","src":"Brackmann · Chapter 27 · Q2"},{"s":"Concerning positron emission tomography (PET)-FDG scanning, which of the following statements is true?","o":["The radioactive tracer is highly specific for cancer cells","PET scanning can define very small tumour deposits of only a few cells","PET scanning has an emerging role in the assessment of the unknown primary","PET scanning can differentiate areas of inflammation and cancer deposits","PET scanning combined with computed tomography (CT) scanning provides improved resolution of the soft tissues compared to magnetic resonance scanning"],"k":"C","x":"Positron emission tomography (PET) is a non-invasive, diagnostic imaging technique\nfor measuring metabolic activity of cells. The PET-FDG scan uses a small amount of radioactive material, FDG (fluorodeoxyglucose), which is concentrated in cells exhibiting high rates of glycolysis. The tracer is therefore not specific to cancer cells and can produce false-positive results when concentrated in tissues that also exhibit high rates of glycolysis, such as inflammatory cells. The resolution of PET is being improved but requires a tumour load greater than a few cells. The advent of PET-CT has improved anatomical localization but not soft tissue resolution.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q19"},{"s":"Which of the following radiologic studies is the most valuable for evaluating deep neck infections?","o":["contrast-enhanced computed tomography (CT)","contrast-enhanced magnetic resonance imaging","contrast-enhanced MRI with magnetic resonance angiography","ultrasonography","lateral neck radiography"],"k":"A","x":"Contrast-enhanced CT is excellent for evaluation of all of the fascial spaces and may demonstrate findings of infections such as soft tissue edema, obliteration of fat planes, deviation of structures, and airway compromise. It can differentiate between abscess and cellulitis. It will demonstrate the size and location of an abscess and its position relative to the carotid artery and internal jugular vein.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q5"},{"s":"You are asked to see a 14-year-old girl with a 3-day history of a painful left neck. On examination she is diffusely tender along the sternocleidomastoid mastoid muscle but there is no focal mass. She has a low-grade fever and a raised C-reactive protein (CRP) (42) but is otherwise well. She is known to suffer from homocystinuria. From the history and examination, what is the most likely diagnosis?","o":["Acute lymphoblastic leukaemia","Internal jugular vein thrombosis","Rhabdomyosarcoma","Common carotid artery thrombosis","Carotid body tumour"],"k":"B","x":"Homocystinuria is an inherited autosomal recessive disorder of methionine metabolism. This causes a widespread disorder of the connective tissue, muscles, central nervous system, and cardiovascular system, often with a marfanoid appearance.\nThrombotic complications are common, affecting the venous and arterial vasculature. These complications often result in death before the age of 30. From the clinical scenario described, it is likely that the child would be more unwell if thrombosis of the common carotid artery had occurred.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q28"},{"s":"Which of the following is not an odontogenic tumor?","o":["ameloblastoma","cementoblastoma","myxoma","odontoma","osteoma"],"k":"E","x":"Odontogenic tumors arise from the precursors of tooth formation. The odontoma, a hamartoma composed of dentin, enamel, and cementum, is the most common odontogenic tumor. Other odontogenic tumors include the ameloblastoma, myxoma, adenoameloblastoma, dementoma, and cementoblastoma. Nonodontogenic tumors arise from tissues other than dental precursors. The torus, fibrous dysplasia, osteoma, eosinophilic granuloma, aneursymal bone cysts, hemorrhagic bone cysts, and cherubism are nonodontogenic tumors.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q7"},{"s":"Osteonecrosis of the tympanic bone presents with bone exposure in the external auditory canal and may be associated with","o":["Radiation history to the temporal bone","Lupus vasculitis","Diabetes","a and b","All of the above"],"k":"E","x":"","d":"Otology","src":"Brackmann · Chapter 2 · Q5"},{"s":"Regarding sutures, which of the following statements is true?","o":["Vicryl maintains its tensile strength for approximately 42 days","Vicryl is typically absorbed by day 50","Surgical silk is derived from the silkworm species Bombyx mori","Silk loses 50% of its tensile strength within 3 months","Nylon loses 15—20% of its tensile strength per year due to absorption"],"k":"C","x":"Vicryl retains its maximal strength for approximately 21 days and complete absorption occurs in 90 days. Nylon loses 15-20% of its tensile strength per year due to hydrolysis.","d":"Rhinology","src":"SBA book · Rhinology · Q67"},{"s":"Disadvantages of the outer surface technique include all of the following except","o":["Healing problems","Lateralization of the graft","Blunting in the anterior sulcus","Absence of epithelial cysts"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 9 · Q5"}]};const Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Paediatric','H&N / Plastics / Trauma','General'];
