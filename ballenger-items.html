, and speech therapy can improve speech and language skills. In children with bilateral atresia, amplification with bone-conduction aids should be provided as soon as possible, preferably within the first few months of life. In infants with unilateral atresia and conductive hearing loss in the seemingly normal ear, an air-conduction aid should be fitted to the ear with a canal. In the unilateral case with normal contralateral hearing, repair of either the microtia or the atresia is considered elective, and there is less urgency to intervene during childhood. When the atresia is bilateral, with acceptable-appearing auricles, reconstructive surgery can be performed at a fairly young age. However, in cases of microtia that require reconstruction, atresia repair should be deferred until the initial stages of the auricular repair are completed."},{"n":7,"s":"Which of the following statements concerning the management of aural atresia is false?","o":["Generally, microtia surgery requires a cartilage graft that is obtained from the costochondral region.","An adequate graft requires sufficient growth and fusion at the donor site, which has usually occurred by 9 years of age.","In bilateral cases, many authorities recommend postponing surgery for the restoration of hearing until at least age 5 years so that pneumatization can develop.","In class I ears, the potential for achieving an excellent hearing result is great.","In class III ears, the chances of achieving good hearing are slim."],"k":"B","x":"Generally, microtia surgery requires a cartilage graft that is obtained from the costochondral region. An adequate graft requires sufficient growth and fusion at the donor site, which has usually occurred by 5 to 6 years of age. Additionally, in bilateral cases, many authorities recommend postponing surgery for the restoration of hearing until at least age 5 years so that pneumatization can develop. The success of the surgical correction of congenital conductive hearing losses is related to the abnormality since a wide range of malformations is possible. In class I ears, the potential for achieving an excellent hearing result is great. Conversely, in class III ears, the chances of achieving good hearing are slim."},{"n":8,"s":"Which of the following statements concerning the management of aural atresia is false?","o":["A gap interrupting the ossicular chain’s continuity occurs most commonly at the incudomalleolar joint.","A fixed ossicular chain could be owing to a fixed stapedial tendon.","A mobile stapes is a favorable prognostic indicator of a good hearing outcome.","To maximize the likelihood of a successful outcome, hearing reconstruction in these patients should be conducted by an experienced otologist.","Deficiencies of the long process of the incus can be corrected by either interposing the reshaped incus between the mobile stapes and the malleus handle or using an alloplastic prosthesis."],"k":"A","x":"Before assuming the responsibility of correcting congenital conductive hearing losses and embarking on a procedure with significant potential complications, especially in children, the otologic surgeon must have sufficient experience to maximize the likelihood of a successful outcome. Once the middle ear is entered, the surgeon must decide if the chain is fixed, and if it is, where is the fixation? Is it in the epitympanum? Is the stapes fixed? Or is it a fixation of the stapedial tendon? A gap interrupting the ossicular chain’s continuity occurs most commonly at the incudostapedial joint. The presence of a mobile stapes facilitates the surgery and greatly improves the surgical result. If there is a small distance between the stapes capitulum and the long process of the incus, a tragal cartilage graft can successfully negotiate the gap. Deficiencies of the long process of the incus can be corrected by either interposing the reshaped incus between the mobile stapes and the malleus handle or using an alloplastic prosthesis designed for this purpose (type III tympanoplasty). When the stapes arch is absent, similar procedures can be performed to bridge the gap from either the malleus handle or the undersurface of the drumhead to the mobile footplate (type IV tympanoplasty). A coexisting fixation of the stapes or obstruction of the oval window by the facial nerve increases the technical difficulty, yields poorer hearing results, and increases the chances of complications, such as sensorineural hearing loss or facial nerve injury."},{"n":9,"s":"Which of the following statements concerning the management of microtia is false?","o":["Microtia surgery is technically difficult.","A three-stage procedure is required to correct a severe grade III microtia.","During the first stage, a segment of cartilage is obtained from the lower costochondral skeleton and implanted into a subcutaneous pocket.","During the second stage, the auricle is freed from the scalp, a split-thickness skin graft is used to create a postauricular sulcus, and the tragus is created.","An alternative technique for the treatment of severe grade III microtia is to use a lifelike prosthetic ear that is attached to surgically implanted titanium posts that securely hold the auricle in a normal anatomic position."],"k":"D","x":"Microtia surgery is technically difficult, and not infrequently, the results are somewhat disappointing. Correction of a severe grade III microtia requires several staged procedures. During the first stage, either a carved segment of cartilage from the lower costochondral skeleton or an alloplastic scaffold is placed into a subcutaneous pocket at the appropriate position. A portion of the microtic skin tag is maintained to construct the lobule. During the second stage, the auricle is freed from the scalp, and a split-thickness skin graft is used to create a postauricular sulcus. At a third stage, the tragus is created. An alternative technique for the treatment of severe grade III microtia is to use a lifelike prosthetic ear that is attached to surgically implanted titanium posts that securely hold the auricle in a normal anatomic position."},{"n":10,"s":"Which of the following statements concerning the management of aural atresia is false?","o":["It is performed as part of the second or third stage of the auricular reconstruction.","The surgeon should anticipate that the facial nerve will be located more anteriorly and more medially than in the normal temporal bone.","The meatus is created by drilling among the glenoid fossa anteriorly, the tegmen plate superiorly, and the mastoid cells posteriorly.","Temporalis fascia is harvested for reconstruction of the tympanic membrane.","Reconstruction of the atresia is deferred until the auricular cartilaginous scaffolding is completed."],"k":"B","x":"Reconstruction of the atresia is deferred until the auricular cartilaginous scaffolding is completed. It is performed as part of the second or third stage of the auricular reconstruction. A postauricular approach is used, with great care being taken not to expose the scaffold. Temporalis fascia is harvested for reconstruction of the tympanic membrane. After elevation of the periosteum, a bony circular canal is created by drilling between the glenoid fossa anteriorly and the tegmen plate superiorly while trying to avoid entering mastoid air cells posteriorly. The surgeon should anticipate that the facial nerve will be located more anteriorly and more laterally than in the normal temporal bone. The purposeful identification of the facial nerve will prevent inadvertent injury. Facial nerve monitoring may facilitate identification of the nerve in these atretic ears."}]},{"t":"Diseases of the Oral Cavity, Oropharynx, and Nasopharynx","q":[{"n":1,"s":"A high fever, conjunctivitis, polymorphous erythematous rash, erythema and edema of the extremities, cervical lymphadenopathy, and necrotic pharyngitis in a child under 5 years suggest which of the following conditions?","o":["erythema multiforme major","erythema multiforme minor","Reiter’s syndrome","Kawasaki’s disease","systemic lupus erythematosus"],"k":"D","x":"Kawasaki’s disease occurs primarily in children under 5 years. It is characterized by high fever, bilateral conjunctivitis, polymorphous erythematous rash, erythema and edema of the extremities, cervical lymphadenopathy including strawberry tongue, dry fissured lips, pharyngeal infection, and necrotic pharyngitis. It is the most common cause of acquired cardiac disease in children under 5 years. Fifteen to 20% of untreated children will develop a cardiac complication, with coronary artery aneurysm being the most serious. Treatment is with intravenous gamma globulin and aspirin."},{"n":2,"s":"All except one of the following signs are oral manifestations of leukemia:","o":["gingival hypertrophy","atrophic smooth erythematous tongue","necrotic ulcers of the mucous membranes","pallor of the mucous membranes","petechiae of the mucous membranes"],"k":"B","x":"In addition to being anemic and thrombocytopenic, patients with leukemia are often neutropenic, and secondary infections of the oral cavity and oropharynx commonly occur, resulting in necrosis and ulceration of the mucous membranes. Leukemic infiltration of the gums is common, causing gingival hypertrophy, edema, inflammation, and bleeding."},{"n":3,"s":"All except one of the following are oral manifestations of human immunodeficiency virus (HIV) infections:","o":["angular cheilitis","hairy leukoplakia","diffuse parotitis","Kaposi’s sarcoma","Wickham’s striae"],"k":"E","x":"There are at least 40 oral manifestations of HIV infections. They include oral candidiasis, recurrent herpetic and aphthous ulcers, angular cheilitis, hairy leukoplakia, periodontitis, gingivitis, diffuse parotitis, and Kaposi’s sarcoma. In children, the most common signs are oral candidiasis, diffuse parotitis, and oral ulcers. Wickham’s striae are interlacing white lines found in lichen planus."},{"n":4,"s":"Which fascial space is the most frequently involved with serious infections and is the most frequent route of spread of infection from one region to another?","o":["prevertebral","retropharyngeal","lateral pharyngeal","submandibular","visceral"],"k":"C","x":"The carotid sheath pierces the lateral pharyngeal space. The lateral pharyngeal space communicates with the submandibular, retropharyngeal, and parotid spaces and is in close proximity to the masticator and peritonsillar spaces. Its location makes it the space most frequently involved with serious infections, and it is the most frequent route of spread of infection from one region of the neck to another."},{"n":5,"s":"Which of the following radiologic studies is the most valuable for evaluating deep neck infections?","o":["contrast-enhanced computed tomography (CT)","contrast-enhanced magnetic resonance imaging","contrast-enhanced MRI with magnetic resonance angiography","ultrasonography","lateral neck radiography"],"k":"A","x":"Contrast-enhanced CT is excellent for evaluation of all of the fascial spaces and may demonstrate findings of infections such as soft tissue edema, obliteration of fat planes, deviation of structures, and airway compromise. It can differentiate between abscess and cellulitis. It will demonstrate the size and location of an abscess and its position relative to the carotid artery and internal jugular vein."},{"n":6,"s":"If a malignancy is suspected in a child with an enlarged cervical lymph node, which of the following is preferred to establish a diagnosis?","o":["endoscopy with biopsy of likely primary sites","excisional biopsy","incisional biopsy","needle biopsy","punch biopsy"],"k":"B","x":"If a cervical malignancy is suspected, an excisional biopsy is preferred. With localized lesions, an excisional biopsy may be curative and provides for a sufficient amount of tissue for additional studies such as permanent and frozen sections, electron microscopy, special stains, and tumor markers. Although needle biopsies are safe and accurate in adults, they often do not provide enough tissue to diagnosis pediatric malignancies, which are rare and frequently consist of embryonic tissue. Many pathologists do not have sufficient experience with these tumors and require large amounts of tissue to make the diagnosis."},{"n":7,"s":"Which of the following is not an odontogenic tumor?","o":["ameloblastoma","cementoblastoma","myxoma","odontoma","osteoma"],"k":"E","x":"Odontogenic tumors arise from the precursors of tooth formation. The odontoma, a hamartoma composed of dentin, enamel, and cementum, is the most common odontogenic tumor. Other odontogenic tumors include the ameloblastoma, myxoma, adenoameloblastoma, dementoma, and cementoblastoma. Nonodontogenic tumors arise from tissues other than dental precursors. The torus, fibrous dysplasia, osteoma, eosinophilic granuloma, aneursymal bone cysts, hemorrhagic bone cysts, and cherubism are nonodontogenic tumors."},{"n":8,"s":"Adenoidectomy may help improve all of the following conditions except","o":["recurrent otitis media.","otitis media with effusion.","upper airway obstruction.","sinusitis.","velopharyngeal insufficiency."],"k":"E","x":"Velopharyngeal insufficiency may result from adenoidectomy, especially in the presence of a submucous or frank cleft of the palate. This is characterized by rhinolalia aperta and reflux of liquids into the nasal airway. Adenoidectomy has been recommended for the treatment of recurrent otitis media, otitis media with effusion, airway obstruction caused by enlarged adenoid tissue, and pediatric sinusitis."},{"n":9,"s":"Which of the following is the least common complication of adenotonsillectomy?","o":["torticollis","nasopharyngeal stenosis","hypernasal speech","dehydration","bleeding"],"k":"B","x":"All are complications of adenotonsillectomy, but nasopharyngeal stenosis is the least common. Postoperative bleeding is the most serious complication, occurring in up to 3% of patients. Dehydration is common, especially with children, because they will not swallow because of the severe throat pain. Hypernasal speech commonly occurs immediately following the operation because the pain limits motion of the tonsillar pillars and soft palate. This usually resolves in several weeks. Torticollis is not uncommon and is usually caused by inflammation of the paraspinus muscles. Nasopharyngeal stenosis is rare and develops when the inferiolateral adenoid tissue is removed and there is simultaneous denuding or excision of the posterior tonsillar pillars.Adhesions form between the raw surfaces, resulting in scarring and obstruction."},{"n":10,"s":"Which study is the most definitive test for the diagnosis of sleep apnea?","o":["multiple sleep latency test","nocturnal oximetry","measurement of esophageal pressure during sleep","polysomnography","sleep sonography"],"k":"D","x":"Polysomnography in a sleep laboratory is the definitive diagnostic study for sleep apnea. It can diagnose the type of sleep apnea, its degree of severity, and any associated physiologic changes. The multiple sleep latency test measures daytime somnolence and not sleep apnea. Nocturnal oximetry measures oxygen levels during sleep. Measurement of esophageal pressures during sleep is an index of respiratory effort during sleep and is used to diagnose central sleep apnea. In children, sleep sonography provides objective data regarding the presence and degree of upper airway obstruction, but its ability to predict apnea is not established."}]},{"t":"Congenital Anomalies of the Larynx","q":[{"n":1,"s":"Which of the following characteristics of stridor is true with laryngomalacia?","o":["It is usually biphasic.","It is inspiratory only.","It is expiratory only.","It is usually not present.","None of the above."],"k":"B","x":"The characteristics of stridor vary with the site and degree of obstruction. Most supraglottic lesions produce stridor during inspiration. In the supraglottis, as the velocity of the airflow increases, the intraluminal negative pressure draws soft tissue into the airway during inspiration, increasing the degree of obstruction. Obstruction in the distal part of the respiratory tract increases during expiration as the trachea and bronchi constrict."},{"n":2,"s":"The diagnosis of laryngomalacia can best be made","o":["with radiographs of the neck.","with fluoroscopy.","with flexible laryngoscopy.","with rigid laryngoscopy and tracheoscopy.","by symptoms and signs alone."],"k":"C","x":"The advantage of the flexible laryngoscope in an awake patient is that the dynamics of the supraglottis can readily be appreciated. It can also be used to diagnose other synchronous glottic lesions, such as vocal cord paralysis and glottic cysts."},{"n":3,"s":"If an infant has immediate airway distress on delivery, which is least likely to be the cause?","o":["laryngeal atresia","laryngeal webs","laryngomalacia","saccular cyst","subglottic stenosis"],"k":"C","x":"The symptoms and signs of laryngomalacia begin shortly after birth and increase in severity until 6 to 8 months of age. Laryngeal atresia produces immediate distress at birth. The symptoms of laryngeal webs are present at birth in 75% of patients with them. Forty percent of saccular cysts are discovered in a few hours after birth. The airway obstruction of subglottic stenosis is often present at birth."},{"n":4,"s":"Symptoms of laryngeal webs include","o":["vocal dysfunction.","airway obstruction.","biphasic stridor.","reflux.","all of the above."],"k":"E","x":"Vocal dysfunction is the most common symptom in patients with laryngeal webs. Airway obstruction is the second most common finding, and the stridor occurs in both inspiratory and expiratory phases of respiration. Reflux is also observed in infants with laryngeal webs."},{"n":5,"s":"Saccular cysts are best diagnosed with","o":["lateral neck radiography.","fluoroscopy.","barium swallow.","computed tomography of the neck.","direct laryngoscopy."],"k":"E","x":"Saccular cysts are divided into lateral wall saccular cysts and anterior saccular cysts. Lateral saccular cysts are most frequently located in the aryepiglottic fold, epiglottis, or lateral wall of the larynx, whereas anterior saccular cysts extend medially and posteriorly between the true and false vocal cords and directly into the laryngeal lumen. Although lateral neck radiography, fluoroscopy, barium swallows, and computed tomography of the neck may be helpful, a definite diagnosis cannot be made with them because other lesions, such as hemangiomas, may produce identical findings."},{"n":6,"s":"Laryngoceles","o":["are symptomatic only when filled with air or fluid.","are easily diagnosed with lateral radiographs.","are symptomatically consistent.","are easily diagnosed with direct laryngoscopy.","cannot be diagnosed except at autopsy."],"k":"A","x":"Laryngoceles are only symptomatic when filled with air or fluid, so the symptoms are inconsistent or intermittent. The diagnosis is made with direct laryngoscopy with the aid of radiographs, including lateral and frontal cervical views."},{"n":7,"s":"The most common manifestation of a laryngeal cleft is","o":["aspiration and cyanosis.","asphyxia.","increased mucus production.","airway distress.","recurrent pneumonia."],"k":"A","x":"All of the choices occur in patients with laryngeal clefts. Following aspiration and cyanosis in frequency, there is asphyxia followed by increased mucus production, recurrent pneumonia, and airway distress."},{"n":8,"s":"Bilateral vocal cord paralysis may result from","o":["compression of the vagus nerves in their course through the foramen magnum.","traction of the cervical rootlets of the vagus nerves.","brainstem dysgenesis.","all of the above.","none of the above."],"k":"D","x":"Hydrocephalus and the Arnold-Chiari malformation may be associated with caudal displacement of the brainstem through the foramen magnum and result in compression of the vagus nerves and traction on the cervical rootlets of the vagus nerves. Brainstem dysgenesis appears to be the most appropriate explanation for familial bilateral vocal cord paralysis."},{"n":9,"s":"Acquired subglottic stenosis is","o":["associated with endotracheal intubation most frequently.","more common in neonates because they do not tolerate intubation well.","associated with a loose-fitting tube with a large air leak.","not associated with endotracheal intubation.","not affected by systemic factors."],"k":"A","x":"Neonates tolerate intubation better than adults probably because their laryngeal cartilages are more pliable and their larynges are located higher in the neck. In infants and young children, an endotracheal tube that allows a leak of air at pressures less than 20 cm H2O should be chosen. Systemic factors such as immunodeficiency, anemia, neutropenia, hypoxia, dehydration, and poor perfusion increase the risk of developing subglottic stenosis in the intubated infant."},{"n":10,"s":"Congenital subglottic stenosis","o":["always requires repair.","can be treated only with a tracheostomy.","can be observed expectantly if the symptoms are minimal.","requires a staged reconstruction with rib cartilage.","can be treated with dilatation if the stenosis is mature."],"k":"C","x":"Some patients outgrow their subglottic stenosis. Less than 50% of patients with congenital subglottic stenosis require a tracheostomy. Choices A, B, D, and E are not correct statements about congenital subglottic stenosis."}]},{"t":"Congenital Anomalies of the Head and Neck","q":[{"n":1,"s":"The most commonly encountered congenital anomaly of the head and neck is","o":["second branchial cleft cyst.","cystic hygroma.","thyroglossal duct cyst.","Thornwaldt’s cyst.","choanal atresia."],"k":"C","x":"Thyroglossal duct cysts are the most common anomalies of the head and neck, followed by branchial cleft defects, lymphangioma (cystic hygroma), and subcutaneous vascular anomalies. Thornwaldt’s cyst presenting clinically is uncommon, whereas choanal atresia, although the most frequently encountered congenital nasal anomaly, occurs in only 1 in 7,000 to 8,000 births."},{"n":2,"s":"The CHARGE association is most commonly encountered in relationship to which congenital head and neck anomaly?","o":["cleft palate","choanal atresia","branchial cleft cyst","thyroglossal duct cyst","thymic cyst"],"k":"B","x":"The CHARGE association is a nonrandom pattern of congenital anomalies that occurs with choanal atresia. Additional anomalies include coloboma, congenital heart disease, retarded growth and development, and ear abnormalities and deafness. Responses C, D, and E, although congenital anomalies, are not encountered with this disorder. Cleft palate has not been specifically reported with the CHARGE association."},{"n":3,"s":"Symptoms of intermittent postnasal discharge and odynophagia combined with a dull occipital headache would be most likely to occur in the presence of a","o":["Rathke’s cyst.","nasopharyngeal teratoma.","unilateral choanal atresia.","craniopharyngioma.","Thornwaldt’s cyst."],"k":"E","x":"Symptoms of Thornwaldt’s cysts include intermittent or persistent postnasal discharge of tenacious mucus associated with odynophagia, halitosis, unpleasant taste, and, occasionally, a dull occipital headache. The closest possible potential choice is Rathke’s cyst. Rathke’s cysts are not usually associated with postnasal discharge or headache. However, they can become secondarily infected or rupture intracranially producing galactorrhea, visual loss, and hypopituitarism. Unilateral choanal atresia is an unlikely distracter, and although teratomas and craniopharyngiomas arise in the nasopharyngeal region, they are not commonly associated with headache or intermittent postnasal discharge."},{"n":4,"s":"Chordomas are rare malignant neoplasms arising from","o":["primitive notochordal remnants.","Rathke’s pouch.","the pharyngeal hypophysis.","parasellar and third ventricular regions.","the craniopharyngeal canal."],"k":"A","x":"Chordomas arise from primitive notochordal remnants. Rathke’s pouch and the pharyngeal hypophysis, which is anterior to Thornwaldt’s bursa, are one and the same. This is an area of endoderm in the nasopharynx that may remain connected to the primitive notochord but is not the site of origination of chordomas. Craniopharyngiomas arise in the parasellar region. The craniopharyngeal canal, which runs from the sella turcica through the body of the sphenoid and is also associated with cysts owing to the persistence of Rathke’s pouch, is not the site of origination of chordoma."},{"n":5,"s":"A teratoid cyst located in the nasopharynx was removed from a 1-week-old infant with respiratory distress. Histologically, the lesion would be expected to reveal","o":["ectoderm only.","mesoderm only.","ectoderm and endoderm.","ectoderm, mesoderm, and endoderm.","ectoderm and mesoderm."],"k":"D","x":"Response A is incorrect as ectoderm alone would be inconsistent with any form of teratoma. The same is true of mesodermal elements alone. The combination of ectoderm and endoderm is not seen in the teratoid cyst, whereas all three elements of ectoderm, mesoderm, and endoderm are encountered in teratoid cysts. Ectoderm and mesoderm are seen in dermoid cysts."},{"n":6,"s":"Computed tomography (CT) and magnetic resonance imaging (MRI) would be expected to be most helpful in planning the surgical removal of which of the following lesions?","o":["nasal glioma","Thornwaldt’s cyst","floor-of-mouth dermoid","basal-type encephalocele","cervical teratoma"],"k":"D","x":"Of all of the responses, the only one with an intracranial connection is the basal-type encephalocele. Nasal gliomas, by definition, are heterotopic neural tissue that is not connected intracranially. Thornwaldt’s cysts arise in the nasopharynx and do not have any intracranial connection. Floor-of-mouth dermoids and cervical teratomas do not require both forms of imaging. The use of CT and MRI for basal-type encephaloceles is essential to plan surgical removal. Both of these studies are not necessary to make a determination regarding the removal of the other lesions."},{"n":7,"s":"A 22-year-old female presents with galactorrhea, homonymous hemianopsia, and hypopituitarism. This constellation of symptoms and signs is most likely to be seen with","o":["Thornwaldt’s cyst.","nasopharyngeal teratoma.","chordoma.","Rathke’s cyst.","teratoid cyst."],"k":"D","x":"Rathke’s cyst most commonly presents with headache followed by galactorrhea, visual field loss, and hypopituitarism. Chordoma is a distinct possibility. However, only 50% of chordomas occur in the spheno-occipital area. They may present with an expanding nasopharyngeal mass, frontal headaches, cranial nerve palsies, and pituitary abnormalities. This wider range of presenting signs and symptoms, however, is more commonly seen in younger children than in adults. Nasopharyngeal teratoma, Thornwaldt’s cyst, and teratoid cyst are not associated with these symptoms and signs."},{"n":8,"s":"In 50% of cases, the Pierre Robin sequence (PRS) includes the triad of glossoptosis, micrognathia, and","o":["microcephaly.","hemifacial microsomia.","cleft palate.","congenital facial paralysis.","dextrocardia."],"k":"C","x":"The PRS includes glossoptosis, micrognathia, and cleft palate in 50% of cases. Associated findings have included cardiac defects but not specifically dextrocardia. Möbius’syndrome or nonprogressive congenital facial diplegia is a subset of the PRS. Therefore, response D is a possibility, and although facial dysmorphism has been reported in PRS, specific hemifacial microsomia as an element of the PRS has not been reported. Therefore, response B is unlikely. Microcephaly is not observed in PRS, although mental retardation is."},{"n":9,"s":"The immotile cilia syndrome in its most recognized form is associated with all of the following except","o":["axonemal dynein defects.","bronchiectasis.","chronic sinusitis.","situs solitus.","sterility."],"k":"D","x":"Kartagener’s syndrome is a quartet of bronchiectasis, chronic sinusitis, situs inversus, and sterility. It is associated with ultrastructural defects in dynein complexes. Therefore, the best response is situs solitus, normal visceral arrangement, as opposed to situs inversus."},{"n":10,"s":"Nonsyndromic cleft lip and cleft palate is","o":["associated with first or second arch anomalies.","caused by single-gene transmission.","accompanied by systemic organ malformations.","secondary to multifactoral inheritance.","attributable to environmental factors"],"k":"D","x":"Nonsyndromic cleft palate is felt to be attributable to multifactorial inheritance in those patients with no obvious first or second arch anomalies or systemic organ malformation. In addition, single-gene transmission is not consistent with nonsyndromic malformation but rather is seen in syndromic malformation. It is felt that environmental factors may play a role in syndromic clefting rather than nonsyndromic cleft lip and palate."}]},{"t":"Disorders of Voice, Speech, and Language","q":[{"n":1,"s":"An underdeveloped larynx, a laryngeal web, structural asymmetry within the vocal folds, or swelling of the glottal margin near the anterior commissure is most likely to result in","o":["low pitch disorder.","vocal loudness problems.","harshness.","aphonia.","high pitch disorder."],"k":"E","x":"In each of the conditions specified, a shorter vibrating margin of the vocal folds would result, thereby increasing the frequency of vocal fold vibration. In an underdeveloped larynx, the vocal folds would be smaller than normal for a person of a given age and gender; consequently, the talker would have a higher than normal pitch. With a laryngeal web, the free vibrating edge of the vocal folds is reduced, creating a higher than normal pitch. With structural asymmetry, during closure of the vocal folds, the vocal process of one arytenoid cartilage may slide over the other in such a manner that the posterior parts of the membranous folds are pressed together. This reduces the length of the vibrating portion of the vocal fold. Swelling near the anterior commissure can also reduce the vibrating length of the vocal folds and increase the fundamental frequency of vibration."},{"n":2,"s":"Which of the following issues is usually not included in the nonmedical rehabilitation of persons with voice disorders?","o":["psychological factors","environmental factors","sleep habits of the patient","patient’s evaluation of the voice problem","assessed capabilities of the patient’s voice"],"k":"C","x":"Psychological factors are often of considerable importance in functional voice disorders. Similarly, patients whose employment settings require loud talking or who engage in loud cheering at sporting events need to change their environment during the course of therapy. The patient’s perception of the voice problem is crucial since the patient hears his/her own voice differently than do other listeners. The voice therapist must have an accurate assessment of the range of laryngeal capabilities of the patient before structuring appropriate vocal targets for the patient."},{"n":3,"s":"Patients who have Reinke’s edema, have undergone hormonal virilization therapy, have voices with a lot of “vocal fry,” or have tremulousness in the voice will most likely have","o":["low pitch disorder.","vocal loudness problems.","hoarseness.","aphonia.","high pitch disorder."],"k":"A","x":"Patients with Reinke’s edema and those who have undergone virilization treatments experience an increase in the size (thickness) of the vocal folds. The increased thickness results in a lower than normal pitch level during phonation. Patients who use vocal fry are usually producing vocal sounds with a fundamental frequency below 75 Hz. Tremulousness is often associated with a lack of vibratory control of the thickened vocal folds and, hence, low pitch phonations."},{"n":4,"s":"During the past 25 years, the incidence of laryngeal cancer","o":["has continued to increase.","has continued to decrease.","has increased for males and decreased for females.","has increased faster for females than for males.","is proportional to the change in smoking practices in the United States."],"k":"D","x":"The female-to-male ratio has increased progressively, even in the presence of a constant proportion of cases in the general population."},{"n":5,"s":"Many different solutions have been applied to the task of restoring speech communication following laryngectomy. Which of the following approaches requires the use of the patient’s hands to be effective?","o":["tracheoesophageal shunts","artificial larynx (battery powered)","pseudoglottis","esophageal speech","combined surgical and artificial device"],"k":"B","x":"The battery-powered artificial larynx requires the patient to activate a handheld artificial larynx that vibrates a diaphragm that is held against the neck or pharynx."},{"n":6,"s":"Functional articulation errors usually do not include","o":["omissions.","dysfluencies.","distortions.","substitutions.","additions."],"k":"B","x":"Dysfluencies are usually associated with stuttering, rather than with functional articulation problems. All of the other foils are types of articulation disorders."},{"n":7,"s":"When multiple dysmorphisms appear in the same patient, consultation with a medical geneticist is prudent to","o":["decide which problem to treat first.","identify the specific syndromes involved.","rule out functional components of the speech disorder.","determine if the speech disorder is of genetic origin.","determine whether evaluation and treatment of the family as well as the patient are necessary."],"k":"E","x":"With multiple dysmorphisms, genetic predispositions may necessitate family birth counseling as well as other treatment considerations."},{"n":8,"s":"The primary difference between dysarthria and apraxia of speech motor control is that apraxia is characterized by","o":["impairment of speech movement programming.","muscle weakness.","slowness.","incoordination.","altered muscle tone."],"k":"A","x":"Impairment of speech movement programming is characteristic of apraxia. All of the other foils are appropriate descriptors of motor speech dysarthria."},{"n":9,"s":"Stuttering behaviors during speech production by children often cause parents to become anxious. The parents of a young child with incipient stuttering should","o":["subject the child to direct speech therapy for the disorder as soon as possible.","focus their attention on the child and tell the child to “speak correctly.”","be attentive, thoughtful, but nonevaluative listeners.","take the child to a psychologist.","imitate the child’s stuttering so that the child can hear how bad (or silly) it sounds."],"k":"C","x":"Anything that brings attention to the problem of incipient stuttering usually makes it worse. If the parents can simply accept what is a fairly typical behavior in young children, the child usually will pass through this stage and continue to develop communication skills in a normal manner. Only after the stuttering behavior has been present for 6 months to a year, or if the stuttering behaviors reflect more struggle on the part of the child, should the child be brought to the attention of a speech-language pathologist who specializes in treatment of stuttering in children."},{"n":10,"s":"Language disorders deal with problems of symbolic representation of thought and action. These disorders can involve the lexicon, syntax, morphology (word forms), semantics, and pragmatic uses of language. A patient with Wernicke’s aphasia suffers from","o":["deficits in verbal output and comprehension in speech, reading, and writing.","telegraphic speech and impaired writing skills.","motor speech output problems.","significant comprehension deficits.","marked deficit in speech repetition with numerous sound and word errors."],"k":"D","x":"Deficits in verbal output and comprehension in speech, reading, and writing are characteristic of global aphasia. Telegraphic speech and impaired writing skills represent symptoms of transcortical motor aphasia. Motor speech output problems are typical of Broca’s motor aphasia. A marked deficit in speech repetition with numerous sound and word errors characterizes features of conduction aphasia. The patient with Wernicke’s aphasia has a rather fluent but jargon-like verbal output, but the primary problem is in comprehension."}]},{"t":"Airway Control and Laryngo-Tracheal Stenosis in Adults","q":[{"n":1,"s":"Which of the following is not a symptom or sign of airway obstruction?","o":["hoarseness","dyspnea","stridor","subcutaneous emphysema","intercostal retraction"],"k":"D","x":"Hoarseness, dyspnea, stridor, and intercostal retraction are symptoms or signs of airway obstruction. Subcutaneous emphysema is a sign of airway damage but is not specific for airway obstruction."},{"n":2,"s":"The most appropriate positioning maneuver used to improve a tenuous airway in a trauma patient is","o":["head tilt/chin lift","cricoid pressure","jaw thrust","hyoid pressure","tongue retrusion"],"k":"C","x":"The jaw thrust is the most appropriate positioning maneuver used to improve a tenuous airway in a trauma patient. A head tilt/chin lift may be successful in improving the airway but risks cervical spinal cord injury in a trauma patient. Cricoid pressure and hyoid pressure are not positioning maneuvers that would improve an airway. Tongue retrusion would lead to airway compromise."},{"n":3,"s":"Which of the following statements about cricothyroidotomy is true?","o":["A cricothyroidotomy incision should be made along the inferior aspect of the cricoid cartilage.","The cricothyroid membrane should be incised in a vertical fashion.","Cricothyroidotomy is best used for long-term airway management.","Complications of cricothyroidotomy include true vocal cord damage, subcutaneous emphysema, and subglottic stenosis.","Cricothyroidotomy should not be used in an emergency."],"k":"D","x":"Cricothyroidotomy is best used for acute or short-term airway management. A cricothyroidotomy incision should be made horizontally in the cricothyroid membrane. Reported complications of the procedure include true vocal cord damage, subcutaneous emphysema, and subglottic stenosis. It is a rapid way to establish an airway in upper respiratory obstruction."},{"n":4,"s":"Which of the following statements about the creation of a permanent tracheostoma is true?","o":["The surrounding skin should directly abut the tracheal mucosa.","Permanent tracheostomas result in a longer tracheostomy tract than traditional tracheostomy stomas.","Granulation tissue is more likely to form in a permanent tracheostoma than a traditional tracheotomy stoma.","A permanent tracheostoma is more difficult to cannulate than a traditional tracheostomy tract.","None of the above are true."],"k":"A","x":"In creating a permanent tracheostoma, the skin should directly abut the tracheal mucosa. This procedure results in the advantages of decreased granulation tissue and a shorter tracheotomy tract as compared with a traditional tracheostomy stoma."},{"n":5,"s":"Subcutaneous emphysema after a tracheostomy","o":["results from making the opening in the trachea too large.","results from closing a tracheostomy incision too tightly.","should always be treated with chest tube placement.","does not pose a significant risk to the patient.","always requires operative intervention to alleviate subsequent airway distress."],"k":"B","x":"Subcutaneous emphysema after a tracheostomy results from closing the tracheostomy incision too tightly. In this situation, air escaping from the trachea cannot passively egress out of the tracheostomy incision and may be forced into the fascial planes of the neck. Although this complication is usually self-limiting and does not require intervention, it can progress to pneumomediastinum and predispose the patient to mediastinitis if bacterial contamination occurs."},{"n":6,"s":"Which of the following statements concerning the immediate management of innominate artery rupture is false?","o":["The tracheostomy tube should be replaced with a cuffless tracheostomy tube.","The innominate artery should be compressed digitally against the manubrium.","The patient should be taken to the operating room.","The tracheostomy tube should be replaced with a longer endotracheal tube.","A cardiothoracic surgeon should be summoned."],"k":"A","x":"When massive hemorrhage caused by innominate artery rupture occurs, the tracheostomy tube should be removed and immediately replaced with a longer endotracheal tube to secure the airway below the area of bleeding. Digital pressure should be applied to compress the innominate artery against the manubrium, and the patient should be immediately taken to the operating room for thoracotomy and control of the bleeding vessel."},{"n":7,"s":"Which of the following is not a risk factor for aspiration?","o":["hyperinflation of the tracheostomy cuff","tracheostomy","a soft, solid diet","loss of the glottic closure reflexes","the supine position"],"k":"C","x":"Tracheostomies actually increase the risk of aspiration by decreasing the glottic closure reflexes. Hyperinflation of a tracheostomy cuff may also cause aspiration by compressing the esophageal lumen. A soft, solid diet results in a decreased risk of aspiration when compared with a liquid diet. An upright position tends to prevent aspiration."},{"n":8,"s":"Which of the following statements about the carbon-dioxide laser is true?","o":["The carbon-dioxide laser lacks precision.","The carbon-dioxide laser should not be used to coagulate vessels under 0.5 mm in diameter.","The carbon-dioxide laser is most often used in a fiberoptic delivery system.","The carbon-dioxide laser is able to deliver a small spot size.","The carbon-dioxide laser produces a visible red beam of light."],"k":"D","x":"The advantages of the carbon-dioxide laser are that it is precise and capable of delivering a very small spot size. The disadvantages of this laser are that it is not good at coagulating vessels larger than 0.5 mm in diameter and cannot be easily delivered with a fiberoptic delivery system.Although its beam is invisible, the focusing lens usually is treated with special coatings to allow the helium-neon aiming beam and the carbon-dioxide beam to be focused coplanar."},{"n":9,"s":"An area of circumferential tracheal stenosis in a 49-year-old man measuring 2.5 cm in length and located 2 cm below the cricoid cartilage is best treated by which modality?","o":["endoscopic laser vaporization","resection of the segment with primary anastomosis","laryngotracheoplasty with anterior cartilage grafting","laryngotracheoplasty with anterior and posterior cartilage grafting","laryngotracheoplasty with hyoid bone interposition grafting"],"k":"B","x":"A 2.5 cm segment of tracheal stenosis located 2 cm below the cricoid cartilage could be easily excised and anastomosed primarily. Endoscopic laser vaporization is not ideal for circumferential lesions or lesions measuring more than 1 cm in length. A laryngotracheoplasty would not be necessary in this case."},{"n":10,"s":"Which of the following has not been linked to cricoarytenoid joint dysfunction?","o":["traumatic intubation","external trauma","osteoarthritis","rheumatoid arthritis","gout"],"k":"C","x":"Traumatic intubation and external trauma are documented causes of arytenoid cartilage dislocation. Inflammatory lesions such as gout and rheumatoid arthritis have been linked to cricoarytenoid joint fixation. Osteoarthritis is not related to cricoarytenoid joint dysfunction."}]},{"t":"Trauma to the Larynx","q":[{"n":1,"s":"Which of the following mechanisms describes the most common biomechanics of laryngeal trauma?","o":["laryngeal fracture, resulting in hemoptysis and asphyxiation","striking the laryngeal skeleton against the vertebral column, resulting in a crush injury","laryngeal edema release by sudden acceleration and deceleration of soft tissue, inciting the inflammatory cascade","penetrating injury, resulting in neck crepitance, pneumothorax, and pneumomediastinum","hematoma formation with loss of the airway"],"k":"B","x":"Although the other phenomena related to laryngeal trauma are often present, the mechanism of injury is most commonly the crush effect of compression of the laryngeal framework against a rigid body posteriorly, namely the vertebral column."},{"n":2,"s":"The radiographic evaluation of laryngeal injury plays an important role in the evaluation and management of laryngeal fracture. Which statement about the radiographic evaluation of laryngeal injury is most appropriate?","o":["Emergency barium swallow is indicated for patients complaining of dysphagia and odynophagia to rule out a tracheoesophageal fistula.","A computed tomographic (CT) scan should be obtained in all patients with suspected laryngeal trauma.","A lateral soft tissue film and chest radiograph at the bedside should be obtained to evaluate for pneumothorax and viscus penetration.","Magnetic resonance imaging scan of the larynx should be done to rule out a hematoma.","A CT scan is obtained when the airway has been stabilized with a tracheostomy."],"k":"B","x":"A CT scan is the most valuable test in the diagnosis of a laryngeal fracture. Some patients with minimal trauma may have laryngeal fracture despite minimal findings on initial evaluation. A CT scan may be obtained when the airway is stabilized, but it should be considered in all patients suspected to have laryngeal trauma. The other radiologic studies are, in general, not appropriate, at least for the purpose stated."},{"n":3,"s":"Surgical exploration of the larynx is indicated when","o":["there is a minimally displaced fracture of the thyroid cartilage.","the laryngeal fracture is associated with laryngeal edema.","there has been arytenoid cartilage avulsion.","there is limited mobility of one vocal fold.","there is evidence of cricothyroid muscle involvement."],"k":"C","x":"In general, a patient with arytenoid cartilage avulsion will have a laceration of the mucosa requiring exploration. Conservative management may be appropriate for the other situations. If a fracture of the thyroid cartilage is minimally displaced, it may not be possible to improve the situation by operative intervention. Edema without fracture displacement or laceration of the laryngeal mucous membrane need not be treated surgically. Limited vocal fold mobility owing to injury but not severance of the recurrent laryngeal nerve will likely recover without operative intervention. Injury to the cricothyroid muscle per se is not amenable to surgical repair."},{"n":4,"s":"The principles of cartilage fracture repair are especially complicated in the larynx owing to","o":["the poor blood supply of partially avulsed laryngeal cartilage.","the fragments being difficult to stabilize.","lacerations in the airway, resulting in infection.","secondary healing, resulting in granulation tissue formation and cicatrix.","all of the above."],"k":"E","x":"All of the above contribute to poor outcomes in patients sustaining blunt and penetrating injuries to the larynx."},{"n":5,"s":"All of the following likely require a laryngeal stent except","o":["telescoped cricoid cartilage fracture.","comminuted thyroid cartilage fracture.","disruption of the anterior commissure.","mucosal lacerations that require grafting.","all of the above."],"k":"E","x":"All of the above injuries require stenting because they are unstable fractures or full immobilization is needed for optimum soft tissue healing."},{"n":6,"s":"Proper workup and management of a patient with vocal fold hematoma and mild supraglottic edema on flexible laryngoscopy include all of the following except","o":["elevation of the head of the bed.","open exploration.","voice rest.","humidified air.","Computed tomography (CT) scan of the larynx."],"k":"B","x":"The described injuries are minor and can be managed with conservative measures, including elevation of the head of the bed, voice rest, and humidification. A CT scan would be helpful in assessing the full extent of the injuries. Open reduction is not indicated at this time because there are no mucosal lacerations, displaced fractures, or exposed or dislocated cartilages."},{"n":7,"s":"A 29-year-old man presents to the emergency department after striking the anterior part of his neck against a fence post while riding a motorcycle at 20 miles per hour. He is alert and oriented, with normal and stable vital signs other than mild tachypnea. He has severe dysphonia, mild hemoptysis, and subcutaneous crepitus. The best approach to the management of his airway is","o":["fiberoptic endotracheal intubation.","cricothyrotomy under local anesthesia.","tracheostomy under local anesthesia.","direct laryngoscopy and intubation.","rigid bronchoscopy with a ventilating scope followed by tracheostomy."],"k":"C","x":"This patient sustained a “clothesline”-type injury. Although he is currently stable, he may have impending airway obstruction secondary to cricotracheal separation. No attempt should be made to manipulate the laryngeal or subglottic airway. The safest way to manage his airway is with a tracheostomy under local anesthesia."},{"n":8,"s":"Best results are obtained in open reduction and internal fixation of laryngeal fractures if","o":["the procedure is performed 7 to 10 days after the injury to allow the edema to subside.","a stent is used to buttress the fixation.","all mucosal lacerations are closed.","any unstable cartilage is removed.","wires are used to fixate the reduced fracture sites instead of miniplates."],"k":"C","x":"Closure of all mucosal lacerations is a major tenet of managing laryngeal fractures. Fractures should be reduced within 72 hours of injury.All viable cartilage is preserved. Stents are used only in unstable fractures or if mucosal grafts are used. Either wires or miniplates can be used to fixate fractures."},{"n":9,"s":"In general, the problem of late glottic insufficiency after laryngeal trauma may be addressed by all of the following except","o":["medialization laryngoplasty.","reconstruction with laryngeal stenting and grafting.","fat injection.","speech rehabilitation","supraglottic laryngectomy."],"k":"E","x":"Supraglottic laryngectomy would be an appropriate choice if the problem is laryngeal stenosis and not laryngeal insufficiency."},{"n":10,"s":"The major cause of delayed laryngeal chondronecrosis following full-course radiotherapy is","o":["mucosal edema secondary to venous congestion.","infection secondary to poor ciliary function.","irreversible microvascular injury owing to intimal hyperplasia.","lymphatic outflow congestion.","mucosal dryness secondary to damage to mucous glands."],"k":"C","x":"Although all of the above do occur and contribute to radiation toxicity in the larynx, the major cause of chondronecrosis is ischemia from damage to the microvasculature."}]},{"t":"Infectious and Inflammatory Diseases of the Larynx","q":[{"n":1,"s":"Laryngopharyngeal reflux differs from gastroesophageal reflux disease in all of the following ways except","o":["patients with laryngopharyngeal reflux frequently experience daytime reflux.","patients with laryngopharyngeal reflux typically experience upright reflux.","patients with laryngopharyngeal reflux frequently suffer from heartburn.","patients with laryngopharyngeal reflux often suffer from globus and chronic cough.","patients with laryngopharyngeal reflux often suffer from hoarseness."],"k":"C","x":"Laryngopharyngeal reflux differs from gastroesophageal reflux disease in that patients with laryngopharyngeal reflux usually experience daytime, upright reflux. Typical symptoms include globus, hoarseness, and chronic cough. Only one-third of patients with laryngopharyngeal reflux admit to having heartburn."},{"n":2,"s":"The most common laryngeal inflammatory disorder in children is","o":["laryngopharyngeal reflux.","herpes simplex laryngitis.","vocal misuse and abuse.","viral laryngotracheitis.","acute supraglottitis."],"k":"D","x":"Viral laryngotracheitis is the most common laryngeal inflammatory disorder of childhood. It is responsible for 15% of respiratory disease seen in pediatric practice. Usually, this condition is self-limited, occurs in children under the age of 3 years, and has a seasonal peak, with most cases occurring during the winter."},{"n":3,"s":"The initial management for a child with suspected supraglottitis is","o":["referral to radiology for a soft tissue lateral radiograph of the neck.","fiberoptic laryngoscopy to confirm the diagnosis.","consultation with pediatric infectious disease for antimicrobial recommendations.","supervised transport to the operating room to secure the airway.","admission to the pediatric intensive care unit for observation and intravenous antibiotics."],"k":"D","x":"The child with suspected epiglottitis should be taken to the operating room immediately to establish the diagnosis and secure an airway. The child is transported to the operating room by the parents, an otolaryngologist, and an anesthesiologist. Examination of the epiglottis may precipitate airway obstruction and thus is not recommended."},{"n":4,"s":"Adult supraglottitis (epiglottitis) differs from pediatric supraglottitis in all of the following ways except","o":["in adults, the infectious agent is less likely Haemophilus and more likely group A streptococcus.","in adults, the clinical course is usually less severe.","in adults who present with drooling, endotracheal intubation is frequently necessary.","in adults, progression to epiglottic abscess is more common.","in adults, conservative measures include oxygenation, humidification, hydration, corticosteroids, and intravenous antibiotics."],"k":"C","x":"Although the clinical course of adult supraglottitis (epiglottitis) is usually less severe, persons who present with drooling usually require endotracheal intubation."},{"n":5,"s":"Isolated laryngeal candidiasis is usually secondary to","o":["prolonged antimicrobial use.","systemic corticosteroid use.","inhaled corticosteroid use.","insulin-dependent diabetes.","infection with human immunodeficiency virus."],"k":"C","x":"Severe immunosuppression (owing to chemotherapy or acquired immune deficiency syndrome is associated with the development of invasive laryngeal candidiasis, and, as expected in such patients, the infection is often more serious and sometimes can be life threatening owing to bleeding or airway obstruction. Isolated laryngeal candidiasis (without the involvement of any other contiguous anatomic structures) usually occurs in patients who use corticosteroid inhalers."},{"n":6,"s":"Which of the following may result in secondary muscle tension dysphonia?","o":["Bogart-Bacall syndrome","psychogenic dysphonia","cheerleading","presbylaryngis","teaching"],"k":"D","x":"Primary muscle tension dysphonia is a generic term for any “functional” voice disorder caused by chronic vocal abuse or misuse. Secondary, or compensatory, muscle tension dysphonia is a result of an underlying glottal insufficiency. The glottal incompetence may be secondary to presbylaryngis, vocal fold paralysis, or vocal fold paresis."},{"n":7,"s":"Which of the following is not an indication to remove a vocal process granuloma?","o":["When there is concern for underlying laryngeal carcinoma.","When the lesion has progressed to a fibroepithelial polyp.","When the lesion has been present for more than 6 weeks.","When there is concern for airway obstruction.","When a professional voice user is severely dysphonic."],"k":"C","x":"Although surgical removal of a vocal process granuloma is seldom indicated, there are three instances when it should be considered: (1) when the clinician is concerned about the possibility of carcinoma, (2) when the lesion has matured and taken on the appearance of a fibroepithelial polyp, and (3) when the airway is obstructed. A professional voice user with significant vocal needs may also require removal.Vocal process granulomas may take 6 months or more to heal on antireflux therapy. A persistent granuloma at 6 weeks is not an indication for removal."},{"n":8,"s":"Pseudosulcus vocalis refers to","o":["an adhesion of the vocal fold epithelium to the underlying vocal ligament.","a vocal fold scar.","subglottic edema that is a manifestation of laryngopharyngeal reflux.","a type of vocal fold pseudocyst.","an area of localized Reinke’s edema."],"k":"C","x":"Pseudosulcus vocalis refers to a pattern of subglottic edema that extends from the anterior commissure to the posterior larynx; it appears like a groove or sulcus. It can easily be differentiated from a true sulcus (sulcus vergeture) that is the adherence of the vocal fold epithelium to the vocal ligament secondary to the absence of the superficial layer of lamina propria. True sulcus is related to scarring of the vocal fold(s) in the phonatory striking zone."},{"n":9,"s":"Treatment for laryngeal diphtheria includes all of the following except","o":["securing the airway with a tracheostomy tube if necessary.","securing the airway with an endotracheal tube if necessary.","fluid resuscitation and supportive care.","antimicrobial therapy with penicillin or erythromycin.","administration of diphtheria antitoxin."],"k":"B","x":"Endotracheal intubation can dislodge membranous debris and cause airway obstruction in patients with diphtheria involving the larynx. It should be avoided."},{"n":10,"s":"Which of the following statements is not true about laryngeal tuberculosis?","o":["It is one of the most common granulomatous diseases of the larynx.","It is usually associated with advanced pulmonary disease.","Its prevalence has been rising since the emergence of HIV.","The clinical presentation is often similar to that of a neoplastic process.","One-quarter of patients with laryngeal tuberculosis present with airway obstruction."],"k":"B","x":"Laryngeal tuberculosis is one of the most common granulomatous diseases of the larynx. It is usually not associated with advanced pulmonary disease and therefore may be mistaken for laryngeal carcinoma. Its prevalence has been increasing since the emergence of HIV. One-quarter of patients with laryngeal tuberculosis present with airway obstruction."}]},{"t":"Neurogenic and Functional Disorders of the Larynx","q":[{"n":1,"s":"Which is the best speech item for evaluating phonation on fiberoptic laryngoscopy?","o":["glottal stops","voiceless consonants","the vowel “ah”","the vowel “ee”","all of the above"],"k":"D","x":"High-frequency vowel sounds such as /i/ or “ee” position the tongue base and epiglottis high and anteriorly, optimizing the view of the larynx during flexible endoscopy."},{"n":2,"s":"Which of the following are examples of speech in Parkinson’s disease?","o":["“wet hoarseness”","trailing loss of volume","staccato bursts in speech","intermittent breaks in vowels","none of the above"],"k":"B","x":"Parkinson’s disease is characterized by reduced loudness and breathy voice quality (hypophonia). The voice often fades into breathiness in contextual speech. “Wet hoarseness” is characteristic of amyotrophic lateral sclerosis and results from poor management of secretions owing to flaccidity. Staccato bursts in speech and harsh voice quality may occur in patients with multiple sclerosis owing to spasticity and tremor. Intermittent breaks in vowels occur in adductor spasmodic dysphonia."},{"n":3,"s":"Which procedure is now infrequently used owing to the late complication of granuloma formation?","o":["Teflon injection","collagen injection","autologous fat injection","Gelfoam injection","recurrent laryngeal nerve anastomosis"],"k":"A","x":"Although initially good or excellent voice results can be achieved with Teflon paste injection for medialization of the vocal fold, local granulomatous inflammatory reactions to Teflon are now well recognized. Surgical management of this complication is difficult and frequently results in impaired voice quality. Owing to this complication, use of Teflon is now usually reserved for treatment of terminally ill patients."},{"n":4,"s":"Which of the following is not likely to result in unilateral vocal fold paralysis/paresis?","o":["Parkinson’s disease","abductor spasmodic dysphonia","a peripheral neuropathy","paradoxical vocal fold movement disorder","none of the above"],"k":"D","x":"Transient or permanent vocal fold paresis/paralysis has been observed in patients with peripheral neuropathy, abductor spasmodic dysphonia, and Parkinson’s disease. Patients with paradoxical vocal fold motion typically have normal vocal fold motion for speech but have inappropriate adduction of the vocal folds during the inspiratory phase of respiration."},{"n":5,"s":"Speech/voice therapy can be helpful in which of the following?","o":["Parkinson’s disease","paradoxical vocal fold movement disorder","muscular tension dysphonia","mutational falsetto","all of the above"],"k":"E","x":"Voice therapy can improve speech intelligibility in patients with Parkinson’s disease, increasing vocal intensity. Techniques focusing on breathing control and vocal relaxation may be helpful in patients with muscular tension dysphonia and paradoxical vocal fold motion. Laryngeal maneuvering can be beneficial in treatment of the abnormal laryngeal posturing seen in mutational falsetto."},{"n":6,"s":"The current treatment of choice for adductor spasmodic dysphonia is","o":["botulinum toxin injection into the thyroarytenoid muscle.","bilateral selective denervation.","recurrent laryngeal nerve avulsion.","voice therapy.","botulinum toxin injection into the cricothyroid muscle."],"k":"A","x":"Botulinum toxin injection of the thyroarytenoid muscle is currently considered the treatment of choice for patients with adductor spasmodic dysphonia (ADSD) owing to its high rate of effectiveness (> 90%), lack of serious or permanent side effects, and the fact that it causes no permanent alteration of laryngeal structures. Injection of the cricothyroid muscle is generally ineffective inADSD but may benefit selected patients with abductor spasmodic dysphonia. For patients with ADSD who do not respond to botulinum toxin or who are unwilling or unable to tolerate repeated injections, recurrent laryngeal nerve avulsion or bilateral selective denervation may provide long-term control of symptoms.Voice therapy alone is usually not effective for the management ofADSD but may extend the symptomatic relief obtained from botulinum toxin injections."},{"n":7,"s":"The treatment of choice for chronic unilateral vocal fold paralysis without a large posterior glottal gap is","o":["collagen injection.","voice therapy.","type I thyroplasty.","recurrent laryngeal nerve anastomosis.","Teflon injection."],"k":"C","x":"Type I thyroplasty provides stable yet reversible vocal fold medialization in patients with a unilateral vocal fold paralysis, although a concomitant arytenoid adduction procedure may be necessary in patients with a large posterior glottal gap. Collagen injection may be useful in selected patients with a small anterior glottal gap, but variable resorption may occur over time. Voice therapy is useful in preventing vocally abusive compensatory behaviors but will not alone provide adequate vocal rehabilitation for many patients.Although some authors have achieved promising results with various recurrent laryngeal nerve anastomosis procedures, these procedures are often technically difficult and require a prolonged period (3 to 6 months) following surgery before beneficial effects are seen. Teflon injection is now rarely used owing to late postoperative granuloma formation."},{"n":8,"s":"Which procedure is not indicated for vocal fold paralysis with aspiration?","o":["tracheostomy","laryngectomy","arytenoidectomy","medialization thyroplasty","Teflon injection"],"k":"C","x":"Arytenoidectomy would worsen aspiration by causing posterior glottal incompetence. Medialization thyroplasty and Teflon injection may be helpful in reducing aspiration in patients by reducing or eliminating glottic incompetence during swallowing. Tracheostomy may not reduce aspiration but facilitates pulmonary toilet and management of copious secretions. Laryngectomy provides permanent and complete relief in patients with severe, life-threatening aspiration but sacrifices the voice."},{"n":9,"s":"Which of the signs/symptoms is not associated with Wallenberg’s syndrome (lateral medullary syndrome)?","o":["vocal fold paralysis","contralateral reduction in pain/temperature sensation of the face","nausea","vertigo","diplopia"],"k":"B","x":"Wallenberg’s syndrome results in vocal fold paralysis, ipsilateral reduction of pain/temperature sensation of the face, nausea, vertigo, diplopia, and intractable hiccupping. These findings result from occlusion of the posterior inferior cerebellar artery."},{"n":10,"s":"Which of the following statements regarding muscular tension dysphonia is false?","o":["Vocal nodules may be present.","Suprahyoid and paralaryngeal muscles often demonstrate palpably increased phonatory muscle tension.","Response to botulinum toxin injection reliably differentiates this disorder from adductor spasmodic dysphonia.","Voice therapy is frequently beneficial.","Abnormal vocal fold positioning is consistent regardless of the type of speech."],"k":"C","x":"Both patients with spasmodic dysphonia and muscular tension dysphonia may derive benefit from botulinum toxin injections; response to this treatment is not a reliable means of differentiating these two conditions. Increased muscle tension, inflammatory changes of the laryngeal mucosa (nodules, erthema, edema), and abnormally increased laryngeal tension across various types of speech tasks are characteristic of muscular tension dysphonia. Laryngeal massage and voice therapy aimed at reducing laryngeal muscle tension are frequently effective treatment."}]},{"t":"Neoplasms of the Larynx and Laryngopharynx","q":[{"n":1,"s":"The most common synchronous secondary primary tumor in patients with laryngeal carcinoma is","o":["floor of the mouth carcinoma.","bronchogenic carcinoma.","base of the tongue carcinoma.","lymphoma.","esophageal carcinoma."],"k":"B","x":"The most common secondary primary cancer in patients with laryngeal carcinoma is bronchogenic carcinoma. Other sites that may be involved include any area of the upper aerodigestive tract. The lung is also the most common site for a metachronous second primary tumor in patients with laryngeal cancer."},{"n":2,"s":"Supraglottic carcinoma","o":["arises from pseudostratified squamous epithelium.","most commonly originates on the aryepiglottic folds.","displays aggressive features earlier than glottic carcinoma.","spreads through lymphatics of the cricothyroid membrane.","rarely presents with nodal metastases."],"k":"C","x":"Supraglottic carcinoma typically arises on the epiglottis and behaves aggressively at an earlier point than most glottic carcinomas. Nodal metastases are present in 30% of patients with clinically N0 necks. Lymphatic spread occurs bilaterally, exiting the thyrohyoid membrane with the superior laryngeal vessels to involve cervical levels II and III first. The unique drainage pathways of the supraglottis are attributable to an embryonic origin that is separate from the rest of the glottic and subglottic larynx, such that inferior spread via the cricothyroid membrane does not occur."},{"n":3,"s":"Severe dysplasia of the vocal fold","o":["was first discovered in chimney sweeps.","typically causes loss of the mucosal wave on videostroboscopy.","is characterized by an increase in keratin thickness.","may penetrate the basement membrane.","becomes invasive carcinoma in up to 25% of patients."],"k":"E","x":"The vocal fold epithelium goes through typical changes in the development of invasive carcinoma in which the normal progressive maturation of cells from the basal layer to the superficial epithelium is lost. This condition (dysplasia) may range from mild to severe, the latter being generally considered as carcinoma in situ (Cis). When Cis penetrates the basement membrane, it becomes invasive carcinoma. The risk of development of invasive carcinoma varies from 3 to 24%, depending on the degree of dysplasia. Aneuploidy is also a risk factor for invasive carcinoma."},{"n":4,"s":"In patients presenting with glottic carcinoma,","o":["hoarseness is the most common initial symptom.","pain occurs early in the disease.","nodal metastasis is the primary complaint.","most have had several months of dysphagia.","distant metastasis is common."],"k":"A","x":"Hoarseness is the initial symptom in glottic carcinoma. Dyspnea, dysphagia, and pain occur with advanced tumors, owing to invasion through cartilage and extralaryngeal structures. Later symptoms are cough, hemoptysis, halitosis, and weight loss. Patients with supraglottic carcinoma tend not to have symptoms until the disease is more advanced, and regional metastasis is often the first sign of illness. Distant metastasis is reported to occur in 8 to 10% of patients on presentation with laryngeal carcinoma."},{"n":5,"s":"In evaluating for occult nodal metastases from laryngopharyngeal malignancies, positron emission tomography","o":["is based on differential uptake of galactose by tumor cells.","provides the most anatomic detail of any imaging study.","is of no use in the clinically N0 neck.","is more sensitive and specific than computed tomography or magnetic resonance imaging.","is chosen for single-modality imaging."],"k":"D","x":"Positron emission tomography makes use of differential uptake of [18F]fluorodeoxyglucose; tumor cells take up greater concentrations of the tracer owing to increased metabolic demands. Positron emission tomography is more sensitive and specific than computed tomography or magnetic resonance imaging in detecting occult nodal disease but when used alone does not provide detailed anatomic information."},{"n":6,"s":"Which of the following is true regarding early carcinoma of the glottis?","o":["Radiation therapy tends to be favored over surgery owing to a higher cure rate.","Carcinoma in situ without an invasive component is rare.","Understaging of these tumors occurs in 75% of cases.","Fixation of the vocal fold has little impact on prognosis.","T3 tumors without impaired vocal fold mobility are considered “early carcinoma.”"],"k":"B","x":"Carcinoma in situ without an invasive component is relatively rare. Early glottic carcinomas are understaged 40% of the time. Impairment of vocal cord mobility (T2b) leads to a 20% decrease in survival over similar tumors with normal vocal cord function (T2a). In most institutions, radiation therapy is favored over surgical treatment of glottic carcinoma because it has been thought to allow superior vocal function. All T3 and T4 tumors are categorized as advanced carcinoma."},{"n":7,"s":"Which of the following statements is true regarding early supraglottic carcinoma?","o":["Location of the tumor does not influence prognosis.","Pulmonary function is not important in selecting therapy for early tumors.","Regional metastasis is rare.","The contralateral neck does not need to be treated.","Supraglottic laryngectomy, radiation therapy, and laser excision have similar cure rates."],"k":"E","x":"The cure rates for surgical excision, laser excision, and radiation therapy appear to be similar for T1 and T2 supraglottic carcinoma. Contraindications to surgical therapy include vocal fold fixation and poor pulmonary function. Many T1 and T2 tumors metastasize early to regional lymph nodes, and bilateral regional lymphatic treatment is necessary. Location of the tumor near the anterior commissure carries an increased risk of cartilage invasion, which reduces the cure rate."},{"n":8,"s":"Regarding advanced supraglottic carcinoma,","o":["surgery and radiation therapy have similar cure rates.","multimodality therapy is required for T3 and T4 lesions.","laser excision may cause less dysphagia and aspiration than open techniques for T3 lesions.","hyperfractionated and standard radiation therapy probably lead to similar cure rates.","treatment of the neck is not necessary in most cases."],"k":"C","x":"Laser excision of T3 supraglottic tumors is possible, and reports have demonstrated less dysphagia and aspiration with this procedure than with open techniques. The vocal results also appear to be improved. Treatment of the neck is also necessary for these T3 and T4 lesions. Because the supraglottic lymphatic drainage is bilateral, levels II, III, and IV of both sides of the neck must be addressed. For N+ necks, level V should be treated as well. Hyperfractionated radiation therapy appears to produce higher local cure rates than standard daily radiation."},{"n":9,"s":"In cases of advanced glottic carcinoma,","o":["surgical salvage after chemotherapy and radiation therapy is rarely possible.","induction chemotherapy with radiation therapy carries a survival rate similar to laryngectomy with postoperative radiation therapy.","chemotherapy as a single modality for cure is becoming common.","hyperfractionated radiation therapy causes an unacceptable rate of morbidity.","chemotherapy/radiation therapy and surgery have comparable morbidity."],"k":"B","x":"Extensive efforts are being directed at organ preservation protocols. Studies of laryngectomy with postoperative radiation therapy compared to induction chemotherapy with radiation therapy have shown similar survival rates, with 64% laryngeal preservation in the nonsurgical group. The morbidities of surgery and chemotherapy/radiation therapy are significant but quite different."},{"n":10,"s":"Which of the following statements is true regarding recurrence and metastases from laryngeal carcinoma?","o":["The incidence of distant metastasis by site is highest for lung, followed by bone and liver.","The risk of metastasis by site is highest for subglottic tumors followed by supraglottic and glottic.","Bone metastases, although less common than lung, allow longer average survival.","Parastomal recurrence is usually unresectable.","The dysphagia associated with incurable laryngeal cancer may be palliated by swallowing therapy."],"k":"D","x":"The most common site of distant metastasis is the lung, followed by the liver and bone. Metastasis to bone typically portends a survival time of less than 4 months; metastasis to lung has an average survival of 12 months. Parastomal tumor recurrence carries a poor prognosis, although recurrences above the equator of the stoma may be resectable. Lesions with the highest risk of distant metastasis are those in the supraglottis that extend to the hypopharynx and piriform sinus. Glottic primaries are the least likely to metastasize. Dysphagia associated with advanced, recurrent laryngeal cancer is probably best palliated with a gastric feeding tube."}]},{"t":"Neoplasms of the Nasopharynx","q":[{"n":1,"s":"Which area would have the lowest incidence of nasopharyngeal carcinoma?","o":["Beijing, People’s Republic of China","an Alaskan Inuit village","Buenos Aires, Argentina","Ho Chi Minh City, Vietnam","Taipei, Taiwan"],"k":"C","x":"The largest incidences of nasopharyngeal carcinoma are observed in Asian populations, particularly in southern areas of China. Other ethnic groups at higher risk include southeastern Asian countries, northern Africa, and certain Native American populations. Black, Hispanic, and Caucasian populations have the lowest incidences."},{"n":2,"s":"Which is the best prognosticator of survival from nasopharyngeal carcinoma?","o":["high angiogenesis in the tumor","poor differentiation","lung metastases","WHO type I histology","enlarged lymph nodes low in the neck"],"k":"B","x":"Patients with poorly differentiated nasopharyngeal carcinoma or the histology associated with WHO type III, the classic lymphoepithelioma, have the best prognosis, with 20 to 40% higher long-term survival. WHO type I lesions are well differentiated, and patients with them fare worse with currently available treatment."},{"n":3,"s":"Which are common findings at initial diagnosis of nasopharyngeal carcinoma?","o":["level V neck mass","serous otitis media","level IV neck mass","A and B","B and C"],"k":"D","x":"Serous otitis media with a conductive hearing loss often accompanies a nasopharyngeal mass. At presentation, posterior neck metastases would be far more common than base of neck masses in level IV."},{"n":4,"s":"Which radiographic studies are indicated in the workup for suspected nasopharyngeal carcinoma?","o":["mastoid films","magnetic resonance imaging (MRI) with gadolinium","coronal paranasal sinus computed tomography (CT)","positron emission tomography","all of the above"],"k":"B","x":"An MRI with gadolinium will help differentiate tumor from other soft tissue changes that may simply be postobstructive in the nasal cavity or paranasal sinuses. In the workup of a patient for nasopharynx carcinoma, a CT with contrast would also be helpful to demonstrate skull base erosion. A coronal paranasal sinus CT would not likely give enough information at the skull base to be considered a useful adjunctive study."},{"n":5,"s":"Which combination of treatments has been most successful for treating stage III nasopharyngeal carcinoma?","o":["paclitaxel and external beam radiation","cisplatin and external beam radiation","paclitaxel, external beam radiation, and radical neck dissection","cisplatin, external beam radiation, and brachytherapy","5-fluorouracil and external beam radiation"],"k":"B","x":"A phase III clinical trial has demonstrated much better diseasefree survival using a combination of cisplatin and radiation compared with radiation alone and is now considered standard treatment by most practitioners."},{"n":6,"s":"Which toxicity is common with current treatment for nasopharyngeal carcinoma?","o":["facial nerve paralysis","sensorineural hearing loss","tongue paralysis","osteoradionecrosis of the base of the skull","myelosuppression"],"k":"B","x":"Sensorineural hearing loss can complicate radiation therapy and cisplatin treatment for nasopharyngeal carcinoma in up to 30% of patients. Both modalities have ototoxic potential and are sometimes delivered to the cochlea simultaneously at high doses."},{"n":7,"s":"Which single chemotherapeutic agent has been most successful in a combined regimen for nasopharyngeal carcinoma?","o":["5-fluorouracil","cisplatin","methotrexate","doxorubicin","bleomycin"],"k":"B","x":"Cisplatin is clearly superior. Some of these other agents have been tried. 5-Fluorouracil, by itself, is not very successful. The combination of cisplatin and 5-fluorouracil has merit."},{"n":8,"s":"Who would be the most likely to develop a juvenile nasopharyngeal angiofibroma?","o":["a 6-year-old boy","a newborn girl","a 12-year-old girl with basal cell nevus syndrome","a 14-year-old boy from Mexico","a 7-year-old girl"],"k":"D","x":"Prepubescent and pubescent males are at the highest risk for juvenile nasopharyngeal angiofibroma."},{"n":9,"s":"Which is a prominent histologic feature of juvenile nasopharyngeal angiofibroma?","o":["well-organized fibrous stroma","a tumor capsule of dense collagen","positive staining for estrogen receptors","prominent arteries with intima and media","palisading of fibrocytes"],"k":"A","x":"The histology of juvenile nasopharyngeal angiofibromas is characterized by small sinusoidal vessels without a muscular layer in a dense fibrous stroma. The tumors are not encapsulated."},{"n":10,"s":"Which statement is true?","o":["The incidence of juvenile angiofibroma is increasing.","Skull base surgery approaches have improved nasopharyngeal cancer survival more than other treatment innovations.","To work up a patient with a nasopharyngeal lesion, optimally both CT and MRI with co
