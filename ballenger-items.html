<title>Ballenger Otorhinolaryngology — Examination Items</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600;font-size:.95rem}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA=[{"t":"Diagnostic Audiology, Hearing Aids, and Habilitation Options","q":[{"n":1,"s":"The unit for signal intensity, plotted on the audiogram as a function of signal frequency, is","o":["dB SPL.","dBA.","Hz.","dB HL.","dB SL."],"k":"D","x":"The reference for the intensity level used in plotting pure-tone and speech thresholds on the audiogram is the expected hearing level (HL) for young normally hearing persons. Thus, 0 dB HL is not the absence of sound but, rather, the intensity level just heard by a typically normal ear. Other intensity levels used in physical or audiologic measurements include dB sound pressure level (SPL) and dB sensation level (SL). The unit dBA is used in measurements of environmental noise levels. Hz refers to stimulus frequency, not intensity."},{"n":2,"s":"In patients with serious bilateral conductive hearing loss, a measurement problem associated with interference of the masking sound presented to the nontest ear with assessment of hearing thresholds for the test ear is referred to as the","o":["pure-tone average.","rollover.","loudness recruitment.","acoustic reflex.","masking dilemma."],"k":"E","x":"The masking dilemma occurs when enough masking to eliminate a response owing to stimulation of the nontest ear exceeds interaural attenuation and “crosses over” to the test ear, producing an error in threshold measurement. The other terms (pure-tone average, loudness recruitment, acoustic reflex, rollover) refer to other audiologic phenomena or measures."},{"n":3,"s":"Which of the following is not a component of aural immittance (impedance) measurement?","o":["tympanometry","masking level difference","static compliance","acoustic reflex","estimation of ear canal volume"],"k":"B","x":"All of the choices except the masking level difference (MLD) are well-established components of the immittance (impedance) test battery. The MLD is a measure of hearing threshold for pure-tone or speech signals in the presence of noise that is either in or out of phase with the signal. Masking is less effective when it is out of phase with the signal. This is referred to as release from masking. The MLD is mediated primarily at the brainstem level where interactions of input from each ear first occur."},{"n":4,"s":"The major anatomic generator of the wave V component of the auditory brainstem response is the","o":["lateral lemniscus.","cochlear nucleus.","superior olivary complex.","inferior colliculus.","medial geniculate body."],"k":"A","x":"The work of Aage Møller in the early 1980s delineated our understanding of the generators of the auditory brainstem response (ABR). The wave V component arises from the lateral lemniscus fibers just caudal to their arrival at the inferior colliculus. The inferior colliculus is anatomically complex, consisting of numerous regions and neuron types, and is therefore not capable of generating an ABR component. The ABR wave III receives contributions from the superior olivary complex. The cochlea is distal to, and the thalamus proximal to, the ABR anatomy."},{"n":5,"s":"Otoacoustic emissions are produced by the","o":["basilar membrane traveling waves.","round window membrane vibrations.","synchronous firing of the eighth cranial nerve fibers.","outer hair cell motility","efferent auditory system innervation of outer hair cells."],"k":"D","x":"It is now clear that energy related to outer hair cell movement following the presentation of sound to the ear is propagated outward from the basilar membrane through the ossicular chain and the tympanic membrane to the ear canal, where it is measured as otoacoustic emissions (OAEs). Activation of the efferent system typically suppresses outer hair cell motility and thus OAEs. Traveling waves along the basilar membrane play an important role in activating outer hair cells. The eighth cranial nerve does not influence OAE production."},{"n":6,"s":"Which of the following is not a benefit of binaural amplification?","o":["improved word identification, particularly in adverse listening conditions","elimination of the head shadow effect","increased perception of high-frequency consonants","decreased word identification scores over time","reduced gain"],"k":"D","x":"All of the choices except for “decreased word identification scores over time” are well-documented benefits of binaural amplification. In fact, a patient who has been fit monaurally may experience auditory deprivation in the unaided ear, resulting in a decline in word identification scores over time relative to the aided ear."},{"n":7,"s":"Which of the following is not a means for assessing hearing aid outcomes?","o":["real-ear measures","manufacturer specifications","self-assessment inventories","electroacoustic analysis","functional gain measures"],"k":"B","x":"Real-ear measures, self-assessment inventories, electroacoustic analysis, and functional gain measures are all routine procedures used by audiologists to assess hearing aid function and benefit. Manufacturer specifications merely state what that particular model of hearing aid is designed to do. Unfortunately, some hearing aids may not necessarily be performing within design specifications; therefore, it is important to assess its performance."},{"n":8,"s":"According to federal law, a customer may return a hearing aid to the dispenser for refund within how many days?","o":["15","30","45","60","No refund is available to the patient once the hearing aid leaves the dispenser’s office."],"k":"B","x":"According to federal law, a customer may return a hearing aid for refund during the 30-day trial period. However, some hearing aid companies extend the trial period without penalty."},{"n":9,"s":"What is the most popular hearing aid style used by children?","o":["in the ear","completely in the canal","behind the ear","in the canal","digitial hearing aid"],"k":"C","x":"The most popular hearing aid style for children is a behindthe-ear (BTE) hearing aid. This style offers the most flexibility in terms of hearing aid technology, frequency response characteristics, and use with assistive listening devices. Additionally, when a new earmold is being made, the child is not left without a hearing aid to use as he/she would be with the other hearing aid styles. The other hearing aid styles, ITE, ITC, and CIC, are more limiting. A digital hearing aid is not a type of hearing aid style but rather a type of hearing aid technology."},{"n":10,"s":"Total communication is a communication modality that","o":["involves one or more modes of communication at any given time in the child’s educational program, whether it is manual, oral, auditory only, or written.","is the common language of the Deaf community.","employs eight hand shapes placed at four different locations near the mouth.","emphasizes the development of amplified residual hearing and spoken language, utilizing speechreading cues as a supplement.","uses much of the same vocabulary as American Sign Language but also includes grammatical features and follows English syntax."],"k":"A","x":"Total communication is a communication modality that involves one or more modes of communication at any given time in the child’s educational program, whether it is manual, oral, auditory only, or written. American Sign Language (ASL) is the common language of the Deaf community. Cued speech employs eight hand shapes placed at four different locations near the mouth. Auditory oral emphasizes the use of amplified residual hearing and spoken language, using speechreading cues as a supplement. Signed Exact English uses much of the same vocabulary as ASL but includes English grammatical features and syntax."}]},{"t":"Evaluation of the Vestibular (Balance) System","q":[{"n":1,"s":"The lack of correlation between extent and site-of-lesion testing and patient functional disability is most probably related to","o":["low sensitivity of caloric testing to mild peripheral disorders.","inability of the electronystagmography (ENG) and other site-of-lesion studies to characterize fully the state and extent of the central compensation process.","oculomotor tests, which dominantly characterize only the posterior fossa region.","ENG, which typically characterizes only the horizontal canal and possible canal–otolith interactions.","the large number of patients with primary psychiatric disorders related to dizziness."],"k":"B","x":"Only the functional studies show the ability to predict disability and functionality. The extent and site-of-lesion studies characterize just that.As the central compensation process proceeds, the lesion extent typically does not alter, but its functional impact on the patient lessens. Therefore, it will take evaluation tools that accurately characterize the status of the compensation process to lessen the dichotomy indicated above."},{"n":2,"s":"The primary clinical utility of electronystagmography is","o":["results lead to specific diagnosis in the majority of patients.","results directly guide recommendations for the majority of patients.","the direct evaluation of otolithic organs.","as confirmatory evidence for suspected site of lesion for consistency with the suspected diagnosis.","as a consistently positive study even in mild cases of peripheral system involvement."],"k":"D","x":"History is the primary tool to determine management, with the direct clinical examination suggesting a site of lesion. Electronystagmography and the rotational chair are primarily confirmatory for the suspected site of lesion. It is when unexpected results are obtained that management is driven by the laboratory studies."},{"n":3,"s":"The accurate assessment of the results of the Dix-Hallpike maneuver depends on","o":["direct visualization of the eye movements by direct examination or use of video recordings.","reporting of symptom complaints with the analysis of eye movements.","two-dimensional quantification of the vertical and horizontal components of the eye movements.","A and B.","none of the above."],"k":"D","x":"Two-dimensional eye movement recordings cannot be used after the fact to determine a positive result for benign paroxysmal positional vertigo. The disorder and the particular canal involved are characterized by specific eye movements that, other than the horizontal canal, involve a torsional eye movement component. Torsional eye movements cannot be accurately represented by two-dimensional recordings."},{"n":4,"s":"Determination that a patient has absence of warm, cool, and ice water caloric responses for right ear irrigations implies that","o":["the right peripheral system is completely nonresponsive throughout the frequency range (dead system).","there is severe low-frequency loss of sensitivity for the right peripheral part of the vestibular system.","the right medial vestibular nucleus is severely reduced in its low-frequency responsiveness.","this finding can only occur secondary to technical error(s) and is not reliable.","none of the above."],"k":"B","x":"Caloric irrigation is the equivalent of a low-frequency rotational stimulus of low amplitude. Therefore, when a peripheral system is not responsive to the external stimulus, it cannot be assumed that it is completely gone. The mid- and higher-frequency portions of the system have not been tested. Also, the caloric irrigation is primarily a test of horizontal canal function; therefore, no knowledge about the vertical canal systems and the otolith organs has been obtained with this test. Because of this situation and the fact that the rotational chair affects both peripheral organs simultaneously, there is no way to determine whether there is any residual function in a single end-organ."},{"n":5,"s":"By assisting in site-of-lesion determination, the rotational chair typically","o":["focuses and drives the patient management process.","assists in patient counseling and confirmation of suspected lesion site for the working diagnosis.","determines the extent of a unilateral peripheral lesion.","determines the specific site of a central vestibular lesion.","provides functional information that correlates highly with patient functionality and disability."],"k":"B","x":"It is rare that the rotational chair, like electronystagmography (ENG), will actually drive the management process. It can identify peripheral involvement when ENG is normal and provide for an avenue of counseling for the patient in that regard."},{"n":6,"s":"In situations of bilateral peripheral paresis, the rotational chair system","o":["provides for accurate prognosis of recovery of function in patients with peripheral lesions.","can affect the management plan of the patient by being the only study available to delineate the actual extent of bilateral paresis.","is the only study available to determine the relative reduction in responsiveness, left versus right.","is typically of no use.","A and B."],"k":"B","x":"The rotational chair is the only study to determine the extent of bilateral involvement. In doing so, aspects of the vestibular and balance rehabilitation program for treatment of these patients can be altered based on realistic goals for what can be accomplished in light of the severity of bilateral involvement."},{"n":7,"s":"In the clinical use of the rotary chair,","o":["the use of natural stimuli affects the peripheral parts of both sides of the system simultaneously.","for each rotation, one periphery is excited and one is inhibited.","since the peripheral parts of both sides of the system are activated simultaneously, typically low-frequency chair testing is unable to isolate which side is involved in a unilateral lesion.","if one periphery is nonresponsive to caloric stimulation, the rotary chair is not able to determine the full extent of the lesion across frequencies.","all of the above are true."],"k":"E","x":"Since the total-body low-frequency (at or below 1 Hz) rotational chair test uses natural stimuli of rotational acceleration, it is always affecting both peripheral systems at the same time. Although this sets certain limitations in the form of localization of right versus left, this method allows for a more natural characterization of the function of the vestibulo-ocular reflex controlling system."},{"n":8,"s":"Which of the following patient symptom descriptors would suggest that vestibular and balance rehabilitation should be considered as a treatment option?","o":["Patient reports spontaneous spells of vertigo lasting 1 to 2 hours, with no symptoms between the events.","Patient reports a rocking sensation when standing or sitting still with all symptoms absent when in motion.","Patient reports symptoms that are provoked by head or visual motion stimuli producing brief spells of vertigo with no symptoms when the head is still.","Patient reports imbalance only when arising from lying or sitting, lasting seconds, with no other symptoms noted.","Patient reports spontaneous spells of imbalance and vertigo lasting 2 to 3 minutes multiple times per day independent of head position or movement."],"k":"C","x":"Although patients with other symptoms may be appropriate for different aspects of vestibular and balance rehabilitation therapy activities, globally, the ones that are the most appropriate are those with head or visual motion-provoked symptoms and those with functional deficits related to balance and ambulation."},{"n":9,"s":"Spontaneous nystagmus","o":["of peripheral origin is most pronounced with fixation present.","of central origin is most pronounced with fixation removed.","is recorded in the lateral position.","is not a useful sign for either central or peripheral disease.","is common immediately following unilateral peripheral injury."],"k":"E","x":"Spontaneous nystagmus, most often noted with fixation removed when it is of a peripheral origin, is very common within the first 1 to 2 weeks following a unilateral labyrinthine injury. In electronystagmography, it is recorded with the patient sitting, fixation removed, and head straight."},{"n":10,"s":"Postural control assessment is an important aspect of the examination of the patient with complaints of dizziness. The use of the sensory organization test of computerized dynamic posturography provides the following useful information about the patient:","o":["functional information about the patient’s ability to use visual, vestibular, and proprioceptive/somatosensory cues","differentiating information as to site-of-lesion involvement between central and peripheral parts of the vestibular system","information that can differentiate between a peripheral neuropathy and a spinal compression lesion resulting in imbalance","in the recommendation process for vestibular and balance rehabilitation therapy and monitoring of such a program","both A and D"],"k":"E","x":"Sensory organization testing is strictly a functional evaluation giving relative information as to the use of sensory cues for the maintaining of stance. It is not a site-of-lesion study, although other protocols of computerized dynamic posturography can be used for that purpose. Because of its functional emphasis, it is useful as an outcome measure for vestibular rehabilitation programs and can detect patients who are exaggerating their results for whatever reason."}]},{"t":"Diseases of the External Ear","q":[{"n":1,"s":"The most effective treatment for auricular hematoma is","o":["simple aspiration.","to place a drain between the perichondrium and the cartilage.","intravenous streptokinase.","to aspirate the hematoma and apply a pressure dressing.","adequate incision and drainage with suture-secured bolsters."],"k":"E","x":"Thrombolytic agents like streptokinase have not been demonstrated to be effective in auricular hematoma. Simple aspiration is inadequate treatment for auricular hematoma. Organized hematoma is so solid that it cannot be aspirated. Incision and drainage alone are not enough because the fluid will promptly reaccumulate. The most effective treatment for auricular hematoma is adequate incision and drainage with suture-secured bolsters to ensure coaptation of the perichondrium and the cartilage."},{"n":2,"s":"Cerumen","o":["is more acidic in the diabetic patient.","should be removed periodically.","is hydrophilic.","forms an acidic coat that aids in the prevention of external auditory canal infection.","lacks a bactericidal enzyme."],"k":"D","x":"Cerumen is a combination of the secretions produced by sebaceous and apocrine glands admixed with desquamated epithelial cells. This combination forms an acidic coat that aids in the prevention of external auditory canal infection. The pH of the cerumen is high in diabetic patients. This predisposes diabetic patients to otitis externa. Cerumen is not hydrophilic, but it does contain lysozyme, an enzyme capable of destroying bacterial cell membranes. Owing to the selfcleansing mechanism of the external auditory canal, cerumen does not require periodic removal."},{"n":3,"s":"The most commonly isolated pathogens in acute diffuse otitis externa are","o":["Pseudomonas aeruginosa and Staphylococcus aureus.","Staphylococcus epidermidis and Corynebacterium.","Proteus mirabilis and Streptococcus.","Staphylococcus and Streptococcus.","Escherichia coli and Neisseria flavescens."],"k":"A","x":"The two most common microorganisms isolated from the external auditory canal of normal individuals are Staphylococcus epidermidis and Corynebacterium species, whereas Pseudomonas aeruginosa and Staphylococcus aureus are the most common pathogens cultured in acute diffuse external otitis."},{"n":4,"s":"Otic preparations","o":["are more neutral than ophthalmic preparations.","are more viscous than ophthalmic preparations.","have less adverse reaction than ophthalmic preparations.","can more easily penetrate narrow lumens than ophthalmic preparations.","are more allergenic than ophthalmic preparations."],"k":"B","x":"Otic preparations are more acidic than ophthalmic preparations. Patients unable to tolerate acidic otic drops may tolerate more neutral ophthalmic drops.An additional advantage of ophthalmic drops is a low viscosity, allowing improved penetration in the narrow lumens encountered in external otitis. They are not less allergenic than otic drops."},{"n":5,"s":"Keratosis obturans","o":["is associated with bronchiectasis or sinusitis.","is characterized by bone erosion of the external auditory canal.","usually requires surgical treatment.","is usually unilateral.","is not associated with inflammation in the external auditory canal."],"k":"A","x":"Keratosis obturans is characterized by the accumulation of large plugs of desquamated keratin in the bony portion of the external auditory canal. This condition is usually asymptomatic and bilateral and is discovered incidental to examination for conductive hearing loss. There is marked inflammation in the subepithelial tissue but no bone erosion. It has been associated with chronic pulmonary disease and sinusitis. Bronchiectasis has been present in a high percentage of these patients. The disease may be controlled in most cases by regular cleaning."},{"n":6,"s":"Initial diagnostic investigations in malignant external otitis include all of the following except","o":["culture of the external auditory canal.","gallium scan of the temporal bones.","computed tomography (CT) scan of the temporal bones and brain.","magnetic resonance imaging of the temporal bones.","technetium scan (bone scan) of the temporal bones."],"k":"D","x":"Magnetic resonance imaging is of no use in detecting bony changes, but it may be better for evaluation and follow-up of meningeal involvement and changes within the osseous medullary cavity. A CT scan is important in initial assessment of the extent of the infection. With a technetium scan, early bony involvement can be detected. A gallium scan is a sensitive indicator of infection and is the best for monitoring resolution of the infection. Culture of the external auditory canal is essential."},{"n":7,"s":"Duration of antimicrobial therapy in a patient with malignant external otitis is determined by","o":["serum glucose level.","electroneuronography.","gallium scan and erythrocyte sedimentation rate.","magnetic resonance imaging.","relief of symptoms."],"k":"C","x":"A gallium scan is best for monitoring resolution of disease and is useful in determining the duration of antimicrobial therapy. The erythrocyte sedimentation rate is a nonspecific test but is useful in following the response to antibiotics. Although relief of pain is the first indication of a favorable response to therapy, it is not useful in determining how long therapy should be continued. Likewise, serum glucose levels, although important, and electroneuronography do not predict how long therapy should be continued."},{"n":8,"s":"Exostosis is","o":["a neoplastic bony lesion.","usually unilateral.","lateral to the isthmus.","a pedunculated, trabecular bone.","common in cold-water swimmers."],"k":"E","x":"Exostoses are not traditionally considered neoplastic. Exostoses are common in patients who swim or bathe frequently in cold water. They are usually bilateral and appear as two or three smooth sessile protrusions on opposing surfaces of the bony canal medial to the isthmus."},{"n":9,"s":"The majority of malignancies of the temporal bone originate","o":["as a tumor of the external auditory canal.","from the mucosa of the middle ear.","from ectopic rests of embryonic tissue.","as metastatic lesions from distant primary tumors.","from mesodermal structures."],"k":"A","x":"Malignant tumors can arise from the external auditory canal, middle ear, and temporal bone. When patients present with advanced neoplasms, it may not be possible to determine the sites of origin. The majority of cancers of the middle ear and mastoid originate in the external auditory canal from ectodermal tissue."},{"n":10,"s":"The most important consideration in deciding the surgical approach to tumors of the ear is","o":["the size of the tumor.","the histologic grade of the tumor.","the anatomic location of the tumor.","the presence or absence of infection around the tumor.","the duration of the tumor."],"k":"C","x":"In discussing neoplasms of the ear, temporal bone, and skull base, it is helpful to divide the discussion into anatomic regions because the tumor type, clinical presentation, prognosis, and treatment are determined by the anatomic location of the tumor."}]},{"t":"Otitis Media and Middle Ear Effusions","q":[{"n":1,"s":"Factors that may predispose children to otitis media (OM) include all of the following except","o":["day care.","family history.","Native American ethnicity.","second-hand smoke.","craniofacial anomalies."],"k":"D","x":"Although second-hand smoke has been thought to be linked to OM, no studies have demonstrated direct causation. Epidemiologic studies of OM have demonstrated a higher incidence of disease in children attending day care, those with a strong family history, those of Native American ethnicity, and those with significant anatomic abnormalities of the head and neck."},{"n":2,"s":"Factors supporting allergy as an etiology for otitis media with effusion (OME) include all of the following except","o":["immune complexes found in serum and middle ear effusions of children with OME.","increased IgE levels in children with OME.","increased IgG levels in children with OME.","mast cell degranulation causing nasal obstruction.","eustachian tube edema secondary to retrograde extension of inflammatory mediators."],"k":"B","x":"Studies have not been able to demonstrate increases in serum IgE levels in children with OME. Studies have found immune complexes in the serum and middle ear effusion of children with OME. In addition, other indicators, including increased IgG levels, mast cell degranulation, and eustachian tube edema secondary to inflammatory mediators, have all been identified."},{"n":3,"s":"Indications for tympanocentesis include all of the following except","o":["patients with severe otalgia.","unsatisfactory response to antimicrobial therapy.","OM not associated with suppurative complications.","onset of OM in a patient already receiving antibiotic therapy.","OM in a newborn, sick neonate, or immunosuppressed child."],"k":"C","x":"Otitis media associated with confirmed or potential suppurative complications is an absolute indicator for tympanocentesis. In addition, the procedure may be used to relieve severe otalgia and to confirm the microorganisms present in the middle ear to determine appropriate antibiotic coverage. Otitis media in the newborn or immunocompromised child also presents the potential for unusual microorganisms, thus indicating the need for appropriate identification of middle ear contents."},{"n":4,"s":"The most common pathogens in otitis media (OM) include the following except","o":["group B Streptococcus.","Streptococcus pneumoniae.","Haemophilus influenzae.","Branhamella catarrhalis.","Staphylococcus aureus."],"k":"A","x":"Group A Streptococcus is more likely to cause OM than group B. Streptococcus pneumoniae, H. influenzae, B. catarrhalis, and S. aureus have all been implicated as common pathogens in OM."},{"n":5,"s":"Therapy that has been proven to help in otitis media (OM) includes all of the following except","o":["antibiotics.","antihistamines.","corticosteroids.","tympanostomy tube placement.","analgesics."],"k":"B","x":"Controlled studies have failed to demonstrate the efficacy of antihistamines in the treatment of OM. Similar studies have shown efficacy in the treatment with antibiotics, corticosteroids, and tympanostomy tubes. Some European studies have demonstrated that analgesics alone without any other therapy may be efficacious."},{"n":6,"s":"Proposed mechanisms for the efficacy of corticosteroid treatment in otitis media include all of the following except","o":["prevention of inflammatory mediator formation.","decrease in peritubal lymphoid tissue size.","decreased secretion of eustachian tube surfactant.","prevention of arachidonic acid formation.","reduced middle ear fluid viscosity."],"k":"C","x":"Corticosteroids are thought to increase secretion of eustachian tube surfactant. Corticosteroids are thought to be useful in the prevention of inflammatory mediators and arachidonic acid. They are also felt to reduce middle ear viscosity as well as peritubal lymphoid tissue."},{"n":7,"s":"Relative or absolute indications for tympanostomy tube placement include all of the following except","o":["recurrent acute otitis media unresponsive to antibiotic therapy.","significant antibiotic allergies.","negative middle ear pressure with impending cholesteatoma.","conductive hearing loss > 15 dB.","chronic middle ear effusion < 3 months."],"k":"E","x":"Studies have shown that chronic middle ear fluid may spontaneously resolve up to 12 weeks after onset. Tympanostomy tubes have been found useful in patients who are unresponsive to antibiotic therapy, have a significant conductive hearing loss, and demonstrate severe enough middle ear negative pressure to risk cholesteatoma formation. They are also efficacious in patients who have antibiotic allergies for which options for treatment are significantly diminished."},{"n":8,"s":"Adenoidectomy may be indicated for all of the following except","o":["nasal obstruction.","chronic adenoiditis.","chronic sinusitis.","chronic otitis media with effusion.","vasomotor rhinitis."],"k":"E","x":"There is strong evidence that adenoidectomy will assist in relieving all of the conditions listed except vasomotor rhinitis. At this point, no definitive cause for this entity has been identified. The nasal obstruction associated with vasomotor rhinitis does not improve with removal of adenoid tissue."},{"n":9,"s":"The pneumococcal conjugate vaccine may be useful in diminishing the occurrence of otitis media (OM) in","o":["all children.","children with at least six bouts of OM per year.","children who have had prior ventilation tube insertion.","children with cholesteatoma.","children with tympanic membrane perforation."],"k":"A","x":"All children will ultimately benefit from this vaccine. Pneumococcus is the most common bacterial cause of OM in children."},{"n":10,"s":"Currently, the most effective medical therapy for chronic otitis media with effusion is","o":["a 7-day course of antibiotics.","daily dose of antibiotic prophylaxis.","decongestants.","antihistamines.","a 30-day course of full-dose antibiotics."],"k":"E","x":"Numerous clinical trials have concluded that some patients may respond to a 21- to 30-day course of full-dose antibiotic therapy. No data exist for shorter courses of antibiotics. The use of antihistamines has not proven efficacious in any trial to date. Decongestants have been shown to be effective in reducing nasal congestion, but efficacy in middle ear disease is uncertain."}]},{"t":"Chronic Otitis Media","q":[{"n":1,"s":"Active otorrhea in chronic otitis media requires","o":["recognition that cholesteatoma is present.","a CT scan to rule out intracranial complications.","suctioning and treatment with a suitable ototopical preparation.","intravenous antibiotics.","urgent surgical treatment."],"k":"C","x":"Otorrhea in itself is not a serious concern in chronic otitis media. Computed tomography is inappropriate unless other symptoms such as fever or pain are present to suggest an intracranial complication. Cholesteatoma is not necessarily required to produce otorrhea, and intensive medical or surgical treatments are not required. Cleansing of the ear and topical drops are appropriate."},{"n":2,"s":"When confronted with extensive granulation tissue in the healing phase after a canal wall down mastoidectomy, the physician should","o":["attempt débridement, being alert to critical landmarks.","initiate systemic antibiotic therapy.","advise the patient to have a revision operation.","allow the granulation tissue to mature into fibrous connective tissue.","perform a CT scan immediately."],"k":"A","x":"Granulation tissue often forms during the healing phase after open cavity mastoidectomy. It should not be allowed to persist and cause otorrhea or to mature into neomembranes that might obscure portions of the cavity. Computed tomography is not helpful, and a revision operation is not performed unless conservative measures fail. Thus, the surgeon should carefully débride the granulation tissue and cauterize the base, while keeping in mind the critical landmarks of the cavity to avoid injury to the facial nerve or the stapes."},{"n":3,"s":"Surgical treatment for cholesteatoma","o":["is not urgent.","cannot result in a satisfactory hearing result.","always requires removal of the incus.","should not require an open mastoid cavity.","is individualized based on location and extent of the disease."],"k":"E","x":"Urgent surgical treatment may be required for intratemporal suppurative complications or a facial palsy. Hearing results vary, but sometimes excellent hearing results are obtained. The incus need not be removed if the ossicular chain is intact, and the disease can be resected or exteriorized without removing the incus. Open cavity surgery may be indicated under several circumstances such as cholesteatoma in the only hearing ear, large labyrinthine fistula, etc. Thus, the surgeon should individualize the approach to cholesteatoma depending on the clinical setting and operative findings."},{"n":4,"s":"The most critical factor in avoiding injury to the facial nerve during mastoid operations is","o":["use of a facial nerve monitor.","a preoperative CT scan.","drilling parallel to the nerve.","using a diamond bur.","exposing the sheath of the nerve by removing the overlying bone."],"k":"C","x":"Facial nerve monitoring, although sometimes helpful to the surgeon in complex mastoid surgery, is not sufficient to prevent injury if other critical technical factors are not observed. A CT scan may demonstrate erosion of the fallopian canal, which is important for alerting the surgeon to potentially higher risk to the nerve, but cannot itself prevent surgical injury. Use of a diamond bur may be appropriate for final polishing of the facial ridge but may produce injury to the nerve if the proper technique is not observed. Intimate knowledge of the intratemporal course of the facial nerve and proper surgical technique are the critical factors in preventing injury. The surgeon must always drill parallel to the course of the facial nerve, using copious irrigation and inspecting for the sheath becoming evident through the intact bone. Exposing the sheath is not advised in routine cases, and attempts to do so may actually jeopardize the nerve’s integrity."},{"n":5,"s":"The medial technique tympanoplasty is often preferred over the lateral technique procedure because","o":["it is simpler and provides quicker healing of the ear canal.","it provides improved exposure during dissection.","it provides better access to anterior perforations.","one can position the graft medial to the malleus handle.","the graft take rate is considerably better."],"k":"A","x":"The medial technique suffers from poorer exposure, which results in difficulty in repairing anterior perforations. Although graft healing rates may be satisfactory with either technique, the lateral approach provides slightly more reliable results, especially for large and/or anterior perforations. The graft is placed medial to the malleus with both techniques. Thus, the primary advantages of the medial technique are its technical simplicity and the quicker healing resulting from minimal dissection of ear canal skin."},{"n":6,"s":"The lateral technique tympanoplasty","o":["is technically more demanding than the medial technique.","provides better exposure for repairing anterior perforations.","usually requires a canalplasty.","may be complicated by cholesteatoma between the remnant of the tympanic membrane and the graft.","all of the above are true."],"k":"E","x":"The first four choices are correct statements, making E the best response."},{"n":7,"s":"The most feared complication that is unique to the lateral technique tympanoplasty is","o":["facial nerve paralysis.","prolapse of the condyle of the mandible into the ear canal.","cholesteatoma caused by inadequate removal of squamous cell elements.","anterior blunting of the ear canal.","lateralization of the graft with maximal conductive hearing loss."],"k":"B","x":"Although facial nerve paralysis is a feared complication in any ear operation, it is not likely to occur with either tympanoplasty technique and would not be more likely with a lateral technique procedure. The last three choices are indeed complications that are unique to the lateral technique operation but cause relatively few symptoms and may be corrected with subsequent treatment. Prolapse of the condyle of the mandible is a very difficult problem to correct successfully and must be avoided by careful attention to proper surgical technique."},{"n":8,"s":"Middle ear reconstruction with modern ossicular prostheses","o":["should usually result in normal hearing.","is preferred to the use of a sculpted autograft incus.","is not associated with extrusion of the prosthesis.","requires a healthy middle ear for lasting success.","cannot be performed in conjunction with a mastoidectomy."],"k":"D","x":"Ossicular reconstructive procedures may, on occasion, produce normal hearing, but this is not expected routinely. Reconstruction procedures are often performed in conjunction with mastoidectomy, sometimes at the same stage. Generally, the use of the incus is preferred to synthetic prostheses owing to cost and biocompatibility issues. Extrusion continues to be a problem even with the most modern materials used in the middle ear. Success depends on proper placement of the prosthesis, good eustachian tube function, and ongoing health of the middle ear cleft."},{"n":9,"s":"Options for reconstructing the ossicular chain when the long process of the incus is eroded include all except","o":["performing an autograft incus interposition.","using bone cement to restore ossicular continuity.","placing a total ossicular replacement prosthesis between the malleus and the head of the stapes.","placing a partial ossicular replacement prosthesis between the tympanic membrane and the head of the stapes.","using a synthetic incudostapedial joint prosthesis."],"k":"C","x":"A total ossicular replacement prosthesis is used only when the stapes superstructure is absent and thus is inappropriate for the setting described. Any of the other techniques listed are suitable for reconstruction of the middle ear when the incudostapedial joint is eroded or disarticulated."},{"n":10,"s":"Critical steps in constructing a canal wall down mastoid cavity include all of the following except","o":["removal of the mastoid tip.","obliteration of the mastoid with soft tissue.","wide saucerizarion of the cavity.","always drilling parallel to the facial nerve and using copious irrigation to identify the sheath before exposing it.","removal of conchal cartilage when performing the meatoplasty."],"k":"B","x":"To minimize the size of the mastoid cavity, the mastoid tip should be removed and the cavity should be widely saucerized. The facial ridge should be lowered to a satisfactory level, and the proper technique involves drilling parallel to the nerve and using copious irrigation to keep the field cool and clear of bone dust. A proper meatoplasty is essential to the long-term outcome. Although many authors may advise soft tissue obliteration, it is not essential to success and thus is optional."}]},{"t":"Cranial and Intracranial Complications of Acute and Chronic Otitis Media","q":[{"n":1,"s":"A 14-year-old boy presented with high fever, neck stiffness, severe headache, and a positive Kernig’s sign. His mother indicated that he had had a lot of ear problems, but none recently. The tympanic membrane appeared dull but without erythema and moved sluggishly. A computed tomography scan showed a normal brain, an opacified middle ear, and an opacified mastoid that was smaller than the normally aerated opposite mastoid. Lumbar puncture was positive for meningitis, and he was placed on culturespecific intravenous antibiotics and exhibited a good clinical response over the next few days. On day 6, his temperature spiked to 103˚F, and he was drowsy. The most important step now is to","o":["repeat the lumbar puncture.","perform tympanocentesis.","obtain an enhanced magnetic resonance imaging (MRI) scan.","obtain additional history of recent ear problems.","schedule immediate exploratory mastoidectomy."],"k":"C","x":"The initial favorable clinical response suggests effective antibiotics for the meningitis, and useful information from a tympanocentesis now is unlikely. Repeat lumbar puncture without another imaging study is contraindicated. The significant risk here is the development of another central nervous system complication. Enhanced MRI to look specifically for cerebritis or brain abscess, lateral sinus thrombosis, epidural abscess, and subdural empyema is essential, so appropriate changes in management can be made."},{"n":2,"s":"Which of the following otogenic complications is least likely to require surgery?","o":["meningitis in a 15-month-old girl","meningitis in an 18-year-old woman","facial paralysis in a 20-year-old man","subdural empyema in a 15-month-old girl","labyrinthine fistula in a 47-year-old man"],"k":"A","x":"Meningitis in a 15-month-old child is likely to be a hematogenous complication of acute otitis media, which will respond to medical management, whereas the 18-year-old woman is likely to have cholesteatoma or chronic otitis media as the cause of her meningitis. Subdural empyema is a neurosurgical emergency, even when it develops after meningitis in the very young. Labyrinthine fistulae are almost always secondary to cholesteatoma and require operation."},{"n":3,"s":"A 39-year-old man is seen with a chronically draining left ear and has a positive fistula test in that ear. A computed tomography scan suggests possible erosion of the lateral semicircular canal. Against which of the following pairs of microorganisms should antibiotic therapy be directed?","o":["Streptococcus pneumoniae and Mycoplasma pneumoniae","Pseudomonas aeruginosa and Mycoplasma pneumoniae","Haemophilus influenzae and Bacteroides fragilis","Haemophilus influenzae and Streptococcus pneumoniae","Pseudomonas aeruginosa and Bacteroides fragilis"],"k":"E","x":"Nearly all fistulae from chronic suppurative ear disease are caused by cholesteatomas. The most common bacterial pattern in cholesteatoma is the presence of multiple bacteria including both aerobic and anaerobic microorganisms. Pseudomonas is the dominant aerobe, and Bacteroides species are the most common of the anaerobic bacteria isolated."},{"n":4,"s":"A 50-year-old man presents with a right-sided 30 dB conductive hearing loss without other symptoms. Physical examination shows a large, uninfected attic erosion with keratinized epithelial debris filling the defect. A fistula test is negative, although the patient subjectively is slightly dizzy with negative pressure. A computed tomography scan shows an aerated middle ear, erosion of the scutum, and opacification of the upper two-thirds of the mastoid. Which of the following is most likely to be found at surgery?","o":["erosion of the tegmen mastoideum","erosion of the tympanic segment of the fallopian canal","lateral sinus thrombosis","serous labyrinthitis","epidural abscess"],"k":"B","x":"Large, clinically silent cholesteatomas are most likely to erode much of the tympanic segment of the fallopian canal and be in direct contact with the facial nerve over large distances. Less often they cause erosion of the tegmen tympani and lateral semicircular canal fistulae. Without infection, an epidural abscess is unlikely. This patient’s subjective response to the fistula test is more likely to be secondary to a lateral semicircular canal fistula than serous labyrinthitis."},{"n":5,"s":"The radiologic study of choice to diagnose lateral sinus thrombosis is","o":["arteriography.","ultrasonography.","jugular venography.","enhanced magnetic resonance imaging.","enhanced computed tomography."],"k":"D","x":"Although most of these techniques can detect lateral sinus thrombosis, the risk of complications with arteriography and venography precludes their use. Enhanced MRI is the choice because it is more sensitive than CT scanning and has low morbidity."},{"n":6,"s":"Computed tomography scanning is superior to magnetic resonance imaging in establishing which one of the following diagnoses?","o":["Bezold’s abscess","coalescent mastoiditis","epidural abscess","cerebellar abscess","subdural empyema"],"k":"B","x":"Computed tomography can demonstrate the bony destruction and coalescence that are the hallmarks of coalescent mastoiditis. Magnetic resonance imaging gives little or no information about bone disease but can more sensitively detect evidence of all of the other conditions mentioned above."},{"n":7,"s":"A 28-year-old man with a long-standing history of left otorrhea is transferred from another hospital, clinically ill and toxic. His temperature has spiked to 104 to 105˚F each morning and evening. The condition most likely to be responsible is","o":["otitic hydrocephalus.","lateral sinus thrombosis.","meningitis.","epidural abscess.","subdural empyema."],"k":"B","x":"Although meningitis, epidural abscess, and subdural empyema are all associated with fever, often high and sometimes spiking, diurnal spikes are uncommon. The diurnal spikes, which on a graph resemble a picket fence, are classic for lateral sinus thrombosis, even though they may only be present in 50% of cases today."},{"n":8,"s":"Which of the following patients is most like to have an encephalocele and cerebrospinal fluid (CSF) leakage?","o":["a 43-year-old man with a 35 dB conductive hearing loss and apparent serous otitis media","a 37-year-old man with previously unoperated cholesteatoma","a 21-year-old man scheduled for his fourth operation for cholesteatoma","a 4-year-old boy with coalescent mastoiditis","a 17-year-old girl with her fourth episode of meningitis"],"k":"C","x":"Except for the child with coalescent mastoiditis, all of the others could have an encephalocele and a CSF leak. The girl with recurrent meningitis could have any of several sources for CSF leakage or even a complement cascade deficiency underlying her recurrent meningitis. Unoperated chole-steatoma has an extremely low likelihood of causing this complication, even though it does rarely occur. The 43-year-old man with apparent serous otitis could have a spontaneous CSF leak but more likely will have serous otitis from some other cause. The three previous operations for cholesteatoma can easily have removed tegmen and abraded dura and set the stage for this complication."},{"n":9,"s":"The principal reason for lumbar puncture in the investigation for possible complications of acute and chronic otitis media is to","o":["obtain microorganisms for culture and sensitivity.","diagnose brain abscess.","document intracranial hypertension.","decrease cerebrospinal fluid volume.","diagnose or rule out meningitis."],"k":"E","x":"Lumbar puncture is never performed until a computed tomography scan has documented the absence of intracranial hypertension for fear of causing cerebellar tonsil herniation and its catastrophic consequences. The principal reason for lumbar puncture is to rule out or establish the diagnosis of meningitis so that prompt treatment can be started. If the enhanced magnetic resonance imaging is negative for other intracranial complications, a positive lumbar puncture will establish the diagnosis of meningitis and rule out emergency surgery, which is necessary for brain abscess and subdural empyema. If the underlying otologic cause of meningitis is acute otitis media, only medical treatment is necessary, as long as a post-treatment CT scan and tympanometry document that the otitis media is completely resolved. If the underlying cause is chronic otitis media, mastoidectomy is undertaken during the same hospitalization as soon as the meningitis has been stabilized."},{"n":10,"s":"A 14-year-old girl is febrile and toxic and has a 2 cm diffuse, tender mass at the angle of the mandible. The ear on that side has been draining for 3 weeks; granulation tissue is seen coming through a perforation of the tympanic membrane, but examination is difficult. Before you obtain a computed tomography (CT) scan, your clinical impression is","o":["masked mastoiditis.","Bezold’s abscess.","coalescent mastoiditis.","cervical adenopathy.","cholesteatoma."],"k":"B","x":"A tender mass in the upper neck in the presence of suppurative otitis is a Bezold’s abscess until proven otherwise. It can occur without any perforation or otorrhea, so it is necessary to obtain a CT scan to verify the presence of mastoiditis."}]},{"t":"Otosclerosis","q":[{"n":1,"s":"Otosclerosis is a disease affecting","o":["membranous bone.","endochondral bone.","periosteal bone.","the haversian system.","cancellous bone."],"k":"B","x":"Otosclerosis is an ongoing process of resorption and deposition of bone in bone that developed from cartilage that surrounds the inner ear during development. Otosclerosis is limited to the otic capsule."},{"n":2,"s":"The prevalence of clinical otosclerosis with a conductive hearing loss is greatest in","o":["Caucasians.","the Japanese.","Asiatic Indians.","Native Americans.","African Americans."],"k":"A","x":"The highest prevalence of otosclerosis occurs in ethnic groups whose original homelands surround the Mediterranean Sea. The incidence is low inAsiatic peoples, including the Chinese, Indians, and Japanese. Likewise, there is a low incidence in Native Americans. The lowest incidence occurs in Africans."},{"n":3,"s":"The most frequent site of first occurrence of otosclerosis is in the","o":["oval window rim.","fossula post fenestram.","round window niche.","fissula ante fenestram.","processus cochleariformis."],"k":"D","x":"The site of predilection for otosclerosis is the fissula ante fenestram. The fossula post fenestram is the second most frequently involved site. It can occur anywhere in the otic capsule."},{"n":4,"s":"Which of the following statements about Schwartze’s sign is false?","o":["It is caused by increased vascularity of the otic capsule.","It appears as a reddish hue deep to the tympanic membrane.","It is not seen during pregnancy.","It may be seen in the early stages of the disease.","It is not present in all patients with otosclerosis."],"k":"C","x":"Schwartze’s sign is often seen during pregnancy."},{"n":5,"s":"The diagnosis of otosclerosis is most likely with","o":["a mixed conductive and sensorineural hearing loss.","a progressive sensorineural hearing loss.","progression of a hearing loss during pregnancy.","a type AD tympanogram.","a progressive conductive hearing loss in an adult with a normal otoscopic examination."],"k":"E","x":"Otosclerosis often causes a mixed conductive and sensorineural hearing loss but rarely causes a sensorineural hearing loss without a conductive component. Otosclerosis progresses more rapidly during hormonal changes, as occur in pregnancy. In stapes fixation, a type AS (depressed) tympanogram is found, whereas the type AD (no point of maximum compliance) tympanogram is characteristic of ossicular discontinuity. Otosclerosis is the most likely diagnosis with a progressive conductive hearing loss in an adult with a normal otoscopic examination."},{"n":6,"s":"Which of the following does not describe Carhart’s notch?","o":["ranges in magnitude up to 15 dB","is centered at 2 kHz","is an apparent sensorineural hearing loss","usually disappears after stapes surgery","occurs without a conductive hearing loss"],"k":"E","x":"A moderate degree of stapes fixation must be present for Carhart’s notch to be apparent."},{"n":7,"s":"The principal objective in stapes surgery is to","o":["protect the inner ear from intense sound.","increase round window membrane mobility.","restore ossicular continuity.","restore sound pressure transmission to the inner ear.","increase fluid movement in the inner ear."],"k":"D","x":"The main objective of stapes surgery is to restore sound pressure transmission to the inner ear. This pressure is transmitted to the perilymph, but the objective is not to increase inner ear fluid movement or movement of the round window membrane. Preservation of the stapedius muscle may aid in protecting the inner ear from intense sound. Although ossicular continuity is temporarily disrupted during the procedure, the objective is to restore ossicular mobility rather than continuity."},{"n":8,"s":"Which of the following occupations is a relative contraindication to stapes surgery?","o":["elevator operator","crop duster","vocalist","airline pilot","dancer"],"k":"B","x":"Many otologists advise patients who wish to continue scuba diving or flying nonpressurized aircraft not to have a stapes operation. Vocalists may experience a change in the perception of their voice but with the plasticity of the central nervous system quickly adjust. Rare persisting dysequilibrium following a stapes operation could be a problem for a professional dancer."},{"n":9,"s":"In recent years, there has been a major tendency in stapes surgery to","o":["avoid alloplastic materials for prostheses.","make a smaller opening in the footplate.","irrigate the middle ear with saline to remove debris.","correct conductive hearing losses of less than 20 dB.","use no autografts."],"k":"B","x":"Using a smaller opening in the footplate reduces the mechanical trauma to the inner ear. All of the other choices represent false concepts."},{"n":10,"s":"The most reliable means of improving hearing in the patient with otosclerosis is a","o":["hearing aid.","fenestration operation of Lempert.","stapedectomy.","stapedotomy","partial stapedectomy."],"k":"A","x":"Nearly all patients with a moderate or worse conductive hearing loss can be helped with a hearing aid. In view of the risks of stapes surgery, the operation should be discussed with the patient in the context of this fact."}]},{"t":"Hereditary Hearing Impairment","q":[{"n":1,"s":"Which of the following statements is most accurate about congenital hearing loss?","o":["The incidence is decreasing.","Fifty percent or more is inherited.","It is always profound.","It may be late in onset.","It is nearly always sensorineural in nature."],"k":"B","x":"Although it is difficult to obtain exact data for the percentage of congenital hearing loss that is inherited, it is estimated to be 50% or greater. The incidence of deafness attributable to infectious and iatrogenic causes is decreasing, and as our ability to diagnose genetic abnormalities improves, the relative importance of hereditary factors as causes of deafness increases. The severity of congenital hearing loss varies from mild to profound. Congenital hearing loss, by definition, is prelingual. It may be sensorineural, conductive, or mixed."},{"n":2,"s":"Which of the following statements is most accurate about hereditary hearing loss?","o":["Approximately 50% of cases are autosomal dominant.","Syndromic hearing loss accounts for nearly one-third of cases.","There is little phenotypic variation in syndromic hearing loss.","It is almost never caused by mitochondrial mutations.","It is always congenital."],"k":"B","x":"Syndromic hearing loss accounts for nearly one-third of cases of hereditary hearing loss. Twenty to 30% of hereditary hearing loss is inherited in an autosomal dominant fashion. There is typically marked phenotypic variation in syndromic hearing loss. Hereditary hearing loss may be associated with mitochondrial mutations in a small percentage of cases and may be both congenital and late onset."},{"n":3,"s":"Branchio-oto-renal syndrome may be associated with the following, except","o":["dilated vestibular aqueduct.","autosomal recessive inheritance.","mutations in EYA1.","renal anomalies.","marked phenotypic variability."],"k":"B","x":"Branchio-oto-renal syndrome is inherited in an autosomal dominant fashion. It may be associated with a dilated vestibular aqueduct, although this is more characteristic of Pendred’s syndrome. Branchio-oto-renal syndrome is associated with mutations in EYA1, although in 70% of cases, mutations have not been found. Renal anomalies occur in up to 75% of cases. Branchio-oto-renal syndrome exhibits marked phenotypic variability, which suggests that it may be a heterogeneous disease. This was recently confirmed with the identification of a second locus."},{"n":4,"s":"Which of the following is untrue about Waardenburg’s syndrome (WS)?","o":["It may be associated with Hirschsprung’s disease.","Dystopia canthorum occurs in WS1 and WS3.","Hearing loss is typically mixed in nature.","Profound hearing loss is common.","It may be associated with heterochromia iridis."],"k":"C","x":"Hearing loss is typically sensorineural, prelingual, and nonprogressive. It varies from mild to profound, with profound bilateral loss being most common. Shah-Waardenburg syndrome combines the features of WS2 with Hirschsprung’s disease. Dystopia canthorum occurs in WS1 and WS3 but not in WS2 and WS4. Heterochromia iridis is a typical feature of Waardenburg’s syndrome."},{"n":5,"s":"Which of the following does not apply to Pendred’s syndrome?","o":["usually normal thyroid function","temporal bone anomalies include Mondini’s dysplasia and dilated vestibular aqueduct","a goiter typically present at birth","mutations in PDS","a positive perchlorate challenge test"],"k":"C","x":"Although goiter may be apparent at birth in Pendred’s syndrome, it typically presents in midchildhood. Despite a defect in the thyroid gland, affected individuals usually remain euthyroid. The administration of a perchlorate in the form of a challenge releases unbound iodide from thyroid follicular cells. The disease is caused by mutations in PDS."},{"n":6,"s":"Which of the following statements is true about Usher’s syndrome?","o":["It is the most common autosomal recessive syndromic hearing loss.","It is associated with vestibular loss in all forms.","It demonstrates surprisingly little genetic heterogeneity.","Electroretinography is unhelpful in detecting early retinitis pigmentosa.","It is associated with mutations in EYA1."],"k":"A","x":"Usher’s syndrome is the most common autosomal recessive syndromic hearing loss. Type 2 Usher’s syndrome is not associated with vestibular loss. Usher’s syndrome demonstrates considerable genetic heterogeneity as demonstrated by the identification of 11 loci to date. Electroretinography may uncover early retinitis pigmentosa. Mutations in EYA1 have not been demonstrated in Usher’s syndrome."},{"n":7,"s":"Which of the following statements is not true about Alport’s syndrome?","o":["It is inherited only in an X-linked fashion.","Carrier females may be affected.","It is associated with characteristic eye findings.","Hematuria is the most common mode of presentation.","By 25 years of age, over 90% of affected males have abnormal renal function."],"k":"A","x":"Alport’s syndrome can be inherited as an X-linked or autosomal disorder. One-third of carrier females will develop macroscopic hematuria. Characteristic eye findings include anterior lenticonus and white macular flecks. Affected individuals typically present with hematuria, often following an upper respiratory tract infection. By 25 years of age, over 90% of affected males have abnormal renal function."},{"n":8,"s":"Which of the following is true about mitochondrial hearing loss?","o":["Temporal bone studies have not shown an increased load of mitochondrial mutations in persons with age-related hearing loss compared with controls.","The number of mitochondrial mutations decreases with age.","A point mutation at 1555 in 12S ribosomal ribonucleic acid (rRNA) causes most age-related hearing loss.","In the United States, maternally inherited induced susceptibility to aminoglycoside ototoxicity is rare.","It may be associated with diabetes mellitus."],"k":"E","x":"Mitochondrial hearing loss may be associated with diabetes mellitus. The number of mitochondrial mutations increases with age. A point mutation at base pair 1555 (adenine to guanine) in the 12S rRNA causes both maternally inherited nonsyndromic hearing loss and maternally inherited susceptibility to aminoglycoside ototoxicity. In the United States, over 15% of persons with aminoglycoside-induced hearing loss carry this mutation."},{"n":9,"s":"Which of the following is not true about nonsyndromic hearing loss?","o":["Autosomal dominant modes of inheritance account for about 15% of cases.","The typical autosomal dominant phenotype is one of postlingual hearing loss.","Autosomal recessive hearing loss is more severe than autosomal dominant hearing loss.","X-linked inheritance accounts for the majority of cases of postlingual hearing loss.","It may be maternally inherited."],"k":"D","x":"X-linked inheritance only makes up 1 to 3% of nonsyndromic hearing loss, with most affected males having a congenital hearing loss. Autosomal dominant modes of inheritance account for about 15% of cases. The typical autosomal dominant phenotype is one of postlingual hearing loss.Autosomal recessive hearing loss is more severe than autosomal dominant hearing loss."},{"n":10,"s":"Which of the following is untrue about connexin 26 (Cx26)?","o":["Mutations in Cx26 are responsible for over one half of moderate-to-profound hearing impairment in many world populations.","Few mutations have been discovered.","The most prevalent mutation in the United States is 35delG.","The carrier rate for all deafness Cx26 mutations in the midwestern United States is 3%.","It is involved in gap junction formation."],"k":"B","x":"Numerous different deafness-causing Cx26 mutations have been identified. Mutations in Cx26 are responsible for over one half of moderate-to-profound hearing impairment in many world populations. In the United States and much of northern Europe, the most prevalent mutation is the 35delG mutation. In the midwestern United States, the carrier rate for all deafness Cx26 mutations is 3%. Connexin 26 is involved in gap junction formation."}]},{"t":"Trauma to the Middle Ear, Inner Ear, and Temporal Bone","q":[{"n":1,"s":"The most common injury to the external auditory canal is","o":["a gunshot wound.","a caustic burn.","an abrasion from a cotton swab.","a fracture.","a thermal burn."],"k":"C","x":"In managing this problem, the ear canal should be cleaned thoroughly and antibiotic drops prescribed. If bleeding persists, the site should be cauterized or packed with Gelfoam coated with topical thrombin."},{"n":2,"s":"Which of the following mechanisms can cause a tympanic membrane perforation?","o":["slap injury","welder’s slag injury","lightning","penetrating object","all of the above"],"k":"E","x":"Slap injuries are, by far, the most common cause of tympanic membrane perforation, accounting for more than 80% in some series. Slag injuries tend to cause a permanent perforation because the slag cauterizes the drumhead as it passes through. Lightning causes vertigo and tinnitus in addition to a perforation of the tympanic membrane. Penetrating objects are also likely to disrupt the ossicles."},{"n":3,"s":"What percentage of traumatic perforations of the tympanic membrane heal spontaneously?","o":["20%","40%","60%","80%","100%"],"k":"D","x":"A review of the entire world’s literature of over 500 reports indicates that approximately 80% of traumatic perforations of the tympanic membrane heal. A period of 3 to 4 months should elapse before recommending surgery for smaller perforations. Larger perforations with ossicular problems or drainage may require an earlier tympanoplasty."},{"n":4,"s":"Which is the most common traumatic ossicular abnormality?","o":["necrosis of the long process of the incus","incudostapedial joint disarticulation","fracture of the stapes suprastructure","fixation of the incus","dislocation of the stapes footplate"],"k":"B","x":"The forces that lead to the development of a longitudinal fracture of the temporal bone also tend to separate the incudostapedial joint. In many cases, fibrous adhesions form between the drumhead and the incus and the stapes so that only a minimal air–bone gap remains."},{"n":5,"s":"Which of the following methods can be used to correct a dislocated incus with an intact malleus?","o":["placement of a partial ossicular replacement prosthesis","placement of a total ossicular replacement prosthesis to the footplate","placement of an incus replacement prosthesis from the malleus to the stapes","sculpted autologous incus from the malleus to the stapes","all of the above"],"k":"E","x":"The correction of a dislocated incus is largely dependent on the surgeon’s preference. All of these methods give very similar results."},{"n":6,"s":"A perilymphatic fistula should be suspected in which circumstance?","o":["progressive hearing loss and episodic vertigo after a temporal bone fracture","sensorineural hearing loss after a closed head injury","persistent unsteadiness after a blast injury","dizziness awakening the patient from sleep after a gunshot wound to the head","after a whiplash injury"],"k":"A","x":"In the setting of trauma, with progressive hearing loss and episodic vertigo, a perilymphatic fistula should be suspected. The clinician should remember that there are no specific patterns to diagnose conclusively a perilymphatic fistula."},{"n":7,"s":"What is the most common type of post-traumatic vertigo?","o":["benign paroxysmal positional vertigo","chronic Meniere’s disease","recurrent severe episodes of vertigo","perilymphatic fistula","vestibular neuronitis"],"k":"A","x":"Benign paroxysmal positional vertigo occurs in 25% of all head injuries whether there is a fracture or not. It is treated with mild vestibular suppressants and particle repositioning maneuvers."},{"n":8,"s":"Hearing loss after head injury is most likely caused by","o":["stroke.","perforation of the tympanic membrane.","cochlear fracture.","concussive forces on the labyrinth.","avulsion of the auditory nerve."],"k":"D","x":"Schuknecht proposed that the high-frequency hearing loss seen after most head injuries is attributable to concussive forces transmitted to the cochlea either through the bone or through the stapes footplate."},{"n":9,"s":"Which is the most common fracture within the temporal bone?","o":["transverse fracture","longitudinal fracture","fracture of the stapes","fracture through the cochlea","fracture of the anterior wall of the external auditory canal"],"k":"B","x":"Longitudinal or extracapsular fractures account for 80% of temporal bone fractures, and temporal bone fractures are more common than the other three choices."},{"n":10,"s":"Which is the most common site for traumatic facial nerve injury associated with gunshot wounds?","o":["mastoid segment","geniculate-ganglion region","stylomastoid foramen","tympanic segment","labyrinthine segment"],"k":"C","x":"This site seems to have the greatest predilection, perhaps because the nerve is relatively fixed there."}]},{"t":"Occupational Hearing Loss","q":[{"n":1,"s":"Temporary threshold shift is caused by","o":["a traveling wave harmonic.","physical shaking of the hair cells.","excessive neurotransmitter release at the hair cell– dendrite junction.","fracture of the cilial rootlet.","oxygen desaturation of the stria vascularis."],"k":"C","x":"Temporary threshold shift (TTS) of less than 40 dB usually recovers within a matter of a few hours; a TTS of greater than 40 dB may take several days to clear. The former usually recovers completely, but the latter indicates greater damage and is usually followed by some permanent threshold shift (PTS). The mechanism of TTS appears to be that an excess secretion of glutamate, a neurotransmitter released by stimulation of the hair cells, produces damage to the hair cells and the receptor endings of the afferent nerve fibers in the synapses. Both recover. Fractures of the cilial rootlets take place with more intense sound exposure and are usually followed by outer hair cell death and PTS."},{"n":2,"s":"Which of the following concepts regarding outer hair cells is false?","o":["the primary transducer of sound","tuned to a specific frequency","the source of a sound","contain myosin and contract","under central nervous system control"],"k":"A","x":"The outer hair cells are not primarily transducers of sound. They do respond to exposure to sound in a frequencyspecific manner by contracting, thereby pulling the tectorial membrane and the basilar membrane closer together, thus amplifying the displacement of the cilia of the inner hair cells. The inner hair cells depolarize as a result of the cilial displacement and trigger a nerve impulse. The outer hair cells contain myosin. The contractions of the outer hair cells produce otoacoustic emissions. The outer hair cells have an efferent nerve supply that represents the effector arm of a feedback loop from the central nervous system."},{"n":3,"s":"The number of individuals exposed to potentially harmful levels of sound in the workplace in the United States is","o":["< 1 million.","1 to 7 million.","8 to 13 million.","14 to 25 million.","26 to 35 million."],"k":"E","x":"The number of individuals exposed to potentially harmful levels of workplace sound in the United States is about 30 million. If only industrial workers are taken into account, the number would be between 8 and 11 million; but this excludes such noisy occupations as mining, forestry, construction, road building, and the armed forces. Thus, over 10% of the population of the United States is at risk from excessive occupational noise exposure (according to the US National Occupational Safety and HealthAdministration). Hearing loss produced by noise exposure was the most common single cause of pensions following the war in Vietnam. It is inadequately recognized that agricultural noise is a major source of hearing loss. Farm workers are exposed for many hours to a variety of sound, including heavy diesel motors in tractors and harvesting equipment, grain dryers, ventilating fans, and chain saws."},{"n":4,"s":"Permanent threshold shift from high levels of sound","o":["begins in the midfrequency range.","progresses at a constant rate.","usually produces a flat hearing loss.","affects the highest frequencies first.","may show relatively rapid changes (months rather than years)."],"k":"D","x":"Permanent threshold shift usually begins with a 4 kHz dip but may also begin with a hearing loss centered at 3 or 6 kHz. Lower-frequency hearing loss from noise exposure is rare and late. The hearing loss progresses quite rapidly to begin with, the rate dependent on the level of noise and individual susceptibility, and then slows down. The notch, if it is going to occur, is usually already present within a few months of beginning noise exposure and certainly by 2 years. It peaks in the “notch” by 10 years, following which increased loss is much less at that frequency, but it begins to spread into other areas. In later years, it becomes more difficult to distinguish between presbycusis and noise-induced hearing loss."},{"n":5,"s":"Hearing loss from occupational noise exposure may be potentiated by all of the following except","o":["transportation noise.","chemical exposure.","hunting.","listening to portable personal radio/cassette players.","snoring."],"k":"E","x":"A worker who travels to and from work on a motorcycle may well be at further risk from noise exposure; someone who fires pistols, shotguns, or rifles will also develop hearing loss unless appropriate protection is worn. This loss, in the case of rifles and shotguns, is usually asymmetric, with the ear nearer the muzzle being more damaged, and is additive to any loss caused by occupational noise exposure. Certain chemical solvents used in industry and leisure potentiate the effect of loud sound, including toluene and petroleum products. What evidence there is suggests that portable personal radio cassette players do not produce hearing loss. This is not true of larger “boom boxes,” which may add to the problems. Neither snoring nor snorkeling produces noise-induced hearing loss."},{"n":6,"s":"Which of the following occupations are not associated with noise-induced hearing loss?","o":["cab driver","farm worker","forestry worker","commercial driver","commercial fisherman"],"k":"A","x":"Of the list, cab driving is probably the only non-noise hazardous occupation. Farm workers are exposed to high levels of sound. Forestry workers, who use heavy diesel equipment and chain saws, are very much at risk for hearing loss. Many truck drivers are at risk, depending on whether they drive with the windows open and on the position of the engine and soundproofing of the cab. Commercial fishermen are close to the sound of the diesel motor of their vessels and, together with seamen working on commercial tugs, are at risk from noise because they may be exposed for 24 hours a day for several days at a time."},{"n":7,"s":"Asymmetric hearing loss in legal claimants for noise-induced hearing loss","o":["rules out noise-induced hearing loss.","may be caused by noise exposure.","is attributable to leisure pursuits.","may be caused by a cerebellopontine angle lesion.","is a common sign of malingering."],"k":"D","x":"Cerebellopontine angle lesions occur in industrial workers, as in the rest of the population, and are a rare cause of asymmetric hearing loss in legal claims, but they must be ruled out. Asymmetric hearing loss is an infrequent way of malingering in industrial hearing loss claims; however, it is much more common after head injury. It may be caused
