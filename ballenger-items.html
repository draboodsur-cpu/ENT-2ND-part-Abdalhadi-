,"x":"The CD4 receptor is a high-affinity target for binding by gp120, one of the HIV major envelope proteins. CD4 receptors are expressed on T lymphocytes. Human immunodeficiency virus strains tropic for activated T lymphocytes bind by the CD4 receptor and CXCR4 chemokine coreceptor."},{"n":7,"s":"Protease inhibitors interfere with which stage of the viral cycle?","o":["intracytoplasmic conversion of ribonucleic acid (RNA) into deoxyribonucleic acid","processing of messenger RNA in cell nucleus","transport of messenger RNA from nucleus to cytoplasm","intracytoplasmic production of long-chain viral proteins and enzymes","cleavage of proteins and enzymes of immature viral core"],"k":"E","x":"Prevention of the cleavage of proteins and enzymes of the immature viral core is the mechanism of action of the protease inhibitors. The other stages are part of the viral cycle, but the protease inhibitors have little, if any, effect during these stages."},{"n":8,"s":"What percentage of HIV-infected persons progress to AIDS within the first 2 to 3 years?","o":["5","10","20","30","50"],"k":"B","x":"Approximately 10% of HIV-infected persons progress to AIDS within the first 2 to 3 years following infection. In contrast, 5 to 10% are so-called nonprogressors, having stable CD4 cell counts after 15 or more years of follow-up."},{"n":9,"s":"The main proximate cause of death in AIDS patients is","o":["Kaposi’s sarcoma.","trauma.","squamous cell carcinoma.","opportunistic infection.","suicide."],"k":"D","x":"Opportunistic infections have remained the proximate cause of death for nearly all AIDS patients. The other causes are much less frequent."},{"n":10,"s":"A 25-year-old homosexual man presents with odynophagia/dysphagia. Head and neck examination reveals several shallow 1.5 cm in diameter ulcerations of the posterior wall of the pharynx. The patient’s CD4 cell count is 150 cells/mm3. He is not taking any medicine. Possible causes include","o":["herpes simplex virus.","cytomegalovirus.","aphthous ulcer.","A and C.","all of the above."],"k":"D","x":"More than 50% of homosexual men are infected with cytomegalovirus and may shed it intermittently. The virus may reactivate to produce symptomatic disease in patients with profound cell-mediated immune deficiency. In most cases of symptomatic disease, the CD4 cell count is < 25 cells/mm3. The other choices can be seen with relatively preserved cell-mediated immune function."}]},{"t":"Etiology of Infectious Diseases of the Upper Respiratory Tract","q":[{"n":1,"s":"The most common pathogen of the common cold is","o":["adenovirus.","rhinovirus.","respiratory syncytial virus.","influenza virus.","parainfluenza virus."],"k":"B","x":"Rhinoviruses are the etiologic agents in more than 50% of cases of the common cold."},{"n":2,"s":"A 3-year-old child presents with fever and sore throat followed by the development of small mucosal vesicles and ulcerations surrounded by erythematous rings. The lesions are located on the anterior tonsillar pillars and resolve without complications in 3 days. The most likely etiologic agent is","o":["group A beta-hemolytic streptococcus.","Haemophilus influenzae.","coxsackievirus.","fusobacteria.","influenza virus."],"k":"C","x":"The clinical features describe herpangina, caused by coxsackievirus."},{"n":3,"s":"A patient with human immunodeficiency virus with a CD4 count of less than 200 cells/mm3 presents with a polyp of the middle ear and discharge. These findings are most likely attributable to an infection that would respond best to which treatment?","o":["isoniazid","rifampin","trimethoprim-sulfamethoxazole","amphotericin B","fluconazole"],"k":"C","x":"Pneumocystis carinii infections of the middle ear respond well to trimethoprim-sulfamethoxazole."},{"n":4,"s":"A 30-year-old man from India presents with symptoms of epistaxis and nasal obstruction. Physical examination discloses a friable, painless, polypoid growth at the nasal vestibule. The treatment for the most likely cause of these findings includes","o":["penicillin and diphtheria antitoxin.","ciprofloxacin and surgical débridement.","dapsone.","an antitubercular combination regimen.","surgical removal only with no medical treatment."],"k":"E","x":"The patient most likely has rhinosporidiosis. Surgical excision is the preferred treatment. No effective medical treatment as yet exists."},{"n":5,"s":"What is the most frequent site of involvement when leprosy affects the upper respiratory tract?","o":["larynx","hypopharynx","nose","middle ear","salivary glands"],"k":"C","x":"The nose is by far the most frequently involved site. Mycobacterium leprae prefers an ambient temperature of less than 37˚C."},{"n":6,"s":"Two weeks after a mandibular tooth extraction, a 33-year-old woman develops a mildly tender induration of the neck and mandibular area. The lesion slowly progresses to a board-like consistency with a draining fistula. A pathognomonic finding in this condition is","o":["“sulfur granules.”","Mikulicz’s cells.","“foamy histiocytes.”","Charcot-Leyden crystals.","fungus ball."],"k":"A","x":"“Sulfur granules” are white-yellow granules of bacterial filaments seen in the exudates or infected tissues of patients with actinomycosis."},{"n":7,"s":"A 50-year-old insulin-dependent diabetic patient presents with unilateral purulent rhinorrhea and proptosis. Physical examination shows ulceration and necrosis of the lateral nasal wall. Appropriate treatment of the most likely diagnosis includes","o":["surgical débridement and amphotericin B.","dapsone.","surgical débridement and itraconazole.","amphotericin B only.","surgical débridement only."],"k":"A","x":"Treatment of mucormycosis requires a prolonged course of amphotericin B, as well as aggressive surgical débridement of all nonviable tissue. Antifungal azoles are ineffective. The underlying condition must be corrected if possible."},{"n":8,"s":"A 40-year-old man, in otherwise good health, presents with unilateral painless otorrhea. Otologic examination shows a near-total perforation of the tympanic membrane with granulation tissue in the middle ear. Additionally, the patient has partial facial weakness. Which is the most likely diagnosis?","o":["aspergillosis","leprosy","tuberculosis","histoplasmosis","cryptococcosis"],"k":"C","x":"Tuberculous otitis media typically presents with otorrhea. Other features include granulation tissue or polyps of the middle ear, tympanic perforation, destruction of ossicles, and a predilection for facial paralysis."},{"n":9,"s":"A 30-year-old recent immigrant from CentralAmerica presents with long-standing nasal obstruction, purulent rhinorrhea, and crusting. Physical examination demonstrates blue-red rubbery granulomas of the nasal mucosa, as well as broadening of the nasal dorsum. Some parts of the nasal airway appear fibrotic. The most likely diagnosis is","o":["mucormycosis.","tuberculosis.","rhinosporidiosis.","histoplasmosis.","rhinoscleroma."],"k":"E","x":"The features described are consistent with the granulomatous and fibrotic stages of rhinoscleroma. Broadening of the nasal dorsum produces the characteristic Hebra nose."},{"n":10,"s":"The most common etiologic agent of acute laryngotracheobronchitis is","o":["respiratory syncytial virus.","parainfluenza virus.","Mycoplasma pneumoniae.","Haemophilus influenzae.","rhinovirus."],"k":"B","x":"Parainfluenza viruses (types 1, 2, and 3) are the most frequent cause, accounting for almost 75% of isolated viral agents."}]},{"t":"Allergic Rhinitis","q":[{"n":1,"s":"Which of the following statements does not support the hygiene theory of the development of atopic diseases?","o":["Childhood infections seem to hold a protective effect on the development of allergy.","The youngest sibling has the greatest risk of development of allergic sensitization.","Among Japanese schoolchildren, positive tuberculin responses predicted a lower incidence of asthma and lower serum immunoglobulin (Ig)E at age 12 years.","Prior infection with hepatitis A was associated with a halving in the prevalence of elevated specific IgE levels.","The prevalence of atopy in the former East Germany increased sharply after reunification with the former West Germany."],"k":"B","x":"A growing body of literature supports the hypothesis that childhood infections hold a protective effect for the development of allergy. A number of factors associated with Western living including family size, increased immunization, and improved medical care are viewed as responsible for a decreasing number of childhood infections. In support of the hygiene theory are studies demonstrating an inverse relationship between frequency of allergic disorders and childhood infection. Signals to the developing immune system may skew responses toward allergic patterns later in life. Studies in Japan demonstrated an inverse relationship between delayed hypersensitivity to tuberculin at age 12 years and total and specific IgE levels. Studies of the Italian military found an association with serologic evidence of prior hepatitis A virus infection and decreased specific IgE levels. These support the concept that early infection can be protective in later development of atopy. Lastly, the prevalence of allergic rhinitis in East Germany increased in the 1990s, suggesting the possibility that factors associated with a Western affluent lifestyle may play a role in the development of allergic disease. Family structure and size have been shown to affect development of allergic disease with an inverse association with family size and birth order."},{"n":2,"s":"Which of the following is not a proposed mechanism for the negative effect of allergic rhinitis on asthma?","o":["systemic release of inflammatory mediators","local airway release of inflammatory mediators","neurogenic reflexes","alterations in nasal conditioning of air","nasal obstruction causing sleep-disordered breathing"],"k":"E","x":"Allergic rhinitis has a close relationship with asthma. Numerous studies have shown a high incidence of allergic rhinitis in asthmatics, and control of nasal allergies is thought to reduce asthma severity. There is growing evidence to support the systemic response to a local allergic reaction; hence, through this mechanism, nasal allergies could cause disease distally in the airway. Inflammatory mediators could also be released into the airway, travel to the lower respiratory tract, and induce inflammatory disease in that location. Challenge of the lower airway with antigen has been shown to cause allergic inflammation in the nose, suggesting the possibility of nasopulmonary neurogenic reflexes. Asthmatics have been shown to have a decreased ability to condition cold, dry air. Additionally, patients with seasonal allergic rhinitis out of season have a reduced ability to warm and humidify air. These studies raise the possibility that nasal conditioning capacity may affect lower airways disease. Although allergic rhinitis frequently causes nasal obstruction and may affect nasal breathing during sleep, this is not a proposed mechanism to explain the relationship between asthma and allergic rhinitis."},{"n":3,"s":"A central molecule in allergic disease is IgE, which interacts with","o":["monocytes.","B lymphocytes.","eosinophils.","mast cells.","all of the above."],"k":"E","x":"Immunoglobulin E plays a critical role in the immune response. This begins when macrophages and other antigenpresenting cells process the allergen before presenting it to T helper cells, which then interact with B lymphocytes, leading to their differentiation into IgE-producing plasma cells, a process involving interleukin-4, interleukin-13, and accessory molecules such as CD40. These newly formed IgE molecules bind to high-affinity receptors principally located on mast cells and basophils and to low-affinity receptors located on eosinophils, monocytes, and platelets. The high-affinity IgE receptors on mast cells mediate the immediate allergic response. Although the mast cell is perhaps a central player with IgE, the presence of receptors on a number of immune cells is in agreement with a view of the allergic response as a complex, coordinated effort of a number of players (cells, chemokines, adhesion molecules, reflexes, etc)."},{"n":4,"s":"Which of the following is an effect of chemokines?","o":["stimulation of inflammation","destruction of nasal mucosa","cell recruitment and transmigration","survival of cells in the nasal mucosa","all of the above"],"k":"E","x":"Chemokines have a variety of effects in the pathophysiology of allergic rhinitis. Such effects include increasing the production of cells in the bone marrow, aiding in the survival of cells in the nasal mucosa, synergizing with other cellular activators, and acting as chemoattractants. Some of these inflammatory cells elaborate substances that can cause local damage and mucosal modifications. The chemokines are chemoattractant cytokines that play an important role in the function and expression of leukocyte and endothelial adhesion molecules. However, studies show that although chemokines have a profound effect on the recruitment of cells to the tissue, they can exert a wide range of responses. In vitro, in vivo, and challenge studies all support the importance of chemokines in the pathophysiology of allergic rhinitis."},{"n":5,"s":"Which of the following statements is not true about dust mite avoidance?","o":["Bedsheets should be washed in water hotter than 130˚F.","Using mattress covers is beneficial.","Use of a humidifier can decrease dust mite levels in houses.","Dust mites can be directly killed using commercially available products.","Removal of carpet can be useful."],"k":"C","x":"A variety of measures can be taken by patients with dust mite allergy. Measures to reduce exposure to dust mites concentrate on the bedding. These include replacing feather pillows and bedspreads with synthetic ones that can be washed in hot water. Covering mattresses with small-pore plastic sheeting is beneficial. Removing carpets and frequent vacuuming also help. Acaricidal products can directly kill mites. Maintaining a relative humidity (RH) of less than 50% is one recommendation for reducing the number of house dust mites and their allergens in homes. A recent study showed than allergen levels were more than 10 times lower in low-RH homes compared with humid homes and suggested that it is possible to maintain an indoor RH of less than 51% during the humid summer season. Hence, dehumidifiers are effective tools in dust mite control."},{"n":6,"s":"Which of the following statements is true regarding the diagnosis of allergic rhinitis?","o":["Nasal endoscopy is always indicated.","In vitro testing is conclusive.","Patients can easily be classified into perennial and seasonal categories.","Correlation with symptoms is important.","Ancillary tests are infrequently employed to evaluate allergic patients."],"k":"D","x":"The diagnosis of allergic rhinitis relies on a careful history to identify the sensitizing antigen, both to establish the diagnosis and to institute the first treatment, avoidance. Symptoms occurring in temporal relation to allergen exposure suggest sensitization but are not diagnostic. With a classic history (eg, sneezing each fall), empiric therapy may provide the simplest approach. In less clear cases, allergy testing either by skin prick, intradermal, or in vitro methods can identify allergens causing sensitization. However, individuals can show evidence of sensitization by a positive skin test or elevated specific antibody levels in the serum without having evidence of clinical disease. This emphasizes the importance of a good history in the evaluation of patients with suspected allergic disorders. Ancillary testing is often employed to evaluate for complications of allergic rhinitis as well as related disorders such as sinusitis (computed tomography scans) and asthma (pulmonary function testing). Endoscopy, although not always indicated, can be useful in evaluating for structural abnormalities (septal deviation), evidence of related diseases (sinusitis), and other nonallergic nasal disorders."},{"n":7,"s":"The disadvantages of skin testing include","o":["the inability to perform the test in patients with dermatographism.","poor tolerance in children.","the need to withhold certain medications.","the possibility of systemic reactions.","all of the above."],"k":"E","x":"Both skin and radioallergosorbent test (RAST) can be employed in the diagnosis of allergic rhinitis. All of the choices are disadvantages to skin testing, although in vitro testing also has disadvantages, including cost, slightly lower sensitivity, and the time delay between drawing the blood and obtaining the results. Data from clinical studies comparing the results of skin testing and RAST in allergic subjects suggest a good correlation between the two, with a higher sensitivity for skin testing."},{"n":8,"s":"Which of the following statements is true regarding environmental modifications for avoiding allergen?","o":["Central air conditioning is not useful to reduce outdoor allergens.","On rainy days, outdoor pollen levels increase.","Washing pets once a month is effective.","Humidifiers require careful cleaning to prevent them from becoming a source of allergen.","Central air conditioning is sufficient to reduce dust mite allergen."],"k":"D","x":"Complete avoidance of the allergen(s) to which the patient is sensitive eliminates symptoms of the disease. Thus, measures aimed at reducing allergen load from the patient’s environment are effective in reducing symptoms. Simple measures can be very effective. Filters used in air conditioning remove outdoor allergens from the air prior to circulation inside a house. Rain profoundly reduces the levels of outdoor pollens. In the case of cats, regular washing of the animal may help decrease allergen load. The use of high-efficiency particulate air (HEPA) filters and of electrostatic filters effectively removes particulates larger than 1 µm in diameter. Particles, however, must be airborne for removal, such as pollens, whereas heavy particles that settle from the air rapidly, such as dust mite feces, are not eliminated by these measures. Although air conditioners can be useful, the critical factor for dust mite allergen control is maintaining a relative humidity of less than 50%. A recent study suggested that air conditioning alone is not always enough to maintain humidity below this critical value. Hence, dehumidifiers can be a useful adjunct measure even in homes with air conditioning. Humidifiers must be cleaned regularly to avoid becoming a source of mold allergens, which thrive in moist environments."},{"n":9,"s":"Regarding the side effects of medications for allergic rhinitis, which of the following statements is true?","o":["All intranasal corticosteroids have no odor.","Diphenhydramine may cause worse performance impairment than alcohol.","Decongestants cannot be used in hypertensive patients.","No systemic effects of intranasal corticosteroids have been demonstrated.","Side effects are not a concern with these medications."],"k":"B","x":"Although commonly prescribed, the various medications employed against allergic rhinitis require careful consideration of side effects. Patients sometimes complain of the odor of intranasal corticosteroids. This can sometimes be alleviated by switching formulations from a particulate one to an aqueous preparation. Budesonide (Rhinocort Aqua) and triamcinolone acetonide (Nasacort AQ) have no odor. Although first-generation antihistamines are effective and generally safe, their undesirable side effects of sedation, anticholinergic effects, functional and performance impairment, and gastrointestinal distress pose a number of concerns. Studies show that a larger number of subjects developed impaired performance compared with the number reporting sedation. Furthermore, impaired performance can persist after the subjective feeling of somnolence dissipates—hence the importance of warning patients who are taking these medications not to perform some tasks such as operating heavy machinery or driving. In one study, diphenhydramine caused worse impairment to driving than consuming alcohol to the level of being legally drunk. This poses significant public health concerns. Overdosage with oral decongestants has been associated with hypertensive crisis. When given in prescribed doses, however, decongestants do not induce hypertension in normotensive patients nor do they alter the pharmacologic control of stable hypertensive patients. The systemic effects of intranasal corticosteroids have long been a concern. There are studies that show decreased height in children associated with beclomethasone use for perennial allergic rhinitis. However, another study with mometasone showed no effect. Additionally, studies of long-term effects, including final adult height, have not been performed. Lastly, many studies have been performed on asthmatics and are confounded by the effects of the disease itself. The growth of pediatric patients receiving intranasal corticosteroids, therefore, should be monitored carefully."},{"n":10,"s":"Which of the following patients is not a candidate for immunotherapy?","o":["an asthmatic who occasionally uses an albuterol inhaler","a woman 8 weeks pregnant","a man on a calcium channel blocker for hypertension","a college student who has had poor symptom control","an allergic rhinitic patient with year-round symptoms"],"k":"B","x":"Indications for immunotherapy have evolved over years of clinical experience. The primary indication is symptoms not adequately controlled by avoidance measures and pharmacotherapy. Patients with perennial symptoms may prefer immunotherapy to daily medication. Proper resuscitative equipment should be present because anaphylactic reactions can occur any time during treatment, even in patients receiving maintenance dosages. Factors that seem to contribute to increased complications, including fatalities, seem to be labile, corticosteroid-dependent asthma that has required prior hospitalizations, high sensitivity to allergen (as demonstrated by serum-specific Immunoglobin E tests or skin test), and a history of prior systemic reactions. Therefore, immunotherapy in symptomatic asthmatic patients should be administered with extreme caution because these patients have the greatest morbidity. Patients who are taking beta blockers should not receive immunotherapy because, if anaphylaxis occurs, they cannot be resuscitated. Immunotherapy should not be started in pregnant women because of the risk of anaphylaxis and the resultant effect of hypotension on the fetus."}]},{"t":"Acute and Chronic Nasal Disorders","q":[{"n":1,"s":"A 70-year-old man complains of soreness in the left vestibule over the last 3 to 4 months that has failed to respond to a variety of topical preparations. A small ulcerated area is noted on the inner vestibule skin from which a biopsy is taken. The histology report suggests chronic inflammation, a few basaloid cells, and areas of necrosis. As a consequence, one should","o":["reassure him that there is nothing seriously wrong.","arrange a computed tomography scan.","perform a second biopsy.","refer him to a dermatologist.","place him on long-term oral antibiotics."],"k":"C","x":"It may be difficult to obtain representative tissue from this area, particularly if performed under local anesthesia. The presence of necrosis and basaloid cells should suggest the possibility of a basal cell carcinoma, and the chronic inflammation and necrosis may simply be from the center of the ulcer. Further deeper biopsy is indicated to exclude malignancy. Imaging of this area is generally unhelpful, and long-term systemic antibiotics are unlikely to alter the situation materially."},{"n":2,"s":"A woman of 30 years develops significant collapse of the nasal bridge after a septoplasty. She had felt generally unwell and had developed some crusting and spotting of blood from the nose. Endoscopic examination reveals a generally friable mucosa throughout the nose that bleeds easily and is associated with generalized crusting. The next step is to","o":["offer her reconstructive surgery.","perform a computed tomography (CT) scan.","take a biopsy of the nasal mucosa.","obtain blood tests.","perform a bone scan."],"k":"D","x":"Although collapse of the nasal bridge can occur if excessive cartilage is removed, in the patient who feels generally unwell and who has developed some crusting and spotting of blood from the nose, it is important to exclude granulomatous conditions such as Wegener’s granulomatosis or sarcoidosis. This may be done with specific and nonspecific tests such as the erythrocyte sedimentation rate, C-reactive protein, antineutrophil cytoplasmic antigen (c-ANCA), and angiotensinconverting enzyme. Biopsy in Wegener’s granulomatosis is not pathognomonic, although a biopsy may show you a noncaseating epithelioid granuloma in sarcoidosis. Neither a CT scan nor a bone scan will confirm the diagnosis of these conditions."},{"n":3,"s":"A 20-year-old man complains of left-sided nasal obstruction that began spontaneously 2 years ago. There have been no other nasal symptoms, and otolaryngologic examination, including rigid endoscopy, is entirely normal, as was a computed tomography (CT) scan of the sinuses. Medical therapy in the form of intranasal corticosteroids has proved ineffective, and the patient insists that nasal surgery be performed. Which investigation would best clarify the situation?","o":["nasal inspiratory peak flow","anterior active rhinomanometry","olfactory thresholds","magnetic resonance imaging","saccharin test of mucociliary clearance"],"k":"B","x":"Active anterior rhinomanometry will provide information about the airway and will assist in counseling the patient, particularly when surgical intervention is inappropriate. Nasal inspiratory peak flow measures both sides of the nose together and has a broad range of normality. Magnetic resonance imaging is unlikely to be helpful if the CT scan and endoscopy are normal. The nasal and sinus mucosa has a good blood supply and generally gives a high signal; mild inflammatory changes may persist for weeks and months after an upper respiratory tract infection, and this may lead to a confusing overdiagnosis of disease. Tests of mucociliary function will not clarify the cause of the obstruction and are unlikely to be abnormal in the absence of other symptoms."},{"n":4,"s":"In primary ciliary dyskinesia (PCD),","o":["all of the cilia have an abnormal ultrastructure.","the mucociliary clearance time is lengthened.","nitric oxide levels in the nose are less than in the chest.","ciliary beat frequencies are around 10 Hz.","patients are always infertile."],"k":"B","x":"Tests of mucociliary clearance are either lengthened or impossible to measure. The normal range for a saccharin test would be 20 to 30 minutes. Nitric oxide levels in the nose are usually higher than those in the chest as most of the gas is produced in the paranasal sinuses. Levels are significantly lower in both areas in PCD, usually in single-figure parts per million from the chest and double figures from the nose and sinuses. Ciliary beat frequency from the inferior turbinates is reduced below the normal range of 12 to 15 Hz or beats per second, uncoordinated or absent. Both the cilial ultrastructure and cilial arrangement one to another can be abnormal in PCD, but this does not necessarily affect all of the cilia, and as a consequence, although patients may be sub- or infertile, some have managed to conceive naturally. Thus, advice on contraception may be required."},{"n":5,"s":"Cystic fibrosis is","o":["an autosomal dominant inherited condition.","associated with dextrocardia and bronchiectasis.","invariably fatal.","diagnosed with abnormal ciliary beat frequency and cilial ultrastructure.","associated with nasal polyposis in childhood."],"k":"E","x":"In cystic fibrosis, the condition has an autosomal recessive inheritance, and the defect primarily affects the secretions, so ciliary beat frequency and ultrastructure are normal. Bronchiectasis and dextrocardia are features of PCD and not cystic fibrosis. However, any child presenting with nasal polyposis should be suspected of having cystic fibrosis and submitted to the appropriate sweat tests and deoxyribonucleic acid (DNA) evaluation. Up to 30% of children and 50% of adults with cystic fibrosis suffer from nasal polyposis, and the majority have some degree of chronic rhinosinusitis."},{"n":6,"s":"In hereditary hemorrhagic telangiectasia,","o":["the genetic transmission is autosomal dominant and sex linked.","the primary defect is an absence of muscle and elastic tissue in the tunica media of the telangiectasia.","clotting tests are abnormal.","patients may be successfully and optimally treated with the carbon-dioxide laser.","the lesions are confined to the skin and mucosal surfaces."],"k":"B","x":"Absence of the muscle and elastic tissue in the tunica media impairs the ability of the vascular malformations to constrict when traumatized. Bleeding will continue until clotting occurs, the latter being normal. The condition is autosomal and dominant but not sex linked. Although telangiectasia is most obvious on the skin and mucosal surfaces of the respiratory and gastrointestinal tracts, the telangiectasia may be found in any organ in the body."},{"n":7,"s":"Septal perforations","o":["may result from malignant tumors.","always produce collapse of the bridge.","always produce nasal symptoms.","are often associated with the use of topical nasal corticosteroids.","are easy to close surgically."],"k":"A","x":"The most common cause of septal perforations is trauma that may be self-inflicted or iatrogenic. However, malignant T-cell lymphomas can produce destructive lesions in the midline and should be treated after full staging with a full course of radiotherapy. They may be associated with Epstein-Barr virus. Collapse of the bridge may occur, particularly in association with granulomatous diseases or after trauma and surgery, although this is by no means a constant occurrence. The edges of the perforation may be associated with crusting, and this, together with the turbulence of inspired air, can produce a sensation of congestion or nasal blockage. However, many patients are unaware that a perforation is present. The evidence that nasal corticosteroids cause septal perforations is entirely circumstantial, and there are only a couple of well-documented case reports in the literature. Unfortunately, the short- and long-term results of surgical closure are only moderately successful."},{"n":8,"s":"A 14-year-old girl complains of unilateral nasal obstruction that has been long-standing. This is associated with unilateral discharge that can be discolored. On examination, the left side of the nose is narrowed, and although the middle meatus looks normal, a clear view of the entire nasal cavity cannot be obtained with either rigid or flexible endoscopy. The next most useful investigation would be","o":["a computed tomography (CT) scan in both coronal and axial planes.","acoustic rhinometry.","a microbiology swab taken from the middle meatus.","examination under anesthesia.","surgical correction of the deviated nasal septum and reduction of the inferior turbinate."],"k":"A","x":"The differential diagnosis would include chronic rhinosinusitis, unilateral choanal atresia, the presence of a foreign body, and any other pathology in the postnasal space. A CT scan performed in both the coronal and axial planes would enable these conditions to be distinguished and appropriate treatment undertaken. Although acoustic rhinometry can help to quantify the topography of the nose, it becomes increasingly less accurate in the posterior part of the nasal cavity and postnasal space and may be distorted by the presence of secretions. Microbiology, although it may demonstrate the presence of infection, particularly anaerobes in association with a foreign body, will not help definitively to distinguish these conditions. An examination under anesthesia may be ultimately required; it should not be undertaken without appropriate imaging. A considerable amount of septal and turbinate surgery is undertaken inappropriately without the elimination of other contributory or underlying pathology."},{"n":9,"s":"A 40-year-old woman complains of severe loss of the sense of smell following a minor traffic accident. She did not suffer any head injury. She is taking legal action against the other driver and has asked for a medical report. Which of the following investigations will be most useful in assessing the olfactory damage?","o":["computed tomography scan","magnetic resonance imaging of the brain and paranasal sinuses","rigid endoscopy after intrathecal fluorescein","University of Pennsylvania Smell Identification Test","evoked-response olfactometry"],"k":"D","x":"The University of Pennsylvania Smell Identification Test is well validated for sex and age. It will quantify the degree of the loss into normal, hyposmia, or anosmia and will help to exclude the possibility of malingering as a few correct responses will be given by guesswork alone. Thus, a score of zero would be very suspicious of exaggerating the loss. Evoked-response olfactometry can confirm the presence or absence of olfaction but will not quantify it and is difficult to do without trigeminal stimulation. Imaging can be useful to exclude inflammation, infection, or neoplasia but will not demonstrate olfactory damage secondary to trauma. The use of intrathecal fluorescein can be of use in identifying the site of a cerebrospinal fluid leak after a head injury, but this can occur independently of olfactory damage, with which it does not correlate."},{"n":10,"s":"A 22-year-old man complains of nasal obstruction following a sporting injury. Examination reveals a markedly deviated nasal septum for which he undergoes a septoplasty. On the first postoperative day, he is experiencing moderately severe facial pain. The best course of action is to","o":["advise him to take analgesics.","advise him to take a broad-spectrum antibiotic.","advise him to take a course of oral prednisolone.","ask him to take his own temperature and, if it is normal, reassure him.","assess him personally."],"k":"E","x":"The facial pain may not be of great clinical significance, but it is most important that he be examined to exclude a septal hematoma and/or the possibility that he is developing an infection or toxic shock."}]},{"t":"Sinusitis and Polyposis","q":[{"n":1,"s":"Factors that have been shown to contribute to the pathogenesis of acute rhinosinusitis in adults include all of the following except","o":["dysfunction of mucociliary clearance.","obstruction of the ostiomeatal complex.","immunodeficiency syndromes.","upper respiratory tract viral infections.","gastroesophageal reflux disease."],"k":"E","x":"The factors listed in choices A through D have been demonstrated to contribute to the development of acute rhinosinusitis. Although there is some evidence to suggest that gastroesophageal reflux may have a role in pediatric rhinosinusitis, a role in the adult condition has not been demonstrated."},{"n":2,"s":"Cytokines responsible for the migration of eosinophils in chronic sinusitis include","o":["interferon-γ and histamine.","interleukin-4 and interleukin-5.","tumor necrosis factor-α and major basic protein.","interleukin-1 and interleukin-2.","eosinophilic cationic protein and interleukin-3."],"k":"B","x":"Interleukin-4 and interleukin-5 are produced in the sinus mucosa by resident cells and infiltrating lymphocytes. These cytokines work in concert to induce the migration of eosinophils and prolong their survival. The presence of eosinophils is characteristic of chronic sinus inflammation and contributes to the pathogenesis of the disease."},{"n":3,"s":"The goals of endoscopic sinus surgery include all of the following except","o":["removing all of the sinus mucosa.","promoting drainage of the sinuses.","removing osteitic bone.","restoring normal mucociliary clearance.","removing obstructive polyps."],"k":"A","x":"In functional endoscopic sinus surgery, it is critical to preserve as much normal mucosa as technically feasible. Removal of mucosa prolongs the healing process and leads to scarring with abnormal, poorly functioning mucosa. The other choices represent key principles of functional endoscopic sinus surgery."},{"n":4,"s":"Pott’s puffy tumor is a complication of sinus disease related to","o":["tuberculous sinusitis.","odontogenic infection.","cavernous sinus thrombosis.","frontal sinusitis.","concha bullosa."],"k":"D","x":"Pott’s puffy tumor is a well-circumscribed swelling of the forehead caused by anterior extension of frontal sinusitis. The edema of the skin and soft tissue overlies a collection of pus under the periosteum of the anterior table of the frontal sinus."},{"n":5,"s":"Appropriate initial therapy for acute bacterial sinusitis includes","o":["antibiotics alone.","antibiotics and decongestants.","antihistamines, antral puncture and lavage, and decongestants.","antihistamines and topical decongestants.","antibiotics and topical nasal corticosteroids."],"k":"B","x":"The goal of initial therapy is to prevent disease progression and the possibility of serious sequelae.Appropriately selected antibiotics are the mainstay of therapy for acute sinusitis. Systemic and topical decongestants relieve nasal obstruction, re-establish ostial patency, and ventilate the sinuses. The use of decongestants in conjunction with antibiotics has been shown to be more effective than antibiotics alone."},{"n":6,"s":"The most critical factor in the successful treatment for fulminant invasive fungal sinusitis in a patient in diabetic ketoacidosis is","o":["timely administration of intravenous amphotericin B.","surgical débridement of involved nasal and sinus tissue.","magnetic resonance imaging of sinuses to evaluate the extent of the disease.","culture from the sinonasal tract to identify the species of fungus involved.","control of the underlying diabetes."],"k":"E","x":"Although all of the choices are valid elements of the treatment for fulminant invasive fungal sinusitis, the most critical issue is control of the underlying disease process. The disease process is uniformly fatal if the immunocompromised state cannot be reversed, even with maximal medical and surgical therapy."},{"n":7,"s":"In frontal sinus obliteration, delayed formation of a mucocele results from failure to","o":["place an adequately sized fat graft.","remove all of the frontal sinus mucosa.","plug the frontal sinus ostium with bone.","bevel the edges of the bony osteoplastic flap.","prescribe long-term postoperative antibiotics."],"k":"B","x":"To perform an obliteration successfully, it is absolutely critical to remove all of the mucosa from within the sinus. The gross mucosa is relatively easily stripped from the sinus and its recesses. However, rests of mucosa exist within the small foramina of Breschet in the bone of the anterior and posterior tables. Therefore, all of the bony surfaces of the frontal sinus must be meticulously burred down under microscopic visualization before placing the fat graft."},{"n":8,"s":"The most appropriate imaging technique for the assessment of the obliterated fontal sinus is","o":["magnetic resonance imaging.","ultrasonography.","positron emission tomography.","computed tomography.","plain radiography."],"k":"A","x":"A significant disadvantage of a frontal sinus obliteration procedure is the loss of the ability to follow the status of the sinus endoscopically. This can make assessment of postoperative frontal sinus complaints difficult and delay detection of some late complications. Whereas computed tomography merely shows opacification of the sinus after obliteration, magnetic resonance imaging can differentiate fat used in the obliteration from retained mucosa, secretions, and infection. The other choices have no role in postsurgical imaging of the frontal sinus."},{"n":9,"s":"The following are common symptoms of chronic rhinosinusitis except","o":["nasal discharge.","nasal congestion.","fever.","hyposmia.","fatigue."],"k":"C","x":"The most common symptoms in chronic rhinosinusitis are nasal congestion and discharge. Hyposmia and fatigue are also symptoms that are frequently encountered in this patient population. As opposed to acute infectious sinusitis, fever is seldom associated with chronic rhinosinusitis. Additionally, sinus pain is much more characteristic of acute rhinosinusitis than the chronic form of the disease."},{"n":10,"s":"The most effective pharmacotherapeutic agents for nasal polyposis are","o":["antihistamines.","topical corticosteroids.","topical decongestants.","nonsteroidal anti-inflammatory drugs.","β-agonist inhalers."],"k":"B","x":"Of the choices given, the only agents that have any beneficial effect in the management of nasal polyposis are topical corticosteroids. Nasal polyps may be related to allergy in some patients, but antihistamines alone do not typically cause polyps to regress. Decongestants and β-agonist inhalers have no specific role in the treatment of nasal polyposis, and among nonsteroidal anti-inflammatory drugs, aspirin can actually cause polyp formation in sensitive individuals."}]},{"t":"Headache and Facial Pain","q":[{"n":1,"s":"Headaches more likely to occur in men include","o":["migraine.","cluster.","tension.","trigeminal neuralgia.","giant cell arteritis."],"k":"B","x":"Most headache types occur more often in women. This is true for migraines, tension headaches, trigeminal neuralgia, and giant cell arteritis. The notable exception is cluster headaches, which afflict men more often than women."},{"n":2,"s":"Symptomatic treatment for migraines should include all of the following except","o":["trigger avoidance.","antiemetics.","daily use of ergotamine.","avoiding ergot derivatives in patients with coronary artery disease.","inducing sleep."],"k":"C","x":"Treatment of migraine headaches includes education, application of ice, isolation in a dark quiet room, biofeedback, acupuncture, inducing sleep, avoiding triggers, analgesics, opiates, ergot derivatives, triptan derivatives, and antiemetics. The ergot derivatives and triptan products can induce angina in patients with coronary artery disease, or they can cause chronic headaches if used more often than two times per week. Therefore, they are contraindicated in patients with coronary artery disease and are not to be taken daily."},{"n":3,"s":"Prophylactic medications for migraines include all of the following except","o":["amitriptyline.","metoprolol.","verapamil.","carbamazepine.","naproxen."],"k":"D","x":"Prophylactic migraine medications include antidepressants, ergotamine, beta blockers, nonsteroidal anti-inflammatory drugs, calcium channel blockers, and some anticonvulsants, including divalproex, valproic acid, gabapentin, or topiramate but not carbamazepine. Carbamazepine is instead used to treat cranial neuralgias."},{"n":4,"s":"Features of a tension headache include (1) more common in women (2) bilateral (3) dull pain (4) associated with depression","o":["1, 2, and 3","1 and 3","2 and 4","4 only","all of the above"],"k":"E","x":"Tension headache features include greater prevalence in women, bilaterality, tightening or dull pain, exacerbation by stress, and association with depression. Therefore, all of the features are correct."},{"n":5,"s":"Cluster headaches are typically (1) dull, burning pain (2) often awaken patients (3) are not associated with intracranial lesions (4) are associated with unilateral nasal congestion","o":["1 and 3","2 and 4","4 only","1, 2, and 3","all of the above"],"k":"B","x":"Cluster headaches have severe lancinating pain that often awakens patients. They are associated with unilateral nasal congestion, rhinorrhea, and lacrimation. They may occur with intracranial lesions or after meningitis. Therefore, (2) and (4) are correct, and (1) and (3) are not."},{"n":6,"s":"Evaluation for a possible subarachroid hemorrhage should include any of the following except","o":["noncontrast head computed tomography.","lumbar puncture.","intra-arterial angiography.","funduscopy.","Doppler ultrasonography."],"k":"E","x":"The orderly evaluation of a patient with a possible subarachnoid hemorrhage proceeds from an examination including funduscopy to a noncontrast head computed tomography, to a lumbar puncture, to an angiography. Ultrasonography does not play a role."},{"n":7,"s":"Diagnosis of giant cell arteritis","o":["is likely in young men.","carries a low risk of blindness.","is confirmed with an elevated sedimentation rate.","currently requires an arterial biopsy.","is suspected for occipital headaches."],"k":"D","x":"Giant cell arteritis is most likely to occur in women over 50 years of age, with an elevated sedimentation rate and a temporal headache. The risk of blindness is 15%; therefore, treatment should be initiated urgently. Confirmation of the diagnosis is made on the histopathology of a temporal artery biopsy."},{"n":8,"s":"Features of benign intracranial hypertension include (1) pulsatile tinnitus (2) visual dimming and blindness (3) papilledema (4) absence of intracranial ventricular enlargement","o":["2 and 3","1 and 4","1, 2, and 3","4 only","all of the above"],"k":"E","x":"Benign intracranial hypertension is characterized by papilledema, a normal neurologic examination, elevated intracranial pressure, and no intracranial mass or ventricular enlargement on radiographic studies. Associated symptoms include decreasing vision and pulsatile tinnitus. Therefore, all of the features are correct."},{"n":9,"s":"Headaches may occur from chronic use of (1) NSAIDs (2) ergot derivatives (3) narcotics (4) barbiturates","o":["1 and 3","2 and 4","1, 2, and 3","all of the above","none of the above"],"k":"D","x":"Chronic use of medication can cause headaches. Offending agents include NSAIDs, barbiturates, codeine, hydrocodone, oxycodone, propoxyphene, ergotamine, and dihydroergotamine. Therefore, all of the possibilities are correct."},{"n":10,"s":"Temporomandibular joint disorders have all of the following features except","o":["usually associated with organic joint disease.","more common in women.","decreased range of motion in the temporomandibular joint.","mild or moderate intensity.","associated with bruxism."],"k":"A","x":"Temporomandibular joint disorders occur more often in women. The pain is mild to moderate and temporal, is exacerbated by jaw movement or bruxism, and results in trismus, but, usually, organic disease in the joint does not exist."}]},{"t":"Neoplasms of the Nose and Paranasal Sinuses","q":[{"n":1,"s":"What is the incidence of squamous cell carcinoma in patients with inverted papillomas?","o":["0%","15%","30%","50%","70%"],"k":"B","x":"Five to 15% of patients have squamous cell carcinoma associated with inverted papilloma. The extent of involvement with squamous cell carcinoma determines the role of adjuvant therapy."},{"n":2,"s":"Fibrous dysplasia of the orbital rim and maxillary sinus is causing diplopia and proptosis. The treatment should be","o":["radical maxillectomy.","maxillectomy and orbital exeneration, with palatal prosthesis.","maxillectomy with a microvascular osteocutaneous flap.","partial excision with contouring/sculpting of involved areas.","chemotherapy."],"k":"D","x":"This disease process is treated in symptomatic patients with sculpting of the involved bone resulting in partial excision. En bloc resection is not indicated."},{"n":3,"s":"The histology of malignant tumors of the sinonasal tract is varied; the type with the most well-known link to environmental exposure to wood dust is","o":["squamous cell carcinoma.","adenoid cystic carcinoma.","adenocarcinoma.","olfactory neuroblastoma.","sarcoma."],"k":"C","x":"Exposure to wood dust increases the relative risk of adenocarcinoma by 540 times. However, it should be noted that squamous cell carcinoma also shares this relationship to wood dust, with prolonged exposure resulting in a 21 times increase in relative risk."},{"n":4,"s":"Radiographic imaging of sinus neoplasia with computed tomography (CT) provides information regarding all of the following except","o":["the size of neural foramina.","sinus and orbital bone destruction.","the integrity of the skull base.","the site of the tumor.","differentiation of soft tissue and retained mucus."],"k":"E","x":"With CT, one has difficulty distinguishing between retained secretions and tumor or tumor and swollen mucosa. Magnetic resonance imaging complements CT by providing valuable information in the differentiation of normal mucosa from neoplasm and neoplasm from retained mucus."},{"n":5,"s":"Interventional and diagnostic angiography are indicated for","o":["all lesions.","embolization of vascular lesions.","adjuvant chemotherapy.","determination of the location and extent of the tumor.","evaluation of the vascularity of a tumor."],"k":"B","x":"Diagnostic and interventional angiography is valuable for therapeutic embolization prior to resection of vascular tumors. This is typically performed within 24 to 48 hours prior to resection. The use of embolization is valuable in the treatment of juvenile nasopharyngeal angiofibromas.Angiography and/ or balloon occlusion testing are performed for patients undergoing carotid resection or bypass. In our experience, very few patients require this type of management."},{"n":6,"s":"What theoretical plane from the medial canthus of the eye to the angle of the mandible divides the facial skeleton into two parts?","o":["Ohngren’s line","Frankford’s line","Kennedy’s line","Osguthorpe’s line","arcuate line"],"k":"A","x":"Ohngren’s line divides the facial skeleton into two parts as it passes from the medial canthus of the eye to the angle of the mandible. It divides the maxillary sinus into good and poor prognosis zones, with tumors posterior to the line or plane having a poorer prognosis."},{"n":7,"s":"Poor prognostic factors among nasal and paranasal sinus malignancies include all of the following except","o":["histologic subtype.","lymph node involvement.","skull base involvement.","stage.","perineural invasion."],"k":"A","x":"The role of histologic subtype has not been clearly defined. It has not been associated with prognosis in many reports, and other authors have suggested improved survival among adenoid cystic carcinoma and lymphoma and poorer survival rates in undifferentiated carcinoma as well as melanoma. These data are of limited value because of the different treatment regimens employed and the small number of patients studied."},{"n":8,"s":"Resectability of tumors and extent of surgery are defined by","o":["computed tomography (CT).","magnetic resonance imaging (MRI).","surgical exploration.","transdural extension.","all of the above."],"k":"E","x":"The definition of resectability is determined with CT, MRI, and findings at surgical exploration. Transdural extension, invasion of the prevertebral fascia, bilateral optic nerve involvement, and gross cavernous sinus invasion are criteria for unresectable lesions. Computed tomographic scans provide a detailed understanding of the extent of the bone involvement and sites of bone invasion. Magnetic resonance imaging helps define the presence of retained mucus and swollen mucosa in areas adjacent to the tumor. This technology also allows better definition of periorbital, dural, and brain invasion than CT alone. Neither entity is highly sensitive and specific for subtle invasion through the orbital periosteum or dura."},{"n":9,"s":"Incisional components of the midfacial degloving exposure include","o":["marginal rim incisions.","transcartilaginous lower lateral cartilage incisions.","intercartilaginous (between the upper and lower lateral cartilages) incisions.","hemitransfixion incision.","external columellar incision."],"k":"C","x":"The intercartilaginous incisions in combination with the piriform aperture and complete transfixion incision allow mobilization and retraction of the nasal tip and lower lateral cartilages out of the field. The advantage of this exposure is the lack of external incisions. The approach does carry the risk of lip numbness (temporary or permanent), vestibular stenosis, and oronasal or oroantral fistula."},{"n":10,"s":"Complications associated with craniofacial resection include","o":["anosmia.","dacryocystitis.","meningitis.","pneumocephalus.","all of the above."],"k":"E","x":"The complication of anosmia is expected and would be viewed as a side effect. Dacryocystitis occurs among patients who have resection of the ethmoid or maxillary sinus. It can be minimized by performing a dacryocystorhinostomy. Meningitis and pneumocephalus are also known complications of cranial base surgery. The risk of pneumocephalus can be minimized with tracheostomy. The risk of cerebrospinal fluid leak and meningitis is minimized with the use of galeopericranial flaps for skull base reconstruction."}]},{"t":"Reconstruction of the Outstanding Ear","q":[{"n":1,"s":"The auricle is 90 to 95% of adult size by","o":["3 to 4 years of age.","5 to 6 years of age.","7 to 8 years of age.","9 to 10 years of age.","11 to 12 years of age."],"k":"B","x":"The auricle is 85% of adult size by 3 years of age and is 90 to 95% of full size by 5 to 6 years of age, although it may elongate an additional 1 to 1.5 cm during life. The optimal age for surgical correction is between 4 and 6 years of age. At this age, the auricle is near or at full adult size, and the child is capable of participating in the postoperative care of the ear. Also, the child is typically about to enter school, and, unfortunately, children with protruding ears are commonly subjected to severe ridicule by their young peers."},{"n":2,"s":"The most common cause of outstanding ears is","o":["lack of development of the antihelical fold.","overdevelopment of the antihelical fold.","a wide protruding concha.","overdevelopment of the cauda helicis.","underdevelopment of the concha."],"k":"A","x":"The most common cause of outstanding ears is the lack of development of the antihelical fold. This malformation of the antihelix is present in approximately two-thirds of all outstanding ears. However, other pathologic features may also contribute to the outstanding ear. A wide, protruding conchal wall is present in approximately one-third of all cases. Additionally, the prominent concha is often accompanied by a thickened antitragus."},{"n":3,"s":"Most ear anomalies are inherited as","o":["autosomal recessive traits.","autosomal dominant traits with incomplete penetrance.","X-linked traits.","random mutations.","autosomal dominant traits."],"k":"B","x":"Most ear anomalies are inherited as autosomal dominant traits with incomplete penetrance."},{"n":4,"s":"The outer cartilage bites of Mustarde sutures are described as","o":["1 cm separated by 2 mm.","1 cm separated by 1 cm.","2 mm separated by 1 cm.","2 mm separated by 2 mm.","8 mm separated by 8 mm."],"k":"A","x":"In the mid-1960s, Mustarde described a corrective otoplasty technique that gained quick and ready acceptance and wide popularity as it was seen as a marked improvement over existing techniques. Horizontal mattress sutures placed in the auricular cartilage along the scapha recreate the natural curve of the antihelix, blending gently into the scaphoid fossa. Dimensions of the outer cartilage bites of the horizontal mattress sutures have been described as 1 cm separated by 2 mm."},{"n":5,"s":"In Mustarde sutures, the distance between the outer and inner cartilage bites has been described as","o":["12 mm.","14 mm.","16 mm.","18 mm.","20 mm."],"k":"C","x":"The distance between the outer and inner cartilage bites is 16 mm."},{"n":6,"s":"Mustarde sutures should be placed through","o":["the posterior perichondrium only.","the cartilage only.","the cartilage and anterior perichondrium.","the posterior perichondrium and cartilage.","the posterior perichondrium, cartilage, and anterior perichondrium."],"k":"E","x":"Once the new antihelix has been marked, 4-0 braided nylon horizontal mattress sutures are placed sequentially, from caudal to cephalic along the neoantihelical fold. These horizontal mattress sutures are placed through the posterior perichondrium, auricular cartilage, and anterior perichondrium. Careful palpation with the free hand along the anterior surface of the auricle ensures that the needle does not pass through the anterior skin. Incorporation of the anterior perichondrium in the horizontal mattress suture is necessary to prevent the suture from tearing through the cartilage when it is tied."},{"n":7,"s":"When performing mattress suture otoplasty in the manner of Tardy, thick strong cartilage may be weakened by","o":["partial-thickness excision of the anterior cartilage.","partial-thickness excision of the posterior cartilage.","full-thickness excision of cartilage.","full-thickness excision with suture reattachment.","none of the above."],"k":"B","x":"The mattress suture procedure is frequently augmented by thinning, weakening, and, occasionally, limited incision of the posterior surface cartilage to achieve natural and symmetric results. Thinning of the cartilage by shave excision or with a bur and incisions through the cartilage to facilitate folding will reduce the tension on the horizontal mattress sutures. Using a scalpel, small disks of cartilage can be shaved from the conchal region to allow retropositioning of the auricle. This cartilage sculpturing is often sufficient to retroposition the ear and makes conchal setback sutures unnecessary. Excision of cartilage in this area will weaken the cartilage, reducing overall tension on the mattress sutures that will be placed in the antihelix region. Great care is taken to achieve partial-thickness excision of cartilage, and through-and-through excision is avoided."},{"n":8,"s":"Perioperative antibiotic treatment should especially include coverage for","o":["Staphylococcus aureus.","Pseudomonas aeruginosa.","Streptococcus pneumoniae.","Moraxella catarrhalis.","Actinomyces israelii."],"k":"B","x":"Infection may occur secondarily to an unevacuated hematoma but may also result from lapses in sterile technique or from the presence of contaminated suture. Evolution to perichondritis occurs in approximately 1% of all cases. Treatment must be aggressively implemented to prevent chondritis and resulting cartilage necrosis and auricular deformity. Antibiotic treatment must empirically cover P. aeruginosa. Persistent infection may also necessitate the removal of permanent sutures and débridement locally. Preoperatively, a single dose of broad-spectrum antibiotics can minimize the risk of infection."},{"n":9,"s":"A deformity in which the middle portion of the ear is overcorrected in relation to the upper and lower poles is the","o":["telephone ear deformity.","reverse telephone ear deformity.","lop ear deformity.","cup ear deformity.","flail ear deformity."],"k":"A","x":"Overcorrection of the middle portion of the ear leads to a “telephone ear” deformity owing to the relative prominence of the superior and inferior poles. One commonly described cause of the telephone ear deformity is over-reduction of the hypertrophic concha. Alternatively, overcorrection of the upper and lower poles may result in the “reverse telephone ear” deformity. The term “lop ear” is used to describe a deformity of the helix characterized by a thin, flat ear that is acutely folded downward at the superior pole. In the “cup ear” deformity, weak cartilage with resulting limpness of the auricle results in cupping or deepening of the conchal bowl. The cup ear is often smaller than normal and folded on itself. Poor development of the superior portion of the ear results in a short, thickened helix and a deformed antihelix."},{"n":10,"s":"The rates of complications in otoplasty have been reported in the range of","o":["2 to 6%.","5 to 9%.","7 to 11%.","11 to 14%.","13 to 16%."],"k":"C","x":"Regardless of the surgical techniques employed, complications are reported to occur at rates ranging from 7.1 to 11.4%. Early complications include hematoma and infection. Infection can be cellulitis or perichondritis/chondritis, which can lead to permanent auricular deformity. Late complications include paresthesias and hypersensitivity, suture granuloma formation, suture extrusion, hypertrophic scarring, and keloid fomation. Esthetic complications include inadequate correction of the antihelix, overcorrection with a “hidden” helix, telephone ear or reverse telephone ear deformity, persistent prominence of the concha, malposition of the lobule, sharp cartilage edges when cartilage cutting approaches are employed, and distortion of the external auditory canal with possible stenosis."}]},{"t":"Nasal Reconstruction and Rhinoplasty","q":[{"n":1,"s":"Incisions in and around the nose should be placed","o":["in the precise midline.","inside the nose to avoid detection.","at the junction of facial landmarks.","in a circular manner.","at right angles to the relaxed skin tension lines."],"k":"C","x":"Where facial features and landmarks join is the best place to camouflage and hide incisions on and about the nose."},{"n":2,"s":"The most versatile of the local flaps available for nasal epithelial repair are","o":["cheek advancement flaps.","rotation flaps.","interposition flaps.","island flaps.","transposition flaps."],"k":"E","x":"The local transposition flaps (bilobed, rhomboid, and Z-plasty) provide the best options for complex nasal defect repair because of their versatility, options provided, and one-stage repair characteristics."},{"n":3,"s":"Which of these personal characteristics does not describe a good candidate for esthetic rhinoplasty?","o":["obsessive-compulsive traits","realistic expectations","obvious deformities","oily skin","anxiety about surgery"],"k":"A","x":"Obvious or overt obsessive-complex traits often indicate a tendency to expect perfection, leading to complaints about inconsequential imperfections regarding the outcome of surgery."},{"n":4,"s":"The paired lower lateral (alar) cartilages","o":["are attached to the nasal bones.","are divided into the medial crus, lateral crus, and intermediate crus.","are seldom asymmetric.","are attached by a ligament to the caudal septum.","move independently of one another during facial animation."],"k":"B","x":"Normal alar cartilages are composed of three distinct anatomic segments: the lateral, medial, and intermediate crura."},{"n":5,"s":"Concerning the nondelivery approaches to the nasal tip, it is incorrect to say that","o":["the caudal aspects of the lateral crura remain undisturbed.","symmetric cartilage resection may be difficult to achieve.","it is necessary to employ a complete transfixion incision to gain access to the nose.","the final outcome of the nasal tip healing is highly predictable.","normal tissue of the nasal tip is less disturbed in this approach than in delivery and open approaches."],"k":"C","x":"It is not necessary to perform a complete transfixion incision to gain effective access to the nose through a typical nondelivery approach."},{"n":6,"s":"Overprojecting nasal tips are the result of all except one of the following:","o":["hypertrophy of the alar cartilages","enlarged nasal spine","an overlong caudal aspect of the quadrilateral cartilage","excessive fat in the nasal tip","hypertrophy of the dorsal quadrilateral cartilage"],"k":"D","x":"By itself, an increase of the fat in the nasal tip does not create tip overprojection."},{"n":7,"s":"In regard to medial-oblique osteotomies, which is incorrect?","o":["They normally course 15 to 20 degrees from the midline.","Guarded osteotomes are not essential to create complete osteotomies.","They establish a weak point that is subsequently the site of fracture created by the low lateral osteotomies.","They create, by themselves, a mobile lateral bony sidewall.","They are best created with micro-osteotomes."],"k":"D","x":"Medial osteotomies alone do not result in a totally mobile lateral nasal sidewall."},{"n":8,"s":"The advantages of dissection in the favorable tissue planes in the nose include all except one of the following:","o":["minimal bleeding","diminished postoperative swelling","diminished ultimate scarring","enhanced surgical visualization","modest tip rotation"],"k":"E","x":"No rotation is realized by dissection in the favorable tissue planes of the nose."},{"n":9,"s":"In the postoperative care of the patient, which of the following is most correct?","o":["Antibiotics should be routinely used.","Decongestants should be taken daily.","The splint should remain in place for 5 to 7 days.","The foot of the bed should be elevated.","The inside of the nose should be cleaned daily with povidone-iodine and Q-tips."],"k":"C","x":"The only choice in this group that is constantly important is the application of the splint."},{"n":10,"s":"Increased tip projection may be achieved by all except one of the following methods:","o":["application of a cartilage tip graft","borrowing from the lateral crura to elongate the intermediate crura","transdomal suturing of the domes","use of bilateral spreader grafts","application of only cap grafts"],"k":"D","x":"Spreader grafts have no effect on tip projection per se and are used for correction of internal nasal valve collapse and for straightening the lateral lines of the nose on frontal view."}]},{"t":"Facial Fractures","q":[{"n":1,"s":"Airway control is most probably required in facial fractures involving","o":["extensive comminution of the zygoma.","bilateral subcondylar fractures of the mandible.","posterior table frontal sinus fractures.","bilateral anterior body mandibular fractures.","alveolar ridge fractures of the maxilla."],"k":"D","x":"The airway is compromised by a bilateral body fracture of the mandible because of the posterior prolapse of the fracture fragment into the upper airway owing to the contraction of the geniohyoid and genioglossus muscles. These muscles pull the fracture fragment posteriorly, bringing the tongue into the upper part of the pharynx."},{"n":2,"s":"In fractures of the parasymphyseal area of the mandible, the Champy plate","o":["should always be placed with an antitension band.","must go through both cortices of the mandible.","can be safely placed without postoperative intermaxillary fixation.","needs to be removed if a screw approximates a tooth root.","should not be placed at this site."],"k":"A","x":"Because of the necessity of opposing the forces of distraction, an antitension band is needed when a Champy miniplate is used to repair a fracture in the parasymphyseal area of the mandible. These plates should penetrate only the lateral cortex of the mandible. Intermaxillary fixation to establish normal dental occlusion should always be placed prior to any interosseus fixation."},{"n":3,"s":"Which mandibular fracture is least suited for lag-screw fixation?","o":["parasymphyseal","body","angle","subcondylar","all are well suited for the lag-screw fixation"],"k":"D","x":"It is extremely difficult to capture the condylar fragment with a lag screw. Moreover, only one screw can be passed because of the narrowness of the condylar neck. Thus, stable fixation cannot be achieved."},{"n":4,"s":"A dislocated subcondylar fracture of the mandible in a child should usually be treated by","o":["open reduction and replacement of the condyle into the glenoid fossa.","fixation of the reduced fragment with a miniplate.","intermaxillary fixation for 6 weeks.","intermaxillary fixation for 2 weeks.","no fixation and a soft diet."],"k":"D","x":"Children will remodel and even reform a new condyle over a period of 1 to 2 years. Intermaxillary fixation to relieve pain is followed by a period of oral physiotherapy to mobilize the jaws. Open reduction and internal fixation often result in avascular necrosis of the condyle and severe temporomandibular joint dysfunction."},{"n":5,"s":"Body and parasymphyseal mandibular fractures in the dentulous patient are usually considered to be compound because","o":["the oral cavity is the most highly contaminated cavity in the body.","the fracture usually connects to the periodontal membrane.","the fracture almost always tears the gingival mucous membrane.","most fractures are double or multiple in nature.","all of the above."],"k":"B","x":"The periodontal pocket between the gingiva and the tooth root is in continuity with the oral cavity."},{"n":6,"s":"Which of the following signs or symptoms never occurs in patients with a trimalar fracture of the zygoma?","o":["malocclusion.","numbness in the distribution of the infraorbital nerve.","trismus.","epistaxis.","subcutaneous emphysema."],"k":"A","x":"Malocclusion never occurs in a pure trimalar fracture because neither the mandible nor the maxilla is fractured. Trismus occurs because of the origin of the masseter muscle on the zygomatic arch, thus producing pain by traction on the arch during mastication."},{"n":7,"s":"The mechanism for the production of an open bite deformity in the Le Fort III fractures of the maxilla is","o":["bilateral fractures of the zygomatic arches.","a vertical fracture through the hard palate.","the pull of the temporalis muscles.","the pull of the pterygoid muscles.","airway obstruction."],"k":"D","x":"The open bite occurs by virtue of the medial pterygoid muscles inserting on the angle of the mandible. The craniofacial dysjunction created by the fracture frees the maxilla from the cranium, allowing the natural pull of the medial pterygoids to displace the maxilla toward the mandibular angle. The force is in a posteroinferior direction."},{"n":8,"s":"Through-and-through fractures of the frontal sinuses are most effectively treated by","o":["endoscopic approaches.","cranialization.","Riedel ablation.","osteoplastic flap and fat obliteration.","observation and then delayed repair."],"k":"B","x":"Cranialization provides the best means of managing the through-and-through fracture of the frontal sinus. The craniotomy to repair the intracranial injury provides excellent exposure for resection of all of the posterior wall of the frontal sinus and every last remaining vestige of the frontal sinus mucosa. The enlargement of the anterior fossa cavity provides an opportunity for expansion of edematous brain without restriction. Returning the frontal sinus anterior wall fragments provides for future protection of the brain and restoration of the normal forehead contour."},{"n":9,"s":"Which of the following muscles does not contribute to the formation of the medial canthal tendon?","o":["the medial check ligament of the eye","Lockwood’s suspensory ligament of the eye","the orbital part of the orbicularis oculi muscle","the preseptal part of the orbicularis oculi muscle","the pretarsal part of the orbicularis oculi muscle"],"k":"C","x":"The bulk of the medial canthal tendon comprises the tendonous extension of the preseptal and pretarsal parts of the orbicularis oculi muscle. The orbital portion, the most external component of the orbicularis oculi, takes origin on the bones of the orbital rim and inserts on the periorbital skin but does not contribute to the medial canthal tendon."},{"n":10,"s":"The typical displacement of the medial canthus in an avulsed medial canthal tendon is","o":["medially, superiorly, and anteriorly.","laterally, anteriorly, and inferiorly.","medially, inferiorly, and posteriorly.","laterally, superiorly, and anteriorly.","medially, inferiorly, and anteriorly."],"k":"B","x":"The typical displacement of the avulsed medial canthal tendon is laterally because of the retraction of the orbicularis oculi, inferiorly because of the loss of support by Lockwood’s suspensory ligament, and anteriorly because of the lack of the tethering action of the canthal tendon and the medial check ligament."}]},{"t":"Microtia, Canal Atresia, and Middle Ear Anomalies","q":[{"n":1,"s":"Which of the following statements concerning the embryogenesis of the ear is false?","o":["The otocyst forms the inner ear membranous structures.","The endolymphatic duct develops first at the 6 mm stage, followed by the appearance of the semicircular ducts and the cochlear diverticulum.","By the end of the seventh month, the cochlea becomes fully coiled.","The first indications of aural ontogenesis are the first and second branchiomeric structures and the otic placode.","The cochleovestibular ganglia develop from the otic placode epithelium."],"k":"C","x":"In the 3 to 4 mm embryo (3 to 4 weeks), the first indications of aural ontogenesis are the first and second branchiomeric structures and the otic placode. The placode invaginates to first form a pit and then a vesicle detached from its surface origin. This otocyst forms the inner ear membranous structures, with the endolymphatic duct developing first in the 6 mm embryo, followed by the appearance of the semicircular ducts and the cochlear diverticulum in the 15 mm embryo (6 weeks). By the end of the third month, the cochlea is fully coiled. The cranial nerves entering the otocyst exert an inductive influence to produce neuroepithelium. The cochleovestibular ganglia develop from the otic placode epithelium."},{"n":2,"s":"Which of the following statements concerning the embryogenesis of the ear is false?","o":["Six mesodermal hillocks surround the entrance of the first branchial cleft.","The first branchial arch cartilage (Meckel’s) forms the tragus and superior helical crus.","The developing auricular appendage migrates from its initial position in the lower face toward the temporal area.","The first arch forms the head of the malleus and body of the incus.","The second arch gives rise to the manubrium, long process of the incus, stapes superstructure, and footplate."],"k":"E","x":"Six mesodermal thickenings or hillocks surround the entrance of the first branchial cleft. The first branchial arch cartilage (Meckel’s) forms the tragus and superior helical crus; the remainder of the pinna derives from the second arch cartilage (Reichert’s). The developing auricular appendage migrates from its initial position in the lower face toward the temporal area. The ossicles predominantly originate from the mesenchymal visceral bars of the first and second arches. The first arch forms the head of the malleus and body of the incus, with the second arch giving rise to the manubrium, long process of the incus, stapes superstructure, and lateral portion of the footplate. The medial lamina of the footplate is derived from the otic capsule."},{"n":3,"s":"Which of the following statements concerning the etiology and incidence of aural atresia is false?","o":["Atresia and microtia are associated with several known syndromes.","Aural atresia occurs in approximately 1 in 100,000 live births.","Although the inner and middle ears develop separately, inner ear abnormalities coexist in 12 to 50% of cases.","Atresia is bilateral in 30% of cases, occurring more commonly in males and in the right ear.","It is not surprising that an embryonic insult severe enough to cause aural atresia would also affect other organ systems."],"k":"B","x":"Atresia and microtia are associated with several known syndromes felt to be associated with inherited defects or acquired embryopathies owing to intrauterine infection (rubella, syphilis), ischemic injury (hemifacial microsomia), or toxin exposure (thalidomide, isotretinoin). The genetic basis of external and middle ear anomalies generally remains poorly characterized. Aural atresia occurs in approximately 1 in 20,000 live births. Although the inner and middle ears develop separately, inner ear abnormalities coexist in 12 to 50% of cases. Atresia is bilateral in 30% of cases, occurring more commonly in males and in the right ear. It is not surprising that an embryonic insult severe enough to cause aural atresia would also affect other organ systems."},{"n":4,"s":"Which of the following statements concerning the diagnosis of microtia or aural atresia is false?","o":["In grade I, the auricle is developed and, though misshapen, has a readily recognizable, characteristic anatomy.","In grade II, the helix is rudimentary, and the lobule is developed.","In grade III, an amorphous skin tag is present. In all grades, wide variation of morphology exists.","In cases of stenosis, entrapped squamous epithelium may lead to a retention cholesteatoma with bone destruction.","All ears with complete atresia have cholesteatomas."],"k":"E","x":"In grade I, the auricle is developed and, though misshapen, has a readily recognizable, characteristic anatomy. In grade II, the helix is rudimentary, and the lobule is developed. In grade III, an amorphous skin tag is present. In all stages, wide variations of morphology exist. The pinna may be fully formed with a transverse and low-set orientation. There may be accessory appendages of the pinna (pretragal tags with or without cartilage) and preauricular sinus tracts. The external canal may be stenotic or atretic to varying degrees. In cases of stenosis, entrapped squamous epithelium may lead to a retention cholesteatoma with bone destruction. Ears with congenital meatal stenosis have a higher incidence of cholesteatomas than completely atretic ears."},{"n":5,"s":"Which of the following statements concerning the diagnosis of aural atresia is false?","o":["Computed tomographic studies allow determination of the degree of the canal atresia and the thickness of the atresia plate.","Computed tomographic studies allow determination of the extent of pneumatization of the middle ear and mastoid, the intratemporal course of the facial nerve, and the relationship of the stapes to the facial nerve.","Computed tomography may uncover the presence of an unsuspected cholesteatoma.","Brainstem response audiometry is not helpful in assessing the presence or degree of hearing loss in neonates owing to the possibility of masking dilemmas.","As the infant matures, behavioral audiometric evaluations must be obtained to confirm the neurophysiologic tests of hearing."],"k":"D","x":"Computed tomographic studies allow determination of the degree of the canal atresia, the thickness of the atresia plate, the extent of pneumatization of the middle ear and mastoid, the intratemporal course of the facial nerve, and the presence or absence of the oval window and the stapes.An unsuspected cholesteatoma may also be apparent. Brainstem response audiometry should be performed in all infants born with either microtia or atresia. Bilateral involvement may cause masking dilemmas, but this does not affect auditory brainstem responses. As the infant matures, behavioral audiometric evaluations must be obtained to confirm the neurophysiologic tests of hearing."},{"n":6,"s":"Which of the following statements concerning the management of aural atresia is false?","o":["Early amplification, auditory training, and speech therapy can improve speech and language skills.","In children with bilateral atresia, amplification with bone-conduction aids should be provided as soon as possible, preferably within the first few months of life.","In infants with unilateral atresia and conductive hearing loss in the seemingly normal ear, an air-conduction aid should be fitted to the ear with a canal.","In cases of microtia that require reconstruction, atresia repair can precede auricular reconstruction.","In the unilateral case with normal contralateral hearing, repair of either the microtia or the atresia is considered elective, and there is less urgency to intervene during childhood."],"k":"D","x":"Early amplification, auditory training
