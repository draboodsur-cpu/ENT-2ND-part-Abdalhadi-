ntrast are often necessary.","Molecular studies of nasopharyngeal tumors have led to markers that predict outcome better than the WHO classification of histology.","The diagnosis of nasopharyngeal carcinoma is based on serologic confirmation."],"k":"C","x":"The complicated anatomy of the nasopharynx and its relationship to other complicated regions of the skull base, as well as its composition of soft tissue and bone, are factors supporting both imaging modalities. These studies are often complementary and not overlapping in the workup of patients with these lesions. The other statements are not true."}]},{"t":"Neoplasms of the Oral Cavity and Oropharynx","q":[{"n":1,"s":"Squamous cell carcinoma (SCC) at high risk for bilateral regional lymph node metastases includes all of the following primary sites except the","o":["midline lip.","floor of the mouth.","oral tongue.","base of the tongue.","alveolar ridge."],"k":"E","x":"Midline structures of the oral cavity and oropharynx commonly drain to lymphatic channels in both sides of the neck. Primary sites of SCC of the oral cavity at high risk for bilateral regional lymph node metastases include the midline of the lip, floor of the mouth, and oral tongue. Primary sites of SCC of the oropharynx at high risk for bilateral regional lymph node metastases include the base of the tongue, soft palate, and midline posterior pharyngeal wall. Squamous cell carcinoma of the alveolar ridge does not readily metastasize to regional lymphatics."},{"n":2,"s":"The most likely reason for the higher proportion of squamous cell carcinoma of the oral cavity and oropharynx in Southeast Asia compared with that in the United States is","o":["genetic differences in the P53 mutation.","cultural differences in tobacco consumption.","differences in occupational exposure.","epidemiologic errors in reporting.","none of the above."],"k":"B","x":"Geographic differences in tobacco consumption may explain the higher proportion of cancers arising from the oral cavity and oropharynx worldwide compared with that in the United States. Such cultural practices include reverse smoking, consumption of betel and paan, and bidi smoking."},{"n":3,"s":"All of the following statements regarding verrucous carcinoma are true except","o":["it readily metastasizes to regional lymph nodes.","it presents as a slowly growing exophytic or warty neoplasm in the oral cavity.","the histologic appearance includes keratinized epithelium arranged in long, papillomatous folds with a “pushing” border.","recommended treatment for it is wide surgical excision.","recurrent lesions tend to be in the form of lessdifferentiated carcinomas."],"k":"A","x":"Choices B, C, D, and E all accurately describe verrucous carcinoma. True verrucous carcinoma does not have metastatic potential."},{"n":4,"s":"Regional metastases to cervical lymph nodes decrease 5-year survival rates by","o":["10%.","20%.","50%.","80%.","90%."],"k":"C","x":"The 5-year survival rate of patients with metastases to cervical lymph nodes is approximately 50% that of patients without regional lymph node metastases."},{"n":5,"s":"A patient would present complaining of symptoms earliest with a primary tumor arising from which site?","o":["floor of the mouth","oral tongue","hard palate","base of the tongue","tonsil"],"k":"B","x":"It has been shown that the delay in diagnosis for primary tumors of the oral cavity is greatest for floor of the mouth cancer and shortest for tongue cancer. Establishing a diagnosis of cancer of the hard palate is often confounded by the considerable delay before patients present complaining of symptoms. Likewise, in the oropharynx, cancers of the base of the tongue and tonsil tend to be of more advanced stages before patients seek treatment. The symptoms of dysarthria and pain with eating associated with carcinoma of the oral tongue tend to result in patients presenting at an earlier stage of disease."},{"n":6,"s":"Which procedure would be the ideal neck dissection performed for elective treatment of a patient with squamous cell carcinoma (SCC) arising in the oral cavity without clinically apparent regional nodal metastases (N0 neck)?","o":["radical neck dissection clearing levels I to V","modified radical neck dissection clearing levels I to V with preservation of the sternocleidomastoid muscle, spinal accessory nerve (XI), and internal jugular vein","anterolateral neck dissection clearing levels II, III, and IV","supraomohyoid neck dissection clearing levels I, II, and III","central compartment neck dissection"],"k":"D","x":"Lymph node metastases from primary tumors of the oral cavity and oropharynx occur in a predictable fashion through sequential spread. Regional lymph nodes at highest risk for metastases from primary SCC of the oral cavity include those at levels I, II, and III. In light of the morbidity associated with the radical neck dissection, there has been a trend toward selective, rather than comprehensive, neck dissection, based on the predictable pattern of cervical lymph node metastases. Supraomohyoid neck dissection, selective lymphadenectomy clearing cervical nodal levels I, II, and III, has been recommended for N0 patients with primary SCC of the oral cavity. Anterolateral neck dissection clearing levels II, III, and IV has been advocated for N0 necks with an oropharyngeal primary."},{"n":7,"s":"The preferred method of treatment for stage III and IV tumors of the buccal mucosa is","o":["combination therapy using surgery with postoperative radiation therapy.","combination therapy using concomitant chemotherapy and radiation therapy.","surgery alone.","radiation therapy alone.","combination therapy using surgery and chemotherapy."],"k":"A","x":"As is the case with most tumors of the oral cavity and oropharynx, surgical resection is recommended for stage I and II tumors, with combination therapy using surgery and postoperative radiotherapy for stage III and IV tumors."},{"n":8,"s":"Otalgia arising from carcinoma of the retromolar trigone results from involvement of which cranial nerve?","o":["V","VII","IX","X","XI"],"k":"C","x":"Branches from the glossopharyngeal (IX) nerve provide sensory innervation to the retromolar trigone, so patients with carcinoma of the retromolar trigone may present complaining of pain referred to the ipsilateral ear."},{"n":9,"s":"Which primary tumor of the oral cavity or oropharynx demonstrates the most sensitive response to radiation therapy?","o":["alveolar ridge","hard palate","retromolar trigone","posterior pharyngeal wall","tonsil"],"k":"E","x":"Of all of the tumors in the oral cavity and oropharynx, cancers of the tonsil are the most radiosensitive, particularly exophytic lesions."},{"n":10,"s":"Surgical resection of an advanced oropharyngeal lesion necessitating a mandibulotomy approach with mandibular preservation is best reconstructed with what type of flap?","o":["local tongue flap","pectoralis major myocutaneous flap","radial forearm free flap","fibular osteocutaneous free flap","deltopectoral flap"],"k":"C","x":"The thin, pliable nature of the radial forearm free flap makes it an ideal method of reconstruction for this type of defect. It is a reliable flap that minimizes the chance of tethering the tongue, compared with a local tongue flap. The bulky nature of the pectoralis major myocutaneous flap makes it a less suitable choice for this type of intraoral reconstruction. The fibular osteocutaneous free flap is a useful flap for reconstruction following segmental mandibulectomy. The deltopectoral flap was commonly used for head and neck reconstruction prior to the introduction of the pectoralis major myocutaneous flap and microvascular free tissue transfer."}]},{"t":"Diseases of the Salivary Glands","q":[{"n":1,"s":"The fascia covering the parotid and submandibular glands originates from which layer?","o":["the superficial cervical fascia","the visceral or middle layer of the cervical fascia","the superficial layer of the deep cervical fascia","the superficial musculoaponeurotic system","the carotid sheath"],"k":"C","x":"The fascia covering the parotid and submandibular glands arises from the superficial layer of the deep cervical fascia. A condensation of this fascia occurs between the two glands and forms the stylomandibular ligament."},{"n":2,"s":"The most consistent landmark that a surgeon can easily use in identifying the facial nerve near the skull base is","o":["the digastric muscle.","the tragal pointer cartilage.","the point halfway between the mastoid tip and the angle of the mandible.","the tympanomastoid suture.","the stylomastoid foramen."],"k":"D","x":"The most consistent landmark typically used in surgical identification of the facial nerve at the skull base is the tympanomastoid suture. The stylomastoid foramen from which the facial nerve exits the skull base is located at the deep extent of this suture line."},{"n":3,"s":"Appropriate treatment for the most common malignant neoplasm of the parotid gland is","o":["radiation alone.","radiation and chemotherapy.","surgery alone.","a possible combination of surgery and radiation depending on histologic grade and lymph node status.","targeted monoclonal antibodies."],"k":"D","x":"The most common malignant neoplasm of the parotid glands is mucoepidermoid carcinoma. Patients with low-grade mucoepidermoid carcinomas are treated with wide surgical excision alone if there is no evidence of metastasis. Patients with high-grade lesions and those exhibiting nodal metastasis may require extensive surgical resection combined with adjuvant radiation therapy."},{"n":4,"s":"With regard to the minor salivary glands, which of the following statements is false?","o":["Minor salivary glands may be located in the oral cavity and oropharynx.","Minor salivary glands typically drain into a series of collecting ducts, which eventually drain into the floor of the mouth adjacent to the lingual frenulum.","Most neoplasms arising from the minor salivary glands are malignant.","Minor salivary glands can be both mucus and serous producing.","There are hundreds of minor salivary glands in the upper aerodigestive tract."],"k":"B","x":"There are indeed hundreds of minor salivary glands located throughout the upper aerodigestive tract. Each individual gland typically drains through its own small ductule directly into the adjacent mucous membrane."},{"n":5,"s":"The virus most commonly causing mumps (epidemic parotitis) is a","o":["coxsackievirus.","poxvirus.","paramyxovirus.","herpesvirus.","papovavirus."],"k":"C","x":"Classic mumps is caused by the Rubulavirus, a paramyxovirus. The paramyxoviruses are ribonucleic acid viruses that include the measles, parainfluenza, and respiratory syncytial viruses. Although a variety of viruses may cause parotitis, the paramyxoviruses are the viruses most commonly cultured."},{"n":6,"s":"Patients with Sjögren’s syndrome have how much greater risk of developing salivary gland lymphoma than the general population?","o":["4 times","10 times","25 times","44 times","100 times"],"k":"D","x":"One of the underlying defects in Sjögren’s syndrome is B-cell hyperactivity with or without abnormalities of immunoregulation. This predisposes patients to developing lymphoproliferative disease that may progress to B-cell-type lymphoma. The risk of developing lymphoma by an individual with Sjögren’s syndrome is 44 times greater than the risk for a person without Sjögren’s syndrome."},{"n":7,"s":"What pathologic change occurs in the parotid glands that is considered almost pathognomonic of human immunodeficiency virus (HIV) infection?","o":["adenomas","lymphoepithelial proliferative disease","multiple intraparotid lymphoepithelial cysts","adenocarcinoma","mucoepidermoid carcinoma"],"k":"C","x":"Patients with HIV infection can develop multiple lymphoepithelial cysts in both parotid glands. The appearance of these cysts on computed tomographic scanning is unique and found only in patients with HIV infection."},{"n":8,"s":"The “gold standard” for treatment of advanced Wegener’s granulomatosis is glucocorticoids and","o":["trimethoprim and sulfamethoxazole.","methotrexate.","quinolone antibiotics.","cyclophosphamide.","dapsone."],"k":"D","x":"The gold standard for the treatment of Wegener’s granulomatosis is cyclophosphamide and glucocorticoids. Trimethoprim and sulfamethoxazole also have been beneficial when the upper respiratory tract has been involved. Methotrexate and corticosteroids have been used in milder forms of Wegener’s granulomatosis."},{"n":9,"s":"The most common microorganism causing acute bacterial parotitis is","o":["Streptococcus viridans.","Haemophilus influenzae.","anaerobic bacterium.","Staphylococcus aureus.","Pseudomonas aeruginosa."],"k":"D","x":"Staphlococcus aureus is the most common microorganism associated with acute bacterial sialadenitis. Streptococcus viridans is a common infectious agent in chronic and recurrent sialadenitis."},{"n":10,"s":"The most common malignant tumor of the submandibular glands","o":["tends to metastasize to lymph nodes early.","causes death in 50% of patients within 5 years.","frequently demonstrates perineural invasion.","does not cause distant metastases.","cannot be controlled with radiation therapy."],"k":"C","x":"The most common malignant tumor of the submandibular glands is the adenoid cystic carcinoma. It is the second most common of the malignant salivary gland tumors. It does not tend to metastasize to lymph nodes early but does produce distant metastases late. The 5-year survival rate is usually quite high, but the 15- and 20-year survival rates approximate 30%. Part of the difficulty in local control of adenoid cystic carcinoma is attributable to its tendency for extension over long distances through perineural invasion and propagation."}]},{"t":"Diseases of the Thyroid and Parathyroid Glands","q":[{"n":1,"s":"A patient undergoes a thyroid panel that reveals that both thyroid-stimulating hormone and free thyroxine (T4) are elevated. The best interpretation of this result is","o":["pituitary insufficiency.","primary hyperthyroidism.","Graves’ disease.","primary hypothyroidism.","inappropriate T4 ingestion."],"k":"E","x":"The only other interpretation is secondary pituitary hyperthyroidism, which is not an option in the choices for this item."},{"n":2,"s":"A 28-year-old woman has undergone total thyroidectomy and is on thyroid replacement. She indicates that she may still bear children. Of the following patient education points, which is most important for the surgeon to advise with regard to pregnancy?","o":["The fetus makes its own thyroid hormone, and maternal–fetal transfer of triiodothyronine (T3) and thyroxine (T4) is minimal.","Maternal thyrotropin-releasing hormone crosses the placenta and drives fetal thyroid function.","She must carefully monitor thyroid function to remain euthyroid for normal fetal development.","Only severe fetal and congenital hypothyroidism are associated with cretinism and hearing loss.","Maternal thyroid-stimulating hormone does not cross the placenta, so the fetus controls T4 secretion by itself."],"k":"C","x":"There is truth in each statement. The fetus initiates iodine metabolism by 10 weeks’ gestation and the fetal pituitarythyroid axis is generally independent of maternal thyroid function. However, hypothyroidism during pregnancy can apparently harm the neuropsychological development of the fetus. Mild maternal hypothyroidism alone has been associated with lower IQ scores in offspring."},{"n":3,"s":"A patient has experienced a recurrent febrile illness with edema and mild tenderness of the thyroid gland, apparently following a respiratory infection. She is presently euthyroid. Which of the following diagnoses are most likely?","o":["Hashimoto’s disease (struma lymphomatosa)","de Quervain’s granulomatous thyroiditis","bacterial thyroiditis","Riedel’s struma (invasive fibrous thyroiditis)","none of the above"],"k":"B","x":"Bacterial thyroiditis is extremely rare and would probably impair thyroid function. Riedel’s struma is also rare but is associated with irreversible, profound hypothyroidism and a stony hard, irregular, fibrous gland. Early Hashimoto’s disease is characterized by mild thyrotoxicosis owing to release of thyroid hormone from damaged follicles, with development of hypothyroidism in the late or chronic stage. The described case is typical of de Quervain’s granulomatous thyroiditis."},{"n":4,"s":"Histopathologic examination of a hemithyroidectomy specimen provides the diagnosis of medullary carcinoma. The most appropriate course of action is","o":["ablation with iodine (131I) and observation with periodic 123I scans.","total thyroidectomy.","total thyroidectomy with 131I ablation.","total thyroidectomy with ipsilateral radical neck dissection.","total thyroidectomy with ipsilateral radical and contralateral modified neck dissection."],"k":"E","x":"Medullary carcinoma does not take up radioiodide, so ablation with radioisotope is not effective. Because of the propensity for local microvascular invasion, late recurrence, and metastatic disease, aggressive surgical intervention is recommended."},{"n":5,"s":"The most effective tool for imaging parathyroid adenomas of mass exceeding 250 mg is","o":["subtraction thallium 201 scan.","ultrasonography.","technetium 99m pertechnetate scan.","technetium Tc 99m sestamibi scan.","tetrofosmin scan."],"k":"D","x":"All of these choices have been used. Ultrasonography has a sensitivity of 82.9%, subtraction thallium 201 scan has a sensitivity of 84.6%, and technetium 99m pertechnetate scan and tetrofosmin are even less sensitive. Sestamibi scan has sensitivity for solitary parathyroid adenomas of 85 to 90%, with a specificity of nearly 100%."},{"n":6,"s":"A colleague calls for your urgent assistance in the operating room, being unable to locate the recurrent laryngeal nerve. This most likely suggests the anomaly occurring in 1 of 400 cases of","o":["carotid sinus syndrome with an aberrant course of the recurrent laryngeal nerve.","coarctation of the aorta.","anomalous retroesophageal right subclavian artery.","anomalous retroesophageal left subclavian artery.","transposition of the great vessels."],"k":"C","x":"This is a classic anomaly, occurring almost always on the right, in which a right subclavian artery arises from the left descending aorta. In such cases, the inferior laryngeal nerve passes directly from the vagus to the larynx and is susceptible to injury in dissection. Carotid sinus syndrome has nothing to do with the recurrent laryngeal nerve, and coarctation of the aorta and transposition of the great vessels are unrelated congenital anomalies."},{"n":7,"s":"Following a thyroidectomy, the most critical postoperative period for monitoring serum calcium is","o":["0 to 8 hours.","0 to 24 hours.","24 to 96 hours.","24 to 48 hours.","48 to 72 hours."],"k":"C","x":"If calcium infusion is not required in the first 72 hours, it will probably be unnecessary. However, transient hypocalcemia can be severe in 8% of patients within the first 96 postoperative hours."},{"n":8,"s":"Fine-needle aspiration biopsy of a low anterior neck mass produces crystal clear fluid. This is most suggestive of","o":["a transudate.","degeneration within the lesion.","a rapidly growing tumor.","a parathyroid cyst.","a lymphatic vessel."],"k":"D","x":"Crystal clear aspirate suggests a parathyroid cyst, whereas yellow fluid usually points to a transudate. A rapidly growing tumor can produce bloody fluid, as can aspiration of a blood vessel. A chocolate, green, or turbid aspirate is suggestive of degeneration."},{"n":9,"s":"Which of the following direct tests of thyroid function would yield the most information in the evaluation of a patient with hyperthyroidism?","o":["thyroid radioactive iodine uptake (RAIU) by thyroid scintiscan with 131I","RAIU by thyroid scintiscan with 123I","thyroid suppression test","thyrotropin stimulation test","99m technetium pertechnetate scintiscan"],"k":"C","x":"The most commonly used direct test of gland function is the RAIU, using 123I as the agent of choice because of lower radiation dosage. Iodine 131 is used to overcome photon attenuation by bone if evaluating substernal thyroid or metastatic thyroid cancer. The thyrotropin stimulation test involves RAIU following administration of thyroid-stimulating hormone to differentiate between primary thyroid insufficiency and pituitary hypofunction. The technetium 99m pertechnetate scintiscan is used to assess thyroid enlargement or cold nodules if RAIU is blocked or contraindicated. Finally, the thyroid suppression test is RAIU performed after 7 days of triiodothyronine administration to evaluate thyroid hyperfunction."},{"n":10,"s":"A 44-year-old man presents with a solitary thyroid nodule, partially cystic by ultrasonography and suspicious for malignancy by fine-needle aspiration. Histopathologic examination following hemithyroidectomy reveals an encapsulated follicular carcinoma. He has no known regional or distant metastases. The recommended treatment is","o":["thyroid ablation with 131I.","completion (total) thyroidectomy.","total thyroidectomy and thyroid ablation with 131I.","total thyroidectomy, ipsilateral neck dissection, and thyroid ablation with 131I.","total thyroidectomy, bilateral neck dissection, and thyroid ablation with 131I."],"k":"B","x":"For patients under 40 years old with encapsulated follicular carcinoma, thyroid lobectomy with isthmusectomy is performed, with total thyroidectomy reserved for patients over 40 years old. For invasive carcinoma, total thyroidectomy and thyroid ablation with 131I are most commonly practiced. In the presence of palpable cervical metastases, choices D and E are appropriate."}]},{"t":"Laryngoscopy","q":[{"n":1,"s":"The supraglottis contains all of the following except the","o":["epiglottis.","aryepiglottic folds.","false vocal folds.","laryngeal ventricle.","true vocal folds."],"k":"E","x":"The true vocal folds comprise the glottis, which is immediately inferior to the supraglottis."},{"n":2,"s":"All of the following laryngeal neoplasms are benign except for","o":["rhabdomyoma.","verrucous carcinoma.","granular cell myoblastoma.","paraganglioma.","chondroma."],"k":"B","x":"Verrucous carcinoma is a highly differentiated variant of squamous cell carcinoma."},{"n":3,"s":"Which of the following laryngeal neoplasms has a female predominance?","o":["neurofibroma","granular cell tumor","hemangioma","paraganglioma","chondroma"],"k":"D","x":"Paragangliomas are the only laryngeal neoplasm with a female predominance."},{"n":4,"s":"Elevation of antineutrophil cytoplasmic antibodies is a useful laboratory test in evaluation of which disease?","o":["sarcoidosis","rhinoscleroma","Wegener’s granulomatosis","amyloidosis","rheumatoid arthritis"],"k":"C","x":"Cytoplasmic antineutrophil cytoplasmic antibodies (c-ANCAs) are the predominant ANCAs in Wegener’s granulomatosis. Elevation of the c-ANCA is highly specific for Wegener’s granulomatosis. Confirmation of the diagnosis is made by biopsy of lesions in the upper respiratory tract in which the necrotizing vasculitis can be demonstrated."},{"n":5,"s":"A patient presents with bilateral cauliflower ear deformity, saddle nose deformity, and stridor. Which of the following therapeutic agents may be useful?","o":["cidofovir","interferon","dapsone","attenuated androgens","C1-INH concentrate"],"k":"C","x":"The physical findings of multiple sites of cartilage deformity are suggestive of relapsing polychondritis, for which dapsone may be useful."},{"n":6,"s":"A 2-year-old child presents with rapid onset of a high fever, sore throat, muffled voice, and respiratory distress. She looks uncomfortable and is sitting up, leaning forward, and drooling. The most likely causative microorganism is","o":["Haemophilus influenzae.","Staphylococcus aureus.","Moraxella catarrhalis.","Streptococcus pneumoniae.","Epstein-Barr virus."],"k":"A","x":"The clinical presentation is that of acute epiglottitis. Haemophilus influenzae is the predominant causal microorganism."},{"n":7,"s":"The most sensitive study for extraesophageal reflux is","o":["a barium swallow.","esophagoscopy with biopsy.","a nuclear medicine scintiscan.","bronchoscopy with washings for fat-laden macrophages.","24-hour multichannel pH monitoring."],"k":"E","x":"Twenty-four-hour multichannel ambulatory esophageal pH monitoring is the most sensitive study for extraesophageal reflux; esophagoscopy with biopsy, barium esophagram, nuclear medicine scintiscan, and bronchoscopy with washings for fat-laden macrophages may be supportive of the likelihood of reflux."},{"n":8,"s":"The treatment of choice for verrucous carcinoma is","o":["surgical resection followed by chemotherapy.","surgical resection followed by radiation therapy.","chemotherapy followed by radiation therapy.","radiation therapy followed by chemotherapy.","surgical resection."],"k":"E","x":"Verrucous carcinoma rarely metastasizes; surgical resection is the treatment of choice."},{"n":9,"s":"A 63-year-old woman presents with acute onset of edema of the tongue. There is no history of trauma or a rash. Which class of medications is most likely to be associated with her condition?","o":["chemotherapeutic agents","angiotensin converting enzyme inhibitors","antihistamines","corticosteroids","bronchodilators"],"k":"B","x":"The lack of a rash makes an allergic cause less likely. Angiotensin converting enzyme inhibitors are the most common medications precipitating edema in acquired angioedema. The effects of kinase II, which stimulates the conversion of angiotensin I to the vasoconstrictive angiotensin II and inactivates bradykinin, a potent vasodepressor, are blocked by angiotensin converting enzyme inhibitors."},{"n":10,"s":"Which of the following therapeutic agents can be most successfully used in the acute management of hereditary angioedema?","o":["epinephrine","corticosteroid","antihistamine","C1-INH concentrate","attenuated androgen"],"k":"D","x":"C1-INH concentrate is the most reliable in the acute management of airway obstruction owing to hereditary angioedema. Nevertheless, mechanical relief of airway obstruction may be required in the acute situation. Epinephrine, corticosteroids, and antihistamines are less reliable in this problem.Attenuated androgens such as danazol and stanozolol are useful in the long-term management of hereditary angioedema, as are antifibrinolytic medications, such as ε-aminocaproic acid and tranexamic acid, and C1-INH concentrate."}]},{"t":"Bronchoesophagology","q":[{"n":1,"s":"Most tracheal injuries from extrinsic chest trauma are","o":["just below the cricoid cartilage.","at the level of the fourth tracheal ring.","5.0 cm above the carina.","2.5 cm above the carina.","at the carina."],"k":"D","x":"Tracheobronchial trauma can occur at every level of the trachea and almost all of the major bronchi, but more than 80% of the injuries are within 2.5 cm of the carina. The cervical trachea is protected by the mandible and sternum anteriorly and by the vertebrae posteriorly. Tracheobronchial disruption has an estimated overall mortality of 30%; 15% of patients sustaining cervical tracheal disruption die from hypoxia within 1 hour of injury."},{"n":2,"s":"An African American woman presents with a history of cervical adenopthy, uveitis, parotid swelling, and nasal obstruction. A chest radiograph reveals hilar adenopathy. Which of the following tests may correlate with disease activity?","o":["24-hour, multichannel pH probe","cytoplasmic antineutrophil cytoplasmic antibody (c-ANCA)","C1 esterase","angiotensin converting enzyme level","sweat chloride"],"k":"D","x":"The clinical presentation is suggestive of sarcoidosis. The angiotensin converting enzyme level appears to correlate with disease activity but should not be used in isolation. Biopsy is needed to confirm the diagnosis."},{"n":3,"s":"A white boy presents with a history of chronic sinusitis, pulmonary infection, and malabsorption. Which of the following tests is the most specific for his disease?","o":["sweat chloride","c-ANCA","erythrocyte sedimentation rate","angiotensin converting enzyme level","rheumatoid factor"],"k":"A","x":"An elevated level of chloride in sweat confirms a diagnosis of cystic fibrosis."},{"n":4,"s":"On a radiographic study using barium contrast in a child with stridor, a large posterior esophageal indentation adjacent to an anterior tracheal compression suggests","o":["an aberrant right subclavian artery with a left aortic arch.","an aberrant left subclavian artery with a right aortic arch.","a “pulmonary sling,” comprising an anomalous left pulmonary artery arising from the right pulmonary artery.","a right hyparterial bronchus.","a vascular ring, such as a double aortic arch."],"k":"E","x":"A vascular ring will encircle the trachea and esophagus, causing the indentations described in this radiographic study. Both an aberrant right subclavian artery with a left aortic arch and an aberrant left subclavian artery with a right aortic arch will be evident as a small retroesophageal indentation with a normal trachea. A “pulmonary sling” is the only vascular anomaly that passes between the trachea and esophagus, causing an anterior esophageal indentation with a posterior tracheal indentation.An anomalous innomate artery will cause anterior tracheal compression."},{"n":5,"s":"Conditions that may cause esophageal strictures include all of the following except","o":["Behçet’s syndrome.","gastroesophageal reflux.","caustic ingestion.","polymyositis.","Crohn’s disease."],"k":"D","x":"Polymyositis causes proximal esophageal dysmotility owing to inflammatory and degenerative changes to the striated muscles of the esophagus but does not cause strictures."},{"n":6,"s":"A child presents with acute onset of a brassy cough, high fever, “toxicity,” and gradually worsening inspiratory stridor. Corticosteroids and racemic epinephrine are not very helpful. What is the most likely causal microorganism?","o":["respiratory syncytial virus","Moraxella catarrhalis","Haemophilus influenzae","Epstein-Barr virus","Staphylococcus aureus"],"k":"E","x":"Bacterial tracheitis is an acute, life-threatening disease in children and is most commonly caused by Staphylococcus aureus."},{"n":7,"s":"A patient’s chest radiograph demonstrates a solid, round mass within a spherical cavity. To which serum precipitin is the microorganism likely to be positive?","o":["Mycobacterium tuberculosis","Staphylococcus aureus","Aspergillus species","Mycobacterium avium-intracellulare","Moraxella catarrhalis"],"k":"C","x":"Mycetomas are most commonly caused by Aspergillus species."},{"n":8,"s":"During a carbon dioxide laser excision of recurrent respiratory papillomata, an airway fire occurs. The first step in management is to","o":["remove the endotracheal tube.","irrigate with saline.","stop the oxygen.","provide 100% oxygen.","give dexamethasone."],"k":"A","x":"The first step in management of an airway fire in laser surgery is to remove the existing tube and replace it with a smallerdiameter tube. This step should be followed by laryngoscopy and bronchoscopy to evaluate the extent of damage and to remove charred debris and foreign material. Saline lavage, systemic corticosteroids and antibiotics, and careful monitoring of pulmonary function are indicated."},{"n":9,"s":"Endoscopy for possible foreign-body aspiration is indicated in a child with","o":["a chest radiograph with persistent atelectasis unresponsive to medical treatment.","a chest radiograph with obstructive emphysema (hyperinflation) of one lung.","a history of acute onset of coughing, choking, and gagging but no current symptoms.","a new onset of unilateral wheezing but no witnessed events suggestive of aspiration.","all of the above."],"k":"E","x":"Children who have aspirated foreign bodies may present with any of the above combinations of findings on history, physical examination, or radiographs."},{"n":10,"s":"What is the most commonly encountered benign nonepithelial tumor of the esophagus?","o":["fibroma","lipoma","leiomyoma","neurofibroma","hemangioma"],"k":"C","x":"Leiomyomas account for more than half of all benign nonepithelial tumors of the esophagus. They are intramural encapsulated tumors more often found in the middle or lower esophagus. Leiomyomas often produce widening of the lower part of the mediastinum and appear as a mass in the posterior part of the mediastinum in chest radiographs."}]}];
const L='ABCDE';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{},multiPick:{}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
function home(){
  document.body.querySelector('.nav')?.remove();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0);
  $('#app').innerHTML=`<h1>Ballenger examination items</h1><p class="sub">${DATA.reduce((a,c)=>a+c.q.length,0)} questions across ${DATA.length} sections, in book wording with the book's best response and teaching commentary. Pick sections, then start.</p>
  ${DATA.map((c,i)=>{const done=c.q.filter(q=>S.ans[id(i,q.n)]).length;return `<button class="chap ${S.sel.has(i)?'on':''}" onclick="tog(${i})" aria-pressed="${S.sel.has(i)}"><b>${c.t}</b>${done?`<span class="done">${done} done</span>`:''}<span>${c.q.length}</span></button>`}).join('')}
  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to sections">Sections</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; Book Q${n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — best response ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to sections</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcde'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
