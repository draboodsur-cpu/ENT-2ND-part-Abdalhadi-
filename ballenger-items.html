by leisure activities involving noise exposure such as small arms fire."},{"n":8,"s":"Hearing conservation programs must include","o":["sound field measurement.","labeling of hazardous areas.","regular monitoring of the workers’ hearing.","use of personal hearing protection.","all of the above."],"k":"E","x":"Hearing conservation programs include all of the items in the list. It must be emphasized that hearing conservation is a system of health care, not just the provision of hearing protectors. It is necessary to identify whether workers are at risk, to label the area as hazardous, and to involve the workers in protecting themselves from sound. Every measure must be taken to isolate them from excessive sound, either by silencing machinery or insulating the workplace. Hearing protectors should be provided if sound elimination is not possible. Appropriate instruction in their use and monitoring that they are worn regularly are necessary. The system should be monitored by regular hearing testing, which identifies individual workers at risk and groups of workers for whom the hearing conservation program is ineffective. It should be emphasized that the workers’ agreement to such a program is essential if it is to be effective. Management participation is mandatory."},{"n":9,"s":"Susceptibility to noise-induced hearing loss may be potentiated by","o":["genetic predisposition.","smoking.","the gender of the subject.","excessive alcohol intake.","heart disease."],"k":"A","x":"Whether there is a genetic susceptibility to the harmful effect of noise in humans is not clear, although it has certainly been identified in mice, some strains of which develop hearing loss from noise exposure much more than other strains. Mice that have early age-related hearing losses are also more susceptible to noise-induced hearing loss. By implication, the same is suggested for humans. There is no evidence that smoking predisposes to noise-induced hearing loss. Although it has been suggested that blue-eyed people are more at risk, this has not withstood critical evaluation. Men develop worse hearing loss than women, but this is usually attributed to men having more noise exposure, particularly leisure or military noise exposure. It is also suggested that happy sounds produce less hearing loss than equivalent obnoxious sounds. The mechanism of this central feedback is unclear."},{"n":10,"s":"Which of the following substances is not synergistic with sound in the production of noise-induced hearing loss?","o":["environmental toluene","petroleum products","aspirin ingestion","carbon disulfide","heavy metal exposure"],"k":"C","x":"There is now considerable literature about the interaction between various chemicals and noise exposure in the cochlea. These include aminoglycoside antibiotics and certain organic solvents. Toluene, widely used in the printing industry, is particularly well studied. It is synergistic with noise. Thus, lower safe levels of noise are required in an atmosphere that contains otherwise safe levels of toluene. Similarly, unexpectedly severe hearing losses have been found in refinery operators, although most workers are isolated from the noise. Lead exposure and certain other heavy metals such as mercury produce hearing loss and interact with noise, as does carbon disulfide, which is used in certain chemical processes. Fortunately, although aspirin in high doses is ototoxic, there is no evidence that it is synergistic with noise exposure."}]},{"t":"Ototoxicity","q":[{"n":1,"s":"Aminoglycoside ototoxicity can be prevented in experimental animals by pretreatment with salicylates. The reason for the efficacy of salicylates against aminoglycoside ototoxicity is that salicylates","o":["increase the excretion of aminoglycoside antibiotics in the urine.","block the access of aminoglycoside antibiotics to the inner ear tissues.","chelate iron and prevent it from reacting with the aminoglycoside antibiotics.","accelerate the metabolism of aminoglycoside antibiotics and render them nontoxic to the inner ear.","accelerate the elimination of aminoglycoside antibiotics from the cochlea."],"k":"C","x":"Salicylates do not appear to affect the metabolism or excretion of aminoglycoside antibiotics, nor do they appear to alter the distribution of aminoglycosides to the cochlear tissues. They appear to act by chelating iron, making it less available for combining with aminoglycosides to form free radicals, which can damage both the cochlea and kidney."},{"n":2,"s":"The principal target cell that is preferentially damaged by aminoglycoside antibiotics in causing hearing loss is the","o":["inner hair cell of the base of the cochlea.","outer hair cell of the apex of the cochlea.","inner hair cell of the apex of the cochlea.","outer hair cell of the base of the cochlea.","Hensen cell of the cochlea."],"k":"D","x":"The outer hair cells of the basal turn of the cochlea are damaged first following exposure to ototoxic doses of aminoglycoside antibiotics. The other cells listed are less frequently damaged. The damage generally proceeds from base to apex in the outer hair cells and then from apex to base in the inner hair cells. The latter seems to occur only after most of the outer cells of the entire cochlea have been destroyed. The basal turn outer hair cells seem to be most vulnerable because they have the lowest concentration of glutathione, a powerful protective antioxidant. This property would make them more vulnerable to free radical damage."},{"n":3,"s":"Which of the following statements is true?","o":["In experimental animals, carboplatin and cisplatin both preferentially damage the outer hair cells of the cochlea.","Both cisplatin and carboplatin cause a high incidence of severe kidney damage.","Hearing loss associated with carboplatin treatment of brain tumors can be prevented by administration of sodium thiosulfate.","Neither cisplatin nor carboplatin causes bone marrow suppression.","Vestibular symptoms occur in a high percentage of patients treated with either cisplatin or carboplatin."],"k":"C","x":"Cisplatin damages the outer hair cells most frequently, whereas carboplatin damages the inner hair cells in animal experiments. Cisplatin is extremely nephrotoxic, but carboplatin has much less nephrotoxicity. Both drugs suppress the bone marrow. Vestibular symptoms occur infrequently after administration of either drug."},{"n":4,"s":"Which of the following statements is false?","o":["Aminoglycoside antibiotics are extensively absorbed from the gastrointestinal tract.","Aminoglycoside ototoxicity may be hereditary in some cases.","Aminoglycoside antibiotics are poorly absorbed from the intact skin.","The amount of aminoglycoside antibiotic in the body at any given time after drug administration is greater in the presence of renal failure.","Aminoglycoside antibiotics are generally administered by injection."],"k":"A","x":"Recent studies have shown that hypersensitivity to aminoglycoside-induced hearing loss can be transmitted by mothers to their offspring by a mutation of the DNA in their mitochondria.Aminoglycoside antibiotics are poorly absorbed through the gastrointestinal tract or through intact skin. Because of the former, they are generally administered by injection. Aminoglycosides are excreted by glomerular filtration through the kidneys; therefore, in the presence of renal failure, the amount of drug in the body remains longer than in patients with normal renal function."},{"n":5,"s":"Which of the following statements about loop diuretics is false?","o":["They are likely to interfere with ion transport in the inner ear.","They are more likely to cause severe hearing loss in adults than cisplatin.","They can be given orally or intravenously to produce diuresis.","They can cause morphologic changes in the stria vascularis.","They may be associated with permanent hearing loss in the neonate."],"k":"B","x":"Cisplatin is much more likely to cause hearing loss in the adult, and the hearing loss is more likely to be severe and permanent than that caused by loop diuretics. The other choices are all true. Loop diuretics are likely to interfere with ion transport mechanisms in the inner ear, specifically in the stria vascularis, which may produce transient edema in this tissue. The loop diuretics are effective either by the oral or intravenous route of administration. They have been reported to be associated with permanent hearing loss in neonates."},{"n":6,"s":"Which of the following statements is true?","o":["Hearing loss from ototoxic drugs is frequently reversible because the regeneration of cochlear hair cells has been demonstrated in humans.","Renal failure is a risk factor that may increase the probability of hearing loss in patients receiving aminoglycoside antibiotics but not furosemide.","There is no relationship between the blood level of salicylates and the severity of tinnitus experienced by patients.","Brain irradiation does not alter the severity of cisplatininduced hearing loss.","Although carboplatin is less nephrotoxic than cisplatin, it can cause hearing loss."],"k":"E","x":"No studies have shown that regeneration of cochlear cells occurs in humans. This has been shown to occur in birds. Renal failure is a risk factor for hearing loss caused either by aminoglycosides or furosemide. The higher the blood level of salicylates is, the more severe the tinnitus will be. Brain irradiation is associated with a greater probability and increased severity of hearing loss following cisplatin chemotherapy."},{"n":7,"s":"A 50-year-old white woman has been prescribed a high-dose aspirin regimen to control her rheumatoid arthritis stiffness and pain. She comes to your office complaining of tinnitus and stomach upset. If you advise the patient to take the same dose of aspirin with meals, what effect will this have?","o":["It will decrease the rate of absorption of aspirin from the stomach and may reduce the tinnitus severity.","It will increase the rate of absorption of aspirin from the stomach and may increase the risk of hearing loss.","It will accelerate the rate of elimination of aspirin from the gastrointestinal tract and may reduce the tinnitus severity.","It will enhance the rate of elimination of aspirin by the kidneys and thereby reduce the tinnitus severity.","It will accelerate the rate of metabolism of aspirin by the liver and thereby reduce the severity of tinnitus."],"k":"A","x":"Food reduces the rate of absorption of aspirin from the stomach, and this may result in a lower, more sustained blood level, which may be associated with a reduction of tinnitus severity. The presence of food in the stomach does not increase the rate of absorption of aspirin from the stomach, nor does it accelerate the rate of elimination by the gastrointestinal tract or kidneys, nor does it alter the rate of metabolism by the liver."},{"n":8,"s":"In which pair are both antineoplastic agents ototoxic?","o":["kanamycin and cisplatin","cyclophosphamide and methotrexate","5-fluorouracil and cisplatin","doxorubicin and vincristine","cisplatin and carboplatin"],"k":"E","x":"Choice A has two ototoxic agents, but kanamycin is not an antineoplastic agent. The other pairs of drugs contain at least one agent that is not considered to be ototoxic."},{"n":9,"s":"A 68-year-old African American woman presents to you with a painful, solitary 8 cm neck mass after having had a composite resection followed by radiation therapy. You discuss the possibility of treatment for the neck mass with cisplatin-epinephrine gel injection into the tumor. The advantages of this mode of treatment over systemic cisplatin chemotherapy include all of the following except","o":["other options for treatment remain possible.","reduced risk of ototoxicity.","less invasive treatment.","higher probability of complete remission.","decreased risk of nephrotoxicity."],"k":"D","x":"Although intratumor injection with cisplatin-epinephrine gel keeps other options open, reduces the risks of ototoxicity and nephrotoxicity, and is potentially a less invasive treatment, the probability of complete remission is not higher than with systemic cisplatin treatment."},{"n":10,"s":"A 55-year-old Native American veteran with a stage IV squamous cell carcinoma of the hypopharynx is receiving multiple courses of chemotherapy with cisplatin. During the course of treatment, he presents with a gram-negative kidney infection, and his serum creatinine level is 4.0.You consider gentamicin therapy but are concerned about possible drug interactions between gentamicin and cisplatin. Which of the following statements is not correct?","o":["Gentamicin may increase the risk of ototoxicity when given in combination with cisplatin.","The kidney infection may reduce the rate of elimination of gentamicin, increasing the risk of ototoxicity.","Gentamicin may reduce the antitumor efficacy of cisplatin.","Cisplatin will probably not reduce the antibacterial effect of gentamicin.","The antitumor effect of cisplatin is not likely to be altered by gentamicin."],"k":"C","x":"Gentamicin will not be expected to reduce the antitumor efficacy of cisplatin. The other responses are all true. The interaction between gentamicin and cisplatin is likely to increase the risk of ototoxicity. The rate of renal elimination of gentamicin is reduced when renal function is impaired. Cisplatin is not known to reduce the antibacterial efficacy of gentamicin."}]},{"t":"Idiopathic Sudden Sensorineural Hearing Loss","q":[{"n":1,"s":"Without treatment, the likelihood of recovery in patients with idiopathic sudden sensorineural hearing loss is about","o":["5%.","15%.","40%.","65%.","95%."],"k":"D","x":"See the classic study: Mattox DE, Simmons FB. Natural history of sudden sensorineural hearing loss. Ann Otol Rhinol Laryngol 1977;86:463–80."},{"n":2,"s":"Congenital deafness caused by viral infection in the United States is most often associated with","o":["cytomegalovirus.","herpes virus.","rubella.","rubeola.","mumps."],"k":"A","x":"Rubella was an important cause prior to widespread use of the mumps-measles-rubella vaccine. Rubeola and mumps can cause deafness acquired in childhood but not congenital infection transmitted in utero. Congenital herpes infection is less common than cytomegalovirus infection (about 1% of neonates)."},{"n":3,"s":"The evidence that viruses are implicated in idiopathic sudden sensorineural hearing loss does not include","o":["cochlear pathology similar to that seen after viral infection.","rising titers of antiviral antibodies after sudden sensorineural hearing loss.","an animal model for herpes virus neurolabyrinthitis.","the finding of viral DNA in human spiral ganglion.","culture of herpes virus from cochlear fluids."],"k":"E","x":"A, B, C, and D all add to the essentially circumstantial case for viruses, especially herpes simplex, in idiopathic sudden sensorineural hearing loss. E (if it were true) would prove the hypothesis."},{"n":4,"s":"Hemorrhage into the cochlea with resulting sudden sensorineural hearing loss has been shown to occur in","o":["hypertension.","leukemia.","diabetes.","iron deficiency anemia.","polycythemia vera."],"k":"B","x":"Common vascular disease risk factors such as hypertension and diabetes have not been shown to be associated with increased risk for sudden sensorineural hearing loss, nor have anemia or polycythemia. Inner ear hemorrhage does occur spontaneously and has been associated with leukemia, sickle cell disease, and thalassemia."},{"n":5,"s":"A patient with sudden sensorineural hearing loss reports that she had skin rash and joint pain about a month ago. Your workup should include","o":["computed tomography.","otoacoustic emissions.","serologic tests.","complete blood count.","electronystagmography."],"k":"C","x":"This history suggests the possibility of Lyme disease, and confirmatory serologic tests are indicated. Otoacoustic emissions, electronystagmography, or complete blood count is unlikely to contribute to management. Acoustic tumor is always a possibility with sudden sensorineural hearing loss, but computed tomography is rarely the right choice for imaging these tumors."},{"n":6,"s":"The audiometric profile in sudden sensorineural hearing loss most predictive of benefit from corticosteroids is","o":["mild, “U”-shaped, and unilateral.","within normal limits bilaterally.","moderate and unilateral.","profound and unilateral.","profound and bilateral."],"k":"C","x":"Wilson and colleagues’(1980) study showed that “U-shaped” losses always improved spontaneously, profound losses were not helped by corticosteroids, and moderate losses doubled their recovery rate with corticosteroids."},{"n":7,"s":"The congenital cytomegalovirus syndrome does not include lesions of the","o":["cochlea.","eye.","brain.","heart.","liver."],"k":"D","x":"Rubella syndrome includes heart lesions; cytomegalovirus syndrome does not."},{"n":8,"s":"Which virus is especially associated with unilateral sensorineural hearing loss?","o":["cytomegalovirus","rubella","rubeola","adenovirus","mumps"],"k":"E","x":"Mumps deafness is usually unilateral, in contrast to cytomegalovirus infection, rubella, and rubeola. Adenoviruses have not been proven to cause sensorineural hearing loss."},{"n":9,"s":"Diffuse gadolinium enhancement of the cochlea on magnetic resonance imaging in a patient with sudden sensorineural hearing loss indicates","o":["inner ear hemorrhage.","a leaky blood-brain barrier.","intracochlear schwannoma.","cerebrospinal fluid leak.","cholesteatoma."],"k":"B","x":"Hemorrhage can be documented only by viewing precontrast images; cochlear tumors are rare and would enhance focally. Cerebrospinal fluid leaks and cholesteatoma are nonenhancing lesions. Transient enhancement in sudden sensorineural hearing loss is believed to reflect failure of the blood-brain barrier secondary to inflammation."},{"n":10,"s":"Most children with sensorineural hearing loss caused by cytomegalovirus","o":["do not have other organs affected.","have brain lesions.","have liver/spleen lesions.","have eye lesions.","have full-blown cytomegalovirus syndrome."],"k":"A","x":"Only cytomegalovirus screening and follow-up for progressive postnatal sensorineural hearing loss can detect cases of sensorineural hearing loss caused by cytomegalovirus."}]},{"t":"Perilymphatic Fistulae","q":[{"n":1,"s":"The elusiveness of perilymphatic fistulae prior to the 1960s was related to","o":["the lack of an operating microscope.","the lack of a perilymph indicator.","the minute quantities of perilymph.","masking of the presence of perilymph with irrigation of the surgical field.","the focus on more gross changes."],"k":"A","x":"Early observers thought that a positive response to a fistula test indicated an opening between the middle ear and the inner ear even in the absence of inflammatory changes. It appears that they were correct but did not have the ability to observe small amounts of fluid owing to the lack of the operative microscope."},{"n":2,"s":"The clinical diagnostic criteria for perilymphatic fistula include","o":["onset of symptoms related to trauma with vestibular signs.","constant dysequilibrium, however mild; postural nystagmus and/or vertigo; and a positive Hennebert’s symptom or sign.","a positive fistula test.","dysequilibrium and postural vertigo.","the history of trauma with no other diagnostic indicators."],"k":"B","x":"The triad (1) positive fistula test (Hennebert’s sign/symptom); (2) constant dysequilibrium, however mild (eg, eyes closed walking); and (3) postural nystagmus and/or vertigo has been tested for diagnostic accuracy for perilymphatic fistulae (p < .001). The sensitivity of 59% suggests underdiagnosis, but the “gold histologic standard” was patency of the expected sites (eg, fissula ante fenestram). There is the possibility of patency without permeability, as suggested by early studies concerning proteoglycans. This would affect the sensitivity value. Repeat histologic evaluation using appropriate proteoglycan antigens would be useful."},{"n":3,"s":"The nystagmic eye movements of Hennebert’s sign sometimes require","o":["close naked eye observation.","the use of Fresnel lenses.","the use of electrically recorded eye movements.","the use of infrared nystagmography.","microscopic observation."],"k":"D","x":"Observations with the patient wearing Fresnel lenses to eliminate visual fixation can miss the fine nystagmic movements related to perilymphatic fistula. Extremely close observation with the naked eye can be inadequate, and microscopic observation would be quite cumbersome. Electrode recordings of the corneal-retinal potential changes yield false-positive results. It appears that infrared nystagmography in darkness is most adequate for this purpose. It completely eliminates visual fixation and has an added value in that the video recording of the eyes allows repeat observation of the test."},{"n":4,"s":"In the diagnosis of perilymphatic fistulae, the vestibulospinal response to fistula testing","o":["is as sensitive as the vestibulo-ocular response.","is insensitive.","is more sensitive than the vestibulo-ocular response.","may be attributable to malingering.","is irrelevant."],"k":"C","x":"The vestibulospinal response to fistula testing appears to be more sensitive than the vestibulo-ocular response in that some patients with a positive vestibulospinal response have been found to have a negative vestibulo-ocular response. The possibility of a false-positive response owing to malingering is avoided by using platform testing of the alleged dysequilibrium, which would indicate either an ill-timed response or impossible combinations of platform-fixed versus swayoriented platform motion. Also, multiple repeat testing at a single session should result in a response decline; however, this is not absolutely reliable. The fistula test for the vestibulospinal response is essential in an evaluation for a perilymphatic fistula."},{"n":5,"s":"In the care of patients with perilymphatic fistulae, one should","o":["perform surgery after 5 days of bed rest.","have a period of 6 weeks of medical management.","allow normal activity a few days postoperatively.","maintain restrictions concerning posture and physical effort postoperatively.","use diuretics."],"k":"D","x":"Performing surgery after 5 days of bed rest pertains only to sudden sensory hearing loss of perilymphatic fistula origin. Medical management for 6 weeks pertains to all perilymphatic fistulae except those causing sudden sensory hearing loss. Activity a few days postoperatively has caused recurrent perilymphatic fistulae in documented reoperated patients. Some, however, may tolerate only a brief postoperative course of rest. The risk–benefit relationships should be considered. Maintaining physical restrictions postoperatively appears to be the surest way to avoid recurrence of the perilymphatic fistula. Diuretics have not been shown to be useful, although endolymphatic hydrops may be present in some patients with perilymphatic fistulae."},{"n":6,"s":"In the surgical repair of perilymphatic fistula, one should","o":["depend on perilymph indicators.","use a large piece of graft to form a secure “blanket” seal.","use a single, small piece of graft material.","buttress the initial small graft material with the same graft material.","do a concomitant endolymphatic shunt."],"k":"D","x":"Perilymph indicators thus far appear unreliable, giving falsenegative results. Large blanket seals ignore the small < 50 µm size of the fistula. A single small piece of graft without the support of other graft pieces invites graft displacement, although the accurate placement of the first small piece appears important."},{"n":7,"s":"The use of blood, injected through the tympanic membrane into the middle ear, appears to provide a seal of the fistula causing the perilymphatic leak in some cases because","o":["it provides a noninfectious inflammatory response, causing a fibrous tissue seal of the fistula.","the blood clot itself adheres to the fistula, allowing for self-generated seals, as in successful medical management.","the blood incites a change in the proteoglycan composition of the fistula core, altering hydrophilic properties.","the blood clot changes the hydrodynamic differences between the middle ear and inner ear, forcing perilymph into the inner ear rather than allowing it to escape to the middle ear.","there is an indirect effect on the proteoglycans."],"k":"A","x":"All evidence thus far indicates that an initial serum seal (clot) followed by a fibrous tissue ingrowth is the mechanism in the sealing of the fistulous opening. The clot in itself would not be long lasting enough without an inflammatory reaction to allow for the development of a fibrous tissue seal. There is only evidence (histologic) of a seal being provided by new fibrous tissue. However, the possibility of a proteoglycan composition change has not been investigated as a concomitant phenomenon. The hydrodynamics would be in the opposite direction owing to the osmolality of the clot (from inner ear to middle ear)."},{"n":8,"s":"It would seem logical that a lack of continued modified physical activity would enhance the recurrence of a perilymphatic fistula with straining because","o":["there is an increase of venous pressure transmitted to the vessels of the middle ear mucosa, enhancing permeability.","there is an increase of cerebrospinal fluid pressure, which increases perilymphatic pressure.","there is a greater chance of traumatic displacement of the autoseal or graft material.","new fistulous openings occur unrelated to the original perilymphatic fistula site.","increased middle ear air pressure can occur."],"k":"B","x":"There is no direct connection of the overlying mucosal blanket with the core of the fibrous tissue seal of the fistula. Although trauma can early on displace surgically positioned grafts, later displacement is unlikely owing to interlacing of the fibrous elements. Although there can be new fistulous openings because of the presence of previously nonleaking fistulae, recurrences are most often related to the previously identified perilymphatic fistula site. Correctly, it appears that straining causes a great enough increase in perilymphatic pressure via increased cerebrospinal fluid to cause rupture of a previous seal of perilymphatic fistula. Animal experiments have indicated this relationship, and even in some, with extreme elevations in cerebrospinal fluid pressure, there has been round window membrane rupture."},{"n":9,"s":"Rupture of the round window membrane has been indicated by some as a cause of perilymphatic fistulae. This may be related to","o":["irregular mucosal folds about the round window niche mistaken for a ruptured round window membrane.","fluid seen escaping from the round window fissure.","animal experiments of perilymphatic fistulae related to attempted fistulization of the round window membrane.","the round window membrane appearing to be the weakest point of the labyrinthine capsule complex.","increased cerebrospinal fluid pressure in animals being transmitted to the round window membrane."],"k":"A","x":"Without careful evaluation, the mucosal folds about the round window niche can be mistaken for a ruptured round window membrane; however, mucosa lacks the dense fibrous character of the periphery of the round window membrane, and the membrane is medial, not lateral, to the round window fissure. Fluid escaping from the round window fissure would be seen to reaccumulate on repeated aspiration from the fissure area in the presence of an intact round window membrane. No animal experiments have resulted in chronic fistulization of the round window membrane. Although the round window membrane appears to be the weakest portal, experiments indicate that an extreme pressure differential is required to cause its rupture."},{"n":10,"s":"The apparent undersensitivity (59%) of the clinical diagnostic criteria appears to be related to","o":["the lack of more refined diagnostic criteria.","permeable versus nonpermeable patencies related to proteoglycan composition.","the lack of refinement of proteoglycan histologic identification.","the erroneousness of the histologic diagnostic criteria.","an error in calculation."],"k":"B","x":"The lack of more refined diagnostic criteria relates to probable permeable and nonpermeable patencies of the labyrinthine capsule, which, in turn, are probably related to proteoglycan composition. Proteoglycan histologic identification appears adequate in related preliminary studies of perilymphatic fistulae. The histologic diagnostic criteria have been tested in masked studies and appear not to be erroneous but need further study to include proteoglycan histologic analysis. Calculations in this regard are simple and have been doubly checked by statisticians."}]},{"t":"Autoimmune Inner Ear Disease","q":[{"n":1,"s":"Each of the following conditions has been associated with corticosteroid-sensitive hearing loss except","o":["systemic lupus erythematosus.","ulcerative colitis.","diabetes mellitus.","relapsing polychondritis.","polyarteritis nodosa."],"k":"C","x":"It is important to recognize that a wide variety of autoimmune conditions may be benefited by the use of immunosuppressive drugs. Rapidly progressive sensorineural hearing loss can be associated with all of the above except diabetes, which, in fact, would have a contraindication for the use of corticosteroids owing to the instability of blood sugar."},{"n":2,"s":"Animal models have been used to study the pathophysiologic mechanisms of hearing loss in autoimmune inner ear disease, and the most promising theory behind this damage is","o":["alteration of the Na/K pumps in the stria vascularis.","inner hair cell and/or spiral ganglion neuron dysfunction rather than outer hair cell dysfunction.","endolymphatic sac fibrosis.","spiral ligament atrophy.","calcium channel malfunction with endocochlear potentials unable to be maintained."],"k":"B","x":"Although several of these choices may play a role in the actual final cause of the hearing loss, the precise pathophysiology is not known, but the inner hair cells and/or spiral ganglion cells are thought to be most affected by autoimmune inner ear disease in these animal models."},{"n":3,"s":"Evidence has accumulated that the antigen target in autoimmune inner ear disease is a","o":["68 kD inner ear protein.","200 kD glycoprotein.","55 kD neuropeptide.","24 kD actin molecule.","75 kD renal cell protein."],"k":"A","x":"The antigen target of the autoimmune inner ear disease response in humans appears to be a 68 kD inner ear protein that has been detected in several studies in a statistically significant proportion of patients with autoimmune inner ear disease compared with controls."},{"n":4,"s":"Diagnostic testing for autoimmune inner ear disease includes all of the following except","o":["otoblot to measure anti–68 kD inner ear antibodies.","serum protein electrophoresis.","antinuclear antibodies.","lymphocyte transformation.","temporal bone immunohistochemistry employing patient serum."],"k":"B","x":"Serum protein electrophoresis is not considered useful in this disease. Each of the other choices represents a potentially useful diagnostic test for determining an autoimmune cause for deafness."},{"n":5,"s":"In a controlled prospective study, the presence of a positive anti–68 kD antibody assay (otoblot) was associated with what rate of hearing improvement with corticosteroids?","o":["55%","89%","75%","95%","35%"],"k":"C","x":"A 75% rate of hearing improvement was seen with corticosteroids in patients with a positive Western blot for a 68 kD antigen compared with 18% of patients who were Western blot negative, as reported in a study by Moscicki and colleagues."},{"n":6,"s":"Meniere’s disease is an illness in which the etiology is thought to include autoimmunity based on all of the following except","o":["it is often bilateral.","it may coexist with other autoimmune disorders such as rheumatoid arthritis.","the endolymphatic sac is the immune organ of the inner ear.","the presence of a positive otoblot in 32 to 58% of patients with this illness.","animal models of Meniere’s disease have been created through autoimmune mechanisms."],"k":"E","x":"Each of the above choices has merit; however, E is not accurate. There have been no animal models created through autoimmune mechanisms that accurately mimic Meniere’s disease seen in humans with recurring attacks of vertigo and fluctuating hearing loss."},{"n":7,"s":"In the classification of autoimmune inner ear disease proposed by Harris, all of the following are correct except","o":["otoblot for a 68 kD (HSP 70) antigen is usually found to be positive and a predictor of an autoimmune basis in each classification.","rapidly progressive bilateral sensorineural hearing loss can be seen in a setting of other inflammatory illnesses such as Lyme disease.","Cogan’s syndrome has a unique antigen target (55 kD).","the inner ear may be the only target of an autoimmune condition.","some patients with delayed contralateral endolymphatic hydrops have an autoimmune basis."],"k":"A","x":"Otoblot for a 68 kD antigen is not uniformly helpful in all autoimmune conditions that affect the inner ear; for example, in Cogan’s syndrome, for which the target antigen is found to be a 55 kD antigen, or in type 4, for which there is an associated inflammatory condition, they have been found to be otoblot negative."},{"n":8,"s":"Accepted therapy for confirmed autoimmune inner ear disease involves","o":["high-dose prednisone (60 mg) for at least several weeks.","transtympanic cyclophosphamide 1 mg/mL daily for 2 weeks.","endolymphatic sac shunt surgery.","perilymph perfusion with dexamethasone.","oral famciclovir since herpes viruses have been shown to be the basis of autoimmune inner ear disease."],"k":"A","x":"High-dose corticosteroids are the treatment of choice for autoimmune inner ear disease. Short-term therapy most often fails to improve or maintain hearing in these patients; therefore, a trial for several weeks is recommended in confirmed cases."},{"n":9,"s":"The inherent risks of treatment with high-dose corticosteroids require all of the following except","o":["a discussion, documented in the chart, with the patient of the risk of cataracts, hip fractures, elevated blood sugars, and personality or mood changes.","periodic urinalyses to look for glucosuria.","avoidance in patients with a history of tuberculosis.","the use of agents to protect the stomach, especially in patients with a history of peptic ulcers.","gradual tapering dose owing to adrenal gland suppression with high-dose prolonged corticosteroid administration."],"k":"B","x":"All except B are appropriate. Although elevated blood sugars are seen, urinalysis is not a standard means of determining this side effect."},{"n":10,"s":"In patients with autoimmune inner ear disease, when high-dose corticosteroids improve hearing and then become less effective, the following statements about adjuvant treatments are true except","o":["methotrexate, 20 mg per day, can be added to maintain hearing improvement.","cyclophosphamide can be administered on a daily oral basis or intravenously once a month.","plasmapheresis can be a useful adjuvant in helping to stabilize patients with autoimmune inner ear disease.","cyclophosphamide has long-term risks of sterility and malignancies in treated patients.","transtympanic corticosteroids may be helpful to obtain higher local doses to the inner ear and avoid systemic side effects."],"k":"A","x":"All of the statements except A are correct. The correct dosage of methotrexate is 7.5 to 20 mg per week, not daily."}]},{"t":"Ménière’s Disease, Vestibular Neuronitis, Benign Paroxysmal Positional Vertigo, and Cerebellopontine Angle Tumors","q":[{"n":1,"s":"The inferior vestibular nerve carries sensation from the","o":["superior semicircular canal.","lateral semicircular canal.","posterior semicircular canal.","utricle.","endolymphatic sac."],"k":"C","x":"The superior vestibular nerve innervates the superior and lateral semicircular canals and the utricle, whereas the posterior semicircular canal and the saccule are innervated by the inferior vestibular nerve."},{"n":2,"s":"Meniere’s disease is characterized by all of the following except","o":["episodic vertigo.","fluctuating hearing loss.","aural fullness.","tinnitus.","facial numbness."],"k":"E","x":"The classic presentation of Meniere’s disease includes episodic rotatory vertigo, fluctuating hearing loss, aural fullness, and tinnitus. The aural fullness is not relieved by maneuvers to open the eustachian tube. Facial numbness is not part of the constellation of symptoms associated with Meniere’s disease."},{"n":3,"s":"Initial management of a patient with Meniere’s disease is","o":["oral corticosteroids.","intratympanic gentamicin therapy.","diuretic therapy.","a low-salt diet.","endolymphatic shunt surgery."],"k":"D","x":"A low-salt diet is the initial therapy for a patient with Meniere’s disease. Diuretics can be initiated if diet alone fails to prevent vertigo. Oral corticosteroids can be used for severe attacks of vertigo; its efficacy likely reflects the presence of abnormal immune function tests in nearly one-third of patients with Meniere’s disease. Intratympanic gentamicin therapy should be considered for persistent symptoms following optimal medical management. Endolymphatic shunt surgery may be an option in patients with intact hearing and failure of gentamicin therapy."},{"n":4,"s":"Vestibular rehabilitation programs use all of the following strategies except","o":["habituation exercises that facilitate central compensation by extinguishing pathologic responses to head motion.","use of oral vestibular suppressants to enhance vestibular compensation.","postural control exercises.","general conditioning exercises.","gait exercises."],"k":"B","x":"Vestibular rehabilitation should be considered in all patients with persistent dysequilibrium that is troublesome. Vestibular rehabilitation is critically important in the elderly since their ability to achieve central compensation is diminished. Vestibular suppressants should be avoided except for management of acute vertigo."},{"n":5,"s":"Which of the following is not a risk factor for the development of benign paroxysmal positional vertigo (BPPV)?","o":["gender","middle age","history of trauma","history of vestibular neuronitis","ear surgery"],"k":"A","x":"Nearly 20% of patients seen at vertigo clinics will be given the diagnosis of BPPV. There is no gender bias. The average age of presentation is in the fifth decade. Ten to 15% of patients will have an antecedent history of vestibular neuronitis, and another 20% will have a history of head trauma. Some patients have had BPPV following ear surgery."},{"n":6,"s":"Benign paroxysmal positional vertigo (BPPV) is characterized by all of the following except","o":["an acute onset of brief vertigo with remission over a few months in most patients.","up to 30% of patients may have symptoms for longer than 1 year.","the majority of patients show improvement with a repositioning maneuver.","nearly 10 to 15% of patients may have unpredictable recurrences.","intratympanic gentamicin is the treatment of choice for recurrences."],"k":"E","x":"The natural history of BPPV includes an acute onset and remission over a few months. However, up to 30% of patients may have symptoms for longer than 1 year. The majority of patients will improve with a repositioning maneuver. Patients may have unpredictable recurrences and remissions, and the rate of recurrence may be 10 to 15% per year. These patients may be retreated with a repositioning maneuver.A subset of patients who have adapted by not using certain positions to avoid the vertigo or who have other balance disorders will benefit from balance rehabilitation therapy. Intratympanic gentamicin does not have a role in the management of patients with BPPV."},{"n":7,"s":"Vestibular neuronitis is characterized by","o":["sensorineural hearing loss.","80% of patients having a history of viral infection.","an acute attack of vertigo that may last for a few days.","incomplete recovery in the vast majority of patients.","some patients developing Meniere’s disease."],"k":"C","x":"The presentation of vestibular neuronitis includes sudden onset of vertigo with nausea and vomiting. Patients usually have normal hearing and a normal neurologic examination. The natural history of vestibular neuronitis includes an acute attack of vertigo that lasts a few days with complete or at least partial recovery within a few weeks to months. The majority of patients have complete recovery and so have an excellent prognosis. Recurrent attacks in the same or contralateral ear have been reported but are unusual. Some patients may later develop benign paroxysmal positional vertigo but not Meniere’s disease. The few patients who have persistent vestibular symptoms should have vestibular rehabilitation."},{"n":8,"s":"Vestibular schwannoma can present with","o":["high-frequency hearing loss.","low-frequency hearing loss.","flat hearing loss.","sudden hearing loss.","all of the above."],"k":"E","x":"Hearing loss is present in 95% of patients with vestibular schwannomas. Conversely, 5% of patients will have normal hearing, so unilateral vestibular or facial complaints without hearing loss do not rule out retrocochlear disease. Although high-frequency hearing loss is classically associated with vestibular schwannomas, any type of hearing loss may occur. Of the patients with hearing loss, most will have slowly progressive hearing loss with noise distortion. Twenty percent will have an episode of sudden hearing loss. The improvement of hearing loss with or without treatment does not rule out retrocochlear disease. The level of hearing loss is not a clear predictor of tumor size."},{"n":9,"s":"Intracanicular vestibular schwannomas typically do not present with","o":["unilateral hearing loss.","tinnitus.","facial numbness.","imbalance or dysequilibrium.","vertigo."],"k":"C","x":"Cerebellopontine angle (CPA) lesions cause symptoms by compression of the neurovascular structures in and around the CPA. The classic description of these symptoms by Harvey Cushing included unilateral hearing loss, vertigo, nystagmus, altered facial sensation, facial pain that later progresses to facial palsy, vocal cord palsy, dysphagia, diplopia, respiratory compromise, and death. This description highlights the untreated natural history of CPA tumors. Tumors confined to the internal auditory canal (intracanalicular tumors) are not associated with facial numbness."},{"n":10,"s":"A 20-year-old patient with a sudden hearing loss is discovered to have a right-sided 1.5 cm vestibular schwannoma on noncontrast magnetic resonance imaging (MRI) of the brain. All of the following are appropriate management steps except","o":["contrast MRI of the brain and internal auditory canal.","MRI with contrast enhancement of the spine.","ophthalmologic consultation.","immediate surgical intervention because vestibular schwannomas grow at a faster rate in younger patients.","stereotactic radiotherapy, which should be discouraged because of the patient’s age."],"k":"D","x":"A diagnosis of neurofibromatosis 2 should be entertained in all young patients with a vestibular schwannoma. A family history of brain tumors should be elicited. Contrast-enhanced MRI of the internal auditory canal and brain should be obtained to exclude bilateral vestibular schwannomas and brain tumors (eg, meningiomas). Magnetic resonance imaging of the spine should also be performed to detect spinal tumors. Initial treatment may include observation alone so that the patient can learn speech reading. Radiotherapy should be discouraged in young patients with vestibular schwannomas."}]},{"t":"Presbyacusis","q":[{"n":1,"s":"Socioacusis is a term that refers to hearing loss associated with","o":["social events such as rock concerts.","lifestyle factors such as diet and exercise.","exposure to nonoccupational noise.","exposure to transportation noise.","all of the above."],"k":"E","x":"Socioacousis is defined as the hearing loss produced primarily by exposure to nonoccupational noise in combination with lifestyle factors such as diet and exercise."},{"n":2,"s":"An individual has a 35 dB hearing level (loss) at age 5 years only in his left ear because of a viral infection (mumps). At age 75 years, the hearing level in his right ear is 35 dB. What is the predicted hearing level in his left ear at age 75 years?","o":["35 dB","38 dB","41 dB","70 dB","none of the above"],"k":"D","x":"Additivity in dB, thus 35 dB plus 35 DB = 70 dB. Using intensity, 35 dB plus 35 dB = 38 dB or, using pressure, 35 dB plus 35 dB = 41 dB."},{"n":3,"s":"The most dominant/prevalent pathology in the aging cochlea involves","o":["sensory cells, especially outer hair cells.","degeneration of the auditory nerve with retrograde degeneration of the brainstem.","degeneration of the stria vascularis.","conductive hearing loss associated with increased stiffness of the ossicles.","sensory cell loss of both outer and inner hair cells."],"k":"C","x":"The prevailing view of the histopathology of presbyacusis is that sensory cell losses are the least important type of loss in the aged; neuronal losses are constant and predictable expressions of aging; atrophy of the stria vascularis is the predominant lesion of the aging ear; there is no anatomic correlate for a gradual descending hearing loss, which would reflect a cochlear conductive loss; and 25% of specimens cannot be classified using light microscopy."},{"n":4,"s":"Decreased amplitudes of the auditory brainstem responses commonly observed in older persons are primarily an indicator of","o":["neural degeneration at the level of the cochlear nucleus.","conductive hearing loss.","neural degeneration of the cochlear nucleus and inferior colliculus.","a reduction in synchronized neural activity in the auditory nerve associated with a loss of spiral ganglion cells.","inner ear conductive hearing loss."],"k":"D","x":"The most prominent changes in the physiologic properties of the aging ear are losses of auditory nerve function as indicated by increased thresholds of the compound action potential (CAP) of the auditory nerve. The resulting shallow input-output functions of the CAP are also reflected in shallow input-output functions of auditory brainstem responses. Thus, what appears to be an abnormal function of the auditory brainstem reflects only the abnormal output of the auditory nerve. The reduced amplitudes of action potentials observed in aging ears are probably reflective of asynchronous or poorly synchronized neural activity in the auditory nerve. The pathologic basis of asynchronized activity in the auditory nerve is unknown but probably involves the nature of the synapse between individual auditory nerve fibers and the attachment to the inner hair cell, primary degeneration of spiral ganglion cells, and reductions in the endolymphatic potential."},{"n":5,"s":"A genetic component to age-related hearing loss is indicated by heritability coefficients, which are","o":["greater in men than in women.","statistically significant but with little practical application.","applicable only to sensory forms of presbyacusis.","similar to those reported for hyperlipidemia and hypertension.","equal in men and women."],"k":"D","x":"Gates and colleagues have estimated the role of genetics in age-related hearing loss. Their heritability estimates suggest that as much as 55% of the variance associated with age-related hearing loss is attributable to the effect of genes. These heritability estimates of age-related hearing loss are similar in magnitude to those reported for hypertension and hyperlipidemia, are much stronger in women than in men, and can be used to support the point of view that age-related changes in the ear and hearing reflect the combined effect of genetics, socioacusis, and nosoacusis."},{"n":6,"s":"Performance of older persons on most monaural tests of speech discrimination","o":["declines as a function of chronologic age and independently of the amount of hearing loss.","is predictable with reasonable error given the hearing loss as indicated by the audiogram.","is not predictable because of central nervous system involvement.","is predictable from measures of the transient otoacoustic emission.","none of the above."],"k":"B","x":"If the variable of hearing loss is controlled, speech discrimination is not affected by age. Although there are large individual differences in auditory behavior among individuals that are predictable by individual differences in auditory thresholds, there are many age-related declines in auditory behavior that are not strongly associated with auditory thresholds. This is most evident using binaural listening tasks conducted under acoustically stressful conditions. In many binaural experiments using older subjects, age-related declines are observed that appear to be independent of peripheral hearing loss; however, it is often difficult to separate truly central processing disorders from disorders initiated by a pathologic input from the aging cochlea."},{"n":7,"s":"The basic psychoacoustic skills of frequency discrimination and intensity discrimination in older persons","o":["are unaffected as long as the auditory signals are sufficiently loud.","decline systematically as a function of chronologic age and hearing loss.","are affected more in women than in men.","are affected at low frequencies and not at high frequencies even when the audiogram is normal.","are affected equally at low and high frequencies if the hearing loss is equal at low and high frequencies."],"k":"D","x":"Both discrimination in intensity and discrimination in frequency have been shown to decline with age only at low frequencies and independently of any hearing loss. These results are important because they are negative effects measured in the presence of normal hearing and may very well represent age-related declines in information-processing capability. It remains unclear whether these age-related declines represent age-related effects of the auditory periphery or central nervous system."},{"n":8,"s":"The 80 to 90 mV DC potential measured in the scala media, the endolymphatic potential, is","o":["usually reduced in older experimental animals only if there is a significant loss of inner hair cells.","unaffected by the aging process unless exposure to noise and/or ototoxic drugs also occurs.","usually reduced in older experimental animals, and the reduction is related to the extent of degeneration of the stria vascularis.","reduced in older experimental animals, reflecting primary degeneration of the auditory nerve as indicated by loss of spiral ganglion cells.","none of the above."],"k":"C","x":"In aging animals, the endolymphatic potential is often reduced significantly and proportionally to losses/degeneration of the stria vascularis. Moreover, in experimental animals, hearing losses can be reduced by introducing a DC voltage into the scala media and raising a low endolymphatic potential (ie, 15 mV) to a value approaching 60 to 70 mV. Degeneration of the stria vascularis with the resultant decline in the endocochlear potential has given rise to the “dead battery theory” of presbyacusis."},{"n":9,"s":"One of the first indicators of age-related hearing loss is","o":["loss of auditory sensitivity at frequencies higher than 8 kHz.","tinnitus.","decreased speech discrimination.","decreased auditory brainstem response amplitudes.","all of the above."],"k":"A","x":"One dramatic feature of age-related hearing loss is the decline of hearing levels at frequencies higher than 3 kHz. By age 50 to 59, the hearing loss at 16 kHz is greater than 60 dB. Hearing levels at 4 and 8 kHz exceed 50 dB by age 70 and exceed 70 dB at 8 kHz by age 79. Hearing loss at frequencies above 8 kHz is even more pronounced and is not predictable by hearing levels in the 1 to 4 kHz range."},{"n":10,"s":"Caloric restriction in aging experimental animals","o":["decreased the amount of age-related hearing loss.","produced fewer reactive oxygen metabolites.","produced fewer mitochondrial DNA deletions.","reduced the amount of age-related cochlear pathology.","all of the above."],"k":"E","x":"In an experiment, rats were assigned to either caloric restriction, treatment with several antioxidants, including vitamins E and C, or control groups and were allowed to age in a controlled environment. The calorie-restricted group maintained the best hearing, lowest quantity of mitochondrial DNA deletions, and least amount of outer hair cell loss. The antioxidant-treated subjects had better hearing than the controls and a slight trend for fewer mitochondrial DNA deletions. The controls had the poorest hearing, most mitochondrial DNA deletions, and most hair cell loss."}]},{"t":"Tinnitus and Hyperacusis","q":[{"n":1,"s":"Tinnitus is one of the definitive symptoms necessary for diagnosis of","o":["Williams syndrome.","Bell’s palsy.","otitis media.","Meniere’s disease.","conductive hearing loss."],"k":"D","x":"Low-pitched or roaring tinnitus is one of the characteristic features of Meniere’s disease."},{"n":2,"s":"Objective tinnitus can be associated with","o":["cardiovascular diseases and sensorineural hearing loss.","spontaneous otoacoustic emissions and tumors of the auditory nerve.","open eustachian tubes and artificial heart valves.","presbyacusis and arteriovenous shunts.","glomus tumors and vestibular schwannomas."],"k":"C","x":"Both conditions can generate real sound."},{"n":3,"s":"Masking","o":["does not play a significant role in tinnitus treatment.","is underused and should be widely promoted.","can be used but only together with alprazolam (Xanax).","should be used only for patients with tinnitus and hyperacusis.","is effective when maskers are tuned to tinnitus pitch."],"k":"A","x":"Masking did not withstand the test of time and is rarely used."},{"n":4,"s":"Which statement about tinnitus is not true?","o":["frequently accompanied by hyperacusis","more common in the elderly","very rare in people with normal hearing","can be induced by high doses of aspirin","can be induced by car air bag explosion"],"k":"C","x":"About 20 to 30% of tinnitus patients have normal hearing."},{"n":5,"s":"The neurophysiologic model of tinnitus predicts that","o":["the cochlea does not play a role in tinnitus.","loud sounds are suppressed by subcortical centers.","nonauditory parts of the brain are always involved in clinically significant tinnitus.","conditioned responses are necessary for perception of tinnitus.","cutting of the auditory nerve should be an effective method of treatment."],"k":"C","x":"Nonauditory centers (the limbic and autonomic nervous systems) are always involved in clinically significant tinnitus."},{"n":6,"s":"Select the statement that is not true:","o":["Tinnitus is a very common symptom.","Noise exposure is correlated with increased prevalence of tinnitus.","The prevalence of hyperacusis in the general population is not well documented.","Tinnitus and hyperacusis are not known in pediatric practice.","People of all ages experience hyperacusis."],"k":"D","x":"The prevalence of tinnitus is approximately the same in children as in adults. Hyperacusis has been reported in children as well. Hyperacusis is also part of some medical conditions affecting children."},{"n":7,"s":"Tinnitus retraining therapy must include","o":["fitting of instruments.","classification into one of three categories.","masking.","using ear protection.","counseling and use of a sound."],"k":"E","x":"Tinnitus retraining therapy always includes counseling and sound therapy."},{"n":8,"s":"The results have shown that tinnitus retraining therapy is","o":["only suitable for patients without hearing loss.","only to be practiced by audiologists.","not to be used for somatosound.","providing a cure for tinnitus.","effective regardless of the etiology of tinnitus."],"k":"E","x":"Tinnitus retraining therapy can be and has been used effectively for patients with various causes of tinnitus."},{"n":9,"s":"Select the statement that is not true:","o":["Tinnitus retraining therapy can be used for somatosounds.","Spontaneous otoacoustic emissions are sometimes considered as objective tinnitus.","In case of some somatosounds, a surgical approach can be used.","Somatosound can be produced by structures adjunct to the ear.","Lidocaine administered intravenously is the only drug proven to abolish somatosounds."],"k":"E","x":"Administration of lidocaine intravenously can abolish subjective tinnitus for a short time but is not effective in the abolition of somatosounds."},{"n":10,"s":"To achieve habituation of tinnitus, it is necessary to","o":["train patients to listen attentively to sound from sound generators.","use sound generators at least 8 hours per day.","use sound generators set at the mixing point.","use environmental sounds at the threshold of hearing level.","train patients to reclassify tinnitus to the category of neutral signals."],"k":"E","x":"Reclassification of tinnitus into the category of neutral signals is the first step necessary to achieve its habituation."}]},{"t":"Cochlear Implants","q":[{"n":1,"s":"A cochlear implant requires all of the following except","o":["a microphone.","a frequency modulator.","a speech processor.","an electromagnetic transducer.","an implanted electrode array."],"k":"B","x":"Essential components of a cochlear implant include a microphone to pick up acoustic signals, a speech processor to convert them into electrical signals, an electromagnetic transducer system to transmit the electrical signal through the skin, and an implanted electrode array."},{"n":2,"s":"The continuous interleaved sampling (CIS) strategy is designed to","o":["amplify frequency differences in speech.","use variations in intensity in speech.","preserve fine temporal details in speech.","take advantage of prosody of speech.","all of the above."],"k":"C","x":"The CIS strategy filters the speech signal into a fixed number of bands, obtains the speech envelope, and then compresses the signal for each channel. On each cycle of stimulation, a series of interleaved digital pulses rapidly stimulates consecutive electrodes in the array. The CIS strategy is designed to preserve fine temporal details in the speech signal by using high-rate, pulsatile stimuli."},{"n":3,"s":"Of the speech processing techniques, which are available commercially?","o":["spectral peak","advanced combined encoder","continuous interleaved sampling","simultaneous analog stimulation","all of the above"],"k":"E","x":"The spectral peak or SPEAK strategy is the most widely used strategy with the Nucleus 22-channel cochlear implant. The advanced combined encoder is available with the Nucleus C124M implant. The continuous interleaved sampling strategy is available with the Nucleus, Clarion, and Combi 40+ implants, and simultaneous analog stimulation is used in the Clarion implant."},{"n":4,"s":"For adult cochlear implant candidates, the acceptable minimal benefit from the best aided condition is","o":["hearing level less than 80 dB.","a gain of less than 30 dB.","word recognition scores less than 40 to 50%.","sentence recognition scores less than 40 to 50%.","none of the above."],"k":"D","x":"Initially, cochlear implantation in adults was limited to those who received no benefit from amplification. Now the minimal benefit from conventional hearing aids is typically defined as sentence recognition scores less than 40 to 50% correct in the best aided condition."},{"n":5,"s":"Good candidates for cochlear implants include all of the following except","o":["elderly adults.","prelingually deaf children.","prelingually deaf adults communicating principally with sign language.","individuals with deafness owing to ototoxicity.","children with deafness owing to meningitis."],"k":"C","x":"Adults with prelingual deafness are generally not considered good candidates for cochlear implantation. However, prelinguistically deafened adults who have followed an aural/oral educational approach may receive significant benefit."},{"n":6,"s":"The primary audiologic determinant of cochlear implant candidacy is","o":["aided speech recognition scores.","speech reception thresholds.","frequency discrimination ability.","intensity discrimination ability.","sentence recognition scores."],"k":"A","x":"All potential candidates must have completed a period of experience with a properly fit hearing aid, preferably coupled with training in an appropriate aural re(habilitation) program. Aided speech recognition scores are the primary audiologic determinant of cochlear implant candidacy. For very young children or those with limited language abilities, parent questionnaires are used to determine hearing aid benefit."},{"n":7,"s":"Cochlear implantation is not feasible in children with deafness associated with","o":["Mondini’s deformity.","meningitis.","ototoxicity.","autosomal recessive inheritance.","Michel’s deformity."],"k":"E","x":"Stimulable auditory neural elements are nearly always present regardless of the cause of deafness. Two exceptions are the Michel deformity, in which there is a congenital agenesis of the cochlea, and the small internal auditory canal syndrome, in which the cochlear nerve may be congenitally absent."},{"n":8,"s":"In adult cochlear implant recipients, good word recognition skills are associated with","o":["a short period of auditory deprivation.","good speech-reading skills.","more residual hearing.","younger age at time of implantation.","all of the above."],"k":"E","x":"All of the choices are correct. The findings regarding other predictive factors have been less conclusive. For example, Gantz and colleagues found that cognitive ability was not associated with patient performance, whereas Cohen and colleagues reported that higher IQs were associated with better speech perception skills."},{"n":9,"s":"For children receiving cochlear implants, better outcome has been associated with all of the following except","o":["prelingual deafness.","older age at which deafness occurred.","oral/auditory educational program.","more residual hearing","younger age at which implantation was performed."],"k":"A","x":"Although it is true, for children, that the younger the age at which implantation is performed the better the outcome is likely to be, it is also true that linguistic experience prior to deafness is a distinct advantage."},{"n":10,"s":"In recent years, the improvement in speech perception abilities in children and adult recipients of cochlear implants has been attributed to all of the following except","o":["improved surgical technique.","better speech processing strategies.","better candidate selection criteria.","improved electrode array design.","better educational therapy following implantation."],"k":"A","x":"Of the five choices, only improved surgical technique has not received credit for the progress. Of the other four, improvements in technology and refinements in candidacy criteria probably deserve the most credit for securing for cochlear implantation an enduring place in the (re)habilitation of the profoundly hearing impaired."}]},{"t":"Facial Paralysis","q":[{"n":1,"s":"Incomplete eyelid closure secondary to facial nerve dysfunction should be initially managed with","o":["tarsorraphy.","the lower lid–shortening procedure.","taping of the eyelid.","browlift.","artificial tears and ointment."],"k":"E","x":"Initial management of paralytic lagophthalmos should include measures to prevent exposure keratitis. Artificial tears and a bland eye ointment are the mainstays of treatment. Patients with poor Bell’s phenomenon or trigeminal nerve deficits are particularly at risk for corneal damage."},{"n":2,"s":"A disadvantage of upper eyelid gold weight implantation versus a palpebral wire spring is","o":["its irreversibility.","it is less likely to mimic a spontaneous blink.","it is technically a more difficult procedure.","its lack of prefabricated sizes.","its propensity for lid underclosure."],"k":"B","x":"Gold weight implantation for eyelid reanimation has many advantages over the palpebral spring. The palpebral wire spring in experienced hands can afford the capability of mimicking to some extent the spontaneous blink. However, it is technically more difficult to perform, with a higher reported extrusion and infection rate."},{"n":3,"s":"As a general rule, how much of the lower lid can be resected without disturbing the relationship of the inferior punctum to the globe?","o":["one-tenth","one-eighth","one-sixth","one-quarter","one-half"],"k":"B","x":"Up to one-eighth of the lower lid can be resected without excessively displacing the punctum. If the lateral traction test indicates excessive punctum displacement (> 2 mm) or demonstrates improper lid support, then alternative or adjunctive surgical procedures are indicated for lower lid tightening."},{"n":4,"s":"Fibrillation potentials found on facial EMG indicate","o":["intact motor end plates but no evidence of reinnervation.","intact motor end plates and evidence of reinnervation.","degenerated motor end plates and no evidence of reinnervation.","degenerated motor end plates and evidence of reinnervation.","None of the above."],"k":"A","x":"Fibrillation potentials support the use of a nerve substitution procedure to take advantage of the potential neurotized tone and movement of the intrinsic facial musculature. Electrical silence indicates complete denervation and atrophy of motor end plates. Under these circumstances, neurotized procedures are contraindicated, and other reanimation procedures are indicated."},{"n":5,"s":"A patient sustained facial paralysis following mastoid surgery 2 years ago. The best option for lower face reanimation is","o":["interpositional facial nerve grafting from the tympanic segment to the remaining vertical segment.","hypoglossal-facial nerve crossover.","hypoglossal-facial nerve jump graft.","temporalis muscle transfer.","neuromuscular facial retraining."],"k":"D","x":"Nerve substitution or nerve grafting procedures are contraindicated for long-standing facial paralysis (> 2 years) owing to likely facial muscle motor end plate degeneration. Muscle transposition, static suspension, or innervated free tissue transfer procedures are all possible options at this point."},{"n":6,"s":"Vesicular eruption associated with Ramsay Hunt syndrome occurs in the following locations except the","o":["concha of the auricle.","posteromesial surface of the auricle.","mucosa of the palate.","anterior two-thirds of the tongue.","preauricular skin."],"k":"E","x":"Based on Dr. Hunt’s original papers, the sensory distributions reflected by varicella-zoster virus recrudescence include all of the sites mentioned above, with the exception of preauricular skin. The concha is the most common site of vesicular eruption."},{"n":7,"s":"Recent studies have linked the cause of Bell’s palsy to","o":["varicella-zoster virus.","herpes simplex virus.","parainfluenza virus.","papillomavirus.","none of the above."],"k":"B","x":"Bell’s palsy has been classically defined as an “idiopathic facial paralysis” or as a mononeuropathy of undetermined origin. Recent observations have linked the cause to herpes simplex virus (HSV-1). Reactivation of latent HSV in the geniculate ganglion may be the phenomenon responsible for Bell’s palsy."},{"n":8,"s":"Which statement is true regarding longitudinal temporal bone fractures?","o":["usually result from frontal or occipital blows to the head","frequently involve the otic capsule","are less common than transverse temporal bone fractures","are the most common type of fracture associated with facial nerve injury","associated facial nerve injury most often occurs in its tympanic segment"],"k":"D","x":"Although facial nerve injury is more likely with transverse temporal bone fractures (approximately 50%), longitudinal fractures are much more common (approximately 90% of temporal bone fractures). Therefore, longitudinal fractures are the most common type of fracture associated with facial nerve injury."},{"n":9,"s":"Tumor involvement of the facial nerve should be suspected if the following clinical feature is present:","o":["sudden onset of facial paralysis","recurrent contralateral facial paralysis","facial weakness with muscle twitching","facial paralysis lasting less than 3 weeks","facial paralysis associated with a rash"],"k":"C","x":"Tumor involvement of the facial nerve should be considered if one or more of the following are present: facial paralysis that progresses slowly over 3 weeks, recurrent ipsilateral facial paralysis, facial weakness associated with muscle twitching, long-standing facial paralysis (> 6 months), facial paralysis associated with other cranial nerve deficits, or evidence of malignancy elsewhere in the body."},{"n":10,"s":"Facial electroneuronography (ENoG) is performed on a patient at 10 days after the onset of complete facial paralysis likely attributable to Bell’s palsy. Which of the following statements is true regarding information obtained with ENoG?","o":["The percentage of regenerating fibers can be calculated arithmetically.","Minor conduction blocks can be differentiated from wallerian degeneration.","Axonotmesis can be differentiated from neurotmesis.","Testing performed at day 3 would have provided more meaningful information.","Surgical decompression can be considered if degeneration of neural fibers is greater than 75% relative to the unaffected side."],"k":"B","x":"Electroneuronography is useful to calculate the percentage of degenerated fibers relative to the unaffected side. Surgical decompression can be considered if degeneration is greater than 90% within 14 days of onset and there is no voluntary electomyographic activity. Electroneuronography can differentiate between minor conduction blocks (neurapraxia) versus wallerian degeneration (axonotmesis and neurotmesis), but it cannot differentiate between axonotmesis and neurotmesis. Testing done within 3 days of paralysis may not accurately represent the degree of injury because wallerian degeneration occurs over 3 to 5 days following injury or insult."}]},{"t":"Olfaction and Gustation","q":[{"n":1,"s":"Which of the following lingual papillae does not contain taste buds?","o":["circumvallate","foliate","fungiform","filiform","all of the above contain taste buds"],"k":"D","x":"On average, humans have ~ 9 large circumvallate (also termed vallate; L. vallum = rampart surrounded by a moat) papillae across the junction of the anterior two-thirds and the posterior third of the tongue. Each papilla contains, on average, ~ 250 taste buds, although large individual differences are present. The foliate (L. folium = leaf) papillae, which consist of ridges between adjacent folds along the posterior part of the margin of the tongue, number less than a dozen on each side. Although estimates vary, the average number of taste buds per foliate papilla is probably around 100 in adults. Fungiform (L. fungi = mushroom) papillae, located over the surface of the anterior part of the tongue, vary considerably in size and shape, some being short and cuboidal and others tall with mushroom-like heads. The typical adult tongue contains several hundred fungiform papillae, although not all harbor taste buds. Of individual fungiform papillae that do contain taste buds, the number of buds ranges from 1 to 18 on those located on the tongue tip and 1 to 9 on those located midlingually. The filiform (L. filum = thread) papillae are the most numerous papillae on the tongue but do not harbor taste buds."},{"n":2,"s":"Which of the following is not a layer of the olfactory bulb?","o":["interglomerular layer","mitral cell layer","olfactory nerve cell layer","internal plexiform layer","all of the above are layers of the olfactory bulb"],"k":"A","x":"The layers of the olfactory bulb are, from the periphery inward, the olfactory nerve cell layer, glomerular layer, external plexiform layer, mitral cell layer, internal plexiform layer, and granule cell layer. There is no interglomerular layer distinguished as such."},{"n":3,"s":"Which of the following is the most common cause of permanent loss of the sense of smell?","o":["head trauma","upper respiratory infections","rhinosinusitis","Alzheimer’s disease","chemical toxic exposure"],"k":"B","x":"Although loss of smell function has been associated with a number of systemic diseases and metabolic disorders, most patients with such loss fall into one of three major categories: head trauma, upper respiratory infections (eg, influenza and the common cold), and rhinosinusitis. Of these primary causes, upper respiratory infections are the most common. Typically, permanent hyposmia or anosmia occurs after the age of 40 in such individuals. In a study of a large number of consecutive patients seen at the University of Pennsylvania Smell and Taste Center during the period from 1980 to 1986, upper respiratory infections accounted for 26% of the cases, head trauma for 18%, and nasal and sinus disease 15%."},{"n":4,"s":"What proportion of individuals between 65 and 80 years of age have marked loss of olfactory function?","o":["10%","25%","50%","75%","95%"],"k":"C","x":"According to a study in which the University of Pennsylvania Smell Identification Test was administered to 1,955 persons spanning the entire age range, more than 75% of individuals over the age of 80 years evidenced major olfactory impairment, with nearly 50% being anosmic. More than half of persons between 65 and 80 years of age evidenced major olfactory impairment, with nearly a quarter being anosmic. Such losses are significant and place many older persons at risk from fire, leaking natural gas, and spoiled food, as well as from malnutrition from a lack of interest in food secondary to lack of flavor."},{"n":5,"s":"According to the Physicians’ Desk Reference, what proportion of cardiac medications are associated with adverse taste-related side effects?","o":["~ 10%","~ 25%","~ 50%","~ 75%","~ 90%"],"k":"B","x":"Drug-related adverse effects in the elderly can be quite debilitating and can lead to decreased food intake and malnutrition. Among agents that produce altered tastes are antilipemic agents (eg, cerivastatin, fenofibrate, atorvastatin, gemfibrozil, lovastatin), adrenergic stimulants (eg, methyldopa), angiotensin-converting enzyme inhibitors (eg, captopril, enalaparil), calcium channel blockers (eg, diltiazem, amlodipine), and antiarrhythmics (sotalol, amiodarone). Unfortunately, cessation of medication does not always result in resolution of taste alterations, which can be quite long lasting and debilitating."},{"n":6,"s":"Which of the following does not cause chemosensory loss?","o":["depression","rhinosinusitis","acoustic neuromas","schizophrenia","all of these cause chemosensory loss"],"k":"A","x":"Although there are some discrepant studies, most studies suggest that depression, per se, is not the cause of chemo-sensory loss, although some forms of chemosensory dysfunction (eg, dysgeusia) are associated with depression. Recent studies suggest that smell testing is useful in distinguishing between probable Alzheimer’s disease and depression, a distinction that can sometimes be difficult to make on other grounds."},{"n":7,"s":"Which of the following glands contribute to mucus production in the olfactory neuroepithelium?","o":["schneiderian glands","Ebner’s glands","Bowman’s glands","Magendie’s glands","ciliary glands"],"k":"C","x":"The glands within the lamina propria were first described by Todd and Bowman in 1847. Named Bowman’s glands by von Kölliker in 1858, these glands provide a microenvironment in which optimal odorant absorption is enhanced. There are no schneiderian glands, although the nasal mucous membrane is sometimes termed the schneiderian membrane. Ebner’s glands secrete mucus around the circumvallate papillae, whereas Magendie’s glands are fictitious. Ciliary glands are related to the hair follicles of the eyelashes."},{"n":8,"s":"Which of the following is not a component of the primary olfactory cortex?","o":["anterior olfactory nucleus","piriform cortex","orbitofrontal cortex","periamygdala cortex","entorhinal area"],"k":"C","x":"The orbitofrontal cortex is generally considered to be the secondary olfactory cortex, not the primary olfactory cortex, as it does not receive olfactory bulb afferents. It does connect reciprocally with the major elements of the primary olfactory cortex, with some of these connections occurring through the thalamus."},{"n":9,"s":"Approximately how many olfactory receptor cells are estimated to be present in the adult human?","o":["6,000","60,000","600,000","6,000,000","60,000,000"],"k":"D","x":"Although it has been estimated that the adult human olfactory neuroepithelium contains ~ 6,000,000 receptor cells, an empiric determination of the size of this region in a sample of males and females across a wide age range has never been made. It is important to note that viruses and other pathogens produce damage to the olfactory region over time that presumably is cumulative. Hence, the olfactory region of adults is very heterogeneous, being interspersed with metaplastic islands of respiratory-like epithelium."},{"n":10,"s":"Approximately how many taste buds are there on the human tongue?","o":["2,600","4,600","26,000","46,000","260,000"],"k":"B","x":"Even though, on average, the human tongue is said to contain approximately 4,600 taste buds, very large individual differences are present. In general, damage to a given taste nerve results in a decrease or even total loss of taste buds innervated by that nerve. Overall, taste threshold sensitivity is directly related to taste bud number."}]},{"t":"Acquired Immune Deficiency Syndrome","q":[{"n":1,"s":"As of the year 2000, the estimated number of US residents infected with human immunodeficiency virus (HIV) was","o":["300,000.","600,000.","900,000.","1,200,000.","1,500,000."],"k":"C","x":"Furthermore, more than 600,000 cases of acquired immune deficiency syndrome (AIDS) have been reported in the United States."},{"n":2,"s":"The ratio of the prevalence of HIV infection in African Americans to that in white Americans is","o":["2:1.","4:1.","6:1.","8:1.","10:1."],"k":"C","x":"Also, the incidence of AIDS is much higher in African Americans than in Whites, and AIDS is the leading disease killer of African American men."},{"n":3,"s":"In the United States, women constitute what percentage of AIDS cases?","o":["10","20","30","40","50"],"k":"B","x":"Although the incidence in women is increasing more rapidly than in men, women currently constitute 20% of AIDS cases."},{"n":4,"s":"InAfrica, SouthAmerica, and SouthernAsia, women constitute what percentage of AIDS cases?","o":["20","35","50","65","80"],"k":"C","x":"In these regions, the transmission of AIDS is more frequently by sexual activity than by intravenous drug use and other methods. This partially accounts for the relatively higher incidence among women."},{"n":5,"s":"In the United States, the risk of acquiring HIV from screened bank blood is","o":["1:62,000 units.","1:125,000 units.","1:225,000 units.","1:450,000 units.","1:700,000 units."],"k":"C","x":"Banked blood is screened for HIV antibodies, and the rare infection would be caused by blood from an infected individual who had not seroconverted at the time of the donation."},{"n":6,"s":"The main target of HIV is the","o":["CD4+ T lymphocyte.","CD4+ B lymphocyte.","CD4– T lymphocyte.","CD4– B lymphocyte.","CD4+ monocyte."],"k":"A"
