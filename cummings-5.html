<title>Cummings Review — 5th-edition file — 937 MCQs</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA=[{"t": "Ch 1–8 · History and exam, imaging, radiotherapy, chemotherapy, antibiotics, skin flaps", "q": [{"s": "Cervical nodal level V lies:", "o": ["Adjacent to the trachea", "Over the jugulodigastric chain", "Behind levels II, III and IV", "Below level IV", "Between levels VI and III"], "k": "C", "x": "Level V is the posterior triangle: behind the posterior border of SCM, in front of trapezius, above the clavicle. It sits posterior to II–IV.\nA — Paratracheal = level VI.\nB — Jugulodigastric node = level IIA.\nD — Nothing lies below IV in the neck; that is the mediastinum (level VII).\nE — Between VI and III is the carotid sheath region, not V.\nExam tip: Virchow's node is level IV, not VB, despite being 'supraclavicular'.\nCh 1 · History & physical · Cummings 7th, KJ Lee 12th", "b": "Ch 1", "n": 1}, {"s": "Which subsite is NOT part of the oral cavity?", "o": ["Soft palate", "Hard palate", "Buccal mucosa", "Retromolar trigone", "Anterior (oral) tongue"], "k": "A", "x": "The soft palate belongs to the oropharynx (superior wall).\nB — Hard palate is oral cavity.\nC — Buccal mucosa is oral cavity.\nD — RMT is oral cavity.\nE — Anterior two-thirds of tongue is oral cavity; base of tongue is oropharynx.\nExam tip: Circumvallate papillae divide oral tongue from base of tongue.\nCh 1 · History & physical · AJCC 8th, Cummings 7th", "b": "Ch 1", "n": 2}, {"s": "Ammonia is an appropriate agent for testing olfaction. True or false?", "o": ["True", "False"], "k": "B", "x": "Ammonia is an irritant that stimulates trigeminal (CN V) free nerve endings, so an anosmic patient can still 'smell' it.\nA — A positive response does not prove CN I function.\nExam tip: A patient who denies smelling ammonia or other trigeminal irritants raises suspicion of malingering.\nCh 1 · History & physical · Scott-Brown 8th, Cummings 7th", "b": "Ch 1", "n": 3}, {"s": "The hypopharynx includes all of the following subsites EXCEPT:", "o": ["Pyriform sinuses", "Posterior pharyngeal wall", "Anterior pharyngeal wall", "Postcricoid region"], "k": "C", "x": "AJCC hypopharyngeal subsites are pyriform sinus, postcricoid area and posterior hypopharyngeal wall.\nA — Subsite.\nB — Subsite.\nD — Subsite.\nExam tip: The 'anterior wall' of the hypopharynx is effectively the postcricoid area and larynx, which is why it is not listed separately.\nCh 1 · History & physical · AJCC 8th", "b": "Ch 1", "n": 4}, {"s": "The carotid triangle is bounded by all of these muscles EXCEPT:", "o": ["Digastric (posterior belly)", "Sternocleidomastoid", "Omohyoid (superior belly)", "Sternohyoid"], "k": "D", "x": "Carotid triangle: posterior belly of digastric above, superior belly of omohyoid anteroinferiorly, SCM posteriorly.\nA — Boundary.\nB — Boundary.\nC — Boundary.\nExam tip: Sternohyoid lies within the muscular triangle, not on the carotid triangle border.\nCh 1 · History & physical · Scott-Brown 8th", "b": "Ch 1", "n": 5}, {"s": "Complications of which system are the commonest cause of perioperative mortality?", "o": ["Pulmonary", "Cardiovascular", "Renal", "Gastrointestinal", "Neurologic"], "k": "B", "x": "Cardiac events (MI, arrhythmia, heart failure) remain the leading cause of perioperative death in non-cardiac surgery.\nA — Pulmonary complications are commoner but less often fatal.\nC — Less frequent.\nD — Less frequent.\nE — Less frequent.\nExam tip: Most common complication (pulmonary) ≠ most common cause of death (cardiac).\nCh 2 · Preoperative evaluation · Cummings 7th", "b": "Ch 2", "n": 6}, {"s": "A patient reports egg allergy. According to the book, which agent warrants caution?", "o": ["Succinylcholine", "Nitrous oxide", "Propofol", "Ketamine", "Enflurane"], "k": "C", "x": "Propofol is formulated in an emulsion containing egg lecithin, hence the classic association.\nA — No egg component.\nB — No egg component.\nD — No egg component.\nE — Volatile agent, no egg component.\nUpdate: Answer unchanged for exams, but practice has changed: current anesthesia guidance and multiple cohort studies show egg-allergic patients tolerate propofol, because the allergen is egg-white protein, not yolk lecithin. Egg allergy alone is no longer a contraindication.\nCh 2 · Preoperative evaluation · Cummings 7th", "b": "Ch 2", "n": 7}, {"s": "Per the book, endocarditis prophylaxis for ENT procedures is indicated in all EXCEPT:", "o": ["History of rheumatic fever", "Mitral valve prolapse with regurgitation", "Mitral valve prolapse without regurgitation", "Congenital heart defects", "Significant hypertrophic cardiomyopathy"], "k": "D", "x": "Book logic (pre-2007 AHA): MVP without regurgitation carried no added risk, so no prophylaxis.\nA — Was an indication under old guidance.\nB — Was an indication under old guidance.\nE — Was an indication under old guidance.\nCh 2 · Preoperative evaluation · AHA IE guideline, Cummings 7th", "b": "Ch 2", "f": "Key corrected: the book key is C; the current answer is D. Outdated. Since AHA 2007 (reaffirmed 2021), prophylaxis is limited to prosthetic valves/material, prior IE, specific congenital heart disease (unrepaired cyanotic, repaired with prosthetic material ≤6 months or residual defect), and cardiac-transplant valvulopathy. Rheumatic fever history, MVP with regurgitation and HCM no longer qualify. Today only D (selected CHD) remains an indication, and only for procedures involving gingival manipulation or incision of respiratory mucosa (e.g., tonsillectomy).", "n": 8}, {"s": "Pre-op for major H&N surgery in significant COPD. Per the book, which measure would NOT be recommended?", "o": ["Prophylactic antibiotics for a few weeks pre-op", "Chest physiotherapy", "A preoperative steroid course", "Stopping smoking one week before surgery", "Humidified air/oxygen"], "k": "A", "x": "Book key is C (steroids), reflecting older reluctance to give steroids pre-op.\nB — Recommended.\nD — Any cessation helps; ideally ≥4–8 weeks.\nE — Recommended for secretions.\nCh 2 · Preoperative evaluation · Cummings 7th", "b": "Ch 2", "f": "Key corrected: the book key is C; the current answer is A. Current practice reverses this. A short steroid course is standard for COPD with active bronchospasm/poor control. Prolonged prophylactic antibiotics without active infection are NOT recommended (resistance, C. difficile). The most defensible 'except' today is A. Moderate confidence: phrasing is old, so expect the book key on recycled exam items.", "n": 9}, {"s": "Healthy 30-year-old woman for tonsillectomy. Which pre-op test is NOT required?", "o": ["CBC", "Serum electrolytes", "PT/PTT", "ECG", "Urine pregnancy test"], "k": "D", "x": "ECG is not indicated in a healthy young adult without cardiac risk factors.\nA — Often done, though not mandatory.\nB — Often done.\nC — Book expects coag screen.\nE — Mandatory for women of reproductive age.\nExam tip: Modern AAO-HNS guidance does not require routine coagulation screening; a targeted bleeding history is more useful. ECG is still the clearest 'not required'.\nCh 2 · Preoperative evaluation · Cummings 7th", "b": "Ch 2", "n": 10}, {"s": "IV contrast for neck CT in H&N cancer is given to identify pathologic nodes. True or false?", "o": ["True", "False"], "k": "A", "x": "Contrast shows central necrosis, rim enhancement and extranodal extension, the key CT signs of metastasis.\nB — Non-contrast CT misses necrosis and vessel relationships.\nExam tip: Central necrosis = metastatic regardless of node size.\nCh 3 · Imaging (also Shamsan Q1) · Cummings 7th, Scott-Brown 8th", "b": "Ch 3", "n": 11}, {"s": "Per the book, a lesion that is high signal on T2 MRI should primarily suggest:", "o": ["Minor salivary gland or neurogenic lesion", "Squamous cell carcinoma", "Meningioma", "Lipoma", "Cystic hygroma"], "k": "A", "x": "Minor salivary tumors (e.g., pleomorphic adenoma) and schwannomas are characteristically very T2-bright.\nB — SCC is intermediate on T2.\nC — Meningioma is iso to grey matter.\nD — Lipoma is T1-bright; fat suppresses.\nE — Also T2-bright, but the book wants solid T2-bright lesions.\nExam tip: Very T2-bright solid parapharyngeal mass: pleomorphic adenoma vs schwannoma.\nCh 3 · Imaging (also Shamsan Q2) · Cummings 7th", "b": "Ch 3", "n": 12}, {"s": "Unilateral ear fullness with soft tissue in the middle ear in an adult suggests nasopharyngeal carcinoma. True or false?", "o": ["True", "False"], "k": "A", "x": "Tumor obstructs the eustachian tube (fossa of Rosenmüller), causing unilateral OME.\nB — Adult unilateral OME must be investigated for NPC.\nExam tip: Classic viva: adult unilateral OME = endoscopy of the nasopharynx, ± biopsy.\nCh 3 · Imaging (also Shamsan Q3) · Scott-Brown 8th, KJ Lee 12th", "b": "Ch 3", "n": 13}, {"s": "When reporting an intraparotid lesion, its relation to the facial nerve plane must be described. True or false?", "o": ["True", "False"], "k": "A", "x": "Superficial vs deep lobe determines the operation and nerve risk.\nB — Omitting it removes the key surgical information.\nExam tip: The nerve itself is not seen on CT; its plane is inferred from the retromandibular vein.\nCh 3 · Imaging (also Shamsan Q4) · Cummings 7th", "b": "Ch 3", "n": 14}, {"s": "Radiologically, the facial nerve runs:", "o": ["Medial to the common carotid", "Posterolateral to the retromandibular vein", "Medial to the styloid process", "Medial to the vertebral artery", "Posteromedial to the internal maxillary artery"], "k": "B", "x": "Within the parotid the nerve lies lateral to the retromandibular vein, which is the radiological surrogate for the nerve plane.\nA — Nerve is extracranial and lateral.\nC — Exits the stylomastoid foramen lateral to the styloid.\nD — Unrelated.\nE — Unrelated.\nExam tip: Mass lateral to the RMV = superficial lobe.\nCh 3 · Imaging (also Shamsan Q5) · Cummings 7th, Scott-Brown 8th", "b": "Ch 3", "n": 15}, {"s": "How do high-energy therapeutic X-rays interact with matter?", "o": ["They behave as photons (quanta of EM radiation)", "They interact mainly with orbital electrons, not the nucleus", "Bone/soft-tissue contrast is poorer on therapy-beam films than on diagnostic films", "Dose is specified as number of ionizations, not energy deposited", "A, B and C"], "k": "E", "x": "A, B, C are true. Megavoltage photons act by Compton scatter (electron interaction), which is density- not atomic-number-dependent, so portal films have poor bone contrast.\nD — False: dose is energy absorbed per mass (Gray = J/kg).\nExam tip: Compton effect predominates in therapy; photoelectric effect in diagnostic imaging.\nCh 4 · Radiotherapy (also Shamsan Q6) · Cummings 7th", "b": "Ch 4", "n": 16}, {"s": "Electron beams are useful in H&N treatment because:", "o": ["They penetrate more than photons of equal energy", "They have a sharp dose fall-off at depth", "Their radiobiology differs from X-rays", "They can be used intraoperatively more safely", "B and D"], "k": "E", "x": "Electrons deposit dose to a finite depth then fall off sharply, sparing deeper tissue (e.g., spinal cord when boosting posterior neck), and suit IORT.\nA — Less penetrating.\nC — RBE ≈ 1, same as photons.\nExam tip: Electrons are used for posterior neck boosts off the cord and for superficial skin cancers.\nCh 4 · Radiotherapy (also Shamsan Q7) · Cummings 7th", "b": "Ch 4", "n": 17}, {"s": "Radiation is delivered in many fractions because:", "o": ["Better cost:benefit for the oncologist", "Differences in survival-curve shoulders between tumor and late-responding tissue reduce late toxicity", "Acute toxicity per treatment is lower", "Shorter treatments reduce machine wear", "B and C"], "k": "E", "x": "Late-responding tissue (low α/β ≈ 3) repairs sublethal damage better between small fractions than tumor (α/β ≈ 10).\nA — Not a rationale.\nD — Not a rationale.\nExam tip: Know α/β: tumor/acute ≈ 10 Gy; late tissues ≈ 3 Gy.\nCh 4 · Radiotherapy (also Shamsan Q8) · Cummings 7th", "b": "Ch 4", "n": 18}, {"s": "Regarding hyperfractionation in H&N cancer, which are true?", "o": ["It allows a higher total tumor dose for the same 'acceptable' late effect", "An EORTC trial to 80.5 Gy improved local control", "Interval between daily fractions can be cut to 2 hours", "The linear–quadratic model justifies it", "A, B and D"], "k": "E", "x": "EORTC 22791 (1.15 Gy bid to 80.5 Gy) improved locoregional control in oropharyngeal cancer; the LQ model supports small-fraction sparing of late tissues.\nC — Minimum interval is 6 hours for sublethal damage repair.\nExam tip: MARCH meta-analysis: hyperfractionation gives the largest survival gain among altered fractionation schemes; concurrent chemoRT remains standard.\nCh 4 · Radiotherapy (also Shamsan Q9) · Cummings 7th, NCCN H&N", "b": "Ch 4", "n": 19}, {"s": "Regarding fast-neutron therapy, which are true?", "o": ["It works well for SCC because it kills hypoxic cells", "A randomized salivary gland trial favored neutrons for local control", "Neutrons differ radiobiologically from X-rays", "Neutrons cause fewer side effects", "B and C"], "k": "E", "x": "High-LET neutrons have higher RBE and less oxygen dependence; the RTOG/MRC trial in unresectable salivary tumors showed better local control.\nA — No benefit shown in SCC.\nD — More late toxicity.\nExam tip: Neutrons are now largely replaced by carbon-ion/proton therapy for adenoid cystic carcinoma.\nCh 4 · Radiotherapy (also Shamsan Q10) · Cummings 7th", "b": "Ch 4", "n": 20}, {"s": "Regarding chemotherapy in H&N cancer, which are true?", "o": ["It may potentiate RT and independently kill micrometastases", "Strong evidence supports routine chemotherapy for all H&N SCC", "The VA Larynx study showed chemo response predicts success of non-surgical treatment", "Intergroup NPC data showed no benefit of chemoRT over RT for stage III", "A and C"], "k": "E", "x": "VA Larynx: patients responding to induction cisplatin/5-FU went on to RT with larynx preservation in ~64%.\nB — Not routine for early-stage disease.\nD — False: Intergroup 0099 (Al-Sarraf) showed a clear survival benefit for chemoRT in NPC.\nExam tip: Intergroup 0099 established concurrent cisplatin-RT as standard for locoregionally advanced NPC.\nCh 4 · Radiotherapy (also Shamsan Q11) · Cummings 7th, NCCN H&N", "b": "Ch 4", "n": 21}, {"s": "Compared with penicillin, cephalosporins:", "o": ["Have identical Gram-negative cover", "Cover Enterobacteriaceae better", "Cover Listeria better", "Are equally effective against enterococci", "Are an alternative for MRSA"], "k": "B", "x": "Cephalosporins extend cover to Gram-negative enteric rods.\nA — Broader Gram-negative cover.\nC — Cephalosporins do NOT cover Listeria.\nD — Enterococci are intrinsically resistant.\nE — Not as a class.\nUpdate: Minor update: ceftaroline (5th generation) does cover MRSA, so E is no longer absolutely false. B remains the best answer.\nCh 5 · Antibiotics · Cummings 7th", "b": "Ch 5", "n": 22}, {"s": "Ciprofloxacin gives excellent cover against all EXCEPT:", "o": ["S. aureus", "H. influenzae", "M. catarrhalis", "S. pneumoniae", "P. aeruginosa"], "k": "D", "x": "Ciprofloxacin is weak against pneumococcus.\nA — Book counts it as covered (MSSA).\nB — Covered.\nC — Covered.\nE — Cipro is the only oral anti-pseudomonal.\nExam tip: Levofloxacin/moxifloxacin are the 'respiratory' quinolones that cover pneumococcus.\nCh 5 · Antibiotics · Cummings 7th", "b": "Ch 5", "n": 23}, {"s": "Which antibiotic is bacteriostatic?", "o": ["Cefuroxime", "Erythromycin", "Ampicillin", "Ciprofloxacin", "Imipenem"], "k": "B", "x": "Macrolides inhibit the 50S ribosome: bacteriostatic.\nA — β-lactam, cidal.\nC — β-lactam, cidal.\nD — DNA gyrase inhibitor, cidal.\nE — Carbapenem, cidal.\nExam tip: Static: macrolides, clindamycin, tetracyclines, linezolid, sulfonamides.\nCh 5 · Antibiotics · KJ Lee 12th", "b": "Ch 5", "n": 24}, {"s": "Host defects predisposing immunocompromised patients to infection include all EXCEPT:", "o": ["Neutrophil defects", "Humoral immunity defects", "Cell-mediated immunity defects", "Impaired antibody production", "Loss of mucociliary clearance"], "k": "E", "x": "Mucociliary clearance is a local mechanical barrier, not part of systemic immune competence.\nA — Immune defect.\nB — Immune defect.\nC — Immune defect.\nD — Immune defect.\nCh 5 · Antibiotics · Cummings 7th", "b": "Ch 5", "n": 25}, {"s": "In absolute neutropenia (<500/mm³), early fever per the book most likely indicates:", "o": ["Systemic fungal infection", "Listeria meningitis", "Fever of neutropenia itself", "P. aeruginosa bacteremia", "Pneumocystis reactivation"], "k": "D", "x": "Book teaching: Gram-negative bacteremia, especially Pseudomonas, is the feared early cause and drives empiric anti-pseudomonal therapy.\nA — Fungal infection appears later (persistent fever >4–7 days).\nB — Not typical.\nC — A diagnosis of exclusion.\nE — T-cell defect, not neutropenia.\nUpdate: Epidemiology has shifted: Gram-positive organisms (CoNS, viridans strep) now cause most documented bacteremias in febrile neutropenia. Empiric therapy remains an anti-pseudomonal β-lactam, so D is still the exam answer.\nCh 5 · Antibiotics · Cummings 7th", "b": "Ch 5", "n": 26}, {"s": "A toxicity characteristically associated with cisplatin is:", "o": ["Mucositis", "Cystitis", "Alopecia", "Nephrotoxicity", "Neurotoxicity"], "k": "D", "x": "Dose-limiting nephrotoxicity is cisplatin's signature (plus ototoxicity).\nA — 5-FU, methotrexate.\nB — Cyclophosphamide/ifosfamide.\nC — Taxanes, doxorubicin.\nE — Also seen with cisplatin but shared with taxanes and vinca alkaloids, so not unique.\nExam tip: Cisplatin ototoxicity: high-frequency, bilateral, irreversible; baseline audiogram required.\nCh 6 · Chemotherapy · Cummings 7th, NCCN H&N", "b": "Ch 6", "n": 27}, {"s": "Chemotherapy response and survival can be predicted by all EXCEPT:", "o": ["Tumor differentiation", "Primary site", "Performance status", "T and N stage", "Extracapsular extension"], "k": "A", "x": "Histologic grade has not reliably predicted response.\nB — Predictive.\nC — Strongest predictor.\nD — Predictive.\nE — Adverse feature.\nExam tip: Today's dominant predictor is HPV/p16 status in oropharyngeal cancer.\nCh 6 · Chemotherapy · Cummings 7th, NCCN H&N", "b": "Ch 6", "n": 28}, {"s": "Per the book, the major limitation of retinoids is:", "o": ["Cost", "Toxicity", "Antabuse effect", "Lack of proven efficacy", "Insurance denial"], "k": "D", "x": "High-dose 13-cis-retinoic acid caused significant mucocutaneous toxicity and hypertriglyceridemia.\nA — Not the main limitation.\nC — Not a retinoid effect.\nE — Not relevant.\nCh 6 · Chemotherapy · NCCN H&N", "b": "Ch 6", "f": "Key corrected: the book key is B; the current answer is D. Updated: the large phase III chemoprevention trial of low-dose isotretinoin (Khuri, JNCI 2006) showed no reduction in second primary tumors or improvement in survival. Retinoids have no role in current NCCN guidance, so lack of proven efficacy (D) is now the decisive limitation.", "n": 29}, {"s": "Organ-preservation protocols for advanced SCC work best for the:", "o": ["Oral cavity", "Oropharynx", "Base of tongue", "Larynx", "Nasal cavity"], "k": "D", "x": "VA Larynx and RTOG 91-11 established larynx preservation with chemoradiation.\nA — Primary surgery remains standard.\nB — Treated with RT/CRT for cure, not organ preservation per se.\nC — Same as B.\nE — Surgery-based.\nExam tip: T4a larynx with gross cartilage destruction: total laryngectomy is preferred over organ preservation.\nCh 6 · Chemotherapy · NCCN H&N, Scott-Brown 8th", "b": "Ch 6", "n": 30}, {"s": "Intra-arterial chemotherapy would be most effective for:", "o": ["SCC metastatic to lung", "Bilateral cervical metastases", "Paranasal sinus SCC", "T1 glottic cancer", "Karnofsky <50"], "k": "C", "x": "A single dominant feeding artery (internal maxillary) makes sinonasal tumors ideal for targeted IA cisplatin (RADPLAT).\nA — Systemic disease.\nB — No single arterial supply.\nD — RT or laser alone.\nE — Poor performance excludes aggressive therapy.\nExam tip: The Dutch RCT (Rasch 2010) showed IA RADPLAT no better than IV cisplatin for general H&N SCC; it survives mainly for sinonasal disease.\nCh 6 · Chemotherapy · Cummings 7th", "b": "Ch 6", "n": 31}, {"s": "Inherent weaknesses of TNM staging include:", "o": ["Retrospective data", "Treatment selection bias", "No comorbidity data", "All of the above"], "k": "D", "x": "TNM is anatomic only and built from retrospective cohorts.\nA — True but incomplete.\nB — True but incomplete.\nC — True but incomplete.\nExam tip: AJCC 8th added non-anatomic factors (HPV/p16, EBV, DOI, ENE).\nCh 7 · Staging · AJCC 8th", "b": "Ch 7", "n": 32}, {"s": "What distinguishes adjusted from actuarial survival?", "o": ["Comorbidity", "Cause of death", "Time of death", "Histology"], "k": "B", "x": "Adjusted (disease-specific) survival censors deaths from causes other than the cancer.\nA — Not the defining factor.\nC — Both use time.\nD — Irrelevant.\nCh 7 · Staging · Cummings 7th", "b": "Ch 7", "n": 33}, {"s": "Relative survival compares observed survival with:", "o": ["Similar tumor cases", "The patient's family", "Expected survival of a matched general population"], "k": "C", "x": "Relative survival = observed / expected (age-, sex-matched population).\nA — That is a case comparison.\nB — Not used.\nCh 7 · Staging · Cummings 7th", "b": "Ch 7", "n": 34}, {"s": "The correct T designation for an unknown primary is:", "o": ["T0", "Tx", "Tis"], "k": "A", "x": "Book key is Tx.\nC — Carcinoma in situ.\nCh 7 · Staging · AJCC 8th", "b": "Ch 7", "f": "Key corrected: the book key is B; the current answer is A. Discrepancy. Per AJCC 8th, T0 = no evidence of primary tumor, the correct label for an unknown primary. Tx means the primary cannot be assessed. Under AJCC 8th, p16+ nodes are staged as T0 oropharynx, EBV+ as T0 nasopharynx, and p16−/EBV− in the 'Cervical nodes and unknown primary' chapter. Answer A.", "n": 35}, {"s": "Laryngeal cancer with vocal cord fixation that invades the thyroid cartilage is:", "o": ["T3", "T4", "Tx"], " Harmful.\nExam tip: Pharmacologic agents remain experimental; delay is the clinical answer.\nCh 8 · Skin flap physiology · Cummings 7th", "b": "Ch 8", "n": 45}, {"s": "Reperfusion of an ischemic flap 24–48 h after creation:", "o": ["Is partly due to local norepinephrine depletion", "Results from early neovascularization", "May cause cell damage via oxygen free radicals", "A and C"], "k": "C", "x": "Book key C: reperfusion injury through oxygen free radicals.\nB — Neovascularization starts later (3–4 days).\nUpdate: Debatable key. Norepinephrine depletion over 24–48 h does relieve post-elevation vasospasm, so many texts would accept D. Expect C on exams that reuse this item.\nCh 8 · Skin flap physiology · Cummings 7th", "b": "Ch 8", "n": 46}]}, {"t": "Ch 9–14 · Free flaps, wound healing, lasers, anaesthesia, allergy, HIV", "q": [{"s": "The first successful free tissue transfer reported was:", "o": ["Scalp reconstruction with omentum", "Esophageal reconstruction with jejunum", "Burn reconstruction with fasciocutaneous tissue", "Limb reconstruction with muscle", "Limb reconstruction with skin"], "k": "B", "x": "Seidenberg (1959) reconstructed the cervical esophagus with a free jejunal segment, the first successful free tissue transfer.\nA — Omentum to scalp (McLean & Buncke, 1972) came later.\nC — Later era.\nD — Later era.\nE — Later era.\nExam tip: First free tissue transfer = jejunum (1959); first free flap from a 'modern' microsurgery series = groin flap (Daniel & Taylor, 1973).\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 1}, {"s": "An angiosome is:", "o": ["A vascular malformation", "A vessel coupling device", "A three-dimensional tissue territory supplied by a source (segmental) artery", "A peripheral vascular link between muscle and skin", "A neovascularization mediator"], "k": "C", "x": "Taylor & Palmer's angiosome concept: composite block of tissue (skin to bone) fed by one source artery; the basis of perforator flap design.\nA — Unrelated.\nB — That is a microvascular coupler.\nD — That describes a musculocutaneous perforator.\nE — That would be VEGF etc.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 2}, {"s": "Donor-vessel atherosclerosis is most often found in which artery?", "o": ["Thoracodorsal", "Radial", "Deep inferior epigastric", "Deep circumflex iliac", "Peroneal"], "k": "E", "x": "Lower-limb vessels are most affected by peripheral vascular disease, so the fibula's peroneal pedicle is the most frequently diseased.\nA — Rarely diseased.\nB — Rarely diseased; check Allen's test for arch continuity instead.\nC — Rarely diseased.\nD — Less affected than leg vessels.\nExam tip: Pre-op CTA/MRA of the legs before fibula harvest; peronea arteria magna is a contraindication.\nCh 9 · Free tissue transfer · Cummings 7th, Scott-Brown 8th", "b": "Ch 9", "n": 3}, {"s": "Prior radiation to the recipient site for free tissue transfer:", "o": ["Causes wall thickening, fibrosis and intimal fragility", "Contraindicates free flaps", "Significantly raises thrombosis rates", "Does not affect healing since the flap brings fresh vascularity", "Has no effect on veins"], "k": "A", "x": "Irradiated vessels show intimal damage and fibrosis, making handling and suturing harder.\nB — Free flaps are often the treatment of choice in irradiated fields.\nC — Most series show no significant increase in thrombosis with careful technique.\nD — Recipient-bed healing is still impaired.\nE — Veins are affected too, becoming fibrotic and fragile.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 4}, {"s": "Regarding the rheologic agent pentastarch:", "o": ["Inhibits rouleaux formation", "Expands intravascular volume", "Has few adverse reactions", "Does not salvage a failing flap", "All of the above"], "k": "E", "x": "Book: hydroxyethyl starch reduces viscosity, expands volume and is well tolerated, but cannot rescue a mechanically failing flap.\nUpdate: Update: hydroxyethyl starch products now carry FDA/EMA warnings (acute kidney injury, coagulopathy, mortality in critically ill/septic patients). 'Few adverse reactions' (C) is no longer accepted; HES is not used for flap optimization today.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 5}, {"s": "The most effective way to overcome vessel spasm is:", "o": ["Warming the patient", "Gentle mechanical dilation", "Topical papaverine", "Topical lidocaine", "Low-dose phenylephrine"], "k": "B", "x": "Gentle dilation with vessel dilators reliably breaks spasm; pharmacologic agents are adjuncts.\nA — Helps systemically but is slow.\nC — Useful adjunct, less reliable.\nD — Adjunct.\nE — A vasoconstrictor; worsens spasm.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 6}, {"s": "Factors in free flap failure include:", "o": ["Anastomotic technique", "Pedicle compression", "Pedicle kinking or twisting", "Vein grafts to bridge defects", "All of the above"], "k": "E", "x": "All are recognized causes; technical and pedicle geometry problems dominate.\nExam tip: Venous thrombosis is the commonest cause of failure, usually within the first 48–72 h.\nCh 9 · Free tissue transfer · Cummings 7th, Scott-Brown 8th", "b": "Ch 9", "n": 7}, {"s": "Because of necrosis, flap salvage is unlikely to succeed after how many hours?", "o": ["1", "3", "6", "8", "12"], "k": "C", "x": "Book key: about 6 hours of ischemia; salvage rates fall sharply after that, so early re-exploration is the rule.\nA — Too early.\nB — Still salvageable.\nD — Beyond the window.\nE — Beyond the window.\nExam tip: Hourly flap checks in the first 24–48 h exist because rapid return to theatre is what saves flaps.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 8}, {"s": "Appropriate free flap donor sites for tongue reconstruction include:", "o": ["Anterolateral/lateral thigh", "Lateral arm", "Radial forearm", "Latissimus dorsi", "All of the above"], "k": "E", "x": "Choice depends on volume: RFFF for partial glossectomy, ALT/LD/rectus for total glossectomy.\nExam tip: Total glossectomy needs bulk (ALT, rectus) to contact the palate for swallowing and speech.\nCh 9 · Free tissue transfer · Cummings 7th, Scott-Brown 8th", "b": "Ch 9", "n": 9}, {"s": "Endoscopic harvest has been reported for which free flaps?", "o": ["Jejunum, rectus abdominis, latissimus dorsi", "Jejunum, rectus abdominis, radial forearm", "Jejunum, rectus abdominis, gastrocnemius", "Gastro-omentum", "Temporoparietal"], "k": "A", "x": "Laparoscopic jejunum and rectus, and endoscopic latissimus harvests were all described.\nB — Radial forearm is not endoscopically harvested.\nC — Gastrocnemius is not a standard head and neck free flap.\nD — Incomplete.\nE — Not a free flap in this context.\nCh 9 · Free tissue transfer · Cummings 7th", "b": "Ch 9", "n": 10}, {"s": "TGF-β stimulates keratinocyte:", "o": ["Replication", "Migration", "Both", "Neither"], "k": "B", "x": "TGF-β promotes keratinocyte migration but inhibits their proliferation.\nA — TGF-β is antiproliferative for keratinocytes.\nC — Only migration.\nD — Migration is stimulated.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 11}, {"s": "Which is NOT a reliable marker of malnutrition?", "o": ["Transferrin", "Total lymphocyte count", "Erythrocyte volume", "Albumin"], "k": "C", "x": "Low albumin, low transferrin and low total lymphocyte count are the classic markers; erythrocyte volume is not.\nA — Marker (low).\nB — Marker (low).\nD — Marker (low).\nUpdate: The book stem is garbled ('reliably assessed by increased...'). The key only makes sense as an EXCEPT question, so it is reworded here. Prealbumin (short half-life) is the best marker of acute change.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 12}, {"s": "The myofibroblast response to histamine resembles that of:", "o": ["Endothelial cells", "Fibroblasts", "Smooth muscle cells", "Macrophages"], "k": "C", "x": "Myofibroblasts contain actin-myosin and contract like smooth muscle; they drive wound contraction.\nA — Different response.\nB — Ordinary fibroblasts do not contract this way.\nD — Phagocytes.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 13}, {"s": "The first priority after injury is:", "o": ["Wound debridement", "Hemostatic plug formation", "Neovascularization", "Inflammatory response"], "k": "B", "x": "Hemostasis comes first; the platelet plug also releases the growth factors (PDGF, TGF-β) that start healing.\nA — Clinical step, not biological priority.\nC — Proliferative phase.\nD — Follows hemostasis.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 14}, {"s": "Antibodies blocking which factor reduce collagen deposition experimentally?", "o": ["FGF", "PDGF", "IL-1", "TGF-β"], "k": "D", "x": "TGF-β is the master profibrotic cytokine; blocking it reduces collagen and scarring.\nA — Mainly angiogenic.\nB — Chemotactic/mitogenic.\nC — Inflammatory.\nExam tip: TGF-β3 is anti-scarring; TGF-β1 and β2 are profibrotic (keloids).\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 15}, {"s": "Hydrogen cyanide in cigarette smoke:", "o": ["Inhibits oxidative enzymes", "Reduces hemoglobin O₂ carriage", "Causes vasoconstriction", "Blocks growth factors at the cell surface"], "k": "A", "x": "Cyanide blocks cytochrome oxidase, impairing cellular respiration.\nB — That is carbon monoxide.\nC — That is nicotine.\nD — Not its mechanism.\nExam tip: Smoking triad: nicotine = vasoconstriction, CO = hypoxia, HCN = enzyme inhibition.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 16}, {"s": "Wounds in an irradiated bed show:", "o": ["Inhibited collagen production", "Normal-looking but fewer vessels", "Neutrophil injury", "All of the above"], "k": "A", "x": "Radiation damages fibroblasts, reducing collagen synthesis.\nB — Vessels are abnormal (endarteritis obliterans), not normal.\nC — Not the main feature.\nD — B is false.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 17}, {"s": "Tension in wound closure can produce:", "o": ["Decreased tensile strength", "Narrow scars", "Keloids", "Hypertrophic scars"], "k": "D", "x": "Tension stimulates excess collagen within the wound boundaries: hypertrophic scarring and widening.\nA — Not the classic result.\nB — Scars widen.\nC — Keloids are genetic and extend beyond wound margins.\nCh 10 · Wound healing · Cummings 7th", "b": "Ch 10", "n": 18}, {"s": "Laser energy is produced when:", "o": ["An electron stays in a low-energy shell", "A photon strikes an excited atom, accelerating its drop to a lower state", "An atom is raised to a higher state by a photon", "Light is collimated by mirrors"], "k": "B", "x": "Stimulated emission: an incident photon triggers an excited atom to release an identical photon.\nA — No emission.\nC — That is absorption (pumping).\nD — Mirrors amplify; they do not create laser light.\nCh 11 · Lasers · Cummings 7th", "b": "Ch 11", "n": 19}, {"s": "Appropriate Nd:YAG uses include all EXCEPT:", "o": ["Palliation of obstructing tracheobronchial lesions", "Coagulation of vascular lesions", "Fiberoptic delivery", "Microlaryngeal excision of benign vocal fold lesions"], "k": "D", "x": "Nd:YAG penetrates deeply (up to 4 mm) with significant scatter; unsuitable for precise vocal fold surgery.\nA — Classic use.\nB — Classic use.\nC — Advantage of Nd:YAG.\nCh 11 · Lasers · Cummings 7th", "b": "Ch 11", "n": 20}, {"s": "Which lasers emit in the invisible infrared range?", "o": ["CO₂", "Argon", "KTP", "Nd:YAG", "A and D"], "k": "E", "x": "CO₂ 10,600 nm and Nd:YAG 1,064 nm are infrared.\nB — Visible blue-green (488–514 nm).\nC — Visible green (532 nm).\nExam tip: Invisible beams need a visible aiming beam (helium-neon).\nCh 11 · Lasers · Cummings 7th", "b": "Ch 11", "n": 21}, {"s": "Safety measures for CO₂ laser airway surgery include:", "o": ["Red rubber endotracheal tube", "FiO₂ below 40% with an ETT", "Nitrous oxide to lower FiO₂", "Wet cottonoids to protect a standard PVC tube"], "k": "B", "x": "Lower oxygen concentration reduces combustion risk.\nA — Red rubber is flammable.\nC — N₂O supports combustion.\nD — Cottonoids protect the cuff, but PVC tubes are not laser-safe.\nUpdate: Minor update: current ASA operating-room fire guidance recommends the lowest FiO₂ tolerated, ideally ≤30%, with laser-safe tubes and saline-filled cuffs.\nCh 11 · Lasers · Cummings 7th", "b": "Ch 11", "n": 22}, {"s": "CO₂ laser advantages over non-laser techniques include all EXCEPT:", "o": ["Better hemostasis than scalpel", "Better overall wound healing", "Greater precision in the tracheobronchial tree", "Less edema than electrocautery"], "k": "B", "x": "Laser wounds heal more slowly due to the thermal damage zone.\nA — True advantage.\nC — True advantage.\nD — True advantage.\nCh 11 · Lasers · Cummings 7th", "b": "Ch 11", "n": 23}, {"s": "The first successful public demonstration of general anesthesia is credited to:", "o": ["Wells", "Morton", "Snow", "Simpson"], "k": "B", "x": "William Morton, ether, Massachusetts General Hospital, 1846.\nA — Wells's nitrous oxide demonstration (1845) failed.\nC — Snow: chloroform for Queen Victoria.\nD — Simpson: introduced chloroform.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 24}, {"s": "Which is NOT part of the classic triad of general anesthesia?", "o": ["Amnesia", "Analgesia", "Narcosis", "Relaxation"], "k": "A", "x": "Classic triad: narcosis (unconsciousness), analgesia, muscle relaxation.\nB — Part of triad.\nC — Part of triad.\nD — Part of triad.\nExam tip: Modern definitions add amnesia and reflex suppression; this item tests the classic triad.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 25}, {"s": "Vomiting, laryngospasm, breath-holding and violent movement are risks in which stage?", "o": ["I", "II", "III", "IV"], "k": "B", "x": "Stage II (excitement/delirium) is the dangerous stage during induction and emergence.\nA — Analgesia.\nC — Surgical anesthesia.\nD — Overdose/medullary paralysis.\nExam tip: Never extubate in stage II: deep or fully awake.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 26}, {"s": "Which stage is never entered in a well-conducted anesthetic?", "o": ["I", "II", "III", "IV"], "k": "D", "x": "Stage IV is medullary depression and cardiorespiratory arrest.\nA — Always passed.\nB — Passed briefly.\nC — Target stage.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 27}, {"s": "The prime purpose of premedication is:", "o": ["Amnesia", "Pain relief", "Vagal blockade", "Anxiety relief"], "k": "D", "x": "Anxiolysis is the universal aim; others are situational.\nA — Secondary.\nB — Secondary.\nC — Specific indications only (e.g., children, oculocardiac reflex).\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 28}, {"s": "Which post-op need contraindicates day-case surgery?", "o": ["Diabetes needing insulin", "Pain needing IV analgesia", "Angina needing oral nitrates", "Hypertension needing β-blockers"], "k": "B", "x": "Pain that requires parenteral analgesia cannot be managed at home.\nA — Manageable at home.\nC — Manageable at home.\nD — Manageable at home.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 29}, {"s": "Which device may be a fire hazard with an airway laser?", "o": ["Metal spiral ETT", "Silicone-coated metal spiral ETT", "Sanders venturi injector", "Carden cuffed venturi tube"], "k": "D", "x": "The Carden tube's plastic cuff and tubing are combustible.\nA — Metal is non-combustible.\nB — Book counts it as protected.\nC — Metal jet needle, no plastic in the field.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 30}, {"s": "In an airway fire, which action comes first (per the book)?", "o": ["Stop oxidant gases", "Remove burning material", "Alert everyone in theatre", "Quench the fire"], "k": "C", "x": "Book key: announce the fire so the team acts together.\nA — Part of the simultaneous response.\nB — Part of the simultaneous response.\nD — Part of the simultaneous response.\nExam tip: ASA fire algorithm: announce the fire, then simultaneously remove the ETT, stop all airway gases, remove flammables and pour saline. Then re-ventilate, re-intubate and bronchoscope.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 31}, {"s": "An unrousable patient in recovery becomes increasingly restless. What to exclude first?", "o": ["Full bladder", "Hypoxia", "Hypovolemia", "Pain"], "k": "B", "x": "Restlessness is hypoxia until proven otherwise; it is the immediately lethal cause.\nA — Common but not lethal.\nC — Check after oxygenation.\nD — Treat after excluding hypoxia.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 32}, {"s": "How should most intubated patients with an anticipated difficult airway be extubated?", "o": ["Routine tracheotomy before emergence", "Trial extubation, emergency trach if needed", "Awake extubation over a tube exchanger/guide", "Keep intubated 24 h then review"], "k": "C", "x": "Awake extubation over an airway exchange catheter keeps a conduit for rapid re-intubation.\nA — Overtreatment for most.\nB — Unsafe.\nD — Does not solve the problem.\nExam tip: DAS extubation guidelines: 'at-risk' extubation over an exchange catheter, with a plan B.\nCh 12 · Anesthesia & airway · Cummings 7th", "b": "Ch 12", "n": 33}, {"s": "The MHC (self vs non-self) genes are on chromosome:", "o": ["5", "13", "6", "10", "21"], "k": "C", "x": "The HLA/MHC complex is on chromosome 6p.\nA — Wrong.\nB — Wrong.\nD — Wrong.\nE — Wrong.\nCh 13 · Allergy & immunology · Scott-Brown 8th", "b": "Ch 13", "n": 34}, {"s": "All these progenitors complete development in the bone marrow EXCEPT:", "o": ["Mast cell", "T lymphocyte", "B lymphocyte", "Eosinophil", "Monocyte/macrophage"], "k": "B", "x": "T-cell precursors mature in the thymus.\nA — Mast cells finish maturing in tissue, but the book counts marrow origin.\nC — B cells mature in marrow.\nD — Marrow.\nE — Marrow.\nCh 13 · Allergy & immunology · Scott-Brown 8th", e"], "k": "E", "x": "Early phase (minutes, mast cell mediators), late phase (4–8 h, eosinophils), ongoing inflammation and priming.\nCh 13 · Allergy & immunology · Scott-Brown 8th", "b": "Ch 13", "n": 41}, {"s": "Man with AIDS, 10 days of unilateral facial pain and fever despite co-amoxiclav. Which statement is FALSE?", "o": ["CT sinuses to look for bone erosion", "Nasal endoscopy and antral tap for culture", "Start anti-pseudomonal antibiotics pending cultures, with close follow-up", "No fungus in antral lavage excludes invasive fungal sinusitis, so biopsy is unnecessary", "A, B and C"], "k": "D", "x": "A, B and C are correct steps. D is false: invasive fungal sinusitis is diagnosed by tissue biopsy showing invasion; negative lavage does not exclude it.\nA — Correct step.\nB — Correct step.\nC — Correct: Pseudomonas is common in AIDS sinusitis.\nCh 14 · HIV in H&N · Cummings 7th, Scott-Brown 8th", "b": "Ch 14", "f": "Key corrected: the book key is E; the current answer is D. Book key (E) contradicts its own stem. E lists the TRUE statements; the FALSE one is D. Answer D.", "n": 42}, {"s": "Characteristic imaging in invasive fungal sinusitis (CT / T1 / T2):", "o": ["Enhancing erosive / hypo / hyper", "Enhancing erosive / iso / hypo", "Non-enhancing erosive / iso / hypo", "Non-enhancing erosive / hyper / hyper"], "k": "C", "x": "Devitalized, non-enhancing tissue with bone erosion; fungal elements (manganese, iron) give T2 hypointensity.\nA — T2 bright = inflammation/fluid.\nB — Enhancing tissue is viable.\nD — T2 bright.\nExam tip: Loss of contrast enhancement on MRI ('black turbinate') is the earliest sign of acute invasive fungal sinusitis.\nCh 14 · HIV in H&N · Scott-Brown 8th, Cummings 7th", "b": "Ch 14", "n": 43}, {"s": "HIV patient with 1 month of otorrhea and worsening otalgia despite drops. Differential includes:", "o": ["Cholesteatoma/otomastoiditis", "Necrotizing otitis externa", "Invasive Aspergillus of the temporal bone", "Pneumocystis of the temporal bone", "All of the above"], "k": "E", "x": "All occur in HIV; Pneumocystis can present as an aural polyp.\nCh 14 · HIV in H&N · Cummings 7th", "b": "Ch 14", "n": 44}, {"s": "Regarding otosyphilis, which is true?", "o": ["Negative VDRL always excludes it", "Previous treatment excludes it", "Negative FTA-ABS excludes it", "Treatment is one dose of IM penicillin"], "k": "C", "x": "Treponemal tests (FTA-ABS) stay positive for life; a negative result effectively excludes late/otosyphilis.\nA — Non-treponemal tests become negative in late disease.\nB — Re-infection or inadequate treatment occurs.\nD — Treat as neurosyphilis: IV penicillin G 10–14 days, often with steroids.\nCh 14 · HIV in H&N · Cummings 7th, KJ Lee 12th", "b": "Ch 14", "n": 45}, {"s": "AIDS patient: 4 days frontal headache then sudden profound left SNHL. Initial management includes all EXCEPT:", "o": ["Serum cryptococcal antigen", "MRI brain", "Lumbar puncture", "Serum and CSF FTA-ABS/VDRL", "Empiric steroids"], "k": "E", "x": "Headache plus SNHL in AIDS = cryptococcal meningitis or neurosyphilis until proven otherwise. Empiric steroids worsen cryptococcal outcomes.\nA — Essential.\nB — Essential.\nC — Essential (with opening pressure).\nD — Essential.\nCh 14 · HIV in H&N · Cummings 7th", "b": "Ch 14", "n": 46}, {"s": "CSF findings in cryptococcal meningitis (per the book):", "o": ["Raised opening pressure", "Low glucose", "Encapsulated budding yeast on India ink", "Raised protein and cells", "A, C and D"], "k": "E", "x": "Book: high opening pressure, India ink positive, raised protein and cells.\nUpdate: Low glucose (B) is also common. In advanced AIDS the CSF may be bland, with few cells and normal protein. CSF cryptococcal antigen (lateral flow) is now the preferred test over India ink.\nCh 14 · HIV in H&N · Cummings 7th", "b": "Ch 14", "n": 47}, {"s": "Treatment of acute necrotizing ulcerative gingivitis includes all EXCEPT:", "o": ["Debridement of necrotic tissue", "Antibiotics covering anaerobes", "Per lso Shamsan Q13) · Cummings 7th", "b": "Ch 15", "n": 2}, {"s": "Age-related nasal changes include:", "o": ["Fewer nasal cilia", "Faster mucociliary clearance", "Loss of olfactory epithelium", "Lower nasal resistance", "General autonomic decline"], "k": "C", "x": "Olfactory epithelium is replaced by respiratory epithelium with age: presbyosmia.\nA — Cilia number is largely preserved; function slows.\nB — Clearance slows.\nD — Resistance rises (cartilage and tip ptosis).\nE — Not the defined change.\nCh 15 · Geriatrics (also Shamsan Q14) · Cummings 7th", "b": "Ch 15", "n": 3}, {"s": "Lowering of fundamental frequency in aging women is mostly due to:", "o": ["Edema from endocrine (post-menopausal) changes", "Previous intubation", "Essential tremor", "Cricoarytenoid fixation", "More hyaluronic acid"], "k": "A", "x": "Post-menopausal hormonal change causes vocal fold edema and mass increase, lowering pitch.\nB — Not typical.\nC — Causes tremor, not lowering.\nD — Uncommon.\nE — Decreases with age.\nExam tip: Aging men's pitch rises (atrophy, bowing); women's falls.\nCh 15 · Geriatrics (also Shamsan Q15) · Cummings 7th", "b": "Ch 15", "n": 4}, {"s": "Factors in presbydysphonia include all EXCEPT:", "o": ["Reduced vital capacity", "Antidepressants", "Prior intubation", "Reduced salivary flow", "Laryngeal elevation from calcification"], "k": "E", "x": "The larynx descends with age; it does not rise.\nA — Factor.\nB — Factor (drying).\nC — Factor.\nD — Factor.\nCh 15 · Geriatrics (also Shamsan Q16) · Cummings 7th", "b": "Ch 15", "n": 5}, {"s": "Formation of mRNA from a DNA template is:", "o": ["Transfection", "Translation", "Transcription", "Transformation", "Truncation"], "k": "C", "x": "DNA → mRNA = transcription; mRNA → protein = translation.\nA — Introducing DNA into cells.\nB — Protein synthesis.\nD — Uptake of DNA by bacteria or malignant change.\nE — Shortening.\nCh 16 · Molecular biology · Cummings 7th", "b": "Ch 16", "n": 6}, {"s": "'Negative regulator' genes that inhibit abnormal proliferation are:", "o": ["Oncogenes", "Anti-genes", "Housekeeping genes", "Tumor-suppressor genes", "Tumor-inhibitory genes"], "k": "D", "x": "Tumor suppressors (p53, Rb, p16) brake the cell cycle; loss of both alleles promotes cancer.\nA — Gain-of-function drivers.\nB — Not a term.\nC — Basic cell maintenance.\nE — Not the term.\nCh 16 · Molecular biology · Cummings 7th", "b": "Ch 16", "n": 7}, {"s": "Replacing a defective DNA region with a transferred functional sequence is:", "o": ["Transfection", "Transduction", "Homologous recombination", "Gene transfer", "Genetic recalibration"], "k": "C", "x": "Homologous recombination swaps matching sequences, correcting the gene in place.\nA — Non-viral entry only.\nB — Viral entry only.\nD — General term.\nE — Not a term.\nExam tip: CRISPR-Cas9 editing relies on this repair pathway (HDR).\nCh 16 · Molecular biology · Cummings 7th", "b": "Ch 16", "n": 8}, {"s": "The first viral vector studied in animals and used in humans was:", "o": ["Herpes virus", "Adenovirus", "Avipox", "Vaccinia", "Retrovirus"], "k": "E", "x": "Retroviral vectors were used in the first human gene therapy (ADA-SCID, 1990).\nA — Later.\nB — Later.\nC — Vaccine vector.\nD — Vaccine vector.\nCh 16 · Molecular biology · Cummings 7th", "b": "Ch 16", "n": 9}, {"s": "Which vector gives the highest titers and most efficient transfer in vitro and in vivo?", "o": ["HSV", "AAV", "Adenovirus", "Retrovirus", "Baculovirus"], "k": "C", "x": "Adenovirus reaches very high titers and infects dividing and non-dividing cells.\nA — Neurotropic.\nB — Lower titers, small capacity.\nD — Infects dividing cells only, lower titers.\nE — Insect virus.\nCh 16 · Molecular biology · Cummings 7th", "b": "Ch 16", "n": 10}, {"s": "Per the book, the most frequently altered gene in HNSCC is:", "o": ["Ras", "Rb", "p53", "p16", "p21"], "k": "D", "x": "p16 (CDKN2A, 9p21) is inactivated by deletion, mutation or methylation in most HNSCC.\nA — Rare in HNSCC.\nB — Pathway affected, gene rarely mutated.\nC — Second in this framing.\nE — Rarely altered.\nUpdate: By DNA mutation alone (TCGA 2015), TP53 is the most frequently mutated gene (~70–85% of HPV-negative HNSCC). p16 wins only when counting all alterations (deletion, methylation). Know both answers.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th, Scott-Brown 8th", "b": "Ch 17", "n": 11}, {"s": "The central dogma of molecular biology implies:", "o": ["Changes in cell appearance and behavior arise ultimately from DNA changes", "All mutations cause cancer", "All cancer is carcinogen-induced", "Post-transcriptional factors play no role", "Only cancer propensity is inheritable"], "k": "A", "x": "DNA → RNA → protein: phenotype traces back to DNA.\nB — Most mutations are silent.\nC — Many causes.\nD — They do play a role.\nE — Unrelated.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 12}, {"s": "Function of p16:", "o": ["Induces apoptosis", "Phosphorylates Rb directly", "Inhibits the cyclin-dependent kinase that phosphorylates Rb", "Controls p53", "Controls p21"], "k": "C", "x": "p16 inhibits CDK4/6–cyclin D, keeping Rb active and blocking G1/S.\nA — p53 function.\nB — That is CDK4/6.\nD — That is p14ARF/MDM2.\nE — p53 induces p21.\nExam tip: In HPV+ cancer, E7 inactivates Rb, so p16 is overexpressed. That is why p16 IHC is the HPV surrogate (AJCC 8th).\nCh 17 · Molecular biology of H&N tumors · AJCC 8th, Cummings 7th", "b": "Ch 17", "n": 13}, {"s": "Knudson's hypothesis states:", "o": ["When one tumor-suppressor allele is mutated, the other is often deleted", "When one oncogene copy is amplified the other is mutated", "One allele methylated, the other mutated", "Both copies are usually deleted", "Deletion of one copy is often inherited"], "k": "A", "x": "Two-hit model: both alleles of a tumor suppressor must be inactivated, often mutation plus loss of heterozygosity.\nB — Oncogenes need one hit.\nC — Possible mechanism, not the hypothesis as stated.\nD — Not the classic statement.\nE — That is the familial (retinoblastoma) case, not the hypothesis.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 14}, {"s": "Regarding the oncogenic role of HPV in HNSCC:", "o": ["Oncogenic subtypes cause cancer", "Oncogenic E6 binds and degrades p53", "HPV DNA in tumor cells is actively transcribed", "Non-oncogenic strains are never found in cancer", "E7 binds p16"], "k": "B", "x": "E6 degrades p53 via ubiquitin ligase; E7 inactivates Rb.\nC — Book considered this unproven.\nD — False.\nE — E7 binds Rb, not p16.\nUpdate: A is now established too: HPV-16 is causal for most oropharyngeal SCC, recognized as a separate entity in AJCC 8th. B remains the best mechanistic answer.\nCh 17 · Molecular biology of H&N tumors · AJCC 8th, NCCN H&N", "b": "Ch 17", "n": 15}, {"s": "Which oncogene is both amplified and overexpressed in many HNSCCs?", "o": ["PRAD-1 (cyclin D1)", "Raf", "Myc", "Ras", "Neu"], "k": "A", "x": "Cyclin D1 (11q13) amplification occurs in ~30–40% and predicts poor prognosis.\nB — Rare.\nC — Less frequent.\nD — Rare in Western HNSCC.\nE — Rare.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 16}, {"s": "Antitumor functions of p53 include:", "o": ["Inhibiting basement membrane breakdown", "Apoptosis after severe cell injury", "Inhibiting motility", "Inhibiting metastasis", "Controlling p16"], "k": "B", "x": "'Guardian of the genome': G1 arrest via p21, or apoptosis if damage is irreparable.\nA — Not its role.\nC — Not its role.\nD — Not its role.\nE — Independent pathways.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 17}, {"s": "Microsatellite markers are:", "o": ["Repeats within transcribed genes", "Short repeats identical across the population", "Transcription control regions", "Methylation sites", "Highly polymorphic short repeats scattered across the genome"], "k": "E", "x": "Their polymorphism allows detection of loss of heterozygosity.\nA — Mostly non-coding.\nB — They vary between people.\nC — Not by definition.\nD — Not by definition.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 18}, {"s": "Relationship between p16 and p53:", "o": ["p16 induces p53", "p53 induces p16", "None", "p16 inhibits p53", "Both are upstream regulators of Rb"], "k": "E", "x": "p16 inhibits CDK4/6 directly; p53 induces p21, which inhibits CDKs. Both keep Rb hypophosphorylated.\nA — Not direct.\nB — Not direct.\nC — They converge on Rb.\nD — Not direct.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 19}, {"s": "An exon is:", "o": ["The whole coding region", "A three-base codon", "Non-transcribed DNA cut out", "A coding segment separated from others by introns", "Regulatory DNA outside a gene"], "k": "D", "x": "Exons are retained in mature mRNA; introns are spliced out.\nA — Too broad.\nB — That is a codon.\nC — Introns are transcribed then spliced.\nE — That is a promoter/enhancer.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 20}, {"s": "An epigenetic event contributing to cancer is:", "o": ["Methylation", "Point mutation", "Replication", "Deletion", "Insertion"], "k": "A", "x": "Promoter hypermethylation silences genes (e.g., p16) without changing DNA sequence.\nB — Genetic.\nC — Normal process.\nD — Genetic.\nE — Genetic.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 21}, {"s": "PCR accomplishes:", "o": ["Gene sequencing", "Linking exons", "Making many copies of a selected DNA fragment", "Cleaving DNA at target sites", "Identifying tumor-specific DNA loss"], "k": "C", "x": "Exponential amplification of a target sequence.\nA — Sequencing is separate.\nB — Splicing.\nD — Restriction enzymes.\nE — LOH analysis uses PCR but is not PCR.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th", "b": "Ch 17", "n": 22}, {"s": "In the HNSCC progression model, an early event is:", "o": ["LOH of 9p", "p53 mutation", "LOH of 14q", "LOH of 8p", "p16 methylation"], "k": "A", "x": "Califano model: 9p21 loss is the earliest step (hyperplasia), then 3p and 17p (p53) in dysplasia.\nB — Later (dysplasia).\nC — Later.\nD — Later.\nE — Mechanism, not the defined early event.\nExam tip: Sequence: 9p → 3p/17p → 11q/13q/14q → 6p/8/4q.\nCh 17 · Molecular biology of H&N tumors · Cummings 7th, Scott-Brown 8th", "b": "Ch 17", "n": 23}, {"s": "Geographic variation in treatment rates is explained by differing disease prevalence or severity. True or false?", "o": ["True", "False"], "k": "B", "x": "Wennberg's small-area analyses show variation reflects practice style, not disease burden.\nA — Disproven.\nCh 18 · Outcomes research · Cummings 7th", "b": "Ch 18", "n": 24}, {"s": "Which design is NOT typical of outcomes research?", "o": ["Prospective observational studies", "Randomized controlled trials", "Large-database secondary analyses", "Meta-analysis and consensus methods"], "k": "B", "x": "RCTs measure efficacy under ideal conditions; outcomes research measures effectiveness in real practice.\nA — Typical.\nC — Typical.\nD — Typical.\nExam tip: Pragmatic RCTs now blur this line.\nCh 18 · Outcomes research · Cummings 7th", "b": "Ch 18", "n": 25}, {"s": "Which is NOT part of an 'expanded' definition of outcome?", "o": ["Patient satisfaction", "Health-related quality of life", "5-year survival", "Cost-effectiveness"], "k": "C", "x": "Survival is the traditional outcome; the expanded definition adds patient-centered and economic measures.\nA — Expanded.\nB — Expanded.\nD — Expanded.\nCh 18 · Outcomes research · Cummings 7th", "b": "Ch 18", "n": 26}, {"s": "Which is NOT a key feature of outcomes research?", "o": ["Comparing diverse therapies for one illness", "Expanded outcome definition", "Efficacy of one specific treatment", "Central role of the patient"], "k": "C", "x": "Efficacy of a single treatment is the domain of RCTs.\nA — Feature.\nB — Feature.\nD — Feature.\nCh 18 · Outcomes research · Cummings 7th", "b": "Ch 18", "n": 27}, {"s": "Methodologic requirements for sound outcomes research include:", "o": ["Clear diagnostic criteria", "Measuring comorbidity", "Outcome measures that include the patient's perspective", "A clinical-severity index for stratification", "All of the above"], "k": "E", "x": "All are needed to compare like with like.\nExam tip: Comorbidity indices: Charlson, ACE-27 (H&N-specific).\nCh 18 · Outcomes research · Cummings 7th", "b": "Ch 18", "n": 28}, {"s": "Extent of treatment for HIV-positive patients should be based on:", "o": ["Risk to nurses", "Presence of HIV", "Benefit of treatment", "Risk to surgeon", "Ultimate disease outcome"], "k": "C", "x": "Treatment decisions follow expected benefit, as for any patient; refusal on HIV status is discrimination.\nA — Handled by universal precautions.\nB — Not a criterion.\nD — Handled by precautions.\nE — Not a sole criterion.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 29}, {"s": "A third party refuses funding for treatment you consider essential to survival. Per the book:", "o": ["You are no longer responsible", "The provider need not absorb unaffordable cost", "You must refer to an academic center for free care", "Tell the patient to see a lawyer", "Treat, then justify afterward to secure funding"], "k": "E", "x": "Book: the physician's duty to the patient comes first; treat and advocate for funding.\nA — Abandonment.\nB — Book rejects this.\nC — Not obligatory.\nD — Inappropriate.\nExam tip: Underlying principle: physicians must advocate and must not abandon the patient. Local health-system rules shape the practical route.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 30}, {"s": "Per AMA guidance, managed-care financial incentives to physicians:", "o": ["Are not permitted", "Must be disclosed to patients if care is limited", "Are unlimited", "Are best set individually", "Depend only on service quantity"], "k": "B", "x": "Transparency is required when incentives may limit care.\nA — Permitted with limits.\nC — Limited.\nD — Should be set at group level.\nE — Not the rule.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 31}, {"s": "Patient autonomy over personal information:", "o": ["May be overridden for research", "Is communitarian in basis", "Must never be breached, even for public health", "May be overridden to prevent harm to identifiable others", "Is founded on rights-based analysis"], "k": "D", "x": "Confidentiality yields when an identifiable third party faces serious harm (Tarasoff principle).\nA — Needs consent/ethics approval.\nB — It is individualist.\nC — Public-health reporting overrides it.\nE — Book prefers D.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 32}, {"s": "An argument against genetic diagnosis of heritable conditions: patients may avoid preventive checks for fear of diagnosis. True or false?", "o": ["True", "False"], "k": "A", "x": "Fear of labeling can deter screening.\nB — It is a recognized concern.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 33}, {"s": "An argument against genetic diagnosis: insurers may deny coverage as a pre-existing condition. True or false?", "o": ["True", "False"], "k": "A", "x": "Genetic discrimination is a recognized concern.\nB — Concern is real.\nUpdate: Context: in the US, GINA (2008) bars health insurers and employers from genetic discrimination, but not life or long-term-care insurers. The argument still stands as an ethical point.\nCh 19 · Ethics · Cummings 7th", "b": "Ch 19", "n": 34}, {"s": "A 95% confidence interval:", "o": ["Estimates bias", "Estimates accuracy", "Gives the range of results consistent with the data", "Defines power", "Calculates sample size"], "k": "C", "x": "It is the range of plausible true values given the data; it reflects precision.\nA — CIs do not measure bias.\nB — Precision, not accuracy.\nD — Different concept.\nE — Different concept.\nCh 20 · Interpreting data · Cummings 7th", "b": "Ch 20", "n": 35}, {"s": "Satisfaction survey completed after each office visit. Direction of inquiry:", "o": ["Cross-sectional", "Retrospective", "Prospective", "Longitudinal", "Latitudinal"], "k": "A", "x": "Each survey captures a single point in time, with no follow-up of the same subjects forward or backward.\nB — No look-back.\nC — No follow-up of exposure to outcome.\nD — No repeated measures on the same cohort.\nE — Not a design.\nCh 20 · Interpreting data · Cummings 7th", "b": "Ch 20", "n": 36}, {"s": "Per the book, the P value measures:", "o": ["Clinical significance", "Clinical importance", "Degree of bias", "Probability of type II error", "Probability of a true hypothesis"], "k": "E", "x": "Book key E.\nA — P says nothing about clinical relevance.\nB — Same.\nC — P does not measure bias.\nD — Type II = β (relates to power).\nUpdate: Strictly, none of the options is correct. The P value is the probability of results at least as extreme as observed if the null hypothesis is true, i.e., the chance of a type I error if you reject H₀. It is NOT the probability that any hypothesis is true. Choose E only to match the book.\nCh 20 · Interpreting data · Cummings 7th", "b": "Ch 20", "n": 37}, {"s": "An RCT finds no difference between a new and standard antihistamine. A real difference may have been missed (type II error) if the sample was:", "o": ["Equal in both groups", "Larger in the new-drug group", "Larger in the standard group", "Too small for adequate power", "Too large for adequate power"], "k": "D", "x": "Underpowered studies commonly miss true differences.\nA — Ideal design.\nB — Not the cause.\nC — Not the cause.\nE — Larger samples increase power.\nCh 20 · Interpreting data · Cummings 7th", "b": "Ch 20", "n": 38}, {"s": "Hearing thresholds measured before and after a new chemotherapy drug in the same subjects. Correct test:", "o": ["ANOVA", "Paired t-test", "Independent t-test", "Chi-square for trend", "Chi-square for contingency tables"], "k": "B", "x": "Same subjects, two time points,
