", "Progress to SCC or BCC in 5–20%", "Are best treated with RT", "Spread by satellites", "None of the above"], "k": "B", "x": "Book key B: AKs are premalignant.\nA — UV-induced.\nC — First line: cryotherapy, topical 5-FU, imiquimod, photodynamic therapy.\nD — No.\nUpdate: Refinements: AKs progress to SCC, not BCC. The per-lesion annual transformation risk is low (~0.1–0.6%), although up to ~60% of cutaneous SCCs arise from an AK. B remains the best available option.\nCh 22 · Skin lesions (also Shamsan Q195) · Cummings 7th", "b": "Ch 22", "n": 3}, {"s": "Basal cell carcinoma:", "o": ["Is commoner than all cancers except lung", "Can arise from keratoacanthoma", "Occurs in the head and neck in 86%", "Most often affects the auricle in H&N", "Is declining due to SPF 15 sunscreens"], "k": "C", "x": "Most BCCs occur on sun-exposed head and neck skin.\nA — BCC is the most common human cancer overall.\nB — KA relates to SCC.\nD — Nose is the commonest H&N site.\nE — Incidence is rising.\nCh 22 · Skin lesions (also Shamsan Q196) · Cummings 7th", "b": "Ch 22", "n": 4}, {"s": "Pilar cysts:", "o": ["Differ from trichilemmal cysts and wens", "Are autosomal recessive", "Occur on the scalp in 80%", "Are best treated by electrocautery and curettage", "Cannot be distinguished from mucous cysts"], "k": "C", "x": "Pilar cysts are predominantly scalp lesions.\nA — Pilar = trichilemmal cyst = wen (same entity).\nB — Autosomal dominant.\nD — Complete excision with the wall.\nE — Distinct histology.\nCh 22 · Skin lesions (also Shamsan Q197) · Cummings 7th", "b": "Ch 22", "n": 5}, {"s": "Per the book, order the incision sites from best to least favorable:", "o": ["Hairlines, orifices, RSTL, junctions", "Junctions, orifices, hairlines, RSTL", "Orifices, hairlines, junctions, RSTL", "RSTL, hairlines, junctions, orifices"], "k": "C", "x": "Book key: incisions hidden at orifice margins are best camouflaged, then hairlines, then aesthetic-unit junctions, then relaxed skin tension lines.\nA — Wrong order.\nB — Wrong order.\nD — Reverse order.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 6}, {"s": "The optimal fusiform excision angle is ~30°, adjusted for skin thickness. Per the book key:", "o": ["Thicker skin needs a larger angle", "Thinner skin needs a larger angle", "Angle is independent of skin thickness", "Better blood supply allows a larger angle"], "k": "C", "x": "Book key C.\nD — Blood supply does not govern the angle.\nUpdate: The book key contradicts its own stem ('can be modified depending on skin thickness'). Thick skin forms larger standing cones, so it usually needs a smaller angle (longer ellipse); thin skin tolerates a wider one. Low-yield, inconsistent item.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 7}, {"s": "The M-plasty:", "o": ["Shortens and breaks the scar, reduces excision, reduces protrusion", "Lengthens and breaks the scar, reduces excision, can be advanced or retarded", "Shortens and breaks the scar, can be advanced or retarded, reduces excision", "Lengthens the scar, increases excision"], "k": "C", "x": "Closing the end of an ellipse as an M shortens its length and saves tissue; the M can be shifted along the line.\nA — Protrusion reduction is not its stated feature.\nB — It shortens.\nD — Opposite.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 8}, {"s": "The original, primary functions of Z-plasty are:", "o": ["Shorten scar and change direction", "Change direction and lengthen", "Change direction and shorten", "Move scar out of creases"], "k": "B", "x": "Z-plasty transposes two triangular flaps: it lengthens along the central limb (75% with 60° limbs) and reorients the scar.\nA — It lengthens along the central axis.\nD — It moves scars INTO relaxed lines.\nCh 23 · Lacerations & scar revision · Cummings 7th, Scott-Brown 8th, KJ Lee 12th", "b": "Ch 23", "f": "Key corrected: the book key is C; the current answer is B. Book key (C, 'shorten') contradicts standard teaching (Cummings, Scott-Brown, KJ Lee). Z-plasty lengthens the contracture line. Answer B.", "n": 9}, {"s": "Why is a running W-plasty preferred over serial Z-plasty?", "o": ["Less tissue lengthening", "Easier design and closure", "Less distortion", "Better long-term results"], "k": "A", "x": "W-plasty breaks up a scar without lengthening it, useful where lengthening would distort (e.g., the lip).\nB — Not the defining advantage.\nC — Not the key point.\nD — Not proven superior.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 10}, {"s": "Best broken-line closure guidelines for a 25-year-old's cheek:", "o": ["<6 mm limbs, angles <75°, height varies, width constant", "<5 mm limbs, angles <100°, width and height vary", "<6 mm limbs, angles >60°, constant height and length", "<5 mm limbs, acute angles, width varies, height varies only at scar ends"], "k": "D", "x": "Small, irregular, acute-angled segments are least predictable to the eye.\nA — Too regular.\nB — Obtuse angles.\nC — Too regular.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 11}, {"s": "Geometric broken-line closure uses which shapes?", "o": ["Squares only", "Squares and rectangles", "Squares, rectangles, trapezoids", "Squares, rectangles, trapezoids and triangles"], "k": "D", "x": "Mixing all shapes creates an irregular, less visible line.\nA — Too regular.\nB — Incomplete.\nC — Incomplete.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 12}, {"s": "Per the book, recommended suturing for broken-line closures:", "o": ["Running locking", "Staples", "Interrupted", "Gillies tip stitches", "Half-buried horizontal mattress"], "k": "A", "x": "Book key A: after deep closure, a running locking suture everts and sets the many small limbs efficiently.\nB — Not for facial precision closures.\nC — Laborious with many limbs.\nD — For individual tips only.\nE — For corners.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 13}, {"s": "Best broken-line technique for a C-shaped curvilinear cheek scar segment:", "o": ["Running Z-plasty", "Running W-plasty", "Serial Z-plasty", "Geometric broken line"], "k": "B", "x": "W-plasty adapts well to curves: triangles are made smaller on the concave side.\nA — Distorts curves.\nC — Lengthens.\nD — Better on straight segments.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 14}, {"s": "Maximum monthly intralesional triamcinolone for an auricular keloid in a 70-kg adult without adrenal suppression (book):", "o": ["80 mg", "100 mg", "120 mg", "140 mg"], "k": "C", "x": "Book limit: 120 mg/month.\nA — Below the limit.\nB — Below the limit.\nD — Exceeds the limit.\nExam tip: Usual concentration 10–40 mg/mL every 4–6 weeks. Watch for atrophy, telangiectasia and hypopigmentation.\nCh 23 · Lacerations & scar revision · Cummings 7th", "b": "Ch 23", "n": 15}, {"s": "The vertical buttresses of the midface are:", "o": ["Stronger than the horizontal", "Weaker than the horizontal", "Equal"], "k": "A", "x": "Vertical buttresses (nasomaxillary, zygomaticomaxillary, pterygomaxillary) carry masticatory forces.\nB — Horizontal are weaker.\nC — Not equal.\nExam tip: Plate fixation follows the vertical buttresses to restore facial height.\nCh 24 · Maxillofacial trauma · Cummings 7th", "b": "Ch 24", "n": 16}, {"s": "Restoring the horizontal arc when reducing a displaced zygoma re-establishes:", "o": ["Vertical cheek prominence", "Lateral projection only", "Anterior and lateral cheek projection"], "k": "C", "x": "The zygomatic arch and malar arc set both AP projection and facial width.\nA — Vertical height is set by vertical buttresses.\nB — Incomplete.\nExam tip: The arch is straight, not curved, when correctly reduced. An 'arched' arch means facial widening.\nCh 24 · Maxillofacial trauma · Cummings 7th", "b": "Ch 24", "n": 17}, {"s": "In a coronal approach to the lateral orbital rim, dissect:", "o": ["Superficial to the superficial layer of deep temporal fascia", "Deep to the superficial layer of deep temporal fascia", "In any plane"], "k": "B", "x": "The frontal branch of CN VII runs in the temporoparietal fascia, superficial to the deep temporal fascia. Going deep to the superficial layer (into the fat pad) protects it.\nA — Endangers the frontal branch.\nC — Dangerous.\nCh 24 · Maxillofacial trauma · Cummings 7th, Scott-Brown 8th", "b": "Ch 24", "n": 18}, {"s": "Per the book, maxillary fractures heal by:", "o": ["Fibrous union", "Osseous union", "Both"], "k": "B", "x": "Book key B: clinical evidence supports bony union of midface fractures.\nA — Older belief.\nC — Not per the book.\nCh 24 · Maxillofacial trauma · Cummings 7th", "b": "Ch 24", "n": 19}, {"s": "Indications for ORIF of condylar neck fractures include: (1) condyle displaced out of the fossa, (2) mechanical block to opening, (3) displaced bilateral subcondylar fractures with malocclusion, (4) edentulous/partially edentulous jaw with posterior bite collapse.", "o": ["1 only", "2 and 4", "All of the above"], "k": "C", "x": "These match the Zide & Kent indications.\nA — Incomplete.\nB — Incomplete.\nExam tip: Zide & Kent absolute indications also include lateral extracapsular displacement and foreign body in the joint.\nCh 24 · Maxillofacial trauma · Cummings 7th, Scott-Brown 8th", "b": "Ch 24", "n": 20}, {"s": "BCCs with higher recurrence after standard treatment include:", "o": ["Recurrent tumors", "High-risk facial sites", "Aggressive histology", "Ill-defined borders", "All of the above"], "k": "E", "x": "All are NCCN high-risk features.\nCh 25 · BCC & SCC · NCCN H&N, Cummings 7th", "b": "Ch 25", "n": 21}, {"s": "A high-risk site for BCC is the:", "o": ["Neck", "Ears", "Forehead", "Malar area", "Trunk"], "k": "B", "x": "Ears are in the central 'H-zone' (with eyelids, nose, lips, temple), where recurrence is high.\nA — Low risk.\nC — Intermediate.\nD — Intermediate.\nE — Low risk.\nCh 25 · BCC & SCC · NCCN H&N", "b": "Ch 25", "n": 22}, {"s": "Mohs surgery should be considered for:", "o": ["Tumors with high recurrence risk", "Where tissue conservation matters", "Microcystic adnexal carcinoma", "DFSP", "All of the above"], "k": "E", "x": "All are accepted Mohs indications.\nCh 25 · BCC & SCC · NCCN H&N", "b": "Ch 25", "n": 23}, {"s": "70–85% of local recurrences and metastases of cutaneous SCC appear within:", "o": ["6 months", "1 year", "2 years", "5 years", "10 years"], "k": "C", "x": "Most recurrences occur within 2 years, the basis for intensive early follow-up.\nA — Too short.\nB — Too short.\nD — ~95% by 5 years.\nE — Too long.\nCh 25 · BCC & SCC · Cummings 7th, NCCN H&N", "b": "Ch 25", "n": 24}, {"s": "If an STSG is used to monitor a very-high-risk aggressive BCC, how long before definitive reconstruction (book)?", "o": ["6 months", "1 year", "2 years", "5–10 years", "None"], "k": "D", "x": "Book key D reflects the long latency of recurrence in aggressive BCC.\nUpdate: Practice has moved on: with Mohs or complete margin assessment, reconstruction is usually immediate or delayed only until clear margins are confirmed. Graft-and-watch periods of years are rarely used today.\nCh 25 · BCC & SCC · Cummings 7th, NCCN H&N", "b": "Ch 25", "n": 25}, {"s": "Treatments for low-risk BCC include all EXCEPT (book):", "o": ["Intralesional interferon", "Electrodesiccation & curettage", "Cryosurgery", "Topical 5-FU", "Radiation"], "k": "A", "x": "Book key D: topical 5-FU was not considered adequate.\nB — Accepted for low-risk, non-terminal-hair areas.\nC — Accepted.\nE — Accepted, especially in the elderly.\nCh 25 · BCC & SCC · NCCN H&N", "b": "Ch 25", "f": "Key corrected: the book key is D; the current answer is A. Updated: topical 5-FU and imiquimod are approved for superficial low-risk BCC (NCCN, when surgery is not feasible). Intralesional interferon is obsolete and not in current guidelines. Answer A.", "n": 26}, {"s": "Average subclinical extension of a small primary BCC with aggressive histology:", "o": ["2 mm", "4 mm", "7 mm", "2 cm", "3 cm"], "k": "C", "x": "Aggressive (morpheaform, infiltrative) BCC extends ~7 mm beyond the visible margin.\nA — Nodular range.\nB — Standard margin for small nodular BCC.\nD — Too large.\nE — Too large.\nExam tip: Standard surgical margin: 4 mm for small well-defined BCC; wider or Mohs for aggressive.\nCh 25 · BCC & SCC · Cummings 7th, NCCN H&N", "b": "Ch 25", "n": 27}, {"s": "BCC 'shelving and skating' along tissue planes can occur along:", "o": ["Tarsal plate", "Perichondrium", "Periosteum", "Medial canthal muscle", "All of the above"], "k": "E", "x": "BCC spreads along these low-resistance planes, causing deep, unexpected extension.\nCh 25 · BCC & SCC · Cummings 7th", "b": "Ch 25", "n": 28}, {"s": "Which is NOT a high-risk prognostic factor in cutaneous SCC?", "o": ["Poor differentiation", "Lip or ear location", "Immunosuppression", "Perineural invasion", "Invasion only into papillary dermis"], "k": "E", "x": "Superficial invasion is low-risk. High risk: depth >6 mm or beyond subcutaneous fat.\nA — High risk.\nB — High risk.\nC — High risk (transplant patients).\nD — High risk.\nExam tip: AJCC 8th cSCC: T3 = depth >6 mm, beyond subcutaneous fat, minor bone erosion, or PNI of a named/deep nerve ≥0.1 mm.\nCh 25 · BCC & SCC · AJCC 8th, NCCN H&N", "b": "Ch 25", "n": 29}, {"s": "The single most important predictor of outcome in localized melanoma is:", "o": ["Clark level", "Age", "Breslow thickness", "Sex", "None"], "k": "C", "x": "Breslow thickness drives T stage and prognosis (with ulceration).\nA — Removed from AJCC staging.\nB — Minor factor.\nD — Minor factor.\nExam tip: AJCC 8th: Clark level and mitotic rate removed from T1 staging; T1b = 0.8–1.0 mm or ulcerated <0.8 mm.\nCh 26 · H&N melanoma · AJCC 8th", "b": "Ch 26", "n": 30}, {"s": "What proportion of melanomas arise from pre-existing nevi (book)?", "o": ["25%", "33%", "50%", "75%", "None"], "k": "A", "x": "Book key C (50%).\nB — Close, but not the best current estimate.\nD — Too high.\nE — Some do.\nCh 26 · H&N melanoma · Cummings 7th", "b": "Ch 26", "f": "Key corrected: the book key is C; the current answer is A. Updated: a 2017 meta-analysis (Pampena, JAAD; ~20,000 melanomas) found ~29% nevus-associated and ~71% de novo. Closest answer: A (25%).", "n": 31}, {"s": "Which nevus is completely macular (flat)?", "o": ["Junctional", "Compound", "Dermal", "Dysplastic", "Blue"], "k": "A", "x": "Junctional nevi sit at the dermoepidermal junction and are flat.\nB — Partially raised.\nC — Dome-shaped.\nD — Often has a raised center ('fried egg').\nE — Dermal, papular.\nCh 26 · H&N melanoma · Cummings 7th", "b": "Ch 26", "n": 32}, {"s": "Per the book, which is NOT a type of malignant melanoma?", "o": ["Hutchinson's freckle", "Lentigo maligna", "Superficial spreading", "Nodular", "All are types"], "k": "A", "x": "Book key A: Hutchinson's melanotic freckle is the in-situ precursor.\nC — Most common subtype overall.\nD — Most aggressive vertical growth.\nExam tip: Hutchinson's freckle and lentigo maligna are synonyms (melanoma in situ); lentigo maligna MELANOMA is the invasive form. Watch the wording.\nCh 26 · H&N melanoma · Cummings 7th", "b": "Ch 26", "n": 33}, {"s": "Recommended surgical margin for a 4-mm-thick facial melanoma (book):", "o": ["0.5 cm", "1 cm", "2 cm", "3 cm", "4 cm"], "k": "C", "x": "Book key D (3 cm).\nA — In situ.\nB — ≤1 mm.\nE — Excessive.\nCh 26 · H&N melanoma · NCCN H&N", "b": "Ch 26", "f": "Key corrected: the book key is D; the current answer is C. Updated: NCCN margins are in situ 0.5–1 cm; ≤1 mm 1 cm; 1–2 mm 1–2 cm; >2 mm 2 cm. A 4-mm melanoma needs 2 cm (C), modified on the face for function and aesthetics.", "n": 34}, {"s": "Per the book, neck dissection is advised for palpable nodes and for which group with a clinically N0 neck?", "o": ["Thin <1 mm", "Intermediate 1–3.5 mm", "Thick >4 mm", "Distant metastases"], "k": "B", "x": "Intermediate-thickness tumors were the group thought most likely to benefit from elective nodal treatment.\nA — Low nodal risk.\nC — High distant risk; limited benefit.\nD — Systemic disease.\nUpdate: Practice change: elective neck dissection has been replaced by sentinel lymph node biopsy for T1b and thicker (≥0.8 mm or ulcerated). After MSLT-II and DeCOG-SLT, a positive SLN no longer mandates completion dissection; nodal ultrasound surveillance is standard.\nCh 26 · H&N melanoma · NCCN H&N, AJCC 8th", "b": "Ch 26", "n": 35}, {"s": "The cytotoxic agent with the greatest response in melanoma is:", "o": ["Vincristine", "Doxorubicin", "Dacarbazine", "Paclitaxel", "Cisplatin"], "k": "C", "x": "Dacarbazine (DTIC) is the most active single cytotoxic agent, with ~10–20% response.\nA — Less active.\nB — Less active.\nD — Less active.\nE — Less active.\nUpdate: Context: cytotoxics are now second-line at best. First line is immunotherapy (anti-PD-1 ± anti-CTLA-4) or BRAF/MEK inhibitors for BRAF V600-mutant disease.\nCh 26 · H&N melanoma · NCCN H&N", "b": "Ch 26", "n": 36}, {"s": "When classifying flaps by blood supply, which term is inappropriate?", "o": ["Regional", "Island", "Axial", "Random"], "k": "A", "x": "'Regional' describes location relative to the defect, not vascular pattern.\nB — Vascular classification.\nC — Vascular.\nD — Vascular.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 37}, {"s": "Which local flap moves by a different method?", "o": ["Interpolation", "Rotation", "Advancement", "Transposition"], "k": "C", "x": "Advancement flaps slide forward; the others pivot around a point.\nA — Pivotal.\nB — Pivotal.\nD — Pivotal.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 38}, {"s": "Rotation flaps are best for defects shaped like a:", "o": ["Square", "Triangle", "Rhomboid", "Circle"], "k": "B", "x": "Rotation flaps close triangular defects, with the arc along the triangle's base.\nA — Advancement.\nC — Limberg (transposition).\nD — Bilobed or converted to another shape.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 39}, {"s": "Which flap can be designed with borders away from the defect?", "o": ["Hinged", "Rotation", "Advancement", "Transposition"], "k": "D", "x": "Transposition flaps are lifted over intervening skin, so their borders need not touch the defect.\nA — Turnover, adjacent.\nB — Border is the defect edge.\nC — Border is the defect edge.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 40}, {"s": "Which flap's axis can be independent of the defect's linear axis?", "o": ["Transposition", "Rotation", "Advancement", "Hinged"], "k": "A", "x": "Transposition flaps can be oriented to place scars in RSTLs and use lax skin.\nB — Tied to the defect.\nC — Tied to the defect axis.\nD — Tied to the defect edge.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 41}, {"s": "Effective length of a pivotal peninsular flap moving through 180° is reduced by (book):", "o": ["30%", "40%", "20%", "10%"], "k": "B", "x": "Book key B: the greater the arc of rotation, the more effective length is lost at the pivot.\nExam tip: Design pivotal flaps slightly longer than the defect to compensate.\nCh 27 · Facial reconstruction · Cummings 7th", "b": "Ch 27", "n": 42}, {"s": "Maximum safe dose of lidocaine with 1:100,000 epinephrine (mg/kg):", "o": ["2–4", "5–7", "9–11", "50–70"], "k": "B", "x": "7 mg/kg with epinephrine; 4.5 mg/kg plain.\nA — Plain lidocaine range.\nC — Toxic.\nD — Tumescent liposuction only (35–55 mg/kg).\nCh 28 · Local anesthesia · Cummings 7th, KJ Lee 12th", "b": "Ch 28", "n": 43}, {"s": "Which is NOT an early sign of local anesthetic toxicity?", "o": ["Tinnitus", "Blurred vision", "Tremor", "Respiratory depression"], "k": "D", "x": "Early CNS excitation: perioral numbness, tinnitus, visual change, tremor. Respiratory depression is late.\nA — Early.\nB — Early.\nC — Early, precedes seizures.\nExam tip: Management of LAST: airway, stop injection, benzodiazepine for seizures, 20% lipid emulsion.\nCh 28 · Local anesthesia · Cummings 7th", "b": "Ch 28", "n": 44}, {"s": "Which agent breaks down ground substance bonds?", "o": ["Lidocaine", "Epinephrine", "Hyaluronidase", "Naloxone"], "k": "C", "x": "Hyaluronidase hydrolyzes hyaluronic acid, aiding spread of anesthetic; also reverses HA fillers.\nA — Na⁺ channel blocker.\nB — Vasoconstrictor.\nD — Opioid antagonist.\nCh 28 · Local anesthesia · Cummings 7th", "b": "Ch 28", "n": 45}, {"s": "Local anesthetics act on:", "o": ["Membrane sodium channels", "Lysosomes", "Nuclear receptors", "Potassium channels"], "k": "A", "x": "They block voltage-gated Na⁺ channels from the inside, preventing depolarization.\nB — No.\nC — No.\nD — No.\nCh 28 · Local anesthesia · Cummings 7th", "b": "Ch 28", "n": 46}, {"s": "Facial cutaneous sensory nerves are predominantly type:", "o": ["A", "B", "C", "D"], "k": "C", "x": "Book key: small unmyelinated C fibers predominate; they are the most sensitive to local anesthetic block.\nA — Fewer.\nB — Preganglionic autonomic.\nD — Not a class.\nExam tip: Order of block: B > C (and Aδ) > Aβ > Aα. Pain and temperature go first, motor last.\nCh 28 · Local anesthesia · Cummings 7th", "b": "Ch 28", "n": 47}]}, {"t": "Ch 29–36 · Tissue expansion, hair, peels, facelift, brow, blepharoplasty", "q": [{"s": "Extra tissue from chronic expansion comes from:", "o": ["Cell mitosis", "More collagen and elastin", "Increased vascularity", "All of the above"], "k": "D", "x": "Chronic expansion is true biological growth: epidermal mitosis, new collagen, and new vessels (capsule).\nCh 29 · Tissue expansion · Cummings 7th", "b": "Ch 29", "n": 1}, {"s": "Which mechanisms contribute to immediate (intraoperative) expansion?", "o": ["Intrinsic skin creep", "Collagen realignment", "Elastic fiber rupture", "Tissue dehydration", "Undermining and tissue migration", "Mitosis", "A–E"], "k": "G", "x": "Immediate gain is mechanical: creep, fiber realignment and rupture, water displacement, and recruitment.\nF — Mitosis needs days to weeks; it is a chronic-expansion mechanism.\nCh 29 · Tissue expansion · Cummings 7th", "b": "Ch 29", "n": 2}, {"s": "Expected skin contraction after expansion is complete:", "o": ["5–10%", "10–20%", "20–30%", "30–50%"], "k": "D", "x": "Expanded skin recoils substantially (book: 30–50%), so overexpand and design flaps generously.\nA — Underestimate.\nB — Underestimate.\nC — Underestimate.\nCh 29 · Tissue expansion · Cummings 7th", "b": "Ch 29", "n": 3}, {"s": "Which tissue is most vulnerable to compression ischemia during expansion?", "o": ["Skin", "Fat", "Muscle", "Nerve", "Vessels"], "k": "B", "x": "Fat atrophies most (up to ~50% loss of thickness).\nA — Thickens epidermally.\nC — Thins but less.\nD — Usually tolerates.\nE — Proliferate.\nCh 29 · Tissue expansion · Cummings 7th", "b": "Ch 29", "n": 4}, {"s": "Common immediate complications of expansion:", "o": ["Infection", "Wound dehiscence", "Implant failure", "Skin necrosis", "All of the above"], "k": "E", "x": "All occur; exposure/extrusion is the most feared.\nExam tip: Scalp and forehead expand best; neck is the riskiest (thin skin, mobile).\nCh 29 · Tissue expansion · Cummings 7th", "b": "Ch 29", "n": 5}, {"s": "Proportion of scalp hairs in telogen at any time:", "o": ["1%", "10%", "25%", "50%", "90%"], "k": "B", "x": "~10–15% telogen (resting, 2–3 months); ~85–90% anagen.\nA — Too low.\nC — Too high.\nD — Too high.\nE — That is anagen.\nCh 30 · Hair restoration · Cummings 7th", "b": "Ch 30", "n": 6}, {"s": "Telogen effluvium after transplantation should be managed by:", "o": ["Reassurance", "More shampooing", "Headband", "Hydrocortisone 1%", "Another session"], "k": "A", "x": "'Shock loss' is temporary; hair regrows in 3–4 months.\nB — No effect.\nC — No effect.\nD — No role.\nE — Premature.\nCh 30 · Hair restoration · Cummings 7th", "b": "Ch 30", "n": 7}, {"s": "The Juri temporoparietal-occipital flap is based on:", "o": ["Anterior STA + occipital", "Postauricular + occipital", "Posterior branch of STA (with occipital contribution per book)", "Anterior + posterior STA", "Posterior STA + postauricular"], "k": "C", "x": "Juri flap: delayed, pedicled on the posterior (parietal) branch of the superficial temporal artery.\nA — Anterior branch supplies forehead.\nB — Not the pedicle.\nD — Not the pedicle.\nE — Not per book.\nCh 30 · Hair restoration · Cummings 7th", "b": "Ch 30", "n": 8}, {"s": "Finasteride is:", "o": ["A vasodilator", "An antigonadotropin", "An aromatase enzyme", "A growth factor", "A 5α-reductase inhibitor"], "k": "E", "x": "Inhibits type II 5α-reductase, lowering DHT.\nA — That is minoxidil.\nB — No.\nC — No.\nD — No.\nExam tip: Dutasteride inhibits types I and II.\nCh 30 · Hair restoration · Cummings 7th", "b": "Ch 30", "n": 9}, {"s": "A general rule in frontal hairline reconstruction:", "o": ["Use 1–2-hair grafts at the hairline itself", "Direct grafts posteriorly", "Fill the frontotemporal angle completely", "Place hairline <7 cm from mid-glabella"], "k": "A", "x": "Single/double follicular units create a natural, irregular hairline.\nB — Direct anteriorly.\nC — Preserve the temporal recession.\nD — Usually 7–10 cm above glabella; too low looks unnatural.\nCh 30 · Hair restoration · Cummings 7th", "b": "Ch 30", "n": 10}, {"s": "Photodamaged skin is:", "o": ["Mainly intrinsic", "Thin 'cigarette paper'", "Caused by UV exposure", "Coupled with fat accumulation", "Commoner in darker skin"], "k": "C", "x": "Extrinsic aging = UV-driven (solar elastosis).\nA — Intrinsic is chronological.\nB — That describes intrinsic aging; photoaged skin is thick and leathery.\nD — Fat loss, not gain.\nE — Fair skin (Fitzpatrick I–II).\nCh 31 · Aging skin · Cummings 7th", "b": "Ch 31", "n": 11}, {"s": "Cardinal signs of photodamage include:", "o": ["Coarse wrinkles", "Brown spots", "Roughness", "Fine wrinkles", "All of the above"], "k": "E", "x": "All are features.\nCh 31 · Aging skin · Cummings 7th", "b": "Ch 31", "n": 12}, {"s": "Tretinoin:", "o": ["Is vitamin C", "Dif ications (also Shamsan Q302) · Scott-Brown 8th", "b": "Ch 155", "n": 32}, {"s": "AOM: which is true?", "o": ["Bacteria isolated in 50–70%", "Pneumococcus, H. influenzae, Moraxella commonest", "Neonates (<6 weeks) at risk for Gram-negatives/S. aureus", "Resistant organisms include all three", "All"], "k": "E", "x": "All.\nExam tip: Post-PCV13: non-typeable H. influenzae now rivals pneumococcus.\nCh 155 · Temporal bone infection complications (also Shamsan Q303) · Scott-Brown 8th", "b": "Ch 155", "n": 33}, {"s": "Poorest first-line choice for AOM:", "o": ["Erythromycin–sulfisoxazole", "TMP-SMX", "Macrolides", "Ciprofloxacin", "Amoxicillin"], "k": "D", "x": "Poor pneumococcal cover; not for children.\nE — First line (high dose).\nCh 155 · Temporal bone infection complications (also Shamsan Q304) · Scott-Brown 8th", "b": "Ch 155", "n": 34}, {"s": "About mastoiditis, which is FALSE?", "o": ["Fluid/mucosal thickening on imaging is diagnostic", "Bacteriology differs slightly from AOM", "Coalescent symptoms include sagging posterosuperior canal wall", "Can occur with normal TM, on antibiotics, without prior OM", "All true"], "k": "A", "x": "Opacified mastoid cells are seen in any AOM; coalescence (bony septal erosion) is diagnostic.\nCh 155 · Temporal bone infection complications (also Shamsan Q305) · Scott-Brown 8th", "b": "Ch 155", "n": 35}, {"s": "Bezold's abscess occurs when mastoid infection:", "o": ["Erodes outer tip cortex", "Erodes zygomatic cell", "Perforates medial mastoid tip (digastric groove)", "Root of zygoma into TMJ", "Area perforata"], "k": "C", "x": "Pus tracks deep to SCM.\nA — Subperiosteal abscess.\nB — Zygomatic (Luc's area) abscess.\nCh 155 · Temporal bone infection complications (also Shamsan Q306) · Scott-Brown 8th, KJ Lee 12th", "b": "Ch 155", "n": 36}, {"s": "Least common with petrous apex infection:", "o": ["Retro-orbital pain", "Otorrhea", "VI palsy", "VII palsy", "Prior ear infection"], "k": "D", "x": "VII is not part of Gradenigo.\nCh 155 · Te   $('#app').innerHTML=`<h1>Cummings Review — 5th-edition file</h1><p class="sub">937 questions. Online review set merged with the Shamsan appendix, in chapter order. Red boxes mark book keys corrected to the current answer. Pick chapters, then start.</p>

  <div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${Object.keys(S.ans).length?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">See results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Answers are kept while this page is open. Tap any figure to enlarge.</p>`;
  scrollTo(0,0);
}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);home()}
function start(list){
  if(!list){list=[];[...S.sel].sort().forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show();
}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const A=S.ans[id(c,n)];const {a,r}=score();
  const pick=S.multiPick[id(c,n)]||new Set();
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${DATA[c].t}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; ${q.b||'Book Q'+n}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${n}" onclick="zoom(this.src)">`).join('')}</div>`;
  if(q.m)h+=`<p class="note">More than one answer. Select all that apply, then check.</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';
    if(A){if(q.k.includes(l))cl='ok';else if(A.pick.includes(l))cl='bad'}else if(pick.has(l))cl='sel';
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(q.m&&!A)h+=`<button class="primary" style="margin-top:6px" ${pick.size?'':'disabled'} onclick="check()">Check answer</button>`;
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k.split('').join(', ')}</h3>`;
    if(q.f)h+=`<div class="flag">${esc(q.f)}</div>`;
    h+=q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
    if(q.xi)h+=q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join('');
    h+=`</div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0);
}
function choose(l){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);if(S.ans[k])return;
  if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcdefgh'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
