<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.chip b{font-weight:600}.chip span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA=[{"t":"Chapter 2","q":[{"n":1,"s":"Exostoses of the external auditory canal would be expected most frequently in the following:","o":["Patient with chronic otitis externa","College swimmer from a warm climate","23-year-old thrice-weekly surfer from Florida","43-year-old thrice-weekly surfer from Oregon"],"k":"d","x":""},{"n":2,"s":"Rapid and complete healing of the skin of the external auditory canal is facilitated by","o":["Performance of surgery prior to severe skin attenuation from chronic otitis externa","Preservation of skin of the external auditory canal","Local anesthesia","a and b","b and c"],"k":"d","x":""},{"n":3,"s":"Conductive hearing impairment occurs with large exostoses of the external auditory canal when","o":["Debris prevents normal tympanic membrane vibration","Narrowing of the external auditory canal reaches 5 mm","Narrowing of the external auditory canal reaches 2 mm","All of the above","a and c"],"k":"e","x":""},{"n":4,"s":"Medial third stenosis may result in","o":["Weeping and chronic otitis externa","Conductive hearing impairment","Formation of dense scar lateral and medial to the tympanic membrane","a and b","All of the above"],"k":"d","x":""},{"n":5,"s":"Osteonecrosis of the tympanic bone presents with bone exposure in the external auditory canal and may be associated with","o":["Radiation history to the temporal bone","Lupus vasculitis","Diabetes","a and b","All of the above"],"k":"e","x":""}]},{"t":"Chapter 3","q":[{"n":1,"s":"The most common malignancy of the temporal bone is","o":["Adenoid cystic carcinoma","Pleomorphic adenoma","Warthin’s tumor","Squamous carcinoma","Ceruminoma"],"k":"d","x":"Most temporal bone carcinoma originates in the skin of the external auditory canal."},{"n":2,"s":"The mechanism for salivary gland tumor involvement of the temporal bone is","o":["Direct extension","Hematogenous metastases","Ectopic salivary rests within the temporal bone","Squamous metaplasia","Absence of the fissures of Santorini"],"k":"a","x":"The proximity of the partoid and fissures of Santorini make direct extension the most common mode for salivary gland tumors to involve the temporal bone."},{"n":3,"s":"A fungating mass of the external auditory canal is biopsied in the office. The pathologist reports acute and chronic inflammation. The next step in management is","o":["Consult infectious disease","Image and rebiopsy","Lateral temporal bone resection","Subtotal temporal bone resection","Radiation therapy"],"k":"b","x":"Necrotic carcinomas frequently are confused with inflammatory changes.The otologist should be suspicious and plan deeper biopsies once imaging proves that vital structures are not jeopardized by the planned biopsy."},{"n":4,"s":"The best study to distinguish postoperative scar from tumor recurrence is","o":["PET-CT imaging","PET imaging","CT","MRI with contrast","MRI-CT fusion imaging"],"k":"a","x":"PET-CT has proven increasingly useful at demonstrating the expected increased metabolic activity of carcinoma in relation to the osseous anatomy."},{"n":5,"s":"The most significant prediction of postoperative survival in temporal bone carcinoma is","o":["Preoperative chemotherapy and radiation","Clear surgical margins","Postoperative chemotherapy and radiation","Patient age","Extensiveness of resection"],"k":"b","x":"Clear surgical margins reflect complete oncologically sound removal of the lesion.While adjuvant treatments definitely have a role,a clear surgical margin is the best predictor of survival."}]},{"t":"Chapter 4","q":[{"n":1,"s":"The overall prevalence of primary temporal bone malignancy is about","o":["Six cases per thousand","Six cases per hundred thousand","Six cases per million","Six cases per hundred million"],"k":"c","x":""},{"n":2,"s":"Advanced malignancies of the temporal bone are best treated with","o":["Surgery only","Radiation only","Surgery and radiation","Chemotherapy"],"k":"c","x":""},{"n":3,"s":"Radiologic assessment of temporal bone malignancies may include","o":["CAT scan","MRI","Cerebral angiography","All of the above"],"k":"d","x":""},{"n":4,"s":"Long (>8 cm) facial nerve defects should be grafted with","o":["The greater auricular nerve","The cervical cutaneous nerves","The cranial nerve XI","The sural nerve"],"k":"d","x":""},{"n":5,"s":"The most common site for temporal bone treatment failure is","o":["Local","Locoregional","Regional","Distant site"],"k":"a","x":""}]},{"t":"Chapter 5","q":[{"n":1,"s":"What are the goals of atresia surgery?","o":["Perform ossicular reconstruction with the patient’s own ossicular chain instead of using a prosthesis","Create a patent, skin-lined external auditory canal and achieve a postoperative air-bone gap within 20 to 30 dB","Perform surgery before age 6 in both unilateral and bilateral cases","Perform hearing restoration surgery and microtia repair in a one-stage procedure"],"k":"b","x":""},{"n":2,"s":"What are the four anatomic parameters, as seen radiographically, crucial for atresia surgical operability?","o":["The status of the inner ear, the degree of pneumatization of the mastoid, the course of the facial nerve, and the presence of the oval window and stapes footplate","Thickness and form of the atretic bone, soft tissue contribution to the atresia, size and status of the middle ear cavity, and the presence or absence of congenital cholesteatoma","The status of the inner ear, the degree of pneumatization of the mastoid, thickness and form of the atretic bone, and the presence or absence of congenital cholesteatoma","Soft tissue contribution to the atresia, size and status of the middle ear cavity, the course of the facial nerve, and the presence of the oval window and stapes footplate"],"k":"a","x":""},{"n":3,"s":"What is the most common cause of inoperability in congenital aural atresia?","o":["Absence of the oval window","A facial nerve overlying the oval window","Poor mastoid pneumatization","Unilateral atresia"],"k":"c","x":""},{"n":4,"s":"What are the main postoperative complications of atresiaplasty?","o":["Lateralization of the tympanic membrane, large meatus, sensorineural hearing loss, and facial nerve palsy","Ossicular reconstruction prosthesis extrusion, otorrhea, stenosis of the meatus, and facial nerve palsy","Sensorineural hearing loss, tympanic membrane perforation, and ingrowth of grafted skin into external auditory canal Merocel wicks","Lateralization of the tympanic membrane, stenosis of the meatus, sensorineural hearing loss, and facial nerve palsy"],"k":"d","x":""},{"n":5,"s":"What is the most common delayed cause of a poor hearing outcome in atresia surgery and what can be done to prevent it?","o":["Meatal stenosis. Use one-piece split-thickness skin grafts to cover all exposed bone, and Silastic sheets and Merocel wicks in the external auditory canal for 2 weeks.","Tympanic membrane lateralization. Use Silastic sheets to line the external auditory canal and Merocel wicks for 2 weeks, Gelfim disks, and tabs in the fascia graft to maintain the tympanic membrane graft in position.","Noise-induced sensorineural hearing loss. Minimize drilling on the ossicular chain when dissecting it away from the atretic bone.","Ossicular reconstruction prosthesis extrusion. Cover the prosthesis with cartilage prior to grafting the new drum."],"k":"b","x":""}]},{"t":"Chapter 7","q":[{"n":1,"s":"Which of the following does not contribute to the closing of the lumen of the Eustachian tube?","o":["Coiling properties of the cartilaginous skeleton","Active contraction of the associated muscles","Pressure of tissues neighboring the lumen","All of the above"],"k":"b","x":""},{"n":2,"s":"Which are the most common symptoms of the patulous Eustachian tube?","o":["Autophony made worse in recumbent position","Autophony and pressure-induced dizziness","Aural fullness and autophony","Symptoms associated with retraction and atelectasis of the tympanic membrane"],"k":"c","x":""},{"n":3,"s":"Which of the following is not considered to participate in the pathogenesis of the patulous Eustachian tube?","o":["Cigarette smoking","Weight loss","Changes in estrogen levels","Scarring from previous nasopharyngeal procedures"],"k":"d","x":""},{"n":4,"s":"Diagnosis of patulous Eustachian tube is certain with","o":["Appropriate findings on axial CT","Appropriate findings on sonotubometry","Presence of typical symptoms","Observation of lateral and medical excursions of the drum"],"k":"d","x":""},{"n":5,"s":"Treatment options do not currently include:","o":["Discontinuing topical antidecongestants","Instillation of local irritants","Augmentation of the nasopharyngeal Eustachian tube orifice","Injection of Botox to the tensor veli palatine"],"k":"d","x":""}]},{"t":"Chapter 8","q":[{"n":1,"s":"Which of the following is not normally found as part of the pathophysiology of chronic suppurative otitis media?","o":["Capillary proliferation","Rarefying osteitis","Multinucleated giant cells","New bone formation","Granulation tissue"],"k":"c","x":"All of the other four items are specifically mentioned as routinely present in individuals with chronic suppurative otitis media. Large multinucleated giant cells are classic for tuberculosis and/or the presence of foreign bodies but do not appear regularly in patients with chronic suppurative otitis media."},{"n":2,"s":"Which of the following statements is true of acute otitis media through a tympanostomy tube or perforation, but not true of acute otitis media with an intact tympanic membrane?","o":["It occurs frequently without fever.","Drainage from the area is commonly the only sign.","Significant pain is uncommon.","Pseudomonas is the causative organism in a significant number of infections.","Streptococcus pneumoniae is the causative organism in a number of infections."],"k":"d","x":"Pseudomonas is only very rarely recovered from children with otitis media and an intact tympanic membrane. However, it makes up a significant percentage of primary isolates in children with acute otitis media through a tympanostomy tube, especially in older children. Answers a–c and e are true of acute otitis media through a tympanostomy tube but are not true of acute otitis media with an intact tympanic membrane."},{"n":3,"s":"Which of the following statements is true about commercially available antibiotic ear drops?","o":["The antibiotic concentration in commercially available ear drops is hundreds of times higher than the concentration that can be achieved in middle ear fluid following systemic administration.","Antibiotic–steroid suspensions are too viscous to pass through a tympanostomy tube.","The use of topical quinolone drops is directly responsible for the increase in quinolone-resistant isolates in children with ear disease.","The currently available evidence suggests that the use of a steroid compromises healing of the tympanic membrane.","There is no evidence that resolution of acute otitis media through a tympanostomy tube or tympanic membrane perforation is enhanced when a steroid is added to a topical antibiotic drop."],"k":"a","x":"The others are all false. Although concerns have been raised that a steroid might delay wound healing, there is no evidence to support the assertion that outcomes are worse when steroids are used.There is now good evidence that a steroid improves both clinical cure and facilitates the eradication of bacteria when it is included in an antibiotic drop."},{"n":4,"s":"Which of the following statements is true of fat graft tympanoplasty?","o":["Donor fat is usually harvested from the abdomen.","Fat graft tympanoplasties do not require rimming of the perforation.","The literature justifies performing this procedure bilaterally and simultaneously.","It is an important technique for perforations involving 75% of the tympanic membrane or less.","It is appropriate for any patient with a tympanic membrane perforation and a hearing loss of 50 dB or less."],"k":"c","x":"Mitchell, et al assert that the risks and complications from fat graft tympanic myringoplasty are sufficiently low so that they can be performed bilaterally and simultaneously. The procedure is not likely to be successful in tympanic membrane perforations that involve more than 25% of the drum. The procedure should probably not be performed in individuals with hearing losses over 25–30 dB because the middle ear ossicles cannot be explored or repaired. Fat grafts are usually taken from earlobes.The margin of the perforation needs to be de-epithilialized as usual."},{"n":5,"s":"With respect to paper patching of tympanic membrane perforations, which of the following statements is true?","o":["The procedure usually needs to be performed in an outpatient surgery setting.","It is an excellent technique for large perforations.","Closure may require repeated applications of the paper patch.","If successful, the perforation closes in a few days.","“Rimming” of the perforation is not necessary."],"k":"c","x":"Multiple repetitions of the procedure are almost always required to get complete closure.Paper patching is often done in the office.The perforation must be de-epithelialized.A solution, usually trichloroacetic acid, is used to de-epitheliaze the perforation. Several months are usually required for successful closure."}]},{"t":"Chapter 9","q":[{"n":1,"s":"One of these complications is not seen with underlay tympanoplasty grafting:","o":["Reperforation","Blunting","Infection","Myringitis of the graft"],"k":"b","x":""},{"n":2,"s":"One of these complications is not seen with overlay grafting:","o":["Reperforation","Blunting","Lateralization","Short healing time"],"k":"d","x":""},{"n":3,"s":"Which one of the following statements is correct?","o":["Blunting is a complication of underlay tympanoplasty.","The rate of take for overlay tympanoplasty is greater than for underlay tympanoplasty.","Lateralization is a complication of underlay tympanoplasty.","Myringitis is not seen after underlay tympanoplasty."],"k":"b","x":""},{"n":4,"s":"Advantages of the outer surface technique include all the following except","o":["It provides excellent exposure.","It allows for removal of as much remnant as necessary.","The take rate is lower than overlay tympanoplasty.","This technique can be used in all cases"],"k":"c","x":""},{"n":5,"s":"Disadvantages of the outer surface technique include all of the following except","o":["Healing problems","Lateralization of the graft","Blunting in the anterior sulcus","Absence of epithelial cysts"],"k":"d","x":""}]},{"t":"Chapter 10","q":[{"n":1,"s":"All of the following are true concerning cartilage tympanoplasty except","o":["Hearing results are worse than with conventional materials.","Toothed forceps should be avoided during manipulation.","Although softening occurs, long-term graft survival is the norm.","Cartilage becomes more brittle with age and more subject to fracture.","The postoperative tympanogram is often type B despite no effusion present."],"k":"a","x":"Hearing results are worse with cartilage. Several studies comparing cartilage, fascia, and perichondrium have been published that show no significant difference in hearing results between the materials. Cartilage can be somewhat brittle, especially in the older patient, so toothed forceps should not be used to manipulate the graft. Softening can occur, and the postoperative tympanogram is frequently a small volume B, due to the noncompliant nature of the graft, even with normal hearing and no effusion."},{"n":2,"s":"Cartilage should be considered as a graft material in the following situations:","o":["The atelectatic ear","Cholesteatoma","A perforation anterior to the annulus","A draining perforation","All of the above"],"k":"e","x":"Cartilage can be used as a graft material in any ear considered to be at high risk for failure with traditional techniques using temporalis fascia or perichondrium. Included in this would be the high-risk perforation, the atelectatic ear, and cholesteatoma.The high-risk perforation comprises a revision surgery, a perforation anterior to the annulus, a perforation draining at the time of surgery, a perforation larger than 50%, or a bilateral perforation."},{"n":3,"s":"The following are true statements concerning the perichondrium/cartilage island flap except","o":["A strip of cartilage 1–2 mm in width is removed to facilitate the malleus.","The graft is placed as an underlay graft, medial to the malleus.","Tragal cartilage is most suitable for total tympanic membrane reconstruction.","One should expect a cosmetic defect after harvest in the tragal area.","The graft is placed so that the perichondrium side is out, toward the canal."],"k":"d","x":"One should expect a cosmetic defect after harvest in the tragal area.If the cartilage is harvested correctly, leaving a strip of cartilage in the dome of the tragus,no cosmetic deformity is seen.The rest of the statements are true concerning the island flap technique described here."},{"n":4,"s":"When using the palisade technique for cartilage tympanoplasty, the following statements are considered true, except for","o":["Cartilage can be harvested from the tragus or cymba.","The cartilage is cut into rectangular strips.","The technique is favored when ossiculoplasty is performed in a malleus-present situation.","The technique does not require one large piece of cartilage.","The technique is particularly suited for cholesteatoma surgery."],"k":"b","x":"The cartilage is cut into rectangular strips. One major difference between the palisade technique described here and that described by Heermann,et al,is that,instead of placing rectangular strips of cartilage side to side, an attempt is made to cut one major piece of cartilage in a semilunar fashion. A second semilunar piece is placed between this first piece and the canal wall to reconstruct the scutum precisely, and any spaces that result between this cartilage and the canal wall or scutum are filled in with small slivers of cartilage.The remaining statements are all true with regard to the palisade technique."},{"n":5,"s":"Which of the following statements apply to the postoperative period following cartilage tympanoplasty?","o":["Eardrum intubation, if necessary, will likely require a trip to the operating room.","A tympanogram may be unreliable.","A second-look surgery may be required in cases of cholesteatoma removal.","Persistent effusion is the most significant complication.","All of the above"],"k":"e","x":"While the tympanic membrane remains relatively insensate after cartilage reconstruction, it is often necessary to take the patient to the operating room for eardrum intubation as tube placement can be difficult. Impedance tympanometry is unreliable after cartilage tympanoplasty and will generally yield a low-volume, type B tympanogram, despite normal hearing, due to the noncompliant nature of the cartilage. One serious disadvantage of using cartilage for reconstruction in cholesteatoma surgery is that it creates an opaque tympanic membrane posteriorly, which could potentially hide residual disease. If disruption of the cholesteatoma sac occurs, consider the advisability of performing a second-look surgery.The most significant pitfall seen in the postoperative period is persistent effusion with conductive hearing loss, requiring intubation of the reconstructed eardrum.This is seen in about 7% to 10% of cases and can be problematic in cases in which the entire tympanic membrane is reconstructed with the cartilage/perichondrium island flap."}]},{"t":"Chapter 11","q":[{"n":1,"s":"The authors identified four advantages associated with transcanal medial graft placement tympanoplasty. Which one of the following was not considered an advantage?","o":["It is quicker and more direct.","It results in less surgical trauma and reduces the likelihood of healing problems such as adhesions, narrowing, and stenosis of the ear canal.","It is technically easier to perform.","It results in less postoperative discomfort for the patient.","There is reduced risk of tympanic membrane blunting and burying of squamous epithelium beneath the graft."],"k":"c","x":"Although transcanal medial graft placement may be technically difficult in some circumstances, the advantages gained with this approach are felt by the authors to outweigh the difficulties associated with the procedure."},{"n":2,"s":"Identify which one of the following is not a contraindication for transcanal tympanoplasty surgery.","o":["A narrow ear canal that will only accommodate up to a 4.5-mm speculum","An elderly and debilitated patient","Involvement of only hearing ear and patient not a satisfactory surgical risk","A perforation with persistent and active drainage","Very questionable Eustachian tubal function"],"k":"d","x":"Drainage at the time of surgery is not believed by the authors to be an absolute contraindication to surgery. If drainage cannot be controlled preoperatively, this constitutes an indication for surgery."},{"n":3,"s":"Which one of the following techniques is not advocated by the authors?","o":["The head is secured with tape.","Preoperative antibiotics are usually administered.","The ear, auricle, and surrounding skin are cleansed with povidone-iodine solution.","The hair is secured with liquid spray adhesive and usually is not shaved.","The head is extended with the chin up."],"k":"b","x":"Studies have shown that no significant benefits result from the use of preoperative antibiotics."},{"n":4,"s":"Which one of the following tympanoplasty techniques is advocated by the authors?","o":["The entire bony ear canal skin is removed to allow satisfactory exposure.","If there is a prominent anterior bony canal wall “hump,” a postauricular incision should be used.","The graft is placed lateral to the malleus handle.","The ear speculum should be supported and manipulated by the surgeon’s fingers during the procedure.","Following graft placement, the ear canal is filled with moist Gelfoam."],"k":"c","x":"The authors believe that graft placement lateral to the malleus handle avoids interference with ossicular chain reconstruction and lessens the likelihood of postoperative middle ear adhesions."},{"n":5,"s":"Which one of the following postoperative methods is advocated by the authors?","o":["Cotton is placed in the ear canal and usually left in place for 3 weeks.","A mastoid dressing is usually placed at the end of the procedure.","If drainage occurs postoperatively, the patient is advised to come into the office immediately and the ear canal is cleaned using the microscope.","The patient is advised to keep the operated ear dry for 3 weeks, at which time the ear is examined in the office with a microscope.","Active autoinflation of the ear is begun 3 days postoperatively."],"k":"d","x":"It is important to keep the ear dry and to avoid inflating the ear for 3 weeks. Cotton should be placed in the meatus, changed as necessary for drainage, and discontinued after drainage has ceased. If drainage worsens, the patient is started on antibiotic ear drops."}]},{"t":"Chapter 12","q":[{"n":1,"s":"Which of the following conditions is not associated with a predisposition for chronic ear disease?","o":["Chronic tonsillitis","Adenoid hypertrophy","Allergic rhinitis","Chronic sinusitis"],"k":"a","x":""},{"n":2,"s":"For which of the following are temporal bone CT scans without contrast used for preoperative assessment in chronic ear surgery?","o":["Sinonasal disease","Epidural abscess","Brain hernia","Inner ear fistula"],"k":"d","x":""},{"n":3,"s":"Antimicrobial prophylaxis is not indicated in chronic ear surgery in which of the following situations?","o":["Violation of the dura with or without cerebrospinal fluid leak","Simple perforation","Labyrinthine fistula","Presence of indwelling devices such as a cochlear implant"],"k":"b","x":""},{"n":4,"s":"The undersurface grafting technique greatly reduces which of the following postoperative complications?","o":["Infection","Anterior sulcus blunting","Graft failure","Recurrent cholesteatoma"],"k":"b","x":""},{"n":5,"s":"The vascular strip is defined as the canal skin between","o":["The annulus and bony cartilaginous junction","The 12 o’clock and 6 o’clock positions in the ear canal","The malleus and the anulus","The tympanomastoid and tympanosquamous sutures"],"k":"d","x":""}]},{"t":"Chapter 13","q":[{"n":1,"s":"Which of the following factors may increase the risk of extrusion following ossicular reconstruction with a titanium prosthesis?","o":["Age of patient","Inadequate length of prosthesis","Absence of cartilage between prosthesis and tympanic membrane","Hydroxyapatite platform on prosthesis","Absence of malleus handle"],"k":"c","x":"Many allograft prostheses, including titanium and Plastipore, require a disk of cartilage to be interposed between the platform and tympanic membrane to prevent extrusion. Hydroxyapatite has demonstrated excellent biocompatibility and the use of cartilage is not always required with this allograft material; however, it is probably prudent to use cartilage even in these cases."},{"n":2,"s":"Which of the following reconstruction techniques can be used in the setting of a mobile malleus and stapes superstructure and a foreshortened incus?","o":["Total ossicular reconstruction prosthesis","Malleus-to-oval-window prosthesis","Stapes piston","Bone cement","Removal of incus and placement of total ossicular replacement prosthesis"],"k":"d","x":"When the gap between a foreshortened incus and a mobile stapes superstructure is small, bone cement can be used to reconstruct the ossicular chain and restore continuity between the incus and stapes. In situations where the gap is large, an incus bridge prosthesis can be used in conjunction with bone cement."},{"n":3,"s":"Successful ossicular reconstruction is most likely to be achieved when","o":["The Eustachian tube function is normal.","The canal wall remains intact.","Adequate tension is placed on the prosthesis.","A mobile stapes superstructure exists.","All of the above are correct."],"k":"e","x":"Each of the above factors contributes to improved success in ossicular reconstruction."},{"n":4,"s":"In your preoperative discussions with your patients undergoing ossicular chain reconstruction, what are the anticipated hearing results for partial ossicular replacement prostheses (PORPs) and total ossicular replacement prostheses (TORPs)?","o":["Complete closure of air-bone gap with PORPS and 5 dB air-bone gap with TORPs","PORPs with a closure of air-bone gap to within 5 dB in 90% of cases and to within 10 dB in 90% of TORPs","Closure of air-bone gap to within 15 dB with PORPs and to within 25 dB with TORPs in majority of patients","PORPs with closure of air-bone gap to within 5 dB and TORPs to within 10 dB in the majority of patients","An equivalent air-bone gap if the stapes footplate is mobile"],"k":"c","x":"Although we all would like to completely close the air-bone gap in our patients, it is important to have realistic expectations for yourself and your patients. The results with PORPs are generally better than with TORPs. In patients undergoing ossicular chain reconstruction with PORPs, two thirds should close the air-bone gap to within 15 dB, and two thirds of patients with TORPs should be within 25 dB."},{"n":5,"s":"In a patient undergoing cholesteatoma removal using an intact canal wall approach, the surgeon had to remove the mucosa off the promontory and also remove the involved incus. The malleus was mobile and the stapes was intact and mobile. What are the surgeon’s best options for the management of this ear?","o":["Graft the tympanic membrane and use a partial ossicular replacement prosthesis to reconstruct the ossicular chain.","Pack the ear with antibiotic-soaked packing and stage the operation.","Place a ventilation tube in the newly reconstructed tympanic membrane and then use a partial ossicular replacement prosthesis.","Place Gelfilm or Sialastic sheeting over the promontory and reconstruct at a later time.","Stage the operation and once the tympanic membrane has healed reconstruct the ossicular chain with a malleus-to-footplate prosthesis."],"k":"d","x":"A totally denuded promontory may result in severe scarring between it and the tympanic membrane. In cases where the mucosa is missing or severely diseased, it is best to cover the promontory with Gelfilm or Sialastic sheeting, and reconstruct the ossicular chain during a second-look procedure."}]},{"t":"Chapter 14","q":[{"n":1,"s":"All of the following are thought to contribute to the higher rate of recidivism seen with canal-wall-up tympanomastoidectomy (vs. canal-wall-down technique) except","o":["Tympanic membrane re-retraction with recurrent antral or epitympanic cholesteatoma formation","Suboptimal exposure to the attic, antrum, and middle ear due to the presence of the posterior canal wall leading to persistent disease","The presence of nitrogen-resorbing mucosa lining the mastoid cavity postoperatively","Compromised exposure of the sinus tympani due to the presence of the posterior canal wall"],"k":"d","x":""},{"n":2,"s":"In the canal-wall-reconstruction tympanomastoidectomy technique, bone pate collection should be performed","o":["After tympanic membrane grafting and replacement of the posterior canal wall","After a complete mastoidectomy has been performed but prior to making bony canal cuts with a microsagittal saw","Prior to any entry into mastoid cells","Following removal of the bony posterior canal wall"],"k":"c","x":""},{"n":3,"s":"In the canal-wall-reconstruction tympanomastoidectomy technique, slices of calvarial bone are placed","o":["In the attic and sinus tympani","In the sinus tympani and facial recess","In the facial recess and attic","Only in the attic"],"k":"c","x":""},{"n":4,"s":"The bony posterior canal wall is cut in the following fashion during the canal-wall-reconstruction tympanomastoidectomy technique:","o":["One beveled cut superiorly and one beveled cut inferiorly","Two cuts superiorly making a right angle and one beveled cut inferiorly","Two cuts inferiorly making a right angle and one beveled cut superiorly","One beveled cut superiorly and one straight cut inferiorly"],"k":"b","x":""},{"n":5,"s":"Contraindications to canal wall reconstruction tympanomastoidectomy include","o":["Mastoid cholesteatosis","Sinus tympani involvement","Facial paralysis","Tegmen defect with meningoencephalic herniation"],"k":"a","x":""}]},{"t":"Chapter 15","q":[{"n":1,"s":"A 35-year-old man with no previous ear disease presents with persistent left ear conductive hearing loss for 1 month following an upper respiratory infection concomitant with left ear pain, all of which resolved quickly with oral antibiotics. He did ultimately mention that the left ear was still very mildly painful. On examination, the left ear had seromucinous middle ear effusion; otherwise, the history and physical examination was normal. What would you do?","o":["Follow him for another month expecting full recovery.","Give him another round of oral antibiotic treatment.","Have him self-inflate the ear to speed aeration of the middle ear.","Order a temporal bone CT because you are concerned he might have masked mastoiditis."],"k":"d","x":"He had mastoiditis with fairly extensive bone destruction."},{"n":2,"s":"A 13-year-old girl presents with a history of three episodes of meningitis associated with episodes of rightsided acute suppurative otitis media. She was born with a right-sided unilateral profound sensorineural hearing loss. You suspect she has what?","o":["A right-sided meningoencephalocele through the mastoid tegmen","A right-sided Mondini malformation","A right-sided enlarged vestibular aqueduct syndrome","A patent Hyrtl’s fissure"],"k":"b","x":"She had a severe Mondini malformation with dehiscence of the medial wall of the vestibule with a large cerebrospinal fluid (CSF) connection between the internal auditory canal and the vestibule. She also had an incomplete stapes footplate allowing the CSF to bulge a CSF containing thin mucosal cyst filling the oval window niche."},{"n":3,"s":"A 40-year-old woman presents with a seizure, from which she fully recovered. She had never had seizures before. Her complete neurological examination was normal. The only abnormality found on full examination was an infected cholesteatoma in her right ear, which had drained intermittently for several years. You are concerned about what?","o":["Brain abscess","Subdural abscess","Meningitis","Otitic hydrocephalus"],"k":"a","x":"She had a large right temporal lobe brain abscess."},{"n":4,"s":"A 60-year-old woman presents with a spontaneous conductive hearing loss in the left ear that had been present for 3 months. She had been treated with antibiotics with no resolution. She had no previous ear problems. On examination, the left middle ear is filled with amber serous-appearing fluid. After a myringotomy and tube in the office, her ear developed a copious thin discharge continuously so that she had to, at times, place a cotton ball in the meatus and change it several times a day. You investigate for what?","o":["Chronic suppurative otitis media","Cerebrospinal fluid leak","Chronic serous otitis media","Fungal external otitis"],"k":"b","x":"She had a cerebrospinal fluid leak from a meningoencephalocele through the tegmen of the mastoid."},{"n":5,"s":"A 20-year-old man presents with a draining right ear and pain. When questioned about the pain, he tells you that the pain is in his right ear and behind his right eye. On examination, he has a perforation in the right drum and mucopurulent discharge. The rest of the history and examination is normal. You suspect what?","o":["Mastoiditis","Otitis external associated with the drainage","Brain abscess","Petrositis"],"k":"d","x":"He had petrositis that was discovered by CT."}]},{"t":"Chapter 18","q":[{"n":1,"s":"The indications for staging tympanoplasty include which of the following?","o":["Mucosal disease","Stapes fixation","Concern of residual cholesteatoma","All of the above"],"k":"d","x":"All are well-recognized indications."},{"n":2,"s":"Factors that have been blamed for postoperative collapse of the tympanic membrane include which of the following?","o":["Multiple surgeries","Eustachian tube dysfunction","Recurrent infections","Middle ear mucosal disease","b and d"],"k":"e","x":"Classically, Eustachian tube dysfunction has been blamed for retraction and collapse of the grafted tympanic membrane.With the increased use of staging, many surgeons have recognized the role of middle ear mucosal disease in the pathogenesis of tympanic membrane collapse."},{"n":3,"s":"For patients that have middle ear cholesteatoma found at the first stage, what percentage will have residual disease in the middle ear at the second stage?","o":["5%","15%","33%","66%","90%"],"k":"c","x":"This is an empiric observation."},{"n":4,"s":"What is the time interval between stages when the indication is possible residual cholesteatoma?","o":["3–6 months","6–9 months","9–18 months","18–24 months","24–36 months"],"k":"c","x":"These are guidelines established by Sheehy."},{"n":5,"s":"“Thick” Silastic sheeting has which dimension?","o":[".005 inch",".010 inch",".040 inch",".1 inch",".2 inch"],"k":"c","x":"This thickness is commonly used for staging.The .005-inch thickness is too easily displaced by scar tissue for use with severe mucosal disease."}]},{"t":"Chapter 19","q":[{"n":1,"s":"How is a cholesteatoma from a pars flaccida retraction pocket most likely to spread?","o":["Anteriorly, in the lateral mallear space, into the anterior epitympanum","Posteriorly, lateral to the body of the incus, to the aditus ad antrum","Inferiorly via the posterior pouch of von Tröltsch, lateral to the incus, and into the mesotympanum.","Posteriorly, medial to the body of the incus, to the aditus ad antrum.","Inferiorly via the posterior pouch of von Tröltsch, medial to the incus, and into the mesotympanum."],"k":"b","x":"Anterior spread is relatively rare. Inferior spread is lateral to the incus but is less common than the posterior route."},{"n":2,"s":"For which situation is it appropriate to attempt repair of a cholesteatoma fistula?","o":["A 3-mm lateral semicircular canal fistula during a second-stage surgery, with normal hearing in the contralateral ear","A 1-mm lateral semicircular canal fistula in an only hearing ear.","A 1.5-mm lateral semicircular canal fistula, with normal hearing in the contralateral ear.","A 0.5-mm cochlear fistula with normal hearing in the contralateral ear.","A 1.5-mm fistula involving the lateral semicircular canal and vestibule."],"k":"c","x":"Repair should not be attempted with fistulas greater than 2 mm, in an only hearing ear, or when it involves any labyrinthine structure other than the lateral semicircular canal."},{"n":3,"s":"Which would be the best approach for an acquired cholesteatoma that involves the geniculate ganglion, but without a sensorineural hearing loss?","o":["Mastoidectomy combined with a middle fossa craniotomy","Radical mastoidectomy","Bondy modified radical mastoidectomy","Canal-wall-up mastoidectomy with malleus head removal to expose the anterior epitympanum","Translabyrinthine"],"k":"a","x":"A middle fossa craniotomy will give the exposure needed for cholesteatoma removal. Mastoidectomy alone is unlikely to give adequate exposure of the geniculate ganglion. A radical mastoidectomy would not improve the exposure or facilitate postoperative care compared with other canal-wall-down mastoidectomy techniques. A translabyrinthine approach should be considered if there is no salvageable hearing."},{"n":4,"s":"Approximately 50% of the mastoid segment of the facial nerve is disrupted during removal of a large cholesteatoma. What should be done?","o":["Remove all cholesteatoma and plan nerve repair at a second stage.","Remove all cholesteatoma and evaluate facial function following surgery.","Decompress the nerve, remove the injured section, and place an interposition graft.","Reroute the facial nerve and anastomose it.","Decompress the nerve and put a small nerve graft into the defect."],"k":"c","x":"Repair is best done at the time of injury. The injured segment should be removed if it is greater than 30% of the total diameter of the nerve. Rerouting requires much more extensive drilling, as well as transection of the greater superficial petrosal nerve."},{"n":5,"s":"There is profuse bleeding from a 2-mm tear in the jugular bulb. How should you proceed?","o":["Firm intraluminal packing with Surgicel","A muscle plug reinforced with fibrin glue","Ligation of the sigmoid sinus and internal jugular vein","Cover the injury with gelatin foam","Surgicel packing between the bulb and the overlaying bone"],"k":"e","x":"Packing between the bulb and the overlaying bone usually works with a defect this size. Firm intraluminal packing may injure the nerves in the jugular foramen. The muscle plug and gelatin foam are inadequate. Ligation is rarely necessary."}]},{"t":"Chapter 20","q":[{"n":1,"s":"Encephaloceles occur most commonly with what other condition?","o":["Chronic otitis media","Head trauma","Idiopathic","Previous mastoid surgery","Arachnoid granulations"],"k":"d","x":"In 1989, Iurato reviewed 139 cases of temporal bone and encephalocele, and 59% occurred as a complication of previous mastoid surgery."},{"n":2,"s":"For an encephalocele to develop which event or events must occur?","o":["Dural injury","Bone dehiscence","Dural injury and bone dehiscence","Chronic otitis media","Head trauma"],"k":"c","x":"For an encephalocele to develop, two preexisting conditions are necessary and must occur: bone dehiscence and dural injury."},{"n":3,"s":"The most common presentation of cerebrospinal fluid (CSF) leak in the temporal bone is","o":["Middle ear effusion","Otorrhea","Meningitis","Seizure","Mass in the ear canal"],"k":"a","x":"Middle ear effusion and hearing loss are the most common presentation of CSF leak and encephalocele in the temporal bone. Subsequent myringotomy may result in otorrhea. Meningitis, seizures, and mass in the ear canal are all uncommon presenting conditions."},{"n":4,"s":"Confirmation of spinal fluid in the ear is best made with which test?","o":["Glucose content","Protein content","β-2 transferrin","CT","MRI"],"k":"c","x":"Identification of β-2 transferrin in a specimen is over 90% sensitive for identifying spinal fluid. CT and MRI are more valuable for locating possible sites of spinal fluid leakage."},{"n":5,"s":"The most common site of encephalocele formation is:","o":["Middle fossa","Posterior fossa","Ear canal","Middle ear","Oval window"],"k":"a","x":""}]},{"t":"Chapter 21","q":[{"n":1,"s":"Patients with far advanced otosclerosis are not candidates for a stapedectomy.","o":["True","False"],"k":"b","x":""},{"n":2,"s":"The advantages of stapes surgery using local anesthesia includes all of the following except","o":["More bleeding during surgery","Immediate feedback in terms of vertigo when manipulating the footplate","Typically shorter recovery time"],"k":"a","x":""},{"n":3,"s":"If too much posterosuperior canal wall bone is removed, adhesions to the incus or a retraction pocket can form.","o":["True","False"],"k":"a","x":""},{"n":4,"s":"The limits of exposure in stapes surgery include all of the following except","o":["Round window niche","Pyramidal eminence","Upper edge of tympanic fallopian canal","Malleus handle"],"k":"c","x":""},{"n":5,"s":"A surgeon might consider stopping the procedure if he or she encounters a:","o":["Fixed malleus","Tear in the tympanic membrane","Solid or obliterated footplate","Prolapsed facial nerve covering the footplate"],"k":"d","x":""}]},{"t":"Chapter 22","q":[{"n":1,"s":"Relative contraindications for stapedectomy include all of the following except","o":["Tympanic membrane perforation","Acute otitis externa","Active Ménière’s disease","Conductive hearing loss of at least 15 dB confirmed by tuning fork","Only hearing ear"],"k":"d","x":"Perforation, infection, or active Ménière’s disease present at stapedectomy can result in a postoperative hearing loss."},{"n":2,"s":"Possible risks and complications of stapedectomy surgery include","o":["Worsened hearing","Tinnitus","Dizziness","Taste disturbance","All of the above"],"k":"e","x":"All are well-recognized postoperative complications."},{"n":3,"s":"The tympanomeatal flap should be elevated so that which two landmarks can be visualized?","o":["Neck of the malleus and round window","Half of the diameter of the fallopian canal and stapedial tendon","Cochlear form process and Jacobson’s nerve","Eustachian tube orifice and a long process of incus","Subiculum and ponticulum"],"k":"a","x":"Exposure of these two landmarks will allow the tympanomeatal flap to be folded forward, providing adequate access to the middle ear and facilitating crimping of the prosthesis."},{"n":4,"s":"For a right-handed surgeon operating on a right ear, what two landmarks should be visualized at the conclusion of curetting?","o":["Neck of the malleus and round window","Half of the diameter of the tympanic fallopian canal and stapedial tendon","Cochlear forum process and Jacobson’s nerve","Eustachian tube orifice and a long process of incus","Subiculum and ponticulum"],"k":"b","x":"This exposure will allow visualization of the footplate and introduction of instruments. On a left ear, a righthanded surgeon will require more exposure for instrument access and the entire diameter of the fallopian canal should be exposed."},{"n":5,"s":"Which of the following statements are true about reparative granuloma?","o":["A reparative granuloma is a controversial entity whose modern existence is in doubt.","It may be due to retained ethylene oxide in gelfoam wire prostheses.","The attributed symptomatology may be explained by serous labyrinthitis.","The presentation can be explained by expected postoperative findings.","All of the above"],"k":"e","x":""}]},{"t":"Chapter 23","q":[{"n":1,"s":"For the partial stapedectomy technique, how much of the footplate should be removed?","o":["All of it","25%","Only that part which comes out easily","75%"],"k":"c","x":""},{"n":2,"s":"To properly size a piston-cup prosthesis, how is the correct length determined?","o":["The measurement from the surface of the footplate to the lateral surface of the incus is used.","The measurement from the surface of the footplate to the medial surface of the incus is used.","A prosthesis 4 mm in length is used universally, as it protrudes 0.2 to .03 mm into the vestibule.","One half of a mm is added to the measurement from the surface of the footplate to the lateral surface of the incus."],"k":"c","x":""},{"n":3,"s":"What is the minimum diameter of the opening into the vestibule required for the piston-cup prosthesis?","o":["Larger than 0.8 mm","Larger than 2.0 mm","Half of the footplate","The entire footplate"],"k":"a","x":""},{"n":4,"s":"The vein graft size and oval window position should be","o":["15 × 15 mm and adventitial side toward the vestibule","5 × 5 mm and endothelial side toward the vestibule","4 × 8 mm and adventitial side toward the vestibule","15 × 15 mm and endothelial side toward the vestibule"],"k":"c","x":""},{"n":5,"s":"For the treatment of juvenile otosclerosis, the prosthesis length should be sized","o":["The same as adult","One half mm shorter than adult","One half mm longer than adult","None of the above"],"k":"a","x":""}]},{"t":"Chapter 24","q":[{"n":1,"s":"Laser energy power (watts) per area of spot size (cm2) × exposure time (sec) is called","o":["Power density","Fluence","Intensity","Photon"],"k":"b","x":""},{"n":2,"s":"The most common indication of failure of primary stapedectomy requiring revision surgery is","o":["Dizziness and vertigo","Sensorineural hearing loss","Recurrence of conductive hearing loss","Facial nerve palsy"],"k":"c","x":""},{"n":3,"s":"The most common intraoperative finding associated with revision stapedectomy is","o":["Perilymph fistula","Prolapsed facial nerve","Displaced prosthesis","Fibrosis of oval window tissue"],"k":"c","x":""},{"n":4,"s":"The major advantage of lasers in revision stapes surgery is","o":["The ability to define the margins of the oval window","Less bleeding and better visualization of oval window","Thinning of existing membrane to more thoroughly identify the status of the oval window (footplate fragments, bone regrowth, etc.)","All of the above"],"k":"d","x":""},{"n":5,"s":"The cardinal rule of laser surgery of the oval window, regardless of the type of laser, is","o":["To never fire the laser directly into an open vestibule","Only perform revision surgery once","That the inner ear is immune to damage from laser energy","That there is nothing more to learn about laser revision stapes surgery"],"k":"a","x":""}]},{"t":"Chapter 25","q":[{"n":1,"s":"Which of the following statements regarding intraoperative audiometry is correct?","o":["It is not useful in cases done under local anesthesia.","It requires testing by an audiologist.","The frequency with the greatest air-bone gap is usually tested.","It does not assist in placement of the prosthesis in revision stapedectomy.","It will not prevent opening of the oval window membrane in revisions."],"k":"c","x":"Intraoperative audiometry is done under local anesthesia, does not require an audiologist, uses the greatest air-bone gap frequency, and assists in decisions regarding the footplate and prosthesis placement."},{"n":2,"s":"Which of the following statements is correct regarding promontory drilling?","o":["It cannot be done with patient under local anesthesia.","It will cause sensorineural hearing loss.","It will yield poorer hearing results in stapedectomy.","It should be done in a superior to inferior direction.","It should be done in a medial to lateral direction."],"k":"e","x":"Promontory drilling begins at the footplate promontory junction and sweeps laterally. All other statements are false."},{"n":3,"s":"A vein tissue graft is not useful in which of the following intraoperative situations?","o":["Sealing of the oval window after footplate removal","Centering of the stapes prosthesis over the central area of footplate removal","Preventing perilymph leak","Recreating a mobile oval window membrane","Repair of a necrosed distal long process"],"k":"e","x":"Vein tissue graft will not repair a necrosed incus. All other statements are correct."},{"n":4,"s":"In routine stapedectomy, which is not correct?","o":["Always use a speculum holder.","Check both the malleus and incus visually and by palpation.","There is no difference in audiometric results in stapedotomy as compared to partial stapedectomy, except in overclosure.","The vein graft should be placed with adventitia up.","Place the prosthesis with two-handed technique."],"k":"d","x":"The vein graft should be placed adventitia down, intima up.All other statements are correct."},{"n":5,"s":"The most appropriate candidate for revision stapedectomy is a patient with a history of:","o":["Sensorineural hearing loss without an oval window tissue graft","Sensorineural hearing loss with an oval window tissue graft","Malleus/incus fixation that is total","Stapedectomy in which the hearing initially improved then declined","Significant erosion of the incus"],"k":"d","x":"The most likely candidate is one whose hearing initially improved, then declined and who presents with a conductive hearing loss."}]},{"t":"Chapter 26","q":[{"n":1,"s":"Presence of acoustic reflexes on a preoperative audiogram should prompt the operating surgeon to","o":["Cancel the surgery.","Order a CT scan.","Consider superior semicircular canal dehiscence as a cause of the conductive hearing impairment.","Do all of the above."],"k":"d","x":""},{"n":2,"s":"With gentle pressure on a stapedotomy prosthesis after placement, patient dizziness should prompt the surgeon to consider that","o":["The prosthesis may be too long.","The otosclerotic inner ear syndrome may be operative and may require treatment with calcium fluoride.","A fistula exists in the round window.","Placing a vein seal would be helpful."],"k":"a","x":""},{"n":3,"s":"The law of additive inadequacy describes","o":["Reduction in surgeon ability with age","Unavoidable deterioration in surgical equipment over time","Surgical inadequacies that add up to poor results","Additive reduction in outcome with multiple surgeons"],"k":"c","x":""},{"n":4,"s":"Adequate surgical results can be achieved in all of the following except","o":["Superior semicircular canal dehiscence","X-linked progressive mixed deafness","Revision stapedotomy with obliterative otosclerosis","a and b","a, b, and c"],"k":"d","x":""},{"n":5,"s":"Studies have shown the following may produce sensorineural hearing loss following stapedotomy:","o":["Viral infection","Blood in the inner ear","Gusher","Otosclerosis","All of the above"],"k":"e","x":""}]},{"t":"Chapter 27","q":[{"n":1,"s":"Examination findings suggestive of perilymphatic fistula (PLF) include","o":["Rotatory nystagmus with fatigue and direction reversal","Nystagmus induced by loud noise or pressure to the eardrum","Abnormal electrocochleography (ECoG) with elevated summating potential/action potential (SP/AP) ratio (>0.5)","Positional nystagmus and a positive turning test"],"k":"d","x":"Nystagmus induced by noise or positive or negative pressure with intact tympanic membrane is indicative of a superior semicircular canal fistula. Rotary nystagmus with fatigue and direction reversal is classic for benign positional paroxysmal vertigo. Abnormally elevated SP/AP ratios have been noted in patients with PLF; however, they cannot be distinguished from Ménière’s patients who also have abnormal ECoG findings."},{"n":2,"s":"Middle ear exploration for PLF is recommended in which of the below cases:","o":["Mild hearing loss and/or disequilibrium following recent trauma","Sudden onset of hearing loss with no disequilibrium","Fluctuating hearing loss, episodic vertigo","Disequilibrium, worsening with coughing or straining, conductive hearing loss"],"k":"a","x":"Conservative, nonsurgical treatment is advocated in patients seen in the first 7 days after development of symptoms. However, if the patient’s hearing fails to recover in 10 days of bed rest, surgical intervention should be carried out in the next 4 days. Sudden sensorineural hearing loss without history of prior antecedent traumatic event should be treated medically. Fluctuating hearing loss and episodic vertigo is likely Ménière’s disease. Conductive hearing loss with disequilibrium worsened byValsalva-type maneuvers is likely superior semicircular canal dehiscence."},{"n":3,"s":"Clear fluid is encountered in the middle ear space during exploration of PLF. The most appropriate next step would be to","o":["Send for β-2 transferrin assay","Suction the fluid","Have the patient perform a Valsalva maneuver","Patch both the oval and round windows"],"k":"b","x":"It is important to remove any fluid present on initial exposure of the middle air space as this is likely diffusion of local anesthetic into the middle ear space. Once the fluid is suctioned, having the patient perform aValsalva maneuver and putting pressure over the incudostapedial joint can help determine the presence of a leak. β-2 transferrin assay has not been shown to be helpful for intraoperative determination of perilymph.There is lack of general consensus as to whether both the oval and round windows should be patched without visual confirmation of PLF."},{"n":4,"s":"Anatomical features of the round window that increase the likelihood of PLF are","o":["Deep round window niche","Large overhanging promontory","The inability to visualize round window transtympanically","A 45-degree angle of the round window membrane to the promontory"],"k":"d","x":"Tears of the round window membrane occur most frequently when its position is 45 degrees to the promontory and there is little or no overhanging promontory, allowing direct visualization of the round window membrane transtympanically."},{"n":5,"s":"Recurrent PLF should be suspected if","o":["Disequilibrium persists 2 weeks after surgery.","Whirling episodic vertigo persists or develops.","Hearing levels fail to improve.","A fat graft was used to patch the fistula and 6 weeks of healing have taken place."],"k":"d","x":"Multiple authors have recommended avoiding use of fat as a graft material as it has been noted to have an increased failure rate. Six weeks should be allowed for the wound to completely heal before contemplating reexploration.Whirling episodic vertigo is typical for endolymphatic hydrops and not PLF. Hearing improvement has been reported in less than 50% of patients who have undergone PLF repair."}]},{"t":"Chapter 28","q":[{"n":1,"s":"Bell’s palsy is characterized by all of the following pathophysiologic findings except","o":["HSV-1 DNA in facial perineural fluid at the time of nerve decompression in some patients","Lymphocytic infiltration, neural edema, and myelin degeneration most prominent at the labyrinthine segment","Constriction of the facial nerve at the meatal foramen with distal ischemia","Degeneration of the cisternal segment of the facial nerve","A spectrum of injury to the facial nerve from neuropraxia to neurontomesis"],"k":"d","x":""},{"n":2,"s":"Which of the following clinical findings is most consistent with the diagnosis of Bell’s palsy?","o":["Progression to complete paralysis over 1–7 days","A palpable parotid mass","Recent hearing loss associated with the facial paralysis","Other cranial neuropathies associated with the onset of the facial paralysis","Continued complete facial paralysis 3–6 months after the initial onset"],"k":"a","x":""},{"n":3,"s":"When is electrodiagnostic testing of the facial nerve indicated in the setting of Bell’s palsy?","o":["Immediately after the onset of complete paralysis","Two weeks after the onset of complete paralysis","Worsening paralysis after appropriate medical therapy","Seventy-two hours after the onset of complete facial paralysis","Immediately once eye closure becomes incomplete"],"k":"d","x":""},{"n":4,"s":"Appropriate surgical management of Bell’s palsy involves all of the following except","o":["Complete paralysis of less than 14 days’ duration","A transmastoid approach","Greater than 90% duration on electroneurography performed at least 72 hours after the onset of complete paralysis","Lack of voluntary motor unit potentials on facial electromyogram","Bony decompression of the labyrinthine, geniculate, and proximal tympanic segments"],"k":"b","x":""},{"n":5,"s":"All of the following findings are consistent with the diagnosis of Ramsay-Hunt syndrome in a patient with acute facial paralysis except","o":["Periauricular vesicular eruptions","Otalgia","Predominant involvement of the frontal and orbital branches of the facial nerve","Other cranial neuropathies","Skip regions of facial nerve involvement"],"k":"c","x":""}]},{"t":"Chapter 29","q":[{"n":1,"s":"What segment of the facial nerve is most commonly damaged as a result of temporal bone trauma?","o":["Intracranial","Meatal","Labyrinthine/perigeniculate","Tympanic","Mastoid"],"k":"c","x":"The labyrinthine/perigeniculate portion of the facial nerve is involved in up to 90% of cases."},{"n":2,"s":"All of the following are most commonly associated with longitudinal temporal bone fractures except","o":["Frontal/occipital impact","Conductive hearing loss","Ossicular damage","Bloody otorrhea","Fracture through the foramen ovale"],"k":"a","x":"Frontal/occipital impact is most commonly associated with transverse temporal bone fractures."},{"n":3,"s":"Which of the following findings would favor surgical exploration rather than observation in a patient with traumatic facial nerve paralysis?","o":["Immediate onset of complete facial nerve paralysis after penetrating injury","Delayed onset of facial nerve paralysis with greater than 95% degeneration on electroneuronography (ENoG)","Bony fragment impingement of the facial nerve on CT scan","None of the above","All of the above"],"k":"e","x":"All of the findings would favor surgical exploration. In a and c, the chance of a complete transection of the facial nerve is high. Progressive deterioration of facial nerve function with a greater than 95% degeneration on ENoG are also associated with poor outcomes."},{"n":4,"s":"What is the best approach for surgical decompression of the facial nerve in a patient who has complete hearing loss on the paralyzed side?","o":["Transmastoid","Translabyrinthine","Middle cranial fossa","Suboccipital","None of the above"],"k":"b","x":"In a patient without residual hearing, the preferred approach is translabyrinthine because it provides adequate exposure of the perigeniculate area without many of the risks of serious complications associated with the middle cranial fossa approach."},{"n":5,"s":"What is the best result (House-Brackmann grade) in terms of facial nerve function after exploration and primary anastamosis?","o":["I","II","III","IV","V"],"k":"c","x":"The best surgical result that can be attained after primary anastamosis is House-Brackmann III."}]},{"t":"Chapter 30","q":[{"n":1,"s":"The most common presenting symptom for a facial nerve tumor patient is","o":["Facial paralysis","Facial twitching","Hearing loss","Pulsatile tinnitus","Otorrhea"],"k":"c","x":"Facial nerve tumors can cause a sensorineural hearing loss if they develop in the internal auditory canal or a conductive hearing loss if they are present in the middle ear or mastoid."},{"n":2,"s":"Proven approaches to the management of facial nerve neuromas include","o":["Observation","Surgical resection and nerve repair","Decompression","Radiation therapy","a, b, and c"],"k":"e","x":"There are few reports of radiation treatment for facial nerve tumors and no assessments of long-term efficacy."},{"n":3,"s":"The entire length of the intracranial/intratemporal nerve can be accessed through which approach?","o":["Transcanal","Transmastoid/extended facial recess","Translabyrinthine","Suboccipital","Transcondylar"],"k":"c","x":"The translabyrinthine approach provides exposure of the facial nerve from the brain stem to the stylomastoid foramen."},{"n":4,"s":"The expected facial nerve result after facial nerve repair is","o":["I–II","II–III","III–IV","IV–V","V–VI"],"k":"c","x":"The intracranial and intratemporal facial nerve is monofasicular. After facial nerve anasatomosis, synkenesis is an expected result."},{"n":5,"s":"Facial nerve repair is best accomplished","o":["With as many sutures as possible","Without a nerve graft","In a tensionless fashion","In a second-stage procedure","With a laser welding technique"],"k":"c","x":"It has been shown that a tensionless anastomosis is important for success."}]},{"t":"Chapter 31","q":[{"n":1,"s":"Which of the following is considered to be an absolute contraindication to cochlear implantation?","o":["Duration of deafness greater than 30 years","Auditory neuropathy","Enlarged vestibular aqueduct","Michel aplasia","All of the above"],"k":"d","x":""},{"n":2,"s":"Patients with cochlear implants are at higher risk for developing meningitis. The CDC has recommended which of the following vaccinations to reduce the incidence of meningitis in cochlear implant recipients?","o":["Pneumovax for all patients greater than 2 years of age","Prevnar vaccine for all patients less than 5 years of age","Hib vaccine for all patients less than 5 years of age","Meningococcal vaccination for all patients greater than 5 years of age","a, b, and c","All of the above"],"k":"e","x":""},{"n":3,"s":"Bilateral cochlear implantation is experimental and should only be performed as part of a clinical trial.","o":["True","False"],"k":"b","x":""},{"n":4,"s":"Assuming audiometric criteria for cochlear implantation are met, which of the following patients would be the poorest candidate for cochlear implantation?","o":["A 14-year-old male with congenital, profound sensorineural hearing loss who uses sign language as his primary mode of communication","An 8-year-old female with progressive hearing loss following meningitis","An 82-year-old female with gradually progressive hearing loss","A 14-month-old male with congenital sensorineural hearing loss","A 15-year-old female with congenital, progressive sensorineural hearing loss with normal speech and language"],"k":"a","x":""},{"n":5,"s":"Which of the following techniques should be used during surgery for cochlear implantation?","o":["Skin and periosteal incisions should overlap by at least 1 cm","The internal device should be placed as close as possible to the postauricular crease","The cochleostomy should not be packed with soft tissue, as this increases the risk of developing meningitis","The cochleostomy should be placed between the round window and oval window to ensure insertion occurs in the scala vestibuli"],"k":"a","x":""}]},{"t":"Chapter 33","q":[{"n":1,"s":"What is the most important factor to establish osseointegration?","o":["Patient age","Handling of soft tissue","Cooling during drilling","Gender","Patient hygiene"],"k":"c","x":"Excessive heat during drilling will cause trauma to the osteocytes and could result in soft tissue healing instead of osseointegration."},{"n":2,"s":"To establish a reaction-free skin penetration, it is important to","o":["Remove all periosteum","Be careful not to remove any of the periosteum","Use an extra long abutment","Make the skin at the penetration site thin and hairless","Use firm packing under healing cap"],"k":"d","x":"Thin skin at the implant site will reduce the relative mobility between implant and skin, which is the key to a lasting, reaction-free skin penetration.The important daily cleaning is facilitated if no hair follicles are present."},{"n":3,"s":"Important for success with an ear-level, bone-anchored hearing aid is when the","o":["Air-bone gap is less than 20 dB","Air-bone gap is larger than 20 dB","Cochlea reserve is better than 35 dB","Cochlea reserve is worse than 60 dB","Bilateral cochlea deafness"],"k":"c","x":"Air-bone gap is of no importance at any level. At 60 dB cochlea reserve, a body-worn aid is probably needed."},{"n":4,"s":"The recommended way to handle postoperative skin necroses is","o":["Conservative handling with mild ointment","Revision surgery as soon as possible with a free graft","Removal of skin-penetrating abutment","Removal of coupling and bone implant","Long-term intravenous antibiotics"],"k":"a","x":"Even in large defects,healing will take place with a conservative attitude, even if it could take some time."},{"n":5,"s":"Which of the following is the best method to use to handle damage to the sigmoid sinus during boneanchored hearing aid surgery?","o":["Plug with bone wax, close wound, and wait 6 months for next trial","Plug with periosteum and find a new implant site","Perform a mastoidectomy to identify the damaged area","Use a p-PTFE membrane to stop bleeding","Enlarge the defect, fill with muscle tissue, and use fibrin glue"],"k":"b","x":"Sigmoid sinus is a low-pressure system and damage of the wall is of minor importance. It is easily stopped with some soft tissue, and a new implant site close by can often be found."}]},{"t":"Chapter 34","q":[{"n":1,"s":"What is the pathophysiologic correlate of Ménière’s disease?","o":["Scarring and fibrosis of the periductal and saccular tissues within the vestibular aqueduct and opercular regions","Contraction of the mastoid cavity with narrowing of Trautman’s triangle by anteromedial displacement of the sigmoid sinus","Dilation of the membranous endolymphatic spaces including the scala media, saccule, and endolymphatic system","Shortening and narrowing of the vestibular aqueduct","Episodic vertigo lasting more than 30 minutes associated with nausea and vomiting, fluctuating or deteriorating hearing often in the low frequencies initially, and tinnitus and/or aural pressure."],"k":"c","x":"Endolymphatic hydrops, as documented by temporal bone histopathologic analysis of Ménière’s patients,shows dilatation of the membranous endolymphatic spaces, particularly the scala media and saccule. Answers a, b, and d are common findings within temporal bones of Ménière’s patients that may contribute to the symptomatology and development of the pathophysiologic state of hydrops. Answer e is the 1995 Committee on Hearing and Equilibrium symptom diagnosis for possible Ménière’s disease."},{"n":2,"s":"The functional role of the endolymphatic sac is to","o":["Maintain homeostasis of the endolymph with a graded concentration of sodium and potassium","Provide immunologic support for the inner ear","Remove debris and infectious waste by phagocytes","Provide hormonal maintenance of inner ear fluid balance by secretion of Saccin and other cell-signaling effectors","All of the above"],"k":"e","x":"Physiologic evidence that the endolymphatic sac participates in inner ear immunity and control of fluid dynamics by humoral and local cellular activity are helping to identify the direct role that the endolymphatic system plays on hearing and balance function."},{"n":3,"s":"According to the 1995 Committee on Hearing and Equilibrium guidelines, the appropriate minimal follow-up time prior to reporting data in Ménière’s disease is","o":["6 months","12 months","18 months","24 months","36 months"],"k":"d","x":"1995 guidelines of the American Academy of Otolaryngology—Head and Neck Surgery standardize the diagnosis and reporting of Ménière’s disease to minimize confounding effects of the natural history of the disease.They also promote standard benchmarks with which to compare data between competing treatment arms and studies. According to these guidelines, observations over the 6 months preceding intervention should be compared with observations within the 18 to 24 months following treatment. For comparison of audiometric data, the worst audiogram in the 6 months prior to treatment should be compared to the poorest audiogram following treatment."},{"n":4,"s":"Endolymphatic sac procedures accumulatively offer class A and B results in what percentage of patients?","o":["Less than 50%","51%–65%","66%–80%","81%–90%","Greater than 90%"],"k":"d","x":"According to the 1995 Committee on Hearing and Equilibrium guidelines, class A responses to treatment of Ménière’s disease completely eliminate vertigo when comparing the 6 months prior to treatment with the 6-month period 18 to 24 months following intervention. Class B results occur when an intervention reduces the frequency of definite vertigo spells to less than 40% of the pretreatment levels. Looking at endolymphatic sac interventions between 1985 and 1995 with adequate follow-up,Grant andWelling showed a weighted effect of 86% class A/B results.A similar analysis between 1995 and 1997 shows endolymphatic surgery to be 84% effective."},{"n":5,"s":"What is the most common intervention for medically refractory Ménière’s disease in patients with serviceable hearing?","o":["Intratympanic gentamicin","Tube insertion with application of micropressure, Meniette system","Labyrinthectomy","Vestibular nerve section","Endolymphatic sac procedure"],"k":"e","x":"Endolymphatic sac surgery is the preferred primary surgical treatment of Ménière’s disease by American Otologic and Neurotologic Society members in patients refractory to medical management with serviceable hearing, bilateral disease, and in an only hearing ear.The total numbers of endolymphatic procedures is greater than numbers for other interventions. Intratympanic gentamicin therapy evolved throughout the 1990s and is used as first-line surgical treatment in patients with hearing loss and unilateral disease. Surgical labyrinthectomy numbers are falling, and numbers of vestibular nerve sections remain at a steady level."}]},{"t":"Chapter 35","q":[{"n":1,"s":"The meatal plane is defined by","o":["The blue line of the posterior canal and a 60-degree angle","The blue line of the superior canal and a 60-degree angle","The blue line of the lateral canal and a 60-degree angle","Bisecting the angle defined by the superior canal and the greater superficial petrosal nerve","The flat bone 1 cm medial to the geniculate ganglion"],"k":"b","x":""},{"n":2,"s":"An absolute contraindication to middle fossa vestibular nerve section is","o":["An only hearing ear","Bilateral Ménière’s disease","Incapacitating vertigo","Diuretic allergy","Age less than 60 years"],"k":"a","x":""},{"n":3,"s":"Exposure of the tegmen tympani facilitates orientation by","o":["Identification of the malleus and incus","Identification of the lateral canal","Identification of the superior canal","Identification of the posterior canal","Identification of the stapedius muscle"],"k":"a","x":""},{"n":4,"s":"Cutting rather than avulsing the vestibular nerve is preferred because of possible","o":["Injury of the cochlear nerve","Cerebrospinal fluid leak","Increased dural injury","Increased facial nerve injury","Less effective vertigo control"],"k":"a","x":""},{"n":5,"s":"Middle fossa vestibular nerve section hearing loss risk is","o":["Less than 5%","Greater than 20%","Greater than 30%","Greater than 40%","Greater than 50%"],"k":"a","x":""}]},{"t":"Chapter 36","q":[{"n":1,"s":"Which of the following is the most important component of the preoperative evaluation when considering vestibular neurectomy?","o":["Clinical history and physical examination","CT scan of the temporal bone","Caloric testing results","MRI","Audiometric findings"],"k":"a","x":"All of the other components of the preoperative workup may be helpful, but clinical history and physical examination are the most important components when identifying the cause of dizziness prior to considering any surgical treatment for relief of vertigo."},{"n":2,"s":"Which patient is best suited for treatment of vertigo with a vestibular neurectomy?","o":["A patient with vestibular neuritis","A patient with
