benign paroxysmal positional vertigo","A patient with bilateral Ménière’s disease","A patient with migrainous vertigo","A patient with unilateral Ménière’s disease"],"k":"e","x":"Patients with unilateral Ménière’s disease have the best response to selective vestibular neurectomy.There is no surgical treatment of migrainous vertigo and, if surgical treatment is undertaken for benign paroxysmal positional vertigo, it is most likely to be canal occlusion or singular neurectomy. Vestibular neuritis is much more unlikely to be treated successfully with vestibular neurectomy. Bilateral Ménière’s disease is a relative contraindication to vestibular neurectomy."},{"n":3,"s":"Which of the following statements best describes the course of the facial nerve from the brain stem to the internal auditory canal?","o":["The facial nerve leaves the brain stem inferior and slightly anterior to the eighth cranial nerve and rotates in an anterior and superior direction so that it resides anterior to the superior vestibular nerve and superior to the cochlear nerve in the internal auditory canal.","The facial nerve leaves the brain stem anterosuperior to the eighth cranial nerve and maintains that position into the internal auditory canal where it is situated anterior to the cochlear nerve and inferior to the superior vestibular nerve.","The facial nerve leaves the brain stem anterosuperior to the eighth cranial nerve and rotates until it is located anterior to the cochlear nerve and inferior to the superior vestibular nerve.","The facial nerve leaves the brain stem posteroinferior to the eighth cranial nerve and rotates until it is anterior to the cochlear nerve and inferior to the superior vestibular nerve in the internal auditory canal.","The facial nerve leaves the brain stem directly inferior to the eighth cranial nerve and rotates posteriorly such that it is located posterior to the cochlear nerve and inferior to the superior vestibular nerve in the internal auditory canal."],"k":"a","x":""},{"n":4,"s":"Which of the following is the most commonly cited complication associated with the retrosigmoid vestibular neurectomy?","o":["Cerebrospinal fluid leak","Wound infection","Aseptic meningitis","Subdural hematoma","Chronic headache"],"k":"e","x":"The retrosigmoid approach is associated with an approximately 10% chance of headache that can be long-lasting and disabling."},{"n":5,"s":"Which of the following statements best describes the success rate of posterior fossa vestibular neurectomy at eliminating vertigo and maintaining hearing?","o":["Posterior fossa vestibular neurectomy is greatly inferior to labyrinthectomy in both controlling vertigo and preserving hearing.","Posterior fossa vestibular neurectomy is slightly inferior to labyrinthectomy in controlling vertigo and preserves hearing in approximately two thirds of patients.","Posterior fossa vestibular neurectomy is slightly inferior to labyrinthectomy in preserving hearing while controlling vertigo in approximately two thirds of patients.","Posterior fossa vestibular neurectomy is superior to labyrinthectomy at controlling vertigo, but not at preserving hearing.","Posterior fossa vestibular neurectomy is superior to labyrinthectomy in both controlling vertigo and preserving hearing."],"k":"b","x":"Labyrinthectomy is the gold standard for control of vertigo but results in complete loss of hearing.In contrast,posterior fossa vestibular neurectomy controls vertigo in greater than 90% of patients and preserves hearing in 60% to 70% of patients."}]},{"t":"Chapter 38","q":[{"n":1,"s":"All of the following are characteristic features of the nystagmus of a positive Dix-Hallpike maneuver except","o":["Predominantly torsional, side specific","Latency of 3–5 seconds","Fatigability with repeat testing","Limited duration of 60–90 seconds","Reversal when resuming the sitting position"],"k":"d","x":""},{"n":2,"s":"Benign paroxysmal positional vertigo (BPPV) can result from, or has been correlated to, all of the following except","o":["Ménière’s disease","Autoimmune inner ear disease","Migraine","Stapedectomy","Labyrinthitis"],"k":"b","x":""},{"n":3,"s":"The most common form of BPPV results from","o":["Anterior canal canalithiasis","Lateral canal cupulolithiasis","Lateral canal canalithiasis","Posterior canal cupulolithiasis","Posterior canal canalithiasis"],"k":"e","x":""},{"n":4,"s":"The following statements about posterior canal occlusion surgery for BPPV are all correct except","o":["Free-floating particles can be seen in about 30% of cases.","The risk of hearing loss is about 20%.","Transient disequilibrium is seen in virtually all patients.","Bilateral occlusions can be safely done in a sequential manner.","Intraoperative auditory monitoring is not required."],"k":"b","x":""},{"n":5,"s":"Transmastoid canal occlusion surgery has been used for all of the following except","o":["Otosclerosis","Horizontal canal BPPV","Acoustic neuroma excision","Superior canal dehiscence","Trigeminal schwannoma"],"k":"a","x":""}]},{"t":"Chapter 39","q":[{"n":1,"s":"Cochleosacculotomy creates a permanent defect in","o":["Osseous spiral lamina and cochlear duct and saccule","Vestibular aqueduct and endolymphatic sac and saccule","Cochlear aqueduct and endolymphatic sac and saccule","Singular nerve","Round window membrane"],"k":"a","x":""},{"n":2,"s":"The appropriate pick length for cochleosacculotomy without drilling the round window niche is","o":["1 mm","2 mm","3 mm","4 mm","Any pick length which can pierce the round window"],"k":"c","x":""},{"n":3,"s":"Hearing loss after cochleosacculotomy is","o":["Almost zero","Progressive for weeks","Immediate","Reversible with mannitol","Only in the high frequencies"],"k":"b","x":""},{"n":4,"s":"Vertigo control with cochleosacculotomy is","o":["99%","50%","65%","Improved with time","Predictable by the presence of immediate nystagmus"],"k":"c","x":""},{"n":5,"s":"The vertigo control rate in Ménière’s disease is affected by a strong placebo effect.","o":["True","False"],"k":"a","x":""}]},{"t":"Chapter 40","q":[{"n":1,"s":"The most important element of a transcanal labyrinthectomy to achieve mechanical destruction of the five vestibular end organs is","o":["Identification and removal of the saccule","Identification and removal of the utricle","Mechanical probing of the three semicircular canals","Surgical widening of the oval window"],"k":"b","x":""},{"n":2,"s":"The most common cause of cerebrospinal fluid leakage during the course of a transcanal labyrinthectomy is","o":["Fracture of the crisbose bone at the medical aspect of the vestibule","Widely patent cochlear aqueduct","Anomalous spinal fluid communication along course of the facial nerve","Widely patent communication of the spinal fluid with the perilymphatic space of the posterior semicircular canal"],"k":"a","x":""},{"n":3,"s":"Facial nerve injury may complicate a transcanal labryinthectomy. The most common site of the injury is at the","o":["Descending segment","Horizontal segment","Geniculate ganglion","Internal auditory canal"],"k":"b","x":""},{"n":4,"s":"The most difficult vestibular neuroephithelium to destroy by a transcanal labyrinthectomy is","o":["Maculae utriculi","Macular sacculi","Crista ampullaris of lateral semicircular canal","Crista ampullaris of posterior semicircular canal"],"k":"d","x":""},{"n":5,"s":"Failure to obliterate the vestibule with a tissue seal following transcanal labyrinthectomy may","o":["Result in incomplete destruction of the vestibular neuroepithelium","Result in delayed facial paresis","Increase the chance of postoperative meningitis","Result in tramautic neuroma of the superior or inferior vestibular nerve"],"k":"c","x":""}]},{"t":"Chapter 42","q":[{"n":1,"s":"What is the most common serious complication of superior canal dehiscence (SCD) plugging surgery in the initial 24 hours after surgery?","o":["Aphasia","Hematoma","Seizure","Meningitis"],"k":"b","x":""},{"n":2,"s":"Which factor puts patients at considerably greater risk of hearing loss after SCD plugging surgery?","o":["SCD greater than or equal to 4 mm in size","Preoperative air-bone gap greater than 40 dB","Prior stapes surgery","Pulsatile tinnitus"],"k":"c","x":""},{"n":3,"s":"Which of the following is not a relative contraindication to SCD plugging?","o":["Prior middle ear surgery","Prior successful SCD plugging on the contralateral side","Age greater than 70 years","Preoperative oscillopsia symptoms"],"k":"d","x":""},{"n":4,"s":"Which of the following symptoms are not likely to be improved after SCD plugging?","o":["Disorientation when rapidly rotating the head to look at something on the floor","Disorientation and oscillopsia in response to loud noise","Disturbing sound of one’s own voice","Pulsatile tinnitus"],"k":"a","x":""},{"n":5,"s":"Two hours after SCD plugging surgery the patient has severe head pain on the side of the surgery and difficultly naming some common items. What is the appropriate next step in management?","o":["CT scan of the head without intravenous contrast","Order a patient-controlled anesthesia machine so he or she does not have to ask the nurse for narcotics","Reassure the patient that the symptoms will improve with time","Hold high-dose steroids and reassess in 4 hours"],"k":"a","x":""}]},{"t":"Chapter 45","q":[{"n":1,"s":"Gradenigo’s syndrome usually includes all of the following except","o":["Retro-orbital pain","Fourth cranial nerve palsy","Otorrhea","Hearing loss","Sixth nerve palsy"],"k":"b","x":""},{"n":2,"s":"The most serious complication of the infracochlear approach to the petrous apex is","o":["Sensorineural hearing loss","Facial nerve injury","Tearing of the tympanic membrane","Carotid artery injury","Rupture of the jugular bulb"],"k":"d","x":""},{"n":3,"s":"Characteristic imaging of cholesterol granuloma includes","o":["Lack of pneumatization of contralateral petrous apex on CCT","Hyperintense T1W and T2W images on MRI","Hypointense T1W and hyperintense T2W images on MRI","Hyperintense T1W and hypointense T2W images on MRI","None of the above"],"k":"b","x":""},{"n":4,"s":"In the infralabyrinthine approach to the petrous apex, the structure at greatest risk is","o":["The carotid artery","The jugular bulb","The facial nerve","The posterior semicircular canal","The endolymphatic sac"],"k":"b","x":""},{"n":5,"s":"The infracochlear approach to the petrous apex includes all of the following except","o":["Transection of the external auditory","Elevation of the tympanomeatal flap","Disarticulation of the incudostapedial joint","Removal of tympanic bone","Skeletonization of the carotid artery"],"k":"c","x":""}]},{"t":"Chapter 46","q":[{"n":1,"s":"The distinction between a tympanomastoid glomus tympanicum versus a tympanomastoid glomus jugulare is","o":["Visible mass in a tympanicum","Erosion of jugular bulb","Erosion of carotid canal","Middle ear and mastoid involvement","Secretion of vasoactive chemicals"],"k":"b","x":"Jugulare tumors arise from the jugular bulb."},{"n":2,"s":"Vocal cord paralysis occurs soonest with","o":["Glomus tympanicum","Glomus jugulare","Glomus vagale","Jugular foramen schwannoma","Jugular foramen meningioma"],"k":"c","x":"Early onset of vocal cord paralysis is characteristic of glomus vagale."},{"n":3,"s":"Preoperative embolization in glomus jugulare surgery","o":["Reduces intraoperative blood loss","Eliminates the need for jugular bulb resection","Improves cranial nerve outcomes","Alters periauricular incisions due to vascular compromise","Has no proven intraoperative or postoperative effect"],"k":"a","x":"Preoperative embolization significantly reduces intraoperative blood loss."},{"n":4,"s":"The most common arterial supply of glomus jugulare tumors is the","o":["Internal carotid artery","External carotid artery","Ascending pharyngeal artery","Occipital artery","Infratemporal fossa artery"],"k":"c","x":"The ascending pharyngeal branch of the external carotid artery is the most common arterial supply of glomus tumors."},{"n":5,"s":"Preoperative biopsy of glomus tumor is routinely used for surgical planning and patient counseling.","o":["True","False"],"k":"b","x":"Biopsy risks uncontrollable hemorrhage or major arterial/venous injury."}]},{"t":"Chapter 47","q":[{"n":1,"s":"During resection of an anterior skull base malignancy, extensive removal of bone at the lateral aspect of the sphenoid is required. Abrupt bleeding is encountered that obliterates the entire surgical field. Vigorous packing with absorbable hemostatic agents successfully controls the bleeding. Postoperatively the patient complains of ipsilateral double vision on lateral gaze. No other focal neurologic deficit can be detected. The most likely cause of this deficit is","o":["Acute cerebral hemorrhage","Edema in Dorello’s canal","Overzealous packing of the cavernous sinus","Carotid artery aneurysm","Injury to cranial nerve V"],"k":"c","x":""},{"n":2,"s":"Appropriate studies for detection of aspiration in patients with lower cranial nerve deficits after skull base surgery include (choose all that apply)","o":["Bedside flexible endoscopic evaluation of swallowing (FEES)","Subjective report from the patient","Chest x-ray","Modified barium swallow (MBS)","Flexible fiberoptic laryngoscopy"],"k":"acde","x":"","m":1},{"n":3,"s":"Velopalatal insufficiency associated with lateral skull base surgery may be caused by all of the following except","o":["Tensor veli palatini paralysis","Loss of cranial nerve X nodose ganglion fibers","Nerve of Hering injury","Palatopharyngeus muscle dysfunction"],"k":"c","x":""},{"n":4,"s":"A patient undergoes lateral skull base tumor resection that includes sacrifice of cranial nerve VII and removal of tumor at foramen ovale. Acceptable rehabilitation of the cranial deficits would include (choose all that apply)","o":["Facial nerve cable graft","Gore-tex or alloderm orbicularis oris sling","Temporalis muscle sling","Masseter muscle sling","Temporal fossa implant"],"k":"abe","x":"","m":1},{"n":5,"s":"A 26-year-old sales professional undergoes routine resection of a glomus vagale tumor. She has previously undergone Silastic medialization at an outside institution but complains of a breathy voice and nasal speech. Swallowing evaluation and airway evaluations show decreased pharyngeal squeeze without aspiration, poor glottal closure with vocal cord atrophy, and paralysis of the left hemipalate. The best surgical option(s) for rehabilitation include (choose all that apply)","o":["Vocal cord augmentation with collagen injection","Arytenoid adduction only","Revision silastic medialization with arytenoid adduction","Palatal adhesion","Cricopharyngeal myotomy"],"k":"cd","x":"","m":1}]},{"t":"Chapter 48","q":[{"n":1,"s":"The indications for a middle fossa approach for removing an acoustic tumor include","o":["Small tumor","Good hearing","Intracanalicular location","Location mainly in the cerebellopontine angle","a, b, and c"],"k":"e","x":"The exposure of the cerebellopontine angle is limited through the middle fossa approach."},{"n":2,"s":"Acoustic tumors arising from which nerve have a higher incidence of hearing preservation?","o":["Superior vestibular nerve","Inferior vestibular nerve","Cochlear nerve","Facial nerve"],"k":"a","x":"Tumors arising in the superior compartment of the internal auditory canal tend to have less involvement of the cochlear nerve and cochlear blood supply."},{"n":3,"s":"Search of the landmarks that aid in the identification of the internal auditory canal include","o":["Arcuate eminence","Greater superficial petrosal nerve","Geniculate ganglion","Superior semicircular canal","All of the above"],"k":"e","x":"The arcuate eminence overlies the superior semicircular canal. Bisecting the angle between the superior canal and the greater superficial petrosal nerve locates the course of the internal auditory canal.The geniculate ganglion is at the lateral end of the internal auditory canal."},{"n":4,"s":"The direction of tumor dissection should be","o":["Lateral to medial","Medial to lateral","Anterior to posterior","Inferior to superior","All of the above"],"k":"b","x":"Medial to lateral dissection prevents traction injury to the facial and cochlear nerves at their exit points in the lateral internal auditory canal."},{"n":5,"s":"The first middle fossa approach was reported by","o":["William House","Howard House","John House","Walter Dandy","R. H. Parry"],"k":"e","x":"Parry reported the use of the middle fossa approach in the early part of the 20th century. It was refined and popularized byWilliam House in the 1960s."}]},{"t":"Chapter 49","q":[{"n":1,"s":"Some advantages the translabyrinthine approach has over the retrosigmoid approach for removal of acoustic neuromas include","o":["Extradural drilling that decreases the seeding of bone dust into the subarachnoid space","Exposure of the entire facial nerve","Less cerebellar retraction during tumor removal","a and c","All of the above"],"k":"e","x":"All drilling is complete prior to opening the dura. In a retrosigmoid craniotomy, any internal auditory canal drilling must be performed after the cistern has been opened. By completing a mastoidectomy and opening the entire length of the internal auditory canal, the facial nerve can be exposed from brain stem to stylomastoid foramen (and possibly beyond if parotidectomy is performed),which allows for easier grafting if necessary.The trajectory of the translabyrinthine craniotomy enters the cerebellopontine angle from a more anterior origin than the retrosigmoid craniotomy; this allows for less cerebellar retraction."},{"n":2,"s":"A 45-year-old male with a 3.6-cm enhancing right cerebellopontine angle (CPA) lesion, which fills the internal auditory canal and does not have a detectable “dural tail” on MRI, is a good candidate for a translabyrinthine craniotomy because","o":["No other surgical approach will allow removal of a tumor this large.","There is an 80% chance that the facial nerve function will be House-Brackmann grade I or II 1 year after surgery.","There is a poor chance that hearing will be spared if total tumor removal is attempted, and the entire internal auditory canal and CPA component of the tumor can be exposed.","This is an urgent case given the tumor size, and the translabyrinthine approach is a faster method of exposure.","None of the above."],"k":"c","x":"Because of the tumor’s size, this patient has a poor chance of hearing preservation with tumor removal, regardless of approach. Its size does not prohibit its removal through other approaches, and the translabyrinthine craniotomy is not necessarily faster than other craniotomies. The reported percentage of patients with House-Brackmann grade I or II 1 year following surgery for removal of unilateral, sporadic vestibular schwannomas greater than 3.5 cm in a single stage is about 50%."},{"n":3,"s":"Which of the following is not routinely employed during a translabyrinthine craniotomy?","o":["Facial nerve monitoring","Facial electromyography","Short-acting paralytic agents for anesthesia","Auditory brain stem response","Monopolar electrocautery"],"k":"d","x":"Auditory brain stem response is not routinely used during any case in which hearing is expected to be lost. Short-term paralytics, facial nerve monitoring, and facial electromyography are routinely employed as they allow the surgeon feedback regarding facial nerve irritation/trauma during tumor dissection.There are no contraindications to monopolar electrocautery during the approach."},{"n":4,"s":"You are planning a translabyrinthine craniotomy for removal of an acoustic neuroma in a 59-year-old male in whom you had previously performed a tympanoplasty with mastoidectomy 10 years ago for chronic otitis media. His tympanic membrane appears healed, but your old operative report indicates that he had a small mastoid. For this patient you should","o":["Perform the case by taking down the bony canal wall, closing off the ear canal laterally, and converting to a transcochlear or transotic approach to improve exposure.","Perform the case as a routine translabyrinthine craniotomy, decompressing a large amount of middle fossa dura and dura posterior to the sigmoid sinus.","Stage the case because of risk of infection by first closing the ear canal skin and taking down the bony canal wall followed by a translabyrinthine craniotomy 6 months later if no evidence of infection is noted.","Abort the procedure as the risk of infection is high and the exposure will be poor.","None of the above."],"k":"b","x":"A contracted mastoid is not a contraindication to the translabyrinthine craniotomy.Wide dural decompression will be necessary to improve exposure."},{"n":5,"s":"The potential benefits of performing a cranioplasty after a translabyrinthine craniotomy include","o":["Decreasing the rate of cerebrospinal fluid leak","Prevention of a noticeable postauricular defect","Protects the bony ear canal","a and b","a and c"],"k":"d","x":"Performing a cranioplasty helps bolster the fat graft into the dural defect and potentially drops the cerebrospinal fluid leak rate.The nature of the cranioplasty is prevention of a noticeable defect in the skull; it does nothing to protect the bony ear canal."}]},{"t":"Chapter 51","q":[{"n":1,"s":"The transotic exposure adds which dimension of exposure of the internal auditory canal beyond what the translabyrinthine exposure offers?","o":["Anterior","Posterior","Inferior","Superior","Lateral"],"k":"a","x":""},{"n":2,"s":"Ear canal management in transotic exposure requires","o":["Sterile preparation with antibacterial solutions","Two-layer closure","Temporary transection and stenting to prevent stenosis","Skin graft lining","Wide meatoplasty"],"k":"b","x":""},{"n":3,"s":"The facial nerve near the root-entry zone in relation to the anterior inferior cerebellar artery (AICA) is always:","o":["Posterior","Superior","Anterior","Inferior","Lateral"],"k":"c","x":""},{"n":4,"s":"The distinction between transcochlear and transotic exposure is that","o":["The facial nerve is mobilized posteriorly in transotic exposure.","The facial nerve is mobilized anteriorly in transotic exposure.","The facial nerve is mobilized anteriorly in transcochlear exposure.","The facial nerve is mobilized posteriorly in transcochlear exposure.","The facial nerve is better visualized in transotic exposure."],"k":"d","x":""},{"n":5,"s":"The meatal foramen of the fallopian canal is situated at the","o":["Internal auditory canal porous","Internal auditory canal fundus","Geniculate ganglion","Stylomastoid foramen","Second genu"],"k":"b","x":""}]},{"t":"Chapter 52","q":[{"n":1,"s":"What are the indications for the transcochlear approach?","o":["Lesions arising anterior to the internal auditory canal (IAC), petrous apex lesions, skull base and midline intradural lesions from the clivus","Small acoustic tumors, with moderate extension into the cerebellopontine angle (CPA), and good preoperative hearing","Sinonasal tumors invading the infratemporal fossa, the masticator space, or the pterygomaxillary fossa, and tumors of the nasopharynx extending into the infratemporal fossa","Trigeminal nerve sections, vestibular nerve sections, and CPA biopsies"],"k":"a","x":""},{"n":2,"s":"What are the advantages of the transcochlear approach?","o":["The added exposure of removing the external auditory canal (EAC) and the cochlea, which increases access medially and anteriorly to the facial nerve with the safety of not requiring transposition of this nerve","Hearing preservation and provision of an anterior plane of dissection on IAC in cases of acoustic neuroma","Excellent exposure of the midline, allowing complete removal of the tumor, its base of implantation, and its blood supply with no cerebellar or temporal lobe retraction","Extensive exposure inferiorly in the area of the jugular foramen and foramen magnum"],"k":"c","x":""},{"n":3,"s":"What are the disadvantages of the transcochlear approach?","o":["Does not allow exposure of the lateral aspect of the pons and upper medulla, cranial nerves V through XI, and the midbasilar artery","Sacrifice of residual hearing in the operated ear and risk of temporary facial palsy","Limited by the cerebellum and the brain stem","Requires the use of brain retractors"],"k":"b","x":""},{"n":4,"s":"What are the intracranial structures that can be exposed by the transcochlear approach?","o":["Arcuate eminence, middle meningeal artery, greater and lesser superficial petrosal nerves, V3, V2, and VI entering into the superior orbital fissure","The jugular foramen and foramen magnum","Cerebellum and middle cranial fossa","Entire lateral aspect of the pons and upper medulla, cranial nerves V through XI, as well as the midbasilar artery"],"k":"d","x":""},{"n":5,"s":"What is the most common complication after transcochlear surgery and what steps should be taken to treat it?","o":["Temporary facial nerve paresis. Prompt eye care including lubrication with drops, nighttime ointments, and a moisture shield to prevent corneal complications should be given. Soft lenses, spring and gold weights, canthoplasty should be administered, and “watchful waiting” in cases of complete paralysis, if the facial nerve is anatomically intact, should be done.","Temporary facial nerve paresis. Prompt eye care including lubrication with drops, nighttime ointments, and a moisture shield to prevent corneal complications should be given. Surgical intervention for facial reanimation in cases of complete paralysis, with a facial nerve that is anatomically intact, should be done.","Delayed postoperative intracranial hemorrhage. Immediate reopening of the surgical wound and removal of the fat in the intensive care unit, and operative evacuation of the hematoma and control of the bleeding site or sites, should be done.","Meningitis. Aggressive antibiotic therapy, if it is infectious, and treatment with dexamethasone if it is chemical aseptic meningitis, should be administered."],"k":"a","x":""}]},{"t":"Chapter 53","q":[{"n":1,"s":"The electromagnetic field (EMF) approach is a useful one for","o":["Acoustic neuroma greater than 2.5 cm","Anterior petrous meningioma","Large pituitary adenoma","Meningioma extending into the jugular foramen"],"k":"b","x":""},{"n":2,"s":"The superior vestibular nerve can be safely followed laterally for a distance equaling","o":["3 mm","Three quarters the distance of the labyrinthine facial nerve","One half the distance of the labyrinthine facial nerve","2.5 mm"],"k":"c","x":""},{"n":3,"s":"The inferior extent of the EMF approach includes","o":["The foramen magnum","The inferior petrosal sinus","The midclivus","The superior petrosal sinus"],"k":"b","x":""},{"n":4,"s":"The EMF approach can be used for all of the following lesions except","o":["Petroclival meningioma","Acoustic neuroma extending into the posterior fossa","Lower clival lesions","Infraclinoidal basilar tip aneurysms"],"k":"c","x":""},{"n":5,"s":"As a rule, the internal auditory canal (IAC) can be identified topographically by","o":["Bisecting the angle between the greater superficial petrosal nerve (GSPN) and the arcuate eminence","Bisecting the angle between the arcuate eminence and the middle meningeal artery","Following the course of the GSPN","Following the course of the IAC"],"k":"a","x":""}]},{"t":"Chapter 54","q":[{"n":1,"s":"High risk of stroke with carotid sacrifice on xenon blood flow studies with test occlusion of the carotid are predicted by flows","o":["Greater than 35 mL/min/100 gm of tissue","21–35 mL/min/100 gm of tissue","Less than 20 mL/min/100 gm of tissue","Greater than 50 mL/min/100 gm of tissue","Greater than 100 mL/min/100 gm of tissue"],"k":"c","x":""},{"n":2,"s":"The frontalis portion of the facial nerve is best protected in the lateral subtemporal skull base approach by dissecting","o":["Deep to the deep temporal fascia off the zygomatic arch","Superficial to the deep temporal fascia off the zygomatic arch","Superficial to the fat pad over the temporal muscle","Along each branch of the frontalis portion of the facial nerve","Along at least two branches of the frontalis portion of the facial nerve"],"k":"a","x":""},{"n":3,"s":"The most common morbidity associated with surgery of the infratemporal fossa is","o":["Trigeminal nerve dysfunction","Facial nerve dysfunction","Dysphagia","Dysphonia","Ataxia"],"k":"a","x":""},{"n":4,"s":"The best treatment of postoperative trismus is","o":["Temporomandibular joint (TMJ) resection","TMJ prosthesis","Stretching therapy","Laser scar ablation","Steroid injection into the pterygoid muscles"],"k":"c","x":""},{"n":5,"s":"Unilateral rhinorrhea not related to postoperative cerebrospinal fluid leak following skull base surgery occurs from","o":["Loss of sympathetic fibers along the internal carotid artery","Loss of parasympathetic fibers along the internal carotid artery","Pterygopalatine nerve ablation","Sinusitis","Hematoma liquefaction"],"k":"a","x":""}]},{"t":"Chapter 55","q":[{"n":1,"s":"The lateral extent of access via endoscopic endonasal approach at the level of the superior orbit is","o":["Lamina papyracea","Periorbita","Midorbital line","Medial rectus muscle","Anterior ethmoidal artery"],"k":"c","x":"Following removal of the lamina papyracea, the periorbita can be gently displaced laterally to allow access to lesions above the orbit as far lateral as midorbit."},{"n":2,"s":"Inferior extent of access via endonasal approach can be determined preoperatively by drawing a line (Kassam line) between which two structures extended into the depth on sagittal CT?","o":["Nasal tip and odontoid process","Tip of bony nasal bridge and hard palate","Tip of bony nasal bridge and odontoid process","Middle turbinate and hard palate","Middle turbinate and C1"],"k":"b","x":"These two bony structures create a fulcrum that limits the inferior extent of exposure.By drawing a line between them on preoperative sagittal imaging, one can get a rough idea of the extent of lowest access."},{"n":3,"s":"What are the four anatomical structures that form the boundaries of the “quadrangular space”?","o":["Cavernous internal carotid artery (ICA), optic nerve, first branch of trigeminal nerve, and vidian canal","Vertical/paraclival ICA, petrous/horizontal ICA, cranial nerve (CN) VI, and maxillary branch of trigeminal nerve","Vertical/paraclival ICA, petrous/horizontal ICA, CN IV, and cavernous sinus","Cavernous ICA, optic nerve, vidian canal, and gasserian ganglion","Vertical/paraclival ICA, petrous/horizontal ICA, CN VI, and gasserian ganglion"],"k":"b","x":"These four structures are the key anatomic structures that limit the endonasal approach to Meckel’s cave."},{"n":4,"s":"Which of the following are options for vascularized tissue repair of endonasal skull base defects?","o":["Temporoparietal fascial flap","Nasal septal mucosal flap","Turbinate flap","All of the above","None of the above"],"k":"d","x":"All are potential candidates for a vascularized flap.The nasal septal flap is the most versatile given its size and location. However, it usually must be harvested during the approach."},{"n":5,"s":"Which of the following is the most common complication of endoscopic endonasal surgery prior to the introduction of the nasal septal flap?","o":["Cerebrospinal fluid leak","Arterial injury","Infection","Stroke","Cranial nerve palsy"],"k":"a","x":"Cerebrospinal fluid leak was the most common complication of endoscopic endonasal surgery for skull base lesions prior to the introduction of the septal flap. Despite this, infection rates were very low."}]},{"t":"Chapter 56","q":[{"n":1,"s":"A combined petrosal approach is appropriate for petroclival tumors that","o":["Are superior to the internal auditory meatus","Are inferior to the internal auditory meatus","Extend into the infratemporal fossa","a, b, and c","a and b"],"k":"e","x":"The combined petrosal approach is best suited for petroclival tumors that are both superior and inferior to the internal auditory canal. Otherwise, the middle fossa approach alone or a posterior approach alone can be used. The infratemporal fossa is not accessible with the combined petrosal approach."},{"n":2,"s":"Medial access to petroclival tumors with the combined petrosal approach is most commonly limited by","o":["The jugular bulb","The angle between the clivus and brain stem","The distance between the sigmoid sinus and facial nerve","The tentorium and superior petrosal vein","The angle between the cerebellum and brain stem"],"k":"b","x":"The two structures that cannot be retracted, removed, or moved are the brain stem and clivus. It is therefore the angle between them that limits access to the medial aspect of these tumors. More anterior exposure helps to open this angle."},{"n":3,"s":"Preoperative evaluation should include examination of the venous drainage system to exclude","o":["A dominant sigmoid sinus system","A high jugular bulb","Failure of the transverse sinus to communicate with the confluence (torcular herophili)","Insertion of the vein of Labbé into the superior petrosal sinus","a, c, and e"],"k":"e","x":"All of these vascular variations place the patient at risk for venous infarction if not recognized preoperatively."},{"n":4,"s":"Significant posterior compression of the brain stem by the tumor","o":["Often requires more aggressive removal of the otic capsule for adequate brain stem exposure and tumor excision","Requires no change in the amount of otic capsule removal because brain stem position does not affect tumor exposure","Often requires less aggressive removal of the otic capsule for adequate brain stem exposure and tumor excision","Requires more aggressive cerebellar retraction to adequately expose the brain stem","Often makes sigmoid sinus transection necessary"],"k":"c","x":"The angle between the brain stem and clivus can often be opened by posterior brain stem compression, allowing better access to the clivus than with a tumor that does not compress the brain stem."},{"n":5,"s":"The most common complication from the combined petrosal approach is","o":["Cerebrospinal fluid leak","Cranial nerve injury","Cerebrovascular accident","Pituitary hypofunction","Subdural hematoma"],"k":"b","x":"Cranial nerve injury is the most common complication. Cranial nerves V and VII are the most commonly compromised, but III–XI are at risk with this approach. Some authors advocate subtotal excision with stereotactic irradiation as a result, but the long-term results are unknown."}]},{"t":"Chapter 58","q":[{"n":1,"s":"The auditory brain stem implant (ABI) and the other CNS auditory implants described in this chapter","o":["Are direct replacements for cochlear implants","Provide equivalent speech perception performance to cochlear implants","Were developed to provide hearing sensations to deaf individuals with nonviable peripheral auditory neural systems","All of the above"],"k":"c","x":""},{"n":2,"s":"The primary benefit of first-tumor side ABI implantation includes","o":["Better outcomes because implantation can occur when tumors are smaller","Better outcomes because implantation can occur when patients are younger","The opportunity to gain experience with the device before becoming completely deaf on the second-tumor side","An opportunity to implant a more advanced device when the second-side tumor is removed"],"k":"c","x":""},{"n":3,"s":"A primary contributor to a satisfactory outcome with an ABI is","o":["Implantation when vestibular schwannomas are as small as possible","Implantation as soon as possible after onset of complete deafness","A thorough and frank appraisal preoperatively of the potential benefits and limitations of the device","Learning sign language and lipreading preoperatively"],"k":"c","x":""},{"n":4,"s":"The primary benefit of the penetrating auditory brain stem implant (PABI) was found to be","o":["Improved speech recognition performance","Fewer nonauditory sensations","Lower electrical auditory thresholds and       var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
