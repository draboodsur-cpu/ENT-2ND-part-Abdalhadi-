"Pregnant teenager", "Obese middle-aged woman with raised intracranial pressure"], "k": "E", "x": "Obese middle-aged women; idiopathic intracranial hypertension; empty sella, arachnoid pits"}, {"n": 30, "s": "The confirmatory test for CSF rhinorrhoea is:", "o": ["Glucose", "Halo sign", "Protein", "β2-transferrin", "Chloride"], "k": "D", "x": "β2-transferrin (or β-trace protein); glucose and halo sign unreliable"}, {"n": 31, "s": "The first imaging study to localise a CSF leak is:", "o": ["High-resolution CT", "CT cisternography", "MRI brain", "Radionuclide cisternography", "Plain radiograph"], "k": "A", "x": "HRCT skull base (bony defect); CT/MR cisternography if unclear or intermittent"}, {"n": 32, "s": "Intraoperative localisation of a CSF leak is aided by:", "o": ["Topical methylene blue", "Intrathecal fluorescein", "IV indocyanine green", "Gadolinium", "Saline"], "k": "B", "x": "Low-dose intrathecal fluorescein (informed consent; seizure risk at high doses)"}, {"n": 33, "s": "A spontaneous leak from the lateral recess of the sphenoid relates to:", "o": ["Dorello's canal", "Foramen caecum", "Sternberg's canal", "Vidian canal", "Optic canal"], "k": "C", "x": "Sternberg's (lateral craniopharyngeal) canal; well-pneumatised lateral recess"}, {"n": 34, "s": "Success of endoscopic CSF leak repair at first attempt is about:", "o": ["30%", "50%", "60%", "75%", ">90%"], "k": "E", "x": ">90% first attempt; ~97% with revision"}, {"n": 35, "s": "The nasoseptal (Hadad-Bassagasteguy) flap is pedicled on the:", "o": ["Anterior ethmoidal artery", "Posterior ethmoidal artery", "Greater palatine artery", "Posterior septal artery", "Superior labial artery"], "k": "D", "x": "Posterior septal artery (branch of SPA); harvest before sphenoidotomy if needed"}, {"n": 36, "s": "Recurrent spontaneous CSF leak after repair is best addressed by:", "o": ["Treating raised intracranial pressure", "Antibiotics", "Steroids", "Bed rest only", "Radiotherapy"], "k": "A", "x": "Raised ICP drives recurrence → acetazolamide, weight loss, LP/VP shunt"}, {"n": 37, "s": "A nasal mass that enlarges with crying or jugular compression (positive Furstenberg sign) is a:", "o": ["Glioma", "Dermoid", "Encephalocele", "Haemangioma", "Polyp"], "k": "C", "x": "Encephalocele: CSF communication; Furstenberg positive; transilluminates; soft, bluish, pulsatile"}, {"n": 38, "s": "A nasal glioma is:", "o": ["In communication with CSF", "Firm, without CSF connection, Furstenberg-negative", "Transilluminating", "Enlarging with crying", "Malignant"], "k": "B", "x": "Glioma: dysplastic glial tissue, ~15% fibrous stalk, firm, non-compressible, Furstenberg negative"}, {"n": 39, "s": "A midline pit on the nasal dorsum with a protruding hair is a:", "o": ["Glioma", "Encephalocele", "Haemangioma", "Teratoma", "Dermoid sinus cyst"], "k": "E", "x": "Dermoid sinus: pit ± hair, may track to foramen caecum → MRI before excision"}, {"n": 40, "s": "A neonate has a midline nasal mass. The first step is:", "o": ["Biopsy", "Excision", "Aspiration", "MRI", "Reassurance"], "k": "D", "x": "MRI (± CT) to exclude intracranial connection; never biopsy first (meningitis, CSF leak)"}, {"n": 41, "s": "The hiatus semilunaris lies between the:", "o": ["Uncinate process and bulla ethmoidalis", "Middle and superior turbinates", "Septum and middle turbinate", "Bulla and basal lamella", "Agger nasi and frontal recess"], "k": "A", "x": "Hiatus semilunaris (inferior) between uncinate free edge and bulla → infundibulum"}, {"n": 42, "s": "A paradoxical middle turbinate is one that is:", "o": ["Pneumatised", "Absent", "Convex laterally", "Hypertrophied inferiorly", "Attached to the septum"], "k": "C", "x": "Convex laterally, narrows middle meatus"}, {"n": 43, "s": "A concha bullosa is a:", "o": ["Hypertrophied inferior turbinate", "Nasal polyp", "Haller cell", "Agger nasi cell", "Pneumatised middle turbinate"], "k": "E", "x": "Pneumatised middle turbinate; usually incidental; may block OMC"}, {"n": 44, "s": "The first imaging for suspected orbital complication of sinusitis is:", "o": ["MRI", "Contrast-enhanced CT", "Ultrasound", "Plain radiograph", "Angiography"], "k": "B", "x": "Contrast CT orbits/sinuses; MRI if intracranial or CST suspected"}, {"n": 45, "s": "Intracranial complications of sinusitis are most associated with:", "o": ["Haemophilus influenzae", "Moraxella catarrhalis", "Pseudomonas aeruginosa", "Streptococcus anginosus (milleri) group", "Streptococcus pyogenes"], "k": "D", "x": "S. anginosus (milleri) group — abscess-forming; also anaerobes, S. aureus"}, {"n": 46, "s": "The key step in frontal sinus obliteration is:", "o": ["Complete mucosal removal with drilling", "Leaving the mucosa intact", "Gauze packing", "Antibiotics alone", "Stenting the outflow tract"], "k": "A", "x": "Remove all mucosa and drill inner cortex, occlude frontonasal duct; otherwise mucocele"}, {"n": 47, "s": "The Lynch-Howarth incision is used for:", "o": ["Maxillary sinus surgery", "Sphenoid surgery", "External frontoethmoidectomy", "Septoplasty", "Turbinate surgery"], "k": "C", "x": "Lynch-Howarth: curved medial canthal incision; external frontoethmoidectomy, AEA ligation, orbital SPA drainage"}, {"n": 48, "s": "Regarding CSF rhinorrhoea, which statement is FALSE?", "o": ["Most traumatic leaks resolve with conservative management", "Most non-traumatic leaks require operative repair", "Endoscopic repair is now the main surgical method", "Only pedicled mucosal flaps can reliably reconstruct the defect"], "k": "D", "x": "(PP ENT-B Q57) — Free mucosal/fascial/fat grafts succeed >90%; pedicled flaps for large defects/high-flow leaks. (Original item reads \"which are true\" with A–C all true — keyed here as the false statement.)"}, {"n": 49, "s": "The embryogenesis of choanal atresia is generally believed to be:", "o": ["Failure of nasal canalisation in the 10th week", "Failure of rupture of the nasobuccal membrane in weeks 5–6", "Nasal placode invagination in weeks 3–4", "Neural crest maldevelopment in week 12", "Failure of ectoderm migration in week 8"], "k": "B", "x": "(PP ENT-A Q74) — Persistence of the nasobuccal (oronasal) membrane of Hochstetter; ~70% mixed bony-membranous, ~30% purely bony"}, {"n": 50, "s": "Epistaxis presenting in a delayed fashion after maxillofacial trauma should raise suspicion of:", "o": ["Undiagnosed nasal fracture", "Arterial aneurysm", "Continued trauma to nasal mucosa", "Altered nasal airflow", "Bacterial infection"], "k": "B", "x": "(PP ENT-A Q7) — Delayed epistaxis after trauma = traumatic ICA pseudoaneurysm (sphenoid) until proven otherwise → CT angiography"}]}, {"c": 1, "t": "Session 4", "d": "Sinonasal & Skull Base Tumours", "q": [{"n": 1, "s": "Inverted papilloma most commonly arises from the:", "o": ["Nasal septum", "Lateral nasal wall", "Frontal sinus", "Sphenoid sinus", "Nasal floor"], "k": "B", "x": "Lateral nasal wall (middle meatus/ethmoid); unilateral"}, {"n": 2, "s": "The rate of associated malignancy (synchronous or metachronous) with inverted papilloma is about:", "o": ["<1%", "2%", "25%", "10%", "40%"], "k": "D", "x": "~10% (range 5–15%), usually SCC; always send all tissue for histology"}, {"n": 3, "s": "The CT feature that predicts the attachment site of an inverted papilloma is:", "o": ["Widespread bone erosion", "Calcification", "Focal hyperostosis", "Air-fluid level", "Double density"], "k": "C", "x": "Focal hyperostosis/osteitis marks the pedicle — target for drilling"}, {"n": 4, "s": "The characteristic MRI appearance of inverted papilloma is:", "o": ["T2 signal void", "Isolated diffusion restriction", "Fat signal", "Flow voids", "Convoluted cerebriform pattern"], "k": "E", "x": "Convoluted cerebriform pattern on T2/post-contrast; separates tumour from retained secretions"}, {"n": 5, "s": "Krouse T4 inverted papilloma is defined by:", "o": ["Extranasal extension or malignancy", "Nasal cavity only", "OMC or ethmoid involvement", "Frontal sinus involvement", "Sphenoid involvement"], "k": "A", "x": "Krouse: T1 nasal cavity · T2 OMC/ethmoid/medial maxillary wall · T3 other maxillary walls, frontal, sphenoid · T4 extranasal or malignancy"}, {"n": 6, "s": "Inverted papilloma is treated by:", "o": ["Radiotherapy", "Simple polypectomy", "Medical therapy", "Endoscopic resection with subperiosteal removal and drilling of the attachment", "Observation"], "k": "D", "x": "Endoscopic attachment-oriented resection (subperiosteal, drill pedicle); recurrence ~10–15%, mostly incomplete removal"}, {"n": 7, "s": "A papilloma on the nasal septum is usually:", "o": ["Inverted", "Oncocytic", "Exophytic (fungiform)", "Malignant", "Carcinoma in situ"], "k": "C", "x": "Septal = exophytic (fungiform), HPV 6/11, negligible malignancy; inverted = lateral wall; oncocytic = lateral wall"}, {"n": 8, "s": "The commonest site of a paranasal sinus osteoma is the:", "o": ["Maxillary sinus", "Frontal sinus", "Sphenoid sinus", "Ethmoid sinus", "Nasal bone"], "k": "B", "x": "Frontal > ethmoid > maxillary; operate if symptomatic, obstructing, >50% of sinus or growing"}, {"n": 9, "s": "Multiple osteomas with colonic polyps suggest:", "o": ["Peutz-Jeghers syndrome", "Cowden syndrome", "Lynch syndrome", "MEN2", "Gardner syndrome"], "k": "E", "x": "Gardner (APC): osteomas, colonic polyposis, desmoids, epidermoid cysts — colonoscopy"}, {"n": 10, "s": "A child has an expansile, well-circumscribed maxillary lesion with an \"eggshell\" rim. The likely diagnosis is:", "o": ["Fibrous dysplasia", "Osteoma", "Juvenile ossifying fibroma", "Ameloblastoma", "Mucocele"], "k": "C", "x": "Juvenile ossifying fibroma: well-defined, eggshell rim, aggressive; complete excision (FD is ground glass, ill-defined)"}, {"n": 11, "s": "Juvenile nasopharyngeal angiofibroma originates near the:", "o": ["Cribriform plate", "Inferior turbinate", "Septum", "Sphenopalatine foramen", "Frontal recess"], "k": "D", "x": "Sphenopalatine foramen/pterygopalatine fossa region"}, {"n": 12, "s": "The Holman-Miller sign in JNA is:", "o": ["Anterior bowing of the posterior maxillary wall", "Widened optic canal", "Cribriform erosion", "Enlarged foramen ovale", "Clouded frontal sinus"], "k": "A", "x": "Anterior bowing of the posterior maxillary wall from PPF expansion"}, {"n": 13, "s": "The main blood supply of JNA is the:", "o": ["Ascending pharyngeal artery", "Internal maxillary artery", "Facial artery", "Internal carotid artery", "Lingual artery"], "k": "B", "x": "Internal maxillary artery; large tumours recruit ICA branches (vidian, inferolateral trunk)"}, {"n": 14, "s": "Preoperative embolisation of JNA is performed:", "o": ["1 week before surgery", "2 weeks before surgery", "24–72 hours before surgery", "Intraoperatively", "1 month before surgery"], "k": "C", "x": "24–72 h before (before collaterals reopen); reduces blood loss"}, {"n": 15, "s": "Radkowski stage IIC JNA involves the:", "o": ["Nasal cavity only", "Minimal pterygopalatine fossa", "Complete pterygopalatine fossa", "Infratemporal fossa or cheek", "Extensive intracranial space"], "k": "D", "x": "Radkowski: Ia/b nasal ± sinus · IIa minimal PPF · IIb full PPF · IIc ITF/cheek/behind pterygoid plates · IIIa/b skull base ± intracranial"}, {"n": 16, "s": "JNA occurs almost exclusively in:", "o": ["Elderly men", "Young women", "Infants", "Middle-aged men", "Adolescent males"], "k": "E", "x": "Adolescent males (10–20 years); a female with \"JNA\" needs karyotype/re-evaluation"}, {"n": 17, "s": "A 15-year-old boy has recurrent unilateral epistaxis and nasal obstruction. The next step is:", "o": ["Clinic biopsy", "Contrast CT or MRI", "Cautery", "Packing", "Antibiotics"], "k": "B", "x": "Imaging first; never biopsy (catastrophic bleeding)"}, {"n": 18, "s": "The commonest sinonasal malignancy is:", "o": ["Squamous cell carcinoma", "Adenocarcinoma", "Adenoid cystic carcinoma", "Mucosal melanoma", "Lymphoma"], "k": "A", "x": "SCC ~50–60%"}, {"n": 19, "s": "The commonest site of sinonasal malignancy is the:", "o": ["Ethmoid sinus", "Nasal septum", "Maxillary sinus", "Frontal sinus", "Sphenoid sinus"], "k": "C", "x": "Maxillary sinus ~60%, then nasal cavity, ethmoid"}, {"n": 20, "s": "Intestinal-type adenocarcinoma most commonly arises in the:", "o": ["Maxillary sinus", "Septum", "Frontal sinus", "Ethmoid sinus", "Sphenoid sinus"], "k": "D", "x": "ITAC (hardwood dust) → ethmoid/olfactory cleft; latency ~40 years"}, {"n": 21, "s": "Nickel refining is associated with sinonasal:", "o": ["Adenocarcinoma", "Melanoma", "Lymphoma", "Adenoid cystic carcinoma", "Squamous cell carcinoma"], "k": "E", "x": "Nickel → SCC (and anaplastic); also chromium, formaldehyde"}, {"n": 22, "s": "Öhngren's line connects the:", "o": ["Nasion to mastoid", "Lateral canthus to tragus", "Medial canthus to angle of mandible", "Ala to tragus", "Glabella to mentum"], "k": "C", "x": "Medial canthus → angle of mandible: posterosuperior (suprastructure) tumours carry worse prognosis"}, {"n": 23, "s": "Maxillary sinus SCC invading the orbital apex is staged (AJCC 8th) as:", "o": ["T3", "T4b", "T4a", "T2", "T1"], "k": "B", "x": "T4b: orbital apex, dura, brain, middle cranial fossa, cranial nerves other than V2, nasopharynx, clivus"}, {"n": 24, "s": "Maxillary sinus SCC eroding only the posterior wall is staged as:", "o": ["T1", "T2", "T4a", "T3", "T4b"], "k": "D", "x": "T3: posterior wall, subcutaneous tissue, orbital floor/medial wall, pterygoid fossa, ethmoids. T4a: anterior orbit, cheek skin, pterygoid plates, ITF, cribriform, sphenoid/frontal"}, {"n": 25, "s": "The rate of cervical nodal metastasis at presentation in maxillary SCC is about:", "o": ["10–15%", "50%", "75%", "<1%", "90%"], "k": "A", "x": "~10–15%; elective neck treatment considered for T3–4 SCC"}, {"n": 26, "s": "The lowest T category for sinonasal mucosal melanoma in AJCC 8th is:", "o": ["T1", "T2", "T3", "T4a", "Tis"], "k": "C", "x": "Mucosal melanoma starts at T3 (mucosal disease) — reflects aggressive biology"}, {"n": 27, "s": "The hallmark mode of spread of adenoid cystic carcinoma is:", "o": ["Lymphatic", "Perineural", "Early haematogenous spread to liver", "Transcoelomic", "None (non-invasive)"], "k": "B", "x": "Perineural (V2 to foramen rotundum, skip lesions); late lung metastases"}, {"n": 28, "s": "Kadish C esthesioneuroblastoma is:", "o": ["Confined to the nasal cavity", "Nasal cavity plus sinuses", "Cribriform plate only", "Extending beyond the nasal cavity and sinuses", "Nodal disease only"], "k": "D", "x": "Kadish A nasal cavity · B + sinuses · C beyond (orbit, skull base, intracranial) · modified D: nodes/distant"}, {"n": 29, "s": "The characteristic histological feature of esthesioneuroblastoma is:", "o": ["Psammoma bodies", "Verocay bodies", "Antoni A areas", "Mikulicz cells", "Homer Wright pseudorosettes"], "k": "E", "x": "Homer Wright pseudorosettes, neurofibrillary stroma; Hyams grading"}, {"n": 30, "s": "Sinonasal undifferentiated carcinoma (SNUC) is:", "o": ["Indolent", "Treated by surgery alone", "Highly aggressive, requiring multimodal therapy", "Benign", "Curable by radiotherapy alone"], "k": "C", "x": "SNUC: aggressive, early skull base/orbit invasion; induction chemo → chemoradiation ± surgery"}, {"n": 31, "s": "Extranodal NK/T-cell lymphoma, nasal type, is associated with:", "o": ["EBV and midline destruction", "HPV", "HHV-8", "HIV only", "H. pylori"], "k": "A", "x": "EBV-driven, CD56+, angiocentric necrosis; Asia/Latin America; \"lethal midline granuloma\""}, {"n": 32, "s": "Malignancy involving the cribriform plate is treated by:", "o": ["Medial maxillectomy", "Caldwell-Luc", "Lateral rhinotomy alone", "Craniofacial resection (open or endoscopic)", "Radiotherapy alone"], "k": "D", "x": "Craniofacial resection (en bloc cribriform/dura) — now often endoscopic"}, {"n": 33, "s": "The orbit can be preserved in sinonasal malignancy when:", "o": ["The orbital apex is involved", "Only the periorbita is invaded", "An extraocular muscle is invaded", "The bulbar conjunctiva is involved", "Orbital fat is extensively invaded"], "k": "B", "x": "Periorbita alone → preserve orbit; exenterate for apex, extraocular muscle, bulbar conjunctiva/sclera, extensive fat"}, {"n": 34, "s": "The classic incision for total maxillectomy is the:", "o": ["Lynch incision", "Sublabial Caldwell-Luc only", "Coronal incision", "Gillies incision", "Weber-Ferguson incision"], "k": "E", "x": "Weber-Ferguson (± Diffenbach/Lynch extensions); lateral rhinotomy for medial maxillectomy"}, {"n": 35, "s": "The commonest sinonasal malignancy in children is:", "o": ["Squamous cell carcinoma", "Lymphoma", "Rhabdomyosarcoma", "Esthesioneuroblastoma", "Melanoma"], "k": "C", "x": "Rhabdomyosarcoma (embryonal) — chemoradiation"}, {"n": 36, "s": "A bleeding septal mass develops during pregnancy. The likely diagnosis is:", "o": ["Capillary haemangioma of infancy", "Inverted papilloma", "Mucosal melanoma", "Pyogenic granuloma (lobular capillary haemangioma)", "Angiofibroma"], "k": "D", "x": "Granuloma gravidarum; often regresses postpartum; excise if bleeding"}, {"n": 37, "s": "Extramedullary plasmacytoma of the nose requires mandatory work-up to:", "o": ["Exclude multiple myeloma", "Test for HPV", "Check EBV serology", "Check thyroid function", "Measure CEA"], "k": "A", "x": "Exclude myeloma (marrow, serum/urine electrophoresis, skeletal survey); RT is primary treatment"}, {"n": 38, "s": "The commonest primary tumour metastasising to the sinonasal tract is:", "o": ["Breast", "Renal cell carcinoma", "Lung", "Prostate", "Cutaneous melanoma"], "k": "B", "x": "Renal cell carcinoma (vascular — epistaxis); then lung, breast"}, {"n": 39, "s": "Physaliferous cells are characteristic of:", "o": ["Chondrosarcoma", "Meningioma", "Chordoma", "Esthesioneuroblastoma", "JNA"], "k": "C", "x": "Chordoma: physaliferous (bubbly) cells, brachyury+; midline clivus"}, {"n": 40, "s": "Cheek numbness in a maxillary tumour indicates involvement of the:", "o": ["Facial nerve", "Greater palatine nerve", "Nasopalatine nerve", "Infraorbital nerve (V2)", "V3"], "k": "D", "x": "Infraorbital nerve → floor of orbit/anterior wall involvement; also look for perineural spread"}, {"n": 41, "s": "Skull base chondrosarcoma typically arises at the:", "o": ["Midline clivus", "Sella turcica", "Cribriform plate", "Foramen magnum", "Petroclival synchondrosis (off-midline)"], "k": "E", "x": "Petroclival synchondrosis, off-midline; chordoma = midline clivus"}, {"n": 42, "s": "A dumbbell-shaped mass through the cribriform plate with peripheral cysts at the brain margin suggests:", "o": ["Meningioma", "Esthesioneuroblastoma", "Squamous cell carcinoma", "JNA", "Mucocele"], "k": "B", "x": "ENB: dumbbell through cribriform; peripheral tumour cysts at the brain interface are characteristic"}, {"n": 43, "s": "The age distribution of esthesioneuroblastoma is:", "o": ["Bimodal (2nd and 6th decades)", "Infants only", "Elderly only", "Adolescent males only", "Pregnant women"], "k": "A", "x": "Bimodal (2nd and 6th decades)"}, {"n": 44, "s": "Five-year survival in sinonasal mucosal melanoma is about:", "o": [">80%", "60–70%", "50%", "<5%", "20–30%"], "k": "E", "x": "~20–30%; local recurrence and distant metastasis common"}, {"n": 45, "s": "An adult has new unilateral blood-stained discharge and obstruction. The next step is:", "o": ["Nasal endoscopy ± CT", "Intranasal steroid trial", "Antibiotics", "Saline irrigation", "Reassurance"], "k": "A", "x": "Unilateral blood-stained discharge/obstruction = red flag → endoscopy ± CT/MRI ± biopsy"}, {"n": 46, "s": "Regarding juvenile nasopharyngeal angiofibroma, which is true?", "o": ["Best results come from surgery plus adjuvant radiotherapy", "The main consideration for approach is patient age", "Endoscopic resection is ideal for all tumours", "Advanced intracranial tumours are effectively managed by radiotherapy alone", "Recurrence seldom occurs if the tumour is completely removed"], "k": "E", "x": "(PP ENT-A Q18) — Complete excision → low recurrence; approach depends on extent (not age); RT reserved for unresectable"}, {"n": 47, "s": "For which tumour should complete resection always be followed by adjuvant radiotherapy?", "o": ["Juvenile angiofibroma", "Esthesioneuroblastoma", "Nasopharyngeal carcinoma", "Temporal bone paraganglioma", "Meningioma"], "k": "B", "x": "(PP ENT-A Q68) — ENB: craniofacial/endoscopic resection + postoperative RT standard; NPC treated primarily with (chemo)RT"}, {"n": 48, "s": "High-dose conformal radiotherapy for skull base chordoma can cause:", "o": ["Optic neuropathy", "Memory loss", "Hypoadrenalism", "Right-sided hemiparesis", "Left-sided hemiparesis"], "k": "A", "x": "(PP ENT-A Q69) — Optic nerve/chiasm dose-limiting (~54 Gy); proton therapy reduces risk"}, {"n": 49, "s": "Woodworkers have an increased incidence of:", "o": ["Adenocarcinoma", "Squamous cell carcinoma", "Adenoid cystic carcinoma", "Malignant mixed tumour"], "k": "A", "x": "(PP ENT-B Q83) — Hardwood dust → ethmoid adenocarcinoma"}, {"n": 50, "s": "Pseudoepitheliomatous hyperplasia:", "o": ["Usually precedes cholesteatoma", "Is viral in aetiology", "Accompanies laryngeal papilloma", "Is best treated by radiation", "Is acanthosis that superficially resembles malignancy"], "k": "E", "x": "(PP ENT-B Q10) — Benign epithelial hyperplasia mimicking SCC; classically overlying granular cell tumour — deep biopsy avoids overdiagnosis"}]}, {"c": 1, "t": "Session 5", "d": "Facial Trauma, Rhinoplasty & Septum", "q": [{"n": 1, "s": "Closed reduction of an adult nasal fracture is ideally performed:", "o": ["At 3 weeks", "After 6 weeks", "Within 3 hours, or once swelling settles within ~10 days", "Only under GA after 1 month", "Never — open reduction is always preferred"], "k": "C", "x": "Before oedema (<3 h) or after it settles but before bones set (adults ~7–10 days; children 3–7 days)"}, {"n": 2, "s": "The most commonly fractured facial bone is the:", "o": ["Mandible", "Nasal bones", "Zygoma", "Maxilla", "Orbital floor"], "k": "B", "x": "Nasal bones — most prominent, least resistant"}, {"n": 3, "s": "Closed reduction of a nasal fracture most often fails because of:", "o": ["Presentation after 2 days", "Young age", "Local anaesthesia", "Bony comminution alone", "Septal fracture-dislocation"], "k": "E", "x": "Septal fracture-dislocation pulls the pyramid back → septorhinoplasty"}, {"n": 4, "s": "Imaging for an isolated nasal fracture is:", "o": ["CT always", "Plain radiograph always", "MRI", "Not routinely required", "Ultrasound always"], "k": "D", "x": "Clinical diagnosis; CT only if other facial fractures suspected"}, {"n": 5, "s": "A Markowitz type III naso-orbito-ethmoid fracture has:", "o": ["A single central fragment with the tendon attached", "Comminution with the tendon attached", "A comminuted central fragment with medial canthal tendon avulsion", "Isolated nasal bone fracture", "Frontal sinus involvement only"], "k": "C", "x": "Markowitz: I single fragment, tendon attached · II comminuted, tendon attached · III comminuted with tendon avulsion (needs transnasal canthopexy)"}, {"n": 6, "s": "Traumatic telecanthus is suspected when the intercanthal distance exceeds:", "o": ["20 mm", "35 mm", "25 mm", "60 mm", "15 mm"], "k": "B", "x": "Normal ~30–32 mm (≈ half interpupillary distance); >35 mm suggestive, >40 mm diagnostic"}, {"n": 7, "s": "The bowstring test assesses the:", "o": ["Medial canthal tendon", "Lateral canthal tendon", "Nasolacrimal duct", "Infraorbital nerve", "Inferior rectus"], "k": "A", "x": "Lateral lid traction: lost \"bowstring\" resistance at medial canthus = tendon disruption"}, {"n": 8, "s": "A common late complication of NOE fracture is:", "o": ["Hyposmia", "Trismus", "Malocclusion", "Hearing loss", "Epiphora from nasolacrimal obstruction"], "k": "E", "x": "Epiphora (NLD injury/obstruction) → DCR; also telecanthus, CSF leak"}, {"n": 9, "s": "A frontal sinus fracture involving the outflow tract is managed by:", "o": ["Observation", "Anterior table ORIF only", "Obliteration (or endoscopic Draf III in selected cases)", "Antibiotics alone", "Trephination"], "k": "C", "x": "Outflow tract injury → mucocele risk → obliteration or endoscopic drainage (Draf III) in selected cases"}, {"n": 10, "s": "A comminuted posterior table frontal fracture with persistent CSF leak requires:", "o": ["Obliteration", "Observation", "Anterior table ORIF", "Cranialisation", "Endoscopic repair only"], "k": "D", "x": "Cranialisation: remove posterior table + mucosa, plug ducts, pericranial flap"}, {"n": 11, "s": "A Le Fort I fracture is:", "o": ["Pyramidal", "Horizontal, above the tooth apices", "Craniofacial dysjunction", "Through the orbital floor", "Through the zygomatic arch"], "k": "B", "x": "Le Fort I (Guérin): horizontal maxilla above apices → floating palate"}, {"n": 12, "s": "A Le Fort II fracture passes through the:", "o": ["Zygomatic arch", "Frontozygomatic suture", "Maxilla above the tooth apices only", "Lateral orbital wall", "Nasal bones, medial orbital wall, orbital floor and zygomaticomaxillary suture"], "k": "E", "x": "Le Fort II: pyramidal — nasal bones, medial orbital wall, floor, rim, zygomaticomaxillary suture, pterygoid plates"}, {"n": 13, "s": "A fracture through the frontozygomatic suture, zygomatic arch and nasofrontal junction is a:", "o": ["Le Fort I", "Le Fort II", "Le Fort III", "ZMC fracture", "NOE fracture"], "k": "C", "x": "Le Fort III: craniofacial dysjunction — FZ suture, arch, nasofrontal; CSF leak common"}, {"n": 14, "s": "The feature common to all Le Fort fractures is:", "o": ["Pterygoid plate fracture", "Orbital floor fracture", "Nasal bone fracture", "Zygomatic arch fracture", "Palatal split"], "k": "A", "x": "Pterygoid plates in all Le Forts"}, {"n": 15, "s": "Anterior open bite in a Le Fort fracture results from the pull of the:", "o": ["Masseter", "Medial pterygoid", "Temporalis", "Lateral pterygoid", "Buccinator"], "k": "B", "x": "Medial pterygoids pull the maxilla posteroinferiorly → premature posterior contact, anterior open bite"}, {"n": 16, "s": "The first priority in panfacial trauma is:", "o": ["Fracture reduction", "Imaging", "Eye examination", "Airway with cervical spine protection", "Antibiotics"], "k": "D", "x": "ATLS: airway with C-spine control (midface fractures can obstruct; consider tracheostomy)"}, {"n": 17, "s": "The best indicator of correct ZMC reduction is alignment at the:", "o": ["Frontozygomatic suture", "Infraorbital rim", "Zygomatic arch", "Zygomaticomaxillary buttress", "Sphenozygomatic suture (lateral orbital wall)"], "k": "E", "x": "Sphenozygomatic suture (largest contact area) — most reliable; FZ alone can rotate"}, {"n": 18, "s": "An isolated zygomatic arch fracture classically causes:", "o": ["Diplopia", "Epistaxis", "Trismus from coronoid impingement", "Malocclusion", "Enophthalmos"], "k": "C", "x": "Arch depresses onto coronoid → trismus"}, {"n": 19, "s": "In the Gillies approach, the elevator passes:", "o": ["Superficial to the temporoparietal fascia", "Deep to the deep temporal fascia", "Within the temporalis muscle", "Subperiosteally on the frontal bone", "Through the mouth"], "k": "B", "x": "Temporal incision → through deep temporal fascia → elevator beneath fascia on temporalis to under the arch"}, {"n": 20, "s": "The commonest site of an orbital blowout fracture is the:", "o": ["Medial wall only", "Orbital roof", "Lateral wall", "Floor medial to the infraorbital canal", "Orbital apex"], "k": "D", "x": "Floor medial to infraorbital groove (thinnest); medial wall second"}, {"n": 21, "s": "A child has a blowout fracture with little bruising, nausea and bradycardia on upgaze. Management is:", "o": ["Urgent repair within 24–48 hours", "Observation for 2 weeks", "Steroids only", "Antibiotics", "Repair at 3 months"], "k": "A", "x": "\"White-eyed blowout\"/trapdoor: muscle incarceration → oculocardiac reflex → repair within 24–48 h (muscle ischaemia)"}, {"n": 22, "s": "An indication to repair an orbital floor fracture is:", "o": ["Any floor fracture", "Infraorbital numbness alone", "Enophthalmos >2 mm", "Periorbital bruising", "Diplopia resolving within 1 week"], "k": "C", "x": "Enophthalmos >2 mm, floor defect >50% (>2 cm²), entrapment with positive forced duction, persistent diplopia"}, {"n": 23, "s": "The forced duction test distinguishes:", "o": ["Fracture size", "Infection", "Haematoma", "Optic neuropathy", "Mechanical entrapment from muscle palsy"], "k": "E", "x": "Positive (restricted) = mechanical entrapment; free = nerve/muscle palsy or oedema"}, {"n": 24, "s": "A major tip support mechanism is the:", "o": ["Sesamoid cartilages", "Medial crural footplate attachment to the caudal septum", "Anterior nasal spine", "Dorsal septum", "Skin envelope"], "k": "B", "x": "Tardy's major tip support: LLC size/strength · medial crural footplate–caudal septum attachment · scroll (ULC–LLC) attachment"}, {"n": 25, "s": "Inverted-V deformity after rhinoplasty results from:", "o": ["Over-resected lateral crura", "Tip ptosis", "Over-rotation", "Upper lateral cartilage collapse from the nasal bones after hump removal", "Columellar retraction"], "k": "D", "x": "ULCs detach from nasal bones → shadow at the rhinion; prevent with spreader grafts"}, {"n": 26, "s": "A polly beak deformity is commonly due to:", "o": ["Over-resection of the bony hump only", "Over-rotation of the tip", "Inadequate lowering of the cartilaginous dorsum (supratip)", "Septal perforation", "Alar base reduction"], "k": "C", "x": "Supratip fullness: inadequate cartilaginous dorsum reduction (or supratip scar/loss of tip support)"}, {"n": 27, "s": "Over-resection of the lateral crura causes:", "o": ["Polly beak", "Open roof", "Rocker deformity", "Saddle nose", "Alar collapse and pinched tip"], "k": "E", "x": "Lateral crural over-resection → external valve collapse, alar retraction, pinched tip"}, {"n": 28, "s": "The minimum width of the septal L-strut to preserve is:", "o": ["2 mm", "10 mm", "5 mm", "30 mm", "50 mm"], "k": "B", "x": "≥10 mm (1–1.5 cm) dorsal and caudal strut, otherwise saddle/tip collapse"}, {"n": 29, "s": "A rocker deformity results from:", "o": ["An osteotomy extending too high into thick frontal bone", "A low osteotomy", "No osteotomy", "Septal over-resection", "Spreader grafts"], "k": "A", "x": "High osteotomy into thick nasofrontal bone → upper fragment rocks outward"}, {"n": 30, "s": "Spreader grafts mainly:", "o": ["Increase tip projection", "Narrow the tip", "Widen the internal valve and prevent inverted-V", "Lengthen the nose", "Support the columella"], "k": "C", "x": "Spreaders (between septum and ULC): widen internal valve, straighten dorsum, prevent inverted-V"}, {"n": 31, "s": "A columellar strut provides:", "o": ["Dorsal height", "Alar support", "Valve widening", "Tip support and projection", "Septal straightening"], "k": "D", "x": "Columellar strut: between medial crura → tip support and projection"}, {"n": 32, "s": "The normal nasofrontal angle is:", "o": ["60–80°", "90–95°", "140–160°", "180°", "115–130°"], "k": "E", "x": "Nasofrontal 115–130°"}, {"n": 33, "s": "The ideal female nasolabial angle is:", "o": ["80–85°", "95–110°", "120–135°", "70°", "140°"], "k": "B", "x": "Female 95–110°; male 90–95°"}, {"n": 34, "s": "The ideal Goode ratio for tip projection is:", "o": ["0.2–0.3", "0.8", "0.55–0.60", "1.0", "0.4"], "k": "C", "x": "Goode: tip projection / nasion-to-tip length = 0.55–0.60"}, {"n": 35, "s": "Webster's triangle is preserved during lateral osteotomy to avoid:", "o": ["Internal valve narrowing", "Rocker deformity", "Open roof", "Saddle nose", "Epiphora"], "k": "A", "x": "Low-to-low/high-low-high osteotomy preserving the bony triangle at the pyriform aperture protects the inferior turbinate attachment and internal valve"}, {"n": 36, "s": "A hemitransfixion incision gives access to the:", "o": ["Bony septum only", "Turbinates", "Maxillary sinus", "Nasal floor only", "Caudal septum"], "k": "E", "x": "Hemitransfixion (Killian at caudal margin) → caudal septum; Killian incision (higher) → posterior septum"}, {"n": 37, "s": "Whistling on nasal breathing suggests a:", "o": ["Large posterior perforation", "Collapsing valve", "Synechia", "Small anterior perforation", "Choanal stenosis"], "k": "D", "x": "Small anterior perforations whistle; large ones crust and bleed"}, {"n": 38, "s": "Surgical closure of a septal perforation is most successful when the perforation is:", "o": [">4 cm and posterior", "<2 cm", "Any size with a button", "Cocaine-related with ongoing use", "Total septal loss"], "k": "B", "x": "<2 cm: bilateral mucosal advancement flaps + interposition graft (~90%)"}, {"n": 39, "s": "Rhinophyma is:", "o": ["A lymphatic malformation", "A basal cell carcinoma", "Sebaceous gland hypertrophy (end-stage rosacea)", "A fungal infection", "A vascular malformation"], "k": "C", "x": "Sebaceous hypertrophy, phymatous rosacea, men; CO2 laser/decortication; exclude BCC"}, {"n": 40, "s": "The usual organism in septal abscess is:", "o": ["Staphylococcus aureus", "Pseudomonas aeruginosa", "Anaerobes", "Haemophilus influenzae", "Candida"], "k": "A", "x": "S. aureus (also streptococci); drain, IV antibiotics; risk of saddle nose, CST"}, {"n": 41, "s": "An isolated displaced anterior table frontal fracture with a patent outflow tract is treated by:", "o": ["Cranialisation", "Obliteration", "Observation in all cases", "Draf III", "ORIF for contour"], "k": "E", "x": "Anterior table only, outflow patent → ORIF for contour (or observe if minimal)"}, {"n": 42, "s": "Which is NOT a vertical buttress of the midface?", "o": ["Nasomaxillary", "Zygomaticomaxillary", "Pterygomaxillary", "Infraorbital rim", "None — all are vertical"], "k": "D", "x": "Infraorbital rim is a horizontal buttress (with frontal bar, zygomatic arch, palate)"}, {"n": 43, "s": "A saddle nose is corrected by:", "o": ["Spreader grafts", "Dorsal onlay graft (septal, conchal or costal)", "Columellar strut alone", "Lateral osteotomy", "Alar batten grafts"], "k": "B", "x": "Dorsal onlay (septal, conchal, costal cartilage; diced cartilage in fascia)"}, {"n": 44, "s": "Revision rhinoplasty is usually delayed for at least:", "o": ["12 months", "1 week", "6 weeks", "3 months", "5 years"], "k": "A", "x": "≥12 months (soft tissue settles)"}, {"n": 45, "s": "An open roof deformity can occur after:", "o": ["Bony hump removal with inadequate osteotomies", "Excessive resection of lower lateral crura", "Avulsion of upper lateral cartilages", "Excessive supratip soft tissue", "Over-resection of septal cartilage"], "k": "A", "x": "(PP ENT-A Q8) — Hump removal leaves a flat-topped gap; lateral osteotomies with infracture close it"}, {"n": 46, "s": "Management of deviated nasal fractures in children includes all EXCEPT:", "o": ["Early closed reduction (<4 days)", "General anaesthesia during closed reduction", "Immediate incision and drainage of septal haematoma", "Nasal stenting after closed reduction for infants under 6 months", "Open reduction for deviation greater than half the nasal bridge width"], "k": "D", "x": "(PP ENT-A Q98 = ENT-B Q52, recycled) ⚠ — Infants <6 months are obligate nasal breathers — avoid stenting/packing; others are standard practice"}, {"n": 47, "s": "The most common management of a depressed zygomatic fracture (not associated with maxillary fracture) is:", "o": ["Gillies elevation via temporal incision", "Open reduction and transosseous wiring", "Kirschner pin", "External traction from a plaster cap", "Watchful waiting"], "k": "A", "x": "(PP ENT-B Q39) — Gillies temporal approach (isolated arch/simple depressed zygoma)"}, {"n": 48, "s": "In a typical orbital blowout fracture, eye movement is affected primarily in:", "o": ["Upward gaze", "Downward gaze", "Medial gaze", "Lateral gaze"], "k": "A", "x": "(PP ENT-B Q40) — Inferior rectus/fat entrapment → limited upgaze"}, {"n": 49, "s": "In a child in whom several cleft palate closures have failed, the best management is:", "o": ["Secondary closure at age 16", "Posterior pharyngeal flap", "Vomer flap", "External skin tube pedicle", "Prosthesis"], "k": "E", "x": "(PP ENT-B Q41) ⚠ — Old-bank key: obturator prosthesis after multiple failed closures"}, {"n": 50, "s": "Regarding facial nerve injury, which is true?", "o": ["Repair should be delayed 7 days", "Best results are obtained when repair occurs after 14 days", "Repair should be performed for injuries medial to the lateral canthus", "Best results are obtained the sooner repair is performed", "Distal branches may be stimulated up to 96 hours after injury"], "k": "D", "x": "(PP ENT-B Q59) — Early repair best; distal branches stimulable ~72 h; repair injuries lateral to the lateral canthus (medial branches arborise)"}]}, {"c": 1, "t": "Session 6", "d": "Clinical Rhinology", "q": [{"n": 1, "s": "A 50-year-old has active anterior epistaxis. Correct first aid is:", "o": ["Head back, pinch the nasal bridge", "Sit forward, pinch the soft nose for 10–20 minutes", "Lie flat", "Ice to the neck only", "Blow the nose, then pack"], "k": "B", "x": "Lean forward (avoid swallowing/aspirating blood), firm pressure on soft nose 10–20 min ± ice to mouth"}, {"n": 2, "s": "A 75-year-old on warfarin for AF has an anterior bleed controlled with cautery. INR is 2.6. Next step:", "o": ["Stop warfarin permanently", "Give vitamin K", "Give fresh frozen plasma", "Continue warfarin (INR therapeutic)", "Switch to aspirin"], "k": "D", "x": "Therapeutic INR + controlled bleed → continue; reverse only for life-threatening bleeding or supratherapeutic INR (discuss with prescriber)"}, {"n": 3, "s": "On day 3 of nasal packing, a patient develops fever, hypotension and an erythematous rash. Management is:", "o": ["Remove packs — toxic shock syndrome", "Antihistamine — allergic reaction", "Reassure — viral exanthem", "Oral antibiotics — sinusitis", "Stop analgesics — drug rash"], "k": "A", "x": "Toxic shock syndrome (S. aureus TSST-1): remove packs, resuscitate, antistaphylococcal antibiotics"}, {"n": 4, "s": "A patient with HHT remains transfusion-dependent despite laser and tranexamic acid. The most definitive option for epistaxis is:", "o": ["Septoplasty", "External carotid ligation", "Repeated cautery", "Long-term packing", "Young's procedure (nostril closure)"], "k": "E", "x": "Young's nostril closure stops HHT epistaxis in most; also systemic bevacizumab, septodermoplasty"}, {"n": 5, "s": "A child has recurrent anterior epistaxis with vestibular crusting. First-line treatment is:", "o": ["Cautery under GA", "Nasal packing", "Antiseptic nasal cream", "Haematology referral", "Oral antibiotics"], "k": "C", "x": "Antiseptic cream (chlorhexidine-neomycin) twice daily for 4 weeks — as effective as cautery"}, {"n": 6, "s": "A child has recurrent epistaxis with widespread bruising and petechiae. The next step is:", "o": ["Full blood count and clotting screen", "Silver nitrate cautery", "Nasal packing", "Reassurance", "CT sinuses"], "k": "A", "x": "Bruising/petechiae → FBC, clotting (ITP, leukaemia, von Willebrand)"}, {"n": 7, "s": "A patient on CPAP for OSA develops nasal dryness and recurrent epistaxis. Best management is:", "o": ["Stop CPAP", "Oral antibiotics", "Repeated cautery", "Heated humidification", "Septal surgery"], "k": "D", "x": "Heated humidification ± saline gel; keep CPAP"}, {"n": 8, "s": "A woman in her third trimester has nasal congestion with no allergy history. The likely diagnosis is:", "o": ["CRS requiring ESS", "Indication for oral decongestant", "New allergic rhinitis", "Nasal polyps", "Pregnancy rhinitis — resolves postpartum"], "k": "E", "x": "Oestrogen-mediated mucosal engorgement; saline, nasal dilator strips; resolves within 2 weeks of delivery"}, {"n": 9, "s": "The intranasal corticosteroid with the most reassuring pregnancy data is:", "o": ["Mometasone", "Budesonide", "Oral prednisolone", "Depot triamcinolone injection", "Oxymetazoline"], "k": "B", "x": "Budesonide has the largest safety dataset in pregnancy"}, {"n": 10, "s": "A man develops nasal congestion after starting tamsulosin. The diagnosis is:", "o": ["Viral rhinitis", "Allergic rhinitis", "Drug-induced rhinitis", "Nasal polyps", "Septal deviation"], "k": "C", "x": "Alpha-blockers, PDE5 inhibitors, beta-blockers, ACE inhibitors, NSAIDs, oral contraceptives"}, {"n": 11, "s": "Moderate-severe allergic rhinitis is uncontrolled on intranasal steroid. The next step (ARIA) is:", "o": ["Long-term oral steroids", "Depot steroid injection", "Regular decongestant", "Stop the intranasal steroid", "Add intranasal azelastine (combination spray)"], "k": "E", "x": "Azelastine-fluticasone combination > either alone; avoid depot steroids"}, {"n": 12, "s": "A 10-year-old monosensitised to grass has allergic rhinitis and controlled asthma, failing pharmacotherapy. The best option is:", "o": ["Sublingual immunotherapy", "Omalizumab", "Turbinate reduction", "Oral steroids", "Septoplasty"], "k": "A", "x": "SLIT (grass): long-term benefit and may prevent asthma progression; needs controlled asthma"}, {"n": 13, "s": "The initial management of atrophic rhinitis is:", "o": ["Turbinectomy", "Antibiotics only", "Alkaline douching, crust removal and glucose-in-glycerine drops", "Systemic steroids", "Young's operation first"], "k": "C", "x": "Alkaline douching (bicarbonate/borax), crust removal, 25% glucose in glycerine; surgery if refractory"}, {"n": 14, "s": "CRSsNP persists after 3 months of intranasal steroid and saline (± antibiotics); CT confirms disease. The next step is:", "o": ["More antibiotics", "Endoscopic sinus surgery", "Biologic therapy", "Observation", "Radiotherapy"], "k": "B", "x": "Failed appropriate medical therapy + CT disease → ESS"}, {"n": 15, "s": "A patient has facial pressure with normal endoscopy and normal CT. The likely diagnosis and treatment are:", "o": ["CRS — ESS", "Sinusitis — antibiotics", "Ostial stenosis — balloon sinuplasty", "Midfacial segment pain — amitriptyline", "Septal deviation — septoplasty"], "k": "D", "x": "Midfacial segment pain (tension-type variant) — low-dose amitriptyline; avoid unnecessary surgery"}, {"n": 16, "s": "An asthmatic with polyps and NSAID-induced wheeze needs analgesia. The safest choice is:", "o": ["Ibuprofen", "Aspirin", "Paracetamol (low dose)", "Diclofenac", "Naproxen"], "k": "C", "x": "Paracetamol ≤1 g (or selective COX-2) usually tolerated; avoid COX-1 NSAIDs"}, {"n": 17, "s": "CT sinuses for CRS is best timed:", "o": ["During an acute infection", "Before any treatment", "Immediately at presentation", "With contrast always", "After maximal medical therapy, not during acute infection"], "k": "E", "x": "After maximal medical therapy, outside acute episodes; non-contrast unless complications"}, {"n": 18, "s": "A short preoperative oral steroid course before polyp surgery:", "o": ["Reduces bleeding and improves the surgical field", "Increases infection", "Has no benefit", "Causes CSF leak", "Replaces surgery"], "k": "A", "x": "Pre-op steroids shrink polyps, reduce bleeding, improve visibility"}, {"n": 19, "s": "The key long-term management after ESS for CRS is:", "o": ["Long-term antibiotics", "Nothing further", "Monthly CT scans", "Saline irrigation and topical steroids", "Continuous oral steroids"], "k": "D", "x": "Saline + topical steroid (irrigation) long-term; debridement early post-op"}, {"n": 20, "s": "A patient with polyps and anosmia regains smell after a short oral steroid course. This implies:", "o": ["Neural loss", "Conductive/inflammatory loss — recoverable", "Malignancy", "Kallmann syndrome", "Post-viral loss"], "k": "B", "x": "Steroid-responsive smell = conductive/inflammatory, predicts recovery after treatment"}, {"n": 21, "s": "A neutropenic patient has fever, facial pain and a pale insensate middle turbinate. The next step is:", "o": ["Antibiotics, review in 48 hours", "CT only", "MRI next week", "Urgent biopsy with frozen section", "Saline irrigation"], "k": "D", "x": "Suspected acute invasive fungal sinusitis → urgent biopsy (frozen section), then débridement + antifungal"}, {"n": 22, "s": "A child has proptosis and painful restricted eye movement with normal vision; CT shows orbital fat stranding without abscess. Management is:", "o": ["Urgent drainage", "IV antibiotics and close monitoring", "Oral antibiotics as outpatient", "Steroids only", "Observation"], "k": "B", "x": "Chandler II (orbital cellulitis): IV antibiotics, nasal decongestants, eye checks; CT repeat if worsening"}, {"n": 23, "s": "A 12-year-old has a large subperiosteal abscess with an afferent pupillary defect. Management is:", "o": ["IV antibiotics for 48 hours first", "Oral antibiotics", "Steroids", "MRI, then decide", "Urgent surgical drainage"], "k": "E", "x": "Visual compromise (RAPD) → urgent drainage regardless of age/size"}, {"n": 24, "s": "A 3-year-old has unilateral foul purulent nasal discharge. The likely diagnosis is:", "o": ["Sinusitis", "Choanal atresia", "Nasal foreign body", "Adenoiditis", "Allergy"], "k": "C", "x": "Unilateral foul discharge in a child = foreign body until proven otherwise"}, {"n": 25, "s": "A toddler has a button battery in the nose. Management is:", "o": ["Immediate removal", "Next-day theatre list", "Saline drops", "Observation", "Antibiotics"], "k": "A", "x": "Batteries cause septal necrosis/perforation within hours — remove immediately"}, {"n": 26, "s": "A 6-year-old has a unilateral polyp-like mass high in the nasal vault. The next step is:", "o": ["Clinic biopsy", "Excision", "Intranasal steroid", "Antibiotics", "MRI/CT before any biopsy"], "k": "E", "x": "Midline/high vault mass in a child: exclude encephalocele (MRI/CT) before biopsy"}, {"n": 27, "s": "A neonate is cyanotic at rest but pink when crying; a catheter cannot pass either side. Immediate management is:", "o": ["Tracheostomy", "Nasal CPAP", "Oral airway (McGovern nipple)", "Steroids", "Observation"], "k": "C", "x": "Secure oral airway (McGovern nipple/oropharyngeal airway) → elective repair"}, {"n": 28, "s": "Bilateral choanal atresia, coloboma and a cardiac defect suggest a mutation in:", "o": ["PAX3", "SLC26A4", "TCOF1", "CHD7", "FGFR2"], "k": "D", "x": "CHARGE (CHD7): Coloboma, Heart, Atresia choanae, Retardation, Genital, Ear anomalies"}, {"n": 29, "s": "A neonate with nasal obstruction has a narrow piriform aperture and a single central mega-incisor. The next step is:", "o": ["Reassurance", "Endocrine and brain evaluation", "Immediate surgery", "Antibiotics", "Septoplasty"], "k": "B", "x": "Congenital nasal piriform aperture stenosis + single central incisor → holoprosencephaly spectrum, pituitary dysfunction"}, {"n": 30, "s": "An infant has persistent bloody \"snuffles\" and a rash. The diagnosis and treatment are:", "o": ["Congenital syphilis — penicillin", "Viral rhinitis — saline", "Allergic rhinitis — antihistamine", "Foreign body — removal", "Choanal atresia — surgery"], "k": "A", "x": "Congenital syphilis \"snuffles\" (highly infectious) → penicillin; later saddle nose"}, {"n": 31, "s": "A patient has CSF rhinorrhoea 2 days after head injury. Management is:", "o": ["Prophylactic antibiotics", "Immediate surgical repair", "Conservative measures and pneumococcal vaccination", "Lumbar puncture", "Nasal packing"], "k": "C", "x": "Bed rest, head elevation, avoid straining; pneumococcal vaccination; no prophylactic antibiotics"}, {"n": 32, "s": "A patient on day 1 after nasal fracture has deformity and a septal haematoma. Management is:", "o": ["Drain the haematoma now; reduce the fracture later", "Reduce the fracture first only", "Antibiotics and review at 1 week", "Septorhinoplasty at 6 months only", "Observation"], "k": "A", "x": "Haematoma = emergency (cartilage necrosis); fracture reduction after swelling settles"}, {"n": 33, "s": "A patient presents 5 weeks after a nasal fracture with deformity. Management is:", "o": ["Closed reduction now", "Open reduction now", "Observation indefinitely", "Formal septorhinoplasty after ~6 months", "Fillers only"], "k": "D", "x": "Bones set by ~3 weeks; wait ~6 months for healing, then septorhinoplasty"}, {"n": 34, "s": "A Le Fort III fracture with CSF rhinorrhoea is managed initially by:", "o": ["Immediate craniotomy", "Lumbar drain first", "Prophylactic antibiotics", "Endoscopic repair first", "Fracture reduction — most leaks then close"], "k": "E", "x": "Most CSF leaks with midface fractures close after reduction/fixation; repair persistent leaks"}, {"n": 35, "s": "A patient with an orbital floor fracture should be advised to:", "o": ["Irrigate the nose forcefully", "Avoid nose blowing", "Apply hot compresses", "Perform Valsalva", "Fly immediately"], "k": "B", "x": "Avoid nose blowing (orbital emphysema, infection); ± antibiotics if sinus involved"}, {"n": 36, "s": "A woodworker has intestinal-type adenocarcinoma confined to the ethmoid. Management is:", "o": ["Radiotherapy alone", "Endoscopic resection with postoperative RT", "Chemotherapy alone", "Observation", "Orbital exenteration"], "k": "B", "x": "Endoscopic resection (negative margins) + postoperative RT"}, {"n": 37, "s": "Staging work-up for sinonasal mucosal melanoma includes:", "o": ["Plain chest radiograph only", "Abdominal ultrasound only", "Bone scan only", "No staging needed", "PET-CT"], "k": "E", "x": "PET-CT (high distant metastasis risk) + MRI for local extent"}, {"n": 38, "s": "A small asymptomatic residual JNA is seen after resection. Management is:", "o": ["Radiotherapy", "Immediate revision surgery", "MRI surveillance", "Chemotherapy", "Hormone therapy"], "k": "C", "x": "Small residual JNA may stabilise/involute after puberty → MRI surveillance"}, {"n": 39, "s": "An inverted papilloma specimen shows a focus of SCC. Management is:", "o": ["Manage as SCC — re-stage, clear margins, consider adjuvant RT", "No further treatment", "Topical 5-FU", "Repeat endoscopy in 5 years", "Antiviral therapy"], "k": "A", "x": "Treat as SCC: re-stage, ensure margins, consider RT"}, {"n": 40, "s": "A resectable T4a N0 maxillary SCC is treated by:", "o": ["Radiotherapy alone", "Chemotherapy alone", "Palliation", "Maxillectomy with postoperative (chemo)radiotherapy", "Observation"], "k": "D", "x": "Maxillectomy (± orbital floor/exenteration as needed) + postoperative (chemo)RT; neck management for T3–4"}, {"n": 41, "s": "Post-viral smell loss persists for 3 months. The recommended treatment is:", "o": ["Olfactory training", "ESS", "Antibiotics", "Zinc supplements", "Reassurance only"], "k": "A", "x": "Olfactory training (4 odours, twice daily, ≥3 months)"}, {"n": 42, "s": "Recovery from post-traumatic anosmia occurs in about:", "o": [">90%", "70%", "10–30%", "0%", "50% always"], "k": "C", "x": "Post-traumatic anosmia recovery ~10–30%, mostly within the first year"}, {"n": 43, "s": "A patient has unilateral anosmia and personality change. The next step is:", "o": ["Treat as viral", "MRI for olfactory groove meningioma", "Steroids for polyps", "Treat as CRS", "Test for Kallmann syndrome"], "k": "B", "x": "Olfactory groove meningioma (Foster Kennedy syndrome) — frontal lobe signs"}, {"n": 44, "s": "A patient with GPA has a saddle nose. Reconstruction should be:", "o": ["Performed immediately", "Replaced by a septal button", "Never performed", "Deferred until disease is in sustained remission", "Replaced by steroid injection"], "k": "D", "x": "Reconstruct only in sustained remission (≥12 months), in coordination with rheumatology"}, {"n": 45, "s": "A cocaine user has septal and palatal perforation and a positive ANCA. The likely diagnosis and first step are:", "o": ["Definite GPA — cyclophosphamide", "Immediate repair", "Steroids alone", "Rhinoplasty", "Cocaine-induced midline destructive lesion — cessation first"], "k": "E", "x": "CIMDL: cocaine (levamisole) may cause ANCA (often HNE) positivity mimicking GPA; cessation first, no repair while using"}, {"n": 46, "s": "Nasal crusting, \"apple-jelly\" septal nodules, hilar lymphadenopathy and raised ACE suggest:", "o": ["Tuberculosis", "GPA", "Leprosy", "Sarcoidosis", "Rhinoscleroma"], "k": "D", "x": "Sarcoidosis: apple-jelly nodules, crusting, raised ACE, hilar nodes; steroids"}, {"n": 47, "s": "A patient from India has a bleeding, strawberry-like nasal polyp; histology shows sporangia with endospores. The diagnosis is:", "o": ["Rhinoscleroma", "Rhinosporidiosis", "Aspergillosis", "Pyogenic granuloma", "Haemangioma"], "k": "B", "x": "Rhinosporidiosis (Rhinosporidium seeberi): excision with cautery to base; dapsone adjunct"}, {"n": 48, "s": "Symptomatic septal deviation persists despite intranasal steroids. Management is:", "o": ["Septoplasty", "Total turbinectomy", "ESS", "Rhinoplasty alone", "Antibiotics"], "k": "A", "x": "Septoplasty ± turbinate reduction"}, {"n": 49, "s": "Refractory inferior turbinate hypertrophy is best treated by:", "o": ["Total turbinectomy", "Radiotherapy", "Long-term decongestants", "Repeated steroid injection", "Mucosa-preserving submucosal reduction"], "k": "E", "x": "Submucosal reduction (microdebrider, radiofrequency, coblation); preserve mucosa → avoid empty nose"}, {"n": 50, "s": "Maggots are found in the nose of a patient with atrophic rhinitis. Management is:", "o": ["Ignore", "Steroids", "Turpentine/chloroform instillation and manual removal (± ivermectin)", "Antibiotics only", "Radiotherapy"], "k": "C", "x": "Turpentine/chloroform instillation to immobilise larvae, manual removal, ivermectin; treat underlying atrophic rhinitis"}]}, {"c": 1, "t": "Session 7", "d": "Gap Closure", "q": [{"n": 1, "s": "The commonest sphenoid pneumatisation pattern is:", "o": ["Conchal", "Presellar", "Sellar", "Absent", "Hypoplastic"], "k": "C", "x": "Sellar ~75–85%; presellar ~10–20%; conchal <5% (adults)"}, {"n": 2, "s": "The pneumatisation pattern that makes transsphenoidal access hardest, common in young children, is:", "o": ["Sellar", "Presellar", "Postsellar", "Lateral recess", "Conchal"], "k": "E", "x": "Conchal: solid bone below the sella; drill required; common in children <10–12"}, {"n": 3, "s": "The lateral sphenoid landmark lying between the optic nerve and ICA is the:", "o": ["Opticocarotid recess", "Clival recess", "Planum sphenoidale", "Tuberculum sellae", "Sellar floor"], "k": "A", "x": "Lateral opticocarotid recess: between optic canal prominence above and carotid prominence below — key navigation point"}, {"n": 4, "s": "First-line treatment for a prolactinoma is:", "o": ["Transsphenoidal surgery", "Radiotherapy", "Octreotide", "Cabergoline", "Observation"], "k": "D", "x": "Cabergoline (dopamine agonist) shrinks most prolactinomas, even with visual symptoms; surgery for intolerance/resistance"}, {"n": 5, "s": "After transsphenoidal surgery, a patient has polyuria, low urine osmolality and rising sodium. The diagnosis and treatment are:", "o": ["SIADH — fluid restriction", "Diabetes insipidus — desmopressin", "Hyperglycaemia — insulin", "Cerebral salt wasting — saline", "Hypothyroidism — thyroxine"], "k": "B", "x": "Central DI: polyuria, dilute urine, hypernatraemia → desmopressin; often transient; may be triphasic (DI → SIADH → DI)"}, {"n": 6, "s": "Pituitary apoplexy with visual loss is managed by:", "o": ["Observation", "Radiotherapy", "IV hydrocortisone and urgent decompression", "Cabergoline alone", "Lumbar puncture"], "k": "C", "x": "Haemorrhagic infarction → adrenal crisis risk → hydrocortisone; visual loss/declining consciousness → urgent decompression"}, {"n": 7, "s": "Bitemporal hemianopia localises to the:", "o": ["Optic nerve", "Optic tract", "Lateral geniculate body", "Occipital cortex", "Optic chiasm"], "k": "E", "x": "Chiasm compression (crossing nasal fibres) → bitemporal hemianopia"}, {"n": 8, "s": "The endonasal transplanum/transtuberculum approach is suited to:", "o": ["Suprasellar lesions (craniopharyngioma, tuberculum meningioma)", "Clival chordoma", "Petrous apex lesions", "Orbital apex lesions", "Frontal sinus lesions"], "k": "A", "x": "Transplanum/transtuberculum: suprasellar craniopharyngioma, tuberculum sellae/planum meningiomas"}, {"n": 9, "s": "The endonasal transclival approach is mainly used for:", "o": ["Pituitary microadenoma", "Olfactory groove meningioma", "Frontal mucocele", "Clival chordoma", "Orbital tumour"], "k": "D", "x": "Transclival: chordoma, chondrosarcoma, clival lesions (ventral brainstem access)"}, {"n": 10, "s": "Sacrifice of the vidian nerve in extended approaches causes:", "o": ["Anosmia", "Dry eye", "Facial palsy", "Hearing loss", "Diplopia"], "k": "B", "x": "Vidian carries GSPN parasympathetics → lacrimal gland → dry eye (usually tolerated)"}, {"n": 11, "s": "Endoscopic DCR is indicated for:", "o": ["Canalicular obstruction", "Punctal stenosis", "Nasolacrimal duct obstruction", "Lid laxity", "Dry eye"], "k": "C", "x": "Post-saccal (NLD) obstruction → DCR bypasses duct into nose"}, {"n": 12, "s": "The lacrimal sac lies:", "o": ["Behind the basal lamella", "Above the cribriform plate", "In the superior meatus", "Behind the bulla", "Anterior to the uncinate, at the axilla of the middle turbinate"], "k": "E", "x": "Sac lies deep to frontal process of maxilla, anterior to uncinate (maxillary line), centred at axilla of middle turbinate (higher than often expected)"}, {"n": 13, "s": "Common canalicular obstruction is treated by:", "o": ["Conjunctivo-DCR with a Lester Jones tube", "Endoscopic DCR alone", "Probing", "Steroids", "Antibiotics"], "k": "A", "x": "Canalicular/common canalicular obstruction → conjunctivo-DCR (Lester Jones glass tube); DCR alone won't work"}, {"n": 14, "s": "Urgent orbital decompression in thyroid eye disease is indicated for:", "o": ["Mild proptosis", "Compressive optic neuropathy refractory to IV steroids", "Lid retraction", "Cosmesis only", "Dry eye"], "k": "B", "x": "Dysthyroid optic neuropathy failing IV methylprednisolone → urgent decompression; also severe exposure keratopathy"}, {"n": 15, "s": "Endoscopic orbital decompression removes the:", "o": ["Lateral wall", "Orbital roof", "Orbital rim", "Medial wall and medial floor", "Lacrimal bone only"], "k": "D", "x": "Medial wall + medial floor (preserve the inferomedial strut to reduce diplopia); lateral wall via external approach"}, {"n": 16, "s": "The commonest complication of medial orbital decompression is:", "o": ["CSF leak", "Blindness", "New-onset diplopia", "Anosmia", "Epiphora"], "k": "C", "x": "New/worsened diplopia (~15–30%), especially in balanced (medial-only) decompressions"}, {"n": 17, "s": "High-dose steroids in traumatic optic neuropathy:", "o": ["Have proven benefit", "Are standard care", "Are mandatory", "Must always be combined with decompression", "Have no proven benefit and are harmful with head injury"], "k": "E", "x": "IONTS: no benefit vs observation; CRASH: high-dose steroids increase mortality in head injury"}, {"n": 18, "s": "Endoscopic optic nerve decompression removes the:", "o": ["Anterior lamina papyracea", "Medial wall of the optic canal", "Orbital roof", "Orbital floor", "Lateral orbital wall"], "k": "B", "x": "Medial optic canal wall (sphenoid/posterior ethmoid) ± sheath incision (controversial)"}, {"n": 19, "s": "Infection in the facial \"danger triangle\" spreads to the cavernous sinus via the:", "o": ["Facial, angular and ophthalmic veins", "Cervical lymphatics", "Arterial supply", "Perineural V2 spread", "Lymphatics to the parotid"], "k": "A", "x": "Valveless facial → angular → superior ophthalmic veins → cavernous sinus; don't squeeze nasal furuncles"}, {"n": 20, "s": "Recurrent nasal vestibulitis with MRSA carriage is managed by:", "o": ["Oral steroids", "Surgery", "Long-term oral antibiotics", "Mupirocin decolonisation", "Cautery"], "k": "D", "x": "Mupirocin to vestibule (+ chlorhexidine body wash); topical ± oral antistaphylococcal for acute"}, {"n": 21, "s": "Asthma, eosinophilia, nasal polyps, neuropathy and p-ANCA suggest:", "o": ["GPA", "Sarcoidosis", "AERD alone", "Microscopic polyangiitis", "EGPA (Churg-Strauss)"], "k": "E", "x": "EGPA: asthma, eosinophilia >10%, polyps/sinusitis, mononeuritis, p-ANCA (MPO) ~40%"}, {"n": 22, "s": "Nasal tuberculosis typically involves the:", "o": ["Bony septum", "Turbinates only, sparing the septum", "Cartilaginous septum, sparing bone", "Palate first", "Nasopharynx only"], "k": "C", "x": "TB: cartilaginous septum ulceration/perforation, bone spared; lupus vulgaris of vestibule"}, {"n": 23, "s": "Tertiary syphilis of the nose typically causes:", "o": ["Cartilaginous perforation only", "Bony septal destruction, gumma and saddle nose", "Turbinate hypertrophy", "Nasal polyps", "Choanal atresia"], "k": "B", "x": "Tertiary syphilis: gumma destroys bony septum → saddle nose; also palatal perforation"}, {"n": 24, "s": "Nasal obstruction with anaesthetic skin patches and thickened peripheral nerves suggests:", "o": ["Leprosy", "Tuberculosis", "Sarcoidosis", "Leishmaniasis", "Rhinoscleroma"], "k": "A", "x": "Lepromatous leprosy: nasal involvement early (often first site), anterior septal and turbinate infiltration, collapse; dapsone, rifampicin, clofazimine"}, {"n": 25, "s": "Mucocutaneous leishmaniasis is treated with:", "o": ["Isoniazid", "Penicillin", "Dapsone", "Pentavalent antimonials (sodium stibogluconate)", "Ciprofloxacin"], "k": "D", "x": "Pentavalent antimonials (sodium stibogluconate, meglumine antimoniate); liposomal amphotericin as alternative; L. braziliensis typical for mucosal disease"}, {"n": 26, "s": "An infant has unilateral serosanguinous nasal discharge with a grey membrane. The likely diagnosis is:", "o": ["Foreign body", "Congenital syphilis", "Allergic rhinitis", "Viral rhinitis", "Nasal diphtheria"], "k": "E", "x": "Nasal diphtheria: unilateral serosanguinous discharge, excoriated nostril, membrane; antitoxin + penicillin/erythromycin; notifiable"}, {"n": 27, "s": "Occupational rhinitis characteristically:", "o": ["Worsens on holidays", "Is unrelated to work", "Improves away from work", "Is always IgE-negative", "Is treated only by surgery"], "k": "C", "x": "Work-related, improves on weekends/holidays; may precede occupational asthma; remove exposure"}, {"n": 28, "s": "Local allergic rhinitis shows:", "o": ["Positive skin prick tests", "Negative skin prick/serum IgE with positive nasal provocation", "Nasal neutrophilia", "Raised serum IgE", "Absent eosinophils"], "k": "B", "x": "Local allergic rhinitis: local nasal IgE; diagnosis by nasal allergen provocation test"}, {"n": 29, "s": "PNIF measures:", "o": ["Nasal resistance", "Cross-sectional area", "Olfaction", "Mucociliary clearance", "Peak nasal inspiratory airflow"], "k": "E", "x": "Peak nasal inspiratory flow (L/min); cheap, reproducible objective measure"}, {"n": 30, "s": "The NOSE scale is a:", "o": ["Patient-reported nasal obstruction score", "CT score", "Endoscopic score", "Smell test", "Allergy score"], "k": "A", "x": "Nasal Obstruction Symptom Evaluation: 5 items, 0–100; outcome measure for septoplasty/valve surgery"}, {"n": 31, "s": "On Sniffin' Sticks testing, functional anosmia corresponds to a TDI score of:", "o": [">30", "25", "20", "≤16", "40"], "k": "D", "x": "TDI (threshold + discrimination + identification): ≤16 functional anosmia; ≥30.75 normosmia"}, {"n": 32, "s": "The UPSIT consists of:", "o": ["12 items", "20 items", "40 scratch-and-sniff items", "100 items", "5 items"], "k": "C", "x": "40-item scratch-and-sniff, forced choice; also detects malingering (very low scores)"}, {"n": 33, "s": "An anosmic patient complains of \"no taste.\" The explanation is:", "o": ["Chorda tympani injury", "Loss of retronasal smell (flavour) with intact basic tastes", "Glossopharyngeal injury", "Zinc deficiency", "Hypothyroidism"], "k": "B", "x": "Flavour depends on retronasal smell; true taste (sweet, salty, sour, bitter, umami) is intact — test taste separately"}, {"n": 34, "s": "Second-generation antihistamines are:", "o": ["Strongly anticholinergic", "Very sedating", "Freely crossing the blood-brain barrier", "Short-acting", "Less sedating, with minimal blood-brain barrier penetration"], "k": "E", "x": "Cetirizine, loratadine, fexofenadine: less sedating, once daily"}, {"n": 35, "s": "Oxymetazoline is a(n):", "o": ["Alpha-adrenergic agonist", "Antihistamine", "Anticholinergic", "Corticosteroid", "Leukotriene antagonist"], "k": "A", "x": "α-agonist vasoconstrictor; ≤5–7 days (rhinitis medicamentosa); caution with MAOIs, hypertension"}, {"n": 36, "s": "Montelukast carries a regulatory warning for:", "o": ["Hepatotoxicity", "Ototoxicity", "Neuropsychiatric effects", "Nephrotoxicity", "Cardiotoxicity"], "k": "C", "x": "FDA boxed warning: neuropsychiatric events (agitation, depression, suicidality)"}, {"n": 37, "s": "Sodium cromoglycate is:", "o": ["For acute symptom relief", "Dosed once weekly", "An antihistamine", "A prophylactic mast-cell stabiliser needing frequent pre-exposure dosing", "A decongestant"], "k": "D", "x": "Mast-cell stabiliser; 4–6 times daily before exposure; safe in pregnancy/children; weak"}, {"n": 38, "s": "Oral antihistamines are least effective for:", "o": ["Sneezing", "Nasal congestion", "Itching", "Rhinorrhoea", "Ocular itching"], "k": "B", "x": "Antihistamines poorly treat congestion (histamine is one of many mediators); INCS or decongestant for blockage"}, {"n": 39, "s": "Balloon sinus dilation is best suited to:", "o": ["Extensive polyposis", "Allergic fungal rhinosinusitis", "Sinonasal tumours", "Isolated ethmoid disease", "Recurrent ARS or limited CRSsNP of frontal, maxillary or sphenoid ostia"], "k": "E", "x": "Balloon dilation: recurrent ARS or limited CRSsNP involving dependent ostia; not polyps, ethmoid disease or tumour"}, {"n": 40, "s": "The nasal pits form by invagination of the:", "o": ["Nasal placodes", "Maxillary prominences", "Mandibular prominences", "Pharyngeal pouches", "Neural tube"], "k": "A", "x": "Nasal (olfactory) placodes on the frontonasal process (week 4–5) invaginate to form nasal pits"}, {"n": 41, "s": "The nasolacrimal duct develops from the:", "o": ["First pharyngeal pouch", "Medial nasal prominence", "Nasolacrimal groove between lateral nasal and maxillary prominences", "Stomodeum", "Rathke's pouch"], "k": "C", "x": "Ectodermal cord in the nasolacrimal groove canalises; failure of distal canalisation (Hasner's valve) → congenital NLD obstruction"}, {"n": 42, "s": "A diagnosis of contact point headache is supported by:", "o": ["CT findings alone", "MRI brain", "Allergy testing", "Response to oral steroids", "Relief after topical anaesthetic to the contact point"], "k": "E", "x": "Mucosal contact point (e.g. septal spur–turbinate); topical anaesthetic relief supports diagnosis; surgery controversial"}, {"n": 43, "s": "Craniopharyngioma arises from:", "o": ["Notochord remnants", "Rathke's pouch remnants", "Neural crest", "Arachnoid cells", "Olfactory epithelium"], "k": "B", "x": "Rathke's pouch remnants; calcified, cystic suprasellar mass in children (\"machinery oil\" fluid)"}, {"n": 44, "s": "The success rate of primary endoscopic DCR is about:", "o": ["90%", "30%", "50%", "60%", "99% always"], "k": "A", "x": "~90% (comparable to external DCR)"}, {"n": 45, "s": "The endoscopic prelacrimal recess approach to the maxillary sinus preserves the:", "o": ["Uncinate process only", "Septum", "Middle turbinate", "Inferior turbinate and nasolacrimal duct", "Orbital floor"], "k": "D", "x": "Prelacrimal approach: incision anterior to inferior turbinate head, mobilise IT + NLD → access to anterior/lateral maxillary walls, then restore"}, {"n": 46, "s": "A typical ENT manifestation of acromegaly is:", "o": ["Anosmia", "Epistaxis", "OSA with macroglossia", "Otosclerosis", "Atrophic rhinitis"], "k": "C", "x": "Acromegaly: macroglossia, thickened soft tissues → OSA; also voice deepening, sinus enlargement"}, {"n": 47, "s": "Children may have a physiologic immunodeficiency predisposing to chronic rhinosinusitis until about age:", "o": ["6", "8", "10", "12", "14"], "k": "A", "x": "(PP ENT-A Q10) ⚠ — Immune maturation (IgG subclasses, polysaccharide responses) by ~6–7 years; 8 is the alternative reading — choose 6 if offered"}, {"n": 48, "s": "The 5-year survival for both sinonasal squamous cell carcinoma and adenocarcinoma is about:", "o": ["15–25%", "30–40%", "40–50%", "50–70%", "70–85%"], "k": "D", "x": "(PP ENT-A Q66) ⚠ — Modern series: SCC ~50–60%, adenocarcinoma ~60–70% → overlap 50–70%; older texts quote lower (30–40%) — choose the range covering both"}, {"n": 49, "s": "The frontal sinus is fully developed by about age:", "o": ["11", "4", "8", "16", "18"], "k": "D", "x": "(PP ENT-B Q91) ⚠ — Frontal sinus reaches adult size by mid–late adolescence (~15–18); 16 is the usual keyed figure"}, {"n": 50, "s": "Which structure is visible in the wall of the sphenoid sinus?", "o": ["Optic nerve", "Internal carotid artery", "Maxillary nerve", "Ophthalmic artery", "Facial nerve"], "k": "B", "x": "(PP ENT-B Q92) ⚠ — Both the optic nerve and ICA bulge into the lateral wall; the carotid prominence is the larger, more consistent landmark → ICA is the usual key. If forced, ICA; know both (ICA dehiscent ~20–25%, optic ~6%)"}]}, {"c": 1, "t": "Session 8", "d": "Completion Set", "q": [{"n": 1, "s": "The commonest complication of a Caldwell-Luc operation is:", "o": ["Persistent oroantral fistula", "Nasolacrimal obstruction", "Retrobulbar haematoma", "Infraorbital numbness", "Frontal branch palsy"], "k": "D", "x": "Infraorbital nerve stretch/injury → cheek and upper teeth numbness (~10–30%); oroantral fistula and dacryocystitis are less common"}, {"n": 2, "s": "Caldwell-Luc is avoided in young children because of risk to the:", "o": ["Tooth buds", "Infraorbital nerve", "Nasolacrimal duct", "Orbital floor", "Maxillary artery"], "k": "A", "x": "Unerupted permanent tooth buds lie in the anterior maxilla in children"}, {"n": 3, "s": "A current indication for a Caldwell-Luc approach is:", "o": ["Routine chronic maxillary sinusitis", "Antrochoanal polyp in a child", "Simple acute sinusitis", "Allergic rhinitis", "Anterolateral antral wall disease"], "k": "E", "x": "Today: lesions of the anterior/lateral antral wall not reachable endoscopically, foreign bodies, dental cysts, access for orbital floor or maxillary artery work (largely replaced by endoscopic/prelacrimal routes)"}, {"n": 4, "s": "Bacterial biofilms in chronic rhinosinusitis are characterised by:", "o": ["Easy eradication with antibiotics", "Marked antibiotic tolerance", "Absence on the mucosa", "Exclusive fungal composition", "Resolution with saline alone"], "k": "B", "x": "Biofilms (S. aureus, Pseudomonas) are up to 1000× more tolerant to antibiotics; linked to recalcitrant CRS and poorer post-ESS outcomes"}, {"n": 5, "s": "Osteitis of the sinus walls on CT in CRS predicts:", "o": ["Faster healing", "Fungal disease", "Refractory disease", "Malignancy", "Allergic aetiology"], "k": "C", "x": "Osteitis (neo-osteogenesis, bone thickening) marks chronic inflammation and predicts refractory disease and revision"}, {"n": 6, "s": "The commonest finding at revision endoscopic sinus surgery is:", "o": ["Retained Haller cell", "Septal perforation", "Persistent polyps only", "Lateralised middle turbinate", "Residual posterior ethmoid cells"], "k": "D", "x": "Lateralised middle turbinate (~75%), incomplete anterior ethmoidectomy, scarred frontal recess, retained uncinate"}, {"n": 7, "s": "Failure of endoscopic frontal sinusotomy most often results from:", "o": ["Septal deviation", "Inferior turbinate hypertrophy", "Sphenoid ostium stenosis", "Closure of the maxillary antrostomy", "Retained frontal recess cells"], "k": "E", "x": "Retained agger nasi, frontal and suprabullar cells obstructing the recess"}, {"n": 8, "s": "Tip ptosis in the ageing nose results from:", "o": ["Weakened tip support", "Septal perforation", "Nasal bone growth", "Turbinate atrophy", "Increased skin elasticity"], "k": "A", "x": "Weakening of tip support attachments (medial crura, scroll, footplates) and thinning cartilage → drooping tip, longer-looking nose"}, {"n": 9, "s": "Crusting and dryness in the elderly nose are best managed with:", "o": ["Topical decongestants", "Saline and emollients", "Oral antihistamines", "Long-term antibiotics", "Topical anticholinergics"], "k": "B", "x": "Saline irrigation, humidification, emollients/ointments; avoid drying drugs"}, {"n": 10, "s": "The posterior nasal cavity drains lymph mainly to the:", "o": ["Submandibular nodes", "Parotid nodes", "Retropharyngeal nodes", "Submental nodes", "Posterior triangle nodes"], "k": "C", "x": "Posterior nasal cavity and sinuses → retropharyngeal and upper jugular nodes; anterior nose → submandibular"}, {"n": 11, "s": "In herpes zoster, vesicles on the nasal tip (Hutchinson sign) predict involvement of the:", "o": ["Facial nerve", "Maxillary nerve", "Cochlea", "Mandibular nerve", "Eye"], "k": "E", "x": "Nasociliary branch of V1 supplies the nasal tip and the eye → Hutchinson sign predicts ocular zoster"}, {"n": 12, "s": "Parasympathetic stimulation of the nasal mucosa causes:", "o": ["Vasoconstriction", "Mucosal dryness", "Reduced gland secretion", "Watery rhinorrhoea", "Ciliary paralysis"], "k": "D", "x": "Parasympathetic (GSPN/vidian) → glandular secretion and vasodilatation; sympathetic (deep petrosal) → vasoconstriction"}, {"n": 13, "s": "The posterior boundary of the frontal recess is formed by the:", "o": ["Bulla lamella", "Agger nasi cell", "Nasal septum", "Lamina papyracea", "Middle turbinate"], "k": "A", "x": "Frontal recess: anterior agger nasi, posterior bulla lamella (with AEA near skull base), lateral lamina papyracea, medial middle turbinate"}, {"n": 14, "s": "The adult maxillary sinus volume is about:", "o": ["2 mL", "15 mL", "50 mL", "100 mL", "5 mL"], "k": "B", "x": "About 15 mL in the adult"}, {"n": 15, "s": "The tooth root most often closest to the maxillary sinus floor is the:", "o": ["Central incisor", "Canine", "First molar", "Lateral incisor", "First premolar"], "k": "C", "x": "First molar (and second premolar) roots often project into the floor; source of odontogenic sinusitis and oroantral fistula"}, {"n": 16, "s": "Within the maxillary sinus, the infraorbital nerve runs in the:", "o": ["Medial wall", "Posterior wall", "Floor", "Anterior wall", "Roof"], "k": "E", "x": "Infraorbital canal in the roof (orbital floor); may be dehiscent"}, {"n": 17, "s": "The pterygopalatine fossa contains the:", "o": ["Maxillary nerve", "Mandibular nerve", "Facial nerve", "Lingual nerve", "Chorda tympani"], "k": "A", "x": "PPF contains V2, pterygopalatine ganglion, terminal maxillary artery; V3 lies in the infratemporal fossa"}, {"n": 18, "s": "By the nasopharynx, inspired air is humidified to about:", "o": ["30%", "50%", "70%", "95%", "60%"], "k": "D", "x": "~95% relative humidity and ~31–34 °C at the nasopharynx"}, {"n": 19, "s": "Very low nasal nitric oxide suggests:", "o": ["Allergic rhinitis", "Ciliary dyskinesia", "Nasal polyposis", "Septal deviation", "Acute viral rhinitis"], "k": "B", "x": "Nasal NO very low in PCD (screening test); also reduced in CF and polyps but less markedly"}, {"n": 20, "s": "Normal nasal ciliary beat frequency is about:", "o": ["1–2 Hz", "50 Hz", "10–15 Hz", "80–100 Hz", "0.1 Hz"], "k": "C", "x": "~10–15 Hz (9+2 axoneme)"}, {"n": 21, "s": "The nose contributes about what proportion of total airway resistance?", "o": ["Half", "A tenth", "A quarter", "Nine-tenths", "None"], "k": "A", "x": "About half of total airway resistance; mostly at the internal valve"}, {"n": 22, "s": "The habitual \"allergic salute\" produces a:", "o": ["Anterior septal perforation", "Saddle nose deformity", "Columellar scar", "Alar notching", "Transverse nasal crease"], "k": "E", "x": "Upward rubbing → transverse supratip crease; also allergic shiners, Dennie-Morgan lines"}, {"n": 23, "s": "The commonest perennial indoor allergen is:", "o": ["Grass pollen", "Tree pollen", "Ragweed", "House dust mite", "Outdoor mould spores"], "k": "D", "x": "House dust mite (Der p 1); pollens are seasonal"}, {"n": 24, "s": "After a subcutaneous immunotherapy injection, patients are observed for at least:", "o": ["10 minutes", "30 minutes", "4 hours", "24 hours", "2 hours"], "k": "B", "x": "At least 30 minutes; adrenaline available"}, {"n": 25, "s": "When both sides of the septum need cautery, safe practice is to:", "o": ["Cauterise both together", "Use deep electrocautery", "Treat one side at a time", "Avoid topical anaesthetic", "Cauterise the cartilage"], "k": "C", "x": "Opposing sites cauterised simultaneously risk septal perforation; wait 4–6 weeks for the other side"}, {"n": 26, "s": "In a coagulopathic patient needing nasal packing, the preferred material is:", "o": ["Absorbable packing", "Ribbon gauze", "Merocel tampon", "BIPP gauze", "Posterior Foley catheter"], "k": "A", "x": "Absorbable/dissolvable packs avoid mucosal trauma and rebleeding on removal"}, {"n": 27, "s": "Topical tranexamic acid in anterior epistaxis:", "o": ["Increases rebleeding", "Causes septal necrosis", "Is contraindicated in elderly", "Requires general anaesthesia", "Reduces need for packing"], "k": "E", "x": "Topical TXA speeds haemostasis and reduces need for packing and rebleeding"}, {"n": 28, "s": "Trephination of the frontal sinus is indicated for:", "o": ["Chronic frontal headache alone", "Refractory acute frontal sinusitis", "Small asymptomatic frontal osteoma", "Allergic rhinitis", "Frontal mucocele"], "k": "B", "x": "Acute frontal sinusitis not responding to IV antibiotics or with early complications → trephine drainage"}, {"n": 29, "s": "Chronic sinusitis, bronchiectasis and obstructive azoospermia with a normal sweat test suggest:", "o": ["Kartagener syndrome", "Cystic fibrosis", "Kallmann syndrome", "Young syndrome", "Primary immunodeficiency"], "k": "D", "x": "Young syndrome: obstructive azoospermia, sinusitis, bronchiectasis, normal sweat test and cilia structure"}, {"n": 30, "s": "Sinusitis in advanced HIV with a low CD4 count should prompt cover for:", "o": ["Group A streptococcus alone", "Moraxella only", "Pseudomonas and fungi", "Viruses only", "Haemophilus only"], "k": "C", "x": "Low CD4: Pseudomonas, atypical bacteria, fungi (Aspergillus), CMV — culture/biopsy"}, {"n": 31, "s": "Frontal sinusitis with seizures and raised intracranial pressure may indicate thrombosis of the:", "o": ["Cavernous sinus", "Ipsilateral sigmoid sinus", "Transverse sinus", "Internal jugular vein", "Superior sagittal sinus"], "k": "E", "x": "Frontal sinusitis → superior sagittal sinus thrombosis (diploic/emissary veins) → raised ICP, seizures; sigmoid thrombosis is otogenic"}, {"n": 32, "s": "Sinonasal glomangiopericytoma is typically:", "o": ["A low-grade tumour", "Highly metastatic", "A fungal lesion", "A congenital cyst", "An inflammatory polyp"], "k": "A", "x": "Perivascular myoid tumour; low-grade; local recurrence; rarely metastasises"}, {"n": 33, "s": "Squamous cell carcinoma of the nasal vestibule drains first to the:", "o": ["Retropharyngeal nodes", "Submandibular nodes", "Supraclavicular nodes", "Posterior triangle nodes", "Mediastinal nodes"], "k": "B", "x": "Submandibular (and facial) nodes, often bilateral; poorer prognosis than skin SCC of similar size"}, {"n": 34, "s": "Septal surgery in children should be:", "o": ["Avoided under all circumstances", "Radical submucous resection", "Delayed until age 30", "Conservative to protect growth", "Combined with turbinectomy"], "k": "D", "x": "Conservative septoplasty sparing the growth zones (sphenodorsal, sphenospinal); avoid radical resection"}, {"n": 35, "s": "The ideal columellar show on lateral view is:", "o": ["0 mm", "10 mm", "2–4 mm", "6–8 mm", "15 mm"], "k": "C", "x": "2–4 mm of columella below the alar rim on lateral view"}, {"n": 36, "s": "External nasal valve collapse is corrected with:", "o": ["Spreader grafts", "Septoplasty", "Turbinate reduction", "Dorsal onlay graft", "Alar batten grafts"], "k": "E", "x": "Alar batten grafts (or lateral crural strut grafts); spreaders treat the internal valve"}, {"n": 37, "s": "The primary olfactory cortex is the:", "o": ["Heschl's gyrus", "Piriform cortex", "Angular gyrus", "Insula", "Cingulate gyrus"], "k": "B", "x": "Piriform cortex
