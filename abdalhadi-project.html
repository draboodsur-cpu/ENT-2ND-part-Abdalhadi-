ressing/sutures (allow air escape), CXR for pneumothorax/pneumomediastinum, check tube position"}, {"n": 44, "s": "Decannulation fails because of a suprastomal granuloma. Treatment is:", "o": ["Endoscopic excision", "Laryngectomy", "Radiotherapy", "Antibiotics", "Permanent tracheostomy"], "k": "A", "x": "Suprastomal granuloma/collapse → endoscopic excision (microdebrider/laser) then retry decannulation"}, {"n": 45, "s": "A contraindication to non-surgical organ preservation for laryngeal cancer is:", "o": ["T2 tumour", "Age 55", "Small volume T3", "Current heavy smoker status", "Non-functional larynx"], "k": "E", "x": "Dysfunctional larynx (aspiration, tracheostomy dependence, cartilage destruction) → laryngectomy preferred"}, {"n": 46, "s": "A patient with palliative lung cancer has left fold paralysis, aspiration and a weak cough. The best option is:", "o": ["Wait 12 months", "Arytenoid adduction", "Injection laryngoplasty", "Thyroplasty type I", "Ansa cervicalis reinnervation"], "k": "C", "x": "Palliative: immediate injection laryngoplasty — rapid improvement in voice and aspiration"}, {"n": 47, "s": "After a house fire, a patient has facial burns, singed nasal hairs and hoarseness. Management is:", "o": ["Observe overnight", "Early intubation", "Nebulised saline", "Steroids", "Discharge"], "k": "B", "x": "Inhalation injury → early intubation before oedema progresses (hours)"}, {"n": 48, "s": "CT in glottic cancer is mainly used to assess:", "o": ["Mucosal extent", "Vocal fold mobility grade", "Mucosal wave", "Deep tissue invasion", "Voice quality"], "k": "D", "x": "CT: deep invasion (paraglottic/pre-epiglottic space, cartilage, extralaryngeal) — not mucosal detail"}, {"n": 49, "s": "Dysphagia months after laryngectomy from a neopharyngeal stricture is treated first with:", "o": ["Dilation", "Radiotherapy", "Total pharyngectomy", "PEG only", "Botulinum"], "k": "A", "x": "Neopharyngeal stricture → dilation (± repeated); flap reconstruction if refractory; exclude recurrence"}, {"n": 50, "s": "A 7-year-old has fever and firm, painful bilateral floor-of-mouth swelling 1 day after frenulectomy. Her tongue is elevated and she speaks with a breathy voice. An important component of the initial evaluation is:", "o": ["Fiberoptic laryngoscopy to evaluate the airway", "Fine-needle aspiration", "Ultrasound evaluation of the floor of mouth", "Both computed tomography and magnetic resonance imaging of the neck", "Panorex film"], "k": "A", "x": "(PP ENT-A Q35) — Floor-of-mouth cellulitis (Ludwig-type) with elevated tongue → assess airway first (flexible laryngoscopy in a safe setting)"}]}, {"c": 2, "t": "Session 6", "d": "Gap Closure", "q": [{"n": 1, "s": "ELS type I cordectomy removes the:", "o": ["Vocal ligament", "Epithelium only", "Vocalis muscle", "Whole fold", "Contralateral fold"], "k": "B", "x": "Type I subepithelial: epithelium only (via SLP) — for dysplasia/CIS; best voice"}, {"n": 2, "s": "ELS type II cordectomy is:", "o": ["Transmuscular", "Total", "Subepithelial", "Subligamental", "Extended"], "k": "D", "x": "Type II subligamental: epithelium + Reinke's space + vocal ligament"}, {"n": 3, "s": "ELS type III cordectomy is:", "o": ["Transmuscular", "Subligamental", "Subepithelial", "Extended to arytenoid", "Anterior commissure"], "k": "A", "x": "Type III transmuscular: through vocalis — T1a SCC"}, {"n": 4, "s": "Removal of the whole vocal fold down to the perichondrium is ELS:", "o": ["Type I", "Type II", "Type III", "Type VI", "Type IV"], "k": "E", "x": "Type IV total: whole fold to perichondrium, vocal process to anterior commissure"}, {"n": 5, "s": "An extended cordectomy including the arytenoid is ELS:", "o": ["Type Va", "Type Vc", "Type Vb", "Type Vd", "Type III"], "k": "C", "x": "Type V extended: Va contralateral fold incl. AC · Vb arytenoid · Vc subglottis · Vd ventricle"}, {"n": 6, "s": "ELS type VI cordectomy targets the:", "o": ["Posterior commissure", "Anterior commissure", "Ventricle", "Subglottis", "Arytenoid"], "k": "B", "x": "Type VI: anterior commissure ± anterior parts of both folds"}, {"n": 7, "s": "The main risk of supraglottic jet ventilation is:", "o": ["Airway fire", "Bradycardia", "Hypothermia", "Hypercarbia only", "Barotrauma"], "k": "E", "x": "Barotrauma (pneumothorax, pneumomediastinum, surgical emphysema) if outflow is obstructed; also hypercarbia, gastric distension"}, {"n": 8, "s": "Jet ventilation is unsafe when:", "o": ["Exhalation is obstructed", "Patient is paralysed", "Larynx is normal", "Laser surgery is not planned", "Oxygen is used"], "k": "A", "x": "Jet relies on passive exhalation through an open airway — critical obstruction risks barotrauma"}, {"n": 9, "s": "THRIVE delivers apnoeic oxygenation via:", "o": ["Jet catheter", "Face mask", "Laryngeal mask", "High-flow nasal cannula", "Cuffed endotracheal tube"], "k": "D", "x": "Transnasal Humidified Rapid-Insufflation Ventilatory Exchange: high-flow nasal O2 (up to 70 L/min) → apnoeic oxygenation, some CO2 clearance; tubeless laryngeal surgery"}, {"n": 10, "s": "A contraindication to percutaneous tracheostomy is:", "o": ["Adult ICU patient", "Normal coagulation status", "Unpalpable landmarks", "Ventilated patient", "Bedside setting"], "k": "C", "x": "PDT contraindications: unidentifiable landmarks, children, uncorrected coagulopathy, emergency airway, previous neck surgery/large goitre, unstable C-spine"}, {"n": 11, "s": "An advantage of percutaneous over surgical tracheostomy is:", "o": ["Bedside insertion", "Better in children", "Safer in emergencies", "Easier with goitre", "Better for obese necks"], "k": "A", "x": "Bedside in ICU, smaller wound, fewer infections, lower cost; similar overall safety in selected adults"}, {"n": 12, "s": "A fenestrated tracheostomy tube mainly:", "o": ["Prevents aspiration", "Allows ventilation", "Reduces granulation", "Prevents emphysema", "Allows phonation"], "k": "E", "x": "Fenestration lets air pass up to the larynx (phonation, weaning); risks granulation/emphysema if misaligned"}, {"n": 13, "s": "The inner cannula of a tracheostomy tube allows:", "o": ["Cuff inflation and deflation", "Cleaning without tube change", "Phonation alone", "Ventilation weaning", "Decannulation"], "k": "B", "x": "Inner cannula: removed for cleaning or if blocked — prevents fatal obstruction"}, {"n": 14, "s": "The recommended tracheostomy cuff pressure is:", "o": ["5–10 cmH2O", "40–50 cmH2O", "20–30 cmH2O", "60 cmH2O", "80 cmH2O"], "k": "C", "x": "20–30 cmH2O (below capillary perfusion ~30) — prevents ischaemia, stenosis, TOF"}, {"n": 15, "s": "Stomal stenosis after laryngectomy is managed by:", "o": ["Radiotherapy", "Antibiotics", "Steroids", "Stomaplasty", "Observation"], "k": "D", "x": "Stomaplasty (V-Y/Z-plasty) or stoma button/laryngectomy tube"}, {"n": 16, "s": "A submucosal aryepiglottic mass in a woman that enhances avidly on MRI should not be biopsied, as it may be a:", "o": ["Cyst", "Lipoma", "Chondroma", "Low-grade lymphoma", "Paraganglioma"], "k": "E", "x": "Laryngeal paraganglioma: supraglottic (aryepiglottic), female, avid enhancement; biopsy → bleeding; excise (lateral pharyngotomy/transoral)"}, {"n": 17, "s": "The commonest laryngeal neuroendocrine tumour is:", "o": ["Atypical carcinoid", "Typical carcinoid", "Small cell carcinoma", "Paraganglioma", "Large cell carcinoma"], "k": "A", "x": "Atypical carcinoid (moderately differentiated): commonest; surgery + elective neck; poor RT/chemo response"}, {"n": 18, "s": "Laryngeal lymphoma is treated primarily with:", "o": ["Laryngectomy", "Transoral laser excision", "Chemoradiotherapy", "Observation", "Antibiotics"], "k": "C", "x": "Extranodal NHL (often MALT, supraglottic submucosal) → chemotherapy ± RT; biopsy deep"}, {"n": 19, "s": "A posterior vocal fold lesion with overlying pseudoepitheliomatous hyperplasia is classically a:", "o": ["Papilloma", "Granular cell tumour", "Lipoma", "Chondroma", "Capillary haemangioma"], "k": "B", "x": "Granular cell tumour (S100+, Schwann origin) — overlying PEH mimics SCC; posterior fold; conservative excision"}, {"n": 20, "s": "Supraglottic scarring with ocular symblepharon suggests:", "o": ["Pemphigus vulgaris variant", "Sarcoidosis", "Amyloidosis", "Mucous membrane pemphigoid", "GPA"], "k": "D", "x": "Mucous membrane pemphigoid: subepithelial blistering, scarring (eyes, larynx); linear IgG/C3 at BMZ"}, {"n": 21, "s": "Pemphigus vulgaris is characterised by antibodies to:", "o": ["Desmoglein 3", "BP180", "Type VII collagen", "Acetylcholine receptor", "Thyroid peroxidase"], "k": "A", "x": "Pemphigus vulgaris: anti-desmoglein 3 (intraepithelial acantholysis, Nikolsky+); oral lesions first"}, {"n": 22, "s": "Oral and genital ulcers with laryngeal ulceration and a positive pathergy test suggest:", "o": ["Crohn's", "Syphilis", "Herpes", "Pemphigus", "Behçet's"], "k": "E", "x": "Behçet's: recurrent oral/genital ulcers, uveitis, pathergy; laryngeal ulcers/stenosis"}, {"n": 23, "s": "Laryngeal histoplasmosis may mimic:", "o": ["Nodules", "Polyps", "Carcinoma", "Reinke's oedema", "Laryngocele"], "k": "C", "x": "Histoplasmosis/blastomycosis: ulcerated masses with PEH → mimic carcinoma; itraconazole/amphotericin"}, {"n": 24, "s": "First-line management of vocal fold scar is:", "o": ["Laser stripping", "Voice therapy", "Radiotherapy", "Systemic steroids", "Thyroplasty"], "k": "B", "x": "Voice therapy first; surgery (fat/fascia, steroid injection, microflap) for persistent disability"}, {"n": 25, "s": "A Ford type III sulcus is a:", "o": ["Physiological sulcus", "Superficial vergeture", "Vascular ectasia streak", "Cystic lesion of epithelium", "Pocket into the ligament"], "k": "E", "x": "Ford: I physiological · II vergeture (epithelium adherent to ligament, linear) · III pocket/sulcus vocalis into ligament"}, {"n": 26, "s": "The occupational group with the highest prevalence of voice disorders is:", "o": ["Teachers", "Lawyers", "Pilots", "Surgeons", "Farmers"], "k": "A", "x": "Teachers (~20–50% lifetime prevalence)"}, {"n": 27, "s": "Intermittent solid-food impaction from a lower oesophageal mucosal ring is due to a:", "o": ["Achalasia", "Zenker's", "Web", "Schatzki ring", "Systemic scleroderma"], "k": "D", "x": "Schatzki ring: B-ring at squamocolumnar junction; \"steakhouse syndrome\"; dilation"}, {"n": 28, "s": "Odynophagia with white oesophageal plaques in an immunosuppressed patient is treated with:", "o": ["Nystatin rinse only", "PPI", "Fluconazole", "Antibiotics", "Steroids"], "k": "C", "x": "Oesophageal candidiasis needs systemic fluconazole (topical nystatin insufficient)"}, {"n": 29, "s": "Pill oesophagitis is prevented by taking tablets:", "o": ["Lying down after", "Upright with water", "Crushed into honey at night", "At bedtime", "Dry swallowed"], "k": "B", "x": "Upright with a full glass of water, stay upright ≥30 min (doxycycline, bisphosphonates, NSAIDs, KCl)"}, {"n": 30, "s": "Scleroderma oesophagus shows:", "o": ["Tight LES", "Bird-beak", "High-amplitude nutcracker waves", "Normal motility", "Absent distal peristalsis"], "k": "E", "x": "Smooth-muscle fibrosis: absent distal peristalsis, hypotensive LES → severe reflux, strictures"}, {"n": 31, "s": "An elderly patient with ptosis and dysphagia from oculopharyngeal muscular dystrophy has cricopharyngeal dysfunction. Treatment is:", "o": ["Cricopharyngeal myotomy", "Gastrostomy feeding only", "Radiotherapy", "Thyroplasty", "Steroids"], "k": "A", "x": "OPMD (PABPN1, French-Canadian ancestry): CP dysfunction → myotomy (± dilation)"}, {"n": 32, "s": "Central sleep apnoea from high-dose opioids is managed first by:", "o": ["UPPP", "Tonsillectomy", "Reducing opioids", "MMA", "Mandibular oral appliance"], "k": "C", "x": "Opioid-induced central apnoea: reduce/rotate opioids; ASV/bilevel if persistent"}, {"n": 33, "s": "Narcolepsy on the multiple sleep latency test shows:", "o": ["AHI ≥5", "Long latency over 20 min", "No REM sleep", "Short latency, 2 SOREMPs", "Normal study"], "k": "D", "x": "MSLT mean sleep latency ≤8 min with ≥2 sleep-onset REM periods; cataplexy, low CSF hypocretin (type 1)"}, {"n": 34, "s": "Obesity hypoventilation syndrome requires an awake PaCO2 above:", "o": ["30 mmHg", "45 mmHg", "60 mmHg", "80 mmHg", "25 mmHg"], "k": "B", "x": "OHS: BMI ≥30 + awake PaCO2 >45 mmHg, other causes excluded → NIV/CPAP, weight loss"}, {"n": 35, "s": "Upper airway resistance syndrome shows:", "o": ["AHI ≥30", "Central apnoeas", "Hypoxaemia", "Cheyne-Stokes breathing", "RERAs with AHI <5"], "k": "E", "x": "UARS: respiratory effort-related arousals, fragmented sleep, AHI <5 — sleepiness"}, {"n": 36, "s": "Home sleep apnoea testing is unsuitable in:", "o": ["Significant heart failure", "Uncomplicated suspected OSA", "High pretest probability", "Snoring adults", "Young healthy adults"], "k": "A", "x": "HSAT unsuitable with significant cardiopulmonary disease, neuromuscular disease, suspected central apnoea or other sleep disorders"}, {"n": 37, "s": "Laryngeal ultrasound is useful to assess:", "o": ["Mucosal wave", "Leukoplakia", "Vocal fold mobility", "Microscopic dysplasia", "Papilloma"], "k": "C", "x": "Transcutaneous laryngeal ultrasound assesses fold mobility (useful in children, post-thyroidectomy screening)"}, {"n": 38, "s": "Oesophageal speech is produced by:", "o": ["Valve prosthesis", "External vibrator", "Tracheal air through puncture", "Injected oesophageal air", "Buccal whisper"], "k": "D", "x": "Air injected/swallowed into oesophagus, released to vibrate the PE segment; ~30–50% achieve fluent speech"}, {"n": 39, "s": "Tubeless spontaneous ventilation is preferred for:", "o": ["Laser debulking of large tumours", "Dynamic airway assessment", "Long cases", "Obese adults", "Trauma"], "k": "B", "x": "Spontaneous ventilation shows dynamic collapse (laryngomalacia, tracheomalacia) — paediatric airway endoscopy"}, {"n": 40, "s": "Regarding laryngeal chondroma and low-grade chondrosarcoma:", "o": ["Easy to separate on biopsy", "CT reliably distinguishes them", "Always malignant", "Always benign", "Hard to separate on biopsy"], "k": "E", "x": "Overlapping histology; sampling error — imaging + clinical course; conservative excision"}, {"n": 41, "s": "A surgical option for vocal fold scar is:", "o": ["Autologous fat implantation", "Laryngectomy", "Radiotherapy", "Total cordectomy of the fold", "Teflon"], "k": "A", "x": "Autologous fat (or fascia) implantation into the SLP; also steroid/hyaluronate injections, microflap"}, {"n": 42, "s": "The best immediate communication method after laryngectomy is:", "o": ["Oesophageal speech", "TEP valve", "Electrolarynx", "Sign language", "Normal speech"], "k": "C", "x": "Electrolarynx immediately (neck or intraoral) until TEP/oesophageal speech established"}, {"n": 43, "s": "Botulinum toxin to the cricopharyngeus is:", "o": ["Permanent", "Temporary or diagnostic", "Contraindicated", "Curative in every patient", "Radiological"], "k": "B", "x": "Effect ~3–6 months; predicts response to myotomy"}, {"n": 44, "s": "Narrow-band imaging detects dysplasia through:", "o": ["Mucosal wave", "Temperature", "Autofluorescence signal", "Ultrasound", "Vascular patterns"], "k": "E", "x": "NBI (415/540 nm) highlights intrapapillary capillary loops → dysplasia/early cancer"}, {"n": 45, "s": "Office-based KTP laser under local anaesthesia suits:", "o": ["Papilloma and dysplasia", "Laryngectomy", "Thyroplasty", "Arytenoidectomy", "Cricotracheal resection"], "k": "A", "x": "Angiolytic KTP/PDL in clinic for RRP, dysplasia, leukoplakia, varices"}, {"n": 46, "s": "Manual supraglottic jet ventilation relies on:", "o": ["Bernoulli fold closure", "Doppler", "Piezoelectric", "Venturi entrainment", "Coanda only"], "k": "D", "x": "Venturi: jet entrains room air, increasing delivered volume (and lowering FiO2)"}, {"n": 47, "s": "The optimal suspension laryngoscopy position (Boyce-Jackson) is:", "o": ["Neck extended, head flexed", "Neck flexed, head extended", "Both extended", "Both flexed", "Lateral"], "k": "B", "x": "\"Sniffing position\": neck flexed on chest, head extended at atlanto-occipital joint"}, {"n": 48, "s": "The commonest complication of suspension laryngoscopy is:", "o": ["Pneumothorax", "Stroke", "Dental injury", "Blindness", "Cervical spine fracture"], "k": "C", "x": "Dental injury (protect with guard); also tongue/lingual nerve paraesthesia, dysgeusia, pharyngeal injury"}, {"n": 49, "s": "Typical voice rest after microlaryngeal surgery is:", "o": ["1 hour", "6 weeks", "3 months", "3–7 days", "None"], "k": "D", "x": "Absolute voice rest ~3–7 days, then graded return (evidence limited)"}, {"n": 50, "s": "Squamous epithelium of the upper respiratory tract abruptly changes to a respiratory type at the junction of the:", "o": ["Hypopharynx and larynx", "Epiglottis and ventricular band", "False and true cords", "Glottic and subglottic larynx", "Trachea and main-stem bronchus"], "k": "D", "x": "(PP ENT-B Q12) ⚠ — True fold is squamous; respiratory epithelium resumes below at the glottic–subglottic junction (and above at the false cords) — choose D"}]}, {"c": 3, "t": "Session 1", "d": "Paediatric Airway", "q": [{"n": 1, "s": "The commonest cause of stridor in infants is:", "o": ["Vocal fold paralysis", "Subglottic stenosis", "Laryngomalacia", "Haemangioma", "Laryngeal cleft"], "k": "C", "x": "Laryngomalacia ~60% of congenital stridor; inspiratory, worse feeding/supine/crying"}, {"n": 2, "s": "Laryngomalacia symptoms usually:", "o": ["Present at birth and worsen for years", "Need surgery in most", "Are worse prone", "Improve when feeding", "Resolve by 12–24 months"], "k": "E", "x": "Onset weeks after birth, peaks 4–8 months, resolves by 12–24 months in most"}, {"n": 3, "s": "Supraglottoplasty is indicated for laryngomalacia with:", "o": ["Failure to thrive", "Mild stridor only", "Noisy breathing when crying", "Normal feeding", "Parental anxiety"], "k": "A", "x": "Surgery (~10–20%): failure to thrive, feeding difficulty with aspiration, apnoea, cyanosis, pulmonary hypertension/cor pulmonale"}, {"n": 4, "s": "An endoscopic feature of laryngomalacia is:", "o": ["Bowed atrophic vocal folds", "Subglottic narrowing", "Vocal fold nodules", "Short aryepiglottic folds", "Tracheal rings"], "k": "D", "x": "Short AE folds, omega-shaped epiglottis, arytenoid mucosal prolapse"}, {"n": 5, "s": "The second commonest cause of neonatal stridor is:", "o": ["Laryngeal web", "Vocal fold paralysis", "Laryngeal cleft", "Supraglottic saccular cyst", "Tracheomalacia"], "k": "B", "x": "Vocal fold paralysis ~10–20% of congenital laryngeal anomalies"}, {"n": 6, "s": "A neonate with bilateral vocal fold paralysis needs:", "o": ["Reassurance", "Barium swallow", "Echocardiogram only", "Thyroid function", "MRI brain"], "k": "E", "x": "Bilateral palsy → MRI brain/brainstem (Arnold-Chiari with hydrocephalus); decompression may restore movement"}, {"n": 7, "s": "Left vocal fold paralysis in a neonate after cardiac surgery most often follows:", "o": ["PDA ligation", "ASD closure", "Tonsillectomy", "Circumcision", "Lumbar puncture"], "k": "A", "x": "Left RLN loops near the ductus → PDA ligation/arch surgery"}, {"n": 8, "s": "A 10-week-old with biphasic stridor and a beard-distribution skin haemangioma likely has:", "o": ["Laryngomalacia", "Croup", "Subglottic haemangioma", "Type III laryngeal cleft", "Foreign body"], "k": "C", "x": "Subglottic haemangioma: biphasic stridor at 6–12 weeks; ~50% have cutaneous haemangioma (beard/PHACE)"}, {"n": 9, "s": "First-line treatment of subglottic haemangioma is:", "o": ["Laser excision", "Steroids alone", "Tracheostomy", "Propranolol", "Radiotherapy"], "k": "D", "x": "Propranolol 1–3 mg/kg/day (monitor hypoglycaemia, bradycardia, hypotension) — replaced steroids/laser/tracheostomy"}, {"n": 10, "s": "The commonest cause of acquired subglottic stenosis in children is:", "o": ["GPA", "Endotracheal intubation", "Croup", "Laryngopharyngeal reflux disease", "Burns"], "k": "B", "x": "Prolonged/traumatic intubation (oversized tube, movement, reflux, infection)"}, {"n": 11, "s": "Grade III paediatric subglottic stenosis is commonly reconstructed with:", "o": ["Repeated laser incisions only", "Dilation only", "Tracheostomy alone", "Steroid injection", "Costal cartilage LTR"], "k": "E", "x": "Grade III: laryngotracheal reconstruction with costal cartilage grafts (anterior ± posterior), single- or double-stage"}, {"n": 12, "s": "Cricotracheal resection is best suited to:", "o": ["Severe stenosis below the cords", "Grade I stenosis only", "Anterior glottic web needing keel", "Laryngomalacia", "Croup"], "k": "A", "x": "CTR for severe (III–IV) subglottic stenosis with a healthy margin below the cords (≥3–4 mm)"}, {"n": 13, "s": "A type I laryngeal cleft extends:", "o": ["Into the trachea", "Below the cricoid lamina", "Above the vocal folds", "Into the thorax", "Through the cricoid"], "k": "C", "x": "Benjamin-Inglis: I interarytenoid, above folds · II into cricoid · III through cricoid into cervical trachea · IV into thoracic trachea"}, {"n": 14, "s": "Laryngeal cleft is associated with:", "o": ["Isolated Down syndrome", "Treacher Collins", "Pierre Robin", "Kallmann", "Opitz G/BBB syndrome"], "k": "E", "x": "Opitz G/BBB, Pallister-Hall, CHARGE, VACTERL; also TOF association"}, {"n": 15, "s": "A congenital saccular cyst causing stridor is treated by:", "o": ["Radiotherapy", "Endoscopic marsupialisation", "Observation", "Tracheostomy as sole treatment", "Steroids"], "k": "B", "x": "Endoscopic marsupialisation/deroofing (cold steel or CO2 laser); recurrence → excision"}, {"n": 16, "s": "Tracheomalacia is most associated with:", "o": ["Choanal atresia", "Laryngomalacia only", "Cleft lip", "Oesophageal atresia", "Down syndrome"], "k": "D", "x": "Oesophageal atresia ± TOF (~75% have tracheomalacia); expiratory stridor, \"barking\" cough"}, {"n": 17, "s": "Severe innominate artery compression of the trachea is treated by:", "o": ["Aortopexy", "Tracheostomy", "Steroids", "Observation", "Stenting"], "k": "A", "x": "Aortopexy (suspends the aorta/innominate to the sternum) for apnoea/severe symptoms"}, {"n": 18, "s": "A complete vascular ring causing a posterior oesophageal indentation is a:", "o": ["Innominate compression", "Aberrant left subclavian", "Laryngomalacia", "Pulmonary sling", "Double aortic arch"], "k": "E", "x": "Double aortic arch: commonest complete ring; bilateral posterior oesophageal indentation; CT/MR angiography → divide smaller arch"}, {"n": 19, "s": "A pulmonary artery sling is associated with:", "o": ["Laryngomalacia", "Bilateral choanal atresia", "Complete tracheal rings", "Subglottic cyst", "Vallecular cyst"], "k": "C", "x": "Pulmonary artery sling (left PA from right PA) — ~50% have complete tracheal rings (\"ring-sling\")"}, {"n": 20, "s": "Long-segment complete tracheal rings are treated by:", "o": ["Dilation", "Slide tracheoplasty", "Laser", "Steroids", "Observation until puberty"], "k": "B", "x": "Slide tracheoplasty (on bypass) — long-segment complete rings"}, {"n": 21, "s": "The commonest type of oesophageal atresia is:", "o": ["Isolated atresia", "H-type fistula", "Proximal fistula only", "Distal fistula type", "Double fistula"], "k": "D", "x": "Type C: proximal atresia + distal TOF (~85%)"}, {"n": 22, "s": "Recurrent pneumonia and coughing with feeds in a child with a patent oesophagus suggest:", "o": ["Laryngomalacia", "Croup", "GORD", "Asthma", "H-type fistula"], "k": "E", "x": "H-type TOF (no atresia): choking with feeds, recurrent pneumonia → prone contrast oesophagram, bronchoscopy"}, {"n": 23, "s": "Croup is commonly caused by:", "o": ["Parainfluenza virus", "Group A strep", "H. influenzae", "S. aureus", "Adenovirus as sole cause"], "k": "A", "x": "Parainfluenza type 1 (most), RSV, influenza; 6 months–3 years"}, {"n": 24, "s": "The standard steroid dose for croup is dexamethasone:", "o": ["2 mg/kg", "0.15–0.6 mg/kg", "5 mg/kg", "10 mg/kg", "0.01–0.02 mg/kg"], "k": "B", "x": "Dexamethasone 0.15–0.6 mg/kg single dose; nebulised adrenaline for moderate–severe"}, {"n": 25, "s": "Recurrent croup in an infant under 6 months warrants:", "o": ["More steroids", "Antibiotics", "Allergy skin prick testing", "Observation", "Airway endoscopy"], "k": "E", "x": "Croup <6 months, recurrent, prolonged or atypical → MLB (SGS, haemangioma)"}, {"n": 26, "s": "A toxic child with croup-like stridor, thick tracheal secretions and no response to adrenaline likely has:", "o": ["Viral croup", "Epiglottitis", "Bacterial tracheitis", "Inhaled foreign body", "Laryngomalacia"], "k": "C", "x": "Bacterial tracheitis (S. aureus): toxic, membranous tracheal secretions, poor adrenaline response → bronchoscopy, intubation, IV antibiotics"}, {"n": 27, "s": "In a child, retropharyngeal abscess is suggested by prevertebral soft tissue at C2 wider than:", "o": ["1 mm", "2 mm", "3 mm", "7 mm", "25 mm"], "k": "D", "x": ">7 mm at C2 (or >14 mm at C6 in children) → CT; transoral drainage"}, {"n": 28, "s": "An aspirated peanut most often lodges in the:", "o": ["Right main bronchus", "Left main bronchus", "Larynx", "Trachea", "Left lower lobe bronchus"], "k": "A", "x": "Right main bronchus (wider, more vertical) — less marked in young children"}, {"n": 29, "s": "Airway foreign bodies in children are best removed by:", "o": ["Flexible bronchoscopy", "Heimlich at clinic", "Bronchoalveolar lavage", "Chest physiotherapy", "Rigid bronchoscopy"], "k": "E", "x": "Rigid ventilating bronchoscopy with optical forceps under GA"}, {"n": 30, "s": "A suspected bronchial foreign body in an uncooperative toddler is best imaged with:", "o": ["Single inspiratory film only", "Lateral decubitus films", "Barium swallow", "Ultrasound", "MRI"], "k": "B", "x": "Decubitus films (dependent side fails to deflate) or fluoroscopy; inspiratory/expiratory in older children"}, {"n": 31, "s": "A coin seen face-on on an AP chest film is in the:", "o": ["Oesophagus", "Trachea", "Right bronchus", "Larynx", "Pleura"], "k": "A", "x": "Oesophageal coin appears face-on (round) on AP; tracheal coin edge-on (sagittal cartilage gap)"}, {"n": 32, "s": "A child has swallowed multiple magnets. Management is:", "o": ["Observation", "Laxatives", "Wait for natural passage out", "Urgent endoscopic removal", "Repeat X-ray in a week"], "k": "D", "x": "Multiple magnets (or magnet + metal) attract across bowel walls → necrosis/fistula → urgent removal"}, {"n": 33, "s": "Biphasic stridor localises the obstruction to the:", "o": ["Supraglottis", "Nose", "Bronchi", "Distal intrathoracic trachea", "Glottis or subglottis"], "k": "E", "x": "Biphasic = glottis/subglottis/extrathoracic trachea; inspiratory = supraglottis; expiratory = intrathoracic airway"}, {"n": 34, "s": "Laryngomalacia is best diagnosed by:", "o": ["CT neck", "Awake flexible laryngoscopy", "MRI", "Plain X-ray", "Rigid bronchoscopy under paralysis"], "k": "B", "x": "Awake flexible laryngoscopy shows dynamic collapse; MLB if atypical/severe (synchronous lesions ~15–20%)"}, {"n": 35, "s": "Infants are preferential nasal breathers until about:", "o": ["1 week", "12–18 months", "4–6 months", "2 years", "5 years"], "k": "C", "x": "Preferential nasal breathing to ~4–6 months (why bilateral choanal atresia is life-threatening)"}, {"n": 36, "s": "To reduce post-extubation stridor in a high-risk child, give:", "o": ["Preceding dexamethasone", "Antibiotics", "Heliox only", "Racemic adrenaline before", "Larger tube"], "k": "A", "x": "Dexamethasone before extubation reduces post-extubation stridor in high-risk children"}, {"n": 37, "s": "Paediatric tracheostomy differs from adult by using a:", "o": ["Bjork flap", "Horizontal tracheal window", "Cricoid incision", "Cuffed tube always", "Vertical tracheal incision"], "k": "E", "x": "Children: vertical tracheal incision (rings 2–4), stay (maturation) sutures, no Bjork flap, uncuffed tube usually"}, {"n": 38, "s": "A Montgomery T-tube is used to:", "o": ["Restore voice after laryngectomy", "Stent tracheal stenosis", "Ventilate in ICU", "Drain abscess", "Feed"], "k": "B", "x": "Silicone T-tube: stents subglottic/tracheal stenosis; side limb through stoma; allows phonation when capped"}, {"n": 39, "s": "The McCaffrey classification of laryngotracheal stenosis is based on:", "o": ["Lumen percentage", "Patient age at onset", "Cause", "Subsite and length", "Symptoms"], "k": "D", "x": "McCaffrey stages I–IV by subsite (subglottic, tracheal, glottic) and length (≤1 cm vs >1 cm)"}, {"n": 40, "s": "Adult excessive dynamic airway collapse is defined by expiratory narrowing greater than:", "o": ["50%", "10%", "25%", "90%", "5%"], "k": "A", "x": "EDAC/tracheobronchomalacia: >50% expiratory narrowing (dynamic CT, bronchoscopy) → CPAP, stent trial, tracheobronchoplasty"}, {"n": 41, "s": "Laryngeal transplantation requires:", "o": ["No follow-up", "Short steroid course", "Lifelong immunosuppression", "Radiotherapy", "Active cancer as main indication"], "k": "C", "x": "Laryngeal allotransplant (Strome 1998): lifelong immunosuppression; non-oncological candidates (trauma, stenosis)"}, {"n": 42, "s": "Which of the following is frequently associated with laryngomalacia?", "o": ["Nasal septal deviation", "Developmental delay", "Gastroesophageal reflux disease", "Auricular deformities", "Disorders of the pituitary gland"], "k": "C", "x": "(PP ENT-A Q84) — GORD/LPR in ~65–100% of laryngomalacia; antireflux therapy part of management"}, {"n": 43, "s": "Which congenital anomaly has been associated with sudden infant death?", "o": ["Thyroglossal duct cyst (in vallecula)", "Laryngeal cleft", "Laryngomalacia", "Bilateral vocal cord paralysis", "Unilateral vocal cord paralysis"], "k": "A", "x": "(PP ENT-A Q85) ⚠ — Vallecular (thyroglossal) cyst can cause sudden obstruction in infants; most defensible key"}, {"n": 44, "s": "Unilateral vocal cord paralysis in children with a weak, breathy, hoarse voice is initially managed by:", "o": ["Gelfoam injection", "Fat injection", "Isshiki thyroplasty", "Speech therapy"], "k": "D", "x": "(PP ENT-A Q86) — Children compensate; speech therapy first; injection/thyroplasty rarely, later"}, {"n": 45, "s": "What is the classic presentation of an infant with tracheal stenosis?", "o": ["Inspiratory stridor", "Expiratory stridor", "Cough and feeding difficulty", "Biphasic stridor with a marked expiratory component", "Hoarseness"], "k": "D", "x": "(PP ENT-A Q87) — Fixed intrathoracic/extrathoracic stenosis → biphasic, marked expiratory component"}, {"n": 46, "s": "An 18-month-old refusing food and drink for 14 hours has a small metallic disk in the mid-oesophagus on chest radiograph, suspicious for a battery. The best plan is:", "o": ["Observation with recheck in the morning after another chest radiograph", "Removal by endoscopy in the morning as an elective procedure", "Immediate removal in the operating room that evening by rigid endoscopy", "Attempted removal with a transoral Foley catheter placed distal to the disk", "Immediate fiberoptic esophagoscopy with the patient under sedation"], "k": "C", "x": "(PP ENT-A Q88) — Oesophageal button battery = emergency: rigid oesophagoscopy immediately (necrosis within ~2 h); honey/sucralfate en route if >1 yr and ingestion <12 h"}, {"n": 47, "s": "At approximately what pH is the threshold for alkalinity severe enough to cause rapid mucosal necrosis?", "o": ["13", "10", "12.5", "13.5"], "k": "C", "x": "(PP ENT-A Q89) ⚠ — pH ≥12.5 causes rapid liquefactive necrosis (old-bank key)"}, {"n": 48, "s": "Regarding bronchial foreign bodies, which is true?", "o": ["Bronchial foreign bodies are more prevalent than esophageal foreign bodies", "The three phases of foreign body aspiration are the initial, asymptomatic, and complication phases", "Radiographs are essential in ruling out a bronchial foreign body", "Hyperinflation of the affected lung from a check-valve is a late finding", "Optical forceps aid the endoscopist by increasing the ventilatory capacity of the bronchoscope"], "k": "B", "x": "(PP ENT-A Q90) — Initial (choking), asymptomatic interval, complications (pneumonia, atelectasis); oesophageal FB commoner; normal CXR doesn't exclude; hyperinflation early"}, {"n": 49, "s": "What is the narrowest portion of the upper respiratory tract in a child?", "o": ["Glottis", "Subglottis", "Supraglottis", "Trachea", "Oropharynx"], "k": "B", "x": "(PP ENT-A Q91) — Subglottis (cricoid) is narrowest in children"}, {"n": 50, "s": "If supraglottitis is suspected, what should be the first course of action?", "o": ["Establish IV access", "Perform nasopharyngolaryngoscopy to confirm diagnosis", "Culture the surface of the epiglottis", "Establish airway through endotracheal or nasotracheal intubation", "Perform emergency tracheotomy"], "k": "D", "x": "(PP ENT-A Q92) — Secure airway first in theatre (gas induction, ENT ready for tracheostomy); avoid IV access/examination that upsets the child"}]}, {"c": 3, "t": "Session 2", "d": "Paediatric OSA, Adenotonsillar Disease, Cleft & VPI", "q": [{"n": 1, "s": "The commonest cause of OSA in children is:", "o": ["Adenotonsillar hypertrophy", "Obesity without enlarged tonsils", "Craniofacial anomaly", "Neuromuscular disease", "Laryngomalacia"], "k": "A", "x": "Adenotonsillar hypertrophy, peak 2–8 years; obesity increasingly important"}, {"n": 2, "s": "Severe paediatric OSA is defined by an obstructive AHI of at least:", "o": ["1", "5", "10", "30", "50"], "k": "C", "x": "Paediatric obstructive AHI: ≥1 abnormal · 1–5 mild · 5–10 moderate · ≥10 severe (adult cut-offs don't apply)"}, {"n": 3, "s": "A recognised consequence of untreated paediatric OSA is:", "o": ["Hearing loss", "Anosmia", "Recurrent otitis externa", "Epistaxis", "Behavioural problems"], "k": "E", "x": "Behavioural/attention problems (ADHD-like), poor school performance, enuresis, failure to thrive; severe → pulmonary hypertension"}, {"n": 4, "s": "Brodsky grade 4 tonsils occupy:", "o": ["<25%", "25–50%", "50–75%", ">75%", "0%"], "k": "D", "x": "Brodsky: 0 in fossa · 1 <25% · 2 25–50% · 3 50–75% · 4 >75% of oropharyngeal width"}, {"n": 5, "s": "The Paradise criteria for tonsillectomy include:", "o": ["3 episodes in 1 year", "7 episodes in 1 year", "2 episodes in 2 years", "1 severe episode", "4 episodes in 5 years"], "k": "B", "x": "≥7 episodes in 1 year, ≥5/year for 2 years, or ≥3/year for 3 years (documented)"}, {"n": 6, "s": "Secondary post-tonsillectomy haemorrhage typically occurs at:", "o": ["Days 5–10", "Within 6 hours", "Day 1", "Week 6", "Month 3"], "k": "A", "x": "Primary <24 h (surgical); secondary typically days 5–10 (eschar separation ± infection); overall ~2–5%"}, {"n": 7, "s": "A child with significant secondary tonsillar bleeding should be:", "o": ["Sent home", "Given oral antibiotics only", "Observed at home", "Given aspirin", "Admitted with IV access"], "k": "E", "x": "Admit all with bleeding, IV access, bloods/crossmatch, IV antibiotics; theatre if active/significant; never dismiss a \"small\" sentinel bleed"}, {"n": 8, "s": "Overnight admission after tonsillectomy is advised for:", "o": ["All adults", "Recurrent tonsillitis at age 10", "Children under three", "Teenagers", "Day-case only"], "k": "C", "x": "Admit: age <3 years, severe OSA, comorbidity (cardiac, neuromuscular, craniofacial), distance from hospital"}, {"n": 9, "s": "A risk factor for persistent OSA after adenotonsillectomy is:", "o": ["Age 5", "Mild OSA", "Normal weight", "Obesity", "Female sex"], "k": "D", "x": "Obesity, severe OSA, Down syndrome, craniofacial/neuromuscular disease → post-op PSG, DISE, CPAP"}, {"n": 10, "s": "OSA in Down syndrome is typically:", "o": ["Multilevel", "Purely tonsillar", "Nasal only", "Laryngeal only", "Central only"], "k": "A", "x": "Multilevel: macroglossia, hypotonia, midface hypoplasia, lingual tonsils, small airway"}, {"n": 11, "s": "Torticollis after adenotonsillectomy without fever or neck swelling suggests:", "o": ["Retropharyngeal abscess", "Haemorrhage", "Meningitis", "Muscle strain", "Grisel syndrome"], "k": "E", "x": "Grisel syndrome: non-traumatic atlantoaxial subluxation from inflammatory ligament laxity → CT, neck immobilisation, antibiotics; neurosurgical review"}, {"n": 12, "s": "After tonsillectomy in a child under 12, avoid:", "o": ["Paracetamol", "Codeine", "Ibuprofen", "Dexamethasone", "Ice cream"], "k": "B", "x": "Codeine contraindicated <12 years post-tonsillectomy (CYP2D6 ultra-rapid metabolisers → respiratory depression, deaths)"}, {"n": 13, "s": "Ibuprofen after paediatric tonsillectomy:", "o": ["Greatly increases bleeding", "Is contraindicated", "Is safe and effective", "Causes Reye's", "Needs IV route"], "k": "C", "x": "Ibuprofen + paracetamol: safe, effective; no clinically significant bleeding increase (AAO-HNS 2019)"}, {"n": 14, "s": "Intraoperative dexamethasone during tonsillectomy reduces:", "o": ["Bleeding", "Infection", "Hearing loss", "Vomiting and pain", "Tonsillar regrowth rate"], "k": "D", "x": "Single IV dexamethasone reduces PONV, pain, faster oral intake (guideline: strong recommendation)"}, {"n": 15, "s": "Periodic fevers every 3–6 weeks with aphthous ulcers, pharyngitis and cervical adenitis suggest:", "o": ["PFAPA", "Kawasaki", "Behçet", "Lymphoma", "Familial Mediterranean fever"], "k": "A", "x": "PFAPA (Marshall): clockwork fevers, normal between; single prednisolone dose aborts attack; tonsillectomy curative in most"}, {"n": 16, "s": "A rapidly enlarging unilateral tonsil in a child warrants:", "o": ["Antibiotics", "Observation", "Steroids", "Needle aspiration in clinic", "Excisional tonsillectomy"], "k": "E", "x": "Rapid asymmetric growth, systemic symptoms or nodes → excisional tonsillectomy for histology (lymphoma)"}, {"n": 17, "s": "Adenoid size is best assessed by:", "o": ["CT", "MRI", "Flexible nasendoscopy", "Mirror", "Digital palpation awake"], "k": "C", "x": "Flexible nasendoscopy (best); lateral X-ray adenoid-nasopharyngeal ratio if scope not tolerated"}, {"n": 18, "s": "Compared with total tonsillectomy, intracapsular tonsillectomy gives:", "o": ["More pain", "More bleeding", "Slower return to normal diet", "Less pain and bleeding", "No regrowth"], "k": "D", "x": "Intracapsular: less pain, less secondary haemorrhage, faster recovery; small regrowth risk (~3–5%)"}, {"n": 19, "s": "The incidence of cleft lip with or without palate is about:", "o": ["1 in 700", "1 in 70", "1 in 7000", "1 in 70,000", "1 in 7"], "k": "A", "x": "CL±P ~1:700 (male, left side commoner); isolated cleft palate ~1:2000 (female, more syndromic)"}, {"n": 20, "s": "Cleft lip repair is usually performed at about:", "o": ["Birth", "1 week", "18 months", "5 years", "3 months"], "k": "E", "x": "~3 months (\"rule of 10s\": 10 weeks, 10 lb, Hb 10 g/dL)"}, {"n": 21, "s": "Cleft palate repair is usually performed at:", "o": ["Birth", "9–12 months", "3 years", "5 years", "Early puberty"], "k": "B", "x": "9–12 months — before speech develops; later repair → worse speech"}, {"n": 22, "s": "A Veau class III cleft is:", "o": ["Soft palate only", "Hard and soft palate", "Unilateral complete", "Bilateral complete", "Submucous"], "k": "C", "x": "Veau: I soft palate · II soft + hard palate · III unilateral complete lip + palate · IV bilateral complete"}, {"n": 23, "s": "Children with cleft palate commonly develop OME because of abnormal insertion of the:", "o": ["Levator ani", "Stapedius", "Tensor tympani muscle", "Tensor veli palatini", "Palatoglossus"], "k": "D", "x": "Tensor veli palatini inserts abnormally into cleft margins → ET fails to open → OME in >90%; grommets often at palate repair"}, {"n": 24, "s": "First-line airway management in Pierre Robin sequence is:", "o": ["Prone positioning", "Tracheostomy", "Glossectomy", "Intubation", "Mandibular osteotomy"], "k": "A", "x": "Prone/side positioning → nasopharyngeal airway → mandibular distraction or tongue-lip adhesion → tracheostomy (last resort)"}, {"n": 25, "s": "Pierre Robin sequence with high myopia suggests:", "o": ["Treacher Collins syndrome", "Crouzon", "Apert", "Goldenhar", "Stickler syndrome"], "k": "E", "x": "Stickler (COL2A1/COL11A1): myopia, retinal detachment, SNHL, arthropathy — commonest syndrome with Robin; urgent ophthalmology"}, {"n": 26, "s": "Before a pharyngeal flap in 22q11 deletion, image for:", "o": ["Choanal atresia", "Medially displaced carotids", "Laryngeal web", "Cervical spine instability on X-ray", "Thyroid"], "k": "B", "x": "22q11 (velocardiofacial): medially displaced/tortuous carotids → MRA/CT before pharyngeal surgery; also cardiac defects, hypocalcaemia"}, {"n": 27, "s": "Alveolar bone grafting in cleft lip and palate is usually done at:", "o": ["1 year", "3 years", "8–11 years", "After 18 years", "Birth"], "k": "C", "x": "Mixed dentition (8–11 years), before canine eruption"}, {"n": 28, "s": "A compensatory articulation in VPI is:", "o": ["Lisp", "Stutter", "Hyponasal resonance", "Glottal stops", "Dysarthria"], "k": "D", "x": "Glottal stops, pharyngeal fricatives (compensatory articulation) — speech therapy before surgery"}, {"n": 29, "s": "VPI is best assessed by videofluoroscopy and:", "o": ["Nasendoscopy", "CT", "Audiogram", "MRI only", "Tympanometry"], "k": "A", "x": "Nasendoscopy + multiview videofluoroscopy define gap size and closure pattern (coronal commonest)"}, {"n": 30, "s": "A posterior pharyngeal flap is best for VPI with:", "o": ["Absent lateral wall motion", "Circular closure", "Short palate only", "Hypernasality only", "Good lateral wall motion"], "k": "E", "x": "Pharyngeal flap: central gap with good lateral wall motion (sagittal/coronal patterns)"}, {"n": 31, "s": "Sphincter pharyngoplasty is preferred for VPI with:", "o": ["Excellent lateral wall motion", "Poor lateral wall motion", "Hyponasality", "OSA", "Fistula"], "k": "B", "x": "Sphincter pharyngoplasty (Orticochoea/Hynes): poor lateral wall motion, circular/bow-tie gaps"}, {"n": 32, "s": "Furlow palatoplasty is a:", "o": ["Pharyngeal flap", "Sphincter pharyngoplasty", "Double opposing Z-plasty", "Vomer flap", "Fat injection"], "k": "C", "x": "Furlow: double-opposing Z-plasty — lengthens palate, realigns levator sling (primary repair or for VPI with short palate)"}, {"n": 33, "s": "Intravelar veloplasty realigns the:", "o": ["Tensor tympani tendon", "Palatoglossus", "Superior constrictor", "Levator veli palatini", "Uvular muscle"], "k": "D", "x": "Intravelar veloplasty: detaches levator from hard palate and reconstructs the sling"}, {"n": 34, "s": "Calnan's triad of submucous cleft includes:", "o": ["Zona pellucida", "Anterior nasal spine notch", "Hypernasality", "Short tongue", "Cleft lip"], "k": "A", "x": "Calnan: bifid uvula, notch in posterior hard palate (not anterior), zona pellucida (muscle diastasis)"}, {"n": 35, "s": "Infants with cleft palate are best fed by:", "o": ["Normal breastfeeding", "Long-term nasogastric tube", "Cup at birth", "Spoon only", "Assisted squeeze bottle"], "k": "E", "x": "Squeeze bottles (Haberman, Pigeon) — infants can't generate suction; NG only if failure"}, {"n": 36, "s": "Nasoalveolar moulding is:", "o": ["A post-operative nasal splint", "Pre-surgical orthopaedics", "Speech therapy", "Bone graft", "Pharyngoplasty"], "k": "B", "x": "NAM: pre-surgical moulding of alveolar segments and nasal cartilages to improve lip repair"}, {"n": 37, "s": "The commonest significant complication of a posterior pharyngeal flap is:", "o": ["Hypernasality", "Fistula", "Obstructive sleep apnoea", "Persistent conductive hearing loss", "Anosmia"], "k": "C", "x": "Pharyngeal flap: OSA/hyponasality (most significant); obtain pre-op sleep assessment"}, {"n": 38, "s": "In Down syndrome, extra care during adenotonsillectomy is needed because of:", "o": ["Haemophilia", "Macrotia", "Bilateral choanal atresia", "Atlantoaxial instability", "Laryngeal web"], "k": "D", "x": "Atlantoaxial instability: gentle neck positioning, avoid hyperextension; screen if symptomatic"}, {"n": 39, "s": "To reduce VPI risk in a child with a submucous cleft needing adenoid surgery, perform:", "o": ["Partial adenoidectomy", "Total adenoidectomy", "Tonsillectomy alone instead", "Laser adenoid", "No surgery ever"], "k": "A", "x": "Partial (superior) adenoidectomy preserves inferior pad contribution to velopharyngeal closure"}, {"n": 40, "s": "Compared with hot techniques, cold-steel tonsillectomy has:", "o": ["More secondary bleeding", "More pain", "Longer recovery", "Higher infection", "Less secondary bleeding"], "k": "E", "x": "Cold steel (± bipolar haemostasis) lower secondary haemorrhage than hot techniques (UK NPTA)"}, {"n": 41, "s": "After adenoidectomy, mild hypernasality usually:", "o": ["Resolves within weeks", "Persists lifelong", "Needs a pharyngoplasty", "Needs speech surgery", "Indicates cleft"], "k": "A", "x": "Transient hypernasality common; persistent >3–6 months → VPI assessment (occult submucous cleft)"}, {"n": 42, "s": "What forms the primary palate?", "o": ["An outgrowth of the incisive foramen", "Fusion of the palatine shelves", "Fusion of the medial nasal prominences", "Fusion of the lateral nasal prominences", "Fusion of the maxillary prominences"], "k": "C", "x": "(PP ENT-A Q71) — Primary palate (premaxilla) from fused medial nasal prominences (intermaxillary segment)"}, {"n": 43, "s": "The most common complication after repair of a cleft palate is:", "o": ["Postoperative bleeding", "Oronasal fistula", "Velopharyngeal insufficiency", "Wound infection", "Airway obstruction"], "k": "C", "x": "(PP ENT-A Q72) ⚠ — VPI (~20–30%) and fistula (~5–20%) are the commonest; most sources rank VPI first — choose C"}, {"n": 44, "s": "Regarding submucous clefts, which is true?", "o": ["A bifid uvula is diagnostic of a submucous cleft", "A submucous cleft is a strict contraindication to adenoidectomy", "The submucous cleft has a bifid uvula, muscular diastasis of the soft palate, and loss of the anterior nasal spine", "Almost all children with submucous cleft are symptomatic for velopharyngeal insufficiency", "A flat soft palate or absence of the bulge from uvular contraction during palatal elevation is a finding of occult submucous cleft"], "k": "E", "x": "(PP ENT-A Q73) — Occult SMC: flat or grooved velum, no uvular bulge; bifid uvula alone not diagnostic (~2% normal); notch is posterior; relative contraindication only"}, {"n": 45, "s": "Adenoidectomy in the presence of an occult submucous cleft palate may result in:", "o": ["Chronic eustachian tube dysfunction", "Dental malocclusion", "Articulation problems with nasal sounds M, N and NG", "Velopharyngeal insufficiency", "Chronic rhinosinusitis"], "k": "D", "x": "(PP ENT-A Q79) — Removing the adenoid pad unmasks palatal insufficiency → VPI (hypernasality, nasal regurgitation)"}, {"n": 46, "s": "The diagnosis of obstructive sleep apnea in children is best made by:", "o": ["Careful observation of sleep pattern by caregivers", "Polysomnography in a pediatric sleep laboratory", "Assessment of tonsil and adenoid size", "Home sleep monitoring tests", "The presence of daytime somnolence"], "k": "B", "x": "(PP ENT-A Q80) — In-lab polysomnography is the gold standard"}, {"n": 47, "s": "The most common first-line treatment for pediatric obstructive sleep apnea syndrome is:", "o": ["CPAP", "Adenotonsillectomy", "Tracheotomy", "Supplemental oxygen"], "k": "B", "x": "(PP ENT-A Q81) — Adenotonsillectomy (cures ~80% of non-obese children)"}, {"n": 48, "s": "A cardiac condition that may occur secondary to hypertrophied tonsils and adenoids is:", "o": ["Atrial septal defect", "Bundle branch block", "Patent ductus arteriosus", "Cor pulmonale", "Coarctation of the aorta"], "k": "D", "x": "(PP ENT-B Q25) — Chronic hypoxia/hypercapnia → pulmonary hypertension → cor pulmonale"}, {"n": 49, "s": "The incidence of rheumatic fever with untreated acute streptococcal tonsillitis is:", "o": ["1%", "3%", "5%", "8%", "10%"], "k": "B", "x": "(PP ENT-B Q85) ⚠ — Classic epidemic figure ~3% (endemic ~0.3%) — old-bank key"}, {"n": 50, "s": "The quality of voice in a patient with gross adenoid hypertrophy is described as:", "o": ["Rhinolalia aperta", "Rhinolalia clausa", "Hoarse", "Hot potato voice"], "k": "B", "x": "(PP ENT-B Q49) — Rhinolalia clausa (hyponasal); rhinolalia aperta = hypernasal (VPI, cleft); hot potato = supraglottic/PTA"}]}, {"c": 3, "t": "Session 3", "d": "Congenital Neck Masses, Vascular Anomalies, Neck Infections, Paediatric Salivary", "q": [{"n": 1, "s": "The commonest congenital midline neck mass in children is:", "o": ["Dermoid cyst", "Thymic cyst", "Thyroglossal duct cyst", "Lymphatic malformation", "Teratoma"], "k": "C", "x": "TGDC ~70% of congenital neck anomalies; midline/paramedian at or below hyoid; elevates with tongue protrusion and swallowing"}, {"n": 2, "s": "The key step of the Sistrunk operation is removal of the:", "o": ["Central hyoid body", "Thyroid isthmus", "Pyramidal lobe only", "Submandibular gland", "Strap muscles"], "k": "A", "x": "Sistrunk: cyst + tract + central hyoid body + core of tongue base toward foramen caecum"}, {"n": 3, "s": "Carcinoma arising in a thyroglossal duct cyst is usually:", "o": ["Squamous", "Medullary", "Anaplastic", "Follicular", "Papillary"], "k": "E", "x": "Papillary (~1% of TGDC); squamous rare; medullary absent (no C-cells in tract)"}, {"n": 4, "s": "The commonest site of ectopic thyroid is the:", "o": ["Submandibular", "Tongue base", "Mediastinum", "Larynx", "Ovary"], "k": "B", "x": "Lingual thyroid (~90% of ectopic); may be the only functioning thyroid → scan before excision"}, {"n": 5, "s": "The commonest branchial anomaly arises from the:", "o": ["First cleft", "Third pouch", "Second cleft", "Fourth pouch", "Fifth arch"], "k": "C", "x": "Second cleft ~90–95% of branchial anomalies"}, {"n": 6, "s": "A second branchial fistula opens externally at the:", "o": ["Preauricular area", "Mastoid tip", "Submental region", "Lower third of SCM", "Suprasternal notch"], "k": "D", "x": "Anterior border of SCM, lower third"}, {"n": 7, "s": "The tract of a second branchial fistula passes:", "o": ["Lateral to both carotids", "Deep to the hypoglossal", "Behind the ICA", "Through thyrohyoid membrane", "Between the ICA and ECA"], "k": "E", "x": "Between ICA and ECA, superficial to IX and XII → tonsillar fossa"}, {"n": 8, "s": "The internal opening of a third branchial fistula is in the:", "o": ["Pyriform sinus", "Tonsillar fossa", "Vallecula", "Nasopharynx", "External canal"], "k": "A", "x": "Third: posterior to ICA, above XII/below IX, through thyrohyoid membrane (above SLN) → upper pyriform sinus"}, {"n": 9, "s": "Recurrent left-sided suppurative thyroiditis in a child is best treated by:", "o": ["Long-term antibiotics", "Total thyroidectomy", "Endoscopic cautery", "Observation", "Radioiodine"], "k": "C", "x": "Fourth branchial (pyriform sinus) fistula — recurrent left thyroiditis/abscess → endoscopic cautery/sclerosis of the sinus opening ± excision"}, {"n": 10, "s": "A new lateral cystic neck mass in a 50-year-old should be treated as:", "o": ["Branchial cyst", "Possible cystic metastasis", "Adult lymphatic malformation", "Laryngocele", "Abscess"], "k": "B", "x": "Adult \"branchial cyst\" >40 years = cystic metastasis (HPV oropharyngeal SCC, papillary thyroid) until proven otherwise"}, {"n": 11, "s": "A midline dermoid cyst differs from a thyroglossal cyst in that it:", "o": ["Is cystic", "Is midline", "Occurs in both children and adults", "Is benign", "Stays still on tongue protrusion"], "k": "E", "x": "Dermoid: midline, firm, attached to skin, doesn't move with tongue protrusion; contains adnexa"}, {"n": 12, "s": "A cervical thymic cyst is usually found in the:", "o": ["Midline submental", "Right upper neck", "Behind the ear", "Left lower neck", "In the parotid"], "k": "D", "x": "Thymic cyst along thymopharyngeal duct, usually left lower neck, may extend to mediastinum"}, {"n": 13, "s": "Macrocystic lymphatic malformation is best treated first with:", "o": ["Sclerotherapy", "Propranolol", "Radiotherapy", "Observation only", "Laser"], "k": "A", "x": "Macrocystic LM: sclerotherapy (OK-432, doxycycline, bleomycin, ethanol); microcystic: sirolimus ± surgery"}, {"n": 14, "s": "The de Serres stage with the best prognosis for lymphatic malformation is:", "o": ["Stage V", "Stage IV", "Stage I", "Stage III", "Stage II"], "k": "C", "x": "de Serres I: unilateral infrahyoid (best) → V: bilateral supra- and infrahyoid (worst)"}, {"n": 15, "s": "Infantile haemangioma is distinguished by immunostaining for:", "o": ["S100", "Desmin", "Cytokeratin", "CD1a", "GLUT-1"], "k": "E", "x": "GLUT-1 positive in all phases of infantile haemangioma; negative in congenital haemangiomas and malformations"}, {"n": 16, "s": "Vascular malformations, unlike infantile haemangiomas:", "o": ["Involute spontaneously", "Grow with the child", "Are GLUT-1 positive", "Respond to propranolol", "Appear after birth"], "k": "B", "x": "Malformations present at birth, grow proportionately, never involute; haemangiomas appear after birth, proliferate, involute"}, {"n": 17, "s": "Phleboliths on imaging suggest a:", "o": ["Lymphatic malformation", "Haemangioma", "Venous malformation", "Teratoma", "Dermoid"], "k": "C", "x": "Venous malformation: phleboliths, compressible, enlarge with Valsalva/dependency; sclerotherapy"}, {"n": 18, "s": "A cervical arteriovenous malformation is treated by:", "o": ["Embolisation and resection", "Propranolol until puberty", "Observation with serial MRI", "Sclerotherapy alone", "Steroids"], "k": "A", "x": "AVM (high-flow): super-selective embolisation then resection within 24–72 h; partial treatment worsens"}, {"n": 19, "s": "A fetal neck mass threatening the airway is delivered by:", "o": ["Caesarean alone", "Vaginal delivery", "Tracheostomy at 1 week", "EXIT procedure", "Fetal surgery at 12 weeks"], "k": "D", "x": "EXIT: fetus on placental circulation while airway secured (teratoma, giant LM, CHAOS)"}, {"n": 20, "s": "A firm SCM mass with torticollis in a 3-week-old is treated with:", "o": ["Surgical excision", "Biopsy", "Antibiotics", "Radiotherapy", "Physiotherapy"], "k": "E", "x": "Fibromatosis colli (sternomastoid tumour): ultrasound, stretching physiotherapy — resolves in most"}, {"n": 21, "s": "A plunging ranula is treated by:", "o": ["Marsupialisation alone", "Aspiration", "Sublingual gland excision", "Superficial parotidectomy", "Antibiotics"], "k": "C", "x": "Plunging ranula: sublingual gland excision ± transcervical drainage (gland is the source)"}, {"n": 22, "s": "The commonest neck mass in children is:", "o": ["Second branchial cleft cyst", "Reactive lymphadenopathy", "Thyroglossal cyst", "Lymphoma", "Dermoid"], "k": "B", "x": "Reactive (viral) lymphadenopathy — commonest overall"}, {"n": 23, "s": "Atypical mycobacterial lymphadenitis in a child is best treated by:", "o": ["Complete excision", "Incision and drainage", "Antituberculous therapy", "Radiotherapy", "Steroids"], "k": "A", "x": "Non-tuberculous mycobacteria (1–5 years, violaceous nontender node): complete excision (avoid I&D → chronic sinus); clarithromycin if surgery unsafe"}, {"n": 24, "s": "Cat-scratch disease is caused by:", "o": ["Mycobacterium avium", "Toxoplasma", "EBV", "Bartonella henselae", "Actinomyces"], "k": "D", "x": "Bartonella henselae (Warthin-Starry silver stain); self-limiting; azithromycin shortens course"}, {"n": 25, "s": "A child with 5 days' fever, conjunctivitis, strawberry tongue and a unilateral neck node needs:", "o": ["Antibiotics", "Excision biopsy of node", "Steroids alone", "Observation", "IVIG and aspirin"], "k": "E", "x": "Kawasaki: IVIG + high-dose aspirin within 10 days → prevents coronary aneurysm; echocardiography"}, {"n": 26, "s": "The node feature most suggestive of malignancy in a child is:", "o": ["Tender", "Under 1 cm", "Supraclavicular site", "Recent upper respiratory infection", "Mobile"], "k": "C", "x": "Supraclavicular node in a child: malignancy until proven otherwise (lymphoma, metastatic); also >2–3 cm, hard, fixed, B symptoms"}, {"n": 27, "s": "The commonest head and neck malignancy in children is:", "o": ["SCC", "Lymphoma", "Thyroid cancer", "Neuroblastoma", "Rhabdomyosarcoma"], "k": "B", "x": "Lymphoma (Hodgkin in adolescents, NHL in younger children)"}, {"n": 28, "s": "A cervical mass with Horner syndrome in a toddler suggests:", "o": ["Neuroblastoma", "Branchial cyst", "Haemangioma", "Dermoid", "Lymphatic malformation"], "k": "A", "x": "Cervical neuroblastoma: Horner's, heterochromia iridis; urinary VMA/HVA"}, {"n": 29, "s": "The commonest source of deep neck infection in young children is:", "o": ["Dental", "Trauma", "Salivary", "Ingested foreign body", "Pharyngeal infection"], "k": "E", "x": "Pharyngeal/URTI → retropharyngeal and parapharyngeal nodes (dental source in older children/adults)"}, {"n": 30, "s": "A small deep neck abscess under 2.5 cm in a stable child is first managed by:", "o": ["Immediate open drainage", "Oral antibiotics", "IV antibiotics trial", "Observation", "Tracheostomy"], "k": "C", "x": "Small (<2–2.5 cm), stable, no airway compromise → IV antibiotics 24–48 h, drain if no improvement"}, {"n": 31, "s": "Neonatal suppurative parotitis is usually caused by:", "o": ["E. coli", "Pseudomonas", "Group B strep", "S. aureus", "Candida"], "k": "D", "x": "S. aureus; premature, dehydrated neonates; IV antibiotics, hydration"}, {"n": 32, "s": "Juvenile recurrent parotitis usually:", "o": ["Needs parotidectomy", "Resolves by puberty", "Is bilateral malignant", "Is from stones", "Needs RT"], "k": "B", "x": "JRP: recurrent unilateral swelling, punctate sialectasis; sialendoscopy/steroid irrigation; resolves at puberty"}, {"n": 33, "s": "Mumps is caused by a:", "o": ["Herpes simplex virus", "Adenovirus", "Coronavirus", "Enterovirus", "Paramyxovirus"], "k": "E", "x": "Paramyxovirus (rubulavirus); orchitis, pancreatitis, meningitis, unilateral SNHL"}, {"n": 34, "s": "Bilateral cystic parotid swelling in a young adult with cervical lymphadenopathy suggests:", "o": ["HIV-associated cysts", "Bilateral Warthin's tumours", "Mumps", "Sjögren's", "Sarcoid"], "k": "A", "x": "HIV-associated benign lymphoepithelial cysts (bilateral, with lymphadenopathy) → HIV test"}, {"n": 35, "s": "The commonest salivary neoplasm in infants is:", "o": ["Pleomorphic adenoma", "Mucoepidermoid", "Haemangioma", "Lymphoma", "Warthin's"], "k": "C", "x": "Haemangioma (infants); overall in children, vascular lesions predominate"}, {"n": 36, "s": "The commonest benign epithelial salivary tumour in children is:", "o": ["Haemangioma", "Warthin's", "Oncocytoma", "Pleomorphic adenoma", "Basal cell adenoma type"], "k": "D", "x": "Pleomorphic adenoma"}, {"n": 37, "s": "First-line medical therapy for drooling in cerebral palsy is:", "o": ["Atropine eye drops", "Glycopyrrolate", "Steroids", "Antibiotics", "Antihistamines"], "k": "B", "x": "Glycopyrrolate (anticholinergic); also hyoscine patch, botulinum to salivary glands"}, {"n": 38, "s": "Submandibular duct rerouting for drooling is contraindicated with:", "o": ["Mild drooling", "Anterior drooling", "Good oral control", "Normal swallow", "Aspiration"], "k": "E", "x": "Rerouting contraindicated with aspiration (posteriorly redirected saliva worsens it) → ligation/excision instead"}, {"n": 39, "s": "A simple oral ranula is best treated by:", "o": ["Excision of sublingual gland", "Repeated needle aspiration", "Antibiotics", "Steroid injection", "Marsupialisation alone repeatedly"], "k": "A", "x": "Simple ranula: sublingual gland excision (lowest recurrence); marsupialisation recurs"}, {"n": 40, "s": "A benign reactive node on ultrasound typically shows:", "o": ["Round shape", "Loss of hilum", "Echogenic hilum", "Necrosis", "Microcalcification"], "k": "C", "x": "Benign: oval, echogenic fatty hilum, hilar vascularity; malignant: round, loss of hilum, necrosis, microcalcification"}, {"n": 41, "s": "Sudden enlargement of a known lymphatic malformation is usually due to:", "o": ["Malignant transformation", "Involution", "Calcification", "Infection or haemorrhage", "Thrombosis"], "k": "D", "x": "Infection (often with URTI) or intralesional haemorrhage → antibiotics, airway watch"}, {"n": 42, "s": "An infected thyroglossal cyst is managed by:", "o": ["Immediate Sistrunk", "Antibiotics, later Sistrunk", "Repeated incision and drainage", "Radiotherapy", "Observation"], "k": "B", "x": "Antibiotics first; Sistrunk after inflammation settles (recurrence higher after infection)"}, {"n": 43, "s": "The recurrence rate after a Sistrunk procedure is about:", "o": ["3–5%", "50%", "25%", "75%", "0.0%"], "k": "A", "x": "~3–5% after Sistrunk vs up to ~50% after simple cyst excision"}, {"n": 44, "s": "The most common organism responsible for suppurative bacterial sialadenitis is:", "o": ["Pseudomonas aeruginosa", "Streptococcus pneumoniae", "Escherichia coli", "Bacteroides melaninogenicus", "Staphylococcus aureus"], "k": "E", "x": "(PP ENT-A Q76) — S. aureus (± streptococci, anaerobes); hydration, sialogogues, antistaphylococcal antibiotics"}, {"n": 45, "s": "The most common malignant salivary gland neoplasm in children is:", "o": ["Lymphoma", "Mucoepidermoid carcinoma", "Squamous cell carcinoma", "Warthin's tumor", "Rhabdomyosarcoma"], "k": "B", "x": "(PP ENT-A Q77) — Mucoepidermoid carcinoma (usually low-grade); acinic cell second"}, {"n": 46, "s": "Cultures taken from deep neck abscesses reveal:", "o": ["Staphylococcus aureus", "Streptococcus pyogenes", "Bacteroides", "Polymicrobial infections (aerobic and anaerobic)", "Pseudomonas aeruginosa"], "k": "D", "x": "(PP ENT-A Q78) — Polymicrobial aerobic + anaerobic (Streptococcus viridans, anaerobes, S. aureus)"}, {"n": 47, "s": "Which radiologic study is the most efficient for identifying a normal thyroid gland before excision of a thyroglossal duct cyst?", "o": ["Technetium-99 scan", "Iodine-131 scan", "Magnetic resonance imaging with gadolinium", "Ultrasonography of the neck"], "k": "D", "x": "(PP ENT-A Q82) — Ultrasound confirms a normal thyroid gland (radionuclide scan if not seen)"}, {"n": 48, "s": "After the neonatal period, suppurative lymphadenopathy may occur as the result of infection with any of the following organisms except:", "o": ["Pseudomonas species", "Staphylococcus aureus", "Haemophilus influenzae", "Group A β-streptococcus"], "k": "A", "x": "(PP ENT-A Q83) — Pseudomonas is not a typical cause; S. aureus and GAS commonest"}, {"n": 49, "s": "The common soft tissue sarcoma of the head and neck in children is:", "o": ["Angiosarcoma", "Chondrosarcoma", "Osteosarcoma", "Rhabdomyosarcoma", "Ewing's sarcoma"], "k": "D", "x": "(PP ENT-B Q68) — Rhabdomyosarcoma (embryonal) — commonest paediatric head and neck soft-tissue sarcoma"}, {"n": 50, "s": "The most common site of deep hemangiomas within the head and neck is within the:", "o": ["Omohyoid space", "Masseter muscle", "Submandibular space", "Lower neck"], "k": "B", "x": "(PP ENT-B Q86) ⚠ — Intramuscular haemangiomas/vascular anomalies most often in the masseter"}]}, {"c": 3, "t": "Session 4", "d": "Syndromes, Paediatric Hearing, Paediatric Rhinology & Oncology", "q": [{"n": 1, "s": "Bilateral malar hypoplasia, down-slanting palpebral fissures, lower lid colobomas and conductive hearing loss suggest:", "o": ["Goldenhar", "Treacher Collins", "Crouzon", "Isolated Pierre Robin", "Stickler"], "k": "B", "x": "Treacher Collins (TCOF1, AD, bilateral symmetrical): malar/mandibular hypoplasia, lower lid colobomas, microtia, ossicular CHL → bone conduction aids; normal intelligence"}, {"n": 2, "s": "Craniosynostosis with exorbitism, midface hypoplasia and normal limbs suggests:", "o": ["Apert", "Pfeiffer", "Treacher Collins", "Crouzon", "Down"], "k": "D", "x": "Crouzon (FGFR2): craniosynostosis, exorbitism, midface hypoplasia, no limb anomalies"}, {"n": 3, "s": "Craniosynostosis with syndactyly of the hands and feet suggests:", "o": ["Apert", "Crouzon", "Treacher Collins", "Goldenhar", "Stickler"], "k": "A", "x": "Apert (FGFR2): craniosynostosis + symmetrical syndactyly (\"mitten hands\"); stapes fixation, cleft palate"}, {"n": 4, "s": "Craniosynostosis with broad thumbs and great toes suggests:", "o": ["Apert", "Crouzon", "Saethre-Chotzen", "Treacher Collins", "Pfeiffer"], "k": "E", "x": "Pfeiffer (FGFR1/2): broad, medially deviated thumbs and great toes"}, {"n": 5, "s": "OSA from midface hypoplasia in syndromic craniosynostosis is best addressed by:", "o": ["Tonsillectomy alone always", "Septoplasty", "Midface advancement", "Nasal steroids", "UPPP"], "k": "C", "x": "Midface (Le Fort III/monobloc) advancement/distraction enlarges the nasopharyngeal airway; T&A alone insufficient"}, {"n": 6, "s": "The OMENS system classifies:", "o": ["Cleft lip", "Hemifacial microsomia", "Microtia only", "Syndromic craniosynostosis", "Laryngeal cleft"], "k": "B", "x": "OMENS: Orbit, Mandible, Ear, Nerve (VII), Soft tissue — hemifacial microsomia"}, {"n": 7, "s": "Children with Down syndrome need:", "o": ["No hearing tests", "One newborn screen only", "Audiology at age 10", "Tympanometry once", "Regular audiology"], "k": "E", "x": "Down syndrome: narrow canals, OME, CHL/SNHL → regular audiology (e.g. yearly to school age)"}, {"n": 8, "s": "Mucopolysaccharidoses are important to ENT because of:", "o": ["Difficult airway and OSA", "Epistaxis", "Anosmia", "Vertigo", "Recurrent facial nerve palsy"], "k": "A", "x": "MPS (Hurler, Hunter): GAG deposits → macroglossia, adenotonsillar hypertrophy, tracheal narrowing → OSA, very difficult airway; OME"}, {"n": 9, "s": "Achondroplasia is caused by mutation of:", "o": ["FGFR2", "COL2A1", "TCOF1", "FGFR3", "PAX3"], "k": "D", "x": "FGFR3: OSA (midface hypoplasia), foramen magnum stenosis (central apnoea), recurrent OME"}, {"n": 10, "s": "NICU infants should be screened with AABR because OAE alone misses:", "o": ["OME", "Wax", "Auditory neuropathy", "Congenital cholesteatoma", "Microtia"], "k": "C", "x": "ANSD: OAEs present → missed by OAE screening; NICU >5 days → AABR (JCIH)"}, {"n": 11, "s": "A baby who passed newborn screening but had congenital CMV needs:", "o": ["Nothing further", "Screening at school entry", "CT temporal bone", "Hearing aids", "Ongoing audiology"], "k": "E", "x": "CMV (and other risk factors) → late-onset/progressive SNHL → serial audiology through early childhood"}, {"n": 12, "s": "Visual reinforcement audiometry is suited to ages:", "o": ["Birth to 3 months", "6 months to 2.5 years", "5 to 10 years", "Adolescents and adults", "3 to 5 months"], "k": "B", "x": "VRA ~6 months–2.5 years; play audiometry ~2.5–5 years; BOA <6 months"}, {"n": 13, "s": "Congenital CMV is confirmed by PCR on saliva or urine collected within:", "o": ["3 weeks of birth", "6 months", "First year of life", "2 years", "5 years"], "k": "A", "x": "Within 3 weeks of birth (after that, can't distinguish congenital from acquired); saliva PCR (confirm with urine)"}, {"n": 14, "s": "Valganciclovir for symptomatic congenital CMV is usually given for:", "o": ["1 week", "2 weeks", "6 months", "5 years", "Lifelong"], "k": "C", "x": "6 months of oral valganciclovir improves hearing and developmental outcomes in symptomatic cCMV (start within 1 month)"}, {"n": 15, "s": "Pendred syndrome is supported by a positive:", "o": ["Sweat test", "Schirmer tear secretion test", "Tensilon test", "Perchlorate discharge test", "Caloric test"], "k": "D", "x": "Pendred (SLC26A4): EVA/incomplete partition + euthyroid goitre (often adolescent); positive perchlorate discharge test (iodide organification defect)"}, {"n": 16, "s": "Children with unilateral profound SNHL commonly have:", "o": ["No disability", "Normal sound localisation", "Better speech", "Normal hearing in noise", "Educational difficulties"], "k": "E", "x": "Unilateral loss: higher rates of grade repetition, speech and behavioural problems; poor localisation and hearing in noise"}, {"n": 17, "s": "Auditory processing disorder typically shows:", "o": ["Abnormal pure-tone audiogram", "Poor hearing in noise", "Absent OAEs", "Absent ABR", "Conductive loss"], "k": "B", "x": "APD: normal peripheral hearing, difficulty in noise/following instructions; special central tests"}, {"n": 18, "s": "Grommets usually extrude after about:", "o": ["6–12 months", "1 week", "5 or more years", "1 month", "3 years"], "k": "A", "x": "Grommets extrude at ~6–12 months; T-tubes last longer (higher perforation)"}, {"n": 19, "s": "Current advice for swimming with grommets is:", "o": ["Strict ban", "Custom earplugs always mandatory", "Surface swimming permitted", "Antibiotic drops after", "Remove grommets"], "k": "C", "x": "Surface swimming allowed without plugs (AAO-HNS); avoid diving/soapy bath water; plugs if otorrhoea recurrent"}, {"n": 20, "s": "The commonest cause of nasal obstruction in neonates is:", "o": ["Choanal atresia", "Pyriform stenosis", "Dermoid", "Encephalocele", "Neonatal rhinitis"], "k": "E", "x": "Neonatal rhinitis (mucosal oedema, reflux, maternal hormones) — commonest; exclude choanal atresia/PANS"}, {"n": 21, "s": "A neonate with nasal obstruction has a cystic mass beneath the inferior turbinate. This is a:", "o": ["Dermoid", "Nasal glioma variant", "Encephalocele", "Dacryocystocele", "Haemangioma"], "k": "D", "x": "Dacryocystocele (nasolacrimal duct cyst) — intranasal component under inferior turbinate; bilateral → respiratory distress → endoscopic marsupialisation"}, {"n": 22, "s": "\"Adenoid facies\" includes:", "o": ["Open mouth and long face", "Short face", "Hypertelorism with clefts", "Microtia", "Macroglossia"], "k": "A", "x": "Long face, open mouth, high-arched palate, hyponasal speech (rhinolalia clausa)"}, {"n": 23, "s": "Intranasal steroids in children with allergic rhinitis are:", "o": ["Contraindicated", "Safe at licensed doses", "Cause major growth loss", "Only for teenagers", "Less effective than oral"], "k": "B", "x": "Safe at licensed doses (mometasone/fluticasone from ~2–4 years); minimal growth effect with these agents"}, {"n": 24, "s": "Neonatal facial palsy after forceps delivery usually:", "o": ["Needs early decompression", "Is permanent", "Recovers spontaneously", "Indicates Möbius", "Needs nerve graft"], "k": "C", "x": "Traumatic (forceps, compression) → most recover fully within weeks; developmental (Möbius, CULLP) doesn't"}, {"n": 25, "s": "Asymmetric crying facies should prompt screening for:", "o": ["Hearing loss", "Diabetes", "Renal tract anomalies", "Glaucoma", "Cardiac anomalies"], "k": "E", "x": "Asymmetric crying facies (absent depressor anguli oris): associated cardiac anomalies (22q11, VSD)"}, {"n": 26, "s": "Nasopharyngeal carcinoma in adolescents is typically:", "o": ["EBV-related", "Keratinising SCC", "HPV-related", "Adenocarcinoma", "Lymphoma"], "k": "A", "x": "Adolescent NPC: undifferentiated (WHO III), EBV-related, advanced nodal disease at presentation; chemoradiotherapy"}, {"n": 27, "s": "The malignancy rate of a thyroid nodule in a child is about:", "o": ["1%", "5%", "50%", "20–25%", "75–80%"], "k": "D", "x": "Paediatric nodules ~20–25% malignant (adults ~5–10%) → lower threshold for FNA/surgery"}, {"n": 28, "s": "Prophylactic thyroidectomy in MEN2B is recommended by:", "o": ["Age 18 years or later", "First year of life", "Age 10", "Age 5", "Never"], "k": "B", "x": "MEN2B (RET M918T): prophylactic thyroidectomy in first year of life; MEN2A by ~5 years"}, {"n": 29, "s": "Compared with adults, paediatric papillary thyroid cancer has:", "o": ["Fewer nodal metastases", "Worse survival", "Excellent survival", "No lung spread", "Rarely multifocal"], "k": "C", "x": "Paediatric DTC: more nodal, lung, multifocal disease but excellent survival (>95%)"}, {"n": 30, "s": "A febrile toddler has a fluctuant neck node after a URTI. The next step is:", "o": ["Observation", "Oral antibiotics only", "Excision biopsy of the node", "Radiotherapy", "Ultrasound and drainage"], "k": "E", "x": "Ultrasound confirms abscess → needle aspiration/I&D + culture (consider NTM if afebrile/violaceous)"}, {"n": 31, "s": "A teenage girl with recurrent bilateral parotid swelling and dry eyes likely has:", "o": ["Juvenile Sjögren", "Mumps", "JRP", "Sarcoidosis of glands", "HIV"], "k": "A", "x": "Juvenile Sjögren's: recurrent parotitis commonest presentation in children; anti-Ro/La; risk of MALT lymphoma"}, {"n": 32, "s": "EBV tonsillar enlargement compromising the airway is treated with:", "o": ["Amoxicillin", "Tonsillectomy at once", "Antivirals", "Steroids", "Observation only"], "k": "D", "x": "IV dexamethasone for airway-threatening EBV tonsillitis; nasopharyngeal airway; tonsillectomy rarely"}, {"n": 33, "s": "Before paediatric decannulation, perform:", "o": ["CT neck", "Airway endoscopy", "Barium swallow study", "Audiogram", "MRI"], "k": "B", "x": "MLB to exclude suprastomal collapse/granuloma, subglottic stenosis before downsizing/capping"}, {"n": 34, "s": "The commonest isolated congenital ossicular anomaly involves the:", "o": ["Malleus fixation", "Incus absence", "Stapes anomaly", "Absent cochlea", "Atretic canal"], "k": "C", "x": "Stapes anomalies (fixation/suprastructure) commonest isolated congenital ossicular malformation (Teunissen-Cremers)"}, {"n": 35, "s": "Congenital canal stenosis carries a high cholesteatoma risk when the canal diameter is:", "o": [">10 mm", "8 mm", "Normal", "Absent", "<4 mm"], "k": "E", "x": "Canal <4 mm → ~50% cholesteatoma risk by 12 years → CT surveillance, early canaloplasty"}, {"n": 36, "s": "Bilateral aural atresia in an infant is first managed with:", "o": ["Softband bone conductor", "Atresiaplasty at 1 year", "Cochlear implant", "Air conduction aids", "Observation"], "k": "A", "x": "Softband BC device from early infancy for bilateral atresia (speech/language); surgery later"}, {"n": 37, "s": "Vestibular testing best suited to young children is:", "o": ["Calorics", "Rotary chair", "Posturography", "cVEMP only", "ENG"], "k": "B", "x": "Rotary chair (in parent's lap) — tolerated by infants; calorics poorly tolerated"}, {"n": 38, "s": "Congenital blindness with progressive SNHL in a boy suggests:", "o": ["Usher", "Alport", "Norrie disease", "Pendred", "Waardenburg type II"], "k": "C", "x": "Norrie (NDP, X-linked): retinal dysplasia (congenital blindness) + progressive SNHL; Usher = RP (not congenital blindness)"}, {"n": 39, "s": "Dysphagia lusoria is caused by:", "o": ["Double aortic arch", "Left pulmonary artery sling", "Innominate compression", "Aberrant right subclavian", "Thyroid"], "k": "D", "x": "Aberrant right subclavian (arteria lusoria): retro-oesophageal → dysphagia (often adults)"}, {"n": 40, "s": "Macroglossia, omphalocele and neonatal hypoglycaemia suggest:", "o": ["Down", "Congenital hypothyroidism", "Pompe", "Hurler", "Beckwith-Wiedemann"], "k": "E", "x": "Beckwith-Wiedemann: macroglossia (airway, OSA, speech) → tongue reduction; Wilms' tumour surveillance"}, {"n": 41, "s": "Fused cervical vertebrae with hearing loss suggest:", "o": ["Klippel-Feil", "Treacher Collins", "Crouzon", "Apert", "Stickler"], "k": "A", "x": "Klippel-Feil: cervical fusion, short neck; hearing loss (inner ear anomalies); Wildervanck = + Duane + SNHL"}, {"n": 42, "s": "A plexiform neurofibroma is pathognomonic of:", "o": ["NF2", "NF1", "Tuberous sclerosis", "VHL", "MEN2"], "k": "B", "x": "NF1: plexiform neurofibroma (often facial/neck), café-au-lait, Lisch nodules; NF2 = bilateral VS"}, {"n": 43, "s": "Residual OSA in an obese teenager after adenotonsillectomy often involves the:", "o": ["Adenoid regrowth", "Septum", "Lingual tonsil", "Larynx", "Turbinates"], "k": "C", "x": "Lingual tonsil hypertrophy (obesity), also tongue base/epiglottis → DISE, lingual tonsillectomy"}, {"n": 44, "s": "Children with primary ciliary dyskinesia and OME are often better managed with:", "o": ["Bilateral grommets", "T-tubes", "Adenoidectomy", "Myringotomy", "Hearing aids"], "k": "E", "x": "PCD: grommets → persistent mucoid otorrhoea; hearing aids preferred; OME often improves with age"}, {"n": 45, "s": "ABR in an infant under 3 months is usually performed:", "o": ["Under GA", "With IV sedation", "Awake and alert", "During natural sleep", "With chloral hydrate always"], "k": "D", "x": "Natural sleep (\"feed and sleep\") <3–4 months; sedation/GA for older infants"}, {"n": 46, "s": "An infant with a large segmental facial haemangioma needs screening with:", "o": ["Echo and brain MRI", "Renal ultrasound", "Karyotype and FISH", "Audiogram", "Skeletal survey"], "k": "A", "x": "PHACE: Posterior fossa, Haemangioma, Arterial, Cardiac (coarctation), Eye → echo + MRI/MRA before propranolol"}, {"n": 47, "s": "Thrombocytopenia with an enlarging vascular tumour in an infant is:", "o": ["PHACE association", "Sturge-Weber", "Kasabach-Merritt", "Maffucci", "Proteus"], "k": "C", "x": "Kasabach-Merritt: kaposiform haemangioendothelioma/tufted angioma with platelet trapping → sirolimus/vincristine; not infantile haemangioma"}, {"n": 48, "s": "Most infantile haemangiomas complete involution by about:", "o": ["6 months", "4 years", "18 years", "Never", "1 month"], "k": "B", "x": "Most involute by ~4 years (old rule \"50% by 5, 90% by 9\" overstates duration); residual fibrofatty tissue common"}, {"n": 49, "s": "Persistent symptoms after adenotonsillectomy for OSA should be evaluated with:", "o": ["Repeat tonsillectomy", "Antibiotics", "Steroids", "Polysomnography", "Observation"], "k": "D", "x": "Post-op PSG for persistent symptoms or high-risk groups (obesity, Down, severe OSA) → CPAP/DISE-directed surgery"}, {"n": 50, "s": "The hyoid bone is usually calcified by age:", "o": ["4 years", "10 years", "20 years", "2 years"], "k": "D", "x": "(PP ENT-B Q82) ⚠ — Old-bank key: 2 years (body ossification begins around birth); greater cornua ossify later"}]}, {"c": 3, "t": "Session 5", "d": "Gap Closure + High-Yield Consolidation", "q": [{"n": 1, "s": "Frenotomy for ankyloglossia is clearly indicated when there is:", "o": ["Parental preference only", "Breastfeeding difficulty", "Asymptomatic short frenulum", "Delayed walking", "Mouth breathing"], "k": "B", "x": "Frenotomy for symptomatic tongue-tie: poor latch, maternal nipple pain, poor weight gain (NICE); asymptomatic → observe"}, {"n": 2, "s": "Ankyloglossia most affects speech sounds that are:", "o": ["Bilabial", "Nasal and nasalised", "Velar", "Lingual-alveolar", "Glottal"], "k": "D", "x": "Lingual-alveolar sounds (t, d, l, n, r, s) — speech effect often overstated; SLT assessment first"}, {"n": 3, "s": "The structure at risk during frenuloplasty is the:", "o": ["Submandibular duct orifice", "Lingual artery trunk", "Hypoglossal nerve", "Body of the sublingual gland", "Genioglossus tendon"], "k": "A", "x": "Submandibular (Wharton's) duct orifices on the sublingual papillae either side of the frenulum → protect during frenuloplasty"}, {"n": 4, "s": "Unilateral pinna bruising with ipsilateral cerebral oedema and retinal haemorrhages in an infant suggests:", "o": ["Mastoiditis", "Haemophilia", "Perichondritis", "Instrumental birth trauma", "Tin ear syndrome"], "k": "E", "x": "\"Tin ear syndrome\": unilateral auricular bruising, ipsilateral cerebral oedema, retinal haemorrhage — rotational acceleration (abuse)"}, {"n": 5, "s": "A torn upper labial frenulum in a non-mobile infant should raise concern for:", "o": ["Teething", "Tongue-tie", "Non-accidental injury", "Vitamin C deficiency scurvy", "Oral thrush"], "k": "C", "x": "Torn frenulum in a non-mobile infant (\"those who don't cruise rarely bruise\") = sentinel injury → NAI work-up"}, {"n": 6, "s": "Suspected non-accidental injury in a child is managed by:", "o": ["Discharge home", "Safeguarding referral", "Parental interview only", "Antibiotics", "Observation at home"], "k": "B", "x": "Safeguarding referral (child protection team), document carefully, skeletal survey/CT head/fundoscopy as per protocol"}, {"n": 7, "s": "Vocal fold nodules in young boys commonly:", "o": ["Progress to cancer", "Need early surgery", "Persist into adulthood always", "Require systemic steroids", "Regress around puberty"], "k": "E", "x": "Paediatric nodules often regress at puberty (especially boys, laryngeal growth); manage with voice therapy and vocal hygiene; surgery rarely"}, {"n": 8, "s": "A
