<title>Abdalhadi Project — ENT Board Question Book</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--box:#0B1418;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--box:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.chap.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.chap b{flex:1;font-weight:600}
.chap span{color:var(--muted);font-variant-numeric:tabular-nums}
.chap .done{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201F}}
.primary{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.primary{color:#06201F}}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.topi .t{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topi .sc{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qn{font:600 .9rem/1 inherit;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{font-size:.9rem;color:var(--muted);margin:-4px 0 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.92rem;margin:0 0 12px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}
.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 4px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-cur{outline:2px solid var(--teal);outline-offset:1px}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:8px 0}
table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.cover{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;margin:6px 0 18px}
.cover .k{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700}
.stats{display:flex;gap:10px;margin-top:10px;font-variant-numeric:tabular-nums}
.stats div{flex:1;min-width:0}.stats b{display:block;font:600 1.4rem/1.1 Charter,Georgia,serif}.stats span{font-size:.8rem;color:var(--muted)}
.chhead{display:flex;align-items:center;gap:8px;margin:22px 0 8px}
.chhead h2{flex:1;margin:0;font:600 1.25rem/1.2 Charter,"Iowan Old Style",Georgia,serif}
.chhead .cnt{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.82rem}
.chap small{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:2px}
.chap .no{flex:none;width:30px;height:30px;border-radius:8px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.notes h2{font:600 1.15rem/1.3 Charter,Georgia,serif;margin:22px 0 8px}
.notes h3{font-size:1rem;margin:18px 0 6px;color:var(--teal)}
.notes ul{padding-left:20px;margin:6px 0}.notes li{margin:4px 0}
.notes table{font-size:.9rem}.notes th{text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
.notes p{margin:6px 0}
</style></head><body>

<script>
const DATA=[{"c": 0, "t": "Session 1", "d": "Anatomy, audiology, facial nerve, otosclerosis, cholesteatoma, SNHL", "q": [{"n": 1, "s": "A patient with autophony and a low-frequency air-bone gap has an intact tympanic membrane. Which finding most strongly supports superior canal dehiscence over otosclerosis?", "o": ["Absent stapedial reflexes", "Elevated VEMP thresholds", "Supranormal bone conduction thresholds", "Type As tympanogram", "Low-frequency SNHL"], "k": "C", "x": "Third mobile window — BC enhanced (can be negative, e.g. −10 dB HL), AC reduced → pseudo-conductive ABG\nA — absent reflexes = otosclerosis; SCD reflexes present (key discriminator)\nB — SCD lowers cVEMP thresholds, raises oVEMP amplitude\nD — As = stiff chain (otosclerosis); SCD normal Type A\nE — conductive pattern, not SNHL\nTrap: CHL + present reflexes = third window until proven otherwise — don't do a stapedotomy; HRCT with Pöschl/Stenvers reformats\nOther third windows: EVA, X-linked stapes gusher (POU3F4)"}, {"n": 2, "s": "The most common site of facial canal dehiscence encountered during middle ear surgery is the:", "o": ["Labyrinthine segment, fundus region", "Tympanic segment, oval window region", "Second genu, lateral canal region", "Mastoid segment, stylomastoid region", "Geniculate ganglion, cochleariform region"], "k": "B", "x": "~55% of dehiscences — tympanic segment above oval window\nTrap: narrowest segment = labyrinthine — different question"}, {"n": 3, "s": "Primary acquired cholesteatoma MOST commonly originates in:", "o": ["Prussak's space", "Sinus tympani", "Facial recess", "Anterior epitympanum", "Protympanum"], "k": "A", "x": "Pars flaccida retraction into Prussak's space\nTrap: most common site of residual disease after canal wall up = sinus tympani"}, {"n": 4, "s": "Hitselberger's sign in vestibular schwannoma reflects compression of which nerve?", "o": ["Trigeminal", "Glossopharyngeal", "Vagus", "Facial", "Cochlear"], "k": "D", "x": "Hypoaesthesia of posterosuperior EAC — sensory fibres of VII\nTrap: facial motor weakness is late/uncommon in VS — early palsy → facial schwannoma or meningioma"}, {"n": 5, "s": "The earliest audiometric notch in noise-induced hearing loss typically appears at:", "o": ["500 Hz", "1 kHz", "2 kHz", "8 kHz", "4 kHz"], "k": "E", "x": "Notch at 4 kHz (3–6 kHz), recovery at 8 kHz\nTrap: presbycusis slopes down through 8 kHz with no recovery\nTTS — classically a noise phenomenon (ENT-B Q17)"}, {"n": 6, "s": "Carhart's notch in otosclerosis is a dip in bone conduction maximal at:", "o": ["500 Hz", "1 kHz", "2 kHz", "4 kHz", "8 kHz"], "k": "C", "x": "~15 dB dip at 2 kHz — ossicular chain resonance frequency\nTrap: mechanical artefact, not true cochlear loss — closes after successful stapedotomy"}, {"n": 7, "s": "The MOST common site of otosclerotic involvement is:", "o": ["Fissula ante fenestram", "Round window niche", "Cochlear apex", "Internal auditory canal", "Posterior semicircular canal"], "k": "A", "x": "Anterior to oval window — 80–90% of cases\nRound window = second commonest; cochlear otosclerosis → SNHL"}, {"n": 8, "s": "A Schwartze sign on otoscopy represents:", "o": ["Haemotympanum", "Active otospongiotic focus", "Glomus tympanicum tumour", "Aberrant internal carotid", "High dehiscent jugular bulb"], "k": "B", "x": "Pink-red promontory blush — vascular otospongiosis, ~10% of patients\nTrap: most otosclerosis patients have a normal TM (ENT-A Q62)"}, {"n": 9, "s": "With a 512 Hz fork, Rinne becomes negative when the air-bone gap reaches at least:", "o": ["5 dB", "10 dB", "15 dB", "30 dB", "60 dB"], "k": "D", "x": "Dhingra: 256 Hz → ≥15 dB; 512 Hz → ≥30 dB; 1024 Hz → ≥45 dB\nTrap: 15 dB is the 256 Hz value"}, {"n": 10, "s": "Fisch type C glomus tumour is defined by involvement of the:", "o": ["Middle ear only", "Tympanomastoid region", "Intracranial space", "Facial nerve canal", "Carotid canal"], "k": "E", "x": "Fisch A middle ear — B tympanomastoid — C carotid canal (C1–C4) — D intracranial\nTrap: C = carotid, not intracranial (that's D)"}, {"n": 11, "s": "The best investigation to monitor treatment response in malignant otitis externa is:", "o": ["Technetium-99m scan", "Gallium-67 scan", "CT temporal bone", "MRI with contrast", "Indium-111 leucocyte scan"], "k": "B", "x": "Gallium normalises as infection resolves — follow-up\nTechnetium stays positive for months to years (bone remodelling) — diagnosis only\nENT-A Q48: \"except\" = straight to mastoidectomy/tympanoplasty"}, {"n": 12, "s": "The MOST common finding at revision stapes surgery is:", "o": ["Prosthesis displacement", "Incus necrosis", "Reparative granuloma", "Perilymph fistula", "Obliterative regrowth"], "k": "A", "x": "Displacement, often from incus erosion at the crimp site\nENT-B Q99: displacement not offered → key = incus erosion"}, {"n": 13, "s": "Gentamicin vestibulotoxicity primarily targets the:", "o": ["Spiral ganglion", "Stria vascularis", "Inner hair cells", "Type I vestibular hair cells", "Outer hair cells"], "k": "D", "x": "Preferentially vestibulotoxic — type I hair cells of cristae — basis of intratympanic ablation in Ménière's\nENT-B Q79: false statement = serum levels predict vestibular toxicity"}, {"n": 14, "s": "Cisplatin ototoxicity first damages the:", "o": ["Inner hair cells, apical turn", "Spiral ganglion, apical turn", "Stria vascularis, middle turn", "Inner hair cells, basal turn", "Outer hair cells, basal turn"], "k": "E", "x": "High frequency first — bilateral — permanent\nENT-A Q47: cisplatin = permanent SNHL; ENT-A Q1: \"not common\" = severe neutropenia"}, {"n": 15, "s": "The MOST common inner ear malformation detected on imaging is:", "o": ["Michel aplasia", "Common cavity", "Enlarged vestibular aqueduct", "Incomplete partition type I", "Cochlear hypoplasia"], "k": "C", "x": "EVA >1.5 mm at midpoint (Valvassori) or >2 mm at operculum (Cincinnati)\nPendred (SLC26A4) — fluctuating, stepwise SNHL — avoid head trauma\nTrap: Mondini = incomplete partition type II"}, {"n": 16, "s": "Facial nerve decompression in Bell's palsy is considered when ENoG shows:", "o": [">50% degeneration within 3 days", ">90% degeneration within 14 days", ">70% degeneration within 21 days", ">90% degeneration after 21 days", ">75% degeneration within 7 days"], "k": "B", "x": "Gantz: >90% within 14 days + absent voluntary EMG\nTrap: no benefit after 14 days"}, {"n": 17, "s": "Surgical decompression for Bell's palsy must include which site, the narrowest and most critical point?", "o": ["Geniculate ganglion", "Tympanic segment", "Mastoid segment", "Meatal foramen", "Stylomastoid foramen"], "k": "D", "x": "Meatal foramen ~0.68 mm — entrance of labyrinthine segment — reached by middle cranial fossa approach"}, {"n": 18, "s": "Facial nerve injury occurs MOST frequently with which temporal bone fracture?", "o": ["Otic capsule–violating", "Longitudinal", "Tympanic plate", "Squamous temporal", "Mastoid tip"], "k": "A", "x": "Capsule-violating 30–50% vs capsule-sparing 6–13%\nTrap: longitudinal more common overall — different question\nENT-A Q43: best recovery predictor = timing of onset (immediate worse than delayed)"}, {"n": 19, "s": "The MOST common site of facial nerve injury in temporal bone trauma is the:", "o": ["Mastoid segment", "Internal auditory canal", "Perigeniculate region", "Second genu", "Stylomastoid foramen"], "k": "C", "x": "80–90% — GSPN tethers the nerve at the geniculate"}, {"n": 20, "s": "Endolymphatic K⁺ concentration is approximately:", "o": ["5 mEq/L", "15 mEq/L", "50 mEq/L", "100 mEq/L", "150 mEq/L"], "k": "E", "x": "Endolymph high K⁺ (~150), low Na⁺ — intracellular-like — stria vascularis — EP +80 mV\nPerilymph = extracellular-like\nENT-B Q45: exact question; ENT-A Q53: true = endolymph resorbed in endolymphatic sac"}, {"n": 21, "s": "Interaural attenuation for bone conduction is approximately:", "o": ["0–10 dB", "20 dB", "40 dB", "60 dB", "80 dB"], "k": "A", "x": "BC 0–10 dB; AC ~40 dB supra-aural, ≥55 dB insert phones\nAlways mask BC when test-ear ABG >10 dB\nENT-B Q15–16: AC → choose 50 dB; BC → lowest option offered"}, {"n": 22, "s": "A masking dilemma classically occurs in:", "o": ["Unilateral profound SNHL", "Bilateral maximal conductive loss", "Bilateral symmetrical SNHL", "Unilateral otosclerosis", "Noise-induced hearing loss"], "k": "B", "x": "Bilateral ABG ~50–60 dB — masking needed exceeds interaural attenuation → overmasking\nA — shadow curve; masking needed and works, no dilemma\nENT-A Q57: option C = same trap (false); key = B"}, {"n": 23, "s": "Speech reception threshold normally agrees with the pure-tone average within:", "o": ["±2 dB", "±5 dB", "±10 dB", "±15 dB", "±20 dB"], "k": "C", "x": "PTA = 500 Hz, 1 kHz, 2 kHz\nDiscrepancy >10 dB → non-organic loss or test error (SRT better than PTA)\nENT-B Q14: SRT = 50% spondees correct"}, {"n": 24, "s": "The MOST common intracranial complication of otitis media is:", "o": ["Brain abscess", "Lateral sinus thrombosis", "Extradural abscess", "Otitic hydrocephalus", "Meningitis"], "k": "E", "x": "Meningitis = commonest; brain abscess = most lethal\nTrap: commonest complication of cholesteatoma overall = labyrinthine fistula (ENT-B Q89 key: SCC erosion)"}, {"n": 25, "s": "Cholesteatoma-related labyrinthine fistula MOST commonly involves the:", "o": ["Superior canal", "Posterior canal", "Cochlear promontory", "Lateral canal", "Oval window"], "k": "D", "x": "~90% lateral semicircular canal\nTrap: Hennebert's sign = positive fistula test with intact TM (Ménière's, congenital syphilis)"}, {"n": 26, "s": "Gradenigo's syndrome comprises otorrhoea, retro-orbital pain and palsy of cranial nerve:", "o": ["III", "VI", "IV", "VII", "XII"], "k": "B", "x": "Petrous apicitis — VI in Dorello's canal — pain from Gasserian ganglion (V)"}, {"n": 27, "s": "Facial nerve schwannoma MOST commonly involves the:", "o": ["Geniculate ganglion", "Mastoid segment", "Labyrinthine segment", "Parotid segment", "Internal auditory canal"], "k": "A", "x": "Often multisegment — hearing loss frequently precedes palsy\nTrap: facial hemangioma at geniculate → early palsy even when tiny"}, {"n": 28, "s": "Per AAO-HNS 2015 criteria, vertigo episodes in definite Ménière's disease last:", "o": ["1 minute to 1 hour", "5 minutes to 6 hours", "20 minutes to 12 hours", "1 hour to 24 hours", "12 to 48 hours"], "k": "C", "x": "Definite: ≥2 episodes, 20 min–12 h + audiometric low-to-mid frequency SNHL + fluctuating aural symptoms\nTrap: 20 min–24 h = probable Ménière's (no audiometric requirement)"}, {"n": 29, "s": "The MOST common cause of vertigo overall is:", "o": ["Vestibular neuritis", "Ménière's disease", "Vestibular migraine", "Labyrinthitis", "BPPV"], "k": "E", "x": "Posterior canal 80–90%, mostly canalithiasis"}, {"n": 30, "s": "A positive right Dix-Hallpike test in posterior canal BPPV produces which nystagmus?", "o": ["Down-beating, rightward torsional", "Horizontal geotropic", "Horizontal ageotropic", "Up-beating, geotropic torsional", "Pure down-beating"], "k": "D", "x": "Latency seconds — duration <60 s — fatigable — reverses on sitting up\nHorizontal geotropic (roll test) = lateral canal canalithiasis; ageotropic = cupulolithiasis\nTrap: pure down-beating, no latency → central until proven otherwise → MRI"}, {"n": 31, "s": "The MOST common cause of non-syndromic genetic SNHL is mutation of:", "o": ["GJB2", "SLC26A4", "MYO7A", "OTOF", "POU3F4"], "k": "A", "x": "Connexin 26 — AR — up to ~50% of recessive non-syndromic SNHL\nGenetic deafness: ~70% non-syndromic / 30% syndromic; ~75–80% AR\nENT-A Q63: false = \"syndromic is leading cause\"; ENT-A Q93: AR"}, {"n": 32, "s": "The classic test profile in auditory neuropathy spectrum disorder is:", "o": ["Absent OAEs, normal ABR", "Present OAEs, absent ABR", "Absent OAEs, absent ABR", "Present OAEs, normal ABR", "Absent cochlear microphonic"], "k": "B", "x": "Cochlear microphonic present — OAEs may fade — poor discrimination for audiogram\nRisks: NICU, hyperbilirubinaemia, hypoxia, OTOF\nTraps: OAE-only screening misses ANSD; CI not contraindicated\nENT-A Q58: key = D (hypoxia, hyperbilirubinaemia)"}, {"n": 33, "s": "The current FDA-approved minimum age for paediatric cochlear implantation in bilateral profound SNHL is:", "o": ["6 months", "18 months", "9 months", "12 months", "24 months"], "k": "C", "x": "Lowered from 12 to 9 months (2020)\nENT-A Q64: older texts — \">12 months\" is a valid criterion, not the \"except\"\nTrap: post-meningitis with ossification → implant urgently regardless"}, {"n": 34, "s": "Post-meningitic labyrinthitis ossificans begins earliest in the:", "o": ["Apical turn, scala vestibuli", "Middle turn, scala media", "Vestibule", "Basal turn, scala tympani", "Semicircular canals"], "k": "D", "x": "Near round window — spread via cochlear aqueduct\nTrap: MRI T2 (loss of fluid signal) detects fibrosis before CT shows bone"}, {"n": 35, "s": "The second most common cerebellopontine angle tumour is:", "o": ["Epidermoid", "Facial schwannoma", "Arachnoid cyst", "Lipoma", "Meningioma"], "k": "E", "x": "VS 80–90% — meningioma 3–10% — epidermoid third\nMeningioma: broad dural base, dural tail, eccentric to IAC, calcification"}, {"n": 36, "s": "The MRI sequence that best distinguishes an epidermoid from an arachnoid cyst is:", "o": ["Diffusion-weighted imaging", "T1 post-gadolinium", "T2 fast spin echo", "Fat-suppressed T1", "MR angiography"], "k": "A", "x": "Epidermoid restricts (bright DWI); arachnoid cyst follows CSF (dark)\nTrap: identical on T1/T2"}, {"n": 37, "s": "A petrous apex lesion that is bright on T1 and T2, does not enhance, and does not suppress with fat saturation is MOST likely:", "o": ["Cholesteatoma", "Cholesterol granuloma", "Asymmetric fatty marrow", "Mucocele", "Petrous apicitis"], "k": "B", "x": "T1 bright (methaemoglobin), T2 bright, persists on fat-sat\nTraps: fatty marrow → drops on fat-sat (leave alone); cholesteatoma → T1 dark, DWI restricts"}, {"n": 38, "s": "Non-EPI DWI MRI for residual cholesteatoma after canal-wall-up surgery reliably detects lesions down to about:", "o": ["1 mm", "10 mm", "3 mm", "6 mm", "15 mm"], "k": "C", "x": "Non-EPI (HASTE) ≥2–3 mm; EPI ~5 mm with skull base artefact\nCan replace planned second look"}, {"n": 39, "s": "The MOST common primary middle ear tumour is:", "o": ["Facial schwannoma", "Middle ear adenoma", "Meningioma", "Glomus tympanicum", "Choristoma"], "k": "D", "x": "Red retrotympanic mass + pulsatile tinnitus — Brown's sign (blanches with positive pneumatic pressure)\nAdenoma = rare\nTrap: glomus jugulare = most common jugular foramen tumour"}, {"n": 40, "s": "On CT, a glomus jugulare is distinguished from a high jugular bulb by:", "o": ["Middle ear soft tissue", "Smooth cortical margin", "Pulsatile tinnitus", "Hypotympanic location", "Moth-eaten bony erosion"], "k": "E", "x": "Moth-eaten jugular foramen + loss of caroticojugular spine (Phelps sign); jugular bulb = smooth intact cortex\nMRI: salt-and-pepper flow voids"}, {"n": 41, "s": "The inheritance pattern of otosclerosis is:", "o": ["Autosomal dominant, incomplete penetrance", "Autosomal recessive", "X-linked dominant", "Mitochondrial", "Autosomal dominant, complete penetrance"], "k": "A", "x": "Penetrance ~25–40% — F:M ~2:1 — bilateral 70–80%\nHistological ~10% of white people; clinical ~0.5–1%\nENT-A Q61: key = unique to otic capsule"}, {"n": 42, "s": "The usual stapedotomy piston length is about:", "o": ["3.0 mm", "4.5 mm", "6.0 mm", "2.5 mm", "5.5 mm"], "k": "B", "x": "4.25–4.5 mm — projects 0.25–0.5 mm into vestibule\nTrap: too long → vertigo; too short → residual ABG"}, {"n": 43, "s": "The incidence of profound SNHL (\"dead ear\") after primary stapes surgery is about:", "o": ["0.1%", "5%", "1%", "10%", "0.01%"], "k": "C", "x": "<1% primary; higher in revision surgery"}, {"n": 44, "s": "Preganglionic parasympathetic fibres in the chorda tympani synapse in the:", "o": ["Otic ganglion", "Pterygopalatine ganglion", "Ciliary ganglion", "Submandibular ganglion", "Geniculate ganglion"], "k": "D", "x": "Geniculate = sensory (taste) cell bodies — no synapse; parasympathetics pass through\nChorda tympani → submandibular ganglion → SMG/SLG\nGSPN → pterygopalatine → lacrimal\nLesser petrosal (IX) → otic → parotid\nENT-B Q6: key = chorda tympani"}, {"n": 45, "s": "Jacobson's nerve is a branch of cranial nerve:", "o": ["V", "VII", "X", "XI", "IX"], "k": "E", "x": "Tympanic branch of IX → tympanic plexus → lesser petrosal → otic ganglion → parotid\nArnold's nerve = auricular branch of X (ear-cough reflex)\nENT-A Q41 / ENT-B Q73 (recycled): \"except\" = Jacobson's nerve (middle ear, not external ear)"}, {"n": 46, "s": "The medial boundary of Prussak's space is the:", "o": ["Neck of malleus", "Pars flaccida", "Lateral malleolar fold", "Lateral process of malleus", "Body of incus"], "k": "A", "x": "Lateral pars flaccida — medial malleus neck — superior lateral malleolar fold — inferior lateral process of malleus"}, {"n": 47, "s": "The sinus tympani is bounded superiorly by the:", "o": ["Subiculum", "Ponticulus", "Cochleariform process", "Pyramidal eminence", "Tensor tympani"], "k": "B", "x": "Ponticulus above — subiculum below\nPyramidal eminence separates sinus tympani (medial) from facial recess (lateral) — landmark, not superior boundary"}, {"n": 48, "s": "The superior boundary of the facial recess is the:", "o": ["Chorda tympani", "Facial nerve", "Incus buttress", "Sinus tympani", "Pyramidal eminence"], "k": "C", "x": "Medial vertical VII — lateral chorda tympani — superior incus buttress (fossa incudis)\nPosterior tympanotomy route for CI"}, {"n": 49, "s": "Trautmann's triangle gives access to the dura of the:", "o": ["Middle cranial fossa", "Anterior cranial fossa", "Jugular foramen", "Posterior cranial fossa", "Petrous apex"], "k": "D", "x": "Bony labyrinth anterior — sigmoid sinus posterior — superior petrosal sinus superior\nENT-B Q1: lateral landmark to antrum = suprameatal spine of Henle"}, {"n": 50, "s": "In the adult, the mastoid antrum lies deep to Macewen's triangle at a depth of about:", "o": ["2–3 mm", "5 mm", "8 mm", "20–25 mm", "12–15 mm"], "k": "E", "x": "Adult 12–15 mm; newborn ~2 mm (superficial neonatal mastoid)"}]}, {"c": 0, "t": "Session 2", "d": "Audiology numbers, vestibular tests, CSOM surgery, paediatric otology", "q": [{"n": 1, "s": "With a 1024 Hz fork, Rinne becomes negative when the air-bone gap reaches at least:", "o": ["15 dB", "20 dB", "30 dB", "45 dB", "60 dB"], "k": "D", "x": "256 Hz → ≥15 dB; 512 Hz → ≥30 dB; 1024 Hz → ≥45 dB (Dhingra)"}, {"n": 2, "s": "A false-negative Rinne is seen in:", "o": ["Severe unilateral SNHL", "Bilateral otosclerosis", "Wax impaction", "Presbycusis", "Noise-induced hearing loss"], "k": "A", "x": "Cross-hearing: BC heard in the good cochlea → \"BC > AC\" on the dead side. Confirm with Weber (lateralises to good ear) and masking"}, {"n": 3, "s": "The endocochlear potential is approximately:", "o": ["−70 mV", "+40 mV", "+80 mV", "+120 mV", "0 mV"], "k": "C", "x": "+80 mV, generated by the stria vascularis; highest resting potential in the body"}, {"n": 4, "s": "Vestibular endolymph is secreted mainly by the:", "o": ["Stria vascularis", "Spiral ligament fibrocytes", "Hensen cells", "Endolymphatic sac", "Vestibular dark cells"], "k": "E", "x": "Vestibular dark cells; cochlear endolymph = stria vascularis. Resorbed in endolymphatic sac (ENT-A Q53)"}, {"n": 5, "s": "In Ménière's disease, an electrocochleography SP/AP ratio suggestive of hydrops is:", "o": [">0.1", ">0.4", ">0.8", ">1.0", "<0.2"], "k": "B", "x": "SP/AP >0.4 (some labs 0.35–0.5). Trap: normal ECochG does not exclude Ménière's"}, {"n": 6, "s": "In Lermoyez syndrome, hearing and tinnitus:", "o": ["Worsen during the vertigo attack", "Improve with the vertigo attack", "Remain unchanged throughout", "Fluctuate without any vertigo", "Become profound after one attack"], "k": "B", "x": "Hearing improves as vertigo starts — reverse of classic Ménière's"}, {"n": 7, "s": "Familial paraganglioma with paternal (imprinted) transmission is linked to:", "o": ["SDHB", "VHL", "RET", "NF1", "SDHD"], "k": "E", "x": "SDHD: paternal transmission, multifocal head & neck tumours. SDHB: higher malignancy risk"}, {"n": 8, "s": "The vidian nerve is formed by the greater superficial petrosal nerve and the:", "o": ["Deep petrosal nerve", "Lesser petrosal nerve", "External petrosal nerve", "Chorda tympani", "Nervus intermedius"], "k": "A", "x": "GSPN (parasympathetic) + deep petrosal (sympathetic from carotid plexus) → nerve of pterygoid canal → pterygopalatine ganglion"}, {"n": 9, "s": "The arcuate eminence on the floor of the middle cranial fossa overlies the:", "o": ["Cochlea", "Geniculate ganglion", "Lateral semicircular canal", "Superior semicircular canal", "Internal auditory canal"], "k": "D", "x": "Superior SCC — key middle cranial fossa landmark (ENT-B Q72). Trap: tegmen separates attic from MCF (ENT-B Q4)"}, {"n": 10, "s": "The bony ridge running from the pyramidal eminence to the promontory is the:", "o": ["Subiculum", "Cochleariform process", "Ponticulus", "Finiculus", "Styloid eminence"], "k": "C", "x": "Ponticulus = superior boundary of sinus tympani; subiculum = inferior (Day 1 error)"}, {"n": 11, "s": "The tuning fork of choice for clinical hearing tests is:", "o": ["512 Hz", "128 Hz", "256 Hz", "1024 Hz", "2048 Hz"], "k": "A", "x": "512 Hz: good decay time, little vibrotactile sensation. 128/256 Hz → felt rather than heard"}, {"n": 12, "s": "The Stenger test detects:", "o": ["Bilateral non-organic loss", "Retrocochlear lesion", "Cochlear recruitment", "Ossicular fixation", "Unilateral non-organic loss"], "k": "E", "x": "Unilateral feigned loss: tone louder in the \"bad\" ear is not acknowledged and masks the good ear"}, {"n": 13, "s": "A Type Ad tympanogram indicates:", "o": ["Otosclerosis", "Middle ear effusion", "Ossicular discontinuity", "Eustachian tube dysfunction", "Tympanic membrane perforation"], "k": "C", "x": "Ad = hypercompliant: discontinuity or flaccid TM. As = otosclerosis; B = effusion/perforation (volume decides); C = negative pressure"}, {"n": 14, "s": "Acoustic reflex decay suggests a retrocochlear lesion when amplitude falls by >50% within:", "o": ["2 seconds", "10 seconds", "30 seconds", "60 seconds", "120 seconds"], "k": "B", "x": ">50% decay within 10 s at 500/1000 Hz → retrocochlear (VS)"}, {"n": 15, "s": "ABR wave I is generated by the:", "o": ["Cochlear nucleus", "Superior olivary complex", "Lateral lemniscus", "Distal auditory nerve", "Inferior colliculus"], "k": "D", "x": "I distal VIII · II proximal VIII · III cochlear nucleus · IV superior olive · V lateral lemniscus/inferior colliculus"}, {"n": 16, "s": "An interaural wave V latency difference suggesting retrocochlear pathology is:", "o": [">0.2 ms", ">1.0 ms", ">2.0 ms", ">0.05 ms", ">4.0 ms"], "k": "A", "x": "Interaural wave V difference >0.2 ms; I–V interpeak prolongation also suggestive. MRI remains gold standard"}, {"n": 17, "s": "Transient evoked OAEs are generally absent when hearing thresholds exceed about:", "o": ["10 dB HL", "20 dB HL", "30 dB HL", "60 dB HL", "80 dB HL"], "k": "C", "x": "TEOAE absent beyond ~30 dB HL (DPOAE up to ~40–50 dB)"}, {"n": 18, "s": "In noise-induced hearing loss, OAEs can be used for all of the following EXCEPT:", "o": ["Detecting early-stage NIHL", "Estimating audiogram configuration", "Objectively monitoring progression", "Guiding hearing aid characteristics", "Specifying inner hair cell damage"], "k": "E", "x": "OAEs reflect outer hair cells, not inner hair cells (ENT-A Q78 — recycled-style)"}, {"n": 19, "s": "Cold water caloric irrigation of the right ear produces nystagmus with the fast phase toward the:", "o": ["Right", "Left", "Upward direction", "Downward direction", "No nystagmus produced"], "k": "B", "x": "COWS: cold opposite, warm same"}, {"n": 20, "s": "Canal paresis on caloric testing is significant when unilateral weakness exceeds about:", "o": ["5%", "10%", "15%", "25%", "50%"], "k": "D", "x": "Unilateral weakness >20–25% (Jongkees) = significant"}, {"n": 21, "s": "The caloric test assesses the vestibulo-ocular reflex at about:", "o": ["5 Hz", "1 Hz", "0.5 Hz", "2 Hz", "0.003 Hz"], "k": "E", "x": "Calorics = very low-frequency VOR (~0.003 Hz); vHIT = high frequency. Explains normal vHIT with abnormal calorics in Ménière's"}, {"n": 22, "s": "The cervical VEMP assesses the:", "o": ["Utricle, superior vestibular nerve", "Lateral canal, superior vestibular nerve", "Saccule, inferior vestibular nerve", "Posterior canal, inferior vestibular nerve", "Utricle, inferior vestibular nerve"], "k": "C", "x": "cVEMP: saccule → inferior vestibular nerve → SCM (inhibitory)"}, {"n": 23, "s": "The ocular VEMP assesses the:", "o": ["Utricle, superior vestibular nerve", "Saccule, inferior vestibular nerve", "Saccule, superior vestibular nerve", "Lateral canal, inferior vestibular nerve", "Cochlea, cochlear nerve"], "k": "A", "x": "oVEMP: utricle → superior vestibular nerve → contralateral inferior oblique"}, {"n": 24, "s": "Sound-induced vertigo (Tullio phenomenon) is classically seen in:", "o": ["Ménière's disease", "Vestibular neuritis", "BPPV", "Superior canal dehiscence", "Vestibular migraine"], "k": "D", "x": "Tullio (sound) and Hennebert (pressure) → SCD; also perilymph fistula"}, {"n": 25, "s": "In acute vestibular syndrome, which HINTS finding suggests a central cause?", "o": ["Abnormal head impulse", "Normal head impulse", "Unidirectional nystagmus", "Absent skew deviation", "Positive Dix-Hallpike"], "k": "B", "x": "HINTS central: normal head impulse, direction-changing nystagmus, skew present. More sensitive than early MRI for stroke"}, {"n": 26, "s": "The most common organism in chronic suppurative otitis media is:", "o": ["Streptococcus pneumoniae", "Haemophilus influenzae", "Pseudomonas aeruginosa", "Moraxella catarrhalis", "Proteus mirabilis"], "k": "C", "x": "Pseudomonas aeruginosa, then S. aureus. Acute otitis media = S. pneumoniae, H. influenzae, M. catarrhalis"}, {"n": 27, "s": "Wullstein type III tympanoplasty places the graft on the:", "o": ["Stapes head", "Malleus handle", "Incus long process", "Mobile footplate", "Round window"], "k": "A", "x": "Type III = myringostapediopexy (columella). I intact chain; II graft on incus/malleus remnant"}, {"n": 28, "s": "Wullstein type IV tympanoplasty is characterised by:", "o": ["Graft on stapes head, intact arch", "Graft on malleus, ossicles intact", "Lateral canal fenestration, footplate fixed", "Graft on incus, malleus eroded", "Footplate exposed, round window shielded"], "k": "E", "x": "Type IV: mobile footplate exposed, small cavity, round window shielded (sound protection). Type V = fenestration (fixed footplate)"}, {"n": 29, "s": "The most commonly used graft material in tympanoplasty is:", "o": ["Tragal perichondrium", "Temporalis fascia", "Fat", "Vein", "Dura"], "k": "B", "x": "Temporalis fascia; cartilage preferred for retraction, revision, ET dysfunction"}, {"n": 30, "s": "The most common cause of a persistently discharging canal wall down cavity is:", "o": ["Inadequate tympanic graft", "Overlarge meatoplasty", "Saucerised cavity margins", "High facial ridge", "Obliterated mastoid tip"], "k": "D", "x": "High facial ridge → undrained mastoid pocket. Also small meatoplasty, retained cells, open tympanic cavity"}, {"n": 31, "s": "Which is NOT an accepted theory of acquired cholesteatoma pathogenesis?", "o": ["Invagination of the tympanic membrane", "Transdifferentiation", "Basal cell hyperplasia", "Epithelial migration through a perforation", "Squamous metaplasia"], "k": "B", "x": "Transdifferentiation is not an accepted theory (ENT-A Q49 — recycled)"}, {"n": 32, "s": "The ossicle most commonly eroded in chronic otitis media is the:", "o": ["Malleus handle", "Stapes footplate", "Malleus head", "Incus body", "Long process of incus"], "k": "E", "x": "Long process/lenticular process of incus — poorest blood supply"}, {"n": 33, "s": "The facial nerve segment most commonly involved by cholesteatoma is the:", "o": ["Labyrinthine", "Meatal", "Mastoid", "Tympanic", "Extratemporal"], "k": "D", "x": "Tympanic segment, above oval window (commonest dehiscence site)"}, {"n": 34, "s": "Bezold's abscess lies:", "o": ["Deep to the sternocleidomastoid", "Over the zygomatic root", "Along the posterior belly of digastric", "In the retroauricular subperiosteal plane", "Beneath the temporalis muscle"], "k": "A", "x": "Pus through mastoid tip medially → deep to SCM. Citelli = digastric/occipital direction"}, {"n": 35, "s": "A subperiosteal abscess beneath temporalis, spreading via the external canal without breaching the mastoid cortex, is:", "o": ["Bezold's abscess", "Citelli's abscess", "Luc's abscess", "Postauricular abscess", "Parapharyngeal abscess"], "k": "C", "x": "Luc's: middle ear → EAC roof → beneath temporalis periosteum; mastoid cortex intact"}, {"n": 36, "s": "Otitic hydrocephalus is most associated with:", "o": ["Brain abscess", "Meningitis", "Extradural abscess", "Labyrinthitis", "Lateral sinus thrombosis"], "k": "E", "x": "Lateral sinus thrombosis → impaired venous drainage → raised ICP, normal CSF composition, papilloedema"}, {"n": 37, "s": "Oedema over the mastoid emissary vein in lateral sinus thrombosis is:", "o": ["Battle's sign", "Griesinger's sign", "Tobey-Ayer sign", "Delta sign", "Crowe-Beck sign"], "k": "B", "x": "Griesinger's sign. Battle's = basal skull fracture bruising"}, {"n": 38, "s": "The test in which compressing the internal jugular vein on the affected side fails to raise CSF pressure is:", "o": ["Tobey-Ayer", "Crowe-Beck", "Griesinger", "Hennebert", "Kernig"], "k": "A", "x": "Tobey-Ayer; Crowe-Beck = retinal vein engorgement with contralateral IJV compression"}, {"n": 39, "s": "Grommets for bilateral OME with hearing loss are considered after persistence of at least:", "o": ["2 weeks", "4 weeks", "6 weeks", "3 months", "12 months"], "k": "D", "x": "Bilateral OME ≥3 months with hearing loss (NICE: ≥25–30 dB in better ear)"}, {"n": 40, "s": "Autologous rib cartilage microtia reconstruction is usually performed at:", "o": ["Under 1 year", "2–3 years", "6–10 years", "14–16 years", "Adulthood only"], "k": "C", "x": "Brent ~6 years; Nagata ~10 years (chest circumference ≥60 cm). Rib cartilage must be adequate"}, {"n": 41, "s": "On the Jahrsdoerfer scale, a good candidate for atresiaplasty scores at least:", "o": ["3", "5", "7", "9", "10"], "k": "C", "x": "≥7/10 = good candidate; stapes presence earns 2 points"}, {"n": 42, "s": "Preauricular sinus, branchial fistula and mixed hearing loss suggest:", "o": ["Treacher Collins syndrome", "Waardenburg syndrome", "Pendred syndrome", "Branchio-oto-renal syndrome", "Usher syndrome"], "k": "D", "x": "BOR: EYA1, autosomal dominant — check renal ultrasound"}, {"n": 43, "s": "Congenital cholesteatoma most commonly occurs in the:", "o": ["Posterosuperior quadrant", "Anterosuperior quadrant", "Pars flaccida", "Posteroinferior quadrant", "Mastoid antrum"], "k": "B", "x": "Anterosuperior quadrant, behind intact TM; Levenson criteria"}, {"n": 44, "s": "The most common non-genetic cause of congenital SNHL is:", "o": ["Cytomegalovirus", "Rubella", "Toxoplasmosis", "Syphilis", "Kernicterus"], "k": "A", "x": "Congenital CMV — progressive/late-onset SNHL; often missed by newborn screening"}, {"n": 45, "s": "Which statement about bullous myringitis is true?", "o": ["The infection is usually painless", "It presents with SNHL alone", "The hearing loss is usually permanent", "Drainage is thick and mucopurulent", "The aetiology may be viral"], "k": "E", "x": "Viral or Mycoplasma; painful; usually conductive, may be mixed (ENT-A Q44 / ENT-B Q75 — recycled)"}, {"n": 46, "s": "Pulsatile tinnitus is uncommon in:", "o": ["Pseudotumor cerebri", "Acoustic neuroma", "Otosclerosis", "Dural arteriovenous fistula", "Glomus tympanicum"], "k": "B", "x": "Acoustic neuroma → non-pulsatile unilateral tinnitus (ENT-A Q42 / ENT-B Q74 — recycled)"}, {"n": 47, "s": "Which can mimic chronic otitis media?", "o": ["Langerhans cell histiocytosis", "Tuberculosis", "Granulomatosis with polyangiitis", "All of the above", "None of the above"], "k": "D", "x": "All mimic COM (ENT-A Q45 / ENT-B Q77 — recycled)"}, {"n": 48, "s": "Hearing loss from mumps is most commonly:", "o": ["Bilateral and congenital", "Unilateral and congenital", "Unilateral and acquired in childhood", "Bilateral and acquired in childhood", "Unilateral and acquired in adulthood"], "k": "C", "x": "Unilateral, acquired in childhood; commonest cause of acquired unilateral SNHL in children (ENT-A Q51)"}, {"n": 49, "s": "The most common cause of CSF otorrhoea is:", "o": ["Petrous ridge fracture", "Tympanic membrane rupture", "Mastoid air cell fracture", "Parietal bone fracture", "Nasal bone fracture"], "k": "A", "x": "Petrous ridge (temporal bone) fracture (ENT-B Q48)"}, {"n": 50, "s": "The essential radiological finding in coalescent mastoiditis is:", "o": ["Poor pneumatisation", "Diffuse clouding of cells", "Radiolucent antral defect", "Erosion of sinus plate", "Loss of bony septa"], "k": "E", "x": "Rarefaction and loss of bony cell partitions (ENT-B Q13). Sinus plate erosion = complication, not the defining sign"}]}, {"c": 0, "t": "Session 3", "d": "Electrophysiology, implants, facial nerve, external ear, lateral skull base", "q": [{"n": 1, "s": "The subiculum separates the sinus tympani from the:", "o": ["Facial recess", "Round window niche", "Oval window niche", "Protympanum", "Epitympanum"], "k": "B", "x": "Subiculum: ridge from styloid eminence to round window niche; inferior boundary of sinus tympani. Ponticulus = superior boundary (Day 2 error)"}, {"n": 2, "s": "During canal wall up surgery, the sinus tympani is best visualised using:", "o": ["Microscope through the canal", "0° endoscope", "Extended facial recess", "Angled 30–45° endoscope", "Canal wall removal"], "k": "D", "x": "Sinus tympani lies medial to facial nerve; hidden from the microscope even after canal wall removal → angled endoscope"}, {"n": 3, "s": "The ABR wave used for threshold estimation is:", "o": ["Wave V", "Wave I", "Wave II", "Wave III", "Wave IV"], "k": "A", "x": "Wave V most robust, persists to near threshold"}, {"n": 4, "s": "Normal absolute wave V latency at 80 dB nHL is about:", "o": ["1.5 ms", "3.5 ms", "5.6 ms", "8.0 ms", "10.0 ms"], "k": "C", "x": "~5.5–6.0 ms at 80 dB nHL; I–V interpeak ~4.0 ms"}, {"n": 5, "s": "The summating potential on electrocochleography originates from the:", "o": ["Spiral ganglion", "Cochlear nucleus", "Distal auditory nerve", "Stria vascularis", "Cochlear hair cells"], "k": "E", "x": "SP = hair cell receptor potentials; AP = auditory nerve (= ABR wave I); EP = stria vascularis"}, {"n": 6, "s": "Distortion product OAEs are most commonly measured at:", "o": ["f1 + f2", "f2 − f1", "2f1 − f2", "2f2 − f1", "f1 × f2"], "k": "C", "x": "2f1−f2, with f2/f1 ≈ 1.2"}, {"n": 7, "s": "The central relay of the acoustic reflex arc is the:", "o": ["Superior olivary complex", "Inferior colliculus", "Medial geniculate body", "Lateral lemniscus", "Auditory cortex"], "k": "A", "x": "VIII → cochlear nucleus → superior olivary complex → facial motor nucleus (bilateral) → stapedius"}, {"n": 8, "s": "An acoustic reflex elicited at less than 60 dB sensation level (Metz test) indicates:", "o": ["Retrocochlear lesion", "Conductive loss", "Non-organic loss", "Central lesion", "Cochlear recruitment"], "k": "E", "x": "Normal reflex 70–100 dB SL; <60 dB SL = recruitment (cochlear)"}, {"n": 9, "s": "The gold standard to confirm bilateral vestibular hypofunction is:", "o": ["Bithermal calorics", "Rotary chair", "Cervical VEMP", "Posturography", "Dix-Hallpike test"], "k": "B", "x": "Rotary chair confirms bilateral loss; calorics can be falsely low (e.g. canal anatomy). vHIT also useful"}, {"n": 10, "s": "Objective, frequency-specific thresholds in an infant with severe-to-profound loss are best obtained by:", "o": ["Click ABR", "Transient OAEs", "Tympanometry", "ASSR", "Electrocochleography"], "k": "D", "x": "ASSR: frequency-specific, objective, measurable to high intensities; click ABR mainly 2–4 kHz and limited at profound levels"}, {"n": 11, "s": "The FDA minimum age for a percutaneous (implanted) bone-anchored hearing aid is:", "o": ["6 months", "1 year", "2 years", "3 years", "5 years"], "k": "E", "x": "≥5 years for implanted BAHA; younger → softband"}, {"n": 12, "s": "A standard percutaneous BAHA for conductive or mixed loss requires bone conduction thresholds no worse than about:", "o": ["45 dB", "10 dB", "20 dB", "70 dB", "90 dB"], "k": "A", "x": "Standard abutment ≤45 dB BC; power devices ≤55–65 dB"}, {"n": 13, "s": "The Vibrant Soundbridge floating mass transducer is classically attached to the:", "o": ["Malleus handle", "Stapes footplate", "Long process of incus", "Tympanic membrane", "Promontory"], "k": "C", "x": "Long process of incus; also round window placement for mixed/CHL"}, {"n": 14, "s": "The cochlear implant electrode array is inserted into the:", "o": ["Scala vestibuli", "Scala tympani", "Scala media", "Modiolus", "Vestibule"], "k": "B", "x": "Scala tympani, via round window or cochleostomy (anteroinferior to RW)"}, {"n": 15, "s": "Vaccination mandatory before cochlear implantation is against:", "o": ["Influenza", "Hepatitis B", "Meningococcus C", "Streptococcus pneumoniae", "Varicella"], "k": "D", "x": "Pneumococcal (PCV + PPSV23); Hib in children. Inner ear malformations raise meningitis risk"}, {"n": 16, "s": "An absolute contraindication to cochlear implantation is:", "o": ["Michel aplasia", "Labyrinthitis ossificans", "Enlarged vestibular aqueduct", "Incomplete partition type II", "Age over 80 years"], "k": "A", "x": "No cochlea (Michel) or absent cochlear nerve → ABI. Ossification = urgency, not contraindication"}, {"n": 17, "s": "The auditory brainstem implant electrode is placed in the:", "o": ["Internal auditory canal fundus", "Cerebellopontine angle cistern", "Inferior colliculus surface", "Round window niche", "Lateral recess of fourth ventricle"], "k": "E", "x": "Over cochlear nucleus via foramen of Luschka; NF2 with bilateral VS"}, {"n": 18, "s": "The non-surgical aid of choice for unilateral profound loss with a normal contralateral ear is:", "o": ["BTE aid in the poor ear", "BiCROS aid", "CROS aid", "Bilateral ITE aids", "Body-worn aid"], "k": "C", "x": "CROS: microphone on deaf side → good ear. BiCROS if better ear also has loss. Surgical options: BAHA, CI for SSD"}, {"n": 19, "s": "The occlusion effect of a hearing aid is reduced by:", "o": ["Reducing overall gain", "Increasing vent size", "Shortening the earmould", "Raising compression ratio", "Adding directional microphones"], "k": "B", "x": "Venting releases low-frequency energy. Deep (bony canal) insertion also reduces occlusion"}, {"n": 20, "s": "Lybarger's rule prescribes hearing aid gain of about:", "o": ["Equal to the loss", "Double the loss", "One-third of the loss", "One-half of the loss", "One-quarter of the loss"], "k": "D", "x": "Half-gain rule; basis of NAL formulas"}, {"n": 21, "s": "Compared with Bell's palsy, Ramsay Hunt syndrome has:", "o": ["Better prognosis", "Similar prognosis, no hearing loss", "Worse prognosis, frequent SNHL and vertigo", "Typically bilateral involvement", "No role for antivirals"], "k": "C", "x": "Hunt: VZV, worse recovery, SNHL/vertigo common; antivirals + steroids"}, {"n": 22, "s": "The lowest House-Brackmann grade with incomplete eye closure is:", "o": ["II", "III", "V", "VI", "IV"], "k": "E", "x": "HB IV = incomplete eye closure, obvious disfiguring asymmetry. HB III = complete closure with effort"}, {"n": 23, "s": "A Sunderland third-degree nerve injury involves disruption of the:", "o": ["Myelin sheath only", "Endoneurium", "Perineurium", "Epineurium", "Axon only"], "k": "B", "x": "1 conduction block · 2 axon · 3 endoneurium · 4 perineurium · 5 epineurium. Seddon: neurapraxia = 1, axonotmesis = 2–4, neurotmesis = 5"}, {"n": 24, "s": "The preferred donor for a short facial nerve interposition graft is the:", "o": ["Great auricular nerve", "Sural nerve", "Medial antebrachial cutaneous nerve", "Lesser occipital nerve", "Ansa cervicalis"], "k": "A", "x": "Great auricular: same field, matching calibre, ~7–10 cm. Sural for long grafts"}, {"n": 25, "s": "Hypoglossal–facial nerve transfer is most effective when performed:", "o": ["Within 72 hours only", "Within 2 weeks only", "After 3 years", "Within 2 years", "After motor end-plate fibrosis"], "k": "D", "x": "Within ~2 years, while EMG shows fibrillation (viable end-plates). After that → dynamic muscle transfer (temporalis, gracilis)"}, {"n": 26, "s": "Melkersson–Rosenthal syndrome comprises recurrent facial palsy, orofacial oedema and:", "o": ["Uveitis", "Fissured tongue", "Parotid swelling", "Hearing loss", "Auricular vesicles"], "k": "B", "x": "Fissured (plicated) tongue; granulomatous cheilitis"}, {"n": 27, "s": "Möbius syndrome involves cranial nerves:", "o": ["III and VII", "V and VII", "VII and VIII", "IX and X", "VI and VII"], "k": "E", "x": "VI and VII: bilateral facial palsy + abducens palsy; mask-like face"}, {"n": 28, "s": "Crocodile tears result from:", "o": ["Lacrimal gland hypertrophy", "Nasolacrimal obstruction", "Misdirected salivary fibres", "Sympathetic denervation", "Corneal exposure"], "k": "C", "x": "Aberrant regeneration: salivary fibres (GSPN route) innervate lacrimal gland → tearing with eating"}, {"n": 29, "s": "A reduced Schirmer test localises a facial nerve lesion to:", "o": ["At or proximal to the geniculate ganglion", "Distal to the chorda tympani", "Between stapedius nerve and chorda", "The stylomastoid foramen", "The parotid segment"], "k": "A", "x": "GSPN leaves at geniculate → reduced lacrimation = lesion at/proximal to geniculate"}, {"n": 30, "s": "On the nerve excitability test, a side-to-side difference indicating poor prognosis is:", "o": [">0.5 mA", ">1 mA", ">2 mA", ">3.5 mA", ">10 mA"], "k": "D", "x": "NET difference >3.5 mA = poor prognosis"}, {"n": 31, "s": "Otalgia from piriform sinus carcinoma is referred via:", "o": ["Arnold's nerve", "Jacobson's nerve", "Auriculotemporal nerve", "Great auricular nerve", "Lesser occipital nerve"], "k": "A", "x": "Arnold's (X): larynx/hypopharynx. Jacobson's (IX): tonsil, base of tongue"}, {"n": 32, "s": "Keratosis obturans is associated with:", "o": ["Diabetes mellitus", "Psoriasis", "Bronchiectasis", "Cold water swimming", "Hearing aid use"], "k": "C", "x": "Keratosis obturans: young, bilateral, circumferential canal widening, bronchiectasis/sinusitis. Canal cholesteatoma: elderly, unilateral, focal erosion"}, {"n": 33, "s": "A single pedunculated bony lesion of the external canal at a suture line is:", "o": ["Exostosis", "Fibrous dysplasia", "Canal cholesteatoma", "Keratosis obturans", "Osteoma"], "k": "E", "x": "Osteoma: single, pedunculated, at tympanosquamous/tympanomastoid suture. Exostoses: multiple, bilateral, broad-based, cold water"}, {"n": 34, "s": "The most common cause of otomycosis is:", "o": ["Candida albicans", "Mucor", "Penicillium", "Aspergillus niger", "Trichophyton"], "k": "D", "x": "Aspergillus niger (black spores); Candida second"}, {"n": 35, "s": "Auricular perichondritis characteristically spares the:", "o": ["Helix", "Lobule", "Antihelix", "Concha", "Tragus"], "k": "B", "x": "Lobule has no cartilage. Pseudomonas classic (high ear piercing)"}, {"n": 36, "s": "The most common malignancy of the auricle is:", "o": ["Basal cell carcinoma", "Melanoma", "Merkel cell carcinoma", "Adenoid cystic carcinoma", "Squamous cell carcinoma"], "k": "E", "x": "Auricle: SCC most common (helix). Face overall: BCC"}, {"n": 37, "s": "Squamous cell carcinoma of the external auditory canal is staged by the:", "o": ["AJCC TNM skin system", "Modified Pittsburgh system", "Fisch classification", "Glasscock-Jackson classification", "Kadish system"], "k": "B", "x": "Modified Pittsburgh (Arriaga/Moody)"}, {"n": 38, "s": "The fissures of Santorini allow spread of EAC infection or tumour to the:", "o": ["Parotid", "Temporomandibular joint", "Mastoid", "Middle cranial fossa", "Jugular foramen"], "k": "A", "x": "Santorini (cartilaginous canal) → parotid/infratemporal fossa"}, {"n": 39, "s": "A persistent defect in the anteroinferior bony canal (tympanic plate) is the:", "o": ["Fissure of Santorini", "Notch of Rivinus", "Foramen of Huschke", "Hyrtl's fissure", "Macewen's triangle"], "k": "C", "x": "Huschke → parotid/TMJ. Hyrtl's fissure = tympanomeningeal (CSF/meningitis route)"}, {"n": 40, "s": "A first branchial cleft anomaly containing skin and cartilage, opening below the angle of the mandible and intimate with the facial nerve, is:", "o": ["Work type I", "Third arch sinus", "Second arch fistula", "Work type II", "Preauricular sinus"], "k": "D", "x": "Work II: ecto + mesoderm, below mandible angle, may run either side of VII. Work I: ectoderm only, duplication of EAC, lateral to VII"}, {"n": 41, "s": "The Fisch type A infratemporal fossa approach involves:", "o": ["Sacrifice of the facial nerve", "Posterior rerouting of the facial nerve", "No facial nerve manipulation", "Anterior rerouting of the facial nerve", "Primary facial–hypoglossal transfer"], "k": "D", "x": "Anterior rerouting for jugular foramen/infralabyrinthine access (glomus jugulare). Type B/C for clivus/nasopharynx"}, {"n": 42, "s": "Bill's bar separates the facial nerve from the:", "o": ["Superior vestibular nerve", "Cochlear nerve", "Inferior vestibular nerve", "Nervus intermedius", "Singular nerve"], "k": "A", "x": "Bill's bar (vertical crest): facial nerve anterior, superior vestibular posterior — upper IAC. Transverse (falciform) crest divides superior/inferior"}, {"n": 43, "s": "For a small intracanalicular vestibular schwannoma with serviceable hearing, the preferred surgical approach is:", "o": ["Translabyrinthine", "Transotic", "Transcochlear", "Retrolabyrinthine", "Middle cranial fossa"], "k": "E", "x": "Middle fossa: intracanalicular, hearing preservation. Retrosigmoid: larger tumours with hearing. Translab: no serviceable hearing"}, {"n": 44, "s": "Persistent postoperative headache is most associated with which approach?", "o": ["Translabyrinthine", "Middle cranial fossa", "Retrosigmoid", "Transcochlear", "Infratemporal fossa"], "k": "C", "x": "Retrosigmoid: bone dust/dural adhesion, cerebellar retraction"}, {"n": 45, "s": "The NF2 gene is located on chromosome:", "o": ["17", "22", "11", "13", "3"], "k": "B", "x": "Chromosome 22q12, merlin (schwannomin). NF1 = 17"}, {"n": 46, "s": "The average growth rate of a growing vestibular schwannoma is about:", "o": ["<0.1 mm/year", "1–2 mm/year", "5 mm/year", "10 mm/year", "20 mm/year"], "k": "B", "x": "~1–2 mm/year in growing tumours; ~half don't grow — basis for wait-and-scan"}, {"n": 47, "s": "In the Koos classification, brainstem compression with fourth ventricle displacement is grade:", "o": ["I", "II", "III", "IV"], "k": "D", "x": "Koos IV: brainstem compression, fourth ventricle displaced. III: touches brainstem, no displacement"}, {"n": 48, "s": "The usual marginal dose in modern stereotactic radiosurgery for vestibular schwannoma is:", "o": ["5–6 Gy", "8–9 Gy", "18–20 Gy", "25–30 Gy", "12–13 Gy"], "k": "E", "x": "12–13 Gy marginal; control ~90–95%. Higher doses → facial/trigeminal morbidity"}, {"n": 49, "s": "The pars nervosa of the jugular foramen contains cranial nerve:", "o": ["X", "XI", "IX", "XII", "None (venous only)"], "k": "C", "x": "Pars nervosa: IX + inferior petrosal sinus. Pars vascularis: X, XI, IJV"}, {"n": 50, "s": "Collet-Sicard syndrome involves cranial nerves:", "o": ["IX–XII", "IX–XI", "X–XII", "VII–IX", "IX alone"], "k": "A", "x": "Collet-Sicard IX–XII; Vernet IX–XI; Villaret = IX–XII + Horner's"}]}, {"c": 0, "t": "Session 4", "d": "Exam-style mix with recycled past-paper items", "q": [{"n": 1, "s": "Furunculosis of the external canal is most commonly caused by:", "o": ["Pseudomonas aeruginosa", "Streptococcus pyogenes", "Staphylococcus aureus", "Aspergillus niger", "Proteus mirabilis"], "k": "C", "x": "Furuncle = S. aureus infection of hair follicle (cartilaginous canal only). Diffuse otitis externa = Pseudomonas"}, {"n": 2, "s": "The cranial nerve most commonly involved in malignant otitis externa is:", "o": ["VII", "VI", "IX", "X", "XII"], "k": "A", "x": "VII at stylomastoid foramen; then IX, X, XI at jugular foramen = worse prognosis"}, {"n": 3, "s": "The empirical first-line antibiotic for malignant otitis externa is:", "o": ["Amoxicillin-clavulanate", "Clindamycin", "Vancomycin", "Metronidazole", "Ciprofloxacin"], "k": "E", "x": "Antipseudomonal: ciprofloxacin (oral or IV) ± ceftazidime; 6–8 weeks; glucose control"}, {"n": 4, "s": "Ceruminous glands are:", "o": ["Eccrine sweat glands", "Modified apocrine glands", "Holocrine glands", "Mucous glands", "Serous glands"], "k": "B", "x": "Modified apocrine (ceruminous) + sebaceous glands, cartilaginous canal only"}, {"n": 5, "s": "The pars flaccida lacks the:", "o": ["Outer epithelial layer", "Inner mucosal layer", "Blood supply", "Middle fibrous layer", "Sensory innervation"], "k": "D", "x": "Pars flaccida has no organised fibrous layer → retraction (Prussak's)"}, {"n": 6, "s": "The area ratio of the tympanic membrane to the stapes footplate is about:", "o": ["1.3:1", "3:1", "8:1", "25:1", "17:1"], "k": "E", "x": "Hydraulic ratio ~17:1 (Dhingra; effective area). Total middle ear gain ~25–30 dB"}, {"n": 7, "s": "The ossicular lever ratio is about:", "o": ["1.3:1", "3:1", "0.5:1", "17:1", "10:1"], "k": "A", "x": "Lever 1.3:1 → total transformer ~22:1"}, {"n": 8, "s": "The main muscle opening the eustachian tube is the:", "o": ["Levator veli palatini", "Salpingopharyngeus", "Tensor veli palatini", "Tensor tympani", "Palatoglossus"], "k": "C", "x": "Tensor veli palatini (V3). Levator elevates palate; salpingopharyngeus minor role"}, {"n": 9, "s": "Patulous eustachian tube is classically associated with:", "o": ["Obesity", "Rapid weight loss", "Adenoid hypertrophy", "Cleft palate", "Allergic rhinitis"], "k": "B", "x": "Weight loss (loss of Ostmann's fat pad), pregnancy, radiotherapy. Autophony, TM moves with breathing, relieved by lying down"}, {"n": 10, "s": "Maximum conductive hearing loss occurs when:", "o": ["The middle ear is filled with thick effusion", "The tympanic membrane is completely perforated", "The external canal is blocked by cerumen", "The ossicular chain is disrupted behind an intact TM", "Both windows are obliterated by otosclerosis"], "k": "D", "x": "(PP ENT-A Q59) — Discontinuity behind intact TM → ~55–60 dB, the maximum. Perforation alone ~10–40 dB"}, {"n": 11, "s": "The most common cause of conductive hearing loss in children is:", "o": ["Impacted wax", "Otitis media with effusion", "Acute otitis media", "Ossicular anomaly", "Chronic suppurative otitis media"], "k": "B", "x": "OME"}, {"n": 12, "s": "Acute otitis media complicated by facial palsy is best managed by:", "o": ["Facial nerve decompression", "Steroids alone", "Oral antibiotics and observation", "Mastoidectomy with decompression", "Myringotomy and IV antibiotics"], "k": "E", "x": "Facial palsy in AOM = dehiscent canal + inflammation → myringotomy ± tube, IV antibiotics. Decompression not indicated"}, {"n": 13, "s": "The most common organism in acute mastoiditis is:", "o": ["Streptococcus pneumoniae", "Pseudomonas aeruginosa", "Staphylococcus aureus", "Haemophilus influenzae", "Group A streptococcus"], "k": "A", "x": "S. pneumoniae; then GAS, S. aureus"}, {"n": 14, "s": "Tympanosclerosis primarily involves the:", "o": ["Outer epithelial layer", "Inner mucosal layer", "Annulus only", "Fibrous lamina propria", "Ossicular ligaments only"], "k": "D", "x": "Hyaline degeneration and calcification of lamina propria; usually little hearing effect unless ossicles fixed"}, {"n": 15, "s": "A Sadé grade IV pars tensa retraction is:", "o": ["Mild retraction", "Retraction touching the incus", "Adhesive otitis media", "Touching the promontory, not adherent", "An attic retraction pocket"], "k": "C", "x": "Sadé: I retracted · II touching incus/stapes · III touching promontory (atelectasis) · IV adherent (adhesive otitis)"}, {"n": 16, "s": "Regarding tympanostomy tubes, which statement is FALSE?", "o": ["Recurrent AOM is roughly halved while tubes are in situ", "OME hearing loss is reversed by tube insertion in most cases", "Benefit to hearing and infection rate extends months after extrusion", "Nearly half of children have otorrhoea while tubes are in place", "Perforation rate is <5% for grommets, higher with T-tubes"], "k": "C", "x": "(PP ENT-A Q94) — Benefit does not persist meaningfully after extrusion. Others true (T-tube perforation ~17% vs grommet ~2%)"}, {"n": 17, "s": "Advantages of intact canal wall mastoidectomy include:", "o": ["More rapid postoperative healing", "Preservation of a self-cleaning ear", "In-the-canal hearing aids well tolerated", "No limitation on water activities", "All of these"], "k": "E", "x": "(PP ENT-A Q52) — All are ICW advantages; trade-off = higher residual/recurrent disease, second look"}, {"n": 18, "s": "Compared with adults, paediatric cholesteatoma shows:", "o": ["Higher recurrence rate", "Less extensive disease", "Lower residual rate", "Rare mastoid extension", "Better ossicular status"], "k": "A", "x": "More aggressive, pneumatised mastoids, ET dysfunction → higher recurrence/residual"}, {"n": 19, "s": "The sigmoid sinus is injured during mastoidectomy; bleeding is controlled. Postoperatively the patient has visual changes and persistent headache. Which is NOT indicated?", "o": ["MRI", "MR venography", "Ophthalmology consultation", "Immediate surgical exploration", "All of these are indicated"], "k": "D", "x": "(PP ENT-B Q80) — Suspected sigmoid thrombosis/raised ICP → MRI/MRV, ophthalmology, anticoagulation discussion; not blind re-exploration"}, {"n": 20, "s": "Regarding traumatic tympanic membrane perforations:", "o": ["Urgent myringoplasty is required", "About 90% heal spontaneously", "Routine antibiotic drops are required", "Most occur in the pars flaccida", "Those >25% rarely heal"], "k": "B", "x": "~90% heal spontaneously within ~3 months; keep dry; no routine drops if clean"}, {"n": 21, "s": "The classic medical treatment for cochlear otosclerosis is:", "o": ["IV bisphosphonate", "Calcitonin", "Vitamin D", "Sodium fluoride", "Systemic steroids"], "k": "D", "x": "Sodium fluoride: stabilises active otospongiosis, slows SNHL. Bisphosphonates = newer alternative"}, {"n": 22, "s": "An absolute contraindication to stapedotomy is:", "o": ["Bilateral otosclerosis", "Only-hearing ear", "Age over 60", "Presence of Carhart's notch", "Air-bone gap of 20 dB"], "k": "B", "x": "Only-hearing ear (dead-ear risk). Active otospongiosis = relative contraindication"}, {"n": 23, "s": "Blue sclera, fragile bones and conductive hearing loss suggest:", "o": ["Paget's disease", "Crouzon syndrome", "Van der Hoeve syndrome", "Alport syndrome", "Pendred syndrome"], "k": "C", "x": "Van der Hoeve = osteogenesis imperfecta (COL1A1/2); stapes fixation or fracture"}, {"n": 24, "s": "An elderly patient has a flat audiogram with good speech discrimination. The presbycusis type is:", "o": ["Strial", "Sensory", "Neural", "Cochlear conductive", "Mixed"], "k": "A", "x": "Strial (metabolic): flat curve, good discrimination, good aid users"}, {"n": 25, "s": "Phonemic regression (discrimination disproportionately poor for the pure-tone loss) suggests which presbycusis type?", "o": ["Strial", "Sensory", "Cochlear conductive", "Metabolic", "Neural"], "k": "E", "x": "Neural: loss of spiral ganglion cells → poor discrimination; poor aid benefit"}, {"n": 26, "s": "An 85-year-old woman has difficulty hearing conversation but complains about noise made by her grandchildren. The best explanation is:", "o": ["Hypersensitivity of inner ear hair cells", "Impaired sound localisation", "Wax obstructing the canal", "Otosclerosis", "High-frequency hearing loss"], "k": "E", "x": "(PP ENT-B Q46) — High-frequency SNHL with recruitment → can't hear speech, loud sounds intolerable"}, {"n": 27, "s": "Objective clicking tinnitus is most often caused by:", "o": ["Glomus tympanicum", "Benign intracranial hypertension", "Venous hum", "Palatal myoclonus", "Carotid stenosis"], "k": "D", "x": "Palatal myoclonus (also stapedial/tensor tympani myoclonus). Pulsatile causes = vascular"}, {"n": 28, "s": "Venous hum tinnitus is abolished by:", "o": ["Exercise", "Ipsilateral internal jugular compression", "Contralateral carotid compression", "Mastoid pressure", "Tragal pressure"], "k": "B", "x": "Ipsilateral IJV compression or head turning toward the side abolishes venous hum; IIH-related"}, {"n": 29, "s": "Which has NOT been proposed as a mechanism of noise damage?", "o": ["Chronic bleeding", "Mechanical injury", "Metabolic exhaustion", "Ischaemia", "Ionic poisoning"], "k": "A", "x": "(PP ENT-A Q46) — Proposed: mechanical, metabolic exhaustion, ischaemia, ionic poisoning. Not chronic bleeding"}, {"n": 30, "s": "The most common otological injury in divers is:", "o": ["Inner ear barotrauma", "Decompression sickness", "Middle ear barotrauma", "External ear exostoses", "Perilymph fistula"], "k": "C", "x": "Middle ear barotrauma on descent (ET fails to equalise)"}, {"n": 31, "s": "Vestibular neuritis most commonly affects the:", "o": ["Superior vestibular nerve", "Inferior vestibular nerve", "Cochlear nerve", "Both divisions equally", "Facial nerve"], "k": "A", "x": "Superior division (longer bony canal) → posterior canal (inferior nerve) spared → later posterior canal BPPV possible"}, {"n": 32, "s": "Cogan syndrome comprises audiovestibular dysfunction with:", "o": ["Uveitis", "Retinitis pigmentosa", "Interstitial keratitis", "Optic neuritis", "Conjunctivitis"], "k": "C", "x": "Interstitial keratitis + Ménière's-like audiovestibular attacks; urgent steroids. Usher = retinitis pigmentosa"}, {"n": 33, "s": "The antibody associated with autoimmune inner ear disease is:", "o": ["Anti-dsDNA", "ANCA", "Anti-Ro", "Anti-HSP-70", "Anti-TPO"], "k": "D", "x": "Anti-HSP-70 (68 kD); rapidly progressive bilateral SNHL, steroid-responsive"}, {"n": 34, "s": "The most widely accepted and most likely effective treatment for sudden SNHL is:", "o": ["Antiviral drugs", "Anticoagulation", "Carbogen therapy", "Hypaque administration", "Steroid therapy"], "k": "E", "x": "(PP ENT-A Q60) — Steroids: oral or intratympanic (salvage)"}, {"n": 35, "s": "The destructive surgical procedure for Ménière's disease that preserves hearing is:", "o": ["Labyrinthectomy", "Vestibular nerve section", "Cochleosacculotomy", "Translabyrinthine neurectomy", "Cochlear neurectomy"], "k": "B", "x": "Vestibular nerve section (middle fossa/retrosigmoid): ~90–95% vertigo control, hearing preserved. Labyrinthectomy sacrifices hearing"}, {"n": 36, "s": "The utricle and saccule are connected by the:", "o": ["Cochlear aqueduct", "Ductus reuniens", "Semicircular canals", "Common crus", "Endolymphatic duct"], "k": "E", "x": "(PP ENT-B Q3) — Utriculosaccular duct joins endolymphatic duct. Trap: ductus reuniens = saccule ↔ cochlear duct"}, {"n": 37, "s": "About 95% of cochlear afferent fibres synapse with the:", "o": ["Outer hair cells", "Pillar cells", "Inner hair cells", "Deiters cells", "Hensen cells"], "k": "C", "x": "Type I afferents (~95%) → IHC; type II (~5%) → OHC"}, {"n": 38, "s": "Medial olivocochlear efferent fibres terminate mainly on the:", "o": ["Outer hair cells", "Inner hair cell afferent dendrites", "Spiral ganglion", "Stria vascularis", "Tectorial membrane"], "k": "A", "x": "Medial OC → OHC (modulate amplifier; basis of OAE suppression). Lateral OC → IHC afferent dendrites"}, {"n": 39, "s": "The human cochlea has about:", "o": ["1.5 turns", "2.0 turns", "3.5 turns", "2.75 turns", "4.5 turns"], "k": "D", "x": "2.5–2.75 turns; ~35 mm; high frequencies at base"}, {"n": 40, "s": "The defect in primary ciliary dyskinesia is in the:", "o": ["Collagen", "Dynein arms", "CFTR channel", "Keratin", "Merlin"], "k": "B", "x": "Absent/defective dynein arms; Kartagener = PCD + situs inversus; chronic OME/CSOM, sinusitis, bronchiectasis"}, {"n": 41, "s": "The longest intratemporal segment of the facial nerve is the:", "o": ["Meatal", "Labyrinthine", "Tympanic", "First genu", "Mastoid"], "k": "E", "x": "Mastoid ~13 mm > tympanic ~11 mm > meatal ~8–10 mm > labyrinthine ~3–4 mm"}, {"n": 42, "s": "The nervus intermedius does NOT carry:", "o": ["Taste fibres", "Lacrimal secretomotor fibres", "Submandibular secretomotor fibres", "Motor fibres to stapedius", "Sensory fibres to the canal"], "k": "D", "x": "Stapedius motor = main facial motor root. Intermedius: taste, secretomotor (lacrimal, submandibular, sublingual), canal sensation"}, {"n": 43, "s": "Hyperacusis in facial palsy is due to paralysis of the:", "o": ["Tensor tympani", "Stapedius", "Cochlear efferents", "Chorda tympani", "Greater petrosal nerve"], "k": "B", "x": "Stapedius (VII) paralysis → loss of reflex damping. Tensor tympani = V3"}, {"n": 44, "s": "The second branchial arch gives rise to the:", "o": ["IXth cranial nerve", "Semilunar ganglion (V3)", "Geniculate ganglion (VII)", "Recurrent laryngeal nerve", "Cochlear nerve"], "k": "C", "x": "(PP ENT-B Q81) — Second arch nerve = VII (geniculate ganglion). First arch = V3; third = IX; 4th/6th = X"}, {"n": 45, "s": "The vestibular surface of the stapes footplate derives from the:", "o": ["Otic capsule", "First arch", "Second arch", "Third arch", "Neural crest only"], "k": "A", "x": "Vestibular part of footplate + annular ligament = otic capsule; rest of stapes = second arch (Reichert's)"}, {"n": 46, "s": "The tragus derives from the:", "o": ["Second arch", "First arch", "Third arch", "First cleft", "Otic placode"], "k": "B", "x": "Hillocks 1–3 (first arch): tragus, helical crus, helix; 4–6 (second arch): antihelix, antitragus, lobule"}, {"n": 47, "s": "Gellé's test is negative in:", "o": ["Otosclerosis", "Ossicular discontinuity", "Normal ear", "SNHL", "Bell's palsy"], "k": "A", "x": "Gellé: pressure in canal normally reduces BC loudness; no change (negative) = fixed chain"}, {"n": 48, "s": "Schwabach's test is prolonged in:", "o": ["SNHL", "Presbycusis", "Noise-induced loss", "Normal hearing", "Conductive hearing loss"], "k": "E", "x": "Schwabach prolonged in CHL, shortened in SNHL"}, {"n": 49, "s": "The Bing test is negative (no change on occlusion) in:", "o": ["Normal ear", "SNHL", "Presbycusis", "Conductive hearing loss", "Non-organic loss"], "k": "D", "x": "Bing negative = no occlusion effect = CHL. Positive in normal/SNHL"}, {"n": 50, "s": "For which condition is MRI NOT the imaging modality of choice?", "o": ["Sensorineural hearing loss", "Intracranial meningeal disease", "Conductive hearing loss", "Perineural spread of tumour", "Labyrinthitis"], "k": "C", "x": "(PP ENT-A Q65) — CHL → high-resolution CT (bony anatomy, ossicles)"}]}, {"c": 0, "t": "Session 5", "d": "Clinical otology vignettes", "q": [{"n": 1, "s": "A 4-year-old with AOM has a fluctuant postauricular swelling and a protruding pinna. CT shows coalescence and a subperiosteal abscess. Management is:", "o": ["Oral antibiotics and review in 48 hours", "IV antibiotics, myringotomy and cortical mastoidectomy", "Needle aspiration only", "Radical mastoidectomy", "IV antibiotics alone for 6 weeks"], "k": "B", "x": "Subperiosteal abscess = surgical: IV antibiotics + myringotomy/tube + cortical mastoidectomy (some centres: abscess drainage first)"}, {"n": 2, "s": "A 14-month-old has bilateral AOM with mild otalgia and fever of 38.2 °C. Best management is:", "o": ["Observation for 72 hours", "Topical antibiotic drops", "Tympanostomy tubes", "Oral azithromycin", "High-dose oral amoxicillin"], "k": "E", "x": "AAP: 6–23 months with bilateral AOM → antibiotics; amoxicillin 80–90 mg/kg/day. Observation option only for unilateral non-severe"}, {"n": 3, "s": "A child with AOM has a history of anaphylaxis to penicillin. The appropriate antibiotic is:", "o": ["Azithromycin", "Cefuroxime", "Amoxicillin-clavulanate", "Cefdinir", "Ceftriaxone"], "k": "A", "x": "Type I (anaphylaxis) → macrolide or clindamycin; avoid cephalosporins. Non-type I → cefdinir/cefuroxime"}, {"n": 4, "s": "A 3-year-old has had 4 episodes of AOM in 6 months. Tympanostomy tubes are indicated if:", "o": ["Parents request them", "The tympanogram is Type A", "Episodes respond to antibiotics", "Middle ear effusion is present at assessment", "Adenoids are large on X-ray"], "k": "D", "x": "AAP: tubes for recurrent AOM (≥3 in 6 months or ≥4 in 12) only if effusion present at assessment"}, {"n": 5, "s": "A 55-year-old man has new unilateral otitis media with effusion. The essential next step is:", "o": ["Grommet insertion", "Nasal steroid trial", "Nasopharyngoscopy", "Autoinflation", "Repeat tympanometry in 3 months"], "k": "C", "x": "Adult unilateral OME = nasopharyngeal carcinoma until proven otherwise → endoscopy ± biopsy, MRI"}, {"n": 6, "s": "A 6-year-old with Down syndrome has persistent bilateral OME with 35 dB hearing loss. The preferred first option is:", "o": ["Hearing aids", "Adenoidectomy", "Long-term antibiotics", "T-tubes", "Watchful waiting for 1 year"], "k": "A", "x": "Down syndrome: narrow canals, high tube complication/re-insertion rates → hearing aids preferred (NICE)"}, {"n": 7, "s": "A 30-year-old has a dry central perforation for 2 years with a 25 dB conductive loss. Management is:", "o": ["Mastoidectomy", "Topical steroid drops", "Hearing aid only", "Myringoplasty", "Ossiculoplasty with prosthesis"], "k": "D", "x": "Dry, no cholesteatoma → type I tympanoplasty (myringoplasty), temporalis fascia"}, {"n": 8, "s": "A cholesteatoma is found eroding the lateral canal with a large fistula in an only-hearing ear. Best management of the matrix over the fistula is:", "o": ["Complete removal at first stage", "Leave matrix and exteriorise (canal wall down)", "Remove and plug with bone dust", "Laser vaporisation of matrix", "Labyrinthectomy"], "k": "B", "x": "Large fistula / only-hearing ear → leave matrix, exteriorise in CWD cavity. Small fistula in good-hearing ear → remove at end of case and cover"}, {"n": 9, "s": "A 3-year-old with grommets develops painless purulent otorrhoea. First-line treatment is:", "o": ["Oral amoxicillin", "Tube removal", "IV antibiotics", "Water precautions only", "Topical quinolone drops"], "k": "E", "x": "Uncomplicated tube otorrhoea → topical quinolone (better than oral antibiotics, no ototoxicity)"}, {"n": 10, "s": "A patient with chronic otorrhoea develops fever, headache, vomiting and papilloedema. The next step is:", "o": ["Lumbar puncture", "Oral antibiotics", "Contrast-enhanced CT or MRI", "Mastoidectomy immediately", "EEG"], "k": "C", "x": "Suspected intracranial complication → contrast imaging first; LP contraindicated if abscess/raised ICP (coning)"}, {"n": 11, "s": "The most common site of otogenic brain abscess is the:", "o": ["Frontal lobe", "Occipital lobe", "Brainstem", "Temporal lobe", "Parietal lobe"], "k": "D", "x": "Temporal lobe (via tegmen), then cerebellum (via Trautmann's triangle)"}, {"n": 12, "s": "A child with mastoiditis has spiking \"picket-fence\" fever, rigors and tenderness along the sternocleidomastoid. The diagnosis is:", "o": ["Lateral sinus thrombosis", "Bezold abscess", "Meningitis", "Extradural abscess", "Labyrinthitis"], "k": "A", "x": "LST: picket-fence fever, Griesinger's sign, cord-like IJV tenderness"}, {"n": 13, "s": "Otogenic lateral sinus thrombosis is managed by:", "o": ["Anticoagulation alone", "Ligation of the internal jugular vein", "Mastoidectomy and IV antibiotics ± anticoagulation", "Sinus thrombectomy routinely", "Oral antibiotics only"], "k": "C", "x": "Mastoidectomy, expose sinus, IV antibiotics; anticoagulation increasingly used. IJV ligation only for septic emboli"}, {"n": 14, "s": "A child with AOM develops severe vertigo and profound SNHL in the affected ear. The diagnosis is:", "o": ["Serous labyrinthitis", "Vestibular neuritis", "Perilymph fistula", "BPPV", "Suppurative labyrinthitis"], "k": "E", "x": "Suppurative: profound permanent SNHL + vertigo. Serous: partial, reversible"}, {"n": 15, "s": "A 70-year-old diabetic has severe otalgia and granulation tissue on the floor of the canal at the bony-cartilaginous junction. Biopsy is mandatory to exclude:", "o": ["Tuberculosis", "Squamous cell carcinoma", "Fungal infection", "Cholesteatoma", "Wegener's granulomatosis"], "k": "B", "x": "Granulation in MOE-like picture → biopsy to exclude SCC of EAC; also culture"}, {"n": 16, "s": "A patient with acute otitis externa has a canal so swollen that drops cannot enter. Management is:", "o": ["Oral antibiotics", "Insert a wick and apply drops", "Syringe the canal", "Incision and drainage", "IV antibiotics"], "k": "B", "x": "Wick (Pope) + drops; aural toilet"}, {"n": 17, "s": "Otitis externa with an uncertain tympanic membrane status should be treated with:", "o": ["Gentamicin drops", "Neomycin-polymyxin drops", "Alcohol drops", "Acetic acid alone", "Ofloxacin drops"], "k": "E", "x": "Unknown/perforated TM → non-ototoxic quinolone (ofloxacin/ciprofloxacin). Avoid aminoglycosides"}, {"n": 18, "s": "A child has a button battery in the external canal. Management is:", "o": ["Irrigation with warm water", "Observation for spontaneous extrusion", "Topical drops then removal next day", "Urgent removal without irrigation", "Mineral oil instillation"], "k": "D", "x": "Battery: urgent removal (current + caustic necrosis within hours); no irrigation (electrolyte fluid worsens injury)"}, {"n": 19, "s": "A patient presents on day 2 of an isolated, complete Bell's palsy. Best treatment is:", "o": ["Oral prednisolone", "Antiviral alone", "Facial nerve decompression", "Observation only", "Hyperbaric oxygen"], "k": "A", "x": "Prednisolone within 72 hours; antiviral add-on optional, not alone"}, {"n": 20, "s": "A wrestler has a tense auricular haematoma for 2 days. Management is:", "o": ["Ice packs and observation", "Oral antibiotics only", "Drainage and bolster dressing", "Delayed excision at 6 weeks", "Steroid injection"], "k": "C", "x": "Incision/aspiration + bolster/through-and-through sutures → prevents cauliflower ear; antistaphylococcal/pseudomonal cover"}, {"n": 21, "s": "A patient pushes a cotton bud into the ear and develops a perforation with vertigo and SNHL. Management is:", "o": ["Observation for 3 months", "Topical antibiotic drops", "Oral steroids only", "Myringoplasty at 6 weeks", "Urgent middle ear exploration"], "k": "E", "x": "Vertigo + SNHL after penetrating injury = stapes subluxation/perilymph fistula → urgent exploration"}, {"n": 22, "s": "A temporal bone fracture causes immediate complete facial palsy with a dead ear. The approach for full nerve exposure is:", "o": ["Middle cranial fossa", "Transmastoid alone", "Translabyrinthine", "Retrosigmoid", "Transcanal"], "k": "C", "x": "Dead ear: translabyrinthine gives total intratemporal exposure. Hearing preserved: middle fossa + transmastoid"}, {"n": 23, "s": "Facial palsy appears 3 days after a temporal bone fracture. Management is:", "o": ["Steroids and observation", "Immediate decompression", "Nerve grafting", "Hypoglossal–facial transfer", "ENoG within 24 hours, then surgery"], "k": "A", "x": "Delayed onset (nerve in continuity) → excellent prognosis; steroids, observe"}, {"n": 24, "s": "CSF otorrhoea after a temporal bone fracture persists after 1 week of bed rest and head elevation. The next step is:", "o": ["Prophylactic antibiotics", "Lumbar drain", "Middle fossa repair", "Observation for 6 weeks", "Myringotomy"], "k": "B", "x": "Persistent leak → lumbar drain; surgical repair if persists despite drain (~7–14 days)"}, {"n": 25, "s": "The essential investigation in unilateral sudden SNHL is:", "o": ["CT temporal bone", "Viral serology", "Coagulation profile", "MRI of internal auditory canals", "Carotid Doppler"], "k": "D", "x": "MRI IAC with gadolinium (VS in ~1–5% of SSNHL)"}, {"n": 2
