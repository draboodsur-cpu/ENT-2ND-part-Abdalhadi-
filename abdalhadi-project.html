 (with entorhinal cortex, amygdala); olfaction bypasses the thalamus initially"}, {"n": 38, "s": "Perceiving a smell when no odour is present is:", "o": ["Phantosmia", "Parosmia", "Hyposmia", "Hyperosmia", "Cacosmia"], "k": "A", "x": "Phantosmia = smell without stimulus; parosmia = distorted perception of a real odour; cacosmia = unpleasant smell"}, {"n": 39, "s": "Smell loss may precede motor signs in:", "o": ["Myasthenia gravis", "Multiple sclerosis", "Bell's palsy", "Parkinson's disease", "Guillain-Barré syndrome"], "k": "D", "x": "Hyposmia precedes motor Parkinson's by years; also early in Alzheimer's"}, {"n": 40, "s": "Unilateral choanal atresia typically presents with:", "o": ["Cyanosis at birth", "Cyclical neonatal apnoea", "Unilateral discharge later", "Feeding failure in the neonate", "Stridor"], "k": "C", "x": "Unilateral atresia: unilateral discharge and obstruction in later childhood; bilateral presents at birth"}, {"n": 41, "s": "The commonest side effect of intranasal corticosteroids is:", "o": ["Cataract", "Adrenal suppression", "Septal perforation", "Growth delay", "Epistaxis"], "k": "E", "x": "Epistaxis/local irritation (~5–10%); systemic effects rare at standard doses"}, {"n": 42, "s": "A recognised side effect of dupilumab is:", "o": ["Sensorineural hearing loss", "Conjunctivitis", "Hypertension", "Hypoglycaemia", "Alopecia"], "k": "B", "x": "Conjunctivitis/keratitis and transient eosinophilia"}, {"n": 43, "s": "The anterior ethmoidal artery arises from the:", "o": ["Ophthalmic artery", "Maxillary artery", "Facial artery", "Sphenopalatine artery", "Superficial temporal artery"], "k": "A", "x": "Ophthalmic artery (ICA system) — why ethmoidal bleeds don't respond to ECA ligation or embolisation"}, {"n": 44, "s": "A supraorbital ethmoid cell may be mistaken on CT for a:", "o": ["Haller cell", "Pneumatised crista galli", "Onodi cell", "Septated frontal sinus", "Frontal sinus mucocele"], "k": "D", "x": "Supraorbital ethmoid cell pneumatises over the orbit behind the frontal sinus → mimics a septated frontal sinus; cause of missed disease"}, {"n": 45, "s": "Vidian neurectomy has been used to treat:", "o": ["Allergic fungal sinusitis", "Nasal polyposis", "Recurrent epistaxis", "Anosmia", "Vasomotor rhinitis"], "k": "E", "x": "Vidian neurectomy reduces parasympathetic secretion in intractable vasomotor rhinitis"}, {"n": 46, "s": "Isolated smell loss with a clear nasal airway warrants examination of the:", "o": ["Inferior meatus", "Olfactory cleft", "Nasal vestibule", "Maxillary sinus", "Nasopharynx"], "k": "B", "x": "Olfactory cleft disease (polyps, mucosal oedema) on endoscopy/CT"}, {"n": 47, "s": "During uncinectomy, a hypoplastic maxillary sinus increases the risk of:", "o": ["Orbital injury", "CSF leak", "Carotid injury", "Optic neuropathy", "Dental numbness"], "k": "A", "x": "Hypoplastic sinus → lateralised uncinate abutting the lamina → orbital penetration risk"}, {"n": 48, "s": "The septal deviation most likely to cause obstruction is:", "o": ["Posterior bony spur", "Superior deviation", "Vomerine ridge", "Anterior caudal deviation", "Sphenoid rostrum deviation"], "k": "D", "x": "Anterior/caudal deviations at the valve have most effect (narrowest segment)"}, {"n": 49, "s": "Stripping sinus mucosa during surgery leads to:", "o": ["Faster healing", "Better long-term drainage", "Loss of ciliary clearance", "Lower polyp recurrence", "Improved smell"], "k": "C", "x": "Mucosal stripping → fibrosis, osteitis, loss of mucociliary clearance → recurrent disease; mucosal preservation is key"}, {"n": 50, "s": "Changes in nasal physiology associated with aging include:", "o": ["Reduction in nasal cilia", "Increase in mucociliary clearance", "Decrease in olfactory epithelium", "Decrease in nasal airflow resistance", "General decrease in autonomic function"], "k": "C", "x": "(PP ENT-A Q96) ⚠ — Ageing: olfactory epithelium replaced by respiratory epithelium (hyposmia), slower mucociliary clearance, increased resistance; ciliary number largely preserved"}]}, {"c": 2, "t": "Session 1", "d": "Anatomy, Embryology, Physiology, Voice Assessment", "q": [{"n": 1, "s": "The adult larynx lies opposite the vertebrae:", "o": ["C1–C2", "C2–C4", "C3–C6", "C6–T1", "T1–T3"], "k": "C", "x": "Adult C3–C6; infant C2–C4 (higher, allowing simultaneous breathing and suckling)"}, {"n": 2, "s": "The only complete cartilaginous ring of the airway is the:", "o": ["Thyroid cartilage", "First tracheal ring", "Hyoid bone", "Epiglottis", "Cricoid cartilage"], "k": "E", "x": "Cricoid: only complete ring → narrowest fixed point in children; oedema here is dangerous"}, {"n": 3, "s": "In adult males, the thyroid laminae meet at an angle of about:", "o": ["90°", "120°", "150°", "60°", "180°"], "k": "A", "x": "Male ~90° (Adam's apple, longer folds, lower pitch); female ~120°"}, {"n": 4, "s": "The vocal ligament attaches posteriorly to the arytenoid:", "o": ["Muscular process", "Apex", "Base", "Vocal process", "Corniculate tip"], "k": "D", "x": "Vocal process (anterior); muscular process (lateral) receives PCA and LCA"}, {"n": 5, "s": "The cuneiform cartilage is also called the cartilage of:", "o": ["Santorini", "Wrisberg", "Luschka", "Morgagni", "Reinke"], "k": "B", "x": "Cuneiform = Wrisberg; corniculate = Santorini (both in the aryepiglottic fold)"}, {"n": 6, "s": "The only abductor of the vocal folds is the:", "o": ["Lateral cricoarytenoid", "Transverse interarytenoid", "Thyroarytenoid", "Cricothyroid", "Posterior cricoarytenoid"], "k": "E", "x": "PCA is the only abductor; bilateral PCA paralysis → airway obstruction"}, {"n": 7, "s": "The cricothyroid muscle is supplied by the:", "o": ["Recurrent laryngeal nerve", "Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve"], "k": "C", "x": "External branch of SLN → cricothyroid (tensor, raises pitch); all other intrinsic muscles → RLN"}, {"n": 8, "s": "The only unpaired intrinsic laryngeal muscle is the:", "o": ["Transverse arytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Thyroarytenoid", "Lateral cricoarytenoid"], "k": "A", "x": "Transverse (inter)arytenoid: unpaired, bilateral RLN supply; adducts posterior glottis"}, {"n": 9, "s": "The internal laryngeal nerve enters the larynx through the:", "o": ["Cricothyroid membrane", "Cricotracheal membrane", "Quadrangular membrane", "Thyrohyoid membrane", "Conus elasticus"], "k": "D", "x": "Internal laryngeal nerve + superior laryngeal artery pierce the thyrohyoid membrane"}, {"n": 10, "s": "Sensation below the vocal folds is carried by the:", "o": ["Internal laryngeal nerve", "External laryngeal nerve", "Pharyngeal plexus of vagus", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "k": "E", "x": "RLN: sensation below the folds; internal laryngeal nerve: above the folds"}, {"n": 11, "s": "The left recurrent laryngeal nerve loops around the:", "o": ["Subclavian artery", "Aortic arch", "Brachiocephalic trunk", "Common carotid artery", "Inferior thyroid artery"], "k": "B", "x": "Left RLN under aortic arch (lateral to ligamentum arteriosum) → longer course, more vulnerable (thoracic disease); right RLN around subclavian"}, {"n": 12, "s": "A non-recurrent laryngeal nerve occurs:", "o": ["On the left side", "Bilaterally", "On the right side", "With a cervical rib", "After thyroidectomy"], "k": "C", "x": "Right non-recurrent nerve (~0.5–1%) with aberrant right subclavian (arteria lusoria); left only with situs inversus/right arch"}, {"n": 13, "s": "Galen's anastomosis connects the internal laryngeal nerve with the:", "o": ["External laryngeal nerve", "Pharyngeal plexus branches", "Phrenic nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "k": "E", "x": "Galen's anastomosis: internal SLN to posterior branch of RLN"}, {"n": 14, "s": "Pre-epiglottic space invasion stages a supraglottic cancer as at least:", "o": ["T3", "T1", "T2", "T4b", "Tis"], "k": "A", "x": "Pre-epiglottic or paraglottic space invasion, minor thyroid cartilage erosion, or postcricoid involvement = T3"}, {"n": 15, "s": "The paraglottic space lies:", "o": ["Anterior to the hyoid", "Within Reinke's space", "Above the epiglottic tip", "Lateral to the ventricle", "Below the cricoid"], "k": "D", "x": "Paraglottic space: lateral to ventricle/folds, deep to thyroid lamina; route for transglottic spread"}, {"n": 16, "s": "Reinke's space corresponds to the:", "o": ["Vocalis muscle", "Superficial lamina propria", "Vocal ligament", "Epithelium", "Intermediate lamina propria"], "k": "B", "x": "Superficial lamina propria (loose, gelatinous) → Reinke's oedema"}, {"n": 17, "s": "In the body-cover model, the cover consists of:", "o": ["Vocalis and vocal ligament", "Deep and intermediate layers", "Epithelium and Reinke's space", "Thyroarytenoid muscle and fascia", "Perichondrium"], "k": "C", "x": "Hirano: cover = epithelium + SLP (Reinke's); transition = vocal ligament (ILP + DLP); body = vocalis"}, {"n": 18, "s": "The free edge of the true vocal fold is covered by:", "o": ["Ciliated columnar", "Keratinised squamous", "Simple cuboidal", "Pseudostratified ciliated columnar", "Non-keratinised squamous"], "k": "E", "x": "Free edge: non-keratinised stratified squamous (vibratory surface); rest of larynx respiratory epithelium"}, {"n": 19, "s": "The membranous glottis forms about the:", "o": ["Anterior three-fifths", "Posterior three-fifths", "Anterior one-fifth", "Entire glottis", "Posterior one-half"], "k": "A", "x": "Membranous (vibratory) anterior 3/5; cartilaginous posterior 2/5 (respiratory)"}, {"n": 20, "s": "A laryngocele arises from the:", "o": ["Pyriform sinus", "Vallecula", "Pre-epiglottic space", "Laryngeal saccule", "Thyrohyoid bursa"], "k": "D", "x": "Saccule/appendix of ventricle: internal, external (through thyrohyoid membrane) or combined; exclude saccular tumour"}, {"n": 21, "s": "A barrier to subglottic spread of glottic cancer is the:", "o": ["Quadrangular membrane", "Thyrohyoid membrane", "Hyoepiglottic ligament", "Vestibular fold", "Conus elasticus"], "k": "E", "x": "Conus elasticus (cricovocal membrane) resists subglottic spread; also the thyroglottic ligament region"}, {"n": 22, "s": "The quadrangular membrane lies within the:", "o": ["Vocal folds", "Aryepiglottic folds", "Subglottis", "Cricothyroid membrane", "Thyrohyoid space"], "k": "B", "x": "Quadrangular membrane: aryepiglottic folds superiorly; free lower edge = vestibular ligament (false fold)"}, {"n": 23, "s": "Broyles' ligament is located at the:", "o": ["Posterior commissure", "Arytenoid apex", "Anterior commissure", "Hyoid body", "Cricoid arch"], "k": "C", "x": "Anterior commissure tendon: lacks perichondrium → route for cartilage invasion"}, {"n": 24, "s": "The Delphian node belongs to which nodal group?", "o": ["Prelaryngeal", "Retropharyngeal", "Mediastinal", "Supraclavicular", "Submental"], "k": "A", "x": "Prelaryngeal (cricothyroid) node; involvement → poorer prognosis (subglottic/transglottic spread)"}, {"n": 25, "s": "The superior laryngeal artery arises from the:", "o": ["Lingual artery", "Facial artery", "Inferior thyroid artery", "Ascending pharyngeal artery", "Superior thyroid artery"], "k": "E", "x": "Superior laryngeal artery from superior thyroid; inferior laryngeal from inferior thyroid"}, {"n": 26, "s": "A congenital laryngeal web results from failed:", "o": ["Fusion of arytenoids", "Descent of thyroid", "Tracheoesophageal separation", "Recanalisation of larynx", "Closure of the foramen caecum"], "k": "D", "x": "Failed recanalisation (~week 10) → web (most anterior glottic) or atresia; anterior webs associated with 22q11 deletion"}, {"n": 27, "s": "The epiglottis develops from the:", "o": ["First arch", "Hypobranchial eminence", "Lateral lingual swellings", "Thyroid diverticulum", "Second arch"], "k": "B", "x": "Epiglottis from the hypobranchial eminence (3rd/4th arch mesenchyme); arytenoids from 6th arch region"}, {"n": 28, "s": "The recurrent laryngeal nerve is the nerve of the:", "o": ["First arch", "Second arch", "Sixth arch", "Third arch", "Fourth arch"], "k": "C", "x": "RLN = 6th arch; SLN = 4th arch"}, {"n": 29, "s": "Vocal fold closure during each phonatory cycle is aided by the:", "o": ["Doppler effect", "Coriolis effect", "Venturi stenosis", "Hering-Breuer reflex", "Bernoulli effect"], "k": "E", "x": "Myoelastic-aerodynamic theory: subglottic pressure opens, elastic recoil + Bernoulli negative pressure close"}, {"n": 30, "s": "The average adult male speaking fundamental frequency is about:", "o": ["120 Hz", "220 Hz", "500 Hz", "60 Hz", "1000 Hz"], "k": "A", "x": "Male ~100–130 Hz; female ~200–230 Hz; child ~300 Hz"}, {"n": 31, "s": "Vocal loudness is increased mainly by:", "o": ["Cricothyroid contraction", "Vocal fold lengthening", "Subglottic pressure", "Laryngeal lowering", "Pharyngeal widening"], "k": "C", "x": "Loudness ∝ subglottic pressure (and glottal resistance); pitch mainly via cricothyroid lengthening"}, {"n": 32, "s": "The mucosal wave is best assessed by:", "o": ["Flexible laryngoscopy", "Stroboscopy", "CT larynx", "EMG", "Mirror examination"], "k": "B", "x": "Stroboscopy visualises the mucosal wave (lost in scar, sulcus, invasive carcinoma)"}, {"n": 33, "s": "Laryngeal stroboscopy relies on:", "o": ["Doppler shift", "Bernoulli principle", "Piezoelectric effect", "Fourier analysis", "Talbot's law"], "k": "E", "x": "Talbot's law: images persist ~0.2 s on the retina → apparent slow motion"}, {"n": 34, "s": "The afferent limb of the laryngeal adductor reflex is the:", "o": ["Recurrent laryngeal nerve", "Glossopharyngeal nerve", "External laryngeal nerve", "Internal laryngeal nerve", "Hypoglossal nerve"], "k": "D", "x": "Afferent internal SLN → brainstem → bilateral RLN efferent adduction (protective); laryngospasm is its exaggerated form"}, {"n": 35, "s": "During swallowing, the first level of laryngeal closure is the:", "o": ["True vocal folds", "False vocal folds", "Epiglottis", "Aryepiglottic folds", "Cricopharyngeus"], "k": "A", "x": "Closure inferior to superior: true folds → false folds → epiglottic tilt with laryngeal elevation"}, {"n": 36, "s": "Maximum phonation time is considered abnormal below:", "o": ["30 s", "20 s", "10 s", "25 s", "40 s"], "k": "C", "x": "<10 s abnormal (normal ~15–25 s women, ~25–35 s men)"}, {"n": 37, "s": "An s/z ratio above 1.4 suggests:", "o": ["Normal voice", "Glottic pathology", "Respiratory weakness", "Hearing loss", "Psychogenic voice"], "k": "B", "x": "s/z >1.4: phonatory (glottic) inefficiency; ~1.0 normal; both short = respiratory"}, {"n": 38, "s": "Jitter is a measure of:", "o": ["Amplitude variation", "Noise energy", "Airflow", "Mean subglottic pressure", "Frequency perturbation"], "k": "E", "x": "Jitter = cycle-to-cycle frequency perturbation; shimmer = amplitude perturbation; HNR = noise"}, {"n": 39, "s": "The GRBAS scale is a:", "o": ["Perceptual voice rating", "Patient questionnaire", "Stroboscopic score", "Swallowing safety scale", "Acoustic measure"], "k": "A", "x": "Grade, Roughness, Breathiness, Asthenia, Strain (0–3 each)"}, {"n": 40, "s": "The VHI-10 is a:", "o": ["Clinician perceptual rating", "Acoustic measure", "Aerodynamic test", "Patient-reported index", "Stroboscopic grading"], "k": "D", "x": "Voice Handicap Index-10: patient-reported; >11 abnormal"}, {"n": 41, "s": "The vertical height of the adult cricothyroid membrane is about:", "o": ["2 mm", "30 mm", "10 mm", "50 mm", "1 mm"], "k": "C", "x": "~10 mm height, ~25 mm width → cricothyroidotomy site; cricothyroid arteries at superior border"}, {"n": 42, "s": "The cricoarytenoid joint is a:", "o": ["Synovial joint", "Fibrous joint", "Cartilaginous joint", "Syndesmosis", "Suture"], "k": "A", "x": "Synovial: rocking, gliding, rotation; fixation by arthritis (RA), intubation trauma"}, {"n": 43, "s": "Superior laryngeal nerve palsy typically causes:", "o": ["Aphonia", "Loss of high pitch", "Stridor", "Aspiration pneumonia", "Complete fold immobility"], "k": "B", "x": "External SLN palsy: loss of high pitch, vocal fatigue, posterior glottis rotates toward the paralysed side"}, {"n": 44, "s": "Respiratory dead space, i.e. the volume from the nose and mouth down to the alveoli, is about:", "o": ["75 ml", "150 ml", "350 ml", "450 ml", "550 ml"], "k": "B", "x": "(PP ENT-B Q8) — Anatomical dead space ~150 mL (~2 mL/kg); tracheostomy reduces it"}, {"n": 45, "s": "A 38-year-old woman had subtotal thyroidectomy. After extubation she has difficulty breathing and stridor. You suspect paralysis of the main abductor of the larynx, the posterior cricoarytenoid. Which nerve was most likely damaged?", "o": ["Phrenic", "External laryngeal", "Internal laryngeal", "Recurrent laryngeal", "Superior laryngeal"], "k": "D", "x": "(PP ENT-B Q44) — RLN supplies PCA; bilateral RLN injury → bilateral abductor paralysis → stridor"}, {"n": 46, "s": "Where does the recurrent laryngeal nerve enter the laryngeal framework?", "o": ["Deep to the inferior thyroid artery", "Lateral to the inferior constrictor muscle", "Between the arch of the cricoid cartilage and the inferior cornu of the thyroid cartilage", "Through the cricothyroid muscle"], "k": "C", "x": "(PP ENT-B Q70) — RLN enters behind the cricothyroid joint (inferior cornu), deep to inferior constrictor fibres"}, {"n": 47, "s": "What are the embryologic origins of the laryngeal cartilages?", "o": ["First branchial arch", "Second branchial arch", "Third branchial arch", "Fourth, fifth and sixth branchial arches"], "k": "D", "x": "(PP ENT-B Q100) — Thyroid (4th), cricoid and arytenoids (6th; 5th rudimentary); epiglottis from hypobranchial eminence"}, {"n": 48, "s": "Which of the following regarding lymphatic drainage is true?", "o": ["The supraglottis has a more extensive lymphatic network than the glottis", "The subglottic lymphatics drain exclusively to the paratracheal nodes", "The supraglottic lymphatics only drain to the jugulodigastric nodes", "The false vocal folds are devoid of lymphatics", "None of the above"], "k": "A", "x": "(PP ENT-A Q33) — Supraglottis rich, bilateral drainage → high nodal rate; glottis sparse → early glottic cancer rarely metastasises"}, {"n": 49, "s": "Laryngospasm is more likely to occur in a patient who is:", "o": ["Hypoxic", "Hypercarbic", "Acidotic", "Lightly anesthetized", "Deeply anesthetized"], "k": "D", "x": "(PP ENT-A Q28 / ENT-B Q62, recycled) — Light anaesthesia (stage II) — airway stimulated before adequate depth"}, {"n": 50, "s": "During mediastinoscopy, biopsy of a node at the origin of the right main bronchus is followed by profuse dark bleeding. This suggests damage to the:", "o": ["Superior vena cava", "Azygos vein", "Right pulmonary artery", "Subclavian vein", "Innominate vein"], "k": "B", "x": "(PP ENT-B Q36) — Azygos vein arches over the right main bronchus → dark venous bleeding; pack and control"}]}, {"c": 2, "t": "Session 2", "d": "Benign Lesions, Laryngitis, Paralysis, Phonosurgery, Neurological Voice", "q": [{"n": 1, "s": "Vocal fold nodules typically occur at the:", "o": ["Vocal process", "Mid-membranous fold", "Anterior commissure", "Ventricle", "Subglottis"], "k": "B", "x": "Junction of anterior and middle thirds of the membranous fold (maximal impact); bilateral, symmetrical; women, children, voice users"}, {"n": 2, "s": "First-line treatment for vocal fold nodules is:", "o": ["Microlaryngoscopy", "Steroid injection", "Laser excision", "Voice therapy", "Proton pump inhibitor"], "k": "D", "x": "Voice therapy (vocal hygiene, technique) — most resolve; surgery only for persistent fibrotic nodules"}, {"n": 3, "s": "A unilateral haemorrhagic fold lesion appearing after shouting is most likely a:", "o": ["Polyp", "Nodule", "Cyst", "Papilloma", "Granuloma"], "k": "A", "x": "Polyp: unilateral, often haemorrhagic/gelatinous, after acute phonotrauma; microflap excision"}, {"n": 4, "s": "A benign lesion that typically fails voice therapy and needs microflap excision is a:", "o": ["Nodule", "Oedema of overuse", "Reflux pseudosulcus", "Phonotraumatic swelling", "Intracordal cyst"], "k": "E", "x": "Intracordal cysts (epidermoid/mucous retention) don't regress with therapy → microflap excision preserving SLP"}, {"n": 5, "s": "The strongest risk factor for Reinke's oedema is:", "o": ["Reflux", "Allergy", "Smoking", "Singing", "Hypothyroidism"], "k": "C", "x": "Smoking (nearly all patients); also hypothyroidism, LPR, voice abuse; low-pitched voice in women"}, {"n": 6, "s": "Sulcus vocalis involves loss of the:", "o": ["Superficial lamina propria", "Vocalis muscle", "Thyroid lamina perichondrium", "Arytenoid cartilage", "Cricoarytenoid joint"], "k": "A", "x": "Sulcus: invagination with loss/adherence of SLP to the ligament → stiff, absent mucosal wave"}, {"n": 7, "s": "Initial treatment of a vocal process contact granuloma is:", "o": ["Laser excision", "Cold-steel excision", "Low-dose radiotherapy to larynx", "Tracheostomy", "Reflux and voice therapy"], "k": "E", "x": "Contact granuloma: antireflux (PPI) + voice therapy ± botulinum; surgery recurs if cause untreated"}, {"n": 8, "s": "Recurrent respiratory papillomatosis is caused mainly by HPV types:", "o": ["16 and 18", "6 and 11", "31 and 33", "1 and 2", "45 and 52"], "k": "B", "x": "HPV 6 and 11 (low-risk); HPV 11 more aggressive"}, {"n": 9, "s": "The most aggressive course of RRP is seen in:", "o": ["Adult-onset men", "Elderly women", "Smokers", "Juvenile-onset disease", "Immunised young adults"], "k": "D", "x": "Juvenile-onset (often <5 years): frequent surgeries, distal spread"}, {"n": 10, "s": "The surgical aim in RRP is to:", "o": ["Achieve wide margins", "Perform early tracheostomy", "Debulk and preserve function", "Strip both vocal folds fully", "Irradiate the larynx"], "k": "C", "x": "Debulking (microdebrider, CO2/KTP laser) preserving function; avoid tracheostomy (distal seeding) and scarring"}, {"n": 11, "s": "An adjuvant systemic therapy for aggressive RRP is:", "o": ["Methotrexate", "Cisplatin", "Radiotherapy", "Isoniazid", "Bevacizumab"], "k": "E", "x": "Systemic bevacizumab (anti-VEGF); intralesional cidofovir historically; HPV vaccine as adjuvant"}, {"n": 12, "s": "Primary prevention of juvenile-onset RRP is best achieved by:", "o": ["Elective caesarean section", "HPV vaccination", "Neonatal acyclovir", "Antenatal steroids", "Maternal antibiotics"], "k": "B", "x": "HPV vaccination (Gardasil) prevents genital condylomata → falling juvenile RRP; caesarean not recommended routinely"}, {"n": 13, "s": "Laryngeal leukoplakia should be managed by:", "o": ["Observation only", "Antifungal therapy", "Excision biopsy", "Radiotherapy", "Antireflux alone"], "k": "C", "x": "Leukoplakia is a clinical description; excisional biopsy grades dysplasia (risk of malignancy rises with grade)"}, {"n": 14, "s": "Acute vocal fold haemorrhage in a singer is managed with:", "o": ["Strict voice rest", "Anticoagulation", "Laser excision", "Radiotherapy", "Broad-spectrum antibiotics"], "k": "A", "x": "Strict voice rest (~1 week), stop anticoagulants/NSAIDs if possible; risk of polyp/scar"}, {"n": 15, "s": "A vocal fold varix causing recurrent haemorrhage is treated by:", "o": ["Radiotherapy", "Intralesional steroid injection", "Long-term PPI", "Microsurgical ablation", "Thyroplasty"], "k": "D", "x": "Recurrent haemorrhage from a varix → microsurgical or laser (KTP/PDL) ablation"}, {"n": 16, "s": "Laryngeal amyloid stained with Congo red shows:", "o": ["Blue granules", "Red intranuclear inclusions", "Apple-green birefringence", "Black pigment", "Yellow crystals"], "k": "C", "x": "Apple-green birefringence under polarised light; commonest site false folds/ventricle; check for systemic amyloid"}, {"n": 17, "s": "Acute viral laryngitis in an adult is managed with:", "o": ["Oral antibiotics", "Systemic steroids", "Urgent microlaryngoscopy", "Antivirals", "Voice rest and hydration"], "k": "E", "x": "Voice rest, hydration, humidification; self-limiting; antibiotics not indicated"}, {"n": 18, "s": "A Reflux Symptom Index suggestive of LPR is above:", "o": ["3", "5", "7", "13", "25"], "k": "D", "x": "RSI >13 (Belafsky); Reflux Finding Score >7; empirical twice-daily PPI 8–12 weeks"}, {"n": 19, "s": "Candida laryngitis is commonly associated with:", "o": ["Inhaled corticosteroids", "Second-generation antihistamines", "Beta-blockers", "Diuretics", "Statins"], "k": "A", "x": "Inhaled steroids (rinse after use); also immunosuppression, diabetes"}, {"n": 20, "s": "A \"turban\" epiglottis is typical of laryngeal:", "o": ["Tuberculosis", "Sarcoidosis", "Amyloidosis", "Papillomatosis", "Lymphoma"], "k": "B", "x": "Sarcoid: pale, diffuse supraglottic swelling (\"turban\" epiglottis); glottis spared"}, {"n": 21, "s": "\"Bamboo nodes\" of the vocal folds are associated with:", "o": ["Smoking", "Singing", "Laryngopharyngeal reflux", "Autoimmune disease", "Hypothyroidism"], "k": "D", "x": "Bamboo nodes: transverse submucosal bands in SLE, RA, Sjögren's — screen for autoimmune disease"}, {"n": 22, "s": "In recent series, the commonest cause of adult unilateral vocal fold paralysis is:", "o": ["Iatrogenic surgical injury", "Bronchogenic carcinoma", "Idiopathic viral neuritis", "Cerebrovascular accident", "Thyroid malignancy invasion"], "k": "A", "x": "Iatrogenic (thyroid, cardiothoracic, anterior cervical spine) now commonest; malignancy (lung) second"}, {"n": 23, "s": "Unilateral vocal fold paralysis is more common on the:", "o": ["Right", "Both equally", "Dominant side", "Non-dominant side", "Left"], "k": "E", "x": "Left (~2:1): longer intrathoracic course of the left RLN"}, {"n": 24, "s": "A unilaterally paralysed vocal fold usually rests in the:", "o": ["Midline", "Cadaveric position", "Paramedian position", "Lateral abducted position", "Full abduction"], "k": "C", "x": "Paramedian (CT still tensing; variable); cadaveric position = combined RLN + SLN loss"}, {"n": 25, "s": "Laryngeal EMG for prognosis is most informative from about:", "o": ["3 days", "4 weeks", "2 years", "24 hours", "5 years"], "k": "B", "x": "≥4 weeks (after Wallerian degeneration) to 6 months: fibrillations = poor; voluntary motor units = good"}, {"n": 26, "s": "Permanent medialisation for idiopathic paralysis is usually deferred for:", "o": ["Under one week", "2 weeks", "4 weeks", "6 weeks", "6–12 months"], "k": "E", "x": "Wait 6–12 months for recovery; temporary injection augmentation early to aid voice/swallow"}, {"n": 27, "s": "The injection material now avoided because of granuloma formation is:", "o": ["Hyaluronic acid", "Autologous fat", "Calcium hydroxylapatite", "Teflon paste", "Carboxymethylcellulose"], "k": "D", "x": "Teflon: granuloma, migration — abandoned; current: hyaluronic acid, CaHA, fat, CMC"}, {"n": 28, "s": "Isshiki type I thyroplasty achieves:", "o": ["Medialisation", "Lateralisation", "Shortening", "Lengthening", "Reinnervation"], "k": "A", "x": "Type I: medialisation via thyroid lamina window (Silastic, Gore-Tex)"}, {"n": 29, "s": "Arytenoid adduction is added to medialisation when there is a:", "o": ["Bowing alone", "Anterior glottic web", "Large posterior gap", "Granuloma", "Nodules"], "k": "C", "x": "Large posterior gap/arytenoid malposition → arytenoid adduction (type I alone can't close posteriorly)"}, {"n": 30, "s": "Isshiki type III thyroplasty is used to:", "o": ["Raise pitch", "Lower pitch", "Medialise fold", "Lateralise fold", "Remove papilloma"], "k": "B", "x": "Type III: relaxation/shortening → lowers pitch (puberphonia)"}, {"n": 31, "s": "Cricothyroid approximation (Isshiki type IV) is used to:", "o": ["Raise pitch", "Lower pitch", "Close glottic gap", "Treat aspiration", "Widen airway"], "k": "A", "x": "Type IV: CT approximation → lengthens folds → raises pitch (transgender voice feminisation)"}, {"n": 32, "s": "A permanent airway procedure for bilateral abductor paralysis is:", "o": ["Medialisation thyroplasty", "Injection laryngoplasty", "Posterior cordotomy", "Type IV thyroplasty", "Cricothyroid approximation"], "k": "C", "x": "Posterior (Kashima) cordotomy or partial arytenoidectomy; tracheostomy alternative; trade-off with voice"}, {"n": 33, "s": "Ansa cervicalis to RLN reinnervation mainly restores:", "o": ["Full abduction", "Normal motion", "Airway patency", "Sensation", "Tone and bulk"], "k": "E", "x": "Non-selective reinnervation restores tone/bulk (better voice), not purposeful motion; good for young patients"}, {"n": 34, "s": "Ortner syndrome is left vocal fold paralysis caused by:", "o": ["Left upper lobe carcinoma", "Thyroid surgery", "Aortic dissection", "Enlarged left atrium", "Thymoma"], "k": "D", "x": "Ortner (cardiovocal) syndrome: enlarged left atrium (mitral stenosis) or pulmonary artery compressing left RLN"}, {"n": 35, "s": "Vocal fold paralysis with ipsilateral palatal paralysis suggests a lesion of the:", "o": ["Distal RLN", "High vagus", "SLN only", "Thoracic RLN", "Ansa cervicalis"], "k": "B", "x": "Lesion above pharyngeal branch (high vagus/jugular foramen) → palatal paralysis, SLN loss, worse aspiration; image skull base"}, {"n": 36, "s": "Spontaneous recovery of idiopathic unilateral paralysis within a year occurs in about:", "o": ["5%", "90%", "95–100%", "0%", "30–50%"], "k": "E", "x": "~30–50% (some series higher); ~1 year window"}, {"n": 37, "s": "Adductor spasmodic dysphonia is treated with botulinum toxin to the:", "o": ["Thyroarytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Interarytenoid", "Sternocleidomastoid"], "k": "A", "x": "Adductor SD (strained, strangled breaks on voiced sounds) → botulinum to thyroarytenoid (± LCA)"}, {"n": 38, "s": "Abductor spasmodic dysphonia is treated with botulinum toxin to the:", "o": ["Thyroarytenoid", "Lateral cricoarytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Transverse interarytenoid"], "k": "C", "x": "Abductor SD (breathy breaks on voiceless consonants) → botulinum to PCA"}, {"n": 39, "s": "Essential voice tremor typically has a regular frequency of about:", "o": ["0.5 Hz", "1 Hz", "20 Hz", "4–7 Hz", "50 Hz"], "k": "D", "x": "Essential tremor ~4–7 Hz, rhythmic, worse on sustained vowels; botulinum or propranolol"}, {"n": 40, "s": "Supraglottic squeezing with structurally normal vocal folds suggests:", "o": ["Paralysis", "Muscle tension dysphonia", "Recurrent papillomatosis", "Laryngeal cancer", "Presbylaryngis"], "k": "B", "x": "MTD: supraglottic compression, normal folds → voice therapy, circumlaryngeal massage"}, {"n": 41, "s": "A patient who coughs normally but can only whisper most likely has:", "o": ["Functional aphonia", "Bilateral paralysis", "Laryngeal cancer", "Laryngeal web", "Spasmodic dysphonia"], "k": "A", "x": "Functional (psychogenic) aphonia: normal cough proves adduction; voice therapy"}, {"n": 42, "s": "Hypophonia in Parkinson's disease is best treated with:", "o": ["Thyroplasty", "Botulinum toxin", "Steroids", "LSVT LOUD", "Laser"], "k": "D", "x": "LSVT LOUD (intensive loudness training) — best evidence for Parkinson's hypophonia"}, {"n": 43, "s": "Presbylaryngis typically shows:", "o": ["Nodules", "Polyps", "Vocal fold bowing", "Diffuse leukoplakia", "Granuloma"], "k": "C", "x": "Age-related atrophy: bowing, prominent vocal processes, glottic gap; voice therapy, injection"}, {"n": 44, "s": "During CO2 laser microlaryngoscopy, airway fire risk is reduced by keeping FiO2 below:", "o": ["80%", "60%", "50%", "100%", "30%"], "k": "E", "x": "FiO2 <30% (+ laser-safe tube, saline cuff, wet pledgets); fire triad: oxidiser, fuel, ignition"}, {"n": 45, "s": "The KTP laser is preferentially absorbed by:", "o": ["Water", "Haemoglobin", "Melanin", "Dense collagen", "Cartilage"], "k": "B", "x": "KTP 532 nm → haemoglobin (angiolytic; papilloma, varices); CO2 10,600 nm → water"}, {"n": 46, "s": "Regarding the imaging evaluation of vocal cord paralysis, which statement is true?", "o": ["Most causes can be detected with MRI of the brain", "Imaging evidence of perineural spread of the vagus nerve caused by remote carcinoma metastasis is commonly seen", "Imaging from the skull base to the pulmonary hila should be performed", "Imaging signs include widely abducted vocal cords and ipsilateral collapsed pyriform sinus", "CT tends to be superior for posterior fossa evaluation compared with MRI"], "k": "C", "x": "(PP ENT-A Q29) — Image the whole vagus/RLN course (skull base to hila/aortic arch); paralysed fold appears paramedian with dilated pyriform sinus and atrophic TA"}, {"n": 47, "s": "Which of the following is commonly seen in patients with laryngeal tuberculosis?", "o": ["Chest radiograph positive for tuberculosis", "History of tobacco and alcohol use", "Bloody sputum", "Negative purified protein derivative skin test", "History of HIV"], "k": "A", "x": "(PP ENT-A Q30) ⚠ — Classic key: most laryngeal TB has pulmonary disease on CXR; modern series include more isolated laryngeal TB in smokers mimicking cancer — choose A"}, {"n": 48, "s": "Cricoarytenoid joint arthritis is best differentiated from unilateral vocal cord paralysis by:", "o": ["Suspension laryngoscopy", "Laryngeal electromyography", "Latex agglutination test", "Passive mobility test", "CT scan of the larynx"], "k": "B", "x": "(PP ENT-B Q31) ⚠ — EMG shows normal innervation in fixation vs denervation in paralysis; passive mobility testing confirms fixation but doesn't exclude coexisting paralysis"}, {"n": 49, "s": "Which feature is not important to voice production?", "o": ["Hypernasality", "Clenched jaw", "Neck extension", "Decreased thyrohyoid space", "None of the above"], "k": "E", "x": "(PP ENT-B Q63) ⚠ — All listed features (resonance, jaw tension, posture, laryngeal position) influence voice → \"None of the above\""}, {"n": 50, "s": "Optimal results after vocal fold surgery may be best achieved by including:", "o": ["Postoperative absolute voice rest", "Smoking cessation", "Antireflux therapy", "Preoperative and postoperative voice therapy", "Preoperative steroids"], "k": "D", "x": "(PP ENT-B Q65) — Pre- and postoperative voice therapy improves and sustains outcomes; absolute voice rest only briefly"}]}, {"c": 2, "t": "Session 3", "d": "Laryngeal Cancer, Trauma, Airway & Tracheostomy", "q": [{"n": 1, "s": "The commonest site of laryngeal cancer in Western populations is the:", "o": ["Glottis", "Supraglottis", "Subglottis", "Transglottic region", "Ventricle"], "k": "A", "x": "Glottis ~60% (West); supraglottis ~35%; subglottis ~2–5%. Supraglottic predominance in some Middle Eastern/Mediterranean populations"}, {"n": 2, "s": "The commonest histological type of laryngeal malignancy is:", "o": ["Adenocarcinoma", "Chondrosarcoma", "Squamous cell carcinoma", "Lymphoma", "Neuroendocrine carcinoma"], "k": "C", "x": "SCC >90%"}, {"n": 3, "s": "Glottic T1a cancer is defined as:", "o": ["Both cords, mobile", "Impaired mobility", "Fixed cord", "Subglottic extension of 1 cm", "One cord, normal mobility"], "k": "E", "x": "T1a one cord, normal mobility · T1b both cords · anterior commissure may be involved in either"}, {"n": 4, "s": "Glottic cancer with impaired cord mobility is staged:", "o": ["T1b", "T2", "T3", "T4a", "T1a"], "k": "B", "x": "Glottic T2: supra/subglottic extension and/or impaired mobility"}, {"n": 5, "s": "Glottic cancer with a fixed vocal cord is staged:", "o": ["T1b", "T2", "T4a", "T3", "T4b"], "k": "D", "x": "T3: fixation, paraglottic space, inner cortex erosion"}, {"n": 6, "s": "Laryngeal cancer extending through the outer thyroid cortex into the strap muscles is:", "o": ["T4a", "T3", "T2", "T4b", "T1"], "k": "A", "x": "T4a: through outer cortex/extralaryngeal (trachea, strap muscles, thyroid, oesophagus, deep tongue muscles)"}, {"n": 7, "s": "Laryngeal cancer encasing the carotid artery is:", "o": ["T3", "T4a", "T4b", "T2", "N3"], "k": "C", "x": "T4b: prevertebral space, carotid encasement, mediastinal structures"}, {"n": 8, "s": "Supraglottic cancer involving more than one adjacent subsite without fixation is:", "o": ["T1", "T3", "T4a", "Tis", "T2"], "k": "E", "x": "Supraglottic T2: >1 adjacent subsite of supraglottis or glottis, or region outside (BOT mucosa, vallecula, medial pyriform wall) without fixation"}, {"n": 9, "s": "Subglottic cancer extending to the vocal cords with normal mobility is:", "o": ["T1", "T3", "T4a", "T2", "T4b"], "k": "D", "x": "Subglottic T1 confined; T2 extends to cords (normal/impaired mobility); T3 fixation"}, {"n": 10, "s": "Standard treatment options for T1 glottic cancer are:", "o": ["Radiotherapy or transoral laser", "Total laryngectomy with neck dissection", "Chemoradiotherapy", "Induction chemotherapy alone", "Observation"], "k": "A", "x": "RT or transoral laser microsurgery — equivalent control; laser one session, retains RT option; RT may give better voice for larger lesions"}, {"n": 11, "s": "Local control of T1 glottic cancer with radiotherapy is about:", "o": ["50%", "90%", "30%", "70%", "99%"], "k": "B", "x": "T1 ~90% (T1a ~90–95%); T2 ~70–80%; laser salvage/laryngectomy for failures"}, {"n": 12, "s": "Early supraglottic cancer with a clinically N0 neck requires:", "o": ["No neck treatment", "Ipsilateral neck observation only", "Bilateral elective neck treatment", "Contralateral only", "PET only"], "k": "C", "x": "Supraglottis rich bilateral lymphatics → occult nodes ~20–30% → bilateral elective neck (II–IV)"}, {"n": 13, "s": "Standard non-surgical organ preservation for T3 laryngeal cancer is:", "o": ["Radiotherapy alone", "Induction chemotherapy alone", "Surgery then observation", "Cetuximab alone", "Concurrent chemoradiotherapy"], "k": "E", "x": "RTOG 91-11: concurrent cisplatin-RT best larynx preservation"}, {"n": 14, "s": "The VA Larynx trial showed that induction chemotherapy plus radiotherapy, compared with laryngectomy, gave:", "o": ["Equal survival", "Better survival", "Worse survival", "No larynx preservation", "Higher nodal control"], "k": "A", "x": "VA 1991: equal survival, ~64% larynx preserved; basis of organ preservation"}, {"n": 15, "s": "T4a laryngeal cancer with gross cartilage destruction is best treated by:", "o": ["Radiotherapy alone", "Chemoradiotherapy", "Transoral laser", "Total laryngectomy", "Observation"], "k": "D", "x": "T4a with cartilage destruction: total laryngectomy + postoperative (chemo)RT — organ preservation gives worse survival"}, {"n": 16, "s": "Recurrence after radiotherapy for laryngeal cancer is usually salvaged by:", "o": ["Re-irradiation alone", "Chemotherapy alone", "Total laryngectomy", "Observation", "Immunotherapy alone"], "k": "C", "x": "Salvage total laryngectomy (selected cases partial/laser); higher complication rates"}, {"n": 17, "s": "The most important risk factor for pharyngocutaneous fistula after laryngectomy is:", "o": ["Prior radiotherapy", "Young age", "Female sex", "Early feeding", "Tracheoesophageal puncture"], "k": "A", "x": "Prior RT (± chemo); also low albumin, hypothyroidism, positive margins, neck dissection"}, {"n": 18, "s": "After total laryngectomy with radiotherapy, routine follow-up should include:", "o": ["Annual brain MRI", "Serum calcium only", "Bone scan", "Abdominal ultrasound yearly", "Thyroid function tests"], "k": "E", "x": "Hypothyroidism common after laryngectomy with RT (± hemithyroidectomy) — check TFTs periodically"}, {"n": 19, "s": "The gold standard for voice restoration after laryngectomy is:", "o": ["Oesophageal speech", "Tracheoesophageal puncture", "Electrolarynx", "Pneumatic artificial larynx", "Sign language"], "k": "B", "x": "TEP with valved prosthesis (Blom-Singer, Provox): most fluent; primary or secondary"}, {"n": 20, "s": "Failure of tracheoesophageal speech due to pharyngoesophageal spasm is treated with:", "o": ["Prosthesis removal", "Radiotherapy", "Steroids", "Botulinum toxin", "Antibiotics"], "k": "D", "x": "Pharyngoesophageal spasm → botulinum to cricopharyngeus/constrictors or pharyngeal plexus neurectomy/myotomy"}, {"n": 21, "s": "Stomal recurrence after laryngectomy is associated with:", "o": ["Supraglottic primary", "Early glottic tumour", "Subglottic extension", "Verrucous histology", "Young age"], "k": "C", "x": "Subglottic extension, pre-op emergency tracheostomy, paratracheal node disease → stomal recurrence"}, {"n": 22, "s": "A contraindication to supraglottic laryngectomy is:", "o": ["Poor pulmonary function", "Epiglottic tumour", "Age 50", "Aryepiglottic fold involvement", "Vallecular involvement"], "k": "A", "x": "Poor pulmonary reserve (aspiration post-op), arytenoid fixation, thyroid cartilage invasion, anterior commissure involvement"}, {"n": 23, "s": "Supracricoid partial laryngectomy requires preservation of at least:", "o": ["Both arytenoid cartilages", "The epiglottis", "The thyroid cartilage", "Both vocal folds", "One cricoarytenoid unit"], "k": "E", "x": "At least one cricoarytenoid unit (arytenoid + its innervation) for phonation and swallow (CHEP/CHP)"}, {"n": 24, "s": "Verrucous carcinoma of the larynx is characterised by:", "o": ["Early nodal metastasis", "Poor differentiation", "Submucosal growth", "Rare nodal spread", "Neuroendocrine markers"], "k": "D", "x": "Verrucous: exophytic, well-differentiated, pushing margins, nodes rare; surgery preferred (excision/laser)"}, {"n": 25, "s": "Laryngeal chondrosarcoma most commonly arises from the:", "o": ["Thyroid ala superior", "Posterior cricoid", "Arytenoid", "Epiglottis", "Hyoid"], "k": "B", "x": "Posterior cricoid lamina (~70%); slow-growing, \"popcorn\" calcification on CT"}, {"n": 26, "s": "A polypoid laryngeal tumour with spindle cells expressing epithelial markers is a:", "o": ["Fibroma", "Inflammatory myofibroblastic tumour", "Sarcomatoid carcinoma", "Granular cell tumour", "Lipoma"], "k": "C", "x": "Sarcomatoid (spindle cell) carcinoma: polypoid, biphasic; treated as SCC"}, {"n": 27, "s": "Laryngeal small cell carcinoma is best treated with:", "o": ["Chemoradiotherapy", "Total laryngectomy", "Transoral laser", "Observation", "Partial laryngectomy"], "k": "A", "x": "Small cell: systemic disease early — chemoradiotherapy (± PCI), not surgery"}, {"n": 28, "s": "The combined effect of smoking and alcohol on laryngeal cancer risk is:", "o": ["Protective", "Neutral", "Additive and minor", "Antagonistic", "Multiplicative"], "k": "E", "x": "Multiplicative (synergistic)"}, {"n": 29, "s": "Schaefer group V laryngeal trauma is:", "o": ["Minor haematoma", "Oedema without fracture", "Displaced fracture", "Laryngotracheal separation", "Mucosal tear with exposed cartilage"], "k": "D", "x": "Schaefer: I minor haematoma · II oedema/haematoma, non-displaced fracture · III massive oedema, displaced fracture, exposed cartilage · IV III + unstable/disrupted anterior commissure · V laryngotracheal separation"}, {"n": 30, "s": "Schaefer group I laryngeal trauma (minor haematoma, no fracture) is managed by:", "o": ["Open reduction and fixation", "Tracheostomy", "Observation and humidification", "Endolaryngeal stenting under GA", "Laryngectomy"], "k": "C", "x": "Group I: observation, humidification, voice rest, ± steroids/antireflux; serial airway checks"}, {"n": 31, "s": "Laryngotracheal separation is frequently associated with:", "o": ["Bilateral RLN injury", "Isolated hyoid bone fracture", "Facial nerve palsy", "Mandibular fracture", "Optic neuropathy"], "k": "A", "x": "Bilateral RLN injury common; distal trachea retracts into mediastinum"}, {"n": 32, "s": "The safest airway in significant laryngeal trauma is:", "o": ["Blind nasal intubation", "Awake tracheostomy", "Laryngeal mask", "Cricothyroidotomy", "Rapid-sequence oral intubation"], "k": "B", "x": "Awake tracheostomy under local anaesthesia; avoid blind intubation (may complete separation/false passage)"}, {"n": 33, "s": "In a \"can't intubate, can't oxygenate\" adult, the recommended rescue is:", "o": ["Repeat laryngoscopy", "Needle tracheostomy", "Blind nasal tube", "Awake fibreoptic intubation", "Scalpel cricothyroidotomy"], "k": "E", "x": "DAS: scalpel-bougie-tube cricothyroidotomy"}, {"n": 34, "s": "An emergency surgical cricothyroidotomy should be converted to tracheostomy within:", "o": ["2 weeks", "1 month", "24–72 hours", "6 months later", "Never"], "k": "C", "x": "Convert within 24–72 h to reduce subglottic stenosis/voice injury"}, {"n": 35, "s": "An elective surgical tracheostomy is placed through the:", "o": ["First ring", "Cricoid", "Cricothyroid membrane", "Second to fourth rings", "Sixth and seventh rings"], "k": "D", "x": "2nd–4th rings; avoid 1st ring (subglottic stenosis) and low placement (innominate artery)"}, {"n": 36, "s": "A sentinel bleed from a tracheostomy at day 10 is managed first by:", "o": ["Cuff overinflation", "Observation", "Tube removal", "Oral antibiotics", "Nebulised adrenaline"], "k": "A", "x": "Tracheo-innominate fistula (peak days 7–14): overinflate cuff ± finger compression (Utley manoeuvre) → emergency sternotomy"}, {"n": 37, "s": "After surgical tracheostomy, the first routine tube change is usually at:", "o": ["24 hours", "48 hours", "3 weeks", "6 weeks", "5–7 days"], "k": "E", "x": "Day 5–7 (tract mature); earlier change risks false passage"}, {"n": 38, "s": "A fresh tracheostomy tube (day 2) is accidentally dislodged. The safest step is:", "o": ["Blind reinsertion", "Orotracheal intubation", "Leave it out", "Needle cricothyroidotomy", "Nasal cannula only"], "k": "B", "x": "Immature tract (<72 h–5 days): orotracheal intubation; stay sutures help reinsertion if trained"}, {"n": 39, "s": "Cotton-Myer grade III subglottic stenosis is obstruction of:", "o": ["≤50%", "51–70%", "71–99%", "No lumen", "100%"], "k": "C", "x": "Cotton-Myer: I ≤50% · II 51–70% · III 71–99% · IV no detectable lumen"}, {"n": 40, "s": "Idiopathic subglottic stenosis typically affects:", "o": ["Elderly men", "Children", "Heavy smokers over 70", "Middle-aged women", "Adolescent boys"], "k": "D", "x": "Middle-aged women; ? hormonal/inflammatory; endoscopic dilation + steroid injection; cricotracheal resection for refractory"}, {"n": 41, "s": "In adults, the maximum tracheal length safely resectable with primary anastomosis is about:", "o": ["10%", "90%", "20%", "75%", "50%"], "k": "E", "x": "~50% (4–6 cm) with release manoeuvres"}, {"n": 42, "s": "A Passy-Muir speaking valve requires:", "o": ["Cuff inflation", "Cuff deflation", "Fenestration closed", "Ventilator FiO2 >60%", "Sedation"], "k": "B", "x": "Cuff deflation essential — exhaled air must pass around the tube to the larynx (risk of asphyxia otherwise)"}, {"n": 43, "s": "Heliox improves airflow through a stenosis by:", "o": ["Reducing turbulence", "Increasing oxygen", "Dilating the airway", "Thinning secretions", "Relaxing muscle"], "k": "A", "x": "Low-density helium reduces turbulent flow resistance — temporising measure"}, {"n": 44, "s": "The PACU nurse calls you for disorientation after uvulopalatopharyngoplasty. The patient is snoring heavily, SaO2 91% on 40% oxygen by face mask. Appropriate immediate management is:", "o": ["Administer naloxone", "Administer 100% oxygen via face mask/Ambu bag; perform chin lift and jaw thrust to alleviate the airway obstruction", "Perform flexible nasopharyngoscopy to evaluate for oedema in the posterior pharynx", "Perform immediate cricothyrotomy to secure an airway in the presence of mental status changes"], "k": "B", "x": "(PP ENT-A Q3) — Airway first: oxygen, chin lift/jaw thrust; avoid sedation; consider nasopharyngeal airway"}, {"n": 45, "s": "The timing of surgical treatment for laryngeal fractures or significant mucosal injuries should be:", "o": ["Delayed for 3 or more days on high-dose corticosteroids to minimise oedema", "Performed as soon as possible to permit more careful restoration of the soft and hard tissue of the larynx", "Irrelevant because essentially all patients with significant injuries do poorly", "Inconsequential given the lack of sufficient studies"], "k": "B", "x": "(PP ENT-A Q31) — Early repair (<24–48 h) gives better voice and airway results"}, {"n": 46, "s": "Which finding is the most important in the decision as to which treatment should be selected for an early vocal cord cancer?", "o": ["Tumour differentiation", "Limited subglottic extension", "Involvement of the anterior commissure", "Arytenoid cartilage involvement", "Vocal cord mobility"], "k": "C", "x": "(PP ENT-A Q32) ⚠ — Among early (T1–T2) lesions, anterior commissure involvement most influences choice (laser access, RT control, cartilage risk); mobility distinguishes T2/T3 (advanced) — choose C"}, {"n": 47, "s": "The most common complication after tracheotomy is:", "o": ["Pneumomediastinum", "Tracheal stenosis", "Tube displacement", "Tube obstruction", "Haemorrhage"], "k": "E", "x": "(PP ENT-A Q34) ⚠ — Large series: haemorrhage most frequent early complication, then tube obstruction and displacement — choose E"}, {"n": 48, "s": "A tracheostomy located between the cricoid cartilage and first tracheal ring is:", "o": ["A good procedure in most situations", "Called a cricothyrotomy", "More difficult to perform than the usual tracheostomy at a lower level", "Often complicated by subglottic stenosis", "Useful in the short-necked individual"], "k": "D", "x": "(PP ENT-B Q32) — High tracheostomy injures cricoid → subglottic stenosis"}, {"n": 49, "s": "Which best describes the role of CT of the larynx after blunt trauma?", "o": ["All patients with suspected laryngeal injuries should undergo CT", "CT should be used only when the results will influence the course of treatment", "Suspected fractures that are difficult to document by examination should be viewed by CT", "B and C", "All of the above"], "k": "D", "x": "(PP ENT-B Q64) — CT only when it changes management, and for suspected fractures not clear clinically"}, {"n": 50, "s": "Which tracheal tumours comprise most primary tracheal neoplasms in adults?", "o": ["Carcinoid and adenoid cystic carcinoma", "Adenoid cystic carcinoma and squamous cell carcinoma", "Granular cell tumour and squamous cell carcinoma", "Papilloma and granular cell carcinoma", "Carcinoid and leiomyoma"], "k": "B", "x": "(PP ENT-B Q66) — SCC and adenoid cystic carcinoma ~2/3 of adult primary tracheal malignancies"}]}, {"c": 2, "t": "Session 4", "d": "Swallowing, Pharynx & Oesophagus, Airway Infections, Sleep", "q": [{"n": 1, "s": "Upper oesophageal sphincter opening during swallowing depends mainly on:", "o": ["Cricopharyngeal contraction", "Laryngeal lowering", "Tongue retraction alone", "Hyolaryngeal elevation", "Oesophageal peristalsis"], "k": "D", "x": "UES opens by suprahyoid-driven hyolaryngeal elevation (traction) + CP relaxation + bolus pressure"}, {"n": 2, "s": "A Penetration-Aspiration Scale score of 8 means:", "o": ["Normal swallow", "Silent aspiration", "Laryngeal penetration only", "Aspiration with cough", "Residue only"], "k": "B", "x": "PAS 8: material below the cords, no effort to eject (silent); 1 = normal"}, {"n": 3, "s": "Silent aspiration is best detected by:", "o": ["Bedside water swallow test", "Pulse oximetry", "Cough reflex history", "Chest auscultation", "Instrumental swallow study"], "k": "E", "x": "FEES or VFSS — bedside tests miss silent aspiration (up to ~40%)"}, {"n": 4, "s": "An advantage of FEES over videofluoroscopy is:", "o": ["Oral phase visualised", "Oesophageal phase seen", "No radiation, bedside use", "Swallow moment fully visible", "UES opening measured"], "k": "C", "x": "FEES: bedside, no radiation, secretions and sensation, repeatable; but \"white-out\" hides the swallow moment"}, {"n": 5, "s": "An advantage of videofluoroscopy over FEES is:", "o": ["Visualising all phases", "Bedside use", "No radiation", "Assessing secretions", "Laryngeal sensory testing"], "k": "A", "x": "VFSS: oral, pharyngeal and oesophageal phases, UES opening, aspiration at the swallow moment"}, {"n": 6, "s": "The chin-tuck posture helps by:", "o": ["Opening the UES", "Lengthening the pharyngeal tube", "Raising the larynx", "Narrowing the airway entrance", "Increasing tongue strength"], "k": "D", "x": "Chin tuck narrows the laryngeal inlet and widens the valleculae → protects against premature spillage"}, {"n": 7, "s": "In unilateral pharyngeal weakness, the head is turned:", "o": ["Upward", "Backward", "Away from the weak side", "Downward only", "Toward the weak side"], "k": "E", "x": "Turn toward the weak side → closes that pyriform sinus, directs bolus down the stronger side"}, {"n": 8, "s": "The Mendelsohn manoeuvre:", "o": ["Closes the nasopharynx", "Prolongs UES opening", "Reduces tongue strength", "Increases aspiration", "Relaxes the jaw"], "k": "B", "x": "Voluntarily holding the larynx up → prolongs UES opening"}, {"n": 9, "s": "The Shaker exercise strengthens the:", "o": ["Pharyngeal constrictors", "Intrinsic tongue", "Suprahyoid muscles", "Masseter", "Cricopharyngeus"], "k": "C", "x": "Head-lift exercise (supine) strengthens suprahyoids → better UES opening"}, {"n": 10, "s": "Zenker's diverticulum herniates through:", "o": ["Laimer's triangle", "Killian-Jamieson area", "Morgagni's sinus", "Killian's dehiscence", "Cricothyroid space"], "k": "D", "x": "Killian's dehiscence: between oblique thyropharyngeus and horizontal cricopharyngeus"}, {"n": 11, "s": "A Killian-Jamieson diverticulum arises:", "o": ["Below the cricopharyngeus", "Above the cricopharyngeus", "Through the tonsil bed", "In the vallecula", "At the GOJ"], "k": "A", "x": "Below cricopharyngeus, anterolateral (lateral to the longitudinal muscle insertion) — close to RLN"}, {"n": 12, "s": "Zenker's diverticulum most commonly projects to the:", "o": ["Right", "Midline anteriorly", "Both sides", "Mediastinum", "Left"], "k": "E", "x": "Left (oesophagus curves left)"}, {"n": 13, "s": "The first investigation for suspected Zenker's diverticulum is:", "o": ["Blind OGD", "CT chest", "Barium swallow", "Nasogastric tube", "pH study"], "k": "C", "x": "Barium swallow; blind OGD/NG risks perforation"}, {"n": 14, "s": "For a 4 cm Zenker's diverticulum in a fit elderly patient, the usual first-line treatment is:", "o": ["Observation", "Diverticulopexy only", "Radiotherapy", "Endoscopic stapling", "Gastrostomy"], "k": "D", "x": "Endoscopic stapler diverticulotomy (divides common wall + CP); open excision/myotomy for small (<2–3 cm) or very large pouches"}, {"n": 15, "s": "A smooth posterior indentation at C5–C6 on barium swallow is a:", "o": ["Zenker's pouch", "Cricopharyngeal bar", "Oesophageal web", "Cervical osteophyte impression", "Hiatus hernia"], "k": "B", "x": "Cricopharyngeal bar: non-relaxing/fibrotic CP → dilation, botulinum, myotomy if symptomatic"}, {"n": 16, "s": "Regurgitation of undigested food and halitosis in an elderly man suggests:", "o": ["Zenker's diverticulum", "Achalasia", "Oesophageal cancer", "Gastro-oesophageal reflux", "Globus"], "k": "A", "x": "Zenker's: regurgitation of undigested food, halitosis, gurgling, aspiration"}, {"n": 17, "s": "A reversible surgical option for intractable aspiration is:", "o": ["Total laryngectomy", "Supraglottic laryngectomy alone", "Thyroplasty", "Tonsillectomy", "Laryngotracheal separation"], "k": "E", "x": "Laryngotracheal separation/tracheo-oesophageal diversion (Lindeman) — potentially reversible"}, {"n": 18, "s": "Intractable aspiration with a non-functional larynx and no prospect of recovery is best treated by:", "o": ["Injection laryngoplasty", "Thickened fluids", "Total laryngectomy", "Botulinum to glands", "Repeat VFSS"], "k": "C", "x": "Total (narrow-field) laryngectomy: definitive separation"}, {"n": 19, "s": "Long-term non-oral feeding beyond 4 weeks is best via:", "o": ["Nasogastric tube", "Parenteral nutrition", "Oral thickened diet", "Gastrostomy", "Jejunal NG"], "k": "D", "x": "Gastrostomy (PEG/RIG) for >4 weeks; NG short term"}, {"n": 20, "s": "Dysphagia to solids and liquids with a \"bird-beak\" on barium suggests:", "o": ["Achalasia", "Zenker's", "Oesophageal cancer", "Web", "Scleroderma"], "k": "A", "x": "Achalasia: loss of myenteric inhibitory neurons, LES fails to relax; manometry diagnostic"}, {"n": 21, "s": "Iron deficiency with a postcricoid web predisposes to:", "o": ["Adenocarcinoma", "Lymphoma", "Gastric adenocarcinoma", "Zenker's", "Postcricoid carcinoma"], "k": "E", "x": "Plummer-Vinson (Paterson-Kelly): iron deficiency, web, glossitis → postcricoid SCC; iron + dilation, surveillance"}, {"n": 22, "s": "Eosinophilic oesophagitis is diagnosed by eosinophils on biopsy of at least:", "o": ["1 per HPF", "5 per HPF", "15 per HPF", "100 per HPF", "500 per HPF"], "k": "C", "x": "≥15 eosinophils/HPF; young atopic men; food bolus; rings/furrows"}, {"n": 23, "s": "Alkali ingestion causes:", "o": ["Coagulative necrosis", "Liquefactive necrosis", "Fibrinoid necrosis", "Caseous necrosis", "Enzymatic fat necrosis"], "k": "B", "x": "Alkali → liquefactive necrosis (deep, oesophagus); acid → coagulative (eschar, stomach)"}, {"n": 24, "s": "Endoscopy after caustic ingestion is ideally performed within:", "o": ["1 hour", "5–7 days later", "2 weeks", "24–48 hours", "1 month"], "k": "D", "x": "12–48 h (Zargar grading); avoid days 5–15 (weakest wall)"}, {"n": 25, "s": "The commonest site of oesophageal foreign body impaction is the:", "o": ["Cricopharyngeus", "Aortic arch level", "Left bronchus", "Cardia", "Mid-thorax"], "k": "A", "x": "Cricopharyngeus (narrowest point); then aortic arch, LES"}, {"n": 26, "s": "Boerhaave rupture typically occurs in the:", "o": ["Upper cervical oesophagus", "Right mid-oesophagus", "Cricopharyngeus", "Pharynx", "Distal left wall"], "k": "E", "x": "Distal left posterolateral wall above the GOJ; emergency surgery"}, {"n": 27, "s": "A Centor criterion is:", "o": ["Cough", "Rhinorrhoea and sneezing", "Tonsillar exudate", "Conjunctivitis", "Hoarseness"], "k": "C", "x": "Centor: exudate, tender anterior cervical nodes, fever, absent cough"}, {"n": 28, "s": "A maculopapular rash after amoxicillin for sore throat suggests:", "o": ["True penicillin allergy", "Streptococcal scarlet fever", "Kawasaki", "Infectious mononucleosis", "Measles"], "k": "D", "x": "EBV: ampicillin/amoxicillin rash in most; Monospot; avoid contact sports (splenic rupture) ~4 weeks"}, {"n": 29, "s": "Since Hib vaccination, adult supraglottitis is most often caused by:", "o": ["H. influenzae type b", "Streptococci", "Pseudomonas", "Candida", "Viruses only"], "k": "B", "x": "Streptococci (pneumoniae, pyogenes), Staph; Hib now rare in vaccinated populations"}, {"n": 30, "s": "The lateral neck radiograph sign of epiglottitis is the:", "o": ["Steeple sign", "Sail sign", "Double bubble", "Halo sign", "Thumb sign"], "k": "E", "x": "Thumb sign; steeple sign = croup"}, {"n": 31, "s": "Adult supraglottitis without stridor is managed with:", "o": ["IV antibiotics and monitoring", "Immediate tracheostomy", "Oral antibiotics, discharge home", "Throat swab only", "Nebulised salbutamol"], "k": "A", "x": "IV antibiotics (ceftriaxone) + steroids, ICU/HDU, airway equipment ready; intubate/tracheostomy if compromise"}, {"n": 32, "s": "In peritonsillar abscess, the uvula is deviated:", "o": ["Toward the abscess", "Backward", "Away from the abscess", "Not at all", "Upward and posteriorly"], "k": "C", "x": "Uvula deviated away; trismus, hot potato voice; aspiration/I&D + antibiotics"}, {"n": 33, "s": "Lemierre's syndrome is classically caused by:", "o": ["S. aureus", "Group A streptococcus", "Haemophilus influenzae type b", "Fusobacterium necrophorum", "Candida"], "k": "D", "x": "Fusobacterium necrophorum: post-pharyngitis IJV thrombophlebitis + septic lung emboli"}, {"n": 34, "s": "Ludwig's angina most commonly arises from:", "o": ["Recurrent tonsillitis", "Parotitis", "Sialolithiasis", "Trauma", "Lower molar infection"], "k": "E", "x": "2nd/3rd lower molars (roots below mylohyoid line) → submandibular, sublingual, submental spaces bilaterally; airway first"}, {"n": 35, "s": "Severe OSA in adults is defined by an AHI of at least:", "o": ["5", "30", "15", "10", "60"], "k": "B", "x": "AHI ≥30 severe; 15–29 moderate; 5–14 mild (with symptoms)"}, {"n": 36, "s": "First-line treatment for moderate–severe adult OSA is:", "o": ["UPPP", "Tonsillectomy", "CPAP", "Oral appliance", "Weight loss alone"], "k": "C", "x": "CPAP"}, {"n": 37, "s": "UPPP has the best success in Friedman stage:", "o": ["IV", "III", "II", "I", "Any stage"], "k": "D", "x": "Friedman I (large tonsils, low Mallampati/tongue position, BMI <40): UPPP success ~80%"}, {"n": 38, "s": "A contraindication to hypoglossal nerve stimulation on DISE is:", "o": ["Complete concentric collapse", "Anteroposterior palatal collapse", "Tongue base prolapse", "Epiglottic collapse", "Lateral wall collapse"], "k": "A", "x": "Complete concentric collapse at the velum excludes HGNS; also BMI >32–35 and central apnoeas >25%"}, {"n": 39, "s": "The VOTE classification describes:", "o": ["Tonsil size", "Modified Mallampati grade", "AHI severity", "Epworth score", "Sites of collapse on DISE"], "k": "E", "x": "Velum, Oropharynx, Tongue base, Epiglottis — site/degree/configuration on DISE"}, {"n": 40, "s": "An Epworth Sleepiness Scale score indicating excessive sleepiness is above:", "o": ["2", "10", "20", "24", "5"], "k": "B", "x": "ESS >10 (0–24)"}, {"n": 41, "s": "The sleep surgery with the highest success rate is:", "o": ["UPPP", "Tongue base radiofrequency reduction", "Septoplasty", "Maxillomandibular advancement", "Palatal implants"], "k": "D", "x": "MMA: ~85–90% success; enlarges entire pharyngeal airway"}, {"n": 42, "s": "A mandibular advancement device is best suited to:", "o": ["Severe OSA with BMI 45", "Central apnoea", "Mild–moderate OSA", "Edentulous patients", "Obesity hypoventilation"], "k": "C", "x": "Mild–moderate OSA or CPAP-intolerant; needs adequate dentition"}, {"n": 43, "s": "Cheyne-Stokes respiration is typically associated with:", "o": ["Heart failure", "Tonsillar hypertrophy", "Retrognathia", "Nasal obstruction", "Obesity"], "k": "A", "x": "Heart failure (central apnoea, Cheyne-Stokes); also stroke, opioids"}, {"n": 44, "s": "A 24-year-old healthy man has 3 days of sore throat, low-grade fever, nasal stuffiness and nonproductive cough. The oropharynx is mildly erythematous. The most likely diagnosis is:", "o": ["Laryngopharyngeal reflux", "Group A streptococcal pharyngitis", "Fungal pharyngitis", "Allergy exacerbation", "Viral pharyngitis"], "k": "E", "x": "(PP ENT-A Q19) — Coryza + cough + low fever = viral (Centor low)"}, {"n": 45, "s": "What is the international classification of obstructive sleep apnea syndrome as a sleep disorder?", "o": ["Intrinsic dyssomnia", "Extrinsic dyssomnia", "Intrinsic parasomnia", "Extrinsic parasomnia"], "k": "A", "x": "(PP ENT-A Q20) — ICSD-1990: OSA = intrinsic dyssomnia (now sleep-related breathing disorder)"}, {"n": 46, "s": "CT is superior to an esophagram in the assessment of:", "o": ["Prevertebral spread of a hypopharyngeal tumor", "Staging of an esophageal carcinoma", "Postsurgical leak", "Fourth branchial cleft fistula", "Recurrence in a jejunal interposition graft"], "k": "A", "x": "(PP ENT-A Q23) — CT shows soft-tissue/prevertebral extension; esophagram better for leaks, fistulae, mucosal detail"}, {"n": 47, "s": "A man with GERD and Barrett's esophagus has rapidly progressive solid-food dysphagia and a lesion at the gastroesophageal junction. Biopsy most likely shows:", "o": ["Leiomyoma", "Adenocarcinoma", "Squamous cell carcinoma", "Lymphoma"], "k": "B", "x": "(PP ENT-A Q24) — Barrett's → adenocarcinoma (distal/GOJ); SCC more in upper/mid oesophagus"}, {"n": 48, "s": "Which tumor type is treated primarily with radiation therapy in the hypopharynx?", "o": ["Squamous cell carcinoma", "Lymphoepithelioma", "Adenosquamous carcinoma", "Basosquamous carcinoma", "Synovial cell carcinoma"], "k": "B", "x": "(PP ENT-A Q25) — Lymphoepithelioma (undifferentiated, radiosensitive) → primary RT"}, {"n": 49, "s": "Regarding treatment of advanced hypopharynx cancer, which is true?", "o": ["Conventional external beam irradiation is the treatment of choice for T4 hypopharyngeal cancer", "After radical surgery and postoperative irradiation, these cancers usually recur at the primary site in half the cases", "The most frequent evolution after radical surgery and postoperative irradiation is the appearance of distant metastases", "Large randomized trials found similar outcomes after radical surgery with postoperative irradiation or definitive irradiation alone", "Adjuvant chemotherapy has improved the outcome after either approach"], "k": "C", "x": "(PP ENT-A Q26) — Hypopharynx: high distant metastasis rate is the dominant failure after aggressive locoregional therapy"}, {"n": 50, "s": "Oxygen desaturation is usually more severe with:", "o": ["Mixed apnea", "Obstructive sleep apnea", "Central apnea", "Snoring"], "k": "B", "x": "(PP ENT-B Q61) ⚠ — Obstructive events (continued effort against a closed airway) → deeper, longer desaturation than central apnoeas — choose B"}]}, {"c": 2, "t": "Session 5", "d": "Clinical Laryngology", "q": [{"n": 1, "s": "A 45-year-old teacher has had hoarseness for 4 weeks after a cold. The next step is:", "o": ["Antibiotics", "Voice rest and review in 3 months", "Flexible laryngoscopy", "CT neck", "PPI trial"], "k": "C", "x": "Hoarseness >3–4 weeks (earlier in smokers/red flags) → laryngoscopy (AAO-HNS/NICE); don't give antibiotics or PPI before visualising the larynx"}, {"n": 2, "s": "A 62-year-old smoker has hoarseness, right otalgia with a normal ear and a firm right level III node. The likely diagnosis is:", "o": ["Otitis externa", "Laryngopharyngeal reflux disease", "Vocal fold polyp", "TMJ dysfunction", "Laryngopharyngeal carcinoma"], "k": "E", "x": "Smoker + hoarseness + referred otalgia (X/IX) + node = laryngopharyngeal SCC → EUA, biopsy, CT/MRI, staging"}, {"n": 3, "s": "On day 2 after hemithyroidectomy, a patient has a breathy voice and an immobile left fold; the nerve was seen intact. Best management is:", "o": ["Immediate medialisation thyroplasty", "Observe, inject early if needed", "Re-exploration", "Tracheostomy", "Arytenoidectomy"], "k": "B", "x": "Intact nerve → likely neuropraxia (most recover in weeks to months); early temporary injection if aspiration or voice demands"}, {"n": 4, "s": "After total thyroidectomy, a patient develops stridor on extubation with both folds paramedian. Immediate management is:", "o": ["Nebulised adrenaline only", "Observation", "Voice therapy", "Reintubation", "Injection laryngoplasty"], "k": "D", "x": "Bilateral RLN palsy after thyroidectomy → reintubate; steroids; tracheostomy if repeated extubation fails"}, {"n": 5, "s": "During total thyroidectomy, neuromonitoring shows loss of signal after the first lobe. Best management is:", "o": ["Stage the second side", "Proceed immediately", "Convert to RT", "Cut the nerve", "Abandon thyroid surgery permanently"], "k": "A", "x": "Loss of signal on first side → stage the contralateral lobe to avoid bilateral palsy (INMSG)"}, {"n": 6, "s": "After a traumatic intubation, a patient is hoarse; the arytenoid is displaced, the fold immobile and laryngeal EMG normal. The best management is:", "o": ["Observation for one year", "Antireflux therapy", "Medialisation thyroplasty", "Tracheostomy", "Early closed reduction"], "k": "E", "x": "Arytenoid dislocation (EMG normal, arytenoid displaced) → early closed reduction under GA (ideally <3 weeks)"}, {"n": 7, "s": "After 3 weeks of intubation, a patient has exertional dyspnoea; the folds lie near the midline with reduced passive mobility and normal EMG. The diagnosis is:", "o": ["Bilateral recurrent nerve palsy", "Laryngomalacia", "Posterior glottic stenosis", "Reinke's oedema", "Spasmodic dysphonia"], "k": "C", "x": "Posterior glottic stenosis (interarytenoid scar, Bogdasarian I–IV) mimics bilateral palsy; EMG normal, passive mobility reduced"}, {"n": 8, "s": "A patient has chronic cough with a throat tickle; endoscopy, chest imaging, PPI and inhaler trials are unremarkable. Best treatment is:", "o": ["Codeine long-term", "Gabapentin", "Antibiotics", "Nasal steroids", "Laryngeal surgery"], "k": "B", "x": "Neurogenic (refractory chronic) cough → gabapentin or amitriptyline + speech-therapy cough suppression; avoid long-term opioids"}, {"n": 9, "s": "A 17-year-old athlete has inspiratory stridor only during exercise; the folds adduct on inspiration at laryngoscopy. Management is:", "o": ["Elective tracheostomy placement", "Inhaled steroids", "Intubation", "Respiratory retraining therapy", "Arytenoidectomy"], "k": "D", "x": "Exercise-induced laryngeal obstruction (paradoxical fold motion) → respiratory retraining by SLT; exclude asthma"}, {"n": 10, "s": "A patient taking lisinopril develops tongue and lip swelling without urticaria. The key step is:", "o": ["Stop the ACE inhibitor", "Antihistamine alone", "Continue lisinopril", "Oral steroids alone", "Broad-spectrum antibiotics"], "k": "A", "x": "Bradykinin angioedema: stop ACEi permanently; antihistamine/adrenaline less effective; icatibant or FFP; secure airway if needed"}, {"n": 11, "s": "A patient has recurrent non-itchy facial swelling, a family history and a low C4. Treatment of an acute attack is:", "o": ["Antihistamine", "Adrenaline auto-injector alone", "Steroids", "Montelukast", "C1 esterase inhibitor"], "k": "E", "x": "Hereditary angioedema (C1-INH deficiency, low C4) → C1 esterase inhibitor concentrate or icatibant"}, {"n": 12, "s": "Lip swelling, urticaria and wheeze develop after eating peanuts. First treatment is:", "o": ["Oral antihistamine", "Oral steroid", "IM adrenaline", "Nebulised saline", "Observation"], "k": "C", "x": "Anaphylaxis → IM adrenaline 0.5 mg (adult) first; then antihistamine, steroid, airway support"}, {"n": 13, "s": "A patient has a lump in the throat between meals that improves on eating; examination is normal with no red flags. Management is:", "o": ["Urgent CT", "Reassurance", "Panendoscopy", "Barium and PET", "Neck exploration"], "k": "B", "x": "Globus with typical features (better on eating, no dysphagia, normal exam) → reassurance ± reflux/SLT; investigate only red flags"}, {"n": 14, "s": "A patient has progressive dysarthria, dysphagia and tongue fasciculations. The likely diagnosis is:", "o": ["Myasthenia", "Lateral medullary stroke", "Parkinson's", "Motor neurone disease", "Multiple sclerosis"], "k": "D", "x": "Bulbar MND: fasciculations, wasting, dysarthria, dysphagia → neurology; early PEG planning"}, {"n": 15, "s": "A patient has voice fatigue worsening through the day with ptosis. The diagnostic test is:", "o": ["Brain MRI", "Laryngeal EMG only", "CT chest only", "Thyroid function and TPO", "Anti-AChR antibodies"], "k": "E", "x": "Myasthenia: fatigable voice/ptosis → anti-AChR (± anti-MuSK), EMG, CT chest for thymoma"}, {"n": 16, "s": "A smoker's laryngeal leukoplakia biopsy shows severe dysplasia. Management is:", "o": ["Excision and surveillance", "Radical radiotherapy course", "Total laryngectomy", "Observation only", "Antifungals"], "k": "A", "x": "Severe dysplasia/CIS → complete excision (laser/cold steel), smoking cessation, close surveillance"}, {"n": 17, "s": "After laryngectomy, liquid leaks through the centre of the TEP valve when drinking. Management is:", "o": ["Close the puncture", "Antibiotics", "Replace the prosthesis", "Thickened fluids forever", "Radiotherapy"], "k": "C", "x": "Central leak through valve → valve incompetence (Candida, wear) → replace prosthesis ± antifungal"}, {"n": 18, "s": "Liquid leaks around the TEP prosthesis through an enlarged puncture. First management is:", "o": ["Larger diameter prosthesis", "Temporary prosthesis removal", "Botulinum to cricopharyngeus", "Antifungal therapy", "Oral antibiotics"], "k": "B", "x": "Peripheral leak (enlarged tract) → temporary removal/smaller stent to shrink tract, purse-string or injection augmentation"}, {"n": 19, "s": "A laryngectomee has thick crusting at the stoma. The best long-term measure is:", "o": ["Oral antibiotics", "Topical steroids", "Permanent stomal stenting", "Heat-moisture exchanger", "Radiotherapy"], "k": "D", "x": "HME restores humidification, reduces crusting, cough and infection"}, {"n": 20, "s": "On day 8 after salvage laryngectomy, a stable patient has neck erythema and saliva in the drain from a small fistula. Management is:", "o": ["Immediate flap repair", "Return to theatre for pectoralis flap", "Oral feeding", "Steroids", "Conservative wound care"], "k": "E", "x": "Small fistula, stable patient → nil by mouth, wound care, pressure dressing, antibiotics; surgery for large/non-healing or carotid exposure"}, {"n": 21, "s": "On day 2 after laryngectomy with total thyroidectomy, a patient reports perioral tingling. Check the:", "o": ["Serum calcium", "Serum sodium", "Glucose", "Potassium", "Magnesium only"], "k": "A", "x": "Hypocalcaemia after total thyroidectomy (parathyroids) → check calcium, IV calcium gluconate if symptomatic"}, {"n": 22, "s": "A trumpet player has a neck swelling that appears on blowing. The investigation of choice is:", "o": ["Ultrasound only", "Barium swallow", "CT neck", "Plain X-ray", "Angiography"], "k": "C", "x": "Laryngocele: CT defines internal/external/combined and excludes saccular carcinoma"}, {"n": 23, "s": "A patient with rheumatoid arthritis has progressive stridor; both folds are fixed near the midline and EMG is normal. The diagnosis is:", "o": ["Bilateral recurrent nerve palsy", "Cricoarytenoid ankylosis", "Laryngeal cancer", "Laryngomalacia", "Myasthenia"], "k": "B", "x": "RA cricoarytenoid ankylosis: fixed folds with normal EMG; tracheostomy or posterior cordotomy/arytenoidectomy"}, {"n": 24, "s": "A patient has bilateral auricular chondritis and expiratory collapse of the trachea on bronchoscopy. The diagnosis is:", "o": ["GPA", "Sarcoidosis", "Laryngotracheal amyloidosis", "Relapsing polychondritis", "Tuberculosis"], "k": "D", "x": "Relapsing polychondritis: auricular, nasal and laryngotracheal chondritis; airway collapse is the major cause of death"}, {"n": 25, "s": "A patient with GPA in remission has subglottic stenosis. Initial management is:", "o": ["Laryngectomy", "Open cricotracheal resection now", "Radiotherapy", "Observation", "Steroid injection and dilation"], "k": "E", "x": "GPA subglottic stenosis: intralesional steroid + dilation (endoscopic); open resection only in quiescent, refractory disease"}, {"n": 26, "s": "Five months after radiotherapy for glottic cancer, a patient has persistent laryngeal oedema and pain. The next step is:", "o": ["Reassure", "Long-term antibiotics only", "Biopsy and PET-CT", "Voice therapy", "Steroids only"], "k": "C", "x": "Persistent oedema/pain >3 months after RT → exclude recurrence (biopsy, PET-CT); chondroradionecrosis is the differential"}, {"n": 27, "s": "Biopsy-negative chondroradionecrosis of the larynx is treated with:", "o": ["Hyperbaric oxygen", "Re-irradiation", "Chemotherapy", "Observation alone indefinitely", "Laser excision"], "k": "A", "x": "Chondroradionecrosis: antibiotics, steroids, hyperbaric oxygen; laryngectomy for non-functional larynx"}, {"n": 28, "s": "An ICU patient has new unilateral fold paralysis with aspiration and a weak cough. Best management is:", "o": ["Wait twelve months for recovery", "Early injection laryngoplasty", "Thyroplasty type III", "Arytenoidectomy", "Tracheostomy only"], "k": "B", "x": "Early injection augmentation improves cough and aspiration; can be done at bedside under LA"}, {"n": 29, "s": "LPR symptoms persist after 3 months of twice-daily PPI. The next step is:", "o": ["Increase to triple dose", "Laparoscopic fundoplication now", "Stop PPI", "pH-impedance monitoring", "Barium swallow"], "k": "D", "x": "Refractory LPR → 24-h pH-impedance (non-acid reflux) ± oesophageal manometry before surgery"}, {"n": 30, "s": "A long-term tracheostomy patient with an overinflated cuff and an NG tube coughs up feed through the tracheostomy. The likely diagnosis is:", "o": ["Simple aspiration of saliva", "Tube blockage", "Pneumonia", "Granuloma", "Tracheo-oesophageal fistula"], "k": "E", "x": "TOF from cuff erosion against NG tube → small cuff below fistula, remove NG, gastrostomy, later repair"}, {"n": 31, "s": "A thin, web-like post-intubation subglottic stenosis (Cotton-Myer II) is treated first by:", "o": ["Tracheostomy", "Laryngectomy", "Endoscopic dilation", "Observation", "Open laryngotracheal reconstruction"], "k": "C", "x": "Thin grade I–II scar → endoscopic dilation ± radial laser incisions ± steroid"}, {"n": 32, "s": "A stridulous patient with an obstructing glottic cancer awaits laryngectomy. The preferred airway approach is:", "o": ["Emergency tracheostomy", "Transoral tumour debulking", "Long-term intubation", "Heliox therapy for several weeks", "Cricothyroidotomy"], "k": "B", "x": "Transoral debulking avoids pre-laryngectomy tracheostomy (stomal recurrence, tumour seeding)"}, {"n": 33, "s": "After thyroidectomy, a patient has a rapidly enlarging neck swelling with stridor. The first step is:", "o": ["Open the wound at bedside", "CT neck", "Nebulised adrenaline and review", "Steroids", "Reintubate immediately"], "k": "A", "x": "Neck haematoma → SCOOP (skin exposure, cut sutures, open, out, pack) at bedside, then theatre"}, {"n": 34, "s": "Laryngeal tuberculosis is confirmed on biopsy. Management is:", "o": ["Laryngectomy", "Radiotherapy to the larynx", "Laser excision", "Antituberculous therapy", "Steroids alone"], "k": "D", "x": "Anti-TB therapy (6 months); highly infectious; voice usually recovers"}, {"n": 35, "s": "Laryngeal sarcoidosis is narrowing the airway. Local treatment is:", "o": ["Laryngectomy", "Radiotherapy", "Long-course antibiotics", "Observation", "Intralesional steroids"], "k": "E", "x": "Intralesional steroids (± CO2 laser) for obstructing laryngeal sarcoid"}, {"n": 36, "s": "Recurrent localised laryngeal amyloid causes hoarseness. Treatment is:", "o": ["Radiotherapy", "Chemotherapy", "Endoscopic CO2 debulking", "Total laryngectomy upfront", "Steroids"], "k": "C", "x": "Endoscopic CO2 laser debulking; recurrence common; screen for systemic amyloid"}, {"n": 37, "s": "A feature favouring adductor spasmodic dysphonia over muscle tension dysphonia is:", "o": ["Constant strain on all tasks", "Normal voice when laughing", "Worse after illness", "Laryngeal tenderness", "Supraglottic squeeze only"], "k": "B", "x": "ADSD is task-specific: normal laughing, singing, whispering; MTD constant strain"}, {"n": 38, "s": "The most effective vocal hygiene measure is:", "o": ["Systemic hydration", "Whispering", "Throat clearing", "Caffeinated drinks often", "Menthol lozenges"], "k": "A", "x": "Systemic hydration (thin mucus, better vibration); avoid throat clearing, whispering, caffeine excess"}, {"n": 39, "s": "A 16-year-old boy persistently uses a high-pitched voice. First-line treatment is:", "o": ["Type III thyroplasty", "Testosterone", "Botulinum", "Voice therapy", "Type IV thyroplasty"], "k": "D", "x": "Puberphonia → voice therapy (laryngeal lowering) — usually rapid success; type III thyroplasty if refractory"}, {"n": 40, "s": "An anterior glottic web forms after bilateral anterior commissure laser surgery. Treatment is:", "o": ["Observation for two years", "Steroids", "Voice therapy", "Radiotherapy", "Web division with keel"], "k": "E", "x": "Web division (laser/cold steel) with silicone keel/stent ± mitomycin; prevention = stage bilateral AC surgery"}, {"n": 41, "s": "Before decannulation, a typical step is:", "o": ["Immediate removal", "Upsizing to a larger tube", "Downsize and cap trial", "Cuff inflation", "Sedation"], "k": "C", "x": "Downsize to cuffless/smaller tube, then capping for 24–48 h (including sleep), then decannulate"}, {"n": 42, "s": "A conscious adult is choking and cannot speak or cough. The first action is:", "o": ["Blind finger sweep", "Abdominal thrusts", "Cricothyroidotomy", "Lie flat", "Water to drink"], "k": "B", "x": "Ineffective cough → 5 back blows then 5 abdominal thrusts (Heimlich); no blind finger sweep"}, {"n": 43, "s": "On day 1 after tracheostomy, surgical emphysema is spreading. The first step is:", "o": ["Ignore", "Tighten sutures", "Antibiotics", "Loosen packing and check CXR", "Replace with larger cuffed tube"], "k": "D", "x": "Loosen d
