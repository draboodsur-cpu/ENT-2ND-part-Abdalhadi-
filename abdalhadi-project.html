first; avoid open biopsy before full work-up (seeding, compromised definitive surgery)"}, {"n": 32, "s": "Suspected lymphoma is best diagnosed by:", "o": ["FNA cytology alone", "Blood film", "CT", "PET", "Excision biopsy"], "k": "E", "x": "Excision (or core) biopsy for architecture and flow cytometry; FNA alone insufficient"}, {"n": 33, "s": "Zone II of the neck extends from the:", "o": ["Cricoid to angle", "Clavicle to cricoid", "Angle to skull base", "Hyoid to clavicle", "Mastoid to clavicle"], "k": "A", "x": "Zone I: clavicle–cricoid · II: cricoid–angle of mandible · III: angle–skull base"}, {"n": 34, "s": "A penetrating neck wound with an expanding haematoma requires:", "o": ["CTA", "Immediate exploration", "Observation", "Contrast oesophagram first", "Ultrasound"], "k": "B", "x": "Hard signs (expanding/pulsatile haematoma, active bleeding, bruit/thrill, shock, air bubbling, airway compromise) → immediate exploration"}, {"n": 35, "s": "A stable penetrating zone II injury without hard signs is assessed with:", "o": ["Mandatory exploration", "Observation only", "Angiography and surgery", "CT angiography", "Plain X-ray"], "k": "D", "x": "Stable, no hard signs → CTA (\"no-zone\" approach) ± endoscopy/oesophagram"}, {"n": 36, "s": "If a penetrating wound does not breach the platysma:", "o": ["Explore", "CTA", "Oesophagoscopy", "Admit for several days", "Local wound care"], "k": "E", "x": "Platysma intact = superficial wound → local care"}, {"n": 37, "s": "Blunt cerebrovascular injury screening uses:", "o": ["Duplex", "MRI", "CT angiography", "X-ray", "Angiography always"], "k": "C", "x": "CTA (Denver/Memphis criteria) for blunt cerebrovascular injury"}, {"n": 38, "s": "Suspected oesophageal injury is best excluded by:", "o": ["Oesophagram with endoscopy", "CT alone", "X-ray", "Observation", "Nasogastric aspirate testing"], "k": "A", "x": "Combined contrast oesophagram + oesophagoscopy (sensitivity ~100%); missed injury → mediastinitis"}, {"n": 39, "s": "The infrahyoid strap muscles are innervated mainly by the:", "o": ["Hypoglossal", "Recurrent laryngeal", "Facial", "Ansa cervicalis", "Accessory"], "k": "D", "x": "Ansa cervicalis (C1–C3); thyrohyoid via C1 fibres travelling with XII"}, {"n": 40, "s": "Infections of the infrahyoid neck are limited superiorly by the:", "o": ["Mandible", "Hyoid", "Skull base", "Clavicle", "Cricoid"], "k": "B", "x": "Hyoid divides suprahyoid and infrahyoid compartments; infrahyoid infections tracking to mediastinum"}, {"n": 41, "s": "The pretracheal space can spread infection into the:", "o": ["Posterior mediastinum", "Pleura", "Coccyx", "Diaphragm", "Anterior mediastinum"], "k": "E", "x": "Pretracheal (anterior visceral) space → anterior superior mediastinum (pericardium)"}, {"n": 42, "s": "Severe trismus after a third molar infection suggests abscess of the:", "o": ["Retropharyngeal space", "Danger space", "Masticator space", "Pretracheal", "Prevertebral"], "k": "C", "x": "Masticator space (third molar, inferior alveolar block) → severe trismus"}, {"n": 43, "s": "Adult retropharyngeal abscess is most often caused by:", "o": ["Trauma or foreign body", "Suppurative retropharyngeal nodes", "Mastoiditis", "Sinusitis", "Dental"], "k": "A", "x": "Adults: trauma, fish-bone/foreign body, instrumentation; children: suppurative retropharyngeal nodes"}, {"n": 44, "s": "The retropharyngeal space lies between the buccopharyngeal fascia and the:", "o": ["Prevertebral", "Alar fascia", "Pretracheal", "Carotid sheath", "Investing layer"], "k": "B", "x": "Retropharyngeal: buccopharyngeal fascia anteriorly, alar fascia posteriorly"}, {"n": 45, "s": "Symptoms or signs attributable to a carotid ganglioma may include all of the following except:", "o": ["Pulsatile tinnitus", "Dysphagia", "Hoarseness", "Palpitations", "Flushing"], "k": "A", "x": "(PP ENT-A Q38) ⚠ — Pulsatile tinnitus belongs to temporal bone paragangliomas; carotid body tumours may cause dysphagia/hoarseness (vagal) and rarely catecholamine symptoms"}, {"n": 46, "s": "What are the contents of the carotid sheath?", "o": ["The common carotid artery (including the internal and external carotid arteries); cranial nerves IX, X, XI, and XII; and the ansa cervicalis", "The internal jugular vein; the common carotid artery (including the internal and external carotid arteries); and cranial nerves X, XI, and XII", "The common carotid artery (including the internal and external carotid arteries) and cranial nerves IX, X, and XI", "The common carotid artery (including the internal and external carotid arteries); the internal jugular vein; and cranial nerves IX, X, and XI"], "k": "D", "x": "(PP ENT-A Q70) ⚠ — Carotid sheath: CCA/ICA, IJV, vagus; IX, XI (and XII) traverse its upper part — key D (only option with IJV and IX–XI)"}, {"n": 47, "s": "Which bacteria are most commonly cultured from deep space neck abscesses?", "o": ["Aerobic gram-negative bacilli", "Actinomyces israelii", "Streptococci species", "Staphylococci species", "Pseudomonas species"], "k": "C", "x": "(PP ENT-B Q67) — Streptococci (viridans, S. anginosus group) commonest; mixed with anaerobes"}, {"n": 48, "s": "The strap muscles of the neck are enveloped in the:", "o": ["Deep layer of the deep cervical fascia", "Middle layer of the deep cervical fascia", "Superficial layer of the deep cervical fascia", "Carotid sheath", "None of the above"], "k": "B", "x": "(PP ENT-B Q84) — Middle layer (muscular division) envelops the infrahyoid strap muscles"}, {"n": 49, "s": "During a tonsillectomy, the surgeon accidentally traverses the tonsil bed and muscle directly posterolateral. Which of the following structures is in most danger of being damaged?", "o": ["Common carotid artery", "Hypoglossal nerve", "Ascending pharyngeal artery", "Mandibular nerve", "External carotid artery"], "k": "C", "x": "(PP ENT-B Q94) ⚠ — ICA lies ~2.5 cm posterolateral (not offered); ascending pharyngeal artery runs on the pharyngeal wall close behind the tonsil bed → key C"}, {"n": 50, "s": "Trismus associated with deep neck infection is most indicative of:", "o": ["Peritonsillar abscess", "Parapharyngeal abscess", "Parotitis", "Submandibular abscess", "Infection tracking along the carotid sheath"], "k": "B", "x": "(PP ENT-B Q97) ⚠ — Trismus indicates pterygoid (medial pterygoid) irritation → parapharyngeal (prestyloid) space; PTA can also cause trismus but key B"}]}, {"c": 4, "t": "Session 6", "d": "Reconstruction & Flaps", "q": [{"n": 1, "s": "The reconstructive ladder means choosing:", "o": ["The most complex option", "Free flap first", "The simplest adequate option", "Grafts always", "Healing by secondary intention always"], "k": "C", "x": "Ladder: secondary intention → primary closure → graft → local flap → regional → free flap; \"elevator\" = choose the best option directly when function demands"}, {"n": 2, "s": "A random pattern flap relies on the:", "o": ["Subdermal plexus", "Named artery", "Perforator", "Underlying muscle belly", "Periosteum"], "k": "A", "x": "Random pattern: subdermal plexus; length:width ~3–4:1 on the well-perfused face"}, {"n": 3, "s": "An axial pattern flap is supplied by a:", "o": ["Subdermal plexus", "Periosteum", "Random vessels", "Fascia only", "Named artery"], "k": "E", "x": "Axial: named artery along its axis (forehead–supratrochlear, nasolabial–angular)"}, {"n": 4, "s": "An interpolated flap:", "o": ["Is single-stage", "Needs a second stage", "Is a free flap", "Is a graft", "Advances in a straight line"], "k": "B", "x": "Interpolated flap crosses intact skin → pedicle divided at a second stage (paramedian forehead, cheek-to-nose)"}, {"n": 5, "s": "The rhomboid (Limberg) flap is based on angles of:", "o": ["30° and 150°", "45° and 135°", "90° only", "60° and 120°", "75° and 105°"], "k": "D", "x": "Rhombus with 60°/120° angles; the flap's short side equals rhombus side"}, {"n": 6, "s": "The bilobed flap is best suited to small defects of the:", "o": ["Forehead", "Scalp", "Nasal tip", "Lower lip", "Anterior neck"], "k": "C", "x": "Bilobed (Zitelli): nasal tip/ala defects ≤1.5 cm; total rotation 90–100° (each lobe ~45–50°)"}, {"n": 7, "s": "The paramedian forehead flap is based on the:", "o": ["Supratrochlear artery", "Superficial temporal artery", "Angular vein", "Facial artery", "Occipital"], "k": "A", "x": "Supratrochlear artery (axial), pedicle ~1.2–1.5 cm wide"}, {"n": 8, "s": "The paramedian forehead flap pedicle is usually divided at about:", "o": ["1 week", "6 months", "1 day", "3 months", "3 weeks"], "k": "E", "x": "Division at ~3 weeks (two-stage) or three-stage with intermediate thinning"}, {"n": 9, "s": "A 60° Z-plasty lengthens the central limb by about:", "o": ["25%", "75%", "50%", "100%", "120%"], "k": "B", "x": "30° → 25% · 45° → 50% · 60° → 75% · 75° → 100% · 90° → 120%"}, {"n": 10, "s": "Compared with a split-thickness graft, a full-thickness skin graft shows:", "o": ["More secondary contraction", "Better take", "Thinner", "Less secondary contraction", "Needs no bed"], "k": "D", "x": "FTSG: more primary (immediate recoil), less secondary contraction, better colour match; STSG: less primary, more secondary contraction"}, {"n": 11, "s": "During the first 48 hours a skin graft survives by:", "o": ["Inosculation", "Neovascularisation", "Plasmatic imbibition", "Oxygen diffusion from air", "Lymphatics"], "k": "C", "x": "Imbibition (0–48 h) → inosculation (48–72 h) → revascularisation (~day 5–7)"}, {"n": 12, "s": "The commonest cause of skin graft failure is:", "o": ["Infection", "Smoking", "Steroids", "Wrong thickness", "Haematoma"], "k": "E", "x": "Haematoma/seroma lifting the graft (also shear, infection) → bolster dressing"}, {"n": 13, "s": "A composite graft survives only if no part lies further from a vascular edge than about:", "o": ["1–1.5 cm", "5 cm", "3 cm", "10 cm", "Any size"], "k": "A", "x": "Composite grafts (e.g. auricular for ala) ≤1–1.5 cm; cool them post-op"}, {"n": 14, "s": "An alar defect is commonly reconstructed with a:", "o": ["Rhomboid", "Abbe flap", "Karapandzic flap", "Nasolabial flap", "Estlander"], "k": "D", "x": "Nasolabial (melolabial) flap — alar and sidewall defects (one- or two-stage)"}, {"n": 15, "s": "The pectoralis major flap is based on the:", "o": ["Lateral thoracic", "Thoracoacromial", "Internal mammary", "Thoracodorsal", "Transverse cervical"], "k": "B", "x": "Thoracoacromial (pectoral branch) ± lateral thoracic; workhorse regional flap"}, {"n": 16, "s": "The deltopectoral flap is based on the:", "o": ["Thoracoacromial", "Thoracodorsal", "Internal mammary", "Transverse cervical", "Lateral thoracic"], "k": "C", "x": "Internal mammary perforators (2nd–4th spaces); medially based; delay improves distal tip survival"}, {"n": 17, "s": "The latissimus dorsi flap is based on the:", "o": ["Lateral thoracic", "Internal mammary", "Circumflex scapular", "Dorsal scapular", "Thoracodorsal"], "k": "E", "x": "Thoracodorsal (subscapular system)"}, {"n": 18, "s": "The supraclavicular artery island flap derives from the:", "o": ["Transverse cervical", "Suprascapular", "Thyrocervical", "Dorsal scapular artery", "Subclavian"], "k": "A", "x": "Supraclavicular artery from transverse cervical (rarely suprascapular) — thin, pliable"}, {"n": 19, "s": "The submental flap is based on a branch of the:", "o": ["Lingual artery", "Superior thyroid", "Occipital", "Facial artery", "Mental artery"], "k": "D", "x": "Submental artery (facial branch) — oral cavity, lower face; caution with level I nodes"}, {"n": 20, "s": "The temporalis muscle flap is supplied by the:", "o": ["Superficial temporal", "Deep temporal arteries", "Middle meningeal artery", "Facial", "Occipital"], "k": "B", "x": "Deep temporal (from maxillary) — orbit, palate, skull base"}, {"n": 21, "s": "The lower trapezius island flap is based on the:", "o": ["Thoracodorsal", "Occipital artery", "Dorsal scapular", "Facial", "Lingual"], "k": "C", "x": "Dorsal scapular (± transverse cervical) — posterior neck/scalp/skull base"}, {"n": 22, "s": "Before harvesting a radial forearm flap, perform:", "o": ["Doppler of leg", "Phalen's", "Tinel's", "ABPI", "Allen's test"], "k": "E", "x": "Allen's test (ulnar collateral supply to the hand)"}, {"n": 23, "s": "The ALT flap is based on the:", "o": ["Descending branch LCFA", "Superficial femoral", "Profunda femoris trunk", "DIEA", "Medial circumflex"], "k": "A", "x": "Descending branch of lateral circumflex femoral; perforators mostly musculocutaneous (vastus lateralis)"}, {"n": 24, "s": "When harvesting a fibula flap, preserve bone proximally and distally of about:", "o": ["1 cm", "2 cm", "15–20 cm", "6–7 cm", "None"], "k": "D", "x": "Preserve ~6–7 cm proximal (peroneal nerve) and distal (ankle stability); up to ~25 cm bone; CTA if pulses abnormal (peronea magna)"}, {"n": 25, "s": "The scapular tip flap is supplied by the:", "o": ["Circumflex scapular", "Angular branch", "Transverse cervical", "Suprascapular", "Dorsal scapular"], "k": "B", "x": "Angular branch of thoracodorsal; scapular/parascapular = circumflex scapular"}, {"n": 26, "s": "The iliac crest free flap is based on the:", "o": ["SIEA", "Superficial circumflex iliac", "Deep circumflex iliac", "Femoral", "Obturator"], "k": "C", "x": "Deep circumflex iliac (± internal oblique muscle) — large bone stock for mandible"}, {"n": 27, "s": "The free jejunal flap is supplied by branches of the:", "o": ["IMA", "Coeliac", "Gastroduodenal", "Ileocolic", "SMA"], "k": "E", "x": "Jejunal branches of the SMA"}, {"n": 28, "s": "The rectus abdominis flap is based on the:", "o": ["Deep inferior epigastric", "Superficial epigastric", "Lower intercostal arteries", "Femoral", "Obturator"], "k": "A", "x": "Deep inferior epigastric artery"}, {"n": 29, "s": "The gracilis flap for smile reanimation is innervated by the:", "o": ["Femoral", "Sciatic", "Saphenous", "Obturator", "Genitofemoral"], "k": "D", "x": "Obturator (anterior branch); pedicle = adductor branch of medial circumflex femoral → coapt to masseteric/cross-face graft"}, {"n": 30, "s": "The lateral arm flap is based on the:", "o": ["Brachial", "Posterior radial collateral", "Ulnar", "Profunda brachii trunk only", "Radial recurrent"], "k": "B", "x": "Posterior radial collateral (profunda brachii branch)"}, {"n": 31, "s": "The commonest cause of free flap failure is:", "o": ["Arterial thrombosis", "Infection", "Venous thrombosis", "Haematoma", "Vasospasm"], "k": "C", "x": "Venous thrombosis more common than arterial"}, {"n": 32, "s": "Most free flap failures occur within the:", "o": ["2 weeks", "First month", "7 days", "6 months", "48–72 hours"], "k": "E", "x": "Most within 48–72 h — hourly monitoring; salvage ~50–80% if early return"}, {"n": 33, "s": "Venous congestion of a free flap shows:", "o": ["Dark brisk bleeding", "Pale, cool, no refill", "No bleeding", "Normal", "Slow refill"], "k": "A", "x": "Venous congestion: blue/purple, swollen, brisk dark bleeding on pinprick, rapid refill"}, {"n": 34, "s": "Arterial insufficiency of a free flap shows:", "o": ["Blue swelling", "Rapid refill", "Dark bleeding", "Pale, no refill", "Increased warmth and redness"], "k": "D", "x": "Arterial: pale, cool, no/slow capillary refill, no bleeding on pinprick"}, {"n": 35, "s": "Leech therapy requires antibiotic prophylaxis against:", "o": ["Pseudomonas", "Aeromonas", "Staph", "Candida", "Clostridium"], "k": "B", "x": "Aeromonas hydrophila (gut flora of Hirudo) → ciprofloxacin/co-trimoxazole"}, {"n": 36, "s": "The free flap least tolerant of ischaemia is the:", "o": ["Fibula", "ALT", "Jejunum", "Radial forearm", "Latissimus"], "k": "C", "x": "Jejunum (mucosa) tolerates only ~1–2 h warm ischaemia"}, {"n": 37, "s": "An anterior mandibular segmental defect is best reconstructed with:", "o": ["Pectoralis alone", "Plate alone", "Soft tissue free flap", "No reconstruction", "Vascularised bone"], "k": "E", "x": "Vascularised bone (fibula) — anterior defects without bone → \"Andy Gump\" deformity"}, {"n": 38, "s": "A small palatal defect in an elderly unfit patient is best managed with an:", "o": ["Obturator", "Free fibula", "Scapula", "ALT", "Iliac crest"], "k": "A", "x": "Obturator prosthesis: simple, allows surveillance of cavity; free flap for larger/younger"}, {"n": 39, "s": "Hemiglossectomy is commonly reconstructed with a:", "o": ["Fibula", "Iliac crest with muscle", "Pectoralis", "Radial forearm", "Scapula"], "k": "D", "x": "Radial forearm: thin, pliable, preserves mobility; total glossectomy → bulky ALT/rectus"}, {"n": 40, "s": "Scalp flap advancement is increased by:", "o": ["Undermining subcutaneous", "Shaving", "Galeal scoring", "Steroids", "Drains"], "k": "C", "x": "Galeal scoring (perpendicular to advancement, avoid vessels) — each score ~1–2 mm gain"}, {"n": 41, "s": "The Abbe flap is a:", "o": ["Single-stage commissure flap", "Two-stage cross-lip", "Circumoral", "Free flap", "Graft"], "k": "B", "x": "Abbe: lip-switch on labial artery, divided at ~2–3 weeks (central defects 1/3–2/3)"}, {"n": 42, "s": "A lip defect involving the commissure is reconstructed with an:", "o": ["Abbe", "Karapandzic", "Bernard", "Gillies fan", "Estlander"], "k": "E", "x": "Estlander: single-stage cross-lip at commissure (rounds commissure — later commissuroplasty)"}, {"n": 43, "s": "When over 50% of a nasal subunit is lost:", "o": ["Replace the whole subunit", "Graft only the exact defect", "Leave it", "Primary closure", "Secondary intention"], "k": "A", "x": "Burget-Menick subunit principle: if >50% lost, replace whole subunit"}, {"n": 44, "s": "A small helical rim cancer is best excised by:", "o": ["Total auriculectomy", "Shave", "Cryotherapy", "Wedge excision", "Laser"], "k": "D", "x": "Wedge (or star) excision with primary closure for helical rim tumours"}, {"n": 45, "s": "A major patient factor impairing flap survival is:", "o": ["Age", "Blood group type", "Smoking", "Height", "Sex"], "k": "C", "x": "Smoking (vasoconstriction, CO); also diabetes, radiation, malnutrition"}, {"n": 46, "s": "The surface course of the frontal branch of the facial nerve follows:", "o": ["Frankfort line", "Pitanguy's line", "Langer's tension lines", "Blaschko", "Hilton"], "k": "B", "x": "Pitanguy's line: 0.5 cm below tragus to 1.5 cm above the lateral eyebrow"}, {"n": 47, "s": "Which soft-tissue donor site has proven to be the most versatile, reliable, and commonly used?", "o": ["The ulnar forearm flap", "The radial forearm flap", "The lateral arm flap", "The rectus flap"], "k": "B", "x": "(PP ENT-A Q2) — Radial forearm free flap — thin, pliable, long pedicle, reliable"}, {"n": 48, "s": "Which of the following flaps is the most susceptible to ischemic injury?", "o": ["Deltopectoral flap", "Pectoralis major myocutaneous flap", "Radial forearm free flap", "Lateral thigh free flap", "Jejunal free flap"], "k": "E", "x": "(PP ENT-A Q27) — Jejunal free flap (shortest ischaemia tolerance)"}, {"n": 49, "s": "The greatest single factor in reconstructive skin flap necrosis is:", "o": ["Hematoma formation", "Inadequate arterial inflow", "Poor nutritional state of patient", "Excessive tension", "Excessive length/width ratio"], "k": "D", "x": "(PP ENT-B Q38) ⚠ — Old-bank key: excessive tension is the greatest single factor in local skin flap necrosis (inadequate inflow is arguable but less \"classic\")"}, {"n": 50, "s": "The frontal branch of the facial nerve runs deep to which of the following structures?", "o": ["Temporal parietal fascia", "Superficial layer of the deep temporal fascia", "Deep layer of the deep temporal fascia", "Periosteum of the zygomatic arch", "Temporal fat pad"], "k": "A", "x": "(PP ENT-A Q67) — Frontal branch lies within/deep to the temporoparietal fascia (SMAS continuation) → dissect deep to it on the deep temporal fascia (or subperiosteal over the arch)"}]}, {"c": 4, "t": "Session 7", "d": "Skin Cancer, Melanoma, Jaw Lesions, Clinical H&N", "q": [{"n": 1, "s": "The commonest skin cancer of the head and neck is:", "o": ["SCC", "Melanoma", "Merkel", "DFSP", "BCC"], "k": "E", "x": "BCC (~75–80% of skin cancers); nodular commonest subtype; locally destructive, rarely metastasises"}, {"n": 2, "s": "Infiltrative (morphoeic) BCC on the nose is best treated by:", "o": ["Cryotherapy", "Imiquimod", "Mohs surgery", "Curettage and cautery", "Observation"], "k": "C", "x": "Mohs micrographic surgery: infiltrative/morphoeic, recurrent, ill-defined, H-zone tumours — highest cure, tissue sparing"}, {"n": 3, "s": "An indication for Mohs surgery is a skin cancer located in the:", "o": ["H-zone of the face", "Back", "Trunk or upper limb", "Thigh", "Arm"], "k": "A", "x": "H-zone (central face, eyelids, nose, lips, ears, temple) — high recurrence, tissue-sparing needed"}, {"n": 4, "s": "The standard peripheral margin for a well-defined BCC under 2 cm is:", "o": ["1 mm", "10 mm", "2 cm", "4 mm", "20 mm"], "k": "D", "x": "4 mm for well-defined BCC <2 cm (~95% clearance); ≥5–10 mm or Mohs for high-risk"}, {"n": 5, "s": "High-risk cutaneous SCC needs peripheral margins of at least:", "o": ["2 mm", "6 mm", "3 cm", "1 mm", "5 cm"], "k": "B", "x": "High-risk cSCC (≥2 cm, ill-defined, poorly differentiated, PNI, depth >6 mm, recurrent, immunosuppressed) → ≥6 mm (or Mohs)"}, {"n": 6, "s": "cSCC with named-nerve perineural invasion needs:", "o": ["Observation", "Imiquimod", "Wide re-excision alone", "Cryotherapy", "Adjuvant radiotherapy"], "k": "E", "x": "Named-nerve PNI → adjuvant RT along nerve to skull base; MRI for perineural spread"}, {"n": 7, "s": "A rapidly growing crateriform nodule with a central keratin plug should be:", "o": ["Observed", "Frozen", "Treated as SCC", "Treated with steroids", "Shaved"], "k": "C", "x": "Keratoacanthoma cannot be reliably distinguished from SCC → excise as SCC"}, {"n": 8, "s": "Merkel cell carcinoma shows:", "o": ["CK20 perinuclear dot", "S100 only", "CD34", "HMB-45", "TTF-1 strong nuclear stain"], "k": "A", "x": "CK20 perinuclear dot, neuroendocrine markers, Merkel polyomavirus; TTF-1 negative (vs small cell lung)"}, {"n": 9, "s": "The most important primary tumour prognostic factor in melanoma is:", "o": ["Diameter", "Colour", "Clark level of invasion", "Age", "Breslow thickness"], "k": "E", "x": "Breslow thickness (+ ulceration) — basis of AJCC T category"}, {"n": 10, "s": "The excision margin for melanoma thicker than 2 mm is:", "o": ["0.5 cm", "1 cm", "3 cm", "2 cm", "5 cm"], "k": "D", "x": "In situ 0.5–1 cm · ≤1 mm 1 cm · 1–2 mm 1–2 cm · >2 mm 2 cm (modified on face for function)"}, {"n": 11, "s": "SLNB is offered for melanoma with Breslow thickness above:", "o": ["0.1 mm", "0.4 mm", "0.8 mm", "4 mm only", "10 mm"], "k": "C", "x": "SLNB for T1b (0.8–1 mm or ulcerated) and above; consider for T1a with adverse features"}, {"n": 12, "s": "MSLT-II showed that after a positive SLNB, completion lymph node dissection:", "o": ["Improved survival", "Did not improve survival", "Was mandatory", "Worsened survival", "Improved melanoma-specific survival"], "k": "B", "x": "MSLT-II/DeCOG: completion dissection improved regional control but not melanoma-specific survival → nodal ultrasound surveillance"}, {"n": 13, "s": "Mucosal melanoma of the head and neck is staged at least:", "o": ["T1", "T2", "Tis", "T4b only", "T3"], "k": "E", "x": "Mucosal melanoma: T3 minimum (mucosal disease), T4a/T4b by invasion; poor survival; surgery + RT"}, {"n": 14, "s": "Lentigo maligna on the elderly face is best treated by:", "o": ["Staged excision", "Laser", "Cryotherapy", "Observation", "Primary RT alone"], "k": "A", "x": "Staged (margin-controlled, \"slow Mohs\") excision; imiquimod/RT if unfit"}, {"n": 15, "s": "Resected stage III melanoma is treated with adjuvant:", "o": ["Interferon", "Chemotherapy", "Anti-PD-1 therapy", "Observation only", "Radiotherapy only"], "k": "C", "x": "Adjuvant anti-PD-1 (nivolumab/pembrolizumab) or BRAF/MEK (dabrafenib-trametinib) if BRAF-mutant"}, {"n": 16, "s": "Ipilimumab, used with nivolumab in metastatic melanoma, targets:", "o": ["PD-1 receptor", "PD-L1", "EGFR", "CTLA-4", "VEGF"], "k": "D", "x": "Ipilimumab = anti-CTLA-4; combined with nivolumab (anti-PD-1) for metastatic melanoma — higher response, more immune toxicity (colitis, hypophysitis)"}, {"n": 17, "s": "Desmoplastic melanoma characteristically shows:", "o": ["No recurrence", "Nodal spread mostly", "Pigmentation", "Thin lesions", "Neurotropism"], "k": "E", "x": "Neurotropism, amelanotic, high local recurrence, low nodal spread → adjuvant RT"}, {"n": 18, "s": "Multiple BCCs, jaw keratocysts and palmar pits suggest:", "o": ["Muir-Torre", "Cowden", "Gorlin syndrome", "Peutz-Jeghers syndrome", "NF1"], "k": "C", "x": "Gorlin (naevoid BCC syndrome, PTCH1): avoid radiotherapy (new BCCs in field)"}, {"n": 19, "s": "cSCC incidence is greatly increased in:", "o": ["Transplant recipients", "Strict vegetarians", "Athletes", "Children", "Normal pregnancy state"], "k": "A", "x": "Organ transplant recipients: cSCC risk ×65–250, aggressive; reduce immunosuppression, switch to mTOR inhibitors"}, {"n": 20, "s": "A CD34-positive, slow-growing dermal tumour with high local recurrence is:", "o": ["Melanoma", "BCC", "Merkel", "Angiosarcoma", "DFSP"], "k": "E", "x": "Dermatofibrosarcoma protuberans: CD34+, COL1A1-PDGFB → Mohs/wide excision; imatinib for unresectable"}, {"n": 21, "s": "A bruise-like spreading scalp lesion in an elderly man is:", "o": ["Lipoma", "Angiosarcoma", "Cyst", "Pilomatrixoma", "Keloid"], "k": "B", "x": "Cutaneous angiosarcoma: elderly scalp/face, bruise-like, multifocal, poor prognosis (paclitaxel, RT)"}, {"n": 22, "s": "A multilocular \"soap bubble\" lesion of the posterior mandible is typically:", "o": ["Radicular cyst", "Fibrous dysplasia", "Ameloblastoma", "Osteoma", "Torus"], "k": "C", "x": "Ameloblastoma: posterior mandible, multilocular radiolucency, root resorption"}, {"n": 23, "s": "Ameloblastoma of the mandible is treated by:", "o": ["Curettage and observation", "Enucleation", "Marsupialisation", "Segmental resection", "RT"], "k": "D", "x": "Segmental/marginal resection with 1–1.5 cm bony margins; enucleation → high recurrence"}, {"n": 24, "s": "The odontogenic cyst with the highest recurrence rate is the:", "o": ["Radicular", "Dentigerous", "Residual", "Nasopalatine", "Keratocyst"], "k": "E", "x": "Odontogenic keratocyst (parakeratinised, satellite cysts) ~25–60% recurrence → enucleation + Carnoy's/peripheral ostectomy"}, {"n": 25, "s": "A cyst around the crown of an unerupted third molar is:", "o": ["Dentigerous", "Radicular", "Keratocyst", "Residual", "Lateral periodontal"], "k": "A", "x": "Dentigerous cyst attaches at cementoenamel junction around crown"}, {"n": 26, "s": "The commonest odontogenic cyst is the:", "o": ["Dentigerous", "Keratocyst", "Radicular", "Ameloblastic", "Glandular"], "k": "C", "x": "Radicular (periapical) cyst — non-vital tooth"}, {"n": 27, "s": "Exposed jaw bone for 8 weeks in a patient on zoledronate is:", "o": ["ORN", "MRONJ", "Osteomyelitis", "Tumour", "Torus"], "k": "B", "x": "Medication-related osteonecrosis of the jaw (bisphosphonates, denosumab, antiangiogenics) — no RT history (vs ORN)"}, {"n": 28, "s": "A ground-glass expansile maxillary lesion in a teenager is:", "o": ["Ameloblastoma", "Juvenile osteosarcoma", "Paget's", "Cyst", "Fibrous dysplasia"], "k": "E", "x": "Fibrous dysplasia (GNAS): ground-glass, ill-defined, blends with bone; McCune-Albright if polyostotic + endocrine + café-au-lait"}, {"n": 29, "s": "Unlike fibrous dysplasia, ossifying fibroma:", "o": ["Is diffuse", "Is untreatable", "Is part of McCune-Albright", "Is well-circumscribed", "Is malignant"], "k": "D", "x": "Ossifying fibroma: well-circumscribed, sclerotic rim → enucleation; FD conservative contouring"}, {"n": 30, "s": "A smoker with unilateral otalgia and normal otoscopy needs:", "o": ["Antibiotics", "Grommet", "Pharyngolaryngoscopy", "Reassurance", "Analgesia and review later"], "k": "C", "x": "Referred otalgia (IX/X) → examine oropharynx, hypopharynx, larynx (flexible endoscopy)"}, {"n": 31, "s": "An oral ulcer persisting beyond 3 weeks should be:", "o": ["Biopsied", "Observed", "Treated with steroids", "Given antifungals", "Cauterised"], "k": "A", "x": "Non-healing ulcer >3 weeks → biopsy (exclude SCC)"}, {"n": 32, "s": "\"Numb chin\" in a patient with known cancer suggests:", "o": ["Bell's palsy", "Dental abscess", "Classical trigeminal neuralgia", "Migraine", "Mandibular metastasis"], "k": "E", "x": "Numb chin syndrome (mental neuropathy): mandibular metastasis, lymphoma, perineural spread"}, {"n": 33, "s": "Facial cutaneous SCC with new facial weakness should prompt:", "o": ["Antivirals", "MRI with contrast", "Steroids", "Observation", "Facial physiotherapy"], "k": "B", "x": "Contrast MRI (neurography) for perineural spread along VII/V to skull base"}, {"n": 34, "s": "A grade 2 acneiform rash on cetuximab is managed by:", "o": ["Stopping cetuximab permanently", "Topical steroids alone", "Antihistamines", "Continue with doxycycline", "Isotretinoin"], "k": "D", "x": "Continue cetuximab; oral doxycycline/minocycline + topical steroid; hold only for grade 3–4"}, {"n": 35, "s": "A malnourished H&N patient started on tube feeds becomes weak and confused. The likely abnormality is:", "o": ["Hypercalcaemia", "Severe hypernatraemia", "Hypophosphataemia", "Hyperkalaemia", "Hyperglycaemia"], "k": "C", "x": "Refeeding syndrome: hypophosphataemia (± hypokalaemia, hypomagnesaemia, thiamine) → start slowly, replace"}, {"n": 36, "s": "After neck radiotherapy, patients need periodic:", "o": ["TSH testing", "Calcitonin", "Serum cortisol", "Glucose", "PTH"], "k": "A", "x": "Post-RT hypothyroidism (~20–50%) → TSH every 6–12 months"}, {"n": 37, "s": "H&N cancer survivors with a heavy smoking history may need:", "o": ["Bone scan", "Colonoscopy", "Brain MRI", "Annual PET-CT for life", "Low-dose chest CT"], "k": "E", "x": "Low-dose CT lung screening for eligible smokers (second primary lung cancer)"}, {"n": 38, "s": "Hypercalcaemia in advanced HNSCC is usually due to:", "o": ["Primary HPT", "PTHrP", "Vitamin D", "Immobility", "Thiazides"], "k": "B", "x": "Humoral hypercalcaemia of malignancy (PTHrP) — poor prognosis"}, {"n": 39, "s": "Eyelid sebaceous carcinoma in a patient with colon cancer suggests:", "o": ["Gorlin", "Gardner syndrome", "Cowden", "Muir-Torre", "NF2"], "k": "D", "x": "Muir-Torre (Lynch variant): sebaceous neoplasms + visceral (colorectal) cancer"}, {"n": 40, "s": "First-line systemic therapy for advanced Merkel cell carcinoma is:", "o": ["Avelumab", "Cetuximab", "Imatinib", "Dabrafenib", "Vismodegib"], "k": "A", "x": "Avelumab (anti-PD-L1) or pembrolizumab first-line for advanced Merkel cell"}, {"n": 41, "s": "In AJCC 8th melanoma T staging, which factor was removed?", "o": ["Ulceration", "Mitotic rate", "Breslow", "Satellite lesions", "Nodes"], "k": "B", "x": "AJCC 8th removed mitotic rate from T1 subcategorisation (uses thickness 0.8 mm and ulceration)"}, {"n": 42, "s": "What is the preferred biopsy technique for melanoma?", "o": ["Excisional biopsy", "Shave biopsy", "Cryotherapy", "Curettage", "Electrodessication"], "k": "A", "x": "(PP ENT-A Q6) — Excisional biopsy with 1–3 mm margins (full thickness for Breslow); incisional/punch acceptable for large facial lesions"}, {"n": 43, "s": "A patient given 3 L (3000 mL) of 5% dextrose-containing intravenous solutions daily will receive about:", "o": ["250 cal/24 hr", "600 cal/24 hr", "1000 cal/24 hr", "2000 cal/24 hr", "3000 cal/24 hr"], "k": "B", "x": "(PP ENT-B Q7) — 3 L × 50 g/L = 150 g × 3.4 kcal/g ≈ 510 kcal → ~600"}, {"n": 44, "s": "Mixed tumor of a salivary gland is so named because it:", "o": ["May be found in the submaxillary or parotid gland", "May be either benign or malignant", "Contains both epithelial and connective tissue elements", "Contains both squamous cell and adenocarcinoma components"], "k": "C", "x": "(PP ENT-B Q11) — Pleomorphic adenoma: epithelial/myoepithelial and mesenchymal (chondromyxoid) elements"}, {"n": 45, "s": "A parotid tumor which may occur bilaterally and which gives a \"hot\" scan with technetium 99m is:", "o": ["Pleomorphic adenoma", "Oxyphilic adenoma", "Oncocytoma", "Warthin tumor", "Squamous cell carcinoma"], "k": "D", "x": "(PP ENT-B Q28) — Warthin tumour: bilateral (~10–15%), hot on pertechnetate (oncocytoma also hot but rarely bilateral)"}, {"n": 46, "s": "Chronic nonobstructive sialodochiectasis (sialectasis) presents a sialographic pattern of:", "o": ["Diffuse dilatation of the peripheral ducts", "Stricture of the peripheral ducts", "One or more calculi", "Displacement of the ductal system", "Absence of ductal filling"], "k": "A", "x": "(PP ENT-B Q29) — Sialectasis: punctate/globular dilatation of peripheral ducts (\"snowstorm\"/\"leafless tree\" in advanced)"}, {"n": 47, "s": "Swelling of the parotid glands not infrequently follows ingestion of:", "o": ["Mercury", "Hypertonic glucose", "Lipase", "Iodides", "Amylase"], "k": "D", "x": "(PP ENT-B Q30) — Iodide mumps (iodide sialadenitis) after contrast or iodide ingestion"}, {"n": 48, "s": "The key to surgical removal of a branchial cleft cyst is:", "o": ["Aspiration of the cyst before surgery", "Transection of the sternocleidomastoid muscle", "Removal of the medial portion of the hyoid bone", "Dissection of the duct to its pharyngeal origin", "Cautery of the base"], "k": "D", "x": "(PP ENT-B Q35) — Follow the tract to its pharyngeal (tonsillar fossa) origin to prevent recurrence"}, {"n": 49, "s": "Cerebellar signs such as nystagmus, dysarthria, and ataxia may be produced by:", "o": ["Corticosteroids", "Diphenylhydantoin (phenytoin)", "Vitamin C", "Diphenhydramine (Benadryl)"], "k": "B", "x": "(PP ENT-B Q37) — Phenytoin toxicity: nystagmus, ataxia, dysarthria"}, {"n": 50, "s": "Computed tomography scans are the best imaging study for detection of:", "o": ["Neoplasm", "Calculi", "Abscesses", "Chronic inflammatory disease", "Parapharyngeal masses"], "k": "B", "x": "(PP ENT-B Q58) — CT best detects calculi (salivary, urinary); MRI better for soft tissue neoplasm"}]}, {"c": 4, "t": "Session 8", "d": "Gap Closure", "q": [{"n": 1, "s": "The commonest complication of rhytidectomy is:", "o": ["Facial nerve injury", "Haematoma", "Skin necrosis", "Infection", "Alopecia"], "k": "B", "x": "Haematoma (~2–8%; men up to ~8%) — hypertension, aspirin, male sex; expanding haematoma → immediate evacuation"}, {"n": 2, "s": "The nerve most commonly injured in facelift surgery is the:", "o": ["Frontal branch", "Marginal mandibular", "Buccal branch", "Great auricular", "Zygomatic"], "k": "D", "x": "Great auricular nerve (crosses SCM ~6.5 cm below EAC — McKinney's point); motor injury <1%"}, {"n": 3, "s": "After facelift, the facial branch most likely to recover spontaneously is the:", "o": ["Buccal", "Frontal", "Marginal mandibular", "Cervical", "Posterior auricular"], "k": "A", "x": "Buccal: rich arborisation/cross-innervation → recovers; frontal and marginal mandibular (terminal, few connections) recover least"}, {"n": 4, "s": "Superiorly, the SMAS is continuous with the:", "o": ["Galea only", "Periosteum", "Deep temporal fascia", "Platysma", "Temporoparietal"], "k": "E", "x": "SMAS: continuous with temporoparietal fascia above and platysma below; facial nerve branches lie deep to it"}, {"n": 5, "s": "Sudden painful proptosis and visual loss after blepharoplasty requires:", "o": ["Observation", "Ice packs only", "Canthotomy, cantholysis", "Antibiotics", "Urgent MRI of the orbit"], "k": "C", "x": "Retrobulbar haemorrhage: immediate lateral canthotomy + inferior cantholysis (± mannitol, steroids, acetazolamide); don't delay for imaging"}, {"n": 6, "s": "Lower lid laxity before blepharoplasty is assessed by the:", "o": ["Snap test", "Schirmer", "Bell's", "Jones test", "Cover test"], "k": "A", "x": "Snap test (and distraction test) for lower lid laxity → add canthopexy/canthoplasty to avoid ectropion"}, {"n": 7, "s": "The structure separating the medial and central lower lid fat pads is the:", "o": ["Lacrimal gland", "Superior oblique", "Lateral orbital septum", "Inferior oblique", "Levator"], "k": "D", "x": "Inferior oblique separates medial and central lower lid fat pads — protect it (diplopia)"}, {"n": 8, "s": "The upper eyelid has how many fat pads?", "o": ["One", "Two", "Three", "Four", "Five"], "k": "B", "x": "Upper lid: medial and central (preaponeurotic) pads; lacrimal gland laterally (don't mistake for fat)"}, {"n": 9, "s": "Botulinum toxin A acts by:", "o": ["Blocking ACh receptors", "Depolarising", "Muscle necrosis", "Calcium block", "Cleaving SNAP-25"], "k": "E", "x": "Cleaves SNAP-25 (SNARE) → blocks presynaptic ACh release; effect ~3–4 months"}, {"n": 10, "s": "Lid ptosis after glabellar botulinum injection is treated with:", "o": ["Further botulinum injection", "Steroid", "Apraclonidine drops", "Surgery", "Antibiotics"], "k": "C", "x": "Apraclonidine (α-agonist) stimulates Müller's muscle → lifts lid 1–2 mm; caused by diffusion to levator"}, {"n": 11, "s": "Blanching and pain immediately after hyaluronic acid filler injection is treated with:", "o": ["Ice", "Oral steroids course", "Antibiotics", "Hyaluronidase", "Observation"], "k": "D", "x": "Vascular occlusion: stop, high-dose hyaluronidase, massage, warm compress, aspirin; visual symptoms = emergency (retrobulbar hyaluronidase controversial)"}, {"n": 12, "s": "A patient who always burns and never tans is Fitzpatrick type:", "o": ["I", "III", "IV", "V", "VI"], "k": "A", "x": "Fitzpatrick I: always burns, never tans · VI: never burns"}, {"n": 13, "s": "The chemical peel requiring cardiac monitoring is:", "o": ["Glycolic", "Salicylic", "TCA 20%", "Jessner", "Phenol"], "k": "E", "x": "Phenol (Baker-Gordon) deep peel: cardiotoxic arrhythmias → ECG monitoring, IV hydration, staged application"}, {"n": 14, "s": "The ideal female brow peak lies above the:", "o": ["Medial canthus", "Lateral limbus", "Pupil centre", "Lateral canthus", "Nasal ala"], "k": "B", "x": "Female brow: arches above orbital rim with peak at lateral limbus; male brow flatter, at rim"}, {"n": 15, "s": "In facial analysis, the face is divided into:", "o": ["Two vertical halves", "Four quarters", "Equal thirds", "Six parts", "Uneven segments"], "k": "C", "x": "Equal thirds (trichion–glabella–subnasale–menton); widths in fifths (eye-width)"}, {"n": 16, "s": "Lower lip weakness after neck surgery with preserved lip eversion suggests injury to the:", "o": ["Marginal mandibular", "Buccal", "Hypoglossal", "Lingual", "Cervical branch"], "k": "E", "x": "Cervical branch \"pseudoparalysis\": depressor labii weak but mentalis intact → lip eversion preserved; true marginal mandibular injury loses eversion"}, {"n": 17, "s": "Skin flap necrosis after facelift is most strongly linked to:", "o": ["Age", "Smoking", "Female sex", "Fair skin", "Previous botox"], "k": "B", "x": "Smoking (×12 risk of skin slough); also thin flaps, tension, haematoma"}, {"n": 18, "s": "After an assault, the commonest mandibular fracture site is the:", "o": ["Symphysis", "Condyle", "Coronoid", "Angle", "Body"], "k": "D", "x": "Angle (assault, third molar weak point); condyle commonest overall in many series (falls)"}, {"n": 19, "s": "A bilateral parasymphyseal mandible fracture is dangerous because of:", "o": ["Airway obstruction", "Bilateral facial palsy", "Blindness", "Trismus", "CSF leak"], "k": "A", "x": "Bilateral parasymphyseal (\"flail\") fracture → loss of genioglossus anchorage → tongue falls back → airway obstruction"}, {"n": 20, "s": "Displacement of an \"unfavourable\" angle fracture is caused by:", "o": ["Gravity", "Tongue weight alone", "Muscle pull", "Teeth", "Swelling"], "k": "C", "x": "Muscle pull (masseter, medial pterygoid, temporalis) distracts unfavourable fracture lines"}, {"n": 21, "s": "Champy's ideal line of osteosynthesis for an angle fracture lies along the:", "o": ["Superior border", "Inferior border", "Posterior border", "Lingual cortex", "Coronoid"], "k": "A", "x": "Champy: superior (tension) border at angle via monocortical miniplate along external oblique ridge"}, {"n": 22, "s": "A condylar fracture in a young child is usually treated by:", "o": ["Open reduction", "Condylectomy", "Early mobilisation", "Prolonged rigid MMF", "Plating"], "k": "C", "x": "Children: early mobilisation (short MMF if needed) — remodelling potential, ankylosis risk with immobilisation"}, {"n": 23, "s": "With a unilateral condylar fracture, the chin deviates:", "o": ["Away from the fractured side", "Not at all", "Upward", "Downward", "Toward the fracture"], "k": "E", "x": "Deviates toward the fractured side on opening (unopposed contralateral lateral pterygoid); contralateral open bite"}, {"n": 24, "s": "A healthy tooth in a mandibular fracture line is usually:", "o": ["Extracted always", "Splinted later", "Root-filled", "Retained", "Crowned"], "k": "D", "x": "Retain unless mobile, fractured root, infected, or preventing reduction"}, {"n": 25, "s": "Standard imaging for mandible fracture is:", "o": ["MRI", "OPG and CT", "Ultrasound", "Bone scan", "Skull X-ray only"], "k": "B", "x": "OPG + CT (fine-cut, 3D) — two views at right angles"}, {"n": 26, "s": "Bilateral condylar fractures typically produce an:", "o": ["Posterior crossbite", "Anterior open bite", "Deep bite", "Normal occlusion", "Lateral crossbite"], "k": "B", "x": "Bilateral condylar fractures → anterior open bite (ramus shortening, posterior premature contact)"}, {"n": 27, "s": "Conventional definitive H&N radiotherapy is delivered as:", "o": ["1 Gy daily", "5 Gy weekly", "10 Gy single", "3 Gy twice daily for weeks", "2 Gy daily to 70 Gy"], "k": "E", "x": "2 Gy/fraction, 5 fractions/week, ~70 Gy over 7 weeks"}, {"n": 28, "s": "Hyperfractionation aims mainly to:", "o": ["Reduce late toxicity", "Shorten treatment", "Lower total dose", "Avoid chemo", "Increase acute toxicity only"], "k": "A", "x": "Hyperfractionation: smaller doses (1.1–1.2 Gy) twice daily, higher total → spares late-responding tissues (RTOG 9003)"}, {"n": 29, "s": "Accelerated fractionation counteracts:", "o": ["Hypoxia", "Repair", "Redistribution", "Repopulation", "Radiosensitivity"], "k": "D", "x": "Accelerated (e.g. DAHANCA 6 fractions/week) shortens overall time → counters accelerated tumour repopulation"}, {"n": 30, "s": "The 4 Rs of radiobiology are repair, repopulation, redistribution and:", "o": ["Resistance", "Rescue of stem cells", "Reoxygenation", "Relapse", "Remission"], "k": "C", "x": "Repair, Repopulation, Redistribution, Reoxygenation (+ intrinsic Radiosensitivity = 5th R)"}, {"n": 31, "s": "Elective (low-risk) nodal radiation dose is about:", "o": ["20 Gy", "30 Gy", "50 Gy", "90 Gy", "120 Gy"], "k": "C", "x": "~50 Gy (44–54 Gy) elective; ~60 Gy postoperative; ~70 Gy gross disease"}, {"n": 32, "s": "Acute radiation mucositis usually begins in week:", "o": ["Two", "Six", "Ten", "Twelve", "One day"], "k": "A", "x": "Begins ~week 2, peaks weeks 4–6, settles 2–4 weeks after completion"}, {"n": 33, "s": "The physical advantage of proton therapy is the:", "o": ["Lower cost", "Bragg peak", "Wider penumbra", "Exit dose", "Shorter course"], "k": "B", "x": "Bragg peak: dose deposited at depth with almost no exit dose → spares critical structures (skull base, paediatric)"}, {"n": 34, "s": "The Bonner trial showed that cetuximab plus RT, compared with RT alone:", "o": ["Worsened survival", "No difference", "Was inferior", "Equalled cisplatin", "Improved survival"], "k": "E", "x": "Bonner (NEJM 2006): cetuximab + RT improved locoregional control and overall survival vs RT alone (not vs cisplatin)"}, {"n": 35, "s": "MACH-NC showed that concurrent chemotherapy improves 5-year overall survival by about:", "o": ["0.5%", "20%", "30%", "6.5%", "50%"], "k": "D", "x": "MACH-NC: concurrent chemo ~6.5% absolute 5-year OS gain (induction/adjuvant ~2%, not significant)"}, {"n": 36, "s": "TAX 323/324 showed that induction TPF, compared with PF, was:", "o": ["Worse", "Equal", "More toxic only", "Superior", "Abandoned"], "k": "D", "x": "TAX 323/324: TPF induction superior to PF (survival); sequential therapy not superior to CRT in later trials"}, {"n": 37, "s": "MACH-NC showed the benefit of concurrent chemotherapy is smallest in patients:", "o": ["Under 50", "With HPV", "Over 70", "With N0", "Women"], "k": "C", "x": "Benefit declines with age; minimal over 70"}, {"n": 38, "s": "A patient with creatinine clearance 35 mL/min and established hearing loss needing chemoradiation should receive:", "o": ["Full-dose cisplatin anyway", "Gemcitabine", "Docetaxel only", "Methotrexate", "Cetuximab or carboplatin"], "k": "E", "x": "Cisplatin-ineligible (CrCl <50–60, hearing loss, neuropathy, poor PS) → cetuximab-RT or carboplatin-based"}, {"n": 39, "s": "A paramedian mandibulotomy is placed between the:", "o": ["Incisor and canine", "Molars", "Central incisors", "Angle and ramus junction", "Premolars"], "k": "A", "x": "Between lateral incisor and canine (paramedian): avoids mental nerve, preserves genioglossus/geniohyoid, step/notched osteotomy"}, {"n": 40, "s": "A lip-split incision is improved cosmetically by:", "o": ["Straight vertical", "Stair-step chin contour", "Horizontal", "Excising the lip vermilion", "No closure"], "k": "B", "x": "Stair-step or chin-contouring incision around the mental crease; precise vermilion alignment"}, {"n": 41, "s": "A small vallecular or tongue base tumour may be accessed via a:", "o": ["Visor flap", "Mandibulotomy", "Total maxillectomy route", "Lateral rhinotomy", "Transhyoid approach"], "k": "E", "x": "Transhyoid (suprahyoid) pharyngotomy → vallecula, tongue base, suprahyoid epiglottis"}, {"n": 42, "s": "Posterior pharyngeal wall and pyriform sinus tumours may be accessed by:", "o": ["Transhyoid", "Lateral pharyngotomy", "Visor flap", "Midfacial degloving approach", "Caldwell-Luc"], "k": "B", "x": "Lateral pharyngotomy → pyriform sinus, lateral/posterior pharyngeal wall"}, {"n": 43, "s": "A disadvantage of the visor flap is:", "o": ["Lip scar", "Poor exposure", "Chin numbness", "Mandible split", "Facial palsy"], "k": "C", "x": "Visor flap: bilateral mental nerve sacrifice → chin/lip numbness; avoids lip split"}, {"n": 44, "s": "Nodal Hodgkin lymphoma typically:", "o": ["Spreads contiguously", "Skips nodal groups", "Is extranodal", "Affects Waldeyer's", "Is painful in every case"], "k": "A", "x": "Hodgkin: contiguous nodal spread, Reed-Sternberg cells, B symptoms, alcohol-induced node pain (uncommon); rarely extranodal"}, {"n": 45, "s": "The commonest extranodal site of head and neck NHL is:", "o": ["Thyroid", "Parotid", "Larynx and trachea", "Waldeyer's ring", "Orbit"], "k": "D", "x": "Waldeyer's ring (tonsil > nasopharynx > tongue base) — commonest extranodal H&N NHL site"}, {"n": 46, "s": "Radiation-induced sarcoma (Cahan criteria) requires a latency of at least about:", "o": ["3–5 years", "1 month", "Six months", "1 year", "50 years"], "k": "A", "x": "Cahan: arises in irradiated field, different histology from original tumour, latency ≥3–5 years"}, {"n": 47, "s": "The commonest adult H&N soft-tissue sarcoma subtype is:", "o": ["Liposarcoma", "Synovial cell sarcoma", "Rhabdomyosarcoma", "Pleomorphic sarcoma", "Kaposi"], "k": "D", "x": "Undifferentiated pleomorphic sarcoma (formerly MFH) and osteosarcoma lead in adults; rhabdomyosarcoma in children"}, {"n": 48, "s": "Elective neck dissection for most adult soft-tissue sarcomas is:", "o": ["Mandatory", "Bilateral", "Radical", "Level I only always", "Not indicated"], "k": "E", "x": "Nodal spread rare (<5%) except rhabdomyosarcoma, synovial, clear cell, epithelioid, angiosarcoma → no routine END"}, {"n": 49, "s": "Odour from a fungating H&N wound is reduced by:", "o": ["Chlorhexidine", "Steroids", "Metronidazole", "Iodine", "Silver"], "k": "C", "x": "Topical (or systemic) metronidazole for anaerobic odour; charcoal dressings"}, {"n": 50, "s": "A terminal carotid blowout in a patient for palliative care is managed with:", "o": ["Bedside surgical ligation", "Dark towels, sedation", "Transfusion", "CT", "Emergency stenting"], "k": "B", "x": "Terminal bleed in palliation: dark towels, crisis sedation (midazolam), stay with patient; plan in advance"}]}, {"c": 5, "t": "Session 1", "d": "Set 1 — grafts, flap principles, local, regional and free flaps, facial regions, cleft, rhinoplasty, trauma", "q": [{"n": 1, "s": "The phase of skin graft take that occurs during the first 24–48 hours is:", "o": ["Inosculation", "Revascularisation", "Plasmatic imbibition", "Secondary contraction", "Epithelialisation"], "k": "C", "x": "Plasmatic imbibition 0–48 h; inosculation 48–72 h; revascularisation from about day 4–7."}, {"n": 2, "s": "Compared with a split-thickness skin graft, a full-thickness skin graft shows:", "o": ["More primary contraction and less secondary contraction", "Less primary contraction and more secondary contraction", "Less of both primary and secondary contraction", "Higher take on a poorly vascularised bed", "A donor site that heals by re-epithelialisation"], "k": "A", "x": "FTSG: more primary contraction (immediate recoil), less secondary contraction and a better colour match. STSG: less primary, more secondary contraction, higher take, donor heals by reepithelialisation."}, {"n": 3, "s": "The most common cause of skin graft failure is:", "o": ["Infection", "Shear", "Smoking", "Hematoma or seroma", "Poor recipient bed"], "k": "D", "x": "Hematoma/seroma lifts the graft off its bed. Next come shear, infection (beta-hemolytic strep) and a poor bed. Hence the tie-over bolster for 5–7 days."}, {"n": 4, "s": "The best donor site for a full-thickness skin graft to the face, for colour match, is:", "o": ["Thigh", "Supraclavicular area", "Abdomen", "Buttock", "Scalp"], "k": "B", "x": "Supraclavicular skin (“blush area”) gives the best facial colour match. Other facial donors: pre/postauricular, upper eyelid, conchal bowl. An FTSG CAN be taken from the neck."}, {"n": 5, "s": "A scalp defect has exposed outer table of the skull with no periosteum. To allow a skin graft to take, you should:", "o": ["Place a thick full-thickness graft directly on the bone", "Place a meshed split-thickness graft directly on the bone", "Leave it to heal by secondary intention only", "Cover it with a xenograft", "Burr the outer table to expose cancellous bone, then graft"], "k": "E", "x": "Bare calvaria will not take a graft. Burr the outer table down to cancellous bone (diploe) so granulation can grow, then graft (or use a flap). A wound VAC is safe over grafts."}, {"n": 6, "s": "A flap that has a named artery running along its long axis is called:", "o": ["Random-pattern", "Bipedicle", "Axial-pattern", "Hinge", "Interpolation"], "k": "C", "x": "Axial pattern = named artery along the flap axis (paramedian forehead, deltopectoral, Abbé, TPF). Random pattern relies on the dermal–subdermal plexus."}, {"n": 7, "s": "The delay phenomenon improves flap survival by:", "o": ["Increasing venous drainage only", "Dilating choke vessels and increasing ischemic tolerance", "Reducing tension on the closure", "Replacing the pedicle with neovascularisation from the bed", "Shortening the flap"], "k": "B", "x": "Delay dilates choke vessels and builds ischemic tolerance, so long random flaps survive. Do not confuse it with neovascularisation, which is a separate and later process."}, {"n": 8, "s": "The pedicle of an interpolated flap (for example the paramedian forehead flap) is usually divided at about:", "o": ["24 hours", "3 days", "1 week", "2–3 weeks", "3 months"], "k": "D", "x": "Neovascularisation from the bed is established by ≈ 3 weeks, so pedicles of interpolated flaps are divided at 2–3 weeks."}, {"n": 9, "s": "Which muscle is a Mathes–Nahai type V flap (one dominant pedicle plus secondary segmental pedicles)?", "o": ["Pectoralis major", "Gracilis", "Rectus abdominis", "Sartorius", "Gastrocnemius"], "k": "A", "x": "Type V = pectoralis major and latissimus dorsi (one dominant + secondary segmental)."}, {"n": 10, "s": "Which muscle is a Mathes–Nahai type II flap (one dominant pedicle plus minor pedicles)?", "o": ["Pectoralis major", "Latissimus dorsi", "Rectus abdominis", "Sartorius", "Gracilis"], "k": "E", "x": "Type II = gracilis, trapezius, soleus (one dominant + minor). Rectus abdominis is type III; sartorius is type IV; gastrocnemius is type I."}, {"n": 11, "s": "On day 1 a free flap is blue and swollen, with brisk dark bleeding on pinprick. This indicates:", "o": ["Arterial insufficiency", "Venous congestion", "A normal flap", "Infection", "Arterial spasm only"], "k": "B", "x": "Venous congestion: blue, swollen, brisk dark bleeding. Arterial insufficiency: pale, cool, no bleeding. Both need early re-exploration. Leeches (Hirudo) require Aeromonas prophylaxis."}, {"n": 12, "s": "The angles of a rhomboid (Limberg) flap are:", "o": ["30° and 150°", "45° and 135°", "60° and 120°", "90° and 90°", "75° and 105°"], "k": "C", "x": "Rhomboid = rhombic = Limberg flap: 60°/120° angles, a random-pattern transposition flap; four possible flaps."}, {"n": 13, "s": "A Z-plasty with 60° angles gives a gain in length of about:", "o": ["25%", "50%", "100%", "75%", "120%"], "k": "D", "x": "Z-plasty gain: 30° = 25%; 45° = 50%; 60° = 75%; 75° = 100%; 90° = 120%."}, {"n": 14, "s": "Which of the following is a rotation flap?", "o": ["Rieger (dorsal nasal) flap", "Bilobed flap", "Abbé flap", "Paramedian forehead flap", "Rhomboid flap"], "k": "A", "x": "The Rieger dorsal nasal flap is a rotation flap. Bilobed, rhomboid, Z-plasty and note flaps are transposition; paramedian forehead and Abbé are interpolation."}, {"n": 15, "s": "All of the following are interpolation flaps EXCEPT:", "o": ["Paramedian forehead flap", "Abbé flap", "Cutler–Beard flap", "Interpolated melolabial flap", "V-Y advancement flap"], "k": "E", "x": "V-Y is an advancement flap. Interpolation flaps have a pedicle passing over/under intact tissue and need a second stage."}, {"n": 16, "s": "A bilobed flap is best suited to:", "o": ["Large cheek defects", "Defects of about 1.5 cm or less in the lower third of the nose (tip/ala)", "Upper lip defects", "Scalp defects", "Eyelid defects"], "k": "B", "x": "Bilobed flap for small (≲ 1.5 cm) lower-third nasal defects, borrowing loose upper nasal skin. Zitelli’s smaller angles reduce the standing cone."}, {"n": 17, "s": "The pectoralis major myocutaneous flap is supplied mainly by the:", "o": ["Internal mammary artery", "Thoracodorsal artery", "Thoracoacromial artery (pectoral branch)", "Transverse cervical artery", "Lateral thoracic artery only"], "k": "C", "x": "Thoracoacromial artery (pectoral branch). Pectoralis is the most dependable regional flap."}, {"n": 18, "s": "Which of the following flaps needs a second-stage pedicle division?", "o": ["Deltopectoral flap", "Pectoralis major flap", "Pedicled latissimus dorsi flap", "Free fibula flap", "Free anterolateral thigh flap"], "k": "A", "x": "The deltopectoral flap (IMA perforators, fasciocutaneous) needs pedicle division at about 3 weeks. That is its major disadvantage; the donor site also needs a STSG."}, {"n": 19, "s": "The segmental blood supply of the sternocleidomastoid flap includes all of the following EXCEPT:", "o": ["Occipital artery", "Superior thyroid artery", "Suprascapular artery", "Internal carotid artery", "All of the above are sources"], "k": "D", "x": "The SCM flap has segmental supply (occipital, superior thyroid, suprascapular); the internal carotid is not a source. It is the most tenuous musculocutaneous flap."}, {"n": 20, "s": "The radial forearm free flap is LEAST suited when you need:", "o": ["Thin, pliable lining", "Adequate bone for endosseous dental implants", "A long vascular pedicle", "A sensate flap", "Hairless skin"], "k": "B", "x": "The radial forearm flap is thin, pliable, long-pedicled, hairless and sensate, but the radius gives insufficient bone for endosseous implants. The fibula and iliac crest are used for implants."}, {"n": 21, "s": "In harvesting a fibula flap, the minimum length of distal fibula left to preserve ankle stability is about:", "o": ["1 cm", "3 cm", "10 cm", "12 cm", "6 cm"], "k": "E", "x": "Leave about 6 cm of distal fibula. Other points: peroneal artery pedicle; look for peroneal artery magna and PVD before harvest."}, {"n": 22, "s": "The skin paddle perforators of the fibula flap travel mainly in the:", "o": ["Anterior intermuscular septum", "Interosseous membrane", "Posterior crural (intermuscular) septum, or through the soleus/flexor hallucis longus", "Tibialis anterior muscle", "Peroneus brevis only"], "k": "C", "x": "Posterior crural (intermuscular) septum, or musculocutaneous via the soleus/FHL. A cuff of soleus or flexor hallucis longus protects the perforators."}, {"n": 23, "s": "A free gracilis muscle transfer is used mainly for:", "o": ["Facial reanimation", "Mandibular reconstruction", "Palatal reconstruction", "Orbital reconstruction", "Scalp reconstruction only"], "k": "A", "x": "Free gracilis (medial circumflex femoral artery; anterior branch of obturator nerve) is the standard functional muscle transfer for facial reanimation, usually after a cross-face nerve graft."}, {"n": 24, "s": "Which free tissue is the MOST sensitive to ischemia?", "o": ["Skin", "Fat", "Fascia", "Jejunum", "Bone"], "k": "D", "x": "Jejunum tolerates ischemia worst (about 2 hours). Skin and bone tolerate it better."}, {"n": 25, "s": "The pedicle of the anterolateral thigh (ALT) flap is the:", "o": ["Superficial femoral artery", "Descending branch of the lateral circumflex femoral artery", "Main trunk of the profunda femoris", "Medial circumflex femoral artery", "Deep circumflex iliac artery"], "k": "B", "x": "Descending branch of the lateral circumflex femoral artery. Sensate via the lateral femoral cutaneous nerve."}, {"n": 26, "s": "According to the subunit principle, when more than about ____ of a nasal subunit is lost, the whole subunit should be resurfaced:", "o": ["10%", "25%", "33%", "75%", "50%"], "k": "E", "x": "About 50%: if more than half a subunit is lost, resurface the entire subunit so scars fall at subunit borders."}, {"n": 27, "s": "The paramedian forehead flap is supplied mainly by the:", "o": ["Supratrochlear artery", "Superficial temporal artery", "Angular artery", "Dorsal nasal artery", "Infraorbital artery"], "k": "A", "x": "Supratrochlear artery (± supraorbital). It is an axial-pattern interpolation flap with a pedicle about 1.2–1.5 cm wide near the medial brow."}, {"n": 28, "s": "Which lip flap includes the oral commissure, changes its position, and may need a later commissuroplasty?", "o": ["Abbé", "Karapandzic", "Estlander", "Webster–Bernard", "Gillies fan"], "k": "C", "x": "Estlander (lip-switch flap including the commissure) rounds and changes the commissure. Abbé is the cross-lip flap for central defects."}, {"n": 29, "s": "The Karapandzic flap is characterised by:", "o": ["Division of the labial artery", "Two-stage division of a pedicle", "Free tissue transfer", "Preserved neurovascular bundle with a risk of microstomia", "A cross-lip pedicle"], "k": "D", "x": "Karapandzic: circumoral advancement–rotation, preserves orbicularis continuity and neurovascular bundles (sensation/function), but may cause microstomia."}, {"n": 30, "s": "The Cutler–Beard flap reconstructs:", "o": ["The lower eyelid", "A large (over 50%) full-thickness upper eyelid defect", "The medial canthus", "The lateral canthus", "The brow"], "k": "B", "x": "Cutler–Beard bridges lower-lid tissue under the intact lid margin to rebuild a large (> 50%) upper-lid defect; divided in a second stage."}, {"n": 31, "s": "The “danger layer” of the scalp is the:", "o": ["Skin", "Dense connective tissue", "Galea aponeurotica", "Pericranium", "Loose areolar tissue"], "k": "E", "x": "Loose areolar tissue (the “L” in SCALP). It allows avulsion and spread of infection and hematoma."}, {"n": 32, "s": "During submandibular gland or level I dissection, the marginal mandibular nerve is protected by:", "o": ["Ligating the facial vein and retracting it upward (Hayes Martin maneuver)", "Preserving the lingual nerve", "Placing the incision at the mandibular angle", "Dissecting deep to the posterior belly of digastric", "Cutting the platysma"], "k": "A", "x": "The marginal mandibular nerve lies deep to platysma and superficial to the facial vein. Ligate the vein low and reflect it upward (Hayes Martin) to protect the nerve."}, {"n": 33, "s": "A circumferential pharyngoesophageal defect confined to the cervical region is best reconstructed with:", "o": ["Pectoralis major patch", "Deltopectoral flap", "Free jejunum (or a tubed ALT/radial forearm flap)", "Wookey procedure", "Gastric pull-up in all cases"], "k": "C", "x": "Free jejunum (or tubed ALT/RFFF) for cervical circumferential defects. Gastric pull-up is for extension to the thoracic esophagus or a pharyngolaryngoesophagectomy. Wookey is historical. Pectoralis is a patch for partial defects."}, {"n": 34, "s": "The Furlow palatoplasty uses:", "o": ["Bipedicle mucoperiosteal flaps", "V-Y pushback", "A pharyngeal flap", "Double-opposing Z-plasties", "A vomer flap"], "k": "D", "x": "Furlow: double-opposing Z-plasties; lengthens the soft palate and repositions the levator muscle. von Langenbeck uses bipedicle flaps; Veau–Wardill–Kilner uses V-Y pushback."}, {"n": 35, "s": "Alveolar bone grafting in cleft patients is done at about:", "o": ["3 months", "8–10 years", "1 year", "3 years", "16 years"], "k": "B", "x": "Alveolar bone graft at 8–10 years (mixed dentition, before canine eruption). Lip repair ≈ 3 months (rule of 10s); palate 9–12 months."}, {"n": 36, "s": "The triad of submucous cleft palate is:", "o": ["Bifid uvula, zona pellucida (muscle diastasis), notched posterior hard palate", "Cleft lip, bifid uvula, hypernasality", "Notched posterior hard palate, short uvula, otitis media", "Bifid uvula, high arched palate, Pierre Robin sequence", "Zona pellucida, tongue-tie, bifid uvula"], "k": "A", "x": "Submucous cleft: bifid uvula, zona pellucida (muscle diastasis) and notched posterior hard palate. Beware adenoidectomy (VPI risk)."}, {"n": 37, "s": "The normal internal nasal valve angle is:", "o": ["0–5°", "5–10°", "20–25°", "30–35°", "10–15°"], "k": "E", "x": "10–15° (formed by the caudal ULC and septum). It is the narrowest, flow-limiting segment; Cottle’s test assesses it."}, {"n": 38, "s": "An inverted-V deformity is best treated with:", "o": ["Cephalic trim", "Alar batten graft", "Spreader grafts", "Columellar strut", "Weir excision"], "k": "C", "x": "Spreader grafts restore the ULC/dorsal relationship and widen the internal valve. InvertedV results from ULC collapse below the nasal bones."}, {"n": 39, "s": "To avoid alar collapse and a pinched tip, a cephalic trim should leave a rim strip of the lateral crus of at least about:", "o": ["1–2 mm", "3–4 mm", "12 mm", "6–8 mm", "15 mm"], "k": "D", "x": "Keep a 6–8 mm rim strip. Excess cephalic trim causes a pinched tip and alar collapse or retraction."}, {"n": 40, "s": "To prevent a saddle deformity after septoplasty, the dorsal and caudal L-strut should be at least about:", "o": ["5 mm", "10 mm", "15 mm", "20 mm", "2 mm"], "k": "B", "x": "Preserve at least 10 mm (1 cm) of dorsal and caudal L-strut to avoid saddle nose."}, {"n": 41, "s": "Which of the following is a MAJOR tip support mechanism?", "o": ["Strength and resilience of the lateral crura", "Interdomal ligament", "Sesamoid complex", "Skin–soft tissue envelope", "Dorsal septum"], "k": "A", "x": "Major support: lateral crura strength, medial crural footplates attached to the caudal septum, and the ULC–LLC (scroll) attachment. Interdomal ligament, sesamoid complex, skin envelope and dorsal septum are minor."}, {"n": 42, "s": "An alar batten graft is used to treat:", "o": ["Internal valve collapse", "Open roof deformity", "Poor tip projection", "Saddle nose", "External valve (alar/lateral wall) collapse"], "k": "E", "x": "Alar batten grafts support the external valve (lateral crus/alar sidewall). Internal valve collapse is treated with spreader grafts."}, {"n": 43, "s": "The most commonly injured nerve in facelift surgery is the:", "o": ["Temporal (frontal) branch of the facial nerve", "Marginal mandibular branch", "Great auricular nerve", "Buccal branch", "Zygomatic branch"], "k": "C", "x": "The great auricular nerve (McKinney’s point ≈ 6.5 cm below the EAC) is most commonly injured. The temporal and marginal mandibular branches are the most important motor injuries."}, {"n": 44, "s": "In otoplasty, Mustardé sutures are used to:", "o": ["Set the concha back to the mastoid", "Reduce the lobule", "Reduce the concha only", "Create the antihelical fold (conchoscaphal mattress sutures)", "Reconstruct the tragus"], "k": "D", "x": "Mustardé conchoscaphal mattress sutures create the antihelical fold. Furnas concha–mastoid sutures set the concha back."}, {"n": 45, "s": "Skin blanching with severe pain after a hyaluronic acid filler injection suggests vascular occlusion. The immediate management is:", "o": ["Warm compresses and observation", "Hyaluronidase injection urgently", "Systemic steroids only", "Oral antibiotics", "Botulinum toxin"], "k": "B", "x": "Hyaluronidase immediately; vascular occlusion (glabella/nose) can cause skin necrosis and blindness."}, {"n": 46, "s": "A depressed isolated zygomatic arch fracture with trismus is treated by:", "o": ["Gillies temporal approach elevation", "A plaster cap with external traction", "Kirschner pin placement", "Watchful waiting only", "Open reduction through a coronal flap"], "k": "A", "x": "The Gillies temporal approach: an elevator passed deep to the temporalis fascia lifts the arch. Trismus occurs because the arch presses on the coronoid."}, {"n": 47, "s": "In a typical orbital blowout fracture, eye movement is restricted mainly in:", "o": ["Downward gaze", "Lateral gaze", "Upward gaze", "Medial gaze", "All directions equally"], "k": "C", "x": "The inferior rectus (± fat) is trapped, so upward gaze is restricted, with diplopia and enophthalmos. Check for infraorbital hypoesthesia."}, {"n": 48, "s": "After a facial nerve laceration, the distal branches can usually be located with a nerve stimulator for up to about:", "o": ["6 hours", "24 hours", "12 hours", "2 weeks", "72 hours"], "k": "E", "x": "About 72 hours (some texts say up to 96 ⚠️). After this, distal branches stop responding, so repair early. Branches medial to the lateral canthus are usually not repaired."}, {"n": 49, "s": "A Le Fort II fracture passes through all of the following EXCEPT the:", "o": ["Nasofrontal suture", "Infraorbital rim", "Pterygoid plates", "Zygomaticofrontal suture", "Medial orbital wall"], "k": "D", "x": "Le Fort II: nasofrontal suture, medial orbit, infraorbital rim and pterygoid plates. The zygomaticofrontal suture and zygomatic arch belong to Le Fort III."}, {"n": 50, "s": "A child has an orbital floor “trapdoor” fracture with bradycardia, nausea and little bruising. The best management is:", "o": ["Observe for 2 weeks", "Urgent surgical release and repair", "Steroids only", "Antibiotics only", "Eye patching"], "k": "B", "x": "A pediatric “white-eyed blowout” (trapdoor) fracture with oculocardiac reflex (bradycardia, nausea) is an emergency: release the entrapped muscle promptly."}]}, {"c": 5, "t": "Session 2", "d": "Set 2 — wound healing and scars, grafts, flaps and monitoring, oral cavity and mandible, rhinoplasty, trauma", "q": [{"n": 1, "s": "A keloid differs from a hypertrophic scar because a keloid:", "o": ["Stays within the original wound borders", "Extends beyond the original wound margins and rarely regresses", "Regresses spontaneously within a year", "Responds well to simple re-excision alone", "Occurs only on the face"], "k": "B", "x": "Keloids extend beyond the wound margins, recur after simple excision and rarely regress. Hypertrophic scars stay within the wound and may regress. Treat keloids with intralesional triamcinolone, excision plus steroid/ radiotherapy, silicone, and pressure."}, {"n": 2, "s": "Relaxed skin tension lines (RSTL) are:", "o": ["Parallel to the pull of the underlying muscles", "The same as the dermatomes", "Cadaveric lines described by Langer", "Perpendicular to the line of pull of the underlying facial muscles", "Random"], "k": "D", "x": "RSTL lie perpendicular to the pull of the underlying muscles. Place incisions parallel to them (and in wrinkle lines) for the best scars. Langer’s lines are cadaveric and less useful."}, {"n": 3, "s": "The main purpose of a W-plasty is to:", "o": ["Break up a long linear scar so it is less noticeable", "Lengthen a contracted scar by 75%", "Remove a dog-ear", "Increase the blood supply of a flap", "Close a defect by advancement"], "k": "A", "x": "W-plasty irregularises a long straight scar so it is less visible. Z-plasty lengthens and reorients; M-plasty shortens; Burow’s triangle removes a dog-ear."}, {"n": 4, "s": "In the remodeling phase of wound healing:", "o": ["Collagen I is converted to collagen III", "Fibroblast proliferation is at its maximum", "Collagen III is replaced by collagen I and tensile strength reaches about 80% of normal", "Neutrophils predominate", "Epithelialisation begins"], "k": "C", "x": "Remodeling lasts up to 12–24 months: collagen III is replaced by collagen I, and strength reaches about 80% of normal skin. Inflammation is days 0–3; proliferation days 3–21."}, {"n": 5, "s": "Meshing of a split-thickness skin graft:", "o": ["Is mandatory", "Improves the cosmetic result", "Decreases secondary contraction", "Prevents hematoma completely", "Expands the graft surface and allows fluid to drain, at a cosmetic cost"], "k": "E", "x": "Meshing expands area and lets fluid out, but gives a worse cosmetic result. It is NOT mandatory."}, {"n": 6, "s": "A composite chondrocutaneous graft (for example, for a nasal alar rim defect) is reliable only if the defect is about:", "o": ["1–1.5 cm or less", "3 cm", "4 cm", "5 cm", "6 cm"], "k": "A", "x": "Composite grafts survive only by imbibition at their edges, so they are reliable up to about 1–1.5 cm (nasal rim)."}, {"n": 7, "s": "Costal cartilage grafts are least likely to warp when they are:", "o": ["Soaked in antibiotic solution", "Carved with a balanced (symmetric) cross-section", "Harvested with the perichondrium only", "Frozen before use", "Placed in a tight pocket"], "k": "B", "x": "A balanced, symmetric carving of the costal cartilage (or using the central core) limits warping. Unbalanced carving releases internal tension."}, {"n": 8, "s": "Tissue expansion works by:", "o": ["Mitosis only", "Dermal stretch only", "Neovascularisation only", "Mechanical creep and biological creep (cell proliferation)", "The delay phenomenon"], "k": "D", "x": "Expansion uses mechanical creep (stretch) and biological creep (new cells and skin growth). Risks: infection, extrusion."}, {"n": 9, "s": "Hinge (turnover) flaps are most useful to provide:", "o": ["Bone", "Skin cover", "Lining", "Bulk", "Sensation"], "k": "C", "x": "Hinge or turnover flaps are flipped like a page and give lining (septal mucoperichondrial hinge flap; skin turnover flap for nasal lining)."}, {"n": 10, "s": "An inferiorly based melolabial flap is mainly used for:", "o": ["Alar defects", "Nasal sidewall defects", "Eyelid defects", "Forehead defects", "Lip and intraoral (floor of mouth) defects"], "k": "E", "x": "Inferiorly based melolabial flaps reach the lip and intraoral defects. Superiorly based ones reach the ala and nasal sidewall."}, {"n": 11, "s": "A V-Y advancement flap survives on its:", "o": ["Named axial artery", "Subcutaneous (neurovascular) pedicle", "Microvascular anastomosis", "Dermal plexus alone", "Skin bridge"], "k": "B", "x": "The V-Y island flap is nourished by its subcutaneous pedicle (neurovascular), without a named axial artery."}, {"n": 12, "s": "An island flap is one in which:", "o": ["The skin island is attached only by its vascular pedicle, with the surrounding skin incised", "The tissue is transferred with a microvascular anastomosis", "There is no pedicle", "It is a skin graft", "The pedicle is divided at 3 weeks"], "k": "A", "x": "An island flap has its skin island separated from surrounding skin and is attached only by the pedicle (for example the submental island flap)."}, {"n": 13, "s": "The submental island flap is supplied by the:", "o": ["Lingual artery", "Superior thyroid artery", "Occipital artery", "Submental artery (branch of the facial artery)", "Transverse cervical artery"], "k": "D", "x": "Submental artery (branch of the facial artery). Be careful with level I nodes in cancer."}, {"n": 14, "s": "The supraclavicular artery island flap (SCAIF) is based on the supraclavicular artery, a branch of the:", "o": ["Thyrocervical trunk proper", "Suprascapular artery only", "Transverse cervical artery", "Lateral thoracic artery", "Dorsal scapular artery"], "k": "C", "x": "The supraclavicular artery arises from the transverse cervical artery. ⚠️ Some sources trace it to the suprascapular artery; check your Cummings copy."}, {"n": 15, "s": "The pericranial flap is supplied by the:", "o": ["Superficial temporal artery", "Occipital artery", "Posterior auricular artery", "Facial artery", "Supraorbital and supratrochlear arteries"], "k": "E", "x": "The pericranial flap is supplied by the supraorbital and supratrochlear arteries and is the workhorse for anterior skull base repair."}, {"n": 16, "s": "The temporalis muscle flap is supplied by the:", "o": ["Superficial temporal artery", "Deep temporal arteries (branches of the maxillary artery)", "Facial artery", "Transverse facial artery", "Zygomatico-orbital artery"], "k": "B", "x": "Deep temporal arteries (branches of the maxillary artery). The superficial temporal artery supplies the temporoparietal fascia flap."}, {"n": 17, "s": "The facial artery musculomucosal (FAMM) flap is supplied by the:", "o": ["Facial artery", "Lingual artery", "Greater palatine artery", "Buccal artery", "Ascending pharyngeal artery"], "k": "A", "x": "The FAMM flap is based on the facial artery (antegrade or retrograde), used for palate, floor of mouth and nasal septum defects."}, {"n": 18, "s": "The lateral island trapezius flap is based on the:", "o": ["Occipital artery", "Dorsal scapular artery only", "Superficial branch of the transverse cervical artery", "Suprascapular artery", "Thoracodorsal artery"], "k": "C", "x": "The lateral island trapezius flap is based on the superficial branch of the transverse cervical artery. The lower island is based on the dorsal scapular artery (deep branch). ⚠️ Terminology varies."}, {"n": 19, "s": "A free latissimus dorsi flap is particularly suited for:", "o": ["Small lip defects", "Mandibular segmental defects", "Palatal defects", "Large scalp defects", "Eyelid defects"], "k": "D", "x": "Free latissimus (thoracodorsal artery) gives a large, reliable muscle or skin surface, ideal for large scalp and large soft-tissue defects."}, {"n": 20, "s": "The scapular tip flap is supplied by the:", "o": ["Circumflex scapular artery", "Dorsal scapular artery", "Suprascapular artery", "Transverse cervical artery", "Angular branch of the thoracodorsal artery"], "k": "E", "x": "Scapular tip (bone): angular branch of the thoracodorsal artery (subscapular system). The scapular/parascapular skin flap is supplied by the circumflex scapular artery."}, {"n": 21, "s": "A typical donor-site complication of the free iliac crest (DCIA) flap is:", "o": ["Foot drop", "Abdominal wall hernia (and lateral femoral cutaneous nerve injury)", "Hand ischemia", "Great toe flexion contracture", "Ankle instability"], "k": "B", "x": "DCIA flap donor morbidity: hernia and lateral femoral cutaneous nerve injury. Foot drop is common peroneal nerve; toe flexion contracture is fibula."}, {"n": 22, "s": "The Allen test before radial forearm flap harvest assesses:", "o": ["Ulnar artery collateral flow to the hand", "The cephalic vein", "Sensation of the thumb", "Brachial artery flow", "Venous drainage"], "k": "A", "x": "The Allen test confirms that the ulnar artery adequately supplies the hand before taking the radial artery."}, {"n": 23, "s": "An implantable (Cook–Swartz) Doppler is most useful for monitoring:", "o": ["The skin paddle of a radial forearm flap", "A fibula flap with skin paddle", "Any flap exclusively", "Buried flaps with no skin paddle to inspect", "Pedicled flaps"], "k": "D", "x": "Implantable Doppler suits buried flaps (for example jejunum or buried muscle) where nothing can be seen. Clinical examination remains the most reliable for flaps with a skin paddle."}, {"n": 24, "s": "Medicinal leech therapy for venous congestion:", "o": ["Delivers heparin", "Acts as an antiplatelet", "Delivers hirudin (a thrombin inhibitor) and needs prophylaxis against Aeromonas hydrophila", "Is used for arterial insufficiency", "Is safe without antibiotics"], "k": "C", "x": "Leeches deliver hirudin (thrombin inhibitor) and are used for venous congestion. Give prophylaxis against Aeromonas hydrophila (ciprofloxacin, third-generation cephalosporin, TMPSMX)."}, {"n": 25, "s": "The most common cause of free flap failure is:", "o": ["Infection", "Hematoma", "Arterial spasm only", "Donor site complication", "Vascular thrombosis (venous more common than arterial)"], "k": "E", "x": "Vascular thrombosis is the leading cause; venous thrombosis is more common than arterial. Re-explore early (best salvage within about 6 hours)."}, {"n": 26, "s": "In the Boyd HCL classification of mandibular defects, “C” refers to:", "o": ["Hemimandible including the condyle", "Central segment (including both canines)", "Lateral segment without the condyle", "Ramus only", "Condyle only"], "k": "B", "x": "Boyd HCL: H = hemimandible with condyle; C = central (both canines); L = lateral without condyle. Central defects must be reconstructed with bone."}, {"n": 27, "s": "The most important precipitating event for osteoradionecrosis of the mandible is:", "o": ["Dental extraction or trauma in the irradiated mandible", "Chemotherapy", "Smoking", "Diabetes", "Age"], "k": "A", "x": "The classic trigger is dental extraction or trauma in an irradiated mandible (doses > 60 Gy). Manage with debridement, pentoxifylline–tocopherol, and sometimes HBO or free flap."}, {"n": 28, "s": "For a total glossectomy defect, the best reconstructive choice is a:", "o": ["Split-thickness skin graft", "Radial forearm flap alone", "Primary closure", "Bulky flap (rectus abdominis or ALT)", "Palatal obturator"], "k": "D", "x": "After total glossectomy use a bulky flap (rectus abdominis or ALT, with or without a free flap) to fill the oral volume. Radial forearm alone is too thin."}, {"n": 29, "s": "A lower lip defect can generally be closed primarily up to about:", "o": ["1/10", "1/5", "1/3", "2/3", "All of it"], "k": "C", "x": "About one-third of the lower lip can usually be closed primarily (wedge). Larger defects need Abbé, Estlander, Karapandzic or Webster–Bernard. ⚠️ Some say up to one-third to one-half."}, {"n": 30, "s": "To prevent ectropion after a cervicofacial rotation (Mustardé) cheek flap:", "o": ["Make a large Burow’s triangle", "Suspend the flap to the periosteum of the lateral orbital rim", "Add a skin graft to the lower lid", "Delay the flap", "Use a thinner flap"], "k": "B", "x": "Anchoring the flap to the lateral orbital rim periosteum (with an upward vector) prevents downward pull and ectropion."}, {"n": 31, "s": "The Hughes flap reconstructs the:", "o": ["Anterior lamella of the upper lid", "Lower lid skin", "Upper lid margin", "Lateral canthus", "Posterior lamella of the lower lid, using a tarsoconjunctival flap from the upper lid"], "k": "E", "x": "The Hughes flap borrows a tarsoconjunctival flap from the upper lid for the posterior lamella of the lower lid, covered by a skin graft or flap. Divide at about 3–4 weeks."}, {"n": 32, "s": "The Antia–Buch procedure is a:", "o": ["Chondrocutaneous advancement flap for helical rim defects", "Free flap", "Rib cartilage framework", "Cross-lip flap", "Eyelid flap"], "k": "A", "x": "The Antia–Buch chondrocutaneous helical adv
