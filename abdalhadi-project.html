ancement flap closes helical rim defects. Total ear needs a framework (costal cartilage or Medpor)."}, {"n": 33, "s": "A porous polyethylene (Medpor) ear framework is usually covered with:", "o": ["Split-thickness skin graft alone", "Full-thickness skin graft alone", "Pectoralis major flap", "Temporoparietal fascia flap plus skin graft", "Cervical flap"], "k": "D", "x": "A Medpor framework needs vascularised cover: a temporoparietal fascia flap plus a skin graft."}, {"n": 34, "s": "The “rule of 10s” for cleft lip repair is:", "o": ["10 days, 10 kg, Hb 10", "10 days only", "About 10 weeks, 10 lb, Hb 10 g/dL", "10 months", "10 years"], "k": "C", "x": "About 10 weeks of age, 10 lb, and Hb 10 g/dL. Palate repair is at 9–12 months, and alveolar bone graft at 8–10 years."}, {"n": 35, "s": "The Millard repair is a:", "o": ["Triangular flap repair", "V-Y pushback", "Palatal Z-plasty", "Straight-line closure", "Rotation–advancement repair for unilateral cleft lip"], "k": "E", "x": "The Millard rotation–advancement repair is the standard technique for unilateral cleft lip. The Tennison–Randall method uses a triangular flap."}, {"n": 36, "s": "A recognised complication of a pharyngeal flap is:", "o": ["Aspiration of food", "Obstructive sleep apnea and hyponasality", "Fistula", "Hypernasality", "Facial palsy"], "k": "B", "x": "A pharyngeal flap causes hyponasality and obstructive sleep apnea risk. The Furlow palatoplasty and sphincter pharyngoplasty are alternatives."}, {"n": 37, "s": "The ideal nasolabial angle in women is about:", "o": ["100–110°", "70–80°", "120–130°", "140°", "60–70°"], "k": "A", "x": "Women about 100–110°; men about 90–95° (some sources 95–105° overall). ⚠️ Check your Cummings copy."}, {"n": 38, "s": "The usual transcolumellar incision in open rhinoplasty is:", "o": ["Straight transverse", "Vertical", "Along the dorsum", "Inverted-V or stair-step (broken line)", "A hemitransfixion incision only"], "k": "D", "x": "The transcolumellar incision is an inverted-V or stair-step to hide the scar and avoid linear contraction. It is joined to marginal incisions."}, {"n": 39, "s": "A polly-beak deformity may result from all of the following EXCEPT:", "o": ["Over-resection of the bony dorsum with under-resection of the cartilaginous dorsum", "Loss of tip support", "Over-resection of the cartilaginous dorsum", "Supratip scarring or dead space", "Inadequate tip projection"], "k": "C", "x": "Over-resecting the cartilaginous dorsum gives a low supratip (saddle-like), the opposite of a polly-beak. The classic causes are an under-resected cartilaginous dorsum, weak tip support, and scar/ dead space."}, {"n": 40, "s": "Which graft gives the strongest control of tip position, rotation and projection?", "o": ["Cephalic trim", "Alar rim graft", "Shield graft", "Interdomal suture", "Septal extension graft"], "k": "E", "x": "A septal extension graft gives the strongest control of tip position (rotation and projection). A columellar strut mainly supports."}, {"n": 41, "s": "A shield graft is used to:", "o": ["Treat valve collapse", "Increase tip projection and definition", "Narrow the dorsum", "Treat a saddle nose", "Lower the radix"], "k": "B", "x": "A shield graft increases tip projection and definition. Alar batten grafts treat external valve collapse; spreader grafts treat internal valve collapse."}, {"n": 42, "s": "The Cottle test is positive when:", "o": ["The septum is deviated", "The tip is ptotic", "The alae are flared", "Lateral cheek traction opens the airway (improved breathing), indicating valve collapse", "The roof is open"], "k": "D", "x": "In the Cottle test, lateral cheek traction opens the valve and improves breathing, meaning internal valve collapse. Use a curette to separate internal from external valve problems (modified Cottle)."}, {"n": 43, "s": "The most common complication of facelift surgery is:", "o": ["Hematoma (more common in men and with hypertension)", "Nerve injury", "Skin slough", "Infection", "Scar widening"], "k": "A", "x": "Hematoma is the most common complication of facelift surgery, more often in men and with hypertension. Nerve injury (great auricular) is the most common nerve complication."}, {"n": 44, "s": "A phenol (Baker–Gordon) peel is:", "o": ["Superficial", "Safe in all patients", "A deep peel, with risks of cardiac arrhythmia and hypopigmentation", "Used for Fitzpatrick scoring", "Minor"], "k": "C", "x": "A phenol (Baker–Gordon) peel is a deep peel; risks include cardiac arrhythmia, hypopigmentation and scarring. TCA 35% is a medium peel; glycolic acid is superficial."}, {"n": 45, "s": "A gold weight in the upper eyelid is used to treat:", "o": ["Ptosis", "Lower lid ectropion", "Brow ptosis", "Epiphora only", "Lagophthalmos in facial paralysis"], "k": "E", "x": "A gold weight improves eyelid closure in facial paralysis (lagophthalmos). Lower lid tightening (canthoplasty) is often added."}, {"n": 46, "s": "A naso-orbito-ethmoid fracture with a comminuted central fragment and avulsion of the medial canthal tendon is Markowitz–Manson:", "o": ["Type I", "Type III", "Type II", "Le Fort II", "Le Fort III"], "k": "B", "x": "Markowitz–Manson: I = single central fragment with tendon attached; II = comminuted, tendon attached to a fragment; III = comminuted with tendon avulsed. Test with bimanual palpation."}, {"n": 47, "s": "A frontal sinus fracture with a significantly displaced posterior table and CSF leak is best managed by:", "o": ["Cranialization", "Fat obliteration", "Observation", "Anterior table reduction only", "Antibiotics only"], "k": "A", "x": "Displaced posterior table with a CSF leak needs cranialization (remove posterior table and sinus mucosa). Obliteration is for duct injury with minimal posterior table displacement."}, {"n": 48, "s": "Bilateral condylar fractures of the mandible typically cause:", "o": ["Posterior open bite", "Class III malocclusion", "No change in occlusion", "Anterior open bite", "Facial paralysis"], "k": "D", "x": "Bilateral condylar fractures shorten the ramus, producing an anterior open bite with premature posterior contact."}, {"n": 49, "s": "The recommended excision margin for a 2.5 mm Breslow melanoma is:", "o": ["0.5 cm", "1 cm", "2 cm", "3 cm", "5 cm"], "k": "C", "x": "Melanoma margins: in situ 0.5 cm; up to 1 mm 1 cm; 1–2 mm 1–2 cm; over 2 mm 2 cm. In the head and neck, anatomy may limit margins."}, {"n": 50, "s": "The best indication for Mohs surgery among the following is:", "o": ["Superficial BCC of the trunk", "Nodular BCC in an elderly patient with low risk", "SCC in situ of the trunk", "Keloid", "Morpheaform BCC in the mask area of the face"], "k": "E", "x": "Mohs is for high-risk tumours: mask area (H zone), recurrent, infiltrative or morpheaform BCC, poorly defined borders, and perineural invasion."}]}, {"c": 5, "t": "Session 3", "d": "Set 3 — rhinoplasty (20), facial plastics (15), flaps (15)", "q": [{"n": 1, "s": "The keystone area is the junction of:", "o": ["Nasal bones and the frontal process of the maxilla only", "Upper and lower lateral cartilages only", "Nasal bones, perpendicular plate of ethmoid, upper lateral cartilages and dorsal septal cartilage", "Medial crura and caudal septum", "Septum and vomer"], "k": "C", "x": "The keystone area: nasal bones, perpendicular plate of ethmoid, upper lateral cartilages and dorsal septum. It is a key area for dorsal stability; disrupting it (hump removal) leads to collapse unless it is reconstituted."}, {"n": 2, "s": "The scroll area is the overlap between:", "o": ["The caudal border of the upper lateral cartilage and the cephalic border of the lower lateral cartilage", "The medial crura and the septum", "The nasal bone and the upper lateral cartilage", "The lateral crus and the alar rim", "The septum and the maxillary crest"], "k": "A", "x": "The scroll area is the overlap of the caudal ULC and the cephalic LLC. It contributes to tip support and is the site of the intercartilaginous incision."}, {"n": 3, "s": "The nasal bones are:", "o": ["Thinnest at the nasofrontal suture", "Of uniform thickness", "Thickest at the pyriform aperture", "Thinnest superiorly and thickest inferiorly", "Thickest superiorly (nasofrontal junction) and thinnest caudally"], "k": "E", "x": "Nasal bones are thickest superiorly (nasofrontal junction) and thinnest caudally, which is why osteotomies are made low and the radix is hard to reduce."}, {"n": 4, "s": "The ideal nasofrontal angle is about:", "o": ["90–100°", "115–130°", "140–150°", "150–160°", "100–105°"], "k": "B", "x": "115–130° (the nasofrontal angle). The radix sets this angle."}, {"n": 5, "s": "The radix ideally lies at the level of the:", "o": ["Brow", "Medial canthus", "Lower eyelid", "Supratarsal fold (upper lash line)", "Pupil"], "k": "D", "x": "The radix should sit at the level of the supratarsal fold (upper lash line). ⚠️ Some sources say the upper lash line; check your copy."}, {"n": 6, "s": "According to Goode’s method, the ideal ratio of nasal tip projection to nasal length is:", "o": ["0.55–0.60", "0.30–0.40", "0.70–0.80", "0.90–1.0", "1.2"], "k": "A", "x": "Goode ratio 0.55–0.60 (projection from alar crease to tip divided by nasal length, nasion to tip)."}, {"n": 7, "s": "The Frankfort horizontal plane passes through:", "o": ["Nasion and pogonion", "Glabella and subnasale", "The inferior orbital rim (orbitale) and the upper margin of the external auditory canal (porion)", "The tragus and the alar base", "Nasion and sella"], "k": "C", "x": "The Frankfort horizontal passes from the orbitale to the porion; it is the standard head position for photography and analysis."}, {"n": 8, "s": "The internal nasal valve is bounded by:", "o": ["Alar rim, columella and nostril sill", "Medial crus, lateral crus and nasal floor", "Nasal bone, maxilla and septum", "Caudal upper lateral cartilage, dorsal septum and the head of the inferior turbinate", "Nasal tip, lobule and sill"], "k": "D", "x": "The internal valve: caudal ULC, dorsal septum and the head of the inferior turbinate (angle 10–15°)."}, {"n": 9, "s": "The management of a septal hematoma after rhinoplasty is:", "o": ["Observation", "Immediate drainage/ evacuation", "Antibiotics only", "Decongestants", "Delay for 2 weeks"], "k": "B", "x": "A septal hematoma needs immediate drainage; otherwise it causes cartilage necrosis, septal abscess and saddle nose."}, {"n": 10, "s": "Septal perforation after septoplasty is most often due to:", "o": ["Excess cartilage resection", "Infection only", "Cocaine use", "Cautery of the septal artery", "Opposing mucoperichondrial tears on both sides"], "k": "E", "x": "Opposing mucoperichondrial tears on both sides of the septum cause the vast majority of postoperative perforations."}, {"n": 11, "s": "A transcolumellar incision in open rhinoplasty jeopardises the:", "o": ["Angular artery", "Columellar branch of the superior labial artery", "Dorsal nasal artery", "Infraorbital artery", "Lateral nasal artery"], "k": "B", "x": "The columellar arteries come from the superior labial arteries; take care with the transcolumellar incision to avoid skin necrosis."}, {"n": 12, "s": "Sensation of the nasal tip skin is carried by the:", "o": ["Infraorbital nerve", "Infratrochlear nerve", "Greater palatine nerve", "External nasal branch of the anterior ethmoidal nerve (V1)", "Nasopalatine nerve"], "k": "D", "x": "The external nasal branch of the anterior ethmoidal nerve (V1) supplies the tip and dorsum; the infraorbital nerve supplies the lateral nose and ala."}, {"n": 13, "s": "An autospreader flap is created by:", "o": ["Folding the upper lateral cartilages medially to create a spreader effect", "Harvesting rib cartilage", "Placing an alar rim graft", "Extending the septum", "Placing a columellar strut"], "k": "A", "x": "The autospreader flap folds the ULC medially to act as a spreader, widening the internal valve without cartilage grafts."}, {"n": 14, "s": "A lateral crural strut graft is used to:", "o": ["Narrow the dorsum", "Raise the radix", "Support weak or collapsing lateral crura and treat alar retraction or pinching", "Increase columellar show", "Close an open roof"], "k": "C", "x": "A lateral crural strut graft supports weak, malpositioned or collapsed lateral crura (alar collapse, retraction, pinched tip)."}, {"n": 15, "s": "A Weir excision is used for:", "o": ["A dorsal hump", "Tip ptosis", "Valve collapse", "An open roof", "Excessive alar flaring (wide alar base)"], "k": "E", "x": "Weir excision removes alar base/ sill skin to reduce flaring. Over-resection narrows the nostril and leaves a visible scar."}, {"n": 16, "s": "In a patient with thick, sebaceous nasal skin:", "o": ["Aggressive cartilage reduction is ideal", "Edema resolves quickly", "Strong structural cartilage grafting with conservative reduction is needed; expect prolonged edema", "Grafts should be avoided", "Thin grafts are always enough"], "k": "C", "x": "Thick sebaceous skin hides refinement and swells for a long time. Use strong structural support and conservative reduction."}, {"n": 17, "s": "Revision rhinoplasty should generally wait at least:", "o": ["1 week", "1 month", "3 months", "12 months", "5 years"], "k": "D", "x": "Wait about 12 months so edema and scar contracture settle."}, {"n": 18, "s": "Elective rhinoplasty in adolescents is generally delayed until nasal growth is complete, at about:", "o": ["10–12 years", "15–16 years (girls) and 17–18 years (boys)", "20 years for both", "8 years", "25 years"], "k": "B", "x": "About 15–16 years in girls and 17–18 in boys (growth complete). ⚠️ Check your Cummings copy for exact ages."}, {"n": 19, "s": "Severe saddle nose is best repaired with:", "o": ["Autologous costal cartilage dorsal graft (with L-strut support)", "Cephalic trim", "Alar batten graft", "Weir excision", "Osteotomies"], "k": "A", "x": "Severe saddle nose needs an autologous costal cartilage dorsal graft (± L-strut or cantilever graft)."}, {"n": 20, "s": "The intercartilaginous incision lies between the:", "o": ["Medial and lateral crura", "Skin and mucosa of the columella", "Septum and the upper lateral cartilage", "Nasal bone and the upper lateral cartilage", "Caudal border of the upper lateral cartilage and the cephalic border of the lower lateral cartilage"], "k": "E", "x": "The intercartilaginous incision lies between the caudal ULC and cephalic LLC. It exposes the dorsum in a closed (delivery) approach."}, {"n": 21, "s": "Pitanguy’s line marks the course of the temporal (frontal) branch of the facial nerve. It runs from:", "o": ["The tragus to the lateral canthus", "A point 0.5 cm below the tragus to a point 1.5 cm above the lateral eyebrow", "The tragus to the angle of the mouth", "The mastoid to the chin", "The zygomatic arch to the lateral canthus"], "k": "B", "x": "Pitanguy’s line runs from 0.5 cm below the tragus to 1.5 cm above the lateral eyebrow. It tracks the temporal branch."}, {"n": 22, "s": "McGregor’s patch is the:", "o": ["Mandibular ligament", "Masseteric ligament", "Orbicularis retaining ligament", "Platysma auricular ligament", "Zygomatic cutaneous ligament"], "k": "E", "x": "McGregor’s patch is the zygomatic cutaneous (osteocutaneous) ligament. It anchors the skin to the zygoma and limits mobilisation in a facelift."}, {"n": 23, "s": "A delayed snap-back of the lower eyelid on the snap test indicates:", "o": ["A normal lid", "Medial canthal laxity only", "Lid retractor weakness", "Lower lid laxity, with a risk of ectropion or scleral show after blepharoplasty unless tightened", "Ptosis"], "k": "D", "x": "A delayed snap-back signals lower-lid laxity, so add lid tightening (canthopexy/ canthoplasty) to avoid ectropion or scleral show."}, {"n": 24, "s": "The first step in a suspected retrobulbar hematoma after blepharoplasty is:", "o": ["Immediate lateral canthotomy and cantholysis", "CT before any action", "Observation", "Antibiotics", "Eye patching"], "k": "A", "x": "Retrobulbar hematoma is a vision emergency; perform immediate lateral canthotomy and cantholysis, and add IOP-lowering measures (head up, acetazolamide, mannitol)."}, {"n": 25, "s": "The upper eyelid fat pad that is pale (white) is the:", "o": ["Central", "Lateral", "Medial (nasal)", "Preaponeurotic", "Retro-orbicularis oculi fat"], "k": "C", "x": "The medial (nasal) upper lid fat pad is pale and more fibrous, and it bleeds easily (medial palpebral artery)."}, {"n": 26, "s": "In the ideal female brow, the peak of the arch lies above the:", "o": ["Medial canthus", "Pupil", "Medial limbus", "Alar base", "Lateral limbus"], "k": "E", "x": "In women the peak of the arch lies above the lateral limbus. Men have a flatter brow at the orbital rim."}, {"n": 27, "s": "Botulinum toxin type A acts by:", "o": ["Blocking postsynaptic acetylcholine receptors", "Cleaving SNAP-25 so acetylcholine vesicles cannot fuse", "Depolarising the motor end plate", "Inhibiting acetylcholinesterase", "Blocking calcium channels on the muscle"], "k": "B", "x": "Botulinum toxin A cleaves SNAP-25 and blocks acetylcholine release. Onset 3–7 days; lasts about 3–4 months."}, {"n": 28, "s": "A medium-depth chemical peel is:", "o": ["Glycolic acid", "Salicylic acid", "Trichloroacetic acid (TCA) 35%", "Phenol", "TCA 10%"], "k": "C", "x": "TCA 35% is a medium-depth peel. Glycolic, salicylic and TCA 10% are superficial; phenol is deep."}, {"n": 29, "s": "Fitzpatrick skin type IV is:", "o": ["Always burns, never tans", "Usually burns, tans minimally", "Sometimes burns, tans gradually", "Burns minimally, tans easily", "Never burns"], "k": "D", "x": "Fitzpatrick IV burns minimally and tans easily (I always burns; II usually burns; III sometimes burns; V brown skin; VI black skin)."}, {"n": 30, "s": "Glogau type III photoaging is characterised by:", "o": ["Advanced photoaging with wrinkles at rest", "Wrinkles in motion only", "No wrinkles", "Only wrinkles with no normal skin", "Dyspigmentation only"], "k": "A", "x": "Glogau III = wrinkles at rest (advanced photoaging). I: no wrinkles; II: wrinkles in motion; IV: only wrinkles."}, {"n": 31, "s": "A telephone-ear deformity after otoplasty is:", "o": ["An over-rotated lobule", "A constricted ear", "Recurrent prominence", "Over-correction of the middle third with prominent upper and lower poles", "A keloid"], "k": "D", "x": "Telephone-ear deformity: over-correction of the middle third, so the upper and lower poles protrude. Prevent it by balanced suture placement."}, {"n": 32, "s": "Donor hair for transplantation is taken from the occipital scalp because it:", "o": ["Is the thickest", "Has the best blood supply", "Is resistant to dihydrotestosterone (androgen-insensitive)", "Is easiest to harvest", "Grows fastest"], "k": "C", "x": "Occipital hair is resistant to DHT, so transplanted follicles persist (donor dominance)."}, {"n": 33, "s": "The usual maximum dose of lidocaine is:", "o": ["4.5 mg/kg plain and 7 mg/kg with epinephrine", "1 mg/kg", "10 mg/kg plain", "20 mg/kg", "15 mg/kg plain"], "k": "A", "x": "Lidocaine maximum: 4.5 mg/kg plain; 7 mg/kg with epinephrine."}, {"n": 34, "s": "The chromophore targeted by CO₂ and Er:YAG lasers is:", "o": ["Hemoglobin", "Melanin", "Tattoo ink", "Hair", "Water"], "k": "E", "x": "Water is the chromophore for CO₂ and Er:YAG resurfacing lasers. Pulsed dye laser targets hemoglobin; Q-switched lasers target melanin."}, {"n": 35, "s": "Regarding the marginal mandibular nerve:", "o": ["It always lies above the inferior border of the mandible", "Posterior to the facial artery it may lie below the inferior mandibular border", "It is superficial to the platysma", "It lies deep to the facial vein", "It runs on the masseter surface"], "k": "B", "x": "The marginal mandibular nerve lies deep to the platysma and superficial to the facial vein; posterior to the facial artery it may drop below the mandibular border (Hayes Martin maneuver protects it). ⚠️ Percentages vary between sources."}, {"n": 36, "s": "The vascular pedicle of the pectoralis major flap runs along a line from the:", "o": ["Acromion to the xiphoid process", "Clavicle to the sternal notch", "Nipple to the axilla", "Mastoid to the clavicle", "Acromion to the angle of the mandible"], "k": "A", "x": "The thoracoacromial pedicle follows the acromion–xiphoid line. Place the skin island over the inferomedial muscle."}, {"n": 37, "s": "In the Zitelli modification of the bilobed flap, the total arc of rotation is about:", "o": ["30°", "45°", "120°", "180°", "90°"], "k": "E", "x": "Zitelli bilobed: total arc about 90° (≈ 45° per lobe), which reduces the standing cone compared with Esser’s 180°."}, {"n": 38, "s": "A Z-plasty with 60° angles rotates the axis of the scar by about:", "o": ["45°", "90°", "60°", "120°", "30°"], "k": "B", "x": "A 60° Z-plasty rotates the central limb (the scar axis) by 90° and lengthens by 75%."}, {"n": 39, "s": "A back-cut in a rotation flap:", "o": ["Increases the width of the pedicle", "Is used only in free flaps", "Releases tension at the pivot but narrows the pedicle, with a risk to its blood supply", "Is never needed", "Shortens the arc"], "k": "C", "x": "A back-cut releases tension but narrows the pedicle and can compromise perfusion; use it sparingly."}, {"n": 40, "s": "A standing cone (dog-ear) at the end of a closure is corrected by:", "o": ["Z-plasty", "Skin graft", "W-plasty", "Excision of a Burow’s triangle", "A free flap"], "k": "D", "x": "A Burow’s triangle removes the standing cone (dog-ear). Z-plasty lengthens; W-plasty irregularises; M-plasty shortens a scar."}, {"n": 41, "s": "The lateral arm free flap is supplied by the:", "o": ["Radial recurrent artery", "Brachial artery", "Posterior radial collateral artery", "Ulnar collateral artery", "Anterior interosseous artery"], "k": "C", "x": "The lateral arm flap is based on the posterior radial collateral artery (branch of the profunda brachii); sensate via the posterior cutaneous nerve of the arm."}, {"n": 42, "s": "The medial sural artery perforator flap is:", "o": ["A thin, pliable flap based on the medial sural artery (branch of the popliteal artery)", "A thick flap based on the peroneal artery", "Based on the thoracodorsal artery", "An osseous flap", "Based on the posterior tibial artery"], "k": "A", "x": "The medial sural artery perforator (MSAP) flap is thin and pliable, with a pedicle from the medial sural artery (branch of the popliteal)."}, {"n": 43, "s": "The main complication of harvesting the radius in an osteocutaneous radial forearm flap is:", "o": ["Ulnar nerve palsy", "Wrist ankylosis", "Compartment syndrome", "Pathological fracture of the radius (reduced by limiting the harvest and prophylactic plating)", "Median nerve palsy"], "k": "D", "x": "Harvesting the radius risks pathological fracture; limit the bone to a partial thickness and use prophylactic plating."}, {"n": 44, "s": "Common recipient arteries for free flaps in the head and neck are:", "o": ["Internal carotid artery", "Facial, superior thyroid and transverse cervical arteries", "Vertebral artery", "Subclavian artery", "Common carotid artery directly"], "k": "B", "x": "The facial, superior thyroid and transverse cervical arteries are the usual recipients; the external jugular, IJ and facial veins drain."}, {"n": 45, "s": "The no-reflow phenomenon is:", "o": ["Arterial spasm", "Venous thrombosis", "Hematoma", "Infection", "Failure of capillary perfusion despite a patent anastomosis after prolonged ischemia"], "k": "E", "x": "No-reflow follows prolonged ischemia (endothelial swelling, microvascular occlusion) despite a patent anastomosis. Minimise ischemic time."}, {"n": 46, "s": "After a free jejunal flap for pharyngoesophageal reconstruction, voice is typically:", "o": ["Normal", "Hypernasal", "Whispered", "Dry", "“Wet” or gurgly (mucus secretion and peristalsis)"], "k": "E", "x": "Jejunal reconstruction gives a wet, gurgly voice from mucus secretion and peristalsis. Other problems: stricture and leak."}, {"n": 47, "s": "A platysma myocutaneous flap is contraindicated after:", "o": ["Previous parotidectomy", "Thyroidectomy", "Prior neck dissection with ligation of the facial/submental vessels", "Smoking history", "None of the above"], "k": "C", "x": "The platysma flap depends on the facial/submental vessels, so prior neck dissection or radiotherapy compromises it. It is not reliable in oncology."}, {"n": 48, "s": "The palatal island flap is supplied by the:", "o": ["Greater palatine artery", "Lesser palatine artery", "Ascending palatine artery", "Facial artery", "Sphenopalatine artery"], "k": "A", "x": "The greater palatine artery supplies the palatal island flap, used for small oral and palatal defects."}, {"n": 49, "s": "Complications of the temporoparietal fascia flap include:", "o": ["Lower facial paralysis", "Alopecia and injury to the temporal (frontal) branch of the facial nerve", "Hypoglossal nerve palsy", "Lagophthalmos from the donor site", "Frontal sinus injury"], "k": "B", "x": "TPF flap morbidity: alopecia (hair follicle damage) and injury to the temporal branch of the facial nerve."}, {"n": 50, "s": "The perforators of the anterolateral thigh flap are:", "o": ["Only septocutaneous", "Through the rectus femoris only", "Through the gracilis", "Septocutaneous or musculocutaneous (through the vastus lateralis), from the descending branch of the lateral circumflex femoral artery", "Through the sartorius"], "k": "D", "x": "ALT perforators come from the descending branch of the lateral circumflex femoral artery and run septocutaneous or musculocutaneous (via the vastus lateralis)."}]}, {"c": 6, "t": "Session 1", "d": "Hard 50 (Cummings) — all subspecialties, EXCEPT/numbers/classifications", "q": [{"n": 1, "s": "The characteristic VEMP finding in superior semicircular canal dehiscence is:", "o": ["Absent cVEMP bilaterally", "Elevated cVEMP threshold in the affected ear", "Lowered cVEMP threshold with increased amplitude in the affected ear", "Prolonged ABR wave I–III interval", "Normal VEMP with a hyperactive caloric response"], "k": "C", "x": "The dehiscence acts as a “third window”: lowered cVEMP threshold with increased amplitude. Clinical clues are Tullio, Hennebert and autophony. Diagnose with HRCT reformatted in the plane of the canal (Pöschl/Stenvers). A pseudo-conductive loss with normal acoustic reflexes points to SCDS, not otosclerosis."}, {"n": 2, "s": "Apogeotropic horizontal nystagmus on the supine roll test is most consistent with:", "o": ["Posterior canal canalolithiasis", "Lateral canal canalolithiasis (long arm), which is geotropic", "Anterior canal canalolithiasis", "Lateral canal cupulolithiasis (or short-arm debris)", "Vestibular neuritis"], "k": "D", "x": "Apogeotropic = cupulolithiasis or short-arm canalolithiasis of the lateral canal. Geotropic = long-arm canalolithiasis. The affected side is the stronger-beating side in geotropic and the weaker side in apogeotropic."}, {"n": 3, "s": "Definite Ménière’s disease (AAO-HNS 2015 / Bárány) requires all of the following EXCEPT:", "o": ["≥2 spontaneous vertigo episodes, each lasting 20 min to 12 h", "Audiometrically documented low-to-medium frequency SNHL in the affected ear", "Fluctuating aural symptoms (hearing, tinnitus, fullness) in the affected ear", "Not better accounted for by another vestibular diagnosis", "Positive glycerol dehydration test"], "k": "E", "x": "The criteria include audiometric documentation of low-to-medium frequency SNHL, spontaneous episodes of 20 min to 12 h, fluctuating aural symptoms, and exclusion of other causes. Glycerol testing is not part of the criteria."}, {"n": 4, "s": "In the fundus of the internal auditory canal, the vertical crest (Bill’s bar) separates:", "o": ["Superior from inferior vestibular nerve", "Facial nerve from superior vestibular nerve", "Cochlear nerve from inferior vestibular nerve", "Facial nerve from cochlear nerve", "Superior vestibular nerve from cochlear nerve"], "k": "B", "x": "The vertical crest separates the facial nerve (anterosuperior) from the superior vestibular nerve (posterosuperior). The horizontal (falciform) crest separates superior from inferior. Bill’s bar is the key landmark in the middle fossa approach."}, {"n": 5, "s": "All of the following are features of NF2 EXCEPT:", "o": ["≥6 café-au-lait macules with axillary freckling", "Bilateral vestibular schwannomas", "Juvenile posterior subcapsular lens opacity", "Spinal schwannomas", "Meningiomas"], "k": "A", "x": "Café-au-lait macules and axillary freckling are NF1 (chr 17q). NF2 (chr 22q12, merlin) features bilateral VS, meningiomas, spinal schwannomas and juvenile cataract."}, {"n": 6, "s": "A patient has obvious facial weakness with incomplete eye closure and asymmetry of the mouth with maximal effort. The House–Brackmann grade is:", "o": ["II", "III", "IV", "V", "VI"], "k": "C", "x": "HB IV: obvious weakness and/or disfiguring asymmetry, incomplete eye closure, asymmetric mouth with maximal effort. HB III has complete eye closure with effort and non-disfiguring asymmetry."}, {"n": 7, "s": "Compared with otic capsule–sparing temporal bone fractures, otic capsule–violating fractures have higher rates of all EXCEPT:", "o": ["Facial nerve paralysis", "Conductive hearing loss", "Profound SNHL", "CSF leak", "Intracranial complications"], "k": "B", "x": "Violating fractures cause more profound SNHL, more facial paralysis, CSF leak and intracranial complications. Conductive loss (hemotympanum, ossicular disruption) is more typical of sparing fractures."}, {"n": 8, "s": "Bezold’s abscess results from pus erupting through:", "o": ["The zygomatic root of the mastoid (subperiosteal)", "The medial aspect of the mastoid tip (digastric groove) into the neck deep to the SCM", "The posterior mastoid cortex (postauricular)", "The sigmoid plate (perisinus abscess)", "The petrous apex"], "k": "B", "x": "Pus erupts through the medial mastoid tip into the neck deep to the SCM. Citelli’s abscess tracks along the digastric ridge. A zygomatic root abscess is the Luc type."}, {"n": 9, "s": "The classic triad of Gradenigo’s syndrome is:", "o": ["Otorrhea, facial palsy, vertigo", "Otalgia, trismus, hemifacial spasm", "Hearing loss, tinnitus, vertigo", "Fever, headache, papilledema", "Otorrhea, retro-orbital pain, abducens palsy"], "k": "E", "x": "Petrous apicitis: otorrhea, retro-orbital (trigeminal) pain, and CN VI palsy (Dorello’s canal)."}, {"n": 10, "s": "Congenital cholesteatoma in children is most commonly found in the:", "o": ["Anterosuperior quadrant of the middle ear", "Posterosuperior quadrant of the middle ear", "Pars flaccida/attic", "Mastoid antrum", "Epitympanum"], "k": "A", "x": "Levenson/Derlacki–Clemis criteria: intact TM, retrotympanic white mass, no history of otorrhea or perforation. The most common site in children is the anterosuperior quadrant."}, {"n": 11, "s": "In acute continuous vertigo with spontaneous nystagmus, the finding that most strongly suggests a CENTRAL cause is:", "o": ["Unidirectional horizontal nystagmus beating away from the lesion", "Abnormal (positive) head impulse test", "Nystagmus suppressed by visual fixation", "Normal head impulse test", "Severe nausea and vomiting"], "k": "D", "x": "A normal head impulse test in a patient with continuous vertigo and spontaneous nystagmus suggests a central cause (HINTS: Impulse Normal, Nystagmus direction-changing, Test of skew). Fixation-suppressed, unidirectional nystagmus and an abnormal HIT are peripheral."}, {"n": 12, "s": "Bent–Kuhn criteria for allergic fungal rhinosinusitis do NOT require:", "o": ["Type I hypersensitivity", "Fungal invasion of the mucosa", "Nasal polyposis", "Characteristic CT findings", "Eosinophilic mucin with positive fungal stain"], "k": "B", "x": "AFRS requires type I hypersensitivity, polyposis, characteristic CT (hyperattenuation, expansion) and eosinophilic mucin with fungal stain. There is NO tissue invasion."}, {"n": 13, "s": "Regarding acute invasive fungal rhinosinusitis in diabetic ketoacidosis:", "o": ["Hyphae are narrow and septate with 45° branching", "Aspergillus is the classical pathogen in DKA", "Hyphae are broad, ribbon-like, pauciseptate with ~90° branching (Mucorales)", "Voriconazole is the first-line drug for Mucorales", "A course longer than 12 weeks is required for diagnosis"], "k": "C", "x": "Mucorales hyphae are broad, ribbon-like and pauciseptate, with right-angle branching. Aspergillus is narrow and septate with 45° branching. Treat with debridement, liposomal amphotericin B, and correction of the acidosis/immune defect. Voriconazole has no Mucorales activity."}, {"n": 14, "s": "The olfactory fossa depth (lateral lamella of the cribriform plate) in Keros type III is:", "o": ["1–3 mm", "4–7 mm", "8–16 mm", "17–20 mm", "Cannot be classified"], "k": "C", "x": "Keros I = 1–3 mm, II = 4–7 mm, III = 8–16 mm. Type III carries the highest risk of skull base injury because the lateral lamella is the thinnest bone."}, {"n": 15, "s": "The most important cause of recurrence after resection of sinonasal inverted papilloma is:", "o": ["Incomplete removal of the site of attachment (including underlying bone)", "HPV subtype", "Tumor size", "Patient age", "Smoking"], "k": "A", "x": "Recurrence is mostly from incomplete removal of the attachment site. CT shows focal hyperostosis at the attachment, and subperiosteal dissection or drilling is needed. HPV 6/11 is associated, and malignant transformation is roughly 5–10%."}, {"n": 16, "s": "A destructive midline nasal lesion with angiocentric necrosis, EBER-positive, CD56+ and cytoplasmic CD3ε+ is:", "o": ["Granulomatosis with polyangiitis", "Cocaine-induced midline destructive lesion", "Diffuse large B-cell lymphoma", "Sinonasal undifferentiated carcinoma", "Extranodal NK/T-cell lymphoma, nasal type"], "k": "E", "x": "Extranodal NK/T-cell lymphoma, nasal type: EBV-driven, angiocentric, CD56+. It is treated with chemoradiation, not surgery."}, {"n": 17, "s": "Esthesioneuroblastoma Kadish stage B is tumor involving:", "o": ["The nasal cavity only", "The nasal cavity and one or more paranasal sinuses", "Extension beyond the nasal cavity and sinuses (orbit, skull base, intracranial)", "Cervical nodes or distant metastases"], "k": "B", "x": "Kadish A = nasal cavity, B = nasal cavity plus sinuses, C = beyond. Morita added D for nodal or distant metastases."}, {"n": 18, "s": "Hereditary hemorrhagic telangiectasia associated with juvenile polyposis is caused by mutation in:", "o": ["ENG", "ACVRL1", "SMAD4", "GDF2", "RASA1"], "k": "C", "x": "SMAD4 causes the HHT + juvenile polyposis overlap. ENG is HHT1 (more pulmonary AVMs) and ACVRL1 is HHT2 (more hepatic AVMs). RASA1 causes capillary malformation–AVM."}, {"n": 19, "s": "Kallmann syndrome results from failure of:", "o": ["Neural crest cells to populate the frontonasal prominence", "Rathke’s pouch development", "Induction of the olfactory placode only", "GnRH neuron migration from the olfactory placode to the hypothalamus", "Anterior pituitary development"], "k": "D", "x": "GnRH neurons fail to migrate along olfactory axons. The result is anosmia plus hypogonadotropic hypogonadism, most commonly ANOS1 (X-linked). MRI shows absent or hypoplastic olfactory bulbs."}, {"n": 20, "s": "In Hirano’s body-cover model, the “cover” of the vocal fold comprises:", "o": ["Epithelium only", "Epithelium and superficial lamina propria", "Superficial and intermediate lamina propria", "Intermediate and deep lamina propria", "Thyroarytenoid muscle"], "k": "B", "x": "Cover = epithelium + superficial lamina propria (Reinke’s space). Transition = intermediate + deep lamina propria (vocal ligament). Body = thyroarytenoid."}, {"n": 21, "s": "A child has 60% subglottic stenosis. The Cotton–Myer grade is:", "o": ["I", "II", "III", "IV", "Not gradable by percentage"], "k": "B", "x": "Cotton–Myer: I ≤50%, II 51–70%, III 71–99%, IV no lumen."}, {"n": 22, "s": "A laryngeal cleft extending through the cricoid cartilage into the cervical trachea is Benjamin–Inglis type:", "o": ["I", "II", "III", "IV"], "k": "C", "x": "Benjamin–Inglis: I = interarytenoid cleft above the vocal folds; II = extends below the vocal folds into the cricoid; III = through the cricoid into the cervical trachea; IV = into the thoracic trachea."}, {"n": 23, "s": "A Zenker diverticulum arises through the dehiscence between:", "o": ["Thyropharyngeus and cricopharyngeus (Killian’s dehiscence)", "Cricopharyngeus and the circular esophageal fibers (Laimer’s triangle)", "Superior and middle constrictors", "Middle and inferior constrictors", "Stylopharyngeus and superior constrictor"], "k": "A", "x": "Killian’s dehiscence lies between the oblique thyropharyngeus and the transverse cricopharyngeus. A Killian–Jamieson diverticulum arises below the cricopharyngeus."}, {"n": 24, "s": "In recurrent respiratory papillomatosis, the HPV type associated with the more aggressive course is:", "o": ["HPV 16", "HPV 18", "HPV 6", "HPV 33", "HPV 11"], "k": "E", "x": "HPV 6 and 11 cause RRP, with HPV 11 linked to more aggressive disease (earlier onset, more surgeries, more tracheostomy). Risk factors are firstborn, vaginal delivery and a young mother."}, {"n": 25, "s": "Botulinum toxin for abductor spasmodic dysphonia is injected into the:", "o": ["Thyroarytenoid", "Lateral cricoarytenoid", "Cricothyroid", "Interarytenoid", "Posterior cricoarytenoid"], "k": "E", "x": "Abductor SD affects the PCA. Adductor SD (the commoner type) is treated with Botox to the thyroarytenoid."}, {"n": 26, "s": "The immunohistochemical marker that distinguishes infantile hemangioma from vascular malformations is:", "o": ["CD31", "CD34", "D2-40", "GLUT1", "HHV-8 LANA"], "k": "D", "x": "GLUT1 is positive in infantile hemangioma, but not in vascular malformations or in kaposiform hemangioendothelioma. D2-40 marks lymphatic endothelium."}, {"n": 27, "s": "Kasabach–Merritt phenomenon is associated with:", "o": ["Infantile hemangioma", "Venous malformation", "Lymphatic malformation", "Kaposiform hemangioendothelioma / tufted angioma", "Pyogenic granuloma"], "k": "D", "x": "Consumptive coagulopathy occurs with kaposiform hemangioendothelioma or tufted angioma, NOT with common infantile hemangioma. Treat with sirolimus or vincristine."}, {"n": 28, "s": "A bilateral cervicofacial lymphatic malformation involving both suprahyoid and infrahyoid neck is de Serres stage:", "o": ["I", "II", "III", "IV", "V"], "k": "E", "x": "de Serres: I = unilateral infrahyoid, II = unilateral suprahyoid, III = unilateral supra- plus infrahyoid, IV = bilateral suprahyoid, V = bilateral supra- plus infrahyoid. Higher stage means more airway and feeding problems."}, {"n": 29, "s": "Recurrent acute suppurative thyroiditis in a child is most likely due to:", "o": ["First branchial cleft anomaly", "Second branchial cleft fistula", "Thyroglossal duct remnant", "Fourth pouch sinus (pyriform sinus apex), usually left-sided", "Lingual thyroid"], "k": "D", "x": "A fourth pouch sinus arises at the apex of the pyriform sinus, is usually left-sided, and presents with recurrent suppurative thyroiditis or neck abscess. Confirm with a barium swallow or endoscopy."}, {"n": 30, "s": "In the Jahrsdoerfer grading for atresia surgery, the item awarded 2 points is:", "o": ["Stapes present", "Normal facial nerve course", "Round window", "Mastoid pneumatization", "External ear appearance"], "k": "A", "x": "The maximum score is 10, and a score ≥7 makes the patient a surgical candidate. Stapes present = 2 points; the other items are 1 point each."}, {"n": 31, "s": "CHARGE syndrome is caused by mutation in ___ and the hallmark temporal bone finding is ___:", "o": ["TCOF1; Mondini deformity", "CHD7; absent/hypoplastic semicircular canals", "EYA1; cochlear hypoplasia", "PAX3; enlarged vestibular aqueduct", "SLC26A4; cystic cochlea"], "k": "B", "x": "CHARGE is caused by CHD7 (chr 8q12). Absent or hypoplastic semicircular canals are the hallmark, together with coloboma and choanal atresia."}, {"n": 32, "s": "In symptomatic congenital CMV with CNS involvement, the antiviral therapy shown to improve hearing outcomes is:", "o": ["IV acyclovir for 21 days", "Hyperbaric oxygen", "Systemic corticosteroids", "Observation only", "Oral valganciclovir for 6 months"], "k": "E", "x": "Valganciclovir for 6 months improves hearing outcomes in symptomatic cCMV (Kimberlin, NEJM 2015). Monitor neutropenia. cCMV is the most common non-genetic cause of childhood SNHL."}, {"n": 33, "s": "Regarding PFAPA syndrome:", "o": ["Periodic fevers every 3–8 weeks, aborted by a single dose of corticosteroid, and tonsillectomy resolves most cases", "It is caused by group A streptococcus and cured by penicillin", "Typical onset is after age 10", "Persistent neutropenia is a diagnostic feature", "Attacks respond to antibiotics"], "k": "A", "x": "Periodic fever, aphthous stomatitis, pharyngitis and adenitis. A single steroid dose aborts attacks, and tonsillectomy is curative in most. It is not strep and antibiotics do not help."}, {"n": 34, "s": "Which gene fusion is correctly matched?", "o": ["Adenoid cystic carcinoma — CRTC1::MAML2", "Mucoepidermoid carcinoma — MYB::NFIB", "Secretory carcinoma — ETV6::NTRK3", "Pleomorphic adenoma — EWSR1::ATF1", "Acinic cell carcinoma — MYB::NFIB"], "k": "C", "x": "Secretory carcinoma carries ETV6::NTRK3 t(12;15), which is targetable with TRK inhibitors. MEC carries CRTC1::MAML2. ACC carries MYB::NFIB. Clear cell carcinoma carries EWSR1::ATF1. Pleomorphic adenoma shows PLAG1 or HMGA2. Acinic cell shows NR4A3 upregulation."}, {"n": 35, "s": "Salivary duct carcinoma is characterized by expression of:", "o": ["Estrogen receptor", "Progesterone receptor", "Strong CD117 only", "S100/SOX10 only", "Androgen receptor (often with HER2)"], "k": "E", "x": "Salivary duct carcinoma is AR-positive (androgen deprivation therapy) and often HER2positive. It is high grade and aggressive."}, {"n": 36, "s": "Day 2 after parathyroidectomy for severe hyperparathyroidism: low Ca, low phosphate, low Mg, normal/high PTH. The diagnosis is:", "o": ["Hungry bone syndrome", "Permanent hypoparathyroidism", "Pseudohypoparathyroidism", "Vitamin D toxicity", "Dilutional hypocalcemia"], "k": "A", "x": "Hungry bone: low Ca, low PO₄, low Mg. Hypoparathyroidism: low Ca with HIGH PO₄ and low PTH. Risk factors are a high preoperative ALP and bone disease."}, {"n": 37, "s": "Prophylactic thyroidectomy for a child with RET M918T (MEN2B) should be done:", "o": ["Within the first year of life", "At age 5", "At age 10", "At age 15", "Only when calcitonin rises"], "k": "A", "x": "ATA 2015: M918T (highest risk) gets thyroidectomy within the first year of life. C634 and A883F (high risk) get it at or before age 5. Always exclude a pheochromocytoma first."}, {"n": 38, "s": "NIFTP is defined by:", "o": ["Capsular invasion", "Vascular invasion", "More than 1% true papillae", "Encapsulated follicular pattern with PTC-type nuclear features and no invasion", "Lymph node metastases"], "k": "D", "x": "NIFTP is encapsulated or well-demarcated, with a follicular pattern and PTC-type nuclear features, and no capsular or vascular invasion. Treat with lobectomy. RAS mutations are more common than BRAF."}, {"n": 39, "s": "AJCC 8th: a 58-year-old with a 3 cm papillary thyroid carcinoma confined to the thyroid, ipsilateral level VI node positive, M0, is stage:", "o": ["I", "II", "III", "IVA", "IVB"], "k": "B", "x": "Age ≥55: T1–2 N1 = stage II. T1–2 N0 = stage I. T3 any N = stage II. T4a = III. T4b = IVA. M1 = IVB. Under 55, any T and any N with M0 is stage I."}, {"n": 40, "s": "AJCC 8th nasopharyngeal carcinoma: bilateral cervical nodes of 4 cm, above the caudal border of the cricoid, is:", "o": ["N1", "N3", "N3a", "N3b", "N2"], "k": "E", "x": "AJCC 8th: N1 = unilateral cervical and/or retropharyngeal nodes ≤6 cm above the cricoid; N2 = bilateral cervical nodes ≤6 cm; N3 = >6 cm and/or below the caudal border of the cricoid (no N3a/N3b)."}, {"n": 41, "s": "AJCC 8th p16+ oropharyngeal cancer: one ipsilateral 4 cm node and one contralateral 2 cm node is clinical:", "o": ["cN1", "cN2a", "cN2", "cN3", "cN2b"], "k": "C", "x": "For p16+ OPC, cN1 = ipsilateral nodes ≤6 cm; cN2 = contralateral or bilateral nodes ≤6 cm; cN3 = >6 cm. There is no N2a/N2b in this system."}, {"n": 42, "s": "In RTOG 91-11, the regimen with the best laryngeal preservation was:", "o": ["Concurrent cisplatin + radiotherapy", "Induction cisplatin/5-FU then radiotherapy", "Radiotherapy alone", "Cetuximab + radiotherapy", "Total laryngectomy"], "k": "A", "x": "Concurrent cisplatin-RT gave the best larynx preservation (about 88% vs 75% for induction and 70% for RT alone at 2 years). Overall survival was similar."}, {"n": 43, "s": "In RTOG 1016 (HPV+ oropharyngeal cancer), cetuximab + RT compared with cisplatin + RT was:", "o": ["Superior for overall survival", "Non-inferior", "Equivalent in toxicity and survival", "Inferior for overall and progression-free survival", "Not powered to compare"], "k": "D", "x": "Cetuximab-RT was inferior to cisplatin-RT for overall and progression-free survival, so cisplatin remains standard (De-ESCALaTE agreed)."}, {"n": 44, "s": "Modified radical neck dissection type II (Medina) preserves:", "o": ["CN XI only", "IJV and SCM", "CN XI, IJV and SCM", "SCM and CN XI", "CN XI and IJV"], "k": "E", "x": "Medina: type I preserves CN XI; type II preserves CN XI and IJV (SCM removed); type III preserves CN XI, IJV and SCM."}, {"n": 45, "s": "Recommended excision margin for a 1.5 mm Breslow melanoma is:", "o": ["0.5 cm", "1 cm only", "3 cm", "1–2 cm", "5 cm"], "k": "D", "x": "Melanoma margins: ≤1 mm = 1 cm; >1–2 mm = 1–2 cm; >2 mm = 2 cm. In the head and neck, anatomic limits may allow narrower margins."}, {"n": 46, "s": "In odontogenic Ludwig’s angina from the 2nd/3rd mandibular molars, infection first enters the ___ space because the root apices lie ___ the mylohyoid line:", "o": ["Sublingual; above", "Submandibular; below", "Submental; above", "Masticator; below", "Buccal; above"], "k": "B", "x": "The apices of the 2nd and 3rd molars lie below the mylohyoid line, so infection goes to the submandibular space. Ludwig’s involves both submandibular, sublingual and submental spaces bilaterally."}, {"n": 47, "s": "The poststyloid (retrostyloid) parapharyngeal compartment contains:", "o": ["ICA, IJV, CN IX–XII, sympathetic trunk", "Fat and minor salivary glands only", "Deep lobe of parotid", "Maxillary artery and V3", "Lingual nerve"], "k": "A", "x": "The poststyloid compartment holds the ICA, IJV, CN IX–XII and the sympathetic chain. A prestyloid mass is usually a deep-lobe parotid tumor (pleomorphic adenoma); a poststyloid mass is usually a paraganglioma or schwannoma."}, {"n": 48, "s": "The carotid sheath is formed by:", "o": ["Investing layer only", "Pretracheal layer only", "Investing, pretracheal and prevertebral layers", "Prevertebral layer only", "Alar fascia"], "k": "C", "x": "The carotid sheath receives contributions from all three layers of the deep cervical fascia (investing, pretracheal, prevertebral)."}, {"n": 49, "s": "In the Markowitz–Manson classification of NOE fractures, a single large central fragment with the medial canthal tendon attached is:", "o": ["Type I", "Type II", "Type III", "Type IV", "Le Fort II"], "k": "A", "x": "Type I: a single central fragment with the MCT attached. Type II: comminuted central fragment, tendon still attached to a fragment. Type III: comminution with tendon avulsion. Use bimanual palpation to test."}, {"n": 50, "s": "A frontal sinus fracture with a significantly displaced posterior table and CSF leak is best managed by:", "o": ["Observation", "Elevation of the anterior table only", "Cranialization (remove posterior table and sinus mucosa)", "Sinus obliteration with fat", "Antibiotics only"], "k": "C", "x": "Displaced posterior table or CSF leak means cranialization. Obliteration is for nasofrontal duct injury with a minimally displaced posterior table. A non-displaced anterior-only fracture is observed."}]}, {"c": 6, "t": "Session 2", "d": "Part II General 50 — otology, rhinology, laryngology, paediatrics, head & neck", "q": [{"n": 1, "s": "The narrowest segment of the fallopian (facial) canal is the:", "o": ["Meatal (internal auditory canal) segment", "Labyrinthine segment (meatal foramen)", "Tympanic segment", "Mastoid segment", "Extratemporal segment"], "k": "B", "x": "The labyrinthine segment (meatal foramen, ≈ 0.7 mm) is the narrowest; it is where swelling compresses the nerve in Bell’s palsy. The mastoid segment is the longest. (Cummings, Brackmann)"}, {"n": 2, "s": "The most common site of dehiscence of the facial canal is the:", "o": ["Labyrinthine segment", "Mastoid segment", "Internal auditory canal", "Tympanic segment above the oval window", "Second genu"], "k": "D", "x": "The tympanic segment above the oval window is most often dehiscent, so it is at risk in stapes and middle ear surgery. (Brackmann, Dhingra)"}, {"n": 3, "s": "In Bell’s palsy with complete paralysis, surgical decompression is considered when electroneurography shows:", "o": ["≥ 90% degeneration within 14 days of onset (with no voluntary EMG activity)", "50% degeneration at 3 months", "30% degeneration at any time", "70% degeneration at 1 month", "Any degree of degeneration"], "k": "A", "x": "Decompression is considered with ≥ 90% degeneration on ENoG within 14 days and no voluntary EMG (Fisch/ Gantz criteria), via middle fossa decompression of the meatal foramen. ⚠️ Indications remain debated. (Cummings, Brackmann)"}, {"n": 4, "s": "The Carhart notch in otosclerosis is:", "o": ["An air-conduction dip at 4 kHz", "A bone-conduction dip at 500 Hz", "A bone-conduction dip maximal at 2 kHz", "An air-conduction dip at 1 kHz", "A bone-conduction dip at 8 kHz"], "k": "C", "x": "The Carhart notch is a bone-conduction dip maximal at 2 kHz; it is a mechanical artefact and improves after stapes surgery. (Dhingra, Cummings)"}, {"n": 5, "s": "A perilymph “gusher” during stapes surgery is associated with X-linked deafness caused by mutation in:", "o": ["GJB2", "SLC26A4", "COL4A5", "MYO7A", "POU3F4"], "k": "E", "x": "POU3F4 (DFN3) causes X-linked mixed hearing loss with a widened IAC and deficient modiolus, so a stapes gusher is likely. Avoid stapes surgery; image first. (Cummings)"}, {"n": 6, "s": "Acoustic reflex decay is considered positive (suggesting a retrocochlear lesion) when:", "o": ["The ipsilateral reflex is absent", "The reflex amplitude falls by more than 50% within 10 seconds (at 500/1000 Hz)", "The reflex appears at 60 dB SL", "The reflex amplitude increases", "The tympanogram is type B"], "k": "B", "x": "Reflex decay is positive with a > 50% fall within 10 s (at 500/1000 Hz), suggesting a retrocochlear lesion. (Oxford, Dhingra)"}, {"n": 7, "s": "Wave III of the auditory brainstem response is generated mainly by the:", "o": ["Distal cochlear nerve", "Proximal cochlear nerve", "Superior olivary complex", "Cochlear nucleus", "Inferior colliculus"], "k": "D", "x": "ABR generators: I distal VIII, II proximal VIII, III cochlear nucleus, IV superior olivary complex, V lateral lemniscus/ inferior colliculus. (Cummings, Dhingra)"}, {"n": 8, "s": "The Hitselberger sign in vestibular schwannoma is:", "o": ["Hypoesthesia of the posterosuperior external auditory canal (sensory fibres of CN VII)", "Pain behind the ear", "Loss of the corneal reflex", "Tinnitus on pressure over the tragus", "Nystagmus on pressure over the tragus"], "k": "A", "x": "The Hitselberger sign is hypoesthesia of the posterosuperior canal wall from pressure on the sensory fibres of CN VII. (Dhingra, Brackmann)"}, {"n": 9, "s": "The area most likely to hide residual cholesteatoma, lying medial to the facial nerve between the ponticulus and subiculum, is the:", "o": ["Facial recess", "Anterior epitympanum", "Protympanum", "Prussak’s space", "Sinus tympani"], "k": "E", "x": "The sinus tympani (medial to the facial nerve, between ponticulus and subiculum) is hard to see, so it is the classic site of residual cholesteatoma; use endoscopes. (Brackmann, Cummings)"}, {"n": 10, "s": "The cochlear implant electrode array is placed in the:", "o": ["Scala vestibuli", "Scala media", "Scala tympani (via the round window or a cochleostomy)", "Vestibule", "Internal auditory canal"], "k": "C", "x": "The electrode array goes into the scala tympani via the round window or a cochleostomy. (Cummings)"}, {"n": 11, "s": "In malignant (necrotising) otitis externa, the first cranial nerve usually affected is:", "o": ["Trigeminal (V)", "Facial (VII)", "Glossopharyngeal (IX)", "Vagus (X)", "Hypoglossal (XII)"], "k": "B", "x": "The facial nerve (at the stylomastoid foramen) is usually first; then IX, X, XI. (Cummings, Dhingra)"}, {"n": 12, "s": "Griesinger’s sign is:", "o": ["Edema and tenderness over the mastoid from thrombosis of the mastoid emissary vein (lateral sinus thrombosis)", "Facial palsy in acute otitis media", "Papilledema in otitic hydrocephalus", "Abducens palsy with petrous apicitis", "A neck abscess deep to the SCM"], "k": "A", "x": "Griesinger’s sign: mastoid edema from emissary vein thrombosis in lateral (sigmoid) sinus thrombosis. The “empty delta” sign on contrast CT is related. (Dhingra)"}, {"n": 13, "s": "Brown’s sign is:", "o": ["Pulsatile tinnitus", "A “rising sun” appearance behind the tympanic membrane", "Loss of the caroticojugular spine on CT", "Blanching of a retrotympanic mass with positive pressure on pneumatic otoscopy", "Blanching with carotid compression"], "k": "D", "x": "Brown’s sign: a glomus tumour blanches with positive pressure on pneumatic otoscopy. Aquino sign = blanching with carotid compression; Phelps sign = loss of the caroticojugular spine on CT. (Dhingra, Cummings)"}, {"n": 14, "s": "Sudden sensorineural hearing loss is defined as:", "o": ["10 dB loss in one frequency", "20 dB loss in one frequency", "30 dB loss developing over 1 week", "40 dB loss in the speech frequencies only", "A loss of ≥ 30 dB in ≥ 3 consecutive frequencies developing within 72 hours"], "k": "E", "x": "SSNHL: ≥ 30 dB in ≥ 3 consecutive frequencies within 72 hours. Treat with steroids (oral or intratympanic) and get an MRI. (Cummings, AAO-HNS)"}, {"n": 15, "s": "The audiometric notch typical of noise-induced hearing loss is at:", "o": ["500 Hz", "1 kHz", "4 kHz", "8 kHz", "250"], "k": "C", "x": "NIHL gives a notch at 4 kHz (3–6 kHz) with recovery at 8 kHz. Presbycusis slopes downward without recovery. (Dhingra, Oxford)"}, {"n": 16, "s": "The most anterior ethmoid cell, the key to the frontal recess, is the:", "o": ["Agger nasi cell", "Haller cell", "Onodi cell", "Bulla ethmoidalis", "Frontal bulla cell"], "k": "A", "x": "The agger nasi cell is the most anterior ethmoid cell; opening it exposes the frontal recess. (Cummings)"}, {"n": 17, "s": "A Haller cell is:", "o": ["A cell over the sphenoid sinus", "A cell above the frontal sinus", "An infraorbital ethmoid cell that can narrow the maxillary infundibulum", "A pneumatised middle turbinate", "A pneumatised septum"], "k": "C", "x": "A Haller cell (infraorbital ethmoid cell) lies along the orbital floor and can narrow the infundibulum, causing recurrent maxillary sinusitis. (Cummings, Dhingra)"}, {"n": 18, "s": "An Onodi (sphenoethmoidal) cell places which structure at risk during endoscopic sinus surgery?", "o": ["Lacrimal sac", "Anterior ethmoid artery", "Olfactory fossa", "Frontal recess", "Optic nerve"], "k": "E", "x": "An Onodi cell (posterior ethmoid cell lateral/ superior to the sphenoid) puts the optic nerve, and sometimes the ICA, at risk. (Cummings)"}, {"n": 19, "s": "Injury to the anterior ethmoid artery during sinus surgery classically causes:", "o": ["CSF leak", "Orbital hematoma (the artery retracts into the orbit)", "Epistaxis only", "Anosmia", "Diplopia from muscle injury"], "k": "B", "x": "A cut anterior ethmoid artery retracts into the orbit, causing an orbital hematoma; act urgently with lateral canthotomy if vision is threatened. (Cummings)"}, {"n": 20, "s": "The basal (ground) lamella that separates the anterior from the posterior ethmoid cells belongs to the:", "o": ["Uncinate process", "Bulla ethmoidalis", "Superior turbinate", "Middle turbinate", "Inferior turbinate"], "k": "D", "x": "The basal lamella of the middle turbinate divides the anterior from the posterior ethmoid. (Cummings)"}, {"n": 21, "s": "The maximum Lund–Mackay CT score (both sides) is:", "o": ["12", "18", "24", "30", "36"], "k": "C", "x": "Lund–Mackay: each sinus 0–2 and the OMC 0 or 2, giving 12 per side and 24 in total. (Cummings)"}, {"n": 22, "s": "Woodruff’s plexus is located at the:", "o": ["Posterior part of the inferior meatus (posterior lateral nasal wall)", "Anterior septum (Little’s area)", "Middle turbinate", "Superior turbinate", "Anterior septum near the columella"], "k": "A", "x": "Woodruff’s plexus lies at the posterior inferior meatus (posterior lateral wall); it is a source of posterior epistaxis in adults. Little’s area (Kiesselbach) is anterior septal. (Dhingra)"}, {"n": 23, "s": "Chandler group III orbital complication of sinusitis is:", "o": ["Preseptal cellulitis", "Orbital cellulitis", "Orbital abscess", "Cavernous sinus thrombosis", "Subperiosteal abscess"], "k": "E", "x": "Chandler: I preseptal cellulitis; II orbital cellulitis; III subperiosteal abscess; IV orbital abscess; V cavernous sinus thrombosis. (Cummings, Dhingra)"}, {"n": 24, "s": "Pott’s puffy tumor is:", "o": ["An osteoma of the maxilla", "Frontal bone osteomyelitis with a subperiosteal abscess", "A frontal mucocele", "An ethmoid osteoma", "An epidermoid cyst of the forehead"], "k": "B", "x": "Pott’s puffy tumour is frontal bone osteomyelitis with a subperiosteal abscess (forehead swelling); look for intracranial extension. (Cummings, Dhingra)"}, {"n": 25, "s": "Rhinitis medicamentosa is caused by:", "o": ["Oral antihistamines", "Oral steroid misuse", "Intranasal steroids", "Prolonged use of topical decongestants (more than a few days), causing rebound congestion", "Leukotriene antagonists"], "k": "D", "x": "Topical decongestant overuse gives rebound congestion. Stop the decongestant and use an intranasal steroid. ⚠️ The number of safe days quoted varies (≈ 3–7). (Dhingra, Oxford)"}, {"n": 26, "s": "The organism classically associated with atrophic rhinitis (ozaena), for which Young’s operation is described, is:", "o": ["Rhinosporidium seeberi", "Aspergillus", "Klebsiella ozaenae", "Streptococcus pneumoniae", "Pseudomonas aeruginosa"], "k": "C", "x": "Klebsiella ozaenae is associated with atrophic rhinitis (foul crusting, merciful anosmia). Young’s operation closes the nostrils for months. (Dhingra)"}, {"n": 27, "s": "The Holman–Miller sign is:", "o": ["Anterior bowing of the posterior wall of the maxillary sinus (juvenile nasopharyngeal angiofibroma)", "Expansion of the pterygoid canal only", "Widening of the sphenoid sinus", "Erosion of the cribriform plate", "Rim enhancement of an abscess"], "k": "A", "x": "The Holman–Miller (antral) sign is anterior bowing of the posterior maxillary wall, seen in JNA, which arises near the sphenopalatine foramen. (Dhingra, Cummings)"}, {"n": 28, "s": "The strongest risk factor for Reinke’s edema is:", "o": ["Gastroesophageal reflux", "Hypothyroidism alone", "Voice abuse", "Alcohol", "Smoking"], "k": "E", "x": "Smoking is the strongest association with Reinke’s edema (polypoid degeneration of Reinke’s space). Treat with smoking cessation and microflap evacuation. (Cummings)"}, {"n": 29, "s": "Vocal fold nodules typically occur at the:", "o": ["Posterior third of the vocal folds", "Junction of the anterior and middle thirds (bilaterally)", "Vocal process of the arytenoid", "Anterior commissure", "Ventricle"], "k": "B", "x": "Nodules occur bilaterally at the junction of the anterior and middle thirds (the point of maximal vibratory impact). Voice therapy comes first. (Dhingra, Cummings)"}, {"n": 30, "s": "A glottic carcinoma with vocal fold fixation (AJCC 8th) is:", "o": ["T1a", "T1b", "T2", "T3", "T4a"], "k": "D", "x": "AJCC 8th glottic: T1 mobile; T2 impaired mobility or supra/ subglottic spread; T3 fixed fold, paraglottic space, or inner cortex of thyroid cartilage. (AJCC 8th, Cummings)"}, {"n": 31, "s": "Poor tracheoesophageal speech after laryngectomy due to pharyngoesophageal spasm is treated by:", "o": ["Botulinum toxin injection into the constrictors (or myotomy)", "A larger voice prosthesis", "Electrolarynx only", "Antibiotics", "Closing the fistula"], "k": "A", "x": "Pharyngoesophageal spasm is treated with botulinum toxin to the constrictors (or pharyngeal myotomy/ neurectomy). (Cummings)"}, {"n": 32, "s": "Ortner’s (cardiovocal) syndrome is:", "o": ["Left vocal cord palsy from bronchogenic carcinoma", "Vocal cord palsy after thyroidectomy", "Left recurrent laryngeal nerve palsy from cardiac enlargement (mitral stenosis/ enlarged left atrium or pulmonary artery)", "Right recurrent laryngeal nerve palsy from a subclavian aneurysm", "Vagal neuritis"], "k": "C", "x": "Ortner’s syndrome is left RLN palsy from an enlarged left atrium/ pulmonary artery (mitral stenosis). (Dhingra)"}, {"n": 33, "s": "An Isshiki type IV thyroplasty:", "o": ["Medialises the vocal fold", "Lateralises the vocal fold", "Shortens the vocal fold to lower pitch", "Rotates the arytenoid", "Lengthens the vocal fold (cricothyroid approximation) to raise pitch"], "k": "E", "x": "Isshiki: I medialisation, II lateralisation, III shortening (lowers pitch), IV lengthening/ cricothyroid approximation (raises pitch). (Cummings)"}, {"n": 34, "s": "A Reflux Symptom Index (RSI) suggestive of laryngopharyngeal reflux is a score above:", "o": ["5", "13", "20", "30", "7"], "k": "B", "x": "RSI > 13 suggests LPR. The Reflux Finding Score (RFS) is abnormal above 7. (Cummings, Belafsky)"}, {"n": 35, "s": "A laryngocele arises from the:", "o": ["Pyriform sinus", "Vallecula", "Pre-epiglottic space", "Saccule (appendix of the laryngeal ventricle); the external type pierces the thyrohyoid membrane", "Subglottis"], "k": "D", "x": "A laryngocele is a dilated saccule. Internal laryngoceles stay inside the larynx; external ones pierce the thyrohyoid membrane. Exclude saccular carcinoma. (Dhingra, Cummings)"}, {"n": 36, "s": "The immediate management of a newborn with bilateral choanal atresia is:", "o": ["Immediate tracheostomy", "Intubation in every case", "An oral airway (McGovern nipple)", "Observation", "Nasal decongestant drops"], "k": "C", "x": "Neonates are obligate nasal breathers. Secure an oral airway (McGovern nipple) or intubate, then repair (transnasal endoscopic). (Cummings, Dhingra)"}, {"n": 37, "s": "A “steeple sign” on an AP neck radiograph is typical of:", "o": ["Croup (laryngotracheobronchitis, parainfluenza virus)", "Epiglottitis", "Bacterial tracheitis", "Retropharyngeal abscess", "Foreign body"], "k": "A", "x": "The steeple sign means subglottic narrowing in croup (parainfluenza). Epiglottitis gives a thumb sign. (Dhingra, Oxford)"}, {"n": 38, "s": "Congenital subglottic stenosis in a full-term neonate is defined as a subglottic diameter of less than:", "o": ["7 mm", "6 mm", "5.5 mm", "2 mm", "4 mm"], "k": "E", "x": "Less than 4 mm in a term neonate (less than about 3–3.5 mm if premature). ⚠️ Check your copy for the premature cut-off. (Cummings)"}, {"n": 39, "s": "The “1-3-6” rule of newborn hearing screening means:", "o": ["Screen by 1 week, diagnose by 3 weeks, intervene by 6 weeks", "Screen at 1 year, diagnose at 3 years, intervene at 6 years", "Screen by 1 month, intervene by 3 months, diagnose by 6 months", "Screen by 1 month, diagnose by 3 months, intervene by 6 months", "Screen at 3 months only"], "k": "D", "x": "JCIH: screen by 1 month, diagnose by 3 months, intervene by 6 months. (Cummings)"}, {"n": 40, "s": "Retropharyngeal abscess is most common in children under 5 years because:", "o": ["The adenoids are thin", "The retropharyngeal lymph nodes involute after about age 5", "The airway is smaller", "Children are immunodeficient", "Dental infections are more frequent"], "k": "B", "x": "The retropharyngeal (Rouvière) nodes involute after about age 5, so abscesses in older children and adults usually follow trauma or foreign body. (Cummings, Dhingra)"}, {"n": 41, "s": "Secondary post-tonsillectomy hemorrhage typically occurs at:", "o": ["Within 24 hours", "24–48 hours", "5–10 days (separation of the slough/ infection)", "3 weeks", "1 hour"], "k": "C", "x": "Secondary hemorrhage at 5–10 days from slough separation or infection. Primary bleeding occurs within 24 h; reactionary bleeding in the first hours. (Dhingra)"}, {"n": 42, "s": "Grisel’s syndrome is:", "o": ["Non-traumatic atlantoaxial subluxation after pharyngeal infection or adenotonsillectomy", "Retropharyngeal abscess", "Vertebral osteomyelitis", "Torticollis from an SCM tumour", "Klippel–Feil syndrome"], "k": "A", "x": "Grisel’s syndrome: inflammatory ligament laxity → atlantoaxial subluxation (torticollis after a sore throat or adenotonsillectomy). (Cummings)"}, {"n": 43, "s": "Tympanostomy tubes are indicated for otitis media with effusion when there is:", "o": ["Any effusion", "Effusion for 2 weeks", "Effusion for 1 month", "Unilateral asymptomatic effusion for 6 weeks", "Bilateral effusion for ≥ 3 months with hearing difficulty"], "k": "E", "x": "AAO-HNS: tubes for bilateral OME ≥ 3 months with hearing difficulty (or at-risk children, structural damage). (Cummings)"}, {"n": 44, "s": "The Minor starch–iodine test is used to diagnose:", "o": ["Sialolithiasis", "Sjögren’s syndrome", "Parotid fistula", "Frey’s syndrome (gustatory sweating)", "First-bite syndrome"], "k": "D", "x": "The Minor test confirms Frey’s syndrome (aberrant regeneration of auriculotemporal parasympathetic fibres to sweat glands after parotidectomy). Treat with botulinum toxin. (Cummings, Dhingra)"}, {"n": 45, "s": "Calculi are most common in the submandibular gland because its saliva is:", "o": ["Serous and acidic", "More mucinous and alkaline with higher calcium, and its duct runs uphill and is long", "Drained by a short duct", "Acidic", "Produced at a lower flow"], "k": "B", "x": "Submandibular saliva is mucinous, alkaline and calcium-rich, and Wharton’s duct is long and runs uphill, so 80–90% of stones occur here. (Dhingra)"}, {"n": 46, "s": "Recurrence of pleomorphic adenoma is mainly due to:", "o": ["Enucleation or capsular rupture (pseudopod extensions)", "Malignant change", "Radiotherapy", "Coexisting Warthin tumour", "Superficial parotidectomy"], "k": "A", "x": "Enucleation or spillage leaves pseudopods and causes multinodular recurrence. Superficial parotidectomy with a margin is standard. (Cummings, Dhingra)"}, {"n": 47, "s": "Injury to the external branch of the superior laryngeal nerve causes:", "o": ["Breathiness", "Aspiration", "Inability to reach high pitch and voice fatigue (cricothyroid paralysis)", "Stridor", "Aphonia"], "k": "C", "x": "The EBSLN supplies the cricothyroid muscle; injury causes loss of high pitch, a weak voice and voice fatigue (singers). (Cummings)"}, {"n": 48, "s": "The “Lyre sign” (splaying of the internal and external carotid arteries) is typical of:", "o": ["Glomus jugulare", "Vagal schwannoma", "Branchial cyst", "Laryngocele", "Carotid body tumour"], "k": "E", "x": "A carotid body tumour splays the ICA and ECA (Lyre sign). It is mobile side to side but not vertically (Fontaine sign). (Cummings, Dhingra)"}, {"n": 49, "s": "Plummer–Vinson syndrome predisposes to:", "o": ["Pyriform sinus carcinoma", "Posterior pharyngeal wall carcinoma", "Adenocarcinoma of the cervical esophagus", "Postcricoid carcinoma", "Laryngeal carcinoma"], "k": "D", "x": "Plummer–Vinson (iron deficiency, webs, middle-aged women) predisposes to postcricoid carcinoma. (Dhingra)"}, {"n": 50, "s": "A patient develops an expanding neck hematoma with stridor after thyroidectomy. The first step is:", "o": ["CT scan of the neck", "Open the wound at the bedside immediately to release the clot, then return to the OR", "Intravenous steroids", "Intubation after imaging", "Observation"], "k": "B", "x": "An expanding hematoma compressing the airway needs immediate bedside wound opening, then return to the OR. Do not delay for imaging. (Cummings)"}]}];
const CH=[{"t": "Otology", "s": [0, 1, 2, 3, 4, 5, 6]}, {"t": "Rhinology", "s": [7, 8, 9, 10, 11, 12, 13, 14]}, {"t": "Laryngology", "s": [15, 16, 17, 18, 19, 20]}, {"t": "Paediatric ENT", "s": [21, 22, 23, 24, 25]}, {"t": "Head & Neck", "s": [26, 27, 28, 29, 30, 31, 32, 33]}, {"t": "Plastic", "s": [34, 35, 36]}, {"t": "Collection", "s": [37, 38]}];
const NOTES={"0": "<p><b>Dr. Abdalhadi Seyam | Built from Day 1–7 errors | Read daily until exam</b></p><h2>1. Cochlear potentials — origin</h2><ul><li><b>Endocochlear potential (+80 mV)</b> → stria vascularis</li><li><b>Summating potential (SP)</b> → hair cell receptor potentials</li><li><b>Cochlear microphonic (CM)</b> → mainly outer hair cells (present in ANSD)</li><li><b>Action potential (AP)</b> → auditory nerve = ABR wave I</li><li><b>OAEs</b> → outer hair cells (not inner)</li><li><b>Ménière&#x27;s:</b> SP/AP &gt;0.4</li></ul><h2>2. ABR</h2><ul><li>Generators: I distal VIII · II proximal VIII · III cochlear nucleus · IV superior olive · V lateral lemniscus / inferior colliculus</li><li>Latencies at 80 dB nHL: <b>I ~1.5 · III ~3.7 · V ~5.6 ms</b></li><li>Interpeaks: I–III ~2.0 · III–V ~2.0 · I–V ~4.0 ms (abnormal &gt;4.4)</li><li>Interaural wave V difference: <b>&gt;0.2 ms</b> = retrocochlear</li><li>Threshold estimation: <b>wave V</b></li><li>Frequency-specific objective thresholds, severe–profound: <b>ASSR</b></li></ul><h2>3. OAEs</h2><ul><li>TEOAE absent &gt;<b>30 dB HL</b>; DPOAE persists to ~<b>40–50 dB HL</b></li><li>DPOAE measured at <b>2f1−f2</b>, f2/f1 ≈ 1.2</li></ul><h2>4. Acoustic reflex</h2><ul><li>Arc: VIII → cochlear nucleus → <b>superior olivary complex</b> → VII nucleus (bilateral) → stapedius</li><li>Normal threshold 70–100 dB SL</li><li><b>Metz:</b> reflex &lt;60 dB SL = recruitment = cochlear</li><li>Reflex at/below admitted threshold = <b>non-organic</b></li><li><b>Decay</b> &gt;50% in <b>10 s</b> = retrocochlear</li></ul><h2>5. Tuning forks &amp; masking</h2><ul><li>Rinne negative: 256 Hz ≥15 · 512 Hz ≥30 · 1024 Hz ≥45 dB ABG</li><li>Interaural attenuation: AC ~40 dB (insert ≥55) · BC 0–10 dB</li><li>Masking dilemma: <b>bilateral large conductive loss</b></li><li>SRT–PTA agreement: ±10 dB</li></ul><h2>6. Vestibular tests</h2><ul><li><b>Calorics:</b> ~0.003 Hz (very low) — best for <b>unilateral</b> loss; CP &gt;20–25%</li><li><b>Rotary chair:</b> 0.01–1 Hz — gold standard for <b>bilateral</b> loss</li><li><b>vHIT:</b> ~5 Hz (high)</li><li><b>cVEMP:</b> saccule → inferior vestibular nerve → SCM</li><li><b>oVEMP:</b> utricle → superior vestibular nerve → contralateral inferior oblique</li><li>SCD: low VEMP thresholds, high oVEMP amplitude</li><li>HINTS central: normal head impulse · direction-changing nystagmus · skew present</li></ul><h2>7. Devices</h2><ul><li><b>BAHA:</b> implanted ≥<b>5 years</b> (softband younger); BC ≤<b>45 dB</b> (power ≤55–65); SSD → good ear AC ≤20 dB</li><li><b>Vibrant Soundbridge:</b> FMT on <b>long process of incus</b>; round window for CHL/mixed</li><li><b>CI:</b> scala tympani; FDA ≥<b>9 months</b>; pneumococcal vaccine; Michel aplasia / absent cochlear nerve = contraindication → ABI</li><li><b>ABI:</b> cochlear nucleus, <b>lateral recess of 4th ventricle</b> (foramen of Luschka); NF2</li><li><b>Auditory midbrain implant:</b> inferior colliculus (experimental)</li><li><b>CROS:</b> unilateral profound + normal other ear; <b>BiCROS:</b> better ear also impaired</li><li><b>Occlusion effect:</b> ↓ by bigger vent or deep insertion</li><li><b>Lybarger:</b> gain = <b>½ the loss</b></li></ul><h2>8. Facial nerve numbers &amp; grading</h2><ul><li>ENoG: &gt;90% within 14 days → decompression</li><li>NET: difference &gt;<b>3.5 mA</b> = poor</li><li>Sunderland: 1 myelin · 2 axon · <b>3 endoneurium</b> · 4 perineurium · 5 epineurium</li><li>HB IV: first grade with incomplete eye closure</li><li>Hypoglossal–facial transfer: within ~2 years</li></ul><h2>9. Anatomy repeat errors</h2><ul><li>Sinus tympani: <b>ponticulus above, subiculum below</b></li><li>Chorda tympani → <b>submandibular ganglion</b> (geniculate has no synapse)</li><li><b>Foramen of Huschke:</b> tympanic plate defect → parotid/TMJ</li><li><b>Hyrtl&#x27;s fissure:</b> tympanomeningeal → CSF leak/meningitis</li><li><b>Jugular foramen:</b> pars nervosa = IX + inferior petrosal sinus; pars vascularis = X, XI, IJV</li></ul><h2>10. Tuning forks (Day 4 errors)</h2><ul><li><b>Rinne:</b> negative = BC &gt; AC (CHL ≥15/30/45 dB at 256/512/1024 Hz) — false-negative in dead ear</li><li><b>Weber:</b> CHL → affected ear; SNHL → better ear</li><li><b>ABC / Schwabach:</b> compares patient BC with examiner — <b>prolonged in CHL</b>, shortened in SNHL</li><li><b>Bing:</b> occlusion ↑ BC loudness = positive (normal, SNHL); <b>no change = negative = CHL</b></li><li><b>Gellé:</b> canal pressure ↓ BC loudness = positive (mobile chain); <b>no change = negative = otosclerosis</b></li><li><b>Stenger:</b> unilateral non-organic loss</li></ul><h2>11. Neuro-otology anatomy (Day 4 errors)</h2><ul><li><b>Medial olivocochlear → OHC</b>; lateral olivocochlear → IHC afferent dendrites</li><li>Afferents: type I 95% → IHC; type II 5% → OHC</li><li><b>Nervus intermedius:</b> taste + secretomotor (lacrimal, nasal, SMG, SLG) + canal sensation — <b>no motor fibres</b> (stapedius = motor root)</li><li>Facial segments: <b>mastoid ~13 (longest)</b> · tympanic ~11 · meatal ~8–10 · labyrinthine ~3–4 (shortest, narrowest)</li><li><b>Utricle ↔ saccule = utriculosaccular/endolymphatic duct</b>; ductus reuniens = saccule ↔ cochlear duct</li><li><b>Cogan:</b> interstitial keratitis (atypical: uveitis/scleritis)</li></ul><h2>12. Past-paper &quot;NOT / FALSE / distractor&quot; traps — guaranteed marks</h2><ul><li>ENT-A Q94 (tubes) — FALSE = benefit persists after extrusion</li><li>ENT-B Q80 (sigmoid injury) — NOT indicated = immediate exploration</li><li>ENT-B Q46 (elderly, noise) — high-frequency loss, not &quot;hair cell hypersensitivity&quot;</li><li>ENT-A Q46 (noise mechanisms) — NOT proposed = chronic bleeding</li><li>ENT-B Q3 (utricle–saccule) — endolymphatic duct, not ductus reuniens</li><li><b>Method:</b> in NOT/FALSE stems, mark each option T/F before choosing; &quot;All of these are indicated&quot; is usually a distractor</li></ul><h2>13. Day 6 gap-closure errors</h2><ul><li><b>Cisplatin otoprotection (children):</b> sodium thiosulfate (FDA 2022)</li><li><b>Vestibular paroxysmia:</b> seconds-long attacks, neurovascular compression → carbamazepine/oxcarbazepine</li><li><b>Bilateral vestibulopathy:</b> commonest identified cause = aminoglycosides</li><li><b>EAC SCC:</b> even T1 → lateral temporal bone resection (sleeve = recurrence); T4 → subtotal TBR + RT</li><li><b>Middle ear malignancy:</b> child = embryonal rhabdomyosarcoma; adult = SCC — biopsy every paediatric aural polyp</li><li><b>Ceruminous gland malignancy:</b> adenoid cystic carcinoma (SCC is squamous, not glandular)</li><li><b>Recurrent facial palsy + dense bones:</b> osteopetrosis (MR syndrome = oedema + fissured tongue, no bone change)</li><li><b>Free gracilis single stage:</b> masseteric nerve; cross-face = spontaneous smile, two stages</li><li><b>Masked mastoiditis:</b> intact near-normal TM, mild persistent pain after antibiotics → CT → mastoidectomy</li></ul><h2>14. Debated past-paper keys — exam strategy</h2><ul><li>ENT-A Q55 falls: <b>bedroom</b> (if absent → bathroom)</li><li>ENT-A Q56 early Bell&#x27;s: <b>stapedius reflex</b></li><li>ENT-A Q64 CI except: <b>&quot;no benefit&quot;</b> (absolute word)</li><li>ENT-A Q95 elderly: <b>BPPV</b> (specific disorder beats vague symptom)</li><li>ENT-B Q76 clear tube otorrhoea: <b>spontaneous CSF leak</b></li><li>ENT-B Q90 recurrent AOM: <b>hereditary</b></li><li><b>Stem-qualifier rule:</b> &quot;children&quot;, &quot;ceruminous&quot;, &quot;identified cause&quot;, &quot;single-stage&quot; change the answer — underline them</li></ul><h2>15. Auditory &amp; vestibular physiology (Day 7 errors)</h2><ul><li><b>Basilar membrane:</b> base = narrow + stiff (high freq); apex = wide + floppy (low). Bony cochlea is the opposite (wide at base)</li><li><b>EAC resonance ~3 kHz</b> (concha ~5 kHz) → noise notch at 4 kHz</li><li><b>Pitch:</b> low = temporal/phase-locking; high = place</li><li><b>Pathway &quot;E-COLI-MA&quot;:</b> VIII → Cochlear nucleus → superior Olive → Lateral lemniscus → Inferior colliculus (midbrain) → <b>Medial geniculate (thalamus)</b> → Auditory cortex</li><li><b>First binaural site:</b> superior olivary complex</li><li><b>Primary auditory cortex:</b> <b>Heschl&#x27;s gyrus</b> (BA 41/42); Wernicke = association cortex</li><li><b>Unilateral cortical lesion:</b> normal audiogram + normal ABR; abnormal central tests only</li><li><b>Localisation:</b> low = ITD (MSO); high = <b>ILD (LSO)</b> — &quot;Low-Time, High-Level&quot;</li><li><b>Maculae:</b> utricle hair cells <b>toward</b> striola; saccule away (&quot;U-T&quot;)</li></ul><h2>16. Pinna &amp; otoplasty</h2><ul><li><b>Mustardé:</b> conchoscaphal sutures → creates antihelix</li><li><b>Furnas:</b> <b>conchomastoid</b> sutures → concha setback</li><li><b>Stenström/Chongchet:</b> anterior scoring</li><li><b>Cryptotia:</b> upper helix buried under scalp · cup/constricted ear: helix folded over · Stahl&#x27;s: third crus</li></ul><h2>17. Repeat errors — must fix</h2><ul><li><b>Ganglia:</b> chorda → <b>submandibular</b> · GSPN → pterygopalatine · lesser petrosal → <b>otic → parotid</b> (missed twice)</li><li><b>SRT = 50% spondees</b>; discrimination = PB words</li><li><b>Masking true statement:</b> mask BC when asymmetric; overmasking = masker crossing to test ear</li><li><b>Chloroma = AML</b> (myeloid sarcoma); plasmacytoma = myeloma</li></ul>", "1": "<p><b>Dr. Abdalhadi Seyam | Built from Rhinology Days 1–8 errors | Read daily until exam</b></p><h2>1. Physiology &amp; allergy</h2><ul><li><b>Olfactory neurons:</b> bipolar, regenerate from basal cells every 30–60 days</li><li><b>Saccharin test:</b> abnormal &gt;30 min (flow ~6 mm/min)</li><li><b>Early-phase mediator:</b> histamine (preformed); IL-5 = late phase (eosinophils)</li><li><b>Nasal smear:</b> mast cells + eosinophils = allergic · eosinophils + negative tests = NARES · neutrophils = infection · bland = vasomotor</li></ul><h2>2. Rhinosinusitis</h2><ul><li><b>Viral URTI → ABRS:</b> 0.5–2% adults (5–10% children)</li><li><b>Bi
