pnoea of prematurity is treated with:", "o": ["Caffeine citrate", "Adenotonsillectomy", "Tracheostomy", "Montelukast", "Propranolol"], "k": "A", "x": "Caffeine citrate (respiratory stimulant) ± CPAP; resolves by ~37–43 weeks postmenstrual age"}, {"n": 9, "s": "Central sleep apnoea in a child warrants:", "o": ["Tonsillectomy", "Nasal steroids", "Oral appliance", "MRI brain", "Septoplasty"], "k": "D", "x": "Central apnoea in a child → MRI brain/brainstem (Chiari malformation), neurological/metabolic evaluation"}, {"n": 10, "s": "The best preoperative bleeding screen before routine tonsillectomy is:", "o": ["Routine coagulation screen tests", "Platelet count only", "Structured bleeding history", "Bleeding time", "Factor assays"], "k": "C", "x": "Structured bleeding history (personal/family) is the best screen; routine coagulation tests not recommended in low-risk children"}, {"n": 11, "s": "Perioperative treatment for type 1 von Willebrand disease is:", "o": ["Oral vitamin K", "Platelets", "FFP", "Aspirin", "Desmopressin"], "k": "E", "x": "Desmopressin (DDAVP) releases vWF/FVIII (type 1); tranexamic acid adjunct; vWF concentrate for severe/type 3"}, {"n": 12, "s": "AAP criteria for bacterial sinusitis include nasal symptoms persisting without improvement beyond:", "o": ["10 days", "3 days", "5 days", "6 weeks", "12 weeks"], "k": "A", "x": "AAP: persistent symptoms >10 days without improvement, worsening course (double sickening), or severe onset (fever ≥39 °C + purulent discharge ≥3 days)"}, {"n": 13, "s": "First-line antibiotic for paediatric acute bacterial sinusitis is:", "o": ["Ciprofloxacin", "Amoxicillin", "Doxycycline", "Clindamycin", "Azithromycin"], "k": "B", "x": "Amoxicillin (± clavulanate if risk factors) — high dose 80–90 mg/kg/day"}, {"n": 14, "s": "A parameningeal head and neck rhabdomyosarcoma site is the:", "o": ["Orbit", "Lip", "Parotid gland", "Middle ear", "Larynx"], "k": "D", "x": "Parameningeal: middle ear/mastoid, nasopharynx, nasal cavity/sinuses, PPF/ITF → intracranial risk, worse prognosis, need CSF/MRI and RT"}, {"n": 15, "s": "The rhabdomyosarcoma subtype with the worst prognosis is:", "o": ["Embryonal", "Botryoid", "Alveolar", "Spindle cell", "Pleomorphic only"], "k": "C", "x": "Alveolar (PAX3/7-FOXO1 fusion) — worse; embryonal (including botryoid) — better"}, {"n": 16, "s": "The head and neck rhabdomyosarcoma site with the best prognosis is the:", "o": ["Orbit", "Nasopharynx", "Middle ear", "Infratemporal fossa", "Sinuses"], "k": "A", "x": "Orbit — best prognosis (~90%+ survival)"}, {"n": 17, "s": "Before paediatric cochlear implantation, MRI is essential to confirm the:", "o": ["Mastoid size", "Ossicles", "Facial recess", "Round window niche", "Cochlear nerve"], "k": "E", "x": "MRI (high-resolution T2) confirms cochlear nerve presence; CT for bony anatomy (cochlear aperture, malformations)"}, {"n": 18, "s": "Interstitial keratitis, notched incisors and SNHL suggest:", "o": ["Usher", "Congenital syphilis", "Alport", "Cogan syndrome type", "Pendred"], "k": "B", "x": "Hutchinson triad of congenital syphilis: interstitial keratitis, notched (Hutchinson) incisors, SNHL; also Hennebert sign, saddle nose"}, {"n": 19, "s": "Parents caring for a child's tracheostomy should always carry a spare tube:", "o": ["Two sizes larger", "Same size only", "One size smaller", "No spare", "Cuffed adult"], "k": "C", "x": "Spare tube same size + one size smaller (for difficult reinsertion), scissors, suction, ties — parent training before discharge"}, {"n": 20, "s": "Mild laryngomalacia with normal feeding and growth is managed by:", "o": ["Early supraglottoplasty surgery", "Tracheostomy", "Steroids", "Observation and antireflux", "Intubation"], "k": "D", "x": "Mild disease: reassurance, observation, positioning, antireflux treatment; surgery only for severe features"}, {"n": 21, "s": "Before starting propranolol for infantile haemangioma, check:", "o": ["Heart rate and BP", "Liver function", "Renal tract ultrasound", "Hearing", "Bone age"], "k": "A", "x": "Baseline heart rate, BP (± ECG if bradycardia/family history), feeding pattern (hypoglycaemia risk); echo/MRI if PHACE"}, {"n": 22, "s": "A child with severe croup and hypoxia needs:", "o": ["Antibiotics", "Oral steroid alone at home", "Adrenaline and admission", "Heliox only", "Chest X-ray first"], "k": "C", "x": "Nebulised adrenaline + dexamethasone, oxygen, admission/HDU; intubation if failing (smaller tube)"}, {"n": 23, "s": "Bilateral choanal atresia is now usually repaired by:", "o": ["Transpalatal approach", "Sublabial approach", "Lateral rhinotomy", "Midfacial degloving", "Endoscopic transnasal"], "k": "E", "x": "Endoscopic transnasal repair (drill atretic plate, posterior septectomy); stents controversial; restenosis common"}, {"n": 24, "s": "After removal of an oesophageal button battery, monitor for:", "o": ["Otitis media", "Delayed fistula or bleeding", "Hearing loss", "Rash", "Hypoglycaemia and late seizures"], "k": "B", "x": "Delayed tracheo-/aortoesophageal fistula, stricture, perforation (up to weeks) → admit, imaging, follow-up"}, {"n": 25, "s": "Recurrent pneumonia in the same lobe in a toddler suggests:", "o": ["Asthma", "Croup", "Cystic fibrosis", "Retained foreign body", "Primary immunodeficiency"], "k": "D", "x": "Retained FB (often missed choking episode) → bronchoscopy"}, {"n": 26, "s": "A lingual thyroid that is the only functioning thyroid tissue is managed first by:", "o": ["Excision", "Radioiodine", "Transoral laser ablation", "Biopsy", "Thyroxine suppression"], "k": "E", "x": "Thyroxine suppression to shrink it; excision only for obstruction/bleeding/malignancy (may need autotransplant)"}, {"n": 27, "s": "An acutely infected second branchial cyst is managed by:", "o": ["Antibiotics, later excision", "Immediate excision", "Repeated incision and drainage", "Radiotherapy", "Sclerotherapy"], "k": "A", "x": "Treat infection (antibiotics ± aspiration), then complete excision when quiescent"}, {"n": 28, "s": "NTM lymphadenitis in the parotid region with the facial nerve at risk can be managed by:", "o": ["Total radical parotidectomy", "Radiotherapy", "Curettage or observation", "Incision and drainage", "Steroids"], "k": "C", "x": "Near facial nerve: curettage, observation (resolves over months) or clarithromycin; avoid radical surgery"}, {"n": 29, "s": "Bilateral suprahyoid microcystic lymphatic malformation is treated first with:", "o": ["Surgery alone", "Sirolimus", "Radiotherapy", "Steroids", "Propranolol"], "k": "B", "x": "Microcystic/extensive LM: sirolimus (mTOR inhibitor); sclerotherapy less effective for microcystic"}, {"n": 30, "s": "A periocular infantile haemangioma obstructing the visual axis requires:", "o": ["Observation", "Laser at 2 years", "Surgery at 5 years", "Urgent propranolol", "Patching only"], "k": "D", "x": "Periocular haemangioma → amblyopia risk → urgent propranolol + ophthalmology"}, {"n": 31, "s": "In Pierre Robin sequence failing prone positioning, the next step is:", "o": ["Tracheostomy", "Glossectomy", "Nasopharyngeal airway", "Cleft repair", "Intubation for months"], "k": "C", "x": "Nasopharyngeal airway → if failing: mandibular distraction or tongue-lip adhesion → tracheostomy"}, {"n": 32, "s": "When grommets are reinserted in a child over 4 years, consider adding:", "o": ["Tonsillectomy", "Septoplasty", "Myringoplasty", "Mastoidectomy", "Adenoidectomy"], "k": "E", "x": "Adenoidectomy with second set of tubes (≥4 years) reduces further surgery"}, {"n": 33, "s": "Potsic stage I congenital cholesteatoma is:", "o": ["Single quadrant, no ossicles", "Multiple quadrants", "Ossicular involvement", "Mastoid extension with erosion", "Bilateral"], "k": "A", "x": "Potsic: I single quadrant, no ossicular/mastoid · II multiple quadrants · III ossicles · IV mastoid"}, {"n": 34, "s": "During atresiaplasty, the facial nerve is at risk because it is often:", "o": ["Absent", "Medial", "Dehiscent in the tympanum", "Displaced anterolaterally", "Duplicated"], "k": "D", "x": "Facial nerve in atresia often displaced anterolaterally (crosses the middle ear more anteriorly, sharper genu) → monitoring essential"}, {"n": 35, "s": "A nasal dermoid sinus extending through the foramen caecum to the dura is excised by:", "o": ["Simple excision", "Combined craniofacial", "Endoscopic transnasal only", "Laser", "Observation"], "k": "B", "x": "Intracranial extension → combined craniofacial (or endoscopic-assisted) excision with neurosurgery"}, {"n": 36, "s": "JNA recurrence most often arises from residual tumour in the:", "o": ["Basisphenoid", "Septum", "Inferior turbinate", "Maxillary sinus", "Frontal sinus"], "k": "A", "x": "Basisphenoid/vidian canal and pterygoid base — drill to prevent recurrence"}, {"n": 37, "s": "A serious complication of untreated retropharyngeal abscess is:", "o": ["Acute otitis media", "Sinusitis", "Mediastinitis", "Epistaxis", "Hearing loss"], "k": "C", "x": "Descending mediastinitis, airway obstruction, carotid erosion, Lemierre's, aspiration"}, {"n": 38, "s": "The most serious complication of Kawasaki disease is:", "o": ["Sensorineural hearing loss", "Arthritis", "Rash", "Conjunctivitis", "Coronary aneurysm"], "k": "E", "x": "Coronary artery aneurysm (~20–25% untreated → ~4% with IVIG)"}, {"n": 39, "s": "A child's neck node warrants biopsy if it exceeds 2 cm and persists despite antibiotics beyond:", "o": ["3 days", "1 week", "10 days", "6 weeks", "1 year"], "k": "D", "x": ">2 cm, persisting >4–6 weeks despite antibiotics, supraclavicular, hard/fixed, B symptoms → excision biopsy"}, {"n": 40, "s": "Neonatal stridor with a hoarse or weak cry localises to the:", "o": ["Nose", "Glottis", "Trachea", "Bronchi", "Supraglottis"], "k": "B", "x": "Hoarse/weak cry = glottic (paralysis, web, papilloma); normal cry with stridor = supraglottic/subglottic"}, {"n": 41, "s": "A type I laryngeal cleft is diagnosed by:", "o": ["Chest X-ray", "Barium swallow study alone", "CT", "Flexible laryngoscopy", "Rigid endoscopic palpation"], "k": "E", "x": "Rigid MLB with interarytenoid palpation (probe) — flexible endoscopy and barium miss shallow clefts"}, {"n": 42, "s": "When polysomnography is unavailable, paediatric OSA can be screened with:", "o": ["Overnight oximetry", "Tonsil size", "Lateral X-ray", "Parent smartphone video only", "Epworth score"], "k": "A", "x": "Overnight oximetry (McGill score) — positive is useful; negative doesn't exclude OSA"}, {"n": 43, "s": "First-line investigations for congenital SNHL include:", "o": ["CT for all", "Karyotype and microarray", "Lumbar puncture", "GJB2 testing and CMV", "Thyroid scan"], "k": "D", "x": "Connexin 26 (GJB2) testing, CMV, then imaging tailored (MRI/CT), ECG (JLNS), ophthalmology, renal US if indicated"}, {"n": 44, "s": "A non-surgical option for OME in children is:", "o": ["Antibiotics", "Antihistamines", "Autoinflation", "Steroids", "Decongestants"], "k": "C", "x": "Autoinflation (nasal balloon) — modest benefit in OME; cheap, safe"}, {"n": 45, "s": "Which is recommended against for OME in children?", "o": ["Active monitoring", "Systemic steroids", "Hearing assessment", "Grommets", "Hearing aids"], "k": "B", "x": "Recommended against: systemic/topical steroids, antibiotics, antihistamines, decongestants (AAO-HNS 2016)"}, {"n": 46, "s": "A young child with a peritonsillar abscess who cannot cooperate is best managed by:", "o": ["Clinic needle aspiration", "Oral antibiotics", "Observation", "Steroids alone", "Drainage under GA"], "k": "E", "x": "Uncooperative young child → drainage (± quinsy tonsillectomy) under GA"}, {"n": 47, "s": "Compared with croup, epiglottitis is distinguished by:", "o": ["Barking seal-like cough", "Hoarse voice", "Drooling, no cough", "Gradual onset", "Low fever"], "k": "C", "x": "Epiglottitis: drooling, toxic, tripod, muffled voice, no barking cough; croup: barking cough, hoarse, gradual"}, {"n": 48, "s": "An infected preauricular sinus abscess is treated by:", "o": ["Drainage, later excision", "Immediate excision", "Antibiotics only forever", "Radiotherapy", "Cautery"], "k": "A", "x": "Drain abscess, antibiotics, then complete excision (with cartilage cuff/supra-auricular approach) when quiescent"}, {"n": 49, "s": "Sinus CT in children with suspected sinusitis is indicated for:", "o": ["All cases", "Fever alone", "Purulent rhinorrhoea for 2 weeks", "Complications or surgery", "Headache"], "k": "D", "x": "CT only for suspected complications (orbital/intracranial) or surgical planning; not for uncomplicated ARS"}, {"n": 50, "s": "The commonest cause of acute facial palsy in children is:", "o": ["Trauma", "Bell's palsy", "Tumour", "Lyme disease", "Möbius"], "k": "B", "x": "Bell's palsy most common (good prognosis in children); always exclude AOM, Lyme, trauma, tumour, Ramsay Hunt"}]}, {"c": 4, "t": "Session 1", "d": "Oral Cavity & Oropharynx", "q": [{"n": 1, "s": "AJCC 8th oral cavity T1 is:", "o": ["≤2 cm, DOI ≤10 mm", "≤2 cm, DOI ≤5 mm", "≤4 cm, DOI ≤5 mm", "≤2 cm, any DOI", "Any size, DOI ≤3 mm"], "k": "B", "x": "Oral T1: ≤2 cm and DOI ≤5 mm"}, {"n": 2, "s": "A 1.8 cm tongue tumour with 8 mm depth of invasion is:", "o": ["T1", "T3", "T4a", "T2", "Tis"], "k": "D", "x": "T2: ≤2 cm with DOI >5–10 mm, or >2–4 cm with DOI ≤10 mm"}, {"n": 3, "s": "A 3 cm tongue tumour with 12 mm depth of invasion is:", "o": ["T3", "T2", "T1", "T4a", "T4b"], "k": "A", "x": "T3: >4 cm or DOI >10 mm"}, {"n": 4, "s": "Superficial erosion of bone or tooth socket by a gingival primary is:", "o": ["T4a", "T4b", "T3 automatically", "Stage IVA in every case", "Insufficient for T4"], "k": "E", "x": "Superficial erosion of bone/tooth socket by gingival primary is NOT T4; T4a requires cortical bone invasion into marrow/adjacent structures"}, {"n": 5, "s": "Oral cancer invading the masticator space is:", "o": ["T3", "T4a", "T4b", "T2", "N3"], "k": "C", "x": "Oral T4b: masticator space, pterygoid plates, skull base, ICA encasement"}, {"n": 6, "s": "In HPV-negative disease, a single ipsilateral 2.5 cm node with microscopic ENE is pathologically:", "o": ["pN1", "pN2a", "pN3b", "pN2b", "pN2c"], "k": "B", "x": "HPV-negative pN: single ipsilateral ≤3 cm with ENE+ → pN2a (pN3b if >3 cm with ENE, or multiple/contralateral with ENE)"}, {"n": 7, "s": "Clinically evident ENE (skin invasion, fixation, nerve involvement) in HPV-negative disease is:", "o": ["cN1", "cN2a", "cN2c", "cN3b", "cN3a"], "k": "D", "x": "Clinical ENE (cENE+) → cN3b regardless of size; requires unequivocal clinical/imaging evidence"}, {"n": 8, "s": "Depth of invasion is measured from the:", "o": ["Tumour surface", "Deepest point of ulceration", "Muscle layer", "Bone surface", "Adjacent basement membrane"], "k": "E", "x": "DOI: from the basement membrane of the nearest normal mucosa to the deepest point of invasion (not tumour thickness)"}, {"n": 9, "s": "The D'Cruz trial showed that, in early oral cancer with an N0 neck, elective neck dissection:", "o": ["Improved overall survival", "Had no benefit", "Worsened survival", "Equalled observation", "Increased regional recurrence"], "k": "A", "x": "D'Cruz (NEJM 2015): elective ND improved overall survival vs wait-and-watch in early oral SCC"}, {"n": 10, "s": "The standard elective neck dissection for N0 oral cavity cancer clears levels:", "o": ["I–V", "II–IV", "I–III", "VI only", "II–III"], "k": "C", "x": "Supraomohyoid (I–III); include IV for oral tongue"}, {"n": 11, "s": "Level IV is often added in oral tongue cancer because of:", "o": ["Bilateral spread", "Skip metastases", "Retropharyngeal spread", "Mediastinal spread", "Thyroid invasion"], "k": "B", "x": "Oral tongue skip metastases to III/IV (~15%, Byers)"}, {"n": 12, "s": "An alternative to elective neck dissection in T1–T2 N0 oral cancer is:", "o": ["Observation always", "PET only", "Radiotherapy to whole neck", "Chemotherapy", "Sentinel node biopsy"], "k": "E", "x": "SLNB for T1–T2 N0 oral cancer (SENT, NCCN) — equivalent outcomes with less morbidity in expert centres"}, {"n": 13, "s": "A clear margin for oral SCC (RCPath) is:", "o": ["1 mm", "2 mm", "3 mm", "≥5 mm", "10 mm"], "k": "D", "x": "Clear ≥5 mm · close 1–5 mm · involved <1 mm (RCPath)"}, {"n": 14, "s": "After oral cancer resection, chemoradiotherapy rather than RT alone is indicated for:", "o": ["pT2 alone", "Perineural invasion only", "Positive margin or ENE", "Close margin of 4 mm", "Single node pN1"], "k": "C", "x": "Positive margins or ENE → postoperative cisplatin-RT (EORTC 22931/RTOG 9501); others (pT3–4, pN2+, PNI, LVI, close margins) → RT"}, {"n": 15, "s": "Marginal mandibulectomy is appropriate when tumour:", "o": ["Abuts periosteum only", "Invades marrow", "Abuts atrophic edentulous bone", "Through the canal", "Pathological fracture"], "k": "A", "x": "Marginal (rim) mandibulectomy if tumour abuts/minimally erodes alveolus without medullary invasion and adequate bone height; segmental for medullary invasion, canal involvement or atrophic edentulous mandible"}, {"n": 16, "s": "Second primary tumours after H&N SCC occur at about:", "o": ["0.1% per year", "3–5% per year", "20% per year", "50% per year", "Never"], "k": "B", "x": "Field cancerisation: ~3–5% per year second primaries (lung, oesophagus, H&N)"}, {"n": 17, "s": "The oral premalignant lesion with the highest malignant risk is:", "o": ["Leukoplakia", "Lichen planus", "Frictional keratosis", "Candidiasis", "Erythroplakia"], "k": "E", "x": "Erythroplakia (~50% dysplasia/carcinoma); leukoplakia ~1–5% transformation (higher if non-homogeneous)"}, {"n": 18, "s": "Oral submucous fibrosis is caused by:", "o": ["Alcohol", "Chronic HPV infection", "Candida", "Areca nut chewing", "EBV"], "k": "D", "x": "Areca nut (arecoline) → fibrosis, trismus, premalignant (~7–13% transformation)"}, {"n": 19, "s": "The commonest site of oral cavity SCC in Western patients is the:", "o": ["Buccal mucosa", "Hard palate", "Lateral tongue", "Upper lip vermilion", "Gingiva upper"], "k": "C", "x": "Lateral/ventral tongue; floor of mouth second"}, {"n": 20, "s": "The commonest malignancy of the upper lip is:", "o": ["SCC", "BCC", "Melanoma", "Merkel", "Adenoid cystic"], "k": "B", "x": "Upper lip BCC; lower lip SCC (sun exposure, ~90% of lip cancers)"}, {"n": 21, "s": "The Karapandzic flap is advantageous because it:", "o": ["Preserves innervation", "Adds bulk", "Uses distant forehead skin", "Needs microsurgery", "Is two-stage"], "k": "A", "x": "Karapandzic: circumoral rotation-advancement flaps preserve neurovascular supply → sensate, functional oral sphincter (risk microstomia)"}, {"n": 22, "s": "The commonest site of minor salivary gland tumours is the:", "o": ["Lip", "Tongue", "Floor of mouth", "Larynx", "Palate"], "k": "E", "x": "Palate (junction of hard and soft) — commonest minor salivary site; ~50% malignant (ACC, mucoepidermoid, PLGA)"}, {"n": 23, "s": "The commonest HPV type in oropharyngeal cancer is:", "o": ["6", "11", "16", "31", "45"], "k": "C", "x": "HPV 16 (~90% of HPV+ OPC)"}, {"n": 24, "s": "p16 positivity as an HPV surrogate requires strong diffuse staining in at least:", "o": ["10%", "30%", "50%", "70%", "100%"], "k": "D", "x": "≥70% strong diffuse nuclear and cytoplasmic staining (CAP)"}, {"n": 25, "s": "In HPV-associated OPC (AJCC 8th clinical), multiple ipsilateral nodes all ≤6 cm are:", "o": ["N2b", "N1", "N2a", "N3", "N2c"], "k": "B", "x": "HPV+ clinical N1: ipsilateral node(s) ≤6 cm · N2 contralateral/bilateral ≤6 cm · N3 >6 cm"}, {"n": 26, "s": "In HPV-associated OPC, AJCC 8th T4 is:", "o": ["Not subdivided", "Split into T4a and T4b", "Abolished", "T4a only", "T4b only"], "k": "A", "x": "HPV+ OPC: T4 single category (no T4a/T4b)"}, {"n": 27, "s": "In HPV-positive OPC, prognosis is worsened by smoking more than:", "o": ["1 pack-year", "2 pack-years", "50 pack-years", "100 pack-years", "10 pack-years"], "k": "E", "x": ">10 pack-years moves HPV+ patients to intermediate risk (Ang, RTOG 0129)"}, {"n": 28, "s": "De-escalation trials in HPV+ OPC (RTOG 1016, De-ESCALaTE) showed cetuximab-RT was:", "o": ["Superior to cisplatin", "Equivalent", "Inferior to cisplatin", "Less toxic and better", "Curative alone"], "k": "C", "x": "Cetuximab-RT inferior survival/control with no toxicity benefit → cisplatin remains standard"}, {"n": 29, "s": "A contraindication to TORS for tonsil cancer is:", "o": ["T1 tumour", "Young age", "HPV positivity", "Medialised retropharyngeal ICA", "Good mouth opening with wide access"], "k": "D", "x": "Medial/retropharyngeal ICA, inadequate exposure (trismus, retrognathia), unresectable/advanced disease"}, {"n": 30, "s": "A p16-positive cervical node with no primary on examination. The next step is:", "o": ["Neck dissection with no workup", "PET-CT then panendoscopy", "Radiotherapy alone", "Observation", "Chemotherapy"], "k": "B", "x": "PET-CT before endoscopy → panendoscopy with biopsies, bilateral tonsillectomy ± tongue base mucosectomy (TORS)"}, {"n": 31, "s": "The commonest subsite of oropharyngeal cancer is the:", "o": ["Soft palate", "Posterior wall", "Vallecula", "Tongue base", "Tonsil"], "k": "E", "x": "Tonsil (palatine) commonest; tongue base second"}, {"n": 32, "s": "Otalgia from tongue base cancer is referred via the:", "o": ["Glossopharyngeal nerve", "Facial nerve", "Trigeminal nerve", "Great auricular nerve branch", "Vagus only"], "k": "A", "x": "Tonsil/tongue base → IX (Jacobson's nerve)"}, {"n": 33, "s": "Posterior pharyngeal wall cancer drains early to the:", "o": ["Submental and facial nodes", "Parotid nodes", "Retropharyngeal nodes", "Occipital nodes", "Supraclavicular nodes"], "k": "C", "x": "Retropharyngeal (Rouvière) nodes — include in treatment"}, {"n": 34, "s": "The standard concurrent cisplatin regimen with RT is:", "o": ["20 mg/m² weekly once", "500 mg/m²", "1 g total", "100 mg/m² 3-weekly", "10 mg/m²"], "k": "D", "x": "Cisplatin 100 mg/m² days 1, 22, 43 (cumulative ≥200 mg/m²); weekly 40 mg/m² alternative"}, {"n": 35, "s": "After chemoradiotherapy for N2 disease, a complete metabolic response on PET-CT at 12 weeks means:", "o": ["Planned neck dissection", "Surveillance", "Re-irradiation", "Chemotherapy", "Biopsy of all nodes"], "k": "B", "x": "PET-NECK: PET-CT surveillance at 12 weeks non-inferior to planned ND; CR → observe"}, {"n": 36, "s": "Osteoradionecrosis risk is best reduced by:", "o": ["Hyperbaric oxygen for all", "Antibiotics", "Extractions soon after radiotherapy", "Steroids", "Dental assessment before RT"], "k": "E", "x": "Pre-RT dental assessment and extractions (≥10–14 days before RT), fluoride, lifelong dental hygiene"}, {"n": 37, "s": "PENTOCLO for osteoradionecrosis combines pentoxifylline, tocopherol and:", "o": ["Clindamycin", "Clopidogrel", "Clodronate", "Clonidine", "Clotrimazole"], "k": "C", "x": "Pentoxifylline + tocopherol + clodronate (PENTOCLO); HBO evidence conflicting (HOPON); resection + free fibula for advanced"}, {"n": 38, "s": "Parotid-sparing IMRT (PARSPORT) mainly reduces:", "o": ["Xerostomia", "Mucositis", "Trismus", "Hearing loss", "Fibrosis"], "k": "A", "x": "PARSPORT: parotid-sparing IMRT reduced grade ≥2 xerostomia"}, {"n": 39, "s": "Cetuximab targets:", "o": ["PD-1", "VEGF", "HER2", "EGFR", "CTLA-4"], "k": "D", "x": "Cetuximab = anti-EGFR monoclonal antibody (acneiform rash, infusion reactions)"}, {"n": 40, "s": "First-line pembrolizumab for recurrent/metastatic HNSCC (KEYNOTE-048) requires a PD-L1 CPS of at least:", "o": ["50", "1", "20", "10", "100"], "k": "B", "x": "KEYNOTE-048: pembrolizumab ± chemotherapy first-line for CPS ≥1"}, {"n": 41, "s": "Nivolumab (CheckMate 141) is indicated for recurrent HNSCC that:", "o": ["Is HPV-negative disease only", "Is untreated", "Is localised", "Is PD-L1 zero", "Progressed after platinum"], "k": "E", "x": "Nivolumab: recurrent/metastatic HNSCC progressing within 6 months of platinum"}, {"n": 42, "s": "Retromolar trigone cancer characteristically:", "o": ["Spares bone", "Is HPV-related", "Invades mandible early", "Never spreads to nodes", "Responds to antibiotics"], "k": "C", "x": "Retromolar trigone: thin mucosa over mandible → early bone invasion; access to pterygomandibular space"}, {"n": 43, "s": "Buccal mucosa cancer is strongly associated with:", "o": ["HPV 16", "EBV", "Chronic sunlight exposure", "Betel quid chewing", "Alcohol alone"], "k": "D", "x": "Betel quid (areca + tobacco): South Asia; buccal mucosa high local recurrence"}, {"n": 44, "s": "A typical HPV-positive OPC patient is a:", "o": ["Younger non-smoking man", "Elderly smoker woman", "Child", "Heavy drinker over 80", "Immunosuppressed transplant patient"], "k": "A", "x": "HPV+ OPC: younger, male, higher socioeconomic, more sexual partners, often non-smokers; small primary + cystic nodes"}, {"n": 45, "s": "The commonest site of distant metastasis in HNSCC is the:", "o": ["Liver", "Lung", "Bone", "Brain", "Adrenal"], "k": "B", "x": "Lung commonest distant site (~70–80%); then bone, liver"}, {"n": 46, "s": "In patients with an oral tongue squamous cell carcinoma and a depth of invasion of 4 mm:", "o": ["Elective treatment of the neck is not necessary", "The risk of perineural invasion within the primary is significantly increased", "Elective treatment of the N0 neck is advocated, because the risk of occult metastasis exceeds 20%", "Resection of the primary tumor with a minimum of 2-cm margins is required", "The likelihood of bilateral neck metastases is greater than 30%"], "k": "C", "x": "(PP ENT-A Q17) — DOI ~4 mm (≥3–4 mm) → occult nodal risk >20% → elective neck treatment"}, {"n": 47, "s": "Which statement regarding treatment of oropharyngeal carcinoma is true?", "o": ["For early tonsil cancer, there is no significant difference in survival between surgery and primary therapy", "Primary closure of a tongue base defect can be performed only if less than 25% of the tongue base is removed", "Tumors of the upper pharyngeal wall are usually accessible through a transoral route", "For soft palate cancer, radiotherapy should be considered for lesions less than 2 cm in diameter", "Wide resection of the tonsil and surrounding soft tissues can result in significant adverse effects on function"], "k": "A", "x": "(PP ENT-A Q21 = ENT-B Q60, recycled) ⚠ — Early tonsil cancer: surgery and primary RT give similar survival → choose by function/morbidity; most defensible Cummings key"}, {"n": 48, "s": "A patient receives surgery, radiation and chemotherapy for oropharyngeal SCC. One month after completion of therapy, the most accurate way to assess for residual tumor is:", "o": ["Computed tomography", "Magnetic resonance imaging", "Endoscopy", "Positron emission tomography", "Combined PET/CT"], "k": "E", "x": "(PP ENT-A Q22) ⚠ — PET/CT most accurate — but must be ≥12 weeks after therapy (one month gives false positives); choose PET/CT"}, {"n": 49, "s": "A patient has lymphoma of the right tonsil. This patient has a 20% to 30% chance of synchronous or metachronous involvement of what other organ?", "o": ["Brain", "Spleen", "Thyroid", "Gastrointestinal tract", "Kidney"], "k": "D", "x": "(PP ENT-A Q39) — Waldeyer's ring lymphoma: GI tract involvement ~20% → GI evaluation"}, {"n": 50, "s": "Which is true regarding combined radiation and surgical therapy for head and neck SCC?", "o": ["Preoperative doses of radiation are lower than postoperative doses", "Postoperative radiation is only directed at the base of the primary tumor", "Sensitive structures such as the larynx and spinal cord are more easily protected with preoperative versus postoperative radiation", "Radiation therapy is not of use with extracapsular spread", "High-dose preoperative radiation decreases the morbidity of surgical resection"], "k": "A", "x": "(PP ENT-A Q40) — Pre-op RT ~45–50 Gy vs post-op ~60–66 Gy; post-op RT covers tumour bed and neck; benefit with ENE (+ chemo)"}]}, {"c": 4, "t": "Session 2", "d": "Hypopharynx, Nasopharynx, Neck Dissection, Unknown Primary", "q": [{"n": 1, "s": "The commonest subsite of hypopharyngeal cancer is the:", "o": ["Postcricoid region", "Posterior pharyngeal wall", "Pyriform sinus", "Vallecula", "Aryepiglottic fold"], "k": "C", "x": "Pyriform sinus ~65–75%; posterior wall ~20%; postcricoid ~5% (higher in women with Plummer-Vinson)"}, {"n": 2, "s": "Hypopharyngeal T1 is:", "o": ["One subsite and ≤2 cm", "Hemilarynx fixation", ">4 cm", "Thyroid cartilage invasion", "Prevertebral fascia"], "k": "A", "x": "Hypopharynx T1: one subsite and ≤2 cm · T2 >1 subsite or 2–4 cm, no fixation · T3 >4 cm, hemilarynx fixation or oesophageal mucosa"}, {"n": 3, "s": "Hypopharyngeal cancer with hemilarynx fixation is staged:", "o": ["T1", "T2", "T4a", "T4b", "T3"], "k": "E", "x": "Hemilarynx fixation (or >4 cm, or oesophageal mucosal extension) = T3"}, {"n": 4, "s": "Nodal metastases at presentation in hypopharyngeal cancer occur in about:", "o": ["10%", "70%", "30%", "5%", "95%"], "k": "B", "x": "~70% node-positive at presentation (rich lymphatics, late symptoms); bilateral in many"}, {"n": 5, "s": "Hypopharyngeal cancer requires wide margins because of:", "o": ["Radiosensitivity", "Frequent HPV positivity", "Low grade", "Submucosal spread", "Encapsulation"], "k": "D", "x": "Submucosal spread and skip lesions → margins ~2 cm (inferiorly 3 cm); frozen sections"}, {"n": 6, "s": "A circumferential pharyngeal defect without oesophageal involvement is best reconstructed with:", "o": ["Pectoralis major flap alone", "Gastric pull-up", "Free jejunum or tubed ALT", "Primary closure", "Deltopectoral flap"], "k": "C", "x": "Circumferential defect: free jejunum or tubed ALT/radial forearm; gastric pull-up if below thoracic inlet"}, {"n": 7, "s": "In pyriform apex and postcricoid cancer, the neck dissection should include:", "o": ["Level I", "Level VI", "Level V only", "Suboccipital nodes", "Parotid nodes"], "k": "B", "x": "Pyriform apex, postcricoid, subglottic extension → paratracheal (level VI) ± hemithyroidectomy"}, {"n": 8, "s": "Patients with hypopharyngeal cancer should have which test for a synchronous primary?", "o": ["Colonoscopy", "Breast imaging", "Bone scan", "Cystoscopy", "Oesophagoscopy"], "k": "E", "x": "Oesophagoscopy (panendoscopy) — synchronous oesophageal SCC in ~5–10%"}, {"n": 9, "s": "Loss of laryngeal crepitus on examination suggests:", "o": ["Postcricoid carcinoma", "Laryngomalacia", "Unilateral vocal fold palsy", "Thyroid goitre", "Laryngocele"], "k": "A", "x": "Loss of laryngeal crepitus (larynx no longer grates over the spine) → postcricoid/retrocricoid tumour"}, {"n": 10, "s": "Nasopharyngeal carcinoma most often arises in the:", "o": ["Roof", "Midline adenoid pad tissue", "Torus tubarius", "Fossa of Rosenmüller", "Floor"], "k": "D", "x": "Fossa of Rosenmüller (lateral pharyngeal recess) — endoscopic biopsy here even if normal-looking"}, {"n": 11, "s": "The commonest NPC type in endemic areas is WHO:", "o": ["Type I keratinising", "Type III undifferentiated", "Basaloid squamous variant", "Adenocarcinoma", "Lymphoma"], "k": "B", "x": "Undifferentiated (WHO III, non-keratinising) — EBV-associated; better RT response than keratinising type"}, {"n": 12, "s": "A blood test useful to monitor NPC is:", "o": ["Serum CEA level", "PSA", "Plasma EBV DNA", "Calcitonin", "Thyroglobulin"], "k": "C", "x": "Plasma EBV DNA: screening (high-risk populations), prognosis, response and relapse monitoring"}, {"n": 13, "s": "The cranial nerve most commonly involved first in NPC is:", "o": ["VII", "XII", "VIII", "X", "VI"], "k": "E", "x": "VI first (cavernous sinus/petrous apex via foramen lacerum) → diplopia; then V"}, {"n": 14, "s": "Trotter's triad comprises conductive hearing loss, palatal immobility and:", "o": ["Mandibular nerve pain", "Trismus and dysphagia only", "Facial palsy", "Anosmia", "Diplopia"], "k": "A", "x": "Trotter's triad: CHL (OME), ipsilateral V3 neuralgia (temple/mandible pain), immobile soft palate"}, {"n": 15, "s": "Locoregionally advanced NPC is treated with:", "o": ["Surgery and bilateral neck dissection", "RT alone", "Chemotherapy alone", "Chemoradiotherapy ± induction", "Observation"], "k": "D", "x": "Concurrent cisplatin-IMRT ± induction gemcitabine-cisplatin (stage III–IVA); surgery not primary (anatomy)"}, {"n": 16, "s": "NPC N3 is a node >6 cm or extending below the:", "o": ["Hyoid", "Caudal border of cricoid", "Mandible", "Upper thyroid notch level", "Mastoid"], "k": "B", "x": "NPC N3: >6 cm and/or below caudal border of cricoid (AJCC 8th)"}, {"n": 17, "s": "In NPC, unilateral or bilateral retropharyngeal node involvement is staged:", "o": ["N0", "N2", "N1", "N3", "M1"], "k": "C", "x": "Retropharyngeal nodes (any laterality) ≤6 cm = N1 in NPC"}, {"n": 18, "s": "NPC with intracranial extension or cranial nerve involvement is:", "o": ["T1", "T2", "T3", "N3", "T4"], "k": "E", "x": "NPC T4: intracranial, cranial nerves, hypopharynx, orbit, parotid, beyond lateral pterygoid"}, {"n": 19, "s": "Locally recurrent small NPC after RT is best salvaged by:", "o": ["Endoscopic nasopharyngectomy", "Observation", "Antibiotics", "Bilateral neck dissection only", "Laser"], "k": "A", "x": "Endoscopic nasopharyngectomy for small local recurrence; re-irradiation for unresectable; neck recurrence → neck dissection"}, {"n": 20, "s": "A late complication of NPC radiotherapy is:", "o": ["Otomycosis", "Chronic rhinosinusitis alone", "Anosmia only", "Temporal lobe necrosis", "Epistaxis"], "k": "D", "x": "Temporal lobe necrosis, SNHL (cisplatin + RT), hypopituitarism, trismus, carotid stenosis, cranial neuropathy"}, {"n": 21, "s": "A dietary risk factor for NPC is:", "o": ["Red meat", "Salted fish", "Coffee", "Spicy chilli food", "Dairy"], "k": "B", "x": "Cantonese-style salted fish (nitrosamines), EBV, genetic susceptibility (Southern China, North Africa, Arctic)"}, {"n": 22, "s": "Radical neck dissection removes levels I–V with the:", "o": ["Carotid and vagus", "Hypoglossal", "Phrenic", "Submandibular gland only", "SCM, IJV and XI"], "k": "E", "x": "RND: levels I–V + SCM + IJV + spinal accessory nerve (Crile)"}, {"n": 23, "s": "Modified radical neck dissection type III preserves:", "o": ["SAN only", "SAN and IJV", "SAN, IJV and SCM", "Internal jugular vein only", "None"], "k": "C", "x": "MRND I: SAN · II: SAN + IJV · III: SAN + IJV + SCM (functional, Bocca)"}, {"n": 24, "s": "The usual elective neck dissection for supraglottic cancer is:", "o": ["Lateral II–IV", "Supraomohyoid I–III", "Posterolateral", "Central VI", "Radical"], "k": "A", "x": "Lateral (II–IV) for larynx, hypopharynx, oropharynx"}, {"n": 25, "s": "Posterolateral neck dissection is used for:", "o": ["Oral cancer", "Papillary thyroid cancer", "Laryngeal cancer", "Posterior scalp tumours", "Parotid cancer"], "k": "D", "x": "Posterolateral (II–V + suboccipital, retroauricular) for posterior scalp/neck skin cancer and melanoma"}, {"n": 26, "s": "Levels IIA and IIB are separated by the:", "o": ["Hypoglossal nerve", "Accessory nerve", "IJV", "Digastric", "Hyoid"], "k": "B", "x": "Spinal accessory nerve: IIA anteroinferior (jugulodigastric), IIB posterosuperior (submuscular recess)"}, {"n": 27, "s": "Level V is bounded by the SCM, the clavicle and the:", "o": ["Mandible", "Hyoid", "Omohyoid", "Midline of neck", "Trapezius"], "k": "E", "x": "Level V: posterior border SCM, anterior border trapezius, clavicle; split by cricoid level into VA/VB"}, {"n": 28, "s": "Level VII nodes lie in the:", "o": ["Parotid", "Submental", "Superior mediastinum", "Supraclavicular fossa", "Retropharynx"], "k": "C", "x": "Level VII: superior mediastinum (suprasternal notch to innominate artery)"}, {"n": 29, "s": "A neck dissection that also removes the hypoglossal nerve or carotid is a:", "o": ["Extended radical", "Selective", "Modified radical", "Functional", "Central compartment"], "k": "A", "x": "Extended RND adds structures/nodal groups (hypoglossal, carotid, skin, parotid, retropharyngeal, VII)"}, {"n": 30, "s": "Shoulder syndrome after neck dissection results from injury to the:", "o": ["Phrenic nerve", "Long thoracic nerve", "Hypoglossal", "Accessory nerve", "Vagus"], "k": "D", "x": "SAN palsy: shoulder droop, pain, abduction weakness >90°, lateral scapular winging; physiotherapy"}, {"n": 31, "s": "A left neck chyle leak of 1.5 L/day despite MCT diet is managed by:", "o": ["More diet", "Surgical ligation", "Antibiotics", "Steroids", "Observation for weeks"], "k": "B", "x": "High-output (>1 L/day) or persistent leak despite MCT/TPN ± octreotide → surgical ligation/thoracic duct embolisation"}, {"n": 32, "s": "Bilateral IJV sacrifice should ideally be:", "o": ["Simultaneous", "Avoided always", "Done with RT", "Followed by steroids", "Staged by 3–6 weeks"], "k": "E", "x": "Staged (≥3–6 weeks) to allow collateral drainage → avoid facial/cerebral oedema, SIADH, blindness"}, {"n": 33, "s": "Carotid blowout with active bleeding is best managed by:", "o": ["Bedside ligation in the clinic", "Observation", "Pressure then endovascular", "Antibiotics", "Radiotherapy"], "k": "C", "x": "Digital pressure, resuscitation, airway → emergency endovascular (stent/coil) or surgical ligation"}, {"n": 34, "s": "Dividing the facial vein low and retracting it upward to protect the marginal mandibular nerve is the:", "o": ["Valsalva manoeuvre", "Modified Sellick manoeuvre", "Mendelsohn manoeuvre", "Hayes Martin manoeuvre", "Epley manoeuvre"], "k": "D", "x": "Hayes Martin: ligate facial vein low and reflect upward → nerve protected within the flap"}, {"n": 35, "s": "The phrenic nerve lies on the:", "o": ["Anterior scalene", "Middle scalene", "Levator scapulae", "SCM", "Omohyoid"], "k": "A", "x": "Phrenic on anterior scalene, deep to prevertebral fascia; injury → hemidiaphragm palsy"}, {"n": 36, "s": "After hypoglossal nerve injury, the protruded tongue deviates:", "o": ["Away from injury", "Toward injury", "Upward", "Not at all", "Downward"], "k": "B", "x": "Tongue deviates toward the weak side (unopposed contralateral genioglossus)"}, {"n": 37, "s": "Horner syndrome after neck dissection reflects injury to the:", "o": ["Vagus", "Phrenic nerve root", "Accessory", "Hypoglossal", "Sympathetic chain"], "k": "E", "x": "Cervical sympathetic chain (deep to carotid sheath, on prevertebral fascia) → ptosis, miosis, anhidrosis"}, {"n": 38, "s": "The nodal level most often involved by HNSCC is:", "o": ["Level I", "Level V", "Level II", "Level VI", "Level VII"], "k": "C", "x": "Level II (jugulodigastric) commonest"}, {"n": 39, "s": "In a heavily irradiated neck, a preferred neck dissection incision is the:", "o": ["Single vertical", "Lazy-S", "Y-shaped", "MacFee", "Trifurcate"], "k": "D", "x": "MacFee (two parallel horizontal incisions) — no trifurcation over the carotid in irradiated skin"}, {"n": 40, "s": "The accessory nerve enters the posterior triangle near:", "o": ["Erb's point", "Clavicle", "Mastoid tip", "Hyoid", "Thyroid notch"], "k": "A", "x": "Erb's point (~1 cm above where great auricular emerges at posterior SCM border)"}, {"n": 41, "s": "The commonest site of an occult primary with a p16-positive node is the:", "o": ["Larynx", "Palatine tonsil", "Hypopharynx", "Nasopharynx", "Oral tongue margin"], "k": "B", "x": "Palatine tonsil (crypts), then tongue base"}, {"n": 42, "s": "An EBV-positive cervical node with unknown primary points to the:", "o": ["Tonsil", "Larynx", "Nasopharynx", "Thyroid", "Oral cavity"], "k": "C", "x": "EBV-encoded RNA (EBER) in node → nasopharynx"}, {"n": 43, "s": "A left supraclavicular node (Virchow) suggests a primary in the:", "o": ["Oral cavity", "Larynx", "Thyroid", "Parotid", "Abdomen"], "k": "E", "x": "Virchow's node (left supraclavicular) → abdominal (stomach) or thoracic primaries via thoracic duct"}, {"n": 44, "s": "An isolated level I node suggests a primary in the:", "o": ["Larynx", "Hypopharynx and oesophagus", "Nasopharynx", "Oral cavity or lip", "Thyroid"], "k": "D", "x": "Level I → oral cavity, lip, anterior nasal cavity, facial skin"}, {"n": 45, "s": "Thyroglobulin in fluid from a cystic lateral neck node indicates:", "o": ["HPV SCC", "Papillary thyroid cancer", "Infected branchial cleft cyst", "Lymphoma", "Tuberculosis"], "k": "B", "x": "Thyroglobulin (± calcitonin) in aspirate washout → metastatic thyroid cancer (cystic PTC nodes)"}, {"n": 46, "s": "A contraindication to larynx-preserving partial pharyngectomy is:", "o": ["Pyriform apex involvement", "Small medial wall lesion only", "Good lung function", "Mobile cord", "Age 50"], "k": "A", "x": "Pyriform apex involvement (or postcricoid extension, fixation) → total laryngopharyngectomy"}, {"n": 47, "s": "In the previously radiated neck, a precaution taken during radical neck dissection is:", "o": ["Tracheotomy", "Preservation of the spinal accessory nerve", "Avoidance of electrocautery", "Use of a muscle flap for carotid artery protection", "Preservation of the internal jugular vein"], "k": "D", "x": "(PP ENT-B Q34) — Cover the carotid with a muscle flap (levator scapulae, pectoralis) in irradiated neck to prevent blowout"}, {"n": 48, "s": "Which artery is not usually seen in neck dissection?", "o": ["Superior thyroid", "Lingual", "Ascending pharyngeal", "External maxillary", "Occipital"], "k": "C", "x": "(PP ENT-B Q95) — Ascending pharyngeal artery lies deep (medial to ICA) — not usually exposed"}, {"n": 49, "s": "Which are not removed in radical neck dissection?", "o": ["Submental nodes", "Jugular nodes", "Spinal accessory nodes", "The tail of the parotid gland", "All of the above are removed in radical neck dissection"], "k": "E", "x": "(PP ENT-B Q96) ⚠ — Classic RND removes all listed (submental Ia, jugular, accessory chain, tail of parotid) — choose E"}, {"n": 50, "s": "What region of the neck has the most difficult surgical access for exploration?", "o": ["Base of skull region", "Midcervical region", "Lower cervical region", "Posterior neck triangle", "Anterior cervical triangle"], "k": "A", "x": "(PP ENT-A Q36) — Zone III (skull base) has the most difficult access (mandible, styloid); zone I also difficult (thoracic inlet)"}]}, {"c": 4, "t": "Session 3", "d": "Salivary Glands", "q": [{"n": 1, "s": "The most reliable landmark for identifying the facial nerve trunk is the:", "o": ["Tragal pointer alone", "Tympanomastoid suture", "Styloid tip", "Mastoid tip", "Digastric anterior belly"], "k": "B", "x": "Tympanomastoid suture: trunk 6–8 mm deep to its inferior end (most reliable); tragal pointer 1 cm deep and inferior (variable); posterior belly of digastric at same depth, nerve just superior"}, {"n": 2, "s": "When the facial nerve trunk cannot be found, it can be traced retrogradely from the:", "o": ["Great auricular", "Lingual", "Hypoglossal", "Auriculotemporal nerve trunk", "Marginal mandibular branch"], "k": "E", "x": "Retrograde dissection from marginal mandibular (over facial vessels), buccal or temporal branches when trunk inaccessible (recurrent/large tumours)"}, {"n": 3, "s": "The gland producing most unstimulated saliva is the:", "o": ["Parotid", "Sublingual", "Minor glands", "Submandibular", "von Ebner glands"], "k": "D", "x": "SMG ~70% of unstimulated saliva (mixed); parotid dominates stimulated (serous)"}, {"n": 4, "s": "Stensen's duct opens opposite the:", "o": ["Upper second molar", "Lower second molar", "Upper first premolar", "Lower incisor", "Frenulum"], "k": "A", "x": "Opposite upper second molar after piercing buccinator"}, {"n": 5, "s": "The structure that loops beneath Wharton's duct is the:", "o": ["Hypoglossal", "Facial artery", "Marginal mandibular", "Glossopharyngeal", "Lingual nerve"], "k": "E", "x": "Lingual nerve passes lateral → under → medial to Wharton's duct (\"double crossing\")"}, {"n": 6, "s": "Frey syndrome results from:", "o": ["Facial nerve injury", "Misrouted secretomotor fibres", "Cervical sympathetic overactivity", "Infection", "Sialocele"], "k": "B", "x": "Aberrant regeneration of parotid parasympathetic (auriculotemporal) fibres into sweat glands → gustatory sweating; Minor starch-iodine test"}, {"n": 7, "s": "Symptomatic Frey syndrome is best treated by:", "o": ["Tympanic neurectomy first", "Antibiotics", "Parotidectomy", "Intradermal botulinum", "Steroids"], "k": "D", "x": "Intradermal botulinum toxin (effective months); prevention: SMAS flap, sternomastoid flap, ADM interposition"}, {"n": 8, "s": "About what proportion of parotid tumours are benign?", "o": ["20%", "50%", "80%", "99%", "35%"], "k": "C", "x": "Parotid ~80% benign; ~80% of benign = PA (\"rule of 80s\"); SMG ~50% malignant"}, {"n": 9, "s": "The salivary gland whose tumours are most often malignant is the:", "o": ["Parotid", "Submandibular", "Minor buccal", "Accessory parotid", "Sublingual"], "k": "E", "x": "Sublingual ~70–90% malignant; minor glands ~50–80% (smaller gland → higher malignant ratio)"}, {"n": 10, "s": "Pleomorphic adenoma recurs after enucleation because of:", "o": ["Capsular pseudopodia", "Viral cause", "Multicentric origin always", "Radiation", "Malignancy"], "k": "A", "x": "Incomplete capsule with pseudopodia/satellite nodules → recurrence (often multinodular) after enucleation or spillage"}, {"n": 11, "s": "Sudden growth and pain in a parotid lump present for 20 years suggests:", "o": ["Warthin's", "Carcinoma ex PA", "Sialadenosis", "Abscess with sialolith", "Haemangioma"], "k": "B", "x": "Carcinoma ex PA: long-standing PA with rapid growth, pain, facial weakness"}, {"n": 12, "s": "Warthin's tumour is associated with:", "o": ["Women", "Children", "Radiation only", "Smoking", "EBV"], "k": "D", "x": "Warthin's: older men, smokers, bilateral/multifocal ~10–15%, tail of parotid, never malignant (practically)"}, {"n": 13, "s": "The commonest malignant salivary tumour in adults is:", "o": ["ACC", "Acinic cell carcinoma", "Lymphoma", "SDC", "Mucoepidermoid"], "k": "E", "x": "Mucoepidermoid carcinoma — commonest malignant overall and in children"}, {"n": 14, "s": "Perineural spread and late lung metastases characterise:", "o": ["Adenoid cystic", "Warthin's", "Acinic", "Oncocytoma", "Basal cell adenoma"], "k": "A", "x": "ACC: cribriform (commonest)/tubular/solid (worst); perineural invasion, skip lesions, late lung metastases (decades), RT after surgery"}, {"n": 15, "s": "ETV6-NTRK3 fusion defines:", "o": ["Adenoid cystic carcinoma", "Secretory carcinoma", "MEC", "PA", "Warthin's"], "k": "B", "x": "Secretory carcinoma (formerly MASC): ETV6-NTRK3 → targetable (larotrectinib)"}, {"n": 16, "s": "Androgen receptor and HER2 expression is typical of:", "o": ["Bilateral Warthin's tumour", "PA", "Salivary duct carcinoma", "Acinic", "Oncocytoma"], "k": "C", "x": "Salivary duct carcinoma: aggressive, resembles ductal breast carcinoma; AR+, HER2+ → targeted therapy"}, {"n": 17, "s": "Polymorphous adenocarcinoma most often arises in the:", "o": ["Parotid", "SMG", "Sublingual", "Lip", "Palate"], "k": "E", "x": "Polymorphous adenocarcinoma (formerly PLGA): palate, minor salivary, perineural but indolent"}, {"n": 18, "s": "During parotidectomy for cancer, the facial nerve should be sacrificed when it is:", "o": ["Always", "High-grade histology alone", "Age >60", "Directly invaded", "Tumour >2 cm"], "k": "D", "x": "Preserve unless directly invaded or preoperatively paralysed; sacrifice → immediate grafting (cable/nerve-to-masseter) + reanimation"}, {"n": 19, "s": "The Milan system is used for:", "o": ["Thyroid cytology", "Salivary cytology", "Breast", "Lymph node staging", "Parotid imaging"], "k": "B", "x": "Milan System for Reporting Salivary Gland Cytopathology (I non-diagnostic → VI malignant; IVA benign neoplasm, IVB SUMP)"}, {"n": 20, "s": "A deep-lobe parotid tumour extending into the parapharyngeal space through the stylomandibular tunnel produces a:", "o": ["Dumbbell shape", "Retropharyngeal node", "Carotid splay", "Skull base erosion", "Cystic change"], "k": "A", "x": "Dumbbell tumour through stylomandibular tunnel; widened tunnel; prestyloid space → transcervical(-parotid) approach"}, {"n": 21, "s": "A poststyloid parapharyngeal tumour typically displaces the ICA:", "o": ["Medially", "Not at all", "Posteriorly", "Laterally", "Anteriorly"], "k": "E", "x": "Poststyloid (paraganglioma, schwannoma) displaces ICA anteriorly/medially; prestyloid (salivary) pushes ICA posteriorly"}, {"n": 22, "s": "A parotid cancer invading the facial nerve is staged:", "o": ["T2", "T3", "T1", "T4a", "T4b"], "k": "D", "x": "Major salivary T4a: skin, mandible, ear canal, facial nerve; T4b: skull base, pterygoid plates, encases carotid; T3 >4 cm or extraparenchymal extension"}, {"n": 23, "s": "Elective neck dissection in parotid cancer is indicated for:", "o": ["All parotid tumours of any type", "High-grade or T3–T4", "Warthin's", "Low-grade T1", "Never"], "k": "B", "x": "Elective ND for high-grade histology or T3–T4 (occult nodal rate >20%)"}, {"n": 24, "s": "Postoperative RT after parotid cancer surgery is indicated for:", "o": ["All benign", "Low-grade T1 clear", "High grade", "Warthin's", "PA"], "k": "C", "x": "High grade, close/positive margins, PNI, T3–T4, nodal disease, recurrent tumour"}, {"n": 25, "s": "A small, mobile, superficial benign parotid lump may be removed by:", "o": ["Extracapsular dissection", "Total parotidectomy with nerve sacrifice", "Enucleation", "Radiotherapy", "Observation always"], "k": "A", "x": "Extracapsular dissection for small, mobile, superficial, benign-appearing lesions (experienced hands); not enucleation"}, {"n": 26, "s": "The commonest permanent sequela of parotidectomy is:", "o": ["Permanent facial palsy", "Sialocele", "Trismus", "Fistula", "Earlobe numbness"], "k": "E", "x": "Great auricular nerve sensory loss (earlobe) — near universal unless posterior branch preserved; permanent facial palsy ~1–3%"}, {"n": 27, "s": "A postoperative sialocele is managed first by:", "o": ["Revision surgery", "Radiotherapy", "Completion total parotidectomy", "Aspiration and pressure", "Antibiotics"], "k": "D", "x": "Aspiration, pressure dressing, anticholinergic/botulinum; usually resolves"}, {"n": 28, "s": "First bite syndrome follows loss of the:", "o": ["Parasympathetic supply", "Sympathetic supply", "Facial nerve", "Auriculotemporal", "Lingual nerve"], "k": "B", "x": "First bite syndrome: loss of sympathetic supply to parotid (parapharyngeal/deep lobe surgery) → intense pain with first bite; botulinum"}, {"n": 29, "s": "About what proportion of salivary stones occur in the submandibular gland?", "o": ["10%", "30%", "50%", "Nearly 100%", "80–90%"], "k": "E", "x": "SMG 80–90% (mucinous, alkaline, uphill flow, long duct); parotid ~10%"}, {"n": 30, "s": "A palpable stone in the distal Wharton's duct is treated by:", "o": ["Transoral duct incision", "Submandibular gland excision", "Radiotherapy", "Antibiotics only", "Parotidectomy"], "k": "A", "x": "Transoral sialolithotomy for palpable anterior stones; sialendoscopy for small ones; gland excision for intraglandular/failed"}, {"n": 31, "s": "Interventional sialendoscopy is best suited to:", "o": ["Parotid malignancy", "Hilar stones over ten mm", "IgG4", "Small stones, strictures", "Ranula"], "k": "D", "x": "Sialendoscopy: stones <4–5 mm (parotid <3–4), strictures, JRP; larger → combined approach/lithotripsy"}, {"n": 32, "s": "Lymphoma in Sjögren syndrome is usually:", "o": ["Hodgkin", "MALT", "Burkitt", "T-cell", "Mantle cell"], "k": "B", "x": "Extranodal marginal zone (MALT) lymphoma (~5% lifetime, ~16–44× risk)"}, {"n": 33, "s": "IgG4-related sialadenitis (Küttner tumour) is treated with:", "o": ["Excision always", "Radiotherapy", "Steroids", "Antibiotics", "Sialendoscopy"], "k": "C", "x": "Steroids (± rituximab); check serum IgG4, other organ involvement"}, {"n": 34, "s": "Bilateral painless parotid enlargement in a young woman with bulimia is:", "o": ["Sjögren", "Mumps", "Warthin's", "Bilateral lymphoma", "Sialadenosis"], "k": "E", "x": "Sialadenosis: non-inflammatory, painless, bilateral (alcohol, diabetes, bulimia, malnutrition, drugs)"}, {"n": 35, "s": "A palatal ulcer after a dental block, with histology mimicking carcinoma, is:", "o": ["Sialometaplasia", "Mucoepidermoid carcinoma", "Syphilis", "Lymphoma", "SCC"], "k": "A", "x": "Necrotising sialometaplasia: ischaemic infarct of minor glands (palate) after trauma/injection; mimics SCC/MEC; heals in 6–10 weeks"}, {"n": 36, "s": "A lower lip mucocele is best treated by:", "o": ["Repeated needle aspiration", "Antibiotics", "Steroid injection", "Excision with glands", "Laser only"], "k": "D", "x": "Excision including underlying minor salivary glands (prevents recurrence)"}, {"n": 37, "s": "Acute suppurative parotitis in an elderly postoperative patient is mainly due to:", "o": ["Stones", "Dehydration", "Occult parotid tumour", "Mumps", "Radiation"], "k": "B", "x": "Dehydration, poor oral hygiene, reduced flow → retrograde S. aureus; hydration, sialogogues, antistaphylococcal antibiotics"}, {"n": 38, "s": "A sialogogue licensed for radiation xerostomia is:", "o": ["Atropine", "Glycopyrrolate", "Hyoscine", "Amitriptyline", "Pilocarpine"], "k": "E", "x": "Pilocarpine (muscarinic agonist); amifostine radioprotector; IMRT parotid sparing; submandibular gland transfer"}, {"n": 39, "s": "The commonest malignancy of minor salivary glands is:", "o": ["Adenoid cystic", "Mucoepidermoid", "Acinic cell", "Salivary duct", "Lymphoma"], "k": "A", "x": "ACC commonest in minor (and submandibular) glands; MEC commonest overall (parotid)"}, {"n": 40, "s": "Untreated pleomorphic adenoma carries a malignant transformation risk over 15 years of:", "o": ["About 50%", "Nil", "About 6%", "About 90%", "About 25%"], "k": "C", "x": "~1.5% in 5 years rising to ~10% at 15 years (commonly quoted ~6%)"}, {"n": 41, "s": "During submandibular gland excision, the nerve at risk deep to the gland, looping under the duct, is the:", "o": ["Facial", "Vagus", "Accessory", "Lingual", "Phrenic"], "k": "D", "x": "Lingual nerve (with submandibular ganglion) above; hypoglossal deep and inferior; marginal mandibular superficial"}, {"n": 42, "s": "Radioiodine sialadenitis mostly affects the:", "o": ["SMG", "Parotid", "Sublingual", "Minor glands", "Lacrimal"], "k": "B", "x": "Parotid (higher iodide uptake); dose-related; sialendoscopy for obstruction"}, {"n": 43, "s": "A \"hot\" nodule on Tc-99m pertechnetate scan suggests:", "o": ["PA", "MEC", "Warthin's", "ACC", "Lymphoma of gland"], "k": "C", "x": "Warthin's and oncocytoma concentrate pertechnetate (mitochondria-rich oncocytes)"}, {"n": 44, "s": "The commonest malignancy metastatic to parotid nodes is:", "o": ["Cutaneous SCC", "Lung", "Breast", "Renal cell carcinoma", "Thyroid"], "k": "A", "x": "Metastatic cutaneous SCC (scalp, ear, face) → parotidectomy + neck dissection + RT; melanoma second"}, {"n": 45, "s": "Which would be the best antimicrobial for the treatment of acute suppurative sialadenitis?", "o": ["Erythromycin", "Tetracycline", "β-Lactamase-resistant penicillin", "Fluoroquinolone"], "k": "C", "x": "(PP ENT-A Q13) — Antistaphylococcal β-lactamase-resistant penicillin (S. aureus)"}, {"n": 46, "s": "Warthin's tumors are thought to arise from which of the following cell types?", "o": ["Acinar cells", "Intercalated duct cells", "Striated duct cells", "Excretory duct cells", "Myoepithelial cells"], "k": "C", "x": "(PP ENT-A Q14) — Striated duct cells (oncocytic epithelium within lymphoid stroma)"}, {"n": 47, "s": "Which statement regarding postoperative radiation is true?", "o": ["Postoperative radiation is given for any parotid malignancy", "Postoperative radiation improves overall survival and regional control", "Postoperative radiation is only given for positive margins and unresectable disease", "Postoperative radiation improves regional control in advanced stage tumors", "Because neutron therapy has an improved radiobiologic effect on salivary cancers, it has become the standard technique for postoperative radiation"], "k": "D", "x": "(PP ENT-A Q15) — PORT improves locoregional control in advanced/high-risk tumours; survival benefit not proven"}, {"n": 48, "s": "Which of the following classifications of medications does not cause salivary hypofunction?", "o": ["Tricyclic antidepressants", "Antihistamines", "Cox-2 nonsteroidal antiinflammatories", "Diuretics"], "k": "C", "x": "(PP ENT-A Q16) — COX-2 NSAIDs don't cause hypofunction; anticholinergic-type drugs, antihistamines, diuretics do"}, {"n": 49, "s": "A 36-year-old man is seen with a right parotid mass. Which of the following characteristics suggests malignancy?", "o": ["Size >2 cm", "Previous history of parotid mass", "Pain", "Intact cranial nerve exam", "Family history of lymphoma"], "k": "C", "x": "(PP ENT-A Q37) — Pain (also facial weakness, fixation, rapid growth, skin involvement, nodes) suggests malignancy"}, {"n": 50, "s": "The most common cause of chronic parotitis is:", "o": ["Stricture of the anterior part of Stensen's duct", "Obstruction due to stones", "Compression by tumor", "Stricture of the duct orifice", "Congenital dilation of the main duct"], "k": "A", "x": "(PP ENT-B Q93) ⚠ — Ductal stricture/sialectasis is commonest cause of chronic parotitis (parotid stones less common); old-bank key A"}]}, {"c": 4, "t": "Session 4", "d": "Thyroid & Parathyroid", "q": [{"n": 1, "s": "The external branch of the superior laryngeal nerve is best protected by:", "o": ["Mass ligation of the pedicle", "Dividing the cricothyroid", "High STA trunk ligation", "Individual capsular ligation", "Dividing sternothyroid"], "k": "D", "x": "EBSLN runs with STA; Cernea 2b (crosses <1 cm above superior pole) at highest risk → ligate branches individually on the capsule; injury → loss of high pitch, voice fatigue"}, {"n": 2, "s": "The main blood supply of both parathyroid glands is the:", "o": ["Superior thyroid artery", "Inferior thyroid artery", "Thyroidea ima", "Lingual artery", "Ascending pharyngeal"], "k": "B", "x": "Inferior thyroid artery supplies both inferior and (usually) superior glands → ligate ITA branches close to the thyroid capsule to preserve parathyroid supply"}, {"n": 3, "s": "Relative to the tubercle of Zuckerkandl, the RLN typically lies:", "o": ["Lateral", "Anterior", "Superficial to it", "Inferior only", "Posteromedial"], "k": "E", "x": "RLN lies posteromedial to the tubercle of Zuckerkandl — reliable landmark"}, {"n": 4, "s": "The commonest site of RLN injury during thyroidectomy is at:", "o": ["Berry's ligament", "Thoracic inlet", "Carotid sheath", "Cricothyroid joint", "Aortic arch"], "k": "A", "x": "At Berry's (posterior suspensory) ligament, near entry to larynx — traction/thermal injury"}, {"n": 5, "s": "The inferior parathyroid glands derive from the:", "o": ["Fourth pouch", "Second pouch", "Third pouch", "First cleft", "Ultimobranchial body"], "k": "C", "x": "Inferior parathyroids + thymus from third pouch → longer descent → variable position (thymus, mediastinum); superior from fourth pouch (constant)"}, {"n": 6, "s": "Relative to the RLN, the superior parathyroid lies:", "o": ["Anterior", "Lateral", "Inferior", "Dorsal", "Superficial"], "k": "D", "x": "Superior parathyroid dorsal (deep) to RLN plane; inferior ventral (superficial)"}, {"n": 7, "s": "The first investigations for a thyroid nodule are:", "o": ["FNA and CT", "TSH and ultrasound", "Radionuclide scan alone", "Thyroglobulin", "MRI"], "k": "B", "x": "TSH + neck ultrasound first (ATA); FNA based on US pattern and size"}, {"n": 8, "s": "A nodule with suppressed TSH should next have:", "o": ["FNA", "CT", "Lobectomy", "Serum calcitonin level", "Radionuclide scan"], "k": "E", "x": "Low TSH → radionuclide scan: hot (autonomous) nodules rarely malignant → no FNA"}, {"n": 9, "s": "The ultrasound feature most suggestive of malignancy is:", "o": ["Microcalcification", "Spongiform", "Purely cystic nodule", "Halo", "Comet tail"], "k": "A", "x": "Microcalcifications, taller-than-wide, irregular margins, marked hypoechogenicity, ETE; spongiform/pure cyst benign"}, {"n": 10, "s": "FNA of a high-suspicion nodule (ATA) is indicated from a size of:", "o": ["0.5 cm", "2 cm", "4 cm", "1 cm", "Any size"], "k": "D", "x": "High suspicion ≥1 cm; intermediate ≥1 cm; low ≥1.5 cm; very low ≥2 cm or observe"}, {"n": 11, "s": "Bethesda VI carries a malignancy risk of:", "o": ["About 5%", "About 30%", "97–99%", "About 50%", "About 15%"], "k": "C", "x": "Bethesda VI ~97–99% malignant; V ~74%; IV ~30%; III ~22% (2023 risks)"}, {"n": 12, "s": "Bethesda IV (follicular neoplasm) is usually managed by:", "o": ["Observation", "Diagnostic lobectomy", "Total thyroidectomy with neck dissection", "RAI", "Repeat FNA forever"], "k": "B", "x": "Diagnostic lobectomy (± molecular testing); follicular carcinoma needs histology"}, {"n": 13, "s": "Follicular carcinoma is distinguished from follicular adenoma by:", "o": ["FNA cytology", "Nuclear grooves on cytology", "Psammoma bodies", "Thyroglobulin", "Capsular invasion"], "k": "E", "x": "Capsular and/or vascular invasion on histology — cannot be judged on FNA"}, {"n": 14, "s": "NIFTP is an:", "o": ["Aggressive cancer", "Anaplastic variant", "Medullary", "Indolent neoplasm", "Lymphoma"], "k": "D", "x": "NIFTP (non-invasive follicular thyroid neoplasm with papillary-like nuclear features): reclassified from encapsulated follicular-variant PTC; lobectomy curative"}, {"n": 15, "s": "The commonest mutation in papillary thyroid carcinoma is:", "o": ["BRAF V600E", "RET", "RAS only", "PAX8-PPARG", "TP53"], "k": "A", "x": "BRAF V600E (~45–60%); RET/PTC rearrangements (radiation-associated); RAS in follicular"}, {"n": 16, "s": "Papillary carcinoma spreads first to:", "o": ["Lung", "Central nodes", "Bone", "Liver and spleen", "Brain"], "k": "B", "x": "Lymphatic → central compartment (level VI) then lateral; microscopic nodes common"}, {"n": 17, "s": "Follicular carcinoma spreads mainly by the:", "o": ["Lymphatic", "Perineural", "Transcoelomic", "Direct only", "Haematogenous"], "k": "E", "x": "Haematogenous → bone, lung"}, {"n": 18, "s": "Hürthle cell carcinoma consists of:", "o": ["Clear cells", "C-cells", "Oncocytic cells", "Squamous metaplastic cells", "Spindle cells"], "k": "C", "x": "Oncocytic (Hürthle) cells (mitochondria-rich); less RAI-avid"}, {"n": 19, "s": "Before surgery for medullary thyroid carcinoma, exclude:", "o": ["Hashimoto's thyroiditis", "Lymphoma", "Graves", "Phaeochromocytoma", "Sarcoid"], "k": "D", "x": "Screen RET carriers/MTC for phaeochromocytoma (plasma metanephrines) and hyperparathyroidism; treat phaeo first"}, {"n": 20, "s": "Standard surgery for MTC without lateral nodal disease is:", "o": ["Lobectomy", "TT with level VI", "Isthmusectomy", "Radioactive iodine ablation", "Observation"], "k": "B", "x": "Total thyroidectomy + central neck dissection; lateral ND if nodes or high calcitonin; RAI ineffective (C-cells)"}, {"n": 21, "s": "BRAF-mutant anaplastic carcinoma is treated with:", "o": ["High-dose radioactive iodine", "TSH suppression", "Lobectomy", "Observation", "Dabrafenib-trametinib"], "k": "E", "x": "BRAF V600E anaplastic → dabrafenib + trametinib; all ATC T4; median survival months"}, {"n": 22, "s": "The AJCC 8th age cut-off for differentiated thyroid cancer is:", "o": ["55", "45", "40", "65", "50"], "k": "A", "x": "Age 55 (changed from 45 in AJCC 8th)"}, {"n": 23, "s": "A 40-year-old with papillary carcinoma and lung metastases is AJCC 8th stage:", "o": ["IV", "III", "IVB", "II", "I"], "k": "D", "x": "<55 years: M0 = stage I, M1 = stage II"}, {"n": 24, "s": "For low-risk unifocal PTC 1–4 cm without nodes, ATA 2015 allows:", "o": ["Observation only", "Lobectomy", "Total plus RAI mandatory", "Neck dissection", "RT"], "k": "B", "x": "ATA 2015: lobectomy or total thyroidectomy for 1–4 cm low-risk (cN0, no ETE)"}, {"n": 25, "s": "A low-risk papillary microcarcinoma may be managed by:", "o": ["RAI", "Total thyroidectomy with CND", "Active surveillance", "Chemotherapy", "External RT"], "k": "C", "x": "Active surveillance (Kuma/Japanese data) for low-risk microPTC; or lobectomy"}, {"n": 26, "s": "RAI is not routinely recommended for:", "o": ["Distant metastatic disease", "Gross ETE", "Large tumours", "Nodal disease", "Low-risk microcarcinoma"], "k": "E", "x": "RAI not routinely for low-risk (unifocal/multifocal microcarcinoma); used for intermediate/high risk, distant disease"}, {"n": 27, "s": "TSH suppression is most justified in:", "o": ["High-risk DTC", "Low-risk micro", "Benign nodules", "Elderly cardiac", "Hashimoto"], "k": "A", "x": "TSH <0.1 mU/L for high-risk/structural disease; avoid in low-risk, elderly cardiac, osteoporosis"}, {"n": 28, "s": "Serum thyroglobulin monitoring is unreliable in the presence of:", "o": ["Low TSH", "High calcium", "Normal neck ultrasound findings", "Anti-Tg antibodies", "RAI"], "k": "D", "x": "Tg antibodies (~20–25%) cause falsely low Tg → trend Tg-Ab titres instead"}, {"n": 29, "s": "Prophylactic central neck dissection is considered in PTC with:", "o": ["T1 tumours", "T3–T4 tumours", "Benign nodules", "Graves", "Microcarcinoma"], "k": "B", "x": "Prophylactic CND for advanced primary (T3–T4) or clinically involved lateral nodes"}, {"n": 30, "s": "A major risk factor for PTC is:", "o": ["Smoking", "Alcohol", "Dietary iodine excess only", "HPV", "Childhood radiation"], "k": "E", "x": "Childhood ionising radiation (Chernobyl) → PTC (RET/PTC)"}, {"n": 31, "s": "Rapid thyroid enlargement in an elderly woman with Hashimoto's suggests:", "o": ["Anaplastic carcinoma", "Graves", "Lymphoma", "Riedel's", "Colloid nodule"], "k": "C", "x": "Primary thyroid lymphoma (DLBCL/MALT) in Hashimoto's → core/open biopsy → chemo-RT, not radical surgery"}, {"n": 32, "s": "Preoperative Lugol's iodine in Graves disease is used to:", "o": ["Induce temporary hyperthyroidism", "Increase vascularity", "Treat eye disease", "Reduce gland vascularity", "Replace thionamides"], "k": "D", "x": "Lugol's iodine 7–10 days preop reduces vascularity (Wolff-Chaikoff); patient euthyroid first"}, {"n": 33, "s": "In thyroid storm, iodine should be given:", "o": ["Before thionamides", "After thionamides", "Never", "Alone", "Instead of beta-blockers"], "k": "B", "x": "Thionamide (PTU) first, iodine ≥1 h later (avoid substrate for new hormone); β-blocker, steroids"}, {"n": 34, "s": "Most retrosternal goitres can be removed via a:", "o": ["Sternotomy", "Thoracotomy", "VATS", "Transoral endoscopy", "Cervical incision"], "k": "E", "x": ">95% via cervical incision; sternotomy for posterior mediastinal, ectopic, invasive or recurrent goitre"}, {"n": 35, "s": "Facial plethora on raising both arms in a patient with goitre indicates:", "o": ["Pemberton's sign", "Trousseau", "Chvostek", "Kocher's manoeuvre test", "Graves"], "k": "A", "x": "Pemberton's sign: thoracic inlet obstruction (venous congestion)"}, {"n": 36, "s": "A painful thyroid with raised ESR and low radioiodine uptake suggests:", "o": ["Graves", "Toxic multinodular goitre", "Subacute thyroiditis", "Riedel's", "Lymphoma"], "k": "C", "x": "de Quervain (granulomatous, post-viral): painful, high ESR, low uptake → NSAIDs/steroids"}, {"n": 37, "s": "A woody, fixed thyroid with fibrosis extending beyond the capsule (IgG4-related) is:", "o": ["Hashimoto's", "Graves", "de Quervain", "Riedel's", "Colloid"], "k": "D", "x": "Riedel's: IgG4-related fibrosclerosis, mimics anaplastic/lymphoma; biopsy; steroids/tamoxifen"}, {"n": 38, "s": "A postoperative PTH predicting hypocalcaemia after total thyroidectomy is:", "o": ["Normal", "Very low on day 1", "High", "Rising above normal range", "Irrelevant"], "k": "B", "x": "Low/undetectable PTH (e.g. <1.6 pmol/L or <15 pg/mL) post-op → calcium + calcitriol; normal PTH → safe discharge"}, {"n": 39, "s": "The commonest cause of primary hyperparathyroidism is:", "o": ["Hyperplasia", "Carcinoma", "Double adenoma", "MEN1", "Single adenoma"], "k": "E", "x": "Single adenoma ~85%; hyperplasia ~10–15%; double adenoma ~4%; carcinoma <1%"}, {"n": 40, "s": "First-line localisation for a parathyroid adenoma is:", "o": ["Sestamibi with US", "MRI", "PET", "Angiography", "Selective venous sampling"], "k": "A", "x": "Sestamibi (SPECT-CT) + ultrasound; concordant → focused parathyroidectomy; 4D-CT if discordant"}, {"n": 41, "s": "An indication for parathyroidectomy in asymptomatic PHPT is:", "o": ["Age >70", "Calcium 0.1 mmol above normal", "Normal bone density", "Age under 50", "Normal eGFR"], "k": "D", "x": "Age <50; Ca >0.25 mmol/L (1 mg/dL) above ULN; osteoporosis/fracture; eGFR <60; stones/nephrocalcinosis; hypercalciuria"}, {"n": 42, "s": "The Miami criterion for intraoperative PTH is a fall of:", "o": ["10%", "≥50% at 10 min", "90% after one hour", "25%", "5%"], "k": "B", "x": "≥50% fall from highest pre-excision value at 10 minutes"}, {"n": 43, "s": "Hypercalcaemia with low urinary calcium suggests:", "o": ["PHPT", "Malignancy", "Sarcoid", "Vitamin D excess", "FHH"], "k": "E", "x": "FHH (CaSR): Ca/Cr clearance ratio <0.01 → avoid surgery"}, {"n": 44, "s": "Very high calcium with a palpable neck mass suggests parathyroid carcinoma, treated by:", "o": ["Excision of gland only", "Medical therapy", "En bloc resection", "RAI", "Observation"], "k": "C", "x": "En bloc resection with ipsilateral thyroid lobe ± central nodes; avoid capsular rupture"}, {"n": 45, "s": "MEN1 hyperparathyroidism is treated by:", "o": ["Subtotal parathyroidectomy", "Single gland excision", "RAI", "Cinacalcet as sole therapy", "Observation"], "k": "A", "x": "Multigland hyperplasia → subtotal (3.5-gland) or total + autotransplant; thymectomy"}, {"n": 46, "s": "A missing inferior parathyroid is most often found in the:", "o": ["Carotid sheath", "Tracheo-oesophageal groove", "Thymus", "Retro-oesophageal", "Thyroid"], "k": "C", "x": "Thymus/thyrothymic ligament (third pouch descent); superior gland ectopic → retro-oesophageal/tracheo-oesophageal groove"}, {"n": 47, "s": "Hashimoto's thyroiditis is characterised by:", "o": ["Anti-TPO antibodies", "TSH receptor antibodies", "ANCA", "Anti-dsDNA", "Anti-Ro"], "k": "A", "x": "Anti-TPO (± anti-Tg); TSH-receptor antibodies = Graves"}, {"n": 48, "s": "The key to identification of the recurrent laryngeal nerve during thyroid surgery is:", "o": ["The superior thyroid artery", "The middle thyroid vein", "The inferior thyroid artery", "The parathyroid glands", "With a nerve stimulator"], "k": "C", "x": "(PP ENT-B Q33) — RLN identified in relation to the inferior thyroid artery (Beahrs triangle); nerve stimulation confirms"}, {"n": 49, "s": "Otolaryngologic manifestations of hypothyroidism include all of the following except:", "o": ["Sensorineural hearing loss and tinnitus", "Sinus congestion", "Enlargement of the tongue", "Husky, raspy voice"], "k": "A", "x": "(PP ENT-B Q69) ⚠ — Nasal congestion, macroglossia and hoarse voice are classic; SNHL/tinnitus least consistent → old-bank key A"}, {"n": 50, "s": "Which of the following biochemical profiles is found in patients with primary hyperparathyroidism?", "o": ["Increased serum calcium, increased serum vitamin D, decreased urinary calcium", "Increased serum calcium, increased serum phosphate, decreased serum vitamin D", "Decreased serum phosphate, increased urinary calcium, normal serum vitamin D", "Increased serum phosphate, increased urinary calcium, decreased serum vitamin D", "Increased serum calcium, increased serum phosphate, normal serum vitamin D"], "k": "C", "x": "(PP ENT-B Q71) — PHPT: high Ca, low phosphate, high/normal urinary calcium, normal (or high) vitamin D"}]}, {"c": 4, "t": "Session 5", "d": "Neck Spaces, Deep Neck Infection, Paragangliomas, Neck Trauma", "q": [{"n": 1, "s": "The superficial layer of the deep cervical fascia invests the:", "o": ["Thyroid and trachea", "Prevertebral muscles", "SCM and trapezius", "Carotid only", "Pharynx"], "k": "C", "x": "Superficial (investing) layer: \"two muscles (SCM, trapezius), two glands (parotid, SMG), two spaces (suprasternal, masticator)\""}, {"n": 2, "s": "The middle (visceral) layer of the deep cervical fascia encloses the:", "o": ["SCM", "Parotid", "Longus colli muscles", "Carotid only", "Thyroid and trachea"], "k": "E", "x": "Middle layer: muscular (straps) + visceral (pretracheal, buccopharyngeal) — thyroid, trachea, oesophagus, pharynx"}, {"n": 3, "s": "The danger space extends from the skull base to the:", "o": ["Diaphragm", "Hyoid", "T1", "Clavicular level", "Carina"], "k": "A", "x": "Danger space (between alar and prevertebral fascia): skull base → diaphragm (posterior mediastinum)"}, {"n": 4, "s": "The retropharyngeal space ends inferiorly at about:", "o": ["Hyoid", "C6", "Diaphragm", "T1–T2", "Coccyx"], "k": "D", "x": "Retropharyngeal (between buccopharyngeal and alar): skull base → ~T1–T2 where alar fuses with visceral fascia"}, {"n": 5, "s": "The prevertebral space extends inferiorly to the:", "o": ["Hyoid", "Coccyx", "Carina", "Clavicle", "Cricoid"], "k": "B", "x": "Prevertebral (behind prevertebral fascia): skull base → coccyx (Pott's abscess, spinal infection)"}, {"n": 6, "s": "The parapharyngeal space is an inverted pyramid from the skull base to the:", "o": ["Clavicle", "Cricoid", "Carina", "Thyroid notch", "Hyoid"], "k": "E", "x": "Skull base to greater cornu of hyoid"}, {"n": 7, "s": "The pre- and poststyloid compartments are divided by the:", "o": ["Buccopharyngeal fascia outer layer", "Alar fascia", "Tensor-vascular-styloid fascia", "Mylohyoid", "Platysma"], "k": "C", "x": "Tensor-vascular-styloid fascia separates prestyloid (deep parotid, fat, minor salivary) from poststyloid (carotid sheath, IX–XII, sympathetic chain)"}, {"n": 8, "s": "The poststyloid compartment contains the:", "o": ["Deep parotid", "Minor salivary glands", "Fat only", "ICA, IJV and IX–XII", "Lymph nodes only"], "k": "D", "x": "Poststyloid: ICA, IJV, IX, X, XI, XII, sympathetic chain, nodes → paragangliomas, schwannomas"}, {"n": 9, "s": "The masticator space contains the:", "o": ["Mandibular nerve", "Facial nerve", "Vagus", "Parotid duct origin", "Hypoglossal"], "k": "A", "x": "Masticator: muscles of mastication, ramus/body of mandible, V3, internal maxillary artery"}, {"n": 10, "s": "The sublingual and submaxillary spaces are separated by the:", "o": ["Hyoglossus", "Digastric", "Genioglossus", "Platysma", "Mylohyoid"], "k": "E", "x": "Mylohyoid divides sublingual (above) from submaxillary (below); communicate around its free posterior border"}, {"n": 11, "s": "The carotid sheath is formed by:", "o": ["Superficial layer alone", "All three deep layers", "Alar only", "Platysma", "Buccopharyngeal"], "k": "B", "x": "Contributions from all three layers of deep cervical fascia"}, {"n": 12, "s": "The commonest source of deep neck infection in adults is:", "o": ["Odontogenic", "Tonsillar", "Salivary", "Trauma", "Unknown in most"], "k": "A", "x": "Odontogenic (lower molars) commonest adult source; tonsillar commonest in children"}, {"n": 13, "s": "The imaging of choice for suspected deep neck abscess is:", "o": ["Plain X-ray", "Ultrasound only", "MRI first", "Contrast CT", "PET"], "k": "D", "x": "Contrast-enhanced CT: rim-enhancing collection vs phlegmon; extent, airway, mediastinum"}, {"n": 14, "s": "In diabetics with deep neck abscess, a frequent organism is:", "o": ["Pseudomonas", "Candida", "Klebsiella", "Actinomyces", "Bartonella"], "k": "C", "x": "Klebsiella pneumoniae in diabetics (multiple spaces, higher complications); mixed flora otherwise"}, {"n": 15, "s": "A feared complication of parapharyngeal abscess is:", "o": ["Otitis media", "Maxillary sinusitis", "Trismus only", "Dysphagia", "Carotid erosion"], "k": "E", "x": "Carotid erosion/pseudoaneurysm, IJV thrombophlebitis (Lemierre), mediastinitis, airway obstruction"}, {"n": 16, "s": "Descending necrotising mediastinitis requires:", "o": ["Antibiotics alone", "Thoracic drainage", "Cervical drainage only", "Observation", "Tracheostomy alone"], "k": "B", "x": "Combined cervical and transthoracic (VATS/thoracotomy) drainage + broad antibiotics; mortality ~20–40%"}, {"n": 17, "s": "Cervical necrotising fasciitis is managed by:", "o": ["IV antibiotics alone", "Hyperbaric only", "Observation", "Urgent debridement", "Steroids"], "k": "D", "x": "Urgent radical debridement (repeated), broad-spectrum antibiotics (clindamycin for toxins), ICU"}, {"n": 18, "s": "The safest airway in deep neck infection with trismus is:", "o": ["Awake fibreoptic intubation", "Rapid sequence induction", "Blind nasal", "Laryngeal mask after paralysis", "Cricothyroidotomy first"], "k": "A", "x": "Awake fibreoptic intubation (or tracheostomy under LA); avoid paralysis in a threatened airway"}, {"n": 19, "s": "A submandibular abscess is drained through an incision placed:", "o": ["On the mandible", "Intraorally in every case", "Behind the ear", "Midline", "Two finger-breadths below"], "k": "E", "x": "2 finger-breadths (~2–3 cm) below the mandible → protects marginal mandibular nerve"}, {"n": 20, "s": "A neck abscess in an intravenous drug user should have what before drainage?", "o": ["Nothing", "Ultrasound only", "Vascular imaging", "Biopsy", "Antibiotics only"], "k": "C", "x": "CTA/duplex before drainage — infected pseudoaneurysm (carotid/subclavian) may mimic abscess"}, {"n": 21, "s": "Woody induration, discharging sinuses and sulfur granules suggest:", "o": ["TB", "Cat-scratch disease", "Fungal", "Actinomycosis", "Lymphoma"], "k": "D", "x": "Actinomyces israelii: woody, painless, sinuses, sulfur granules → prolonged high-dose penicillin"}, {"n": 22, "s": "A collar-stud abscess suggests:", "o": ["Actinomycosis", "Tuberculosis", "Branchial cyst", "Lymphoma", "Cat scratch"], "k": "B", "x": "TB cold abscess: deep abscess penetrating deep fascia to collect subcutaneously (\"collar-stud\")"}, {"n": 23, "s": "Neck pain, odynophagia and amorphous calcification anterior to C1–C2 with prevertebral swelling suggest:", "o": ["Retropharyngeal abscess", "Meningitis", "Fracture", "Tumour", "Longus colli tendinitis"], "k": "E", "x": "Acute calcific tendinitis of longus colli: mimics retropharyngeal abscess; no rim enhancement; NSAIDs"}, {"n": 24, "s": "On imaging, a carotid body tumour typically:", "o": ["Splays ICA and ECA", "Displaces ICA anteriorly without splay", "Is avascular", "Is cystic", "Arises from vagus"], "k": "A", "x": "Carotid body tumour splays ICA and ECA (\"lyre sign\"); flow voids on MRI"}, {"n": 25, "s": "A Shamblin III carotid body tumour:", "o": ["Small and separable", "Partially surrounds vessels", "Encases the carotids", "Is malignant", "Is bilateral"], "k": "C", "x": "Shamblin I localised · II partially surrounds · III encases carotids (vascular surgery, possible graft)"}, {"n": 26, "s": "For a suspected carotid body tumour, avoid:", "o": ["MRI", "CTA", "Plasma metanephrines", "Open biopsy", "Ultrasound"], "k": "D", "x": "Open biopsy contraindicated (haemorrhage); imaging + metanephrines diagnose"}, {"n": 27, "s": "A vagal paraganglioma typically:", "o": ["Splays the bifurcation", "Is below the bifurcation", "Arises from carotid body", "Spares the vagus", "Pushes ICA anteriorly"], "k": "E", "x": "Vagal paraganglioma: above bifurcation, displaces ICA anteromedially without splaying; vagal palsy after excision near-certain"}, {"n": 28, "s": "A functional paraganglioma is screened with:", "o": ["Serum calcitonin and CEA", "Plasma metanephrines", "TSH", "Cortisol", "Prolactin"], "k": "B", "x": "Plasma free metanephrines (or urinary fractionated) — treat catecholamine excess before surgery; genetic testing (SDHx)"}, {"n": 29, "s": "A poststyloid mass that separates the ICA from the IJV suggests a:", "o": ["Vagal lesion", "Carotid body tumour", "Sympathetic schwannoma", "Lymph node", "Branchial cyst"], "k": "A", "x": "Lesions of the vagus (schwannoma, paraganglioma) lie between ICA and IJV and separate them; sympathetic schwannoma pushes both anteriorly"}, {"n": 30, "s": "A persistent lateral neck mass in an adult over 40 is most likely:", "o": ["Branchial cyst", "Lipoma", "Reactive node", "Malignant", "Dermoid"], "k": "D", "x": "Adult >40, persistent mass → malignant until proven otherwise (nodal metastasis)"}, {"n": 31, "s": "The first tissue diagnosis for an adult neck mass is:", "o": ["Open biopsy", "Excision", "US-guided FNA", "Frozen section biopsy", "PET"], "k": "C", "x": "US-guided FNA
