ologics:</b> dupilumab = IL-4Rα (blocks IL-4 + IL-13, upstream, dual) · omalizumab = IgE (downstream) · mepolizumab = IL-5 · benralizumab = IL-5Rα · tezepelumab = TSLP</li><li><b>Barosinusitis:</b> frontal (longest, narrowest outflow)</li><li><b>Immunodeficiency in recurrent ARS:</b> selective IgA deficiency commonest; CVID commonest clinically significant</li><li><b>Old-bank keys:</b> inferior meatal antrostomy fails by <b>closure of the window</b> · vasomotor rhinitis ↔ <b>hypothyroidism</b></li></ul><h2>3. CSF leak</h2><ul><li><b>Cause:</b> accidental trauma ~80% (iatrogenic dominates surgical series)</li><li><b>Lateral sphenoid recess leak:</b> <b>Sternberg&#x27;s canal</b> (vidian canal = landmark only)</li><li><b>Endoscopic repair:</b> &gt;90% first attempt</li></ul><h2>4. Tumours</h2><ul><li><b>Juvenile ossifying fibroma:</b> well-defined, eggshell rim, child (fibrous dysplasia = ill-defined ground glass)</li><li><b>Radkowski II:</b> a = minimal PPF · b = full PPF · <b>c = ITF/cheek/behind pterygoid plates</b> · III = skull base/intracranial</li><li><b>AJCC maxillary orbit ladder:</b> T3 floor/medial wall (bone) · T4a <b>anterior</b> orbit · T4b <b>apex</b> (&quot;anterior = a, apex = b&quot;)</li><li><b>AJCC maxillary T3:</b> posterior wall singled out (other wall erosion = T2)</li><li><b>Sinonasal SCC nodes:</b> ~10–15% at presentation; elective neck for T3–4</li><li><b>JNA:</b> complete excision → recurrence seldom; RT not routine adjuvant in adolescents; approach by extent, not age</li><li><b>Always adjuvant RT after resection:</b> esthesioneuroblastoma (NPC is primary RT, not surgery)</li><li><b>Skull base RT dose-limiting:</b> optic nerve/chiasm (~54 Gy) → optic neuropathy</li></ul><h2>5. Stem-reading traps (recurring)</h2><ul><li>&quot;Resection <b>then</b> RT&quot; → excludes tumours treated primarily with RT</li><li>&quot;Can cause&quot; in RT questions → choose the classic dose-limiting organ</li><li>&quot;Which is TRUE&quot; about a tumour → absolute words (all, always, ideal for all) are usually false</li></ul><h2>6. Day 7 gap-closure errors</h2><ul><li><b>Post-transsphenoidal:</b> DI = polyuria + dilute urine + <b>rising Na</b> → desmopressin · SIADH = concentrated urine + falling Na · triphasic DI → SIADH → DI</li><li><b>Traumatic optic neuropathy:</b> no proven benefit from steroids (IONTS); high-dose steroids harmful in head injury (CRASH); decompression individualised</li><li><b>Leprosy:</b> anaesthetic patches + thickened nerves; nose often first site; cartilaginous septum — MDT (dapsone, rifampicin, clofazimine)</li><li><b>Nasal diphtheria:</b> unilateral serosanguinous discharge + <b>grey membrane</b> (FB = foul, no membrane)</li><li><b>Antihistamines:</b> treat itch–sneeze–drip; <b>poor for congestion</b> (INCS/decongestant)</li><li><b>Septal destruction pattern:</b> syphilis = bone · TB/leprosy = cartilage</li></ul><h2>7. Debated past-paper keys — exam strategy</h2><ul><li>ENT-A Q10 immunodeficiency age → <b>6</b></li><li>ENT-A Q66 SCC + adenocarcinoma 5-yr survival → <b>50–70%</b></li><li>ENT-B Q91 frontal sinus fully developed → <b>16</b></li><li>ENT-B Q92 structure in sphenoid wall → <b>ICA</b> (optic nerve also — choose ICA)</li><li>ENT-A Q98 / ENT-B Q52 paediatric nasal fracture EXCEPT → <b>stenting in infants &lt;6 months</b></li><li>ENT-B Q41 failed cleft palate closures → <b>prosthesis</b></li></ul><h2>8. Day 8 completion errors</h2><ul><li><b>Osteitis on CT</b> = refractory CRS (fungal ball = internal hyperdensity/microcalcification)</li><li><b>Ageing nose:</b> weakened tip support → ptosis; skin elasticity <b>decreases</b>; olfactory epithelium decreases</li><li><b>Hutchinson sign:</b> nasal tip = external nasal branch of <b>nasociliary (V1)</b> → eye involvement (ala/cheek = V2)</li><li><b>Infraorbital nerve:</b> in the <b>roof</b> of the maxillary sinus (orbital floor); exits on the anterior wall</li><li><b>Nasal conditioning:</b> ~95% humidity, ~31–34 °C at nasopharynx</li><li><b>Nose = ~half</b> of total airway resistance</li><li><b>SCIT observation:</b> 30 minutes</li><li><b>Infertility + sinusitis + bronchiectasis:</b> CF = absent vas, +sweat test · PCD/Kartagener = immotile sperm, low nasal NO · <b>Young = obstructive azoospermia, normal tests</b></li><li><b>Primary cortices:</b> hearing = Heschl&#x27;s · <b>smell = piriform</b> · taste = insula · vision = calcarine</li><li><b>Dupilumab:</b> conjunctivitis, transient eosinophilia</li><li>ENT-A Q96 ageing nose → <b>decrease in olfactory epithelium</b> ⚠</li></ul>", "2": "<p><b>Dr. Abdalhadi Seyam | Built from Laryngology Days 1–6 errors | Read daily until exam</b></p><h2>1. Microanatomy (main weak cluster)</h2><ul><li><b>Cuneiform = Wrisberg · Corniculate = Santorini</b> (both in the AE fold)</li><li><b>Galen&#x27;s anastomosis:</b> internal SLN ↔ <b>RLN</b> posterior branch (sensory)</li><li><b>Body-cover (Hirano):</b> cover = <b>epithelium + SLP (Reinke&#x27;s)</b> · transition = vocal ligament (ILP + DLP) · body = vocalis</li><li><b>True fold free edge:</b> non-keratinised stratified squamous · rest of larynx = respiratory epithelium</li><li><b>Membranous glottis:</b> <b>anterior 3/5</b> (vibratory) · cartilaginous posterior 2/5</li><li><b>Elastic membranes:</b> quadrangular = <b>AE folds + false folds</b> (supraglottic) · conus elasticus = vocal ligament + cricothyroid ligament (subglottic barrier)</li><li><b>Broyles&#x27; ligament:</b> <b>anterior commissure</b> tendon, no perichondrium → early cartilage invasion</li><li><b>Delphian node:</b> <b>prelaryngeal</b> (level VI) on the cricothyroid membrane → poor prognosis</li></ul><h2>2. Physiology &amp; voice assessment</h2><ul><li><b>Stroboscopy:</b> <b>Talbot&#x27;s law</b> (persistence of vision ~0.2 s)</li><li><b>Swallow closure order:</b> <b>true folds first</b> → false folds/arytenoids → epiglottis last</li><li><b>s/z ratio:</b> normal ~1.0 · <b>&gt;1.4 = glottic pathology</b> · both short = respiratory</li><li><b>Cricothyroid membrane:</b> ~<b>10 mm</b> high × 22–30 mm wide; incise lower third</li></ul><h2>3. Surgical anatomy</h2><ul><li><b>Mediastinoscopy dark bleeding at right main bronchus = azygos vein</b> (ENT-B Q36)</li></ul><h2>4. Day 2 errors</h2><ul><li><b>RSI &gt;13</b> (patient symptoms) vs <b>RFS &gt;7</b> (endoscopic findings) — &quot;bigger number = Symptoms&quot;</li><li><b>Teflon = abandoned</b> (granuloma, migration); CaHA is a current long-lasting injectable (place deep, lateral)</li><li><b>Essential voice tremor: 4–7 Hz</b>, regular, sustained vowel; botulinum/propranolol</li><li><b>MTD:</b> supraglottic squeeze with <b>normal folds</b> · presbylaryngis = bowing + gap (structural)</li><li><b>Laser airway fire: FiO2 &lt;30%</b>, no N2O, saline-filled cuff, wet pledgets</li><li>ENT-B Q63 voice production &quot;not important&quot; → <b>None of the above</b> ⚠</li></ul><h2>5. Day 2 debated past-paper keys</h2><ul><li>ENT-A Q30 laryngeal TB → <b>positive chest radiograph</b></li><li>ENT-B Q31 CA arthritis vs paralysis → <b>laryngeal EMG</b></li><li>ENT-B Q63 → <b>none of the above</b></li></ul><h2>6. Day 3 errors</h2><ul><li><b>Laryngeal chondrosarcoma:</b> <b>posterior cricoid lamina</b> (~70%), popcorn calcification, conservative excision</li><li><b>Sarcomatoid (spindle cell) carcinoma:</b> polypoid, spindle cells <b>cytokeratin/p63+</b> → treat as SCC · IMT = SMA/ALK+</li><li><b>CICO (DAS):</b> <b>scalpel–bougie–tube cricothyroidotomy</b> · needle in children &lt;12 · awake fibreoptic = planned difficult airway only</li><li><b>Tracheal resection:</b> up to <b>~50%</b> (5–6 cm) with release; neck flexion post-op</li><li><b>Combination options (B and C):</b> mark each statement T/F first, then match the combination</li><li><b>Primary tracheal malignancy:</b> <b>SCC + adenoid cystic</b> (~2/3) (ENT-B Q66)</li><li>ENT-A Q34 commonest tracheotomy complication → <b>haemorrhage</b> ⚠</li><li>ENT-A Q32 early glottic decision → <b>anterior commissure</b> ⚠</li></ul><h2>7. Day 4 — Swallowing (weakest cluster)</h2><ul><li><b>UES opening</b> = hyolaryngeal elevation (suprahyoid traction) + CP <b>relaxation</b> + bolus pressure</li><li><b>Silent aspiration</b> → only FEES/VFSS detect it; bedside test misses up to ~40%</li><li><b>PAS:</b> 1 normal · 2–5 penetration · 6–8 aspiration · <b>8 = silent</b></li></ul><table><tr><th>Manoeuvre</th><th>Action</th></tr><tr><td>Chin tuck</td><td>Narrows laryngeal inlet, widens valleculae</td></tr><tr><td><b>Head turn → toward WEAK side</b></td><td>Closes weak pyriform, bolus down strong side</td></tr><tr><td><b>Mendelsohn</b></td><td>Hold larynx up → <b>prolongs UES opening</b></td></tr><tr><td><b>Shaker</b></td><td>Head lift supine → <b>suprahyoid</b> strength</td></tr><tr><td>Supraglottic swallow</td><td>Folds close before/during swallow</td></tr><tr><td>Effortful swallow</td><td>↑ tongue base pressure</td></tr><tr><td>Masako</td><td>Tongue hold → constrictor strength</td></tr></table><ul><li><b>Cricopharyngeal bar:</b> smooth, dynamic indentation at C5–6 · osteophyte = fixed, bony</li><li><b>Aspiration surgery ladder:</b> medialisation → CP myotomy → <b>laryngotracheal separation (reversible)</b> → total laryngectomy (permanent)</li></ul><h2>8. Day 4 — Oesophagus</h2><ul><li><b>EoE ≥15 eos/HPF</b> (eCRS ≥10/HPF)</li><li><b>Alkali = liquefactive (oesophagus, deep)</b> · acid = coagulative (stomach)</li><li><b>Boerhaave:</b> distal <b>left</b> posterolateral wall · iatrogenic = cervical</li></ul><h2>9. Day 4 — Sleep</h2><ul><li><b>Adult AHI:</b> mild 5–14 · moderate 15–29 · <b>severe ≥30</b></li><li><b>Friedman I</b> (big tonsils, low tongue, BMI &lt;40) → UPPP ~80% · III ~8%</li><li><b>VOTE</b> = DISE collapse sites (Velum, Oropharynx, Tongue base, Epiglottis)</li><li><b>Cheyne-Stokes</b> = central apnoea → <b>heart failure</b></li><li>ENT-A Q26 hypopharynx → <b>distant metastases</b> dominant failure</li><li>ENT-B Q61 desaturation more severe → <b>obstructive</b> ⚠</li></ul><h2>10. Day 5 clinical errors</h2><ul><li><b>Chronic cough ladder:</b> red flags (CXR, smoking, ACEi) → treat rhinitis/UACS, asthma, reflux → refractory with laryngeal tickle = <b>neurogenic cough → gabapentin/amitriptyline + SLT</b></li><li><b>Tongue fasciculations + bulbar signs = MND</b> (LMN sign) · MS = UMN, no fasciculations</li><li><b>Fatigable voice + ptosis = myasthenia → anti-AChR</b> (± anti-MuSK, CT thymus)</li><li><b>Obstructing laryngeal cancer before laryngectomy → transoral debulking</b> (avoid tracheostomy: stomal recurrence) · tracheostomy only if debulking impossible</li><li><b>TEP leak:</b> through centre = replace prosthesis · around = shrink tract (temporary removal/smaller)</li></ul><h2>11. Day 6 gap-closure errors</h2><ul><li><b>ELS Va–Vd:</b> a = <b>anterior</b> (contralateral + AC) · <b>b = back (arytenoid)</b> · c = caudal (subglottis) · d = ventricle</li><li><b>THRIVE</b> = high-flow nasal cannula apnoeic oxygenation (no barotrauma) · jet = intermittent high-pressure (barotrauma)</li><li><b>Cuff pressure 20–30 cmH2O</b> (below capillary perfusion ~30)</li><li><b>Commonest laryngeal NET = atypical carcinoid</b> (surgery + neck; poor RT/chemo response)</li><li><b>PemphiGUS = superficial</b> (desmoglein 3, intraepithelial, Nikolsky+) · <b>pemphiGOID = deep</b> (BP180, subepithelial, scarring)</li><li><b>Behçet&#x27;s:</b> oral + genital ulcers + <b>positive pathergy</b></li><li><b>Ford sulcus:</b> I physiological · II vergeture (linear, tethered) · <b>III pocket into ligament</b></li><li><b>Scleroderma:</b> absent distal peristalsis + hypotensive LES (achalasia = non-relaxing LES)</li><li><b>Physics:</b> Bernoulli = fold closure · <b>Venturi = jet entrainment</b> · Talbot = stroboscopy · Poiseuille = stenosis resistance</li><li><b>Oesophageal speech</b> = injected oesophageal air (no device) · TEP = lung air via valve</li></ul><h2>12. Sleep definitions (new weak cluster)</h2><ul><li><b>Narcolepsy:</b> MSLT mean latency <b>≤8 min + ≥2 SOREMPs</b>; type 1 = cataplexy, low hypocretin</li><li><b>OHS:</b> BMI ≥30 + awake <b>PaCO2 &gt;45 mmHg</b>; HCO3 &gt;27 screen → NIV</li><li><b>UARS:</b> <b>RERAs with AHI &lt;5</b>, normal SpO2, high RDI</li><li><b>Central apnoea:</b> heart failure (Cheyne-Stokes), opioids (reduce dose), stroke</li><li><b>HSAT unsuitable:</b> cardiopulmonary/neuromuscular disease, suspected central apnoea, other sleep disorders</li><li>ENT-B Q12 squamous → respiratory junction → <b>glottic–subglottic</b> ⚠</li></ul>", "3": "<p><b>Dr. Abdalhadi Seyam | Built from Paediatrics Day 1 errors | Read daily until exam</b></p><h2>1. Tracheal &amp; vascular anomalies (weak cluster)</h2><ul><li><b>Tracheomalacia ↔ oesophageal atresia/TOF</b> (~75%) — brassy &quot;TOF cough&quot;, expiratory stridor, dying spells → aortopexy/posterior tracheopexy if severe</li><li><b>Barium patterns:</b></li><li><b>Double aortic arch / right arch = posterior</b> oesophageal indentation (complete ring)</li><li><b>Pulmonary artery sling = anterior</b> oesophageal indentation (passes between trachea and oesophagus) → ~50% complete tracheal rings (&quot;ring-sling&quot;)</li><li><b>Innominate compression:</b> normal barium; pulsatile <b>anterior</b> tracheal compression → aortopexy</li><li><b>Long-segment complete rings → slide tracheoplasty</b> (never dilate/laser); mild short segment may be observed</li></ul><h2>2. Airway emergencies</h2><ul><li><b>Oesophageal button battery → immediate rigid oesophagoscopy under GA</b> (necrosis within ~2 h) — not flexible under sedation (airway unprotected); honey/sucralfate en route if &gt;1 yr and &lt;12 h</li><li><b>Vallecular cyst</b> → sudden obstruction, SIDS association (ENT-A Q85 ⚠)</li></ul><h2>3. Numbers</h2><ul><li><b>EDAC/TBM:</b> &gt;50% expiratory narrowing</li><li>Laryngomalacia ~60% · surgery ~10–20% · resolves 12–24 months</li><li>Propranolol 1–3 mg/kg/day · dexamethasone croup 0.15–0.6 mg/kg</li><li>Prevertebral &gt;7 mm at C2 (&gt;14 mm at C6)</li><li>TOF type C ~85%</li></ul>"};
const TOTAL=1950;

const L='ABCDEF';
let S={sel:new Set(DATA.map((_,i)=>i)),order:'book',list:[],pos:0,ans:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const id=(c,n)=>c+'-'+n;
const navOff=()=>document.querySelector('.nav')?.remove();
function home(){
  navOff();
  const total=[...S.sel].reduce((a,c)=>a+DATA[c].q.length,0), answered=Object.keys(S.ans).length, right=Object.values(S.ans).filter(a=>a.ok).length;
  let h=`<div class="cover"><div class="k">ENT Board Question Book</div><h1>Abdalhadi Project</h1><p class="sub" style="margin:0">Dr. Abdalhadi Seyam · Palestinian Board Part II preparation. ${TOTAL} single-best-answer questions in ${CH.length} chapters and ${DATA.length} sessions, each with key and explanation.</p>
  <div class="stats"><div><b>${TOTAL}</b><span>questions</span></div><div><b>${DATA.length}</b><span>sessions</span></div><div><b>${answered}</b><span>answered</span></div><div><b>${answered?Math.round(right/answered*100)+'%':'–'}</b><span>correct</span></div></div></div>`;
  CH.forEach((ch,ci)=>{const n=ch.s.reduce((a,s)=>a+DATA[s].q.length,0);const allOn=ch.s.every(s=>S.sel.has(s));
    h+=`<div class="chhead"><h2>Chapter ${ci+1} · ${esc(ch.t)}</h2><span class="cnt">${n}</span>${NOTES[ci]?`<button class="mini" onclick="notes(${ci})">Notes</button>`:''}<button class="mini" onclick="chapTog(${ci})">${allOn?'Clear':'Select'}</button></div>`;
    ch.s.forEach(si=>{const s=DATA[si];const done=s.q.filter(q=>S.ans[id(si,q.n)]).length;
      h+=`<button class="chap ${S.sel.has(si)?'on':''}" onclick="tog(${si})" aria-pressed="${S.sel.has(si)}"><span class="no">${si-ch.s[0]+1}</span><b>${esc(s.t)}<small>${esc(s.d)}</small></b>${done?`<span class="done">${done} done</span>`:''}<span>${s.q.length}</span></button>`})});
  h+=`<div class="row"><div class="seg" role="group" aria-label="Order"><button class="${S.order=='book'?'on':''}" onclick="S.order='book';home()">Book order</button><button class="${S.order=='shuf'?'on':''}" onclick="S.order='shuf';home()">Shuffled</button></div>
  <div class="seg"><button onclick="S.sel=new Set(DATA.map((_,i)=>i));home()">All</button><button onclick="S.sel=new Set();home()">None</button></div></div>
  <button class="primary" ${total?'':'disabled'} onclick="start()">Start ${total} questions</button>
  ${answered?`<div class="row"><button class="ghost" style="flex:1" onclick="results()">Results so far</button><button class="ghost" style="flex:1" onclick="if(confirm('Clear all answers?')){S.ans={};home()}">Clear answers</button></div>`:''}
  <p class="note" style="margin-top:18px">Tap a session to include or exclude it; use Select/Clear for a whole chapter. Notes open the chapter fix sheet. Answers are kept while this page is open.</p>`;
  $('#app').innerHTML=h;scrollTo(0,0)}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);const y=scrollY;home();scrollTo(0,y)}
function chapTog(ci){const ch=CH[ci];const allOn=ch.s.every(s=>S.sel.has(s));ch.s.forEach(s=>allOn?S.sel.delete(s):S.sel.add(s));const y=scrollY;home();scrollTo(0,y)}
function notes(ci){navOff();$('#app').innerHTML=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()">Chapters</button><span class="t">Chapter ${ci+1} · ${esc(CH[ci].t)} · Fix sheet</span></div></div><div class="notes">${NOTES[ci]}</div><div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;scrollTo(0,0)}
function start(list){
  if(!list){list=[];[...S.sel].sort((a,b)=>a-b).forEach(c=>DATA[c].q.forEach(q=>list.push([c,q.n])));
    if(S.order=='shuf')for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.pos=0;const f=list.findIndex(([c,n])=>!S.ans[id(c,n)]);if(f>0)S.pos=f;show()}
function Qof(c,n){return DATA[c].q.find(q=>q.n==n)}
function score(){let a=0,r=0;S.list.forEach(([c,n])=>{const x=S.ans[id(c,n)];if(x){a++;if(x.ok)r++}});return{a,r}}
function show(){
  const [c,n]=S.list[S.pos];const q=Qof(c,n);const A=S.ans[id(c,n)];const {a,r}=score();const s=DATA[c];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="home()" aria-label="Back to chapters">Chapters</button><span class="t">${esc(CH[s.c].t)} · ${esc(s.t)}</span><span class="sc">${r}/${a}</span></div><div class="bar"><i style="width:${(S.pos+1)/S.list.length*100}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${S.list.length} &nbsp;·&nbsp; ${esc(s.t)} Q${n}</div><p class="stem">${esc(q.s)}</p>`;
  q.o.forEach((t,i)=>{const l=L[i];let cl='';if(A){if(l==q.k)cl='ok';else if(A.pick==l)cl='bad'}
    h+=`<button class="opt ${cl}" ${A?'disabled':''} onclick="choose('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(A){h+=`<div class="exp"><h3 class="${A.ok?'ok':'bad'}">${A.ok?'Correct':'Incorrect'} — answer ${q.k}</h3>`+q.x.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')+`<p class="note" style="margin:6px 0 0">${esc(CH[s.c].t)} · ${esc(s.t)} — ${esc(s.d)}</p></div>`}
  $('#app').innerHTML=h;
  let nav=document.querySelector('.nav');if(!nav){nav=document.createElement('div');nav.className='nav';document.body.appendChild(nav)}
  const last=S.pos==S.list.length-1;
  nav.innerHTML=`<div class="navi"><button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Jump</button><button class="primary" onclick="${last?'results()':'go(1)'}">${last?'Finish':'Next'}</button></div>`;
  scrollTo(0,0)}
function choose(l){const [c,n]=S.list[S.pos];const q=Qof(c,n);const k=id(c,n);if(S.ans[k]||L.indexOf(l)>=q.o.length)return;S.ans[k]={pick:l,ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function results(){navOff();
  let rows='',ta=0,tr=0,wrong=[];
  CH.forEach((ch,ci)=>{let ca=0,cr=0,sub='';ch.s.forEach(si=>{let a=0,r=0;DATA[si].q.forEach(q=>{const x=S.ans[id(si,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([si,q.n])}});ca+=a;cr+=r;if(a)sub+=`<tr><td style="padding-left:16px;color:var(--muted)">${esc(DATA[si].t)}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
    ta+=ca;tr+=cr;if(ca)rows+=`<tr><td><b>${esc(ch.t)}</b></td><td><b>${cr}/${ca} · ${Math.round(cr/ca*100)}%</b></td></tr>`+sub});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>delete S.ans[id(c,n)]);start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if(e.key.length==1&&'abcdef'.includes(e.key.toLowerCase()))choose(e.key.toUpperCase())});
home();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
