6, "s": "Sudden SNHL is defined as a loss of at least:", "o": ["10 dB in 1 frequency over 1 week", "20 dB in 2 frequencies over 1 month", "30 dB in 3 consecutive frequencies within 72 hours", "40 dB in 4 frequencies within 24 hours", "50 dB in any frequency within 72 hours"], "k": "C", "x": "≥30 dB over 3 consecutive frequencies within 72 hours (AAO-HNS)"}, {"n": 27, "s": "A patient has a second episode of facial palsy on the same side. The next step is:", "o": ["Steroids and observe", "Antivirals", "Decompression", "MRI with gadolinium", "Lyme serology only"], "k": "D", "x": "Recurrent ipsilateral palsy → MRI to exclude facial schwannoma/neoplasm. Recurrent alternating → Melkersson-Rosenthal, Lyme, diabetes"}, {"n": 28, "s": "A 60-year-old smoker has right otalgia with a normal ear examination. The next step is:", "o": ["Dental review", "TMJ X-ray", "Analgesics and reassurance", "Audiometry", "Flexible laryngoscopy"], "k": "E", "x": "Normal ear + otalgia in smoker → referred pain; exclude upper aerodigestive tract malignancy (laryngoscopy, palpate tongue base)"}, {"n": 29, "s": "A 75-year-old has a 9 mm intracanalicular vestibular schwannoma with serviceable hearing. Management is:", "o": ["Middle fossa excision", "MRI surveillance", "Translabyrinthine excision", "Stereotactic radiosurgery now", "Retrosigmoid excision"], "k": "B", "x": "Small, elderly, good hearing → wait and scan (MRI 6 months, then yearly)"}, {"n": 30, "s": "A 35-year-old has a 3.5 cm vestibular schwannoma compressing the brainstem. Management is:", "o": ["Microsurgical resection", "MRI surveillance", "Stereotactic radiosurgery", "Bevacizumab", "Fractionated radiotherapy"], "k": "A", "x": ">3 cm with brainstem compression → microsurgery; SRS unsuitable"}, {"n": 31, "s": "A young NF2 patient has growing bilateral vestibular schwannomas with declining hearing. Medical therapy is:", "o": ["Tamoxifen", "Octreotide", "Bevacizumab", "Imatinib", "Steroids"], "k": "C", "x": "Bevacizumab (anti-VEGF): tumour shrinkage and hearing improvement in NF2"}, {"n": 32, "s": "A woman with pulsatile tinnitus has a red mass on the promontory; CT shows an intact jugular plate. Management is:", "o": ["Radiotherapy", "Biopsy", "Infratemporal fossa approach", "Observation", "Transcanal or transmastoid excision"], "k": "E", "x": "Glomus tympanicum with intact jugular plate → transcanal (small) or transmastoid/extended facial recess (larger)"}, {"n": 33, "s": "A 5-year-old with no history of otitis has a white mass behind an intact drum. Management is:", "o": ["Observation", "Surgical excision", "Grommet insertion", "Antibiotics", "Autoinflation"], "k": "B", "x": "Congenital cholesteatoma → surgical excision (often closed technique if early)"}, {"n": 34, "s": "A red retrotympanic mass; CT shows a tubular mass entering the middle ear via an enlarged inferior tympanic canaliculus with absent vertical carotid canal. The diagnosis is:", "o": ["Aberrant internal carotid artery", "Glomus tympanicum", "High jugular bulb", "Persistent stapedial artery", "Cholesterol granuloma"], "k": "A", "x": "Aberrant ICA — never biopsy/myringotomy (catastrophic bleeding)"}, {"n": 35, "s": "A blue tympanic membrane in a patient with long-standing OME and no trauma suggests:", "o": ["Haemotympanum from trauma", "Glomus tympanicum", "Aberrant carotid", "Cholesterol granuloma", "Congenital cholesteatoma"], "k": "D", "x": "Cholesterol granuloma (\"idiopathic haemotympanum\") → grommet, may need mastoidectomy"}, {"n": 36, "s": "A boy has progressive bilateral SNHL and haematuria. The likely diagnosis is:", "o": ["Alport syndrome", "Pendred syndrome", "Usher syndrome", "Branchio-oto-renal syndrome", "Waardenburg syndrome"], "k": "A", "x": "Alport: COL4A5, X-linked, nephritis + progressive SNHL + lenticonus"}, {"n": 37, "s": "A child with congenital profound SNHL had syncope during exercise. The essential investigation is:", "o": ["MRI brain", "ECG", "Thyroid function", "Renal ultrasound", "Fundoscopy"], "k": "B", "x": "Jervell and Lange-Nielsen: AR, KCNQ1/KCNE1, prolonged QT → sudden death; ECG mandatory in congenital profound SNHL"}, {"n": 38, "s": "A child with SNHL, a white forelock and heterochromia also has dystopia canthorum. This indicates Waardenburg type:", "o": ["II", "III", "I", "IV", "V"], "k": "C", "x": "Type I: dystopia canthorum (PAX3). Type II: none. Type III: limb anomalies. Type IV: Hirschsprung"}, {"n": 39, "s": "A deaf child develops night blindness. The diagnosis is:", "o": ["Alport syndrome", "Pendred syndrome", "Jervell and Lange-Nielsen", "Norrie disease", "Usher syndrome"], "k": "E", "x": "Usher: SNHL + retinitis pigmentosa (night blindness first)"}, {"n": 40, "s": "Per the 1-3-6 rule, a newborn who fails hearing screening should have diagnosis confirmed by:", "o": ["1 month", "2 months", "6 months", "3 months", "12 months"], "k": "D", "x": "Screen by 1 month, diagnose by 3, intervene by 6 months"}, {"n": 41, "s": "During stapedotomy, the whole footplate becomes mobilised (\"floating\"). The safest action is:", "o": ["Abort and stage the procedure", "Extract the footplate with a pick", "Place a piston on the floating footplate", "Perform total stapedectomy", "Fenestrate with a microdrill"], "k": "A", "x": "Floating footplate → abort; restage after healing (or laser fenestration). Extraction risks dead ear"}, {"n": 42, "s": "One week after stapedotomy, a patient develops vertigo and declining SNHL. The likely cause and action are:", "o": ["Normal recovery — reassure", "Labyrinthitis — oral antibiotics", "Prosthesis displacement — review at 3 months", "Reparative granuloma — urgent re-exploration", "BPPV — Epley manoeuvre"], "k": "D", "x": "Reparative granuloma (1–6 weeks) → urgent re-exploration to save hearing"}, {"n": 43, "s": "The most common complaint after stapes surgery is:", "o": ["Vertigo", "Tinnitus", "Facial weakness", "SNHL", "Taste disturbance"], "k": "E", "x": "Chorda tympani stretch/section → dysgeusia; most resolve"}, {"n": 44, "s": "In bilateral otosclerosis, stapedotomy is performed first on the:", "o": ["Better-hearing ear", "Left ear", "Worse-hearing ear", "Ear with Schwartze sign", "Ear with larger Carhart notch"], "k": "C", "x": "Worse ear first; second ear only after good result (≥6–12 months)"}, {"n": 45, "s": "Disabling posterior canal BPPV fails repeated repositioning for a year. The surgical option is:", "o": ["Vestibular nerve section", "Posterior canal occlusion", "Labyrinthectomy", "Endolymphatic sac decompression", "Cochlear implantation"], "k": "B", "x": "Posterior canal occlusion (~95% success, low hearing risk). Singular neurectomy = alternative, technically demanding"}, {"n": 46, "s": "Right lateral canal BPPV with geotropic nystagmus is treated with:", "o": ["Epley manoeuvre", "Semont manoeuvre", "Brandt-Daroff exercises only", "Vestibular suppressants", "Barbecue (Lempert) roll"], "k": "E", "x": "Barbecue roll toward the healthy side; or Gufoni"}, {"n": 47, "s": "A patient with acute vestibular neuritis is in day 3. Best management is:", "o": ["Long-term vestibular suppressants", "Bed rest for 2 weeks", "Early vestibular rehabilitation, short steroid course", "Antivirals alone", "Intratympanic gentamicin"], "k": "C", "x": "Suppressants only 2–3 days; early rehab; steroids may improve caloric recovery"}, {"n": 48, "s": "Unilateral Ménière's fails diet and diuretics; hearing is serviceable. The next step (AAO-HNS 2020) is:", "o": ["Intratympanic steroids", "Intratympanic gentamicin", "Vestibular nerve section", "Labyrinthectomy", "Cochlear implant"], "k": "A", "x": "AAO-HNS 2020: IT steroids before ablative IT gentamicin"}, {"n": 49, "s": "Episodic vertigo lasting 5 minutes to 72 hours with photophobia and a normal audiogram suggests:", "o": ["Ménière's disease", "BPPV", "Vestibular neuritis", "Vestibular migraine", "Perilymph fistula"], "k": "D", "x": "Vestibular migraine (Bárány): 5 min–72 h, migraine features in ≥50% of episodes"}, {"n": 50, "s": "Definitive treatment for disabling superior canal dehiscence is:", "o": ["Stapedotomy", "Plugging or resurfacing of the canal", "Grommet insertion", "Intratympanic gentamicin", "Hearing aid"], "k": "B", "x": "Middle fossa or transmastoid plugging/resurfacing"}]}, {"c": 0, "t": "Session 6", "d": "Gap closure", "q": [{"n": 1, "s": "Hypersusceptibility to aminoglycoside ototoxicity is linked to:", "o": ["GJB2 35delG", "SLC26A4", "OTOF", "Mitochondrial A1555G", "KCNQ1"], "k": "D", "x": "MT-RNR1 A1555G (maternal inheritance): profound loss even after a single dose; screen in at-risk families"}, {"n": 2, "s": "Ototoxicity that is typically reversible is caused by:", "o": ["Gentamicin", "Salicylates", "Cisplatin", "Streptomycin", "Carboplatin"], "k": "B", "x": "Salicylates: flat SNHL + tinnitus, reverses on stopping. Loop diuretics also usually reversible"}, {"n": 3, "s": "Loop diuretic ototoxicity primarily affects the:", "o": ["Inner hair cells", "Outer hair cells", "Spiral ganglion", "Basilar membrane", "Stria vascularis"], "k": "E", "x": "Stria vascularis oedema (↓ EP); synergistic with aminoglycosides"}, {"n": 4, "s": "The agent approved to reduce cisplatin ototoxicity in children is:", "o": ["Sodium thiosulfate", "N-acetylcysteine", "Amifostine", "Dexamethasone", "Vitamin E"], "k": "A", "x": "Sodium thiosulfate (FDA 2022) for localised paediatric solid tumours; amifostine ineffective for hearing"}, {"n": 5, "s": "The earliest detection of drug ototoxicity is by:", "o": ["Speech audiometry", "Tympanometry", "Extended high-frequency audiometry", "Click ABR", "Acoustic reflexes"], "k": "C", "x": "Extended high-frequency (>8 kHz) audiometry and DPOAEs detect earliest change"}, {"n": 6, "s": "Persistent postural-perceptual dizziness (PPPD) is characterised by:", "o": ["Brief vertigo on lying down", "Attacks with fluctuating hearing", "Daily unsteadiness ≥3 months, worse with visual motion", "Rocking sensation after a voyage", "Seconds-long attacks with head turns"], "k": "C", "x": "PPPD (Bárány): ≥3 months, worse upright, active/passive motion, complex visual stimuli; SSRIs + VRT + CBT"}, {"n": 7, "s": "Vestibular paroxysmia (seconds-long attacks from neurovascular compression) responds to:", "o": ["Betahistine", "Epley manoeuvre", "Intratympanic gentamicin", "Vestibular rehabilitation", "Carbamazepine"], "k": "E", "x": "Carbamazepine/oxcarbazepine; response supports the diagnosis"}, {"n": 8, "s": "In mal de débarquement syndrome, symptoms:", "o": ["Improve during passive motion", "Worsen while driving", "Come with hearing loss", "Are triggered by head position", "Respond to the Epley manoeuvre"], "k": "A", "x": "Rocking/swaying after travel; temporarily relieved by passive motion (e.g. driving)"}, {"n": 9, "s": "The commonest identified cause of bilateral vestibulopathy is:", "o": ["Bilateral Ménière's", "Meningitis", "Autoimmune inner ear disease", "Aminoglycoside ototoxicity", "Bilateral vestibular schwannoma"], "k": "D", "x": "Aminoglycosides (gentamicin) — oscillopsia, ataxia in dark; then idiopathic, Ménière's, meningitis"}, {"n": 10, "s": "A vasculopath has acute vertigo, sudden unilateral hearing loss and ipsilateral facial weakness. The likely diagnosis is:", "o": ["PICA infarct", "AICA infarct", "Viral labyrinthitis", "Vestibular neuritis", "Ménière's attack"], "k": "B", "x": "AICA supplies labyrinth (labyrinthine artery) + lateral pons → vertigo + deafness + VII. Don't call it labyrinthitis in a vasculopath"}, {"n": 11, "s": "Lateral medullary (Wallenberg) syndrome includes vertigo with:", "o": ["Ipsilateral deafness", "Ipsilateral facial palsy", "Ipsilateral hemiparesis", "Aphasia", "Ipsilateral Horner's"], "k": "E", "x": "PICA: vertigo, ipsilateral Horner's, dysphagia/hoarseness (IX/X), crossed sensory loss — no hearing loss"}, {"n": 12, "s": "Benign paroxysmal vertigo of childhood is regarded as a:", "o": ["Migraine precursor", "Otolith disorder", "Epilepsy variant", "Inner ear malformation", "Viral infection"], "k": "A", "x": "Migraine precursor; brief attacks in toddlers, normal between, resolves; family migraine history"}, {"n": 13, "s": "The best hearing results in ossiculoplasty are obtained in Austin group:", "o": ["D (malleus absent, stapes absent)", "B (malleus present, stapes absent)", "A (malleus present, stapes present)", "C (malleus absent, stapes present)", "Fixed footplate"], "k": "C", "x": "Austin A (malleus + stapes present) → best; D (both absent) → worst"}, {"n": 14, "s": "Absent stapes superstructure with a mobile footplate is best reconstructed with:", "o": ["PORP", "Incus interposition on stapes head", "Stapedotomy piston", "TORP", "Malleus graft"], "k": "D", "x": "TORP from footplate to TM/malleus. PORP needs stapes superstructure"}, {"n": 15, "s": "Ossicular prosthesis extrusion is reduced by:", "o": ["Hydroxyapatite prosthesis alone", "Cartilage between prosthesis and TM", "Fascia graft only", "A longer prosthesis", "Gelfoam packing"], "k": "B", "x": "Cartilage cap over the prosthesis head"}, {"n": 16, "s": "The main advantage of mastoid obliteration after canal wall down surgery is:", "o": ["Small, dry, low-maintenance cavity", "Easier detection of residual disease", "Improved hearing", "Shorter operation", "No need for meatoplasty"], "k": "A", "x": "Obliteration (bone pâté, flaps, bioactive glass) → smaller, dry, self-cleaning cavity; trade-off: residual disease harder to see (use DWI MRI)"}, {"n": 17, "s": "T1 squamous cell carcinoma of the external auditory canal is managed by:", "o": ["Radiotherapy alone", "Sleeve resection", "Total temporal bone resection", "Lateral temporal bone resection", "Chemotherapy"], "k": "D", "x": "LTBR (en bloc EAC, TM, malleus, incus) ± superficial parotidectomy ± neck. Sleeve resection = high recurrence"}, {"n": 18, "s": "Lateral temporal bone resection preserves the:", "o": ["Tympanic membrane", "Malleus", "Bony canal", "Incus", "Facial nerve and otic capsule"], "k": "E", "x": "LTBR medial limit = stapes/medial wall; facial nerve and otic capsule preserved"}, {"n": 19, "s": "EAC squamous cell carcinoma involving the medial wall and facial nerve (T4) is best treated with:", "o": ["Lateral temporal bone resection alone", "Subtotal temporal bone resection with postoperative RT", "Chemotherapy alone", "Palliation only", "Sleeve resection"], "k": "B", "x": "Subtotal TBR (± facial nerve sacrifice, parotid, neck) + postoperative RT. Facial palsy and dural involvement = poor prognosis"}, {"n": 20, "s": "The most common malignancy of the middle ear in children is:", "o": ["Squamous cell carcinoma", "Lymphoma", "Rhabdomyosarcoma", "Adenocarcinoma", "Melanoma"], "k": "C", "x": "Embryonal rhabdomyosarcoma; aural polyp/bleeding in a child; chemoradiation"}, {"n": 21, "s": "The most common malignant ceruminous gland tumour is:", "o": ["Adenoid cystic carcinoma", "Mucoepidermoid carcinoma", "Basal cell carcinoma", "Squamous cell carcinoma", "Acinic cell carcinoma"], "k": "A", "x": "Adenoid cystic carcinoma — pain, perineural spread"}, {"n": 22, "s": "Endolymphatic sac tumour is associated with:", "o": ["NF1", "NF2", "MEN2", "Tuberous sclerosis", "Von Hippel-Lindau disease"], "k": "E", "x": "VHL; retrolabyrinthine erosion, SNHL; papillary, locally aggressive"}, {"n": 23, "s": "The histological hallmark of Langerhans cell histiocytosis is:", "o": ["Reed-Sternberg cells", "Psammoma bodies", "Birbeck granules", "Russell bodies", "Antoni A areas"], "k": "C", "x": "Birbeck granules (tennis racquet), CD1a/langerin; punched-out lytic lesions, mimics mastoiditis/COM"}, {"n": 24, "s": "Ground-glass expansion of the temporal bone with canal stenosis suggests:", "o": ["Paget's disease", "Fibrous dysplasia", "Osteopetrosis", "Otosclerosis", "Metastasis"], "k": "B", "x": "Fibrous dysplasia: ground glass, canal stenosis → secondary canal cholesteatoma; McCune-Albright if polyostotic + endocrine + café-au-lait"}, {"n": 25, "s": "Mixed hearing loss with raised alkaline phosphatase and an enlarging skull suggests:", "o": ["Fibrous dysplasia", "Osteopetrosis", "Osteogenesis imperfecta", "Paget's disease", "Hyperparathyroidism"], "k": "D", "x": "Paget's: ↑ ALP, cotton-wool skull, mixed HL; bisphosphonates"}, {"n": 26, "s": "A child with recurrent facial palsy has dense sclerotic bones. The diagnosis is:", "o": ["Paget's disease", "Fibrous dysplasia", "Osteogenesis imperfecta", "Osteopetrosis", "Melkersson-Rosenthal syndrome"], "k": "D", "x": "Osteopetrosis (Albers-Schönberg): foraminal narrowing → recurrent VII palsy, CHL/SNHL"}, {"n": 27, "s": "Otosyphilis is treated with:", "o": ["Doxycycline alone", "IV penicillin with steroids", "Steroids alone", "Intratympanic gentamicin", "Acyclovir"], "k": "B", "x": "Neurosyphilis regimen (IV penicillin 10–14 days) + steroids; FTA-ABS diagnosis"}, {"n": 28, "s": "Osteoradionecrosis of the temporal bone typically presents with:", "o": ["Exposed bone in the canal after radiotherapy", "Pulsatile tinnitus", "Blue tympanic membrane", "Auricular vesicles", "Isolated conductive loss"], "k": "A", "x": "Exposed necrotic bone in EAC, otorrhoea, pain after RT; debridement, HBO, LTBR if extensive"}, {"n": 29, "s": "Encephalopathy, branch retinal artery occlusions and SNHL indicate:", "o": ["Cogan syndrome", "Vogt-Koyanagi-Harada", "Behçet disease", "Multiple sclerosis", "Susac syndrome"], "k": "E", "x": "Susac: microangiopathy of brain, retina, cochlea (low-frequency SNHL); corpus callosum lesions"}, {"n": 30, "s": "Bilateral non-infective auricular chondritis sparing the lobule, with saddle nose, suggests:", "o": ["Pseudomonas perichondritis", "Lupus", "Relapsing polychondritis", "Granulomatosis with polyangiitis", "Sarcoidosis"], "k": "C", "x": "Relapsing polychondritis: bilateral, lobule spared, nasal and laryngotracheal cartilage; steroids. Infection = unilateral, painful, Pseudomonas"}, {"n": 31, "s": "A contraindication to eustachian tube balloon dilation is:", "o": ["Obstructive tube dysfunction", "Dehiscent carotid canal", "Chronic adult OME", "Recurrent barotrauma", "Failed autoinflation"], "k": "B", "x": "Carotid canal dehiscence/aberrant ICA (CT before procedure); patulous tube also a contraindication"}, {"n": 32, "s": "The treatment with the best evidence for chronic bothersome tinnitus is:", "o": ["Antidepressants", "Ginkgo biloba", "Intratympanic steroids", "Cognitive behavioural therapy", "Melatonin"], "k": "D", "x": "CBT (strong evidence); sound therapy and hearing aids optional. Guideline against routine drugs/supplements"}, {"n": 33, "s": "Routine imaging is NOT recommended (AAO-HNS) for:", "o": ["Unilateral tinnitus", "Pulsatile tinnitus", "Tinnitus with focal neurology", "Tinnitus with asymmetric hearing loss", "Bilateral symmetric non-pulsatile tinnitus"], "k": "E", "x": "Image unilateral, pulsatile, asymmetric or neurological tinnitus only"}, {"n": 34, "s": "Hyperacusis is best managed by:", "o": ["Constant earplug use", "High-gain hearing aids", "Graded sound desensitisation", "Tensor tympani section", "Avoiding all noise"], "k": "C", "x": "Sound desensitisation/therapy ± CBT; earplug overuse worsens hyperacusis"}, {"n": 35, "s": "Lagophthalmos in long-standing facial palsy is treated with:", "o": ["Upper lid gold or platinum weight", "Lower lid botulinum toxin", "Permanent total tarsorrhaphy", "Brow lift alone", "Lacrimal punctal plug"], "k": "A", "x": "Upper lid loading (gold/platinum) + lubrication; lateral tarsorrhaphy/canthoplasty adjuncts"}, {"n": 36, "s": "Static facial suspension typically uses:", "o": ["Gold", "Silicone sheet", "Cartilage", "Bone", "Fascia lata"], "k": "E", "x": "Fascia lata or tendon (or alloplastic) sling to oral commissure"}, {"n": 37, "s": "First-line treatment for post-paralytic synkinesis is:", "o": ["Nerve grafting", "Botulinum toxin", "Hypoglossal transfer", "Static sling", "Steroids"], "k": "B", "x": "Botulinum toxin to synkinetic muscles; neuromuscular retraining"}, {"n": 38, "s": "A young patient has facial paralysis for 3 years. Dynamic smile restoration is best achieved by:", "o": ["Hypoglossal–facial transfer", "Great auricular graft", "Free gracilis transfer", "Gold weight", "Primary neurorrhaphy"], "k": "C", "x": ">2 years = motor end-plates lost → new muscle: free gracilis (or temporalis lengthening). Nerve techniques only work early"}, {"n": 39, "s": "The commonest donor nerve for single-stage free gracilis in unilateral palsy is the:", "o": ["Hypoglossal", "Spinal accessory", "Phrenic", "Masseteric", "Great auricular"], "k": "D", "x": "Masseteric nerve (single stage, strong); cross-face nerve graft gives spontaneous smile (two stage)"}, {"n": 40, "s": "Masked mastoiditis:", "o": ["Is often associated with sterile serous otorrhoea from multiple antibiotics", "Can most often be treated medically", "Often occurs in patients who have not yet had antibiotics", "Causes chronic but not severe postauricular pain after multiple antibiotic courses", "Is most often associated with a retracted or perforated TM"], "k": "D", "x": "(PP ENT-A Q50) — Masked mastoiditis: partially treated by antibiotics, TM often near normal, persistent mild pain → CT; needs mastoidectomy"}, {"n": 41, "s": "Which sense does NOT play a role in balance in the elderly?", "o": ["Vision", "Vestibular", "Proprioceptive", "Auditory", "Gustatory"], "k": "E", "x": "(PP ENT-A Q54) — Balance = vision, vestibular, proprioception (± auditory cues). Gustation plays no role"}, {"n": 42, "s": "In which room of the home do elderly individuals fall most often?", "o": ["Bedroom", "Bathroom", "Kitchen", "Living room", "Utility room"], "k": "A", "x": "(PP ENT-A Q55) ⚠ — Cummings geriatric data: bedroom most frequent (getting in/out of bed, night-time); bathroom is the most commonly cited \"hazardous\" room — if bedroom is absent, choose bathroom"}, {"n": 43, "s": "The topognostic test most likely to be abnormal in the early phase of Bell's palsy is:", "o": ["Schirmer's test", "Stapedius reflex", "Electrogustometry", "Salivary flow", "Salivary pH"], "k": "B", "x": "(PP ENT-A Q56) ⚠ — Stapedial reflex absent early in most (lesion at meatal foramen, proximal to stapedius branch); Schirmer often abnormal too but less consistently"}, {"n": 44, "s": "Regarding auditory neuropathy in children, which is true?", "o": ["Neonatal hypoxia and hyperbilirubinaemia are risk factors", "It is often diagnosed by current newborn screening protocols", "Most children present with an associated peripheral neuropathy", "Cochlear implantation is contraindicated", "It is X-linked"], "k": "A", "x": "(PP ENT-A Q58) — Risk factors NICU, hypoxia, hyperbilirubinaemia. OAE screening misses it; CI not contraindicated; mostly not X-linked"}, {"n": 45, "s": "On physical examination in otosclerosis:", "o": ["A Schwartze sign is present in most patients", "The tympanic membrane is opaque", "Tuning forks are important in establishing the conductive component", "Patients may have blue sclera", "A white forelock is common"], "k": "C", "x": "(PP ENT-A Q62) — Normal TM in most; tuning forks confirm the CHL. Schwartze ~10%; blue sclera = OI; white forelock = Waardenburg"}, {"n": 46, "s": "Which statement is NOT true?", "o": ["Up to 50% of non-syndromic SNHL is due to a gap junction protein mutation", "Auditory neuropathy shows normal OHC function with abnormal neural responses", "Prenatal TORCH infection can reduce ganglion cells and displace the facial nerve", "Bilateral temporal bone fractures causing deafness can be rehabilitated with CI", "Genetic syndromal deafness is the leading cause of SNHL"], "k": "E", "x": "(PP ENT-A Q63) — Non-syndromic (~70%) exceeds syndromic deafness"}, {"n": 47, "s": "Selection criteria for paediatric CI candidates include all EXCEPT:", "o": ["Family support and appropriate expectations", "Oral habilitation opportunities", "Medical clearance for general anaesthesia", "No benefit from hearing aids", "Physiologic age >12 months in most cases"], "k": "D", "x": "(PP ENT-A Q64) ⚠ — Criterion is limited/insufficient benefit from appropriately fitted aids, not \"no benefit\" — the absolute word is the trap"}, {"n": 48, "s": "The most common manifestation of vestibular dysfunction in the elderly is:", "o": ["Loss of balance", "Oscillopsia", "Benign paroxysmal positional vertigo", "Ménière's disease", "Labyrinthine fistula"], "k": "C", "x": "(PP ENT-A Q95) ⚠ — BPPV is the commonest vestibular disorder in the elderly (Cummings); \"loss of balance\" is a symptom of multifactorial causes"}, {"n": 49, "s": "Clear otorrhoea from a ventilation tube may arise from:", "o": ["Spontaneous CSF leak", "Bullous myringitis", "Gustatory otorrhoea", "Atypical tuberculosis", "Chloroma formation"], "k": "A", "x": "(PP ENT-B Q76) ⚠ — Clear watery otorrhoea through a tube in a child → consider spontaneous CSF leak (inner ear malformation, e.g. Mondini); test for β2-transferrin"}, {"n": 50, "s": "Recurrent acute otitis media:", "o": ["Affects 10% of children in the first decade", "Is hereditary", "Is principally caused by allergy", "Is associated with nasal polyps"], "k": "B", "x": "(PP ENT-B Q90) ⚠ — Strong genetic component (twin/sibling studies); old-bank key \"hereditary\". Allergy not principal cause; ~10% is an underestimate of otitis-prone children"}]}, {"c": 0, "t": "Session 7", "d": "Completion set", "q": [{"n": 1, "s": "Ewald's first law states that eye and head movements occur:", "o": ["Perpendicular to the stimulated canal", "Toward the utricle", "Opposite to gravity", "Only in the horizontal plane", "In the plane of the stimulated canal"], "k": "E", "x": "Ewald 1: movement in the plane of the stimulated canal"}, {"n": 2, "s": "For the lateral semicircular canal, excitatory endolymph flow is:", "o": ["Ampullopetal (toward the ampulla)", "Ampullofugal (away from the ampulla)", "Either direction equally", "Toward the common crus", "Independent of direction"], "k": "A", "x": "Ewald 2: lateral canal — ampullopetal (utriculopetal) excitatory, response stronger than ampullofugal"}, {"n": 3, "s": "For the vertical semicircular canals, excitatory endolymph flow is:", "o": ["Ampullopetal", "Into the common crus", "Toward the saccule", "Ampullofugal", "Bidirectional"], "k": "D", "x": "Ewald 3: vertical canals — ampullofugal excitatory (kinocilium on canal side). Opposite of lateral canal"}, {"n": 4, "s": "According to Alexander's law, peripheral nystagmus:", "o": ["Is constant in all gaze positions", "Is present only in primary gaze", "Increases with gaze toward the fast phase", "Increases with gaze toward the slow phase", "Reverses direction with gaze"], "k": "C", "x": "Alexander's law: peripheral nystagmus strongest looking toward the fast phase (first → second → third degree)"}, {"n": 5, "s": "A vestibular hair cell depolarises when its stereocilia deflect:", "o": ["Away from the kinocilium", "Perpendicular to the kinocilium", "Toward the striola only", "With loss of tip-link tension", "Toward the kinocilium"], "k": "E", "x": "Toward kinocilium → tip links open → depolarisation; away → hyperpolarisation"}, {"n": 6, "s": "In the utricular macula, hair cells are polarised:", "o": ["Away from the striola", "Toward the striola", "Randomly", "All in one direction", "Toward the ampulla"], "k": "B", "x": "Utricle: toward striola; saccule: away from striola — covers all directions"}, {"n": 7, "s": "The utricular macula is oriented and functions as follows:", "o": ["Vertical — vertical linear acceleration", "Vertical — angular acceleration", "Horizontal — angular acceleration", "Horizontal — horizontal linear acceleration and tilt", "Oblique — sound detection"], "k": "D", "x": "Utricle horizontal (horizontal acceleration, tilt); saccule vertical (vertical acceleration, gravity)"}, {"n": 8, "s": "Otoconia are composed of:", "o": ["Calcium carbonate", "Calcium phosphate", "Calcium oxalate", "Magnesium sulphate", "Hydroxyapatite"], "k": "A", "x": "Calcium carbonate (calcite). Cupula has the same density as endolymph → insensitive to gravity unless otoconia attach (cupulolithiasis)"}, {"n": 9, "s": "Type I vestibular hair cells are characterised by:", "o": ["Bouton afferent endings", "Cylindrical shape", "Efferent-only innervation", "Absence of a kinocilium", "Calyx (chalice) afferent ending"], "k": "E", "x": "Type I: flask-shaped, calyx afferent; type II: cylindrical, bouton endings. Gentamicin targets type I first"}, {"n": 10, "s": "The right anterior semicircular canal is coplanar with the:", "o": ["Right posterior canal", "Left anterior canal", "Left posterior canal", "Right lateral canal", "Left lateral canal"], "k": "C", "x": "Coplanar pairs: RALP (right anterior–left posterior), LARP, and both laterals — basis of vHIT planes"}, {"n": 11, "s": "The basal turn responds to high frequencies because the basilar membrane there is:", "o": ["Narrow and stiff", "Wide and floppy", "Thick and lax", "Absent", "Tuned by the stria"], "k": "A", "x": "Base narrow and stiff (high frequency); apex wide and floppy (low). Békésy travelling wave"}, {"n": 12, "s": "Outer hair cell electromotility is driven by:", "o": ["Myosin VIIA", "Otoferlin", "Connexin 26", "Prestin", "Cadherin 23"], "k": "D", "x": "Prestin (SLC26A5) — cochlear amplifier, OAE generator"}, {"n": 13, "s": "Hair cell mechanoelectrical transduction depolarises the cell by influx of:", "o": ["Na⁺ from perilymph", "Ca²⁺ from perilymph", "Cl⁻ from endolymph", "Na⁺ from endolymph", "K⁺ from endolymph"], "k": "E", "x": "K⁺ enters from K⁺-rich endolymph (driven by +80 mV EP + hair cell −70 mV); then Ca²⁺ entry → transmitter release"}, {"n": 14, "s": "The resonant frequency of the external auditory canal is about:", "o": ["500 Hz", "3 kHz", "1 kHz", "8 kHz", "12 kHz"], "k": "B", "x": "EAC ~2.5–3 kHz (+10–15 dB boost) → explains 4 kHz noise notch; concha ~5 kHz"}, {"n": 15, "s": "Pitch coding of low-frequency sounds relies mainly on:", "o": ["Place coding only", "Basal turn excitation", "Temporal (phase-locking/volley) coding", "Outer hair cell efferents", "Middle ear resonance"], "k": "C", "x": "Low frequencies: temporal/phase-locking (volley); high frequencies: place coding"}, {"n": 16, "s": "The thalamic relay of the auditory pathway is the:", "o": ["Lateral geniculate body", "Pulvinar", "Superior colliculus", "Inferior colliculus", "Medial geniculate body"], "k": "E", "x": "\"E-COLI-MA\": Eighth nerve → Cochlear nucleus → Olive → Lateral lemniscus → Inferior colliculus → MGB → Auditory cortex"}, {"n": 17, "s": "The first site of binaural interaction in the auditory pathway is the:", "o": ["Superior olivary complex", "Cochlear nucleus", "Inferior colliculus", "Medial geniculate body", "Auditory cortex"], "k": "A", "x": "SOC — bilateral input first converges here (localisation, reflex)"}, {"n": 18, "s": "The primary auditory cortex lies in:", "o": ["Wernicke's area", "The angular gyrus", "Broca's area", "Heschl's gyrus", "The insula"], "k": "D", "x": "Heschl's gyrus (transverse temporal, Brodmann 41/42)"}, {"n": 19, "s": "A unilateral auditory cortex lesion typically produces:", "o": ["Contralateral deafness", "A normal pure-tone audiogram", "Ipsilateral deafness", "Absent ABR", "Absent OAEs"], "k": "B", "x": "Bilateral representation → normal audiogram; deficits only on central tests (dichotic listening, speech in noise)"}, {"n": 20, "s": "Localisation of high-frequency sounds in the horizontal plane relies on:", "o": ["Interaural time difference", "Bone conduction across the head", "Middle ear muscle reflexes", "Cochlear efferents", "Interaural level difference"], "k": "E", "x": "High frequency: ILD (head shadow, LSO); low frequency: ITD (MSO). Pinna cues = elevation, front/back"}, {"n": 21, "s": "The commonest cause of a prominent ear is:", "o": ["Conchal hypoplasia", "A large lobule", "Underdeveloped antihelical fold", "Darwin's tubercle", "A narrow conchomastoid angle"], "k": "C", "x": "Underdeveloped antihelical fold ± conchal excess"}, {"n": 22, "s": "The Mustardé otoplasty technique uses:", "o": ["Conchoscaphal mattress sutures", "Conchomastoid sutures", "Anterior cartilage scoring", "Conchal cartilage excision", "Skin excision alone"], "k": "A", "x": "Mustardé: permanent conchoscaphal mattress sutures to create antihelix"}, {"n": 23, "s": "The Furnas otoplasty technique uses:", "o": ["Scaphal scoring", "Conchoscaphal sutures", "Helical rim excision", "Conchomastoid sutures", "Lobule repositioning"], "k": "D", "x": "Furnas: conchomastoid sutures for conchal setback"}, {"n": 24, "s": "Marx grade III microtia is:", "o": ["A small but normal ear", "Mild deformity with most structures", "Absent canal with normal pinna", "Complete absence of the ear", "A peanut-shaped vestige"], "k": "E", "x": "Marx: I small normal-ish · II partial structures · III peanut vestige (classic microtia) · IV anotia"}, {"n": 25, "s": "Microtia, epibulbar dermoid and hemifacial hypoplasia suggest:", "o": ["Treacher Collins syndrome", "Goldenhar syndrome", "CHARGE syndrome", "Crouzon syndrome", "Pierre Robin sequence"], "k": "B", "x": "Goldenhar (oculo-auriculo-vertebral): epibulbar dermoid, vertebral anomalies, hemifacial microsomia. Treacher Collins = bilateral, TCOF1, malar hypoplasia, lower lid colobomas"}, {"n": 26, "s": "An upper helix buried beneath the temporal scalp skin is:", "o": ["Cryptotia", "Stahl's ear", "Lop ear", "Cup ear", "Constricted ear"], "k": "A", "x": "Cryptotia: upper helix buried; common in East Asians; neonatal moulding works"}, {"n": 27, "s": "Uveitis, parotid swelling, fever and facial palsy indicate:", "o": ["Sjögren syndrome", "Mikulicz disease", "Heerfordt syndrome", "Melkersson-Rosenthal syndrome", "Mumps"], "k": "C", "x": "Heerfordt (uveoparotid fever) = sarcoidosis; facial palsy ~50%"}, {"n": 28, "s": "Chloroma of the temporal bone occurs in:", "o": ["Chronic lymphocytic leukaemia", "Hodgkin lymphoma", "Multiple myeloma", "Acute myeloid leukaemia", "Burkitt lymphoma"], "k": "D", "x": "Chloroma (granulocytic/myeloid sarcoma) in AML; may precede marrow disease"}, {"n": 29, "s": "An adult with bilateral OME, nasal crusting and haematuria should be tested for:", "o": ["ANA", "Anti-CCP", "Anti-dsDNA", "p-ANCA (MPO)", "c-ANCA (PR3)"], "k": "E", "x": "GPA: c-ANCA/PR3; ear involvement in ~40% (OME, SNHL)"}, {"n": 30, "s": "The topical agent of choice for otomycosis is:", "o": ["Clotrimazole 1%", "Gentamicin", "Ciprofloxacin", "Hydrocortisone", "Chloramphenicol"], "k": "A", "x": "Clotrimazole 1% (or acetic acid/boric acid) + meticulous débridement"}, {"n": 31, "s": "The main advantage of ototopical over oral antibiotics is:", "o": ["Always lower cost", "No resistance ever develops", "Better for spreading cellulitis", "About 100–1000 times higher local concentration", "Systemic coverage"], "k": "D", "x": "High local concentration overcomes \"resistance\" breakpoints; avoids systemic side effects"}, {"n": 32, "s": "Otitis externa worsens with itching and eczematous erythema spreading to the pinna despite neomycin drops. The likely cause is:", "o": ["Fungal superinfection", "Contact dermatitis to neomycin", "Malignant otitis externa", "Resistant Pseudomonas", "Furunculosis"], "k": "B", "x": "Neomycin sensitivity in ~15–30% of chronic OE; stop drug, topical steroid"}, {"n": 33, "s": "The tympanic membrane derives from:", "o": ["Ectoderm only", "Endoderm only", "Mesoderm only", "Ectoderm and endoderm", "All three germ layers"], "k": "E", "x": "Outer epithelium = ectoderm (1st cleft); fibrous layer = mesoderm; inner mucosa = endoderm (1st pouch)"}, {"n": 34, "s": "In infants under 2 years, a standard postauricular incision endangers the facial nerve because:", "o": ["The nerve is larger", "The mastoid is pneumatised", "The undeveloped mastoid tip leaves the nerve superficial", "The canal is long", "The nerve is always dehiscent"], "k": "C", "x": "No mastoid tip until ~2 years → stylomastoid foramen near surface → modify incision (higher/posterior)"}, {"n": 35, "s": "The inner ear reaches adult size by:", "o": ["About 20 weeks' gestation", "Birth", "1 year", "5 years", "Puberty"], "k": "A", "x": "Membranous and bony labyrinth adult size by mid-gestation (~20–23 weeks); ossicles also adult size at birth; mastoid grows postnatally"}, {"n": 36, "s": "The most important factor in predicting facial nerve recovery after temporal bone fracture is:", "o": ["Severity of injury", "Timing of onset", "Presence of associated infection", "Presence of SNHL"], "k": "B", "x": "(PP ENT-A Q43) — Timing of onset: immediate = poorer (transection); delayed = good (oedema)"}, {"n": 37, "s": "Which drug is most likely to cause permanent SNHL?", "o": ["Erythromycin", "Vancomycin", "Furosemide", "Cisplatin", "Torsemide"], "k": "D", "x": "(PP ENT-A Q47) — Cisplatin: permanent, bilateral, high frequency. Loop diuretics usually reversible"}, {"n": 38, "s": "A 52-year-old diabetic has malignant otitis externa confirmed. Next steps include all EXCEPT:", "o": ["Normalisation of hyperglycaemia", "Culture of the EAC and frequent débridement", "Technetium-99m and gallium-67 scans", "IV antibiotics and Infectious Disease consult", "Proceed straight to mastoidectomy and tympanoplasty"], "k": "E", "x": "(PP ENT-A Q48) — MOE is medical first; surgery only for débridement/abscess/sequestrum, not routine mastoidectomy"}, {"n": 39, "s": "Regarding inner ear fluids, which is true?", "o": ["Endolymph resembles extracellular fluid with high Na⁺ and low K⁺", "Perilymph is high in amino acids, especially glycine, compared with blood", "Vestibular endolymph is produced by mitochondria-poor stria cells", "Endolymph is resorbed in the endolymphatic sac", "Perilymph drains through the eustachian tube"], "k": "D", "x": "(PP ENT-A Q53) — A false (endolymph = high K⁺); B not the key; C false (stria is mitochondria-rich, and vestibular endolymph comes from dark cells); E false"}, {"n": 40, "s": "Regarding masking, which is true?", "o": ["Masking removes visual clues during speech discrimination", "Masking should be used with bone conduction when thresholds are asymmetric", "A masking dilemma frequently occurs with unilateral severe SNHL and normal other ear", "Overmasking is tinnitus after a loud masking signal", "All of these are true"], "k": "B", "x": "(PP ENT-A Q57) — Mask BC when asymmetric; dilemma = bilateral large CHL; overmasking = masker crossing to test ear"}, {"n": 41, "s": "Otosclerosis is a disease that:", "o": ["Is common to all", "Occurs only in females", "Is unique to the otic capsule", "Is found at birth", "Occurs mostly in males"], "k": "C", "x": "(PP ENT-A Q61) — Unique to the otic capsule (human disease); female predominance, not exclusive"}, {"n": 42, "s": "Most cases of genetic deafness exhibit which inheritance pattern?", "o": ["Autosomal recessive", "Autosomal dominant", "X-linked", "Mitochondrial", "Paternal"], "k": "A", "x": "(PP ENT-A Q93) — AR ~75–80%; AD ~20%; X-linked/mitochondrial ~1–2%"}, {"n": 43, "s": "The landmark on the lateral surface of the temporal bone guiding the surgical approach to the antrum is the:", "o": ["Notch of Rivinus", "Suprameatal spine of Henle", "Temporal line", "Tympanosquamous suture", "Trautmann's triangle"], "k": "B", "x": "(PP ENT-B Q1) — Henle's spine sits at the anterosuperior corner of Macewen's triangle; antrum ~12–15 mm deep"}, {"n": 44, "s": "The plate of bone separating the attic from the middle cranial fossa is the:", "o": ["Aditus ad antrum", "Macewen's plate", "Tegmen tympani", "Sinodural angle", "Trautmann's triangle"], "k": "C", "x": "(PP ENT-B Q4) — Tegmen tympani; dehiscence → encephalocele, CSF leak"}, {"n": 45, "s": "The parasympathetic innervation of the submandibular gland is carried by the:", "o": ["Vidian nerve", "Chorda tympani", "Lesser petrosal nerve", "Otic ganglion", "Glossopharyngeal nerve"], "k": "B", "x": "(PP ENT-B Q6) — Chorda tympani → submandibular ganglion → SMG/SLG"}, {"n": 46, "s": "The speech reception threshold is the level at which:", "o": ["A phonetically balanced list is repeated correctly", "50% of spondee words are repeated correctly", "50% of phonetically balanced words are repeated correctly", "A spondee list is repeated fully"], "k": "B", "x": "(PP ENT-B Q14) — SRT = 50% spondees; speech discrimination uses PB words at suprathreshold level"}, {"n": 47, "s": "Which statement is true?", "o": ["The external canal is two-thirds cartilage and one-third bone", "The eustachian tube is one-third cartilage and two-thirds bone", "The internal auditory canal is all bone", "The tensor tympani canal is one-quarter cartilage"], "k": "C", "x": "(PP ENT-B Q43) — EAC: lateral 1/3 cartilage, medial 2/3 bone; ET: 1/3 bone, 2/3 cartilage; IAC entirely bone"}, {"n": 48, "s": "A 16-year-old swimmer has 1 day of right ear pain, a red swollen canal and pain on pulling the auricle. The diagnosis is:", "o": ["Acute otitis media", "Bullous myringitis", "Chronic otitis media", "External otitis", "Mastoiditis"], "k": "D", "x": "(PP ENT-B Q47) — Acute otitis externa: tragal/auricle pain is the key sign"}, {"n": 49, "s": "The inner ear is a derivative of:", "o": ["Ectoderm", "Endoderm", "Mesoderm", "Neural crest cells"], "k": "A", "x": "(PP ENT-B Q50) — Otic placode (surface ectoderm) → otic pit → otocyst; middle ear = endoderm; ossicles = neural crest/mesenchyme"}, {"n": 50, "s": "The most common complication of cholesteatoma is:", "o": ["Facial nerve paralysis", "Brain abscess", "Semicircular canal erosion", "Suppurative labyrinthitis", "Sensorineural hearing loss"], "k": "C", "x": "(PP ENT-B Q89) — Labyrinthine fistula (lateral canal erosion) — most common complication"}]}, {"c": 1, "t": "Session 1", "d": "Anatomy, Physiology, Rhinitis, Allergy, Epistaxis", "q": [{"n": 1, "s": "Kiesselbach's plexus receives contributions from all EXCEPT the:", "o": ["Anterior ethmoidal artery", "Sphenopalatine artery (septal branch)", "Posterior ethmoidal artery", "Greater palatine artery", "Superior labial artery"], "k": "C", "x": "Kiesselbach: anterior ethmoidal, sphenopalatine (septal), greater palatine, superior labial. Posterior ethmoidal supplies the superior septum, not Little's area"}, {"n": 2, "s": "Woodruff's plexus lies in the:", "o": ["Little's area", "Middle turbinate head", "Superior meatus", "Cribriform plate", "Posterior inferior meatus"], "k": "E", "x": "Woodruff's: posterior inferior meatus/posterior end of inferior turbinate — SPA + posterior pharyngeal; source of posterior bleeds in elderly"}, {"n": 3, "s": "The landmark for the sphenopalatine foramen during endoscopic ligation is the:", "o": ["Uncinate process", "Crista ethmoidalis", "Agger nasi", "Basal lamella", "Bulla ethmoidalis"], "k": "B", "x": "Crista ethmoidalis on palatine bone, just anterior to the foramen"}, {"n": 4, "s": "The anterior ethmoidal foramen lies behind the anterior lacrimal crest at about:", "o": ["6 mm", "12 mm", "36 mm", "24 mm", "42 mm"], "k": "D", "x": "\"24-12-6\": anterior ethmoidal 24 mm → posterior ethmoidal +12 (36) → optic canal +6 (42)"}, {"n": 5, "s": "The basal lamella of the middle turbinate separates the:", "o": ["Anterior and posterior ethmoid cells", "Frontal and maxillary sinuses", "Sphenoid and posterior ethmoid", "Orbit and ethmoid", "Nasal cavity and nasopharynx"], "k": "A", "x": "Basal (3rd) lamella: anterior vs posterior ethmoid — key surgical landmark"}, {"n": 6, "s": "When the uncinate process attaches superiorly to the lamina papyracea, the frontal recess drains:", "o": ["Into the infundibulum, lateral to the uncinate", "Medial to the uncinate, into the middle meatus", "Into the superior meatus", "Into the sphenoethmoidal recess", "Into the inferior meatus"], "k": "B", "x": "Lamina papyracea attachment (~70%): infundibulum ends blindly (recessus terminalis); frontal recess opens medial to uncinate"}, {"n": 7, "s": "The most anterior ethmoid cell and key to the frontal recess is the:", "o": ["Bulla ethmoidalis", "Haller cell", "Onodi cell", "Suprabullar cell", "Agger nasi cell"], "k": "E", "x": "Agger nasi: most anterior, most constant; its posterior wall forms the anterior frontal recess"}, {"n": 8, "s": "An ethmoid cell along the orbital floor that narrows the infundibulum is the:", "o": ["Agger nasi cell", "Onodi cell", "Haller cell", "Concha bullosa", "Frontal bullar cell"], "k": "C", "x": "Haller (infraorbital ethmoid) cell — infundibular narrowing → maxillary sinusitis"}, {"n": 9, "s": "The optic nerve and internal carotid artery are at risk in a:", "o": ["Haller cell", "Agger nasi cell", "Concha bullosa", "Onodi cell", "Kuhn type 1 cell"], "k": "D", "x": "Onodi (sphenoethmoidal) cell: lies superolateral to sphenoid; optic nerve ± ICA in its wall"}, {"n": 10, "s": "Keros type III corresponds to an olfactory fossa depth of:", "o": ["1–3 mm", "8–16 mm", "4–7 mm", ">20 mm", "0 mm"], "k": "B", "x": "Keros I 1–3 mm · II 4–7 mm · III 8–16 mm (thin lateral lamella — highest CSF leak risk)"}, {"n": 11, "s": "The nasolacrimal duct opens into the:", "o": ["Middle meatus", "Superior meatus", "Sphenoethmoidal recess", "Nasopharynx", "Inferior meatus"], "k": "E", "x": "Inferior meatus, ~1 cm behind anterior end of inferior turbinate (Hasner's valve)"}, {"n": 12, "s": "The posterior ethmoid cells drain into the:", "o": ["Middle meatus", "Inferior meatus", "Superior meatus", "Frontal recess", "Nasopharynx"], "k": "C", "x": "Superior meatus; sphenoid → sphenoethmoidal recess; anterior group (frontal, maxillary, anterior ethmoid) → middle meatus"}, {"n": 13, "s": "The sinus absent at birth is the:", "o": ["Maxillary", "Anterior ethmoid", "Posterior ethmoid", "Frontal", "None — all are present"], "k": "D", "x": "Frontal absent at birth, appears ~5–6 years. Maxillary and ethmoid present at birth; sphenoid rudimentary"}, {"n": 14, "s": "Olfactory receptor neurons are:", "o": ["Unipolar and non-regenerating", "Bipolar and regenerate from basal cells", "Multipolar CNS neurons", "Located on the inferior turbinate", "Supplied by V1"], "k": "B", "x": "Bipolar neurons; continuous renewal from basal cells — the only regenerating neurons with direct CNS connection"}, {"n": 15, "s": "The nasal cycle alternates about every:", "o": ["2–4 hours", "10 minutes", "24 hours", "30 seconds", "1 week"], "k": "A", "x": "Alternating congestion every 2–4 h in ~70–80%; total resistance stays constant"}, {"n": 16, "s": "The saccharin test is abnormal when taste is delayed beyond:", "o": ["2 minutes", "5 minutes", "10 minutes", "15 minutes", "30 minutes"], "k": "E", "x": "Normal <20–30 min; >30 min suggests impaired clearance (PCD, CRS)"}, {"n": 17, "s": "The normal internal nasal valve angle is:", "o": ["1–5°", "30–40°", "10–15°", "45–60°", "90°"], "k": "C", "x": "10–15° (Caucasian); narrowest part of the airway"}, {"n": 18, "s": "The Cottle manoeuvre evaluates:", "o": ["Septal perforation", "Olfaction", "Turbinate hypertrophy", "Nasal valve collapse", "Choanal patency"], "k": "D", "x": "Lateral cheek traction improves airflow → valve collapse"}, {"n": 19, "s": "Kallmann syndrome comprises:", "o": ["Anosmia and hypothyroidism", "Anosmia and hypogonadotropic hypogonadism", "Anosmia and deafness", "Hyposmia and diabetes", "Anosmia and adrenal failure"], "k": "B", "x": "Kallmann: olfactory bulb agenesis + GnRH deficiency (KAL1/ANOS1)"}, {"n": 20, "s": "Under ARIA, allergic rhinitis is \"intermittent\" when symptoms occur:", "o": ["<2 days/week", "In one season only", "Without sleep disturbance", "With mild severity", "<4 days/week or <4 consecutive weeks"], "k": "E", "x": "Intermittent: <4 days/week or <4 weeks; persistent: >4 days/week and >4 weeks. Severity graded separately"}, {"n": 21, "s": "The main preformed mediator of the early-phase allergic reaction is:", "o": ["Leukotriene C4", "Prostaglandin D2", "Histamine", "IL-5", "Eosinophil cationic protein"], "k": "C", "x": "Histamine (mast cell degranulation, minutes); late phase 4–8 h — eosinophils, leukotrienes"}, {"n": 22, "s": "The most effective single agent for persistent allergic rhinitis is:", "o": ["Oral antihistamine", "Montelukast", "Sodium cromoglycate", "Intranasal corticosteroid", "Oral decongestant"], "k": "D", "x": "INCS: best for congestion and all symptoms"}, {"n": 23, "s": "Rhinitis medicamentosa is caused by:", "o": ["Oral antihistamines", "Topical decongestant overuse", "Intranasal corticosteroids", "Saline irrigation", "Montelukast"], "k": "B", "x": "Topical decongestants >5–10 days → rebound; stop + INCS"}, {"n": 24, "s": "The organism associated with atrophic rhinitis is:", "o": ["Klebsiella ozaenae", "Klebsiella rhinoscleromatis", "Pseudomonas aeruginosa", "Staphylococcus aureus", "Actinomyces israelii"], "k": "A", "x": "K. ozaenae; foul crusts, patient anosmic (merciful anosmia)"}, {"n": 25, "s": "The histological hallmark of rhinoscleroma is:", "o": ["Birbeck granules", "Reed-Sternberg cells", "Psammoma bodies", "Langhans giant cells", "Mikulicz cells"], "k": "E", "x": "Mikulicz cells (foamy macrophages with bacilli) + Russell bodies; K. rhinoscleromatis; long-term ciprofloxacin/tetracycline"}, {"n": 26, "s": "Non-allergic rhinitis with eosinophilia syndrome (NARES) shows:", "o": ["Positive skin tests with eosinophilia", "Negative skin tests with neutrophilia", "Negative skin tests with nasal eosinophilia", "Raised total IgE", "Absent mast cells"], "k": "C", "x": "NARES: eosinophils >20%, negative allergy tests; may precede AERD"}, {"n": 27, "s": "The specific treatment for aspirin-exacerbated respiratory disease is:", "o": ["Long-term antibiotics", "Oral antihistamine", "Allergen immunotherapy", "Aspirin desensitisation", "Septoplasty"], "k": "D", "x": "Aspirin desensitisation + daily aspirin after ESS; also biologics (dupilumab)"}, {"n": 28, "s": "Gustatory rhinitis is best treated with:", "o": ["Intranasal corticosteroid", "Ipratropium bromide", "Oral antihistamine", "Topical decongestant", "Sodium cromoglycate"], "k": "B", "x": "Ipratropium (anticholinergic) — watery rhinorrhoea with food/cold"}, {"n": 29, "s": "Allergen immunotherapy is usually continued for:", "o": ["3 months", "6 months", "1 year", "10 years", "3–5 years"], "k": "E", "x": "3–5 years for lasting tolerance (SCIT or SLIT)"}, {"n": 30, "s": "The commonest site of epistaxis is:", "o": ["Woodruff's plexus", "Middle turbinate", "Little's area", "Superior meatus", "Nasopharynx"], "k": "C", "x": "Little's area ~90%"}, {"n": 31, "s": "HHT type 1 is caused by mutation of:", "o": ["ENG (endoglin)", "ACVRL1", "SMAD4", "COL3A1", "PAX3"], "k": "A", "x": "HHT1 = ENG (more pulmonary/cerebral AVMs); HHT2 = ACVRL1 (more hepatic); SMAD4 = juvenile polyposis-HHT"}, {"n": 32, "s": "First-line surgery for refractory posterior epistaxis is:", "o": ["External carotid ligation", "Transantral maxillary artery ligation", "Anterior ethmoidal ligation", "Endoscopic sphenopalatine ligation", "Internal carotid ligation"], "k": "D", "x": "Endoscopic SPA ligation ± AEA ligation: >90% success"}, {"n": 33, "s": "The major risk of embolisation for epistaxis is:", "o": ["Septal perforation", "Stroke", "Synechiae", "Anosmia", "Crusting"], "k": "B", "x": "Stroke/blindness via ECA–ICA anastomoses (~1–2%)"}, {"n": 34, "s": "Before skin prick testing, oral antihistamines should be stopped for:", "o": ["6 hours", "24 hours", "2 weeks", "1 month", "5–7 days"], "k": "E", "x": "5–7 days (longer for some; INCS do not interfere)"}, {"n": 35, "s": "Acoustic rhinometry measures:", "o": ["Airflow", "Nasal resistance", "Cross-sectional area", "Mucociliary clearance", "Olfaction"], "k": "C", "x": "Acoustic rhinometry = cross-sectional area vs distance; rhinomanometry = pressure/flow (resistance)"}, {"n": 36, "s": "Young's operation for atrophic rhinitis involves:", "o": ["Turbinectomy", "Septoplasty", "Antral washout", "Closure of the nostrils", "Submucosal implants"], "k": "D", "x": "Young's: nostril closure for months → mucosal regeneration; Lautenslager = submucosal implants"}, {"n": 37, "s": "An untreated septal haematoma typically leads to:", "o": ["Septal deviation", "Saddle nose deformity", "Choanal atresia", "Recurrent epistaxis", "Anosmia"], "k": "B", "x": "Haematoma → abscess → cartilage necrosis → saddle nose; drain urgently"}, {"n": 38, "s": "The posteroinferior bony nasal septum is formed by the:", "o": ["Vomer", "Perpendicular plate of ethmoid", "Quadrilateral cartilage", "Palatine bone", "Nasal crest of maxilla"], "k": "A", "x": "Vomer (posteroinferior); perpendicular plate of ethmoid (posterosuperior); quadrilateral cartilage (anterior)"}, {"n": 39, "s": "Severe epistaxis from above the middle turbinate not controlled by packing requires ligation of the:", "o": ["Anterior ethmoidal artery", "Maxillary artery", "Sphenopalatine artery", "Internal carotid artery", "External carotid artery"], "k": "A", "x": "(PP ENT-B Q2) — Above middle turbinate = ethmoidal (ICA) territory → anterior ethmoidal ligation"}, {"n": 40, "s": "The stream of inspired air in the nose travels:", "o": ["Straight from nostril to choana", "In a high curve through the nasal chamber", "Along the inferior turbinate", "Along the floor of the nose", "In eddies occupying most of the chamber"], "k": "B", "x": "(PP ENT-B Q9) — Inspired air curves upward through the middle meatus region; expired air is more turbulent"}, {"n": 41, "s": "The most frequent cause of nasal septal perforation is:", "o": ["Congenital", "Tuberculosis", "Syphilis", "Chronic infection", "Operative trauma"], "k": "E", "x": "(PP ENT-B Q18) — Old-bank key: operative trauma (septal surgery); also cocaine, digital trauma, granulomatous"}, {"n": 42, "s": "The most common causal factor in hyperplastic rhinitis is:", "o": ["Allergy", "Bacterial infection", "Septal deviation", "Chemical irritation", "Previous nasal surgery"], "k": "A", "x": "(PP ENT-B Q19) — Old-bank key: allergy"}, {"n": 43, "s": "In hereditary haemorrhagic telangiectasia:", "o": ["Clotting time is prolonged", "Platelet count is decreased", "PTT is prolonged", "Bleeding time is prolonged", "All coagulation studies are normal"], "k": "E", "x": "(PP ENT-B Q20) — HHT: vessel wall defect — coagulation and platelets normal"}, {"n": 44, "s": "The immunoglobulin in the allergic-anaphylactic reaction is:", "o": ["IgA", "IgD", "IgE", "IgG", "IgM"], "k": "C", "x": "(PP ENT-B Q24) — IgE on mast cells/basophils = type I"}, {"n": 45, "s": "The middle turbinate is part of the:", "o": ["Ethmoid bone", "Maxilla", "Palatine bone", "Vomer", "A separate bone"], "k": "A", "x": "(PP ENT-B Q42) — Middle and superior turbinates = ethmoid; inferior turbinate = separate bone"}, {"n": 46, "s": "In managing epistaxis, posterior nasal packing:", "o": ["Should be first-line therapy", "Should be avoided", "Should not be combined with anterior packing", "Requires monitoring for hypoxia, apnoea and arrhythmias", "May predispose to hypocarbia"], "k": "D", "x": "(PP ENT-B Q51) — Nasopulmonary reflex → hypoxia, apnoea, arrhythmia; admit and monitor (hypercarbia, not hypocarbia)"}, {"n": 47, "s": "The most important tool in diagnosing allergy is:", "o": ["A positive skin prick test", "A positive intradermal test", "A positive history of symptoms on exposure", "Total IgE >100 IU/mL", "mRAST class II or higher"], "k": "C", "x": "(PP ENT-B Q53) — History; tests only confirm sensitisation"}, {"n": 48, "s": "All of the following are true about nasal steroids EXCEPT:", "o": ["They are contraindicated in infectious sinusitis", "Potent agents may cause some pituitary suppression", "Use cautiously in elderly patients on inhaled steroids", "Septal perforation is a rare side effect", "They are effective against early and late-phase reactions"], "k": "A", "x": "(PP ENT-B Q56) — False: INCS are recommended adjuncts in acute rhinosinusitis (EPOS)"}, {"n": 49, "s": "A nasal smear showing mastocytosis with eosinophilia is typical of:", "o": ["Allergic rhinitis", "Vasomotor rhinitis", "Atrophic rhinitis", "Rhinitis medicamentosa", "Viral rhinitis"], "k": "A", "x": "(PP ENT-B Q87) — Mast cells + eosinophils = allergic rhinitis (NARES: eosinophils, negative tests)"}, {"n": 50, "s": "Non-allergic rhinitis usually presents with all of the following EXCEPT:", "o": ["Rhinorrhoea", "Nasal congestion", "Nasal obstruction", "Itching", "Negative skin testing"], "k": "D", "x": "(PP ENT-A Q99) — Itching = allergic; NAR = congestion, rhinorrhoea, negative tests"}]}, {"c": 1, "t": "Session 2", "d": "Rhinosinusitis, Polyps, Fungal Disease", "q": [{"n": 1, "s": "A patient with a cold improves, then worsens on day 7 with fever and purulent discharge. This \"double sickening\" suggests:", "o": ["Viral rhinosinusitis", "Allergic rhinitis", "Rhinitis medicamentosa", "Acute bacterial rhinosinusitis", "Chronic rhinosinusitis"], "k": "D", "x": "ABRS (EPOS): ≥3 of — discoloured discharge, severe local pain, fever >38 °C, raised CRP/ESR, double sickening"}, {"n": 2, "s": "The proportion of viral URTIs complicated by acute bacterial rhinosinusitis is about:", "o": ["10–20%", "0.5–2%", "30%", "50%", "5–10%"], "k": "B", "x": "Only 0.5–2% of viral URTIs → ABRS; most ARS needs no antibiotics"}, {"n": 3, "s": "Imaging in uncomplicated acute rhinosinusitis is:", "o": ["Plain X-ray routinely", "CT routinely", "MRI routinely", "Ultrasound", "Not required"], "k": "E", "x": "ARS is a clinical diagnosis; CT/MRI only for suspected complications"}, {"n": 4, "s": "Under EPOS 2020, chronic rhinosinusitis requires symptoms for at least:", "o": ["4 weeks", "8 weeks", "12 weeks", "6 months", "1 year"], "k": "C", "x": "≥12 weeks: ≥2 symptoms (one = obstruction or discharge; ± facial pain, smell loss) + endoscopic or CT evidence"}, {"n": 5, "s": "The maximum Lund-Mackay CT score is:", "o": ["24", "12", "20", "36", "48"], "k": "A", "x": "0–2 for each of 5 sinus groups + 0/2 for OMC, ×2 sides = 24"}, {"n": 6, "s": "SNOT-22 is a:", "o": ["CT staging score", "Endoscopic score", "Olfactory test", "Symptom-based quality-of-life questionnaire", "Allergy test"], "k": "D", "x": "Sino-Nasal Outcome Test (22 items, 0–110); MCID ~9"}, {"n": 7, "s": "CRS with nasal polyps in Western patients is predominantly:", "o": ["Type 1 (Th1) inflammation", "Neutrophilic", "Type 3 inflammation", "Non-inflammatory", "Type 2 (eosinophilic) inflammation"], "k": "E", "x": "Western CRSwNP ~80% type 2 (IL-4, -5, -13, eosinophils); Asian CRSwNP more often non-type 2"}, {"n": 8, "s": "The tissue threshold commonly used to define eosinophilic CRS is:", "o": ["≥1 per HPF", "≥5 per HPF", "≥10 per HPF", "≥100 per HPF", "≥500 per HPF"], "k": "C", "x": "≥10 eosinophils/HPF (EPOS cut-off) → higher recurrence, steroid responsive"}, {"n": 9, "s": "Dupilumab targets:", "o": ["IgE", "IL-4Rα", "IL-5", "IL-5Rα", "TSLP"], "k": "B", "x": "Dupilumab = anti-IL-4Rα (blocks IL-4 and IL-13); omalizumab = anti-IgE; mepolizumab = anti-IL-5"}, {"n": 10, "s": "Under EPOS, a prerequisite for biologic therapy in CRSwNP is:", "o": ["Unilateral polyps", "No previous surgery", "Age under 12", "Negative allergy testing", "Bilateral polyps after ESS (or unfit for surgery)"], "k": "E", "x": "Bilateral polyps + prior ESS (or unfit) + ≥3 of: type 2 evidence, ≥2 systemic steroid courses/yr, poor QoL, anosmia, asthma"}, {"n": 11, "s": "An adult has a unilateral nasal polyp. The next step is:", "o": ["CT and biopsy", "Intranasal steroid only", "Oral steroids", "Clinic polypectomy without histology", "Observation"], "k": "A", "x": "Unilateral polyp = exclude inverted papilloma/malignancy"}, {"n": 12, "s": "An antrochoanal polyp arises from the:", "o": ["Ethmoid sinus", "Septum", "Sphenoid sinus", "Maxillary sinus", "Inferior turbinate"], "k": "D", "x": "Maxillary sinus, exits via accessory ostium to choana; remove antral component (recurrence otherwise)"}, {"n": 13, "s": "A child has nasal polyps. The essential investigation is:", "o": ["Skin prick testing", "Total IgE", "Sweat chloride test", "Ciliary biopsy", "Immunoglobulins"], "k": "C", "x": "Polyps in a child = CF until proven otherwise"}, {"n": 14, "s": "The characteristic sinus CT finding in cystic fibrosis is:", "o": ["Hypoplastic turbinates", "Normal sinuses", "Air-fluid levels only", "Frontal hyperplasia", "Medial bulging of the lateral nasal wall"], "k": "E", "x": "\"Pseudomucocele\" medial bulging of lateral wall; hypoplastic frontals/sphenoids"}, {"n": 15, "s": "First-line treatment for CRS with nasal polyps is:", "o": ["Oral antibiotics", "Intranasal steroid plus saline irrigation", "Biologics", "Long-term oral steroids", "Immediate ESS"], "k": "B", "x": "INCS + saline; short oral steroid courses; ESS if failed appropriate medical therapy"}, {"n": 16, "s": "Long-term low-dose macrolides are most useful in:", "o": ["Allergic fungal rhinosinusitis", "Type 2 CRSwNP", "Fungal ball", "Non-type 2 CRSsNP with normal IgE", "Acute rhinosinusitis"], "k": "D", "x": "Macrolides (anti-inflammatory) in non-type 2, low-IgE CRSsNP; ≥3 months"}, {"n": 17, "s": "Which is NOT a Bent-Kuhn criterion for allergic fungal rhinosinusitis?", "o": ["Fungal tissue invasion", "Nasal polyps", "Type I hypersensitivity", "Eosinophilic mucin", "Characteristic CT findings"], "k": "A", "x": "AFRS is non-invasive by definition; invasion = invasive fungal sinusitis"}, {"n": 18, "s": "The MRI appearance of allergic fungal mucin is:", "o": ["T1 dark, T2 bright", "Avidly enhancing mass", "Diffusion restriction only", "Fat signal", "T2 hypointense (signal void)"], "k": "E", "x": "Heavy metals/proteinaceous mucin → T2 signal void; CT: hyperdense \"double density\" with expansion"}, {"n": 19, "s": "Allergic fungal rhinosinusitis is treated with:", "o": ["Antifungals alone", "Antibiotics", "Surgery plus postoperative corticosteroids", "Radiotherapy", "Observation"], "k": "C", "x": "Complete ESS (remove mucin), wide drainage + postoperative steroids (topical/oral) ± immunotherapy; high recurrence"}, {"n": 20, "s": "The commonest site of a fungal ball is the:", "o": ["Frontal sinus", "Ethmoid sinus", "Sphenoid sinus", "Maxillary sinus", "Nasal cavity"], "k": "D", "x": "Maxillary (often after dental root-canal zinc); immunocompetent, A. fumigatus"}, {"n": 21, "s": "A fungal ball is managed by:", "o": ["Endoscopic removal alone", "Systemic antifungals", "Amphotericin B", "Caldwell-Luc plus antifungals", "Corticosteroids"], "k": "A", "x": "Endoscopic removal; no antifungals needed"}, {"n": 22, "s": "Acute invasive fungal sinusitis in diabetic ketoacidosis is classically caused by:", "o": ["Aspergillus fumigatus", "Candida", "Alternaria", "Bipolaris", "Mucorales (Rhizopus)"], "k": "E", "x": "Mucorales: DKA, neutropenia, iron chelation (deferoxamine); black necrotic turbinate/palate"}, {"n": 23, "s": "Mucor on histology shows:", "o": ["Septate hyphae with 45° branching", "Yeast forms", "Broad non-septate hyphae with right-angle branching", "Pseudohyphae", "Spherules"], "k": "C", "x": "Broad (~10–20 µm) pauciseptate ribbon-like hyphae, 90° branching; angioinvasion"}, {"n": 24, "s": "Aspergillus on histology shows:", "o": ["Broad non-septate right-angle hyphae", "Narrow septate hyphae with acute-angle branching", "Yeast forms", "Spherules", "Sulphur granules"], "k": "B", "x": "Narrow septate, acute-angle (45°) dichotomous branching"}, {"n": 25, "s": "The earliest MRI sign of acute invasive fungal sinusitis is:", "o": ["Bone erosion", "Air-fluid level", "Mucosal thickening", "Loss of mucosal enhancement (\"black turbinate\")", "Orbital fat stranding"], "k": "D", "x": "Loss of contrast enhancement (devitalised tissue) before bone erosion; biopsy middle turbinate/septum"}, {"n": 26, "s": "The antifungal of choice for mucormycosis is:", "o": ["Liposomal amphotericin B", "Voriconazole", "Fluconazole", "Caspofungin", "Itraconazole"], "k": "A", "x": "Liposomal amphotericin B (+ urgent débridement, correct DKA). Voriconazole has no Mucor activity (posaconazole/isavuconazole are step-down options)"}, {"n": 27, "s": "Chronic granulomatous invasive fungal sinusitis is classically:", "o": ["Mucor in DKA", "Candida in HIV", "Alternaria in atopics", "A. fumigatus fungal ball", "Aspergillus flavus in immunocompetent patients (Sudan, India)"], "k": "E", "x": "A. flavus, immunocompetent, granulomas; slowly progressive proptosis"}, {"n": 28, "s": "The first surgical step for refractory paediatric CRS is:", "o": ["FESS", "Caldwell-Luc", "Adenoidectomy", "Inferior turbinate reduction", "Septoplasty"], "k": "C", "x": "Adenoidectomy (+ irrigation ± culture) first in children <12; ESS if this fails"}, {"n": 29, "s": "Unilateral foul-smelling maxillary sinusitis after dental work suggests:", "o": ["Fungal ball", "Allergic sinusitis", "Viral sinusitis", "Odontogenic sinusitis", "Nasal polyposis"], "k": "D", "x": "Odontogenic: unilateral, foul (anaerobes); treat the tooth + ESS"}, {"n": 30, "s": "Silent sinus syndrome presents with:", "o": ["Proptosis", "Enophthalmos and hypoglobus", "Epistaxis", "Facial pain", "Diplopia on upgaze only"], "k": "B", "x": "Chronic maxillary atelectasis → orbital floor sags → enophthalmos, hypoglobus; painless"}, {"n": 31, "s": "Barosinusitis most commonly affects the:", "o": ["Maxillary sinus", "Ethmoid sinus", "Sphenoid sinus", "All sinuses equally", "Frontal sinus"], "k": "E", "x": "Frontal (long, narrow frontonasal drainage); on descent"}, {"n": 32, "s": "Nosocomial sinusitis in ICU patients with nasogastric tubes is usually caused by:", "o": ["Gram-negatives (Pseudomonas)", "Streptococcus pneumoniae", "Haemophilus influenzae", "Moraxella catarrhalis", "Viruses"], "k": "A", "x": "Gram-negatives (Pseudomonas, Klebsiella), S. aureus; remove tubes"}, {"n": 33, "s": "The commonest primary immunodeficiency found in recurrent rhinosinusitis is:", "o": ["CVID", "SCID", "Selective IgA deficiency", "Complement deficiency", "Chronic granulomatous disease"], "k": "C", "x": "Selective IgA deficiency commonest; CVID commonest clinically significant — check IgG, IgA, IgM, vaccine responses"}, {"n": 34, "s": "The commonest site of a sinus mucocele is the:", "o": ["Maxillary sinus", "Sphenoid sinus", "Posterior ethmoid", "Frontoethmoid region", "Nasal septum"], "k": "D", "x": "Frontoethmoid ~60–65% → proptosis, displacement down and out"}, {"n": 35, "s": "A frontal mucocele is best treated by:", "o": ["Antibiotics", "Radiotherapy", "Routine osteoplastic obliteration", "Needle aspiration", "Endoscopic marsupialisation"], "k": "E", "x": "Endoscopic marsupialisation (low recurrence); external approach only if inaccessible"}, {"n": 36, "s": "The symptom most characteristic of CRS with nasal polyps is:", "o": ["Smell loss", "Facial pain", "Headache", "Epistaxis", "Fever"], "k": "A", "x": "Smell loss (polyps block the olfactory cleft + type 2 inflammation); facial pain more in CRSsNP"}, {"n": 37, "s": "Acute post-viral rhinosinusitis (EPOS) is defined by symptoms that:", "o": ["Last <10 days", "Increase after 5 days or persist >10 days", "Last >12 weeks", "Start with fever >39 °C", "Are unilateral only"], "k": "B", "x": "Post-viral: worse after 5 days or persisting >10 days (but <12 weeks)"}, {"n": 38, "s": "Allergic fungal rhinosinusitis is typically caused by:", "o": ["Mucor", "Candida", "Dematiaceous fungi (Bipolaris, Curvularia)", "Cryptococcus", "Histoplasma"], "k": "C", "x": "Dematiaceous fungi (Bipolaris, Curvularia, Alternaria) and Aspergillus"}, {"n": 39, "s": "Recurrent acute rhinosinusitis is defined as:", "o": ["≥2 episodes per year", "≥3 episodes in 6 months", "Continuous symptoms", "≥4 episodes per year with symptom-free intervals", "≥6 episodes per year"], "k": "D", "x": "≥4 episodes/year with complete resolution between"}, {"n": 40, "s": "The best topical steroid delivery after ESS is:", "o": ["Metered nasal spray", "Drops with head upright", "Oral steroids", "Nebuliser", "High-volume budesonide irrigation"], "k": "E", "x": "High-volume budesonide irrigation reaches the opened sinuses best"}, {"n": 41, "s": "Superantigens implicated in nasal polyposis are produced by:", "o": ["Staphylococcus aureus", "Streptococcus pneumoniae", "Pseudomonas aeruginosa", "Haemophilus influenzae", "Aspergillus"], "k": "A", "x": "S. aureus enterotoxins act as superantigens → polyclonal IgE, type 2 inflammation"}, {"n": 42, "s": "The most common bacterial causes of acute rhinosinusitis are:", "o": ["Staphylococcus aureus and anaerobes", "Streptococcus viridans, S. aureus and anaerobes", "Haemophilus influenzae and Streptococcus pneumoniae", "Pseudomonas and coagulase-negative staphylococci"], "k": "C", "x": "(PP ENT-A Q9) — S. pneumoniae, H. influenzae, M. catarrhalis"}, {"n": 43, "s": "Absolute indications for endoscopic sinus surgery include all EXCEPT:", "o": ["Mucoceles", "Headaches", "CSF rhinorrhoea", "Complications of rhinosinusitis", "Tumours"], "k": "B", "x": "(PP ENT-A Q11) — Headache alone is not an indication; mucocele, CSF leak, complications and tumours are"}, {"n": 44, "s": "Which is NOT necessary to diagnose chronic rhinosinusitis?", "o": ["CT with mucosal thickening", "Culture result for resistant bacteria", "Symptoms for more than 3 months", "Characteristic endoscopic findings"], "k": "B", "x": "(PP ENT-A Q12) — Culture not required; diagnosis = symptoms ≥12 weeks + endoscopy or CT"}, {"n": 45, "s": "Children are more likely to have sinusitis than adults because they:", "o": ["Have an immature immune system", "Have more viral URTIs", "Have smaller sinus ostia", "All of the above", "None of the above"], "k": "D", "x": "(PP ENT-A Q75) — All three contribute"}, {"n": 46, "s": "Complications of bacterial sinusitis include all EXCEPT:", "o": ["Pseudotumor cerebri", "Subperiosteal orbital abscess", "Cavernous sinus thrombosis", "Epidural abscess"], "k": "A", "x": "(PP ENT-A Q100) — Pseudotumor cerebri is idiopathic intracranial hypertension, not a sinusitis complication"}, {"n": 47, "s": "The chief shortcoming of intranasal (inferior meatal) antrostomy has been:", "o": ["Bony sequestrum", "Closure of the window", "Inability to use bilaterally", "Disruption of normal physiology", "Failure to remove diseased mucosa"], "k": "B", "x": "(PP ENT-B Q21) — Inferior meatal windows close (mucociliary flow goes to the natural ostium) — basis of middle meatal antrostomy"}, {"n": 48, "s": "A patient whose sinus CT shows mucosal thickening at the ostiomeatal complex:", "o": ["Requires endoscopic sinus surgery", "May have a cold, bacterial sinusitis, polyps or irreversible infundibular obstruction", "Should receive a broad-spectrum antibiotic", "Requires culture-directed antibiotics and nasal steroids"], "k": "B", "x": "(PP ENT-B Q55) — OMC thickening is non-specific; correlate with symptoms and endoscopy"}, {"n": 49, "s": "A woman had a frontal fracture treated by observation. Six months later she has severe headache. The likely diagnosis is:", "o": ["Mucocele", "Temporal arteritis", "CSF leak", "Migraine", "Meningitis"], "k": "A", "x": "(PP ENT-B Q88) — Post-traumatic frontal outflow obstruction → mucocele (months to years)"}, {"n": 50, "s": "An endocrine dysfunction not infrequently found in vasomotor rhinitis is:", "o": ["Diabetes insipidus", "Diabetes mellitus", "Hypothyroidism", "Hyperparathyroidism", "Primary aldosteronism"], "k": "C", "x": "(PP ENT-B Q22) — Old-bank key: hypothyroidism (nasal congestion from mucosal oedema)"}]}, {"c": 1, "t": "Session 3", "d": "Complications, FESS, CSF Rhinorrhoea, Midline Masses", "q": [{"n": 1, "s": "Chandler class III is:", "o": ["Preseptal cellulitis", "Orbital cellulitis", "Subperiosteal abscess", "Orbital abscess", "Cavernous sinus thrombosis"], "k": "C", "x": "Chandler: I preseptal · II orbital cellulitis · III subperiosteal abscess · IV orbital abscess · V cavernous sinus thrombosis"}, {"n": 2, "s": "Orbital complications of sinusitis most commonly arise from the:", "o": ["Ethmoid sinus", "Maxillary sinus", "Frontal sinus", "Sphenoid sinus", "Teeth"], "k": "A", "x": "Ethmoid via thin lamina papyracea, dehiscences and valveless veins"}, {"n": 3, "s": "The commonest orbital complication of sinusitis is:", "o": ["Orbital abscess", "Subperiosteal abscess", "Cavernous sinus thrombosis", "Orbital cellulitis", "Preseptal cellulitis"], "k": "E", "x": "Preseptal cellulitis (~70–80%); oral/IV antibiotics"}, {"n": 4, "s": "An initial trial of IV antibiotics alone is acceptable for a subperiosteal orbital abscess when:", "o": ["The patient is over 15 with a large abscess", "The child is under 9 with a small medial abscess and normal vision", "There is an afferent pupillary defect", "The abscess is superior", "The frontal sinus is involved"], "k": "B", "x": "Garcia-Harris criteria: age <9, medial, small, no visual compromise, no frontal involvement → 24–48 h IV antibiotics with close monitoring"}, {"n": 5, "s": "The earliest sign of optic nerve compromise in orbital infection is:", "o": ["Proptosis", "Chemosis", "Ophthalmoplegia", "Loss of red colour vision", "Papilloedema"], "k": "D", "x": "Red desaturation (colour vision) before acuity loss; check every few hours; RAPD = urgent drainage"}, {"n": 6, "s": "In cavernous sinus thrombosis, the cranial nerve usually affected first is:", "o": ["III", "IV", "V1", "V2", "VI"], "k": "E", "x": "VI lies free within the sinus (III, IV, V1, V2 in lateral wall); bilateral signs = CST"}, {"n": 7, "s": "Orbital apex syndrome differs from superior orbital fissure syndrome by the presence of:", "o": ["Ptosis", "Ophthalmoplegia", "Visual loss (optic nerve)", "Forehead numbness", "Proptosis"], "k": "C", "x": "Apex = SOF (III, IV, V1, VI) + optic nerve (vision loss)"}, {"n": 8, "s": "Intracranial complications of sinusitis typically occur in:", "o": ["Adolescent males with frontal sinusitis", "Infants with maxillary sinusitis", "Elderly women with sphenoid sinusitis", "Young children with ethmoiditis", "Adults with maxillary sinusitis"], "k": "A", "x": "Adolescent males: frontal diploic veins at peak vascularity; frontal lobe abscess, subdural empyema"}, {"n": 9, "s": "Pott's puffy tumour is:", "o": ["A frontal mucocele", "A frontal osteoma", "An ethmoid abscess", "Frontal osteomyelitis with subperiosteal abscess", "A nasal dermoid"], "k": "D", "x": "Frontal osteomyelitis + subperiosteal pus → doughy forehead swelling; associated intracranial abscess in up to 60%"}, {"n": 10, "s": "The intracranial complication of sinusitis requiring the most urgent neurosurgical drainage is:", "o": ["Meningitis", "Subdural empyema", "Small epidural abscess", "Cerebritis", "Pneumocephalus"], "k": "B", "x": "Subdural empyema: spreads rapidly, seizures, high mortality → urgent craniotomy/burr holes + sinus drainage"}, {"n": 11, "s": "The best imaging for suspected intracranial complication of sinusitis is:", "o": ["Plain radiograph", "Non-contrast CT", "Ultrasound", "Angiography", "MRI with gadolinium"], "k": "E", "x": "MRI with gadolinium (more sensitive for empyema, cerebritis, CST); CT for bone"}, {"n": 12, "s": "Isolated sphenoid sinusitis classically causes headache located at the:", "o": ["Vertex or retro-orbital region", "Cheek", "Forehead", "Temple only", "Neck"], "k": "A", "x": "Vertex/retro-orbital; risk of optic nerve, CST, meningitis"}, {"n": 13, "s": "The Messerklinger principle of FESS is:", "o": ["Radical mucosal stripping", "Inferior meatal drainage", "Restoring ostiomeatal ventilation and drainage", "Turbinectomy", "Sinus obliteration"], "k": "C", "x": "Restore OMC ventilation/drainage; diseased dependent sinuses recover"}, {"n": 14, "s": "The usual first step of FESS is:", "o": ["Sphenoidotomy", "Frontal sinusotomy", "Posterior ethmoidectomy", "Uncinectomy", "Septoplasty"], "k": "D", "x": "Uncinectomy → maxillary antrostomy → ethmoidectomy → sphenoid → frontal"}, {"n": 15, "s": "Mucus recirculation after maxillary antrostomy occurs when:", "o": ["The antrostomy is too large", "The natural ostium is not included", "The middle turbinate is resected", "The inferior turbinate is reduced", "Saline irrigation is used"], "k": "B", "x": "Accessory and natural ostia not joined → mucus exits natural ostium and re-enters via the antrostomy"}, {"n": 16, "s": "The natural sphenoid ostium lies:", "o": ["Lateral to the middle turbinate", "In the middle meatus", "On the sphenoid floor", "Above the cribriform plate", "Medial to the superior turbinate"], "k": "E", "x": "Medial to superior turbinate, ~1.5 cm above the choana; safest entry inferomedial"}, {"n": 17, "s": "A Draf III procedure is:", "o": ["Endoscopic modified Lothrop", "Anterior ethmoidectomy only", "Unilateral frontal sinus floor removal", "Osteoplastic flap", "Frontal trephination"], "k": "A", "x": "Draf I: frontal recess clearance · IIa: unilateral floor (lamina to MT) · IIb: lamina to septum · III: bilateral + upper septum (modified Lothrop)"}, {"n": 18, "s": "A Kuhn type 4 frontal cell is:", "o": ["A single cell above the agger nasi", "A tier of cells above the agger nasi", "An isolated cell within the frontal sinus", "A single massive cell extending into the frontal sinus", "A supraorbital ethmoid cell"], "k": "C", "x": "Kuhn: 1 single cell above agger · 2 tier above agger · 3 single cell into frontal sinus · 4 isolated cell within frontal sinus (now IFAC)"}, {"n": 19, "s": "Image guidance in sinus surgery is indicated for:", "o": ["Simple uncinectomy", "Turbinate reduction", "Septoplasty", "Revision surgery with distorted anatomy", "Antrochoanal polyp in a child"], "k": "D", "x": "Revision, distorted anatomy, frontal/sphenoid/posterior ethmoid disease, extensive polyposis, skull base lesions"}, {"n": 20, "s": "The commonest site of iatrogenic CSF leak during ESS is the:", "o": ["Sphenoid roof", "Posterior frontal table", "Planum sphenoidale", "Posterior fovea ethmoidalis", "Lateral lamella of the cribriform plate"], "k": "E", "x": "Lateral lamella (thinnest, near AEA entry), especially Keros III"}, {"n": 21, "s": "Orbital haematoma with rising intraocular pressure after ESS is managed by:", "o": ["Observation", "Lateral canthotomy and cantholysis", "Ice packs only", "Re-packing the nose", "Oral steroids"], "k": "B", "x": "Lateral canthotomy + inferior cantholysis within ~90 minutes; mannitol/acetazolamide adjuncts"}, {"n": 22, "s": "Rapidly expanding retrobulbar haemorrhage during ESS usually comes from the:", "o": ["Anterior ethmoidal artery", "Orbital veins", "Sphenopalatine artery", "Superior ophthalmic vein", "Internal carotid artery"], "k": "A", "x": "Transected AEA retracts into orbit → arterial, rapid; venous haematoma is slower"}, {"n": 23, "s": "The extraocular muscle most often injured during ESS is the:", "o": ["Superior oblique", "Inferior rectus", "Medial rectus", "Lateral rectus", "Inferior oblique"], "k": "C", "x": "Medial rectus (behind lamina papyracea) → diplopia"}, {"n": 24, "s": "Epiphora after maxillary antrostomy suggests:", "o": ["Orbital fat injury", "Lamina papyracea breach", "Infraorbital nerve injury", "Synechiae", "Nasolacrimal duct injury from anterior extension"], "k": "E", "x": "NLD lies just anterior to the uncinate/natural ostium; don't extend antrostomy anteriorly"}, {"n": 25, "s": "Internal carotid injury during sphenoidotomy is managed by:", "o": ["Monopolar cautery", "Neck ligation", "Bipolar coagulation", "Packing, then urgent angiography and endovascular control", "Observation"], "k": "D", "x": "Pack (crushed muscle/Surgicel), maintain perfusion, urgent angiography → endovascular occlusion/stent; risk of later pseudoaneurysm"}, {"n": 26, "s": "The commonest complication of ESS is:", "o": ["CSF leak", "Synechiae", "Orbital injury", "Haemorrhage requiring transfusion", "Blindness"], "k": "B", "x": "Synechiae (MT to lateral wall) ~6–10%; major complications <1%"}, {"n": 27, "s": "Empty nose syndrome follows:", "o": ["Excessive turbinate resection", "Septoplasty", "Uncinectomy", "Adenoidectomy", "Polypectomy"], "k": "A", "x": "Excessive (especially inferior) turbinate resection → paradoxical sense of obstruction, dryness"}, {"n": 28, "s": "The commonest cause of CSF rhinorrhoea is:", "o": ["Spontaneous", "Iatrogenic", "Accidental trauma", "Tumour", "Congenital"], "k": "C", "x": "Accidental trauma ~80%; iatrogenic ~16%; spontaneous/congenital/tumour the rest"}, {"n": 29, "s": "The typical patient with spontaneous CSF rhinorrhoea is a:", "o": ["Young thin male", "Child", "Elderly man",
