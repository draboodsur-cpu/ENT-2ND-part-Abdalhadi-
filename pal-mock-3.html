<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}

<script>
const P={"title":"ENT Mock Exam — Paper 3","q":[{"s":"Which of the following statements concerning the management of aural atresia is false?","o":["It is performed as part of the second or third stage of the auricular reconstruction.","The surgeon should anticipate that the facial nerve will be located more anteriorly and more medially than in the normal temporal bone.","The meatus is created by drilling among the glenoid fossa anteriorly, the tegmen plate superiorly, and the mastoid cells posteriorly.","Temporalis fascia is harvested for reconstruction of the tympanic membrane.","Reconstruction of the atresia is deferred until the auricular cartilaginous scaffolding is completed."],"k":"B","x":"Reconstruction of the atresia is deferred until the auricular cartilaginous scaffolding is completed. It is performed as part of the second or third stage of the auricular reconstruction. A postauricular approach is used, with great care being taken not to expose the scaffold. Temporalis fascia is harvested for reconstruction of the tympanic membrane. After elevation of the periosteum, a bony circular canal is created by drilling between the glenoid fossa anteriorly and the tegmen plate superiorly while trying to avoid entering mastoid air cells posteriorly. The surgeon should anticipate that the facial nerve will be located more anteriorly and more laterally than in the normal temporal bone. The purposeful identification of the facial nerve will prevent inadvertent injury. Facial nerve monitoring may facilitate identification of the nerve in these atretic ears.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q10"},{"s":"Which of the following statements about the carbon-dioxide laser is true?","o":["The carbon-dioxide laser lacks precision.","The carbon-dioxide laser should not be used to coagulate vessels under 0.5 mm in diameter.","The carbon-dioxide laser is most often used in a fiberoptic delivery system.","The carbon-dioxide laser is able to deliver a small spot size.","The carbon-dioxide laser produces a visible red beam of light."],"k":"D","x":"The advantages of the carbon-dioxide laser are that it is precise and capable of delivering a very small spot size. The disadvantages of this laser are that it is not good at coagulating vessels larger than 0.5 mm in diameter and cannot be easily delivered with a fiberoptic delivery system.Although its beam is invisible, the focusing lens usually is treated with special coatings to allow the helium-neon aiming beam and the carbon-dioxide beam to be focused coplanar.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q8"},{"s":"All of the following are advantages of using a pumpregulated drainage system for lumbar drainage of a cerebrospinal fluid leak EXCEPT:","o":["Patient can move about more freely","Decreased risk of tension pneumocephalus","Strictly regulated flow of CSF","Lower risk of meningitis"],"k":"D","x":"There is no study showing that pump-regulated drainage is associated with a lower risk of meningitis, but pump-regulated drainage does allow the patient to move about more freely, decreases the risk of accidental tension pneumocephalus due to unregulated CSF drainage, and does provide for a strict regulation of CSF flow.","d":"Otology","src":"Brackmann · Chapter 60 · Q1"},{"s":"The results have shown that tinnitus retraining therapy is","o":["only suitable for patients without hearing loss.","only to be practiced by audiologists.","not to be used for somatosound.","providing a cure for tinnitus.","effective regardless of the etiology of tinnitus."],"k":"E","x":"Tinnitus retraining therapy can be and has been used effectively for patients with various causes of tinnitus.","d":"Otology","src":"Ballenger · Tinnitus and Hyperacusis · Q8"},{"s":"Socioacusis is a term that refers to hearing loss associated with","o":["social events such as rock concerts.","lifestyle factors such as diet and exercise.","exposure to nonoccupational noise.","exposure to transportation noise.","all of the above."],"k":"E","x":"Socioacousis is defined as the hearing loss produced primarily by exposure to nonoccupational noise in combination with lifestyle factors such as diet and exercise.","d":"Otology","src":"Ballenger · Presbyacusis · Q1"},{"s":"Which of the following is the least common complication of adenotonsillectomy?","o":["torticollis","nasopharyngeal stenosis","hypernasal speech","dehydration","bleeding"],"k":"B","x":"All are complications of adenotonsillectomy, but nasopharyngeal stenosis is the least common. Postoperative bleeding is the most serious complication, occurring in up to 3% of patients. Dehydration is common, especially with children, because they will not swallow because of the severe throat pain. Hypernasal speech commonly occurs immediately following the operation because the pain limits motion of the tonsillar pillars and soft palate. This usually resolves in several weeks. Torticollis is not uncommon and is usually caused by inflammation of the paraspinus muscles. Nasopharyngeal stenosis is rare and develops when the inferiolateral adenoid tissue is removed and there is simultaneous denuding or excision of the posterior tonsillar pillars.Adhesions form between the raw surfaces, resulting in scarring and obstruction.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q9"},{"s":"You are counselling a 32-year-old woman about thyroidectomy for her Graves’ disease. Which of the following statements is true?","o":["Her eye symptoms and signs are more likely to improve with radio-iodine than surgery","She would be best served by having a subtotal thyroidectomy","Transient hypocalcaemia is very rare","Superior laryngeal nerve injury is usually asymptomatic","Recurrent laryngeal nerve injury is usually asymptomatic"],"k":"D","x":"In all but professional voice users, damage to the superior laryngeal nerve is asymptomatic. However, in singers or other performers, superior laryngeal nerve palsy can be devastating.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q41"},{"s":"Surgical resection of an advanced oropharyngeal lesion necessitating a mandibulotomy approach with mandibular preservation is best reconstructed with what type of flap?","o":["local tongue flap","pectoralis major myocutaneous flap","radial forearm free flap","fibular osteocutaneous free flap","deltopectoral flap"],"k":"C","x":"The thin, pliable nature of the radial forearm free flap makes it an ideal method of reconstruction for this type of defect. It is a reliable flap that minimizes the chance of tethering the tongue, compared with a local tongue flap. The bulky nature of the pectoralis major myocutaneous flap makes it a less suitable choice for this type of intraoral reconstruction. The fibular osteocutaneous free flap is a useful flap for reconstruction following segmental mandibulectomy. The deltopectoral flap was commonly used for head and neck reconstruction prior to the introduction of the pectoralis major myocutaneous flap and microvascular free tissue transfer.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q10"},{"s":"A 63-year-old woman presents with acute onset of edema of the tongue. There is no history of trauma or a rash. Which class of medications is most likely to be associated with her condition?","o":["chemotherapeutic agents","angiotensin converting enzyme inhibitors","antihistamines","corticosteroids","bronchodilators"],"k":"B","x":"The lack of a rash makes an allergic cause less likely. Angiotensin converting enzyme inhibitors are the most common medications precipitating edema in acquired angioedema. The effects of kinase II, which stimulates the conversion of angiotensin I to the vasoconstrictive angiotensin II and inactivates bradykinin, a potent vasodepressor, are blocked by angiotensin converting enzyme inhibitors.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q9"},{"s":"Concerning nasal ciliary physiology and anatomy, which of the following statements is least accurate?","o":["The nose is lined by ciliated pseudostratified glandular columnar epithelium","The nasal cilia are arranged as nine microtubule doublets formed in an outer circle around a central pair","The outer microtubular doublets are linked by the protein nexin","Ciliary movement is described as having two phases","Normal ciliary beat frequency is approximately 10—25 beats per minute"],"k":"E","x":"Normal ciliary beat frequency is approximately 1000-1500 beats per minute.\nThe epithelium lining of the upper airways is with ciliated pseudostratified glandular columnar epithelium. There is a ‘nine-plus-two’ arrangement of the normal cilia, with two central microtubules surrounded by nine microtubule doublets. Nexin arms link the outer doublets. Ciliary movement has an effective stroke phase that sweeps forward and a recovery phase during which the cilia bend backward and extend into the starting position for the stroke phase.","d":"Rhinology","src":"SBA book · Rhinology · Q2"},{"s":"In patients with autoimmune inner ear disease, when high-dose corticosteroids improve hearing and then become less effective, the following statements about adjuvant treatments are true except","o":["methotrexate, 20 mg per day, can be added to maintain hearing improvement.","cyclophosphamide can be administered on a daily oral basis or intravenously once a month.","plasmapheresis can be a useful adjuvant in helping to stabilize patients with autoimmune inner ear disease.","cyclophosphamide has long-term risks of sterility and malignancies in treated patients.","transtympanic corticosteroids may be helpful to obtain higher local doses to the inner ear and avoid systemic side effects."],"k":"A","x":"All of the statements except A are correct. The correct dosage of methotrexate is 7.5 to 20 mg per week, not daily.","d":"Otology","src":"Ballenger · Autoimmune Inner Ear Disease · Q10"},{"s":"With regard to inverted papilloma, which of the following statements is correct?","o":["It characteristically arises from the ethmoid sinuses","It has a 20-25% risk of malignant transformation","Itis called inverted as the epithelium inverts through the basement membrane","The human papillomavirus (HPV) is implicated in inverted papilloma","On CT it has a classical cerebriform appearance"],"k":"D","x":"Inverted papillomas are benign epithelial nasal tumours generally arising from Schneiderian epithelium lining of the nasal cavity and paranasal sinuses. They comprise 0.5—4% of all sinonasal tumours removed. The usual presentation is of a unilateral polyp, nasal obstruction, and rhinorrhoea with eventual progression to proptosis. They are benign tumours although they may cause bony destruction as they grow, and have a 2-10% chance of malignant transformation, although malignant transformation is thought to be at the lower end of this percentage, and the higher figure relates to these tumours being associated with a synchronous sinonasal squamous cell carcinoma. Unlike malignant tumours which invade bone, inverted papillomas tend to cause pressure devascularization. Histologically, these tumours demonstrate epithelium which invades the stroma. It is this invagination of epithelium into the surrounding stroma which gives the classical MRI picture of cerebriform (meaning brain-like). (Invasion through the basement membrane is characteristic of carcinoma by definition.)\nTreatment is excision either through endoscopic or open approaches. Ideally through an endoscopic approach, a medial maxillectomy is performed affording complete removal of the tumour and allowing greater surveillance in the outpatient setting.","d":"Rhinology","src":"SBA book · Rhinology · Q54"},{"s":"Which of the following is not a component of the primary olfactory cortex?","o":["anterior olfactory nucleus","piriform cortex","orbitofrontal cortex","periamygdala cortex","entorhinal area"],"k":"C","x":"The orbitofrontal cortex is generally considered to be the secondary olfactory cortex, not the primary olfactory cortex, as it does not receive olfactory bulb afferents. It does connect reciprocally with the major elements of the primary olfactory cortex, with some of these connections occurring through the thalamus.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q8"},{"s":"The audiometric profile in sudden sensorineural hearing loss most predictive of benefit from corticosteroids is","o":["mild, “U”-shaped, and unilateral.","within normal limits bilaterally.","moderate and unilateral.","profound and unilateral.","profound and bilateral."],"k":"C","x":"Wilson and colleagues’(1980) study showed that “U-shaped” losses always improved spontaneously, profound losses were not helped by corticosteroids, and moderate losses doubled their recovery rate with corticosteroids.","d":"Otology","src":"Ballenger · Idiopathic Sudden Sensorineural Hearing Loss · Q6"},{"s":"Which area would have the lowest incidence of nasopharyngeal carcinoma?","o":["Beijing, People’s Republic of China","an Alaskan Inuit village","Buenos Aires, Argentina","Ho Chi Minh City, Vietnam","Taipei, Taiwan"],"k":"C","x":"The largest incidences of nasopharyngeal carcinoma are observed in Asian populations, particularly in southern areas of China. Other ethnic groups at higher risk include southeastern Asian countries, northern Africa, and certain Native American populations. Black, Hispanic, and Caucasian populations have the lowest incidences.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Nasopharynx · Q1"},{"s":"Which of the following is not an opening into the temporal bone?","o":["Internal auditory canal","Vestibular aqueduct","Jugular foramen","Cochlear aqueduct","Subarcuate fossa"],"k":"C","x":"The jugular foramen is bordered laterally by the temporal bone but does not enter it.\nThe internal auditory canal transmits the facial nerve, the vestibular nerve, and the cochlear nerve. The vestibular aqueduct transmits the endolymphatic duct.\nThe cochlear aqueduct transmits a prolongation of the dura mater establishing a communication between the perilymphatic space and the subarachnoid space, and transmits a vein from the cochlea to join the internal jugular.\nThe subarcuate fossa transmits a small vein.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q1"},{"s":"What is the most commonly encountered benign nonepithelial tumor of the esophagus?","o":["fibroma","lipoma","leiomyoma","neurofibroma","hemangioma"],"k":"C","x":"Leiomyomas account for more than half of all benign nonepithelial tumors of the esophagus. They are intramural encapsulated tumors more often found in the middle or lower esophagus. Leiomyomas often produce widening of the lower part of the mediastinum and appear as a mass in the posterior part of the mediastinum in chest radiographs.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q10"},{"s":"Which of the following statements is not true about laryngeal tuberculosis?","o":["It is one of the most common granulomatous diseases of the larynx.","It is usually associated with advanced pulmonary disease.","Its prevalence has been rising since the emergence of HIV.","The clinical presentation is often similar to that of a neoplastic process.","One-quarter of patients with laryngeal tuberculosis present with airway obstruction."],"k":"B","x":"Laryngeal tuberculosis is one of the most common granulomatous diseases of the larynx. It is usually not associated with advanced pulmonary disease and therefore may be mistaken for laryngeal carcinoma. Its prevalence has been increasing since the emergence of HIV. One-quarter of patients with laryngeal tuberculosis present with airway obstruction.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q10"},{"s":"Factors that have been shown to contribute to the pathogenesis of acute rhinosinusitis in adults include all of the following except","o":["dysfunction of mucociliary clearance.","obstruction of the ostiomeatal complex.","immunodeficiency syndromes.","upper respiratory tract viral infections.","gastroesophageal reflux disease."],"k":"E","x":"The factors listed in choices A through D have been demonstrated to contribute to the development of acute rhinosinusitis. Although there is some evidence to suggest that gastroesophageal reflux may have a role in pediatric rhinosinusitis, a role in the adult condition has not been demonstrated.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q1"},{"s":"Which of the following substances is not synergistic with sound in the production of noise-induced hearing loss?","o":["environmental toluene","petroleum products","aspirin ingestion","carbon disulfide","heavy metal exposure"],"k":"C","x":"There is now considerable literature about the interaction between various chemicals and noise exposure in the cochlea. These include aminoglycoside antibiotics and certain organic solvents. Toluene, widely used in the printing industry, is particularly well studied. It is synergistic with noise. Thus, lower safe levels of noise are required in an atmosphere that contains otherwise safe levels of toluene. Similarly, unexpectedly severe hearing losses have been found in refinery operators, although most workers are isolated from the noise. Lead exposure and certain other heavy metals such as mercury produce hearing loss and interact with noise, as does carbon disulfide, which is used in certain chemical processes. Fortunately, although aspirin in high doses is ototoxic, there is no evidence that it is synergistic with noise exposure.","d":"Otology","src":"Ballenger · Occupational Hearing Loss · Q10"},{"s":"In patients presenting with glottic carcinoma,","o":["hoarseness is the most common initial symptom.","pain occurs early in the disease.","nodal metastasis is the primary complaint.","most have had several months of dysphagia.","distant metastasis is common."],"k":"A","x":"Hoarseness is the initial symptom in glottic carcinoma. Dyspnea, dysphagia, and pain occur with advanced tumors, owing to invasion through cartilage and extralaryngeal structures. Later symptoms are cough, hemoptysis, halitosis, and weight loss. Patients with supraglottic carcinoma tend not to have symptoms until the disease is more advanced, and regional metastasis is often the first sign of illness. Distant metastasis is reported to occur in 8 to 10% of patients on presentation with laryngeal carcinoma.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Larynx and Laryngopharynx · Q4"},{"s":"As part of a multidisciplinary team in a voice clinic, which of the following professionals might you not expect to find present?","o":["Occupational therapist","Speech and language therapist","Manual therapist","Singing teacher","Psychologist"],"k":"A","x":"The very minimum requirement for a voice clinic is the presence of an ENT surgeon and a speech and language therapist. In some voice clinics, a manual therapist may attend to address musculoskeletal tension issues, and a psychologist may help with the psychological aspects of dysphonia. A singing teacher may also be of great help in treating professional voice users.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q27"},{"s":"A disadvantage of upper eyelid gold weight implantation versus a palpebral wire spring is","o":["its irreversibility.","it is less likely to mimic a spontaneous blink.","it is technically a more difficult procedure.","its lack of prefabricated sizes.","its propensity for lid underclosure."],"k":"B","x":"Gold weight implantation for eyelid reanimation has many advantages over the palpebral spring. The palpebral wire spring in experienced hands can afford the capability of mimicking to some extent the spontaneous blink. However, it is technically more difficult to perform, with a higher reported extrusion and infection rate.","d":"Otology","src":"Ballenger · Facial Paralysis · Q2"},{"s":"Medial third stenosis may result in","o":["Weeping and chronic otitis externa","Conductive hearing impairment","Formation of dense scar lateral and medial to the tympanic membrane","A AND B","All of the above"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 2 · Q4"},{"s":"For the partial stapedectomy technique, how much of the footplate should be removed?","o":["All of it","25%","Only that part which comes out easily","75%"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 23 · Q1"},{"s":"The lateral technique tympanoplasty","o":["is technically more demanding than the medial technique.","provides better exposure for repairing anterior perforations.","usually requires a canalplasty.","may be complicated by cholesteatoma between the remnant of the tympanic membrane and the graft.","all of the above are true."],"k":"E","x":"The first four choices are correct statements, making E the best response.","d":"Otology","src":"Ballenger · Chronic Otitis Media · Q6"},{"s":"In situations of bilateral peripheral paresis, the rotational chair system","o":["provides for accurate prognosis of recovery of function in patients with peripheral lesions.","can affect the management plan of the patient by being the only study available to delineate the actual extent of bilateral paresis.","is the only study available to determine the relative reduction in responsiveness, left versus right.","is typically of no use.","A and B."],"k":"B","x":"The rotational chair is the only study to determine the extent of bilateral involvement. In doing so, aspects of the vestibular and balance rehabilitation program for treatment of these patients can be altered based on realistic goals for what can be accomplished in light of the severity of bilateral involvement.","d":"Otology","src":"Ballenger · Evaluation of the Vestibular (Balance) System · Q6"},{"s":"Parasympathetic innervation to the submandibular gland is carried by the:","o":["Lesser petrosal nerve","Facial nerve","Glossopharyngeal nerve","Jacobsen’s nerve","Greater superficial petrosal nerve"],"k":"B","x":"The parasympathetic supply of the submandibular gland is carried by the facial nerve. The chorda tympani branch of the facial nerve exits the skull base via the petrotympanic fissure to enter the infratemporal fossa. It then hitchhikes on the lingual nerve (branch of V3) to supply taste to the anterior two-thirds of the tongue and provide parasympathetic fibres to the submandibular gland.\nThe lesser petrosal nerve (continuation of Jacobsen’s nerve) is a branch of the glossopharyngeal nerve. It supplies parasympathetic fibres to the parotid gland.\nThe greater superficial petrosal nerve branches off the facial nerve at the geniculate ganglion and is then joined by the deep petrosal nerve (sympathetic fibres). It passes forward in the pterygoid canal (Vidian canal) to give parasympathetic innervation to the lacrimal, nasal, palatine, and pharyngeal glands.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q2"},{"s":"A patient with human immunodeficiency virus with a CD4 count of less than 200 cells/mm3 presents with a polyp of the middle ear and discharge. These findings are most likely attributable to an infection that would respond best to which treatment?","o":["isoniazid","rifampin","trimethoprim-sulfamethoxazole","amphotericin B","fluconazole"],"k":"C","x":"Pneumocystis carinii infections of the middle ear respond well to trimethoprim-sulfamethoxazole.","d":"General","src":"Ballenger · Etiology of Infectious Diseases of the Upper Respiratory Tract · Q3"},{"s":"Which of the following statements is true regarding injection thyroplasty?","o":["It is not indicated in patients with a palliative diagnosis","A possibility of neuropraxia and resultant nerve recovery is an absolute contraindication","It is indicated in patients with a 1-3 mm glottic gap on phonation","Calcium hydroxylapatite is a common short-term injectable preparation","Gelfoam is in common usage for temporary injection thyroplasty"],"k":"C","x":"Injection thyroplasty is a useful technique on its own, or in conjunction with laryngeal framework surgery to improve phonation. Its uses include those patients not suitable for a general anaesthetic, and those managed palliatively to improve quality of life and reduce aspiration risk. The technique can be performed in the office setting, under local anaesthetic.\nCalcium hydroxylapatite (Radiesse Voice) is present for between 12 and 24 months post injection. Gelfoam is not in common usage as it requires a large-gauge needle for injection.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q67"},{"s":"A lid suture taped to the cheek and temporary tarsorrhaphy suture are","o":["Old methods that are only of historical interest","Ways to close the eye on a windy day","Complex procedures requiring special skills","Only useful for a day or two","Useful temporizing measures until a definitive solution to the eyelid closure problem can be implemented"],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 61 · Q5"},{"s":"Headaches more likely to occur in men include","o":["migraine.","cluster.","tension.","trigeminal neuralgia.","giant cell arteritis."],"k":"B","x":"Most headache types occur more often in women. This is true for migraines, tension headaches, trigeminal neuralgia, and giant cell arteritis. The notable exception is cluster headaches, which afflict men more often than women.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q1"},{"s":"The following are useful assessments to undertake during a modified functional endoscopic assessment of swallow except:","o":["Assessment of vocal cord mobility","Assessment of laryngeal sensation","Amount of residue noted","Secretion management","Maximum phonatory time"],"k":"E","x":"A functional assessment of swallow can produce useful information. Overall assessment, including vocal cord mobility, secretion management, and laryngeal inlet sensation, is useful. Base of tongue retraction and laryngeal elevation, and assessment of swallow for different textures is also useful. It is possible to assess usefulness of manoeuvres such as a chin tuck, or head turn in a dynamic test such as an endoscopic evaluation of swallowing (FEES). In addition, it can be useful if biofeedback is needed to improve technique, or compliance.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q77"},{"s":"Regarding antrochoanal polyp, which of the following statements is true?","o":["It is a common cause of nasal polyposis accounting for 50% of patient who present with nasal polyps","It is commoner in females","It usually occurs in an older population","It is lined by respiratory epithelium with increased inflammatory cells","It responds well to topical nasal steroids as first-line treatment"],"k":"D","x":"Antrochoanal polyp is a benign condition usually arising in young adults, typically\n25-30 years of age, compared to nasal polyposis which generally occurs with a mean age of presentation at 50 years. One-quarter of patients presenting with an antrochoanal polyp will be children. Antrochoanal polyps account for 4-6% of nasal polyps. There is an equal sex distribution, and although a few studies have found a slight male predominance, they have suffered from small numbers, making this conjecture. The history is characteristically unilateral nasal obstruction and rhinorrhoea. These polyps arise from the maxillary sinus (the posterior wall is generally thought\nto be the most common place of origin) and extend through a widened ostium into the nasal cavity, and nasopharynx. As for any unilateral nasal lesion CT is usually the investigation of choice, given no bony destruction but a smooth enlargement of the sinus. Treatment is surgical, generally via endoscopic excision. It is important to remove the stalk otherwise there is a potential for recurrence. Histologically, antrochoanal polyps are similar to inflammatory polyps, being lined by respiratory epithelium with increased inflammatory infiltrate, although with much less inflammatory cells and reduced levels of eosinophils compared to nasal polyposis.","d":"Rhinology","src":"SBA book · Rhinology · Q55"},{"s":"Which of the following conditions is not associated with a predisposition for chronic ear disease?","o":["Chronic tonsillitis","Adenoid hypertrophy","Allergic rhinitis","Chronic sinusitis"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 12 · Q1"},{"s":"Which of the following is not a means for assessing hearing aid outcomes?","o":["real-ear measures","manufacturer specifications","self-assessment inventories","electroacoustic analysis","functional gain measures"],"k":"B","x":"Real-ear measures, self-assessment inventories, electroacoustic analysis, and functional gain measures are all routine procedures used by audiologists to assess hearing aid function and benefit. Manufacturer specifications merely state what that particular model of hearing aid is designed to do. Unfortunately, some hearing aids may not necessarily be performing within design specifications; therefore, it is important to assess its performance.","d":"Otology","src":"Ballenger · Diagnostic Audiology, Hearing Aids, and Habilitation Options · Q7"},{"s":"The disadvantages of skin testing include","o":["the inability to perform the test in patients with dermatographism.","poor tolerance in children.","the need to withhold certain medications.","the possibility of systemic reactions.","all of the above."],"k":"E","x":"Both skin and radioallergosorbent test (RAST) can be employed in the diagnosis of allergic rhinitis. All of the choices are disadvantages to skin testing, although in vitro testing also has disadvantages, including cost, slightly lower sensitivity, and the time delay between drawing the blood and obtaining the results. Data from clinical studies comparing the results of skin testing and RAST in allergic subjects suggest a good correlation between the two, with a higher sensitivity for skin testing.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q7"},{"s":"Patients with Sjögren’s syndrome have how much greater risk of developing salivary gland lymphoma than the general population?","o":["4 times","10 times","25 times","44 times","100 times"],"k":"D","x":"One of the underlying defects in Sjögren’s syndrome is B-cell hyperactivity with or without abnormalities of immunoregulation. This predisposes patients to developing lymphoproliferative disease that may progress to B-cell-type lymphoma. The risk of developing lymphoma by an individual with Sjögren’s syndrome is 44 times greater than the risk for a person without Sjögren’s syndrome.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Salivary Glands · Q6"},{"s":"You perform microlaryngoscopy and bronchoscopy (MLB) on a 6- month-old child with increasing inspiratory stridor and see subglottic haemangioma obstructing 40% of the airway. The child is not desaturating and is able to feed although hasn’t been gaining weight appropriately. What would be the appropriate management?","o":["Endoscopic debridement of the haemangioma","Intralesional steroid injections followed by a trial of propranolol","Endoscopic laser treatment followed by a trial of propranolol","A trial of propranolol commenced as an inpatient with serial MLB follow-up","Open airway surgery to remove the haemangioma"],"k":"D","x":"The use of propranolol is now recognized as a safe and efficacious treatment for infantile haemangioma of the airway. In such cases, propranolol should only be commenced as an inpatient after a full cardiovascular and respiratory review. The treatment is started at a dose of 1 mg/kg/day in three divided doses and increased to 2 mg/kg/day after 1 week of therapy. The blood pressure and heart rate should be monitored very carefully throughout the treatment. Serial endoscopic follow-up should be arranged to monitor the effect of treatment.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q42"},{"s":"Which of the following are important factors in considering a temporalis muscle transposition procedure?","o":["Airway structure","Appearance of nasolabial structures","Type of smile on unaffected side","B AND C","All of the above"],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 63 · Q6"},{"s":"Which of the following glands contribute to mucus production in the olfactory neuroepithelium?","o":["schneiderian glands","Ebner’s glands","Bowman’s glands","Magendie’s glands","ciliary glands"],"k":"C","x":"The glands within the lamina propria were first described by Todd and Bowman in 1847. Named Bowman’s glands by von Kölliker in 1858, these glands provide a microenvironment in which optimal odorant absorption is enhanced. There are no schneiderian glands, although the nasal mucous membrane is sometimes termed the schneiderian membrane. Ebner’s glands secrete mucus around the circumvallate papillae, whereas Magendie’s glands are fictitious. Ciliary glands are related to the hair follicles of the eyelashes.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q7"},{"s":"Septal perforations","o":["may result from malignant tumors.","always produce collapse of the bridge.","always produce nasal symptoms.","are often associated with the use of topical nasal corticosteroids.","are easy to close surgically."],"k":"A","x":"The most common cause of septal perforations is trauma that may be self-inflicted or iatrogenic. However, malignant T-cell lymphomas can produce destructive lesions in the midline and should be treated after full staging with a full course of radiotherapy. They may be associated with Epstein-Barr virus. Collapse of the bridge may occur, particularly in association with granulomatous diseases or after trauma and surgery, although this is by no means a constant occurrence. The edges of the perforation may be associated with crusting, and this, together with the turbulence of inspired air, can produce a sensation of congestion or nasal blockage. However, many patients are unaware that a perforation is present. The evidence that nasal corticosteroids cause septal perforations is entirely circumstantial, and there are only a couple of well-documented case reports in the literature. Unfortunately, the short- and long-term results of surgical closure are only moderately successful.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q7"},{"s":"Which of the following statements concerning the management of microtia is false?","o":["Microtia surgery is technically difficult.","A three-stage procedure is required to correct a severe grade III microtia.","During the first stage, a segment of cartilage is obtained from the lower costochondral skeleton and implanted into a subcutaneous pocket.","During the second stage, the auricle is freed from the scalp, a split-thickness skin graft is used to create a postauricular sulcus, and the tragus is created.","An alternative technique for the treatment of severe grade III microtia is to use a lifelike prosthetic ear that is attached to surgically implanted titanium posts that securely hold the auricle in a normal anatomic position."],"k":"D","x":"Microtia surgery is technically difficult, and not infrequently, the results are somewhat disappointing. Correction of a severe grade III microtia requires several staged procedures. During the first stage, either a carved segment of cartilage from the lower costochondral skeleton or an alloplastic scaffold is placed into a subcutaneous pocket at the appropriate position. A portion of the microtic skin tag is maintained to construct the lobule. During the second stage, the auricle is freed from the scalp, and a split-thickness skin graft is used to create a postauricular sulcus. At a third stage, the tragus is created. An alternative technique for the treatment of severe grade III microtia is to use a lifelike prosthetic ear that is attached to surgically implanted titanium posts that securely hold the auricle in a normal anatomic position.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q9"},{"s":"Microlaryngoscopy and bronchoscopy (MLB) anaesthesia: which of the following are not generally involved in general anaesthesia for a routine diagnostic paediatric MLB?","o":["Anticholinergic medications","Local anaesthetic spray","Spontaneous ventilation","Gas induction","Muscle relaxants"],"k":"E","x":"Where possible, a diagnostic MLB in the paediatric population is performed under anaesthesia whereby the patient is spontaneously ventilating. This is best achieved using inhaled agents such as sevoflurane, often delivered through a nasopharyngeal airway. Anticholinergic may be administered to reduce secretions and a local anaesthetic spray to the larynx enables instrumentation without laryngospasm.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q36"},{"s":"In hereditary hemorrhagic telangiectasia,","o":["the genetic transmission is autosomal dominant and sex linked.","the primary defect is an absence of muscle and elastic tissue in the tunica media of the telangiectasia.","clotting tests are abnormal.","patients may be successfully and optimally treated with the carbon-dioxide laser.","the lesions are confined to the skin and mucosal surfaces."],"k":"B","x":"Absence of the muscle and elastic tissue in the tunica media impairs the ability of the vascular malformations to constrict when traumatized. Bleeding will continue until clotting occurs, the latter being normal. The condition is autosomal and dominant but not sex linked. Although telangiectasia is most obvious on the skin and mucosal surfaces of the respiratory and gastrointestinal tracts, the telangiectasia may be found in any organ in the body.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q6"},{"s":"What is the most common type of post-traumatic vertigo?","o":["benign paroxysmal positional vertigo","chronic Meniere’s disease","recurrent severe episodes of vertigo","perilymphatic fistula","vestibular neuronitis"],"k":"A","x":"Benign paroxysmal positional vertigo occurs in 25% of all head injuries whether there is a fracture or not. It is treated with mild vestibular suppressants and particle repositioning maneuvers.","d":"Otology","src":"Ballenger · Trauma to the Middle Ear, Inner Ear, and Temporal Bone · Q7"},{"s":"A 2-year-old 11 kg boy with a persistent purulent runny nose and clinical suspicion of obstructive sleep apnoea presents to his local district general hospital. A sleep study shows an apnoea—-hypopnea index (AHI) of 15. How would you proceed?","o":["List the child for an adenoidectomy","List the child for an adenotonsillectomy","Refer the child to the nearest tertiary centre performing paediatric ENT","List the child for an adenotonsillectomy and ensure the on-call paediatrician is available that day","Treat with a 2-week course of antibiotics and nasal steroid and review the patient in a few months"],"k":"C","x":"This child has severe obstructive sleep apnoea as defined by an obstructive AHI of >10. This combined with the clinical symptoms of a persistent purulent nasal discharge make them\na candidate for an adenotonsillectomy. As per British Association of Paediatric Otolaryngology guidance, children with severe obstructive sleep apnoea under 15 kg are unsuitable for adenotonsillectomy in a district general hospital setting and should therefore be referred to a tertiary centre.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q37"},{"s":"If an infant has immediate airway distress on delivery, which is least likely to be the cause?","o":["laryngeal atresia","laryngeal webs","laryngomalacia","saccular cyst","subglottic stenosis"],"k":"C","x":"The symptoms and signs of laryngomalacia begin shortly after birth and increase in severity until 6 to 8 months of age. Laryngeal atresia produces immediate distress at birth. The symptoms of laryngeal webs are present at birth in 75% of patients with them. Forty percent of saccular cysts are discovered in a few hours after birth. The airway obstruction of subglottic stenosis is often present at birth.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q3"},{"s":"Regarding cytomegalovirus infection, which of the following statements is false?","o":["Congenital hearing loss due to congenital cytomegalovirus infection is usually present by the age of 2 years","90% of babies born with congenital cytomegalovirus are asymptomatic","Cytomegalovirus testing is performed using blood from the Guthrie card","Ganciclovir is used in the treatment of symptomatic babies","Cytomegalovirus is one of the human herpesviruses otherwise known as HHV-5"],"k":"A","x":"Hearing loss associated with cytomegalovirus infection is usually progressive.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q46"},{"s":"Which of the following is the most common cause of permanent loss of the sense of smell?","o":["head trauma","upper respiratory infections","rhinosinusitis","Alzheimer’s disease","chemical toxic exposure"],"k":"B","x":"Although loss of smell function has been associated with a number of systemic diseases and metabolic disorders, most patients with such loss fall into one of three major categories: head trauma, upper respiratory infections (eg, influenza and the common cold), and rhinosinusitis. Of these primary causes, upper respiratory infections are the most common. Typically, permanent hyposmia or anosmia occurs after the age of 40 in such individuals. In a study of a large number of consecutive patients seen at the University of Pennsylvania Smell and Taste Center during the period from 1980 to 1986, upper respiratory infections accounted for 26% of the cases, head trauma for 18%, and nasal and sinus disease 15%.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q3"},{"s":"Which of the following statements concerning cutaneous haemangiomas is true?","o":["Haemangiomas are considered vascular malformations","Haemangiomas are always present at birth","Surgical removal of a haemangioma is the primary treatment","A port wine stain is a cutaneous haemangioma involving the face","Subglottic haemangiomas are frequently associated with cutaneous lesions"],"k":"E","x":"Up to 50% of patients with a subglottic haemangioma will have a cutaneous lesion. However, of those patients with a cutaneous lesion only a small percentage will have a subglottic haemangioma.\nHaemangiomas are benign vascular tumours that appear after birth, while vascular malformations are present at birth. In general, surgery is reserved for those tumours not responding to either conservative treatment with observation, steroids, or laser ablation, or which are in a position to cause problems such as to the eye.\nA port wine stain is a cutaneous capillary vascular malformation.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q19"},{"s":"Otic preparations","o":["are more neutral than ophthalmic preparations.","are more viscous than ophthalmic preparations.","have less adverse reaction than ophthalmic preparations.","can more easily penetrate narrow lumens than ophthalmic preparations.","are more allergenic than ophthalmic preparations."],"k":"B","x":"Otic preparations are more acidic than ophthalmic preparations. Patients unable to tolerate acidic otic drops may tolerate more neutral ophthalmic drops.An additional advantage of ophthalmic drops is a low viscosity, allowing improved penetration in the narrow lumens encountered in external otitis. They are not less allergenic than otic drops.","d":"Otology","src":"Ballenger · Diseases of the External Ear · Q4"},{"s":"An underdeveloped larynx, a laryngeal web, structural asymmetry within the vocal folds, or swelling of the glottal margin near the anterior commissure is most likely to result in","o":["low pitch disorder.","vocal loudness problems.","harshness.","aphonia.","high pitch disorder."],"k":"E","x":"In each of the conditions specified, a shorter vibrating margin of the vocal folds would result, thereby increasing the frequency of vocal fold vibration. In an underdeveloped larynx, the vocal folds would be smaller than normal for a person of a given age and gender; consequently, the talker would have a higher than normal pitch. With a laryngeal web, the free vibrating edge of the vocal folds is reduced, creating a higher than normal pitch. With structural asymmetry, during closure of the vocal folds, the vocal process of one arytenoid cartilage may slide over the other in such a manner that the posterior parts of the membranous folds are pressed together. This reduces the length of the vibrating portion of the vocal fold. Swelling near the anterior commissure can also reduce the vibrating length of the vocal folds and increase the fundamental frequency of vibration.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q1"},{"s":"Which of the following is not a proposed mechanism for the negative effect of allergic rhinitis on asthma?","o":["systemic release of inflammatory mediators","local airway release of inflammatory mediators","neurogenic reflexes","alterations in nasal conditioning of air","nasal obstruction causing sleep-disordered breathing"],"k":"E","x":"Allergic rhinitis has a close relationship with asthma. Numerous studies have shown a high incidence of allergic rhinitis in asthmatics, and control of nasal allergies is thought to reduce asthma severity. There is growing evidence to support the systemic response to a local allergic reaction; hence, through this mechanism, nasal allergies could cause disease distally in the airway. Inflammatory mediators could also be released into the airway, travel to the lower respiratory tract, and induce inflammatory disease in that location. Challenge of the lower airway with antigen has been shown to cause allergic inflammation in the nose, suggesting the possibility of nasopulmonary neurogenic reflexes. Asthmatics have been shown to have a decreased ability to condition cold, dry air. Additionally, patients with seasonal allergic rhinitis out of season have a reduced ability to warm and humidify air. These studies raise the possibility that nasal conditioning capacity may affect lower airways disease. Although allergic rhinitis frequently causes nasal obstruction and may affect nasal breathing during sleep, this is not a proposed mechanism to explain the relationship between asthma and allergic rhinitis.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q2"},{"s":"Resectability of tumors and extent of surgery are defined by","o":["computed tomography (CT).","magnetic resonance imaging (MRI).","surgical exploration.","transdural extension.","all of the above."],"k":"E","x":"The definition of resectability is determined with CT, MRI, and findings at surgical exploration. Transdural extension, invasion of the prevertebral fascia, bilateral optic nerve involvement, and gross cavernous sinus invasion are criteria for unresectable lesions. Computed tomographic scans provide a detailed understanding of the extent of the bone involvement and sites of bone invasion. Magnetic resonance imaging helps define the presence of retained mucus and swollen mucosa in areas adjacent to the tumor. This technology also allows better definition of periorbital, dural, and brain invasion than CT alone. Neither entity is highly sensitive and specific for subtle invasion through the orbital periosteum or dura.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q8"},{"s":"The apparent undersensitivity (59%) of the clinical diagnostic criteria appears to be related to","o":["the lack of more refined diagnostic criteria.","permeable versus nonpermeable patencies related to proteoglycan composition.","the lack of refinement of proteoglycan histologic identification.","the erroneousness of the histologic diagnostic criteria.","an error in calculation."],"k":"B","x":"The lack of more refined diagnostic criteria relates to probable permeable and nonpermeable patencies of the labyrinthine capsule, which, in turn, are probably related to proteoglycan composition. Proteoglycan histologic identification appears adequate in related preliminary studies of perilymphatic fistulae. The histologic diagnostic criteria have been tested in masked studies and appear not to be erroneous but need further study to include proteoglycan histologic analysis. Calculations in this regard are simple and have been doubly checked by statisticians.","d":"Otology","src":"Ballenger · Perilymphatic Fistulae · Q10"},{"s":"Symptoms of intermittent postnasal discharge and odynophagia combined with a dull occipital headache would be most likely to occur in the presence of a","o":["Rathke’s cyst.","nasopharyngeal teratoma.","unilateral choanal atresia.","craniopharyngioma.","Thornwaldt’s cyst."],"k":"E","x":"Symptoms of Thornwaldt’s cysts include intermittent or persistent postnasal discharge of tenacious mucus associated with odynophagia, halitosis, unpleasant taste, and, occasionally, a dull occipital headache. The closest possible potential choice is Rathke’s cyst. Rathke’s cysts are not usually associated with postnasal discharge or headache. However, they can become secondarily infected or rupture intracranially producing galactorrhea, visual loss, and hypopituitarism. Unilateral choanal atresia is an unlikely distracter, and although teratomas and craniopharyngiomas arise in the nasopharyngeal region, they are not commonly associated with headache or intermittent postnasal discharge.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q3"},{"s":"What is the incidence of squamous cell carcinoma in patients with inverted papillomas?","o":["0%","15%","30%","50%","70%"],"k":"B","x":"Five to 15% of patients have squamous cell carcinoma associated with inverted papilloma. The extent of involvement with squamous cell carcinoma determines the role of adjuvant therapy.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q1"},{"s":"A primary contributor to a satisfactory outcome with an ABI is","o":["Implantation when vestibular schwannomas are as small as possible","Implantation as soon as possible after onset of complete deafness","A thorough and frank appraisal preoperatively of the potential benefits and limitations of the device","Learning sign language and lipreading preoperatively"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 58 · Q3"},{"s":"Which are the most common symptoms of the patulous Eustachian tube?","o":["Autophony made worse in recumbent position","Autophony and pressure-induced dizziness","Aural fullness and autophony","Symptoms associated with retraction and atelectasis of the tympanic membrane"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 7 · Q2"},{"s":"A 60-year-old man is referred by his general practitioner (GP) with unilateral nasal obstruction. The GP has organized for him to have a CT scan before the appointment. The most appropriate next investigation would be:","o":["Referral to the head and neck multidisciplinary team","Referral to the specialist rhinologist in your hospital","Schedule the patient for endoscopic sinus surgery","Schedule the patient for biopsy","Arrange an MRI of the neck to examine nodal status"],"k":"D","x":"This unilateral expansile but not erosive mass probably represents an inverted papilloma. It is important initially to establish the diagnosis and then to plan definitive treatment.","d":"Rhinology","src":"SBA book · Rhinology · Q18","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/  derivatives, triptan derivatives, and antiemetics. The ergot derivatives and triptan products can induce angina in patients with coronary artery disease, or they can cause chronic headaches if used more often than two times per week. Therefore, they are contraindicated in patients with coronary artery disease and are not to be taken daily.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q2"},{"s":"Which of the following bones is least likely to be transected as part of an endoscopic transethmoidal sphenoidotomy?","o":["Uncinate process","Bulla ethmoidalis","Anterior wall of the sphenoid","Palatine bone","Ground lamella of the middle turbinate"],"k":"D","x":"A endoscopic transethmoidal sphenoidotomy involves an uncinectomy, anterior and posterior ethmoidectomy, before opening the face of the sphenoid inferomedially.","d":"Rhinology","src":"SBA book · Rhinology · Q3"},{"s":"The primary difference between dysarthria and apraxia of speech motor control is that apraxia is characterized by","o":["impairment of speech movement programming.","muscle weakness.","slowness.","incoordination.","altered muscle tone."],"k":"A","x":"Impairment of speech movement programming is characteristic of apraxia. All of the other foils are appropriate descriptors of motor speech dysarthria.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q8"},{"s":"Facial nerve injury may complicate a transcanal labryinthectomy. The most common site of the injury is at the","o":["Descending segment","Horizontal segment","Geniculate ganglion","Internal auditory canal"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 40 · Q3"},{"s":"In the Gell and Coombs classification, how is allergic rhinitis classified?","o":["Type 1—immediate","Type 2—antibody dependent","Type 3—immune complex","Type 4—cell mediated","Type 5—seasonal"],"k":"A","x":"Allergic rhinitis is a type 1 hypersensitivity reaction provoked by re-exposure to a specific type of antigen.","d":"Rhinology","src":"SBA book · General Otolaryngology · Q25"},{"s":"Acquired subglottic stenosis is","o":["associated with endotracheal intubation most frequently.","more common in neonates because they do not tolerate intubation well.","associated with a loose-fitting tube with a large air leak.","not associated with endotracheal intubation.","not affected by systemic factors."],"k":"A","x":"Neonates tolerate intubation better than adults probably because their laryngeal cartilages are more pliable and their larynges are located higher in the neck. In infants and young children, an endotracheal tube that allows a leak of air at pressures less than 20 cm H2O should be chosen. Systemic factors such as immunodeficiency, anemia, neutropenia, hypoxia, dehydration, and poor perfusion increase the risk of developing subglottic stenosis in the intubated infant.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q9"},{"s":"Regarding local anaesthesia, which of the following statements is true?","o":["Lignocaine works by blocking calcium channels","A high pH in the tissues renders the local anaesthetic less effective","The effect of cocaine at preventing monoamine uptake allows it to be an effective local anaesthetic agent","A safe dose of cocaine for nasal surgery is between 1.5 and 3 mg/kg to a maximum dose of 200 mg","Amino ester local anaesthetics are metabolized by the liver"],"k":"D","x":"Lignocaine’s action is due to the blockage of sodium channels: with sufficient blockage,\nthe membrane of the postsynaptic neuron will not depolarize and the action potential will not be transmitted (they are membrane stabilizers). An acid environment such as within an abscess or inflamed tissue increases the ionization of the local anaesthetic, thus inactivating it by preventing\nits movement across the cell membrane. The sodium channel blockade gives cocaine its local anaesthetic properties; the blockage of neurotransmission such as monoamine uptake gives cocaine its central effects. There are two groups of local anaesthetics: amino esters and amino amides. Amino esters are metabolized within the plasma via cholinesterases, whereas amino amides are metabolized in the liver.","d":"Rhinology","src":"SBA book · Rhinology · Q64"},{"s":"Which of the following is the most common complication of endoscopic endonasal surgery prior to the introduction of the nasal septal flap?","o":["Cerebrospinal fluid leak","Arterial injury","Infection","Stroke","Cranial nerve palsy"],"k":"A","x":"Cerebrospinal fluid leak was the most common complication of endoscopic endonasal surgery for skull base lesions prior to the introduction of the septal flap. Despite this, infection rates were very low.","d":"Rhinology","src":"Brackmann · Chapter 55 · Q5"},{"s":"What is the most appropriate way to secure a collagen tubule to the nerve end to be anastomosed?","o":["Six 9-0 nylon interrupted epineurial sutures","Fibrin glue","Cyanoacrylate","One 8-0 interrupted polypropylene epineurial suture"],"k":"D","x":"A single epineurial suture is the standard method of securing a nerve to the end of a collagen tubule. Multiple sutures are used when nerve ends are directly anastomosed.","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 62 · Q5"},{"s":"A patient is on your operating list for a right stapedotomy. Which of the following would cause you most concern?","o":["Suppurative ear discharge","A tympanic membrane perforation","Cochlear otosclerosis on the CT scan","Previous stapes surgery","A dead left ear"],"k":"A","x":"The presence of active chronic otitis media is considered an absolute contraindication to many while the other responses represent relative contraindications.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q14"},{"s":"The mechanism for the production of an open bite deformity in the Le Fort III fractures of the maxilla is","o":["bilateral fractures of the zygomatic arches.","a vertical fracture through the hard palate.","the pull of the temporalis muscles.","the pull of the pterygoid muscles.","airway obstruction."],"k":"D","x":"The open bite occurs by virtue of the medial pterygoid muscles inserting on the angle of the mandible. The craniofacial dysjunction created by the fracture frees the maxilla from the cranium, allowing the natural pull of the medial pterygoids to displace the maxilla toward the mandibular angle. The force is in a posteroinferior direction.","d":"H&N / Plastics / Trauma","src":"Ballenger · Facial Fractures · Q7"},{"s":"A 75-year-old female presents to your clinic with a longstanding persistent cough. Head and neck examination reveals a fullness of the left aryepiglottic fold, with normal vocal cord movement. Please see the image for assessment at microlaryngoscopy. The most likely diagnosis from the following list is:","o":["Squamous cell carcinoma of the supraglottis","Internal laryngocele","Mucous retention cyst","Extramedullary plasmacytoma","Bacterial supraglottitis"],"k":"B","x":"This is an internal laryngocele. Risk factors include a chronic cough or repeated Valsalva manoeuvre such as in trumpet playing. It is important to exclude a squamous cell carcinoma which could be obstructing the saccule.\nA CT scan is useful and usually demonstrates air or fluid within the cyst. It can also be used to classify the laryngocele and guide operative management. Laryngoceles are classified into internal, mixed, or external in terms of their relationship to the thyrohyoid membrane. Internal laryngoceles are usually endoscopically deroofed or excised often with CO2 LASER, taking care to avoid or ligate the superior laryngeal artery. Mixed or external laryngoceles are better addressed with external excision via a neck incision.\nThe image and clinical history do not fit with an acute infection. A mucous retention cyst is usually more superficial.\nThis is a typical location for a laryngocoele; a plasmacytoma is a rare entity. In the head and neck, the more common site is the nasal cavity, sinuses, or nasopharynx. Their appearance is often more red compared to the surrounding mucosa.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q78","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAIzA+gBAREA/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAECAwQFBgcI/8QATRAAAQMCBQEFAwkFBAcIAwEBAQACEQMhBAUSMUFRBhMiYXEygaEUFTVSdJGxstEHI0KSwVVik5QkMzREVOHwFiVDU2Nyc/FkgoNFwv/aAAgBAQAAPwD5hnOa5k3OMe1uY4wAYmoABiH28R81j+d8zj6Sxv8AmH/qj53zP+0sbP2h/wCqXzvmf9pY3/MP/VP53zP+0sb/AJh/6o+ds0/tHGf5h/6o+d8z5zHGf5h/6oGb5nH0ljP8w/8AVHzvmf8AaWM/zD/1R875n/aWN/zD/wBUfO+Z/wBpYz/MP/VHzvme3zljf8w/9UfO+Zx9JY3/ADD/ANU/nfMx/wD6WMv/APkP/VdvLcTmbKIqVswxhc4WBrusPvWh+Z4+YGPxcf8AzO/VQOZ5hxj8X/ju/VV1MzzEH/b8WP8A+7v1TbmeY/8AH4v/AB3fqrRmWP8A+Pxf+O79VNuZZgDfH4r/ABnfqun2cr5pmvaDB4XC4jMMRTbVDsQKVV0NaDySV3/2kY/NGdo6VIUcTgMKKEUi2sf3pn2rFeWOPx//AB2K99Z36qAzHHz/ALdiv8Z36qJzDHkiMdi4/wDmd+qPnLHNu/HYoCY/1zv1VjcxxpFsdi/8Z36ofjMwj/bsUT5VnfqqPnDMB/v+LE/+s79VL5xzAD/b8V/jO/VI5nmA3x+J91Z36o+dceP9+xX+M79UfOmOP+/Yr/Gd+qYzXGkXx+KHrWd+qkMwx52x+J/xnfqh2YY//jsWfSs79VB2YY8CBj8V/ju/VVnMMwn/AG7Fx/8AO79VH5fmBP8At+LH/wDd36qXzjmA2x2LPn3zv1UH5rmAA/07Ff47v1UDmuP/ALQxc/8AzO/VL52zAD/b8X/ju/VMZrj4/wBvxf8Aju/VHztmImcfiv8AHd+q0YfNsfqBOPxX+M79V2cNmuMt/pmIP/8AV36rp08yxTgP9KxAgSf3p/VXDMMTpB+VYiT/AOof1V9DMMRHixVcmDY1Hb/erPl2JkziqoBFj3jv1T+XYkM1fKK5vE94UOx2JMRiqwHPjP6qYxmJJI+U1p/+QqFTHYlsD5RW2v8AvCs9THYo+ziMQBsJqn9VWcdjGGPlNf17w/qrqOLxZlzsViBcWFRyvOMxQbJxNY9T3hhDcbibTiaxMbd46/xVb8ZiQ/8A2uvt7PeO36IGPxYBJr1r8d6VBuMxZcT8orx0FU/qpnF4mR/pOI6iah/VVVa+K0mMXX337xyyuxOMAd/pmIt/6rv1WZ2NxmqBi8T/AIrv1UX43HAADF4j/Fd+qBjMa4WxmItv+9d+qgcZjokYvEx/8rv1UXY7HA/7Zif8Z36qt2Ox4MjF4ojf/Wu/VVjMMcR/tuJ/xnfqo/OGOJj5bib7fvnfqonH47/jcVP/AMzv1VZzLMJj5bif8Z36qTcxx5uMbiY86zv1UxmGO5xuJ/xnfqoux+PF/l2K3/8ANd+qgcxxxP8AtuJ/xnfqonMceN8diY/+Z36qs5jj7/6dij//AGd+qpfmGYA/7dip/wDmd+qq+c8x/wCPxf8AjO/VMZnmH/H4r/Gd+qk7MsfEfL8V/jO/VVnMswkRmGK/xnfqtWFzPMCb47FH/wDs79Vt+cMcR/tu
