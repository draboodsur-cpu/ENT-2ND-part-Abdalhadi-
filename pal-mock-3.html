azQK1atUANg+o4/iVNmLxdNgZTxeJa0bNbWcB+Kg+rVeZfWrOPU1HH+qjqdM95U/nKkalVwh1aqR0NR36qFwZD3g9dZV4xuMDQBjcUANh374/FVF9R0l1WqZ3mof1UC0HcuP/wCxQGgbF38xTj+87+YpafN38xRpHV38xS7ph3HxS7pn1fijumdPijumdPijumfV+KO6Z0+KO6Z0+KO6Z0+KO6Z9X4o7pn1fijumdPijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4p90z6vxS7pn1fijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4o7pn1fijumdPijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4o7pn1fijumfV+KO6Z9X4rdkVJgzzLrf73S5/vhf/9k="]},{"s":"Which of the following statements is true about Usher’s syndrome?","o":["It is the most common autosomal recessive syndromic hearing loss.","It is associated with vestibular loss in all forms.","It demonstrates surprisingly little genetic heterogeneity.","Electroretinography is unhelpful in detecting early retinitis pigmentosa.","It is associated with mutations in EYA1."],"k":"A","x":"Usher’s syndrome is the most common autosomal recessive syndromic hearing loss. Type 2 Usher’s syndrome is not associated with vestibular loss. Usher’s syndrome demonstrates considerable genetic heterogeneity as demonstrated by the identification of 11 loci to date. Electroretinography may uncover early retinitis pigmentosa. Mutations in EYA1 have not been demonstrated in Usher’s syndrome.","d":"Otology","src":"Ballenger · Hereditary Hearing Impairment · Q6"},{"s":"The CHARGE association is most commonly encountered in relationship to which congenital head and neck anomaly?","o":["cleft palate","choanal atresia","branchial cleft cyst","thyroglossal duct cyst","thymic cyst"],"k":"B","x":"The CHARGE association is a nonrandom pattern of congenital anomalies that occurs with choanal atresia. Additional anomalies include coloboma, congenital heart disease, retarded growth and development, and ear abnormalities and deafness. Responses C, D, and E, although congenital anomalies, are not encountered with this disorder. Cleft palate has not been specifically reported with the CHARGE association.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q2"},{"s":"A child is undergoing a rigid bronchoscopy. During the procedure it is noted that the patient’s right arm has become pale and pulseless. The arm becomes pink and with a good pulse on removal of the bronchoscope. Compression of which vessel is likely to be the cause of this phenomenon?","o":["Right common carotid artery","Left common carotid artery","Brachiocephalic artery","Right subclavian vein","Right vertebral artery"],"k":"C","x":"The right arm is supplied with blood by the right subclavian artery, a branch of the brachiocephalic artery, which often passes obliquely across the trachea and may become compressed during bronchoscopy.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q26"},{"s":"The goals of endoscopic sinus surgery include all of the following except","o":["removing all of the sinus mucosa.","promoting drainage of the sinuses.","removing osteitic bone.","restoring normal mucociliary clearance.","removing obstructive polyps."],"k":"A","x":"In functional endoscopic sinus surgery, it is critical to preserve as much normal mucosa as technically feasible. Removal of mucosa prolongs the healing process and leads to scarring with abnormal, poorly functioning mucosa. The other choices represent key principles of functional endoscopic sinus surgery.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q3"},{"s":"A 46-year-old man presents with reduced hearing in his right ear. On examination he is found to have a single bony mass protruding into the ear canal with a build-up of cerumen and consequent conductive hearing loss. Clinically this is an osteoma. Which of the following statements is the least accurate description for this condition?","o":["Osteomas are benign tumours","They typically develop along the tympanosquamous or tympanomastoid suture line","Surgical removal is curative","Histologically, they are described as being composed of mature lamellar bone with bone marrow","They are commonly associated with a history of cold water exposure"],"k":"E","x":"In contrast to exostosis of the external ear canal, osteomas are not generally associated with cold water exposure. They are generally considered to be benign tumours and typically contain mature lamellar bone with bone marrow. Surgical removal is usually curative.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q25"},{"s":"In regard to the mechanism of swallowing, which of the following statements is false?","o":["The pharyngeal stage is the quickest and involves soft palate elevation","The muscles of the soft palate are all innervated by the pharyngeal plexus","There are three stages of swallowing: oral, pharyngeal, and oesophageal","The upper oesophageal sphincter is composed of striated muscle which includes cricopharyngeus and thyropharyngeus","The oral stage of swallowing is under voluntary control"],"k":"B","x":"There are five paired muscles of the soft palate: tensor veli palatine, levator veli\npalatine, palatoglossus, palatopharyngeus, and the muscle of the uvula. All are innervated by the pharyngeal plexus except tensor veli palatine, which is innervated by the mandibular branch of the trigeminal nerve.","d":"Laryngology","src":"SBA book · General Otolaryngology · Q50"},{"s":"Which of the following statements best describes granulomatosis with polyangiitis (GPA; formerly known as Wegner’s granulomatosis)?","o":["Untreated, the disease is usually asymptomatic for many years","Cirrhosis of the liver is a common feature of the disease","The perinuclear antineutrophil cytoplasmic antibody (pANCA) is highly sensitive for the disease","It is most common in those of Afro-Caribbean origin","The cytoplasmic antineutrophil cytoplasmic antibody (cANCA) is highly sensitive for the disease"],"k":"E","x":"GPA is characterized by necrotizing granulomas involving the upper respiratory tract, vasculitis of small- and medium-sized vessels, and glomerulonephritis. Untreated, the disease carries\na very poor prognosis. The cANCA is more than 90% sensitive and specific for the disease, while 20-40% of cases have raised PANCA.","d":"Rhinology","src":"SBA book · Rhinology · Q14"},{"s":"Regarding the cell cycle, which of the following statements is true?","o":["The cell cycle has five stages—G1, S, G2, M, and GO","Alkylating agents work in all phases of the cell cycle by directly damaging DNA","Antimetabolites work by interfering with DNA and RNA synthesis during the S phase","Topoisomerase inhibitors are active through the S phase","Mitotic inhibitors such as plant alkaloids prevent the S phase"],"k":"A","x":"The cell cycle has multiple stages. During G1 the cell prepares for division. DNA synthesis occurs, replicating the genetic material in the S phase and the chromosomes now consist of two sister chromatids. During the G2 phase, the cell assembles cytoplasmic materials necessary for the M phase where nuclear division (karyokinesis/mitosis) and cell division (cytokinesis) occur. Chemotherapeutic agents work by targeting different phases of the cell cycle to alter and arrest growth of malignant cells.","d":"General","src":"SBA book · General Otolaryngology · Q43"},{"s":"Which of the following statements concerning the diagnosis of aural atresia is false?","o":["Computed tomographic studies allow determination of the degree of the canal atresia and the thickness of the atresia plate.","Computed tomographic studies allow determination of the extent of pneumatization of the middle ear and mastoid, the intratemporal course of the facial nerve, and the relationship of the stapes to the facial nerve.","Computed tomography may uncover the presence of an unsuspected cholesteatoma.","Brainstem response audiometry is not helpful in assessing the presence or degree of hearing loss in neonates owing to the possibility of masking dilemmas.","As the infant matures, behavioral audiometric evaluations must be obtained to confirm the neurophysiologic tests of hearing."],"k":"D","x":"Computed tomographic studies allow determination of the degree of the canal atresia, the thickness of the atresia plate, the extent of pneumatization of the middle ear and mastoid, the intratemporal course of the facial nerve, and the presence or absence of the oval window and the stapes.An unsuspected cholesteatoma may also be apparent. Brainstem response audiometry should be performed in all infants born with either microtia or atresia. Bilateral involvement may cause masking dilemmas, but this does not affect auditory brainstem responses. As the infant matures, behavioral audiometric evaluations must be obtained to confirm the neurophysiologic tests of hearing.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q5"},{"s":"Which of the following is not a risk factor for aspiration?","o":["hyperinflation of the tracheostomy cuff","tracheostomy","a soft, solid diet","loss of the glottic closure reflexes","the supine position"],"k":"C","x":"Tracheostomies actually increase the risk of aspiration by decreasing the glottic closure reflexes. Hyperinflation of a tracheostomy cuff may also cause aspiration by compressing the esophageal lumen. A soft, solid diet results in a decreased risk of aspiration when compared with a liquid diet. An upright position tends to prevent aspiration.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q7"},{"s":"You are asked by the haematologists to perform a local anaesthetic biopsy of a cervical lymph node. The patient, a 45-year-old woman, has had a suspected relapse of her non-Hodgkin’s lymphoma. Following her recent treatment, she is known to be thrombocytopenic. What is the LOWEST platelet count (in platelets x 10°/L) that you would consider it acceptable to proceed with the operation?","o":["20","50","100","150","300"],"k":"B","x":"A normal platelet count is 150-400 x 10°/L, but it is generally considered safe to perform surgery at platelet levels of greater than 50 x 10°/L.","d":"General","src":"SBA book · General Otolaryngology · Q26"},{"s":"A 68-year-old African American woman presents to you with a painful, solitary 8 cm neck mass after having had a composite resection followed by radiation therapy. You discuss the possibility of treatment for the neck mass with cisplatin-epinephrine gel injection into the tumor. The advantages of this mode of treatment over systemic cisplatin chemotherapy include all of the following except","o":["other options for treatment remain possible.","reduced risk of ototoxicity.","less invasive treatment.","higher probability of complete remission.","decreased risk of nephrotoxicity."],"k":"D","x":"Although intratumor injection with cisplatin-epinephrine gel keeps other options open, reduces the risks of ototoxicity and nephrotoxicity, and is potentially a less invasive treatment, the probability of complete remission is not higher than with systemic cisplatin treatment.","d":"Otology","src":"Ballenger · Ototoxicity · Q9"},{"s":"The most serious complication of the infracochlear approach to the petrous apex is","o":["Sensorineural hearing loss","Facial nerve injury","Tearing of the tympanic membrane","Carotid artery injury","Rupture of the jugular bulb"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 45 · Q2"},{"s":"Which procedure is now infrequently used owing to the late complication of granuloma formation?","o":["Teflon injection","collagen injection","autologous fat injection","Gelfoam injection","recurrent laryngeal nerve anastomosis"],"k":"A","x":"Although initially good or excellent voice results can be achieved with Teflon paste injection for medialization of the vocal fold, local granulomatous inflammatory reactions to Teflon are now well recognized. Surgical management of this complication is difficult and frequently results in impaired voice quality. Owing to this complication, use of Teflon is now usually reserved for treatment of terminally ill patients.","d":"Laryngology","src":"Ballenger · Neurogenic and Functional Disorders of the Larynx · Q3"},{"s":"The principal reason for lumbar puncture in the investigation for possible complications of acute and chronic otitis media is to","o":["obtain microorganisms for culture and sensitivity.","diagnose brain abscess.","document intracranial hypertension.","decrease cerebrospinal fluid volume.","diagnose or rule out meningitis."],"k":"E","x":"Lumbar puncture is never performed until a computed tomography scan has documented the absence of intracranial hypertension for fear of causing cerebellar tonsil herniation and its catastrophic consequences. The principal reason for lumbar puncture is to rule out or establish the diagnosis of meningitis so that prompt treatment can be started. If the enhanced magnetic resonance imaging is negative for other intracranial complications, a positive lumbar puncture will establish the diagnosis of meningitis and rule out emergency surgery, which is necessary for brain abscess and subdural empyema. If the underlying otologic cause of meningitis is acute otitis media, only medical treatment is necessary, as long as a post-treatment CT scan and tympanometry document that the otitis media is completely resolved. If the underlying cause is chronic otitis media, mastoidectomy is undertaken during the same hospitalization as soon as the meningitis has been stabilized.","d":"Otology","src":"Ballenger · Cranial and Intracranial Complications of Acute and Chronic Otitis Media · Q9"},{"s":"Which of the following signs is least likely to occur in a base of skull fracture?","o":["Periorbital ecchymosis","Purulent otorrhoea","Mastoid ecchymosis","Watery rhinorrhoea","Subconjunctival haemorrhages"],"k":"B","x":"While many base of skull fractures may be asymptomatic, signs include periorbital ecchymosis (raccoon eyes), cerebrospinal fluid (CSF) rhinorrhoea, CSF otorrhoea, haemotympanum, mastoid ecchymosis (Battle’s sign), and cranial nerve dysfunction. These should all be actively looked for in any patients with significant head injury and suspicion of a fracture.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q53"},{"s":"Advantages of the palpebral spring compared to the gold weight include the following:","o":["The spring closes the eye during sleep, when the patient is supine, whereas the weight does not.","Lids that are hard to close may require large bulky weights, compared to a fine wire spring.","Patients who are exposed to extremes of hot or cold may experience discomfort in the lid due to the heating or cooling of the weight, which is much less of a concern with the spring due to less mass to heat or cool.","To adjust the closing tension with a gold weight requires replacement, whereas the spring can be adjusted without removal.","All of the above."],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 61 · Q3"},{"s":"You are called to the Accident and Emergency department to see a 46-year-old male who has been stabbed in the neck with a kitchen knife following a domestic dispute. The knife is still in the neck, entering just above the clavicle on the right side. The patient is haemodynamically stable, talking in complete sentences with no respiratory compromise, but is finding swallowing painful. What is the most appropriate next stage of his management?","o":["Remove the knife and close the wound","Remove the knife and explore the wound in the Accident and Emergency department","Arrange a contrast radiographic swallow examination","Perform an angiogram","Perform a barium swallow"],"k":"D","x":"For penetrating neck injuries, the neck is divided into three zones. Zone 1 extends from the clavicle to the cricoid cartilage, zone 2 lies between the cricoid cartilage and the angle of the mandible, and zone 3 from the angle of the mandible to the base of skull.\nThe injury described is in zone 1. Penetrating neck injuries in this region have a high risk of damage to the carotid and vertebral vascular tree. Furthermore, injuries in this zone can be difficult to control when bleeding occurs with retraction of vessels into the mediastinum. Therefore, in a haemodynamically stable patient with a high risk of vascular injury, a four-vessel angiography is appropriate.\nOther structures that are at risk include nerves traversing the neck including the recurrent laryngeal nerve and the aerodigestive tract. These represent less of an immediate risk to the patient but will need to be treated if damaged.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q13"},{"s":"The outer cartilage bites of Mustarde sutures are described as","o":["1 cm separated by 2 mm.","1 cm separated by 1 cm.","2 mm separated by 1 cm.","2 mm separated by 2 mm.","8 mm separated by 8 mm."],"k":"A","x":"In the mid-1960s, Mustarde described a corrective otoplasty technique that gained quick and ready acceptance and wide popularity as it was seen as a marked improvement over existing techniques. Horizontal mattress sutures placed in the auricular cartilage along the scapha recreate the natural curve of the antihelix, blending gently into the scaphoid fossa. Dimensions of the outer cartilage bites of the horizontal mattress sutures have been described as 1 cm separated by 2 mm.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q4"},{"s":"The histology of malignant tumors of the sinonasal tract is varied; the type with the most well-known link to environmental exposure to wood dust is","o":["squamous cell carcinoma.","adenoid cystic carcinoma.","adenocarcinoma.","olfactory neuroblastoma.","sarcoma."],"k":"C","x":"Exposure to wood dust increases the relative risk of adenocarcinoma by 540 times. However, it should be noted that squamous cell carcinoma also shares this relationship to wood dust, with prolonged exposure resulting in a 21 times increase in relative risk.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q3"},{"s":"The best study to distinguish postoperative scar from tumor recurrence is","o":["PET-CT imaging","PET imaging","CT","MRI with contrast","MRI-CT fusion imaging"],"k":"A","x":"PET-CT has proven increasingly useful at demonstrating the expected increased metabolic activity of carcinoma in relation to the osseous anatomy.","d":"Otology","src":"Brackmann · Chapter 3 · Q4"},{"s":"The principles of cartilage fracture repair are especially complicated in the larynx owing to","o":["the poor blood supply of partially avulsed laryngeal cartilage.","the fragments being difficult to stabilize.","lacerations in the airway, resulting in infection.","secondary healing, resulting in granulation tissue formation and cicatrix.","all of the above."],"k":"E","x":"All of the above contribute to poor outcomes in patients sustaining blunt and penetrating injuries to the larynx.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q4"},{"s":"Imaging when investigating paediatric hearing loss may show a number of abnormalities. Which of the following statements is false?","o":["Usher syndrome is associated with semicircular canal aplasia","A Mondini dysplasia is the combination of an abnormal apical cochlear with an enlarged vestibular aqueduct","Radiological findings of X-linked deafness included a widened internal auditory meatus and enlarged vestibular aqueduct","MRI scans are useful for imaging the contents of the internal auditory canal","Radiology may be normal when hearing loss is associated with a viral infective aetiology"],"k":"A","x":"CHARGE syndrome is associated with semicircular canal aplasia.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q41"},{"s":"Temporomandibular joint disorders have all of the following features except","o":["usually associated with organic joint disease.","more common in women.","decreased range of motion in the temporomandibular joint.","mild or moderate intensity.","associated with bruxism."],"k":"A","x":"Temporomandibular joint disorders occur more often in women. The pain is mild to moderate and temporal, is exacerbated by jaw movement or bruxism, and results in trismus, but, usually, organic disease in the joint does not exist.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q10"},{"s":"Conditions that may cause esophageal strictures include all of the following except","o":["Behçet’s syndrome.","gastroesophageal reflux.","caustic ingestion.","polymyositis.","Crohn’s disease."],"k":"D","x":"Polymyositis causes proximal esophageal dysmotility owing to inflammatory and degenerative changes to the striated muscles of the esophagus but does not cause strictures.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q5"},{"s":"Recurrent PLF should be suspected if","o":["Disequilibrium persists 2 weeks after surgery.","Whirling episodic vertigo persists or develops.","Hearing levels fail to improve.","A fat graft was used to patch the fistula and 6 weeks of healing have taken place."],"k":"D","x":"Multiple authors have recommended avoiding use of fat as a graft material as it has been noted to have an increased failure rate. Six weeks should be allowed for the wound to completely heal before contemplating reexploration.Whirling episodic vertigo is typical for endolymphatic hydrops and not PLF. Hearing improvement has been reported in less than 50% of patients who have undergone PLF repair.","d":"Otology","src":"Brackmann · Chapter 27 · Q5"},{"s":"A 70-year-old man complains of soreness in the left vestibule over the last 3 to 4 months that has failed to respond to a variety of topical preparations. A small ulcerated area is noted on the inner vestibule skin from which a biopsy is taken. The histology report suggests chronic inflammation, a few basaloid cells, and areas of necrosis. As a consequence, one should","o":["reassure him that there is nothing seriously wrong.","arrange a computed tomography scan.","perform a second biopsy.","refer him to a dermatologist.","place him on long-term oral antibiotics."],"k":"C","x":"It may be difficult to obtain representative tissue from this area, particularly if performed under local anesthesia. The presence of necrosis and basaloid cells should suggest the possibility of a basal cell carcinoma, and the chronic inflammation and necrosis may simply be from the center of the ulcer. Further deeper biopsy is indicated to exclude malignancy. Imaging of this area is generally unhelpful, and long-term systemic antibiotics are unlikely to alter the situation materially.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q1"}]};const Q=P.q;const L='ABCDEF';

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
</body></html>
