f infection is noted.","Abort the procedure as the risk of infection is high and the exposure will be poor.","None of the above."],"k":"B","x":"A contracted mastoid is not a contraindication to the translabyrinthine craniotomy.Wide dural decompression will be necessary to improve exposure.","d":"Otology","src":"Brackmann · Chapter 49 · Q4"},{"s":"Which of the following is not used in the American Joint Committee on Cancer (AJCC) staging system for melanoma?","o":["Tumour thickness","Tumour ulceration","Size of lymph nodes","Number of lymph nodes","Sentinel node biopsy results"],"k":"C","x":"The AJCC (2002) uses tumour thickness to stage melanoma. The 2002 AJCC modifications also include histological ulceration and the number of lymph nodes involved rather than size.\nMicroscopic regional lymph node metastasis as detected by sentinel lymph node biopsy differentiates tumours into those with micro- or macroscopic nodal metastasis.","d":"Rhinology","src":"SBA book · Rhinology · Q26"},{"s":"Which of the following laryngeal electromyographic (EMG) findings is incorrectly matched to the diagnosis?","o":["A pattern of decreased frequency and normal amplitude is suggestive of myopathy","A picket fence pattern is suggestive of partial reinnervation","Fibrillation potentials represent a denervation pattern","A fatiguing pattern is suggestive of myasthenia gravis","Inappropriate muscle activity in the thyroarytenoid muscle indicates adductor spasmodic dysphonia"],"k":"A","x":"A pattern of decreased frequency and normal amplitude is suggestive of neuropathy, in contrast to decreased amplitude with normal frequency indicating a myopathy.\nA picket fence pattern represents polyphasic action potentials with increased parameters, indicating reinnervation.\nIn contrast, a deinnervation pattern includes fibrillation potentials and complex repetitive discharges.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q71"},{"s":"Which of the following is not an indication to remove a vocal process granuloma?","o":["When there is concern for underlying laryngeal carcinoma.","When the lesion has progressed to a fibroepithelial polyp.","When the lesion has been present for more than 6 weeks.","When there is concern for airway obstruction.","When a professional voice user is severely dysphonic."],"k":"C","x":"Although surgical removal of a vocal process granuloma is seldom indicated, there are three instances when it should be considered: (1) when the clinician is concerned about the possibility of carcinoma, (2) when the lesion has matured and taken on the appearance of a fibroepithelial polyp, and (3) when the airway is obstructed. A professional voice user with significant vocal needs may also require removal.Vocal process granulomas may take 6 months or more to heal on antireflux therapy. A persistent granuloma at 6 weeks is not an indication for removal.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q7"},{"s":"When performing an external ethmoidectomy, at what distance from the anterior lacrimal crest are you most likely to find the posterior ethmoidal artery?","o":["12 mm","24mm","30 mm","36 mm","42 mm"],"k":"D","x":"From the anterior lacrimal crest the anterior ethmoidal artery is approximately 24 mm. The posterior ethmoidal artery is a further 12 mm and the optic nerve a further 6 mm.","d":"Rhinology","src":"SBA book · Rhinology · Q4"}]};const Q=P.q;const L='ABCDEF';
const DOMS=['Otology','Rhinology','Laryngology','Paediatric','H&N / Plastics / Trauma','General'];
let S={mode:'exam',mins:180,phase:'start',pos:0,ans:{},flag:{},end:0,start:0,tick:null,used:0,list:[],rpos:0,rtitle:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
function nav(html){let n=document.querySelector('.nav');if(!html){n&&n.remove();return}if(!n){n=document.createElement('div');n.className='nav';document.body.appendChild(n)}n.innerHTML='<div class="navi">'+html+'</div>'}
function startScreen(){
  S.phase='start';nav();clearInterval(S.tick);
  const cnt={};Q.forEach(q=>cnt[q.d]=(cnt[q.d]||0)+1);
  $('#app').innerHTML=`<div class="kicker">Palestinian Board · Final MCQ mock</div><h1>${esc(P.title)}</h1>
  <p class="sub">100 single-best-answer questions, one correct option each. Same subspecialty blueprint as Papers 1–5, weighted toward Brackmann and the SBA book. No question repeats from Papers 1–5. Book wording and book keys throughout.</p>
  <div class="card"><table>${DOMS.filter(d=>cnt[d]).map(d=>`<tr><td>${d}</td><td>${cnt[d]}</td></tr>`).join('')}</table></div>
  <b>Mode</b><div class="seg" role="group" aria-label="Mode"><button class="${S.mode=='exam'?'on':''}" onclick="S.mode='exam';startScreen()">Exam — marked at the end</button><button class="${S.mode=='practice'?'on':''}" onclick="S.mode='practice';startScreen()">Practice — instant feedback</button></div>
  ${S.mode=='exam'?`<b>Time</b><div class="seg" role="group" aria-label="Time limit">${[180,150,120,90].map(m=>`<button class="${S.mins==m?'on':''}" onclick="S.mins=${m};startScreen()">${m==180?'3 h':m+' min'}</button>`).join('')}</div>`:''}
  <button class="primary" onclick="begin()">Start paper</button>
  <p class="note">${S.mode=='exam'?'You can change answers and flag questions until you submit. The paper submits itself when time runs out.':'Each answer is marked when you tap it and locks. Untimed.'} Progress is kept while this page stays open.</p>`;
  scrollTo(0,0)}
function begin(){S.ans={};S.flag={};S.pos=0;S.phase='run';S.start=Date.now();
  if(S.mode=='exam'){S.end=S.start+S.mins*60000;S.tick=setInterval(()=>{const r=S.end-Date.now();const t=$('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}
  show()}
function answered(){return Object.keys(S.ans).length}
function show(){
  const q=Q[S.pos],a=S.ans[S.pos],prac=S.mode=='practice';
  let h=`<div class="top"><div class="topi">${S.mode=='exam'?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:`<span class="timer">${Object.entries(S.ans).filter(([i,v])=>v==Q[i].k).length}/${answered()}</span>`}<span class="t">${answered()} of ${Q.length} answered</span><button class="flagbtn ${S.flag[S.pos]?'on':''}" onclick="flag()" aria-pressed="${!!S.flag[S.pos]}">${S.flag[S.pos]?'Flagged':'Flag'}</button></div><div class="bar"><i style="width:${(S.pos+1)}%"></i></div></div>
  <div class="qn">Question ${S.pos+1} of ${Q.length}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure for question ${S.pos+1}" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,i)=>{const l=L[i];let c='';if(prac&&a){if(l==q.k)c='ok';else if(l==a)c='bad'}else if(a==l)c='sel';
    h+=`<button class="opt ${c}" ${prac&&a?'disabled':''} onclick="pick('${l}')"><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  if(prac&&a)h+=expl(q,a);
  $('#app').innerHTML=h;
  const last=S.pos==Q.length-1;
  nav(`<button class="ghost" ${S.pos?'':'disabled'} onclick="go(-1)">Previous</button><button class="ghost" onclick="grid()">Questions</button>${last?`<button class="primary" onclick="confirmSubmit()">Submit</button>`:`<button class="primary" onclick="go(1)">Next</button>`}`);
}
function expl(q,a){const ok=a==q.k;
  return `<div class="exp"><h3 class="${a?(ok?'ok':'bad'):'na'}">${a?(ok?'Correct':'Incorrect'):'Not answered'} — answer ${q.k}</h3>${q.x?`<p>${esc(q.x)}</p>`:`<p class="note">The source gives the key only for this question.</p>`}${q.xi?q.xi.map(s=>`<img src="${s}" alt="Answer figure" onclick="zoom(this.src)">`).join(''):''}<div class="src">${esc(q.d)} · ${esc(q.src)}</div></div>`}
function pick(l){if(S.mode=='practice'&&S.ans[S.pos])return;if(S.mode=='exam'&&S.ans[S.pos]==l)delete S.ans[S.pos];else S.ans[S.pos]=l;const y=scrollY;show();scrollTo(0,y)}
function flag(){S.flag[S.pos]?delete S.flag[S.pos]:S.flag[S.pos]=1;const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(Q.length-1,S.pos+d));show();scrollTo(0,0)}
function grid(){const d=$('#dlg');const nf=Object.keys(S.flag).length,na=Q.length-answered();
  d.innerHTML=`<b>Questions</b><div class="legend" style="margin-top:6px"><span class="a">Answered (${answered()})</span><span class="f">Flagged (${nf})</span><span>Unanswered (${na})</span></div>
  <div class="grid">${Q.map((_,i)=>`<button class="${S.ans[i]?'ans':''} ${S.flag[i]?'flg':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};$('#dlg').close();show();scrollTo(0,0)" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button><button class="primary" onclick="$('#dlg').close();confirmSubmit()">Submit paper</button></div>`;d.showModal()}
function confirmSubmit(){const d=$('#dlg');const na=Q.length-answered(),nf=Object.keys(S.flag).length;
  d.innerHTML=`<b>Submit this paper?</b><p class="note">${na?`${na} question${na>1?'s are':' is'} unanswered. `:'All questions answered. '}${nf?`${nf} flagged.`:''} You can't change answers after submitting.</p><div class="row"><button class="ghost" onclick="$('#dlg').close()">Keep going</button><button class="primary" onclick="$('#dlg').close();submit()">Submit</button></div>`;d.showModal()}
function submit(auto){clearInterval(S.tick);S.used=Date.now()-S.start;S.phase='done';S.auto=!!auto;if($('#dlg').open)$('#dlg').close();results()}
function results(){nav();
  let r=0;const by={};Q.forEach((q,i)=>{const b=by[q.d]=by[q.d]||{n:0,r:0};b.n++;if(S.ans[i]==q.k){r++;b.r++}});
  const wrong=Q.map((q,i)=>i).filter(i=>S.ans[i]&&S.ans[i]!=Q[i].k),skip=Q.map((q,i)=>i).filter(i=>!S.ans[i]),fl=Object.keys(S.flag).map(Number).sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="kicker">${esc(P.title)}</div><h1>Results</h1>${S.auto?'<p class="note">Time ran out — the paper was submitted automatically.</p>':''}
  <div class="big">${r}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div><p class="sub">${wrong.length} incorrect · ${skip.length} unanswered · time used ${fmt(S.used)}</p>
  <div class="card"><table>${DOMS.filter(d=>by[d]).map(d=>{const b=by[d],p=Math.round(b.r/b.n*100);return `<tr><td>${d}<div class="meter"><i style="width:${p}%"></i></div></td><td>${b.r}/${b.n} · ${p}%</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="primary" ${wrong.length+skip.length?'':'disabled'} onclick="review('Incorrect and unanswered',${JSON.stringify(wrong.concat(skip).sort((a,b)=>a-b))})">Review incorrect (${wrong.length+skip.length})</button></div>
  <div class="row"><button class="ghost" ${fl.length?'':'disabled'} onclick="review('Flagged',${JSON.stringify(fl)})">Flagged (${fl.length})</button><button class="ghost" onclick="review('All questions',${JSON.stringify(Q.map((_,i)=>i))})">All 100</button></div>
  <div class="row"><button class="ghost" onclick="startScreen()">Retake paper</button></div>`;scrollTo(0,0)}
function review(t,list){S.list=list;S.rpos=0;S.rtitle=t;rshow()}
function rshow(){const i=S.list[S.rpos],q=Q[i],a=S.ans[i];
  let h=`<div class="top"><div class="topi"><button class="ghost" style="padding:6px 12px" onclick="results()">Results</button><span class="t">${S.rtitle} · ${S.rpos+1}/${S.list.length}</span>${S.flag[i]?'<span class="flagbtn on">Flagged</span>':''}</div></div>
  <div class="qn">Question ${i+1}</div><p class="stem">${esc(q.s)}</p>`;
  if(q.i)h+=`<div class="box">${q.i.map(s=>`<img src="${s}" alt="Figure" onclick="zoom(this.src)">`).join('')}</div>`;
  q.o.forEach((t,j)=>{const l=L[j];const c=l==q.k?'ok':(l==a?'bad':'');h+=`<button class="opt ${c}" disabled><span class="L">${l}</span><span class="T">${esc(t)}</span></button>`});
  h+=expl(q,a);$('#app').innerHTML=h;
  nav(`<button class="ghost" ${S.rpos?'':'disabled'} onclick="S.rpos--;rshow();scrollTo(0,0)">Previous</button><button class="primary" ${S.rpos<S.list.length-1?'':'disabled'} onclick="S.rpos++;rshow();scrollTo(0,0)">Next</button>`)}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
window.addEventListener('beforeunload',e=>{if(S.phase=='run'){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(S.phase!='run'||$('#dlg').open)return;if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else{const i=L.indexOf(e.key.toUpperCase());if(e.key.length==1&&i>=0&&i<Q[S.pos].o.length)pick(L[i])}});
startScreen();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
