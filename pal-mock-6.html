<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}

<script>
const P={"title":"ENT Mock Exam — Paper 6","q":[{"s":"Overprojecting nasal tips are the result of all except one of the following:","o":["hypertrophy of the alar cartilages","enlarged nasal spine","an overlong caudal aspect of the quadrilateral cartilage","excessive fat in the nasal tip","hypertrophy of the dorsal quadrilateral cartilage"],"k":"D","x":"By itself, an increase of the fat in the nasal tip does not create tip overprojection.","d":"Rhinology","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q6"},{"s":"The rates of complications in otoplasty have been reported in the range of","o":["2 to 6%.","5 to 9%.","7 to 11%.","11 to 14%.","13 to 16%."],"k":"C","x":"Regardless of the surgical techniques employed, complications are reported to occur at rates ranging from 7.1 to 11.4%. Early complications include hematoma and infection. Infection can be cellulitis or perichondritis/chondritis, which can lead to permanent auricular deformity. Late complications include paresthesias and hypersensitivity, suture granuloma formation, suture extrusion, hypertrophic scarring, and keloid fomation. Esthetic complications include inadequate correction of the antihelix, overcorrection with a “hidden” helix, telephone ear or reverse telephone ear deformity, persistent prominence of the concha, malposition of the lobule, sharp cartilage edges when cartilage cutting approaches are employed, and distortion of the external auditory canal with possible stenosis.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q10"},{"s":"Congenital subglottic stenosis","o":["always requires repair.","can be treated only with a tracheostomy.","can be observed expectantly if the symptoms are minimal.","requires a staged reconstruction with rib cartilage.","can be treated with dilatation if the stenosis is mature."],"k":"C","x":"Some patients outgrow their subglottic stenosis. Less than 50% of patients with congenital subglottic stenosis require a tracheostomy. Choices A, B, D, and E are not correct statements about congenital subglottic stenosis.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q10"},{"s":"Computed tomography (CT) and magnetic resonance imaging (MRI) would be expected to be most helpful in planning the surgical removal of which of the following lesions?","o":["nasal glioma","Thornwaldt’s cyst","floor-of-mouth dermoid","basal-type encephalocele","cervical teratoma"],"k":"D","x":"Of all of the responses, the only one with an intracranial connection is the basal-type encephalocele. Nasal gliomas, by definition, are heterotopic neural tissue that is not connected intracranially. Thornwaldt’s cysts arise in the nasopharynx and do not have any intracranial connection. Floor-of-mouth dermoids and cervical teratomas do not require both forms of imaging. The use of CT and MRI for basal-type encephaloceles is essential to plan surgical removal. Both of these studies are not necessary to make a determination regarding the removal of the other lesions.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q6"},{"s":"One of these complications is not seen with underlay tympanoplasty grafting:","o":["Reperforation","Blunting","Infection","Myringitis of the graft"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 9 · Q1"},{"s":"The typical displacement of the medial canthus in an avulsed medial canthal tendon is","o":["medially, superiorly, and anteriorly.","laterally, anteriorly, and inferiorly.","medially, inferiorly, and posteriorly.","laterally, superiorly, and anteriorly.","medially, inferiorly, and anteriorly."],"k":"B","x":"The typical displacement of the avulsed medial canthal tendon is laterally because of the retraction of the orbicularis oculi, inferiorly because of the loss of support by Lockwood’s suspensory ligament, and anteriorly because of the lack of the tethering action of the canthal tendon and the medial check ligament.","d":"H&N / Plastics / Trauma","src":"Ballenger · Facial Fractures · Q10"},{"s":"A patient suffers a knife wound to the face. The wound is closed primarily, tension free, and forms a well-healed scar. The patient wishes to know how strong the tissue is compared to normal skin. Which answer is most appropriate?","o":["Compared to normal skin, the tissue is 10% as strong","Compared to normal skin, the tissue is 30% as strong","Compared to normal skin, the tissue is 50% as strong","Compared to normal skin, the tissue is 80% as strong","Compared to normal skin, the tissue is 100% as strong"],"k":"D","x":"A scar that has healed correctly is expected to attain 80% strength compared to normal tissues.","d":"Rhinology","src":"SBA book · Rhinology · Q28"},{"s":"A 44-year-old female professional singer presents with a 3-month history of a swelling in her thyroid gland. An initial fine needle aspiration (FNA) has been reported as Thy 1. A second FNA 6 weeks later under ultrasound (US) guidance is reported as Thy 3. The US reports a 1 cm nodule in the left thyroid lobe. She is biochemically euthyroid and otherwise fit and well. What is the next most appropriate management plan?","o":["Repeat the FNA","Reassure her and arrange a repeat follow-up appointment in 3 months","Arrange for her to undergo a left hemithyroidectomy","Arrange a contract CT scan to exclude a retrosternal goitre","Request serum thyroglobulin levels"],"k":"C","x":"The initial FNA was reported as Thy 1 (non-diagnostic) and was therefore repeated. The second FNA was reported as Thy 3 (follicular lesion/suspected follicular neoplasm). The majority of patients with a Thy 3 FNA will require surgical removal of the lobe containing the nodule with completion thyroidectomy if malignancy is confirmed by histology. Occasionally, an FNA is reported as Thy 3 due to some suspicious findings but may be Thy 2 or Thy 4. The text of the report should indicate these suspicious and the case discussed at the MDT meeting.\nMRI and CT scanning can be useful to delineate the size of the goitre. However, iodinated contrast media should be avoided as this reduces the subsequent radio-iodide uptake by thyroid tissue and therefore can limit the use of |'?' postoperatively.\nThyroglobulin is used in the surveillance of thyroid cancer following surgery. However, the measurement of thyroglobulin before thyroidectomy has no diagnostic or prognostic value and therefore should not be requested.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q24"},{"s":"The most appropriate positioning maneuver used to improve a tenuous airway in a trauma patient is","o":["head tilt/chin lift","cricoid pressure","jaw thrust","hyoid pressure","tongue retrusion"],"k":"C","x":"The jaw thrust is the most appropriate positioning maneuver used to improve a tenuous airway in a trauma patient. A head tilt/chin lift may be successful in improving the airway but risks cervical spinal cord injury in a trauma patient. Cricoid pressure and hyoid pressure are not positioning maneuvers that would improve an airway. Tongue retrusion would lead to airway compromise.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q2"},{"s":"Which is not an important step during paramedian mandibulotomy?","o":["Pre-plating prior to performing an osteotomy","Identification and preservation of the mental foramen","Identification of the hypoglossal nerve","Leaving some gingival mucosa attached to the mandible","Review the preoperative orthopantomogram (OPG) to assess for dental roots"],"k":"C","x":"Pre-plating reduces malocclusion and malunion; avoiding the mental foramen reduces postoperative numbness. Leaving gingiva attached allows water-tight suture placement post excision. Inadvertently placing a screw into a dental root can result in a non-vital tooth.","d":"H&N / Plastics / Trauma","src":"SBA book · Head & Neck Surgery · Q56"},{"s":"Which of the following reconstructive flaps in the head and neck is correctly matched with their supplying artery?","o":["Fibula free flap is based on the tibial artery","Pectoralis major flap is based on the thoracoacromial artery","The anterior lateral free flap is based on the popliteal artery","Deltopectoral flap is based on the perforating branches of the internal mammary artery","The supraclavicular flap is based on the external carotid artery"],"k":"B","x":"The fibula free flap is based on the peroneal artery.\nThe supraclavicular flap is based on the supraclavicular artery, a branch of the transverse cervical artery; less frequently it arises from the suprascapular artery. Neither are branches of the external carotid artery.\nThe deltopectoral flap is based on perforating branches of the internal thoracic artery.\nThe anterior lateral free flap is based on the lateral circumflex femoral artery.","d":"Rhinology","src":"SBA book · Rhinology · Q58"},{"s":"An absolute contraindication to middle fossa vestibular nerve section is","o":["An only hearing ear","Bilateral Ménière’s disease","Incapacitating vertigo","Diuretic allergy","Age less than 60 years"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 35 · Q2"},{"s":"Regarding orbital cellulitis and cavernous sinus thrombosis, which of the following statements is false?","o":["The most common organism causing cavernous sinus thrombosis is Staphylococcal aureus","The orbital septum is an extension of the periosteum covering bone","Stage III of Chandler’s classification involves a subperiosteal abscess","The most common cranial nerve palsy in cavernous sinus thrombosis is a third nerve palsy","The most common cause of cavernous sinus thrombosis is a nasal furuncle"],"k":"D","x":"Staphylococcus aureus accounts for approximately 70% of cavernous sinus thrombosis. The orbital septum extends from the tarsus to the orbital rim, where it then attaches to the\nbone and becomes the periorbita inside the orbit and periosteum outside the orbit. Chandler’s classification: I, preseptal cellulitis—cellulitis confined to the eyelid (i.e. anterior to the superior orbital septum); II, orbital cellulitis without abscess—cellulitis involving the orbit; III, orbital cellulitis with a subperiosteal abscess; IV, intraorbital abscess; and V, cavernous sinus thrombosis. A sixth nerve palsy is the most common nerve palsy identified in cavernous sinus thrombosis. Cavernous\nsinus thrombosis most commonly results from contiguous spread of infection from a nasal furuncle (50%), sphenoidal or ethmoidal sinuses (30%), and dental infections (10%).","d":"Rhinology","src":"SBA book · Rhinology · Q56"},{"s":"Tumours of the lower lip are typically:","o":["Basal cell carcinomas","Associated with poor oral hygiene","Associated with neck metastases in 45% of patients at presentation","Almost universally in males","Associated with late metastasis in 50%"],"k":"D","x":"Tumours of the lower lip are squamous cell carcinomas in 98% of cases. There is an overwhelming preponderance of males (ratio 80:1) over females. Clinically apparent cervical metastases are seen in fewer than 10% of patients. Around 5—15% of patients will develop lymph node metastases at some time in the future.","d":"Rhinology","src":"SBA book · Rhinology · Q34"},{"s":"Which of the following statement concerning thyroid hormone synthesis is false?","o":["Thyroid peroxidase is produced within the thyroid gland and acts to oxidize iodine and facilitate the attachment of iodine to active tyrosine units in thyroglobulin","Pendrin is a potassium—chloride symporter present in the follicular cells of the thyroid gland","Thyroid-stimulating hormone (TSH) is produced by the anterior pituitary gland in response to thyroid-releasing hormone from the hypothalamus","TSH causes reabsorption of thyroglobulin from the follicular space","Thyroid hormones triiodothyronine (T3) and thyroxine (T4) are essential for normal development"],"k":"B","x":"lodide in the blood is taken up by follicular cells by a sodium—iodide symporter and then transported in to the follicular space by pendrin—an iodide chloride symporter/antiporter. Here it is oxidized to iodine, attached to active tyrosine units in thyroglobulin to form thyroid hormone precursors. Under the action of TSH, thyroglobulin is reabsorbed back in to the follicular cells and iodinated tyrosines are cleaved to form thyroid hormones, mainly T4. Pendred syndrome is an autosomal recessive condition characterized by a mutation in the PDS gene, which codes for the pendrin symporter. As well as being expressed in the thyroid gland, pendrin is also found in the cochlea and kidney.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q45"},{"s":"Which would be the best approach for an acquired cholesteatoma that involves the geniculate ganglion, but without a sensorineural hearing loss?","o":["Mastoidectomy combined with a middle fossa craniotomy","Radical mastoidectomy","Bondy modified radical mastoidectomy","Canal-wall-up mastoidectomy with malleus head removal to expose the anterior epitympanum","Translabyrinthine"],"k":"A","x":"A middle fossa craniotomy will give the exposure needed for cholesteatoma removal. Mastoidectomy alone is unlikely to give adequate exposure of the geniculate ganglion. A radical mastoidectomy would not improve the exposure or facilitate postoperative care compared with other canal-wall-down mastoidectomy techniques. A translabyrinthine approach should be considered if there is no salvageable hearing.","d":"Otology","src":"Brackmann · Chapter 19 · Q3"},{"s":"A 44-year-male with a 4-month history of anosmia reports that he can still smell ammonia. Which cranial nerve is likely to be responsible for this?","o":["One—olfactory","Five—trigeminal","Seven—facial","Nine—glossopharyngeal","Ten—vagus"],"k":"B","x":"The trigeminal nerve supplies innervation to the nose and is sensitive to noxious chemical stimuli, such as ammonia.","d":"Rhinology","src":"SBA book · Rhinology · Q15"},{"s":"Squamous cell carcinoma (SCC) at high risk for bilateral regional lymph node metastases includes all of the following primary sites except the","o":["midline lip.","floor of the mouth.","oral tongue.","base of the tongue.","alveolar ridge."],"k":"E","x":"Midline structures of the oral cavity and oropharynx commonly drain to lymphatic channels in both sides of the neck. Primary sites of SCC of the oral cavity at high risk for bilateral regional lymph node metastases include the midline of the lip, floor of the mouth, and oral tongue. Primary sites of SCC of the oropharynx at high risk for bilateral regional lymph node metastases include the base of the tongue, soft palate, and midline posterior pharyngeal wall. Squamous cell carcinoma of the alveolar ridge does not readily metastasize to regional lymphatics.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q1"},{"s":"Concerning anticancer clinical drug trials, which of the following statements is correct?","o":["Phase 1 clinical trials usually involve large numbers of patients to test for anticancer properties","Phase 2 trials will aim to ascertain the response of the cancer to the treatment","A Phase 3 trial testing a new cancer drug will assess its cost-effectiveness","All cancer patients should be included in clinical trials","Patient consent is not required for the inclusion of patients with advanced cancer into phase 1 trials only"],"k":"B","x":"A phase 1 trial is the first stage in testing a new treatment. The trials are conducted to assess the safe dose range, side effects, and effects on the cancer. Phase 1 trials usually include only a small number of study volunteers.\nPhase 2 trials are usually larger than phase 1 trials. If a phase 2 trial can show that the new treatment is as good or better than an existing treatment, then a phase 3 trial can be started. A phase 3 study is a formal comparison between the treatment results with the new therapy compared with a standard treatment. This may include a comparison of survival or side effects.\nClinical trials are certainly important, but it is the patient’s choice whether they wish to be included in a trial, and consent is always required.","d":"General","src":"SBA book · General Otolaryngology · Q21"},{"s":"Conductive hearing impairment occurs with large exostoses of the external auditory canal when","o":["Debris prevents normal tympanic membrane vibration","Narrowing of the external auditory canal reaches 5 mm","Narrowing of the external auditory canal reaches 2 mm","All of the above","a and c"],"k":"E","x":"","d":"Otology","src":"Brackmann · Chapter 2 · Q3"},{"s":"Which of the following has not been linked to cricoarytenoid joint dysfunction?","o":["traumatic intubation","external trauma","osteoarthritis","rheumatoid arthritis","gout"],"k":"C","x":"Traumatic intubation and external trauma are documented causes of arytenoid cartilage dislocation. Inflammatory lesions such as gout and rheumatoid arthritis have been linked to cricoarytenoid joint fixation. Osteoarthritis is not related to cricoarytenoid joint dysfunction.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q10"},{"s":"Which combination of treatments has been most successful for treating stage III nasopharyngeal carcinoma?","o":["paclitaxel and external beam radiation","cisplatin and external beam radiation","paclitaxel, external beam radiation, and radical neck dissection","cisplatin, external beam radiation, and brachytherapy","5-fluorouracil and external beam radiation"],"k":"B","x":"A phase III clinical trial has demonstrated much better diseasefree survival using a combination of cisplatin and radiation compared with radiation alone and is now considered standard treatment by most practitioners.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Nasopharynx · Q5"},{"s":"A 45-year-old female professional vocalist presents with a solitary right thyroid nodule. She is biochemically euthyroid and a full ENT examination is otherwise normal. A fine needle aspiration is performed and reported as ‘possible follicular neoplasm’. What is the next most appropriate action?","o":["Reassure the patient and discharge","Reassure the patient and review in 6 months","Refer for radioactive iodine","Screen for a phaeochromocytoma","Advise right hemithyroidectomy"],"k":"E","x":"A well-differentiated follicular thyroid cancer cannot be differentiated from a benign follicular lesion based on FNAC. Histological diagnosis is required to confirm the diagnosis and therefore most of these cases will require surgical removal of the implicated nodule and discussion at an MDT meeting.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q33"},{"s":"A laryngeal squamous cell carcinoma has spread from the vocal cord into the pre-epiglottic space. For the tumour to continue to spread anteriorly into the subcutaneous tissues and skin, through which structure will it pass?","o":["Epiglottis","Thyrohyoid ligament","Thyroepiglottic ligament","Aryepiglottic fold","Cricoid cartilage"],"k":"B","x":"The pre-epiglottic space is bounded anteriorly by the thyrohyoid ligament. The posterior boundary is the epiglottis.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q30"},{"s":"The authors identified four advantages associated with transcanal medial graft placement tympanoplasty. Which one of the following was not considered an advantage?","o":["It is quicker and more direct.","It results in less surgical trauma and reduces the likelihood of healing problems such as adhesions, narrowing, and stenosis of the ear canal.","It is technically easier to perform.","It results in less postoperative discomfort for the patient.","There is reduced risk of tympanic membrane blunting and burying of squamous epithelium beneath the graft."],"k":"C","x":"Although transcanal medial graft placement may be technically difficult in some circumstances, the advantages gained with this approach are felt by the authors to outweigh the difficulties associated with the procedure.","d":"Otology","src":"Brackmann · Chapter 11 · Q1"},{"s":"A 6-month-old child is being followed up with laryngomalacia having being diagnosed following a microlaryngoscopy and bronchoscopy. In which of the following situations would you consider surgical intervention?","o":["Noisy breathing during feeding","Cyanotic episodes","Failure to thrive","AandB","BorC"],"k":"E","x":"Cyanotic episodes and failure to thrive suggest severe laryngomalacia. In these instances, further intervention is indicated.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q3"},{"s":"Cartilage should be considered as a graft material in the following situations:","o":["The atelectatic ear","Cholesteatoma","A perforation anterior to the annulus","A draining perforation","All of the above"],"k":"E","x":"Cartilage can be used as a graft material in any ear considered to be at high risk for failure with traditional techniques using temporalis fascia or perichondrium. Included in this would be the high-risk perforation, the atelectatic ear, and cholesteatoma.The high-risk perforation comprises a revision surgery, a perforation anterior to the annulus, a perforation draining at the time of surgery, a perforation larger than 50%, or a bilateral perforation.","d":"Otology","src":"Brackmann · Chapter 10 · Q2"},{"s":"The most common cause of outstanding ears is","o":["lack of development of the antihelical fold.","overdevelopment of the antihelical fold.","a wide protruding concha.","overdevelopment of the cauda helicis.","underdevelopment of the concha."],"k":"A","x":"The most common cause of outstanding ears is the lack of development of the antihelical fold. This malformation of the antihelix is present in approximately two-thirds of all outstanding ears. However, other pathologic features may also contribute to the outstanding ear. A wide, protruding conchal wall is present in approximately one-third of all cases. Additionally, the prominent concha is often accompanied by a thickened antitragus.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q2"},{"s":"In the postoperative care of the patient, which of the following is most correct?","o":["Antibiotics should be routinely used.","Decongestants should be taken daily.","The splint should remain in place for 5 to 7 days.","The foot of the bed should be elevated.","The inside of the nose should be cleaned daily with povidone-iodine and Q-tips."],"k":"C","x":"The only choice in this group that is constantly important is the application of the splint.","d":"Rhinology","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q9"},{"s":"A 46-year-old man presents with a 5-day history of an upper respiratory tract infection and 2 days’ right cervical lymphadenopathy. He is febrile with a raised white cell count. Ultrasonography of his neck reveals a thrombus in his right internal jugular vein and a chest X-ray is reported as having changes consistent with ‘septic emboli’. Which is the most likely organism responsible for his symptoms?","o":["Proteus mirabilis","Clostridium difficile","Fusobacterium necrophorum","Streptococcus pyogenes","Staphylococcus aureus"],"k":"C","x":"Lemierre’s syndrome is a disease usually caused by the bacterium Fusobacterium necrophorum. Typically this affects young, healthy adults. Infection leads to inflammation and thrombosis of the internal jugular vein. Septic emboli cause many of the resulting symptoms.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q15"},{"s":"Velopalatal insufficiency associated with lateral skull base surgery may be caused by all of the following except","o":["Tensor veli palatini paralysis","Loss of cranial nerve X nodose ganglion fibers","Nerve of Hering injury","Palatopharyngeus muscle dysfunction"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 47 · Q3"},{"s":"Which of the following is the most commonly cited complication associated with the retrosigmoid vestibular neurectomy?","o":["Cerebrospinal fluid leak","Wound infection","Aseptic meningitis","Subdural hematoma","Chronic headache"],"k":"E","x":"The retrosigmoid approach is associated with an approximately 10% chance of headache that can be long-lasting and disabling.","d":"Otology","src":"Brackmann · Chapter 36 · Q4"},{"s":"What are the four anatomic parameters, as seen radiographically, crucial for atresia surgical operability?","o":["The status of the inner ear, the degree of pneumatization of the mastoid, the course of the facial nerve, and the presence of the oval window and stapes footplate","Thickness and form of the atretic bone, soft tissue contribution to the atresia, size and status of the middle ear cavity, and the presence or absence of congenital cholesteatoma","The status of the inner ear, the degree of pneumatization of the mastoid, thickness and form of the atretic bone, and the presence or absence of congenital cholesteatoma","Soft tissue contribution to the atresia, size and status of the middle ear cavity, the course of the facial nerve, and the presence of the oval window and stapes footplate"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 5 · Q2"},{"s":"What are the disadvantages of the transcochlear approach?","o":["Does not allow exposure of the lateral aspect of the pons and upper medulla, cranial nerves V through XI, and the midbasilar artery","Sacrifice of residual hearing in the operated ear and risk of temporary facial palsy","Limited by the cerebellum and the brain stem","Requires the use of brain retractors"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 52 · Q3"},{"s":"A 2-year-old has been referred for an ENT assessment as they have had six episodes of croup. Which statement regarding the croup is false?","o":["Croup is usually viral caused by the parainfluenza virus (a paramyxovirus)","Common bacterial pathogens causing croup include Staphylococcus aureus, Streptococcus pneumoniae, and Haemophilus influenza","Steeple sign refers to subglottic changes seen on a chest X-ray in croup","Patients with recurrent croup should be investigated for tracheomalacia","The cricoid is located at C4 at birth and Cé6 in an adult"],"k":"D","x":"Children who present with recurrent croup should have a full ENT assessment and be investigated for subglottic stenosis. An MLB should be undertaken and the airway sized.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q50"},{"s":"The most common complication from the combined petrosal approach is","o":["Cerebrospinal fluid leak","Cranial nerve injury","Cerebrovascular accident","Pituitary hypofunction","Subdural hematoma"],"k":"B","x":"Cranial nerve injury is the most common complication. Cranial nerves V and VII are the most commonly compromised, but III–XI are at risk with this approach. Some authors advocate subtotal excision with stereotactic irradiation as a result, but the long-term results are unknown.","d":"Otology","src":"Brackmann · Chapter 56 · Q5"},{"s":"Regarding congenital choanal atresia, which of the following statements is true?","o":["It is commonly membranous in nature","It most commonly occurs bilaterally","It most often occurs in males","It can be associated with ear abnormalities","It has an incidence of approximately 1:500 live births"],"k":"D","x":"Congenital atresia occurs in approximately 1:5000 with a female preponderance (2:1\nratio). In approximately 60% of cases the atresia is unilateral. Bony atresia is the most common abnormality either alone or part of a combined bony and membranous atresia. Choanal atresia may be part of the CHARGE syndrome: coloboma, heart abnormality, choanal atresia, retardation of growth, genitourinary anomalies, and ear abnormalities.","d":"Rhinology","src":"SBA book · Rhinology · Q63"},{"s":"The expected facial nerve result after facial nerve repair is","o":["I–II","II–III","III–IV","IV–V","V–VI"],"k":"C","x":"The intracranial and intratemporal facial nerve is monofasicular. After facial nerve anasatomosis, synkenesis is an expected result.","d":"Otology","src":"Brackmann · Chapter 30 · Q4"},{"s":"A child with a confirmed RET mutation who has a family history of multiple endocrine neoplasia should undergo:","o":["Serial neck ultrasound scan for lifelong surveillance","Serial thyroid ultrasound scans and if normal for 5 years can be discharged","Prophylactic hemithyroidectomy","Prophylactic total thyroidectomy","Total thyroidectomy with central neck dissection"],"k":"D","x":"Patients with multiple endocrine neoplasia 2 (MEN2) have mutations of the RET proto- oncogene and are at significant risk of medullary thyroid cancer. In MEN2B/3, medullary thyroid cancer is aggressive and may manifest as metastatic disease in infancy, hence prophylactic total thyroidectomy in those with confirmed mutations is recommended within the first year of life. Those with MEN2A are advised to undergo prophylactic total thyroidectomy by the age of 5 years.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q47"},{"s":"With regard to granulomatous disorders affecting the nose, which of the following statements is true?","o":["Sarcoidosis classically affects the posterior bony septum","Syphilis classically affects the nasal mucosa","Sarcoidosis classically affects the subglottis","The target antigen for perinuclear antineutrophil cytoplasmic antibody (pANCA) is myeloperoxidase","Lupus pernio is a cutaneous manifestation of granulomatosis with polyangiitis (GPA)"],"k":"D","x":"Questions regarding granulomatous disorders affecting the upper aerodigestive tract are extremely common in exams. These diseases cause inflammation of the blood vessels and/or impairment of blood flow leading to tissue ischaemia. The common disorders usually examined on are sarcoidosis, GPA (formerly Wegner’s granulomatosis), and eosinophilic GPA (formerly known as Churg—Strauss syndrome). Sarcoidosis is a multisystem disease which preferentially affects the lower respiratory tract but may also affect the upper airway, classically supraglottic thickening, and the nasal mucosa—‘strawberry skin’ which is friable giving crusting, discharge, and nasal congestion. Lupus pernio is a cutaneous manifestation of sarcoidosis. Syphilis classically affects the posterior bony septum. GPA and GPA with eosinophilia are both small- to medium-size vessel vasculitic disorders. GPA classically affects the paranasal sinuses, lungs, and kidneys. The subglottis may be\naffected. GPA with eosinophilia characteristically has three stages: an allergic phase with asthma\nand rhinitis, an eosinophilic phase with pneumonia and gastroenteritis, and a vasculitic phase. Antineutrophil cytoplasmic antibodies (ANCA) are antibodies produced by the host against its own proteins. CANCA targets enzyme protease-3 (PR3) present in neutrophil granulocytes, is associated with GPA, and is positive in 95% of those with generalized active disease. pPANCA targets the antigen myeloperoxidase (MPO) and is associated with GPA with eosinophilia but can be negative in greater than 50% of cases, being non-specific.","d":"Rhinology","src":"SBA book · Rhinology · Q51"},{"s":"Increased tip projection may be achieved by all except one of the following methods:","o":["application of a cartilage tip graft","borrowing from the lateral crura to elongate the intermediate crura","transdomal suturing of the domes","use of bilateral spreader grafts","application of only cap grafts"],"k":"D","x":"Spreader grafts have no effect on tip projection per se and are used for correction of internal nasal valve collapse and for straightening the lateral lines of the nose on frontal view.","d":"Rhinology","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q10"},{"s":"Cluster headaches are typically (1) dull, burning pain (2) often awaken patients (3) are not associated with intracranial lesions (4) are associated with unilateral nasal congestion","o":["1 and 3","2 and 4","4 only","1, 2, and 3","all of the above"],"k":"B","x":"Cluster headaches have severe lancinating pain that often awakens patients. They are associated with unilateral nasal congestion, rhinorrhea, and lacrimation. They may occur with intracranial lesions or after meningitis. Therefore, (2) and (4) are correct, and (1) and (3) are not.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q5"},{"s":"A white boy presents with a history of chronic sinusitis, pulmonary infection, and malabsorption. Which of the following tests is the most specific for his disease?","o":["sweat chloride","c-ANCA","erythrocyte sedimentation rate","angiotensin converting enzyme level","rheumatoid factor"],"k":"A","x":"An elevated level of chloride in sweat confirms a diagnosis of cystic fibrosis.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q3"},{"s":"Which of the following statements is most appropriate concerning thyroid cancer?","o":["Papillary and follicular thyroid carcinomas occur with an equal incidence","Follicular thyroid cancers can be diagnosed using fine needle aspiration cytology (FNAC)","AFNAC report of a solitary thyroid nodule reported as Thy 2 should lead directly on to thyroid surgery","Medullary thyroid carcinoma associated with multiple endocrine neoplasia (MEN) 2B carries a better prognosis than that associated with MEN 2A","Primary medullary thyroid carcinoma does not occur in a thyroglossal cyst"],"k":"E","x":"Medullary thyroid carcinoma (MTC) arises from the parafollicular cells (C cells) of the thyroid. Embryologically, these are derived from the fifth pharyngeal pouch. The thyroid and hence thyroglossal duct is derived from the third and fourth pharyngeal pouches. Therefore, all malignant types of thyroid cancer can arise in the thyroglossal duct except MTC.\nAbout 80% of thyroid cancers are papillary. Follicular cancer represents 10-15%. FNAC cannot diagnose follicular thyroid cancer.\nFNAC results are reported as:\n¢ Thy 1: inadequate * Thy 2: benign appearance ¢ Thy 3: follicular lesion ¢ Thy 4: suspicious of malignancy ¢ Thy 5: malignant cells. Therefore, a Thy 2 report may not directly lead on to surgery.\nThe prognosis of MTC associated with MEN 2B is worse than that associated with all other forms of MTC.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q9"},{"s":"As a rule, the internal auditory canal (IAC) can be identified topographically by","o":["Bisecting the angle between the greater superficial petrosal nerve (GSPN) and the arcuate eminence","Bisecting the angle between the arcuate eminence and the middle meningeal artery","Following the course of the GSPN","Following the course of the IAC"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 53 · Q5"},{"s":"Which is the best prognosticator of survival from nasopharyngeal carcinoma?","o":["high angiogenesis in the tumor","poor differentiation","lung metastases","WHO type I histology","enlarged lymph nodes low in the neck"],"k":"B","x":"Patients with poorly differentiated nasopharyngeal carcinoma or the histology associated with WHO type III, the classic lymphoepithelioma, have the best prognosis, with 20 to 40% higher long-term survival. WHO type I lesions are well differentiated, and patients with them fare worse with currently available treatment.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Nasopharynx · Q2"},{"s":"Which is a prominent histologic feature of juvenile nasopharyngeal angiofibroma?","o":["well-organized fibrous stroma","a tumor capsule of dense collagen","positive staining for estrogen receptors","prominent arteries with intima and media","palisading of fibrocytes"],"k":"A","x":"The histology of juvenile nasopharyngeal angiofibromas is characterized by small sinusoidal vessels without a muscular layer in a dense fibrous stroma. The tumors are not encapsulated.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nasopharynx · Q9"},{"s":"The main target of HIV is the","o":["CD4+ T lymphocyte.","CD4+ B lymphocyte.","CD4– T lymphocyte.","CD4– B lymphocyte.","CD4+ monocyte."],"k":"A","x":"The CD4 receptor is a high-affinity target for binding by gp120, one of the HIV major envelope proteins. CD4 receptors are expressed on T lymphocytes. Human immunodeficiency virus strains tropic for activated T lymphocytes bind by the CD4 receptor and CXCR4 chemokine coreceptor.","d":"General","src":"Ballenger · Acquired Immune Deficiency Syndrome · Q6"},{"s":"Most ear anomalies are inherited as","o":["autosomal recessive traits.","autosomal dominant traits with incomplete penetrance.","X-linked traits.","random mutations.","autosomal dominant traits."],"k":"B","x":"Most ear anomalies are inherited as autosomal dominant traits with incomplete penetrance.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q3"},{"s":"Elevation of antineutrophil cytoplasmic antibodies is a useful laboratory test in evaluation of which disease?","o":["sarcoidosis","rhinoscleroma","Wegener’s granulomatosis","amyloidosis","rheumatoid arthritis"],"k":"C","x":"Cytoplasmic antineutrophil cytoplasmic antibodies (c-ANCAs) are the predominant ANCAs in Wegener’s granulomatosis. Elevation of the c-ANCA is highly specific for Wegener’s granulomatosis. Confirmation of the diagnosis is made by biopsy of lesions in the upper respiratory tract in which the necrotizing vasculitis can be demonstrated.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q4"},{"s":"The primary benefit of the penetrating auditory brain stem implant (PABI) was found to be","o":["Improved speech recognition performance","Fewer nonauditory sensations","Lower electrical auditory thresholds and a wide range of pitch sensations","Greater ease of placement in the target neurons than the surface ABI"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 58 · Q4"},{"s":"The cardinal rule of laser surgery of the oval window, regardless of the type of laser, is","o":["To never fire the laser directly into an open vestibule","Only perform revision surgery once","That the inner ear is immune to damage from laser energy","That there is nothing more to learn about laser revision stapes surgery"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 24 · Q5"},{"s":"Concerning the development of the upper aerodigestive tract, which of the following statements is false?","o":["The larynx develops in part from the fourth—sixth branchial arches","At birth, the larynx is higher in the neck than in the adult and descends through the first two decades of life","The laryngeal musculature develops in part from the fourth branchial arch","Laryngomalacia is the commonest cause of infantile stridor","Laryngomalacia is commoner in premature infants with neuromuscular immaturity"],"k":"E","x":"The exact aetiology of laryngomalacia is unknown but it is not commoner in premature infants.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q18"},{"s":"Concerning non-melanomatous skin cancer of the head and neck, which of the following statements is true?","o":["Low-risk, less than 2 cm cutaneous squamous cell carcinoma (SCC) lesions require a 2 mm excision border to give a 95% chance of complete clearance","High-risk cutaneous SCC lesions greater than 2 cm in diameter require a 6 mm excision margin","All patients with non-melanomatous skin cancer of the head and neck should undergo radiological staging","A3 mm excision margin of a basal cell carcinoma (BCC) gives a 95% of complete resection","Parotid involvement in cutaneous SCC (in an NO neck) requires a radical neck dissection"],"k":"B","x":"Guidelines suggest cutaneous SCC requires a 4 mm excision margin for low-risk lesions with a diameter of 20 mm or less. High-risk lesions with a diameter greater than 20 mm require a 6mm excision margin. BCC requires a 4 mm excision margin for a 95% chance of tumour clearance. A 3 mm clearance margin in BCC gives an 85% clearance margin. Radiological staging is not routinely performed in cutaneous SCC except when regional lymph nodes are clinically detectable, or because the tumour invades bone. The pattern of spread in cutaneous SCC differs from upper aerodigestive tract mucosal SCC. The parotid and lymph nodes surrounding the external jugular vein, a more superficial lymphatic system, are more likely to be involved. Parotid involvement with an NO neck dictates a clearance of levels I to III with parotid removal. Parotid involvement and N+ disease requires level V to also be included within the resection.","d":"Rhinology","src":"SBA book · Rhinology · Q48"},{"s":"When multiple dysmorphisms appear in the same patient, consultation with a medical geneticist is prudent to","o":["decide which problem to treat first.","identify the specific syndromes involved.","rule out functional components of the speech disorder.","determine if the speech disorder is of genetic origin.","determine whether evaluation and treatment of the family as well as the patient are necessary."],"k":"E","x":"With multiple dysmorphisms, genetic predispositions may necessitate family birth counseling as well as other treatment considerations.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q7"},{"s":"Methods of sealing the CSF space after posterior fossa surgery include:","o":["Abdominal fat","Hydroxyapatite cement","Fibrin glue","Collagen matrix","All of the above"],"k":"E","x":"All of the answers represent methods used to seal the CSF space after skull base surgery.","d":"Otology","src":"Brackmann · Chapter 60 · Q4"},{"s":"Which of the following would be the least appropriate recipient site for a full-thickness skin graft?","o":["Pericranium","Muscle","Fat","Cartilage","Bone"],"k":"E","x":"A full-thickness skin graft relies on its new site for a blood supply. Therefore, any of the options except bare bone would suffice as a recipient site.","d":"Rhinology","src":"SBA book · Rhinology · Q35"},{"s":"In the canal-wall-reconstruction tympanomastoidectomy technique, bone pate collection should be performed","o":["After tympanic membrane grafting and replacement of the posterior canal wall","After a complete mastoidectomy has been performed but prior to making bony canal cuts with a microsagittal saw","Prior to any entry into mastoid cells","Following removal of the bony posterior canal wall"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 14 · Q2"},{"s":"Which of the following is the most important component of the preoperative evaluation when considering vestibular neurectomy?","o":["Clinical history and physical examination","CT scan of the temporal bone","Caloric testing results","MRI","Audiometric findings"],"k":"A","x":"All of the other components of the preoperative workup may be helpful, but clinical history and physical examination are the most important components when identifying the cause of dizziness prior to considering any surgical treatment for relief of vertigo.","d":"Otology","src":"Brackmann · Chapter 36 · Q1"},{"s":"Which primary tumor of the oral cavity or oropharynx demonstrates the most sensitive response to radiation therapy?","o":["alveolar ridge","hard palate","retromolar trigone","posterior pharyngeal wall","tonsil"],"k":"E","x":"Of all of the tumors in the oral cavity and oropharynx, cancers of the tonsil are the most radiosensitive, particularly exophytic lesions.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q9"},{"s":"The mechanism for salivary gland tumor involvement of the temporal bone is","o":["Direct extension","Hematogenous metastases","Ectopic salivary rests within the temporal bone","Squamous metaplasia","Absence of the fissures of Santorini"],"k":"A","x":"The proximity of the partoid and fissures of Santorini make direct extension the most common mode for salivary gland tumors to involve the temporal bone.","d":"Otology","src":"Brackmann · Chapter 3 · Q2"},{"s":"Incisions in and around the nose should be placed","o":["in the precise midline.","inside the nose to avoid detection.","at the junction of facial landmarks.","in a circular manner.","at right angles to the relaxed skin tension lines."],"k":"C","x":"Where facial features and landmarks join is the best place to camouflage and hide incisions on and about the nose.","d":"Rhinology","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q1"},{"s":"Which of the following statements is true regarding the diagnosis of allergic rhinitis?","o":["Nasal endoscopy is always indicated.","In vitro testing is conclusive.","Patients can easily be classified into perennial and seasonal categories.","Correlation with symptoms is important.","Ancillary tests are infrequently employed to evaluate allergic patients."],"k":"D","x":"The diagnosis of allergic rhinitis relies on a careful history to identify the sensitizing antigen, both to establish the diagnosis and to institute the first treatment, avoidance. Symptoms occurring in temporal relation to allergen exposure suggest sensitization but are not diagnostic. With a classic history (eg, sneezing each fall), empiric therapy may provide the simplest approach. In less clear cases, allergy testing either by skin prick, intradermal, or in vitro methods can identify allergens causing sensitization. However, individuals can show evidence of sensitization by a positive skin test or elevated specific antibody levels in the serum without having evidence of clinical disease. This emphasizes the importance of a good history in the evaluation of patients with suspected allergic disorders. Ancillary testing is often employed to evaluate for complications of allergic rhinitis as well as related disorders such as sinusitis (computed tomography scans) and asthma (pulmonary function testing). Endoscopy, although not always indicated, can be useful in evaluating for structural abnormalities (septal deviation), evidence of related diseases (sinusitis), and other nonallergic nasal disorders.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q6"},{"s":"Concerning Usher syndrome, which of the following statements is false?","o":["If both parents are carriers of the defective gene, the chance of having a child with the syndrome is 25%","Usher syndrome type 1 is associated with reduced vestibular function","Usher syndrome type 2 is less common than type 1","Retinitis pigmentosa results in blindness","Usher syndrome type 1 is associated with a predominantly low-tone hearing loss"],"k":"E","x":"Usher syndrome is inherited in an autosomal recessive pattern. Type 1 is the commonest and is associated with profound congenital deafness, abnormal vestibular function, and retinitis pigmentosa occurring in the first decade of life.\nType 2 is associated with a moderate to severe congenital deafness, normal vestibular function, and retinitis pigmentosa occurring in the second or third decade of life.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q17"},{"s":"In fractures of the parasymphyseal area of the mandible, the Champy plate","o":["should always be placed with an antitension band.","must go through both cortices of the mandible.","can be safely placed without postoperative intermaxillary fixation.","needs to be removed if a screw approximates a tooth root.","should not be placed at this site."],"k":"A","x":"Because of the necessity of opposing the forces of distraction, an antitension band is needed when a Champy miniplate is used to repair a fracture in the parasymphyseal area of the mandible. These plates should penetrate only the lateral cortex of the mandible. Intermaxillary fixation to establish normal dental occlusion should always be placed prior to any interosseus fixation.","d":"H&N / Plastics / Trauma","src":"Ballenger · Facial Fractures · Q2"},{"s":"Two hours after SCD plugging surgery the patient has severe head pain on the side of the surgery and difficultly naming some common items. What is the appropriate next step in management?","o":["CT scan of the head without intravenous contrast","Order a patient-controlled anesthesia machine so he or she does not have to ask the nurse for narcotics","Reassure the patient that the symptoms will improve with time","Hold high-dose steroids and reassess in 4 hours"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 42 · Q5"},{"s":"The transotic exposure adds which dimension of exposure of the internal auditory canal beyond what the translabyrinthine exposure offers?","o":["Anterior","Posterior","Inferior","Superior","Lateral"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 51 · Q1"},{"s":"Proven approaches to the management of facial nerve neuromas include","o":["Observation","Surgical resection and nerve repair","Decompression","Radiation therapy","a, b, and c"],"k":"E","x":"There are few reports of radiation treatment for facial nerve tumors and no assessments of long-term efficacy.","d":"Otology","src":"Brackmann · Chapter 30 · Q2"},{"s":"Following enucleation of a superficial pleomorphic adenoma, a patient develops a parotid fistula that discharges onto the cheek. Which is the least effective treatment?","o":["Repeat aspiration","Compression","Vidian neurectomy","Completion parotidectomy","Tympanic neurectomy"],"k":"C","x":"Vidian neurectomy is performed for the treatment of rhinitis. The vidian nerve carries parasympathetic innervation to the pterygopalatine ganglia and hence to the lacrimal gland and the mucous glands of the nose, nasopharynx, and palate.\nThe parotid receives parasympathetic innervation from the inferior salivary nucleus. The glossopharyngeal nerve conveys these fibres to the tympanic plexus (Jacobson’s nerve) and then the lesser petrosal nerve. The postganglionic parasympathetic fibres from the otic ganglion then pass to the parotid gland in the auriculotemporal nerve.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q10"},{"s":"A child’s trachea is narrowed from its normal diameter of 8 mm to 4mm. What effect is this likely to have on the airflow during quiet breathing?","o":["A 4-fold increase in resistance","A 8-fold increase in resistance","A 12-fold increase in resistance","A 16-fold increase in resistance","A 256-fold increase in resistance"],"k":"D","x":"This relates to Poiseuille’s law, which states that resistance to airflow is inversely proportional to the fourth power of the airway radius when laminar flow is present. Therefore, if the radius is halved, without altering the length or viscosity, then the resistance increases 16-fold.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q13"},{"s":"A 14-year-old boy presents to the hospital accompanied by his father with hypovolaemic shock and active bleeding following a secondary tonsillar haemorrhage. He has a haemoglobin level of 5.5 g/dL ona blood gas. You advise that the boy requires resuscitation including blood transfusion and return to theatre to arrest the haemorrhage. The boy informs you that he is a Jehovah’s Witness and he forbids you to perform a blood transfusion. What is the next most appropriate action?","o":["Call a senior colleague and ask them to come in to give a second opinion","Call the blood bank to find a cell saver device","Perform the blood transfusion as clinically indicated","Contact the hospital lawyer for advice","Perform all measures necessary except the transfusion"],"k":"C","x":"An adult Jehovah’s Witness can refuse a blood transfusion. However, a minor cannot refuse a transfusion if it is required for a life-saving procedure, even if deemed competent.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q12"},{"s":"Subcutaneous emphysema after a tracheostomy","o":["results from making the opening in the trachea too large.","results from closing a tracheostomy incision too tightly.","should always be treated with chest tube placement.","does not pose a significant risk to the patient.","always requires operative intervention to alleviate subsequent airway distress."],"k":"B","x":"Subcutaneous emphysema after a tracheostomy results from closing the tracheostomy incision too tightly. In this situation, air escaping from the trachea cannot passively egress out of the tracheostomy incision and may be forced into the fascial planes of the neck. Although this complication is usually self-limiting and does not require intervention, it can progress to pneumomediastinum and predispose the patient to mediastinitis if bacterial contamination occurs.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q5"},{"s":"With gentle pressure on a stapedotomy prosthesis after placement, patient dizziness should prompt the surgeon to consider that","o":["The prosthesis may be too long.","The otosclerotic inner ear syndrome may be operative and may require treatment with calcium fluoride.","A fistula exists in the round window.","Placing a vein seal would be helpful."],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 26 · Q2"},{"s":"Through-and-through fractures of the frontal sinuses are most effectively treated by","o":["endoscopic approaches.","cranialization.","Riedel ablation.","osteoplastic flap and fat obliteration.","observation and then delayed repair."],"k":"B","x":"Cranialization provides the best means of managing the through-and-through fracture of the frontal sinus. The craniotomy to repair the intracranial injury provides excellent exposure for resection of all of the posterior wall of the frontal sinus and every last remaining vestige of the frontal sinus mucosa. The enlargement of the anterior fossa cavity provides an opportunity for expansion of edematous brain without restriction. Returning the frontal sinus anterior wall fragments provides for future protection of the brain and restoration of the normal forehead contour.","d":"Rhinology","src":"Ballenger · Facial Fractures · Q8"},{"s":"A 46-year-old male presents with left-sided nasal obstruction and a single 5 cm left supraclavicular mass. Biopsy of the postnasal space tumour confirms a diagnosis of non-keratinizing nasopharyngeal carcinoma. According to the Union for International Cancer Control (UICC) TNM (8th edition) grading system, what is the CORRECT stage of neck disease?","o":["N1","N2","N2a","N2b","N3"],"k":"E","x":"Neck metastases from nasopharyngeal carcinoma are graded differently from other tumours, as:\nNX Regional lymph nodes cannot be assessed\nNO No regional lymph node metastasis\nN11 Unilateral metastasis in cervical lymph node(s), 6 cm or less in greatest dimension, above the supraclavicular fossa, and/or unilateral or bilateral retropharyngeal lymph nodes, 6 cm or less in greatest dimension*\nN2 Bilateral metastasis in cervical lymph node(s), 6 cm or less in greatest dimension, above the supraclavicular fossa*\nN3 Metastasis in lymph node)* >6 cm and/or to supraclavicular fossa* N3a Greater than 6 cm in dimension\nN3b Extension to the supraclavicular fossa** *\nNote: Midline nodes are considered ipsilateral nodes.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q35"},{"s":"Regarding local anaesthesia to the head and neck, which of the following statements is false?","o":["The infraorbital nerve can be found in the vertical plane of the pupil 1 cm below the infraorbital rim","The supraorbital nerve can be found in the vertical plane of the pupil at the inferior edge of the supraorbital ridge","The supratrochlear nerve is found at the medial end of the eyebrow","The internal nasal nerve is a terminal branch of the ethmoid nerve that supplies the nasal tip","The mental nerve emerges from the mental foramen 2 cm above the lower border of the mandible along the vertical plane of the pupil"],"k":"D","x":"The supratrochlear nerve is found at the medial end of the eyebrow, 1.5 cm from the midline. The external nasal nerve, a terminal branch of the ethmoid nerve, supplies the nasal tip.","d":"Rhinology","src":"SBA book · Rhinology · Q69"},{"s":"A 3-year-old child (10 kg) presents to the Accident and Emergency department with a post-tonsillectomy haemorrhage. The child is crying, has a heart rate of 140 beats per minute, and has a normal blood pressure (110/60 mmHg). Up to what volume of blood are they likely to have lost?","o":["50 mL","120 mL","175 mL","200 mL","235 mL"],"k":"B","x":"This child is in type I shock (up to 15% blood volume loss). The circulating volume of a child is approximately 80 mL/kg. Therefore the child has lost up to 120 mL of blood.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q8"},{"s":"Concerning cutaneous malignant melanoma, which of the following statements is true?","o":["Require punch biopsy taken from the centre of the lesion for confirmation of the diagnosis","The number of mitoses recorded from histopathology is of no prognostic value","Patients with stage II cutaneous melanoma require a whole-body (including brain) CT scan","Serum lactate dehydrogenase levels directly correlate with survival in stage IV melanoma","Cutaneous melanoma having a Breslow thickness of up to 1.0 mm requires a 3 cm excision margin"],"k":"D","x":"As a general rule, all pigmented lesions should be excised with a 2 mm margin and sent for histological analysis. The most important prognostic indictor is tumour depth; this cannot be assessed without the whole lesion being excised. Important prognostic indicators for cutaneous melanoma are depth of invasion (increasing depth means greater likelihood of distant metastases), ulceration, mitotic index, satellite lesions, lymph node involvement, and distant metastases. Stage\nI and II cutaneous melanoma do not require further investigations. Stage III disease requires\nCT, head, chest, abdomen, and pelvis and stage IV requires whole-body CT and serum lactate dehydrogenase. The use of PET-CT is also established in melanoma staging assessment as is sentinel lymph node biopsy. Margins are 1 cm for up to 1.0 mm Breslow thickness, 1.01—2 mm thickness requires a 1 to 2 cm excision margin (the added benefit of 2 cm excision over 1 cm has not been proven) but certainly at least a 1 cm excision margin is needed; 2.01 to 4 mm thickness requires\na 2-3 cm excision margin (again, there is no absolute proven benefit of 3 cm but at least 2 cm is preferential); and lesions greater than 4 mm Breslow thickness require a 3 cm margin.","d":"Rhinology","src":"SBA book · Rhinology · Q49"},{"s":"Concerning immunoglobulins, which of the following statements is false?","o":["IgG crosses the placenta","IgG forms the largest subclass of immunoglobulins","Immunoglobulins are composed of heavy and light chains","IgA is secreted into the saliva","The antibody binding site is found on the heavy chain"],"k":"E","x":"The antibody binding site is part of the light chain. IgG is the only immunoglobulin to cross the placenta and makes up the largest subclass of immunoglobulins. These are composed of heavy and light chains. IgA is present in the secretions of the respiratory tract, lacrimal glands, and salivary glands.","d":"General","src":"SBA book · General Otolaryngology · Q12"},{"s":"Concerning melanoma, which of the following statements is least likely to be true?","o":["Tumour thickness and ulceration are the most important histological markers of prognosis","Superficial spreading melanoma has an initial radial growth phase followed by a vertical growth phase","Nodular melanomas are less aggressive than other forms of melanoma","Xeroderma pigmentosa represents an inherited risk of developing melanoma","Fitzpatrick type I skin carries a higher risk of developing melanoma than type VI skin"],"k":"C","x":"Nodular melanomas demonstrate predominantly a vertical growth and therefore are considered aggressive.\nTumour thickness, as defined by the Breslow depth, is the most important histological determinant of prognosis. Ulceration is also important and its presence leads to upstaging of the disease.\nSuperficial spreading melanoma does have an initial radial growth phase followed by a vertical growth phase.\nXeroderma pigmentosa and dysplastic nevus syndrome represent congenital risk factors for developing skin cancers.\nFitzpatrick classified skin types such that type I never tans and always burns. This represents a higher risk than those skins that always tan and never burn.","d":"Rhinology","src":"SBA book · Rhinology · Q25"},{"s":"In regard to medial-oblique osteotomies, which is incorrect?","o":["They normally course 15 to 20 degrees from the midline.","Guarded osteotomes are not essential to create complete osteotomies.","They establish a weak point that is subsequently the site of fracture created by the low lateral osteotomies.","They create, by themselves, a mobile lateral bony sidewall.","They are best created with micro-osteotomes."],"k":"D","x":"Medial osteotomies alone do not result in a totally mobile lateral nasal sidewall.","d":"Rhinology","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q7"},{"s":"Which of the following is not a recognized side effect of carbimazole?","o":["Agranulocytosis","Jaundice","Alteration in sense of smell","Rash","Gastrointestinal symptoms"],"k":"B","x":"Relatively common side effects of carbimazole include allergic-type reactions of fever, rash, urticaria, and arthralgia. Agranulocytosis is a much-feared but rare complication of carbimazole and propylthiouracil. It occurs in 0.1-0.5% of patients and occurs suddenly. Routine monitoring of full blood count is therefore of little use.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q31"},{"s":"Vaccination against the human papillomavirus (HPV) has been introduced in to the UK to prevent cervical cancer. The vaccine Gardasil offers protection against which strains of HPV?","o":["11 and 16","6 and 16","6 and 11","16 and 18","6,11, 16, and 18"],"k":"E","x":"Gardasil HPV vaccine protects against HPV strains 6, 11, 16, and 18.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q10"},{"s":"To reduce the time to obtain interpretable evoked potentials","o":["Minimize electrical interference reaching recording electrodes","Optimize filtering of recorded potential to accentuate background noise","Decrease stimulus repetition rate and strength","Increase electrode impedance","Ignore methods for quality control that do not require record replication"],"k":"A","x":"Evoked potentials are most readily obtained in environments with minimal electrical interference,background noise, low electrode impedance, and optimal stimulus repetition rate and strength. Low electrode impedance and increased stimulation rate and strength improve the quality of electrical signal information to be interpreted.","d":"Otology","src":"Brackmann · Chapter 64 · Q4"},{"s":"Who would be the most likely to develop a juvenile nasopharyngeal angiofibroma?","o":["a 6-year-old boy","a newborn girl","a 12-year-old girl with basal cell nevus syndrome","a 14-year-old boy from Mexico","a 7-year-old girl"],"k":"D","x":"Prepubescent and pubescent males are at the highest risk for juvenile nasopharyngeal angiofibroma.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nasopharynx · Q8"},{"s":"Which of the following statements concerning the management of aural atresia is false?","o":["Generally, microtia surgery requires a cartilage graft that is obtained from the costochondral region.","An adequate graft requires sufficient growth and fusion at the donor site, which has usually occurred by 9 years of age.","In bilateral cases, many authorities recommend postponing surgery for the restoration of hearing until at least age 5 years so that pneumatization can develop.","In class I ears, the potential for achieving an excellent hearing result is great.","In class III ears, the chances of achieving good hearing are slim."],"k":"B","x":"Generally, microtia surgery requires a cartilage graft that is obtained from the costochondral region. An adequate graft requires sufficient growth and fusion at the donor site, which has usually occurred by 5 to 6 years of age. Additionally, in bilateral cases, many authorities recommend postponing surgery for the restoration of hearing until at least age 5 years so that pneumatization can develop. The success of the surgical correction of congenital conductive hearing losses is related to the abnormality since a wide range of malformations is possible. In class I ears, the potential for achieving an excellent hearing result is great. Conversely, in class III ears, the chances of achieving good hearing are slim.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q7"},{"s":"A 42-year-old male presents with nasal obstruction. A computed tomography (CT) scan of the paranasal sinuses is reported as showing opacification of the right maxillary sinus with ‘double density’ signals throughout the sinus. Which of the following is the least likely pathology?","o":["Allergic fungal sinusitis","Chondrosarcoma","Inverted papilloma","Antrochoanal polyp","Ossifying fibroma"],"k":"D","x":"Allergic fungal sinusitis is characterized by areas of increased attenuation on non-contrast CT. These hyperdense and heterogeneous densities in an opacified sinus are also referred to as the ‘double density’ sign and most likely represent higher levels of magnesium, manganese, and iron\nin fungal mucin. The double density sign is also seen in chondrosarcoma, inverted papilloma, and ossifying fibroma.","d":"Rhinology","src":"SBA book · Rhinology · Q1"},{"s":"All except one of the following are oral manifestations of human immunodeficiency virus (HIV) infections:","o":["angular cheilitis","hairy leukoplakia","diffuse parotitis","Kaposi’s sarcoma","Wickham’s striae"],"k":"E","x":"There are at least 40 oral manifestations of HIV infections. They include oral candidiasis, recurrent herpetic and aphthous ulcers, angular cheilitis, hairy leukoplakia, periodontitis, gingivitis, diffuse parotitis, and Kaposi’s sarcoma. In children, the most common signs are oral candidiasis, diffuse parotitis, and oral ulcers. Wickham’s striae are interlacing white lines found in lichen planus.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q3"},{"s":"A 45-year-old lady attends the clinic complaining of dry eyes and mouth. You suspect primary Sjégren syndrome. Which investigation would be most likely to confirm the diagnosis?","o":["Schirmer’s test","Cytoplasmic antineutrophil cytoplasmic antibody (cANCA) testing","ssRho antibody testing","Rheumatoid factor levels","Salivary gland biopsy"],"k":"E","x":"The diagnosis of Sjogren syndrome can be confirmed by demonstrating periductal fibrosis on biopsy of minor salivary glands. The other tests listed may help to support the diagnosis, but only the biopsy will confirm it.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q12"},{"s":"Which of the following occupations are not associated with noise-induced hearing loss?","o":["cab driver","farm worker","forestry worker","commercial driver","commercial fisherman"],"k":"A","x":"Of the list, cab driving is probably the only non-noise hazardous occupation. Farm workers are exposed to high levels of sound. Forestry workers, who use heavy diesel equipment and chain saws, are very much at risk for hearing loss. Many truck drivers are at risk, depending on whether they drive with the windows open and on the position of the engine and soundproofing of the cab. Commercial fishermen are close to the sound of the diesel motor of their vessels and, together with seamen working on commercial tugs, are at risk from noise because they may be exposed for 24 hours a day for several days at a time.","d":"Otology","src":"Ballenger · Occupational Hearing Loss · Q6"},{"s":"Changes involving the following reflect clinically important changes in hearing","o":["Increase peak V latency","Decreased peak V amplitude","Change in peak V without change in peak III","Change in interpeak latency","Loss of reproducible signal"],"k":"E","x":"Whereas all of these changes could indicate potential hearing compromise, the loss of reproducible signal is the strongest indication of a clinically important change in hearing.","d":"Otology","src":"Brackmann · Chapter 64 · Q5"},{"s":"Which study is the most definitive test for the diagnosis of sleep apnea?","o":["multiple sleep latency test","nocturnal oximetry","measurement of esophageal pressure during sleep","polysomnography","sleep sonography"],"k":"D","x":"Polysomnography in a sleep laboratory is the definitive diagnostic study for sleep apnea. It can diagnose the type of sleep apnea, its degree of severity, and any associated physiologic changes. The multiple sleep latency test measures daytime somnolence and not sleep apnea. Nocturnal oximetry measures oxygen levels during sleep. Measurement of esophageal pressures during sleep is an index of respiratory effort during sleep and is used to diagnose central sleep apnea. In children, sleep sonography provides objective data regarding the presence and degree of upper airway obstruction, but its ability to predict apnea is not established.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q10"},{"s":"A 60-year-old man presents to the ‘lump in the neck clinic’ with a 5 cm solitary lymph node in the upper right cervical region and an abnormal- looking right tonsil. Assuming this is a squamous cell carcinoma nodal metastasis, p16 positive. what is the ‘N’ classification, using the TNM system (8th edition)?","o":["N1","N2","N2a","N2b","N3"],"k":"A","x":"Lymph node metastases from tonsil tumours are classified using the Union for International Cancer Control (UICC) TNM classification (8th edition). There is a different classification depending on p16 status :\n¢ N1: single ipsilateral lymph node less than 6 cm in size ¢ N2: Contralateral or bilateral lymph node 6 cm or less in size ¢ N3: any node greater than 6 cm in size.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q5"},{"s":"The most common presentation of cerebrospinal fluid (CSF) leak in the temporal bone is","o":["Middle ear effusion","Otorrhea","Meningitis","Seizure","Mass in the ear canal"],"k":"A","x":"Middle ear effusion and hearing loss are the most common presentation of CSF leak and encephalocele in the temporal bone. Subsequent myringotomy may result in otorrhea. Meningitis, seizures, and mass in the ear canal are all uncommon presenting conditions.","d":"Otology","src":"Brackmann · Chapter 20 · Q3"},{"s":"All of the following are associated with Gorlin syndrome except which?","o":["Meningiomas","Skin basal cell carcinomas","Odontogenic keratocysts","Choanal atresia","Autosomal dominant inheritance"],"k":"D","x":"Gorlin syndrome (Gorlin—Goliz syndrome) is associated with:\n* multiple basal cell carcinomas\n* cutaneous abnormalities\n* skeletal anomalies\n* cranial calcifications\n* multiple odontogenic keratocysts.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q25"},{"s":"You are planning a translabyrinthine craniotomy for removal of an acoustic neuroma in a 59-year-old male in whom you had previously performed a tympanoplasty with mastoidectomy 10 years ago for chronic otitis media. His tympanic membrane appears healed, but your old operative report indicates that he had a small mastoid. For this patient you should","o":["Perform the case by taking down the bony canal wall, closing off the ear canal laterally, and converting to a transcochlear or transotic approach to improve exposure.","Perform the case as a routine translabyrinthine craniotomy, decompressing a large amount of middle fossa dura and dura posterior to the sigmoid sinus.","Stage the case because of risk of infection by first closing the ear canal skin and taking down the bony canal wall followed by a translabyrinthine craniotomy 6 months later if no evidence o
