<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}

<script>
const P={"title":"ENT Mock Exam — Paper 5","q":[{"s":"In hyperfractionated radiotherapy, which of the following statements is incorrect?","o":["Overall treatment time reduced, total dose remains the same","Overall treatment time unchanged, total dose received is increased","Dose per fraction is decreased","Significantly higher locoregional control and survival rates","No significantly higher late side effects"],"k":"A","x":"Several altered fractionation methods have been investigated with regard to head and neck cancer. In hyperfractionation, a large number of fractions, with a reduced dose, are delivered in a conventional treatment time to effect a greater overall dose.\nThis is in contrast to accelerated fractionation in which a larger dose is given per fraction, over a shorter time period. This is with the aim of reducing tumour repopulation between fractions.\nBaujat B, Bourhis J, Blanchard P et al. Hyperfractionated or accelerated radiotherapy for head and neck cancer. Cochrane Database of Systematic Reviews 2010;12:CD002026.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q53"},{"s":"Which of the following statements concerning microtia is correct?","o":["Bilateral microtia is more common than unilateral pathology","The auricle is formed from first branchial arch derivatives","The six hillocks of His form the auricle","The auricle is full-sized at birth","Surgery to repair the atretic ear canal is usually performed at the time of auricular reconstruction"],"k":"C","x":"The majority of cases of microtia are unilateral (90%). The auricle is formed from the six hillocks of His, three from each of the first and second branchial arches, and at birth the auricle is approximately 65% of adult size.\nSurgery to the atretic ear canal is controversial and in a unilateral microtia with contralateral normal hearing is not usually undertaken due to the poor results, as middle ear abnormalities are associated with microtia.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q15"},{"s":"Endoscopy for possible foreign-body aspiration is indicated in a child with","o":["a chest radiograph with persistent atelectasis unresponsive to medical treatment.","a chest radiograph with obstructive emphysema (hyperinflation) of one lung.","a history of acute onset of coughing, choking, and gagging but no current symptoms.","a new onset of unilateral wheezing but no witnessed events suggestive of aspiration.","all of the above."],"k":"E","x":"Children who have aspirated foreign bodies may present with any of the above combinations of findings on history, physical examination, or radiographs.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q9"},{"s":"The most critical factor in the successful treatment for fulminant invasive fungal sinusitis in a patient in diabetic ketoacidosis is","o":["timely administration of intravenous amphotericin B.","surgical débridement of involved nasal and sinus tissue.","magnetic resonance imaging of sinuses to evaluate the extent of the disease.","culture from the sinonasal tract to identify the species of fungus involved.","control of the underlying diabetes."],"k":"E","x":"Although all of the choices are valid elements of the treatment for fulminant invasive fungal sinusitis, the most critical issue is control of the underlying disease process. The disease process is uniformly fatal if the immunocompromised state cannot be reversed, even with maximal medical and surgical therapy.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q6"},{"s":"Which of the following is not a symptom or sign of airway obstruction?","o":["hoarseness","dyspnea","stridor","subcutaneous emphysema","intercostal retraction"],"k":"D","x":"Hoarseness, dyspnea, stridor, and intercostal retraction are symptoms or signs of airway obstruction. Subcutaneous emphysema is a sign of airway damage but is not specific for airway obstruction.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q1"},{"s":"Concerning tumours of the sinonasal region, which of the following statements is false?","o":["The most common malignant tumours of the maxillary sinus are epithelial cell in origin","Inverted papilloma is associated with a 10% risk of malignant transformation","The commonest sites of malignant tumours within the nose and paranasal sinuses are the lateral wall, ethmoids, and maxillary sinus","Mucosal melanoma of the nasal cavity which invades the mucosal epithelium only is staged at T3","Mucosal melanoma of the paranasal sinuses are not related to sun exposure"],"k":"B","x":"Sinonasal malignant tumours are rare tumours affecting approximately 1:100,000 individuals. The commoner tumours are cancers of epithelial cell origin such as squamous cell carcinoma, adenocarcinoma, olfactory neuroblastoma, adenoid cystic carcinoma, and undifferentiated carcinoma. Olfactory neuroblastomas are thought to arise from the specialized\nsensory neuroepithelial (neuroectodermal) olfactory cells that are normally found in the upper\npart of the nasal cavity, including the superior nasal concha, the upper part of the septum, the roof of the nose, and the cribriform plate of the ethmoid. Inverted papilloma is associated with a 2% malignant transformation rate but is also thought to be associated with synchronous SCC of the sinonasal cavity; this potentially increases this figure within the literature. Mucosal melanoma affords a worse prognosis than cutaneous melanoma and thus there is no stage I or II disease, the TNM classification begins at T3.","d":"Rhinology","src":"SBA book · Rhinology · Q47"},{"s":"A 73-year-old woman with a history of metastatic hypopharyngeal squamous cell carcinoma presents with lethargy, vomiting, hypotension, and tachycardia. A corrected serum calcium is found to be 3.14 mmol/ L (2.12-2.62). Which of the following electrocardiogram (ECG) abnormalities is most likely to be found?","o":["QRS interval shortening","QT interval prolongation","QT interval shortening","Peaked T waves","Poor R-wave progression"],"k":"C","x":"Hypercalcaemia can result in a variety of symptoms including fatigue, depression, confusion, anorexia, nausea, vomiting, constipation, pancreatitis, and calculi. This can be remembered using the mnemonic ‘bones, stones, moans, and psychic groans’. ECG abnormalities include a shortened QT interval.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q18"},{"s":"Which answer best describes the content of the cavernous sinus?","o":["Internal carotid artery, oculomotor, trochlear, abducent, and ophthalmic and maxillary divisions of the trigeminal nerve","Internal carotid artery, oculomotor, trochlear, abducent, and ophthalmic and mandibular divisions of the trigeminal nerve","Internal carotid artery, superior ophthalmic vein, optic, abducent, and ophthalmic and maxillary divisions of the trigeminal nerve","Common carotid artery, oculomotor, trochlear, abducent, and ophthalmic and maxillary divisions of the trigeminal nerve","Superior ophthalmic vein, oculomotor, trochlear, abducent, and ophthalmic and maxillary divisions of the trigeminal nerve"],"k":"A","x":"The content of the cavernous sinus is the internal carotid artery, oculomotor, trochlear, abducent and ophthalmic and maxillary divisions of the trigeminal nerve.","d":"Rhinology","src":"SBA book · General Otolaryngology · Q29"},{"s":"Concerning reconstructive flaps, which of the following statements is incorrectly matched?","o":["Latissimus dorsi flap is based on the thoracodorsal artery","Pectoralis major flap is based on the thoracoacromial artery","Sternocleidomastoid flap is based on the ascending pharyngeal artery","Deltopectoral flap is based on the perforating branches of the internal thoracic artery","Midline forehead flap is based on the supratrochlear artery"],"k":"C","x":"The sternocleidomastoid flap is a random pattern flap and receives a segmental blood supply from the transverse cervical artery, the superior thyroid artery, and the occipital artery.","d":"Rhinology","src":"SBA book · Rhinology · Q37"},{"s":"Which of the following recommendations is true regarding prophylactic surgery for RET gene mutation carriers?","o":["Postoperative treatment with radioiodine ablation may be considered","Preoperative calcitonin has no role in decision-making","Children with multiple endocrine neoplasia (MEN) 2A should undergo prophylactic thyroidectomy within the first year of life","Once surgery has been carried out, treatment with thyroxine at a level to suppress thyroid-stimulating hormone is recommended","In an asymptomatic postoperative patient with a serum calcium of 1.9 mM, oral calcium supplementation is sufficient"],"k":"E","x":"Basal calcitonin levels indicate progression to medullary thyroid carcinoma and/or the presence of lymph node metastasis. This can guide the decision to offer a prophylactic neck dissection. Radio-iodine ablation is not used in medullary carcinoma.\nChildren with MEN 3 (2B) should undergo prophylactic thyroidectomy, certainly within the first year of life but ideally within the first 6 months. In MEN 2A, this can be delayed, depending on the mutation and calcitonin levels to within the first 5 years, or even beyond.\nPostoperative thyroxine management should be to keep the thyroid-stimulating hormone concentration at a normal level.\nIf the patient is symptomatic of hypocalcaemia, or in severe hypocalcaemia (<1.9 mM), intravenous calcium gluconate follow by an infusion is recommended.\nPerros P Boelaert K, Colley S, et al. Guidelines for the management of thyroid cancer, Clinical Endocrinology, 2014;81 Suppl 1:1-122.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q59"},{"s":"Congenital laryngeal webs: which of the following statements is false?","o":["Congenital laryngeal webs are associated with chromosome 22q11.2 microdeletion syndrome in 50% of cases","Cardiac abnormalities are seen in 50% of patients with chromosome 22q11.2 syndrome","In the prenatal period, laryngeal atresia may be seen on an ultrasound scan as features of CHAOS (congenital high airway obstructive syndrome)","Congenital laryngeal webs result from degrees of failure of the epithelium’s resorption during the 17th and 20th weeks of intrauterine development","A congenital web may present with stridor"],"k":"D","x":"Congenital laryngeal webs result from degrees of failure of the epithelium’s resorption during the 8th to 10th weeks of intrauterine development. Cohen classified these as types as I-IV depending on the degree of glottic narrowing (type I, 0O-35%; type 2, 35-55%; type 3, 55-75%; type 4, >75%).","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q48"},{"s":"The frontalis portion of the facial nerve is best protected in the lateral subtemporal skull base approach by dissecting","o":["Deep to the deep temporal fascia off the zygomatic arch","Superficial to the deep temporal fascia off the zygomatic arch","Superficial to the fat pad over the temporal muscle","Along each branch of the frontalis portion of the facial nerve","Along at least two branches of the frontalis portion of the facial nerve"],"k":"A","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 54 · Q2"},{"s":"A 65-year-old man presents with a basal cell carcinoma of the lower lip. You decide to resect the lesion and reconstruct using an Abbe flap. Which of the following statements regarding the flap is incorrect?","o":["The Abbe flap is generally used when the lip defect involves one-third to two-thirds of the lip","The Abbe flap is generally not used when the defect involves the commissure","The Abbe flap can be based on the superior or inferior labial artery","The labial artery is a branch of the facial artery and lies deep to the orbicularis oculi muscle","The Abbe flap is a single-stage procedure"],"k":"E","x":"The Abbe flap can be used for defects of the upper or lower lip involving between one- third and two-thirds of the lip. The flap is a two-stage procedure based on the labial artery with division of the pedicle at 2-3 weeks.","d":"Rhinology","src":"SBA book · Rhinology · Q39"},{"s":"In primary ciliary dyskinesia (PCD),","o":["all of the cilia have an abnormal ultrastructure.","the mucociliary clearance time is lengthened.","nitric oxide levels in the nose are less than in the chest.","ciliary beat frequencies are around 10 Hz.","patients are always infertile."],"k":"B","x":"Tests of mucociliary clearance are either lengthened or impossible to measure. The normal range for a saccharin test would be 20 to 30 minutes. Nitric oxide levels in the nose are usually higher than those in the chest as most of the gas is produced in the paranasal sinuses. Levels are significantly lower in both areas in PCD, usually in single-figure parts per million from the chest and double figures from the nose and sinuses. Ciliary beat frequency from the inferior turbinates is reduced below the normal range of 12 to 15 Hz or beats per second, uncoordinated or absent. Both the cilial ultrastructure and cilial arrangement one to another can be abnormal in PCD, but this does not necessarily affect all of the cilia, and as a consequence, although patients may be sub- or infertile, some have managed to conceive naturally. Thus, advice on contraception may be required.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q4"},{"s":"The optic canal is formed by which bones?","o":["Frontal bone","Greater wing of the sphenoid","Lesser wing of the sphenoid","Temporal bone","Ethmoid bone"],"k":"C","x":"The optic canal is formed by the lesser wing of the sphenoid.","d":"Rhinology","src":"SBA book · General Otolaryngology · Q23"},{"s":"The most common site for temporal bone treatment failure is","o":["Local","Locoregional","Regional","Distant site"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 4 · Q5"},{"s":"A mother attends the clinic with her 3-year-old son. She tells you that he has had three episodes of green rhinorrhoea in the last 18 months. Each of these has lasted 2 weeks, between times the child has been well and is healthy on examination. She is concerned about his immune status. What is the most appropriate course of action?","o":["Arrange immunoglobulin testing","Schedule the child for examination of the nose under anaesthetic and perform bilateral antral washouts (BAWO)","Prescribe a 2-month course of prophylactic low-dose antibiotics","Reassure the mother and discharge the child","Reassure the mother and review the child in 4 months"],"k":"D","x":"It is not unusual for a healthy child to have at least three upper respiratory tract infections per year. No specific investigations are required and the mother should be reassured.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q32"},{"s":"Anatomical features of the round window that increase the likelihood of PLF are","o":["Deep round window niche","Large overhanging promontory","The inability to visualize round window transtympanically","A 45-degree angle of the round window membrane to the promontory"],"k":"D","x":"Tears of the round window membrane occur most frequently when its position is 45 degrees to the promontory and there is little or no overhanging promontory, allowing direct visualization of the round window membrane transtympanically.","d":"Otology","src":"Brackmann · Chapter 27 · Q4"},{"s":"Concerning paediatric tracheostomy, which of the following statements is false?","o":["Non-dissolvable stay sutures may be inserted until the first tracheostomy tube change","Maturation sutures involve the placement of sutures between the stomal skin and the anterior tracheal wall","A vertical tracheotomy is commonly performed","Surgical tracheostomy should be followed by a postoperative chest X-ray","Removing a plug of subcutaneous fat is usually not required in neonates"],"k":"E","x":"Performing paediatric tracheostomy requires careful positioning of the patient. This is often best achieved with a head ring and shoulder bag/bolster and strapping of the neck to tighten the skin and subcutaneous tissue over the trachea. Removing a large plug of subcutaneous fat allows a much better view of the strap muscles and trachea. Maturation sutures raise the anterior tracheal wall to the skin to create a stable stoma which is easy to cannulate in the event of an accidental decannulation.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q43"},{"s":"Ina70 kg male being prepared for a lymph node biopsy under local anaesthetic, what is the maximum volume of 2% lidocaine without adrenaline that can be injected?","o":["5 ml","10 ml","15 ml","20 ml","25 ml"],"k":"C","x":"The maximum dose of lidocaine without adrenaline is 3-5 mg/kg up to 200 mg. The\nmaximum dose for a 70 kg male is theoretically 350 mg. A solution of 2% lidocaine contains 20 mg/ml.","d":"Rhinology","src":"SBA book · Rhinology · Q6"},{"s":"Concerning choanal atresia, which of the following statements is true?","o":["It may be associated with genital defects","Is always apparent at birth","Is usually not apparent until teenage years","Is usually bilateral","Is more common in males"],"k":"A","x":"Choanal atresia may be seen as part of the CHARGE (Colomba, Heart defects, Atresia choanae, Retarded growth, Genital defects, Ear anomalies) syndrome, or with Treacher Collins syndrome. Unilateral atresia which is most common may not present until later in childhood. It is more common in females.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q21"},{"s":"On a radiographic study using barium contrast in a child with stridor, a large posterior esophageal indentation adjacent to an anterior tracheal compression suggests","o":["an aberrant right subclavian artery with a left aortic arch.","an aberrant left subclavian artery with a right aortic arch.","a “pulmonary sling,” comprising an anomalous left pulmonary artery arising from the right pulmonary artery.","a right hyparterial bronchus.","a vascular ring, such as a double aortic arch."],"k":"E","x":"A vascular ring will encircle the trachea and esophagus, causing the indentations described in this radiographic study. Both an aberrant right subclavian artery with a left aortic arch and an aberrant left subclavian artery with a right aortic arch will be evident as a small retroesophageal indentation with a normal trachea. A “pulmonary sling” is the only vascular anomaly that passes between the trachea and esophagus, causing an anterior esophageal indentation with a posterior tracheal indentation.An anomalous innomate artery will cause anterior tracheal compression.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q4"},{"s":"The radiographic evaluation of laryngeal injury plays an important role in the evaluation and management of laryngeal fracture. Which statement about the radiographic evaluation of laryngeal injury is most appropriate?","o":["Emergency barium swallow is indicated for patients complaining of dysphagia and odynophagia to rule out a tracheoesophageal fistula.","A computed tomographic (CT) scan should be obtained in all patients with suspected laryngeal trauma.","A lateral soft tissue film and chest radiograph at the bedside should be obtained to evaluate for pneumothorax and viscus penetration.","Magnetic resonance imaging scan of the larynx should be done to rule out a hematoma.","A CT scan is obtained when the airway has been stabilized with a tracheostomy."],"k":"B","x":"A CT scan is the most valuable test in the diagnosis of a laryngeal fracture. Some patients with minimal trauma may have laryngeal fracture despite minimal findings on initial evaluation. A CT scan may be obtained when the airway is stabilized, but it should be considered in all patients suspected to have laryngeal trauma. The other radiologic studies are, in general, not appropriate, at least for the purpose stated.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q2"},{"s":"Which of the following best describes the American Society of Anesthesiologists (ASA) grade of a 72-year-old patient undergoing a mastoid exploration? He has poorly controlled diabetes with hypertension and a body mass index (BMI) of 43.","o":["ASA I","ASA II","ASA III","ASA IV","ASA V"],"k":"C","x":"Table 1.1 American Society of Anesthesiologists (ASA) grade\nASA I A normal, healthy patient: healthy, non-smoking, no or minimal alcohol use\nASA II A patient with mild systemic disease: mild diseases only without substantive functional limitations. Examples include (but are not limited to) current smoker, social alcohol drinker, pregnancy, obesity (30< BMI <40), well-controlled DM/HTN, mild lung disease\nASA III A patient with severe systemic disease: substantive functional limitations; one or more moderate to severe diseases. Examples include (but are not limited to) poorly controlled DM or HTN, COPD, morbid obesity (BMI 240), active hepatitis, alcohol dependence or abuse, implanted\npacemaker, ESRD undergoing regularly scheduled dialysis, premature infant PCA <60 weeks, history (>3 months) of MI, CVA, TIA, or CAD/stents\nASA IV A patient with severe systemic disease that is a constant threat to life: examples include (but are not limited to) recent (<3 months) MI, CVA, TIA, or CAD/stents, ongoing cardiac ischaemia or severe valve dysfunction, sepsis, DIC\nASA V A moribund patient who is not expected to survive without the operation: examples include (but are not limited to) ruptured abdominal/thoracic aneurysm, massive trauma, intracranial bleed with mass effect\nASA VI A declared brain-dead patient whose organs are being removed for donor purposes\nBMI, body mass index; CAD, coronary artery disease; COPD, chronic obstructive pulmonary disease; CVA, cerebral vascular accident; DIC, disseminated intravascular coagulation; DM, diabetes mellitus, ESRD, end-stage renal disease; HTN, hypertension; MI, myocardial infarction; PCA, postconceptual age; TIA, transient ischaemic attack.\nData from http://wwwasahq.org.\n58. A,C,E\nThe 1996 Bouthillier classification describes the internal carotid artery according to the seven segments visible on angiography rather than its embryology.","d":"General","src":"SBA book · General Otolaryngology · Q57"},{"s":"When is electrodiagnostic testing of the facial nerve indicated in the setting of Bell’s palsy?","o":["Immediately after the onset of complete paralysis","Two weeks after the onset of complete paralysis","Worsening paralysis after appropriate medical therapy","Seventy-two hours after the onset of complete facial paralysis","Immediately once eye closure becomes incomplete"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 28 · Q3"},{"s":"In 50% of cases, the Pierre Robin sequence (PRS) includes the triad of glossoptosis, micrognathia, and","o":["microcephaly.","hemifacial microsomia.","cleft palate.","congenital facial paralysis.","dextrocardia."],"k":"C","x":"The PRS includes glossoptosis, micrognathia, and cleft palate in 50% of cases. Associated findings have included cardiac defects but not specifically dextrocardia. Möbius’syndrome or nonprogressive congenital facial diplegia is a subset of the PRS. Therefore, response D is a possibility, and although facial dysmorphism has been reported in PRS, specific hemifacial microsomia as an element of the PRS has not been reported. Therefore, response B is unlikely. Microcephaly is not observed in PRS, although mental retardation is.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q8"},{"s":"A 46-year-old man presents to the Accident and Emergency department following a head injury with a clear discharge from his right ear. Which of the following statements concerning beta-2 transferrin and cerebrospinal fluid (CSF) leaks is false?","o":["Beta-2 transferrin is unique to the CSF","The test requires only a small volume","Beta-2 transferrin can be detected even in the presence of contamination with blood","Beta-2 transferrin has a high sensitivity and specificity in diagnosing CSF leak","The test involves an electrochemical diffusion gradient"],"k":"A","x":"Beta-2 transferrin is not unique to the CSF and is found in perilymph and vitreous humour. The test involves an electrochemical diffusion gradient and requires only a small volume and is\nnot affected by blood contamination. A positive finding of beta-2 transferrin is highly sensitive and specific for a CSF leak.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q15"},{"s":"Which of the following statements is true with respect to juvenile nasal angiofibroma?","o":["It is centred on the sphenopalatine foramen","It rarely recurs after excision","It occurs predominantly in adolescent females","It usually presents with a mass in the neck","It has an association with HLA B17"],"k":"A","x":"Juvenile nasal angiofibroma (JNAs) typically arise in the sphenopalatine foramen, which they expand. They occur almost entirely in adolescent males and may recur after resection. Nasopharyngeal carcinoma, when seen with HLA B17, is associated with short-term survival.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q11"},{"s":"When using the palisade technique for cartilage tympanoplasty, the following statements are considered true, except for","o":["Cartilage can be harvested from the tragus or cymba.","The cartilage is cut into rectangular strips.","The technique is favored when ossiculoplasty is performed in a malleus-present situation.","The technique does not require one large piece of cartilage.","The technique is particularly suited for cholesteatoma surgery."],"k":"B","x":"The cartilage is cut into rectangular strips. One major difference between the palisade technique described here and that described by Heermann,et al,is that,instead of placing rectangular strips of cartilage side to side, an attempt is made to cut one major piece of cartilage in a semilunar fashion. A second semilunar piece is placed between this first piece and the canal wall to reconstruct the scutum precisely, and any spaces that result between this cartilage and the canal wall or scutum are filled in with small slivers of cartilage.The remaining statements are all true with regard to the palisade technique.","d":"Otology","src":"Brackmann · Chapter 10 · Q4"},{"s":"What is the most appropriate method of calculating the circulating blood volume of a 2-year-old child?","o":["5% of body weight","20% of body weight","20 mL/kg","40 mL/kg","80 mL/kg"],"k":"E","x":"The circulating volume of a child is 8-9% of body weight, or 80 mL/kg. The hourly fluid maintenance for a child is:\n* 4mL/kg for the first 10 kg\n* then add 2 mL/kg for the next 10 kg\n* then add 1 mL/kg for any weight after 20 kg. Example: a 25 kg child requires:\n* 4mL x 10kg = 40\n¢ Plus 2 mL x 10 kg = 20\n¢ Plus1mLx5kg=5\n¢ Total: 40 + 20 + 5 = 65 mL/hour\nA child in shock should receive a fluid challenge of 20 mL/kg of crystalloid. A further two fluid challenge boluses of 20 mL/kg may be given if the child does not respond.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q31"},{"s":"Best results are obtained in open reduction and internal fixation of laryngeal fractures if","o":["the procedure is performed 7 to 10 days after the injury to allow the edema to subside.","a stent is used to buttress the fixation.","all mucosal lacerations are closed.","any unstable cartilage is removed.","wires are used to fixate the reduced fracture sites instead of miniplates."],"k":"C","x":"Closure of all mucosal lacerations is a major tenet of managing laryngeal fractures. Fractures should be reduced within 72 hours of injury.All viable cartilage is preserved. Stents are used only in unstable fractures or if mucosal grafts are used. Either wires or miniplates can be used to fixate fractures.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q8"},{"s":"The immotile cilia syndrome in its most recognized form is associated with all of the following except","o":["axonemal dynein defects.","bronchiectasis.","chronic sinusitis.","situs solitus.","sterility."],"k":"D","x":"Kartagener’s syndrome is a quartet of bronchiectasis, chronic sinusitis, situs inversus, and sterility. It is associated with ultrastructural defects in dynein complexes. Therefore, the best response is situs solitus, normal visceral arrangement, as opposed to situs inversus.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q9"},{"s":"Which of the following flaps relies on the principle of delayed division of the pedicle?","o":["Dufourmentel flap","Abbe flap","Karapandzic flap","Gillies fan flap","Radial forearm flap"],"k":"B","x":"The Abbe lip switch flap is usually used to transfer tissue from the lower to the upper lip. A wedge excision of the upper lip tumour is performed. A wedge of the lower lip is taken, but not completely excised, as the inferior labial artery blood supply is preserved. The lower lip flap\nis then rotated into the upper lip defect. Three weeks later, the pedicle is divided and the suturing completed.\nA dufourmentel flap is similar to a rhomboid flap. A Karapandzic flap is a bilateral advancement flap extending onto the cheek for lip tumours. Gillies fan flap is a large rotation flap used for lip tumours.\nA radial forearm flap is a free-tissue transfer involving a microvascular anastomosis.","d":"Rhinology","src":"SBA book · Rhinology · Q36"},{"s":"Which of the following findings would favor surgical exploration rather than observation in a patient with traumatic facial nerve paralysis?","o":["Immediate onset of complete facial nerve paralysis after penetrating injury","Delayed onset of facial nerve paralysis with greater than 95% degeneration on electroneuronography (ENoG)","Bony fragment impingement of the facial nerve on CT scan","None of the above","All of the above"],"k":"E","x":"All of the findings would favor surgical exploration. In a and c, the chance of a complete transection of the facial nerve is high. Progressive deterioration of facial nerve function with a greater than 95% degeneration on ENoG are also associated with poor outcomes.","d":"Otology","src":"Brackmann · Chapter 29 · Q3"},{"s":"Headaches may occur from chronic use of (1) NSAIDs (2) ergot derivatives (3) narcotics (4) barbiturates","o":["1 and 3","2 and 4","1, 2, and 3","all of the above","none of the above"],"k":"D","x":"Chronic use of medication can cause headaches. Offending agents include NSAIDs, barbiturates, codeine, hydrocodone, oxycodone, propoxyphene, ergotamine, and dihydroergotamine. Therefore, all of the possibilities are correct.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q9"},{"s":"Following excision of a 4 mm diameter basal cell carcinoma from the tip of the nose with a 3 mm margin, which of the following statements describes the least appropriate method of repair?","o":["The use of a full-thickness skin graft, ‘Wolfe graft’, using postauricular skin","The use of a nasolabial advancement flap based on the facial artery","Primary closure","The use of a paramedian rotational forehead flap based on the supratrochlear artery","The use of a bilobed rotation flap"],"k":"C","x":"The defect described would have a diameter of 10 mm. Due to the limited quantity and mobility of the skin on the tip of the nose, primary closure is not appropriate. The other methods would be suitable.","d":"Rhinology","src":"SBA book · Rhinology · Q38"},{"s":"The major advantage of the ELITE procedure for resection of large glomus jugulare tumors is","o":["Easier reconstruction of the skull base","Better results in hearing preservation","Improved exposure of intradural tumor","Exposure of the tympanic portion of the facial nerve"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 59 · Q1"},{"s":"Parathyroid hormone has all of the following effects except:","o":["Increases osteoclastic activity","Increases absorption of calcium from the gastrointestinal tract","Increases renal excretion of phosphate","Increases renal absorption of calcium","Reduces 1,25-hydroxyvitamin D3"],"k":"E","x":"Parathyroid hormone (PTH) acts to increase the circulating levels of calcium. This is achieved by increasing osteoclastic activity, stimulating the kidney to reabsorb calcium and excrete phosphate. It also acts to convert 25-hydroxyvitamin D3 to the active form 1,25-di-hydroxyvitamin D3 which stimulates the absorption of calcium from the gastrointestinal tract.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q24"},{"s":"Concerning congenital midline nasal lesions, which of the following statements is true?","o":["A positive Furstenberg test is associated with an encephalocoele","Gliomas enlarge with crying","Encephalocoeles are rarely associated with other developmental anomalies","Biopsy should be performed in theatre","Nasal development occurs at the end of the third trimester"],"k":"A","x":"The crux of the midline nasal lesion lies in understanding embryology.\nThe critical period for nasal development is the first 12 weeks of fetal development. Failure\nof this process causes one of the three congenital midline nasal lesions—dermoid, glioma, or encephalocoele. The maxillary processes fuse with the frontonasal processes and the mandibular processes. Failure of this fusion results in a midline defect. There are three key spaces to understand in the embryological development:\n¢ The fonticulus frontalis, the space between the nasal bones and the frontal bones.\n* The foramen caecum, located in the anterior cranial fossa, anterior to the cribriform plate of ethmoid bone and posterior to the frontal bone, within the frontoethmoidal suture. * The prenasal space lies between the nasal bones and the nasal capsule (the precursor to the nasal septum and cartilages). Nasal dermoids are the most common midline nasal lesion, comprising ectodermal and mesodermal components. They can present as a pit, fistula, or an infected nasal mass anywhere from the glabella to the columella. Hair at the opening is pathognomonic. A central nervous system (CNS) connection is very variable—the literature records 5—50%. Nasal dermoids are associated with other congenital abnormalities but not with syndromes. Complications include infection leading to abscess formation and potential CNS infection. Gliomas are glial tumours found either at the glabella, nasomaxillary suture line, or within the nasal cavity. They can be extranasal or intranasal, with an overall 15% CNS connection. Encephalocoeles are extracranial herniations of meninges meningoencephalocoeles) and/or brain. These are contiguous with the subarachnoid space. These esions give a positive Furstenberg test. Encephalocoeles are associated in approximately 40% of cases with other developmental anomalies including microcephaly, hydrocephalus, and agenesis of the corpus callosum. None of the these lesions should be biopsied. Investigations of choice are CT for the delineation of bone and MRI for dural connection and soft tissue analysis.","d":"Rhinology","src":"SBA book · Rhinology · Q52"},{"s":"Which of the following is true regarding early carcinoma of the glottis?","o":["Radiation therapy tends to be favored over surgery owing to a higher cure rate.","Carcinoma in situ without an invasive component is rare.","Understaging of these tumors occurs in 75% of cases.","Fixation of the vocal fold has little impact on prognosis.","T3 tumors without impaired vocal fold mobility are considered “early carcinoma.”"],"k":"B","x":"Carcinoma in situ without an invasive component is relatively rare. Early glottic carcinomas are understaged 40% of the time. Impairment of vocal cord mobility (T2b) leads to a 20% decrease in survival over similar tumors with normal vocal cord function (T2a). In most institutions, radiation therapy is favored over surgical treatment of glottic carcinoma because it has been thought to allow superior vocal function. All T3 and T4 tumors are categorized as advanced carcinoma.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Larynx and Laryngopharynx · Q6"},{"s":"The nose is subdivided into how many aesthetic subunits?","o":["Five","Seven","Eight","Nine","Eleven"],"k":"D","x":"The nose has been divided into aesthetic subunits. There are paired lateral nasal wall units, paired alar units, paired soft tissue triangles and single dorsum, tip, and columella subunits.\nBurget GC, Menick FJ. Subunit principle in nasal reconstruction. Plastic and Reconstructive Surgery 1985;76:239-247,","d":"Rhinology","src":"SBA book · Rhinology · Q27"},{"s":"In the infralabyrinthine approach to the petrous apex, the structure at greatest risk is","o":["The carotid artery","The jugular bulb","The facial nerve","The posterior semicircular canal","The endolymphatic sac"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 45 · Q4"},{"s":"Which of the following does not cause chemosensory loss?","o":["depression","rhinosinusitis","acoustic neuromas","schizophrenia","all of these cause chemosensory loss"],"k":"A","x":"Although there are some discrepant studies, most studies suggest that depression, per se, is not the cause of chemo-sensory loss, although some forms of chemosensory dysfunction (eg, dysgeusia) are associated with depression. Recent studies suggest that smell testing is useful in distinguishing between probable Alzheimer’s disease and depression, a distinction that can sometimes be difficult to make on other grounds.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q6"},{"s":"Cutting rather than avulsing the vestibular nerve is preferred because of possible","o":["Injury of the cochlear nerve","Cerebrospinal fluid leak","Increased dural injury","Increased facial nerve injury","Less effective vertigo control"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 35 · Q4"},{"s":"The following diagram represents a rhomboid rotational flap. Which of the following statements is correct?","o":["When closing a rhomboid flap, point d is transposed to point a","Angle * is 80 degrees","Angle + is 150 degrees","Up to four separate flaps could be raised","The distance from point c to point f should be as small as possible when using this flap on the face."],"k":"D","x":"Up to four flaps can be designed. Angle * is 60 degrees and angle + 120 degrees. Point d closes to point b. This is a random pattern flap so therefore it is important to consider the distance c to f as the flap receives its blood supply from this pedicle.","d":"Rhinology","src":"SBA book · Rhinology · Q33","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAGDAngBAREA/8QAGwABAAMBAQEBAAAAAAAAAAAAAAUGBwQCAwH/xABEEAABAwMBAwYMBQQABQUBAAAAAQIDBAUGEQchMRITQVFV0RQVFyIyVGFxgZKTlCNCkbHwFlKhwSYzNkN0JDVicnXx/9oACAEBAAA/ANxAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOSiuVDXvnZRVcM76d/ImbG9HLG7qXqU6wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAZbs7ulBaa7Lqi5VcNND4y05crtE4KaDaL7ar3G6S018FW1vFYn66EiAAAAAAAAAAAAAAAAAARV3ySy2VzW3W501K53BJH6KdNsulDdqfwi21UVTDrpy43apqdgAAAAAAAAAAAAAAAAAAMh2eYzabxk+T110pW1b4K9WxRzedG3XXVeTwVeHE+udWmlwzJseyKwRMo/Ca5lHVQRJoyVr9d/JTduRF+OhrDV5TUVOlNT9AAAAAAAAAAAAAAAAAOO81vi61VdbyVdzETn6J06IZ1ssxagvNk/qbIqeO43O5yPke+oTloxvKVEa1F3Im74cC/2axWuxtmbaaOOlbO/lyNj10V2mmunRw6CSAAAAAAAAAAAAAAAAAABkVhu9bhF9yBt0x67zxVtWs0MtFAkqKnt37jq8GvW0PJrbV11sntdgtkyVDGVOiSTyJ6Pm9Gn7amppu4AAAAAAAAAAAAAAAAAA+NXTsq6WWnlTVkrFa5PYplWOXK+7N4ZLFdrHXXK2RSOWjrKBnOOViqq6K3o4/wA4l8xTIajIY6iaWz1duhYqJH4WiNfJ1+b0E+AAAAAAAAAAAAAAAAAAADPspy2+SZZHjmHQU89XHEstU+b0Y+pNT489tV9Vs/zp3jntqvqtn+dO8c9tV9Vs/wA6d457ar6rZ/nTvHPbVfVbP86d457ar6rZ/nTvHPbVfVbP86d457ar6rZ/nTvHPbVfVbP86d457ar6rZ/nTvHPbVfVbP8AOneOe2q+q2f507xz21X1Wz/OneOe2q+q2f507xz21X1Wz/OneOe2q+q2f507xz21X1Wz/OneOe2q+q2f507xz21X1Wz/ADp3jntqvqtn+dO8c9tV9Vs/zp3jntqvqtn+dO8c9tV9Vs/zp3jntqvqtn+dO8c9tV9Vs/zp3jntqvqtn+dO8c9t
