h of the lateral plantar nerve.","d":"Rhinology","src":"SBA book · Rhinology · Q31"},{"s":"You have just started a neck dissection on a 55-year-old man with a performance status of 0, co-morbidity score of 1, when the anaesthetist tells you he is worried that the patient is severely hypotensive and tachycardic. What is the next best course of action?","o":["Descrub and call the adult crash team","Ask the anaesthetist to administer 0.5 mL of 1 in 10,000 adrenaline via an intramuscular route","Ask the anaesthetist to administer a bolus of fluid","Stop operating, and be prepared to abandon the procedure","Ask for an arterial blood gas test to check whether there has been unexpected blood loss"],"k":"D","x":"During this scenario, the patient has become seriously unwell shortly after induction of anaesthesia. Given the physiological abnormalities, the likely diagnosis is anaphylactic shock. The correct action is to stop operating, and prepare to assist, or abandon the procedure. Exposure of the patient may reveal an urticarial rash. The correct dose of adrenaline for anaphylaxis is 0.5 mL of 1 in 1000 adrenaline intramuscularly.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q45"},{"s":"In normal wound healing, when would you expect the number of fibroblasts to peak?","o":["Within 6 hours","Within 24 hours","Within 3 days","Between 3 and 5 days","Between 6 and 7 days"],"k":"E","x":"During the proliferative phase of wound healing, fibroblasts are attracted by chemotactic factors and begin to arrive on day 3, and peak by day 7.","d":"Rhinology","src":"SBA book · Rhinology · Q32"},{"s":"Which of the following statements best describes otoacoustic emissions (OAEs)?","o":["OAEs represent sound generated by the outer hair cells","OAEs are usually present in children with glue ear","A positive test is subjective based on the interpretation of the result","In neonatal screening, the demonstration of OAEs excludes severe sensorineural hearing loss","Evoked OAEs are generated by all normal cochleas"],"k":"A","x":"Otoacoustic emissions represent sound generated by the outer hair cells, typically in response to a sound stimulus. The emissions are frequently absent in conductive hearing loss and are usually absent in severe sensorineural hearing loss although they do not exclude an absent cochlear nerve. The testing is objective and is therefore used in the universal neonatal screening programme. Evoked otoacoustic emissions are generated in the majority (approximately 90%) of a normal population.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q9"},{"s":"Concerning facial aesthetic analysis, which of the following statements is false?","o":["The width of the eye is approximately one-fifth the width of the face","The nasolabial angle describes the nasal projection in relation to the upper lip","The nasolabial angle is more obtuse in Caucasian women than men","A tip projection ratio of 0.6 is ideal (tip projection ratio: radix—tip distance/tip to alar—cheek junction distance)","The hair line to alar base distance represents approximately two-thirds of the facial height"],"k":"B","x":"The nasolabial angle describes the angle between the lip and the caudal end of the nose. This angle describes the degree of nasal tip rotation. The width of the eye is approximately one- fifth of the facial width and is equal to the alar base width and intercanthal distance.\nThe nasolabial angle is 95-110 degrees in women and 90-95 degrees in men.\nTip projection can be calculated as the ratio of the radix—tip distance tip and the alar—cheek junction distance. In an aesthetically balanced face, this ratio is approximately 0.6.\nThe face is divided into thirds by horizontal lines drawn adjacent to the menton, alar base, brows, and hairline.","d":"Rhinology","src":"SBA book · Rhinology · Q24"},{"s":"An auditory brainstem implant is being inserted into a patient with neurofibromatosis type 2. Where is the target region for the implant?","o":["On the floor of the third ventricle","The cochlear nucleus","The olivary complex","The vestibular nuclei","The inferior colliculus"],"k":"B","x":"The cochlear nucleus lies in the brainstem and is responsible for processing sound signals carried from the ear through the vestibulocochlear nerve. Auditory brainstem implants are electrodes placed in the cochlear nucleus.\nNational Institute for Health and Care Excellence (NICE). Auditory Brain Stem Implants. Interventional procedures guidance [IPG 108]. London: NICE, 2005.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q3"},{"s":"Which fascial space is the most frequently involved with serious infections and is the most frequent route of spread of infection from one region to another?","o":["prevertebral","retropharyngeal","lateral pharyngeal","submandibular","visceral"],"k":"C","x":"The carotid sheath pierces the lateral pharyngeal space. The lateral pharyngeal space communicates with the submandibular, retropharyngeal, and parotid spaces and is in close proximity to the masticator and peritonsillar spaces. Its location makes it the space most frequently involved with serious infections, and it is the most frequent route of spread of infection from one region of the neck to another.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q4"},{"s":"The most effective tool for imaging parathyroid adenomas of mass exceeding 250 mg is","o":["subtraction thallium 201 scan.","ultrasonography.","technetium 99m pertechnetate scan.","technetium Tc 99m sestamibi scan.","tetrofosmin scan."],"k":"D","x":"All of these choices have been used. Ultrasonography has a sensitivity of 82.9%, subtraction thallium 201 scan has a sensitivity of 84.6%, and technetium 99m pertechnetate scan and tetrofosmin are even less sensitive. Sestamibi scan has sensitivity for solitary parathyroid adenomas of 85 to 90%, with a specificity of nearly 100%.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Thyroid and Parathyroid Glands · Q5"},{"s":"A 40-year-old woman complains of severe loss of the sense of smell following a minor traffic accident. She did not suffer any head injury. She is taking legal action against the other driver and has asked for a medical report. Which of the following investigations will be most useful in assessing the olfactory damage?","o":["computed tomography scan","magnetic resonance imaging of the brain and paranasal sinuses","rigid endoscopy after intrathecal fluorescein","University of Pennsylvania Smell Identification Test","evoked-response olfactometry"],"k":"D","x":"The University of Pennsylvania Smell Identification Test is well validated for sex and age. It will quantify the degree of the loss into normal, hyposmia, or anosmia and will help to exclude the possibility of malingering as a few correct responses will be given by guesswork alone. Thus, a score of zero would be very suspicious of exaggerating the loss. Evoked-response olfactometry can confirm the presence or absence of olfaction but will not quantify it and is difficult to do without trigeminal stimulation. Imaging can be useful to exclude inflammation, infection, or neoplasia but will not demonstrate olfactory damage secondary to trauma. The use of intrathecal fluorescein can be of use in identifying the site of a cerebrospinal fluid leak after a head injury, but this can occur independently of olfactory damage, with which it does not correlate.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q9"},{"s":"What are the advantages of the transcochlear approach?","o":["The added exposure of removing the external auditory canal (EAC) and the cochlea, which increases access medially and anteriorly to the facial nerve with the safety of not requiring transposition of this nerve","Hearing preservation and provision of an anterior plane of dissection on IAC in cases of acoustic neuroma","Excellent exposure of the midline, allowing complete removal of the tumor, its base of implantation, and its blood supply with no cerebellar or temporal lobe retraction","Extensive exposure inferiorly in the area of the jugular foramen and foramen magnum"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 52 · Q2"},{"s":"What is the most common soft tissue malignancy in childhood?","o":["Osteosarcoma","Rhabdomyosarcoma","Fibro-ossifying sarcoma","Haemangiopericytoma","Neurofibrosarcoma"],"k":"B","x":"Rhabdomyosarcoma is the most common soft tissue malignancy in childhood and occurs most commonly in the head and neck.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q14"},{"s":"Which one of the following techniques is not advocated by the authors?","o":["The head is secured with tape.","Preoperative antibiotics are usually administered.","The ear, auricle, and surrounding skin are cleansed with povidone-iodine solution.","The hair is secured with liquid spray adhesive and usually is not shaved.","The head is extended with the chin up."],"k":"B","x":"Studies have shown that no significant benefits result from the use of preoperative antibiotics.","d":"Otology","src":"Brackmann · Chapter 11 · Q3"},{"s":"The most versatile of the local flaps available for nasal epithelial repair are","o":["cheek advancement flaps.","rotation flaps.","interposition flaps.","island flaps.","transposition flaps."],"k":"E","x":"The local transposition flaps (bilobed, rhomboid, and Z-plasty) provide the best options for complex nasal defect repair because of their versatility, options provided, and one-stage repair characteristics.","d":"H&N / Plastics / Trauma","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q2"},{"s":"Presence of acoustic reflexes on a preoperative audiogram should prompt the operating surgeon to","o":["Cancel the surgery.","Order a CT scan.","Consider superior semicircular canal dehiscence as a cause of the conductive hearing impairment.","Do all of the above."],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 26 · Q1"},{"s":"All of the following are true concerning cartilage tympanoplasty except","o":["Hearing results are worse than with conventional materials.","Toothed forceps should be avoided during manipulation.","Although softening occurs, long-term graft survival is the norm.","Cartilage becomes more brittle with age and more subject to fracture.","The postoperative tympanogram is often type B despite no effusion present."],"k":"A","x":"Hearing results are worse with cartilage. Several studies comparing cartilage, fascia, and perichondrium have been published that show no significant difference in hearing results between the materials. Cartilage can be somewhat brittle, especially in the older patient, so toothed forceps should not be used to manipulate the graft. Softening can occur, and the postoperative tympanogram is frequently a small volume B, due to the noncompliant nature of the graft, even with normal hearing and no effusion.","d":"Otology","src":"Brackmann · Chapter 10 · Q1"},{"s":"Concerning the hyoid bone, which of the following statements is false?","o":["The lesser cornu of the hyoid is derived from the second branchial arch","The hyoid bone is incompletely ossified at birth","The hyoglossus and middle constrictor muscles attach to the greater cornu","The intermediate tendon of the digastric muscle passes between the bifurcated tendon of the stylohyoid","The geniohyoid muscle acts to depress the larynx during swallowing"],"k":"E","x":"Itis the infrahyoid muscles which act to depress the larynx during swallowing.\nThe hyoid develops from the second and third brachial arches. The lesser cornu form the second arch and the greater cornu form the third.\nOssification begins in the body and greater cornus and is complete in adolescence. The hyoglossus and middle constrictor attach to the greater cornu.\nThe digastric muscle does pass through the tendon of the stylohyoid.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q11"},{"s":"A colleague calls for your urgent assistance in the operating room, being unable to locate the recurrent laryngeal nerve. This most likely suggests the anomaly occurring in 1 of 400 cases of","o":["carotid sinus syndrome with an aberrant course of the recurrent laryngeal nerve.","coarctation of the aorta.","anomalous retroesophageal right subclavian artery.","anomalous retroesophageal left subclavian artery.","transposition of the great vessels."],"k":"C","x":"This is a classic anomaly, occurring almost always on the right, in which a right subclavian artery arises from the left descending aorta. In such cases, the inferior laryngeal nerve passes directly from the vagus to the larynx and is susceptible to injury in dissection. Carotid sinus syndrome has nothing to do with the recurrent laryngeal nerve, and coarctation of the aorta and transposition of the great vessels are unrelated congenital anomalies.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Thyroid and Parathyroid Glands · Q6"},{"s":"The inferior extent of the EMF approach includes","o":["The foramen magnum","The inferior petrosal sinus","The midclivus","The superior petrosal sinus"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 53 · Q3"},{"s":"Silver nitrate cautery: which of the following statements is false?","o":["Medical silver nitrate sticks are usually purchased in combination with potassium nitrate","When the applicator is combined with water, nitric acid and potassium hydroxide are produced","The silver hydroxide is insoluble and produces the brownish discolouration seen with nasal cautery","Any spillage on to the upper lip/facial skin should be cleaned immediately with water","Uses for silver nitrate cautery include nasal cautery for epistaxis and to remove granulations around tracheal stomas"],"k":"B","x":"When the applicator is combined with water, nitric acid and silver hydroxide are produced. It is the silver hydroxide that causes the brownish discolouration seen.","d":"General","src":"SBA book · General Otolaryngology · Q46"},{"s":"Interventional and diagnostic angiography are indicated for","o":["all lesions.","embolization of vascular lesions.","adjuvant chemotherapy.","determination of the location and extent of the tumor.","evaluation of the vascularity of a tumor."],"k":"B","x":"Diagnostic and interventional angiography is valuable for therapeutic embolization prior to resection of vascular tumors. This is typically performed within 24 to 48 hours prior to resection. The use of embolization is valuable in the treatment of juvenile nasopharyngeal angiofibromas.Angiography and/ or balloon occlusion testing are performed for patients undergoing carotid resection or bypass. In our experience, very few patients require this type of management.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q5"},{"s":"Regarding surgical needles, which of the following statements is true?","o":["Conventional cutting needles are preferred to reverse cutting needles when closing the pharyngeal mucosa","The reverse cutting needle has its third cutting edge on the inner concave surface","The conventional cutting needle has its third cutting edge on the outer convex surface","Reverse cutting needles are less prone to bending than conventional cutting needles","Cutting needles are preferred for friable tissue"],"k":"D","x":"With conventional cutting needles the cutting edge is on the inner (concave) surface of the needle. The reverse cutting needle has its third cutting edge on the outer convex surface. This means that conventional cutting needles are associated with cutting through tissue (‘cutout’), whereas this problem is not generally associated with reverse cutting needles.","d":"Rhinology","src":"SBA book · Rhinology · Q68"},{"s":"High risk of stroke with carotid sacrifice on xenon blood flow studies with test occlusion of the carotid are predicted by flows","o":["Greater than 35 mL/min/100 gm of tissue","21–35 mL/min/100 gm of tissue","Less than 20 mL/min/100 gm of tissue","Greater than 50 mL/min/100 gm of tissue","Greater than 100 mL/min/100 gm of tissue"],"k":"C","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 54 · Q1"},{"s":"Which of the following statements best describes the success rate of posterior fossa vestibular neurectomy at eliminating vertigo and maintaining hearing?","o":["Posterior fossa vestibular neurectomy is greatly inferior to labyrinthectomy in both controlling vertigo and preserving hearing.","Posterior fossa vestibular neurectomy is slightly inferior to labyrinthectomy in controlling vertigo and preserves hearing in approximately two thirds of patients.","Posterior fossa vestibular neurectomy is slightly inferior to labyrinthectomy in preserving hearing while controlling vertigo in approximately two thirds of patients.","Posterior fossa vestibular neurectomy is superior to labyrinthectomy at controlling vertigo, but not at preserving hearing.","Posterior fossa vestibular neurectomy is superior to labyrinthectomy in both controlling vertigo and preserving hearing."],"k":"B","x":"Labyrinthectomy is the gold standard for control of vertigo but results in complete loss of hearing.In contrast,posterior fossa vestibular neurectomy controls vertigo in greater than 90% of patients and preserves hearing in 60% to 70% of patients.","d":"Otology","src":"Brackmann · Chapter 36 · Q5"},{"s":"Nonsyndromic cleft lip and cleft palate is","o":["associated with first or second arch anomalies.","caused by single-gene transmission.","accompanied by systemic organ malformations.","secondary to multifactoral inheritance.","attributable to environmental factors"],"k":"D","x":"Nonsyndromic cleft palate is felt to be attributable to multifactorial inheritance in those patients with no obvious first or second arch anomalies or systemic organ malformation. In addition, single-gene transmission is not consistent with nonsyndromic malformation but rather is seen in syndromic malformation. It is felt that environmental factors may play a role in syndromic clefting rather than nonsyndromic cleft lip and palate.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q10"},{"s":"Acoustic tumors arising from which nerve have a higher incidence of hearing preservation?","o":["Superior vestibular nerve","Inferior vestibular nerve","Cochlear nerve","Facial nerve"],"k":"A","x":"Tumors arising in the superior compartment of the internal auditory canal tend to have less involvement of the cochlear nerve and cochlear blood supply.","d":"Otology","src":"Brackmann · Chapter 48 · Q2"},{"s":"Many different solutions have been applied to the task of restoring speech communication following laryngectomy. Which of the following approaches requires the use of the patient’s hands to be effective?","o":["tracheoesophageal shunts","artificial larynx (battery powered)","pseudoglottis","esophageal speech","combined surgical and artificial device"],"k":"B","x":"The battery-powered artificial larynx requires the patient to activate a handheld artificial larynx that vibrates a diaphragm that is held against the neck or pharynx.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q5"},{"s":"Which one of the following postoperative methods is advocated by the authors?","o":["Cotton is placed in the ear canal and usually left in place for 3 weeks.","A mastoid dressing is usually placed at the end of the procedure.","If drainage occurs postoperatively, the patient is advised to come into the office immediately and the ear canal is cleaned using the microscope.","The patient is advised to keep the operated ear dry for 3 weeks, at which time the ear is examined in the office with a microscope.","Active autoinflation of the ear is begun 3 days postoperatively."],"k":"D","x":"It is important to keep the ear dry and to avoid inflating the ear for 3 weeks. Cotton should be placed in the meatus, changed as necessary for drainage, and discontinued after drainage has ceased. If drainage worsens, the patient is started on antibiotic ear drops.","d":"Otology","src":"Brackmann · Chapter 11 · Q5"},{"s":"A patient presents with a squamous cell carcinoma of the maxillary sinus. Which are the first-echelon nodes for this tumour?","o":["Intraparotid lymph nodes","Preauricular lymph nodes","Retropharyngeal lymph nodes","Facial nodes","Level III lymph nodes"],"k":"C","x":"The nasal cavity first-echelon nodes are the retropharyngeal lymph nodes.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q6"},{"s":"Some advantages the translabyrinthine approach has over the retrosigmoid approach for removal of acoustic neuromas include","o":["Extradural drilling that decreases the seeding of bone dust into the subarachnoid space","Exposure of the entire facial nerve","Less cerebellar retraction during tumor removal","a and c","All of the above"],"k":"E","x":"All drilling is complete prior to opening the dura. In a retrosigmoid craniotomy, any internal auditory canal drilling must be performed after the cistern has been opened. By completing a mastoidectomy and opening the entire length of the internal auditory canal, the facial nerve can be exposed from brain stem to stylomastoid foramen (and possibly beyond if parotidectomy is performed),which allows for easier grafting if necessary.The trajectory of the translabyrinthine craniotomy enters the cerebellopontine angle from a more anterior origin than the retrosigmoid craniotomy; this allows for less cerebellar retraction.","d":"Otology","src":"Brackmann · Chapter 49 · Q1"},{"s":"As of the year 2000, the estimated number of US residents infected with human immunodeficiency virus (HIV) was","o":["300,000.","600,000.","900,000.","1,200,000.","1,500,000."],"k":"C","x":"Furthermore, more than 600,000 cases of acquired immune deficiency syndrome (AIDS) have been reported in the United States.","d":"General","src":"Ballenger · Acquired Immune Deficiency Syndrome · Q1"},{"s":"Identify which one of the following is not a contraindication for transcanal tympanoplasty surgery.","o":["A narrow ear canal that will only accommodate up to a 4.5-mm speculum","An elderly and debilitated patient","Involvement of only hearing ear and patient not a satisfactory surgical risk","A perforation with persistent and active drainage","Very questionable Eustachian tubal function"],"k":"D","x":"Drainage at the time of surgery is not believed by the authors to be an absolute contraindication to surgery. If drainage cannot be controlled preoperatively, this constitutes an indication for surgery.","d":"Otology","src":"Brackmann · Chapter 11 · Q2"},{"s":"A cutaneous capillary vascular malformation typically:","o":["ls not obvious at birth, but grows rapidly in the first year of life","Involutes between the ages of 2 and 9 years","Is more common in males","May be associated with underlying meningeal vascular malformations","Does not respond to laser therapy"],"k":"D","x":"Vascular malformations are typically visible at birth, but may be difficult to find and whereas cutaneous haemangiomas involute between 2 and 9 years of age, vascular malformations do not. There is an equal incidence in males and females.\nThe Surge—Weber syndrome consists of a cutaneous capillary vascular malformation and an underlying intracranial vascular malformation.\nCutaneous capillary vascular malformations typically do respond to laser therapy, particularly pulsed dye lasers and argon lasers.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q23"},{"s":"A 25-year-old lady presents with a midline neck mass. Clinically and radiographically, it is a thyroglossal duct cyst. It is excised in a Sistrunk’s procedure, including the middle one-third of the hyoid bone. Histology shows a papillary carcinoma in the cyst. Review of the radiology shows no masses in the thyroid itself or lymphadenopathy. What would be the most appropriate management of this malignancy?","o":["External beam radiotherapy","Subtotal thyroidectomy","Total thyroidectomy followed by radio-iodine ablation","Radio-iodine ablation only","Reassure the patient that the cancer has been excised"],"k":"C","x":"The incidence of papillary carcinoma arising in a thyroglossal duct cyst is less than 1%. Fine needle aspiration cytology should suggest the diagnosis preoperatively. If it is diagnosed postoperatively, the management should be as for any other well-differentiated thyroid cancer.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q43"},{"s":"Concerning rhinoplasty techniques, which of the following techniques is unlikely to achieve the stated aim?","o":["An onlay graft overlying the alar domes will increase tip projection","Separating the medial crura of the lower lateral cartilages from the septum will decrease tip projection","Removing part of the cranial edge of the lower lateral cartilage ‘cephalic shave’ will cause caudal tip rotation","Using the lateral crura of the lower lateral cartilages to elongate the medial crura ‘lateral crural steel’ will increase tip projection","Interdomal sutures will increase tip projection"],"k":"C","x":"Performing a ‘cephalic shave’ will cause cranial tip rotation.","d":"Rhinology","src":"SBA book · Rhinology · Q23"},{"s":"Mustarde sutures should be placed through","o":["the posterior perichondrium only.","the cartilage only.","the cartilage and anterior perichondrium.","the posterior perichondrium and cartilage.","the posterior perichondrium, cartilage, and anterior perichondrium."],"k":"E","x":"Once the new antihelix has been marked, 4-0 braided nylon horizontal mattress sutures are placed sequentially, from caudal to cephalic along the neoantihelical fold. These horizontal mattress sutures are placed through the posterior perichondrium, auricular cartilage, and anterior perichondrium. Careful palpation with the free hand along the anterior surface of the auricle ensures that the needle does not pass through the anterior skin. Incorporation of the anterior perichondrium in the horizontal mattress suture is necessary to prevent the suture from tearing through the cartilage when it is tied.","d":"H&N / Plastics / Trauma","src":"Ballenger · Reconstruction of the Outstanding Ear · Q6"},{"s":"A 4-month-old baby has been referred for an airway assessment. They were born at 32 weeks, were intubated for a week, and went on to have surgery to ligate a patent ductus arteriosus (PDA). They now have a soft stridor worse on exertion and a hoarse voice. Which of these is the least likely pathology to be encountered during microlaryngoscopy and bronchoscopy?","o":["Subglottic stenosis","Subglottic cysts","Vocal cord palsy","Tracheomalacia","Laryngeal web"],"k":"E","x":"Neonates who have been intubated at birth are at risk of multiple airway defects. Most commonly prolonged intubation can lead to subglottic cysts followed by an acquired subglottic\nstenosis. Traumatic intubation can cause cricoarytenoid joint dislocation and therefore vocal cord palsy. Left recurrent laryngeal nerve is also at risk during a PDA ligation.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q51"},{"s":"A patient has experienced a recurrent febrile illness with edema and mild tenderness of the thyroid gland, apparently following a respiratory infection. She is presently euthyroid. Which of the following diagnoses are most likely?","o":["Hashimoto’s disease (struma lymphomatosa)","de Quervain’s granulomatous thyroiditis","bacterial thyroiditis","Riedel’s struma (invasive fibrous thyroiditis)","none of the above"],"k":"B","x":"Bacterial thyroiditis is extremely rare and would probably impair thyroid function. Riedel’s struma is also rare but is associated with irreversible, profound hypothyroidism and a stony hard, irregular, fibrous gland. Early Hashimoto’s disease is characterized by mild thyrotoxicosis owing to release of thyroid hormone from damaged follicles, with development of hypothyroidism in the late or chronic stage. The described case is typical of de Quervain’s granulomatous thyroiditis.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Thyroid and Parathyroid Glands · Q3"},{"s":"A 54-year-old patient presented to the multidisciplinary team (MDT). He has a single 2 cm right level 2 node. This is squamous cell carcinoma on a core biopsy. He is human papillomavirus (HPV)/Epstein-Barr virus (EBV) negative. The patient has undergone a PET-CT scan, panendoscopy, and tonsillectomy. The conclusion of the MDT is that this is an unknown primary. How would this be staged in the TNM (8th edition)?","o":["Tx, N1","N1","T0, N1","TO, N2a","Tx, N2"],"k":"B","x":"The TNM (8th edition) has eliminated the TO category for tumours that are HPV/EBV negative. This is because an anatomical site cannot be identified. It has retained TO for neck nodes that are positive for HPV or EBV. In these situations, the tumour would be T0, N1 oropharyngeal tumour if HPV positive or TO, N1 nasopharyngeal tumour if HPV positive.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q84"},{"s":"A 4-year-old otherwise well child presents to clinic with persistent drooling, sometimes having to change their top during the day as it is soaked. The child has large tonsils and symptoms of obstructive sleep apnoea. What is the most appropriate initial management of this child?","o":["Consider Botox injections to the submandibular gland","Discuss submandibular rerouting if no significant change by age 6","Discuss performing an adenotonsillectomy as the child has sleep apnoea","Prescribed anticholinergic medications such as hyoscine patches","Behavioural modification in conjunction with an assessment by speech and language therapy"],"k":"E","x":"In an otherwise normal child, the initial management of drooling should be conservative. History and examination should include information on feeding history, dental hygiene, nasal obstruction, and general neuromuscular development. In a non-neurological child, every effort should be made to encourage oral control in conjunction with oromotor exercises and behavioural modifications. Optimizing the nasal and oral airway is advisable.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q49"},{"s":"What are the indications for the transcochlear approach?","o":["Lesions arising anterior to the internal auditory canal (IAC), petrous apex lesions, skull base and midline intradural lesions from the clivus","Small acoustic tumors, with moderate extension into the cerebellopontine angle (CPA), and good preoperative hearing","Sinonasal tumors invading the infratemporal fossa, the masticator space, or the pterygomaxillary fossa, and tumors of the nasopharynx extending into the infratemporal fossa","Trigeminal nerve sections, vestibular nerve sections, and CPA biopsies"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 52 · Q1"},{"s":"Factors that have been blamed for postoperative collapse of the tympanic membrane include which of the following?","o":["Multiple surgeries","Eustachian tube dysfunction","Recurrent infections","Middle ear mucosal disease","b and d"],"k":"E","x":"Classically, Eustachian tube dysfunction has been blamed for retraction and collapse of the grafted tympanic membrane.With the increased use of staging, many surgeons have recognized the role of middle ear mucosal disease in the pathogenesis of tympanic membrane collapse.","d":"Otology","src":"Brackmann · Chapter 18 · Q2"},{"s":"A 75-year-old man is undergoing a local anaesthetic excision of a suspected basal cell carcinoma on his cheek. What clinical margin of excision is most appropriate?","o":["0mm","2mm","5mm","1m","2-3 cm"],"k":"B","x":"For basal cell carcinoma, a 2-3 mm margin will assure histopathological clearance in 95% of cases.","d":"Rhinology","src":"SBA book · Rhinology · Q43"},{"s":"Which of the following is least likely to be improved following orbital decompression for Graves-associated thyroid eye disease?","o":["Optic neuropathy","Diplopia","Exophthalmos","Cosmesis","Exposure keratitis"],"k":"B","x":"Orbital decompression is a recognized treatment for thyroid eye disease. Indications for treatment include visual loss due to compressive optic neuropathy, exophthalmos causing cosmetic changes, and exposure keratitis. Diplopia occurring preoperatively or postoperatively is relatively common and may necessitate ocular procedures.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q34"},{"s":"Based on the author’s experience, what percentage of patients have fair to superb nerve graft results?","o":["5%","20%","60%","80%","95%"],"k":"D","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 63 · Q2"},{"s":"Middle fossa vestibular nerve section hearing loss risk is","o":["Less than 5%","Greater than 20%","Greater than 30%","Greater than 40%","Greater than 50%"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 35 · Q5"},{"s":"Fibrillation potentials found on facial EMG indicate","o":["intact motor end plates but no evidence of reinnervation.","intact motor end plates and evidence of reinnervation.","degenerated motor end plates and no evidence of reinnervation.","degenerated motor end plates and evidence of reinnervation.","None of the above."],"k":"A","x":"Fibrillation potentials support the use of a nerve substitution procedure to take advantage of the potential neurotized tone and movement of the intrinsic facial musculature. Electrical silence indicates complete denervation and atrophy of motor end plates. Under these circumstances, neurotized procedures are contraindicated, and other reanimation procedures are indicated.","d":"Otology","src":"Ballenger · Facial Paralysis · Q4"},{"s":"Assuming audiometric criteria for cochlear implantation are met, which of the following patients would be the poorest candidate for cochlear implantation?","o":["A 14-year-old male with congenital, profound sensorineural hearing loss who uses sign language as his primary mode of communication","An 8-year-old female with progressive hearing loss following meningitis","An 82-year-old female with gradually progressive hearing loss","A 14-month-old male with congenital sensorineural hearing loss","A 15-year-old female with congenital, progressive sensorineural hearing loss with normal speech and language"],"k":"A","x":"","d":"Otology","src":"Brackmann · Chapter 31 · Q4"},{"s":"What is the most common cause of inoperability in congenital aural atresia?","o":["Absence of the oval window","A facial nerve overlying the oval window","Poor mastoid pneumatization","Unilateral atresia"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 5 · Q3"},{"s":"Anatomy of the skull base: which of the following statements is false?","o":["The maxillary nerve (V2) passes through the foramen rotundum","The hypoglossal nerve exits the skull through the hypoglossal canal","The lesser wing of the sphenoid is a boundary of the anterior cranial fossa","Through the foramen ovale the emissary vein connects the pterygoid plexus with the cavernous sinus","The V3 (mandibular nerve) passes through the foramen lacerum"],"k":"E","x":"The greater wing of the sphenoid and the lesser wing both are boundaries of the anterior\ncranial fossa. The lesser wing is a boundary to the posterior aspect and floor of the anterior cranial fossa. Passing through the foramen lacerum are the artery of pterygoid canal, meningeal branch of ascending pharyngeal artery, the occipital artery, and an emissary vein. The nerve of the pterygoid\ncanal passes through its anterior wall.","d":"Rhinology","src":"SBA book · Rhinology · Q50"},{"s":"Concerning obstructive sleep apnoea (OSA), which of the following statements is false?","o":["Can lead to hypertension, arrhythmias, and pulmonary hypertension if untreated","As part of the initial investigations the haemoglobin and thyroid function tests should be checked","Collapse of the upper airways is related to the Bernoulli principle","Sleep nasoendoscopy is good at visualizing the level of obstruction, thus assessing benefits of any planned procedure","Obesity hypoventilation syndrome purely depends on the body mass index of the patient"],"k":"E","x":"During sleep there is muscle relaxation, causing a decrease in tone of the muscles of the upper airway leading to collapse causing obstructive sleep apnoea. This condition would therefore be exacerbated by conditions causing over-relaxation such as alcohol, sleeping tablets, and muscle relaxants. Having a large neck circumference and obesity would be predisposing factors for OSA.\nSleep disorders exist on a spectrum, normal sleep to sleep-disordered breathing, which consists of simple snoring—mild OSA—moderate OSA—severe OSA—obesity hypoventilation syndrome (termed Pickwickian syndrome).\nOSA is characterized by recurrent episodes of partial or complete upper airway obstruction during sleep, with the number of episodes per hour determining the severity. The hypoventilation associated with OSA causes hypercapnia and hypoxaemia which stimulate increased respiratory effort. At a certain arousal threshold the patient awakens. This results in a resumption of normal upper airway muscle activity and relief of the upper airway obstruction. Ventilation resumes with correction of the hypercapnia and hypoxaemia. The patient then returns to sleep and the cycle starts again. The hypoventilation and sleep fragmentation associated with this sleep/wake cycle are responsible for the symptoms and the long-term consequences of OSA. Treatment consists of lifestyle advice—weight reduction, alcohol reduction, and correction of medical conditions—anaemia, hypothyroidism. Specifically for OSA, mandibular advancement devices, continuous positive airway pressure (CPAP), and ultimately tracheostomy can be considered. Surgery for snoring may help mild OSA but should not be taken as a specific treatment for OSA. Excision\nof redundant tissue such as large tonsils may help to reduce the pressures needed for the CPAP device.","d":"Rhinology","src":"SBA book · Rhinology · Q45"},{"s":"The recommended way to handle postoperative skin necroses is","o":["Conservative handling with mild ointment","Revision surgery as soon as possible with a free graft","Removal of skin-penetrating abutment","Removal of coupling and bone implant","Long-term intravenous antibiotics"],"k":"A","x":"Even in large defects,healing will take place with a conservative attitude, even if it could take some time.","d":"Otology","src":"Brackmann · Chapter 33 · Q4"},{"s":"Which of the following statements best describes the development of the ear in an otherwise healthy child?","o":["At birth, the ossicles are approximately half their eventual adult size","The auricle develops from the ectoderm of the first three branchial arches","At birth, the auricle is of adult shape and size","The first otological structure to develop is the inner ear","The bony labyrinth develops from six separate centres of ossification"],"k":"D","x":"The inner ear develops first as the otic placode forms in week 3 of gestation and the semicircular canals are fully formed by week 8.\nThe ossicles are adult-sized at birth. The auricle develops from condensations of mesoderm of the first and second branchial arches. These give rise to the six hillocks of His. At birth, the auricle is adult-shaped but is not adult-sized until approximately 9 years.\nThe bony labyrinth develops from 14 centres of ossification.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q6"},{"s":"A 2-year-old child presents with rapid onset of a high fever, sore throat, muffled voice, and respiratory distress. She looks uncomfortable and is sitting up, leaning forward, and drooling. The most likely causative microorganism is","o":["Haemophilus influenzae.","Staphylococcus aureus.","Moraxella catarrhalis.","Streptococcus pneumoniae.","Epstein-Barr virus."],"k":"A","x":"The clinical presentation is that of acute epiglottitis. Haemophilus influenzae is the predominant causal microorganism.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q6"},{"s":"Please read the following disease associations and choose the statement least likely to be correct:","o":["Oral pigmentation and Addison’s disease","Oral cobblestoning, lichen planus, and Crohn’s disease","Red eyes, oral ulceration, and Stevens—Johnson syndrome","Pyostomatitis vegetans and ulcerative colitis","Recurrent oral vesicles and pemphigus"],"k":"E","x":"The lips are the most common site of Crohn’s disease affecting the oral cavity, and can include tags. A cobblestoned appearance is associated with Crohn’s disease, which includes mucosal-coloured plaques on the buccal mucosa. These findings are pathognomonic for the disease, and can be used to monitor disease activity. Lichen planus can be associated with both Crohn’s disease and ulcerative colitis.\nAlthough oral lesions are more common in Crohn’s disease than ulcerative colitis, oral lesions are still associated with the condition, and can similarly be used to monitor disease flare-ups. Pyostomatitis vegetans are small, white pustules with an erythematous base, occurring in the oral vestibule. They can occur in either condition.\nThe blisters are rarely observed in pemphigus as they are superficial, and easily burst. However, a positive Nikolsky sign is when a blister is formed on rubbing the mucosa.\nLankarani KB, Sivandzadeh GR, Hassanpour S. Oral manifestation in inflammatory bowel disease: a\nreview. World Journal of Gastroenterology 2013;19:8571—8579.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q73"},{"s":"Which of the following tests have concluded a successfully localized overactive parathyroid gland?","o":["A drop in the intraoperative parathyroid hormone monitoring from the pre-skin incision level of 50 pg/mL to 10 pg/mL 10 minutes post removal","A difference of 8% between ultrasound-guided right and left internal jugular vein (IJV) serum samples of parathyroid hormone","A drop in the intraoperative parathyroid hormone monitoring from the pre-skin incision level of 50 pg/mL to 30 pg/mL 10 minutes post removal","A difference of 5% between ultrasound-guided right and left IJV serum samples of parathyroid hormone","A drop in the intraoperative parathyroid hormone monitoring from the pre-skin incision level of 50 pg/mL to 30 pg/mL 5 minutes post removal"],"k":"A","x":"Intraoperative parathyroid hormone monitoring can be used to reduce the risk of bilateral neck exploration when a hyperfunctioning parathyroid gland cannot be localized prior to surgery. There are a number of protocols used to analyse the results. One, known as the dual criteria, requires a sample to be taken prior to incision, but after induction of anaesthesia. The second sample should be taken from the same site 10 minutes after excision. A decrease of greater than 50% and less than the upper limit of the normal range is considered significant, and the surgery concluded.\nUltrasound-guided bilateral IJV measurement can be used to lateralize an overactive gland. A difference of 10% or more is diagnostic.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q62"}]};const Q=P.q;const L='ABCDEF';

      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}
