<title>ENT Mock Exam — Paper 2</title>
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14242B;--muted:#5B6A71;--line:#D3DCDF;--teal:#0E6A70;--teal-soft:#DDEEEE;--ok:#1D7A4C;--ok-soft:#E1F2E8;--bad:#A8261F;--bad-soft:#F8E3E1;--amber:#B06A00;--amber-soft:#FBEFD9;--box:#0B1418;--on-teal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#16252B;--ink:#E4ECEE;--muted:#93A4AA;--line:#2A3D44;--teal:#4FB7B5;--teal-soft:#183A3D;--ok:#5BC48A;--ok-soft:#173326;--bad:#F08B83;--bad-soft:#3A1E1C;--amber:#E8A94A;--amber-soft:#3A2C14;--box:#000;--on-teal:#06201F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font:600 1.7rem/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:8px 0 4px;letter-spacing:-.01em}
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:last-child{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;text-align:center}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:14px 20px;font-weight:600;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note{font-size:.9rem;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topi{display:flex;align-items:center;gap:10px}
.timer{font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.topi .t{flex:1;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.flagbtn.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qn{font-weight:600;font-size:.9rem;color:var(--teal);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stem{font:600 1.18rem/1.45 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 16px}
.box{background:var(--box);border-radius:10px;padding:10px;margin:0 0 16px;display:grid;gap:10px}
.box img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .T{padding-top:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}.opt.sel .L{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.exp h3{margin:0 0 6px;font-size:1rem}.exp h3.ok{color:var(--ok)}.exp h3.bad{color:var(--bad)}.exp h3.na{color:var(--amber)}
.exp p{margin:0 0 10px;max-width:68ch}
.exp img{max-width:100%;border-radius:6px}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navi{max-width:760px;margin:0 auto;display:flex;gap:8px}.navi button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.grid .ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.grid .flg{box-shadow:inset 0 0 0 2px var(--amber)}
.grid .g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid .g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid .g-na{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid .cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a::before{background:var(--teal-soft);border-color:var(--teal)}.legend .f::before{box-shadow:inset 0 0 0 2px var(--amber)}
dialog{border:0;border-radius:12px;padding:16px;max-width:700px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.zoom{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;padding:8px}
.zoom img{max-width:100%;max-height:100%}
.big{font:600 3.2rem/1 Charter,Georgia,serif;font-variant-numeric:tabular-nums;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const P={"title":"ENT Mock Exam — Paper 2","q":[{"s":"The most appropriate imaging technique for the assessment of the obliterated fontal sinus is","o":["magnetic resonance imaging.","ultrasonography.","positron emission tomography.","computed tomography.","plain radiography."],"k":"A","x":"A significant disadvantage of a frontal sinus obliteration procedure is the loss of the ability to follow the status of the sinus endoscopically. This can make assessment of postoperative frontal sinus complaints difficult and delay detection of some late complications. Whereas computed tomography merely shows opacification of the sinus after obliteration, magnetic resonance imaging can differentiate fat used in the obliteration from retained mucosa, secretions, and infection. The other choices have no role in postsurgical imaging of the frontal sinus.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q8"},{"s":"With regard to spasmodic dysphonia (SD), which statement is false?","o":["Abductor SD is more common","Abductor SD is associated with a breathy, effortful voice and abnormal whispered segments","The inability to sustain vowels is associated with adductor SD","Botulinum toxin is injected into the posterior cricoarytenoid muscle to treat abductor SD","Using electromyographic (EMG) guidance, a sniff can indicate correct placement of the needle into the posterior cricoarytenoid muscle"],"k":"A","x":"Adductor SD is more common, it represents 80% of cases. SD is familial in 12% of cases. The thyroarytenoid and lateral cricoarytenoid muscles are involved in adductor SD. The posterior cricoarytenoid muscle is involved in abductor SD. Adductor dysphonia is characterized by a harsh, strained voice with inappropriate pitch breaks and glottal fry.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q63"},{"s":"Adult supraglottitis (epiglottitis) differs from pediatric supraglottitis in all of the following ways except","o":["in adults, the infectious agent is less likely Haemophilus and more likely group A streptococcus.","in adults, the clinical course is usually less severe.","in adults who present with drooling, endotracheal intubation is frequently necessary.","in adults, progression to epiglottic abscess is more common.","in adults, conservative measures include oxygenation, humidification, hydration, corticosteroids, and intravenous antibiotics."],"k":"C","x":"Although the clinical course of adult supraglottitis (epiglottitis) is usually less severe, persons who present with drooling usually require endotracheal intubation.","d":"Laryngology","src":"Ballenger · Infectious and Inflammatory Diseases of the Larynx · Q4"},{"s":"The undersurface grafting technique greatly reduces which of the following postoperative complications?","o":["Infection","Anterior sulcus blunting","Graft failure","Recurrent cholesteatoma"],"k":"B","x":"","d":"Otology","src":"Brackmann · Chapter 12 · Q4"},{"s":"A teratoid cyst located in the nasopharynx was removed from a 1-week-old infant with respiratory distress. Histologically, the lesion would be expected to reveal","o":["ectoderm only.","mesoderm only.","ectoderm and endoderm.","ectoderm, mesoderm, and endoderm.","ectoderm and mesoderm."],"k":"D","x":"Response A is incorrect as ectoderm alone would be inconsistent with any form of teratoma. The same is true of mesodermal elements alone. The combination of ectoderm and endoderm is not seen in the teratoid cyst, whereas all three elements of ectoderm, mesoderm, and endoderm are encountered in teratoid cysts. Ectoderm and mesoderm are seen in dermoid cysts.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q5"},{"s":"Which of the following is not a layer of the olfactory bulb?","o":["interglomerular layer","mitral cell layer","olfactory nerve cell layer","internal plexiform layer","all of the above are layers of the olfactory bulb"],"k":"A","x":"The layers of the olfactory bulb are, from the periphery inward, the olfactory nerve cell layer, glomerular layer, external plexiform layer, mitral cell layer, internal plexiform layer, and granule cell layer. There is no interglomerular layer distinguished as such.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q2"},{"s":"What percentage of HIV-infected persons progress to AIDS within the first 2 to 3 years?","o":["5","10","20","30","50"],"k":"B","x":"Approximately 10% of HIV-infected persons progress to AIDS within the first 2 to 3 years following infection. In contrast, 5 to 10% are so-called nonprogressors, having stable CD4 cell counts after 15 or more years of follow-up.","d":"General","src":"Ballenger · Acquired Immune Deficiency Syndrome · Q8"},{"s":"The owner of a Birmingham car factory approaches you. His workers are exposed to a continuous constant level of noise. He wishes to know, at what level does he needs to provide ear protectors?","o":["75 dBA","80 dBA","85 dBA","90 dBA","95 dBA"],"k":"B","x":"The 2005 Control of Noise at Work Regulations set the lower exposure level at a daily or weekly personal noise exposure of 80 dB (A-weighted) and a peak sound pressure of 135 dB (C- weighted). The upper exposure action values are a daily or weekly personal noise exposure of 85 dB (A-weighted) and a peak sound pressure of 137 dB (C-weighted). At these levels, the employer is required to try to reduce exposure to as low a level as is reasonably practicable by establishing and implementing a programme of organizational and technical measures and provide personal hearing protectors.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q12"},{"s":"A 5-month-old baby presents with bilateral preauricular sinuses and a discharging pit at the anterior border of sternocleidomastoid. A diagnosis of branchio-oto-renal syndrome (BOR) is suspected. Which of the following statements regarding BOR syndrome is false?","o":["Hearing loss affects more than 80% of patients with BOR","It affects 1 in 40,000 children","It is an autosomal recessive inherited condition","It may present with conductive or sensorineural hearing loss","It accounts for 2% of profoundly deaf children"],"k":"C","x":"Branchio-oto-renal syndrome is an autosomal dominant inherited condition involving mutations of the EYA1, SIX1, and SIX5 genes. Hearing loss may be mixed, conductive, or sensorineural and a variety of temporal bone abnormalities have been seen on CT scans of these patients. Abnormalities of the second branchial arch such as cyst sinuses and fistulas are extremely common.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q34"},{"s":"Regarding the side effects of medications for allergic rhinitis, which of the following statements is true?","o":["All intranasal corticosteroids have no odor.","Diphenhydramine may cause worse performance impairment than alcohol.","Decongestants cannot be used in hypertensive patients.","No systemic effects of intranasal corticosteroids have been demonstrated.","Side effects are not a concern with these medications."],"k":"B","x":"Although commonly prescribed, the various medications employed against allergic rhinitis require careful consideration of side effects. Patients sometimes complain of the odor of intranasal corticosteroids. This can sometimes be alleviated by switching formulations from a particulate one to an aqueous preparation. Budesonide (Rhinocort Aqua) and triamcinolone acetonide (Nasacort AQ) have no odor. Although first-generation antihistamines are effective and generally safe, their undesirable side effects of sedation, anticholinergic effects, functional and performance impairment, and gastrointestinal distress pose a number of concerns. Studies show that a larger number of subjects developed impaired performance compared with the number reporting sedation. Furthermore, impaired performance can persist after the subjective feeling of somnolence dissipates—hence the importance of warning patients who are taking these medications not to perform some tasks such as operating heavy machinery or driving. In one study, diphenhydramine caused worse impairment to driving than consuming alcohol to the level of being legally drunk. This poses significant public health concerns. Overdosage with oral decongestants has been associated with hypertensive crisis. When given in prescribed doses, however, decongestants do not induce hypertension in normotensive patients nor do they alter the pharmacologic control of stable hypertensive patients. The systemic effects of intranasal corticosteroids have long been a concern. There are studies that show decreased height in children associated with beclomethasone use for perennial allergic rhinitis. However, another study with mometasone showed no effect. Additionally, studies of long-term effects, including final adult height, have not been performed. Lastly, many studies have been performed on asthmatics and are confounded by the effects of the disease itself. The growth of pediatric patients receiving intranasal corticosteroids, therefore, should be monitored carefully.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q9"},{"s":"Postural control assessment is an important aspect of the examination of the patient with complaints of dizziness. The use of the sensory organization test of computerized dynamic posturography provides the following useful information about the patient:","o":["functional information about the patient’s ability to use visual, vestibular, and proprioceptive/somatosensory cues","differentiating information as to site-of-lesion involvement between central and peripheral parts of the vestibular system","information that can differentiate between a peripheral neuropathy and a spinal compression lesion resulting in imbalance","in the recommendation process for vestibular and balance rehabilitation therapy and monitoring of such a program","both A and D"],"k":"E","x":"Sensory organization testing is strictly a functional evaluation giving relative information as to the use of sensory cues for the maintaining of stance. It is not a site-of-lesion study, although other protocols of computerized dynamic posturography can be used for that purpose. Because of its functional emphasis, it is useful as an outcome measure for vestibular rehabilitation programs and can detect patients who are exaggerating their results for whatever reason.","d":"Otology","src":"Ballenger · Evaluation of the Vestibular (Balance) System · Q10"},{"s":"A child presents with acute onset of a brassy cough, high fever, “toxicity,” and gradually worsening inspiratory stridor. Corticosteroids and racemic epinephrine are not very helpful. What is the most likely causal microorganism?","o":["respiratory syncytial virus","Moraxella catarrhalis","Haemophilus influenzae","Epstein-Barr virus","Staphylococcus aureus"],"k":"E","x":"Bacterial tracheitis is an acute, life-threatening disease in children and is most commonly caused by Staphylococcus aureus.","d":"Laryngology","src":"Ballenger · Bronchoesophagology · Q6"},{"s":"Poor prognostic factors among nasal and paranasal sinus malignancies include all of the following except","o":["histologic subtype.","lymph node involvement.","skull base involvement.","stage.","perineural invasion."],"k":"A","x":"The role of histologic subtype has not been clearly defined. It has not been associated with prognosis in many reports, and other authors have suggested improved survival among adenoid cystic carcinoma and lymphoma and poorer survival rates in undifferentiated carcinoma as well as melanoma. These data are of limited value because of the different treatment regimens employed and the small number of patients studied.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q7"},{"s":"A 29-year-old man presents to the emergency department after striking the anterior part of his neck against a fence post while riding a motorcycle at 20 miles per hour. He is alert and oriented, with normal and stable vital signs other than mild tachypnea. He has severe dysphonia, mild hemoptysis, and subcutaneous crepitus. The best approach to the management of his airway is","o":["fiberoptic endotracheal intubation.","cricothyrotomy under local anesthesia.","tracheostomy under local anesthesia.","direct laryngoscopy and intubation.","rigid bronchoscopy with a ventilating scope followed by tracheostomy."],"k":"C","x":"This patient sustained a “clothesline”-type injury. Although he is currently stable, he may have impending airway obstruction secondary to cricotracheal separation. No attempt should be made to manipulate the laryngeal or subglottic airway. The safest way to manage his airway is with a tracheostomy under local anesthesia.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q7"},{"s":"Vestibular schwannoma can present with","o":["high-frequency hearing loss.","low-frequency hearing loss.","flat hearing loss.","sudden hearing loss.","all of the above."],"k":"E","x":"Hearing loss is present in 95% of patients with vestibular schwannomas. Conversely, 5% of patients will have normal hearing, so unilateral vestibular or facial complaints without hearing loss do not rule out retrocochlear disease. Although high-frequency hearing loss is classically associated with vestibular schwannomas, any type of hearing loss may occur. Of the patients with hearing loss, most will have slowly progressive hearing loss with noise distortion. Twenty percent will have an episode of sudden hearing loss. The improvement of hearing loss with or without treatment does not rule out retrocochlear disease. The level of hearing loss is not a clear predictor of tumor size.","d":"Otology","src":"Ballenger · Ménière’s Disease, Vestibular Neuronitis, Benign Paroxysmal Positional Vertigo, and Cerebellopontine Angle Tumors · Q8"},{"s":"A 46-year-old, non-smoker patient presents with a long history of right- sided throat discomfort. He has no dysphagia and full ENT examination is normal. A lateral neck X-ray is requested. What is the most likely cause for his symptoms?","o":["Irritation of the vagus nerve","Irritation of the glossopharyngeal nerve","Irritation of the hypoglossal nerve","Irritation of the superior laryngeal nerve","Irritation of the cervical plexus"],"k":"B","x":"There is an elongated styloid process, also known as Eagle’s syndrome. This can cause symptoms attributed to irritation of the glossopharyngeal, trigeminal, facial, and vagus nerves. The symptoms include throat discomfort, a foreign body sensation, and neck pain which may be worse on swallowing.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q37","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAPRA8EBAREA/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBwb/xAA6EAACAgEDAwIEBAUEAgMAAwEAAQIRIQMxQRJRYQRxEyKBkTKSofAFU7HB0TNC4fEUUgYjQxVygmL/2gAIAQEAAD8A+yPdk3kab5DcADIAAB9QAAFyADsLAEABwACVgACaJaustFXmisieRLcbJ5C8UAXSwSDwAFJhyNUCzuUgyGRAr5B7EiHYLyDWCSovJQAMAAAAYgAAAAEMAyJugsAexJSdoYCyPIAAks5GIHncSVESu6seRgxJodiboFJPYYrIgpRcuuVp7LsWrFWdyXG+SZr7nT83j7De7EAAAAAEylGCuTSRSprcAAAYrQXQrVAnQ0xgAewCeAWwwEANCodh1CWefcZO7H0iYqE1YAADsColAACsVpglY8bAMlvGxBUUUlSAYAAAAAAlJXXIwBgAAAbAIKGAqQ0uwAAAAAACGTXI6FIlqxKKTtDWwxJUxiBDFshEyxZ0A92IAE8AnYwADOelGf485tF1QxAMAFQmgSBJ8jV8jAAECAYAAmTf2CwTKsVK9xpEvcQAAryAxOVYbKiNPux3YAKgSSGnYNivDBSwTLwCyy1gYAAcAANggAASQMAAAAAAAYUu4AAAAAAAILAAD6hVipC9gAQ8ckudcgnY7wKStCVhJZs6LJe4AApZJplIYAADQhc+BgG4AIYAAAKStUCVLAmCZQAIVOxPAIHkNgEMQCAAAY0VgMdxgBLpCdCsASKqmOhgAAAByAAAewAJqxgAAAAAAAAAUDAAACZbCzwWIB7EuxUTNtRuKsrjyD3Jnbi63MKaXzPJUXk1QMS8jZ0WS92IAQAAAAADyPjYQAKkmxgAAAAAcCBpkpZKQwABNW7JGq5GmmKhPAA9hUIACqAYIq1yJMfUFisTFnsVTCmuLLoADkAANgEPPAAAAgBAIYAAAAAABwwAAAAAVhuMAErGAqExAJkOCY4QUSsAIKOmiHuxBwAAAAAcA8ANirIe4BQILAAYAANBVYEAJZBugGAAS2DRLwJttpplJ5HVieA3J5GAgboEA7GgoB1YdIxgACewk3aVY7lIAAAGhAwAADGwAu7BgAAAAAAAAgAAACJbjiUAAAAAhPcQqGIGAjpIe7E8KwAAAEAACWW7GIAsBiAPYEALcADg "Otology","src":"SBA book · Otology & Neuro-otology · Q23"},{"s":"Adenoidectomy may help improve all of the following conditions except","o":["recurrent otitis media.","otitis media with effusion.","upper airway obstruction.","sinusitis.","velopharyngeal insufficiency."],"k":"E","x":"Velopharyngeal insufficiency may result from adenoidectomy, especially in the presence of a submucous or frank cleft of the palate. This is characterized by rhinolalia aperta and reflux of liquids into the nasal airway. Adenoidectomy has been recommended for the treatment of recurrent otitis media, otitis media with effusion, airway obstruction caused by enlarged adenoid tissue, and pediatric sinusitis.","d":"Paediatric","src":"Ballenger · Diseases of the Oral Cavity, Oropharynx, and Nasopharynx · Q8"},{"s":"An area of circumferential tracheal stenosis in a 49-year-old man measuring 2.5 cm in length and located 2 cm below the cricoid cartilage is best treated by which modality?","o":["endoscopic laser vaporization","resection of the segment with primary anastomosis","laryngotracheoplasty with anterior cartilage grafting","laryngotracheoplasty with anterior and posterior cartilage grafting","laryngotracheoplasty with hyoid bone interposition grafting"],"k":"B","x":"A 2.5 cm segment of tracheal stenosis located 2 cm below the cricoid cartilage could be easily excised and anastomosed primarily. Endoscopic laser vaporization is not ideal for circumferential lesions or lesions measuring more than 1 cm in length. A laryngotracheoplasty would not be necessary in this case.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q9"},{"s":"Bilateral vocal cord paralysis may result from","o":["compression of the vagus nerves in their course through the foramen magnum.","traction of the cervical rootlets of the vagus nerves.","brainstem dysgenesis.","all of the above.","none of the above."],"k":"D","x":"Hydrocephalus and the Arnold-Chiari malformation may be associated with caudal displacement of the brainstem through the foramen magnum and result in compression of the vagus nerves and traction on the cervical rootlets of the vagus nerves. Brainstem dysgenesis appears to be the most appropriate explanation for familial bilateral vocal cord paralysis.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q8"},{"s":"You are taking consent from a 25-year-old lady for excision of a second branchial arch cyst. What risks would it be reasonable not to mention?","o":["Paraesthesia to the ear and neck","Altered tongue movements","Altered facial movements","Altered voice","Numbness to the cheek"],"k":"E","x":"Excision of a second branchial arch cleft is usually performed in a skin crease and may require a step incision to follow the tract. The greater auricular nerve is at risk during this incision. As subplatysmal flaps are raised, it is possible to damage the marginal mandibular nerve. As the cyst is followed, this may pass through the bifurcation of the carotid artery, and the superior laryngeal nerve, hypoglossal nerve, and glossopharyngeal nerve can be damaged.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q40"},{"s":"Which of the following issues is usually not included in the nonmedical rehabilitation of persons with voice disorders?","o":["psychological factors","environmental factors","sleep habits of the patient","patient’s evaluation of the voice problem","assessed capabilities of the patient’s voice"],"k":"C","x":"Psychological factors are often of considerable importance in functional voice disorders. Similarly, patients whose employment settings require loud talking or who engage in loud cheering at sporting events need to change their environment during the course of therapy. The patient’s perception of the voice problem is crucial since the patient hears his/her own voice differently than do other listeners. The voice therapist must have an accurate assessment of the range of laryngeal capabilities of the patient before structuring appropriate vocal targets for the patient.","d":"Laryngology","src":"Ballenger · Disorders of Voice, Speech, and Language · Q2"},{"s":"A 3-year-old child presents with fever and sore throat followed by the development of small mucosal vesicles and ulcerations surrounded by erythematous rings. The lesions are located on the anterior tonsillar pillars and resolve without complications in 3 days. The most likely etiologic agent is","o":["group A beta-hemolytic streptococcus.","Haemophilus influenzae.","coxsackievirus.","fusobacteria.","influenza virus."],"k":"C","x":"The clinical features describe herpangina, caused by coxsackievirus.","d":"General","src":"Ballenger · Etiology of Infectious Diseases of the Upper Respiratory Tract · Q2"},{"s":"Regarding facial aesthetic analysis, which of the following statements is false?","o":["The face can be divided vertically into five equal zones with the width of the eye being one fifth.","The nasal labial angle in men should be 90-95 degrees","The nasal facial angle should be approximately 30-40 degrees","The Frankfurt plane is an imaginary line drawn from the inferior portion of the external auditory canal through the superior orbital rim","Goode’s method assesses the nasal tip"],"k":"D","x":"The Frankfurt plane is an imaginary line drawn from the superior cartilaginous external auditory canal through the infraorbital rim. Goode’s method is used to assess projection of the nasal tip and is defined by a line from the nasion to alar groove and a further line from the alar groove to the nasal tip, the ratio of the tip projection to nasal length should be 0.55—0.6 using this method.","d":"Rhinology","src":"SBA book · Rhinology · Q59"},{"s":"Which of the following laryngeal neoplasms has a female predominance?","o":["neurofibroma","granular cell tumor","hemangioma","paraganglioma","chondroma"],"k":"D","x":"Paragangliomas are the only laryngeal neoplasm with a female predominance.","d":"Laryngology","src":"Ballenger · Laryngoscopy · Q3"},{"s":"The ideal procedure for any patient with a disruption of the facial nerve is","o":["Primary repair","Grafting to reestablish continuity between the facial nerve nucleus and facial musculature","Temporalis muscle transposition","None of the above","A AND B"],"k":"E","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 63 · Q1"},{"s":"Which of the following is not closely related to the frontal recess?","o":["Agger nasi","Ethmoidal bulla","Middle turbinate","Lamina papyracea","Superior turbinate"],"k":"E","x":"The boundaries of the frontal recess are as follows:\n¢ Medially—middle turbinate\n¢ Laterally—lamina papyracea\n* Superiorly—frontal sinus drainage pathway * Posteriorly—ethmoid bulla\n¢ Anteriorly—agger nasi.","d":"Rhinology","src":"SBA book · Rhinology · Q19"},{"s":"Fibrous dysplasia of the orbital rim and maxillary sinus is causing diplopia and proptosis. The treatment should be","o":["radical maxillectomy.","maxillectomy and orbital exeneration, with palatal prosthesis.","maxillectomy with a microvascular osteocutaneous flap.","partial excision with contouring/sculpting of involved areas.","chemotherapy."],"k":"D","x":"This disease process is treated in symptomatic patients with sculpting of the involved bone resulting in partial excision. En bloc resection is not indicated.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q2"},{"s":"Which of the following statements about the creation of a permanent tracheostoma is true?","o":["The surrounding skin should directly abut the tracheal mucosa.","Permanent tracheostomas result in a longer tracheostomy tract than traditional tracheostomy stomas.","Granulation tissue is more likely to form in a permanent tracheostoma than a traditional tracheotomy stoma.","A permanent tracheostoma is more difficult to cannulate than a traditional tracheostomy tract.","None of the above are true."],"k":"A","x":"In creating a permanent tracheostoma, the skin should directly abut the tracheal mucosa. This procedure results in the advantages of decreased granulation tissue and a shorter tracheotomy tract as compared with a traditional tracheostomy stoma.","d":"Laryngology","src":"Ballenger · Airway Control and Laryngo-Tracheal Stenosis in Adults · Q4"},{"s":"Time post-onset of the facial paralysis is an important consideration in which of the following procedures?","o":["Temporalis muscle transposition","Greater auricular nerve graft","Free muscle grafting","All of the above","None of the above"],"k":"B","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 63 · Q4"},{"s":"A combined petrosal approach is appropriate for petroclival tumors that","o":["Are superior to the internal auditory meatus","Are inferior to the internal auditory meatus","Extend into the infratemporal fossa","A, B, AND C","A AND B"],"k":"E","x":"The combined petrosal approach is best suited for petroclival tumors that are both superior and inferior to the internal auditory canal. Otherwise, the middle fossa approach alone or a posterior approach alone can be used. The infratemporal fossa is not accessible with the combined petrosal approach.","d":"Otology","src":"Brackmann · Chapter 56 · Q1"},{"s":"Sutures: the following statement is false?","o":["Vicryl is absorbed via hydrolysis in 55—70 days","The difference between Vicryl and Vicryl Rapide lies in its tensile strength which for Vicryl Rapide is 50% at 5 days","Silk sutures are absorbed within 2—3 months","Monocryl is an absorbable monofilament","Polypropylene has a high tensile strength and is biologically inert, therefore causing minimal tissue reaction"],"k":"C","x":"Silk was one of the first non-absorbable sutures used. It is a natural suture produced from silkworm and is treated with silicone for strength and to allow easy passage through tissues. The advantages of silk include being easy to handle, a good ability to hold knots, and low tissue reactivity.","d":"H&N / Plastics / Trauma","src":"SBA book · General Otolaryngology · Q48"},{"s":"Incisional components of the midfacial degloving exposure include","o":["marginal rim incisions.","transcartilaginous lower lateral cartilage incisions.","intercartilaginous (between the upper and lower lateral cartilages) incisions.","hemitransfixion incision.","external columellar incision."],"k":"C","x":"The intercartilaginous incisions in combination with the piriform aperture and complete transfixion incision allow mobilization and retraction of the nasal tip and lower lateral cartilages out of the field. The advantage of this exposure is the lack of external incisions. The approach does carry the risk of lip numbness (temporary or permanent), vestibular stenosis, and oronasal or oroantral fistula.","d":"Rhinology","src":"Ballenger · Neoplasms of the Nose and Paranasal Sinuses · Q9"},{"s":"All of the following statements regarding verrucous carcinoma are true except","o":["it readily metastasizes to regional lymph nodes.","it presents as a slowly growing exophytic or warty neoplasm in the oral cavity.","the histologic appearance includes keratinized epithelium arranged in long, papillomatous folds with a “pushing” border.","recommended treatment for it is wide surgical excision.","recurrent lesions tend to be in the form of lessdifferentiated carcinomas."],"k":"A","x":"Choices B, C, D, and E all accurately describe verrucous carcinoma. True verrucous carcinoma does not have metastatic potential.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Oral Cavity and Oropharynx · Q3"},{"s":"The national tracheostomy safety project led to the design of laminated posters above the bed of all patients with a tracheostomy. When performing a new tracheostomy in a child, which of the following information is required on these posters?","o":["Size of suction catheter to be used","Depth of suction in centimetres","Number and place of any sutures left","Grade of laryngoscopy","All of the above"],"k":"E","x":"The national tracheostomy safety project led to the design of a laminated poster above the head of every patient with a tracheostomy.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q52"},{"s":"Concerning the embryology of the nose and paranasal sinuses, which of the following statements is false?","o":["The frontal sinus originates from pneumatization of the frontal recess and is usually not visible at birth","At 2 years of age, the floor of the maxillary sinus is usually higher than the floor of the nasal cavity","Failure of resorption of the nasobuccal membrane results in choanal atresia","An absence of nasal bones on intrauterine screening is associated with Down syndrome","Branchio-oto-renal syndrome is characterized by abnormal cilia function and chronic sinusitis"],"k":"E","x":"Branchio-oto-renal syndrome is characterized by abnormalities of the ear, branchial clefts, and renal dysplasia.\nThe frontal sinus originates from pneumatization of the frontal recess into the frontal bone, and is not usually visible at birth. It is usually complete by the age of 20.\nThe maxillary sinus undergoes two periods of rapid growth associated with dental development (3 years and 7—12 years). Initially the floor of the sinus is above that of the nasal floor, but later it is below the nasal floor.\nPrenatal markers for Down syndrome include absent or hypoplastic nasal bones.\nAbnormal cilia function is seen in Kartagener syndrome and primary ciliary dyskinesia.","d":"Rhinology","src":"SBA book · Rhinology · Q16"},{"s":"Patients who are to be considered for eyelid surgery include","o":["Those who are either symptomatic or who show signs of conjunctival or corneal injury, or both, despite maximum tolerated medical therapy","Those who require rapid ocular rehabilitation to resume their usual occupation and responsibilities","Those whose ocular status is currently stable but who are at high risk of corneal complications","All of the above","None of the above"],"k":"D","x":"","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 61 · Q1"},{"s":"The current treatment of choice for adductor spasmodic dysphonia is","o":["botulinum toxin injection into the thyroarytenoid muscle.","bilateral selective denervation.","recurrent laryngeal nerve avulsion.","voice therapy.","botulinum toxin injection into the cricothyroid muscle."],"k":"A","x":"Botulinum toxin injection of the thyroarytenoid muscle is currently considered the treatment of choice for patients with adductor spasmodic dysphonia (ADSD) owing to its high rate of effectiveness (> 90%), lack of serious or permanent side effects, and the fact that it causes no permanent alteration of laryngeal structures. Injection of the cricothyroid muscle is generally ineffective in ADSD but may benefit selected patients with abductor spasmodic dysphonia. For patients with ADSD who do not respond to botulinum toxin or who are unwilling or unable to tolerate repeated injections, recurrent laryngeal nerve avulsion or bilateral selective denervation may provide long-term control of symptoms.Voice therapy alone is usually not effective for the management of ADSD but may extend the symptomatic relief obtained from botulinum toxin injections.","d":"Laryngology","src":"Ballenger · Neurogenic and Functional Disorders of the Larynx · Q6"},{"s":"A 44-year-old man presents with a depressed left nasal bone following an alleged assault. He is noted to have reduced sensation to the nasal tip. Which nerve is likely to have been affected?","o":["External nasal branch of the anterior ethmoidal nerve","Supratrochlear branch of the ophthalmic nerve","Infratrochlear branch of the ophthalmic nerve","Superior labial branch of the facial nerve","Infraorbital nerve"],"k":"A","x":"Sensation to the dorsum and tip of the nose is supplied by the external nasal branch of the anterior ethmoidal nerve (V2). This emerges from between the nasal bones and the upper lateral cartilages.","d":"Rhinology","src":"SBA book · General Otolaryngology · Q35"},{"s":"Which subtypes of human papillomavirus (HPV) are associated with recurrent respiratory papillomatosis?","o":["11 and 16","6 and 16","6 and 11","16 and 18","6,11, 16, and 18"],"k":"C","x":"HPV subtypes 6 and 11 are associated with recurrent respiratory papillomatosis and are also associated with genital warts. HPV types 16 and 18 have most often been associated with cancer in the genital area.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q9"},{"s":"Histopathologic examination of a hemithyroidectomy specimen provides the diagnosis of medullary carcinoma. The most appropriate course of action is","o":["ablation with iodine (131I) and observation with periodic 123I scans.","total thyroidectomy.","total thyroidectomy with 131I ablation.","total thyroidectomy with ipsilateral radical neck dissection.","total thyroidectomy with ipsilateral radical and contralateral modified neck dissection."],"k":"E","x":"Medullary carcinoma does not take up radioiodide, so ablation with radioisotope is not effective. Because of the propensity for local microvascular invasion, late recurrence, and metastatic disease, aggressive surgical intervention is recommended.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Thyroid and Parathyroid Glands · Q4"},{"s":"Evaluation for a possible subarachroid hemorrhage should include any of the following except","o":["noncontrast head computed tomography.","lumbar puncture.","intra-arterial angiography.","funduscopy.","Doppler ultrasonography."],"k":"E","x":"The orderly evaluation of a patient with a possible subarachnoid hemorrhage proceeds from an examination including funduscopy to a noncontrast head computed tomography, to a lumbar puncture, to an angiography. Ultrasonography does not play a role.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q6"},{"s":"A 46-year-old man presents with a exophytic tumour arising from his right maxillary antrum extending onto the hard palate and anterior maxillary wall only. It has not invaded the orbital walls or involved his subcutaneous tissues. A biopsy is reported as squamous cell carcinoma. According to the TNM (8th edition) classification, what stage would this tumour be?","o":["T1","T2","T3","T4a","T4b"],"k":"B","x":"Maxillary sinus TNM classification (AJCC). Primary tumour (T):\n¢ 71: tumour limited to the antral mucosa with no erosion or destruction of bone.\n¢ 72: tumour causing bony erosion or destruction including extension to hard palate and/or middle meatus, except extension to posterior antral wall or pterygoid plates.\n¢ 13: tumour invading any of posterior antral wall, subcutaneous tissues, floor or medial orbit wall, pterygoid fossa, and ethmoid sinuses.\n¢ 4a: tumour invades anterior orbital contents, skin of cheek, pterygoid plates, infratemporal fossa, cribriform plate, sphenoid or frontal sinuses.\n¢ T4b: tumour invades any of orbital apex, dura, brain, middle cranial fossa, cranial nerves other than V(b), nasopharynx, and/or clivus.","d":"Rhinology","src":"SBA book · Rhinology · Q10"},{"s":"According to the Physicians’ Desk Reference, what proportion of cardiac medications are associated with adverse taste-related side effects?","o":["~ 10%","~ 25%","~ 50%","~ 75%","~ 90%"],"k":"B","x":"Drug-related adverse effects in the elderly can be quite debilitating and can lead to decreased food intake and malnutrition. Among agents that produce altered tastes are antilipemic agents (eg, cerivastatin, fenofibrate, atorvastatin, gemfibrozil, lovastatin), adrenergic stimulants (eg, methyldopa), angiotensin-converting enzyme inhibitors (eg, captopril, enalaparil), calcium channel blockers (eg, diltiazem, amlodipine), and antiarrhythmics (sotalol, amiodarone). Unfortunately, cessation of medication does not always result in resolution of taste alterations, which can be quite long lasting and debilitating.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q5"},{"s":"Asymmetric hearing loss in legal claimants for noise-induced hearing loss","o":["rules out noise-induced hearing loss.","may be caused by noise exposure.","is attributable to leisure pursuits.","may be caused by a cerebellopontine angle lesion.","is a common sign of malingering."],"k":"D","x":"Cerebellopontine angle lesions occur in industrial workers, as in the rest of the population, and are a rare cause of asymmetric hearing loss in legal claims, but they must be ruled out. Asymmetric hearing loss is an infrequent way of malingering in industrial hearing loss claims; however, it is much more common after head injury. It may be caused by leisure activities involving noise exposure such as small arms fire.","d":"Otology","src":"Ballenger · Occupational Hearing Loss · Q7"},{"s":"A 35-year-old female is referred to the on-call ENT team, having eaten a lamb chop the day before, and has had a persistent foreign body sensation on swallowing. The patient is systemically well and observations are normal. The lateral soft tissue X-ray you have arranged is shown. What is the next best course of action?","o":["Arrange a barium swallow","Arrange a MRI neck","Plan an oesophagoscopy under general anaesthetic","Admit, manage conservatively, and review the next day","Reassure and discharge"],"k":"C","x":"The lateral soft tissue radiograph depicts a number of abnormal findings. The cervical spine has lost its lordosis. There is a foreign body of bone density in the upper oesophagus with air trapping around it. Urgent removal by rigid oesophagoscopy is warranted.\nDysphagia and odynophagia are the commonest symptoms of a foreign body, together with a history of ingesting a foreign body. Signs and symptoms of mediastinitis complicating a perforated oesophagus include chest pain, increased respiratory rate, pulse, and temperature.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q46","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAA  · Otosclerosis · Q4"},{"s":"Which of the following characteristics of stridor is true with laryngomalacia?","o":["It is usually biphasic.","It is inspiratory only.","It is expiratory only.","It is usually not present.","None of the above."],"k":"B","x":"The characteristics of stridor vary with the site and degree of obstruction. Most supraglottic lesions produce stridor during inspiration. In the supraglottis, as the velocity of the airflow increases, the intraluminal negative pressure draws soft tissue into the airway during inspiration, increasing the degree of obstruction. Obstruction in the distal part of the respiratory tract increases during expiration as the trachea and bronchi constrict.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q1"},{"s":"A perilymphatic fistula should be suspected in which circumstance?","o":["progressive hearing loss and episodic vertigo after a temporal bone fracture","sensorineural hearing loss after a closed head injury","persistent unsteadiness after a blast injury","dizziness awakening the patient from sleep after a gunshot wound to the head","after a whiplash injury"],"k":"A","x":"In the setting of trauma, with progressive hearing loss and episodic vertigo, a perilymphatic fistula should be suspected. The clinician should remember that there are no specific patterns to diagnose conclusively a perilymphatic fistula.","d":"Otology","src":"Ballenger · Trauma to the Middle Ear, Inner Ear, and Temporal Bone · Q6"},{"s":"An individual has a 35 dB hearing level (loss) at age 5 years only in his left ear because of a viral infection (mumps). At age 75 years, the hearing level in his right ear is 35 dB. What is the predicted hearing level in his left ear at age 75 years?","o":["35 dB","38 dB","41 dB","70 dB","none of the above"],"k":"D","x":"Additivity in dB, thus 35 dB plus 35 DB = 70 dB. Using intensity, 35 dB plus 35 dB = 38 dB or, using pressure, 35 dB plus 35 dB = 41 dB.","d":"Otology","src":"Ballenger · Presbyacusis · Q2"},{"s":"A 60-year-old man undergoes a laryngectomy and ipsilateral neck dissection for a T3, N1 laryngeal carcinoma. Which of the following would not, on its own, be an indication for postoperative radiotherapy?","o":["Extracapsular spread","Multiple involved lymph nodes","Multiple levels of nodes affected","Maximal lymph node size 3 cm","Close excision margins"],"k":"D","x":"Postoperative radiotherapy should be given to any patient at high risk of locoregional recurrence. All of the options except D should ideally receive radiotherapy.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q44"},{"s":"Which of the following statements concerning the embryogenesis of the ear is false?","o":["The otocyst forms the inner ear membranous structures.","The endolymphatic duct develops first at the 6 mm stage, followed by the appearance of the semicircular ducts and the cochlear diverticulum.","By the end of the seventh month, the cochlea becomes fully coiled.","The first indications of aural ontogenesis are the first and second branchiomeric structures and the otic placode.","The cochleovestibular ganglia develop from the otic placode epithelium."],"k":"C","x":"In the 3 to 4 mm embryo (3 to 4 weeks), the first indications of aural ontogenesis are the first and second branchiomeric structures and the otic placode. The placode invaginates to first form a pit and then a vesicle detached from its surface origin. This otocyst forms the inner ear membranous structures, with the endolymphatic duct developing first in the 6 mm embryo, followed by the appearance of the semicircular ducts and the cochlear diverticulum in the 15 mm embryo (6 weeks). By the end of the third month, the cochlea is fully coiled. The cranial nerves entering the otocyst exert an inductive influence to produce neuroepithelium. The cochleovestibular ganglia develop from the otic placode epithelium.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q1"},{"s":"The most common microorganism causing acute bacterial parotitis is","o":["Streptococcus viridans.","Haemophilus influenzae.","anaerobic bacterium.","Staphylococcus aureus.","Pseudomonas aeruginosa."],"k":"D","x":"Staphlococcus aureus is the most common microorganism associated with acute bacterial sialadenitis. Streptococcus viridans is a common infectious agent in chronic and recurrent sialadenitis.","d":"H&N / Plastics / Trauma","src":"Ballenger · Diseases of the Salivary Glands · Q9"},{"s":"A patient with sudden sensorineural hearing loss reports that she had skin rash and joint pain about a month ago. Your workup should include","o":["computed tomography.","otoacoustic emissions.","serologic tests.","complete blood count.","electronystagmography."],"k":"C","x":"This history suggests the possibility of Lyme disease, and confirmatory serologic tests are indicated. Otoacoustic emissions, electronystagmography, or complete blood count is unlikely to contribute to management. Acoustic tumor is always a possibility with sudden sensorineural hearing loss, but computed tomography is rarely the right choice for imaging these tumors.","d":"Otology","src":"Ballenger · Idiopathic Sudden Sensorineural Hearing Loss · Q5"},{"s":"Which of the following statements concerning the management of aural atresia is false?","o":["A gap interrupting the ossicular chain’s continuity occurs most commonly at the incudomalleolar joint.","A fixed ossicular chain could be owing to a fixed stapedial tendon.","A mobile stapes is a favorable prognostic indicator of a good hearing outcome.","To maximize the likelihood of a successful outcome, hearing reconstruction in these patients should be conducted by an experienced otologist.","Deficiencies of the long process of the incus can be corrected by either interposing the reshaped incus between the mobile stapes and the malleus handle or using an alloplastic prosthesis."],"k":"A","x":"Before assuming the responsibility of correcting congenital conductive hearing losses and embarking on a procedure with significant potential complications, especially in children, the otologic surgeon must have sufficient experience to maximize the likelihood of a successful outcome. Once the middle ear is entered, the surgeon must decide if the chain is fixed, and if it is, where is the fixation? Is it in the epitympanum? Is the stapes fixed? Or is it a fixation of the stapedial tendon? A gap interrupting the ossicular chain’s continuity occurs most commonly at the incudostapedial joint. The presence of a mobile stapes facilitates the surgery and greatly improves the surgical result. If there is a small distance between the stapes capitulum and the long process of the incus, a tragal cartilage graft can successfully negotiate the gap. Deficiencies of the long process of the incus can be corrected by either interposing the reshaped incus between the mobile stapes and the malleus handle or using an alloplastic prosthesis designed for this purpose (type III tympanoplasty). When the stapes arch is absent, similar procedures can be performed to bridge the gap from either the malleus handle or the undersurface of the drumhead to the mobile footplate (type IV tympanoplasty). A coexisting fixation of the stapes or obstruction of the oval window by the facial nerve increases the technical difficulty, yields poorer hearing results, and increases the chances of complications, such as sensorineural hearing loss or facial nerve injury.","d":"Paediatric","src":"Ballenger · Microtia, Canal Atresia, and Middle Ear Anomalies · Q8"},{"s":"Chordomas are rare malignant neoplasms arising from","o":["primitive notochordal remnants.","Rathke’s pouch.","the pharyngeal hypophysis.","parasellar and third ventricular regions.","the craniopharyngeal canal."],"k":"A","x":"Chordomas arise from primitive notochordal remnants. Rathke’s pouch and the pharyngeal hypophysis, which is anterior to Thornwaldt’s bursa, are one and the same. This is an area of endoderm in the nasopharynx that may remain connected to the primitive notochord but is not the site of origination of chordomas. Craniopharyngiomas arise in the parasellar region. The craniopharyngeal canal, which runs from the sella turcica through the body of the sphenoid and is also associated with cysts owing to the persistence of Rathke’s pouch, is not the site of origination of chordoma.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Head and Neck · Q4"},{"s":"Appropriate initial therapy for acute bacterial sinusitis includes","o":["antibiotics alone.","antibiotics and decongestants.","antihistamines, antral puncture and lavage, and decongestants.","antihistamines and topical decongestants.","antibiotics and topical nasal corticosteroids."],"k":"B","x":"The goal of initial therapy is to prevent disease progression and the possibility of serious sequelae.Appropriately selected antibiotics are the mainstay of therapy for acute sinusitis. Systemic and topical decongestants relieve nasal obstruction, re-establish ostial patency, and ventilate the sinuses. The use of decongestants in conjunction with antibiotics has been shown to be more effective than antibiotics alone.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q5"},{"s":"You are called to see a 3-day-old baby born to a lady of Afro-Caribbean descent. The child was born full term in the breech position by vaginal delivery. The child has a firm palpable mass in the region of the right sternocleidomastoid muscle. What is the most appropriate management?","o":["Fine needle aspiration cytology","Massage and observation","Surgical exploration","Commence antituberculous therapy","Intralesional sclerosant injections"],"k":"B","x":"This is likely to be a haematoma of the sternocleidomastoid muscle. Conservative and supportive measures are the most appropriate first stage of therapy.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q4"},{"s":"In general, the problem of late glottic insufficiency after laryngeal trauma may be addressed by all of the following except","o":["medialization laryngoplasty.","reconstruction with laryngeal stenting and grafting.","fat injection.","speech rehabilitation","supraglottic laryngectomy."],"k":"E","x":"Supraglottic laryngectomy would be an appropriate choice if the problem is laryngeal stenosis and not laryngeal insufficiency.","d":"Laryngology","src":"Ballenger · Trauma to the Larynx · Q9"},{"s":"Bat ear deformities as a result of a lack of an antihelical fold are due to abnormal development of which structure?","o":["First hillock of His","Second hillock of His","Third hillock of His","Fourth hillock of His","Fifth hillock of His"],"k":"D","x":"The auricle develops from the six hillocks of His. The first three from the first branchial arch and the latter three from the second. The first three hillocks form the tragus, helical crus, and helix. The fourth hillock forms the antihelix, the fifth the scapha, and the sixth the lobule.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q27"},{"s":"Branchio-oto-renal syndrome may be associated with the following, except","o":["dilated vestibular aqueduct.","autosomal recessive inheritance.","mutations in EYA1.","renal anomalies.","marked phenotypic variability."],"k":"B","x":"Branchio-oto-renal syndrome is inherited in an autosomal dominant fashion. It may be associated with a dilated vestibular aqueduct, although this is more characteristic of Pendred’s syndrome. Branchio-oto-renal syndrome is associated with mutations in EYA1, although in 70% of cases, mutations have not been found. Renal anomalies occur in up to 75% of cases. Branchio-oto-renal syndrome exhibits marked phenotypic variability, which suggests that it may be a heterogeneous disease. This was recently confirmed with the identification of a second locus.","d":"Otology","src":"Ballenger · Hereditary Hearing Impairment · Q3"},{"s":"Treatment options do not currently include:","o":["Discontinuing topical antidecongestants","Instillation of local irritants","Augmentation of the nasopharyngeal Eustachian tube orifice","Injection of Botox to the tensor veli palatine"],"k":"D","x":"","d":"Otology","src":"Brackmann · Chapter 7 · Q5"},{"s":"Gradenigo syndrome is characterized by all of the following except:","o":["Diplopia","Retro-orbital pain","Petrous apex abscess","Otorrhoea","Cranial nerve V and VI involvement"],"k":"D","x":"Gradenigo syndrome is caused by petrous apicitis and comprises a triad of diplopia (secondary to cranial nerve VI palsy as it swells within Dorello’s canal), retro-orbital pain, and otorrhoea.","d":"Otology","src":"SBA book · Otology & Neuro-otology · Q43"},{"s":"Supraglottic carcinoma","o":["arises from pseudostratified squamous epithelium.","most commonly originates on the aryepiglottic folds.","displays aggressive features earlier than glottic carcinoma.","spreads through lymphatics of the cricothyroid membrane.","rarely presents with nodal metastases."],"k":"C","x":"Supraglottic carcinoma typically arises on the epiglottis and behaves aggressively at an earlier point than most glottic carcinomas. Nodal metastases are present in 30% of patients with clinically N0 necks. Lymphatic spread occurs bilaterally, exiting the thyrohyoid membrane with the superior laryngeal vessels to involve cervical levels II and III first. The unique drainage pathways of the supraglottis are attributable to an embryonic origin that is separate from the rest of the glottic and subglottic larynx, such that inferior spread via the cricothyroid membrane does not occur.","d":"H&N / Plastics / Trauma","src":"Ballenger · Neoplasms of the Larynx and Laryngopharynx · Q2"},{"s":"Please see the figure. The following are all acute radiotherapy side effects except:","o":["Skin reaction seen in figure","Xerostomia","Otitis media with effusion","Lhermitte’s sign","Mucositis"],"k":"D","x":"Lhermitte’s sign is an electric shock sensation felt from the nape of the neck to the tips of the limbs on flexing the neck. It usually develops a few months after radiotherapy and is self-limiting.\nThe acute skin reaction in the photograph was taken 1 week after completion of radiotherapy for early laryngeal carcinoma.","d":"H&N / Plastics / Trauma","src":"SBA book · Head & Neck Surgery · Q66","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAPmA+gBAREA/8QAHAAAAgMBAQEBAAAAAAAAAAAAAgMAAQQFBgcI/8QARhAAAgIBBAEDAwIEAwUGBAQHAQIAEQMEEiExQRMiUQVhcTKBFJGhsQYjQhUzUrLRNVNicnPBJCVDkjREVIKi4RZj8PEm/9oACAEBAAA/ANmsGb/aWpYFgPWfz9zHYsrnguR88xWtyHYFDn+c5OdHBLeo1/mFjyuQKdv5zoaJ8ivuctQ+8rWfUKelc1+ZwsmXJm1Zbc9E/M7mmDeiNrt18wcoyUQWa/zMGLUOmYqWYG67nX0284928/zlZi71TNx94l1zBSGLA+O+YrFmz4n/AFNxD1mbI6Ahzf5mXFnbm8hv8zZh1DUbZuB8zJqC7te5v5zRk0+ZdOuRNxFc8zEuZnbh2/YwxlcEnc3H3m7S/VnxgKTx+Y/W/UA+G1yEH7GadLjfJofWbKxNeDPJ/UvquQZyquwo/Mwt9a1uJgVckXPQn6p/F/Tsbb23DkibMgOt+nK2NmLqPBnFZ8iMMeRmBJ8kxes0zY6YZH55/VMYyso9zsP3gHVEkAO1A/M6eMLrNIAuUjIOhc5eRc2JyjM4b8xeTHmyLQdv5zLjy6rTubZiPi48a1m7dx+SYxdTkX9OR/5zVo9flL7Wdjf3jdVlZn5dr/MUr5D/AK2r8wMmRx1kY/8A7oWjz5MWoUs7c98zTrGBzX6je77zBqNaMWVUR2HjubH1r5tOuMswK/eaPo+vbS6nczNt/M0/Uz62Q58TsL7AMRpdbtBR3avHMbkw+qN+PI1n/wAUybtRhycswHzcrU/Uc6AAMa80Zg/2kWsPke7+TNeD6syocZy2COLMy5c4I4yNZ+8HC+TeCHcgHrdOvh0eP6jjIDsmUD/iM5uo0Wp02bYzPuH/AIoaZ8+NSjMw/JhDKGX/ADcrWPvGLhZ03YszH7EyLqNRp7BdiB94rV/UzqlTG5ax94r+E1bD1NIxcfG7mHpNfq8T+nqdwF8gzplMOdbXOVf/AM052XTaoOxTKWHn3TDnfKg9zsD/AOYzOubKCSMjX/5jH4tXmx2d7H95qx6wZQBkdwT8Exuqy6nCoOnRiK7ucN8ud8rMWez9zG6f6lqMGQFWY14szVnzDVp6mFnXL5TceZeLT5SBk1GZsaD79zYv1N8KHDoloHjcezH6fVZ8JU6jK3q9hQepn1+vybzlyZGfKegDwJgw6nKH9Uu24G+40/VtaWZceZ/cerm5F12VEfUZyoPZZpuw6fTooRXYEmzkZoa6HQ48/qa/6g43c+wzSmX6dixuNDlyEk8u5PAnK1GofNmJR2KLwvPiJzZMhK+9v5wUztuIJP5uT1Xb27m/YwcxcYy5yOT9zOJmy5GRryMLb/ilDLk4rI3/ANxjgchIJyv/ADl5MuQYyQ73+YOHNlayzMP3Mf6mQcjI384/R5HAJLtZP/FF49Q66wBsj0TRonqdXFmbHnxnBlyEuSFxuT5nf+n6Rqx+nhzHMCCS9hVPzPR6f
