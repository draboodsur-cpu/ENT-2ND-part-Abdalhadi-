carpet can be useful."],"k":"C","x":"A variety of measures can be taken by patients with dust mite allergy. Measures to reduce exposure to dust mites concentrate on the bedding. These include replacing feather pillows and bedspreads with synthetic ones that can be washed in hot water. Covering mattresses with small-pore plastic sheeting is beneficial. Removing carpets and frequent vacuuming also help. Acaricidal products can directly kill mites. Maintaining a relative humidity (RH) of less than 50% is one recommendation for reducing the number of house dust mites and their allergens in homes. A recent study showed than allergen levels were more than 10 times lower in low-RH homes compared with humid homes and suggested that it is possible to maintain an indoor RH of less than 51% during the humid summer season. Hence, dehumidifiers are effective tools in dust mite control.","d":"Rhinology","src":"Ballenger · Allergic Rhinitis · Q5"},{"s":"Approximately how many taste buds are there on the human tongue?","o":["2,600","4,600","26,000","46,000","260,000"],"k":"B","x":"Even though, on average, the human tongue is said to contain approximately 4,600 taste buds, very large individual differences are present. In general, damage to a given taste nerve results in a decrease or even total loss of taste buds innervated by that nerve. Overall, taste threshold sensitivity is directly related to taste bud number.","d":"Rhinology","src":"Ballenger · Olfaction and Gustation · Q10"},{"s":"Vesicular eruption associated with Ramsay Hunt syndrome occurs in the following locations except the","o":["concha of the auricle.","posteromesial surface of the auricle.","mucosa of the palate.","anterior two-thirds of the tongue.","preauricular skin."],"k":"E","x":"Based on Dr. Hunt’s original papers, the sensory distributions reflected by varicella-zoster virus recrudescence include all of the sites mentioned above, with the exception of preauricular skin. The concha is the most common site of vesicular eruption.","d":"Otology","src":"Ballenger · Facial Paralysis · Q6"},{"s":"A 50-year-old man presents with a right-sided 30 dB conductive hearing loss without other symptoms. Physical examination shows a large, uninfected attic erosion with keratinized epithelial debris filling the defect. A fistula test is negative, although the patient subjectively is slightly dizzy with negative pressure. A computed tomography scan shows an aerated middle ear, erosion of the scutum, and opacification of the upper two-thirds of the mastoid. Which of the following is most likely to be found at surgery?","o":["erosion of the tegmen mastoideum","erosion of the tympanic segment of the fallopian canal","lateral sinus thrombosis","serous labyrinthitis","epidural abscess"],"k":"B","x":"Large, clinically silent cholesteatomas are most likely to erode much of the tympanic segment of the fallopian canal and be in direct contact with the facial nerve over large distances. Less often they cause erosion of the tegmen tympani and lateral semicircular canal fistulae. Without infection, an epidural abscess is unlikely. This patient’s subjective response to the fistula test is more likely to be secondary to a lateral semicircular canal fistula than serous labyrinthitis.","d":"Otology","src":"Ballenger · Cranial and Intracranial Complications of Acute and Chronic Otitis Media · Q4"},{"s":"Which of the following are options for vascularized tissue repair of endonasal skull base defects?","o":["Temporoparietal fascial flap","Nasal septal mucosal flap","Turbinate flap","All of the above","None of the above"],"k":"D","x":"All are potential candidates for a vascularized flap.The nasal septal flap is the most versatile given its size and location. However, it usually must be harvested during the approach.","d":"Rhinology","src":"Brackmann · Chapter 55 · Q4"},{"s":"Masking","o":["does not play a significant role in tinnitus treatment.","is underused and should be widely promoted.","can be used but only together with alprazolam (Xanax).","should be used only for patients with tinnitus and hyperacusis.","is effective when maskers are tuned to tinnitus pitch."],"k":"A","x":"Masking did not withstand the test of time and is rarely used.","d":"Otology","src":"Ballenger · Tinnitus and Hyperacusis · Q3"},{"s":"Which of the following statements regarding the third and fourth branchial arches is false?","o":["The only muscle derived from the third arch is the stylopharyngeus","The third branchial arch contributes to the lesser horn and upper body of the hyoid bone","Third and fourth branchial cleft anomalies may present with recurrent thyroiditis","Third branchial cleft fistulas pierce the thyrohyoid membrane and enter the lateral wall of the pyriform fossa","Fistulae may be treated endoscopically initially"],"k":"B","x":"Third and fourth branchial arch abnormalities are rare and often present as recurrent deep space neck infections or thyroiditis. The third branchial arch contributes to the greater horn and lower body of the hyoid bone while the fourth brachial arch contributes to the laryngeal cartilages.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q35"},{"s":"Aminoglycoside ototoxicity can be prevented in experimental animals by pretreatment with salicylates. The reason for the efficacy of salicylates against aminoglycoside ototoxicity is that salicylates","o":["increase the excretion of aminoglycoside antibiotics in the urine.","block the access of aminoglycoside antibiotics to the inner ear tissues.","chelate iron and prevent it from reacting with the aminoglycoside antibiotics.","accelerate the metabolism of aminoglycoside antibiotics and render them nontoxic to the inner ear.","accelerate the elimination of aminoglycoside antibiotics from the cochlea."],"k":"C","x":"Salicylates do not appear to affect the metabolism or excretion of aminoglycoside antibiotics, nor do they appear to alter the distribution of aminoglycosides to the cochlear tissues. They appear to act by chelating iron, making it less available for combining with aminoglycosides to form free radicals, which can damage both the cochlea and kidney.","d":"Otology","src":"Ballenger · Ototoxicity · Q1"},{"s":"Prior to mastoid surgery in a 100 kg man, you decide to infiltrate the postauricular area with Lignospan via a dental syringe. Each vial of Lignospan contain is 2.2 mL and contains 2% lidocaine with 1:80,000 adrenaline. How many vials can you safely use?","o":["3","5","7","9","11"],"k":"E","x":"The safe dose of lidocaine with adrenaline is 7 mg/kg (3 mg/kg without adrenaline) to a maximum dose of 500 mg. Each vial of Lignospan contains 44 mg, therefore 11 vials can be used.","d":"Otology","src":"SBA book · General Otolaryngology · Q52"},{"s":"Vertigo control with cochleosacculotomy is","o":["99%","50%","65%","Improved with time","Predictable by the presence of immediate nystagmus"],"k":"C","x":"","d":"Otology","src":"Brackmann · Chapter 39 · Q4"},{"s":"In relation to the allergic response, which of the following statements is true?","o":["The early phase of the allergic response is primarily histamine mediated","The early phase of the immune response involves the degranulation of dendritic cells","The early phase occurs within 30-60 minutes of exposure to a previously sensitized antigen","Corticosteroids primarily affect the early phase of the allergic reaction","It never results in cobble-stoning of the posterior pharyngeal wall"],"k":"A","x":"Allergies represent type I hypersensitivity reactions as per the Gel and Coombs classification. They are mostly immunoglobulin G (IgE) mediated. There are two major phases for allergic response; the first being the sensitization phase where exposure of the immune system to the allergen causes induction of the IgE antibody; the IgE antibody then binds to mast cells. The second phase is termed the reaction phase; further exposure to the allergen allows binding to the mast cell—IgE antibody complex. Degranulation of the mast cells subsequently occurs causing the\nrelease of mediators such as histamine, heparin, proteases, prostaglandins, and kinases. These mediators initiate the symptoms we associate with rhinitis and asthma. The nature and severity of the allergic response varies between individuals and is dependent on the route of exposure and the degree of sensitization; the severest reaction being circulatory collapse associated with anaphylaxis.\nThe immediate or early phase response to allergy occurs within minutes of exposure to the antigen with vascular permeability and smooth muscle contraction. The late phase typically occurs within 4-8 hours mediated by eosinophils and Th2 helper cells recruited by chemoattractants in the early phase. This phase is generally associated with further smooth muscle contraction and sustained oedema. Corticosteroids generally affect the late phase although there is evidence they may inhibit histamine synthesis.","d":"Rhinology","src":"SBA book · Rhinology · Q44"},{"s":"The lateral extent of access via endoscopic endonasal approach at the level of the superior orbit is","o":["Lamina papyracea","Periorbita","Midorbital line","Medial rectus muscle","Anterior ethmoidal artery"],"k":"C","x":"Following removal of the lamina papyracea, the periorbita can be gently displaced laterally to allow access to lesions above the orbit as far lateral as midorbit.","d":"Rhinology","src":"Brackmann · Chapter 55 · Q1"},{"s":"A patient presents with cerebrospinal fluid (CSF) rhinorrhoea. What are the likely signal characteristics of CSF on MRI?","o":["High-intensity signal on T1-weighted imaging","Low-intensity signal on T2-weighted imaging","High-intensity signal on T2-weighted imaging","Enhancement following administration of gadolinium","MRI poorly identifies CSF"],"k":"C","x":"CSF has a high-intensity signal on T2-weighted imaging and a low-intensity signal on T1- weighted images.","d":"Rhinology","src":"SBA book · Rhinology · Q13"},{"s":"Diagnosis of giant cell arteritis","o":["is likely in young men.","carries a low risk of blindness.","is confirmed with an elevated sedimentation rate.","currently requires an arterial biopsy.","is suspected for occipital headaches."],"k":"D","x":"Giant cell arteritis is most likely to occur in women over 50 years of age, with an elevated sedimentation rate and a temporal headache. The risk of blindness is 15%; therefore, treatment should be initiated urgently. Confirmation of the diagnosis is made on the histopathology of a temporal artery biopsy.","d":"Rhinology","src":"Ballenger · Headache and Facial Pain · Q7"},{"s":"Cystic fibrosis is","o":["an autosomal dominant inherited condition.","associated with dextrocardia and bronchiectasis.","invariably fatal.","diagnosed with abnormal ciliary beat frequency and cilial ultrastructure.","associated with nasal polyposis in childhood."],"k":"E","x":"In cystic fibrosis, the condition has an autosomal recessive inheritance, and the defect primarily affects the secretions, so ciliary beat frequency and ultrastructure are normal. Bronchiectasis and dextrocardia are features of PCD and not cystic fibrosis. However, any child presenting with nasal polyposis should be suspected of having cystic fibrosis and submitted to the appropriate sweat tests and deoxyribonucleic acid (DNA) evaluation. Up to 30% of children and 50% of adults with cystic fibrosis suffer from nasal polyposis, and the majority have some degree of chronic rhinosinusitis.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q5"},{"s":"Duration of antimicrobial therapy in a patient with malignant external otitis is determined by","o":["serum glucose level.","electroneuronography.","gallium scan and erythrocyte sedimentation rate.","magnetic resonance imaging.","relief of symptoms."],"k":"C","x":"A gallium scan is best for monitoring resolution of disease and is useful in determining the duration of antimicrobial therapy. The erythrocyte sedimentation rate is a nonspecific test but is useful in following the response to antibiotics. Although relief of pain is the first indication of a favorable response to therapy, it is not useful in determining how long therapy should be continued. Likewise, serum glucose levels, although important, and electroneuronography do not predict how long therapy should be continued.","d":"Otology","src":"Ballenger · Diseases of the External Ear · Q7"},{"s":"Blood supply to the tonsil: which of the following arteries does not directly supply the tonsil?","o":["Maxillary artery","Dorsal lingual arteries","Tonsillar artery","Ascending palatine artery","Descending palatine artery"],"k":"A","x":"The arterial supply of the tonsils is derived from the descending palatine artery, the ascending pharyngeal artery, the tonsillar branch of the facial artery, the ascending palatine artery, and the dorsal lingual branch of the lingual artery. Venous blood drains through the lingual and pharyngeal veins in to the internal jugular vein.","d":"General","src":"SBA book · General Otolaryngology · Q55"},{"s":"Which of the following techniques would NOT be appropriate for closure of persistent CSF rhinorrhea after translabyrinthine acoustic neuroma surgery?","o":["Ear canal closure with Eustachian tube and middle ear obliteration (blind sac closure)","Wound exploration and reclosure with new abdominal fat graft","Middle fossa obliteration of the Eustachian tube","Lumbar drainage"],"k":"C","x":"Since the patient no longer has hearing, middle fossa surgery to obliterate the Eustachian tube is not indicated after translabyrinthine surgery.","d":"Otology","src":"Brackmann · Chapter 60 · Q3"},{"s":"A 47-year-old woman attends your clinic. She is a heavy smoker and is concerned that her voice is low-pitched and occasionally hoarse. Her larynx has the following appearance. You plan to take her to theatre. What is your first priority in her surgical management?","o":["Stripping of the vocal cords","Incision and drainage of the oedema on one side","Incision and drainage of the oedema on both sides","Close examination of the post-cricoid region","To take biopsies"],"k":"E","x":"Although you will wish to drain the oedema, and some surgeons would advocate this as part of the procedure, the first priority should be to take biopsies of any suspicious areas to exclude malignancy.","d":"Laryngology","src":"SBA book · Head & Neck Surgery · Q25"},{"s":"Cytokines responsible for the migration of eosinophils in chronic sinusitis include","o":["interferon-γ and histamine.","interleukin-4 and interleukin-5.","tumor necrosis factor-α and major basic protein.","interleukin-1 and interleukin-2.","eosinophilic cationic protein and interleukin-3."],"k":"B","x":"Interleukin-4 and interleukin-5 are produced in the sinus mucosa by resident cells and infiltrating lymphocytes. These cytokines work in concert to induce the migration of eosinophils and prolong their survival. The presence of eosinophils is characteristic of chronic sinus inflammation and contributes to the pathogenesis of the disease.","d":"Rhinology","src":"Ballenger · Sinusitis and Polyposis · Q2"},{"s":"What is the best method, when possible, for repairing a facial nerve injury where the nerve ends are visible during surgery for removal of a cerebellopontine angle neoplasm?","o":["Cable grafting","Primary tension-free anastomosis","Hypoglossal-facial anastomosis","Cross-facial grafting","Temporalis muscle dynamic reanimation"],"k":"B","x":"Primary anastomosis of nerve ends, without tension, is the preferred method for repairing discontinuities of the facial nerve. Cable grafting requires more than one suture line, but should be used in cases where a tensionless anastomosis is impossible.The other options are appropriate when direct facial nerve repair has failed to reanimate the facial palsy.","d":"H&N / Plastics / Trauma","src":"Brackmann · Chapter 62 · Q1"},{"s":"A 14-year-old girl complains of unilateral nasal obstruction that has been long-standing. This is associated with unilateral discharge that can be discolored. On examination, the left side of the nose is narrowed, and although the middle meatus looks normal, a clear view of the entire nasal cavity cannot be obtained with either rigid or flexible endoscopy. The next most useful investigation would be","o":["a computed tomography (CT) scan in both coronal and axial planes.","acoustic rhinometry.","a microbiology swab taken from the middle meatus.","examination under anesthesia.","surgical correction of the deviated nasal septum and reduction of the inferior turbinate."],"k":"A","x":"The differential diagnosis would include chronic rhinosinusitis, unilateral choanal atresia, the presence of a foreign body, and any other pathology in the postnasal space. A CT scan performed in both the coronal and axial planes would enable these conditions to be distinguished and appropriate treatment undertaken. Although acoustic rhinometry can help to quantify the topography of the nose, it becomes increasingly less accurate in the posterior part of the nasal cavity and postnasal space and may be distorted by the presence of secretions. Microbiology, although it may demonstrate the presence of infection, particularly anaerobes in association with a foreign body, will not help definitively to distinguish these conditions. An examination under anesthesia may be ultimately required; it should not be undertaken without appropriate imaging. A considerable amount of septal and turbinate surgery is undertaken inappropriately without the elimination of other contributory or underlying pathology.","d":"Rhinology","src":"Ballenger · Acute and Chronic Nasal Disorders · Q8"},{"s":"Encephaloceles occur most commonly with what other condition?","o":["Chronic otitis media","Head trauma","Idiopathic","Previous mastoid surgery","Arachnoid granulations"],"k":"D","x":"In 1989, Iurato reviewed 139 cases of temporal bone and encephalocele, and 59% occurred as a complication of previous mastoid surgery.","d":"Otology","src":"Brackmann · Chapter 20 · Q1"},{"s":"Regarding tracheo-oesophageal fistula, which of the following statements is true?","o":["It is more common in females","Type II is the most common type","It has an association with dystopia canthorum","It has a close association with vascular anomalies","It may be diagnosed on antenatal ultrasonography"],"k":"E","x":"Tracheo-oesophageal fistulas are more common in males and type I is the most common. There is rarely an association with vascular anomalies. Impairment of fetal swallowing may lead to polyhydramnios on ultrasonography.\nDystopia canthorum is associated with Waardenburg syndrome.","d":"Paediatric","src":"SBA book · Paediatric Otolaryngology · Q22"},{"s":"Laryngoceles","o":["are symptomatic only when filled with air or fluid.","are easily diagnosed with lateral radiographs.","are symptomatically consistent.","are easily diagnosed with direct laryngoscopy.","cannot be diagnosed except at autopsy."],"k":"A","x":"Laryngoceles are only symptomatic when filled with air or fluid, so the symptoms are inconsistent or intermittent. The diagnosis is made with direct laryngoscopy with the aid of radiographs, including lateral and frontal cervical views.","d":"Paediatric","src":"Ballenger · Congenital Anomalies of the Larynx · Q6"},{"s":"The advantages of dissection in the favorable tissue planes in the nose include all except one of the following:","o":["minimal bleeding","diminished postoperative swelling","diminished ultimate scarring","enhanced surgical visualization","modest tip rotation"],"k":"E","x":"No rotation is realized by dissection in the favorable tissue planes of the nose.","d":"H&N / Plastics / Trauma","src":"Ballenger · Nasal Reconstruction and Rhinoplasty · Q8"},{"s":"A 14-year-old boy presents with a unilateral nasal mass. A coronal short TI inversion recovery (STIR) image from the magnetic resonance imaging (MRI) is shown. The lesion fills the nasal cavity and involves the pterygopalatine fossa. What is the most appropriate management plan?","o":["Observe with serial MRI scans","Arrange external beam radiotherapy","Perform a biopsy to confirm the diagnosis","Arrange for surgery to be performed","Arrange arterial embolization"],"k":"D","x":"This is likely to represent a juvenile nasopharyngeal angiofibroma. These are highly vascular benign tumours and therefore a biopsy is not appropriate. Surgery is the treatment of choice and\nradiotherapy is generally only used for very extensive lesions that cannot be removed surgically or for recurrent disease. Embolization of the sphenopalatine artery may be appropriate.","d":"Rhinology","src":"SBA book · Rhinology · Q9","i":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAKhA+gBAREA/8QAHAABAAMBAQEBAQAAAAAAAAAAAAMEBQIBBgcI/8QARhAAAgIBAwIEAgYJAgUDAwQDAAECAxEEEiEFMRMiQVEGYTJxdIGx0QcUFiM1NlWUskKRFSQzUqFicsFDY3M0gpKTU1SE/9oACAEBAAA/APznrfX+sw611CEOr9QjGOqsSitVNJLc/mUv2h63/Weo/wB1P8x+0PW/6z1H+6n+Y/aHrf8AWeo/3U/zH7Q9b/rPUf7qf5j9oet/1nqP91P8x+0PW/6z1H+6n+Y/aHrf9Z6j/dWfmP2h63/Weo/3U/zH7Q9b/rPUf7qf5j9oet/1nqP91P8AMftD1v8ArPUf7qf5j9oet/1nqP8AdT/MftD1v+s9R/up/mP2h63/AFnqP91P8x+0PW/6z1H+6n+Y/aHrf9Z6j/dT/MftD1v+s9R/urPzH7Q9b/rPUf7qf5j9oet/1nqP91P8x+0PW/6z1H+6n+Y/aHrf9Z6j/dT/ADH7Q9b/AKz1H+6n+Y/aHrf9Z6j/AHU/zH7Q9b/rPUf7qf5j9oet/wBZ6j/dT/MftD1v+s9R/up/mP2h63/Weo/3U/zH7Q9b/rPUf7qf5j9oet/1nqP91P8AMftD1v8ArPUf7qf5j9oet/1nqP8AdT/MftD1v+s9R/up/mP2h63/AFnqP91P8x+0PW/6z1H+6n+Y/aHrf9Z6j/dT/MftD1v+s9R/up/mP2h63/Weo/3U/wAzQ6d1rrUvNPrHUGvnqZv/AOT6HTdZ6nKtv/iesf16if5mfqviTqcJSS6nrs/aJ/mZd3xL1iUuOq6+P/8A0z/M6q611qfmXWNfj56qf5nNnXeuW6iEIdV6h3xxqp/mfpfwVd1ZUKWq1ursTfed0n+LPsp6y5pJX2r572QarW6jw8R1FufdTZUp1Wr9dXd//Yzues1UXzqrv/7GXdJrbpx51FvH/rZZr1tryvGs+vcyH9Y1M5NRvt4/9bIbNRqpPatRcseu9mT1PWayDShq78r2sf5lOPV9Wo7XqtRn38WR7/xTWSaUNXqHj/7sjQr6rqHFL9auz/8AkZ7Z1O9YX63dn/8AIytZqdfbLy6vURX/AOWX5ljT3a6ON2r1Evrs         show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}
