f sharply, sparing deeper tissue (e.g., spinal cord when boosting posterior neck), and suit IORT.\nA — Less penetrating.\nC — RBE ≈ 1, same as photons.\nExam tip: Electrons are used for posterior neck boosts off the cord and for superficial skin cancers.\nCh 4 · Radiotherapy (also Shamsan Q7) · Cummings 7th", "b": "Shamsan Q7", "n": 7}, {"s": "Radiation is delivered in many fractions because:", "o": ["Better cost:benefit for the oncologist", "Differences in survival-curve shoulders between tumor and late-responding tissue reduce late toxicity", "Acute toxicity per treatment is lower", "Shorter treatments reduce machine wear", "B and C"], "k": "E", "x": "Late-responding tissue (low α/β ≈ 3) repairs sublethal damage better between small fractions than tumor (α/β ≈ 10).\nA — Not a rationale.\nD — Not a rationale.\nExam tip: Know α/β: tumor/acute ≈ 10 Gy; late tissues ≈ 3 Gy.\nCh 4 · Radiotherapy (also Shamsan Q8) · Cummings 7th", "b": "Shamsan Q8", "n": 8}, {"s": "Regarding hyperfractionation in H&N cancer, which are true?", "o": ["It allows a higher total tumor dose for the same 'acceptable' late effect", "An EORTC trial to 80.5 Gy improved local control", "Interval between daily fractions can be cut to 2 hours", "The linear–quadratic model justifies it", "A, B and D"], "k": "E", "x": "EORTC 22791 (1.15 Gy bid to 80.5 Gy) improved locoregional control in oropharyngeal cancer; the LQ model supports small-fraction sparing of late tissues.\nC — Minimum interval is 6 hours for sublethal damage repair.\nExam tip: MARCH meta-analysis: hyperfractionation gives the largest survival gain among altered fractionation schemes; concurrent chemoRT remains standard.\nCh 4 · Radiotherapy (also Shamsan Q9) · Cummings 7th, NCCN H&N", "b": "Shamsan Q9", "n": 9}, {"s": "Regarding fast-neutron therapy, which are true?", "o": ["It works well for SCC because it kills hypoxic cells", "A randomized salivary gland trial favored neutrons for local control", "Neutrons differ radiobiologically from X-rays", "Neutrons cause fewer side effects", "B and C"], "k": "E", "x": "High-LET neutrons have higher RBE and less oxygen dependence; the RTOG/MRC trial in unresectable salivary tumors showed better local control.\nA — No benefit shown in SCC.\nD — More late toxicity.\nExam tip: Neutrons are now largely replaced by carbon-ion/proton therapy for adenoid cystic carcinoma.\nCh 4 · Radiotherapy (also Shamsan Q10) · Cummings 7th", "b": "Shamsan Q10", "n": 10}, {"s": "Regarding chemotherapy in H&N cancer, which are true?", "o": ["It may potentiate RT and independently kill micrometastases", "Strong evidence supports routine chemotherapy for all H&N SCC", "The VA Larynx study showed chemo response predicts success of non-surgical treatment", "Intergroup NPC data showed no benefit of chemoRT over RT for stage III", "A and C"], "k": "E", "x": "VA Larynx: patients responding to induction cisplatin/5-FU went on to RT with larynx preservation in ~64%.\nB — Not routine for early-stage disease.\nD — False: Intergroup 0099 (Al-Sarraf) showed a clear survival benefit for chemoRT in NPC.\nExam tip: Intergroup 0099 established concurrent cisplatin-RT as standard for locoregionally advanced NPC.\nCh 4 · Radiotherapy (also Shamsan Q11) · Cummings 7th, NCCN H&N", "b": "Shamsan Q11", "n": 11}, {"s": "The commonest manifestation of vestibular dysfunction in the elderly is:", "o": ["Loss of balance", "Oscillopsia", "BPPV", "Ménière's disease", "Labyrinthine fistula"], "k": "A", "x": "Presbystasis presents as disequilibrium and unsteadiness rather than true vertigo.\nB — Seen in bilateral loss.\nC — Common cause, but the manifestation is imbalance.\nD — Peaks in middle age.\nE — Rare.\nCh 15 · Geriatrics (also Shamsan Q12) · Cummings 7th, Scott-Brown 8th", "b": "Shamsan Q12", "n": 12}, {"s": "The most significant complication of presbystasis is:", "o": ["Car accidents", "Hip fracture", "Depression", "Impaired daily activity", "BPPV"], "k": "B", "x": "Falls causing hip fracture are the o c-ANCA for diagnosis"], "k": "D", "x": "c-ANCA/PR3 is the characteristic antibody; p-ANCA/MPO suggests microscopic polyangiitis or EGPA.\nA — True: sensitivity is only ~60% in limited (head and neck) disease.\nB — True.\nC — True.\nExam tip: Limited sinonasal GPA is often ANCA-negative: biopsy plus clinical criteria still diagnose it.\nCh 44 · Systemic disease of the nose (also Shamsan Q17) · Scott-Brown 8th, Cummings 7th", "b": "Shamsan Q17", "n": 17}, {"s": "Large dry septal perforation, no ulceration, non-specific histology, negative c-ANCA. Most likely cause:", "o": ["GPA", "T-cell lymphoma", "Sarcoidosis", "Tuberculosis", "Substance abuse (cocaine)"], "k": "E", "x": "Cocaine causes ischemic perforation with non-specific histology.\nA — ANCA usually positive with granulomas/vasculitis.\nB — Progressive destructive ulceration.\nC — Granulomas on biopsy.\nD — Caseating granulomas.\nExam tip: Levamisole-adulterated cocaine can produce positive ANCA (often dual PR3/MPO) and mimic GPA.\nCh 44 · Systemic disease of the nose (also Shamsan Q18) · Scott-Brown 8th", "b": "Shamsan Q18", "n": 18}, {"s": "Which finding does NOT point to sarcoidosis?", "o": ["Hypocalcemia", "Hypercalciuria", "High BAL T-lymphocytes (CD4)", "Raised ACE", "Raised soluble IL-2R"], "k": "A", "x": "Granulomas produce calcitriol, causing HYPERcalcemia.\nB — Typical.\nC — Typical (CD4:CD8 >3.5).\nD — Typical.\nE — Typical.\nCh 44 · Systemic disease of the nose (also Shamsan Q19) · Scott-Brown 8th", "b": "Shamsan Q19", "n": 19}, {"s": "Atypical mycobacterial infection: which is FALSE?", "o": ["PPD often negative", "Classically presents as cervical adenopathy", "Organisms can always be cultured from biopsy", "Auramine–rhodamine is a useful first stain", "Nasal involvement features anterior septal perforation"], "k": "C", "x": "Culture is frequently negative; PCR helps.\nA — True (often weak/negative).\nB — True, especially children.\nD — True.\nE — True per book.\nCh 44 · Systemic disease of the nose (also Shamsan Q20) · Scott-Brown 8th", "b": "Shamsan Q20", "n": 20}]}, {"t": "Q21–40 · Systemic disease of the nose, Epistaxis, Allergic rhinitis, Non-allergic rhinitis…", "q": [{"s": "20-year-old, progressive unilateral nasal destruction into maxillary sinus and early oral cavity. ANCA negative; biopsy angiocentric and angioinvasive. Diagnosis:", "o": ["GPA", "Sarcoidosis", "T-cell lymphoma", "Atypical mycobacteria", "Histiocytosis X"], "k": "C", "x": "Angiocentric, angiodestructive midline lesion = extranodal NK/T-cell lymphoma, nasal type (formerly 'lethal midline granuloma').\nA — ANCA usually positive, granulomas.\nB — Non-destructive.\nD — Not angiocentric.\nE — Langerhans cells, CD1a.\nExam tip: Extranodal NK/T-cell lymphoma: EBV-positive (EBER ISH), CD56+; treat with chemoradiation (asparaginase-based regimens).\nCh 44 · Systemic disease of the nose (also Shamsan Q21) · Scott-Brown 8th, Cummings 7th", "b": "Shamsan Q21", "n": 1}, {"s": "Relative to a septal spur, the bleeding point is most often:", "o": ["Lateral", "Anterior", "Posterior", "Superior"], "k": "B", "x": "Airflow turbulence dries the mucosa just anterior to the spur.\nA — No.\nC — Downstream is protected.\nD — No.\nCh 45 · Epistaxis (also Shamsan Q22) · Cummings 7th", "b": "Shamsan Q22", "n": 2}, {"s": "Which is NOT a feature of juvenile angiofibroma?", "o": ["Benign", "Non-invasive", "Adolescent males", "Obstruction and epistaxis", "~0.5% of H&N neoplasms"], "k": "B", "x": "JNA is histologically benign but locally aggressive, eroding skull base and orbit.\nA — True.\nC — True.\nD — Classic.\nE — Book figure (often quoted 0.05–0.5%).\nCh 45 · Epistaxis (also Shamsan Q23) · Scott-Brown 8th, Cummings 7th", "b": "Shamsan Q23", "n": 3}, {"s": "Which nasal artery arises from the internal carotid system?", "o": ["Infraorbital", "Sphenopalatine", "Pharyngeal", "Ophthalmic (→ anterior/posterior ethmoidal)", "Vidian (pterygoid canal) from maxillary"], "k": "D", "x": "Only the ophthalmic artery (and its   if(q.m){const p=S.multiPick[k]||new Set();p.has(l)?p.delete(l):p.add(l);S.multiPick[k]=p;const y=scrollY;show();scrollTo(0,y);return}
  S.ans[k]={pick:[l],ok:l==q.k};const y=scrollY;show();scrollTo(0,y)}
function check(){const [c,n]=S.list[S.pos];const q=DATA[c].q[n-1];const k=id(c,n);const p=[...S.multiPick[k]].sort().join('');
  S.ans[k]={pick:p.split(''),ok:p==q.k};const y=scrollY;show();scrollTo(0,y)}
function go(d){S.pos=Math.max(0,Math.min(S.list.length-1,S.pos+d));show()}
function grid(){const d=$('#dlg');
  d.innerHTML=`<b>Jump to question</b><div class="grid">${S.list.map(([c,n],i)=>{const a=S.ans[id(c,n)];return `<button class="${a?(a.ok?'g-ok':'g-bad'):''} ${i==S.pos?'g-cur':''}" onclick="S.pos=${i};$('#dlg').close();show()">${i+1}</button>`}).join('')}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="$('#dlg').close()">Close</button>`;
  d.showModal()}
function zoom(s){const z=$('#zoom');z.querySelector('img').src=s;z.style.display='flex'}
function results(){
  document.querySelector('.nav')?.remove();
  let rows='',ta=0,tr=0,wrong=[];
  DATA.forEach((c,ci)=>{let a=0,r=0;c.q.forEach(q=>{const x=S.ans[id(ci,q.n)];if(x){a++;if(x.ok)r++;else wrong.push([ci,q.n])}});
    ta+=a;tr+=r;if(a)rows+=`<tr><td>${c.t}</td><td>${r}/${a} · ${Math.round(r/a*100)}%</td></tr>`});
  $('#app').innerHTML=`<h1>Results</h1><div class="big">${ta?Math.round(tr/ta*100):0}%</div><p class="sub">${tr} correct of ${ta} answered</p>
  <table>${rows||'<tr><td>No answers yet</td><td></td></tr>'}</table>
  ${wrong.length?`<button class="primary" onclick="redo()">Retry ${wrong.length} incorrect</button>`:''}
  <div class="row"><button class="ghost" style="flex:1" onclick="home()">Back to chapters</button></div>`;
  S.wrong=wrong;scrollTo(0,0)}
function redo(){S.wrong.forEach(([c,n])=>{delete S.ans[id(c,n)];delete S.multiPick[id(c,n)]});start(S.wrong.slice())}
document.addEventListener('keydown',e=>{if($('#dlg').open||!document.querySelector('.nav'))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if('abcdefgh'.includes(e.key.toLowerCase())&&e.key.length==1)choose(e.key.toUpperCase())});
home();
</script><script id="entPersist">
(function(){
if(typeof S==='undefined')return;
var F=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'');
var KEY='entq:'+F, MK=KEY+':meta', HK=KEY+':hist';
var MOCK=typeof startScreen==='function'&&typeof Q!=='undefined';
var views=MOCK?['startScreen','show','results','rshow']:['home','show','results','notes'];
var restoring=false, stop=false, timer=null;
function ls(){try{return window['local'+'Storage']}catch(e){return null}}
var store=ls();
views.forEach(function(n){var f=window[n];if(typeof f!=='function')return;
  window[n]=function(){S.__view=n;S.__arg=(n==='notes')?arguments[0]:null;var r=f.apply(this,arguments);if(!restoring)queue();return r}});
if(MOCK&&typeof begin==='function'){var b0=begin;window.begin=function(){S.__rec=false;var r=b0.apply(this,arguments);queue();return r}}

function snapshot(){
  var extra={};
  if(MOCK&&S.phase==='run'){extra.__elapsed=Date.now()-S.start;if(S.mode==='exam')extra.__remain=S.end-Date.now()}
  var o=Object.assign({},S,extra);
  return JSON.stringify(o,function(k,v){if(k==='tick')return undefined;if(v instanceof Set)return {__set:Array.from(v)};return v});
}
function meta(){
  var total=0,ans=0,ok=0,k;
  if(MOCK){total=Q.length;for(k in S.ans){ans++;if(Q[k]&&S.ans[k]==Q[k].k)ok++}}
  else{total=DATA.reduce(function(t,c){return t+c.q.length},0);for(k in S.ans){ans++;if(S.ans[k]&&S.ans[k].ok)ok++}}
  return {kind:MOCK?'mock':'bank',total:total,ans:ans,ok:ok,phase:MOCK?S.phase:(ans?'run':'start'),mode:S.mode||'',ts:Date.now()};
}
function save(){
  if(stop||!store)return;
  try{
    var m=meta();
    if(MOCK&&S.phase==='done'&&!S.__rec){
      S.__rec=true;
      var h={};try{h=JSON.parse(store.getItem(HK)||'{}')}catch(e){}
      h.attempts=(h.attempts||0)+1;h.last={ok:m.ok,total:m.total,ts:m.ts};
      if(!h.best||m.ok>h.best.ok)h.best={ok:m.ok,total:m.total,ts:m.ts};
      store.setItem(HK,JSON.stringify(h));
    }
    store.setItem(KEY,snapshot());store.setItem(MK,JSON.stringify(m));
    flash();
  }catch(e){}
}
function queue(){clearTimeout(timer);timer=setTimeout(save,250)}
document.addEventListener('click',queue,true);
document.addEventListener('keydown',queue,true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
setInterval(function(){if(MOCK&&S.phase==='run')save()},15000);

function startTick(){clearInterval(S.tick);S.tick=setInterval(function(){var r=S.end-Date.now();var t=document.querySelector('#tm');if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000)}if(r<=0){clearInterval(S.tick);submit(true)}},1000)}

function restore(){
  if(!store)return;
  var raw=store.getItem(KEY);if(!raw)return;
  var o;try{o=JSON.parse(raw,function(k,v){return v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v})}catch(e){return}
  var el=o.__elapsed,rem=o.__remain;delete o.__elapsed;delete o.__remain;delete o.tick;
  restoring=true;
  try{
    Object.assign(S,o);S.tick=null;
    if(MOCK){
      if(S.phase==='run'){var now=Date.now();S.start=now-(el||0);
        if(S.mode==='exam'){S.end=now+Math.max(1000,rem||0);startTick()}
        show();note(S.mode==='exam'?'Resumed — the timer was paused while you were away':'Resumed where you left off');}
      else if(S.phase==='done'){if(S.__view==='rshow'&&S.list&&S.list.length)rshow();else results()}
      else startScreen();
    }else{
      var v=S.__view;
      if(v==='show'&&S.list&&S.list.length){S.pos=Math.min(S.pos||0,S.list.length-1);show();note('Resumed where you left off')}
      else if(v==='results')results();
      else if(v==='notes'&&typeof notes==='function'&&S.__arg!=null)notes(S.__arg);
      else home();
    }
  }catch(e){try{(MOCK?startScreen:home)()}catch(_){}}
  restoring=false;
}

/* ---------- menu ---------- */
var css=document.createElement('style');
css.textContent='#entTab{position:fixed;right:0;top:46%;z-index:2147483646;width:30px;height:46px;border:0;border-radius:12px 0 0 12px;background:rgba(20,36,43,.62);color:#fff;font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;padding:0}'+
'#entTab .dot{position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#5BC48A;opacity:0;transition:opacity .3s}#entTab.saved .dot{opacity:1}'+
'#entMenu{position:fixed;right:38px;top:calc(46% - 40px);z-index:2147483647;background:#fff;color:#14242B;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;min-width:210px;display:none;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
'#entMenu.open{display:block}#entMenu a,#entMenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;border-radius:9px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}#entMenu a:active,#entMenu button:active{background:#DDEEEE}#entMenu .st{font-size:12px;color:#5B6A71;padding:6px 12px 4px}#entMenu .rs{color:#A8261F}'+
'@media (prefers-color-scheme:dark){#entMenu{background:#16252B;color:#E4ECEE}#entMenu .st{color:#93A4AA}#entMenu .rs{color:#F08B83}#entMenu a:active,#entMenu button:active{background:#183A3D}}'+
'#entNote{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:2147483647;background:#14242B;color:#fff;padding:9px 14px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}#entNote.show{opacity:1}';
document.head.appendChild(css);
var tab=document.createElement('button');tab.id='entTab';tab.setAttribute('aria-label','Exam menu');tab.innerHTML='<i class="dot"></i>⋮';
var menu=document.createElement('div');menu.id='entMenu';
menu.innerHTML='<div class="st" id="entSt">Progress saves automatically</div><a href="./">⌂ &nbsp;Back to library</a><button class="rs" id="entReset">↺ &nbsp;Start this exam again</button>';
var nt=document.createElement('div');nt.id='entNote';
document.body.appendChild(tab);document.body.appendChild(menu);document.body.appendChild(nt);
tab.addEventListener('click',function(e){e.stopPropagation();updSt();menu.classList.toggle('open')});
document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target!==tab)menu.classList.remove('open')});
menu.querySelector('a').addEventListener('click',function(){save()});
document.getElementById('entReset').addEventListener('click',function(){
  var msg=MOCK?'Start this paper again from the beginning?\n\nYour current answers will be cleared. Your past scores stay in the library.':'Clear all your answers in this bank and start fresh?';
  if(!confirm(msg))return;
  stop=true;try{store.removeItem(KEY);store.removeItem(MK)}catch(e){}
  location.reload();
});
function updSt(){var m=meta();document.getElementById('entSt').textContent=m.ans?('Saved · '+m.ans+' of '+m.total+' answered'):'Progress saves automatically'}
var ft=null;function flash(){tab.classList.add('saved');clearTimeout(ft);ft=setTimeout(function(){tab.classList.remove('saved')},1200)}
var ntT=null;function note(t){nt.textContent=t;nt.classList.add('show');clearTimeout(ntT);ntT=setTimeout(function(){nt.classList.remove('show')},2600)}

restore();
})();
</script>
